<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜修 · Rainy Study</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#141018;overflow:hidden;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #lyr{position:absolute;left:0;right:0;bottom:0;height:42%;
       display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
       padding:0 5.5vw calc(6.4vh + env(safe-area-inset-bottom,0px));
       box-sizing:border-box;pointer-events:none;text-align:center;}
  #lmain{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
         font-weight:500;font-size:clamp(21px,3.9vw,58px);line-height:1.46;letter-spacing:.02em;
         color:#ffeed3;text-align:center;max-width:100%;
         text-shadow:0 2px 18px rgba(28,10,2,.85),0 0 46px rgba(255,150,70,.20);
         opacity:0;transform:translateY(9px);transition:opacity .42s ease,transform .5s ease;
         word-break:break-word;overflow-wrap:anywhere;}
  #lmain.on{opacity:1;transform:translateY(0);}
  #lmain .ch{color:rgba(226,196,168,.42);transition:color .28s ease,text-shadow .28s ease;
             display:inline-block;white-space:pre;}
  #lmain .ch.lit{color:#fff2da;text-shadow:0 0 24px rgba(255,182,104,.55);}
  #lnext{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
         font-size:clamp(12px,1.55vw,20px);line-height:1.5;margin-top:1.05em;
         color:rgba(214,186,160,.40);letter-spacing:.04em;max-width:86%;
         opacity:0;transition:opacity .4s ease;word-break:break-word;overflow-wrap:anywhere;}
  #lnext.on{opacity:1;}
  #empty{position:absolute;left:0;right:0;bottom:0;height:40%;display:none;
         flex-direction:column;align-items:center;justify-content:flex-end;
         padding:0 8vw calc(9vh + env(safe-area-inset-bottom,0px));box-sizing:border-box;
         pointer-events:none;text-align:center;}
  #empty.on{display:flex;}
  #etitle{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(17px,2.3vw,30px);
          color:#f2dcc0;letter-spacing:.06em;opacity:.9;}
  #esub{margin-top:.85em;font-size:clamp(10px,1.15vw,14px);letter-spacing:.30em;
        color:rgba(214,180,150,.45);font-family:ui-monospace,monospace;}
  #tag{position:absolute;left:2.2vw;bottom:5.4vh;font-family:ui-monospace,monospace;
       font-size:clamp(8px,.85vw,11px);letter-spacing:.42em;
       color:rgba(255,214,170,.30);pointer-events:none;
       writing-mode:vertical-rl;text-orientation:mixed;transition:opacity .4s;}
  #tag .dot{display:inline-block;width:.40em;height:.40em;border-radius:50%;
            background:#ffb066;margin-bottom:.9em;opacity:.75;
            box-shadow:0 0 12px rgba(255,176,102,.9);}
  #pol{position:absolute;display:none;padding:.55em .55em 1.75em;background:#efe3cd;
       box-shadow:0 10px 26px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.5) inset;
       transform:rotate(-3.2deg);transform-origin:50% 0;pointer-events:none;}
  #pol.on{display:block;}
  #pol img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.86) contrast(1.04);}
  #pol:after{content:"";position:absolute;left:50%;top:-.55em;transform:translateX(-50%) rotate(1.5deg);
             width:3.6em;height:1.05em;background:rgba(255,238,200,.42);
             box-shadow:0 1px 3px rgba(0,0,0,.25);}
  @media (max-aspect-ratio: 0.75/1){ #pol{display:none !important;} }
  @media (min-aspect-ratio: 1.12/1){
    #lyr{padding-left:5vw;padding-right:36vw;padding-bottom:calc(6vh + env(safe-area-inset-bottom,0px));}
  }
  @media (max-aspect-ratio: 0.75/1){
    #lyr{height:40%;}
    #lmain{font-size:clamp(19px,5.6vw,34px);}
    #tag{display:none;}
  }
  @media (max-width: 620px){
    #tag{display:none;}
    #lnext{font-size:clamp(10px,3vw,14px);}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bg"></canvas>
  <div id="tag"><span class="dot"></span><span id="tagtxt">LO-FI / RAIN</span></div>
  <div id="lyr">
    <div id="lmain"></div>
    <div id="lnext"></div>
  </div>
  <div id="pol"><img id="polimg" alt="" referrerpolicy="no-referrer"></div>
  <div id="empty">
    <div id="etitle">—</div>
    <div id="esub">INSTRUMENTAL</div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var W=1440,H=900;
  var cv=document.getElementById('bg');
  var ctx=cv.getContext('2d');
  var lt=document.getElementById('lmain');
  var ln=document.getElementById('lnext');
  var ly=document.getElementById('lyr');
  var emp=document.getElementById('empty');
  var eti=document.getElementById('etitle');
  var tagt=document.getElementById('tagtxt');
  var pol=document.getElementById('pol');
  var polimg=document.getElementById('polimg');
  var polURL='';
  var S={lines:[],idx:-1,t:0,playing:true,acc:[214,150,104],cover:'',name:'',artist:'',initSeen:false};
  var DY={rain:[],motes:[],lights:[],diag:0,phase:0,lvl:0,bass:0,tre:0,beatP:0,flash:0};
  var L={}, DPR=1;
  var dirty=true;
  var frames=0,jsMs=0,err='',readySent=false,rm=false;
  try{ rm=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ console.error(e); }

  /* 自检口：必须在脚本最外层无条件赋值，且早于任何可能抛错的初始化 */
  window.__stage=function(){
    var i=-1,t=S.t;
    try{
      for(var k=0;k<S.lines.length;k++){ if(S.lines[k].t<=t+0.02) i=k; else break; }
      return {lines:S.lines.length,idx:i,t:t,playing:S.playing,frames:frames,js:jsMs,err:err,
              text:(i>=0&&S.lines[i].text!=null?String(S.lines[i].text):''),gl:false,rm:rm};
    }catch(e){
      console.error('[426] stage',e);
      return {lines:0,idx:-1,t:t,playing:true,frames:frames,js:jsMs,err:String(e&&e.message||e),
              text:'',gl:false,rm:rm};
    }
  };

  function resize(){
    var w=window.innerWidth||0,h=window.innerHeight||0;
    if(!w||!isFinite(w)||w<2) w=1440;
    if(!h||!isFinite(h)||h<2) h=900;
    W=w;H=h;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.max(2,Math.round(W*dpr));
    cv.height=Math.max(2,Math.round(H*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cv.style.width='100%'; cv.style.height='100%';
    layout();
    dirty=true;
    try{ placePolaroid(); }catch(e){ console.error(e); }
    try{ buildParticles(); }catch(e){ console.error('[426] particles',e); }
    try{ if(lt) lt.style.fontSize=''; }catch(e){ console.error(e); }
  }
  window.addEventListener('resize',resize);
  resize();

  // ---- ready：首帧无条件发送，绝不在 init 里报 ----
  function sendReady(){
    if(readySent) return;
    readySent=true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){ console.error(e); }
  }
  var readyTimer=setTimeout(sendReady,600);

  function normLines(raw){
    var out=[],i,a=Array.isArray(raw)?raw:[];
    for(i=0;i<a.length;i++){
      var o=a[i]||{}, tx=(o.text==null?'':String(o.text));
      out.push({t:isFinite(o.t)?+o.t:0,dur:isFinite(o.dur)?+o.dur:0,text:tx,chars:Array.isArray(o.chars)?o.chars:null});
    }
    return out;
  }

  function findIdx(t){
    var i=-1;
    for(var k=0;k<S.lines.length;k++){ if(S.lines[k].t<=t+0.02) i=k; else break; }
    return i;
  }

  /* ============================================================
     调色 / 布局
     ============================================================ */
  function mixc(a,b,k){return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];}
  function rgb(a,al){return 'rgba('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+','+(al==null?1:al)+')';}
  function layout(){
    var wide = W/H >= 1.12;
    L.wide=wide;
    if(wide){
      L.win={x:W*0.035,y:H*0.042,w:W*0.442,h:H*0.500};
      L.deskY=H*0.610;
      L.head={x:W*0.700,y:H*0.290,r:Math.min(H*0.100,W*0.048)};
      L.cat={x:W*0.545,y:L.deskY};
      L.lampX=W*0.900; L.lampY=H*0.430;
      L.book={x:W*0.660,y:L.deskY};
      L.mug={x:W*0.800,y:L.deskY};
      L.bandTop=L.deskY;                 // 歌词所在的前景带
    } else {
      L.win={x:W*0.060,y:H*0.036,w:W*0.880,h:H*0.300};
      L.deskY=H*0.605;
      L.head={x:W*0.505,y:H*0.462,r:Math.min(H*0.078,W*0.112)};
      L.cat={x:W*0.250,y:L.deskY};
      L.lampX=W*0.885; L.lampY=H*0.447;
      L.book={x:W*0.420,y:L.deskY};
      L.mug={x:W*0.760,y:L.deskY};
      L.bandTop=L.deskY;
    }
    L.horizon=L.win.y+L.win.h*0.70;
  }

  /* ============================================================
     静态底：墙 / 窗 / 城市 / 窗帘 / 桌 / 台灯 / 少女 / 猫
     预烘到离屏 canvas，逐帧只 drawImage
     ============================================================ */
  var cache=document.createElement('canvas');
  var g2=cache.getContext('2d');

  function drawWall(g){
    var top=mixc([38,28,44],S.acc,0.10), bot=[12,9,16];
    var gr=g.createLinearGradient(0,0,0,L.deskY);
    gr.addColorStop(0,rgb(top)); gr.addColorStop(0.55,rgb(mixc(top,bot,0.55))); gr.addColorStop(1,rgb(bot));
    g.fillStyle=gr; g.fillRect(0,0,W,L.deskY+2);
    // 墙上暖光晕（台灯把墙照出一块）
    var lx=L.lampX, ly=L.lampY-30;
    var rg=g.createRadialGradient(lx,ly,10,lx,ly,Math.max(W,H)*0.42);
    rg.addColorStop(0,'rgba(255,178,104,0.34)');
    rg.addColorStop(0.35,'rgba(240,140,80,0.13)');
    rg.addColorStop(1,'rgba(140,70,40,0)');
    g.fillStyle=rg; g.fillRect(0,0,W,L.deskY+2);
    // 左侧窗光冷晕
    var wx=L.win.x+L.win.w*0.5;
    var cg=g.createRadialGradient(wx,L.win.y+L.win.h*0.55,20,wx,L.win.y+L.win.h*0.55,L.win.w*0.95);
    cg.addColorStop(0,'rgba(120,190,215,0.16)');
    cg.addColorStop(1,'rgba(90,150,190,0)');
    g.fillStyle=cg; g.fillRect(0,0,W,L.deskY+2);
  }

  function drawWindow(g){
    var w=L.win;
    g.save();
    // 窗框阴影
    g.fillStyle='rgba(0,0,0,0.55)';
    roundRect(g,w.x-14,w.y-14,w.w+28,w.h+28,10); g.fill();
    // 玻璃：夜空
    g.save();
    roundRect(g,w.x,w.y,w.w,w.h,4); g.clip();
    var sky=g.createLinearGradient(0,w.y,0,w.y+w.h);
    sky.addColorStop(0,'#101c26');
    sky.addColorStop(0.42,'#1c3441');
    sky.addColorStop(0.72,rgb(mixc([64,88,96],S.acc,0.16)));
    sky.addColorStop(1,'#3a4d4f');
    g.fillStyle=sky; g.fillRect(w.x,w.y,w.w,w.h);
    // 远处楼群
    var baseY=w.y+w.h*0.90, i, bx, bw, bh, seedR=1;
    g.fillStyle='rgba(12,20,26,0.86)';
    for(i=0;i<14;i++){
      seedR=(seedR*9301+49297)%233280;
      var rr=seedR/233280;
      bw=w.w*(0.055+rr*0.075);
      bx=w.x+ (i/14)*w.w + rr*w.w*0.02;
      bh=w.h*(0.10+rr*0.20);
      g.fillRect(bx,baseY-bh,bw,bh+8);
    }
    // 地平线暖雾
    var hz=g.createLinearGradient(0,baseY-w.h*0.30,0,baseY);
    hz.addColorStop(0,'rgba(255,150,90,0)');
    hz.addColorStop(1,'rgba(255,140,80,0.20)');
    g.fillStyle=hz; g.fillRect(w.x,baseY-w.h*0.30,w.w,w.h*0.30);
    // 玻璃反光斜带
    var gl=g.createLinearGradient(w.x,w.y,w.x+w.w*0.7,w.y+w.h);
    gl.addColorStop(0,'rgba(190,230,245,0.09)');
    gl.addColorStop(0.28,'rgba(190,230,245,0.02)');
    gl.addColorStop(0.6,'rgba(190,230,245,0.07)');
    gl.addColorStop(1,'rgba(190,230,245,0)');
    g.fillStyle=gl; g.fillRect(w.x,w.y,w.w,w.h);
    // 玻璃冷凝（顶部雾）
    var fg=g.createLinearGradient(0,w.y,0,w.y+w.h*0.35);
    fg.addColorStop(0,'rgba(200,230,240,0.13)');
    fg.addColorStop(1,'rgba(200,230,240,0)');
    g.fillStyle=fg; g.fillRect(w.x,w.y,w.w,w.h*0.35);
    g.restore();
    // 窗棂
    var fw=Math.max(4,Math.min(W,H)*0.010);
    g.fillStyle='#241a20';
    g.fillRect(w.x+w.w*0.54-fw/2,w.y,fw,w.h);
    g.fillRect(w.x,w.y+w.h*0.46-fw/2,w.w,fw);
    g.strokeStyle='#2c2027'; g.lineWidth=fw*1.5;
    g.strokeRect(w.x,w.y,w.w,w.h);
    // 窗台
    g.fillStyle='#2a1d23';
    g.fillRect(w.x-16,w.y+w.h, w.w+32, Math.max(8,H*0.015));
    g.fillStyle='rgba(255,220,180,0.16)';
    g.fillRect(w.x-16,w.y+w.h, w.w+32, 2);
    g.restore();
  }

  function drawCurtain(g){
    var w=L.win, cw=Math.max(26,w.w*0.20), i;
    var col=[46,26,34];
    for(i=0;i<2;i++){
      var x0 = i? (w.x+w.w-cw*0.35) : (w.x-cw*0.55);
      var gr=g.createLinearGradient(x0,0,x0+cw,0);
      gr.addColorStop(0,rgb(mixc(col,[12,8,12],0.55)));
      gr.addColorStop(0.45,rgb(col));
      gr.addColorStop(1,rgb(mixc(col,[12,8,12],0.62)));
      g.fillStyle=gr;
      g.beginPath();
      g.moveTo(x0,w.y-18);
      g.bezierCurveTo(x0+cw*0.9,w.y+w.h*0.30, x0-cw*0.15,w.y+w.h*0.62, x0+cw*0.55,w.y+w.h+0.06*H);
      g.lineTo(x0+cw*1.5, w.y+w.h+0.06*H);
      g.bezierCurveTo(x0+cw*0.8,w.y+w.h*0.6, x0+cw*1.7,w.y+w.h*0.3, x0+cw*1.05,w.y-18);
      g.closePath(); g.fill();
      // 褶
      g.strokeStyle='rgba(0,0,0,0.25)'; g.lineWidth=1.4;
      for(var k=1;k<4;k++){
        g.beginPath();
        g.moveTo(x0+cw*(0.25*k+0.15),w.y-6);
        g.quadraticCurveTo(x0+cw*(0.25*k+0.15)-6,w.y+w.h*0.5, x0+cw*(0.25*k+0.2),w.y+w.h+0.05*H);
        g.stroke();
      }
    }
    // 窗帘杆
    g.strokeStyle='#31242a'; g.lineWidth=Math.max(3,H*0.006);
    g.beginPath(); g.moveTo(w.x-cw*1.0,w.y-20); g.lineTo(w.x+w.w+cw*0.9,w.y-20); g.stroke();
  }

  function drawDesk(g){
    var dy=L.deskY;
    // 桌面
    var tg=g.createLinearGradient(0,dy-4,0,dy+H*0.030);
    tg.addColorStop(0,'#3a282c'); tg.addColorStop(1,'#241a20');
    g.fillStyle=tg; g.fillRect(0,dy-4,W,H*0.034);
    // 桌面前沿
    var fg2=g.createLinearGradient(0,dy+H*0.030,0,H);
    fg2.addColorStop(0,'#241820'); fg2.addColorStop(0.5,'#191118'); fg2.addColorStop(1,'#0e0a10');
    g.fillStyle=fg2; g.fillRect(0,dy+H*0.028,W,H-dy);
    // 木纹
    g.save(); g.globalAlpha=0.16; g.strokeStyle='#5b3f3a'; g.lineWidth=1;
    for(var i=0;i<9;i++){
      var y=dy+H*0.045+i*H*0.052;
      g.beginPath(); g.moveTo(0,y);
      g.bezierCurveTo(W*0.3,y-3, W*0.7,y+4, W,y-1); g.stroke();
    }
    g.restore();
    // 台灯在桌面上的反光
    var rx=L.lampX, ry=dy+H*0.02;
    var rg=g.createRadialGradient(rx,ry,4,rx,ry,W*0.20);
    rg.addColorStop(0,'rgba(255,190,120,0.30)');
    rg.addColorStop(1,'rgba(255,170,90,0)');
    g.fillStyle=rg; g.fillRect(0,dy-H*0.02,W,H*0.20);
  }

  function drawLamp(g){
    var x=L.lampX, y=L.lampY, dy=L.deskY;
    var sw=Math.max(30,W*0.035), sh=Math.max(18,H*0.040);
    // 光锥（往桌面与墙）
    var lg=g.createRadialGradient(x,y+sh,6,x,y+sh,Math.max(W,H)*0.30);
    lg.addColorStop(0,'rgba(255,196,120,0.34)');
    lg.addColorStop(0.4,'rgba(250,160,92,0.10)');
    lg.addColorStop(1,'rgba(200,110,60,0)');
    g.fillStyle=lg; g.fillRect(0,0,W,H);
    // 灯柱
    g.strokeStyle='#3b2a2c'; g.lineWidth=Math.max(3,W*0.006);
    g.beginPath(); g.moveTo(x,dy); g.lineTo(x,y+sh+2); g.stroke();
    // 灯罩
    g.fillStyle='#3d2a2a';
    g.beginPath();
    g.moveTo(x-sw,y+sh); g.lineTo(x-sw*0.55,y); g.lineTo(x+sw*0.55,y); g.lineTo(x+sw,y+sh);
    g.closePath(); g.fill();
    // 灯罩内壁暖光
    var ig=g.createLinearGradient(x,y,x,y+sh);
    ig.addColorStop(0,'rgba(255,210,150,0.85)'); ig.addColorStop(1,'rgba(255,160,90,0.55)');
    g.fillStyle=ig;
    g.beginPath();
    g.moveTo(x-sw*0.86,y+sh-2); g.lineTo(x-sw*0.50,y+3); g.lineTo(x+sw*0.50,y+3); g.lineTo(x+sw*0.86,y+sh-2);
    g.closePath(); g.fill();
    // 灯泡光斑
    g.fillStyle='rgba(255,232,190,0.55)';
    g.beginPath(); g.ellipse(x,y+sh*0.55,sw*0.34,sh*0.30,0,0,6.2832); g.fill();
  }

  function roundRect(g,x,y,w,h,r){
    var rr=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
    g.beginPath();
    g.moveTo(x+rr,y); g.lineTo(x+w-rr,y); g.quadraticCurveTo(x+w,y,x+w,y+rr);
    g.lineTo(x+w,y+h-rr); g.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
    g.lineTo(x+rr,y+h); g.quadraticCurveTo(x,y+h,x,y+h-rr);
    g.lineTo(x,y+rr); g.quadraticCurveTo(x,y,x+rr,y); g.closePath();
  }

  /* ---------- 少女剪影 ---------- */
  function drawGirl(g){
    var h=L.head, cx0=h.x, cy0=h.y, r=h.r, dy=L.deskY;
    var back='#0f0a14';
    // 椅子靠背（她身后）
    g.fillStyle='#160f1a';
    roundRect(g,cx0+r*1.15,cy0+r*0.55,r*0.55,dy-cy0-r*0.55,6); g.fill();
    // 躯干
    g.fillStyle=back;
    g.beginPath();
    g.moveTo(cx0-r*0.62,cy0+r*0.62);
    g.bezierCurveTo(cx0-r*1.30,cy0+r*1.10, cx0-r*1.42,cy0+r*1.75, cx0-r*1.35,dy+4);
    g.lineTo(cx0+r*1.30,dy+4);
    g.bezierCurveTo(cx0+r*1.28,cy0+r*1.55, cx0+r*1.15,cy0+r*0.90, cx0+r*0.62,cy0+r*0.60);
    g.closePath(); g.fill();
    // 脖子
    g.fillRect(cx0-r*0.30,cy0+r*0.55,r*0.60,r*0.45);
    // 头
    g.beginPath(); g.ellipse(cx0,cy0,r*0.94,r*1.02,-0.06,0,6.2832); g.fill();
    // 侧脸（鼻尖小凸起）
    g.beginPath();
    g.moveTo(cx0-r*0.93,cy0-r*0.02);
    g.quadraticCurveTo(cx0-r*1.16,cy0+r*0.16, cx0-r*0.92,cy0+r*0.34);
    g.quadraticCurveTo(cx0-r*1.02,cy0+r*0.40, cx0-r*0.80,cy0+r*0.46);
    g.closePath(); g.fill();
    // 头发（头顶与后脑）
    g.beginPath();
    g.ellipse(cx0+r*0.06,cy0-r*0.30,r*1.02,r*0.86,-0.10,0,6.2832); g.fill();
    g.beginPath();
    g.ellipse(cx0+r*0.80,cy0+r*0.30,r*0.62,r*0.92,0.12,0,6.2832); g.fill();
    // 马尾
    g.beginPath();
    g.moveTo(cx0+r*1.05,cy0+r*0.10);
    g.bezierCurveTo(cx0+r*1.85,cy0+r*0.55, cx0+r*1.72,cy0+r*1.55, cx0+r*1.32,dy-2);
    g.lineTo(cx0+r*1.10,dy-2);
    g.bezierCurveTo(cx0+r*1.34,cy0+r*1.30, cx0+r*1.30,cy0+r*0.55, cx0+r*0.86,cy0+r*0.26);
    g.closePath(); g.fill();
    // 耳机头梁
    g.strokeStyle='#08060b'; g.lineWidth=r*0.19; g.lineCap='round';
    g.beginPath();
    g.ellipse(cx0,cy0-r*0.02,r*1.06,r*1.10,0,Math.PI*0.98,Math.PI*2.10);
    g.stroke();
    // 耳罩
    g.save();
    g.translate(cx0-r*0.70,cy0+r*0.14); g.rotate(-0.14);
    g.fillStyle='#08060b';
    roundRect(g,-r*0.34,-r*0.52,r*0.72,r*1.02,r*0.26); g.fill();
    g.fillStyle='rgba(255,180,120,0.20)';
    roundRect(g,-r*0.24,-r*0.40,r*0.50,r*0.76,r*0.20); g.fill();
    g.restore();
    // 手臂 -> 书
    g.strokeStyle=back; g.lineWidth=r*0.42; g.lineCap='round';
    g.beginPath();
    g.moveTo(cx0-r*0.35,cy0+r*1.15);
    g.quadraticCurveTo(cx0-r*1.25,cy0+r*1.55, L.book.x+r*0.55,dy-r*0.10);
    g.stroke();
    // 轮廓冷光
    var rim=g.createLinearGradient(cx0-r*1.4,0,cx0+r*0.9,0);
    rim.addColorStop(0,'rgba(150,215,238,0.50)');
    rim.addColorStop(0.45,'rgba(150,215,238,0.12)');
    rim.addColorStop(1,'rgba(150,215,238,0)');
    g.save();
    g.strokeStyle=rim; g.lineWidth=Math.max(1.4,r*0.045);
    g.beginPath(); g.ellipse(cx0,cy0,r*0.94,r*1.02,-0.06,0,6.2832); g.stroke();
    g.beginPath();
    g.moveTo(cx0-r*0.62,cy0+r*0.62);
    g.bezierCurveTo(cx0-r*1.30,cy0+r*1.10, cx0-r*1.42,cy0+r*1.75, cx0-r*1.35,dy+4);
    g.stroke();
    g.restore();
    // 台灯侧暖描边
    var wr=g.createLinearGradient(cx0+r*0.4,0,cx0+r*1.5,0);
    wr.addColorStop(0,'rgba(255,180,110,0)');
    wr.addColorStop(1,'rgba(255,175,105,0.42)');
    g.save(); g.strokeStyle=wr; g.lineWidth=Math.max(1.4,r*0.04);
    g.beginPath(); g.ellipse(cx0,cy0,r*0.94,r*1.02,-0.06,0,6.2832); g.stroke();
    g.restore();
  }

  /* ---------- 桌上的小东西 ---------- */
  function drawBook(g){
    var bx=L.book.x, by=L.book.y, w=W*0.115, h=H*0.040;
    g.save();
    g.translate(bx,by);
    g.rotate(-0.05);
    // 书页（暖白）
    var pg=g.createLinearGradient(-w*0.5,-h,-w*0.5,h);
    pg.addColorStop(0,'#f0dbb2'); pg.addColorStop(1,'#c9a97c');
    g.fillStyle=pg;
    g.beginPath();
    g.moveTo(-w*0.55,-h*0.95); g.quadraticCurveTo(0,-h*0.72,w*0.55,-h*0.95);
    g.lineTo(w*0.55,-h*0.30); g.quadraticCurveTo(0,-h*0.05,-w*0.55,-h*0.30);

    g.fillStyle='rgba(80,45,28,0.55)';

  function drawMug(g){
    var x=L.mug.x, y=L.mug.y, w=W*0.026, h=H*0.045;
    var mg=g.createLinearGradient(x-w/2,0,x+w/2,0);
    mg.addColorStop(0,'#d9c3a4'); mg.addColorStop(0.35,'#f2e3c6'); mg.addColorStop(1,'#8d7357');

  function drawCat(g){
    var x=L.cat.x, y=L.cat.y, s=Math.min(W,H)*0.062;
    g.save();
    g.translate(x,y-s*0.30);
    // 身体
    var cg=g.createRadialGradient(-s*0.2,-s*0.7,s*0.1,0,0,s*1.2);
    cg.addColorStop(0,'#c07a41'); cg.addColorStop(0.6,'#8c552c'); cg.addColorStop(1,'#4e2f1c');
    g.fillStyle=cg;
    g.beginPath(); g.ellipse(0,0,s*0.92,s*0.50,0,0,6.2832); g.fill();
    // 头（埋着）
    g.beginPath(); g.ellipse(-s*0.62,-s*0.10,s*0.42,s*0.34,-0.1,0,6.2832); g.fill();
    // 耳朵
    g.beginPath(); g.moveTo(-s*0.88,-s*0.30); g.lineTo(-s*0.80,-s*0.62); g.lineTo(-s*0.62,-s*0.36); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-s*0.52,-s*0.34); g.lineTo(-s*0.42,-s*0.62); g.lineTo(-s*0.30,-s*0.30); g.closePath(); g.fill();
    // 尾巴绕过身体
    g.strokeStyle='#7d4c28'; g.lineWidth=s*0.16; g.lineCap='round';
    g.beginPath();
    g.moveTo(s*0.80,s*0.10);
    g.bezierCurveTo(s*1.15,s*0.34, s*0.35,s*0.46, -s*0.10,s*0.30);
    g.stroke();
    // 背部暖冷双光
    g.strokeStyle='rgba(160,220,240,0.30)'; g.lineWidth=s*0.05;
    g.beginPath(); g.ellipse(0,0,s*0.92,s*0.50,0,Math.PI*1.05,Math.PI*1.85); g.stroke();
    g.strokeStyle='rgba(255,180,110,0.34)'; g.lineWidth=s*0.05;
    g.beginPath(); g.ellipse(0,0,s*0.92,s*0.50,0,-0.5,0.6); g.stroke();
    g.restore();
  }

  function buildScene(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    layout();
    cache.width=Math.max(2,Math.round(W*DPR));
    cache.height=Math.max(2,Math.round(H*DPR));
    g2.setTransform(DPR,0,0,DPR,0,0);
    g2.clearRect(0,0,W,H);
    drawWall(g2);
    drawWindow(g2);
    drawCurtain(g2);
    drawGirl(g2);
    drawDesk(g2);
    drawLamp(g2);
    drawBook(g2);
    drawMug(g2);
    drawCat(g2);
    // 底部压暗，给歌词腾出干净的暗场
    var vg=g2.createLinearGradient(0,L.deskY,0,H);
    vg.addColorStop(0,'rgba(8,5,10,0)');
    vg.addColorStop(0.55,'rgba(8,5,10,0.55)');
    vg.addColorStop(1,'rgba(6,4,8,0.88)');
    g2.fillStyle=vg; g2.fillRect(0,L.deskY,W,H-L.deskY);
    var key=g2.createRadialGradient(W*0.62,L.deskY*0.55,Math.min(W,H)*0.25,W*0.62,L.deskY*0.55,Math.max(W,H)*0.85);
    key.addColorStop(0,'rgba(0,0,0,0)');
    key.addColorStop(1,'rgba(0,0,0,0.55)');
    g2.fillStyle=key; g2.fillRect(0,0,W,H);
    drawGrain(g2);
    dirty=false;
  }

  /* 胶片颗粒：一次性烘进底图，不逐帧开销 */
  var grainPat=null;
  function makeGrain(){
    var c=document.createElement('canvas');
    c.width=96; c.height=96;
    var q=c.getContext('2d');
    var id=q.createImageData(96,96), i, v;
    for(i=0;i<96*96;i++){
      v=110+Math.round(Math.random()*90);
      id.data[i*4]=v; id.data[i*4+1]=Math.round(v*0.92); id.data[i*4+2]=Math.round(v*0.82);
      id.data[i*4+3]=Math.round(Math.random()*46);
    }
    q.putImageData(id,0,0);
    return c;
  }
  function drawGrain(g){
    try{
      if(!grainPat) grainPat=makeGrain();
      g.save();
      g.globalAlpha=0.30;
      g.globalCompositeOperation='overlay';
      var pat=g.createPattern(grainPat,'repeat');
      if(pat){ g.fillStyle=pat; g.fillRect(0,0,W,H); }
      g.restore();
    }catch(e){ console.error('[426] grain',e); }
  }

  function paint(){
    if(dirty) buildScene();
    ctx.drawImage(cache,0,0,W,H);
  }

  /* ============================================================
     动态层：雨 / 玻璃水珠 / 窗外灯火 / 灯罩呼吸 / 光锥浮尘
     ============================================================ */
  var DY={rain:[],motes:[],lights:[],diag:0,phase:0,lvl:0,bass:0,beatP:0,flash:0};
  function rnd(i){ var s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); }

  function buildParticles(){
    var w=L.win,i,n;
    DY.rain.length=0;
    n=Math.round(Math.min(190, Math.max(60, w.w*w.h/9000)));
    n=Math.min(n,190);
    for(i=0;i<n;i++){
      DY.rain.push({x:w.x+rnd(i*3+1)*w.w, y:w.y+rnd(i*3+2)*w.h,
        len:H*(0.012+rnd(i*7)*0.030), sp:H*(0.42+rnd(i*11)*0.75), a:0.10+rnd(i*5)*0.30,
        sk:0.12+rnd(i*13)*0.10});
    }
    DY.motes.length=0;
    n=rm?9:26;
    for(i=0;i<n;i++){
      DY.motes.push({x:L.lampX+(rnd(i*17)-0.5)*W*0.30, y:L.lampY+(rnd(i*19)-0.2)*H*0.22,
        r:0.8+rnd(i*23)*2.2, ph:rnd(i*29)*6.28, sp:0.25+rnd(i*31)*0.7});
    }
    DY.lights.length=0;
    n=rm?16:44;
    for(i=0;i<n;i++){
      DY.lights.push({x:w.x+rnd(i*37)*w.w, y:w.y+w.h*(0.52+rnd(i*41)*0.34),
        r:1.0+rnd(i*43)*2.4, ph:rnd(i*47)*6.28, sp:0.3+rnd(i*53)*1.4, hue:rnd(i*59)});
    }
  }

  function clipGlass(){
    var w=L.win, fw=Math.max(4,Math.min(W,H)*0.010);
    var mx=w.x+w.w*0.54-fw/2, my=w.y+w.h*0.46-fw/2;
    var rgt=w.x+w.w-(mx+fw), btm=w.y+w.h-(my+fw);
    ctx.beginPath();
    ctx.rect(w.x,w.y,mx-w.x,my-w.y);
    ctx.rect(mx+fw,w.y,rgt,my-w.y);
    ctx.rect(w.x,my+fw,mx-w.x,btm);
    ctx.rect(mx+fw,my+fw,rgt,btm);
    ctx.clip();
  }

  function drawDynamic(dt){
    var w=L.win,i,p;
    var lvl=DY.lvl, bass=DY.bass;

    /* --- 玻璃里的雨 --- */
    ctx.save();
    clipGlass();
    ctx.globalCompositeOperation='lighter';
    var segs=[];
    for(i=0;i<DY.rain.length;i++){
      p=DY.rain[i];
      p.y+=p.sp*dt*(1+ (rm?0:lvl*0.7));
      if(p.y>w.y+w.h+20){ p.y=w.y-20-rnd(i*67)*40; p.x=w.x+rnd(i*61+frames*0.37)*w.w; }
      if(p.y<w.y-40){ p.y=w.y-30; }
    }
    // 一次 path 批量画，省开销
    for(var pass=0;pass<2;pass++){
      ctx.beginPath();
      for(i=0;i<DY.rain.length;i++){
        p=DY.rain[i];
        if((i&1)!==pass) continue;
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x-p.len*p.sk, p.y+p.len);
      }
      ctx.strokeStyle = pass? 'rgba(196,226,242,0.22)' : 'rgba(176,214,238,0.34)';
      ctx.lineWidth = pass?1:1.3;
      ctx.stroke();
    }
    // 窗外灯火
    for(i=0;i<DY.lights.length;i++){
      p=DY.lights[i];
      var fl=0.35+0.65*Math.abs(Math.sin(DY.diag*p.sp+p.ph));
      var c = p.hue>0.55 ? [255,196,120] : [150,215,235];
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*(0.8+fl*0.7),0,6.2832);
      ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(0.10+fl*0.22)+')';
      ctx.fill();
    }
    // 顺玻璃滑落的水珠
    ctx.globalCompositeOperation='source-over';
    var nr=rm?3:7;
    for(i=0;i<nr;i++){
      var ph=(DY.diag*0.10+i*0.37)%1;
      var dx=w.x+w.w*(0.10+((i*0.137)%0.80));
      var dyy=w.y+w.h*ph;
      ctx.beginPath();
      ctx.ellipse(dx,dyy,1.6,3.4,0,0,6.2832);
      ctx.fillStyle='rgba(215,240,250,0.16)'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(dx,dyy-14); ctx.lineTo(dx,dyy+2);
      ctx.strokeStyle='rgba(215,240,250,0.05)'; ctx.lineWidth=1.4; ctx.stroke();
    }
    ctx.restore();

    /* --- 台灯呼吸（暖光，限制在灯周围，避免全屏填充） --- */
    var breath=0.82+0.18*Math.sin(DY.diag*1.15)+ (rm?0:lvl*0.22);
    var lx=L.lampX, ly=L.lampY+Math.max(18,H*0.040);
    var br=Math.min(Math.max(W,H)*0.34, W*0.52);
    var bx0=Math.max(0,lx-br), by0=Math.max(0,ly-br);
    var bx1=Math.min(W,lx+br), by1=Math.min(H,ly+br);
    var rg=ctx.createRadialGradient(lx,ly,4,lx,ly,br);
    rg.addColorStop(0,'rgba(255,200,132,'+(0.13*breath).toFixed(3)+')');
    rg.addColorStop(0.45,'rgba(255,160,92,'+(0.045*breath).toFixed(3)+')');
    rg.addColorStop(1,'rgba(255,140,80,0)');
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=rg; ctx.fillRect(bx0,by0,bx1-bx0,by1-by0);

    /* --- 光锥里的浮尘 --- */
    for(i=0;i<DY.motes.length;i++){
      p=DY.motes[i];
      p.y-=p.sp*dt*(1+(rm?0:bass*0.6));
      p.ph+=dt*0.8;
      if(p.y<L.lampY-H*0.10){ p.y=L.deskY-H*0.02; p.x=L.lampX+(rnd(i*71+frames*0.11)-0.5)*W*0.28; }
      var ax=p.x+Math.sin(p.ph)*6;
      ctx.beginPath();
      ctx.arc(ax,p.y,p.r,0,6.2832);
      ctx.fillStyle='rgba(255,214,160,'+(0.10+0.22*Math.abs(Math.sin(p.ph)))+')';
      ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';

    /* --- 书页暖光，随低频亮一下 --- */
    var bglow=0.10+(rm?0:lvl*0.30);
    var bg2=ctx.createRadialGradient(L.book.x,L.book.y-H*0.02,4,L.book.x,L.book.y-H*0.02,W*0.16);
    bg2.addColorStop(0,'rgba(255,226,170,'+bglow.toFixed(3)+')');
    bg2.addColorStop(1,'rgba(255,200,140,0)');
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=bg2; ctx.fillRect(0,0,W,L.deskY+H*0.06);
    ctx.globalCompositeOperation='source-over';
  }

  /* ============================================================
     歌词层：逐字点亮。LRC 无 chars 时按句长均分
     ============================================================ */
  var cur={idx:-2,spans:[],ts:[],n:0,built:-3};
  var MAXCH=160;

  function buildLine(idx){
    var L0=S.lines[idx];
    if(!L0){ lt.textContent=''; lt.className=''; cur.spans=[]; cur.ts=[]; cur.n=0; return; }
    var txt=L0.text==null?'':String(L0.text);
    if(!txt){ lt.textContent=''; lt.className=''; cur.spans=[]; cur.ts=[]; cur.n=0; return; }
    var chars=txt.split('');
    var n=Math.min(chars.length,MAXCH);
    var frag=document.createDocumentFragment();
    var spans=[], ts=[], i;
    var t0=L0.t;
    var dur=(L0.dur&&L0.dur>0)?L0.dur:0;
    if(!dur){
      // 无 dur：用与下一句的间隔估，兜底 4s
      var nx=S.lines[idx+1];
      dur = nx? Math.max(0.6,(nx.t-L0.t)*0.92) : 4.0;
    }
    var src=(L0.chars&&L0.chars.length)?L0.chars:null;
    for(i=0;i<n;i++){
      var sp=document.createElement('span');
      sp.className='ch';
      sp.textContent=chars[i];
      if(chars[i]===' '||chars[i]==='\u00a0'){ sp.style.display='inline'; }
      frag.appendChild(sp);
      spans.push(sp);
      var ct;
      if(src && src.length){
        var c=src[Math.min(i,src.length-1)];
        ct = (c && isFinite(c.t)) ? +c.t : t0 + dur*(i/Math.max(1,n));
      } else {
        ct = t0 + dur*(i/Math.max(1,n));
      }
      ts.push(ct);
    }
    lt.textContent='';
    lt.appendChild(frag);
    cur.spans=spans; cur.ts=ts; cur.n=n;
    // 长句缩字号，防止溢出（按字数与窗口宽做 clamp）
    var base=Math.min(58, Math.max(19, W*0.030));
    if(W/H<1.12) base=Math.min(40, Math.max(18, W*0.058));
    var per=Math.max(1, Math.min(14, Math.floor(W*0.86/base)));
    var lines=Math.ceil(n/Math.max(3,per*0.95));
    var scale=1;
    if(lines>2) scale=Math.max(0.52, 2/lines);
    var px=Math.max(15, base*scale);
    lt.style.fontSize=px.toFixed(1)+'px';
    // 下一句
    var nx2=S.lines[idx+1];
    var ntxt = nx2 && nx2.text ? String(nx2.text) : '';
    if(ntxt.length>60) ntxt=ntxt.slice(0,60)+'…';
    if(ln.textContent!==ntxt) ln.textContent=ntxt;
    ln.className = ntxt?'on':'';
  }

  function litLine(t){
    var i,on=0;
    for(i=0;i<cur.n;i++){
      if(t>=cur.ts[i]-0.02){ on=i+1; } else break;
    }
    for(i=0;i<cur.n;i++){
      var want=i<on;
      var sp=cur.spans[i];
      if(!sp) continue;
      var isOn=sp.className==='ch lit';
      if(want!==isOn) sp.className = want?'ch lit':'ch';
    }
  }

  function showEmpty(){
    var nm=S.name||'未命名';
    if(nm.length>26) nm=nm.slice(0,26)+'…';
    eti.textContent=nm;
    emp.className='on';
    ly.style.opacity='0';
  }
  function hideEmpty(){
    emp.className='';
    ly.style.opacity='1';
  }

  /* ---------- 桌面拍立得（封面，可缺席） ---------- */
  function placePolaroid(){
    if(!pol) return;
    if(!S.cover || !L.wide || W/H<1.12){ pol.className=''; return; }
    var pw=Math.max(48, Math.min(W*0.088, H*0.135));
    var ph=pw*1.02;
    pol.style.width=pw+'px';
    pol.style.height=ph+'px';
    pol.style.right=(W*0.052)+'px';
    pol.style.top=(H*0.062)+'px';
    pol.style.transform='rotate('+(-3.2).toFixed(1)+'deg)';
  }
  function setCover(url){
    if(!pol||!polimg) return;
    var u=url?String(url):'';
    if(!u){ pol.className=''; polURL=''; return; }
    if(u===polURL && pol.className==='on'){ placePolaroid(); return; }
    polURL=u;
    polimg.onerror=function(){ pol.className=''; polURL=''; console.error('[426] cover failed'); };
    polimg.onload=function(){ try{ placePolaroid(); pol.className='on'; }catch(e){ console.error(e); } };
    polimg.src=u;
  }
  var lastIdx=-2, tPrev=0;
  function drawLoop(dt){
    if(dirty) buildScene();
    paint();
    drawDynamic(dt);

    var idx=findIdx(S.t);
    if(!S.initSeen){
      /* 还没收到 init：只放空镜，不编造任何文案 */
    } else if(S.lines.length===0){
      if(emp.className!=='on') showEmpty();
    } else {
      if(emp.className==='on') hideEmpty();
      if(idx!==lastIdx || cur.built!==idx){
        lastIdx=idx; cur.built=idx;
        if(idx<0){ lt.textContent=''; lt.className=''; ln.className=''; ln.textContent=''; cur.spans=[]; cur.n=0; cur.ts=[]; }
        else { buildLine(idx); lt.className = (cur.n>0)?'on':''; }
      }
      if(idx>=0) litLine(S.t);
    }
  }

  function frame(now){
    frames++;
    var t0=performance.now();
    if(frames===1) sendReady();       // 首帧无条件报 ready，先于一切绘制
    try{
      var nw = (typeof now==='number'&&isFinite(now))?now:t0;
      var dt = tPrev? (nw-tPrev)/1000 : 0.016;
      if(!isFinite(dt)||dt<0) dt=0.016;
      if(dt>0.10) dt=0.10;
      tPrev=nw;
      if(!rm) DY.diag+=dt; else DY.diag+=dt*0.25;
      if(DY.beatP>0) DY.beatP=Math.max(0,DY.beatP-dt*2.6);
      drawLoop(dt);
    }catch(e){
      err=String(e&&e.message||e);
      console.error('[426] frame',e);
    }
    jsMs=performance.now()-t0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('message',function(ev){
    var d=ev.data;
    if(!d||d.__c100!==1) return;
    try{
      if(d.type==='init'){
        var p=d.payload||{},sg=p.song||{};
        var art=sg.artists;
        S.name = sg.name?String(sg.name):'';
        S.artist = Array.isArray(art)?art.join(' / '):(art?String(art):'');
        var ac=(Array.isArray(p.accent)&&p.accent.length>=3);
        var a0=ac?+p.accent[0]:0, a1=ac?+p.accent[1]:0, a2=ac?+p.accent[2]:0;
        if(ac && isFinite(a0)&&isFinite(a1)&&isFinite(a2) && (a0+a1+a2)>24){
          S.acc=[Math.max(0,Math.min(255,a0)),Math.max(0,Math.min(255,a1)),Math.max(0,Math.min(255,a2))];
        } else { S.acc=[214,150,104]; }
        S.lines = normLines(p.lines).sort(function(a,b){return a.t-b.t;});
        S.cover = sg.cover?String(sg.cover):'';
        S.idx = -1; lastIdx=-2; cur.built=-3;
        lt.textContent=''; lt.className=''; ln.textContent=''; ln.className='';
        emp.className='';
        cur.spans=[]; cur.ts=[]; cur.n=0;
        S.playing = (p.playing===false)?false:true;
        S.t = (S.lines.length&&S.lines[0].t<1.2) ? S.lines[0].t : 0;
        S.initSeen = true;
        tagt.textContent = S.name ? (S.name.length>22?S.name.slice(0,22)+'…':S.name) : 'INSTRUMENTAL';
        dirty=true;  // accent 变了，重烘底图
        try{ setCover(S.cover); }catch(e){ console.error('[426] cover',e); }
      } else if(d.type==='tick'){
        var q=d.payload||{};
        if(isFinite(q.time)) S.t=+q.time;
        if(typeof q.playing==='boolean') S.playing=q.playing;
      } else if(d.type==='beat'){
        var b=d.payload||{};
        DY.beatP=Math.max(DY.beatP, Math.min(1, Math.max(0, +b.level||0.6)));
        if(S.playing && !rm) DY.flash=Math.min(0.5, DY.flash+0.25);
      } else if(d.type==='live'){
        var v=d.payload||{};
        var lv=+v.level, bs=+v.bass, tr=+v.treble;
        DY.lvl = (isFinite(lv)?Math.max(0,Math.min(1,lv)):0)*0.7 + DY.lvl*0.3;
        DY.bass= (isFinite(bs)?Math.max(0,Math.min(1,bs)):0)*0.65 + DY.bass*0.35;
        DY.tre= (isFinite(tr)?Math.max(0,Math.min(1,tr)):0);
      }
    }catch(e){ err=String(e&&e.message||e); console.error('[426]',e); }
  });

  try{ requestAnimationFrame(frame); }catch(e){ console.error('[426] raf',e); sendReady(); }
})();
</script>
</body>
</html>
