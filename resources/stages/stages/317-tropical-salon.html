<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>317 · 热带客厅</title>
<style>
  :root{
    --acc: 255,120,60;
    --ink:#1b0f14;
    --paper:#f6e7c6;
    --cream:#fff4dc;
    --wall:#0f5250;
    --floor:#c2503a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#07110f;overflow:hidden}
  body{font-family:"Times New Roman",Georgia,"Songti SC","Noto Serif CJK SC",serif;
       -webkit-font-smoothing:antialiased;color:var(--cream)}
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#241019}
  #world{position:absolute;inset:0;will-change:transform}

  /* ---------- 墙 ---------- */
  .wall{position:absolute;inset:0;background:
        radial-gradient(80% 62% at 26% 40%, rgba(var(--acc),.20), transparent 70%),
        radial-gradient(70% 55% at 78% 22%, rgba(224,36,111,.22), transparent 72%),
        linear-gradient(180deg,#123d3b 0%,#0d4f4a 46%,#0a3b3a 100%);}
  .wall .paper{position:absolute;inset:-6%;width:112%;height:112%;
        opacity:.6;mix-blend-mode:screen;pointer-events:none}
  .wall .vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
        background:radial-gradient(118% 88% at 50% 44%,transparent 42%,rgba(10,4,10,.5) 100%)}

  /* 天花线脚 */
  .ceiling{position:absolute;left:0;right:0;top:0;height:9vh;z-index:3;
        background:linear-gradient(180deg,#f6e7c6,#e8cfa4 68%,#c9a878);
        box-shadow:0 .7vh 1.6vh rgba(0,0,0,.45)}
  .ceiling:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.4vh;
        background:repeating-linear-gradient(90deg,rgba(90,40,30,.55) 0 .5vh,transparent .5vh 1.5vh);
        -webkit-mask-image:linear-gradient(180deg,#000 40%,transparent);
        mask-image:linear-gradient(180deg,#000 40%,transparent)}
  .frieze{position:absolute;left:0;right:0;top:0;height:.9vh;
        background:repeating-linear-gradient(90deg,#b81f5a 0 2.2vh,#f2a83b 2.2vh 4.4vh,#0d4f4a 4.4vh 6.6vh)}

  /* 日落长窗 */
  .window{position:absolute;left:5.5%;top:11%;width:30%;height:46%;z-index:2;
        border-radius:52% 52% 2% 2%/46% 46% 2% 2%;overflow:hidden;
        border:.9vh solid #f3dfb8;
        box-shadow:0 0 0 .35vh rgba(60,20,30,.6),0 3vh 7vh rgba(255,140,80,.20),
                   inset 0 0 4vh rgba(60,10,40,.5);
        background:radial-gradient(120% 92% at 50% 104%,#ffe6a2 0%,#ffb648 22%,#ff7a3d 42%,#e0246f 64%,#7a1f63 84%,#2b0f3f 100%)}
  .window::after{content:"";position:absolute;inset:0;pointer-events:none;
        background:repeating-linear-gradient(90deg,transparent 0 32.6%,rgba(30,12,24,.5) 32.6% 33.6%),
                   repeating-linear-gradient(0deg,transparent 0 48.6%,rgba(30,12,24,.42) 48.6% 49.6%)}
  .window .palms{position:absolute;left:-6%;right:-6%;bottom:-2%;height:62%;opacity:.92}
  .window .sun{position:absolute;left:50%;top:47%;width:30%;aspect-ratio:1;
        transform:translate(-50%,-50%);border-radius:50%;
        background:radial-gradient(circle,#fff6cf 0 42%,#ffce6b 60%,rgba(255,160,80,0) 72%);
        filter:blur(.2vh);opacity:.85}
  .window .shine{position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.28),transparent 46%)}

  /* 地板：透视棋格 */
  .floor{position:absolute;left:0;right:0;bottom:0;height:44%;z-index:4;overflow:hidden;
        background:linear-gradient(180deg,#5e2230 0%,#9c3a33 26%,#c2503a 62%,#d9634a 100%)}
  .floor svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .floor:after{content:"";position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(74% 62% at 50% 4%,rgba(255,186,126,.42),transparent 62%),
                   linear-gradient(180deg,rgba(18,5,12,.82),rgba(18,5,12,.1) 38%,transparent 70%)}
  .baseboard{position:absolute;left:0;right:0;bottom:44%;height:2.2vh;z-index:5;
        background:linear-gradient(180deg,#f6e7c6,#c9a878);box-shadow:0 -1vh 2vh rgba(0,0,0,.35)}

  /* 吊灯 */
  .lamp{position:absolute;top:-1vh;width:16vh;z-index:6;transform-origin:50% -1vh;
        animation:sway 8s ease-in-out infinite;will-change:transform}
  .lamp-a{left:42%}
  .lamp-b{left:66%;animation-delay:-3.4s;width:13vh}
  .lamp .cord{position:absolute;left:50%;top:0;width:.35vh;height:13vh;
        background:linear-gradient(180deg,#2a1018,#3d1a1f);transform:translateX(-50%)}
  .lamp .shade{position:absolute;left:0;right:0;top:12.4vh;height:8.6vh;
        clip-path:polygon(50% 0,100% 100%,0 100%);
        background:repeating-linear-gradient(90deg,#e0246f 0 1.4vh,#f2a83b 1.4vh 2.8vh,#b81f5a 2.8vh 4.2vh)}
  .lamp .shade:after{content:"";position:absolute;left:0;right:0;bottom:0;height:.7vh;
        background:repeating-linear-gradient(90deg,#f6e7c6 0 .3vh,transparent .3vh .9vh)}
  .lamp .bulb{position:absolute;left:50%;top:21vh;width:9vh;height:9vh;
        transform:translate(-50%,-30%);border-radius:50%;pointer-events:none;
        background:radial-gradient(circle,rgba(255,226,150,.95),rgba(255,170,80,.28) 46%,transparent 70%);
        filter:blur(.4vh);opacity:.9;animation:glow 3.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
  @keyframes glow{0%,100%{opacity:.72}50%{opacity:1}}

  /* ---------- 剪纸人物 ---------- */
  #figures{position:absolute;left:0;bottom:23vh;width:100%;height:70vh;z-index:7;
        pointer-events:none;transform-origin:50% 100%;will-change:transform}
  #figures .fig>*{transform-box:fill-box;transform-origin:50% 100%}

  /* ---------- 墙上相框（专辑封面） ---------- */
  .art{position:absolute;right:4.5%;top:11.5%;width:19%;aspect-ratio:4/5;z-index:2;
       padding:.95vh;transform:rotate(3deg);
       background:linear-gradient(140deg,#f9e3a6,#c08a2a 30%,#f7d98a 56%,#8a5314);
       box-shadow:0 2.2vh 4vh rgba(8,2,8,.5),0 0 0 .28vh #6b3a12}
  .artInner{position:relative;width:100%;height:100%;overflow:hidden;display:flex;
       align-items:center;justify-content:center;background:#2b1a22}
  .art img{width:100%;height:100%;object-fit:cover;display:block;
       filter:saturate(1.08) contrast(1.04)}
  .art .mono{font-family:"Arial Black",Impact,sans-serif;font-size:3.2vh;line-height:1.05;
       letter-spacing:.16em;color:#f2d9a8;text-align:center;opacity:.62}
  .art .plate{position:absolute;left:50%;bottom:-3.6vh;transform:translateX(-50%);
       white-space:nowrap;font-family:Arial,"Helvetica Neue",sans-serif;
       font-size:clamp(6px,1vh,10px);letter-spacing:.22em;color:#f6e7c6;opacity:.68;
       background:rgba(18,6,12,.5);padding:.3vh .7vh}

  /* ---------- 铜牌：歌词 ---------- */
  #plaque{position:absolute;left:4vw;right:4vw;bottom:3.2vh;z-index:9;
       padding:1.5vh 3vw 2vh 3.4vw;transform:rotate(-.55deg);color:var(--ink);
       background:linear-gradient(180deg,rgba(255,247,226,.985),rgba(240,222,187,.985));
       box-shadow:0 2.2vh 4.6vh rgba(10,2,9,.55),inset 0 0 0 .2vh rgba(120,70,30,.32);
       border-radius:.5vh}
  #plaque:before{content:"";position:absolute;left:1.15vw;top:1.1vh;bottom:1.1vh;width:.4vh;
       border-radius:.2vh;background:linear-gradient(180deg,rgb(var(--acc)),#b81f5a 70%,#6b1a3a)}
  #plaque:after{content:"";position:absolute;inset:.55vh .55vh .55vh .55vh;pointer-events:none;
       border:.1vh solid rgba(120,70,30,.16);border-radius:.3vh}
  #songs{position:relative;z-index:2;font-family:Arial,"Helvetica Neue",sans-serif;
       font-size:clamp(9px,1.32vh,14px);letter-spacing:.26em;text-transform:uppercase;
       color:#6b3a2a;opacity:.82;margin:0 0 .9vh 0;padding-right:9vh;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  #lyrics{position:relative;z-index:2;height:clamp(58px,19vh,210px);overflow:hidden}
  .line{position:absolute;left:0;right:0;top:50%;width:100%;text-align:center;
       transform:translateY(-50%);opacity:0;pointer-events:none;
       transition:opacity .28s ease;color:#1b0f14;
       font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",SimSun,Georgia,serif;
       font-weight:700;font-size:5.9vh;line-height:1.26;letter-spacing:.015em;
       text-wrap:balance;overflow-wrap:anywhere}
  .line.on{opacity:1}
  .line.pre{opacity:.16;filter:blur(.35px)}
  .w{display:inline-block;white-space:nowrap}
  .ch{display:inline-block;white-space:pre;opacity:.13;transform:translateY(.08em)}
  .ch.in{opacity:1;transform:none;
       text-shadow:.075em .025em 0 rgba(224,36,111,.32),-.05em -.02em 0 rgba(0,168,158,.26);
       transition:opacity .3s ease,transform .34s cubic-bezier(.18,.72,.26,1)}
  #stamp{position:absolute;right:2.2vw;top:1.3vh;z-index:2;font-family:Arial,sans-serif;
       font-size:clamp(7px,1.05vh,11px);letter-spacing:.28em;color:#b81f5a;
       border:.18vh solid currentColor;padding:.3vh .9vh;opacity:.5;transform:rotate(3.5deg)}
  #empty{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
       display:none;text-align:center;font-family:"Songti SC",Georgia,serif;
       color:#4a2a20;font-size:clamp(16px,2.8vh,34px);letter-spacing:.1em}
  #empty b{display:block;font-size:clamp(10px,1.5vh,15px);font-weight:400;letter-spacing:.3em;
       opacity:.55;margin-top:1.2vh;font-family:Arial,sans-serif;text-transform:uppercase}
  #flash{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
       background:radial-gradient(58% 42% at 50% 18%,rgba(255,226,158,.6),rgba(255,180,110,.12) 55%,transparent 76%)}

  /* 纸质噪点 */
  #grain{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:.15;
       mix-blend-mode:multiply;background-repeat:repeat}

  /* ---------- 自适应 ---------- */
  @media (max-aspect-ratio: 1/1){
    .window{width:38%;height:26%;left:6%;top:8%;border-width:.6vh}
    .art{width:31%;right:5%;top:9%}
    #figures{height:70vh;bottom:36vh}
    #plaque{padding:1.3vh 4vw 1.8vh 5vw}
    #songs{letter-spacing:.16em;padding-right:8.5vh}
    .line{letter-spacing:0}
    #stamp{right:3vw;top:1.1vh;letter-spacing:.18em}
    .lamp{width:12vh}
    .lamp-a{left:41%}
    .lamp-b{left:64%;width:10vh}
  }
  @media (max-height: 460px){
    .window{top:14%;height:54%}
    .art{top:12%;width:16%}
    #figures{height:82vh;bottom:18vh}
    #plaque{padding:1vh 3vw 1.4vh 3.4vw;bottom:2vh}
    #songs{margin-bottom:.5vh}
  }
  @media (prefers-reduced-motion: reduce){
    .lamp,.lamp .bulb{animation:none}
    .ch.in{transition:none}
    #grain{opacity:.1}
  }
</style>
</head>

  <div id="plaque">
    <div id="stamp">№ 13/50</div>
    <div id="songs"></div>

      <div id="empty">此曲无词<b>No lyrics · instrumental</b></div>
    </div>
  </div>
  <div id="grain"></div>
</div>
<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var stage = $('#stage'), box = $('#lyrics'), songs = $('#songs');

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
    rm: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
  };

  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err,
      text: S.idx >= 0 && S.lines[S.idx] ? (S.lines[S.idx].text || '') : '',
      gl: false, rm: S.rm
    };
  };

  var world = $('#world'), fig = $('#figures'), flash = $('#flash'), empty = $('#empty');
  var coverImg = $('#cover'), mono = $('#mono');

  function num(v){ return typeof v === 'number' && isFinite(v) ? v : 0; }
  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function chars(txt){
    try { return Array.from(txt); } catch(e){ return txt.split(''); }
  }

  var L = [];            // {t,dur,text,el,ch[],times[],ci,done,lastTime}
  S.key = '';
  S.hit = 0; S.bass = 0; S.treble = 0;

  function timesFor(l, arr, n){
    var start = num(l.t);
    var dur = num(l.dur);
    var out = new Array(n);
    var hold = start;
    var span = dur > 0 ? Math.min(dur * 0.92, n * 0.34) : n * 0.30;
    var per = n > 1 ? span / (n - 1) : 0;
    for (var i = 0; i < n; i++){
      var ct = NaN;
      if (arr && arr[i] && typeof arr[i].t === 'number' && isFinite(arr[i].t)) ct = arr[i].t;
      if (!isFinite(ct)) ct = start + per * i;
      if (ct < hold) ct = hold;
      out[i] = ct;
      hold = ct;
    }
    return out;
  }

  function build(rawLines){
    // 清掉旧的 line，保留空状态节点
    for (var k = L.length - 1; k >= 0; k--){
      if (L[k].el && L[k].el.parentNode) L[k].el.parentNode.removeChild(L[k].el);
    }
    L.length = 0;

    var src = Array.isArray(rawLines) ? rawLines.slice() : [];
    src = src.filter(function(l){
      return l && typeof l.text === 'string' && l.text.replace(/\s+/g, '') !== '';
    });
    src.sort(function(a, b){ return num(a.t) - num(b.t); });

    for (var i = 0; i < src.length; i++){
      var l = src[i];
      var text = String(l.text).replace(/\s+/g, ' ').trim();
      var cs = chars(text);
      var el = document.createElement('div');
      el.className = 'line';
      var spans = [], j = 0;
      while (j < cs.length){
        if (/[A-Za-z0-9'’\-]/.test(cs[j])){
          var e = j;
          while (e < cs.length && /[A-Za-z0-9'’\-]/.test(cs[e])) e++;
          var host = el;
          if (e - j <= 18){ host = document.createElement('span'); host.className = 'w'; el.appendChild(host); }
          for (var q = j; q < e; q++){
            var sw = document.createElement('span');
            sw.className = 'ch';
            sw.textContent = cs[q];
            host.appendChild(sw);
            spans.push(sw);
          }
          j = e;
        } else {
          var sp = document.createElement('span');
          sp.className = 'ch';
          sp.textContent = cs[j];
          el.appendChild(sp);
          spans.push(sp);
          j++;
        }
      }
      box.appendChild(el);
      L.push({
        t: num(l.t), dur: num(l.dur), text: text, el: el, ch: spans,
        times: timesFor(l, Array.isArray(l.chars) ? l.chars : null, cs.length),
        ci: 0, done: new Uint8Array(cs.length), lastTime: -1
      });
    }

    S.lines = L.map(function(o){ return { t: o.t, text: o.text }; });
    S.idx = -1;
    empty.style.display = L.length ? 'none' : 'block';
  }

  function fit(el){
    var H = window.innerHeight;
    var maxH = Math.max(46, H * 0.175);
    var size = Math.min(76, Math.max(16, H * 0.062));
    el.style.fontSize = size.toFixed(1) + 'px';
    var guard = 0;
    while (guard++ < 24 && el.scrollHeight > maxH && size > 15){
      size *= 0.9;
      el.style.fontSize = size.toFixed(1) + 'px';
    }
  }

  function resetLine(o){
    for (var i = 0; i < o.ch.length; i++){
      if (o.done[i]){ o.ch[i].className = 'ch'; o.done[i] = 0; }
    }
    o.ci = 0; o.lastTime = -1;
  }

  function paint(o, time){
    if (time < o.lastTime - 0.05) resetLine(o);
    o.lastTime = time;
    var i = o.ci;
    while (i < o.times.length && o.times[i] <= time + 0.004){
      if (!o.done[i]){ o.ch[i].className = 'ch in'; o.done[i] = 1; }
      i++;
    }
    o.ci = i;
  }

  function seek(time, force){
    S.t = time;
    var n = L.length;
    if (!n){ S.idx = -1; return; }
    var lo = 0, hi = n - 1, idx = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (L[mid].t <= time + 1e-3){ idx = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    if (idx !== S.idx || force){
      if (S.idx >= 0 && L[S.idx]) L[S.idx].el.className = 'line';
      if (S.idx < 0 && L[0]) L[0].el.className = 'line';
      S.idx = idx;
      if (idx >= 0){
        var o = L[idx];
        o.el.className = 'line on';
        resetLine(o);
        fit(o.el);
        paint(o, time);
      } else if (L[0]){
        L[0].el.className = 'line pre';
      }
    } else if (idx >= 0){
      paint(L[idx], time);
    }
  }

  var lastCover = null;
  function setCover(url){
    var u = (typeof url === 'string') ? url : '';
    if (u === lastCover) return;
    lastCover = u;
    if (u){
      coverImg.onload = function(){ coverImg.hidden = false; mono.hidden = true; };
      coverImg.onerror = function(){ coverImg.hidden = true; mono.hidden = false; };
      coverImg.src = u;
      coverImg.hidden = false;
    } else {
      coverImg.removeAttribute('src');
      coverImg.hidden = true;
      mono.hidden = false;
    }
  }

  function applyInit(p){
    p = p || {};
    var song = p.song || {};
    var artists = Array.isArray(song.artists)
      ? song.artists.filter(function(a){ return typeof a === 'string' && a.trim(); }).join(' / ')
      : (typeof song.artists === 'string' ? song.artists : '');
    var name = (typeof song.name === 'string' && song.name.trim()) ? song.name.trim() : '无题';
    var title = artists ? name + ' — ' + artists : name;
    songs.textContent = title;
    songs.title = title;

    if (Array.isArray(p.accent) && p.accent.length >= 3){
      var a = p.accent.slice(0, 3).map(function(v){
        v = num(v) | 0; return v < 0 ? 0 : v > 255 ? 255 : v;
      });
      document.documentElement.style.setProperty('--acc', a.join(','));
    }

    var lines = Array.isArray(p.lines) ? p.lines : [];
    var key = (song.id == null ? '' : String(song.id)) + '#' + lines.length + '#';
    for (var i = 0; i < lines.length; i++){
      var li = lines[i] || {};
      key += (li.text ? li.text : '') + ':' + num(li.t).toFixed(2) + ':' +
             num(li.dur).toFixed(2) + ':' + (Array.isArray(li.chars) ? li.chars.length : 0) + ',';
    }
    if (key !== S.key){
      S.key = key;
      build(lines);
      seek(S.t, true);
    }
    setCover(song.cover);
  }

  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
  }

  window.addEventListener('message', function(e){
    var m = e.data;
    if (!m || m.__c100 !== 1) return;
    try {
      var p = m.payload || {};
      if (m.type === 'init'){ applyInit(p); }
      else if (m.type === 'tick'){
        if (typeof p.playing === 'boolean') S.playing = p.playing;
        seek(num(p.time));
      }
      else if (m.type === 'beat'){
        var lv = clamp01(num(p.level));
        S.hit = Math.max(S.hit, 0.35 + lv * 0.85);
      }
      else if (m.type === 'live'){
        if (typeof p.playing === 'boolean') S.playing = p.playing;
        S.bass = clamp01(num(p.bass));
        S.treble = clamp01(num(p.treble));
      }
    } catch(err){ S.err = String(err && err.message || err); }
  }, false);

  var rt = 0;
  function onResize(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      if (S.idx >= 0 && L[S.idx]) fit(L[S.idx].el);
    }, 140);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  var reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (reduce && reduce.addEventListener) reduce.addEventListener('change', function(e){ S.rm = !!e.matches; });

  var lastHit = 0;
  function frame(now){
    var t0 = performance.now();
    S.frames++;

    S.hit *= 0.90;
    if (S.hit < 0.005) S.hit = 0;
    if (S.hit) flash.style.opacity = (S.hit * 0.42).toFixed(3);
    else if (lastHit) flash.style.opacity = '0';
    lastHit = S.hit;

    if (!S.rm){
      var tt = now * 0.001;
      var ax = Math.sin(tt * 0.29) * 0.85 + Math.sin(tt * 0.13) * 0.45;
      var ay = Math.cos(tt * 0.21) * 0.55;
      var zoom = 1.035 + S.bass * 0.014 + S.hit * 0.004;
      world.style.transform = 'translate3d(' + (ax * 0.85).toFixed(2) + 'vw,' +
        (ay * 0.5).toFixed(2) + 'vh,0) scale(' + zoom.toFixed(4) + ')';
      fig.style.transform = 'translate3d(' + (ax * 0.42).toFixed(2) + 'vw,' +
        (-ay * 0.24).toFixed(2) + 'vh,0) scale(' + (1 + S.hit * 0.012 + S.bass * 0.006).toFixed(4) + ')';
    }

    if (!readySent) sendReady();
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(sendReady, 60);
  setTimeout(sendReady, 700);

  // ---- 程序化材质：墙纸 / 纸噪点 ----
  (function wallpaper(){
    var NS = 'http' + '://www.w3.org/2000/svg'; // SVG 命名空间标识，不发起网络请求
    var svg = $('#paper');
    if (!svg) return;
    var defs = document.createElementNS(NS, 'defs');
    var pat = document.createElementNS(NS, 'pattern');
    pat.setAttribute('id', 'pLeaf');
    pat.setAttribute('width', '150');
    pat.setAttribute('height', '150');
    pat.setAttribute('patternUnits', 'userSpaceOnUse');

    function leaf(tf, fill, op){
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', tf);
      g.setAttribute('opacity', op);
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M0 0 C 8 -26 36 -40 58 -30 C 42 -6 18 9 0 0 Z');
      p.setAttribute('fill', fill);
      g.appendChild(p);
      var m = document.createElementNS(NS, 'path');
      m.setAttribute('d', 'M2 -2 C 20 -12 40 -22 54 -28');
      m.setAttribute('stroke', '#0b2b2a');
      m.setAttribute('stroke-width', '1.6');
      m.setAttribute('fill', 'none');
      m.setAttribute('opacity', '.5');
      g.appendChild(m);
      return g;
    }
    pat.appendChild(leaf('translate(14,46) rotate(-26)', '#f6e7c6', '.34'));
    pat.appendChild(leaf('translate(80,102) rotate(32) scale(.88)', '#f2a83b', '.36'));
    pat.appendChild(leaf('translate(120,16) rotate(154) scale(.95)', '#7fd6c0', '.30'));
    pat.appendChild(leaf('translate(34,126) rotate(6) scale(.66)', '#f6e7c6', '.24'));

    var dots = [[104, 64, 2.4], [58, 18, 1.8], [132, 88, 2.0], [20, 104, 2.2]];
    for (var i = 0; i < dots.length; i++){
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', dots[i][0]); c.setAttribute('cy', dots[i][1]);
      c.setAttribute('r', dots[i][2]);
      c.setAttribute('fill', '#ffe9c4');
      c.setAttribute('opacity', '.14');
      pat.appendChild(c);
    }

    defs.appendChild(pat);
    svg.appendChild(defs);
    var rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', '-200'); rect.setAttribute('y', '-200');
    rect.setAttribute('width', '1600'); rect.setAttribute('height', '1200');
    rect.setAttribute('fill', 'url(#pLeaf)');
    svg.appendChild(rect);
  })();

  (function floorGrid(){
    var NS = 'http' + '://www.w3.org/2000/svg';
    var svg = $('#floorSvg');
    if (!svg) return;
    var W = 1600, H = 500, CX = 800, A = 500, B = 92;
    var Zs = [], z = 0.85, k, i;
    for (k = 0; k < 20; k++){ Zs.push(z); z *= 1.18; }
    var dark = '', light = '';
    function px(X, Z){ return CX + B * X / Z; }
    for (k = 0; k < Zs.length - 1; k++){
      var z0 = Zs[k], z1 = Zs[k + 1];
      var y0 = A / z0, y1 = A / z1;
      if (y1 > H + 2) continue;
      for (i = -10; i < 10; i++){
        var xa0 = px(i, z0), xb0 = px(i + 1, z0);
        if (xb0 < -60 || xa0 > W + 60) continue;
        var d = 'M' + xa0.toFixed(1) + ' ' + y0.toFixed(1) +
                'L' + xb0.toFixed(1) + ' ' + y0.toFixed(1) +
                'L' + px(i + 1, z1).toFixed(1) + ' ' + y1.toFixed(1) +
                'L' + px(i, z1).toFixed(1) + ' ' + y1.toFixed(1) + 'Z';
        if ((i + k) & 1) dark += d; else light += d;
      }
    }
    function put(d, fill){
      if (!d) return;
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', fill);
      p.setAttribute('stroke', fill);
      p.setAttribute('stroke-width', '0.9');
      svg.appendChild(p);
    }
    put(light, '#f0cba6');
    put(dark, '#cf5f45');
  })();

  (function grain(){
    var el = $('#grain');
    if (!el) return;
    var c = document.createElement('canvas');
    c.width = c.height = 128;
    var g = c.getContext && c.getContext('2d');
    if (!g) return;
    var img = g.createImageData(128, 128), d = img.data;
    for (var i = 0; i < d.length; i += 4){
      var v = 132 + Math.random() * 86;
      d[i] = v; d[i + 1] = v * 0.97; d[i + 2] = v * 0.92; d[i + 3] = 40;
    }
    g.putImageData(img, 0, 0);
    try { el.style.backgroundImage = 'url(' + c.toDataURL() + ')'; } catch(e){}
  })();

  window.addEventListener('error', function(e){
    S.err = String((e && e.message) || 'error');
  }, false);
})();
</script>
