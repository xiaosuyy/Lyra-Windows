<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>相位格</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e6e1d4}
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden}
  #f{position:absolute;left:0;top:0;display:block}
  #hdr{position:absolute;left:0;top:0;display:flex;align-items:flex-start;pointer-events:none;z-index:4}
  #cov{position:relative;flex:0 0 auto;overflow:hidden;border:1px solid rgba(26,25,22,.34);background:rgba(26,25,22,.03)}
  #cov img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);opacity:0}
  #covPh{position:absolute;left:24%;top:24%;right:24%;bottom:24%;border:1px solid rgba(26,25,22,.55)}
  #covPh::after{content:"";position:absolute;left:26%;top:26%;right:26%;bottom:26%;border:1px solid rgba(26,25,22,.30)}
  #meta{min-width:0;flex:1 1 auto;padding-left:.72em;padding-top:.1em}
  #ttl{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;font-weight:400;color:rgba(26,25,22,.94);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;line-height:1.15}
  #art{font-family:"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;color:rgba(26,25,22,.46);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.36em;letter-spacing:.15em;line-height:1.1}
  #count{flex:0 0 auto;align-self:flex-start;font-family:ui-monospace,Menlo,Consolas,monospace;
         color:rgba(26,25,22,.42);letter-spacing:.16em;line-height:1.2;text-align:right;padding-top:.2em}
  #lyr{position:absolute;left:0;top:0;pointer-events:none;z-index:3;
       display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  #lyr .clip{flex:0 0 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
  #prev,#nxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
             font-family:"Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC",sans-serif;
             font-weight:400;color:rgba(26,25,22,.52);line-height:1.3;letter-spacing:.03em}
  #cur{font-family:"Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC",sans-serif;
       font-weight:500;color:rgba(26,25,22,.55);line-height:1.36;letter-spacing:.035em;
       word-break:break-word;overflow-wrap:anywhere;margin:.22em 0 .26em}
  #cur .row{display:block}
  #cur .ch{transition:color .16s linear}
  #cur .ch.on{color:rgba(26,25,22,.97)}
  #empty{position:absolute;font-family:Georgia,"Songti SC","SimSun",serif;color:rgba(26,25,22,.52);
         letter-spacing:.10em;line-height:1.6;z-index:3;pointer-events:none;text-align:center;transform:translateX(-0%)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="f" aria-hidden="true"></canvas>
  <div id="hdr">
    <div id="cov"><img id="covImg" alt=""><div id="covPh"></div></div>
    <div id="meta"><div id="ttl"></div><div id="art"></div></div>
    <div id="count"></div>
  </div>
  <div id="lyr">
    <div class="clip"><div id="prev"></div><div id="cur"></div><div id="nxt"></div></div>
  </div>
  <div id="empty"></div>
</div>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ 0 环境 */
var TAU = Math.PI * 2;
var Q = null;
try { Q = new URLSearchParams(location.search); } catch (e) { Q = null; }
var TARGET_T = 0;
if (Q) {
  var _t = parseFloat(Q.get('t') || Q.get('seek') || '');
  if (isFinite(_t) && _t > 0) TARGET_T = _t;
}
var RM = false;
try { RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { RM = false; }

/* ------------------------------------------------------------------ 1 DOM */
var cv    = document.getElementById('f');
var ctx   = cv.getContext('2d', { alpha: false });
var hdr   = document.getElementById('hdr');
var cov   = document.getElementById('cov');
var covImg= document.getElementById('covImg');
var covPh = document.getElementById('covPh');
var ttlEl = document.getElementById('ttl');
var artEl = document.getElementById('art');
var lyrEl = document.getElementById('lyr');
var prevEl= document.getElementById('prev');
var curEl = document.getElementById('cur');
var nxtEl = document.getElementById('nxt');
var empEl = document.getElementById('empty');
var cntEl = document.getElementById('count');

/* ------------------------------------------------------------------ 2 状态 */
var W = 1440, H = 900, DPR = 1;
var ROOM  = '#e6e1d4';
var SHEET = '#f7f4ec';
var INK   = [26, 25, 22];

var L = {                       /* 版面几何，resize() 之前必须存在 */
  side: 810, x: 315, y: 45, cw: 50.6,
  ix: 373, iw: 694, hdrH: 101, hdrTop: 75, covSize: 40,
  baseFs: 46, bandTop: 0, bandBottom: 0
};

var LINES = [];                 /* 规范化后的歌词行 */
var idx = -1;
var curText = '';
var spans = [];
var litCount = -1;

var songT = TARGET_T;           /* 歌曲时钟 */
var anim  = 0;                  /* 动画时钟（reduced-motion 时减速） */
var playing = true;
var frames = 0;
var readySent = false;
var jsEma = 0.4;

var beatAt = -99, beatLvl = 0;
var accent = [32, 32, 30];
var accentInk = 'rgba(26,25,22,.55)';

var grainPat = buildGrainPattern();
var lastSceneAt = 0;

/* ------------------------------------------------------------------ 3 工具 */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
function rgba(c, a) {
  return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
}

function buildGrainPattern() {
  try {
    var g = document.createElement('canvas');
    g.width = 192; g.height = 192;
    var gx = g.getContext('2d');
    var img = gx.createImageData(192, 192);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = 20 + Math.random() * 70;
      d[i] = v * 0.55; d[i + 1] = v * 0.52; d[i + 2] = v * 0.45;
      d[i + 3] = Math.random() * 26;
    }
    gx.putImageData(img, 0, 0);
    return ctx.createPattern(g, 'repeat');
  } catch (e) {
    console.error('[494] grain pattern failed', e);
    return null;
  }
}

/* ------------------------------------------------------------------ 4 版面 */
function measure() {
  var side = Math.min(W, H) * (W < 560 ? 0.96 : 0.92);
  if (!isFinite(side) || side < 160) side = Math.max(160, Math.min(W, H) * 0.90);
  var cw = side / N;

  L.side = side;
  L.x = (W - side) / 2;
  L.y = (H - side) / 2;
  L.cw = cw;

  /* 顶部两行 = 曲目纸签；字号按格宽缩放，不按像素 */
  var covSize = clamp(cw * 1.05, 14, 40);
  L.covSize = covSize;
  L.hdrH = cw * 2;
  L.hdrTop = L.y + (L.hdrH - covSize) * 0.5;

  /* 内容左右内缩 1 格，与网格列对齐 */
  var inset = cw;
  L.ix = L.x + inset;
  L.iw = Math.max(60, side - inset * 2);

  /* 底部 ROWS_LYR 行 = 歌词带（与网格行严格对齐） */
  L.bandTop = L.y + cw * (N - ROWS_LYR);
  L.bandBottom = L.y + side;
  L.baseFs = clamp(cw * 1.08, 13, 46);

  buildGrid();

  /* 曲目纸签 */
  hdr.style.left = L.ix + 'px';
  hdr.style.top = L.hdrTop + 'px';
  hdr.style.width = L.iw + 'px';
  cov.style.width = covSize + 'px';
  cov.style.height = covSize + 'px';
  ttlEl.style.fontSize = clamp(cw * 0.42, 10, 18) + 'px';
  artEl.style.fontSize = clamp(cw * 0.26, 7.5, 11.5) + 'px';
  cntEl.style.fontSize = clamp(cw * 0.24, 7.5, 11) + 'px';

  /* 歌词带：从网格里挖掉的一块空白（画在 canvas 上，结构而非柔光） */

  lyrEl.style.left = L.ix + 'px';
  lyrEl.style.top = L.bandTop + 'px';
  lyrEl.style.width = L.iw + 'px';
  lyrEl.style.height = (L.bandBottom - L.bandTop) + 'px';
  prevEl.style.fontSize = Math.round(L.baseFs * 0.52) + 'px';
  nxtEl.style.fontSize = Math.round(L.baseFs * 0.58) + 'px';

  empEl.style.left = L.ix + 'px';
  empEl.style.top = (L.bandTop + (L.bandBottom - L.bandTop) * 0.34) + 'px';
  empEl.style.fontSize = clamp(cw * 0.42, 13, 24) + 'px';
  empEl.style.width = L.iw + 'px';

  if (LINES.length && idx >= 0) applyLine(idx);
  else if (!LINES.length) { empEl.style.opacity = '1'; }
}

function resize() {
  var w = 0, h = 0;
  try {
    w = window.innerWidth || document.documentElement.clientWidth || 0;
    h = window.innerHeight || document.documentElement.clientHeight || 0;
  } catch (e) { console.error('[494] size read failed', e); }
  if (!isFinite(w) || w < 40) w = 1440;
  if (!isFinite(h) || h < 40) h = 900;
  W = Math.round(w); H = Math.round(h);
  DPR = clamp(num(window.devicePixelRatio, 1), 1, 2);

  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  measure();
  lastSceneAt = 0;
}

/* ------------------------------------------------------------------ 5 歌词数据 */
function normalizeChars(src, text) {
  if (!src || typeof src === 'string' || typeof src.length !== 'number') return null;
  var n = Math.min(src.length, 400);
  var out = [];
  for (var i = 0; i < n; i++) {
    var c = src[i];
    if (!c || typeof c !== 'object') continue;
    out.push({ c: (c.c == null ? '' : String(c.c)), t: num(c.t, -1) });
  }
  if (!out.length) return null;
  return out;
}

function normalizeLines(src) {
  var out = [];
  if (!src || typeof src === 'string' || typeof src.length !== 'number') return out;
  var n = Math.min(src.length, 400);
  for (var i = 0; i < n; i++) {
    var raw = src[i];
    if (!raw || typeof raw !== 'object') continue;
    var text = (raw.text == null ? '' : String(raw.text)).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    if (!text) continue;                     /* 空行不是歌词，跳过 */
    var t = num(raw.t, 0);
    if (t < 0) t = 0;
    out.push({ t: t, dur: num(raw.dur, 0), text: text, chars: normalizeChars(raw.chars, text) });
  }
  out.sort(function (a, b) { return a.t - b.t; });
  return out;
}

function settleDurations(total) {
  for (var i = 0; i < LINES.length; i++) {
    var ln = LINES[i];
    if (!(ln.dur > 0)) {
      var next = (i + 1 < LINES.length) ? LINES[i + 1].t : NaN;
      if (isFinite(next) && next > ln.t) ln.dur = next - ln.t;
      else if (total > ln.t) ln.dur = total - ln.t;
      else ln.dur = 3.4;
    }
    ln.dur = clamp(ln.dur, 0.45, 30);
  }
}

function pickIdx(t) {
  var n = LINES.length;
  if (!n) return -1;
  if (t < LINES[0].t) return -1;
  var lo = 0, hi = n - 1, best = -1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (LINES[mid].t <= t + 0.001) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return best;
}

function lineProgress(t, i) {
  var ln = LINES[i];
  var dur = ln.dur > 0 ? ln.dur : 3.4;
  return clamp((t - ln.t) / dur, 0, 1);
}

function litCountAt(t, i, total) {
  var ln = LINES[i];
  if (ln.chars && ln.chars.length) {
    var c = ln.chars, n = Math.min(c.length, total), lit = 0;
    for (var k = 0; k < n; k++) {
      if (c[k].t <= t + 0.03) lit = k + 1; else break;
    }
    return lit;
  }
  return Math.round(lineProgress(t, i) * total);
}

/* 当前句进度：句内按秒推进；字符模式下用字时间轴，避免与点亮脱节 */
function curUnit() {
  if (idx < 0 || idx >= LINES.length) return 0;
  return lineProgress(songT, idx);
}

/* ------------------------------------------------------------------ 6 歌词排版 */
var F_LYRIC = '"Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif';
var measureCv = document.createElement('canvas');
var mctx = measureCv.getContext('2d');

function tokenize(s) {
  var out = [], buf = '';
  for (var i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    if (/[A-Za-z0-9'’\-]/.test(ch)) buf += ch;
    else { if (buf) { out.push(buf); buf = ''; } out.push(ch); }
  }
  if (buf) out.push(buf);
  return out;
}

function wrapTokens(tokens, maxW, maxRows) {
  var rows = [], cur = '', i;
  for (i = 0; i < tokens.length; i++) {
    var tk = tokens[i];
    if (cur && mctx.measureText(cur + tk).width > maxW) {
      rows.push(cur);
      if (rows.length > maxRows) return null;   /* 交给 fitLine 缩字号 */
      cur = tk;
    } else {
      cur += tk;
    }
  }
  if (cur) {
    rows.push(cur);
    if (rows.length > maxRows) return null;
  }
  return rows;
}

function fitLine(text) {
  var fs = L.baseFs;
  var rows = null;
  var maxRows = 2;
  for (var attempt = 0; attempt < 18; attempt++) {
    mctx.font = '500 ' + fs + 'px ' + F_LYRIC;
    var r = wrapTokens(tokenize(text), L.iw, maxRows);
    if (r && r.length) {
      var ok = true;
      for (var i = 0; i < r.length; i++) {
        if (mctx.measureText(r[i]).width > L.iw + 1) { ok = false; break; }
      }
      if (ok) { rows = r; break; }
      rows = r;
    }
    fs = fs * 0.90;
    if (fs < 12) break;
  }
  if (!rows || !rows.length) {
    /* 极端情况：单字硬切，保证不溢出 */
    mctx.font = '500 12px ' + F_LYRIC;
    rows = [];
    var s = text;
    var guard = 0;
    while (s.length && guard < 6) {
      var take = s.length;
      while (take > 1 && mctx.measureText(s.slice(0, take) + '…').width > L.iw) take--;
      rows.push(s.slice(0, take) + (take < s.length ? '…' : ''));
      s = s.slice(take);
      guard++;
    }
    if (!rows.length) rows = [text];
  }
  return { fs: Math.max(12, Math.round(fs)), rows: rows };
}

function applyLine(i) {
  var ln = (i >= 0 && i < LINES.length) ? LINES[i] : null;
  curText = ln ? ln.text : '';
  spans = [];
  litCount = -1;

  if (!ln) {
    curEl.textContent = '';
    curEl.style.opacity = '0';
    if (prevEl.textContent) prevEl.textContent = '';
    if (nxtEl.textContent) nxtEl.textContent = '';
    prevEl.style.display = 'none';
    nxtEl.style.display = 'none';
    return;
  }
  curEl.style.opacity = '1';

  var fit = fitLine(curText || '');
  curEl.style.fontSize = fit.fs + 'px';

  var frag = document.createDocumentFragment();
  var flat = [];
  for (var r = 0; r < fit.rows.length; r++) {
    var rowEl = document.createElement('span');
    rowEl.className = 'row';
    var rowText = fit.rows[r];
    var chars = Array.from ? Array.from(rowText) : rowText.split('');
    for (var c = 0; c < chars.length; c++) {
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = chars[c];
      rowEl.appendChild(sp);
      flat.push(sp);
    }
    frag.appendChild(rowEl);
  }
  curEl.textContent = '';
  curEl.appendChild(frag);
  spans = flat;

  var pv = (i - 1 >= 0) ? LINES[i - 1].text : '';
  var nx = (i + 1 < LINES.length) ? LINES[i + 1].text : '';
  setText(prevEl, pv);
  setText(nxtEl, nx);
  prevEl.style.display = pv ? 'block' : 'none';
  nxtEl.style.display = nx ? 'block' : 'none';

  cntEl.textContent = pad2(i + 1) + ' / ' + pad2(LINES.length);
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function paintLit(n) {
  var upto = Math.min(n, spans.length);
  for (var i = 0; i < spans.length; i++) {
    var on = i < upto;
    if (on) { if (!spans[i].classList.contains('on')) spans[i].classList.add('on'); }
    else { if (spans[i].classList.contains('on')) spans[i].classList.remove('on'); }
  }
}

function updateLyrics(t) {
  var i = pickIdx(t);
  if (i !== idx) { idx = i; applyLine(i); }
  if (idx >= 0 && idx < LINES.length) {
    var lit = litCountAt(t, idx, spans.length);
    if (lit !== litCount) { litCount = lit; paintLit(lit); }
  }
}

/* ------------------------------------------------------------------ 7 画面 */
function beatPulse() {
  var a = anim - beatAt;
  if (a < 0 || a > 1.4) return 0;
  return clamp(beatLvl, 0, 1) * Math.exp(-a * 3.2);
}
function rippleRadius() {
  var a = anim - beatAt;
  if (a < 0 || a > 1.6) return -1;
  return (a / 1.6) * 1.2;
}

/* 以中心 (cx,cy)、半径 h、旋转 rot 的方环路径；四个角写成参数式 */
function ringPath(cx, cy, h, co, si) {
  var ax = h * co - h * si, ay = h * si + h * co;   /* 角 (h,h) */
  var bx = h * co + h * si, by = h * si - h * co;   /* 角 (h,-h) */
  ctx.moveTo(cx + ax, cy + ay);
  ctx.lineTo(cx - bx, cy - by);
  ctx.lineTo(cx - ax, cy - ay);
  ctx.lineTo(cx + bx, cy + by);
  ctx.closePath();
}

var N = 20;               /* 20 x 20；顶部 2 行放曲目，底部 5 行留给歌词 */
var ROWS_LYR = 5;
var ROW_HDR = 2;
var GX = [], GY = [];     /* 预计算的格心 */

function buildGrid() {
  GX.length = 0; GY.length = 0;
  var cw = L.side / N;
  for (var i = 0; i < N * N; i++) {
    var gx = i % N, gy = (i / N) | 0;
    GX.push(L.x + (gx + 0.5) * cw);
    GY.push(L.y + (gy + 0.5) * cw);
  }
}

var CELLP = new Float32Array(N * N);
var tiers = null;          /* 每帧复用的分档缓冲 */

function computeCells(t) {
  var cw = L.side / N;
  var cxm = L.x + L.side / 2, cym = L.y + L.side / 2;
  var inv = 1 / (L.side * 0.5);
  var bp = beatPulse();
  var ripR = rippleRadius();
  for (var i = 0; i < N * N; i++) {
    var gx = i % N, gy = (i / N) | 0;
    var u = gx / (N - 1), v = gy / (N - 1);
    var ph = (u * 0.72 + v * 1.34) * 2.15;
    var wv = Math.sin(ph - t * 0.60);
    var dx = (GX[i] - cxm) * inv, dy = (GY[i] - cym) * inv;
    var d = Math.sqrt(dx * dx + dy * dy);
    var rip = Math.sin(d * 6.2 - t * 1.02) * 0.5 + 0.5;
    var bo = 0;
    if (ripR >= 0) {
      var q = (d - ripR) / 0.22;
      bo = bp * Math.exp(-q * q);
    }
    CELLP[i] = clamp(0.5 + 0.40 * wv + 0.30 * (rip - 0.5) + 0.85 * bo, 0, 1);
  }
}

function drawField(t) {
  var cw = L.side / N;
  var k, i, gx, gy;
  var bp = beatPulse();
  var rowTop = N - ROWS_LYR;          /* 这一行往下属于歌词带，不画 */
  var rowBot = ROW_HDR;               /* 上面两行留给曲目纸签 */

  /* 1 · 斜向相位带（贯穿全场的系统线，非常淡） */
  ctx.strokeStyle = 'rgba(26,25,22,.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (k = 0; k < N + 1; k++) {
    var u0 = k / N;
    var oy = (u0 - 0.5) * L.side * 0.20;
    ctx.moveTo(L.x, L.y + L.side * u0 + oy);
    ctx.lineTo(L.x + L.side, L.y + L.side * u0 + oy - L.side * 0.20);
  }
  ctx.stroke();

  /* 2 · 方格矩阵：每格同 footprint，靠「线数 / 间距 / 角度」做相位微差；
     另有一道缓慢横移的相位带，把经过的列整体错开半格 —— 相位偏移在此显形 */
  var bandC = (0.5 + 0.5 * Math.sin(t * 0.21)) * (N - 1);
  var shearAmp = cw * 0.46 * Math.sin(t * 0.83);

  /* 按「墨度」分 5 档批处理：同档共用一次 stroke，256 格压到 5 次 */
  var TIERS = 5;
  tiers = new Array(TIERS);

  for (i = 0; i < N * N; i++) {
    gy = (i / N) | 0; gx = i % N;
    if (gy >= rowTop || gy < rowBot) continue;
    var p = CELLP[i];
    var dd = gx - bandC;
    var shW = Math.exp(-(dd * dd) / 3.2);
    var cx = GX[i] + shearAmp * shW;
    var cy = GY[i];
    var uu = gx / (N - 1), vv = gy / (N - 1);

    var rot = (p - 0.5) * 0.60;
    var co = Math.cos(rot), si = Math.sin(rot);
    var wob = Math.sin(t * 0.62 + uu * 5.4 + vv * 3.0) * cw * 0.016;
    var K = 3 + Math.round(p * 2);                    /* 3 – 5 圈 */
    var hOut = cw * (0.40 + 0.03 * p) + wob;          /* 外沿几乎恒定 */
    var h0 = cw * 0.20;
    var step = (hOut - h0) / (K - 1);

    var tier = Math.min(TIERS - 1, (p * TIERS) | 0);
    if (!tiers[tier]) tiers[tier] = [];
    var bucket = tiers[tier];
    for (k = 0; k < K; k++) bucket.push(cx, cy, h0 + k * step, co, si);

    /* 外圈：只画一段，制造「本可以不画」的缺席 */
    if (p > 0.62) {
      var h2 = hOut + cw * 0.055;
      var ax = h2 * co - h2 * si, ay = h2 * si + h2 * co;
      ctx.beginPath();
      ctx.moveTo(cx + ax, cy + ay);
      ctx.lineTo(cx - ax, cy - ay);
      ctx.strokeStyle = 'rgba(26,25,22,' + ((0.10 + 0.30 * p) * 0.38).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* 重音格：主题色实心方块 + 十字轴 */
    if (bp > 0.04 && p > 0.86) {
      var sq = cw * 0.105;
      ctx.fillStyle = rgba(accent, 0.10 + bp * 0.22);
      ctx.fillRect(cx - sq, cy - sq, sq * 2, sq * 2);
      var hh = cw * 0.30;
      ctx.beginPath();
      ctx.moveTo(cx - hh, cy); ctx.lineTo(cx + hh, cy);
      ctx.moveTo(cx, cy - hh); ctx.lineTo(cx, cy + hh);
      ctx.strokeStyle = rgba(accent, 0.14 + bp * 0.26);
      ctx.stroke();
    }
  }

  /* 逐档落笔 */
  for (var ti2 = 0; ti2 < TIERS; ti2++) {
    var b = tiers && tiers[ti2];
    if (!b || !b.length) continue;
    var pMid = (ti2 + 0.5) / TIERS;
    ctx.beginPath();
    for (k = 0; k < b.length; k += 5) ringPath(b[k], b[k + 1], b[k + 2], b[k + 3], b[k + 4]);
    ctx.strokeStyle = 'rgba(26,25,22,' + (0.10 + 0.30 * pMid).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  tiers = null;

  /* 3 · 已唱过的每一句：矩阵里留下一个实心主题色方块（系统记录） */
  var rowsUse = rowTop - rowBot;
  var dep = Math.min(idx + 1, 34);
  for (i = 0; i < dep; i++) {
    var rr = rowBot + Math.floor(hash(i * 1.37 + 0.11) * rowsUse);
    var cc = Math.floor(hash(i * 2.71 + 4.19) * N);
    var cell = rr * N + cc;
    var mx = GX[cell], my = GY[cell];
    var s2 = cw * (0.10 + hash(i * 0.73 + 2.2) * 0.05);
    ctx.fillStyle = rgba(accent, Math.max(0.26, 0.58 - i * 0.009));
    ctx.fillRect(mx - s2, my - s2, s2 * 2, s2 * 2);
  }

  /* 4 · 当前句在歌词带里留下的那一道：与格里的小方块同一个色 */
  if (idx >= 0) {
    var pr = clamp(curUnit(), 0.02, 1);
    ctx.fillStyle = rgba(accent, 0.55);
    ctx.fillRect(L.x + cw * 0.5, L.bandTop + 3, (L.side - cw) * pr, 2);
  }
}

function hash(x) {
  var s = Math.sin(x * 12.9898 + 78.233) * 43758.5453;
  return s - Math.floor(s);
}

function drawBeatRing(t) {
  var bp = beatPulse();
  if (bp < 0.03) return;
  var a = anim - beatAt;
  var cw = L.cw;
  var y0 = L.y + cw * 2, y1 = L.y + cw * (N - ROWS_LYR);
  var cx0 = L.x + L.side / 2, cy0 = (y0 + y1) / 2;
  var maxR = Math.max(cw * 2, Math.min(L.side / 2, (y1 - y0) / 2) * 0.98);
  var q = clamp(a / 1.5, 0, 1);

  ctx.save();
  ctx.beginPath();
  ctx.rect(L.x, y0, L.side, y1 - y0);
  ctx.clip();

  var r = maxR * (0.10 + q * 0.90);
  ctx.beginPath();
  ctx.arc(cx0, cy0, r, 0, TAU);
  ctx.strokeStyle = 'rgba(26,25,22,' + (bp * 0.13 * (1 - q)).toFixed(3) + ')';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx0, cy0, r * 0.72, 0, TAU);
  ctx.strokeStyle = rgba(accent, bp * 0.10 * (1 - q));
  ctx.stroke();

  ctx.restore();
}

function drawMarks() {
  var cw = L.cw;
  ctx.strokeStyle = 'rgba(26,25,22,.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(L.x + 0.5, L.y + 0.5, L.side - 1, L.side - 1);

  /* 曲目纸签的下沿：只画两端的短刻，中间留空 */
  var hy = L.y + cw * 2;
  ctx.strokeStyle = 'rgba(26,25,22,.28)';
  ctx.beginPath();
  ctx.moveTo(L.x, hy + 0.5); ctx.lineTo(L.x + cw * 1.2, hy + 0.5);
  ctx.moveTo(L.x + L.side - cw * 1.2, hy + 0.5); ctx.lineTo(L.x + L.side, hy + 0.5);
  ctx.stroke();

  /* 歌词带上边界：一条贯穿的实线 + 两端短刻 */
  var by = L.bandTop;
  ctx.beginPath();
  ctx.moveTo(L.x, by + 0.5);
  ctx.lineTo(L.x + L.side, by + 0.5);
  ctx.strokeStyle = 'rgba(26,25,22,.26)';
  ctx.stroke();

  ctx.strokeStyle = 'rgba(26,25,22,.34)';
  ctx.beginPath();
  ctx.moveTo(L.x, by - 4); ctx.lineTo(L.x, by + 4);
  ctx.moveTo(L.x + L.side, by - 4); ctx.lineTo(L.x + L.side, by + 4);
  ctx.stroke();

  /* 画心十字 */
  var cx0 = L.x + L.side / 2;
  var cy0 = L.y + cw * 2 + ((N - ROWS_LYR - 2) * cw) / 2;
  ctx.strokeStyle = 'rgba(26,25,22,.28)';
  ctx.beginPath();
  ctx.moveTo(cx0 - 5, cy0 + 0.5); ctx.lineTo(cx0 + 5, cy0 + 0.5);
  ctx.moveTo(cx0 + 0.5, cy0 - 5); ctx.lineTo(cx0 + 0.5, cy0 + 5);
  ctx.stroke();
}

function renderScene(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = SHEET;
  ctx.fillRect(L.x - 1, L.y - 1, L.side + 2, L.side + 2);

  ctx.save();
  ctx.beginPath();
  ctx.rect(L.x, L.y, L.side, L.side);
  ctx.clip();

  computeCells(t);
  drawBeatRing(t);
  drawField(t);

  if (grainPat) {
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = grainPat;
    ctx.fillRect(L.x, L.y, L.side, L.side);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawMarks();
}

/* ------------------------------------------------------------------ 8 循环 */
function emitReady() {
  if (readySent) return;
  readySent = true;
  try {
    if (window.parent) window.parent.postMessage({ __c100: 1, type: 'ready' }, '*');
    else console.error('[494] no parent window for ready');
  } catch (e) {
    console.error('[494] ready postMessage failed', e);
  }
}
setTimeout(emitReady, 1200);

var prevNow = 0;

function tickFrame(now) {
  frames++;
  emitReady();

  var t0 = performance.now();
  try {
    if (!prevNow) prevNow = t0;
    var dt = t0 - prevNow;
    if (!(dt > 0) || dt > 400) dt = 16.7;
    prevNow = t0;

    anim += (dt / 1000) * (RM ? 0.32 : (playing ? 1 : 0.42));
    if (TARGET_T > 0 && !playing) songT = TARGET_T;

    updateLyrics(songT);

    var budget = RM ? 60 : 24;
    if (t0 - lastSceneAt >= budget) {
      lastSceneAt = t0;
      renderScene(anim);
    }
  } catch (e) {
    console.error('[494] frame failed', e);
  }

  var cost = performance.now() - t0;
  jsEma = jsEma * 0.90 + cost * 0.10;

  window.requestAnimationFrame(tickFrame);
}

/* ------------------------------------------------------------------ 9 消息 */
function setText(el, s) {
  s = (s == null ? '' : String(s));
  if (el.textContent !== s) el.textContent = s;
}

function applyMeta(p) {
  var song = (p && p.song) || {};
  var name = (song.name == null ? '' : String(song.name)).trim();
  var artists = song.artists;
  if (Object.prototype.toString.call(artists) === '[object Array]') artists = artists.join(' / ');
  artists = (artists == null ? '' : String(artists)).trim();
  setText(ttlEl, name || '无题');
  setText(artEl, artists ? artists.toUpperCase() : '');
  artEl.style.display = artists ? 'block' : 'none';

  var cover = song.cover;
  if (typeof cover === 'string' && cover.trim()) {
    covImg.onload = function () { covImg.style.opacity = '1'; covPh.style.display = 'none'; };
    covImg.onerror = function () {
      console.error('[494] cover failed to load');
      covImg.style.opacity = '0'; covPh.style.display = 'block';
    };
    covImg.src = cover.trim();
  } else {
    covImg.removeAttribute('src');
    covImg.style.opacity = '0';
    covPh.style.display = 'block';
  }
}

function applyAccent(a) {
  if (!a || a.length < 3) return;
  var r = clamp(num(a[0], 32), 0, 255) | 0;
  var g = clamp(num(a[1], 32), 0, 255) | 0;
  var b = clamp(num(a[2], 32), 0, 255) | 0;
  accent = [r, g, b];
  /* 与墨色混合，保证在米白纸上仍是深色细线 */
  var mr = Math.round(r * 0.30 + INK[0] * 0.70);
  var mg = Math.round(g * 0.30 + INK[1] * 0.70);
  var mb = Math.round(b * 0.30 + INK[2] * 0.70);
  accentInk = 'rgba(' + mr + ',' + mg + ',' + mb + ',.62)';
}

function onInit(p) {
  if (!p || typeof p !== 'object') return;
  applyAccent(p.accent);
  applyMeta(p);

  LINES = normalizeLines(p.lines);
  settleDurations(num(p.duration, 0));
  idx = -1;
  curText = '';

  if (!LINES.length) {
    curEl.textContent = '';
    prevEl.textContent = '';
    nxtEl.textContent = '';
    spans = [];
    litCount = -1;
    empEl.style.display = 'block';
    setHtmlEmp();
    cntEl.textContent = '';
  } else {
    empEl.style.display = 'none';
    applyLine(-1);
  }

  if (p.playing === false) playing = false;
  else playing = true;

  var t = num(p.time, NaN);
  if (isFinite(t) && t >= 0) songT = t;
  else if (TARGET_T > 0) songT = TARGET_T;

  lastSceneAt = 0;
  updateLyrics(songT);
}

function setHtmlEmp() {
  if (!empEl.firstChild) {
    empEl.innerHTML = '<div>纯音乐</div><div style="opacity:.55;font-size:.52em;letter-spacing:.16em;margin-top:.9em">这首歌没有歌词</div>';
  }
}

window.addEventListener('message', function (ev) {
  try {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === 'init') onInit(p);
    else if (d.type === 'tick') {
      songT = Math.max(0, num(p.time, songT));
      playing = (p.playing !== false);
      if (TARGET_T > 0 && !playing) songT = TARGET_T;
    } else if (d.type === 'beat') {
      beatAt = anim;
      beatLvl = clamp(num(p.level, 0.6), 0, 1);
      if (!(beatLvl > 0)) beatLvl = 0.5;
    } else if (d.type === 'live') {
      if (typeof p.playing === 'boolean') playing = p.playing;
      var lv = clamp(num(p.level, 0), 0, 1);
      var bs = clamp(num(p.bass, 0), 0, 1);
      if (bs > 0.05 && beatLvl < bs) { beatAt = anim; beatLvl = bs * 0.8; }
      void lv;
    }
  } catch (e) {
    console.error('[494] message handler failed', e);
  }
}, false);

window.addEventListener('resize', function () {
  try { resize(); } catch (e) { console.error('[494] resize failed', e); }
}, false);

/* ------------------------------------------------------------------ 10 自检口 */
window.__stage = function () {
  return {
    lines: LINES.length,
    idx: idx,
    t: songT,
    playing: playing,
    frames: frames,
    js: jsEma,
    err: '',
    text: curText || '',
    gl: false,
    rm: RM
  };
};

/* ------------------------------------------------------------------ 11 启动 */
try {
  resize();
  if (TARGET_T > 0) onInit({ lines: [], duration: 0 });
  updateLyrics(songT);
} catch (e) {
  console.error('[494] boot failed', e);
}
window.requestAnimationFrame(tickFrame);

})();
</script>
</body>
