<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>347 · 红中之红</title>
<style>
  :root{--red:#d8120c;--cream:#fff3e4;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#a00a06}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
  @media (prefers-reduced-motion:reduce){
    .cur{animation:none!important}
    .cur .ch{transition:none!important}
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
  #art{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ui{position:absolute;inset:0;z-index:3;pointer-events:none;color:var(--cream)}
  .tag{position:absolute;font:700 clamp(8px,.68vw,11px)/1.5 "Helvetica Neue",Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase;opacity:.6;white-space:nowrap}
  .tag b{display:block;font-weight:800;letter-spacing:.2em;opacity:.95}
  .tag i{display:block;font-style:normal;font-size:.92em;letter-spacing:.24em;opacity:.5;margin-top:.35em}
  .tl{top:clamp(15px,3.4vh,38px);left:clamp(15px,3.2vw,44px)}
  .br{bottom:clamp(15px,3.4vh,38px);right:clamp(15px,3.2vw,44px);text-align:right;letter-spacing:.16em;max-width:40vw;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .vert{position:absolute;top:clamp(14px,4vh,46px);right:clamp(12px,2.6vw,40px);writing-mode:vertical-rl;font-weight:900;font-size:clamp(15px,2vw,29px);letter-spacing:.42em;opacity:.46;text-shadow:0 2px 24px rgba(60,0,0,.4)}
  #lyr{position:absolute;left:clamp(18px,5.4vw,96px);bottom:clamp(28px,9.5vh,92px);width:min(58vw,760px);z-index:4;color:var(--cream);padding-left:clamp(12px,1.5vw,22px);border-left:1px solid rgba(255,243,228,.26)}
  .slot{will-change:transform,opacity}
  .prev,.next{font-size:clamp(11px,1.2vw,17px);font-weight:600;line-height:1.7;letter-spacing:.03em;color:rgba(255,243,228,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prev{margin-bottom:.45em}
  .next{margin-top:.5em}
  .cur{font-size:clamp(26px,3.3vw,47px);line-height:1.4;font-weight:800;letter-spacing:.004em;word-break:break-word;text-wrap:balance;animation:lineIn .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes lineIn{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
  .cur .ch{transition:color .26s ease,opacity .26s ease;color:rgba(255,243,228,.34);text-shadow:0 1px 20px rgba(56,0,0,.5)}
  .cur .ch.on{color:#fff8ee;text-shadow:0 2px 30px rgba(38,0,0,.8)}
  .cur.empty{font-weight:600;letter-spacing:.28em;opacity:.66;font-size:clamp(15px,1.55vw,21px)}
  .cnt{margin-top:.85em;font:700 clamp(8px,.64vw,10px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.32em;opacity:.4}
  #progWrap{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(255,243,228,.16);z-index:4}
  #prog{height:100%;width:0%;background:rgba(255,243,228,.72)}
  @media (max-aspect-ratio:1/1){
    #lyr{width:80vw;left:6vw;bottom:15vh}
    .vert{writing-mode:horizontal-tb;top:clamp(12px,3vh,28px);right:5.5vw;font-size:clamp(11px,3.1vw,16px);letter-spacing:.4em;opacity:.55}
    .br{max-width:52vw}
    .cur{font-size:clamp(23px,6.4vw,38px);line-height:1.44}
    .tl{left:6vw}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="art"></canvas>
  <div class="ui">
    <div class="tag tl"><b>Nº 347</b><span>Red&nbsp;on&nbsp;Red</span><i>44 / 50</i></div>
    <div class="vert">紅中之紅</div>
    <div class="tag br" id="meta">—</div>
  </div>
  <div id="lyr">
    <div class="slot prev" id="prev"></div>
    <div class="slot cur" id="cur"></div>
    <div class="slot next" id="next"></div>
    <div class="cnt" id="cnt"></div>
  </div>
  <div id="progWrap"><div id="prog"></div></div>
</div>
<script>
(function(){
'use strict';
var DW=1440, DH=900;                       /* design space */
var art=document.getElementById('art');
var ctx=art.getContext('2d',{alpha:false});
var elCur=document.getElementById('cur');
var elPrev=document.getElementById('prev'), elNext=document.getElementById('next');
var elCnt=document.getElementById('cnt'), elMeta=document.getElementById('meta');
var elProg=document.getElementById('prog');
var S={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',gl:false,
       dur:0,song:{},accent:[232,18,12],rm:false,beat:0,beatLv:0,live:null,
       inited:false,_repaint:false};
var VW=1440,VH=900,DPR=1;
var rmq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
S.rm=!!(rmq&&rmq.matches);
if(rmq&&rmq.addEventListener)rmq.addEventListener('change',function(e){S.rm=!!e.matches;});

/* ---------- ready: first rAF + timer fallback, exactly once ---------- */
var readySent=false;
function ready(){
  if(readySent)return; readySent=true;
  try{parent.postMessage({__c100:1,type:'ready'},'*');}catch(e){}
}

/* ---------- canvas sizing (0 / NaN guard) ---------- */
function resize(){
  var w=Math.round(window.innerWidth||0), h=Math.round(window.innerHeight||0);
  if(!isFinite(w)||w<=0)w=DW; if(!isFinite(h)||h<=0)h=DH;
  var d=window.devicePixelRatio||1;
  if(!isFinite(d)||d<=0)d=1; d=Math.min(2,d);
  DPR=d; VW=w; VH=h;
  art.width=Math.max(1,Math.round(w*d));
  art.height=Math.max(1,Math.round(h*d));
  layout();
  S._repaint=true;
  dirty=true;
}
var dirty=true;
addEventListener('resize',resize,{passive:true});

/* ---------- colour ---------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function mix(a,b,k){return [clamp(Math.round(a[0]+(b[0]-a[0])*k),0,255),
                           clamp(Math.round(a[1]+(b[1]-a[1])*k),0,255),
                           clamp(Math.round(a[2]+(b[2]-a[2])*k),0,255)];}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function rgb(c){return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}

/* one palette, all red: value is the only lever */
var P={};
function palette(){
  var a=S.accent;
  var base=mix([216,18,12],a,0.16);
  P.base=base;
  P.bgHot=mix(base,[255,116,84],0.26);
  P.bg=mix(base,[240,44,26],0.10);
  P.bgEdge=mix(base,[96,4,2],0.74);
  P.hood=mix(base,[118,6,4],0.38);
  P.hoodLit=mix(base,[255,104,78],0.20);
  P.hoodDark=mix(base,[58,2,2],0.60);
  P.inner=mix(base,[22,0,0],0.92);
  P.skin=mix(base,[206,92,70],0.44);
  P.skinDark=mix(base,[86,8,5],0.52);
  P.rim=mix(a,[255,238,218],0.76);
  P.cream=[255,243,228];
}
palette();

/* ---------- texture (local asset, silent fallback) ---------- */
var texImg=new Image(), texOk=false, noiseCv=null;
texImg.onload=function(){texOk=true;dirty=true;};
texImg.onerror=function(){texOk=false;dirty=true;};
try{texImg.src='assets/347-canvas-grain.jpg';}catch(e){texOk=false;}
function noiseCvGet(){
  if(noiseCv)return noiseCv;
  var n=document.createElement('canvas'); n.width=n.height=160;
  var c=n.getContext('2d'), d=c.createImageData(160,160), i, v;
  for(i=0;i<d.data.length;i+=4){
    v=196+(Math.random()*58|0);
    d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255;
  }
  c.putImageData(d,0,0); noiseCv=n; return n;
}

/* ---------- layout of the figure (design units, head-anchored) ---------- */
var LY={s:1,x:760,y:360,portrait:false};
function layout(){
  var p=VH>VW*1.02;
  var headH = p? Math.min(VH*0.46, VW*1.10) : Math.min(VH*0.70, VW*0.46);
  var s=headH/620;
  if(!isFinite(s)||s<=0)s=1;
  s=clamp(s,0.22,3.2);
  LY.s=s; LY.portrait=p;
  LY.x=p? VW*0.52 : VW*0.615;
  LY.y=p? VH*0.30 : VH*0.395;
}

/* ---------- static background plate ---------- */
var bgCv=document.createElement('canvas'), bgCtx=bgCv.getContext('2d');
function buildBg(){
  var w=Math.max(2,Math.round(VW*DPR)), h=Math.max(2,Math.round(VH*DPR));
  if(bgCv.width!==w)bgCv.width=w;
  if(bgCv.height!==h)bgCv.height=h;
  var c=bgCtx, hx=LY.x, hy=LY.y;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,VW,VH);

  var lin=c.createLinearGradient(0,0,VW*0.55,VH*1.1);
  lin.addColorStop(0,rgb(P.bgHot));
  lin.addColorStop(0.48,rgb(P.bg));
  lin.addColorStop(1,rgb(mix(P.bg,P.bgEdge,0.85)));
  c.fillStyle=lin; c.fillRect(0,0,VW,VH);

  var R=Math.max(VW,VH)*0.86;
  var rad=c.createRadialGradient(hx,hy*0.9,0,hx,hy*0.9,R);
  try{
    rad.addColorStop(0,rgba(P.bgHot,0.58));
    rad.addColorStop(0.34,rgba(P.bg,0.14));
    rad.addColorStop(0.72,rgba(P.bgEdge,0.26));
    rad.addColorStop(1,rgba([62,2,1],0.58));
  }catch(e){}
  c.fillStyle=rad; c.fillRect(0,0,VW,VH);

  /* weft: the printed-canvas tooth, stretched once (no tiling seams) */
  try{
    if(texOk){
      c.save(); c.globalAlpha=0.20; c.globalCompositeOperation='overlay';
      c.drawImage(texImg,0,0,VW,VH); c.restore();
    }else{
      var pat=c.createPattern(noiseCvGet(),'repeat');
      if(pat){c.save(); c.globalAlpha=0.10; c.globalCompositeOperation='overlay';
              c.fillStyle=pat; c.fillRect(0,0,VW,VH); c.restore();}
    }
  }catch(e){}

  /* top-left key light bleed */
  var key=c.createLinearGradient(0,0,VW*0.7,VH*0.9);
  try{
    key.addColorStop(0,rgba([255,170,140],0.20));
    key.addColorStop(0.45,rgba([255,120,90],0.05));
    key.addColorStop(1,rgba([60,2,1],0.22));
  }catch(e){}
  c.fillStyle=key; c.fillRect(0,0,VW,VH);
}

/* ---------- data normalisation ---------- */
function normLines(arr){
  var out=[], i, L, chars, j, w, tot;
  if(!arr||!arr.length)return out;
  for(i=0;i<arr.length;i++){
    L=arr[i]; if(!L)continue;
    var tx=(L.text==null?'':String(L.text)).replace(/\s+/g,' ').trim();
    if(!tx)continue;
    var t=+L.t; if(!isFinite(t)||t<0)t=0;
    var dur=+L.dur; if(!isFinite(dur)||dur<=0)dur=0;
    var cs=[];
    if(L.chars&&L.chars.length){
      for(j=0;j<L.chars.length;j++){
        var c=L.chars[j];
        cs.push({c:(c&&c.c!=null?String(c.c):''),t:+(c&&c.t)});
      }
      for(j=0;j<cs.length;j++) if(!isFinite(cs[j].t))cs[j].t=t;
      /* monotonic repair */
      for(j=1;j<cs.length;j++) if(cs[j].t<cs[j-1].t)cs[j].t=cs[j-1].t;
      /* length mismatch → trust the text, drop per-char timing */
      if(cs.map(function(o){return o.c;}).join('').replace(/\s+/g,'')!==tx.replace(/\s+/g,'')){cs=null;}
    }else cs=null;
    if(!cs&&dur>0){
      cs=[]; var txt=tx.replace(/\s+/g,' ');
      tot=0;
      for(j=0;j<txt.length;j++){w=/[\u3000-\u9fff\uff00-\uffef]/.test(txt[j])?1:0.55;tot+=w;cs.push({c:txt[j],w:w});}
      var acc=0;
      for(j=0;j<cs.length;j++){cs[j].t=t+(dur*acc)/tot;acc+=cs[j].w;}
      for(j=0;j<cs.length;j++)delete cs[j].w;
    }
    out.push({t:t,dur:dur,text:tx,chars:cs});
  }
  out.sort(function(a,b){return a.t-b.t;});
  return out;
}

/* ---------- messages ---------- */
function onInit(p){
  p=p||{}; S.err=''; S.inited=true;
  S.song=(p.song&&typeof p.song==='object')?p.song:{};
  S.dur=+p.duration; if(!isFinite(S.dur)||S.dur<0)S.dur=0;
  var ac=p.accent;
  if(ac&&ac.length>=3){
    var a=Math.round(+ac[0]),b=Math.round(+ac[1]),c=Math.round(+ac[2]);
    if(isFinite(a)&&isFinite(b)&&isFinite(c))S.accent=[clamp(a,0,255),clamp(b,0,255),clamp(c,0,255)];
  }
  S.lines=normLines(p.lines);
  S.idx=-1;
  S.playing=(typeof p.playing==='boolean')?p.playing:true;   /* init without playing = playing */
  emptyPainted=false;
  lastPct=-1;
  elProg.style.width='0%';
  palette();
  elMeta.textContent=metaText();
  paint(S.idx);
  dirty=true;
}

function onTick(p){
  if(!p)return;
  var t=+p.time;                       /* accepted unconditionally (seek / track change) */
  if(isFinite(t))S.t=t;
  if(typeof p.playing==='boolean')S.playing=p.playing;
}

/* ---------- lyrics ---------- */
var curChars=[], curLine=null, curLit=-1, emptyPainted=false, lastPct=-1;

function pad2(n){return (n<10?'0':'')+n;}

function metaText(){
  var s=S.song||{}, a=s.artists;
  if(a&&a.join) a=a.filter(function(x){return x&&String(x).trim();}).join(' / ');
  else a=(a==null?'':String(a)).trim();
  var nm=(s.name==null?'':String(s.name)).trim();
  var out=[];
  if(a)out.push(a);
  if(nm)out.push(nm);
  return out.length?out.join('  —  '):'UNKNOWN';
}

function litCount(L,t){
  var ch=L&&L.chars;
  if(!ch||!ch.length)return 0;
  var lo=0,hi=ch.length-1,mid,res=-1;
  while(lo<=hi){mid=(lo+hi)>>1; if(ch[mid].t<=t+1e-3){res=mid;lo=mid+1;}else hi=mid-1;}
  return res+1;
}

function fitSize(L){
  var len=L.text.replace(/\s+/g,'').length;
  var base=LY.portrait? Math.min(VW*0.062,40) : Math.min(VW*0.0325,47);
  var f=len>18? Math.max(0.42,18/len) : 1;
  elCur.style.fontSize=Math.round(Math.max(14,base*f))+'px';
}

function buildChars(el,L){
  el.textContent='';
  curChars=[];
  var ch=L.chars;
  if(!ch||!ch.length){el.textContent=L.text;return;}
  var frag=document.createDocumentFragment(), i, sp;
  for(i=0;i<ch.length;i++){
    sp=document.createElement('span');
    sp.className='ch';
    sp.textContent=ch[i].c;
    frag.appendChild(sp);
    curChars.push(sp);
  }
  el.appendChild(frag);
}

function paintEmpty(){
  emptyPainted=true;
  elCur.className='slot cur empty';
  elCur.style.fontSize='';
  elCur.textContent='— 純 音 樂 —';
  elPrev.textContent=''; elNext.textContent='';
  elCnt.textContent='INSTRUMENTAL';
  curChars=[]; curLine=null; curLit=-1;
}

function paint(idx){
  var L=S.lines, n=L.length;
  if(!n){paintEmpty();return;}
  emptyPainted=false;
  elCur.className='slot cur';
  if(idx<0){
    curLine=null; curChars=[]; curLit=-1;
    elCur.textContent=''; elPrev.textContent='';
    elNext.textContent=L[0].text;
    elCnt.textContent='00 / '+pad2(n);
    return;
  }
  curLine=L[idx];
  elPrev.textContent = idx>0 ? L[idx-1].text : '';
  elNext.textContent = idx<n-1 ? L[idx+1].text : '';
  buildChars(elCur,curLine);
  elCnt.textContent = pad2(idx+1)+' / '+pad2(n);
  fitSize(curLine);
  elCur.style.animation='none';
  void elCur.offsetWidth;
  elCur.style.animation='';
  curLit=-1;
}

function updateIdx(){
  var L=S.lines, n=L.length;
  if(!n){S.idx=-1;return false;}
  var t=S.t, i=S.idx;
  if(i>=0&&i<n){
    var nxt=L[i+1];
    if(t>=L[i].t && (!nxt||t<nxt.t))return false;
  }
  var lo=0,hi=n-1,mid,res=-1;
  while(lo<=hi){
    mid=(lo+hi)>>1;
    if(L[mid].t<=t+1e-4){res=mid;lo=mid+1;}else{hi=mid-1;}
  }
  if(res!==S.idx){S.idx=res;return true;}
  return false;
}

function syncLyrics(){
  if(!S.lines.length){
    if(S.inited&&!emptyPainted)paintEmpty();
    return;
  }
  if(S._repaint){S._repaint=false;paint(S.idx);}
  if(updateIdx())paint(S.idx);
  if(curChars.length&&curLine){
    var lit=litCount(curLine,S.t), i, k, on;
    if(lit!==curLit){
      k=curChars.length;
      for(i=0;i<k;i++){
        on=i<lit;
        if(curChars[i]._on!==on){
          curChars[i]._on=on;
          curChars[i].className=on?'ch on':'ch';
        }
      }
      curLit=lit;
    }
  }
  var pct=S.dur>0?clamp(S.t/S.dur*100,0,100):0;
  if(Math.abs(pct-lastPct)>0.12){
    lastPct=pct;
    elProg.style.width=pct.toFixed(2)+'%';
  }
}

/* ---------- the sitter: red hoodie, hood down, eyes down ---------- */
function hoodPath(c){
  c.beginPath();
  c.moveTo(736,706);
  c.bezierCurveTo(694,552, 718,292, 848,184);
  c.bezierCurveTo(932,110, 1086,106, 1164,198);
  c.bezierCurveTo(1252,306, 1276,556, 1232,706);
  c.bezierCurveTo(1106,738, 852,738, 736,706);
  c.closePath();
}
function winPath(c){
  c.beginPath();
  c.moveTo(862,336);
  c.bezierCurveTo(882,256, 1098,250, 1110,352);
  c.bezierCurveTo(1118,470, 1074,566, 984,588);
  c.bezierCurveTo(898,576, 858,470, 862,336);
  c.closePath();
}
function shoulderPath(c){
  c.beginPath();
  c.moveTo(-260,1600);
  c.bezierCurveTo(-120,960, 400,652, 930,690);
  c.bezierCurveTo(1390,688, 1690,880, 1800,1140);
  c.lineTo(1900,1600);
  c.closePath();
}

var energy=0, beatAt=-1e5, beatLvl=0;
function pulse(now){
  var d=(now-beatAt)/380;
  if(d<0||d>1)return 0;
  return Math.pow(1-d,2)*beatLvl;
}

function drawGlow(now){
  var r=LY.s*660, k=0.10+energy*0.30+(S.rm?0:0.04*Math.sin(now*0.0009));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var g=ctx.createRadialGradient(LY.x,LY.y,0,LY.x,LY.y,r);
  g.addColorStop(0,rgba(P.bgHot,0.30+k*0.5));
  g.addColorStop(0.45,rgba(P.bgHot,0.10+k*0.22));
  g.addColorStop(1,rgba(P.bgHot,0));
  ctx.fillStyle=g;
  ctx.fillRect(LY.x-r,LY.y-r,r*2,r*2);
}

function drawFigure(now){
  var s=LY.s, bx=LY.x, by=LY.y;
  var bob=Math.sin(now*0.00040)*2.4 + (S.rm?0:Math.sin(now*0.0011)*0.8);
  var kick=pulse(now);
  var sway=(S.rm?0:Math.sin(now*0.00027)*1.6);
  ctx.setTransform(DPR*s,0,0,DPR*s, DPR*(bx-980*s+sway), DPR*(by-372*s+bob+kick*4));
  ctx.lineJoin='round';

  /* --- shoulders / the bulk of the hoodie --- */
  shoulderPath(ctx);
  var shg=ctx.createLinearGradient(200,700,1300,1600);
  shg.addColorStop(0,rgb(mix(P.hood,P.rim,0.14)));
  shg.addColorStop(0.42,rgb(P.hood));
  shg.addColorStop(1,rgb(P.hoodDark));
  ctx.fillStyle=shg; ctx.fill();

  /* seam + pocket read on the chest */
  ctx.save(); shoulderPath(ctx); ctx.clip();
  ctx.lineWidth=3; ctx.strokeStyle=rgba(P.hoodDark,0.55);
  ctx.beginPath(); ctx.moveTo(300,1400); ctx.bezierCurveTo(560,1180,760,1090,980,1086); ctx.stroke();
  ctx.lineWidth=2; ctx.strokeStyle=rgba(P.rim,0.10);
  ctx.beginPath(); ctx.moveTo(300,1370); ctx.bezierCurveTo(560,1150,760,1062,980,1058); ctx.stroke();
  /* folds falling off the shoulders */
  ctx.lineWidth=6; ctx.strokeStyle='rgba(38,0,0,.20)';
  ctx.beginPath(); ctx.moveTo(1082,776); ctx.bezierCurveTo(1176,832,1248,902,1288,982); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(902,796); ctx.bezierCurveTo(862,858,840,918,846,992); ctx.stroke();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,150,120,.10)';
  ctx.beginPath(); ctx.moveTo(1094,790); ctx.bezierCurveTo(1186,846,1256,914,1296,992); ctx.stroke();
  /* soft shadow the head throws on the chest */
  var chg=ctx.createRadialGradient(980,700,20,980,760,520);
  chg.addColorStop(0,'rgba(30,0,0,.62)');
  chg.addColorStop(0.55,'rgba(40,1,0,.20)');
  chg.addColorStop(1,'rgba(40,1,0,0)');
  ctx.fillStyle=chg; ctx.fillRect(400,560,1200,900);
  ctx.restore();

  /* --- hood --- */
  hoodPath(ctx);
  var hg=ctx.createLinearGradient(720,120,1260,760);
  hg.addColorStop(0,rgb(mix(P.hood,P.rim,0.34)));
  hg.addColorStop(0.38,rgb(P.hoodLit));
  hg.addColorStop(0.72,rgb(P.hood));
  hg.addColorStop(1,rgb(P.hoodDark));
  ctx.fillStyle=hg; ctx.fill();

  /* hood volume: shadow on the right, crease folds */
  ctx.save(); hoodPath(ctx); ctx.clip();
  var rsh=ctx.createLinearGradient(980,300,1300,700);
  rsh.addColorStop(0,'rgba(38,0,0,0)');
  rsh.addColorStop(1,'rgba(30,0,0,.55)');
  ctx.fillStyle=rsh; ctx.fillRect(760,80,560,700);
  ctx.lineCap='round';
  ctx.lineWidth=9; ctx.strokeStyle='rgba(40,0,0,.30)';
  ctx.beginPath(); ctx.moveTo(790,300); ctx.bezierCurveTo(760,430,772,580,806,700); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1204,290); ctx.bezierCurveTo(1232,430,1216,570,1188,700); ctx.stroke();
  ctx.lineWidth=6; ctx.strokeStyle='rgba(255,150,120,.10)';
  ctx.beginPath(); ctx.moveTo(824,300); ctx.bezierCurveTo(796,430,808,578,840,696); ctx.stroke();
  /* the crown catches the key light */
  var cg=ctx.createRadialGradient(930,190,10,940,230,300);
  cg.addColorStop(0,'rgba(255,176,146,.30)');
  cg.addColorStop(0.6,'rgba(255,140,110,.06)');
  cg.addColorStop(1,'rgba(255,120,90,0)');
  ctx.fillStyle=cg; ctx.fillRect(680,90,540,340);
  ctx.restore();

  /* --- the dark inside of the hood --- */
  winPath(ctx);
  ctx.save();
  ctx.fillStyle=rgb(P.inner); ctx.fill();
  ctx.clip();

  /* face, lit from the left, lower half sinking into shadow */
  var fg=ctx.createRadialGradient(918,438,20,948,448,310);
  fg.addColorStop(0,rgb(mix(P.skin,[255,168,136],0.20)));
  fg.addColorStop(0.42,rgb(P.skin));
  fg.addColorStop(0.78,rgb(P.skinDark));
  fg.addColorStop(1,rgb(P.inner));
  ctx.beginPath();
  ctx.ellipse(966,372,128,184,0,0,6.2832);
  ctx.fillStyle=fg; ctx.fill();

  /* under-chin drop shadow */
  var sg=ctx.createRadialGradient(978,604,8,978,604,190);
  sg.addColorStop(0,'rgba(24,0,0,.92)');
  sg.addColorStop(0.6,'rgba(26,0,0,.45)');
  sg.addColorStop(1,'rgba(26,0,0,0)');
  ctx.fillStyle=sg; ctx.fillRect(820,470,340,240);

  /* brim shadow across the brow — he is looking down */
  var bs=ctx.createLinearGradient(0,236,0,470);
  bs.addColorStop(0,'rgba(16,0,0,.95)');
  bs.addColorStop(0.5,'rgba(22,0,0,.72)');
  bs.addColorStop(0.82,'rgba(28,0,0,.24)');
  bs.addColorStop(1,'rgba(28,0,0,0)');
  ctx.fillStyle=bs; ctx.fillRect(820,220,340,270);

  /* eye sockets: shadow, not drawn eyes */
  var eg1=ctx.createRadialGradient(928,408,3,928,408,46);
  eg1.addColorStop(0,'rgba(16,0,0,.60)');
  eg1.addColorStop(0.55,'rgba(16,0,0,.32)');
  eg1.addColorStop(1,'rgba(16,0,0,0)');
  ctx.fillStyle=eg1; ctx.fillRect(878,362,102,94);
  var eg2=ctx.createRadialGradient(1020,404,3,1020,404,44);
  eg2.addColorStop(0,'rgba(16,0,0,.56)');
  eg2.addColorStop(0.55,'rgba(16,0,0,.28)');
  eg2.addColorStop(1,'rgba(16,0,0,0)');
  ctx.fillStyle=eg2; ctx.fillRect(972,360,98,90);
  /* lids, held low */
  ctx.strokeStyle='rgba(12,0,0,.42)'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(900,412); ctx.quadraticCurveTo(928,421,954,411); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(994,408); ctx.quadraticCurveTo(1020,417,1046,408); ctx.stroke();

  /* nose: lit ridge on the left, shadow on the right */
  var nl=ctx.createLinearGradient(908,340,952,492);
  nl.addColorStop(0,'rgba(255,186,154,0)');
  nl.addColorStop(0.55,'rgba(255,196,166,.26)');
  nl.addColorStop(1,'rgba(255,170,140,0)');
  ctx.beginPath();
  ctx.moveTo(916,368); ctx.bezierCurveTo(903,408,914,452,930,470);
  ctx.lineTo(941,466); ctx.bezierCurveTo(925,444,918,406,928,370);
  ctx.closePath(); ctx.fillStyle=nl; ctx.fill();
  ctx.fillStyle='rgba(20,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(958,486,26,12,0.15,0,6.2832); ctx.fill();

  /* mouth: barely there */
  ctx.fillStyle='rgba(42,2,1,.34)';
  ctx.beginPath(); ctx.ellipse(958,512,31,6.5,0.03,0,6.2832); ctx.fill();
  ctx.fillStyle='rgba(255,146,116,.12)';
  ctx.beginPath(); ctx.ellipse(958,523,23,4,0.03,0,6.2832); ctx.fill();

  /* jaw rim — the one hard edge that says "head" */
  var jg=ctx.createLinearGradient(880,470,940,556);
  jg.addColorStop(0,'rgba(255,196,164,0)');
  jg.addColorStop(0.5,'rgba(255,200,170,.34)');
  jg.addColorStop(1,'rgba(255,190,160,0)');
  ctx.lineWidth=3.4; ctx.strokeStyle=jg;
  ctx.beginPath(); ctx.moveTo(882,432); ctx.bezierCurveTo(888,500,916,540,948,552); ctx.stroke();

  ctx.restore();

  /* the brim, pulled low over the brow */
  ctx.beginPath();
  ctx.moveTo(862,336);
  ctx.bezierCurveTo(882,256, 1098,250, 1110,352);
  ctx.bezierCurveTo(1046,388, 916,388, 862,336);
  ctx.closePath();
  var bpg=ctx.createLinearGradient(0,246,0,374);
  bpg.addColorStop(0,rgb(mix(P.hood,P.rim,0.26)));
  bpg.addColorStop(0.45,rgb(P.hood));
  bpg.addColorStop(1,rgb(P.hoodDark));
  ctx.fillStyle=bpg; ctx.fill();
  ctx.lineWidth=2.4; ctx.strokeStyle='rgba(18,0,0,.5)';
  ctx.beginPath(); ctx.moveTo(862,336);
  ctx.bezierCurveTo(916,388,1046,388,1110,352); ctx.stroke();

  /* lit inner edge of the hood opening */
  winPath(ctx);
  var irg=ctx.createLinearGradient(860,300,1116,560);
  irg.addColorStop(0,'rgba(255,168,136,.34)');
  irg.addColorStop(0.42,'rgba(255,150,118,.12)');
  irg.addColorStop(1,'rgba(255,140,108,0)');
  ctx.lineWidth=4;
  ctx.strokeStyle=irg;
  ctx.stroke();

  /* --- drawstrings --- */
  ctx.lineCap='round';
  ctx.lineWidth=10; ctx.strokeStyle=rgb(P.hoodDark);
  ctx.beginPath(); ctx.moveTo(898,596); ctx.bezierCurveTo(884,656,876,704,884,748); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1074,588); ctx.bezierCurveTo(1092,648,1100,698,1088,742); ctx.stroke();
  ctx.lineWidth=3.2; ctx.strokeStyle=rgba(P.rim,0.26);
  ctx.beginPath(); ctx.moveTo(893,598); ctx.bezierCurveTo(880,656,872,704,879,746); ctx.stroke();
  ctx.fillStyle=rgb(mix(P.hoodDark,[255,200,170],0.25));
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(877,744,16,26,4) : ctx.rect(877,744,16,26); ctx.fill();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(1081,738,16,26,4) : ctx.rect(1081,738,16,26); ctx.fill();

  /* --- rim light along the hood's left contour --- */
  hoodPath(ctx);
  var rg=ctx.createLinearGradient(700,320,1010,620);
  rg.addColorStop(0,rgba(P.rim,0.90));
  rg.addColorStop(0.30,rgba(P.rim,0.34));
  rg.addColorStop(0.62,rgba(P.rim,0));
  rg.addColorStop(1,rgba(P.rim,0));
  ctx.lineWidth=6.5; ctx.strokeStyle=rg; ctx.stroke();

  /* rim on the shoulder line */
  var srg=ctx.createLinearGradient(-200,760,700,700);
  srg.addColorStop(0,rgba(P.rim,0.50));
  srg.addColorStop(0.35,rgba(P.rim,0.16));
  srg.addColorStop(1,rgba(P.rim,0));
  ctx.lineWidth=4; ctx.strokeStyle=srg;
  ctx.beginPath(); ctx.moveTo(-260,1600); ctx.bezierCurveTo(-120,960,400,652,930,690); ctx.stroke();
}

/* scrim: cream type needs a dark red floor, not another hue */
function drawScrim(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var g=ctx.createLinearGradient(0,VH*1.02, VW*0.72,VH*0.18);
  g.addColorStop(0,'rgba(38,1,0,.80)');
  g.addColorStop(0.42,'rgba(44,1,0,.52)');
  g.addColorStop(0.78,'rgba(48,2,0,.10)');
  g.addColorStop(1,'rgba(48,2,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
}

function drawScene(now,dt){
  try{
    energy += ((beatLvl*0.62 + (S.live?Math.max(0,Math.min(1,+S.live.level||0))*0.62:0) + pulse(now)*0.5) - energy)*0.10;
    if(!isFinite(energy))energy=0;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(bgCv,0,0);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawGlow(now);
    drawFigure(now);
    drawScrim();
  }catch(e){
    /* painting must never kill the clock */
    try{ctx.setTransform(1,0,0,1,0,0);}catch(e2){}
  }
}

/* ---------- loop ---------- */
var last=0;
function frame(now){
  var t0=performance.now();
  if(!last)last=now;
  if(dirty){dirty=false;layout();buildBg();}
  drawScene(now,0);
  syncLyrics();
  S.frames++;
  ready();
  S.js=performance.now()-t0;
  requestAnimationFrame(frame);
}

resize();
addEventListener('message',function(e){
  var d=e.data;
  if(!d||d.__c100!==1)return;
  if(d.type==='init')onInit(d.payload);
  else if(d.type==='tick')onTick(d.payload);
  else if(d.type==='beat'){
    var b=d.payload||{};
    S.beat=+b.index||0;
    var lv=+b.level; if(!isFinite(lv))lv=0.5;
    beatLvl=clamp(lv,0,1);
    beatAt=performance.now();
  }
  else if(d.type==='live'){
    var l=d.payload;
    S.live=(l&&typeof l==='object')?l:null;
  }
},{passive:true});

window.__stage=function(){
  return {lines:S.lines.length,idx:S.idx,t:S.t,playing:S.playing,frames:S.frames,
          js:S.js,err:S.err,text:(S.idx>=0&&S.lines[S.idx]?S.lines[S.idx].text:''),
          gl:S.gl,rm:S.rm};
};
requestAnimationFrame(frame);
setTimeout(ready,900);
setTimeout(ready,1500);
})();
</script>
