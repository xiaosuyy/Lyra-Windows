<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>507 · 赤金显影</title>
<style>
  /* 本地字体（编号前缀素材，零外链）：kurobara 尖角黑体 + 900 黑体补缺字 */
  @font-face{
    font-family:"507 D";
    src:url("assets/507-kurobara.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:block;
  }
  @font-face{
    font-family:"507 H";
    src:url("assets/507-han-black.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:block;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #cv{position:fixed;left:0;top:0;display:block;width:100%;height:100%}
  #hud{
    position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;
    font-family:"507 D","507 H","Arial Black","Impact","Microsoft YaHei",sans-serif;
    color:rgba(255,236,226,.46);letter-spacing:.28em;text-transform:uppercase;
    -webkit-font-smoothing:antialiased;
  }
  #hud .tl{position:absolute;left:4.6vw;top:4.8vh}
  #hud .t1{font-size:clamp(10px,.80vw,14px);opacity:.55;line-height:1.25}
  #hud .t2{font-size:clamp(8px,.58vw,11px);opacity:.28;margin-top:.8em;letter-spacing:.36em}
  #hud .br{
    position:absolute;right:4.6vw;bottom:5vh;font-size:clamp(9px,.62vw,12px);
    opacity:.26;letter-spacing:.32em;font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="tl"><div class="t1" id="hT"></div><div class="t2" id="hA"></div></div>
  <div class="br" id="hC"></div>
</div>
<script>
(function () {
  "use strict";

/* ============================================================
   507 chrome 引擎（WebGL2）
   ------------------------------------------------------------
   与参考图同一套原理：
     字形 → 距离场 → 「圆管/斜面」高度场 → 求法线
     → 法线查程序化 HDRI → 真实反射

   关键：笔画内部的法线也必须连续变化（笔画当成半圆柱），
   否则内部是平面，只会亮一圈边，永远不像铬。
   ============================================================ */
var CHROME = (function () {
  "use strict";

  var cv = document.createElement("canvas");
  var gl = null;
  var prog = null, vbo = null;
  var texShape = null;
  var U = {};
  var ok = false;
  var W = 2, H = 2;
  var lastErr = "";

  var VS = [
    "#version 300 es",
    "in vec2 aPos;",
    "out vec2 vUv;",
    "void main(){",
    "  vUv = aPos * 0.5 + 0.5;",
    "  gl_Position = vec4(aPos, 0.0, 1.0);",
    "}"
  ].join("\n");

  var FS = [
    "#version 300 es",
    "precision highp float;",
    "in vec2 vUv;",
    "out vec4 fragColor;",
    "",
    "uniform sampler2D uShape;",
    "uniform vec2  uRes;",
    "uniform float uDepth;",
    "uniform float uBevel;",
    "uniform float uPhase;",
    "uniform vec3  uRed;",
    "uniform float uGain;",
    "",
    "const float PI = 3.14159265;",
    "",
    "float S(vec2 uv){",
    "  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return 0.0;",
    "  return texture(uShape, uv).r;",
    "}",
    "",
    /* 用环采样估「到边缘的距离」：
       圆盘内平均覆盖率 e → 若边缘是直线，e 与 d 近似线性
       返回 0（贴边）.. 1（深处） */
    "float depthField(vec2 uv, float rad){",
    "  vec2 px = 1.0 / uRes;",
    "  float acc = 0.0;",
    "  float wsum = 0.0;",
    /* 两圈，内圈权重高 → 更平滑的距离过渡 */
    "  for (int ring = 0; ring < 2; ring++){",
    "    float rr = rad * (ring == 0 ? 0.55 : 1.0);",
    "    float wgt = (ring == 0 ? 1.35 : 0.75);",
    "    float sum = 0.0;",
    "    const int N = 12;",
    "    for (int i = 0; i < N; i++){",
    "      float a = (float(i) + 0.5) * (2.0 * PI / float(N));",
    "      sum += S(uv + vec2(cos(a), sin(a)) * px * rr);",
    "    }",
    "    acc += (sum / float(N)) * wgt;",
    "    wsum += wgt;",
    "  }",
    "  return clamp(acc / wsum, 0.0, 1.0);",
    "}",
    "",
    /* 程序化环境（摄影棚式）
       铬字正脸朝观众时，反射的是正前方一大片亮幕 —— 所以 d.y≈0 附近必须亮。
       之前的公式在中间留了黑带，导致字面大面积发暗。
       现在的层次：亮棚（主）+ 上下渐变 + 一条地脚亮线 + 少量暗部。 */
    "vec3 env(vec3 n){",
    "  vec3 d = normalize(n);",
    "",
    /*  正前方的大亮幕：这是一片高频反射区，占字面大部分 */
    "  float curtain = smoothstep(-0.55, -0.05, d.y) * smoothstep(0.72, 0.10, d.y);",
    "",
    /*  顶部天光（更亮一档） */
    "  float sky = smoothstep(0.30, 0.80, d.y);",
    "",
    /*  地平线附近的硬亮线：铬标志性的那道 */
    "  float horizon = exp(-pow((d.y - 0.10) / 0.040, 2.0));",
    "",
    /*  下方地脚反光，相位让它滑动 */
    "  float slide = uPhase * 2.0 - 1.0;",
    "  float lowBand = exp(-pow((d.y + 0.42 + slide * 0.30) / 0.16, 2.0));",
    "",
    /*  暗缝：只留很窄的一条，制造金属的层次，不要大面积 */
    "  float darkSeam = exp(-pow((d.y + 0.16) / 0.035, 2.0));",
    "",
    /*  侧向补光 */
    "  float sideGlow = pow(clamp(abs(d.x), 0.0, 1.0), 1.8) * 0.30;",
    "",
    "  float lit = curtain * 0.92",
    "            + sky * 0.85",
    "            + horizon * 1.60",
    "            + lowBand * 0.95",
    "            + sideGlow",
    "            - darkSeam * 0.62;",
    "",
    /*  基体：铬的暗部接近黑，但占比要小 */
    "  vec3 base   = vec3(0.035, 0.030, 0.028);",
    "  vec3 shadow = vec3(0.16, 0.125, 0.10);",
    "  vec3 warm   = vec3(0.88, 0.62, 0.24);",
    "  vec3 silver = vec3(0.97, 0.95, 0.90);",
    "  vec3 hot    = vec3(1.00, 0.995, 0.97);",
    "",
    "  vec3 col = base;",
    "  col = mix(col, shadow, clamp(lit * 1.5, 0.0, 1.0));",
    "  col = mix(col, warm,   smoothstep(0.34, 1.00, lit));",
    "  col = mix(col, silver, smoothstep(0.92, 1.32, lit));",
    "  col = mix(col, hot,    smoothstep(1.26, 1.62, lit));",
    "",
    /*  对比拉伸：铬的暗部要真的黑下去，亮部才炸得出来 */
    "  float lum = dot(col, vec3(0.299, 0.587, 0.114));",
    "  lum = smoothstep(0.12, 0.86, lum);",
    "  col = mix(col * 0.28, col * 1.32, lum);",
    "",
    /*  红色环境：下方染上来（参考图里字的下半部是红的） */
    "  float redLow = smoothstep(0.10, -0.95, d.y);",
    "  col += uRed * redLow * redLow * 0.70;",
    "",
    /*  极窄镜面尖光 */
    "  float spec = pow(clamp(d.y - 0.02, 0.0, 1.0), 26.0);",
    "  col += vec3(1.0, 1.0, 0.99) * spec * 1.45;",
    "",
    "  return col;",
    "}",
    "",
    /* 屏幕空间的环境补充：
       平直面朝观众时反射的是「整个房间」——地平线会横穿表面。
       只靠法线做不到这点（平面法线恒定 → 只有一个颜色），
       所以按屏幕高度再叠一层房室结构。这是对真实反射的近似，
       但正是让字面「不平」的关键。 */
    "vec3 roomAt(vec2 uv, vec3 base){",
    "  float y = uv.y;",
    /*  房间地平线：一条亮带横穿，位置随相位轻微移动 */
    "  float hz = 0.46 + (uPhase - 0.5) * 0.14;",
    "  float floorLine = exp(-pow((y - hz) / 0.012, 2.0));",
    "  float floorGlow = exp(-pow((y - hz) / 0.075, 2.0)) * 0.55;",
    /*  上方天花板暗区 */
    "  float ceil = smoothstep(hz, 1.02, y) * 0.55;",
    /*  下方地板亮区（抛光地面把光反上来） */
    "  float floorLit = smoothstep(hz, -0.05, y) * 0.42;",
    "",
    /*  一条条横向的柔光灯管：棚拍常见 */
    "  float strips = 0.0;",
    "  for (int i = 0; i < 3; i++){",
    "    float sy = hz + 0.18 + float(i) * 0.21;",
    "    strips += exp(-pow((y - sy) / 0.020, 2.0)) * (0.42 - float(i) * 0.10);",
    "  }",
    "",
    "  vec3 c = base;",
    "  c = mix(c, vec3(0.02, 0.018, 0.016), ceil * 0.75);",
    "  c = mix(c, vec3(0.98, 0.94, 0.86), floorGlow * 0.55);",
    "  c += vec3(1.0, 0.99, 0.95) * floorLine * 0.55;",
    "  c += vec3(0.90, 0.86, 0.78) * strips;",
    "  c = mix(c, c * 0.62 + base * 0.38, floorLit * 0.5);",
    "",
    /*  红场在下半部的地面反光里（参考图最明显的特征） */
    "  float redFloor = smoothstep(hz + 0.10, -0.15, y);",
    "  c += uRed * redFloor * 0.85;",
    "",
    "  return c;",
    "}",
    "",
    "void main(){",
    "  vec2 px = 1.0 / uRes;",
    "",
    /* ---------- ⅰ 挤出的侧面 ---------- */
    /*  挤出方向：正下方。参考图里字是正面朝观众、厚度全在底部。
       早期用右下斜向，会把字形整体推开，看起来像变胖 + 重影。 */
    "  vec2 exDir = vec2(0.0, 1.0);",
    "  float sideAlpha = 0.0;",
    "  float sideT = 0.0;",
    "  const int STEPS = 9;",
    "  for (int i = 0; i < STEPS; i++){",
    "    float t = (float(i) + 1.0) / float(STEPS);",
    "    vec2 off = exDir * px * (uDepth * t);",
    "    float c = S(vUv - off);",
    "    if (c > sideAlpha){ sideAlpha = c; sideT = t; }",
    "  }",
    "",
    /* ---------- ⅱ 正面 ---------- */
    "  float cover = S(vUv);",
    "  float rad = max(2.0, uBevel);",
    "  float dfield = depthField(vUv, rad);",
    "",
    /*  距离场 → 高度：笔画内部当成半圆柱，越靠中间越高 */
    "  float h = sqrt(clamp(dfield, 0.0, 1.0));",
    "",
    /*  法线 = 高度场梯度（用中心差分近似） */
    "  float dR = depthField(vUv + vec2(px.x * 2.0, 0.0), rad);",
    "  float dL = depthField(vUv - vec2(px.x * 2.0, 0.0), rad);",
    "  float dU = depthField(vUv + vec2(0.0, px.y * 2.0), rad);",
    "  float dD = depthField(vUv - vec2(0.0, px.y * 2.0), rad);",
    "",
    "  float gx = sqrt(clamp(dL,0.0,1.0)) - sqrt(clamp(dR,0.0,1.0));",
    "  float gy = sqrt(clamp(dD,0.0,1.0)) - sqrt(clamp(dU,0.0,1.0));",
    "",
    /*  倾斜强度：决定笔画「圆」到什么程度。
       太小 → 法线几乎都朝前 → 只反射地平线，整片发暗；
       太大 → 全部斜掉 → 亮带乱窜。2.6 是试出来的平衡点。 */
    "  float tilt = 2.6;",
    "  vec3 nFace = normalize(vec3(gx * tilt * (2.0 / max(2.0, uBevel)), gy * tilt * (2.0 / max(2.0, uBevel)), 1.0));",
    "",
    /* ---------- ⅲ 合成 ---------- */
    "  float a = max(cover, sideAlpha);",
    "  if (a < 0.02) { fragColor = vec4(0.0, 0.0, 0.0, 0.0); return; }",
    "",
    /*  侧面用固定法线（朝右下外侧），正面用高度场法线 */
    "  vec3 nSide = normalize(vec3(0.52, -0.62, 0.58));",
    "  vec3 n = normalize(mix(nFace, nSide, step(cover, 0.5) * 0.9));",
    "",
    "  vec3 col = env(n);",
    "",
    /*  再叠加屏幕空间房室反射（让朝观众的平面也有层次） */
    "  vec3 room = roomAt(vUv, col);",
    "  float flatness = clamp(n.z, 0.0, 1.0);",
    "  col = mix(col, room, flatness * 0.42);",
    "",
    /*  侧面越深越暗 */
    "  float isSide = (1.0 - cover) * step(0.02, sideAlpha);",
    "  col *= mix(1.0, 1.0 - sideT * 0.62, isSide);",
    "",
    /*  正面中心略微提亮，让金属有「鼓起来」的感觉 */
    "  col *= mix(0.92, 1.10, clamp(dfield * 1.4, 0.0, 1.0) * cover);",
    "",
    /*  倒角棱线：贴边一圈的硬高光 */
    "  float rim = smoothstep(0.30, 0.02, dfield) * cover;",
    "  col += vec3(1.0, 0.98, 0.93) * pow(rim, 1.15) * 0.85;",
    "",
    /*  金属表面细颗粒（参考图那种锈蚀感），很轻 */
    "  float g1 = fract(sin(dot(vUv * uRes, vec2(12.9898, 78.233))) * 43758.5453);",
    "  float g2 = fract(sin(dot(vUv * uRes * 1.7, vec2(39.346, 11.135))) * 24634.6345);",
    "  col *= 0.94 + (g1 * 0.6 + g2 * 0.4) * 0.13;",
    "",
    "  col *= uGain;",
    "  fragColor = vec4(clamp(col, 0.0, 1.0), a);",
    "}"
  ].join("\n");

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(s);
      gl.deleteShader(s);
      throw new Error("shader: " + log);
    }
    return s;
  }

  function init() {
    if (ok) return true;
    try {
      cv.width = 2; cv.height = 2;
      gl = cv.getContext("webgl2", {
        alpha: true, antialias: false, premultipliedAlpha: false,
        preserveDrawingBuffer: true, depth: false, stencil: false
      });
      if (!gl) { lastErr = "no webgl2"; return false; }

      var vs = compile(gl.VERTEX_SHADER, VS);
      var fs = compile(gl.FRAGMENT_SHADER, FS);
      prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.bindAttribLocation(prog, 0, "aPos");
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error("link: " + gl.getProgramInfoLog(prog));
      }
      gl.deleteShader(vs); gl.deleteShader(fs);

      vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

      U.shape = gl.getUniformLocation(prog, "uShape");
      U.res = gl.getUniformLocation(prog, "uRes");
      U.depth = gl.getUniformLocation(prog, "uDepth");
      U.bevel = gl.getUniformLocation(prog, "uBevel");
      U.phase = gl.getUniformLocation(prog, "uPhase");
      U.red = gl.getUniformLocation(prog, "uRed");
      U.gain = gl.getUniformLocation(prog, "uGain");

      texShape = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texShape);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      ok = true;
      return true;
    } catch (e) {
      ok = false;
      gl = null;
      lastErr = String((e && e.message) || e);
      return false;
    }
  }

  function uploadShape(canvas2d, w, h) {
    if (!ok || !gl) return false;
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }

    gl.bindTexture(gl.TEXTURE_2D, texShape);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas2d);
    return true;
  }

  /* 直接画到画布默认 framebuffer（画进 FBO 的话 canvas 永远是空的） */
  function render(opts) {
    if (!ok || !gl) return null;
    var phase = opts.phase || 0;
    var depth = opts.depth || 20;
    var bevel = opts.bevel || 5;
    var red = opts.red || [0.75, 0.06, 0.05];
    var gain = opts.gain == null ? 1 : opts.gain;

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texShape);
    gl.uniform1i(U.shape, 0);

    gl.uniform2f(U.res, W, H);
    gl.uniform1f(U.depth, depth);
    gl.uniform1f(U.bevel, bevel);
    gl.uniform1f(U.phase, phase);
    gl.uniform3f(U.red, red[0], red[1], red[2]);
    gl.uniform1f(U.gain, gain);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.finish();
    return cv;
  }

  return {
    get available() { return ok; },
    get error() { return lastErr; },
    init: init,
    upload: uploadShape,
    render: render,
    canvas: function () { return cv; }
  };
})();


  /* =========================================================
     507 · 赤金显影
     ---------------------------------------------------------
     同一句歌词有且只有两个完整状态，鼓点一到硬切 + 短促交叉：

     ① 未渲染态
        底：专辑封面主色做的平滑渐变（无任何纹理 / 噪点 / 颗粒）
        字：纯黑平涂，无描边、无高光

     ② 渲染态（鼓点触发）
        底：纯黑
        字：同比例挤出的 3D 立体金字
            —— 侧面（沿挤出方向由亮到暗）+ 正面（抛光金反射带）
            —— 左上受光棱、右下暗棱

     镜头：手持 —— 慢速推拉（前移后移）+ 低频漂移 + 微旋转，
            每拍再猛地推近一次，带一点滚动快门错位。

     几何全部在 bake 时一次性算好，每帧只做贴图。
     ========================================================= */

  /* ---------------- 0) 自检口：最外层、无条件 ---------------- */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "", song: null, duration: 0 };
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) { }

  window.__stage = function () {
    var i = S.idx;
    var ln = (i >= 0 && i < S.lines.length) ? S.lines[i] : null;
    return {
      lines: S.lines.length,
      idx: i,
      t: isFinite(S.t) ? S.t : 0,
      playing: !!S.playing,
      frames: S.frames,
      js: Math.round(S.js * 100) / 100,
      err: S.err || "",
      text: ln ? String(ln.text == null ? "" : ln.text) : "",
      gl: false,
      rm: RM
    };
  };

  /* ---------------- 1) ready：第一个 rAF 无条件发，只发一次 ------------- */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { console.error(e); }
  }
  requestAnimationFrame(sendReady);
  setTimeout(sendReady, 800);

  /* ---------------- 2) 小工具 ---------------- */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
  function mk(w, h, scale) {
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * scale));
    c.height = Math.max(1, Math.round(h * scale));
    return c;
  }
  function c2d(c, scale) {
    var g = c.getContext("2d");
    if (scale) g.setTransform(scale, 0, 0, scale, 0, 0);
    return g;
  }
  function C(rgb, a) {

      fg2.globalCompositeOperation = "source-atop";
      fg2.strokeStyle = light
        ? C([255, 246, 218], 0.04 + rnd(seed + s2 * 8.7) * 0.16)
        : C([40, 18, 5], 0.05 + rnd(seed + s2 * 9.3) * 0.18);
      fg2.lineWidth = 0.5 + rnd(seed + s2 * 6.1) * 1.6;
      fg2.beginPath();
      fg2.moveTo(lx, ly);
      fg2.lineTo(lx + ll, ly + (rnd(seed + s2 * 5.7) - 0.5) * 2);
      fg2.stroke();
      fg2.restore();
    }

    g.drawImage(face, 0, 0, w, h);

    /* --- 棱 ---
       左上：一亮线（金属被打亮的第一条棱），用金色而不是白，避免出白描边
       右下：一道暗线，把转折压下去（画在字内，用 source-atop 只作用在已有像素上） */
    g.save();
    g.globalCompositeOperation = "source-atop";
    g.globalAlpha = 0.55;
    var rimLc = mk(w, h, dpr), rlg = c2d(rimLc, dpr);
    rlg.drawImage(rimL, 0, 0, w, h);
    rlg.globalCompositeOperation = "source-in";
    rlg.fillStyle = C([255, 248, 226]);
    rlg.fillRect(0, 0, w, h);
    g.drawImage(rimLc, 0, 0, w, h);
    g.restore();

    g.save();
    g.globalCompositeOperation = "source-atop";
    g.globalAlpha = 0.45;
    var rimDc = mk(w, h, dpr), rdg = c2d(rimDc, dpr);
    rdg.drawImage(rimD, 0, 0, w, h);
    rdg.globalCompositeOperation = "source-in";
    rdg.fillStyle = C([24, 10, 2]);
    rdg.fillRect(0, 0, w, h);
    g.drawImage(rimDc, 0, 0, w, h);
    g.restore();

    return c;
  }

  /* ---------------- 9) 镜头（手持 + 前移后移） ---------------- */
  var cam = { x: 0, y: 0, rot: 0, zoom: 1, punch: 0, shear: 0, jitX: 0, jitY: 0 };
  var punchV = 0;

  function camStep(now, dt) {
    var t = now * 0.001;
    var k = RM ? 0.20 : 1;

    /* 推近 / 拉远：约 15 秒一个来回 */
    var dolly = Math.sin(t * 0.42 + 0.6);
    var dolly2 = Math.sin(t * 0.157 + 1.9);

    /* 手持：几个不同频率叠在一起，避免机械感 */
    var shakeX = (Math.sin(t * 0.43) * 0.68 + Math.sin(t * 1.31 + 2.1) * 0.30 + Math.sin(t * 3.7 + 0.7) * 0.10);
    var shakeY = (Math.sin(t * 0.37 + 1.3) * 0.60 + Math.sin(t * 1.07 + 0.4) * 0.28 + Math.sin(t * 4.3 + 1.9) * 0.09);
    var shakeR = (Math.sin(t * 0.29 + 2.7) * 0.7 + Math.sin(t * 0.83 + 1.1) * 0.3);

    var amp = Math.min(W, H) * 0.011 * k;
    cam.x = shakeX * amp;
    cam.y = shakeY * amp * 0.9;
    cam.rot = shakeR * 0.26 * k * Math.PI / 180;
    cam.zoom = 1.078 + dolly * 0.058 * k + dolly2 * 0.020 * k;

    cam.punch *= Math.exp(-dt * 6.2);
    cam.zoom += cam.punch;
    cam.shear = cam.punch * (RM ? 0.10 : 0.55);

    cam.jitX = cam.punch * Math.min(W, H) * 0.05 * (RM ? 0 : 1);
    cam.jitY = cam.punch * Math.min(W, H) * 0.010 * (RM ? 0 : 1);
  }

  function camApply(g, depth) {
    var d = depth == null ? 1 : depth;
    g.translate(W / 2 + cam.x * d + cam.jitX * d, H / 2 + cam.y * d + cam.jitY * d);
    g.rotate(cam.rot * d);
    var z = 1 + (cam.zoom - 1) * d;
    g.scale(z, z);
    if (cam.shear) g.transform(1, 0, cam.shear * d, 1, 0, 0);
    g.translate(-W / 2, -H / 2);
  }

  /* ---------------- 10) 鼓点 → 显影 ---------------- */
  var flash = { t0: -1e9, dur: 100, lvl: 0 };
  var lastBeatAt = -1e9, lastBpm = 0;

  function flashFactor(now) {
    var age = now - flash.t0;
    if (age < 0 || age > flash.dur) return 0;
    var x = age / flash.dur;
    /* 顶住 → 掉一下 → 再顶一下 → 平滑沉回（灯管接触不良那种双闪） */
    var f;
    if (x < 0.26) f = 1;
    else if (x < 0.36) { var a = (x - 0.26) / 0.10; f = 1 - 0.64 * a; }
    else if (x < 0.48) { var b = (x - 0.36) / 0.12; f = 0.36 + 0.56 * b; }
    else { var q = (x - 0.48) / 0.52; f = 0.92 * (1 - q * q * (3 - 2 * q)); }
    return f * (0.62 + 0.38 * flash.lvl);
  }

  function onBeat(index, level) {
    var lv = clamp(num(level, 0.5), 0, 1);
    if (!S.playing) return;
    lastBeatAt = performance.now();
    if (lv < 0.15) return;
    flash.t0 = performance.now();
    flash.lvl = lv;
    var dur = 150 + 170 * lv;
    if (lastBpm > 45 && lastBpm < 220) {
      var per = 60000 / lastBpm;
      dur = clamp(per * (0.40 + 0.24 * lv), 180, 430);
    }
    flash.dur = dur;
    punchV += 0.006 + 0.024 * lv + (index === 0 ? 0.014 : 0);
    if (punchV > 0.075) punchV = 0.075;
  }

  /* ---------------- 11) 主循环 ---------------- */
  var lastNow = performance.now();
  var errAt = 0;
  function reportErr(e) {
    var n = performance.now();
    if (n - errAt > 1000) {
      errAt = n;
      try { console.error(e); } catch (q) { }
      try { parent.postMessage({ __c100: 1, type: "error", payload: { msg: String((e && e.message) || e) } }, "*"); } catch (q2) { }
    }
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  function bakeNow() {
    layerDirty = false;
    if (!fontReady) return;
    var i = S.idx;
    var text = "", isTitle = false;
    if (i >= 0 && i < S.lines.length) {
      text = S.lines[i].text || "";
      if (!text) {
        text = (S.song && S.song.name) ? String(S.song.name) : "";
        isTitle = true;
      }
    } else {
      text = (S.song && S.song.name) ? String(S.song.name) : "";
      isTitle = true;
    }
    L = text ? bakeLayer(text, isTitle, isTitle ? -1 : i) : null;
  }

  function onLineChange() {
    prevL = L; prevA = prevL ? 1 : 0;
    L = null;
    bakeNow();
  }

  function fmtTime(sec) {
    sec = Math.max(0, num(sec, 0));
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  var hudT = document.getElementById("hT"), hudA = document.getElementById("hA"), hudC = document.getElementById("hC");
  var hudTxt = null, hudArt = null, hudClk = null;

  function draw(now, dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    camStep(now, dt);
    var ff = flashFactor(now);
    /* 两种状态硬切频闪（不做半透明混色，否则红底和金字会糊成一片）：
       ff > 0.5 就是「渲染态」，否则「未渲染态」 */
    var on = ff > 0.5;
    var phase = Math.floor(now / 96) % 3;

    /* ---- 底 ---- */
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    if (bgDirty) bakeBG();

    /* 渲染态：纯黑，什么都不画。未渲染态：封面主色渐变 */
    if (!on && bg) {
      ctx.save();
      camApply(ctx, 0.42);
      var pad = (bgW - W) / 2;
      ctx.drawImage(bg, -pad, -pad, bgW, bgH);
      ctx.restore();
    }

    /* ---- 上一句：只淡出，不缩放 ----
       缩放会把黑字在渐变底上叠成一团影子，看着像字发虚。
       未渲染底是亮渐变，黑字残影特别显眼，所以这里要干净。 */
    if (prevL && prevA > 0 && !on) {
      ctx.save();
      camApply(ctx, 1);
      ctx.globalAlpha = prevA * prevA * 0.85;
      var pcx = W / 2, pcy = H * (H > W ? 0.60 : 0.545);
      if (prevL.flat) ctx.drawImage(prevL.flat, pcx - prevL.w / 2, pcy - prevL.h / 2, prevL.w, prevL.h);
      ctx.restore();
      prevA -= dt * 5.2;
      if (prevA <= 0) { prevA = 0; prevL = null; }
    }

    /* ---- 当前句 ---- */
    if (L) {
      var inT = clamp((now - L.born) / 170, 0, 1);
      ctx.save();
      camApply(ctx, 1);
      ctx.globalAlpha = inT;

      var lcx = W / 2, lcy = H * (H > W ? 0.60 : 0.545);
      var sc = 1.030 - 0.030 * inT;
      ctx.translate(lcx, lcy);
      ctx.scale(sc, sc);
      ctx.translate(-lcx, -lcy);
      var x0 = lcx - L.w / 2, y0 = lcy - L.h / 2;

      /* 未渲染态：纯黑平面字 */
      if (!on) {
        ctx.drawImage(L.flat, x0, y0, L.w, L.h);
      } else {
        /* 渲染态：3D 立体金字 */
        ctx.drawImage(L.solid[phase], x0, y0, L.w, L.h);
      }

      ctx.restore();
    }

    /* ---- HUD ---- */
    var tn = (S.song && S.song.name) ? String(S.song.name) : "";
    var ar = "";
    if (S.song) {
      if (Array.isArray(S.song.artists)) ar = S.song.artists.filter(Boolean).join(" / ");
      else if (S.song.artists) ar = String(S.song.artists);
    }
    if (tn !== hudTxt) { hudTxt = tn; hudT.textContent = tn; }
    if (ar !== hudArt) { hudArt = ar; hudA.textContent = ar; }
    var dur = S.duration > 0 ? S.duration : 0;
    var clk = fmtTime(S.t) + (dur ? " / " + fmtTime(dur) : "");
    if (clk !== hudClk) { hudClk = clk; hudC.textContent = clk; }
  }

  function frame(now) {
    var js0 = performance.now();
    try {
      var dt = Math.min(0.06, (now - lastNow) / 1000);
      lastNow = now;

      if (S.playing) S.t += dt;

      /* 兜底呼吸：长期没有 beat 消息时按 bpm 自己给一点脉动 */
      if (S.playing && !RM && lastBpm > 40) {
        var per = 60000 / lastBpm;
        if (now - lastBeatAt > 1500 && now - flash.t0 > per) {
          flash.t0 = now; flash.dur = 90; flash.lvl = 0.24;
          punchV += 0.004;
        }
      }

      if (layerDirty && fontReady) bakeNow();

      var i = idxAt(S.t);
      if (i !== curIdx) { curIdx = i; S.idx = i; onLineChange(); }

      cam.punch += punchV; punchV = 0;
      if (cam.punch > 0.085) cam.punch = 0.085;

      draw(now, dt);
      S.frames++;
    } catch (e) {
      S.err = String((e && e.message) || e);
      reportErr(e);
    }
    S.js = performance.now() - js0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------------- 12) 消息 ---------------- */
  addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    try {
      if (d.type === "init") {
        S.song = p.song || null;
        S.duration = num(p.duration, 0);
        applyAccent(p.accent);

        S.lines = (Array.isArray(p.lines) ? p.lines : [])
          .filter(function (l) { return l && typeof l === "object"; })
          .map(function (l) {
            return {
              t: isFinite(Number(l.t)) ? Number(l.t) : 0,
              dur: isFinite(Number(l.dur)) ? Number(l.dur) : 0,
              text: (l.text == null ? "" : String(l.text)),
              chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null
            };
          })
          .sort(function (a, b) { return a.t - b.t; });

        S.playing = (typeof p.playing === "boolean") ? p.playing : true;
        curIdx = -2; L = null; prevL = null; prevA = 0; layerDirty = true;
        hudTxt = hudArt = hudClk = null;
      } else if (d.type === "tick") {
        var t = Number(p.time);
        if (isFinite(t)) S.t = t;                       // §5.3 无条件采纳
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") {
        onBeat(p.index, p.level);
      } else if (d.type === "live") {
        var b = num(p.bpm, 0);
        if (b > 40 && b < 260) lastBpm = b;
      }
    } catch (e) {
      S.err = String((e && e.message) || e);
      reportErr(e);
    }
  });

  /* ---------------- 13) 交互转发 ---------------- */
  var actAt = 0;
  addEventListener("mousemove", function () {
    var n = performance.now();
    if (n - actAt < 120) return;
    actAt = n;
    try { parent.postMessage({ __c100: 1, type: "activity" }, "*"); } catch (e) { }
  }, { passive: true });

  addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      try { e.preventDefault(); } catch (q) { }
      try { parent.postMessage({ __c100: 1, type: "key", payload: { key: "Space" } }, "*"); } catch (q2) { }
    }
  });

  addEventListener("resize", resize);
  resize();

  if (document.fonts && document.fonts.addEventListener) {
    try { document.fonts.addEventListener("loadingdone", function () { layerDirty = true; }); } catch (e) { }
  }
})();
</script>
</body>
