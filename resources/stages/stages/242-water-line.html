<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水位</title>
<!--
  机制：一条水位线横过画面，十万颗水面点（透视网格 + 多向正弦浪）在它下面起伏；
        字被这条线**真的切成上下两半** —— 上半截在水面之上（干、清晰），下半截在水下（DOM 复制的一份，
        用 clip-path 按同一条水位线切开，加 blur / 色散位移 / scaleY，像隔着水看）。
        水位随句子上浮一点，uAct 里暴涨过字顶（一次淹没）再退下去。
  用了：WebGL2 实例化（drawArraysInstanced，10 万水面点 = 10 万个实例，CPU 每帧只发 uniform）；
        浪高/透视/拍点换向全在顶点着色器里解析求出；水线位置一个 JS 变量同时驱动着色器与 DOM 的 clip-path。
        无 getImageData、无字形采样：字是真 DOM 文字，被 CSS 切开与水面对齐。
  最像的三个：174 池底的字（隔着水看字） / 205 字怀漫灌（字被水淹） / 013 水波涟漪歌词（水面波纹）
  差在哪：那三个的水是「贴在字上的滤镜」；这里水是一条**有高度的真实水位线**，字被它物理切成两半，
        上下两半走不同的光学路径（水下那半真的被剪开、模糊、色散），水位还会淹过字顶。
-->
<style>
  :root{--th:46%;--bh:54%}
  html,body{margin:0;height:100%;background:#02070c;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif;color:#eafcff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #type{position:fixed;inset:0;pointer-events:none;overflow:hidden;--lit:.25}
  .half{position:fixed;inset:0;overflow:hidden}
  .half.top{clip-path:inset(0 0 var(--bh) 0)}
  .half.bot{clip-path:inset(var(--th) 0 0 0)}
  .slot{position:absolute;inset:0;opacity:0;filter:blur(6px);z-index:2;isolation:isolate}
  .slot .in{position:absolute;left:50%;top:48.6%;width:min(88vw,1200px);text-align:center;
        transform:translate(-50%,-50%);
        font-weight:800;font-size:clamp(34px,6.5vh,92px);line-height:1.30;letter-spacing:.07em;
        color:#f2ffff;text-wrap:balance;white-space:pre-wrap;
        text-shadow:0 0 40px rgba(0,10,16,.92),0 3px 20px rgba(0,10,16,.96),0 1px 3px rgba(0,0,0,.85),
                    0 0 62px rgba(120,240,255,calc(var(--lit) * .30))}
  .slot .in span{display:inline-block;will-change:transform,opacity}
  /* 水下那一半：隔着水看 —— 降饱和偏青、轻微模糊、被水面折射错位（和上半截一眼分得开） */
  .half.bot .in{filter:blur(1.7px) saturate(.40) brightness(.84) contrast(1.02);
        color:#9ce4f0;
        text-shadow:2.2px 0 rgba(110,255,240,.42),-1.5px 0 rgba(180,225,255,.28),
                    0 0 40px rgba(0,14,22,.94),0 0 60px rgba(80,225,255,.34)}
  .half.bot .in span:nth-child(3n){text-shadow:1.5px 0 rgba(120,255,238,.50),-1.0px 0 rgba(195,235,255,.30),0 0 42px rgba(0,12,20,.92)}
  #vig{position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(110% 92% at 50% 52%,rgba(0,0,0,0) 38%,rgba(0,0,0,.70) 100%)}
  /* 水线高光：一条 2px 的波浪亮线，压在字上面 —— 「水在字上」全靠它 */
  #wlLine{position:fixed;inset:0;pointer-events:none;z-index:6;
       background:linear-gradient(90deg,rgba(190,255,255,0) 0%,rgba(215,255,255,.80) 10%,
                 rgba(150,245,255,.95) 50%,rgba(215,255,255,.80) 90%,rgba(190,255,255,0) 100%);
       filter:blur(.35px);mix-blend-mode:screen}
  #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);pointer-events:none;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(150,240,255,.32);transition:opacity .8s;white-space:nowrap}
  html.fb #c{display:none}
  html.fb body{background:linear-gradient(#030a12 0%,#061722 44%,#08242e 52%,#05161d 100%)}
  html.fb #type{z-index:1}
  /* CSS 降级：没有 WebGL2 时用水线 + 一圈圈水纹兜住画面 */
  html.fb body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.75;
    background:
      repeating-linear-gradient(0deg,rgba(120,240,255,.16) 0 1px,transparent 1px 14px),
      radial-gradient(120% 40% at 50% 47%,rgba(120,240,255,.10),transparent 62%),
      radial-gradient(60% 50% at 50% 88%,rgba(80,200,220,.16),transparent 70%)}
  html.fb body::after{content:'';position:fixed;left:0;right:0;top:var(--th);height:2px;
    background:linear-gradient(90deg,transparent,rgba(170,255,255,.7),transparent);pointer-events:none}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="type">
  <div class="half top" id="tTop"></div>
  <div class="half bot" id="tBot"></div>
</div>
<div id="vig"></div>
<div id="wlLine"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   A 车道内核（单文件内联，每个形态自带一份）
   协议 / 时钟 / 两句槽位（前奏·进场·余韵）/ 暂停冻结 / resize / RM / 降级
   形态只提供：片元与顶点着色器、配色、以及 stage 钩子
   ══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const typeBox = document.getElementById('type');
const tTop = document.getElementById('tTop');
const tBot = document.getElementById('tBot');
const wlLine = document.getElementById('wlLine');
const hint = document.getElementById('hint');
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';

const N = 100000;                 /* 10 万颗水面点，全部住在 GPU 上 */
let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, beatN = 0, bass = 0, treb = 0, beatAt = -9;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false, hintOn = true;
let inAmt = 0, preAmt = 0, act = 0, pol = 0, sweep = 1;
let cur = null, ghost = null, ghostAt = 0, slotFlip = 0, ghostStartV = 0;
let wlN = 0.08;                   /* 水位线（NDC y）：着色器与 DOM 的 clip-path 共用这一个数 */
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const ease3 = (x) => 1 - Math.pow(1 - x, 3);

/* prefers-reduced-motion：随时切换都要跟得上 */
let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) {
    RM = !!mq.matches;
    const onMQ = (e) => { RM = !!e.matches; skipToEnd(); };
    if (mq.addEventListener) mq.addEventListener('change', onMQ);
    else if (mq.addListener) mq.addListener(onMQ);
  }
} catch (_) {}
function skipToEnd() {
  if (cur && cur.chars) for (const c of cur.chars) { c.style.opacity = '1'; c.style.transform = 'none'; }
  if (cur && cur.charsB) for (const c of cur.charsB) { c.style.opacity = '1'; c.style.transform = 'none'; }
}

/* ---------------- 文字槽位：两句交替，旧句留残影（上下两半各一份） ---------------- */
function mkSlot() {
  const elT = document.createElement('div'); elT.className = 'slot';
  const elB = document.createElement('div'); elB.className = 'slot';
  const inT = document.createElement('div'); inT.className = 'in';
  const inB = document.createElement('div'); inB.className = 'in';
  elT.appendChild(inT); elB.appendChild(inB);
  tTop.appendChild(elT); tBot.appendChild(elB);
  return { els: [elT, elB], inners: [inT, inB], el: elT, inner: inT,
           chars: [], charsB: [], cx: [], t0: 0, voice: 0, dir: 1, noanim: false, text: '' };
}
const slots = [mkSlot(), mkSlot()];

function fillSlot(slot, text) {
  slot.inners[0].textContent = '';
  slot.inners[1].textContent = '';
  slot.chars = []; slot.charsB = []; slot.cx = [];
  const arr = Array.from(text);
  for (let i = 0; i < arr.length; i++) {
    const a = document.createElement('span'); a.textContent = arr[i]; a.style.opacity = '0';
    const b = document.createElement('span'); b.textContent = arr[i]; b.style.opacity = '0';
    slot.inners[0].appendChild(a); slot.inners[1].appendChild(b);
    slot.chars.push(a); slot.charsB.push(b);
  }
  slot.text = text;
  /* 每个字在画面里的 x（NDC）：水线扫到哪儿，字才浮上来 */
  for (const sp of slot.chars) {
    const r = sp.getBoundingClientRect();
    slot.cx.push((r.left + r.width / 2) / W * 2 - 1);
  }
}

function showLine(ci, instant) {
  const s = slots[slotFlip]; slotFlip ^= 1;
  if (cur && cur !== s) { ghost = cur; ghostAt = now(); ghostStartV = vT; }
  cur = s; ghost === s && (ghost = null);
  s.noanim = true;
  fillSlot(s, (lines[ci] || {}).text || '');
  s.t0 = instant ? now() - 2 : lines[ci].t;
  s.voice = ci % 3;
  s.dir = (ci % 2) ? 1 : -1;
  s.amb = ci % 2;
  for (const el of s.els) { el.style.zIndex = '3'; el.style.opacity = '1'; el.style.filter = 'none'; }
  if (ghost) for (const el of ghost.els) el.style.zIndex = '2';
  for (const c of s.chars) { c.style.opacity = instant ? '1' : '0'; c.style.transform = instant ? 'none' : ''; }
  for (const c of s.charsB) { c.style.opacity = instant ? '1' : '0'; c.style.transform = instant ? 'none' : ''; }
  hintOn = false; hint.style.opacity = '0';
}

function hideAll() {
  cur = null; ghost = null;
  for (const s of slots) { for (const el of s.els) el.style.opacity = '0'; s.chars = []; s.charsB = []; }
  hintOn = true; hint.style.opacity = '0.9';
}

/* ---------------- 时钟：空歌词 / seek / 句首 ---------------- */
function timing(T) {
  if (!lines.length) { if (idx !== -1) { idx = -1; hideAll(); } lastT = T; return; }
  let ci = -1;
  for (let i = lines.length - 1; i >= 0; i--) { if (T >= lines[i].t) { ci = i; break; } }
  if (ci !== idx) {
    const jump = (lastT > -1e8 && (Math.abs(T - lastT) > 0.9 || ci > idx + 1 || ci < idx));
    idx = ci;
    if (ci < 0) { hideAll(); }
    else showLine(ci, jump);
  }
  lastT = T;
}

/* ---------------- 每帧：uniform 状态（水位也在这里算，DOM 与着色器共用） ---------------- */
const ss = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
/* 水位线的波形：与 BG_FS / P_VS 里的 wave() 完全同一个式子（DOM 切口才能贴着那条亮线） */
const wave = (x, t) => 0.013 * Math.sin(x * 7.0 + t * 0.42)
                     + 0.0075 * Math.sin(x * 13.0 - t * 0.63)
                     + 0.004 * Math.sin(x * 23.0 + t * 0.31);
const NP = 26, _pT = [], _pB = [], _lT = [], _lB = [];
function state(T) {
  if (idx >= 0 && lines[idx]) {
    const lt = lines[idx].t;
    inAmt = clamp01((T - lt) / 1.10);
    const nx = lines[idx + 1];
    preAmt = nx ? clamp01(1 - (nx.t - T) / 0.30) : 0;
  } else { inAmt = 0; preAmt = 0; }
  act = (vT > 8.6 && vT < 12.4) ? 1 : 0;
  pol = beatN % 2;
  /* 水位：句子进场时抬一点；uAct 里整条线涨上去把这一行字淹掉（构图明显变化） */
  const flood = ss(10.35, 11.15, vT) * (1 - ss(11.85, 12.55, vT));
  wlN = 0.014 + 0.010 * inAmt + 0.040 * preAmt + 0.235 * flood;
  const rt = document.documentElement.style;
  rt.setProperty('--th', ((1 - wlN) * 50).toFixed(2) + '%');
  rt.setProperty('--bh', ((1 + wlN) * 50).toFixed(2) + '%');
  /* 把水位线采样成一条折线：上下两半的切口 + 一条 2px 的高光，三者共用同一条线 */
  _pT.length = 0; _pB.length = 0; _lT.length = 0; _lB.length = 0;
  for (let i = 0; i <= NP; i++) {
    const fx = i / NP, x = fx * 2 - 1;
    const py = (1 - (wlN + wave(x, vT))) * 0.5 * H;
    const sx = (fx * 100).toFixed(2) + '% ';
    _pT.push(sx + py.toFixed(1) + 'px');
    _pB.push(sx + py.toFixed(1) + 'px');
    _lT.push(sx + (py - 2.3).toFixed(1) + 'px');
    _lB.push(sx + (py + 2.1).toFixed(1) + 'px');
  }
  tTop.style.clipPath = 'polygon(0% 0%,100% 0%,' + _pB.slice().reverse().join(',') + ')';
  tBot.style.clipPath = 'polygon(' + _pT.join(',') + ',100% 100%,0% 100%)';
  if (wlLine) wlLine.style.clipPath = 'polygon(' + _lT.join(',') + ',' + _lB.slice().reverse().join(',') + ')';
  /* 字是「浮出水面」的：水线从左扫到右，扫到哪儿字才亮到哪儿 */
  sweep = idx >= 0 ? clamp01((inAmt * 1.10 - 0.02) / 0.95) : 0;
  sweep = clamp01(sweep + preAmt * 0.02);
  typeBox.style.setProperty('--lit', (0.22 + 0.78 * Math.max(beatPulse, inAmt * 0.7)).toFixed(3));
}

/* ---------------- 文字：逐字进场 / 残影（上下两半同步） ---------------- */
function updDom(T) {
  if (cur) {
    const stg = 0.030, dur = 0.50;
    for (let i = 0; i < cur.chars.length; i++) {
      const p = cur.noanim ? 1 : clamp01((T - (cur.t0 + i * stg)) / dur);
      const e = ease3(p);
      const vis = RM ? 1 : clamp01((sweep * 1.92 - 0.96 - (cur.cx[i] || 0)) / 0.055);
      let tr;
      if (cur.voice === 0) tr = 'translateY(' + ((1 - e) * 15).toFixed(2) + 'px) scale(' + (0.94 + 0.06 * e).toFixed(3) + ')';
      else if (cur.voice === 1) tr = 'translateX(' + ((1 - e) * -22 * cur.dir).toFixed(2) + 'px) rotate(' + ((1 - e) * -2.5 * cur.dir).toFixed(2) + 'deg)';
      else tr = 'translateY(' + ((1 - e) * -13).toFixed(2) + 'px) scaleY(' + (0.88 + 0.12 * e).toFixed(3) + ')';
      const c = cur.chars[i], cb = cur.charsB[i];
      c.style.transform = tr; c.style.opacity = (p * vis).toFixed(3);
      if (cb) {
        /* 水下那半的字：逐字错位 + 侧倾 —— 像隔着一层流动的水看，不是单纯模糊 */
        const wv = Math.sin(i * 0.95 + vT * 2.35) * 2.9 + Math.sin(i * 0.33 + vT * 1.15) * 1.5
                 + Math.sin(i * 1.70 - vT * 0.70) * 0.9;
        const ref = ' translateY(' + wv.toFixed(2) + 'px) skewX(' + (wv * 0.20).toFixed(2) + 'deg)';
        cb.style.transform = tr + ref; cb.style.opacity = (p * vis).toFixed(3);
      }
    }
    const blur = (1 - clamp01((T - cur.t0) / 0.38)) * 4.2;
    for (const el of cur.els) el.style.filter = 'blur(' + blur.toFixed(2) + 'px)';
    /* 前景层以 2.5× 跟着水线走；水下那半再多一点点折射位移 */
    const px = (sweep * 2 - 1) * 8, py = -beatPulse * 5;
    cur.inners[0].style.transform = 'translate(-50%,-50%) translate(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px) scale(' + (1 + beatPulse * 0.010).toFixed(4) + ')';
    cur.inners[1].style.transform = 'translate(-50%,-50%) translate(' + (px + 1.9).toFixed(2) + 'px,' + (py + beatPulse * 2.4 + 2.1).toFixed(2) + 'px) ' +
      'scale(' + (1 + beatPulse * 0.010 + 0.021).toFixed(4) + ') scaleY(1.062) skewX(-0.95deg)';
  }
  if (ghost) {
    const q = clamp01((T - ghostAt) / 0.80);
    if (q >= 1) { for (const el of ghost.els) el.style.opacity = '0'; ghost = null; }
    else {
      for (const el of ghost.els) {
        el.style.opacity = (0.26 * (1 - q) * (1 - q)).toFixed(3);
        el.style.filter = 'blur(' + (q * 12).toFixed(2) + 'px)';
      }
      for (const inn of ghost.inners) inn.style.transform = 'translate(-50%,-50%) translateY(' + (-q * 18).toFixed(2) + 'px) scale(' + (1 + q * 0.04).toFixed(3) + ')';
    }
  }
}

/* ══════════════════════════════ GPU ══════════════════════════════ */
const GL_OPT = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false,
  powerPreference: 'high-performance', preserveDrawingBuffer: false };
let gl = null, P = null, U = {}, bgP = null, bgU = {}, pVao = null, bgVao = null, glOk = false;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader');
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'link');
  return p;
}
function locs(p, names) { const o = {}; for (const n of names) o[n] = gl.getUniformLocation(p, n); return o; }

/* —— 背景：天色 + 水体 + 那条水位线（0.3× 速度的第一层） —— */
const BG_VS = `#version 300 es
in vec2 aQ; out vec2 vUV;
void main(){ vUV = aQ; gl_Position = vec4(aQ * 2.0 - 1.0, 0.0, 1.0); }`;
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform float uT; uniform vec2 uRes; uniform float uWL;
/* 水位线：3 个低频起伏 + 极慢漂移（与 JS 里的 wave() 同一个式子，DOM 的切口才和它严丝合缝） */
float wave(float x){ return 0.013*sin(x*7.0 + uT*0.42) + 0.0075*sin(x*13.0 - uT*0.63) + 0.004*sin(x*23.0 + uT*0.31); }
void main(){
  vec2 p = vUV;
  float y = p.y * 2.0 - 1.0;                     /* NDC y，与水位线同一坐标 */
  float wx = p.x * 2.0 - 1.0;
  float wl = uWL + wave(wx);
  float above = smoothstep(wl - 0.012, wl + 0.012, y);
  /* 天：墨青，越往上越暗 */
  vec3 sky = mix(vec3(0.010,0.038,0.055), vec3(0.004,0.012,0.022), smoothstep(wl, 1.0, y));
  /* 水：很深的一团青绿体积，越深越黑 */
  float dp = clamp((wl - y) * 0.55, 0.0, 1.0);
  vec3 wat = mix(vec3(0.012,0.050,0.058), vec3(0.002,0.012,0.020), dp);
  /* 水体里几团模糊的光斑（有体积感，不是一块平涂） */
  wat += vec3(0.020,0.070,0.080) * exp(-pow((y - wl + 0.30)*3.4, 2.0)) * (0.35 + 0.65*cos(wx*1.6 + uT*0.30));
  wat += vec3(0.014,0.048,0.056) * exp(-pow((y - wl + 0.72)*4.2, 2.0)) * (0.30 + 0.70*sin(wx*2.3 - uT*0.21));
  vec3 c = mix(wat, sky, above);
  /* 水线上的那条亮线（斜率修正后仍是 1–2px）+ 上下各自的辉光 */
  c += vec3(0.16,0.40,0.46) * exp(-pow((y - wl) * 130.0, 2.0));
  c += vec3(0.030,0.085,0.105) * exp(-pow((y - wl) * 6.2, 2.0));
  /* 泡沫唇：亮线之上再压一条更细更白的边，水面因此有「厚度」 */
  float lip = exp(-pow((y - wl - 0.012) * 240.0, 2.0));
  float tick = 0.52 + 0.48 * sin(p.x * 240.0 + 2.1 * sin(p.x * 23.0 + uT * 0.8));
  c += vec3(0.46,0.76,0.78) * lip * (0.40 + 0.60 * tick) * 0.80;
  /* 水下侧的接触阴影：水位线成为一条看得见的边 */
  c *= 1.0 - 0.46 * exp(-pow(max(0.0, wl - y) * 26.0, 1.15));
  /* 云层的极慢呼吸（0.3×） */
  c += vec3(0.010,0.028,0.038) * (0.5 + 0.5*sin(p.x*3.3 + uT*0.05)) * smoothstep(wl + 0.10, 1.0, y);
  o = vec4(c,1.0);
}`;

/* —— 粒子：10 万颗水面点（形态改这里）—— */
const P_VS = `#version 300 es
precision highp float;
in vec2 aQ; in vec4 aSeed;
uniform float uT, uBass, uTre, uBeat, uPre, uIn, uPol, uAct;
uniform vec2 uRes;
uniform vec4 uText;
uniform float uWL;
out vec2 vQ; out float vW; out vec3 vCol; out float vA;
/* 水位线的波形：与 BG_FS / JS 里的 wave() 同式 —— 水面点、亮线、DOM 切口三者对齐 */
float wave(float x){ return 0.013*sin(x*7.0 + uT*0.42) + 0.0075*sin(x*13.0 - uT*0.63) + 0.004*sin(x*23.0 + uT*0.31); }

void main(){
  float asp = uRes.x / uRes.y;
  vec2 w; vec3 col; float a; float vw = (aQ.y - 0.5) * 2.0;

  if (aSeed.z > 0.90) {
    /* 天上：极慢的高层碎光（0.3×；只在水线以上） */
    float dx = (aSeed.x - 0.5) * 2.0 * asp + 0.008*sin(uT*0.12 + aSeed.w*20.0);
    float dy = mix(uWL + wave(dx/asp) + 0.03, 1.02, aSeed.y) + 0.004*sin(uT*0.09 + aSeed.x*30.0);
    w = vec2(dx, dy);
    float r = 0.0018 + aSeed.w*0.0026;
    w += (aQ - 0.5) * r * 2.0;
    a = (0.020 + 0.055*aSeed.w) * (1.0 + 0.5*uTre);
    col = vec3(0.72,0.97,1.0);
  } else if (aSeed.z < 0.115) {
    /* 水下悬浮微粒：极小的点，随水缓慢下沉 / 漂移，让水体有体积 */
    float sx0 = (aSeed.x - 0.5) * 2.0 * asp;
    float surf0 = uWL + wave(sx0/asp);
    float dep = mix(0.02, 1.0, aSeed.y);                /* 0=水面 / 1=画面底 */
    float dx = sx0 + 0.030*sin(uT*0.19 + aSeed.w*17.0) + 0.012*sin(uT*0.07 + aSeed.w*41.0);
    float dy = mix(surf0 - 0.02, -1.02, dep) - 0.010*sin(uT*0.14 + aSeed.x*23.0);
    w = vec2(dx, dy);
    float r = 0.0012 + aSeed.w*0.0016;
    w += (aQ - 0.5) * r * 2.0;
    a = (0.016 + 0.052*aSeed.w) * (1.0 + 0.55*uTre) * (1.0 - 0.45*dep);
    col = mix(vec3(0.30,0.78,0.78), vec3(0.78,1.0,1.0), aSeed.w);
  } else {
    /* 水面：透视压缩的水点网格，越靠水线越密 */
    float t  = pow(aSeed.y, 1.85);                     /* 0=水线 / 1=画面底 */
    float sx = (aSeed.x - 0.5) * 2.0 * asp;
    float persp = 0.18 + 0.82*t;
    /* 多向正弦浪：远端频率高、近端频率低 */
    float k  = 5.2 / (0.35 + 0.65*t);
    float ph = sx * k + uT * (1.10 + 0.45*sin(uT*0.11));
    float hgt = sin(ph) * 0.55 + sin(ph*1.73 + 1.31) * 0.30 + sin(ph*0.61 - 0.7) * 0.15;
    /* 拍点：一道大涌浪从右扫到左（uPol 换向 ← →） */
    float dir = mix(1.0, -1.0, uPol);
    float swell = sin((sx*1.15 - dir*uT*1.25) * 2.0);
    float amp = (0.010 + 0.072*t) * (0.65 + 0.75*uBass);
    float surf = uWL + wave(sx/asp);
    float yy = surf - (1.0 - surf) * t + (hgt*0.62 + swell*0.55) * amp;
    w = vec2(sx, yy);

    /* 浪尖亮、浪谷暗；再加一条贴着水线的泡沫带 */
    float crest = smoothstep(-0.2, 0.9, hgt);
    float foam  = exp(-pow(t*8.5, 2.0));
    float spec  = pow(clamp(hgt*0.5 + 0.5, 0.0, 1.0), 7.0) * (0.7 + 0.6*uTre);
    float b = 0.05 + crest*0.70 + foam*0.80 + spec*0.95 + 0.35*smoothstep(0.35,0.95,t);
    b *= 0.85 + 0.40*uBeat;
    b *= 1.0 - 0.30*smoothstep(surf - 0.06, surf + 0.06, yy);   /* 水线以上没有水点 */
    /* 字区：水面在字下面翻出更亮的一圈（字压着水） */
    vec2 tw = vec2(uText.x*asp, uText.y);
    vec2 dh = vec2(max(0.08,uText.z*asp)*1.15, max(0.05,uText.w)*1.9);
    float din = length((w - tw)/dh);
    b *= 1.0 + 0.55*smoothstep(1.25, 0.55, din);

    float r = 0.0016 + aSeed.w*0.0022 + 0.0012*foam;
    w += (aQ - 0.5) * r * 2.0;
    a = b * 0.105;
    col = mix(vec3(0.16,0.72,0.86), vec3(0.90,1.0,1.0), clamp(b*0.9, 0.0, 1.0));
  }
  gl_Position = vec4(w.x/asp, w.y, 0.0, 1.0);
  vQ = aQ; vW = vw; vA = a; vCol = col;
}`;

const P_FS = `#version 300 es
precision highp float;
in vec2 vQ; in float vW; in vec3 vCol; in float vA; out vec4 o;
void main(){
  float aw = abs(vW);
  float core = 1.0 - smoothstep(0.30, 1.0, aw);
  float halo = 0.26 * (1.0 - smoothstep(0.55, 1.0, aw));
  float f = max(core, halo) * (1.0 - smoothstep(0.85, 1.0, abs(vQ.x-0.5)*2.0));
  o = vec4(vCol * vA * f, 1.0);
}`;

function initGL() {
  try { gl = cv.getContext('webgl2', GL_OPT); } catch (_) { gl = null; }
  if (!gl) { document.documentElement.classList.add('fb'); return false; }
  P = program(P_VS, P_FS);
  U = locs(P, ['uT','uBass','uTre','uBeat','uPre','uIn','uPol','uAct','uRes','uText','uWL']);
  bgP = program(BG_VS, BG_FS);
  bgU = locs(bgP, ['uT','uRes','uWL']);

  const quad = new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

  /* 分层抽样（Halton）保证 10 万点铺得均匀，不结块 */
  const hal = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
  let sd = 20260242;
  const rnd = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
  const seeds = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    seeds[i*4] = hal(i + 1, 2); seeds[i*4+1] = hal(i + 1, 3);
    seeds[i*4+2] = rnd(); seeds[i*4+3] = rnd();
  }
  const sb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);

  pVao = gl.createVertexArray(); gl.bindVertexArray(pVao);
  const aQ = gl.getAttribLocation(P, 'aQ'), aS = gl.getAttribLocation(P, 'aSeed');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(aQ); gl.vertexAttribPointer(aQ, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.enableVertexAttribArray(aS); gl.vertexAttribPointer(aS, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(aS, 1);

  bgVao = gl.createVertexArray(); gl.bindVertexArray(bgVao);
  const bQ = gl.getAttribLocation(bgP, 'aQ');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(bQ); gl.vertexAttribPointer(bQ, 2, gl.FLOAT, false, 0, 0);

  gl.bindVertexArray(null);
  gl.clearColor(0.006, 0.020, 0.030, 1);
  gl.disable(gl.DEPTH_TEST);
  glOk = true;
  return true;
}

let uTextV = [0, 0, 0.3, 0.05];
function draw() {
  if (!glOk) return;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.useProgram(bgP); gl.bindVertexArray(bgVao);
  gl.uniform1f(bgU.uT, vT); gl.uniform2f(bgU.uRes, W, H); gl.uniform1f(bgU.uWL, wlN);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.useProgram(P); gl.bindVertexArray(pVao);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.uniform1f(U.uT, vT); gl.uniform1f(U.uBass, bass); gl.uniform1f(U.uTre, treb);
  gl.uniform1f(U.uBeat, beatPulse); gl.uniform1f(U.uPre, preAmt); gl.uniform1f(U.uIn, inAmt);
  gl.uniform1f(U.uPol, pol); gl.uniform1f(U.uAct, act);
  gl.uniform2f(U.uRes, W, H); gl.uniform4f(U.uText, uTextV[0], uTextV[1], uTextV[2], uTextV[3]);
  gl.uniform1f(U.uWL, wlN);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);
  gl.bindVertexArray(null);
}

/* ---------------- 尺寸 ---------------- */
function resize() {
  W = Math.max(2, window.innerWidth); H = Math.max(2, window.innerHeight);
  PR = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * PR); cv.height = Math.round(H * PR);
  if (glOk) { gl.viewport(0, 0, cv.width, cv.height); }
  dirty = true;
}
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });

function textRect() {
  if (!cur || !cur.chars.length) return [0, wlN, 0.34, 0.05];
  const r = cur.inners[0].getBoundingClientRect();
  return [ (r.left + r.width/2) / W * 2 - 1, 1 - (r.top + r.height/2) / H * 2,
           Math.max(0.02, r.width / W), Math.max(0.02, r.height / H) ];
}

/* ══════════════════════════════ 主循环 ══════════════════════════════ */
let last = performance.now(), raf = 0, dirty = true;
function frame(ms) {
  const js0 = performance.now();
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
  last = ms; frames++;
  const T = now();
  /* 视觉时钟 = 歌词时钟（seek 时画面与字一起重建；暂停时一起冻住） */
  vT = RM ? T * 0.24 : T;
  if (playing) {
    beatPulse *= Math.exp(-dt * 3.6);
    bass *= Math.exp(-dt * 0.08);
    treb *= Math.exp(-dt * 0.10);
  }
  try { timing(T); } catch (e) { errMsg = 'timing: ' + (e && e.message ? e.message : e); }
  state(T);
  if (!RM && cur) uTextV = textRect();
  try {
    if (playing || dirty) { draw(); updDom(T); dirty = false; }
  } catch (e) { errMsg = 'draw: ' + (e && e.message ? e.message : e); }
  if (!readySent) { readySent = true; try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {} }
  jsMs = performance.now() - js0;
  raf = requestAnimationFrame(frame);
}

/* ---------------- 协议 ---------------- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', (e) => {
  ping();
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    idx = -1; lastT = -1e9;
    cur = null; ghost = null;
    for (const s of slots) { for (const el of s.els) el.style.opacity = '0'; s.chars = []; s.charsB = []; }
    vT = 0; beatPulse = 0; bass = 0; treb = 0; beatN = 0; beatAt = -9;
    clockT = 0; clockAt = performance.now(); playing = true;
    inAmt = 0; preAmt = 0;
    hint.style.opacity = lines.length ? '0.9' : '0.4';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    dirty = true;
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    playing = !!d.payload.playing; dirty = true;
  } else if (d.type === 'beat') {
    beatPulse = Math.min(1, beatPulse + 0.32 + (d.payload.level || 0) * 0.5);
    beatN++; dirty = true;
  } else if (d.type === 'live') {
    const l = d.payload || {};
    if (typeof l.bass === 'number') bass = Math.max(bass, clamp01(l.bass));
    if (typeof l.treble === 'number') treb = Math.max(treb, clamp01(l.treble));
    if (typeof l.level === 'number') beatPulse = Math.max(beatPulse, Math.min(0.9, l.level * 0.8));
  }
});
addEventListener('pagehide', () => cancelAnimationFrame(raf));

/* ---------------- 自查 ---------------- */
window.__stage = () => ({
  lines: lines.length, idx: idx, t: +now().toFixed(2), playing: playing, frames: frames,
  js: +jsMs.toFixed(2), err: errMsg, text: (idx >= 0 && lines[idx]) ? lines[idx].text : '',
  gl: glOk, rm: RM, vT: +vT.toFixed(2), wl: +wlN.toFixed(3)
});

/* ---------------- 启动 ---------------- */
resize();
try { initGL(); } catch (e) { errMsg = 'gl: ' + (e && e.message ? e.message : e); document.documentElement.classList.add('fb'); }
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
