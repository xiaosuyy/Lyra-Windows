<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>焦散玻璃</title>
<!--
  机制：十万块菱形玻璃砖砌成一面**暗墙**，墙前一块看不见的镜片把左上那盏灯聚成一块光池 ——
        焦散只落在这块光池里，池外全是近黑；池里的亮丝是**折射率场的等值线**：
        法线与折射率来自一张真的 3D 纹理（32³ 值噪声，`gl.texImage3D` + `texture(sampler3D, p)`），
        等值线取高次幂压出细亮脉络，池的边缘是一圈最亮的焦散弧。字在黑场里，光池的弧扫到它的下缘才把它照亮。
  用了：WebGL2 实例化（drawArraysInstanced，10 万菱形砖 = 10 万实例，CPU 每帧只发 uniform）；
        `gl.texImage3D` 建 32³ 体纹理（TEXTURE_3D / LINEAR 三线性采样），顶点着色器里 3 次 `texture()` 取场值与梯度；
        拍点：折射率跳一档 + 灯位换边；uAct：光池骤然收成一个亮点（焦距拉满）。
        无 getImageData、无字形采样：字是真 DOM 文字，只被光池的弧「切」到。
  最像的三个：173 厚玻璃（字在玻璃后面被折射） / 216 薄透镜光路（光路与焦点） / 192 引力透镜歌词（像被掰弯）
  差在哪：那三个是整片玻璃/整条光路的宏观模型，亮是全场均匀的；这里是**十万块各自不同法线的微砖**，
        光被一块看不见的镜片聚成一块有限的光池，池外是黑场 —— 焦散是「有边界、会游走、会收成一个点」的。
-->
<style>
  html,body{margin:0;height:100%;background:#010204;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif;color:#eaf4ff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #type{position:fixed;inset:0;pointer-events:none;overflow:hidden;--lit:.25}
  .slot{position:absolute;left:50%;top:33%;width:min(88vw,1180px);text-align:center;
        transform:translate(-50%,-50%);opacity:0;filter:blur(6px);z-index:2;isolation:isolate}
  .slot::before{content:'';position:absolute;inset:-110% -14%;z-index:-1;pointer-events:none;
        background:radial-gradient(46% 30% at 50% 50%,rgba(1,3,8,.70) 0%,rgba(1,3,8,.30) 52%,rgba(1,3,8,0) 78%)}
  .slot .in{display:block;font-weight:800;font-size:clamp(36px,7.0vh,96px);line-height:1.26;
        letter-spacing:.055em;color:#f4faff;text-wrap:balance;white-space:pre-wrap;
        -webkit-text-stroke:.4px rgba(210,240,255,.40);
        text-shadow:1.4px 0 0 rgba(90,160,255,.30),-1.4px 0 0 rgba(255,255,255,.16),
                    0 0 40px rgba(0,0,0,.94),0 3px 20px rgba(0,0,0,.96),
                    0 0 60px rgba(130,190,255,calc(var(--lit) * .34))}
  .slot .in span{display:inline-block;will-change:transform,opacity}
  #vig{position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(104% 88% at 50% 56%,rgba(0,0,0,0) 40%,rgba(0,0,0,.74) 100%)}
  #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);pointer-events:none;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(150,196,255,.30);transition:opacity .8s;white-space:nowrap}
  html.fb #c{display:none}
  html.fb body{background:radial-gradient(120% 92% at 40% 78%,#0c1830 0%,#05080f 58%,#010204 100%)}
  html.fb #type{z-index:1}
  /* CSS 降级：没有 WebGL2 时用一层菱形暗纹 + 一块手绘的光池兜住画面 */
  html.fb body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.7;
    background:
      repeating-linear-gradient(45deg,rgba(120,175,255,.10) 0 1px,transparent 1px 11px),
      repeating-linear-gradient(-45deg,rgba(120,175,255,.07) 0 1px,transparent 1px 11px),
      radial-gradient(34% 30% at 46% 68%,rgba(150,205,255,.34),rgba(90,150,235,.10) 46%,transparent 72%)}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="type"></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   A 车道内核（单文件内联，每个形态自带一份）
   协议 / 时钟 / 两句槽位（前奏·进场·余韵）/ 暂停冻结 / resize / RM / 降级
   形态只提供：片元与顶点着色器、配色、以及 stage 钩子
   ══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const typeBox = document.getElementById('type');
const hint = document.getElementById('hint');
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';

const N = 100000;                 /* 10 万块砖，全部住在 GPU 上 */
let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, beatN = 0, bass = 0, treb = 0, beatAt = -9;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false, hintOn = true;
let inAmt = 0, preAmt = 0, act = 0, pol = 0, sweep = 1, foc = 0, mf = 0;
let cur = null, ghost = null, ghostAt = 0, slotFlip = 0, ghostStartV = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const ease3 = (x) => 1 - Math.pow(1 - x, 3);

/* prefers-reduced-motion：随时切换都要跟得上 */
let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) {
    RM = !!mq.matches;
    const onMQ = (e) => { RM = !!e.matches; skipToEnd(); };
    if (mq.addEventListener) mq.addEventListener('change', onMQ);
    else if (mq.addListener) mq.addListener(onMQ);
  }
} catch (_) {}
function skipToEnd() { if (cur && cur.chars) for (const c of cur.chars) { c.style.opacity = '1'; c.style.transform = 'none'; } }

/* ---------------- 文字槽位：两句交替，旧句留残影 ---------------- */
function mkSlot() {
  const el = document.createElement('div'); el.className = 'slot';
  const inner = document.createElement('div'); inner.className = 'in';
  el.appendChild(inner); typeBox.appendChild(el);
  return { el, inner, chars: [], cx: [], t0: 0, voice: 0, dir: 1, noanim: false, text: '' };
}
const slots = [mkSlot(), mkSlot()];

function fillSlot(slot, text) {
  slot.inner.textContent = '';
  slot.chars = [];
  slot.cx = [];
  const arr = Array.from(text);
  for (let i = 0; i < arr.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = arr[i];
    sp.style.opacity = '0';
    slot.inner.appendChild(sp);
    slot.chars.push(sp);
  }
  slot.text = text;
  /* 每个字在画面里的 x（NDC）：光池扫到哪儿，字才被照亮 */
  for (const sp of slot.chars) {
    const r = sp.getBoundingClientRect();
    slot.cx.push((r.left + r.width / 2) / W * 2 - 1);
  }
}

function showLine(ci, instant) {
  const s = slots[slotFlip]; slotFlip ^= 1;
  if (cur && cur !== s) { ghost = cur; ghostAt = now(); ghostStartV = vT; }
  cur = s; ghost === s && (ghost = null);
  s.el.style.transform = 'translate(-50%,-50%)';
  fillSlot(s, (lines[ci] || {}).text || '');
  s.noanim = true;
  s.t0 = instant ? now() - 2 : lines[ci].t;
  s.voice = ci % 3;
  s.dir = (ci % 2) ? 1 : -1;
  s.amb = ci % 2;
  s.el.style.zIndex = '3';
  if (ghost) ghost.el.style.zIndex = '2';
  s.el.style.opacity = '1';
  s.el.style.filter = 'none';
  for (const c of s.chars) { c.style.opacity = instant ? '1' : '0'; c.style.transform = instant ? 'none' : ''; }
  hintOn = false; hint.style.opacity = '0';
}

function hideAll() {
  cur = null; ghost = null;
  for (const s of slots) { s.el.style.opacity = '0'; s.chars = []; }
  hintOn = true; hint.style.opacity = '0.9';
}

/* ---------------- 时钟：空歌词 / seek / 句首 ---------------- */
function timing(T) {
  if (!lines.length) { if (idx !== -1) { idx = -1; hideAll(); } lastT = T; return; }
  let ci = -1;
  for (let i = lines.length - 1; i >= 0; i--) { if (T >= lines[i].t) { ci = i; break; } }
  if (ci !== idx) {
    const jump = (lastT > -1e8 && (Math.abs(T - lastT) > 0.9 || ci > idx + 1 || ci < idx));
    idx = ci;
    if (ci < 0) { hideAll(); }
    else showLine(ci, jump);
  }
  lastT = T;
}

/* ---------------- 每帧：uniform 状态 ---------------- */
function state(T) {
  if (idx >= 0 && lines[idx]) {
    const lt = lines[idx].t;
    inAmt = clamp01((T - lt) / 1.10);
    const nx = lines[idx + 1];
    preAmt = nx ? clamp01(1 - (nx.t - T) / 0.30) : 0;
  } else { inAmt = 0; preAmt = 0; }
  act = (vT > 8.6 && vT < 12.4) ? 1 : 0;
  pol = beatN % 2;
  /* 三段循环（13s 一轮）：一块游走的光斑 → 焦距拉满收成一点 → 镜片翻面，裂成左右两块光池 */
  const CYC = 13.0, cyc = vT % CYC;
  foc = cyc < 4.40 ? 0 : cyc < 5.20 ? (cyc - 4.40) / 0.80 : cyc < 8.10 ? 1 : cyc < 8.70 ? (8.70 - cyc) / 0.60 : 0;
  mf = cyc < 8.40 ? 0 : cyc < 9.40 ? (cyc - 8.40) / 1.00 : cyc < 12.40 ? 1 : cyc < CYC ? (CYC - cyc) / 0.60 : 0;
  act = (foc > 0.05 || mf > 0.05) ? 1 : 0;
  /* 焦散锋面：这一句从左扫到右；前奏 300ms 里镜片先偏一点 */
  sweep = idx >= 0 ? clamp01((inAmt * 1.10 - 0.02) / 0.95) : 0;
  sweep = clamp01(sweep + preAmt * 0.02);
  typeBox.style.setProperty('--lit', (0.22 + 0.78 * Math.max(beatPulse, inAmt * 0.7)).toFixed(3));
}

/* ---------------- 文字：逐字进场 / 残影 ---------------- */
function updDom(T) {
  if (cur) {
    const stg = 0.030, dur = 0.50;
    for (let i = 0; i < cur.chars.length; i++) {
      const p = cur.noanim ? 1 : clamp01((T - (cur.t0 + i * stg)) / dur);
      const e = ease3(p);
      const c = cur.chars[i];
      /* 光池的弧没扫到之前字是暗的：字是被光照出来的，不是淡入的 */
      const vis = RM ? 1 : clamp01((sweep * 1.92 - 0.96 - (cur.cx[i] || 0)) / 0.055);
      if (cur.voice === 0) c.style.transform = 'translateY(' + ((1 - e) * 12).toFixed(2) + 'px) scale(' + (1.12 - 0.12 * e).toFixed(3) + ')';
      else if (cur.voice === 1) c.style.transform = 'translateX(' + ((1 - e) * 18 * cur.dir).toFixed(2) + 'px) scaleY(' + (1.16 - 0.16 * e).toFixed(3) + ')';
      else c.style.transform = 'translateY(' + ((1 - e) * -14).toFixed(2) + 'px) scaleX(' + (0.90 + 0.10 * e).toFixed(3) + ')';
      c.style.opacity = (p * vis).toFixed(3);
    }
    cur.el.style.filter = 'blur(' + ((1 - clamp01((T - cur.t0) / 0.38)) * 4.2).toFixed(2) + 'px)';
    /* 前景层以 2.5× 跟着焦散锋面走，拍上被顶一下 */
    const px = (sweep * 2 - 1) * 9, py = -beatPulse * 5;
    cur.el.style.transform = 'translate(-50%,-50%) translate(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px) scale(' + (1 + beatPulse * 0.012).toFixed(4) + ')';
  }
  if (ghost) {
    const q = clamp01((T - ghostAt) / 0.78);
    if (q >= 1) { ghost.el.style.opacity = '0'; ghost = null; }
    else {
      ghost.el.style.opacity = (0.24 * (1 - q) * (1 - q)).toFixed(3);
      ghost.el.style.filter = 'blur(' + (q * 12).toFixed(2) + 'px)';
      ghost.el.style.transform = 'translate(-50%,-50%) translateY(' + (-q * 18).toFixed(2) + 'px) scale(' + (1 + q * 0.05).toFixed(3) + ')';
    }
  }
}

/* ══════════════════════════════ GPU ══════════════════════════════ */
const GL_OPT = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false,
  powerPreference: 'high-performance', preserveDrawingBuffer: false };
let gl = null, P = null, U = {}, bgP = null, bgU = {}, pVao = null, bgVao = null, glOk = false;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader');
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'link');
  return p;
}
function locs(p, names) { const o = {}; for (const n of names) o[n] = gl.getUniformLocation(p, n); return o; }

/* —— 背景：一面几乎全黑的石墙，左上留一点灯的余晖（0.3× 速度的第一层） —— */
const BG_VS = `#version 300 es
in vec2 aQ; out vec2 vUV;
void main(){ vUV = aQ; gl_Position = vec4(aQ * 2.0 - 1.0, 0.0, 1.0); }`;
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform float uT; uniform vec2 uRes;
void main(){
  vec2 p = vUV;
  vec3 c = mix(vec3(0.0035,0.0055,0.0100), vec3(0.0070,0.0110,0.0195), smoothstep(0.0, 0.9, p.y));
  /* 左上的灯：极弱的一团余晖，几乎不参与构图 */
  float lamp = exp(-pow((p.x-0.10)*3.0,2.0) - pow((p.y-0.02)*3.4,2.0));
  c += vec3(0.040,0.062,0.100) * lamp * (0.80 + 0.20*sin(uT*0.28));
  c *= 1.0 - 0.42*smoothstep(0.52,1.30,length((p-0.5)*vec2(1.05,1.20))*2.0);
  o = vec4(c,1.0);
}`;

/* —— 粒子：10 万块菱形玻璃砖，光只在池里（形态改这里）—— */
const P_VS = `#version 300 es
precision highp float;
precision highp sampler3D;
in vec2 aQ; in vec4 aSeed;
uniform float uT, uBass, uTre, uBeat, uPre, uIn, uPol, uAct, uFoc, uMf;
uniform vec2 uRes;
uniform vec4 uText;
uniform sampler3D uN;              /* 32³ 体纹理：折射率场 */
out vec2 vQ; out vec3 vCol; out float vA;
out float vH; out float vCt; out float vBend; out float vPool;

const float GX = 316.0, GY = 316.0;

vec2 nz(vec2 v){ float l = length(v); return l < 1e-5 ? vec2(1.0,0.0) : v/l; }

void main(){
  float asp = uRes.x / uRes.y;
  /* —— 砖格：340×300 里铺满，每格一块菱形砖 —— */
  vec2 g = aSeed.xy * vec2(GX, GY);
  vec2 cell = floor(g);
  vec2 jit = fract(g) - 0.5;
  vec2 cw = vec2(2.0*asp/GX, 2.0/GY);
  vec2 cen = vec2((cell.x + 0.5 + jit.x*0.18)*cw.x - asp,
                  (cell.y + 0.5 + jit.y*0.18)*cw.y - 1.0);
  vec2 uv = (cell + 0.5) / vec2(GX, GY);

  /* —— 3D 体纹理：折射率场 h0，梯度当法线（真·体纹理，不是解析公式） —— */
  vec3 tp = vec3(uv * 1.85, 0.5) + vec3(0.0, 0.0, uT*0.017);
  float h0 = texture(uN, tp).r;
  float hx = texture(uN, tp + vec3(0.030, 0.0, 0.0)).r;
  float hy = texture(uN, tp + vec3(0.0, 0.030, 0.0)).r;
  vec3 n = normalize(vec3((h0-hx)*3.0, (h0-hy)*3.0, 0.45));

  /* —— 光池：镜片把灯聚成一块会游走的光斑；uFoc 焦距拉满 → 收成一个亮点；
        uMf 镜片翻面 → 裂成左右两块光池（构图从「一块」变成「一对」） —— */
  float aEnv = uFoc;
  vec2 pcd = vec2(0.44 + 0.52*cos(uT*0.50), -0.150 + 0.13*sin(uT*0.37));
  /* 焦距拉满时那块光斑跳到右上角去（灯位也跟着偏），字面上彻底空出来 */
  vec2 pc = mix(pcd, vec2(0.50, 0.30), aEnv);
  float pr = (0.86 + 0.06*sin(uT*0.29)) * mix(1.0, 0.62, aEnv);
  /* 翻面后的第二块：位置是主池的镜像，竖向压扁一点，两块各占画面一边 */
  vec2 pc2 = vec2(-(0.28 + 0.44*cos(uT*0.50)), 0.02 + 0.10*sin(uT*0.37 + 1.9));
  float pr2 = pr * 0.76;
  vec2 q1 = (cen - pc) / (vec2(1.12, 0.80) * pr);
  vec2 q2 = (cen - pc2) / (vec2(1.00, 0.70) * pr2);
  float pd1 = length(q1), pd2 = length(q2);
  float w2 = smoothstep(0.04, 0.92, uMf);
  float pool1 = smoothstep(1.02, 0.62, pd1);
  float pool2 = smoothstep(1.02, 0.62, pd2) * w2;
  float pool = max(pool1, pool2);
  vec2 q = (pool2 > pool1) ? q2 : q1;
  float pd = (pool2 > pool1) ? pd2 : pd1;
  /* 池边：不再是一整圈匀亮的描边 —— 只在「上缘 + 左缘」两段亮，其余断开渐隐 */
  float ang = atan(q.y, q.x);
  float segA = 0.5 + 0.5 * cos(ang - 1.95);              /* 上偏左 */
  float segB = 0.5 + 0.5 * cos(ang * 2.0 + 2.35);        /* 左下一小段 */
  float rimA = pow(clamp(segA, 0.0, 1.0), 7.0) * (0.55 + 0.45*segB);
  float rimB = pow(clamp(segB, 0.0, 1.0), 13.0) * 0.55;
  float rim = rimA * 1.85 + rimB;
  float arc = smoothstep(0.955, 0.9995, pd) * smoothstep(1.045, 0.9995, pd) * rim;

  /* —— 池内的脉络：等值线的「参数」交给片元 —— */
  /* h0 在砖内是插值的，片元里取等值线才能细到 1–2px；在顶点里取只会得到砖块大的疙瘩 */
  float ct = atan(q.y, q.x) * 0.15915;                   /* -0.5..0.5 圈 */
  float bend = 0.55 / (0.30 + pd);
  vH = h0; vCt = ct; vBend = dot(n.xy, vec2(0.6,-0.8)) * bend; vPool = pool;

  /* 拍点：一次曝光留下的一圈扩散焦散环（脉冲衰减 = 环在长大） */
  float ringR = mix(0.10, 1.06, 1.0 - uBeat);
  float ring = exp(-pow((pd - ringR) * 8.5, 2.0)) * uBeat * 1.35;

  /* 焦散尖点（cusp）：光池里最亮的一小撮，bass 一抖它就跳一下 */
  vec2 cus = pc + vec2(0.13 * sin(uT * 2.10) + 0.05 * uBass, 0.09 * cos(uT * 1.70) - 0.04 * uBass);
  vec2 cd = (cen - cus) / vec2(0.085, 0.062);
  float cuspA = exp(-pow(length(cd), 2.0)) * (1.0 + 1.5 * uBass);
  /* 翻面后第二块池的尖点：两处亮一起烧 */
  vec2 cus2 = pc2 + vec2(0.10 * cos(uT * 1.90), 0.08 * sin(uT * 2.30));
  float cuspB = exp(-pow(length((cen - cus2)/vec2(0.078, 0.058)), 2.0)) * (1.0 + 1.2 * uBass) * w2;
  float cusp = max(cuspA, cuspB);

  /* 灯：拍点换边（两态）；左上为主；翻面后灯沉到右下，镜面改成从下往上打 */
  float lampX = mix(-0.85, 0.85, uPol);
  vec3 L = normalize(mix(vec3(lampX, 0.72, 0.55), vec3(0.92, -0.46, 0.50), uMf * 0.85));
  float spec = pow(max(dot(n, normalize(L + vec3(0.0,0.0,1.0))), 0.0), mix(18.0, 44.0, uTre));

  /* 砖面：菱形棱边微微亮（墙本身几乎黑） */
  float m = max(abs(aQ.x-0.5), abs(aQ.y-0.5)) * 2.0;
  float edge = smoothstep(0.62, 1.0, m);

  /* 前奏：一道光先扫过墙面 */
  float band = exp(-pow((cen.x - mix(asp*1.05, -asp*0.20, uPre))*2.1, 2.0)) * smoothstep(0.02,0.20,uPre);

  float wall = 0.012 + 0.012*edge;
  /* 翻面段：墙下缘多一条极淡的反光带（灯在画外右下，墙是被斜照着的） */
  float gl = exp(-pow((cen.y + 0.42)*4.6, 2.0)) * uMf * (0.55 + 0.45*uBass) * 0.30;
  /* 池内不留「底色」：漫反射（砖粒 + 镜面）压掉，池心是深黑，只剩细丝与尖点*/
  float diff = wall + pool*0.42*spec + band*0.72 + gl*0.55;
  float hi   = arc*2.05 + ring*0.85 + cusp*1.60;
  float b = diff * (1.0 - 0.80*clamp(pool, 0.0, 1.0)) + hi;
  b *= 1.0 + 0.45*uBeat;
  b *= 1.0 + aEnv*0.55;                                  /* 焦距拉满：池边更紧、更亮 */
  b *= 0.88 + 0.26*uTre*(0.6 + 0.4*sin(uT*4.6 + h0*36.0));
  b *= 0.90 + 0.22*uBass;

  /* 砖的几何：45° 菱形，bass 推一点点尺寸 */
  float sz = 1.02 + 0.10*uBass;
  vec2 lq = vec2((aQ.x-0.5)*cw.x*sz, (aQ.y-0.5)*cw.y*sz);
  float ca = 0.7854, sa = 0.7854;
  lq = vec2(lq.x*ca - lq.y*sa, lq.x*sa + lq.y*ca);

  float br = clamp(b, 0.0, 2.2);
  vCol = mix(vec3(0.32,0.62,1.0), vec3(0.94,0.99,1.0), clamp(br*0.72, 0.0, 1.0));
  vA = br * 0.30;
  vQ = aQ;
  gl_Position = vec4((cen + lq).x/asp, (cen + lq).y, 0.0, 1.0);
}`;

const P_FS = `#version 300 es
precision highp float;
in vec2 vQ; in vec3 vCol; in float vA;
in float vH; in float vCt; in float vBend; in float vPool;
out vec4 o;
float iso(float f){ return 1.0 - abs(2.0*fract(f) - 1.0); }   /* 1 = 正好在等值线上 */
/* 定宽细丝：用屏幕空间导数定线宽 —— 不论折射率场陡缓，丝永远是 1–2px */
float isoLine(float f, float gain, float wpx){
  float d = abs(fract(f + 0.5) - 0.5);
  float w = max(fwidth(f) * wpx, 1e-4);
  return gain * (1.0 - smoothstep(w * 0.45, w * 1.75, d));
}
void main(){
  vec2 d = abs(vQ*2.0 - 1.0);
  float m = max(d.x, d.y);
  float face = 1.0 - smoothstep(0.90, 1.0, m);
  float rim  = smoothstep(0.50, 0.96, m) * (1.0 - smoothstep(0.97, 1.0, m));

  /* 焦散丝：三条等值线在片元里取；峰值项给亮丝，弱项只留一点点辉，丝间仍是深黑 */
  float d1 = iso(vH * 3.0 + vCt * 0.92);
  float d2 = iso(vH * 6.0 + 0.37 + vCt * 1.35);
  float d3 = iso(vH * 5.0 + vBend - vCt * 0.55);
  float fil = 3.20*pow(d1, 120.0) + 0.10*pow(d1, 22.0)
            + 1.50*pow(d2, 100.0) + 0.06*pow(d2, 20.0)
            + 2.30*pow(d3, 110.0) + 0.08*pow(d3, 26.0);
  fil *= vPool;

  float amp = clamp(vA + fil * 0.52, 0.0, 1.30);
  vec3 col = mix(vCol, vec3(0.62, 0.86, 1.0), clamp(fil * 0.85, 0.0, 1.0));
  /* 池内把砖面纹理压平：只剩细丝亮、丝间深黑，不再是满屏砖粒 */
  float shape = mix(face*0.90 + rim*1.30, 0.94, clamp(vPool, 0.0, 1.0) * 0.88);
  o = vec4(col * amp * shape, 1.0);
}`;

function initGL() {
  try { gl = cv.getContext('webgl2', GL_OPT); } catch (_) { gl = null; }
  if (!gl) { document.documentElement.classList.add('fb'); return false; }
  P = program(P_VS, P_FS);
  U = locs(P, ['uT','uBass','uTre','uBeat','uPre','uIn','uPol','uAct','uFoc','uMf','uRes','uText','uN']);
  bgP = program(BG_VS, BG_FS);
  bgU = locs(bgP, ['uT','uRes']);

  const quad = new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

  /* 分层抽样（Halton）保证 10 万块砖铺满 316×316 格，不结块 */
  const hal = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
  let sd = 20260241;
  const rnd = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
  const seeds = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    seeds[i*4] = hal(i + 1, 2); seeds[i*4+1] = hal(i + 1, 3);
    seeds[i*4+2] = rnd(); seeds[i*4+3] = rnd();
  }
  const sb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);

  /* —— 32³ 体纹理：三层值噪声（周期格 + 三线性平滑），给折射率场用 —— */
  const T3 = 32;
  const lat = new Float32Array(T3*T3*T3);
  let sp = 1234567;
  const rp = () => { sp = (sp * 1664525 + 1013904223) >>> 0; return sp / 4294967296; };
  for (let i = 0; i < lat.length; i++) lat[i] = rp();
  const L = (x, y, z) => lat[((z & (T3-1)) * T3 + (y & (T3-1))) * T3 + (x & (T3-1))];
  const sm = (t) => t * t * (3 - 2 * t);
  const nz3 = (x, y, z) => {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = sm(x - xi), yf = sm(y - yi), zf = sm(z - zi);
    const c000 = L(xi,yi,zi), c100 = L(xi+1,yi,zi), c010 = L(xi,yi+1,zi), c110 = L(xi+1,yi+1,zi);
    const c001 = L(xi,yi,zi+1), c101 = L(xi+1,yi,zi+1), c011 = L(xi,yi+1,zi+1), c111 = L(xi+1,yi+1,zi+1);
    const x00 = c000 + (c100-c000)*xf, x10 = c010 + (c110-c010)*xf;
    const x01 = c001 + (c101-c001)*xf, x11 = c011 + (c111-c011)*xf;
    const y0 = x00 + (x10-x00)*yf, y1 = x01 + (x11-x01)*yf;
    return y0 + (y1-y0)*zf;
  };
  const vol = new Uint8Array(T3*T3*T3);
  for (let z = 0; z < T3; z++) for (let y = 0; y < T3; y++) for (let x = 0; x < T3; x++) {
    const u = x / T3 * 8, v = y / T3 * 8, w = z / T3 * 8;
    let v2 = nz3(u, v, w) * 0.60 + nz3(u*2.1 + 3.3, v*2.1 + 1.7, w*2.1 + 5.1) * 0.28
           + nz3(u*4.3 + 7.7, v*4.3 + 2.9, w*4.3 + 4.4) * 0.12;
    vol[(z*T3 + y)*T3 + x] = Math.max(0, Math.min(255, Math.round(v2 * 255)));
  }
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_3D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, T3, T3, T3, 0, gl.RED, gl.UNSIGNED_BYTE, vol);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.REPEAT);

  pVao = gl.createVertexArray(); gl.bindVertexArray(pVao);
  const aQ = gl.getAttribLocation(P, 'aQ'), aS = gl.getAttribLocation(P, 'aSeed');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(aQ); gl.vertexAttribPointer(aQ, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.enableVertexAttribArray(aS); gl.vertexAttribPointer(aS, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(aS, 1);

  bgVao = gl.createVertexArray(); gl.bindVertexArray(bgVao);
  const bQ = gl.getAttribLocation(bgP, 'aQ');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(bQ); gl.vertexAttribPointer(bQ, 2, gl.FLOAT, false, 0, 0);

  gl.bindVertexArray(null);
  gl.useProgram(P); gl.uniform1i(U.uN, 0);
  gl.clearColor(0.004, 0.006, 0.011, 1);
  gl.disable(gl.DEPTH_TEST);
  glOk = true;
  return true;
}

let uTextV = [0, 0, 0.3, 0.1];
function draw() {
  if (!glOk) return;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.useProgram(bgP); gl.bindVertexArray(bgVao);
  gl.uniform1f(bgU.uT, vT); gl.uniform2f(bgU.uRes, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.useProgram(P); gl.bindVertexArray(pVao);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1f(U.uT, vT); gl.uniform1f(U.uBass, bass); gl.uniform1f(U.uTre, treb);
  gl.uniform1f(U.uBeat, beatPulse); gl.uniform1f(U.uPre, preAmt); gl.uniform1f(U.uIn, inAmt);
  gl.uniform1f(U.uPol, pol); gl.uniform1f(U.uAct, act);
  gl.uniform1f(U.uFoc, foc); gl.uniform1f(U.uMf, mf);
  gl.uniform2f(U.uRes, W, H); gl.uniform4f(U.uText, uTextV[0], uTextV[1], uTextV[2], uTextV[3]);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);
  gl.bindVertexArray(null);
}

/* ---------------- 尺寸 ---------------- */
function resize() {
  W = Math.max(2, window.innerWidth); H = Math.max(2, window.innerHeight);
  PR = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * PR); cv.height = Math.round(H * PR);
  if (glOk) { gl.viewport(0, 0, cv.width, cv.height); }
  dirty = true;
}
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });

function textRect() {
  if (!cur || !cur.chars.length) return [0, 0, 0.34, 0.09];
  const r = cur.el.getBoundingClientRect();
  return [ (r.left + r.width/2) / W * 2 - 1, 1 - (r.top + r.height/2) / H * 2,
           Math.max(0.02, r.width / W), Math.max(0.02, r.height / H) ];
}

/* ══════════════════════════════ 主循环 ══════════════════════════════ */
let last = performance.now(), raf = 0, dirty = true;
function frame(ms) {
  const js0 = performance.now();
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
  last = ms; frames++;
  const T = now();
  /* 视觉时钟 = 歌词时钟（seek 时画面与字一起重建；暂停时一起冻住） */
  vT = RM ? T * 0.24 : T;
  if (playing) {
    beatPulse *= Math.exp(-dt * 3.6);
    bass *= Math.exp(-dt * 0.08);
    treb *= Math.exp(-dt * 0.10);
  }
  try { timing(T); } catch (e) { errMsg = 'timing: ' + (e && e.message ? e.message : e); }
  state(T);
  if (!RM && cur) uTextV = textRect();
  try {
    if (playing || dirty) { draw(); updDom(T); dirty = false; }
  } catch (e) { errMsg = 'draw: ' + (e && e.message ? e.message : e); }
  if (!readySent) { readySent = true; try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {} }
  jsMs = performance.now() - js0;
  raf = requestAnimationFrame(frame);
}

/* ---------------- 协议 ---------------- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', (e) => {
  ping();
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    idx = -1; lastT = -1e9;
    cur = null; ghost = null;
    for (const s of slots) { s.el.style.opacity = '0'; s.chars = []; s.el.style.transform = 'translate(-50%,-50%)'; }
    vT = 0; beatPulse = 0; bass = 0; treb = 0; beatN = 0; beatAt = -9;
    clockT = 0; clockAt = performance.now(); playing = true;
    inAmt = 0; preAmt = 0;
    hint.style.opacity = lines.length ? '0.9' : '0.4';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    dirty = true;
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    playing = !!d.payload.playing; dirty = true;
  } else if (d.type === 'beat') {
    beatPulse = Math.min(1, beatPulse + 0.32 + (d.payload.level || 0) * 0.5);
    beatN++; dirty = true;
  } else if (d.type === 'live') {
    const l = d.payload || {};
    if (typeof l.bass === 'number') bass = Math.max(bass, clamp01(l.bass));
    if (typeof l.treble === 'number') treb = Math.max(treb, clamp01(l.treble));
    if (typeof l.level === 'number') beatPulse = Math.max(beatPulse, Math.min(0.9, l.level * 0.8));
  }
});
addEventListener('pagehide', () => cancelAnimationFrame(raf));

/* ---------------- 自查 ---------------- */
window.__stage = () => ({
  lines: lines.length, idx: idx, t: +now().toFixed(2), playing: playing, frames: frames,
  js: +jsMs.toFixed(2), err: errMsg, text: (idx >= 0 && lines[idx]) ? lines[idx].text : '',
  gl: glOk, rm: RM, vT: +vT.toFixed(2)
});

/* ---------------- 启动 ---------------- */
resize();
try { initGL(); } catch (e) { errMsg = 'gl: ' + (e && e.message ? e.message : e); document.documentElement.classList.add('fb'); }
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
