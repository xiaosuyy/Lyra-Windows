<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>终端驱魔</title>
<style>
  :root{
    --ph-bright:#3dff85; --ph-mid:#1a8044; --ph-dim:#0a3a20; --ph-hot:#c8ffdc;
    --ph-soft:rgba(61,255,133,.66);
    --ph-glow:rgba(61,255,133,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  body{font-family:"Consolas","Lucida Console","Courier New",monospace;background:#000;
       color:var(--ph-bright);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0}
  #wash{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(90% 70% at 50% 42%,var(--ph-glow) 0%,rgba(0,0,0,0) 62%);
    opacity:.07;animation:flicker 5.5s ease-in-out infinite}
  #scrim{position:fixed;left:0;right:0;bottom:0;height:38vh;pointer-events:none;z-index:2;
         background:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 25%,rgba(0,0,0,.45) 58%,rgba(0,0,0,0) 100%)}
  #term{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;
        padding:clamp(12px,2.4vw,40px) clamp(14px,2.8vw,52px);pointer-events:none;
        gap:clamp(10px,2vh,26px)}
  #meta{font-size:clamp(9.5px,1.02vw,14px);letter-spacing:.16em;color:var(--ph-mid);
        display:flex;justify-content:space-between;align-items:baseline;gap:1em;margin-bottom:auto;
        padding-top:clamp(6px,1.4vw,20px);text-transform:uppercase;opacity:.95}
  #meta-left{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:68%}
  #meta-right{flex:0 0 auto;color:var(--ph-soft);opacity:.8}
  #lyricbox{position:relative;padding-left:clamp(14px,1.8vw,30px);
            border-left:1px solid rgba(255,255,255,.10)}
  #lyricbox::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;
            background:linear-gradient(to bottom,transparent,var(--ph-bright) 22%,var(--ph-bright) 76%,transparent);
            opacity:.55}
  #line-prev{font-size:clamp(11px,1.28vw,19px);color:var(--ph-mid);letter-spacing:.05em;
             margin:0 0 clamp(8px,1.4vh,18px);white-space:pre-wrap;overflow-wrap:anywhere;
             max-width:56ch;opacity:.85}
  #line-now{position:relative;font-size:clamp(19px,3.15vw,50px);line-height:1.4;letter-spacing:.02em;
            color:var(--ph-bright);text-shadow:0 0 12px var(--ph-glow),0 0 40px rgba(0,0,0,1);
            white-space:pre-wrap;overflow-wrap:anywhere;max-width:30ch}
  #line-now::before{content:">";position:absolute;left:calc(-1.05em);color:var(--ph-mid);
            text-shadow:none;font-size:.62em;top:.34em}
  #cursor{color:var(--ph-bright);text-shadow:0 0 14px var(--ph-glow);
          animation:blink 1.05s steps(1,end) infinite}
  #cursor.halt{animation:none;opacity:.35}
  @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
  #empty{display:none;font-size:clamp(12px,1.35vw,19px);color:var(--ph-soft);line-height:2;
         letter-spacing:.08em;white-space:pre;text-transform:uppercase;
         padding-left:clamp(14px,1.8vw,30px);border-left:1px solid rgba(255,255,255,.10)}
  #edge{position:fixed;right:clamp(6px,.9vw,16px);top:18%;z-index:3;pointer-events:none;
        writing-mode:vertical-rl;text-orientation:mixed;font-size:clamp(8px,.78vw,11px);
        letter-spacing:.42em;color:var(--ph-dim);opacity:.85;text-transform:uppercase}
  @media (max-aspect-ratio: 3/4){ #edge{display:none} }
  #crt{position:fixed;inset:0;pointer-events:none;z-index:4}
  #crt::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.42) 0 1px,rgba(0,0,0,0) 1px 3px);
    mix-blend-mode:multiply;opacity:.55}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.92) 100%)}
  @keyframes flicker{0%,100%{opacity:.055}38%{opacity:.10}62%{opacity:.045}81%{opacity:.085}}
  @media (prefers-reduced-motion: reduce){
    #wash{animation:none;opacity:.05}
    #cursor{animation:none;opacity:1}
  }
  @media (max-aspect-ratio: 3/4){
    #lyricbox{padding-left:12px}
    #line-now{max-width:26ch;font-size:clamp(22px,6.1vw,38px);line-height:1.32}
    #line-prev{font-size:clamp(11px,3.2vw,16px);max-width:30ch}
    #empty{font-size:clamp(11px,3.1vw,16px)}
    #meta-left{max-width:56%}
    #term{padding:14px 18px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="wash"></div>
<div id="scrim"></div>
<div id="term">
  <div id="meta"><span id="meta-left">C:\EXORCISM&gt; _</span><span id="meta-right">--</span></div>
  <div id="lyricbox">
    <div id="line-prev"></div>
    <div id="line-now"><span id="lit"></span><span id="rest"></span><span id="cursor">█</span></div>
  </div>
  <div id="empty"></div>
</div>
<div id="edge">SEAL&nbsp;07 &nbsp;//&nbsp; ASCII&nbsp;SIGIL &nbsp;//&nbsp; PHOSPHOR&nbsp;P3</div>
<div id="crt"></div>
<script>
'use strict';

var stageState = { lines: [], idx: -1, time: 0, playing: true, frames: 0, js: 0, err: '', text: '', rm: false };

window.__stage = function () {
  return {
    lines: stageState.lines.length, idx: stageState.idx, t: stageState.time,
    playing: stageState.playing, frames: stageState.frames, js: stageState.js,
    err: stageState.err, text: stageState.text, gl: false, rm: stageState.rm
  };
};

var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d', { alpha: false });
var viewW = 1440, viewH = 900, cellW = 11, cellH = 18, cols = 130, rows = 50;
var dpr = 1, accent = [61, 255, 133];
var reducedMotion = false;

try {
  reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
} catch (err) { console.error('[367] reduced-motion probe failed', err); }
stageState.rm = reducedMotion;

function finiteOr(value, fallback) {
  var num = Number(value);
  return isFinite(num) && num > 0 ? num : fallback;
}

function layout() {
  viewW = finiteOr(window.innerWidth, 1440);
  viewH = finiteOr(window.innerHeight, 900);
  dpr = Math.min(finiteOr(window.devicePixelRatio, 1), 1.5);
  cols = Math.max(38, Math.min(190, Math.round(viewW / 11)));
  cellW = viewW / cols;
  cellH = cellW * 1.62;
  rows = Math.ceil(viewH / cellH) + 1;
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildScene();
}

var elMetaLeft = document.getElementById('meta-left');
var elMetaRight = document.getElementById('meta-right');
var elPrev = document.getElementById('line-prev');
var elNow = document.getElementById('line-now');
var elLit = document.getElementById('lit');
var elRest = document.getElementById('rest');
var elCursor = document.getElementById('cursor');
var elEmpty = document.getElementById('empty');
var elBox = document.getElementById('lyricbox');

var domCache = { idx: -2, lit: -1, prev: -2 };
var metaBase = 'C:\\EXORCISM> _';
var linePulse = 0;
var liveState = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, beat: 0, beatIndex: -1 };

function normalizeLines(raw) {
  var out = [];
  if (!raw || typeof raw.length !== 'number') return out;
  var total = Math.min(raw.length, 600);
  for (var i = 0; i < total; i++) {
    var item = raw[i];
    if (!item || typeof item !== 'object') continue;
    var text = typeof item.text === 'string' ? item.text.replace(/\s+/g, ' ').trim() : '';
    if (!text) continue;
    var start = Number(item.t);
    if (!isFinite(start) || start < 0) start = 0;
    var dur = Number(item.dur);
    if (!isFinite(dur) || dur < 0) dur = 0;
    var charTimes = null;
    if (item.chars && typeof item.chars.length === 'number' && item.chars.length > 0) {
      charTimes = [];
      var limit = Math.min(item.chars.length, 400);
      for (var k = 0; k < limit; k++) {
        var point = item.chars[k];
        var charTime = point ? Number(point.t) : NaN;
        charTimes.push(isFinite(charTime) ? charTime : start);
      }
    }
    out.push({ t: start, dur: dur, text: text.slice(0, 140), chars: charTimes });
  }
  out.sort(function (first, second) { return first.t - second.t; });
  return out;
}

function findIndex(time) {
  var lines = stageState.lines;
  if (!lines.length) return -1;
  if (time < lines[0].t) return -1;
  var low = 0, high = lines.length - 1, answer = 0;
  for (var guard = 0; guard < 40 && low <= high; guard++) {
    var mid = (low + high) >> 1;
    if (lines[mid].t <= time) { answer = mid; low = mid + 1; } else { high = mid - 1; }
  }
  return answer;
}

function typedChars(line, time) {
  if (!line) return 0;
  var length = line.text.length;
  if (length === 0) return 0;
  if (line.chars && line.chars.length) {
    var cap = Math.min(line.chars.length, length);
    var count = 0;
    for (var i = 0; i < cap; i++) {
      if (line.chars[i] <= time) { count = i + 1; } else { break; }
    }
    return count;
  }
  var speed = 0.055;
  if (line.dur > 0) speed = Math.min(0.09, Math.max(0.03, line.dur / length * 0.6));
  var typed = Math.floor((time - line.t) / speed) + 1;
  return Math.max(0, Math.min(length, typed));
}

function clockText(seconds) {
  var safe = isFinite(seconds) && seconds > 0 ? seconds : 0;
  var mins = Math.floor(safe / 60);
  var secs = Math.floor(safe % 60);
  return (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
}

function updateLyricDom() {
  var lines = stageState.lines;
  var index = stageState.idx;
  var current = index >= 0 ? lines[index] : null;

  if (domCache.prev !== index) {
    domCache.prev = index;
    var previousLine = index > 0 ? lines[index - 1] : null;
    if (previousLine) elPrev.textContent = '[' + clockText(previousLine.t) + ']  ' + previousLine.text;
    else elPrev.textContent = index < 0 ? '[--:--]  AWAITING SIGNAL' : '';
    stageState.text = current ? current.text : '';
  }

  if (domCache.idx !== index) {
    domCache.idx = index;
    domCache.lit = -1;
    elLit.textContent = '';
    elRest.textContent = current ? current.text : '';
    linePulse = 1;
    var counter = index >= 0 ? String(index + 1) : '--';
    counter = counter.length >= 2 ? counter : ('0' + counter).slice(-2);
    var total = String(lines.length);
    total = total.length >= 2 ? total : ('0' + total).slice(-2);
    elMetaLeft.textContent = metaBase + (lines.length ? '  [' + counter + '/' + total + ']' : '');
  }

  if (current) {
    var lit = typedChars(current, stageState.time);
    if (lit !== domCache.lit) {
      domCache.lit = lit;
      elLit.textContent = current.text.slice(0, lit);
      elRest.textContent = current.text.slice(lit);
    }
  } else if (domCache.lit !== 0) {
    domCache.lit = 0;
    elLit.textContent = '';
    elRest.textContent = '';
  }
}

function accentIsWarm(rgb) {
  if (!rgb || rgb.length < 3) return false;
  var red = Number(rgb[0]) || 0;
  var green = Number(rgb[1]) || 0;
  var blue = Number(rgb[2]) || 0;
  if (red < 46 && green < 46 && blue < 46) return false;
  var high = Math.max(red, green, blue);
  var low = Math.min(red, green, blue);
  if (high - low < 34) return false;
  return red > green * 1.18 && red > blue * 1.55;
}

function applyPalette(forceRebuild) {
  var warm = accentIsWarm(accent);
  var next = warm ? PALETTE_AMBER : PALETTE_GREEN;
  var changed = next !== palette;
  palette = next;
  var root = document.documentElement;
  root.style.setProperty('--ph-bright', rgba(palette.bright, 1));
  root.style.setProperty('--ph-mid', rgba(palette.mid, 1));
  root.style.setProperty('--ph-dim', rgba(palette.dim, 1));
  root.style.setProperty('--ph-hot', rgba(palette.hot, 1));
  root.style.setProperty('--ph-soft', rgba(palette.bright, 0.66));
  root.style.setProperty('--ph-glow', rgba(palette.bright, 0.55));
  if (changed || forceRebuild) buildScene();
}

function applyInit(payload) {
  var data = payload && typeof payload === 'object' ? payload : {};
  var song = data.song && typeof data.song === 'object' ? data.song : {};
  var artists = song.artists;
  if (Array.isArray(artists)) artists = artists.join(' / ');
  else if (typeof artists !== 'string') artists = '';
  var songName = typeof song.name === 'string' ? song.name.trim() : '';
  var title = (songName || 'UNTITLED') + (artists.trim() ? ' — ' + artists.trim() : '');

  stageState.lines = normalizeLines(data.lines);
  stageState.duration = isFinite(Number(data.duration)) && Number(data.duration) > 0 ? Number(data.duration) : 0;
  stageState.idx = -1;
  stageState.text = '';
  domCache.idx = -2;
  domCache.lit = -1;
  domCache.prev = -2;

  if (Array.isArray(data.accent) && data.accent.length >= 3) {
    accent = [
      Math.max(0, Math.min(255, Math.round(Number(data.accent[0]) || 0))),
      Math.max(0, Math.min(255, Math.round(Number(data.accent[1]) || 0))),
      Math.max(0, Math.min(255, Math.round(Number(data.accent[2]) || 0)))
    ];
  }

  var hasLines = stageState.lines.length > 0;
  elBox.style.display = hasLines ? '' : 'none';
  elEmpty.style.display = hasLines ? 'none' : 'block';
  if (!hasLines) {
    elEmpty.innerHTML = '';
    var emptyRows = [
      '> NO LYRIC PAYLOAD',
      '  此轨无词 · 仅存仪式',
      '  RUNNING VISUAL-ONLY RITUAL',
      '> _'
    ];
    for (var row = 0; row < emptyRows.length; row++) {
      var div = document.createElement('div');
      div.textContent = emptyRows[row];
      elEmpty.appendChild(div);
    }
  }

  metaBase = 'C:\\EXORCISM> PLAY "' + title.slice(0, 42).toUpperCase() + '"';
  applyPalette(false);
  updateLyricDom();
}

function applyTick(payload) {
  var data = payload && typeof payload === 'object' ? payload : {};
  var time = Number(data.time);
  if (isFinite(time)) stageState.time = time;
  if (typeof data.playing === 'boolean') stageState.playing = data.playing;
}

function applyBeat(payload) {
  var data = payload && typeof payload === 'object' ? payload : {};
  var level = Number(data.level);
  liveState.beat = isFinite(level) ? Math.max(0, Math.min(1, level)) : 0;
  liveState.beatIndex = isFinite(Number(data.index)) ? Number(data.index) : liveState.beatIndex;
}

function applyLive(payload) {
  var data = payload && typeof payload === 'object' ? payload : {};
  if (isFinite(Number(data.bpm))) liveState.bpm = Number(data.bpm);
  if (isFinite(Number(data.level))) liveState.level = Number(data.level);
  if (isFinite(Number(data.bass))) liveState.bass = Number(data.bass);
  if (isFinite(Number(data.mid))) liveState.mid = Number(data.mid);
  if (isFinite(Number(data.treble))) liveState.treble = Number(data.treble);
  if (typeof data.playing === 'boolean') stageState.playing = data.playing;
}

window.addEventListener('message', function (event) {
  try {
    var message = event.data;
    if (!message || typeof message !== 'object' || message.__c100 !== 1) return;
    if (message.type === 'init') applyInit(message.payload);
    else if (message.type === 'tick') applyTick(message.payload);
    else if (message.type === 'beat') applyBeat(message.payload);
    else if (message.type === 'live') applyLive(message.payload);
  } catch (err) {
    stageState.err = String(err);
    console.error('[367] message handler failed', err);
  }
});

var readySent = false;
function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (err) { console.error('[367] ready post failed', err); }
}

var FONT_STACK = '"Consolas","Lucida Console","Courier New",monospace';
var PALETTE_GREEN = { dim: [10, 58, 32], mid: [26, 128, 68], bright: [61, 255, 133], hot: [200, 255, 220] };
var PALETTE_AMBER = { dim: [62, 34, 6], mid: [148, 90, 16], bright: [255, 176, 56], hot: [255, 234, 186] };
var palette = PALETTE_GREEN;

var layers = { base: null, ring: null, core: null };
var bakeQueue = [];
var bakeDone = false;
var geometry = { ringD: 666, coreD: 413, cx: 720, cy: 378, portrait: false, sigilTop: 0, sigilBottom: 0 };

function rgba(color, alpha) {
  var alphaSafe = isFinite(alpha) ? alpha : 1;
  alphaSafe = Math.max(0, Math.min(1, alphaSafe));
  var redLevel = Math.round(Math.max(0, Math.min(255, color[0])));
  var greenLevel = Math.round(Math.max(0, Math.min(255, color[1])));
  var blueLevel = Math.round(Math.max(0, Math.min(255, color[2])));
  return 'rgba(' + redLevel + ',' + greenLevel + ',' + blueLevel + ',' + (Math.round(alphaSafe * 100) / 100) + ')';
}

function hash01(seed) {
  var value = Math.sin(seed * 12.9898) * 43758.5453;
  return value - Math.floor(value);
}

function makeLayer(width, height) {
  var canvasEl = document.createElement('canvas');
  var safeW = Math.max(8, Math.round(finiteOr(width, 1440)));
  var safeH = Math.max(8, Math.round(finiteOr(height, 900)));
  var layerDpr = dpr;
  canvasEl.width = Math.round(safeW * layerDpr);
  canvasEl.height = Math.round(safeH * layerDpr);
  var layerCtx = canvasEl.getContext('2d');
  layerCtx.setTransform(layerDpr, 0, 0, layerDpr, 0, 0);
  layerCtx.textAlign = 'center';
  layerCtx.textBaseline = 'middle';
  return { canvas: canvasEl, ctx: layerCtx, w: safeW, h: safeH };
}

function queueJob(job) { bakeQueue.push(job); }

function pumpBake(budgetMs) {
  var start = performance.now();
  var sanity = 0;
  while (bakeQueue.length > 0 && sanity < 120 && performance.now() - start < budgetMs) {
    sanity++;
    var job = bakeQueue.shift();
    try { job(); } catch (err) {
      stageState.err = String(err);
      console.error('[367] bake job failed', err);
    }
  }
  if (bakeQueue.length === 0 && !bakeDone) {
    bakeDone = true;
    layersReady = true;
  }
}

var layersReady = false;

function planScene() {
  var portrait = viewH > viewW * 1.02;
  var ringD = portrait ? Math.min(viewW * 0.98, viewH * 0.54) : Math.min(viewH * 0.68, viewW * 0.60);
  ringD = Math.max(160, finiteOr(ringD, 560));
  var cy = portrait ? viewH * 0.39 : viewH * 0.40;
  geometry.portrait = portrait;
  geometry.ringD = ringD;
  geometry.coreD = ringD * 0.62;
  geometry.cx = viewW * 0.5;
  geometry.cy = cy;
  geometry.sigilTop = cy - ringD * 0.53;
  geometry.sigilBottom = cy + ringD * 0.53;
}

function buildScene() {
  planScene();
  bakeQueue.length = 0;
  bakeDone = false;
  layersReady = false;
  layers.base = makeLayer(viewW, viewH);
  layers.ring = makeLayer(geometry.ringD * 1.06, geometry.ringD * 1.06);
  layers.core = makeLayer(geometry.coreD, geometry.coreD);
  queueBackdrop();
  queueArcade();
  queueRings();
  queueCore();
}

var RUNE_GLYPHS = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛞᛟ'.split('');
var STAR_GLYPHS = ['◈', '◇', '◆', '○', '●', '◉', '◎', '▲', '△', '▽', '▼', '■', '□', '⊕', '⊗', '╳', '≡', '≠', '∑', '∫', '∮', '∞', '∆', '∇'];
var SEAL_GLYPHS = ['☉', '☽', '☿', '♀', '♂', '♃', '♄', '♅', '♆', '♇', '♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
var DUST_GLYPHS = ['·', '.', '+', '˙', '°'];

function ringChars(target, radius, glyphList, count, size, color, alpha, spin) {
  var tctx = target.ctx;
  var cx = target.w * 0.5;
  var cy = target.h * 0.5;
  var total = Math.max(4, Math.min(420, Math.round(count)));
  var fontPx = Math.max(6, Math.min(40, Math.round(size)));
  tctx.font = fontPx + 'px ' + FONT_STACK;
  tctx.fillStyle = rgba(color, alpha);
  for (var i = 0; i < total; i++) {
    var angle = (i / total) * Math.PI * 2 + (isFinite(spin) ? spin : 0);
    var glyph = glyphList[Math.floor(hash01(i * 2.7 + radius) * glyphList.length) % glyphList.length];
    tctx.save();
    tctx.translate(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    tctx.rotate(angle + Math.PI * 0.5);
    tctx.fillText(glyph, 0, 0);
    tctx.restore();
  }
}

function dotRing(target, radius, count, size, color, alpha) {
  var tctx = target.ctx;
  var cx = target.w * 0.5;
  var cy = target.h * 0.5;
  var total = Math.max(4, Math.min(400, Math.round(count)));
  tctx.font = Math.round(Math.max(5, Math.min(24, size))) + 'px ' + FONT_STACK;
  tctx.fillStyle = rgba(color, alpha);
  for (var i = 0; i < total; i++) {
    var angle = (i / total) * Math.PI * 2;
    tctx.fillText('·', cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
  }
}

function strokeGlyphs(target, x0, y0, x1, y1, glyphList, size, color, alpha) {
  var tctx = target.ctx;
  var dx = x1 - x0;
  var dy = y1 - y0;
  var distance = Math.sqrt(dx * dx + dy * dy);
  if (!isFinite(distance) || distance <= 0.5) return;
  var step = Math.max(4, Math.min(cellW, 10));
  var count = Math.min(500, Math.ceil(distance / step));
  var seen = {};
  tctx.font = Math.round(Math.max(6, Math.min(30, size))) + 'px ' + FONT_STACK;
  tctx.fillStyle = rgba(color, alpha);
  for (var i = 0; i <= count; i++) {
    var px = x0 + dx * (i / count);
    var py = y0 + dy * (i / count);
    var key = Math.round(px / 7) + ':' + Math.round(py / 7);
    if (seen[key] === 1) continue;
    seen[key] = 1;
    tctx.fillText(glyphList[Math.floor(hash01(key.length + i) * glyphList.length) % glyphList.length], px, py);
  }
}

function queueBackdrop() {
  var band = 5;
  for (var startRow = 0; startRow < rows; startRow += band) {
    (function (firstRow) {
      queueJob(function () {
        var tctx = layers.base.ctx;
        var lastRow = Math.min(rows, firstRow + band);
        tctx.font = Math.round(cellH * 0.94) + 'px ' + FONT_STACK;
        tctx.fillStyle = rgba(palette.mid, 0.42);
        for (var row = firstRow; row < lastRow; row++) {
          for (var col = 0; col < cols; col++) {
            var noise = hash01(col * 3.17 + row * 11.71);
            if (noise > 0.17) continue;
            var glyph = DUST_GLYPHS[Math.floor(noise * 60) % DUST_GLYPHS.length];
            tctx.fillText(glyph, col * cellW + cellW * 0.5, row * cellH + cellH * 0.55);
          }
        }
      });
    })(startRow);
  }

  queueJob(function () {
    var tctx = layers.base.ctx;
    var small = Math.max(9, Math.min(15, Math.round(cellH * 0.66)));
    tctx.font = small + 'px ' + FONT_STACK;
    tctx.textAlign = 'left';
    var gutterX = Math.max(10, viewW * 0.012);
    if (viewW > 760) {
      tctx.fillStyle = rgba(palette.dim, 0.85);
      for (var row = 0; row < rows; row += 2) {
        var address = (row * 16).toString(16).toUpperCase();
        for (var pad = address.length; pad < 4; pad++) address = '0' + address;
        tctx.fillText('0x' + address, gutterX, row * cellH + cellH * 0.5);
      }
      tctx.fillStyle = rgba(palette.dim, 0.55);
      for (var lineRow = 1; lineRow < rows; lineRow += 1) {
        tctx.fillText('│', gutterX + small * 3.9, lineRow * cellH + cellH * 0.5);
      }
    }
    tctx.textAlign = 'center';
  });

  queueJob(function () {
    var tctx = layers.base.ctx;
    var grad = null;
    try {
      grad = tctx.createRadialGradient(geometry.cx, geometry.cy, geometry.ringD * 0.15,
        geometry.cx, geometry.cy, geometry.ringD * 0.72);
      grad.addColorStop(0, rgba(palette.bright, 0.05));
      grad.addColorStop(0.65, rgba(palette.mid, 0.045));
      grad.addColorStop(1, rgba(palette.bright, 0));
    } catch (err) {
      console.error('[367] backdrop haze gradient failed', err);
      grad = null;
    }
    if (grad) {
      tctx.fillStyle = grad;
      tctx.fillRect(0, 0, layers.base.w, layers.base.h);
    }
  });
}

function queueArcade() {
  var lancetHalf = Math.max(16, Math.min(viewW * 0.05, viewH * 0.075));
  var bottomY = viewH * 1.0;
  var springY = viewH * 0.22;
  var apexLift = lancetHalf * 1.75;
  var centers = [viewW * 0.045 + lancetHalf, viewW * 0.955 - lancetHalf];

  queueJob(function () {
    var target = layers.base;
    for (var index = 0; index < centers.length; index++) {
      var midX = centers[index];
      strokeGlyphs(target, midX - lancetHalf, bottomY, midX - lancetHalf, springY, ['│', '┃'], cellH * 0.8, palette.mid, 0.52);
      strokeGlyphs(target, midX + lancetHalf, bottomY, midX + lancetHalf, springY, ['│', '┃'], cellH * 0.8, palette.mid, 0.52);
      strokeGlyphs(target, midX - lancetHalf, springY, midX, springY - apexLift, ['╱', '·'], cellH * 0.9, palette.mid, 0.45);
      strokeGlyphs(target, midX + lancetHalf, springY, midX, springY - apexLift, ['╲', '·'], cellH * 0.9, palette.mid, 0.45);
      strokeGlyphs(target, midX, springY - apexLift * 0.15, midX, viewH * 0.99, ['·', '┊'], cellH * 0.7, palette.dim, 0.6);
    }
  });

  queueJob(function () {
    var target = layers.base;
    var tctx = target.ctx;
    tctx.font = Math.round(cellH * 0.62) + 'px ' + FONT_STACK;
    for (var index = 0; index < centers.length; index++) {
      var midX = centers[index];
      for (var bar = 1; bar <= 3; bar++) {
        var barY = springY + (viewH - springY) * (bar / 4);
        tctx.fillStyle = rgba(palette.dim, 0.75);
        for (var offsetIndex = -1; offsetIndex <= 1; offsetIndex += 1) {
          tctx.fillText('·', midX + offsetIndex * lancetHalf * 0.62, barY);
        }
      }
    }
    tctx.fillStyle = rgba(palette.dim, 0.5);
    for (var tick = 0; tick < 34; tick++) {
      tctx.fillText('─', viewW * 0.012 + tick * (viewW * 0.028), viewH * 0.985);
    }
  });
}

function queueRings() {
  var target = layers.ring;
  var ringRadius = Math.min(target.w, target.h) * 0.5 / 1.06;
  var rimSize = Math.max(7, Math.min(26, cellH * 1.0));

  queueJob(function () {
    var tctx = target.ctx;
    var haze = null;
    try {
      haze = tctx.createRadialGradient(target.w * 0.5, target.h * 0.5, ringRadius * 0.55, target.w * 0.5, target.h * 0.5, ringRadius * 1.04);
      haze.addColorStop(0, rgba(palette.bright, 0));
      haze.addColorStop(0.82, rgba(palette.bright, 0.03));
      haze.addColorStop(0.95, rgba(palette.bright, 0.10));
      haze.addColorStop(1, rgba(palette.mid, 0.05));
    } catch (err) {
      console.error('[367] ring haze gradient failed', err);
      haze = null;
    }
    if (haze) {
      tctx.fillStyle = haze;
      tctx.fillRect(0, 0, target.w, target.h);
    }
  });

  queueJob(function () {
    ringChars(target, ringRadius, STAR_GLYPHS, Math.round(ringRadius * 0.50), rimSize, palette.bright, 0.86, 0);
  });

  queueJob(function () {
    ringChars(target, ringRadius * 0.972, STAR_GLYPHS, Math.round(ringRadius * 0.46), rimSize * 0.9, palette.bright, 0.55, 0.013);
    dotRing(target, ringRadius * 0.938, Math.round(ringRadius * 0.58), cellH * 0.34, palette.mid, 0.9);
  });

  queueJob(function () {
    ringChars(target, ringRadius * 0.900, RUNE_GLYPHS, Math.round(ringRadius * 0.44), rimSize * 1.05, palette.mid, 0.95, 0.004);
  });

  queueJob(function () {
    dotRing(target, ringRadius * 0.862, Math.round(ringRadius * 0.56), cellH * 0.46, palette.dim, 1);
    dotRing(target, ringRadius * 0.838, Math.round(ringRadius * 0.56), cellH * 0.40, palette.dim, 0.85);
  });

  queueJob(function () {
    ringChars(target, ringRadius * 0.778, SEAL_GLYPHS, 24, rimSize * 1.15, palette.bright, 0.74, 0.02);
    ringChars(target, ringRadius * 0.744, ['·'], Math.round(ringRadius * 0.50), cellH * 0.42, palette.mid, 0.85, 0);
  });

  queueJob(function () {
    ringChars(target, ringRadius * 0.702, RUNE_GLYPHS, Math.round(ringRadius * 0.38), rimSize * 0.62, palette.dim, 1, 0);
    ringChars(target, ringRadius * 0.674, ['·', '˙'], Math.round(ringRadius * 0.34), cellH * 0.40, palette.dim, 0.9, 0);
  });

  queueJob(function () {
    var side = target.w * 0.5;
    var tctx = target.ctx;
    tctx.font = Math.round(cellH * 0.5) + 'px ' + FONT_STACK;
    tctx.fillStyle = rgba(palette.dim, 0.95);
    for (var tick = 0; tick < 72; tick++) {
      var angle = tick / 72 * Math.PI * 2;
      if (tick % 6 === 0) {
        tctx.fillStyle = rgba(palette.mid, 0.85);
        tctx.fillText('│', side + Math.cos(angle) * ringRadius * 0.822, side + Math.sin(angle) * ringRadius * 0.822);
      } else {
        tctx.fillStyle = rgba(palette.dim, 0.95);
        tctx.fillText('·', side + Math.cos(angle) * ringRadius * 0.818, side + Math.sin(angle) * ringRadius * 0.818);
      }
    }
  });

  // 骷髅外圈的一圈「机器经文」：密排字符环，把圆圈内部填成墙一样的代码纹
  queueJob(function () {
    var tctx = target.ctx;
    var side = target.w * 0.5;
    tctx.font = Math.round(cellH * 0.78) + 'px ' + FONT_STACK;
    for (var band = 0; band < 3; band++) {
      var radius = ringRadius * (0.615 + band * 0.030);
      var total = Math.round(radius * 2 * Math.PI / (cellW * 0.95));
      for (var step = 0; step < total; step++) {
        var angle = step / total * Math.PI * 2 + band * 0.31;
        var glyph = STAR_GLYPHS[Math.floor(hash01(step * 3.1 + band * 17.7) * STAR_GLYPHS.length) % STAR_GLYPHS.length];
        tctx.fillStyle = rgba(palette.dim, 0.55 + hash01(step * 1.7 + band) * 0.45);
        tctx.fillText(glyph, side + Math.cos(angle) * radius, side + Math.sin(angle) * radius);
      }
    }
  });

  queueJob(function () {
    var tctx = target.ctx;
    var side = target.w * 0.5;
    tctx.font = Math.round(cellH * 0.78) + 'px ' + FONT_STACK;
    for (var band = 3; band < 5; band++) {
      var radius = ringRadius * (0.615 + band * 0.030);
      var total = Math.round(radius * 2 * Math.PI / (cellW * 0.95));
      for (var step = 0; step < total; step++) {
        var angle = step / total * Math.PI * 2 + band * 0.31;
        var glyph = RUNE_GLYPHS[Math.floor(hash01(step * 2.3 + band * 9.1) * RUNE_GLYPHS.length) % RUNE_GLYPHS.length];
        tctx.fillStyle = rgba(palette.dim, 0.5 + hash01(step * 0.7 + band) * 0.5);
        tctx.fillText(glyph, side + Math.cos(angle) * radius, side + Math.sin(angle) * radius);
      }
    }
  });

  queueJob(function () {
    var side = target.w * 0.5;
    var tctx = target.ctx;
    tctx.font = Math.round(rimSize * 0.8) + 'px ' + FONT_STACK;
    tctx.fillStyle = rgba(palette.bright, 0.7);
    for (var markIndex = 0; markIndex < 4; markIndex++) {
      var angle = markIndex * Math.PI * 0.5;
      tctx.fillText('+', side + Math.cos(angle) * ringRadius * 1.02, side + Math.sin(angle) * ringRadius * 1.02);
    }
  });
}

// 归一化坐标（normU 横向、normV 纵向，均为 -1..1）上的骷髅剪影：颅骨椭圆 ∪ 下颌梯形，再挖眼窝/鼻腔/牙缝
function skullField(normU, normV) {
  var craniumX = normU / 0.80;
  var craniumY = (normV + 0.26) / 0.64;
  var insideCranium = craniumX * craniumX + craniumY * craniumY <= 1;
  var jawHalf = 0.56 - 0.20 * ((normV - 0.10) / 0.86);
  var insideJaw = normV >= 0.10 && normV <= 0.97 && Math.abs(normU) <= jawHalf;
  if (!insideCranium && !insideJaw) return 0;
  var eyeLeftX = (normU + 0.37) / 0.245;
  var eyeLeftY = (normV + 0.30) / 0.215;
  var eyeRightX = (normU - 0.37) / 0.245;
  var eyeRightY = (normV + 0.30) / 0.215;
  if (eyeLeftX * eyeLeftX + eyeLeftY * eyeLeftY <= 1) return 0;
  if (eyeRightX * eyeRightX + eyeRightY * eyeRightY <= 1) return 0;
  if (normV > 0.12 && normV < 0.46) {
    var noseHalf = 0.105 * (1 - (normV - 0.12) / 0.34) + 0.014;
    if (Math.abs(normU) < noseHalf) return 0;
  }
  if (normV > 0.50 && normV < 0.575 && Math.abs(normU) < 0.34) return 0;
  if (normV >= 0.575 && Math.abs(normU) < 0.34) {
    var groove = ((normU + 1.4) * 6.5) % 1;
    if (groove < 0.30) return 0;
  }
  return 1;
}

function queueCore() {
  var target = layers.core;
  var side = target.w;
  var cellS = Math.max(8, cellW);
  var colsS = Math.max(9, Math.min(48, Math.round(side * 0.70 / cellS)));
  var rowsS = Math.max(7, Math.min(36, Math.round(side * 0.64 / (cellS * 1.55))));
  var originX = side * 0.5 - colsS * cellS * 0.5;
  var originY = side * 0.5 - rowsS * (cellS * 1.55) * 0.5;
  var stepY = cellS * 1.55;

  queueJob(function () {
    dotRing(target, side * 0.455, Math.round(side * 0.20), cellH * 0.36, palette.dim, 0.85);
    dotRing(target, side * 0.475, Math.round(side * 0.22), cellH * 0.30, palette.mid, 0.5);
  });

  for (var bandStart = 0; bandStart < rowsS; bandStart += 3) {
    (function (firstRow) {
      queueJob(function () {
        var tctx = target.ctx;
        tctx.font = Math.round(stepY * 1.06) + 'px ' + FONT_STACK;
        var lastRow = Math.min(rowsS, firstRow + 3);
        var duCell = 2 / colsS;
        var dvCell = 2 / rowsS;
        for (var row = firstRow; row < lastRow; row++) {
          var normV = (row + 0.5) / rowsS * 2 - 1;
          for (var col = 0; col < colsS; col++) {
            var normU = (col + 0.5) / colsS * 2 - 1;
            var here = skullField(normU, normV);
            var px = originX + col * cellS + cellS * 0.5;
            var py = originY + row * stepY + stepY * 0.5;
            if (here === 1) {
              var edge = skullField(normU - duCell * 0.82, normV) === 0 || skullField(normU + duCell * 0.82, normV) === 0 ||
                skullField(normU, normV - dvCell * 0.82) === 0 || skullField(normU, normV + dvCell * 0.82) === 0;
              if (edge) {
                tctx.fillStyle = rgba(palette.hot, 0.95);
                tctx.fillText('█', px, py);
              } else {
                var stipple = hash01(col * 5.3 + row * 9.1);
                if (stipple < 0.30) {
                  tctx.fillStyle = rgba(palette.mid, 0.55);
                  tctx.fillText('░', px, py);
                } else if (stipple < 0.48) {
                  tctx.fillStyle = rgba(palette.dim, 0.85);
                  tctx.fillText('·', px, py);
                }
              }
            } else {
              var halo = hash01(col * 1.7 + row * 2.3);
              if (halo < 0.09) {
                tctx.fillStyle = rgba(palette.dim, 0.45);
                tctx.fillText('.', px, py);
              }
            }
          }
        }
      });
    })(bandStart);
  }

  queueJob(function () {
    var tctx = target.ctx;
    tctx.font = Math.round(stepY * 0.9) + 'px ' + FONT_STACK;
    var eyes = [-0.37, 0.37];
    for (var i = 0; i < eyes.length; i++) {
      var eyeU = eyes[i];
      var eyeV = -0.30;
      var px = originX + (eyeU + 1) * 0.5 * colsS * cellS;
      var py = originY + (eyeV + 1) * 0.5 * rowsS * stepY;
      tctx.fillStyle = rgba(palette.hot, 1);
      tctx.fillText('●', px, py);
      tctx.fillStyle = rgba(palette.bright, 0.6);
      tctx.fillText('◉', px, py - stepY * 1.15);
      tctx.fillText('◉', px, py + stepY * 1.15);
    }
  });
}

function drawScanBeam(nowMs) {
  if (reducedMotion) return;
  var progress = ((stageState.time * 0.13) % 1 + 1) % 1;
  var beamY = progress * (viewH + 260) - 130;
  var band = 110;
  var grad = null;
  try {
    grad = ctx.createLinearGradient(0, beamY - band, 0, beamY + band);
    grad.addColorStop(0, rgba(palette.bright, 0));
    grad.addColorStop(0.5, rgba(palette.bright, 0.05 + liveState.level * 0.06));
    grad.addColorStop(1, rgba(palette.bright, 0));
  } catch (err) {
    console.error('[367] scan beam gradient failed', err);
    return;
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, beamY - band, viewW, band * 2);
}

function draw(nowMs) {
  ctx.fillStyle = '#010301';
  ctx.fillRect(0, 0, viewW, viewH);
  if (!layers.base) return;

  var time = stageState.time;
  var bass = liveState.bass;
  var beat = liveState.beat;
  var spin = reducedMotion ? 0.35 : time * 0.11;

  ctx.drawImage(layers.base.canvas, 0, 0, viewW, viewH);

  if (layers.ring && layersReady) {
    ctx.save();
    ctx.translate(geometry.cx, geometry.cy);
    ctx.rotate(spin % (Math.PI * 2));
    var ringScale = 1 + (reducedMotion ? 0 : bass * 0.02 + beat * 0.014);
    ctx.scale(ringScale, ringScale);
    ctx.globalAlpha = 0.95;
    var rd = geometry.ringD * 1.06;
    ctx.drawImage(layers.ring.canvas, -rd * 0.5, -rd * 0.5, rd, rd);
    ctx.restore();
  }

  if (layers.core && layersReady) {
    var coreD = geometry.coreD;
    var coreScale = 1 + (reducedMotion ? 0 : bass * 0.014 + linePulse * 0.022);
    ctx.save();
    ctx.translate(geometry.cx, geometry.cy);
    ctx.scale(coreScale, coreScale);
    ctx.globalAlpha = 0.94 + linePulse * 0.06;
    ctx.drawImage(layers.core.canvas, -coreD * 0.5, -coreD * 0.5, coreD, coreD);
    ctx.restore();
  }

  if (!reducedMotion && !lightMode) drawSparks();
  drawScanBeam(nowMs);
}

function drawSparks() {
  var count = 5 + Math.round(liveState.beat * 9);
  var frameSeed = Math.floor(stageState.time * 22) * 37;
  ctx.font = Math.round(cellH * 0.9) + 'px ' + FONT_STACK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < count; i++) {
    var seed = frameSeed + i * 13;
    var sx = hash01(seed) * viewW;
    var sy = hash01(seed + 17) * viewH * 0.60;
    var glyph = STAR_GLYPHS[Math.floor(hash01(seed + 51) * STAR_GLYPHS.length) % STAR_GLYPHS.length];
    ctx.fillStyle = rgba(palette.bright, 0.18 + hash01(seed + 33) * 0.45);
    ctx.fillText(glyph, sx, sy);
  }
}

var lastMs = 0;
var metaCache = '';
var lastPlayingState = null;
var heavyFrames = 0;
var lightMode = false;

function frame(nowMs) {
  sendReady();
  stageState.frames++;
  var start = performance.now();
  var elapsed = lastMs ? Math.min(nowMs - lastMs, 120) : 0;
  if (elapsed > 0 && stageState.playing) stageState.time += elapsed / 1000;
  lastMs = nowMs;

  var index = findIndex(stageState.time);
  if (index !== stageState.idx) stageState.idx = index;

  if (liveState.beat > 0.002) liveState.beat *= 0.9;
  if (linePulse > 0.002) linePulse *= 0.9;

  if (!bakeDone) pumpBake(7);
  draw(nowMs);
  updateLyricDom();

  if (lastPlayingState !== stageState.playing) {
    lastPlayingState = stageState.playing;
    elCursor.classList.toggle('halt', !stageState.playing);
  }

  var meta = 'T+' + clockText(stageState.time) + (stageState.duration > 0 ? ' / ' + clockText(stageState.duration) : '') +
    (liveState.bpm > 0 ? '  ·  ' + Math.round(liveState.bpm) + ' BPM' : '') +
    (stageState.playing ? '  ·  RUN' : '  ·  HALT');
  if (meta !== metaCache) { metaCache = meta; elMetaRight.textContent = meta; }

  stageState.js = Math.round((performance.now() - start) * 100) / 100;
  if (stageState.js > 12) heavyFrames += 1;
  else heavyFrames = Math.max(0, heavyFrames - 2);
  if (heavyFrames > 50) lightMode = true;
  requestAnimationFrame(frame);
}

var resizeTimer = 0;
function handleResize() {
  try {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resizeTimer = 0;
      layout();
    }, 200);
  } catch (err) {
    console.error('[367] resize handling failed', err);
  }
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', handleResize);

layout();
requestAnimationFrame(frame);
setTimeout(sendReady, 900);
</script>
