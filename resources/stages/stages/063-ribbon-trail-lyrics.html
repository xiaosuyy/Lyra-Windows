<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>丝带</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:
    radial-gradient(60% 50% at 50% 42%,rgba(72,44,96,.34),rgba(0,0,0,0) 72%),
    radial-gradient(120% 100% at 50% 50%,#0d0912,#07050a 68%,#040308)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(112% 94% at 50% 48%,transparent 42%,rgba(4,2,6,.56) 82%,rgba(2,1,4,.94))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(238,196,255,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   063 · 丝带 —— 笔尖在笔画里写字，丝带是它留下的长曝光
   ---------------------------------------------------------------------------
   笔路不是扫描行：每个字先被切成一条条"水平墨段"，字内再用**贪心最近端**把
   这些墨段串成一条手一样的轨迹（从左到右、该回笔就回笔），所以笔尖是在字里
   "走"的，不是一行行刷。跨字的接缝（间隙大）算抬笔，不画。

   时间怎么演：笔的位置由时间反解 —— 每个轨迹点带着自己的时刻（= 它所属字的
   chars[k].t，字内再摊开 0.15 秒），笔尖每帧沿轨迹推进到"当前时间对应的弧长"。
   于是唱到哪个字，笔就正好走到哪个字，写出来的部分是亮的丝带，没写的部分只有
   一层很淡的绸底（保证整句永远可读）。

   长曝光：丝带画在半分辨率的磷光层上，每帧只做一次极淡的衰减；颜色按 accent
   分三档（外晕/中间/芯），一次 stroke 一档，绝不逐段设色（坑⑨⑩）。
   笔尖自己带一颗预渲染光斑（坑⑪），并用 beat 相干地提亮。

   和 001-010 的区别：那些是"粒子聚成字"，这里是**一条连续的笔迹**在累积。
   和 061/062 的区别：布和链是整块/整段一起动，这里只有一个笔尖在走。

   YRC：第 k 字的轨迹段时刻压在 chars[k].t（笔提前 0.1 秒到，字内摊开 0.15 秒）；
   缺 chars / 长度不符按 t + dur*k/n 均分。__stage 带 yrc。
   分词：不使用。丝带的魅力就是"一笔一笔"写，按词合并会变成整块闪现。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: true });
const hint = document.getElementById('hint');
const FAM = '"PingFang SC","Microsoft YaHei",system-ui,sans-serif';
const fontOf = (s) => '800 ' + s.toFixed(1) + 'px ' + FAM;

let W = 0, H = 0, DPR = 1, t0 = 0;

/* ---------------- accent 派生色 ---------------- */
let accent = [236, 190, 255];
const C = { core: '', mid: '', halo: '', dot: '', glow: '', tint: '', body: '', bodyL: '' };
const mix = (a, b, k) => Math.round(a + (b - a) * k);
function derive() {
  const r = accent[0], g = accent[1], b = accent[2];
  C.core = 'rgba(' + mix(r, 255, .78) + ',' + mix(g, 255, .78) + ',' + mix(b, 255, .78) + ',1)';
  C.mid = 'rgba(' + mix(r, 255, .34) + ',' + mix(g, 255, .34) + ',' + mix(b, 255, .34) + ',0.42)';
  C.halo = 'rgba(' + mix(r, 255, .12) + ',' + mix(g, 255, .12) + ',' + mix(b, 255, .12) + ',0.10)';
  C.dot = 'rgba(' + mix(r, 255, .9) + ',' + mix(g, 255, .9) + ',' + mix(b, 255, .9) + ',' + '0.95)';
  C.glow = 'rgba(' + r + ',' + g + ',' + b + ',';
  C.tint = 'rgba(' + r + ',' + g + ',' + b + ',';
  C.body = 'rgba(' + mix(r, 250, .66) + ',' + mix(g, 248, .66) + ',' + mix(b, 252, .66) + ',';
  C.bodyL = 'rgba(' + mix(r, 238, .44) + ',' + mix(g, 236, .44) + ',' + mix(b, 244, .44) + ',';
}

/* ---------------- 离屏位图 ---------------- */
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

/* ---------------- 布局 ---------------- */
function splitRows(text) {
  const n = text.length;
  if (n <= 13) return [text];
  const cut = (i) => (i > 0 && i < n && text.charCodeAt(i) >= 0xDC00 && text.charCodeAt(i) <= 0xDFFF) ? i - 1 : i;
  if (n <= 26) { const c = cut(Math.round(n / 2)); return [text.slice(0, c), text.slice(c)]; }
  const a = cut(Math.round(n / 3)), b = cut(Math.round(n * 2 / 3));
  return [text.slice(0, a), text.slice(a, b), text.slice(b)];
}

function makeLayout(text) {
  const s = (text || '').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  const rows = splitRows(s);
  const nr = rows.length;
  const maxW = Math.min(W * 0.86, 1360);
  const maxH = H * 0.58;
  octx.font = fontOf(120);
  let widest = 1;
  for (let i = 0; i < nr; i++) widest = Math.max(widest, octx.measureText(rows[i]).width);
  let fs = Math.min(120 * maxW / widest, maxH / (nr * 1.22), 150);
  fs = Math.max(20, Math.floor(fs));
  octx.font = fontOf(fs);
  let wMax = 1;
  for (let i = 0; i < nr; i++) wMax = Math.max(wMax, octx.measureText(rows[i]).width);
  if (wMax > maxW) { fs = Math.max(18, Math.floor(fs * maxW / wMax)); octx.font = fontOf(fs); }
  const font = fontOf(fs);
  const LH = fs * 1.22;
  const y0 = H / 2 - (nr - 1) * LH / 2;
  const glyphs = [], rowsOut = [];
  let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9, gi = 0;
  for (let r = 0; r < nr; r++) {
    const row = rows[r], ws = [];
    let wsum = 0;
    for (let j = 0; j < row.length; j++) { const w = octx.measureText(row[j]).width; ws.push(w); wsum += w; }
    let x = W / 2 - wsum / 2;
    const y = y0 + r * LH, gr = [];
    for (let j = 0; j < row.length; j++) {
      const w = ws[j];
      glyphs.push({ ch: row[j], x: x + w / 2, y: y, w: w, i: gi });
      gr.push({ i: gi, x0: x, x1: x + w });
      x += w; gi++;
    }
    if (x - wsum < bx0) bx0 = x - wsum;
    if (x > bx1) bx1 = x;
    rowsOut.push({ y: y, g: gr, w: wsum });
    if (y - fs * 0.68 < by0) by0 = y - fs * 0.68;
    if (y + fs * 0.68 > by1) by1 = y + fs * 0.68;
  }
  return { glyphs: glyphs, rows: rowsOut, fs: fs, LH: LH, nr: nr, n: s.length, font: font, bx0: bx0, bx1: bx1, by0: by0, by1: by1 };
}

/* ---------------- 字形采样点（扫描顺序，带"属于第几个字"） ---------------- */
let cloudN = 0;
function glyphCloud(L, budget) {
  if (!L) return null;
  const n = L.glyphs.length;
  if (!n) return null;
  let area = 0;
  for (let i = 0; i < n; i++) area += L.fs * L.fs * 1.30;
  let S = Math.sqrt(Math.max(1, area * 0.45) / Math.max(240, budget));
  S = Math.max(2, Math.min(14, Math.round(S)));
  const pad = 6;
  const bx = Math.floor(L.bx0) - pad, by = Math.floor(L.by0) - pad;
  const bw = Math.max(4, Math.ceil(L.bx1 - L.bx0) + pad * 2);
  const bh = Math.max(4, Math.ceil(L.by1 - L.by0) + pad * 2);
  if (off.width !== bw || off.height !== bh) { off.width = bw; off.height = bh; }
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, bw, bh);
  octx.font = L.font; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  for (let i = 0; i < n; i++) octx.fillText(L.glyphs[i].ch, L.glyphs[i].x - bx, L.glyphs[i].y - by);
  const d = octx.getImageData(0, 0, bw, bh).data;
  const xs = [], ys = [], pc = [];
  const rows = L.rows;
  for (let y = 0; y < bh; y += S) {
    const ay = y + by;
    let best = 0, bd = 1e9;
    for (let k = 0; k < rows.length; k++) { const dd = Math.abs(rows[k].y - ay); if (dd < bd) { bd = dd; best = k; } }
    const g = rows[best].g;
    if (!g.length) continue;
    const rowOff = y * bw;
    for (let x = 0; x < bw; x += S) {
      if (d[(rowOff + x) * 4 + 3] <= 128) continue;
      const ax = x + bx;
      let kk;
      if (ax <= g[0].x0) kk = 0;
      else if (ax >= g[g.length - 1].x1) kk = g.length - 1;
      else {
        let lo = 0, hi = g.length - 1;
        while (lo < hi) { const m = (lo + hi) >> 1; if (g[m].x1 < ax) lo = m + 1; else hi = m; }
        kk = lo;
      }
      xs.push(ax); ys.push(ay); pc.push(g[kk].i);
    }
  }
  cloudN = xs.length;
  return { xs: Float32Array.from(xs), ys: Float32Array.from(ys), pc: Int16Array.from(pc), n: xs.length, step: S };
}

/* ---------------- 逐字时刻 ---------------- */
function charTimes(line, n) {
  const out = new Float32Array(n);
  const chs = line ? line.chars : null;
  const txt = line ? (line.text || '') : '';
  let ok = !!(chs && chs.length === txt.length && txt.length === n && n > 0);
  if (ok) {
    let prev = -1e9;
    for (let k = 0; k < n; k++) {
      const v = chs[k] ? +chs[k].t : NaN;
      if (!isFinite(v)) { ok = false; break; }
      if (v > prev) prev = v;
      out[k] = prev;
    }
  }
  if (!ok) {
    const base = line ? (+line.t || 0) : 0, dur = (line && line.dur > 0) ? line.dur : 4;
    for (let k = 0; k < n; k++) out[k] = base + dur * k / Math.max(1, n);
  }
  return { t: out, ok: ok };
}

/* ---------------- 绸底（没写到的字也要读得出来） ---------------- */
let silk = null, silkX = 0, silkY = 0, silkW = 1, silkH = 1, silkA = 0;
const SILK_S = 0.55;
function bakeSilk(L) {
  if (!L) { silk = null; return; }
  if (!silk) silk = document.createElement('canvas');
  const pad = 30;
  silkX = Math.floor(L.bx0 - pad); silkY = Math.floor(L.by0 - pad);
  silkW = Math.max(8, Math.ceil(L.bx1 - L.bx0 + pad * 2));
  silkH = Math.max(8, Math.ceil(L.by1 - L.by0 + pad * 2));
  silk.width = Math.round(silkW * SILK_S); silk.height = Math.round(silkH * SILK_S);
  const g = silk.getContext('2d');
  g.setTransform(SILK_S, 0, 0, SILK_S, 0, 0);
  g.clearRect(0, 0, silkW, silkH);
  g.font = L.font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = C.bodyL + '0.28)';
  for (let i = 0; i < L.glyphs.length; i++) g.fillText(L.glyphs[i].ch, L.glyphs[i].x - silkX, L.glyphs[i].y - silkY);
  g.globalCompositeOperation = 'source-atop';
  g.lineWidth = 1;
  g.strokeStyle = 'rgba(255,255,255,0.075)';
  const p = new Path2D();
  for (let x = -silkH; x < silkW + silkH; x += 6) { p.moveTo(x, 0); p.lineTo(x + silkH, silkH); }
  g.stroke(p);
  g.globalCompositeOperation = 'source-over';
  silkA = 0;
}
function lightSilk(k) {
  if (!silk || !curLay) return;
  const gl = curLay.glyphs[k];
  if (!gl) return;
  const g = silk.getContext('2d');
  g.setTransform(SILK_S, 0, 0, SILK_S, 0, 0);
  g.font = curLay.font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = C.body + '0.26)';
  g.fillText(gl.ch, gl.x - silkX, gl.y - silkY);
}

/* ---------------- 磷光层（长曝光） ---------------- */
let trail = null, tctx = null;
const TR_S = 0.5;                        /* 半分辨率：衰减和叠加都省一半像素 */

/* ---------------- 笔路 ---------------- */
const K_BUDGET = 2100;
let PN = 0, STEP = 9;
let pX = null, pY = null, pT = null, pS = null, pLift = null;
let penI = 0, penArc = 0, penX = 0, penY = 0, penOn = false, penLift = false;
let pinT = Infinity, released = false, lastT = -1, curYrc = false, curCT = null, curLay = null, lit = 0;

function buildPath(L, cloud, ct) {
  PN = 0;
  if (!cloud || !cloud.n) { pinT = Infinity; return; }
  STEP = cloud.step || 9;
  const n = cloud.n;
  /* 1) 切成墨段：同一扫描行、同一个字、x 连续 */
  const rS = [], rE = [];
  let st = 0, pKy = Math.round(cloud.ys[0] / STEP), pKx = Math.round(cloud.xs[0] / STEP), pCh = cloud.pc[0];
  for (let j = 1; j < n; j++) {
    const ky = Math.round(cloud.ys[j] / STEP), kx = Math.round(cloud.xs[j] / STEP), ch = cloud.pc[j];
    if (ky !== pKy || ch !== pCh || kx - pKx > 1.4) { rS.push(st); rE.push(j); st = j; }
    pKy = ky; pKx = kx; pCh = ch;
  }
  if (n - st >= 1) { rS.push(st); rE.push(n); }
  const nr = rS.length;

  /* 2) 按字分组（字的顺序 = 时间顺序），字内贪心串成手写轨迹 */
  const X = [], Y = [], T = [], LIFT = [];
  const nch = L.glyphs.length;
  const byCh = new Array(nch);
  for (let q = 0; q < nr; q++) {
    const ch = cloud.pc[rS[q]];
    if (ch < 0 || ch >= nch) continue;
    (byCh[ch] || (byCh[ch] = [])).push(q);
  }
  let prevEnd = -1;
  for (let ch = 0; ch < nch; ch++) {
    const list = byCh[ch];
    if (!list || !list.length) continue;
    const t0c = (ct && ct.length) ? ct[Math.min(ct.length - 1, ch)] : 0;
    /* 该字一共多少点，用来把字内时间摊开 */
    let cnt = 0;
    for (let q = 0; q < list.length; q++) cnt += rE[list[q]] - rS[list[q]];
    const used = new Uint8Array(list.length);
    let curRi = -1, curFwd = true;
    let cx = 0, cy = 0;
    let done = 0;
    while (done < list.length) {
      let bi = -1, bd = 1e18, bFwd = true;
      if (curRi < 0) {
        bi = list[0];
      } else {
        for (let q = 0; q < list.length; q++) {
          if (used[q]) continue;
          const ri = list[q];
          const ax = cloud.xs[rS[ri]], ay = cloud.ys[rS[ri]];
          const bx = cloud.xs[rE[ri] - 1], by = cloud.ys[rE[ri] - 1];
          const da = (ax - cx) * (ax - cx) + (ay - cy) * (ay - cy);
          const db = (bx - cx) * (bx - cx) + (by - cy) * (by - cy);
          if (da < bd) { bd = da; bi = ri; bFwd = true; }
          if (db < bd) { bd = db; bi = ri; bFwd = false; }
        }
      }
      if (bi < 0) break;
      let qi = -1;
      for (let q = 0; q < list.length; q++) if (list[q] === bi) { qi = q; break; }
      if (qi < 0) break;
      used[qi] = 1;
      /* 落点 */
      for (let k = 0; k < (rE[bi] - rS[bi]); k++) {
        const j = bFwd ? (rS[bi] + k) : (rE[bi] - 1 - k);
        const x = cloud.xs[j], y = cloud.ys[j];
        const isFirst = X.length === 0;
        const dx = isFirst ? 0 : (x - X[X.length - 1]);
        const dy = isFirst ? 0 : (y - Y[Y.length - 1]);
        const jump = Math.sqrt(dx * dx + dy * dy);
        X.push(x); Y.push(y);
        T.push(t0c + 0.15 * (done / Math.max(1, cnt)) + 0.15 * (k / Math.max(1, rE[bi] - rS[bi])));
        LIFT.push(isFirst ? 0 : ((k === 0 || jump > STEP * 1.9) ? 1 : 0));
      }
      done += rE[bi] - rS[bi];
      curRi = bi;
      cx = bFwd ? cloud.xs[rE[bi] - 1] : cloud.xs[rS[bi]];
      cy = bFwd ? cloud.ys[rE[bi] - 1] : cloud.ys[rS[bi]];
      prevEnd = ch;
    }
  }
  PN = X.length;
  if (!PN) { pinT = Infinity; return; }
  pX = Float32Array.from(X); pY = Float32Array.from(Y);
  pT = Float32Array.from(T); pLift = Uint8Array.from(LIFT);
  pS = new Float32Array(PN);
  for (let i = 1; i < PN; i++) {
    const dx = pX[i] - pX[i - 1], dy = pY[i] - pY[i - 1];
    pS[i] = pS[i - 1] + (pLift[i] ? 0 : Math.sqrt(dx * dx + dy * dy));
  }
  penI = 0; penArc = 0; penX = pX[0]; penY = pY[0]; penOn = true; penLift = true;
  { let ymin=1e9,ymax=-1e9,lifts=0; for(let i=0;i<PN;i++){ if(pY[i]<ymin)ymin=pY[i]; if(pY[i]>ymax)ymax=pY[i]; if(pLift[i])lifts++; } window.__p={n:PN,ymin:ymin,ymax:ymax,lifts:lifts,x0:pX[0],y0:pY[0],x1:pX[PN-1],y1:pY[PN-1],t0:pT[0],t1:pT[PN-1]}; }
  let mx = -1e9;
  for (let i = 0; i < PN; i++) if (pT[i] > mx) mx = pT[i];
  pinT = mx > -1e8 ? mx : Infinity;
  released = false;
  clearTrail();
}

function clearTrail() {
  if (!trail) return;
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.globalCompositeOperation = 'source-over';
  tctx.clearRect(0, 0, trail.width, trail.height);
}

/* 时间 → 笔的轨迹下标（浮点） */
function idxAtTime(T) {
  if (!PN) return 0;
  if (T <= pT[0]) return 0;
  if (T >= pT[PN - 1]) return PN - 1;
  let lo = 0, hi = PN - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (pT[m] < T) lo = m + 1; else hi = m; }
  const a = Math.max(0, lo - 1), b = lo;
  const dt = pT[b] - pT[a];
  const f = dt > 1e-6 ? (T - pT[a]) / dt : 1;
  return a + Math.max(0, Math.min(1, f));
}

/* 画从下标 a 到 b 的一段丝带（跨抬笔就断开） */
function drawRibbon(a, b) {
  if (b <= a) return;
  const pCore = new Path2D(), pMid = new Path2D();
  let started = false;
  let guard = 0;
  let i = Math.floor(a);
  const iEnd = Math.min(PN - 1, Math.ceil(b));
  let px0 = 0, py0 = 0;
  /* 起点插值 */
  const fa = a - Math.floor(a);
  px0 = pX[i] + (pX[i + 1] - pX[i]) * fa;
  py0 = pY[i] + (pY[i + 1] - pY[i]) * fa;
  for (; i <= iEnd && guard++ < 900; i++) {
    if (pLift[i]) started = false;
    const x = pX[i], y = pY[i];
    if (!started) { pCore.moveTo(px0, py0); pMid.moveTo(px0, py0); started = true; }
    pCore.lineTo(x, y);
    pMid.lineTo(x, y);
  }
  tctx.setTransform(TR_S, 0, 0, TR_S, 0, 0);
  tctx.globalCompositeOperation = 'lighter';
  tctx.lineCap = 'round'; tctx.lineJoin = 'round';
  tctx.strokeStyle = C.halo; tctx.lineWidth = 11; tctx.stroke(pMid);
  tctx.strokeStyle = C.mid; tctx.lineWidth = 4.2; tctx.stroke(pMid);
  tctx.strokeStyle = C.core; tctx.lineWidth = 1.7; tctx.stroke(pCore);
}

/* ---------------- 时间 / 节奏 ---------------- */
let lines = [];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ================= 节奏：1-10 的教训固化在这里 =================
   ① 显示与酝酿分离 —— curIdx 只在句首切换，brewIdx 提前 lead 秒准备
   ② 索引单调不回退 —— 时钟在 tick 之间外推、tick 一来会往回缩一点
   ③ 提前量自适应 —— 快歌早开始，慢歌不提前太多
   ④ 只有拖进度条（时间明显倒退）才允许重置
   ================================================================ */
let curIdx = -1, brewIdx = -1;
const LEAD = 1.3;
let pend = null, pendIdx = -1;

function brewLine(i) {
  const L = lines[i];
  const lay = L && L.text ? makeLayout(L.text) : null;
  pend = lay ? { lay: lay, cloud: glyphCloud(lay, K_BUDGET) } : null;
  pendIdx = i;
}
function applyLine(lay, cloud, i) {
  curLay = lay;
  if (!lay) { curCT = null; curYrc = false; PN = 0; silk = null; return; }
  const tm = charTimes(lines[i], lay.glyphs.length);
  curCT = tm.t; curYrc = tm.ok; lit = 0;
  bakeSilk(lay);
  buildPath(lay, cloud, curCT);
  penI = idxAtTime(now());
  penArc = 0;
}
function startLine(i) {
  if (pendIdx !== i) brewLine(i);
  const b = pend; pend = null; pendIdx = -1;
  applyLine(b ? b.lay : null, b ? b.cloud : null, i);
}
function relayout() {
  if (curIdx >= 0 && lines[curIdx] && lines[curIdx].text) {
    const lay = makeLayout(lines[curIdx].text);
    applyLine(lay, lay ? glyphCloud(lay, K_BUDGET) : null, curIdx);
    const T = now();
    lit = 0;
    if (curCT) while (lit < curCT.length && T >= curCT[lit]) { lightSilk(lit); lit++; }
  } else { curLay = null; PN = 0; silk = null; }
}

function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1; pend = null; pendIdx = -1;
    curLay = null; curCT = null; lit = 0; PN = 0; silk = null;
    clearTrail();
  }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    if (ci >= 0) startLine(ci); else { PN = 0; silk = null; clearTrail(); }
    hint.style.opacity = lines.length ? (ci >= 0 ? '0' : '1') : '0.5';
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) { brewIdx = nx; brewLine(nx); }
  }
  if (curCT) while (lit < curCT.length && T >= curCT[lit]) { lightSilk(lit); lit++; }
  /* 松笔：写完 0.55 秒后笔离开纸面（痕迹继续衰减） */
  if (!released && T > pinT + 0.55) { released = true; penOn = false; }
}

/* ---------------- 绘制 ---------------- */
let last = performance.now();
let tipSpr = null, beatP = 0;
let fadeDt = 0.06, lastMs = performance.now();

function makeTip() {
  const s = 128;
  if (!tipSpr) tipSpr = document.createElement('canvas');
  tipSpr.width = s; tipSpr.height = s;
  const g = tipSpr.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0, 'rgba(255,252,255,0.95)');
  rg.addColorStop(0.10, C.glow + '0.55)');
  rg.addColorStop(0.34, C.glow + '0.16)');
  rg.addColorStop(1, C.glow + '0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
}

function draw(T) {
  /* 磷光衰减：**按时间**衰减（不是按帧，帧率一变亮度就变），
     而且每 0.05 秒才擦一次 —— 8 位 alpha 下 0.001 量级的逐帧擦会被舍成 0。 */
  if (trail) {
    fadeDt += Math.min(0.06, (performance.now() - lastMs) / 1000);
    if (fadeDt > 0.05) {
      const a = 1 - Math.exp(-0.10 * fadeDt);
      tctx.setTransform(1, 0, 0, 1, 0, 0);
      tctx.globalCompositeOperation = 'destination-out';
      tctx.fillStyle = 'rgba(0,0,0,' + a.toFixed(3) + ')';
      tctx.fillRect(0, 0, trail.width, trail.height);
      fadeDt = 0;
    }
  }
  /* 笔尖推进 */
  if (PN && penOn) {
    const ti = idxAtTime(T);
    if (ti > penI) {
      drawRibbon(penI, ti);
      penI = ti;
    } else if (ti < penI - 0.5) { penI = ti; }        /* 拖进度条：不补画 */
    const i0 = Math.min(PN - 1, Math.max(0, Math.floor(penI)));
    const f = penI - i0;
    const i1 = Math.min(PN - 1, i0 + 1);
    penX = pX[i0] + (pX[i1] - pX[i0]) * f;
    penY = pY[i0] + (pY[i1] - pY[i0]) * f;
    penLift = !!pLift[i0];
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);

  /* 镜头：极慢推拉 + 漂移（整条丝带和绸底一起进去，只有一张 blit） */
  const zoom = 1.006 + 0.014 * Math.sin(t0 * 0.043);
  const panX = Math.sin(t0 * 0.037) * W * 0.007;
  const panY = Math.cos(t0 * 0.029) * H * 0.006;
  ctx.save();
  ctx.translate(W * 0.5 + panX, H * 0.5 + panY);
  ctx.scale(zoom, zoom);
  ctx.translate(-W * 0.5, -H * 0.5);

  if (silk) {
    silkA = Math.min(1, silkA + 0.09);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (0.92 + 0.10 * beatP) * silkA;
    ctx.drawImage(silk, silkX, silkY, silkW, silkH);
    ctx.globalAlpha = 1;
  }
  if (trail) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1 + 0.10 * beatP;
    ctx.drawImage(trail, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  /* 刚写出来的那一段：湿的（笔尖后面 26 个点重新提亮一次），
     和磷光层里正在衰减的旧笔迹形成"长曝光"的前后关系 */
  if (PN && penOn) {
    const i1 = Math.min(PN - 1, Math.floor(penI)), i0 = Math.max(0, i1 - 26);
    if (i1 > i0) {
      const pf = new Path2D();
      let st = false;
      for (let i = i0; i <= i1; i++) {
        if (pLift[i]) st = false;
        if (!st) { pf.moveTo(pX[i], pY[i]); st = true; } else pf.lineTo(pX[i], pY[i]);
      }
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = C.glow + '0.08)'; ctx.lineWidth = 13; ctx.stroke(pf);
      ctx.strokeStyle = C.core; ctx.lineWidth = 3.2; ctx.stroke(pf);
    }
  }
  /* 笔尖：一颗预渲染光斑 + 一个亮点（坑⑪） */
  if (PN && penOn && !penLift && tipSpr) {
    ctx.globalCompositeOperation = 'lighter';
    const s = 30 + 16 * beatP;
    ctx.drawImage(tipSpr, penX - s, penY - s, s * 2, s * 2);
    ctx.fillStyle = C.dot;
    ctx.fillRect(penX - 1.6, penY - 1.6, 3.2, 3.2);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  if (beatP > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = C.glow + (0.030 * beatP).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
}

function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();
  timing(T);
  beatP *= Math.exp(-dt * 2.6);
  draw(T);
  requestAnimationFrame(frame);
}

/* ---------------- 尺寸 ---------------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (!trail) trail = document.createElement('canvas');
  trail.width = Math.max(8, Math.round(cv.width * TR_S));
  trail.height = Math.max(8, Math.round(cv.height * TR_S));
  tctx = trail.getContext('2d');
  derive(); makeTip();
  if (lines.length) relayout(); else { PN = 0; }
}
addEventListener('resize', resize);

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1; pend = null; pendIdx = -1;
    curLay = null; curCT = null; curYrc = false; lit = 0; PN = 0; penOn = false;
    silk = null; released = false;
    if (p.accent) accent = p.accent;
    derive(); makeTip(); clearTrail();
    clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 踩拍：笔尖更亮、丝带整条亮一档（相干），不改变笔的位置 */
    beatP = Math.min(1.4, beatP + 0.40 + (d.payload.level || 0) * 0.5);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

resize();
requestAnimationFrame(frame);

window.__dumpTrail = () => (trail ? trail.toDataURL('image/png') : 'none');
window.__dumpSilk = () => (silk ? silk.toDataURL('image/png') : 'none');
window.__stage = () => ({
  lines: lines.length, curIdx: curIdx, brewIdx: brewIdx, yrc: !!curYrc,
  lit: lit, chars: curCT ? curCT.length : 0, rows: curLay ? curLay.nr : 0,
  fs: curLay ? +curLay.fs.toFixed(1) : 0,
  path: PN, penI: +penI.toFixed(1), penOn: penOn, released: released,
  cloud: cloudN, T: +now().toFixed(2)
});
</script>
</body>
</html>
