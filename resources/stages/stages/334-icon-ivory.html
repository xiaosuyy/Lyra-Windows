<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>334 · 圣像留白</title>
<style>
  :root{ --paper:#f4f0e7; --ink:#2b2419; --ink-soft:#6d6355; --hair:rgba(58,48,36,.22);
         --pad-x:clamp(18px,4vw,56px); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper)}
  body{overflow:hidden;background:var(--paper);color:var(--ink);
       font-family:"EB Garamond",Garamond,Georgia,"Times New Roman","Songti SC",
                   "Source Han Serif SC","Noto Serif SC","STSong",SimSun,serif;
       -webkit-font-smoothing:antialiased}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #stage{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
         padding:clamp(14px,3vh,32px) var(--pad-x)}
  #stage::after{content:"";position:absolute;pointer-events:none;
         inset:clamp(7px,1.5vh,16px) clamp(7px,1.3vw,18px);
         border:1px solid rgba(58,48,36,.10)}
  .mast{display:flex;justify-content:space-between;align-items:baseline;gap:16px;overflow:hidden;
        font-size:clamp(9px,1vw,12px);letter-spacing:.24em;text-transform:uppercase;
        color:#5f564a;white-space:nowrap}
  .mast .ttl{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mast .ttl b{font-weight:500;color:#3a3126;letter-spacing:.18em}
  .rule{height:1px;margin-top:clamp(8px,1.4vh,14px);
        background:linear-gradient(90deg,transparent,rgba(58,48,36,.28) 14%,rgba(58,48,36,.28) 86%,transparent)}
  main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:clamp(16px,3.6vh,40px)}
  .relic{margin:0;display:flex;align-items:flex-end;justify-content:center;
         gap:clamp(10px,1.5vw,24px);transform-origin:50% 100%}
  .plate{position:relative;display:block;background:#e8e0ce;
         box-shadow:0 1px 0 rgba(255,255,255,.65),0 12px 26px -20px rgba(60,45,25,.6)}
  .plate canvas{display:block;width:100%;height:100%}
  .plate-icon{height:clamp(150px,34vh,330px);aspect-ratio:1280/2312;transform:rotate(-.16deg)}
  .plate-rock{height:clamp(58px,11.5vh,122px);aspect-ratio:1280/853;transform:rotate(.26deg)}
  .relic-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.3vh,14px)}
  .cap{margin:0;font-size:clamp(8px,.95vw,11px);letter-spacing:.32em;
       text-transform:uppercase;color:rgba(58,48,36,.60);text-align:center}
  .lyr{width:100%;max-width:min(88vw,1040px);display:flex;flex-direction:column;align-items:center;
       gap:clamp(6px,1.2vh,12px);text-align:center}
  .ly{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ly-prev,.ly-next{font-size:clamp(11px,1.25vw,17px);letter-spacing:.06em;color:rgba(43,36,25,.46)}
  .ly-cur{white-space:normal;word-break:normal;overflow-wrap:break-word;overflow:visible;
          font-size:var(--cur-size,32px);line-height:1.42;letter-spacing:.03em;min-height:1.42em;
          color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.62),0 0 22px rgba(255,252,244,.55);
          animation:lyIn .62s cubic-bezier(.2,.7,.25,1)}
  .ly-cur .ch{display:inline-block;opacity:.32;transform:translateY(.10em);
              transition:opacity .34s ease,transform .34s ease}
  .ly-cur .ch.on{opacity:1;transform:none}
  @keyframes lyIn{from{opacity:0;transform:translateY(.34em);filter:blur(2.5px)}
                   to{opacity:1;transform:none;filter:blur(0)}}
  .lyr.is-empty .ly,.lyr.is-empty .prog{display:none}
  @media (prefers-reduced-motion:reduce){
    .ly-cur{animation:none}
    .ly-cur .ch{transition:none;opacity:.4}
    .ly-cur .ch.on{opacity:1}
  }
  .prog{position:relative;width:min(42vw,300px);height:1px;margin-top:clamp(6px,1.2vh,12px);
        background:rgba(58,48,36,.14)}
  .prog i{position:absolute;left:0;top:0;height:1px;width:0;background:rgba(58,48,36,.5)}
  .prog u{position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;left:0;
          background:#8a7134;transform:translateX(-50%)}
  .empty{display:none;flex-direction:column;align-items:center;gap:10px}
  .empty .zh{font-size:clamp(15px,1.7vw,22px);letter-spacing:.34em;color:rgba(43,36,25,.62)}
  .empty .la{font-size:clamp(8px,.95vw,11px);letter-spacing:.34em;text-transform:uppercase;color:rgba(58,48,36,.4)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:14px;
        font-size:clamp(9px,1vw,12px);letter-spacing:.2em;color:rgba(58,48,36,.74);
        font-variant-numeric:tabular-nums}
  @media (max-aspect-ratio:4/5){ .plate-icon{height:clamp(140px,26vh,250px)} .plate-rock{height:clamp(40px,7vh,70px)} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <header class="mast"><div class="ttl" id="mast"></div><div>Pl. XXXIV</div></header>
  <div class="rule"></div>
  <main>
    <div class="relic-wrap">
      <figure class="relic">
        <div class="plate plate-icon" id="pi"><canvas id="ci"></canvas></div>
        <div class="plate plate-rock" id="pr"><canvas id="cr"></canvas></div>
      </figure>
      <div class="cap">Sinai · 6th c. &nbsp;·&nbsp; Bhimbetka</div>
    </div>
    <div class="lyr">
      <div class="ly ly-prev" id="lprev"></div>
      <div class="ly ly-cur" id="lcur"></div>
      <div class="ly ly-next" id="lnext"></div>
      <div class="prog"><i id="pfill"></i><u id="pdot"></u></div>
      <div class="empty" id="empty"><div class="zh">纯器乐 · 无词</div><div class="la">Instrumental</div></div>
    </div>
  </main>
  <footer class="foot"><div id="tnow">00:00</div><div id="tall">--:--</div></footer>
</div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d', {alpha:false});
var W = 1440, H = 900, DPR = 1;

var S = { lines:[], idx:-1, t:0, playing:true, dur:0, frames:0, js:0,
          rm:false, text:'', song:{}, accent:[200,160,74], hasLy:false };

/* ---------- ready: exactly once, in rAF + timer fallback ---------- */
var readySent = false;
function sendReady(){
  if(readySent) return; readySent = true;
  try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
}
requestAnimationFrame(sendReady);
setTimeout(sendReady, 300);

/* ---------- helpers ---------- */
function num(v, d){ v = typeof v === 'number' ? v : parseFloat(v); return isFinite(v) ? v : d; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function mmss(s){ s = Math.max(0, Math.round(num(s,0))); var m = Math.floor(s/60), r = s%60;
  return (m<10?'0':'') + m + ':' + (r<10?'0':'') + r; }

/* ---------- layout ---------- */
var BDPR = 1, rebuildQueued = false;
function resize(){
  W = Math.round(window.innerWidth || 1440);
  H = Math.round(window.innerHeight || 900);
  if(!isFinite(W) || W <= 0) W = 1440;
  if(!isFinite(H) || H <= 0) H = 900;
  W = Math.max(320, W); H = Math.max(240, H);
  DPR = clamp(window.devicePixelRatio || 1, 1, 2);
  /* the paper ground is nearly flat: cap its backing store, keep panels crisp */
  BDPR = DPR;
  var px = W * H * BDPR * BDPR;
  if(px > 6.0e6) BDPR = Math.max(1, Math.sqrt(6.0e6 / (W * H)));
  cv.width = Math.round(W * BDPR); cv.height = Math.round(H * BDPR);
  ctx.setTransform(BDPR, 0, 0, BDPR, 0, 0);
  if(!rebuildQueued){
    rebuildQueued = true;
    requestAnimationFrame(function(){
      rebuildQueued = false;
      buildPaper(); seedSpecks(); paintPanels(); refreshLyricSize();
    });
  }
}
window.addEventListener('resize', resize);

/* ---------- colour / random helpers ---------- */
function rgba(c, a){
  var r = Math.round(clamp(num(c[0],0),0,255)),
      g = Math.round(clamp(num(c[1],0),0,255)),
      b = Math.round(clamp(num(c[2],0),0,255));
  return 'rgba(' + r + ',' + g + ',' + b + ',' + (Math.round(clamp(num(a,0),0,1)*1000)/1000) + ')';
}
function addStop(g, pos, col){ try{ g.addColorStop(clamp(num(pos,0),0,1), col); }catch(e){} }
function rng(seed){
  var s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- paper ground (baked once per resize) ---------- */
var paper = document.createElement('canvas');
var glowGrad = null, relicBox = null, glowBox = null, relicEl = null;
function makeGrain(){
  var s = 160, t = document.createElement('canvas');
  t.width = s; t.height = s;
  var g = t.getContext('2d'), rnd = rng(334061);
  for(var i=0;i<2400;i++){
    var v = rnd();
    g.fillStyle = v > 0.55
      ? 'rgba(255,252,244,' + (0.05 + rnd()*0.20).toFixed(3) + ')'
      : 'rgba(120,102,78,' + (0.03 + rnd()*0.09).toFixed(3) + ')';
    g.fillRect(Math.round(rnd()*s), Math.round(rnd()*s), 1, 1);
  }
  for(var j=0;j<9;j++){
    var x = rnd()*s, y = rnd()*s;
    g.strokeStyle = 'rgba(128,110,84,' + (0.05 + rnd()*0.05).toFixed(3) + ')';
    g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x+26*rnd(), y+(rnd()-.5)*10, x+58*rnd(), y+(rnd()-.5)*10, x+18+72*rnd(), y+(rnd()-.5)*14);
    g.stroke();
  }
  return t;
}
function buildPaper(){
  paper.width = Math.round(W*BDPR); paper.height = Math.round(H*BDPR);
  var g = paper.getContext('2d');
  g.setTransform(BDPR, 0, 0, BDPR, 0, 0);

  var bg = g.createLinearGradient(0, 0, 0, H);
  addStop(bg, 0, '#f8f4ec'); addStop(bg, 0.5, '#f4f0e7'); addStop(bg, 1, '#eee7d8');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  var pat = null;
  try { pat = g.createPattern(makeGrain(), 'repeat'); } catch(e){ pat = null; }
  if(pat){ g.fillStyle = pat; g.fillRect(0, 0, W, H); }

  var vig = g.createRadialGradient(W*0.5, H*0.46, Math.min(W,H)*0.30,
                                   W*0.5, H*0.46, Math.max(W,H)*0.80);
  addStop(vig, 0, 'rgba(92,74,50,0)');
  addStop(vig, 0.72, 'rgba(92,74,50,0.05)');
  addStop(vig, 1, 'rgba(88,70,46,0.13)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);

  var host = relicEl || document.querySelector('.relic');
  relicEl = host;
  var r = host ? host.getBoundingClientRect() : { left:W/2, top:H*0.18, width:1, height:1 };
  relicBox = { x:r.left, y:r.top, w:Math.max(1, r.width), h:Math.max(1, r.height),
               cx:r.left + r.width/2, cy:r.top + r.height/2 };
  var rad = Math.max(relicBox.w, relicBox.h) * 1.16 + Math.min(W,H)*0.05;
  glowBox = { x:relicBox.cx - rad, y:relicBox.cy - rad, w:rad*2, h:rad*2 };
  glowGrad = ctx.createRadialGradient(relicBox.cx, relicBox.cy, 0, relicBox.cx, relicBox.cy, rad);
  addStop(glowGrad, 0,    rgba([216,178,110], 1));
  addStop(glowGrad, 0.38, rgba([214,178,116], 0.52));
  addStop(glowGrad, 0.72, rgba([212,180,126], 0.16));
  addStop(glowGrad, 1,    rgba([212,180,126], 0));
}

/* ---------- the two relics ---------- */
var IMGS = { icon:{ img:null }, rock:{ img:null } };
function loadImg(src, key){
  var im = new Image();
  try { im.decoding = 'async'; } catch(e){}
  im.onload = function(){ IMGS[key].img = im; paintPanels(); };
  im.onerror = function(){ IMGS[key].img = null; paintPanels(); };
  im.src = src;
}
function drawCover(g, im, w, h){
  var iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  if(!iw || !ih) return;
  var s = Math.max(w/iw, h/ih);
  var dw = iw*s, dh = ih*s;
  g.drawImage(im, (w-dw)/2, (h-dh)/2, dw, dh);
}
function paintPanel(el, key, seed){
  if(!el) return;
  var r = el.getBoundingClientRect();
  var w = Math.round(el.clientWidth || r.width), h = Math.round(el.clientHeight || r.height);
  if(!isFinite(w) || !isFinite(h) || w < 8 || h < 8) return;
  var d = DPR;
  el.width = Math.round(w*d); el.height = Math.round(h*d);
  var g = el.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, w, h);

  var im = IMGS[key].img;
  if(im && im.naturalWidth){ drawCover(g, im, w, h); }
  else { paintFallback(g, w, h, key, seed); }

  var rnd = rng(seed);
  /* warm age wash */
  g.fillStyle = key === 'icon' ? 'rgba(198,158,94,0.10)' : 'rgba(130,96,64,0.05)';
  g.fillRect(0, 0, w, h);

  /* cracks */
  var min = Math.min(w, h);
  g.lineCap = 'round';
  for(var c=0;c<5;c++){
    var x = rnd()*w, y = rnd()*h, ang = rnd()*Math.PI*2;
    g.beginPath(); g.moveTo(x, y);
    var segs = 3 + Math.floor(rnd()*6);
    for(var k=0;k<segs;k++){
      ang += (rnd()-0.5)*1.7;
      var len = min * (0.05 + rnd()*0.16);
      x += Math.cos(ang)*len; y += Math.sin(ang)*len;
      g.lineTo(x, y);
    }
    g.lineWidth = 0.5 + rnd()*0.6;
    g.strokeStyle = 'rgba(46,32,18,' + (0.05 + rnd()*0.08).toFixed(3) + ')';
    g.stroke();
  }
  /* flaking along the edges */
  for(var f=0; f<32; f++){
    var edgeBias = rnd() < 0.68;
    var fx = rnd()*w, fy = rnd()*h;
    if(edgeBias){
      if(rnd() < 0.5) fx = rnd() < 0.5 ? rnd()*w*0.12 : w - rnd()*w*0.12;
      else fy = rnd() < 0.5 ? rnd()*h*0.10 : h - rnd()*h*0.10;
    }
    var fr = 0.5 + rnd()*1.6;
    g.beginPath(); g.arc(fx, fy, fr, 0, 6.2832);
    g.fillStyle = 'rgba(235,226,206,' + (0.10 + rnd()*0.17).toFixed(3) + ')';
    g.fill();
  }
  /* inner shadow into the panel edge */
  var sh = g.createRadialGradient(w/2, h/2, min*0.20, w/2, h/2, Math.max(w,h)*0.78);
  addStop(sh, 0, 'rgba(40,26,12,0)');
  addStop(sh, 0.62, 'rgba(40,26,12,0.05)');
  addStop(sh, 1, 'rgba(40,26,12,0.42)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);

  /* plate border */
  g.strokeStyle = 'rgba(74,55,32,0.40)'; g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, w-1, h-1);
  g.strokeStyle = 'rgba(178,142,76,0.30)';
  g.strokeRect(3.5, 3.5, w-7, h-7);
}
function paintFallback(g, w, h, key, seed){
  var rnd = rng(seed + 7);
  var base = g.createLinearGradient(0, 0, w, h);
  if(key === 'icon'){
    addStop(base, 0, '#7d5c33'); addStop(base, 0.5, '#a3803f'); addStop(base, 1, '#6b4c2c');
  } else {
    addStop(base, 0, '#b8a184'); addStop(base, 0.5, '#a48a6c'); addStop(base, 1, '#8e7355');
  }
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  g.globalAlpha = 0.5;
  for(var i=0;i<12;i++){
    g.fillStyle = key === 'icon' ? 'rgba(60,38,18,0.5)' : 'rgba(120,58,40,0.5)';
    g.beginPath();
    g.ellipse(rnd()*w, rnd()*h, w*(0.03+rnd()*0.12), h*(0.02+rnd()*0.09), rnd()*3, 0, 6.2832);
    g.fill();
  }
  g.globalAlpha = 1;
}
function paintPanels(){
  paintPanel($('ci'), 'icon', 20251102);
  paintPanel($('cr'), 'rock', 334334);
}

/* ---------- lyrics ---------- */
var curChars = [], curRevealed = -1;

function visualLen(s){
  s = s || ''; var n = 0;
  for(var i=0;i<s.length;i++) n += s.charCodeAt(i) < 256 ? 0.55 : 1;
  return n;
}
function baseSize(){ return clamp(Math.min(W*0.0266, H*0.044), 22, 40); }
function sizeFor(text){
  var base = baseSize(), n = Math.max(1, visualLen(text));
  var maxW = Math.min(W * 0.88, 1040);
  var need = n * base / maxW;                       /* lines at base size */
  var f = need > 2.5 ? clamp(Math.sqrt(2.5 / need), 0.58, 1) : 1;
  return Math.max(12, base * f);
}
function refreshLyricSize(){
  var L = S.lines[S.idx];
  if(L) $('lcur').style.setProperty('--cur-size', sizeFor(L.text).toFixed(1) + 'px');
}
function charTimes(line){
  var text = line.text || '', n = text.length, out = [], i;
  if(!n) return out;
  var cs = line.chars, ts = [];
  if(cs && cs.length){
    for(i=0;i<cs.length;i++){
      var t = cs[i] ? num(cs[i].t, NaN) : NaN;
      if(isFinite(t)) ts.push(t);
    }
  }
  if(ts.length >= 2){
    for(i=0;i<n;i++){
      var p = n <= 1 ? 0 : i/(n-1);
      var j = Math.min(ts.length-1, Math.round(p*(ts.length-1)));
      out[i] = Math.max(line.t, ts[j]);
    }
  } else {
    var d = line.dur > 0 ? line.dur : 3.4;
    var lead = Math.min(d * 0.85, 2.6, Math.max(0.55, d - 0.2));
    for(i=0;i<n;i++) out[i] = line.t + (n <= 1 ? 0 : (i/n)*lead);
  }
  return out;
}
function paintLine(el, line){
  el.textContent = '';
  if(!line) return [];
  el.style.setProperty('--cur-size', sizeFor(line.text).toFixed(1) + 'px');
  var txt = line.text || '', times = charTimes(line);
  var frag = document.createDocumentFragment(), arr = [];
  for(var i=0;i<txt.length;i++){
    var sp = document.createElement('span');
    sp.className = 'ch';
    var ch = txt.charAt(i);
    sp.textContent = ch === ' ' ? '\u00A0' : ch;
    frag.appendChild(sp);
    arr.push({ el: sp, t: times[i] });
  }
  el.appendChild(frag);
  return arr;
}
function revealChars(){
  var k = 0, i;
  for(i=0;i<curChars.length;i++){ if(curChars[i].t <= S.t) k = i+1; else break; }
  if(k === curRevealed) return;
  if(k > curRevealed){
    for(i = Math.max(0, curRevealed); i < k; i++) curChars[i].el.classList.add('on');
  } else {
    for(i = k; i < curRevealed; i++) curChars[i].el.classList.remove('on');
  }
  curRevealed = k;
}
function idxAt(t){
  var lo = 0, hi = S.lines.length - 1, r = -1;
  while(lo <= hi){ var m = (lo+hi) >> 1; if(S.lines[m].t <= t){ r = m; lo = m+1; } else hi = m-1; }
  return r;
}
function applyIdx(i){
  if(i === S.idx) return;
  S.idx = i;
  var L = S.lines[i] || null, P = i > 0 ? (S.lines[i-1] || null) : null, N = S.lines[i+1] || null;
  S.text = L ? L.text : '';
  if(!S.hasLy){ curChars = []; curRevealed = -1; S.text = ''; return; }
  $('lprev').textContent = P ? P.text : '';
  $('lnext').textContent = N ? N.text : '';
  var el = $('lcur');
  curChars = paintLine(el, L);
  curRevealed = -1;
  if(L){
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }
}

/* ---------- protocol ---------- */
function onInit(p){
  p = p || {};
  var song = p.song || {};
  S.song = song;
  S.playing = typeof p.playing === 'boolean' ? p.playing : true;
  S.dur = Math.max(0, num(p.duration, 0));
  var acc = Array.isArray(p.accent) ? p.accent : null;
  if(acc && acc.length >= 3) S.accent = [num(acc[0],200), num(acc[1],160), num(acc[2],74)];
  var raw = Array.isArray(p.lines) ? p.lines : [];
  var out = [];
  for(var i=0;i<raw.length;i++){
    var l = raw[i]; if(!l) continue;
    var txt = (l.text === null || l.text === undefined) ? '' : String(l.text);
    out.push({ t: Math.max(0, num(l.t, 0)), dur: Math.max(0, num(l.dur, 0)), text: txt,
               chars: Array.isArray(l.chars) ? l.chars : null });
  }
  out.sort(function(a,b){ return a.t - b.t; });
  S.lines = out; S.hasLy = out.length > 0;
  S.idx = -2; applyIdx(idxAt(S.t));
  if(!S.hasLy){
    S.text = '';
    $('lcur').textContent = ''; $('lprev').textContent = ''; $('lnext').textContent = '';
    $('lcur').style.removeProperty('--cur-size');
  }
  $('empty').style.display = S.hasLy ? 'none' : 'flex';
  document.querySelector('.lyr').classList.toggle('is-empty', !S.hasLy);
  $('tall').textContent = S.dur > 0 ? mmss(S.dur) : '--:--';
  var nm = song && song.name ? String(song.name) : '';
  var ar = song && song.artists;
  if(Array.isArray(ar)) ar = ar.filter(Boolean).join(' · ');
  ar = ar ? String(ar) : '';
  $('mast').innerHTML = '';
  if(nm){ var b = document.createElement('b'); b.textContent = nm; $('mast').appendChild(b); }
  if(ar){ var sp = document.createElement('span'); sp.textContent = (nm ? '  ·  ' : '') + ar; $('mast').appendChild(sp); }
  if(!nm && !ar) $('mast').textContent = '—';
}
function onTick(p){
  if(!p) return;
  S.t = num(p.time, S.t);                 /* unconditional */
  if(typeof p.playing === 'boolean') S.playing = p.playing;
  var i = idxAt(S.t);
  if(i !== S.idx) applyIdx(i);
  $('tnow').textContent = mmss(S.t);
  var f = S.dur > 0 ? clamp(S.t / S.dur, 0, 1) : 0;
  $('pfill').style.width = (f*100).toFixed(2) + '%';
  $('pdot').style.left = (f*100).toFixed(2) + '%';
}
window.addEventListener('message', function(ev){
  var d = ev.data;
  if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){ return; } }
  if(!d || d.__c100 !== 1) return;
  try {
    if(d.type === 'init') onInit(d.payload);
    else if(d.type === 'tick') onTick(d.payload);
    else if(d.type === 'beat'){ pulse = clamp(0.3 + num(d.payload && d.payload.level, 0.5)*0.9, 0, 1.2); }
    else if(d.type === 'live'){
      var lp = d.payload || {};
      bass = clamp(num(lp.bass, 0), 0, 1);
      if(typeof lp.playing === 'boolean') S.playing = lp.playing;
    }
  }
  catch(e){}
});

/* ---------- gold leaf motes ---------- */
var specks = [], pulse = 0, bass = 0, lastNow = 0, lastScale = 1;
var gold = (function(){ var a = [], i;
  for(i=0;i<24;i++) a.push(rgba([201,164,92], (i+1)/24));
  for(i=0;i<24;i++) a.push(rgba([176,138,68], (i+1)/24));
  return a; })();
function seedSpecks(){
  specks.length = 0;
  var rnd = rng(334909), n = S.rm ? 16 : 36;
  for(var i=0;i<n;i++) specks.push(speck(rnd, true));
}
function speck(rnd){
  var b = relicBox || { cx: W/2, cy: H*0.42, w: W*0.3, h: H*0.3 };
  var spread = Math.max(b.w * 1.9, b.h * 1.15) + 60;
  return { x: b.cx + (rnd()-0.5)*spread, y: b.cy + (rnd()-0.5)*spread*0.9,
           r: 0.45 + rnd()*1.5, a: 0.14 + rnd()*0.46,
           vy: -(3 + rnd()*9), vx: (rnd()-0.5)*4,
           ph: rnd()*6.2832, sp: 0.5 + rnd()*1.4 };
}
function drawSpecks(dts){
  if(!specks.length) return;
  var i, s, mv = S.playing ? 1 : 0.14;
  for(i=0;i<specks.length;i++){
    s = specks[i];
    if(!S.rm){
      s.ph += dts * s.sp * 2.2 * (0.45 + 0.55*mv);
      s.y += s.vy * dts * mv * (1 + bass*0.7);
      s.x += s.vx * dts * mv + Math.sin(s.ph*0.6) * 0.12 * mv;
      if(s.y < -12){ s.y = H + 12; s.x = (relicBox ? relicBox.cx : W/2) + (Math.random()-0.5)*W*0.42; }
    }
    var tw = 0.55 + 0.45*Math.sin(s.ph);
    var a = clamp(s.a * tw * (1 + pulse*0.9), 0, 1);
    var idx = clamp(Math.round(a*23), 0, 23) + (s.r > 1.1 ? 24 : 0);
    ctx.fillStyle = gold[idx];
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (1 + pulse*0.5), 0, 6.2832); ctx.fill();
  }
}

/* ---------- frame ---------- */
function frame(now){
  var t0 = performance.now();
  var dt = lastNow ? Math.min(64, now - lastNow) : 16;
  lastNow = now;
  var dts = dt / 1000;
  pulse *= Math.pow(0.5, dt/300);
  if(pulse < 0.002) pulse = 0;

  if(relicEl && !S.rm){
    var sc = 1 + pulse*0.008;
    if(Math.abs(sc - lastScale) > 0.0008){
      lastScale = sc;
      relicEl.style.transform = 'scale(' + sc.toFixed(4) + ')';
    }
  }

  ctx.setTransform(BDPR, 0, 0, BDPR, 0, 0);
  if(paper.width){ ctx.drawImage(paper, 0, 0, W, H); }
  else { ctx.fillStyle = '#f4f0e7'; ctx.fillRect(0, 0, W, H); }

  if(glowGrad && glowBox){
    ctx.globalAlpha = clamp(0.075 + 0.075*pulse + 0.055*bass, 0, 0.34);
    ctx.fillStyle = glowGrad;
    ctx.fillRect(glowBox.x, glowBox.y, glowBox.w, glowBox.h);
    ctx.globalAlpha = 1;
  }

  drawSpecks(dts);

  revealChars();

  S.frames++;
  S.js = performance.now() - t0;
  requestAnimationFrame(frame);
}

/* ---------- self check ---------- */
window.__stage = function(){
  return { lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing, frames:S.frames,
           js:Math.round(S.js*100)/100, err:'', text:S.text, gl:false,
           rm: !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) };
};
var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
S.rm = !!(mq && mq.matches);
if(mq && mq.addEventListener) mq.addEventListener('change', function(e){
  S.rm = !!e.matches; seedSpecks(); paintPanels();
});
resize();
loadImg('assets/334-icon.jpg', 'icon');
loadImg('assets/334-rock.jpg', 'rock');
requestAnimationFrame(frame);
})();
</script>
</body>
