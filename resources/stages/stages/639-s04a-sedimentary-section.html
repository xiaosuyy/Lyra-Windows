<!-- 639 / S04A —— 歌词是一份沉积岩芯：每句新词沉积为一层，旧句被压实、变暗、下沉。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>639 · Sedimentary Section</title>
<style>
  html,body{margin:0;height:100%;background:#08090a;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;background:#08090a}
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
  #gl{z-index:0}
  #tx{z-index:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="tx"></canvas>
</div>
<script>
(function () {
  "use strict";

  /* ================= 0. 状态 ================= */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}

  var ACCENT = [190, 142, 80];
  var GL_OK = false;
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var W = 1, H = 1, baseSize = 46, anchorY = 400, anchorUV = 0;
  var animT = 0, beatPulse = 0, liveLevel = 0, bpm = 0;
  var flow = 0, active = true;

  window.__stage = function () {
    var i = S.idx, L = S.lines, tx = "";
    if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
    return {
      lines: L.length, idx: i, t: S.t, playing: !!S.playing,
      frames: S.frames, js: S.js, err: S.err, text: tx, gl: GL_OK, rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var now = (window.performance && performance.now()) || Date.now();
    if (now - lastErrAt > 1200) {
      lastErrAt = now;
      try { console.error(e); } catch (_) {}
    }
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth01(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function damp(cur, target, lambda, dt) { return cur + (target - cur) * (1 - Math.exp(-lambda * dt)); }

  function normAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return [190, 142, 80];
    var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return [190, 142, 80];
    r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
    if (r + g + b < 36) return [190, 142, 80];
    return [r, g, b];
  }

  /* ================= 1. ready：首帧无条件、仅一次 ================= */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    try { GL_OK = initGL(); } catch (e) { GL_OK = false; logErr(e); }
    layout();
    S.idx = -1;
    S.idx = idxAt(S.t);
    flow = S.idx >= 0 ? S.idx : 0;
    lastNow = (window.performance && performance.now()) || Date.now();
    rafId = requestAnimationFrame(frame);
  }
  requestAnimationFrame(function () { sendReady(); boot(); });
  setTimeout(function () { sendReady(); boot(); }, 800);

  /* ================= 2. 歌词数据 ================= */
  var FONT = '"Helvetica Neue","Arial Narrow",Arial,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
  var MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace';

  function charTimes(line) {
    var chars = Array.from(line.text || ""), n = chars.length, out = new Array(n);
    var cs = line.chars, i, j, rec, ct;
    if (cs && cs.length) {
      var rel = cs[0] && isFinite(cs[0].t) && cs[0].t < line.t - 0.08;
      for (i = 0; i < n; i++) {
        j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        rec = cs[j];
        ct = rec && rec.t;
        out[i] = isFinite(ct) ? (rel ? line.t + ct : ct) : null;
      }
      return out;
    }
    var d = line.dur > 0 ? line.dur : 3.4;
    for (i = 0; i < n; i++) out[i] = line.t + d * 0.88 * i / Math.max(1, n);
    return out;
  }

  function buildLines(raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      if (!l || typeof l !== "object") continue;
      var text = (l.text == null) ? "" : String(l.text);
      if (!text.trim()) continue;
      var t = Number(l.t); if (!isFinite(t) || t < 0) t = 0;
      var dur = Number(l.dur); if (!isFinite(dur) || dur < 0) dur = 0;
      var line = {
        t: t, dur: dur, text: text,
        chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null
      };
      line.times = charTimes(line);
      out.push(line);
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  /* ================= 3. 画布与排版 ================= */
  var glCv = document.getElementById("gl");
  var txCv = document.getElementById("tx");
  var g2 = txCv.getContext("2d");
  var gl = null, prog = null, uni = {};

  function layout() {
    var w = window.innerWidth || 1440;
    var h = window.innerHeight || 900;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = w; H = h;
    DPR = Math.min(2, window.devicePixelRatio || 1);

    txCv.width = Math.max(1, Math.round(W * DPR));
    txCv.height = Math.max(1, Math.round(H * DPR));
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (GL_OK) {
      glCv.width = Math.max(1, Math.round(W * DPR));
      glCv.height = Math.max(1, Math.round(H * DPR));
      gl.viewport(0, 0, glCv.width, glCv.height);
    }

    baseSize = clamp(Math.min(W * 0.072, H * 0.082), 24, 66);
    anchorY = H * 0.42;
    anchorUV = 0.5 - anchorY / H;

    measureLines();
    if (!GL_OK) buildFallbackBands();
    if (!motes.length) initMotes();
  }

  function measureLines() {
    var gap = baseSize * 0.02;
    g2.font = "500 " + baseSize + "px " + FONT;
    for (var i = 0; i < S.lines.length; i++) {
      var L = S.lines[i];
      L._chars = Array.from(L.text);
      L._cw = [];
      var sum = 0;
      for (var k = 0; k < L._chars.length; k++) {
        var cw = g2.measureText(L._chars[k]).width;
        L._cw.push(cw);
        sum += cw;
      }
      L._sum = sum + gap * Math.max(0, L._chars.length - 1);
      L._fit = Math.min(1, (W * 0.80) / Math.max(1, L._sum));
    }
  }

  /* ================= 4. WebGL 沉积层着色器 ================= */
  var VS = [
    "attribute vec2 aPos;",
    "void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }"
  ].join("\n");

  /* shader-skills: gradientNoise / fbm / warpedFbm / ridgedFbm / voronoi, adapted for strata */
  var FS = [
    "precision highp float;",
    "uniform vec2 uRes;",
    "uniform float uTime, uBeat, uLevel, uAnchor;",
    "uniform vec3 uAccent;",
    "",
    "float hash21(vec2 p){",
    "  p = fract(p * vec2(123.34, 345.45));",
    "  p += dot(p, p + 34.345);",
    "  return fract(p.x * p.y);",
    "}",
    "vec2 hash22(vec2 p){",
    "  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));",
    "  p3 += dot(p3, p3.yzx + 33.33);",
    "  return fract((p3.xx + p3.yz) * p3.zy);",
    "}",
    "vec2 grad2(vec2 c){",
    "  float a = 6.2831853 * hash22(c).x;",
    "  return vec2(cos(a), sin(a));",
    "}",
    "float gnoise(vec2 p){",
    "  vec2 i = floor(p), f = fract(p);",
    "  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);",
    "  float a = dot(grad2(i), f);",
    "  float b = dot(grad2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));",
    "  float c = dot(grad2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));",
    "  float d = dot(grad2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));",
    "  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);",
    "}",
    "float fbm(vec2 p, int oct){",
    "  float v = 0.0, amp = 0.5;",
    "  mat2 R = mat2(0.80, 0.60, -0.60, 0.80);",
    "  for(int i = 0; i < 5; i++){",
    "    if(i >= oct) break;",
    "    v += amp * gnoise(p);",
    "    p = R * p * 2.031 + 11.7;",
    "    amp *= 0.5;",
    "  }",
    "  return v;",
    "}",
    "float warped(vec2 p, float s, int oct, out vec2 q, out vec2 r){",
    "  q = vec2(fbm(p, oct), fbm(p + vec2(5.2, 1.3), oct));",
    "  r = vec2(fbm(p + s * q + vec2(1.7, 9.2), oct), fbm(p + s * q + vec2(8.3, 2.8), oct));",
    "  return fbm(p + s * r, oct);",
    "}",
    "float ridged(vec2 p, int oct){",
    "  float v = 0.0, amp = 0.55;",
    "  mat2 R = mat2(0.80, 0.60, -0.60, 0.80);",
    "  for(int i = 0; i < 4; i++){",
    "    if(i >= oct) break;",
    "    v += amp * (1.0 - abs(gnoise(p)));",
    "    p = R * p * 2.07 + 3.3;",
    "    amp *= 0.55;",
    "  }",
    "  return v;",
    "}",
    "vec2 voronoi2(vec2 p){",
    "  vec2 n = floor(p), f = fract(p);",
    "  float f1 = 9.0, f2 = 9.0;",
    "  for(int j = -1; j <= 1; j++){",
    "    for(int i = -1; i <= 1; i++){",
    "      vec2 g = vec2(float(i), float(j));",
    "      vec2 o = hash22(n + g);",
    "      float d = length(g + o - f);",
    "      if(d < f1){ f2 = f1; f1 = d; } else if(d < f2){ f2 = d; }",
    "    }",
    "  }",
    "  return vec2(f1, f2);",
    "}",
    "void main(){",
    "  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;",
    "  float t = uTime;",
    "  vec2 p = uv * vec2(1.0, 1.32);",
    "  vec2 q, r;",
    "  float w = warped(p * 1.15 + vec2(0.0, t * 0.012), 1.05, 3, q, r);",
    "  float rg = ridged(vec2(p.x * 2.6 + w * 1.2, p.y * 6.0 - t * 0.018), 3);",
    "  float seismic = uBeat * uBeat * (0.5 + 0.5 * uLevel);",
    "  float y = p.y + w * 0.34 + rg * 0.18 + seismic * 0.018 * sin(p.y * 26.0 + t * 7.0);",
    "  float band = fract(y * 2.35);",
    "  float edge = min(band, 1.0 - band);",
    "  float bed = smoothstep(0.0, 0.05, edge);",
    "  float layer = floor(y * 2.35);",
    "  float h = hash21(vec2(layer, 17.0));",
    "  vec3 sedA = mix(vec3(0.052, 0.056, 0.061), vec3(0.105, 0.096, 0.082), h);",
    "  sedA = mix(sedA, vec3(0.132, 0.104, 0.074), smoothstep(0.65, 1.0, fract(layer * 0.37)) * 0.5);",
    "  vec3 col = mix(vec3(0.011, 0.014, 0.018), sedA, bed);",
    "  float mot = fbm(p * 3.2 + w * 1.1, 3);",
    "  col *= 0.82 + 0.40 * mot;",
    "  float peb = smoothstep(0.16, 0.04, voronoi2(p * 17.0 + w * 2.0).x);",
    "  col += vec3(0.62, 0.57, 0.47) * 0.045 * peb;",
    "  float boundary = 1.0 - bed;",
    "  vec3 seam = mix(uAccent, vec3(0.62, 0.45, 0.24), 0.62);",
    "  col += seam * 0.075 * boundary;",
    "  float glow = exp(-abs(uv.y - uAnchor) * 7.0);",
    "  col += vec3(0.78, 0.70, 0.56) * 0.035 * glow;",
    "  col += seam * 0.09 * glow * uBeat * 0.6;",
    "  col += vec3(0.035, 0.045, 0.055) * smoothstep(-0.1, 0.55, uv.y);",
    "  col *= 1.0 - 0.5 * pow(length(uv * vec2(0.80, 1.02)), 1.5);",
    "  col += (hash21(gl_FragCoord.xy + fract(t) * 37.0) - 0.5) * 0.014;",
    "  gl_FragColor = vec4(max(col, 0.0), 1.0);",
    "}"
  ].join("\n");

  function compileShader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      logErr(new Error(gl.getShaderInfoLog(sh) || "shader"));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  function initGL() {
    try {
      var opts = { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false };
      gl = glCv.getContext("webgl", opts) || glCv.getContext("experimental-webgl", opts);
      if (!gl) return false;
      var vs = compileShader(gl.VERTEX_SHADER, VS);
      var fs = compileShader(gl.FRAGMENT_SHADER, FS);
      if (!vs || !fs) return false;
      prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        logErr(new Error(gl.getProgramInfoLog(prog) || "link"));
        return false;
      }
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      ["uRes", "uTime", "uBeat", "uLevel", "uAnchor", "uAccent"].forEach(function (n) {
        uni[n] = gl.getUniformLocation(prog, n);
      });
      return true;
    } catch (e) {
      logErr(e);
      return false;
    }
  }

  function renderGL() {
    if (!GL_OK || !gl || !prog) return;
    gl.viewport(0, 0, glCv.width, glCv.height);
    gl.useProgram(prog);
    gl.uniform2f(uni.uRes, glCv.width, glCv.height);
    gl.uniform1f(uni.uTime, animT);
    gl.uniform1f(uni.uBeat, beatPulse);
    gl.uniform1f(uni.uLevel, liveLevel);
    gl.uniform1f(uni.uAnchor, anchorUV);
    gl.uniform3f(uni.uAccent, ACCENT[0] / 255, ACCENT[1] / 255, ACCENT[2] / 255);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ================= 5. 2D：字层、尘埃、标尺 ================= */
  var motes = [];
  function initMotes() {
    motes = [];
    for (var i = 0; i < 56; i++) {
      motes.push({
        x: Math.random(), y: Math.random(),
        z: 0.15 + Math.random() * 0.85,
        p: Math.random() * Math.PI * 2
      });
    }
  }

  var fbBands = [];
  function buildFallbackBands() {
    fbBands = [];
    var y = 0, seed = 9182;
    function rnd() { seed = (seed * 48271) % 2147483647; return seed / 2147483647; }
    while (y < H + 60) {
      var bh = 10 + Math.pow(rnd(), 1.7) * 54;
      fbBands.push({ y: y, h: bh, t: rnd() });
      y += bh;
    }
  }

  function drawFallback() {
    var gr = g2.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, "#0b0f13");
    gr.addColorStop(0.55, "#0a0b0c");
    gr.addColorStop(1, "#08090a");
    g2.fillStyle = gr;
    g2.fillRect(0, 0, W, H);
    for (var i = 0; i < fbBands.length; i++) {
      var b = fbBands[i];
      var c = 13 + Math.round(b.t * 20);
      g2.fillStyle = "rgba(" + (c + 6) + "," + (c + 5) + "," + (c + 2) + ",0.55)";
      g2.fillRect(0, b.y + 2, W, Math.max(1, b.h - 4));
      g2.fillStyle = "rgba(0,0,0,0.34)";
      g2.fillRect(0, b.y, W, 1.5);
    }
    var rg = g2.createRadialGradient(W * 0.5, anchorY, 0, W * 0.5, anchorY, Math.max(W, H) * 0.62);
    rg.addColorStop(0, "rgba(190,160,110,0.075)");
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g2.fillStyle = rg;
    g2.fillRect(0, 0, W, H);
    var vg = g2.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.25, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.62)");
    g2.fillStyle = vg;
    g2.fillRect(0, 0, W, H);
  }

  function drawDust(dt) {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      if (active && !RM) {
        m.y += dt * (0.005 + 0.011 * m.z);
        m.x += Math.sin(animT * 0.25 + m.p) * 0.00035;
        if (m.y > 1.03) { m.y = -0.03; m.x = Math.random(); }
        if (m.x > 1.02) m.x = -0.01;
        if (m.x < -0.02) m.x = 1.01;
      }
      var a = (0.035 + 0.095 * m.z) * (RM ? 0.65 : 1);
      g2.fillStyle = "rgba(214,203,182," + a.toFixed(3) + ")";
      var s = 0.7 + m.z * 1.35;
      g2.fillRect(m.x * W, m.y * H, s, s);
    }
  }

  function burial(a) {
    if (a >= 0) return baseSize * 5.25 * (1 - Math.pow(0.80, a));
    return a * baseSize * 0.95;
  }

  function drawLine(L, i, age, isCur) {
    var n = L._chars.length;
    var asc = Math.max(0, age);
    var fs = baseSize * Math.pow(0.80, asc) * L._fit;
    if (age < 0) fs *= 1 + Math.min(0.12, -age * 0.05);
    var y = anchorY + burial(age);
    if (!RM) y += beatPulse * (isCur ? 2.3 : 1.0) * Math.sin(animT * (isCur ? 29 : 23) + i * 1.8);

    var alpha = 0.92;
    if (age < 0) alpha *= smooth01((age + 1.15) / 1.15);
    else alpha *= Math.pow(0.78, age);
    if (alpha < 0.045) return;

    var gap = fs * 0.02;
    var scale = fs / baseSize;
    var total = L._sum * scale;
    if (total > W * 0.92) {
      var k = (W * 0.92) / total;
      total *= k; gap *= k; scale *= k; fs *= k;
    }
    var left = W * 0.5 - total * 0.5;
    var x = left;
    g2.font = "500 " + fs.toFixed(2) + "px " + FONT;
    g2.textBaseline = "middle";

    var mixT = Math.min(1, asc / 5);
    var cr = Math.round(216 - 54 * mixT);
    var cg = Math.round(205 - 50 * mixT);
    var cb = Math.round(184 - 42 * mixT);

    var reveal = 1;
    for (var k2 = 0; k2 < n; k2++) {
      var ch = L._chars[k2];
      var cw = L._cw[k2] * scale;
      if (ch !== " ") {
        var ct = L.times[k2];
        if (ct == null) ct = L.t;
        var span = RM ? 0.16 : 0.55;
        var u = (S.t - ct) / span;
        if (u > 0) {
          if (u > 1) u = 1;
          var e = 1 - Math.pow(1 - u, 3);
          var a = alpha * e;
          var drop = (1 - e) * (RM ? 1.5 : fs * 0.30);
          g2.fillStyle = "rgba(" + cr + "," + cg + "," + cb + "," + (a >= 0.995 ? 1 : a.toFixed(3)) + ")";
          g2.fillText(ch, x, y + drop);
          if (u < 0.999 && u < reveal) reveal = u;
        } else {
          reveal = 0;
        }
      }
      x += cw + gap;
    }

    if (reveal >= 1 && alpha > 0.06) {
      var by = y + fs * 0.60;
      var ba = alpha * (isCur ? 0.30 : 0.15);
      g2.strokeStyle = "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + "," + ba.toFixed(3) + ")";
      g2.lineWidth = 1;
      g2.beginPath();
      g2.moveTo(left - 14, by + 0.5);
      g2.lineTo(left + total + 14, by + 0.5);
      g2.stroke();
      if (isCur) {
        g2.fillStyle = "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + "," + Math.min(1, ba * 1.7).toFixed(3) + ")";
        g2.fillRect(left - 20, by - 2, 3, 4);
      }
    }
  }

  function drawRuler() {
    if (W < 620 || S.idx < 0) return;
    var x = W - 34;
    g2.lineWidth = 1;
    g2.strokeStyle = "rgba(205,194,172,0.14)";
    g2.beginPath();
    g2.moveTo(x + 0.5, anchorY - 26);
    g2.lineTo(x + 0.5, anchorY + baseSize * 4.6);
    g2.stroke();
    g2.font = "400 9px " + MONO;
    g2.textAlign = "right";
    g2.textBaseline = "middle";
    for (var a = 0; a <= 5; a++) {
      var y = anchorY + burial(a);
      g2.strokeStyle = "rgba(205,194,172," + Math.max(0, 0.24 - a * 0.026).toFixed(3) + ")";
      g2.beginPath();
      g2.moveTo(x - 6, y + 0.5);
      g2.lineTo(x + 0.5, y + 0.5);
      g2.stroke();
      g2.fillStyle = "rgba(190,180,160," + Math.max(0, 0.26 - a * 0.03).toFixed(3) + ")";
      g2.fillText((a * 0.42).toFixed(1), x - 10, y);
    }
    g2.textAlign = "left";
    g2.textBaseline = "alphabetic";
  }

  function drawChrome() {
    g2.textBaseline = "alphabetic";
    g2.textAlign = "left";
    g2.font = "500 10px " + MONO;
    try { g2.letterSpacing = "2px"; } catch (e) {}
    g2.fillStyle = "rgba(214,203,182,0.42)";
    g2.fillText("639 / SEDIMENTARY SECTION", 28, 30);
    try { g2.letterSpacing = "0px"; } catch (e) {}
    g2.strokeStyle = "rgba(214,203,182,0.15)";
    g2.beginPath();
    g2.moveTo(28, 40.5);
    g2.lineTo(240, 40.5);
    g2.stroke();

    g2.textAlign = "right";
    g2.font = "400 9px " + MONO;
    g2.fillStyle = "rgba(200,190,170,0.26)";
    g2.fillText("CORE 639 · S04A", W - 28, 30);

    g2.fillStyle = "rgba(200,190,170,0.22)";
    g2.textAlign = "left";
    if (S.lines.length) {
      var tlabel = S.idx >= 0 ? S.lines[S.idx].t.toFixed(1) : "0.0";
      g2.fillText("DEPOSIT " + tlabel + " s", 28, H - 24);
    } else {
      g2.fillText("AUDIO ONLY", 28, H - 24);
    }
    g2.textAlign = "right";
    g2.fillText(bpm > 0 ? "BPM " + Math.round(bpm) : "—", W - 28, H - 24);
    g2.textAlign = "left";
  }

  function renderText(dt) {
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
    g2.clearRect(0, 0, W, H);
    if (!GL_OK) drawFallback();
    drawDust(dt);

    var idx = S.idx;
    if (idx >= 0) {
      var start = Math.max(0, idx - 6);
      for (var i = start; i <= idx; i++) {
        var L = S.lines[i];
        if (!L || !L._chars) continue;
        var age = flow - i;
        if (age < -1.15 || age > 6.4) continue;
        drawLine(L, i, age, i === idx);
      }
    }
    drawRuler();
    drawChrome();
  }

  /* ================= 6. 消息 ================= */
  var gotTick = false, lastTickStamp = 0;

  function onSeek(t) {
    var ni = idxAt(t);
    S.idx = ni;
    flow = ni >= 0 ? ni : 0;
    beatPulse = 0;
    lastTickStamp = (window.performance && performance.now()) || Date.now();
  }

  function applyInit(p) {
    S.lines = buildLines(p.lines);
    if (Array.isArray(p.accent)) ACCENT = normAccent(p.accent);
    if (typeof p.playing === "boolean") S.playing = p.playing;
    if (isFinite(Number(p.duration))) { /* duration is informational */ }
    S.idx = -1;
    lastTickStamp = (window.performance && performance.now()) || Date.now();
    layout();
    var ni = idxAt(S.t);
    S.idx = ni;
    flow = ni >= 0 ? ni : 0;
  }

  addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    try {
      if (d.type === "init") {
        applyInit(p);
      } else if (d.type === "tick") {
        var t = Number(p.time);
        if (isFinite(t)) {
          if (gotTick && Math.abs(t - S.t) > 0.5) {
            S.t = t;
            onSeek(t);
          } else {
            if (t !== S.t) lastTickStamp = (window.performance && performance.now()) || Date.now();
            S.t = t;
          }
          gotTick = true;
        }
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") {
        var lv = Number(p.level);
        var v = isFinite(lv) ? clamp(lv, 0, 1) : 0.5;
        var amt = (0.4 + 0.6 * v) * (RM ? 0.25 : 1);
        beatPulse = Math.max(beatPulse, amt);
      } else if (d.type === "live") {
        var l2 = Number(p.level);
        if (isFinite(l2)) liveLevel = clamp(l2, 0, 1);
        var bb = Number(p.bpm);
        if (isFinite(bb) && bb > 0) bpm = bb;
        if (typeof p.playing === "boolean") S.playing = p.playing;
      }
    } catch (e) { logErr(e); }
  });

  /* ================= 7. 主循环 ================= */
  var rafId = 0, lastNow = 0, stopped = false;
  function frame(now) {
    if (stopped) return;
    rafId = requestAnimationFrame(frame);
    var dt = (now - lastNow) / 1000;
    if (!isFinite(dt) || dt <= 0) dt = 0.016;
    if (dt > 0.05) dt = 0.05;
    lastNow = now;
    S.frames++;

    var fresh = !gotTick || (now - lastTickStamp) < 300;
    active = !!S.playing && fresh;
    if (active) {
      animT += dt;
      beatPulse *= Math.exp(-dt * 4.6);
      if (beatPulse < 0.001) beatPulse = 0;
    }

    var ni = idxAt(S.t);
    if (ni !== S.idx) {
      if (ni < S.idx || ni > S.idx + 1) flow = ni >= 0 ? ni : 0;
      S.idx = ni;
    }
    if (active && S.idx >= 0) {
      flow = damp(flow, S.idx, 4.8, dt);
      if (Math.abs(flow - S.idx) < 0.002) flow = S.idx;
    } else if (!active && !gotTick && S.idx >= 0) {
      flow = S.idx;
    }

    var js0 = (window.performance && performance.now()) || Date.now();
    try {
      renderGL();
      renderText(dt);
    } catch (e) {
      logErr(e);
    }
    var js1 = (window.performance && performance.now()) || Date.now();
    S.js = Math.round((js1 - js0) * 100) / 100;
  }

  addEventListener("resize", function () {
    try { layout(); } catch (e) { logErr(e); }
  });

  addEventListener("pagehide", function () {
    stopped = true;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  });
})();
</script>
</body>
</html>
