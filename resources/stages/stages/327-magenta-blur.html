<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>327 · 洋红失焦</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#12020d;}
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;
    background:radial-gradient(120% 95% at 50% 42%,#4a0a2c 0%,#240419 46%,#0e010a 100%);}

  /* ---------- 一、失焦色域：整屏的洋红光雾 ---------- */
  #fog{position:absolute;inset:-8%;pointer-events:none;}
  #fog::before{content:"";position:absolute;inset:0;
    background:
      radial-gradient(68% 58% at 45% 32%,rgba(255,92,172,.34),transparent 68%),
      radial-gradient(78% 68% at 73% 60%,rgba(146,26,188,.30),transparent 71%),
      radial-gradient(88% 76% at 23% 80%,rgba(255,44,122,.24),transparent 73%),
      radial-gradient(54% 46% at 56% 90%,rgba(210,20,120,.22),transparent 74%);}
  #fog::after{content:"";position:absolute;left:-4%;right:-4%;top:50%;height:30vh;
    transform:translateY(-50%) rotate(-1.6deg);mix-blend-mode:screen;
    background:radial-gradient(58% 46% at 50% 50%,rgba(255,124,192,.20),rgba(255,58,138,.07) 56%,transparent 80%);}
  .disc{position:absolute;border-radius:50%;mix-blend-mode:screen;
    opacity:var(--o,.45);will-change:transform;
    transform:translate(-50%,-50%);
    animation:drift var(--dur,44s) ease-in-out infinite;
    animation-delay:var(--del,0s);
    background:radial-gradient(circle at 50% 50%,
      hsla(var(--h),100%,80%,.09) 0%,
      hsla(var(--h),100%,65%,.15) 34%,
      hsla(var(--h),96%,54%,.10) 66%,
      hsla(var(--h),100%,74%,.16) 92%,
      hsla(var(--h),90%,50%,0) 100%);}
  .disc.sp{background:radial-gradient(circle at 50% 50%,
      hsla(var(--h),100%,88%,.26) 0%,
      hsla(var(--h),100%,72%,.30) 42%,
      hsla(var(--h),100%,58%,.09) 74%,
      hsla(var(--h),100%,90%,.40) 91%,
      hsla(var(--h),100%,82%,.14) 96%,
      hsla(var(--h),90%,50%,0) 100%);}
  @keyframes drift{
    0%  {transform:translate(-50%,-50%) translate(0,0) scale(1);}
    50% {transform:translate(-50%,-50%) translate(calc(var(--dx,1vmax) * 2.1),calc(var(--dy,1vmax) * 2.1)) scale(1.14);}
    100%{transform:translate(-50%,-50%) translate(0,0) scale(.9);}
  }
  /* 色散鬼影：一圈偏紫的位移副本，制造镜头边缘的色差 */
  #chroma{position:absolute;inset:-10%;pointer-events:none;
    mix-blend-mode:screen;opacity:.55;
    filter:hue-rotate(-26deg) saturate(1.35);
    transform:translate3d(.35%,-.25%,0);}
  .cdisc{position:absolute;border-radius:50%;mix-blend-mode:screen;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 50%,
      rgba(180,60,255,.10) 0%,rgba(120,40,240,.13) 45%,
      rgba(200,80,255,.07) 74%,rgba(150,50,255,0) 100%);}
  /* 斜向漏光：镜头里那道跨过画面的光带 */
  #streak{position:absolute;left:-12%;right:-12%;top:50%;height:118vh;
    transform:translateY(-50%) rotate(-23deg);pointer-events:none;
    opacity:.62;mix-blend-mode:screen;
    background:linear-gradient(90deg,rgba(255,140,205,0) 8%,rgba(255,150,210,.085) 36%,
      rgba(255,224,242,.115) 50%,rgba(255,120,192,.065) 64%,rgba(255,120,192,0) 92%);}
  /* 暗角：把边缘压回深紫黑，中间留一团光 */
  #vign{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(64% 56% at 50% 46%,transparent 38%,rgba(10,0,7,.52) 82%,rgba(6,0,4,.86) 100%),
      linear-gradient(180deg,rgba(9,0,6,.42) 0%,transparent 22%,transparent 74%,rgba(9,0,6,.58) 100%);}
  /* ---------- 三、呼吸与噪点：失真的音墙 ---------- */
  #pulse{position:absolute;inset:-12%;pointer-events:none;mix-blend-mode:screen;
    opacity:.12;will-change:opacity,transform;
    background:radial-gradient(46% 42% at 52% 52%,rgba(255,126,192,.55),
      rgba(255,42,132,.22) 46%,rgba(255,42,132,0) 74%);}
  #grain{position:absolute;inset:0;pointer-events:none;z-index:6;
    background-repeat:repeat;background-size:256px 256px;
    opacity:.20;mix-blend-mode:overlay;
    animation:boil .62s steps(1) infinite;}
  @keyframes boil{
    0%  {background-position:0 0;}
    17% {background-position:-58px 34px;}
    33% {background-position:41px -27px;}
    50% {background-position:-23px -61px;}
    67% {background-position:63px 18px;}
    83% {background-position:-37px 52px;}
    100%{background-position:0 0;}
  }
  #meta{position:absolute;left:max(22px,4.2vw);right:max(22px,4.2vw);bottom:max(18px,3.4vh);
    display:flex;align-items:center;gap:14px;z-index:7;pointer-events:none;
    font-size:clamp(9px,1.05vw,12px);letter-spacing:.20em;text-transform:uppercase;
    color:rgba(255,206,230,.42);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
  #ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64%;}
  #bar{flex:1;height:1px;background:rgba(255,170,210,.16);position:relative;overflow:hidden;}
  #barIn{position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,rgba(255,90,160,.65),rgba(255,190,225,.95));}
  /* ---------- 二、唯一对焦的东西：歌词 ---------- */
  #lyr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 6vw;box-sizing:border-box;pointer-events:none;}
  #focus{position:absolute;left:50%;top:50%;width:128vw;height:min(48vh,430px);
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(12,0,8,.62),rgba(14,0,9,.36) 48%,
      rgba(16,0,10,.09) 74%,rgba(16,0,10,0) 92%);}
  #linesWrap{position:relative;width:100%;display:grid;grid-template-columns:minmax(0,1fr);}
  .lslot{grid-area:1/1;display:flex;align-items:center;justify-content:center;min-width:0;
    opacity:0;transform:translateY(.26em) scale(.982);
    transition:opacity .52s ease,transform .78s cubic-bezier(.18,.72,.2,1);}
  .lslot.on{opacity:1;transform:none;}
  .lyr-line{margin:0;width:100%;max-width:100%;color:#fff8fc;font-weight:600;letter-spacing:.055em;
    font-size:clamp(22px,4.3vw,62px);line-height:1.34;text-align:center;
    --sh:0 0 24px rgba(255,74,152,.42),0 0 70px rgba(255,38,120,.22),
      0 2px 12px rgba(20,0,12,.62),-1.5px 0 0 rgba(168,116,255,.26),1.5px 0 0 rgba(255,36,118,.32);
    text-shadow:var(--sh);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;}
  .ch{display:inline-block;white-space:pre;opacity:0;transform:translateY(.16em);
    --fb:9px;
    transition:opacity .12s linear;}
  .ch.on{opacity:1;transform:none;animation:focusIn .52s cubic-bezier(.2,.8,.25,1) both;}
  .ch.pre{opacity:1;transform:none;animation:none;}
  body.rm .ch.on{animation:none;opacity:1;transform:none;filter:none;}
  body.rm .lslot{transition:opacity .3s linear;transform:none;}
  @keyframes focusIn{
    0%  {opacity:0;filter:blur(var(--fb));transform:translateY(.16em) scale(1.04);
         color:#ffd4e7;text-shadow:0 0 26px rgba(255,70,155,.85),0 0 62px rgba(255,30,120,.46);}
    46% {opacity:1;filter:blur(calc(var(--fb) * .16));color:#ffe0ee;}
    100%{opacity:1;transform:none;color:#fff8fc;text-shadow:var(--sh);}
  }
  #ghost{margin-top:1.05em;max-width:96%;text-align:center;color:rgba(255,214,235,.30);
    font-size:clamp(11px,1.5vw,20px);letter-spacing:.14em;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    opacity:0;transition:opacity .6s ease;}
  /* 降低动效：不漂不抖，但继续出帧 */
  body.rm #fog,body.rm .disc,body.rm #chroma,body.rm #grain{animation:none;}
  body.rm .ch{--fb:0px;}
  @media (max-width:640px){
    .ch{--fb:5px;}
    #meta{letter-spacing:.14em;}
    #focus{width:180vw;}
  }
  @media (max-height:520px){
    .lyr-line{font-size:clamp(18px,3.4vh,34px);}
    #ghost{margin-top:.7em;font-size:clamp(9px,1.6vh,15px);}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="fog">
    <i class="disc" style="left:26%;top:20%;width:80vmax;height:80vmax;--h:328;--o:.50;--dx:-2.4vmax;--dy:2vmax;--dur:52s"></i>
    <i class="disc" style="left:74%;top:28%;width:64vmax;height:64vmax;--h:300;--o:.46;--dx:2vmax;--dy:-1.8vmax;--dur:61s;--del:-9s"></i>
    <i class="disc" style="left:50%;top:56%;width:92vmax;height:92vmax;--h:336;--o:.42;--dx:1.4vmax;--dy:-1.4vmax;--dur:47s;--del:-21s"></i>
    <i class="disc" style="left:38%;top:80%;width:58vmax;height:58vmax;--h:344;--o:.38;--dx:-1.8vmax;--dy:-1vmax;--dur:57s;--del:-31s"></i>
    <i class="disc" style="left:86%;top:72%;width:60vmax;height:60vmax;--h:312;--o:.34;--dx:1.2vmax;--dy:1.6vmax;--dur:69s;--del:-13s"></i>
    <i class="disc" style="left:10%;top:64%;width:46vmax;height:46vmax;--h:320;--o:.36;--dx:1.6vmax;--dy:-1.2vmax;--dur:44s;--del:-5s"></i>
    <i class="disc" style="left:62%;top:12%;width:42vmax;height:42vmax;--h:352;--o:.28;--dx:-1.2vmax;--dy:1.2vmax;--dur:65s;--del:-44s"></i>
    <i class="disc" style="left:22%;top:36%;width:28vmax;height:28vmax;--h:338;--o:.52;--dx:1vmax;--dy:.8vmax;--dur:39s;--del:-17s"></i>
    <i class="disc" style="left:67%;top:52%;width:19vmax;height:19vmax;--h:348;--o:.56;--dx:-.9vmax;--dy:.7vmax;--dur:37s;--del:-27s"></i>
    <i class="disc sp" style="left:19%;top:31%;width:12vmax;height:12vmax;--h:330;--o:.62;--dx:.7vmax;--dy:-.5vmax;--dur:31s;--del:-3s"></i>
    <i class="disc sp" style="left:79%;top:23%;width:15vmax;height:15vmax;--h:296;--o:.46;--dx:-.6vmax;--dy:.6vmax;--dur:43s;--del:-23s"></i>
    <i class="disc sp" style="left:46%;top:72%;width:21vmax;height:21vmax;--h:316;--o:.40;--dx:.8vmax;--dy:-.6vmax;--dur:35s;--del:-11s"></i>
    <i class="disc sp" style="left:7%;top:86%;width:31vmax;height:31vmax;--h:306;--o:.34;--dx:-1vmax;--dy:-.8vmax;--dur:49s;--del:-37s"></i>
    <i class="disc sp" style="left:93%;top:47%;width:23vmax;height:23vmax;--h:330;--o:.32;--dx:1vmax;--dy:.5vmax;--dur:41s;--del:-19s"></i>
    <i class="disc sp" style="left:55%;top:28%;width:8.5vmax;height:8.5vmax;--h:350;--o:.58;--dx:-.4vmax;--dy:.4vmax;--dur:29s;--del:-7s"></i>
    <i class="disc sp" style="left:33%;top:59%;width:6.5vmax;height:6.5vmax;--h:340;--o:.62;--dx:.35vmax;--dy:-.3vmax;--dur:27s;--del:-33s"></i>
    <i class="disc sp" style="left:71%;top:83%;width:5.5vmax;height:5.5vmax;--h:322;--o:.50;--dx:-.3vmax;--dy:-.25vmax;--dur:33s;--del:-15s"></i>
  </div>
  <div id="chroma">
    <i class="cdisc" style="left:24%;top:24%;width:74vmax;height:74vmax"></i>
    <i class="cdisc" style="left:72%;top:32%;width:56vmax;height:56vmax"></i>
    <i class="cdisc" style="left:48%;top:62%;width:84vmax;height:84vmax"></i>
    <i class="cdisc" style="left:80%;top:76%;width:44vmax;height:44vmax"></i>
    <i class="cdisc" style="left:12%;top:70%;width:40vmax;height:40vmax"></i>
  </div>
  <div id="streak"></div>
  <div id="vign"></div>
  <div id="pulse"></div>
  <div id="lyr">
    <div id="focus"></div>
    <div id="linesWrap">
      <div class="lslot" id="slotA"><p class="lyr-line" id="lnA"></p></div>
      <div class="lslot" id="slotB"><p class="lyr-line" id="lnB"></p></div>
    </div>
    <div id="ghost"></div>
  </div>
  <div id="grain"></div>
  <div id="meta"><div id="ttl"></div><div id="bar"><i id="barIn"></i></div></div>
</div>
<script>
(function(){
  'use strict';
  var doc=document;
  var S={lines:[],idx:-2,t:0,playing:true,frames:0,js:0,rm:false};
  var baseT=0, baseClock=0, hasTick=false, dur=0, gotInit=false;
  var VW=1440, VH=900;

  function num(v,d){ v=+v; return isFinite(v)?v:d; }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function measure(){
    var w=num(window.innerWidth,0), h=num(window.innerHeight,0);
    if(!(w>0)) w=1440;
    if(!(h>0)) h=900;
    VW=clamp(w,320,4096); VH=clamp(h,320,4096);
  }
  measure();

  /* ---------- 噪点 / 呼吸 / 元信息 ---------- */
  var pulse=doc.getElementById('pulse'), grainEl=doc.getElementById('grain');
  var ttl=doc.getElementById('ttl'), barIn=doc.getElementById('barIn');
  var LIVE={bpm:0,level:0,bass:0,mid:0,treble:0};
  var beatEnv=0, lastPct=-1;

  function makeGrain(){
    try{
      var N=160, cv=doc.createElement('canvas');
      cv.width=N; cv.height=N;
      var cx=cv.getContext('2d');
      if(!cx) return;
      var im=cx.createImageData(N,N), d=im.data, len=d.length, i, seed=1234567, g, v;
      for(i=0;i<len;i+=4){
        seed=(Math.imul(seed,1664525)+1013904223)>>>0;
        g=(seed>>>24)&255;
        v=128+((g-128)*0.46)|0;
        d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
      }
      cx.putImageData(im,0,0);
      var url=cv.toDataURL('image/png');
      if(url&&url.length>64){
        grainEl.style.backgroundImage='url('+url+')';
        grainEl.style.backgroundSize=N+'px '+N+'px';
      }
    }catch(e){ grainEl.style.opacity='0'; }
  }

  function onBeat(p){
    var lv=clamp(num(p&&p.level,0.5),0,1);
    if(lv>beatEnv) beatEnv=lv;
  }

  function onLive(p){
    LIVE.level=clamp(num(p&&p.level,0),0,1);
    LIVE.bass=clamp(num(p&&p.bass,0),0,1);
    LIVE.mid=clamp(num(p&&p.mid,0),0,1);
    LIVE.treble=clamp(num(p&&p.treble,0),0,1);
    LIVE.bpm=clamp(num(p&&p.bpm,0),0,300);
  }

  function setMeta(song){
    song=song&&typeof song==='object'?song:{};
    var name=(song.name==null?'':String(song.name)).trim().slice(0,80);
    var ar=song.artists, arts='';
    if(ar!=null){
      if(typeof ar==='string') arts=ar;
      else if(typeof ar.length==='number'){
        var a=[],k=0;
        for(;k<ar.length&&k<8;k++){ if(ar[k]!=null) a.push(String(ar[k])); }
        arts=a.join(' / ');
      } else arts=String(ar);
    }
    arts=arts.trim().slice(0,120);
    ttl.textContent=name&&arts?(name+' — '+arts):(name||arts);
  }

  function setBar(t){
    if(dur>0){
      var p=clamp(t/dur,0,1);
      if(Math.abs(p-lastPct)>0.0025){
        lastPct=p;
        barIn.style.width=(p*100).toFixed(2)+'%';
      }
    } else if(lastPct!==-1){
      lastPct=-1; barIn.style.width='0%';
    }
  }

  /* ---------- 父页面握手：ready 只报一次 ---------- */
  var readySent=false;
  function sendReady(){
    if(readySent) return;
    readySent=true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){}
  }

  function normChars(chars,text){
    if(!chars||typeof chars.length!=='number'||!chars.length) return null;
    var out=[],n=Math.min(chars.length,400);
    for(var i=0;i<n;i++){
      var c=chars[i];
      if(!c||typeof c!=='object'){ out.push(null); continue; }
      var t=num(c.t,NaN);
      out.push(isFinite(t)?t:null);
    }
    return out;
  }

  function sigOf(arr){
    var h=0,i,x,n=arr.length;
    for(i=0;i<n;i++){
      x=arr[i].text;
      h=(h*31+x.length+(x.charCodeAt(0)||0)*7+(x.charCodeAt(x.length-1)||0)*13+((arr[i].t*100)|0))|0;
    }
    return n+'|'+h;
  }

  function init(p){
    var lines=p&&p.lines;
    var prevSig=sigOf(S.lines), wasInit=gotInit;
    dur=Math.max(0,num(p&&p.duration,0));
    setMeta(p&&p.song);
    S.lines=[];
    if(lines&&typeof lines.length==='number'&&lines.length){
      var n=Math.min(lines.length,400);
      for(var i=0;i<n;i++){
        var l=lines[i]; if(!l) continue;
        var txt=(l.text==null?'':String(l.text)).slice(0,240);
        if(!txt.replace(/\s/g,'')) continue;
        S.lines.push({
          t:num(l.t,0),
          dur:Math.max(0.2,num(l.dur,2.4)),
          text:txt,
          times:normChars(l.chars,txt)
        });
      }
      S.lines.sort(function(a,b){ return a.t-b.t; });
    }
    gotInit=true;
    if(typeof (p&&p.playing)==='boolean') S.playing=!!p.playing;
    else if(!hasTick) S.playing=true;
    /* 同一份歌词重发 init（例如封面取色完成）时不要清屏重排，避免闪一下 */
    if(wasInit && prevSig===sigOf(S.lines) && S.lines.length){
      return;
    }
    S.idx=-2;
    lastPct=-1;
    clearDom();
    if(!S.lines.length){
      setGhost('纯器乐 · instrumental',0.34);
    }
  }

  function tick(p){
    baseT=Math.max(0,num(p&&p.time,0));
    baseClock=performance.now();
    hasTick=true;
    if(p&&typeof p.playing==='boolean') S.playing=p.playing;
  }

  function curTime(){
    if(!hasTick) return baseT;
    var t=baseT;
    if(S.playing){
      var ex=(performance.now()-baseClock)/1000;
      if(ex>3) ex=3;               /* tick 断了就不许一直飞 */
      if(ex>0) t+=ex;
    }
    if(dur>0&&t>dur+1) t=dur+1;
    return t;
  }

  function pick(t){
    var L=S.lines, lo=0, hi=L.length-1, ans=-1;
    while(lo<=hi){
      var m=(lo+hi)>>1;
      if(L[m].t<=t+0.02){ ans=m; lo=m+1; } else { hi=m-1; }
    }
    return ans;
  }

  /* ---------- 歌词引擎：逐字"对焦" ---------- */
  var slots=[doc.getElementById('slotA'),doc.getElementById('slotB')];
  var pars=[doc.getElementById('lnA'),doc.getElementById('lnB')];
  var ghost=doc.getElementById('ghost');
  var active=0;
  var cur={line:null,tokens:[],ptr:0};
  var LAT=/[A-Za-z0-9\u00C0-\u024F\u0400-\u04FF'\u2019\-_.:!?&]/;

  function tokenize(text){
    var out=[],buf='',b0=0,i=0,n=text.length,ch;
    function pushRun(s,b){
      while(s.length>14){
        out.push({s:s.slice(0,14),i0:b,i1:b+13});
        s=s.slice(14); b+=14;
      }
      if(s) out.push({s:s,i0:b,i1:b+s.length-1});
    }
    for(;i<n;i++){
      ch=text.charAt(i);
      if(LAT.test(ch)){
        if(!buf) b0=i;
        buf+=ch;
      }else{
        if(buf){ pushRun(buf,b0); buf=''; }
        out.push({s:ch,i0:i,i1:i});
      }
    }
    if(buf) pushRun(buf,b0);
    return out;
  }

  function clearDom(){
    pars[0].innerHTML=''; pars[1].innerHTML='';
    slots[0].classList.remove('on'); slots[1].classList.remove('on');
    pars[0].style.fontSize=''; pars[1].style.fontSize='';
    ghost.textContent=''; ghost.style.opacity='0';
    cur.line=null; cur.tokens=[]; cur.ptr=0;
  }

  function setGhost(txt,op){
    if(txt){ ghost.textContent=txt; ghost.style.opacity=String(op); }
    else { ghost.style.opacity='0'; }
  }

  function buildLine(line,nowT){
    var k=active^1, p=pars[k], slot=slots[k];
    p.innerHTML='';
    p.style.fontSize='';
    var toks=tokenize(line.text);
    var n=toks.length;
    if(!n){ return; }
    var span=line.dur>0.4?Math.min(line.dur*0.92,8):2.2;
    var denom=Math.max(1,n-1);
    var frag=doc.createDocumentFragment();
    var arr=[],prev=-1e9,i,tt,best,j,v;
    for(i=0;i<n;i++){
      var sp=doc.createElement('span');
      sp.className='ch';
      sp.textContent=toks[i].s;
      frag.appendChild(sp);
      best=null;
      if(line.times){
        for(j=toks[i].i0;j<=toks[i].i1;j++){
          v=line.times[j];
          if(v!=null&&isFinite(v)&&(best===null||v<best)) best=v;
        }
      }
      tt=best!=null?best:line.t+span*(toks[i].i0/denom);
      if(tt<prev) tt=prev;
      prev=tt;
      arr.push({el:sp,t:tt});
    }
    p.appendChild(frag);

    /* 长句自缩：横向与纵向都不许溢出 */
    var maxH=Math.max(120,VH*0.44), guard=0, fs=0;
    try{ fs=parseFloat(window.getComputedStyle(p).fontSize)||32; }catch(e){ fs=32; }
    for(guard=0;guard<9;guard++){
      if(p.scrollHeight<=maxH && p.scrollWidth<=p.clientWidth+2) break;
      fs=Math.max(12,fs*0.88);
      p.style.fontSize=fs.toFixed(2)+'px';
      if(fs<=12) break;
    }

    cur.line=line; cur.tokens=arr; cur.ptr=0;
    for(i=0;i<arr.length;i++){
      if(arr[i].t<=nowT-0.35) arr[i].el.classList.add('on','pre');
    }
    while(cur.ptr<arr.length&&arr[cur.ptr].t<=nowT+0.001){
      if(!(arr[cur.ptr].el.classList.contains('pre'))) arr[cur.ptr].el.classList.add('on');
      cur.ptr++;
    }
    slots[active].classList.remove('on');
    active=k;
    slot.classList.add('on');
    /* 交接完成后清掉旧句，避免它撑高容器 */
    var oldK=k^1;
    setTimeout(function(){
      try{
        if(active!==oldK){
          pars[oldK].innerHTML='';
          pars[oldK].style.fontSize='';
        }
      }catch(e){}
    },900);
  }

  function setLine(i,nowT){
    var L=S.lines;
    if(!L.length){ clearDom(); setGhost('纯器乐 · instrumental',0.34); return; }
    if(i<0){
      if(cur.line){ slots[active].classList.remove('on'); cur.line=null; cur.tokens=[]; cur.ptr=0; }
      setGhost(L[0].text,0.52);
      return;
    }
    var line=L[i];
    if(cur.line===line){ return; }
    buildLine(line,nowT);
    setGhost(L[i+1]?L[i+1].text:'',0.26);
  }

  function reveal(t){
    var a=cur.tokens, n=a.length;
    if(!n) return;
    if(t<cur.line.t-0.35){
      for(var j=0;j<n;j++){ a[j].el.classList.remove('on','pre'); }
      cur.ptr=0;
      return;
    }
    while(cur.ptr<n&&a[cur.ptr].t<=t+0.001){
      a[cur.ptr].el.classList.add('on');
      cur.ptr++;
    }
  }

  function frame(){
    var t0=performance.now();
    var t=curTime();
    S.t=t;
    if(gotInit){
      var i=pick(t);
      if(i!==S.idx){ S.idx=i; setLine(i,t); }
      reveal(t);
    }

    /* 呼吸：低频推亮光雾，鼓点点一下 —— 每两帧写一次，省掉无谓的样式计算 */
    beatEnv*=(S.rm?0.955:0.892);
    if(beatEnv<0.002) beatEnv=0;
    if((S.frames&1)===0){
      var lv=LIVE.level, bs=LIVE.bass, gait=S.rm?0.55:1;
      var op=(0.10+lv*0.26+beatEnv*0.34)*gait;
      pulse.style.opacity=op.toFixed(3);
      pulse.style.transform='scale('+(1+bs*0.10*gait+beatEnv*0.05*gait).toFixed(3)+')';
      setBar(t);
    }

    S.frames++;
    S.js=performance.now()-t0;
    sendReady();
    requestAnimationFrame(frame);
  }

  window.addEventListener('message',function(ev){
    var d=ev&&ev.data;
    if(!d||typeof d!=='object'||!d.type) return;
    if(d.type==='init') init(d.payload||{});
    else if(d.type==='tick') tick(d.payload||{});
    else if(d.type==='beat') onBeat(d.payload||{});
    else if(d.type==='live') onLive(d.payload||{});
  },false);

  window.addEventListener('resize',measure,{passive:true});

  window.__stage=function(){
    var i=S.idx, s=S.lines[i];
    return {
      lines:S.lines.length, idx:i<0?-1:i, t:S.t, playing:!!S.playing,
      frames:S.frames, js:S.js, err:'',
      text:s?s.text:'', gl:false, rm:!!S.rm
    };
  };

  try{ S.rm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}
  if(S.rm) doc.body.classList.add('rm');

  makeGrain();
  setTimeout(sendReady,60);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
