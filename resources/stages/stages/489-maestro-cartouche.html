<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maestro Cartouche</title>
<style>
  :root{
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman","Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;
    --dg:#eec12d; --dg-d:#c2950f; --ink:#1b1405; --cream:#f3e6c8;
    --cartW:min(72vw,720px); --cartTop:5.4vh; --lyrTop:auto; --figH:62vh;
  }
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0805;}
  #w{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #stage{position:fixed;inset:0;pointer-events:none;overflow:hidden;}

  /* ---------- cartouche ---------- */
  #cart{
    position:absolute;left:50%;top:var(--cartTop);width:var(--cartW);
    transform:translateX(-50%);
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.62));
    transition:opacity .5s ease;
  }
  .ci{
    position:relative;
    background:
      radial-gradient(140% 90% at 50% -20%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),
      linear-gradient(178deg,#f7d752 0%,#ecc22c 42%,#dcae1a 74%,#c9990f 100%);
    border:1.5px solid #7a5709;
    border-radius:2px;
    padding:1.35em 1.5em 1.15em;
    color:var(--ink);
    box-shadow:
      inset 0 0 0 3px #f4cd3e,
      inset 0 0 0 4px #b98d10,
      inset 0 0 0 6.5px #f2c832,
      inset 0 0 0 7.5px #8d6708,
      inset 0 22px 30px -18px rgba(255,255,255,.75),
      inset 0 -26px 34px -20px rgba(90,58,0,.45);
  }
  .ci::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(80,52,0,.16) .8px,transparent 1px);
    background-size:3px 3px;
    mix-blend-mode:multiply;opacity:.55;border-radius:2px;
  }
  #cart .row{display:flex;justify-content:space-between;align-items:baseline;gap:1em;position:relative;z-index:2}
  #comp,#ens,#cat,.fno{
    font-family:var(--serif);
    font-variant:small-caps;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:#2a1f07;
  }
  #comp{font-size:clamp(9px,1.05vw,13px);font-weight:600}
  #cat{font-size:clamp(8px,.85vw,11px);letter-spacing:.2em;opacity:.72;white-space:nowrap;font-variant:normal}
  .rule{display:flex;align-items:center;gap:.6em;margin:.55em 0 .5em;position:relative;z-index:2}
  .rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#4a3405 18%,#4a3405 82%,transparent);opacity:.62}
  .rule b{
    width:6px;height:6px;background:#3d2c04;transform:rotate(45deg);
    box-shadow:0 0 0 1.5px rgba(245,206,62,.55);
  }
  #work{
    display:block;text-align:center;
    font-family:var(--serif);
    font-weight:600;
    font-size:var(--workFs,clamp(20px,3.1vw,38px));
    line-height:1.16;
    letter-spacing:.055em;
    color:#1a1304;
    text-shadow:0 1px 0 rgba(255,244,200,.5);
    position:relative;z-index:2;
    word-break:break-word;
  }
  #ens{font-size:clamp(9px,1vw,12px);text-align:center;letter-spacing:.3em;display:block;opacity:.85}
  .fno{
    position:absolute;right:-.2em;top:-1.55em;font-size:10px;letter-spacing:.42em;opacity:.5;
    color:#cbb073;font-variant:normal;
  }

  /* laurel crest, seated above the cartouche */
  #crest{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    width:var(--crestW,86px);margin-bottom:.35em;
    opacity:.95;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55));}
  #crest svg{display:block;width:100%;height:auto;overflow:visible}

  /* corner fleurons */
  .orn{position:absolute;width:9px;height:9px;background:linear-gradient(135deg,#8a6409,#f7d752);transform:rotate(45deg);z-index:3;box-shadow:0 0 0 1px rgba(60,40,0,.5)}
  .orn.tl{left:-4px;top:-4px}.orn.tr{right:-4px;top:-4px}
  .orn.bl{left:-4px;bottom:-4px}.orn.br{right:-4px;bottom:-4px}

  /* ---------- lyrics ---------- */
  #lyr{
    position:absolute;left:50%;transform:translateX(-50%);
    text-align:center;
    box-sizing:border-box;
    padding:0 4%;
  }
  .ln{
    font-family:var(--serif);
    display:block;
    transition:opacity .5s ease,filter .5s ease,transform .5s ease;
  }
  #lprev,#lnext{
    color:#a3926d;opacity:.55;letter-spacing:.05em;
    font-size:clamp(11px,1.35vw,18px);
    line-height:1.45;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #lnext{margin-top:.42em}
  #lprev{margin-bottom:.38em}
  #lcur{
    color:#f6e8c8;
    font-size:var(--curFs,clamp(19px,2.9vw,42px));
    line-height:1.34;
    font-weight:500;
    letter-spacing:.035em;
    text-shadow:0 1px 3px rgba(0,0,0,.85);
  }  #lcur .ch{
    opacity:.46;color:#c0ab86;transition:opacity .30s ease,color .30s ease,text-shadow .30s ease;
    display:inline;
  }
  #lcur .ch.on{opacity:1;color:#ffedc2;text-shadow:0 0 1px rgba(255,236,190,.9),0 0 16px rgba(236,193,45,.28),0 1px 3px rgba(0,0,0,.85)}
  #lcur .ch.gap{opacity:1;color:inherit}
  #lcur.empty{font-style:italic;color:#bfae8c;font-size:clamp(13px,1.6vw,20px);letter-spacing:.08em}

  /* engraved status + timecode, printed light on the ink band */
  #status,#tc{
    position:absolute;bottom:calc(var(--mb,26px) * .42);
    font-family:var(--serif);font-variant:small-caps;text-transform:uppercase;
    font-size:clamp(7px,.78vw,10px);letter-spacing:.34em;
    color:rgba(208,182,126,.72);
    white-space:nowrap;
  }
  #status{left:calc(var(--mb,26px) * 1.1)}
  #tc{right:calc(var(--mb,26px) * 1.1);letter-spacing:.18em}
  #status b{color:rgba(208,182,126,.55);font-weight:400}
  #status .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:#d8b45e;margin-right:.7em;vertical-align:.15em}
  #status.paused .dot{background:transparent;box-shadow:inset 0 0 0 1px #b99a52}

  /* side plate number on the ivory margin */
  #fno{
    position:absolute;left:calc(var(--mb,26px) * 1.1);top:calc(var(--mb,26px) * .55);
    font-family:var(--serif);font-variant:small-caps;text-transform:uppercase;
    font-size:clamp(7px,.78vw,10px);letter-spacing:.4em;
    color:rgba(74,54,19,.55);white-space:nowrap;
  }

  /* cameo of the album art */
  #cameo{
    position:absolute;
    width:clamp(50px,5.4vw,84px);height:calc(clamp(50px,5.4vw,84px)*1.3);
    border-radius:50%/46%;
    overflow:hidden;opacity:0;transition:opacity .8s ease;
    box-shadow:0 0 0 1px #d9b451,0 0 0 3.5px rgba(24,16,4,.55),0 0 0 5px #97721c,0 10px 22px rgba(0,0,0,.5);
  }
  #cameo.on{opacity:.94}
  #cameo img{width:100%;height:100%;object-fit:cover;filter:sepia(.5) contrast(1.06) brightness(.9) saturate(.78)}
  #cameo::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 65% at 50% 28%,rgba(255,240,200,0),rgba(20,12,0,.5));pointer-events:none}
</style>
</head>
<body>
<canvas id="w"></canvas>
<div id="stage">
  <header id="cart">
    <div id="crest"></div>
    <div class="ci">
      <span class="orn tl"></span><span class="orn tr"></span><span class="orn bl"></span><span class="orn br"></span>
      <div class="row"><span id="comp">Anonymus</span><span id="cat">D.C. 2530 489</span></div>
      <div class="rule"><i></i><b></b><i></i></div>
      <div id="work" data-empty="Senza Parole">Senza Parole</div>
      <div class="rule"><i></i><b></b><i></i></div>
      <span id="ens">Orchestra</span>
    </div>
  </header>
  <div id="mark"></div>
  <div id="lyr">
    <div class="ln" id="lprev"></div>
    <div class="ln" id="lcur"></div>
    <div class="ln" id="lnext"></div>
  </div>
  <div id="cameo"><img id="cimg" alt=""></div>
  <div id="pno">TAB. I</div>
  <div id="status"><span class="dot"></span><span id="stxt">Pausa</span></div>
  <div id="tc">00:00 / 00:00</div>
</div>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('w');
  var ctx = cv.getContext('2d', {alpha:false});
  var W = 1440, H = 900, DPR = 1;
  var state = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', gl: false, rm: false };
  var song = { name: '', artists: '', cover: '' };
  var accent = [190, 150, 62];
  var duration = 0;
  var readySent = false;
  var plate = document.createElement('canvas');
  var pctx = plate.getContext('2d');
  var lay = { m: 20, cw: 600, ch: 180, cx: 720, top: 60, headY: 400, figH: 500, lyricY: 700,
              land: true, bandW: 1200, nx: 0, ny: 0, nw: 200, nh: 200, portrait: false,
              cartH: 160, lyricTop: 600, avail: 200, bandTop: 620 };
  var dirty = true;
  var beatLevel = 0, liveLevel = 0, liveBass = 0, lastBeatAt = -9, nowSec = 0;

  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){ console.error('[489] ready post failed', e); }
  }

  var elCart = document.getElementById('cart');
  var elLyr  = document.getElementById('lyr');
  var elMark = document.getElementById('mark');
  var elCameo = document.getElementById('cameo');

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  function layout(){
    var portrait = H > W * 1.06;
    var fs = portrait ? clamp(W * 0.058, 15, 27) : clamp(Math.min(W * 0.031, H * 0.042), 15, 40);
    var cartH, gap;

    elCart.style.setProperty('--crestW', clamp(Math.min(W, H) * 0.085, 46, 92).toFixed(0) + 'px');
    if (portrait){
      elCart.style.setProperty('--cartW', '88vw');
      elCart.style.top = '6.0vh';
    } else {
      elCart.style.setProperty('--cartW', clamp(W * 0.50, 360, 690).toFixed(0) + 'px');
      elCart.style.top = '7.6vh';
    }
    document.getElementById('work').style.setProperty('--workFs', fs.toFixed(1) + 'px');

    var cr = elCart.getBoundingClientRect();
    cartH = cr.height > 8 ? cr.height : clamp(H * 0.18, 90, 210);
    var cartTopPx = cr.height > 8 ? cr.top : H * 0.076;
    gap = clamp(H * 0.026, 10, 30);

    // the ink band: lyric plate along the bottom margin
    var bandH = clamp(H * (portrait ? 0.325 : 0.300), 112, 330);
    var bandTop = H - bandH;
    lay.bandTop = bandTop;
    lay.bandH = bandH;

    // the portrait plate starts underneath the cartouche — the banner overlaps it
    var overlap = cartH * 0.46;
    var ny0 = cartTopPx + overlap;
    var ny1 = bandTop - clamp(H * 0.018, 6, 18);
    var nh = Math.max(60, ny1 - ny0);
    var nw = portrait ? Math.min(W * 0.84, nh * 0.86) : Math.min(W * 0.44, nh * 0.68);
    var nx = (W - nw) / 2;

    lay.m = clamp(Math.min(W, H) * 0.032, 10, 46);
    lay.nx = nx; lay.ny = ny0; lay.nw = nw; lay.nh = nh;
    lay.portrait = portrait;
    lay.cartH = cartH;

    // lyrics
    var curFs = portrait ? clamp(W * 0.047, 16, 30) : clamp(Math.min(W * 0.030, H * 0.044), 17, 46);
    var lyrEl = document.getElementById('lcur');
    lyrEl.style.setProperty('--curFs', curFs.toFixed(1) + 'px');
    lay.lyricTop = bandTop + clamp(bandH * 0.24, 20, 54);
    elLyr.style.top = lay.lyricTop.toFixed(1) + 'px';
    elLyr.style.width = (portrait ? '92vw' : Math.min(W * 0.86, 1180).toFixed(0) + 'px');
    lay.avail = H - lay.lyricTop - clamp(bandH * 0.26, 18, 48);
    document.documentElement.style.setProperty('--mb', lay.m.toFixed(0) + 'px');

    // engraved margin furniture (on the vellum, not the band)
    document.getElementById('pno').style.top = Math.max(5, lay.m * 0.55).toFixed(0) + 'px';
    document.getElementById('pno').style.left = Math.max(8, lay.m * 1.05).toFixed(0) + 'px';
    var bm = Math.max(5, lay.m * 0.5).toFixed(0) + 'px';
    document.getElementById('status').style.bottom = bm;
    document.getElementById('tc').style.bottom = bm;

    // cameo of the sleeve art, seated on the vellum below the plate (skipped when the plate is wide)
    var ch = clamp(Math.min(W, H) * 0.10, 42, 80);
    elCameo.style.width = ch.toFixed(0) + 'px';
    elCameo.style.height = (ch * 1.3).toFixed(0) + 'px';
    elCameo.style.right = Math.max(10, lay.m * 1.05).toFixed(0) + 'px';
    elCameo.style.top = (bandTop - ch * 1.3 - clamp(H * 0.012, 5, 14)).toFixed(0) + 'px';
    var clearOfPlate = (W - nw) / 2 > ch + lay.m * 1.5;
    elCameo.style.display = clearOfPlate ? 'block' : 'none';

    // slide the credits block clear of the crest
    elCart.style.setProperty('--skyH', Math.max(0, cartTopPx - 2).toFixed(0) + 'px');

    resetFitBase();
    if (curLine !== -2) { try { fitCurrent(); } catch(e){ console.error('[489] fit', e); } }
  }

  /* ================= plate prerender ================= */
  function roundRect(c, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  var noisePat = null;
  function makeNoise(){
    var n = document.createElement('canvas'); n.width = 180; n.height = 180;
    var nc = n.getContext('2d');
    var img = nc.createImageData(180, 180);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4){
      var v = 120 + Math.random() * 135;
      d[i] = v; d[i+1] = v * 0.96; d[i+2] = v * 0.86; d[i+3] = 30 + Math.random() * 55;
    }
    nc.putImageData(img, 0, 0);
    return n;
  }

  function drawConductor(c, x, y, w, h){
    // warm studio backdrop
    var bg = c.createRadialGradient(x + w * 0.40, y + h * 0.24, w * 0.04, x + w * 0.5, y + h * 0.55, w * 1.15);
    bg.addColorStop(0, '#8a8377');
    bg.addColorStop(0.34, '#57514a');
    bg.addColorStop(0.72, '#2a2621');
    bg.addColorStop(1, '#15120f');
    c.fillStyle = bg;
    c.fillRect(x, y, w, h);

    // figure occupies x ≈ -190..400, y ≈ 96..1000 in its own units — fit both axes, bottom-anchored
    var s = Math.min(w / 620, h / 930);
    c.save();
    c.translate(x + w * 0.5 - 105 * s, y + h - 1000 * s);
    c.scale(s, s);

    // ---- figure ----
    var coat = '#120e0b';
    var coat2 = '#1d1712';

    // raised baton arm (behind torso silhouette)
    c.strokeStyle = coat2;
    c.lineWidth = 46; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(112, 372);
    c.quadraticCurveTo(196, 300, 236, 214);
    c.stroke();
    // hand
    c.fillStyle = '#2a221a';
    c.beginPath(); c.ellipse(240, 200, 26, 30, -0.5, 0, 6.2832); c.fill();
    // baton
    c.strokeStyle = '#e8d39a';
    c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(246, 192); c.lineTo(392, 96); c.stroke();
    c.strokeStyle = 'rgba(255,240,200,.5)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(250, 190); c.lineTo(390, 96); c.stroke();

    // torso / coat
    c.fillStyle = coat;
    c.beginPath();
    c.moveTo(-150, 1000);
    c.lineTo(-128, 560);
    c.quadraticCurveTo(-116, 452, -40, 400);
    c.quadraticCurveTo(30, 352, 96, 384);
    c.quadraticCurveTo(150, 356, 178, 404);
    c.quadraticCurveTo(206, 452, 200, 540);
    c.lineTo(196, 1000);
    c.closePath();
    c.fill();

    // shoulder highlight edge
    c.save();
    c.beginPath();
    c.moveTo(-150, 1000);
    c.lineTo(-128, 560);
    c.quadraticCurveTo(-116, 452, -40, 400);
    c.quadraticCurveTo(30, 352, 96, 384);
    c.strokeStyle = 'rgba(226,200,150,.16)';
    c.lineWidth = 9;
    c.stroke();
    c.restore();

    // neck + collar
    c.fillStyle = '#191411';
    c.beginPath(); c.moveTo(18, 372); c.lineTo(114, 372); c.lineTo(122, 420); c.lineTo(10, 420); c.closePath(); c.fill();
    // shirt collar wedge
    c.fillStyle = '#cfc5ad';
    c.beginPath(); c.moveTo(46, 398); c.lineTo(92, 398); c.lineTo(70, 470); c.closePath(); c.fill();
    c.fillStyle = '#0e0b09';
    c.beginPath(); c.moveTo(62, 398); c.lineTo(78, 398); c.lineTo(70, 452); c.closePath(); c.fill();

    // head
    c.fillStyle = '#100c0a';
    c.beginPath(); c.ellipse(66, 292, 62, 74, -0.07, 0, 6.2832); c.fill();
    // hair mass (maestro swept back)
    c.fillStyle = '#0b0806';
    c.beginPath();
    c.moveTo(4, 268);
    c.quadraticCurveTo(2, 208, 66, 196);
    c.quadraticCurveTo(128, 190, 136, 250);
    c.quadraticCurveTo(120, 216, 78, 222);
    c.quadraticCurveTo(34, 228, 26, 286);
    c.closePath(); c.fill();
    // cheek rim light
    c.strokeStyle = 'rgba(232,206,158,.30)';
    c.lineWidth = 5;
    c.beginPath(); c.moveTo(6, 268); c.quadraticCurveTo(0, 316, 34, 344); c.stroke();
    // jaw shadow
    c.fillStyle = 'rgba(0,0,0,.35)';
    c.beginPath(); c.ellipse(80, 330, 44, 30, -0.18, 0, 3.1416); c.fill();

    // bowing / gesturing left arm
    c.strokeStyle = coat2; c.lineWidth = 44;
    c.beginPath(); c.moveTo(-118, 470); c.quadraticCurveTo(-176, 570, -150, 648); c.stroke();
    c.fillStyle = '#241d16';
    c.beginPath(); c.ellipse(-148, 664, 24, 26, 0.2, 0, 6.2832); c.fill();

    c.restore();

    // ---- gravure line texture ----
    c.save();
    c.beginPath(); c.rect(x, y, w, h); c.clip();
    c.globalAlpha = 0.055;
    for (var gy = 0; gy < h; gy += 2.2){
      c.fillStyle = (gy % 4.4 < 2.2) ? '#000' : '#fff';
      c.fillRect(x, y + gy, w, 1);
    }
    c.restore();

    // ---- grain + vignette ----
    if (noisePat){
      c.save();
      c.globalAlpha = 0.5; c.globalCompositeOperation = 'overlay';
      c.fillStyle = noisePat; c.fillRect(x, y, w, h);
      c.restore();
    }
    var vg = c.createRadialGradient(x + w / 2, y + h * 0.42, h * 0.20, x + w / 2, y + h * 0.5, h * 0.92);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.62, 'rgba(0,0,0,.14)');
    vg.addColorStop(1, 'rgba(0,0,0,.56)');
    c.fillStyle = vg; c.fillRect(x, y, w, h);

    // sepia wash to sit inside the ivory sleeve
    c.save();
    c.globalCompositeOperation = 'multiply';
    c.fillStyle = 'rgba(196,164,110,.30)';
    c.fillRect(x, y, w, h);
    c.restore();
    c.save();
    c.globalCompositeOperation = 'soft-light';
    c.fillStyle = 'rgba(255,214,140,.35)';
    c.fillRect(x, y, w, h);
    c.restore();
  }

  function drawWatermark(c, cx, cy, r){
    c.save();
    c.translate(cx, cy);
    c.globalAlpha = 0.075;
    c.strokeStyle = '#6d4f18';
    c.lineWidth = Math.max(1, r * 0.012);
    // laurel wreath: two arcs of leaves
    for (var side = -1; side <= 1; side += 2){
      c.beginPath();
      c.arc(0, 0, r, Math.PI * 0.34 * side + (side < 0 ? Math.PI : 0), Math.PI * 1.34, side < 0);
      c.stroke();
      for (var i = 0; i < 13; i++){
        var a = Math.PI * (0.36 + i * 0.075) * 1.0;
        var ang = side < 0 ? (Math.PI - a) : a;
        var px = Math.cos(ang) * r, py = Math.sin(ang) * r * 0.98;
        c.save(); c.translate(px, py); c.rotate(ang + (side < 0 ? -0.9 : 0.9));
        c.beginPath(); c.ellipse(0, 0, r * 0.075, r * 0.028, 0, 0, 6.2832); c.stroke();
        c.restore();
      }
    }
    // lyre at centre
    c.beginPath(); c.arc(0, 0, r * 0.30, 0, 6.2832); c.stroke();
    c.beginPath();
    c.moveTo(-r * 0.10, r * 0.16);
    c.quadraticCurveTo(-r * 0.20, -r * 0.06, -r * 0.08, -r * 0.16);
    c.moveTo(r * 0.10, r * 0.16);
    c.quadraticCurveTo(r * 0.20, -r * 0.06, r * 0.08, -r * 0.16);
    c.moveTo(-r * 0.08, r * 0.16); c.lineTo(r * 0.08, r * 0.16);
    c.stroke();
    c.restore();
  }

  function buildPlate(){
    var pw = Math.max(2, Math.round(W * DPR)), ph = Math.max(2, Math.round(H * DPR));
    plate.width = pw; plate.height = ph;
    var c = pctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);

    // ---- ivory sleeve base ----
    var base = c.createLinearGradient(0, 0, W * 0.35, H);
    base.addColorStop(0, '#f2e7cd');
    base.addColorStop(0.45, '#ece0c4');
    base.addColorStop(1, '#dfd0ae');
    c.fillStyle = base; c.fillRect(0, 0, W, H);

    // warm bloom top-left, cool dusk bottom-right
    var bl = c.createRadialGradient(W * 0.22, H * 0.06, 0, W * 0.22, H * 0.06, W * 0.75);
    bl.addColorStop(0, 'rgba(255,250,232,.85)');
    bl.addColorStop(0.5, 'rgba(255,244,214,.16)');
    bl.addColorStop(1, 'rgba(120,96,52,.0)');
    c.fillStyle = bl; c.fillRect(0, 0, W, H);

    // paper grain
    if (!noisePat) noisePat = makeNoise();
    c.save();
    c.globalAlpha = 0.85; c.globalCompositeOperation = 'multiply';
    c.fillStyle = noisePat; c.fillRect(0, 0, W, H);
    c.restore();

    // fibres
    c.save();
    c.globalAlpha = 0.5;
    for (var i = 0; i < 90; i++){
      var fx = Math.random() * W, fy = Math.random() * H;
      var fl = 4 + Math.random() * 26, ang = Math.random() * Math.PI;
      c.strokeStyle = Math.random() > 0.5 ? 'rgba(120,96,54,.07)' : 'rgba(255,252,238,.16)';
      c.lineWidth = 0.6;
      c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx + Math.cos(ang) * fl, fy + Math.sin(ang) * fl); c.stroke();
    }
    c.restore();

    // aged stains
    c.save();
    for (var s = 0; s < 4; s++){
      var sx = (s * 0.31 + 0.12) * W, sy = (s * 0.47 + 0.2) * H, sr = (0.10 + 0.07 * (s % 3)) * W;
      var sg = c.createRadialGradient(sx, sy, 0, sx, sy, sr);
      sg.addColorStop(0, 'rgba(160,128,64,0)');
      sg.addColorStop(0.72, 'rgba(160,128,64,.055)');
      sg.addColorStop(1, 'rgba(160,128,64,0)');
      c.fillStyle = sg; c.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    }
    c.restore();

    // watermark medallion behind portrait
    drawWatermark(c, W * 0.5, lay.ny + lay.nh * 0.5, Math.min(lay.nh * 0.86, W * 0.40));

    // ---- printed rules / margins ----
    var m = lay.m;
    c.strokeStyle = 'rgba(74,54,19,.55)'; c.lineWidth = 1;
    c.strokeRect(m * 0.62 + 0.5, m * 0.62 + 0.5, W - m * 1.24 - 1, H - m * 1.24 - 1);
    c.strokeStyle = 'rgba(74,54,19,.28)';
    c.strokeRect(m * 0.62 + 4.5, m * 0.62 + 4.5, W - m * 1.24 - 9, H - m * 1.24 - 9);
    // gilt hairline at very edge
    c.strokeStyle = 'rgba(150,112,36,.42)'; c.lineWidth = 3;
    c.strokeRect(1.5, 1.5, W - 3, H - 3);

    // ---- portrait niche ----
    var nx = lay.nx, ny = lay.ny, nw = lay.nw, nh = lay.nh;
    // cast shadow
    c.save();
    c.shadowColor = 'rgba(48,32,8,.55)'; c.shadowBlur = Math.min(38, nw * 0.09);
    c.shadowOffsetY = Math.min(14, nh * 0.03);
    c.fillStyle = '#2a241c';
    c.fillRect(nx, ny, nw, nh);
    c.restore();

    // ivory mat around the image
    var mat = clamp(Math.min(nw, nh) * 0.028, 4, 16);
    c.fillStyle = '#f6eed6';
    c.fillRect(nx - mat, ny - mat, nw + mat * 2, nh + mat * 2);

    var ix = nx, iy = ny, iw = nw, ih = nh;
    c.save();
    c.beginPath(); c.rect(ix, iy, iw, ih); c.clip();
    drawConductor(c, ix, iy, iw, ih);
    c.restore();

    // gilt bevel
    c.strokeStyle = 'rgba(120,88,26,.85)'; c.lineWidth = 1;
    c.strokeRect(ix - 0.5, iy - 0.5, iw + 1, ih + 1);
    c.strokeStyle = 'rgba(255,242,208,.7)'; c.lineWidth = 1;
    c.strokeRect(ix + 0.5, iy + 0.5, iw - 1, ih - 1);
    c.strokeStyle = 'rgba(122,90,28,.55)'; c.lineWidth = 2.5;
    c.strokeRect(nx - mat - 1   , ny - mat - 1    , nw + mat * 2 + 2, nh + mat * 2 + 2);
    c.strokeStyle = 'rgba(176,138,58,.45)'; c.lineWidth = 1;
    c.strokeRect(nx - mat - 4   , ny - mat - 4    , nw + mat * 2 + 8, nh + mat * 2 + 8);

    // plate caption under the image, letterpress — only if it clears the ink band
    var capY = ny + nh + mat + clamp(nh * 0.045, 12, 26);
    if (capY < lay.bandTop - 6 - 10){
      c.save();
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = 'rgba(64,46,16,.62)';
      c.font = '600 ' + clamp(nw * 0.030, 8, 12).toFixed(1) + 'px Georgia, serif';
      var capText = 'PORTRAIT OF THE CONDUCTOR  ·  AT THE PODIUM';
      c.fillText(capText.split('').join('\u2009'), W / 2, capY);
      c.restore();
    }

    // bottom colophon rule
    c.strokeStyle = 'rgba(74,54,19,.30)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(W * 0.28, H - m * 0.72); c.lineTo(W * 0.72, H - m * 0.72); c.stroke();

    // edge vignette (keeps cream from being flat white)
    var ev = c.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.28, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    ev.addColorStop(0, 'rgba(255,250,235,0)');
    ev.addColorStop(0.7, 'rgba(108,84,42,.06)');
    ev.addColorStop(1, 'rgba(78,58,24,.20)');
    c.fillStyle = ev; c.fillRect(0, 0, W, H);

    // ---- ink band: the lyric plate, printed dark over the vellum ----
    var bandTop = lay.bandTop, bandH = H - lay.bandTop;
    c.save();
    c.beginPath(); c.rect(0, bandTop, W, bandH); c.clip();

    var bg2 = c.createLinearGradient(0, bandTop, W * 0.25, H);
    bg2.addColorStop(0, '#191309');
    bg2.addColorStop(0.5, '#14100a');
    bg2.addColorStop(1, '#0c0906');
    c.fillStyle = bg2; c.fillRect(0, bandTop, W, bandH);

    // warm interior glow so it isn't a flat black slab
    var ig = c.createRadialGradient(W * 0.5, bandTop + bandH * 0.16, 0, W * 0.5, bandTop + bandH * 0.3, W * 0.66);
    ig.addColorStop(0, 'rgba(236,193,45,.13)');
    ig.addColorStop(0.42, 'rgba(190,146,40,.05)');
    ig.addColorStop(1, 'rgba(120,88,20,0)');
    c.fillStyle = ig; c.fillRect(0, bandTop, W, bandH);

    // plate grain
    if (noisePat){
      c.save(); c.globalAlpha = 0.30; c.globalCompositeOperation = 'overlay';
      c.fillStyle = noisePat; c.fillRect(0, bandTop, W, bandH); c.restore();
    }
    // fine engraved hatching, vertical
    c.save(); c.globalAlpha = 0.045;
    for (var hx = 0; hx < W; hx += 3){
      c.fillStyle = (hx % 6 < 3) ? '#000' : '#e8c66a';
      c.fillRect(hx, bandTop, 1, bandH);
    }
    c.restore();

    // gilt double rule along the top edge of the band
    c.strokeStyle = 'rgba(200,158,56,.72)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(W * 0.06, bandTop + 0.5); c.lineTo(W * 0.94, bandTop + 0.5); c.stroke();
    c.strokeStyle = 'rgba(200,158,56,.30)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(W * 0.06, bandTop + 4.5); c.lineTo(W * 0.94, bandTop + 4.5); c.stroke();
    // small diamond centered on the rule
    c.fillStyle = 'rgba(236,193,45,.85)';
    c.save(); c.translate(W / 2, bandTop + 2.5); c.rotate(Math.PI / 4); c.fillRect(-3, -3, 6, 6); c.restore();

    c.restore();

    // fade the vellum into the band so the transition is a printed edge, not a seam
    var fg = c.createLinearGradient(0, bandTop - Math.min(26, bandH * 0.14), 0, bandTop + 2);
    fg.addColorStop(0, 'rgba(20,15,8,0)');
    fg.addColorStop(1, 'rgba(20,15,8,.55)');
    c.fillStyle = fg; c.fillRect(0, bandTop - Math.min(26, bandH * 0.14), W, Math.min(26, bandH * 0.14) + 2);

    dirty = false;
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.round((window.innerWidth || 1440));
    var h = Math.round((window.innerHeight || 900));
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    W = w; H = h;
    cv.width = Math.round(w * DPR);
    cv.height = Math.round(h * DPR);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    plate.width = Math.round(w * DPR); plate.height = Math.round(h * DPR);
    layout();
    try { buildPlate(); } catch(e){ console.error('[489] plate', e); state.err = String(e && e.message || e); }
  }

  function parseInit(p){
    if (!p || typeof p !== 'object') return;
    if (p.song && typeof p.song === 'object') {
      song.name = typeof p.song.name === 'string' ? p.song.name : '';
      var a = p.song.artists;
      if (Array.isArray(a)) song.artists = a.filter(function(x){return typeof x === 'string';}).join(' / ');
      else song.artists = typeof a === 'string' ? a : '';
      song.cover = typeof p.song.cover === 'string' ? p.song.cover : '';
    }
    if (Array.isArray(p.accent) && p.accent.length >= 3) {
      accent = [ +p.accent[0]||0, +p.accent[1]||0, +p.accent[2]||0 ];
    }
    duration = isFinite(p.duration) && p.duration > 0 ? p.duration : 0;
    var src = Array.isArray(p.lines) ? p.lines : [];
    var out = [];
    for (var i = 0; i < src.length && i < 400; i++){
      var L = src[i]; if (!L || typeof L !== 'object') continue;
      var txt = typeof L.text === 'string' ? L.text : '';
      if (!txt.trim()) continue;
      var t0 = isFinite(L.t) ? +L.t : 0;
      var dur = isFinite(L.dur) && L.dur > 0 ? +L.dur : 0;
      var chars = null;
      if (Array.isArray(L.chars) && L.chars.length){
        chars = L.chars.slice(0, 400).map(function(c){
          return { c: (c && typeof c.c === 'string') ? c.c : '', t: (c && isFinite(c.t)) ? +c.t : t0 };
        });
      }
      out.push({ t: t0, dur: dur, text: txt, chars: chars });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    state.lines = out;
    state.idx = -1;
    state.text = '';
    state.playing = p.playing === undefined ? true : !!p.playing;
    curLine = -2; curLit = -1; curSpans = []; curFitDone = false;
    paintCartouche();
  }

  function findIdx(t){
    var L = state.lines, lo = 0, hi = L.length - 1, r = -1;
    while (lo <= hi){ var m = (lo + hi) >> 1; if (L[m].t <= t + 0.001){ r = m; lo = m + 1; } else hi = m - 1; }
    return r;
  }

  /* ================= lyrics ================= */
  var elPrev = document.getElementById('lprev');
  var elCur  = document.getElementById('lcur');
  var elNext = document.getElementById('lnext');
  var curLine = -2;       // which line the DOM currently shows
  var curSpans = [];      // [{el, t}]
  var curLit = -1;
  var curFitDone = false;

  function charTimes(L){
    // returns array of {ch, t} — YRC if available, else even split
    var txt = L.text;
    var out = [];
    if (L.chars && L.chars.length){
      for (var i = 0; i < L.chars.length; i++){
        var c = L.chars[i];
        out.push({ ch: c.c || '', t: isFinite(c.t) ? c.t : L.t });
      }
      // chars length mismatch: fall back to text if it disagrees badly
      var joined = '';
      for (var j = 0; j < out.length && j < 64; j++) joined += out[j].ch;
      if (joined.replace(/\s/g, '').length < 1) return splitEven(txt, L);
      return out;
    }
    return splitEven(txt, L);
  }

  function splitEven(txt, L){
    var d = L.dur > 0 ? L.dur : Math.max(1.6, Math.min(8, txt.length * 0.24));
    var out = [];
    var n = Math.min(txt.length, 200);
    var per = d / Math.max(1, n);
    for (var i = 0; i < n; i++) out.push({ ch: txt.charAt(i), t: L.t + i * per });
    return out;
  }

  function buildLine(i){
    curLine = i;
    curLit = -1;
    curSpans = [];
    curFitDone = false;
    elCur.textContent = '';
    elCur.classList.remove('empty');

    if (i < 0 || !state.lines[i]){
      elCur.classList.add('empty');
      elCur.textContent = state.lines.length ? '· · ·' : 'Senza parole — 此曲无词';
      elPrev.textContent = '';
      elNext.textContent = state.lines.length ? state.lines[0].text : '';
      return;
    }
    var L = state.lines[i];
    var arr = charTimes(L);
    var frag = document.createDocumentFragment();
    for (var k = 0; k < arr.length && k < 200; k++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      var ch = arr[k].ch;
      if (ch === ' ' || ch === '\u3000'){ sp.className = 'ch gap'; sp.innerHTML = '&nbsp;'; }
      else sp.textContent = ch;
      frag.appendChild(sp);
      curSpans.push({ el: sp, t: arr[k].t });
    }
    elCur.appendChild(frag);
    elPrev.textContent = i > 0 ? state.lines[i - 1].text : '';
    elNext.textContent = (i + 1 < state.lines.length) ? state.lines[i + 1].text : '';
    fitCurrent();
  }

  var fitBase = 0;
  function fitCurrent(){
    if (curFitDone) return;
    curFitDone = true;
    var cs = getComputedStyle(elCur);
    if (!fitBase){
      // read the CSS-declared size once (before any inline override)
      var s = parseFloat(cs.fontSize);
      fitBase = isFinite(s) && s > 4 ? s : 24;
    }
    var maxW = Math.max(120, elCur.clientWidth || W * 0.86);
    var maxH = Math.max(56, lay.avail || H * 0.28);
    var fs = fitBase;
    elCur.style.fontSize = fs.toFixed(1) + 'px';
    elCur.style.lineHeight = '';
    var guard = 0;
    while (guard++ < 18 && fs > 10 && (elCur.scrollWidth > maxW + 1 || elCur.scrollHeight > maxH)){
      fs = fs * 0.92;
      if (fs < 10) { fs = 10; elCur.style.fontSize = '10px'; break; }
      elCur.style.fontSize = fs.toFixed(1) + 'px';
    }
    if (elCur.scrollHeight > maxH && fs > 13){
      elCur.style.fontSize = Math.max(11, fs * 0.9).toFixed(1) + 'px';
      elCur.style.lineHeight = '1.2';
    }
  }

  function resetFitBase(){
    // called on resize: re-derive the CSS base, keeping the inline size out of the way
    elCur.style.fontSize = '';
    fitBase = 0;
    curFitDone = false;
  }

  function updateLyrics(now){
    if (!state.lines.length){
      if (curLine !== -1) buildLine(-1);
      elMark.textContent = '';
      return;
    }
    var idx = findIdx(state.t);
    if (idx !== curLine) buildLine(idx);

    if (idx >= 0 && curSpans.length){
      var lit = -1;
      for (var k = 0; k < curSpans.length; k++){
        if (curSpans[k].t <= state.t + 0.002) lit = k; else break;
      }
      if (lit !== curLit){
        // only touch the delta
        if (lit > curLit){
          for (var q = curLit + 1; q <= lit && q < curSpans.length; q++){
            curSpans[q].el.classList.add('on');
          }
        } else {
          for (var r2 = curSpans.length - 1; r2 > lit; r2--) curSpans[r2].el.classList.remove('on');
        }
        curLit = lit;
      }
    }
  }

  /* ================= crest + cartouche text ================= */
  function laurelSVG(){
    return '<svg viewBox="0 0 120 74" aria-hidden="true">' +
      '<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ffe98d"/><stop offset=".45" stop-color="#eec12d"/>' +
      '<stop offset="1" stop-color="#a97f0c"/></linearGradient></defs>' +
      '<g fill="none" stroke="url(#gg)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M60 62 L60 44"/>' +
      '<circle cx="60" cy="30" r="13"/>' +
      '<path d="M52 32 q8 -9 16 0"/><path d="M60 17 v-6"/>' +
      '<path d="M60 62 C44 60 31 50 26 34"/><path d="M60 62 C76 60 89 50 94 34"/>' +
      '<path d="M36 56 q10 2 18 4"/><path d="M84 56 q-10 2 -18 4"/>' +
      '</g>' +
      '<g fill="url(#gg)">' +
      '<ellipse cx="30" cy="38" rx="3.4" ry="7.4" transform="rotate(-42 30 38)"/>' +
      '<ellipse cx="35" cy="49" rx="3.2" ry="7" transform="rotate(-26 35 49)"/>' +
      '<ellipse cx="43" cy="57.5" rx="3" ry="6.6" transform="rotate(-12 43 57.5)"/>' +
      '<ellipse cx="90" cy="38" rx="3.4" ry="7.4" transform="rotate(42 90 38)"/>' +
      '<ellipse cx="85" cy="49" rx="3.2" ry="7" transform="rotate(26 85 49)"/>' +
      '<ellipse cx="77" cy="57.5" rx="3" ry="6.6" transform="rotate(12 77 57.5)"/>' +
      '<circle cx="60" cy="8" r="2.6"/>' +
      '</g></svg>';
  }

  function romanParts(name){
    // "Symphonie Nr. 5 c-Moll, Op. 67 · Allegro" -> eyebrow / work / ensemble-ish pieces
    var s = (name || '').trim();
    if (!s) return { comp: 'Anonymus', work: 'Senza Parole', ens: 'In nomine musicae' };
    return { comp: '', work: s, ens: '' };
  }

  var elComp = document.getElementById('comp');
  var elWork = document.getElementById('work');
  var elEns  = document.getElementById('ens');
  var elPno  = document.getElementById('pno');
  var elCat  = document.getElementById('cat');

  function longDate(){
    var d = new Date();
    var y = d.getFullYear();
    var m = d.getMonth() + 1, day = d.getDate();
    var rom = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][m - 1] || 'I';
    return rom + ' · ' + y;
  }

  function paintCartouche(){
    var name = song.name || '';
    var art = song.artists || '';
    var nm = name.trim();

    elComp.textContent = art || 'Anonymus';
    elWork.textContent = nm || 'Senza Parole';
    elEns.textContent = nm ? 'Orchestra & Chorus' : 'In nomine musicae';

    // catalogue number: stable per song, looks like a DG serial
    var h = 0, src = (nm + '|' + art + '|' + duration);
    for (var i = 0; i < src.length && i < 200; i++) h = (h * 31 + src.charCodeAt(i)) % 99991;
    var ser = 1000 + (h % 8999);
    elCat.textContent = 'D.G. ' + ser + ' · ' + longDate();
    elPno.textContent = duration ? ('TAB. ' + (1 + Math.floor(duration / 60))) : 'TAB. I';

    document.getElementById('crest').innerHTML = laurelSVG();

    // album cameo
    if (song.cover){
      var img = document.getElementById('cimg');
      img.onerror = function(){ elCameo.classList.remove('on'); };
      img.onload = function(){ elCameo.classList.add('on'); };
      img.src = song.cover;
    } else {
      elCameo.classList.remove('on');
    }
    layout();
    dirty = true;
  }

  function frame(now){
    var js0 = performance.now();
    state.frames++;
    if (!readySent) sendReady();
    nowSec = now / 1000;
    if (dirty) { try { buildPlate(); } catch(e){ console.error('[489] late plate', e); } dirty = false; }

    var i = findIdx(state.t);
    state.idx = i;
    state.text = i >= 0 ? state.lines[i].text : '';

    // decay live energy
    var k = Math.exp(-(nowSec - lastBeatAt) * 2.4);
    if (lastBeatAt < 0) k = 0;
    var pulse = state.rm ? 0 : (beatLevel * k);

    ctx.drawImage(plate, 0, 0, W, H);

    // very slow breathing of the whole plate (keeps three sampled moments distinct)
    var drift = state.rm ? 0 : Math.sin(nowSec * 0.45) * 0.5 + 0.5;
    // gilt rim catching the light, drawn as a soft inner edge (cheap, no blur filter)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var rim = ctx.createLinearGradient(0, 0, W, H);
    var ra = 0.035 + drift * 0.030 + pulse * 0.05;
    rim.addColorStop(0, 'rgba(255,214,120,' + ra.toFixed(3) + ')');
    rim.addColorStop(0.5, 'rgba(255,200,90,0)');
    rim.addColorStop(1, 'rgba(255,214,120,' + (ra * 0.7).toFixed(3) + ')');
    ctx.strokeStyle = rim;
    ctx.lineWidth = 3;
    ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
    ctx.restore();

    // breathing light over the portrait niche (cheap, no blur)
    var gx = lay.nx + lay.nw * 0.5, gy = lay.ny + lay.nh * 0.30;
    var rad = lay.nw * (0.62 + pulse * 0.20);
    var lg = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    var amt = 0.05 + pulse * 0.16 + liveLevel * 0.03;
    lg.addColorStop(0, 'rgba(255,226,158,' + amt.toFixed(3) + ')');
    lg.addColorStop(0.55, 'rgba(255,206,120,' + (amt * 0.30).toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(255,196,100,0)');
    ctx.save();
    ctx.beginPath(); ctx.rect(lay.nx, lay.ny, lay.nw, lay.nh); ctx.clip();
    ctx.fillStyle = lg; ctx.fillRect(lay.nx, lay.ny, lay.nw, lay.nh);
    // slow sweeping sheen across the plate (like light moving on varnish)
    var sweep = ((nowSec * (state.rm ? 6 : 22)) % (W + 700)) - 350;
    var sg = ctx.createLinearGradient(sweep - 220, 0, sweep + 220, H * 0.55);
    sg.addColorStop(0, 'rgba(255,236,182,0)');
    sg.addColorStop(0.5, 'rgba(255,236,182,' + (0.05 + pulse * 0.05).toFixed(3) + ')');
    sg.addColorStop(1, 'rgba(255,236,182,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(lay.nx, lay.ny, lay.nw, lay.nh);
    ctx.restore();

    updateLyrics(nowSec);
    updateHud();

    state.js = Math.round((performance.now() - js0) * 100) / 100;
    requestAnimationFrame(frame);
  }

  var hudLast = -1, hudPlaying = null;
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var m = Math.floor(s / 60), q = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (q < 10 ? '0' : '') + q;
  }
  function updateHud(){
    if (hudPlaying !== state.playing){
      hudPlaying = state.playing;
      document.getElementById('status').classList.toggle('paused', !state.playing);
      document.getElementById('stxt').textContent = state.playing ? 'Inciso' : 'Pausa';
      elLyr.style.opacity = state.playing ? '1' : '0.55';
      elCart.style.opacity = state.playing ? '1' : '0.82';
    }
    var tick = Math.floor(state.t * 2);
    if (tick !== hudLast){
      hudLast = tick;
      document.getElementById('tc').textContent =
        fmt(state.t) + ' / ' + fmt(duration || state.t);
    }
  }

  window.__stage = function(){
    return { lines: state.lines.length, idx: state.idx, t: state.t, playing: state.playing,
      frames: state.frames, js: state.js, err: state.err, text: state.text, gl: state.gl, rm: state.rm };
  };

  window.addEventListener('message', function(ev){
    var d = ev.data; if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') parseInit(d.payload);
      else if (d.type === 'tick'){ var p = d.payload||{}; if (isFinite(p.time)) state.t = +p.time; if (p.playing !== undefined) state.playing = !!p.playing; }
      else if (d.type === 'beat'){
        var b = d.payload || {};
        beatLevel = clamp(isFinite(b.level) ? +b.level : 0.5, 0, 1);
        lastBeatAt = nowSec;
      }
      else if (d.type === 'live'){
        var v = d.payload || {};
        liveLevel = clamp(isFinite(v.level) ? +v.level : 0, 0, 1);
        liveBass  = clamp(isFinite(v.bass) ? +v.bass : 0, 0, 1);
        if (v.playing !== undefined) state.playing = !!v.playing;
      }
    } catch(e){ state.err = String(e && e.message || e); console.error('[489] message error', e); }
  }, false);

  window.addEventListener('resize', function(){ try { resize(); } catch(e){ console.error('[489] resize', e); } }, false);

  try {
    state.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    paintCartouche();
    resize();
    requestAnimationFrame(frame);
    setTimeout(sendReady, 700);
    // fonts may land late and change metrics → re-fit once, cheaply
    setTimeout(function(){ try { layout(); } catch(e){ console.error('[489] refit', e); } }, 900);
  } catch(e){ state.err = String(e && e.message || e); console.error('[489] boot', e); }
})();
</script>
