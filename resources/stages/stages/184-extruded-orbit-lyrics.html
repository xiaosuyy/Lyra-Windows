<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体积绕飞歌词</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.6 ui-monospace,Consolas,monospace;color:rgba(150,190,255,.26);
        letter-spacing:.16em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   224 · 体积绕飞 —— 字被沿 z 挤出成一块真实的粒子体积，相机绕着它飞

   机制一句话：把当前句的墨迹采样成 14k 颗粒子，每颗给一个 ±110 的深度，
   于是一句词成了一块**有厚度的立体字**；相机以 ±13° 的偏航 + 轻微俯仰缓慢
   绕飞，粒子做真的三维旋转与透视投影，前面的更亮更大、后面的退进雾里。
   → 侧过来的时候能看见字的"侧壁"，这是纯 2D 字形永远给不出的信息。

   · 旋转 + 投影每帧 14k 次（纯乘加），按深度分 4 档合批，帧里不分配内存。
   · 字始终有一层 0.09 的正面淡影钉住轮廓，绕到最大角度也读得出来。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
let W = 1, H = 1, DPR = 1, VX = 1, VY = 1;
const RM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } })();

let ACC = [126, 178, 255], FOG = [4, 7, 14], ICE = [232, 244, 255];
function buildColors() {
  const r = ACC[0] | 0, g = ACC[1] | 0, b = ACC[2] | 0;
  FOG = [2 + (r * 0.035) | 0, 3 + (g * 0.045) | 0, 7 + (b * 0.06) | 0];
  ICE = [Math.min(255, Math.round(r * 0.30 + 176)), Math.min(255, Math.round(g * 0.30 + 186)), Math.min(255, Math.round(b * 0.26 + 190))];
}

/* ---------------- 排版 ---------------- */
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';
const fontStr = (fs) => '800 ' + fs + 'px ' + FAMILY;
const TRACK = 0.035;
const OPUNCT = '，。、；：！？）】》」』”’,.!?;:)]}%…';
const LPUNCT = '（【《「『“‘({[';
const measCtx = document.createElement('canvas').getContext('2d');
function measureStr(s, fs) {
  measCtx.font = fontStr(fs);
  let w = 0;
  for (let i = 0; i < s.length; i++) w += measCtx.measureText(s[i]).width + fs * TRACK;
  return Math.max(0, w - fs * TRACK);
}
function splitRows(s, L) {
  const n = s.length, cuts = [];
  for (let i = 1; i < L; i++) {
    let c = Math.round(i * n / L);
    while (c < n && OPUNCT.indexOf(s[c]) >= 0) c++;
    if (c > 0 && c < n && LPUNCT.indexOf(s[c - 1]) >= 0) c--;
    if (c <= 0 || c >= n) continue;
    if (cuts.length && c <= cuts[cuts.length - 1]) continue;
    cuts.push(c);
  }
  const rows = [];
  let prev = 0;
  for (let i = 0; i < cuts.length; i++) { rows.push(s.slice(prev, cuts[i])); prev = cuts[i]; }
  rows.push(s.slice(prev));
  return rows.filter((r) => r.length > 0);
}
function layout(raw) {
  if (!raw) return null;
  const s = raw.replace(/\s+/g, ' ').trim();
  if (!s) return null;
  const n = s.length;
  const maxW = Math.min(W * 0.72, 1060), maxH = H * 0.34;
  const maxL = n <= 12 ? 1 : (n <= 24 ? 2 : 3);
  let best = null;
  for (let L = 1; L <= maxL; L++) {
    if (L > 1 && n < L + 2) continue;
    const rows = splitRows(s, L);
    let w100 = 0;
    for (let i = 0; i < rows.length; i++) w100 = Math.max(w100, measureStr(rows[i], 100));
    const fs = Math.min(maxW / (Math.max(1, w100) / 100), maxH / (1.22 * rows.length), 168);
    if (fs < 24) continue;
    if (best && fs < best.fs * 1.07) continue;
    best = { rows: rows, fs: fs };
  }
  if (!best) {
    const w100 = Math.max(1, measureStr(s, 100));
    best = { rows: [s], fs: Math.max(20, Math.min(maxW / (w100 / 100), maxH / 1.22, 168)) };
  }
  const fs = best.fs, lh = fs * 1.22;
  measCtx.font = fontStr(fs);
  const rows = [];
  let bw = 0;
  for (let r = 0; r < best.rows.length; r++) {
    const txt = best.rows[r], chars = [];
    let x = 0;
    for (let k = 0; k < txt.length; k++) {
      const c = txt[k], wch = measCtx.measureText(c).width;
      if (c !== ' ') chars.push({ c: c, x: x, w: wch });
      x += wch + fs * TRACK;
    }
    const rw = Math.max(0, x - fs * TRACK);
    rows.push({ chars: chars, w: rw, ly: (r + 0.5) * lh });
    if (rw > bw) bw = rw;
  }
  const bh = lh * rows.length;
  return { rows: rows, fs: fs, lh: lh, bw: Math.max(1, bw), bh: bh };
}
function paintRows(g, lay, ox, oy) {
  g.font = fontStr(lay.fs); g.textAlign = 'left'; g.textBaseline = 'middle';
  for (let r = 0; r < lay.rows.length; r++) {
    const row = lay.rows[r];
    for (let k = 0; k < row.chars.length; k++) g.fillText(row.chars[k].c, ox + row.chars[k].x, oy + row.ly);
  }
}

/* ---------------- 掩码 + 粒子 ---------------- */
const MS = 0.5;
const offCv = document.createElement('canvas');
const offCtx = offCv.getContext('2d', { willReadFrequently: true });
const MAXP = 15000;
const pX = new Float32Array(MAXP), pY = new Float32Array(MAXP), pZ = new Float32Array(MAXP), pB = new Float32Array(MAXP);
const pFront = new Uint8Array(MAXP);
let pN = 0;
const DEPTH = 130;             // 体积总深度（侧壁的厚度）
const SURF = 13;               // 正面那层"皮"的厚度

function bakeLine(text) {
  const lay = layout(text);
  if (!lay) return null;
  const pad = Math.round(lay.fs * 0.30) + 18;
  const bw = Math.ceil(lay.bw) + pad * 2;
  const bh = Math.ceil(lay.bh) + pad * 2;
  const gx = VX - bw / 2, gy = VY - bh / 2;

  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(bw * DPR)); c.height = Math.max(2, Math.round(bh * DPR));
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#fff';
  paintRows(g, lay, pad, pad);

  const mw = Math.max(2, Math.round(bw * MS)), mh = Math.max(2, Math.round(bh * MS));
  offCv.width = mw; offCv.height = mh;
  offCtx.setTransform(1, 0, 0, 1, 0, 0);
  offCtx.clearRect(0, 0, mw, mh);
  offCtx.setTransform(MS, 0, 0, MS, 0, 0);
  offCtx.fillStyle = '#fff';
  paintRows(offCtx, lay, pad, pad);
  const d = offCtx.getImageData(0, 0, mw, mh).data;

  /* 采样：墨迹像素 → 3D 粒子。离笔画边缘越近，深度散得越开（圆角挤出） */
  const list = [];
  for (let y = 1; y < mh - 1; y++) {
    for (let x = 1; x < mw - 1; x++) {
      const k = y * mw + x;
      if (d[k * 4 + 3] < 120) continue;
      list.push(x, y);
    }
  }
  const pc = list.length / 2;
  if (pc < 40) return null;
  /* 两批：①正面那层"皮"（薄、亮、密 —— 字靠它读）
            ②更深的体积（稀、暗 —— 只负责侧壁厚度和雾） */
  const frontN = Math.min(Math.round(MAXP * 0.70), pc);
  const haloN = Math.min(MAXP - frontN, Math.round(pc * 0.55));
  pN = frontN + haloN;
  let w = 0;
  for (let i = 0; i < frontN; i++) {
    const j = ((i * pc / frontN) | 0);
    const mx2 = list[j * 2], my2 = list[j * 2 + 1];
    pX[w] = mx2 / MS + gx + (Math.random() - 0.5) * 1.1;
    pY[w] = my2 / MS + gy + (Math.random() - 0.5) * 1.1;
    pZ[w] = (Math.random() * 2 - 1) * SURF;
    pB[w] = 0.62 + Math.random() * 0.38;
    pFront[w] = 1;
    w++;
  }
  for (let i = 0; i < haloN; i++) {
    const j = ((i * pc / haloN) | 0);
    const mx2 = list[j * 2], my2 = list[j * 2 + 1];
    pX[w] = mx2 / MS + gx + (Math.random() - 0.5) * 1.6;
    pY[w] = my2 / MS + gy + (Math.random() - 0.5) * 1.6;
    pZ[w] = (Math.random() * 2 - 1) * DEPTH;
    pB[w] = 0.4 + Math.random() * 0.6;
    pFront[w] = 0;
    w++;
  }
  return { lay: lay, crisp: c, bw: bw, bh: bh, gx: gx, gy: gy };
}

/* ---------------- 状态 ---------------- */
let lines = [], curIdx = -1, brewIdx = -1, lastT = -1;
let prep = null, prepIdx = -1, glyph = null, reveal = 0, needRebake = false;
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
let vT = 0, beat = 0;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(2, window.innerWidth); H = Math.max(2, window.innerHeight);
  VX = W / 2; VY = H * 0.49;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBG();
  needRebake = true;
}
let bgGrad = null, vigGrad = null;
function buildBG() {
  const g = ctx.createRadialGradient(VX, VY, 0, VX, VY, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgb(' + (FOG[0] + 8) + ',' + (FOG[1] + 12) + ',' + (FOG[2] + 22) + ')');
  g.addColorStop(0.5, 'rgb(' + (FOG[0] + 3) + ',' + (FOG[1] + 5) + ',' + (FOG[2] + 10) + ')');
  g.addColorStop(1, 'rgb(' + FOG[0] + ',' + FOG[1] + ',' + FOG[2] + ')');
  bgGrad = g;
  const v = ctx.createRadialGradient(VX, VY, Math.min(W, H) * 0.30, VX, VY, Math.min(W, H) * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(1,2,5,0.62)');
  vigGrad = v;
}

function timing(T) {
  if (!lines.length) { if (glyph) { glyph = null; curIdx = -1; pN = 0; } return; }
  if (T < lastT - 0.6) { curIdx = -1; brewIdx = -1; prep = null; prepIdx = -1; glyph = null; reveal = 0; pN = 0; }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci; brewIdx = -1;
    glyph = ci >= 0 ? ((prep && prepIdx === ci) ? prep : bakeLine(lines[ci].text)) : null;
    if (!glyph) pN = 0;
    reveal = 0; prep = null; prepIdx = -1;
    hint.style.opacity = ci >= 0 ? '0' : '1';
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(1.7, Math.max(0.55, gap * 0.62));
    if (T >= lines[nx].t - lead) { brewIdx = nx; prep = bakeLine(lines[nx].text); prepIdx = nx; }
  }
}

/* ---------------- 主循环 ---------------- */
let last = performance.now(), frames = 0, raf = 0;
const CAP = 15000;
const SXa = new Float32Array(CAP), SYa = new Float32Array(CAP);
const SZa = new Float32Array(CAP), SBA = new Uint8Array(CAP), SBd = new Uint8Array(CAP);
const FOV = 2400, CAMD = 2400;

function frame(ms) {
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
  last = ms; frames++;
  vT += dt * (playing ? 1 : 0.08);
  beat *= Math.exp(-dt * 3.0);
  if (needRebake) { needRebake = false; if (curIdx >= 0 && lines[curIdx]) { glyph = bakeLine(lines[curIdx].text); reveal = 1; } }
  timing(now());
  if (reveal < 1) reveal = Math.min(1, reveal + dt / 0.5);

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  /* 相机绕飞：±13° 偏航 + ±4° 俯仰 */
  const ampY = RM ? 0.05 : 0.235;
  const yaw = ampY * Math.sin(vT * 0.19) + beat * 0.012;
  const pitch = (RM ? 0.012 : 0.062) * Math.sin(vT * 0.145 + 1.1);
  const cyw = Math.cos(yaw), syw = Math.sin(yaw);
  const cpt = Math.cos(pitch), spt = Math.sin(pitch);

  /* 立体字的"正脸"淡影：最大角度也读得出来 */
  if (glyph) {
    ctx.globalAlpha = 0.10 * reveal;
    ctx.drawImage(glyph.crisp, glyph.gx, glyph.gy, glyph.bw, glyph.bh);
    ctx.globalAlpha = 1;
  }

  const breathe = 1 + beat * 0.10;
  let n = 0;
  for (let i = 0; i < pN; i++) {
    const x0 = pX[i] - VX, y0 = pY[i] - VY;
    let z0 = pZ[i] * breathe;
    /* 绕 Y 轴 */
    const x1 = x0 * cyw + z0 * syw;
    const z1 = -x0 * syw + z0 * cyw;
    /* 绕 X 轴 */
    const y1 = y0 * cpt - z1 * spt;
    const z2 = y0 * spt + z1 * cpt + CAMD;
    if (z2 < 120) continue;
    const s = FOV / z2;
    const sx = VX + x1 * s, sy = VY + y1 * s;
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
    if (n >= CAP) break;
    SXa[n] = sx; SYa[n] = sy;
    SZa[n] = (2.4 + pB[i] * 1.0) * s;
    /* 正面那层皮 = 字；深处的体积只留一点侧壁 */
    const front = pFront[i] === 1;
    const dep = (CAMD + DEPTH - z2) / (2 * DEPTH);
    SBA[n] = front ? 2 : (dep > 0.55 ? 1 : 0);
    SBd[n] = pB[i] > 0.78 ? 1 : 0;
    n++;
  }

  ctx.globalCompositeOperation = 'lighter';
  for (let b = 2; b >= 0; b--) {
    const a = b === 2 ? 0.86 : (b === 1 ? 0.20 : 0.10);
    ctx.fillStyle = 'rgba(' + ICE[0] + ',' + ICE[1] + ',' + ICE[2] + ',' + (a * reveal).toFixed(3) + ')';
    for (let i = 0; i < n; i++) {
      if (SBA[i] !== b) continue;
      const s = SZa[i];
      ctx.fillRect(SXa[i] - s / 2, SYa[i] - s / 2, s, s);
    }
  }
  /* 少量"亮点"：让体积有颗粒感 */
  ctx.fillStyle = 'rgba(250,253,255,' + (0.7 * reveal).toFixed(2) + ')';
  for (let i = 0; i < n; i++) {
    if (!SBd[i] || SBA[i] === 0) continue;
    const s = SZa[i] * 0.9;
    ctx.fillRect(SXa[i] - s / 2, SYa[i] - s / 2, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  raf = requestAnimationFrame(frame);
}

/* ---------------- 协议 ---------------- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1; prep = null; prepIdx = -1;
    glyph = null; reveal = 0; pN = 0;
    clockT = 0; clockAt = performance.now();
    if (p.accent && p.accent.length >= 3) {
      ACC = [p.accent[0] | 0, p.accent[1] | 0, p.accent[2] | 0];
      buildColors(); buildBG();
    }
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.45';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    beat = Math.min(1.0, beat + 0.32 + (d.payload.level || 0) * 0.5);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
addEventListener('pagehide', () => { cancelAnimationFrame(raf); });

buildColors();
resize();
raf = requestAnimationFrame(frame);

window.__stage = () => ({
  lines: lines.length, idx: curIdx, curIdx: curIdx, t: +now().toFixed(2), playing: playing,
  frames: frames, particles: pN, reveal: +reveal.toFixed(2), ink: !!glyph,
  yaw: +(0.235 * Math.sin(vT * 0.19) + beat * 0.012).toFixed(3), depth: DEPTH, vT: +vT.toFixed(2)
});
</script>
</body>
</html>
