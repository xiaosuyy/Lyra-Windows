<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquid Chrome — 351</title>
<style>
  :root{
    --ink:#f4f7fb;
    --accent:#8ad7ff;
    --pad:clamp(16px,3.6vw,58px);
    --lyr:linear-gradient(180deg,#ffffff 0%,#e4f0fb 34%,#c6d8e8 58%,#ffffff 100%);
    --chrome:linear-gradient(180deg,#fff 0%,#eaf5ff 8%,#a9bcca 26%,#59697a 42%,#eaf6ff 56%,#fff 64%,#aebfce 80%,#f4faff 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    font-family:"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #bg,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:0;background:#000}
  #gl{z-index:1;background:transparent}
  #hud{position:fixed;inset:0;z-index:2;pointer-events:none;
    display:flex;flex-direction:column;padding:var(--pad) var(--pad) clamp(18px,4.5vh,42px)}
  #brand{display:flex;align-items:center;gap:.85em;font-size:9px;letter-spacing:.52em;
    text-transform:uppercase;color:rgba(196,216,236,.34);font-weight:600}
  #brand .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);opacity:.85}
  #heroMeta{position:absolute;left:0;right:0;text-align:center;top:64%}
  #artists{font-size:clamp(10px,1vw,14px);letter-spacing:.40em;text-transform:uppercase;
    color:rgba(222,236,250,.60);font-weight:600}
  #artists:empty{display:none}
  #rule{width:clamp(38px,5.5vw,86px);height:1px;margin:clamp(9px,1.4vh,16px) auto 0;
    background:linear-gradient(90deg,transparent,rgba(200,225,245,.65),transparent)}
  #titleFallback{position:absolute;display:none;text-align:center;font-weight:900;
    letter-spacing:-.015em;line-height:1.02;font-style:italic;
    background-image:var(--chrome);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 6px 26px rgba(120,190,255,.28))}
  #deck{margin-top:auto;padding-bottom:clamp(8px,1.6vh,18px)}
  #lyric{display:flex;flex-direction:column;gap:clamp(5px,.9vh,14px)}
  .ln{font-size:clamp(19px,2.95vw,42px);line-height:1.34;letter-spacing:.015em;
    font-weight:600;color:rgba(198,216,234,.30);
    transition:opacity .45s ease,filter .45s ease;will-change:opacity;
    overflow-wrap:anywhere;word-break:break-word}
  .ln.cur{font-size:clamp(22px,3.45vw,52px);font-weight:700;
    filter:drop-shadow(0 0 30px rgba(152,208,255,.30))}
  .ln.prev,.ln.next{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ln.prev{opacity:.55}
  .ln.next{opacity:.34}
  .ch{color:rgba(206,224,240,.34);-webkit-text-fill-color:rgba(206,224,240,.34);
    transition:color .16s linear}
  .ch.on{background-image:var(--lyr);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent}
  #bar{display:flex;align-items:center;gap:clamp(9px,1.2vw,16px);margin-top:clamp(12px,2.2vh,26px);
    font-size:10px;letter-spacing:.16em;color:rgba(188,210,232,.44);font-variant-numeric:tabular-nums}
  #track{flex:1;height:1px;background:rgba(255,255,255,.14);position:relative}
  #prog{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg,rgba(160,205,235,.35),#ffffff)}
  #head{position:absolute;top:50%;left:0%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(190,228,255,.9)}
  #empty{position:fixed;left:0;right:0;top:56%;text-align:center;font-size:clamp(10px,1vw,13px);
    letter-spacing:.44em;text-transform:uppercase;color:rgba(198,216,236,.38);z-index:2}
  @media (max-aspect-ratio:3/4){
    #lyric{gap:.36em}
    .ln{font-size:clamp(18px,5.4vw,34px)}
    .ln.cur{font-size:clamp(21px,6.4vw,40px)}
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="hud">
  <div id="brand"><span class="dot"></span><span id="brandTxt">liquid chrome</span></div>
  <div id="titleFallback" aria-hidden="true"></div>
  <div id="heroMeta"><div id="artists"></div><div id="rule"></div></div>
  <div id="deck"><div id="lyric"></div></div>
  <div id="bar">
    <span id="tc">0:00</span>
    <div id="track"><i id="prog"></i><b id="head"></b></div>
    <span id="td">0:00</span>
  </div>
</div>
<div id="empty" hidden>instrumental</div>
<script>
(function(){
  'use strict';
  var S={ lines:[], idx:-1, t:0, playing:true, dur:0, frames:0, js:0, rm:false, name:'', artist:'',
          energy:0.3, beat:0, bass:0, mid:0, level:0.4, treble:0, bpm:0, sinceBeat:9, wall:0,
          anim:0, lit:0, curSpans:null };
  var readySent=false, started=false;
  var lyricEl=document.getElementById('lyric');
  var emptyEl=document.getElementById('empty');
  var brandEl=document.getElementById('brandTxt');
  var artistsEl=document.getElementById('artists');
  var heroMetaEl=document.getElementById('heroMeta');
  var fallbackEl=document.getElementById('titleFallback');
  var tcEl=document.getElementById('tc'), tdEl=document.getElementById('td');
  var progEl=document.getElementById('prog'), headEl=document.getElementById('head');
  var deckEl=document.getElementById('deck');

  /* ================= 0 · sizing & palette ================= */
  var dpr=1, W=1440, H=900, portrait=false;
  var hero={x:0,y:0,w:1440,h:234};
  var ACC=[138,215,255], NEON_A=[1,0.45,0.92], NEON_B=[0.35,0.95,1.0];

  function clamp01(v){ return v<0?0:(v>1?1:v); }
  function pad2(n){ return (n<10?'0':'')+n; }
  function fmtTime(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+pad2(s%60); }

  function applyAccent(acc){
    if(!acc||acc.length<3) return;
    var r=Math.round(+acc[0]), g=Math.round(+acc[1]), b=Math.round(+acc[2]);
    if(!isFinite(r)||!isFinite(g)||!isFinite(b)) return;
    r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
    ACC=[r,g,b];
    var mx=Math.max(r,g,b)||1, mn=Math.min(r,g,b);
    NEON_A=[r/mx*1.0, g/mx*1.0+0.18, b/mx*1.0+0.10];
    NEON_B=[(1-r/mx)*0.55+0.35, (1-g/mx)*0.5+0.55, (1-b/mx)*0.4+0.70];
    document.documentElement.style.setProperty('--accent','rgb('+r+','+g+','+b+')');
    var rr=Math.min(255,r+70), gg=Math.min(255,g+50), bb=Math.min(255,b+30);
    document.documentElement.style.setProperty('--lyr','linear-gradient(180deg,#ffffff 0%, rgb('+rr+','+gg+','+bb+') 36%, rgb('+r+','+g+','+b+') 60%, #ffffff 100%)');
  }

  function computeHero(){
    var w=window.innerWidth|0, h=window.innerHeight|0;
    if(!w||!isFinite(w)||w<2) w=1440;
    if(!h||!isFinite(h)||h<2) h=900;
    W=w; H=h;
    portrait = h > w*1.02;
    var hw = w*(portrait?0.90:0.84);
    var hh = h*(portrait?0.185:0.255);
    var cy = h*(portrait?0.315:0.355);
    hero = { x:Math.round((w-hw)/2), y:Math.round(cy-hh/2), w:Math.round(hw), h:Math.round(hh) };
    heroMetaEl.style.top = Math.round(hero.y+hero.h+ (portrait? 22 : 14)) + 'px';
    updateFallback();
  }

  S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function sendReady(){
    if(readySent) return; readySent=true;
    parent.postMessage({__c100:1,type:'ready'},'*');
  }

  function fmtName(v){
    if(v==null) return '';
    if(Object.prototype.toString.call(v)==='[object Array]') return v.map(fmtName).filter(Boolean).join(' / ');
    return String(v).trim();
  }

  function idxAt(t){
    var n=S.lines.length, lo=0, hi=n-1, r=-1;
    while(lo<=hi){ var m=(lo+hi)>>1; if(S.lines[m].t<=t+0.02){ r=m; lo=m+1; } else hi=m-1; }
    return (n&&t+0.02>=S.lines[0].t)? r : -1;
  }

  function lineSpan(k, cls){
    var src=S.lines[k];
    var d=document.createElement('div');
    d.className='ln '+cls;
    var txt=src.text;
    var chars=src.chars;
    var frag=document.createDocumentFragment();
    var n=txt.length, i, s;
    for(i=0;i<n;i++){
      s=document.createElement('span');
      s.className='ch';
      s.textContent=txt.charAt(i);
      frag.appendChild(s);
    }
    d.appendChild(frag);
    return d;
  }

  function renderLyric(){
    var i=S.idx;
    S.curSpans=null; S.lit=0;
    if(!S.lines.length){
      emptyEl.hidden=false;
      emptyEl.textContent=(S.name||S.artist)?'instrumental · 无歌词':'no lyrics';
      lyricEl.innerHTML='';
      return;
    }
    emptyEl.hidden=true;
    lyricEl.innerHTML='';
    var n=S.lines.length;
    var from=i-1, to=i+1;
    if(i<0){ from=0; to=Math.min(n-1,1); }
    if(i>=n){ from=Math.max(0,n-2); to=n-1; }
    var curEl=null;
    for(var k=from;k<=to;k++){
      if(k<0||k>=n) continue;
      var cls = (k===i)?'cur':(k<i?'prev':'next');
      var el=lineSpan(k,cls);
      lyricEl.appendChild(el);
      if(k===i) curEl=el;
    }
    if(curEl){
      S.curSpans=curEl.getElementsByClassName('ch');
      S.lit=0;
      fitLine(curEl, portrait?3:2);
    }
  }

  function fitLine(el,maxLines){
    el.style.fontSize='';
    var cs=null;
    try{ cs=window.getComputedStyle(el); }catch(e){ return; }
    var fs=parseFloat(cs.fontSize)||20;
    var lh=parseFloat(cs.lineHeight)||fs*1.34;
    var lim=lh*maxLines+2;
    var i;
    for(i=0;i<8;i++){
      if(el.scrollHeight<=lim+1) break;
      fs*=0.90;
      if(fs<11) break;
      el.style.fontSize=fs.toFixed(1)+'px';
      lh=fs*1.34; lim=lh*maxLines+2;
    }
  }

  function updateLyricLive(){
    if(!S.curSpans||!S.curSpans.length) return;
    var line=S.lines[S.idx];
    if(!line) return;
    var n=S.curSpans.length, lit=0, i;
    if(line.chars && line.chars.length===n){
      while(lit<n && line.chars[lit].t<=S.t+0.0001) lit++;
    }else{
      var d=line.dur>0?line.dur:Math.max(1.2,Math.min(7,line.text.length*0.26));
      lit=Math.round(clamp01((S.t-line.t)/d)*n);
    }
    if(lit===S.lit) return;
    if(lit>S.lit){
      for(i=S.lit;i<lit&&i<n;i++) S.curSpans[i].classList.add('on');
    }else{
      for(i=lit;i<S.lit&&i<n;i++) S.curSpans[i].classList.remove('on');
    }
    S.lit=lit;
  }

  function onInit(p){
    p=p||{};
    S.name=fmtName(p.song&&p.song.name);
    S.artist=fmtName(p.song&&p.song.artists);
    S.dur=+p.duration>0?+p.duration:0;
    if(typeof p.playing==='boolean') S.playing=p.playing;
    applyAccent(p.accent);
    var raw=(p.lines&&p.lines.length)?p.lines:[];
    var out=[];
    for(var i=0;i<raw.length;i++){
      var l=raw[i]||{};
      var txt=(l.text==null?'':String(l.text)).replace(/[\r\n]+/g,' ').replace(/\s+/g,' ');
      if(!txt.length) continue;
      var t=+l.t; if(!isFinite(t)) t=0;
      var chs=null;
      if(l.chars && l.chars.length===txt.length){
        var arr=[];
        for(var j=0;j<l.chars.length;j++){
          var c=l.chars[j]||{};
          var ct=+c.t;
          arr.push({c:c.c==null?'':String(c.c), t:isFinite(ct)?ct:t});
        }
        chs=arr;
      }
      out.push({t:t,dur:+l.dur>0?+l.dur:0,text:txt,chars:chs});
    }
    out.sort(function(a,b){return a.t-b.t});
    S.lines=out;
    S.idx=idxAt(S.t);
    if(!S.dur && out.length){
      var last=out[out.length-1];
      S.dur=last.t+(last.dur||4);
    }
    artistsEl.textContent=S.artist;
    refreshTitle();
    renderLyric();
    updateClock();
  }

  function updateFallback(){
    if(!fallbackEl) return;
    fallbackEl.style.left=hero.x+'px';
    fallbackEl.style.top=hero.y+'px';
    fallbackEl.style.width=hero.w+'px';
    fallbackEl.style.height=hero.h+'px';
    fallbackEl.style.fontSize='';
    var fs=Math.min(hero.h*0.72, hero.w*0.20);
    fallbackEl.style.fontSize=fs.toFixed(1)+'px';
    var i;
    for(i=0;i<8;i++){
      if(fallbackEl.scrollWidth<=hero.w*0.99 && fallbackEl.scrollHeight<=hero.h*1.02) break;
      fs*=0.88;
      if(fs<9) break;
      fallbackEl.style.fontSize=fs.toFixed(1)+'px';
    }
  }

  function refreshTitle(){
    var t=titleText();
    fallbackEl.textContent=t;
    fallbackEl.setAttribute('aria-label',t);
    if(GL.on) buildTitleTexture();
    updateFallback();
  }

  function onTick(p){
    if(!p) return;
    var t=+p.time;
    if(isFinite(t)) S.t=t;
    if(typeof p.playing==='boolean') S.playing=p.playing;
    var i=idxAt(S.t);
    if(i!==S.idx){
      S.idx=i;
      S.beat=Math.max(S.beat,0.55);   // 换句时镭射/波纹闪一下，等同于“落字”
      renderLyric();
    }
  }

  function onBeat(p){
    if(!p) return;
    var l=+p.level;
    if(!isFinite(l)) l=0.8;
    l=Math.max(0,Math.min(1.6,l));
    S.beat=Math.max(S.beat, l>0.02?l:0.7);
    S.sinceBeat=0;
  }

  function onLive(p){
    if(!p) return;
    var lv=+p.level, bs=+p.bass, md=+p.mid, tr=+p.treble, bp=+p.bpm;
    if(isFinite(lv)) S.level=clamp01(lv);
    if(isFinite(bs)) S.bass=clamp01(bs);
    if(isFinite(md)) S.mid=clamp01(md);
    if(isFinite(tr)) S.treble=clamp01(tr);
    if(isFinite(bp)&&bp>0) S.bpm=bp;
    if(typeof p.playing==='boolean' && p.playing===false) S.level=Math.min(S.level,0.18);
  }

  window.addEventListener('message',function(e){
    var d=e.data; if(!d||d.__c100!==1) return;
    if(d.type==='init') onInit(d.payload);
    else if(d.type==='tick') onTick(d.payload);
    else if(d.type==='beat') onBeat(d.payload);
    else if(d.type==='live') onLive(d.payload);
  });

  /* ================= 1 · 纯黑宇宙底（2D canvas） ================= */
  var bg=document.getElementById('bg');
  var bx=bg.getContext('2d',{alpha:false});
  var B={stars:[],grain:null,neb:null,vig:null,band:null,overlay:null};

  function mulberry(seed){
    return function(){
      seed=seed+0x6D2B79F5|0;
      var t=Math.imul(seed^seed>>>15,1|seed);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function safeStop(g,pos,col){
    try{ g.addColorStop(pos,col); }catch(e){}
  }
  function rgbaOf(c,a){
    return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a+')';
  }

  function buildGrain(){
    var n=96, c=document.createElement('canvas');
    c.width=n; c.height=n;
    var g=c.getContext('2d');
    var img=g.createImageData(n,n), d=img.data, rnd=mulberry(8191);
    for(var i=0;i<d.length;i+=4){
      var v=Math.round(rnd()*255);
      d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
    }
    g.putImageData(img,0,0);
    B.grain=bx.createPattern(c,'repeat');
  }

  function bgResize(){
    bg.width=Math.max(2,Math.round(W*dpr));
    bg.height=Math.max(2,Math.round(H*dpr));
    bg.style.width=W+'px'; bg.style.height=H+'px';
    bx.setTransform(dpr,0,0,dpr,0,0);

    var area=W*H, count=Math.round(70+area/9000);
    if(count>420) count=420;
    var rnd=mulberry(20250351);
    B.stars.length=0;
    for(var i=0;i<count;i++){
      B.stars.push({
        x:rnd()*W, y:rnd()*H*0.92, r:rnd()*1.35+0.28,
        a:rnd()*0.55+0.10, ph:rnd()*6.283, sp:0.55+rnd()*1.5, layer:0.25+rnd()*0.9
      });
    }

    var cx=hero.x+hero.w*0.5, cy=hero.y+hero.h*0.46;
    var R=Math.max(W,H)*0.78;
    var g=bx.createRadialGradient(cx,cy,0,cx,cy,R);
    safeStop(g,0,rgbaOf([ACC[0]*0.55+30,ACC[1]*0.55+32,ACC[2]*0.55+40],0.20));
    safeStop(g,0.38,rgbaOf([ACC[0]*0.34,ACC[1]*0.34+6,ACC[2]*0.36+12],0.10));
    safeStop(g,1,'rgba(0,0,0,0)');
    B.neb=g;

    var v=bx.createRadialGradient(W*0.5,H*0.48,Math.min(W,H)*0.18,W*0.5,H*0.48,Math.max(W,H)*0.80);
    safeStop(v,0,'rgba(0,0,0,0)');
    safeStop(v,0.62,'rgba(0,0,0,0.30)');
    safeStop(v,1,'rgba(0,0,0,0.86)');
    B.vig=v;

    var by=hero.y+hero.h*0.94, bh=H*0.16;
    var bd=bx.createLinearGradient(0,by,0,by+bh);
    safeStop(bd,0,rgbaOf([ACC[0]*0.8+40,ACC[1]*0.8+40,ACC[2]*0.8+46],0.10));
    safeStop(bd,0.42,rgbaOf([ACC[0]*0.6+20,ACC[1]*0.6+22,ACC[2]*0.6+30],0.045));
    safeStop(bd,1,'rgba(0,0,0,0)');
    B.band=bd;

    /* 颗粒 + 暗角预烘成一张图，每帧只 blit 一次 */
    var oc=document.createElement('canvas');
    oc.width=Math.max(2,Math.round(W)); oc.height=Math.max(2,Math.round(H));
    var og=oc.getContext('2d');
    if(og){
      if(B.grain){
        og.globalAlpha=0.05;
        og.fillStyle=B.grain;
        og.fillRect(0,0,W,H);
        og.globalAlpha=1;
      }
      og.fillStyle=B.vig;
      og.fillRect(0,0,W,H);
      B.overlay=oc;
    }else B.overlay=null;
  }

  function drawBg(){
    var t=S.t, en=S.energy;
    bx.globalCompositeOperation='source-over';
    bx.globalAlpha=1;
    bx.fillStyle='#010103';
    bx.fillRect(0,0,W,H);

    bx.globalCompositeOperation='lighter';
    bx.globalAlpha=0.55+0.45*en;
    bx.fillStyle=B.neb;
    bx.fillRect(0,0,W,H);

    var i, st, n=B.stars.length;
    for(i=0;i<n;i++){
      st=B.stars[i];
      var tw=0.55+0.45*Math.sin(t*st.sp+st.ph);
      var a=st.a*tw*(0.75+en*0.8);
      if(a<=0.01) continue;
      var x=st.x, y=st.y-((t*(3.2*st.layer))%H);
      if(y<0) y+=H;
      bx.fillStyle='rgba(212,232,255,'+(a>1?1:a).toFixed(3)+')';
      bx.fillRect(x,y,st.r,st.r);
    }

    bx.fillStyle=B.band;
    bx.fillRect(0,hero.y+hero.h*0.94,W,H*0.16);

    bx.globalCompositeOperation='source-over';
    bx.globalAlpha=1;
    if(B.overlay){
      bx.drawImage(B.overlay,0,0,W,H);
    }else{
      bx.fillStyle=B.vig;
      bx.fillRect(0,0,W,H);
    }
  }

  /* ================= 2 · 液态镀铬字标（WebGL） ================= */
  var GL={on:false,gl:null,prog:null,tex:null,buf:null,u:{},quad:[],cvs:null,
          texW:1,texH:1,rectW:1,rectH:1,kx:1,ky:1,ok:false};

  var VS = [
    'attribute vec2 aPos;',
    'void main(){ gl_Position=vec4(aPos,0.0,1.0); }'
  ].join('\n');

  var FS = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH',
    'precision highp float;',
    '#else',
    'precision mediump float;',
    '#endif',
    'uniform sampler2D uTex;',
    'uniform vec2 uUvK;',
    'uniform vec2 uPx;',
    'uniform vec4 uRect;',
    'uniform float uTime;',
    'uniform float uBeat;',
    'uniform float uBass;',
    'uniform float uTreble;',
    'uniform float uRm;',
    'uniform vec3 uNeonA;',
    'uniform vec3 uNeonB;',
    '',
    'float msk(vec2 uv){',
    '  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) return 0.0;',
    '  return texture2D(uTex, vec2(uv.x,1.0-uv.y)*uUvK).a;',
    '}',
    '',
    'vec3 envMap(vec2 p){',
    '  float y=clamp(p.y,-1.35,1.35);',
    '  vec3 c=vec3(0.150,0.170,0.205);',
    '  c+=vec3(0.30,0.34,0.40)*smoothstep(-0.30,0.92,y);',
    '  c*=mix(0.34,1.0,smoothstep(-1.05,-0.06,y));',
    '  c+=vec3(1.00,0.99,0.96)*exp(-pow((y-0.300)*5.5,2.0))*1.10;',
    '  c+=vec3(0.72,0.86,1.00)*exp(-pow((y+0.450)*5.5,2.0))*0.70;',
    '  c+=uNeonA*exp(-pow((y-0.680)*9.0,2.0))*0.80;',
    '  c+=uNeonB*exp(-pow((y+0.780)*7.5,2.0))*0.55;',
    '  float bars=0.5+0.5*sin(p.x*6.0+uTime*0.16);',
    '  c+=vec3(0.30,0.42,0.60)*pow(bars,9.0)*smoothstep(-0.55,0.85,y)*0.55;',
    '  return c;',
    '}',
    '',
    'void main(){',
    '  vec2 uv=(gl_FragCoord.xy-uRect.xy)/uRect.zw;',
    '  if(uv.x<-0.06||uv.x>1.06||uv.y<-0.06||uv.y>1.06) discard;',
    '  float wob=0.0024*(0.55+uBeat*1.5)*(1.0-uRm*0.88);',
    '  vec2 wuv=uv+wob*vec2(sin(uv.y*13.0+uTime*1.65),sin(uv.x*11.0-uTime*1.25));',
    '  vec2 p1=uPx*1.7, p2=uPx*5.5, p3=uPx*13.0;',
    '  float m0=msk(wuv);',
    '  float mx1=msk(wuv+vec2(p3.x,0.0)), mx0=msk(wuv-vec2(p3.x,0.0));',
    '  float my1=msk(wuv+vec2(0.0,p3.y)), my0=msk(wuv-vec2(0.0,p3.y));',
    '  float hal=(mx1+mx0+my1+my0)*0.25;',
    '  if(m0<0.002 && hal<0.004) discard;',
    '  float h=(msk(wuv+vec2(-p1.x,-p1.y))+msk(wuv+vec2(0.0,-p1.y))+msk(wuv+vec2(p1.x,-p1.y))',
    '          +msk(wuv+vec2(-p1.x,0.0))+m0+msk(wuv+vec2(p1.x,0.0))',
    '          +msk(wuv+vec2(-p1.x,p1.y))+msk(wuv+vec2(0.0,p1.y))+msk(wuv+vec2(p1.x,p1.y)))/9.0;',
    '  float gx=msk(wuv+vec2(p2.x,0.0))-msk(wuv-vec2(p2.x,0.0));',
    '  float gy=msk(wuv+vec2(0.0,p2.y))-msk(wuv-vec2(0.0,p2.y));',
    '  float gwx=mx1-mx0, gwy=my1-my0;',
    '  vec3 N=normalize(vec3(-(gx*2.1+gwx*1.55),-(gy*2.1+gwy*1.55),1.0));',
    '  vec3 V=vec3(0.0,0.0,1.0);',
    '  vec3 R=reflect(-V,N);',
    '  vec2 rp=R.xy*(1.0+0.30*(1.0-R.z));',
    '  float fl=(0.085+0.045*sin(uTime*0.7))*(1.0-uRm*0.88);',
    '  vec2 rq=rp+fl*vec2(sin(uv.y*9.0+uTime*1.10)+0.55*sin(uv.y*23.0-uTime*0.70),',
    '                     cos(uv.x*7.5-uTime*0.90)+0.50*cos(uv.x*19.0+uTime*0.50));',
    '  float disp=0.010+0.018*uBeat;',
    '  vec3 col=vec3(envMap(rq*(1.0+disp)).r, envMap(rq).g, envMap(rq*(1.0-disp)).b);',
    '  vec3 L=normalize(vec3(-0.42,0.60,0.68));',
    '  float sp=pow(max(dot(R,L),0.0),110.0);',
    '  col+=vec3(1.0,0.98,1.0)*sp*1.9*(1.0+uBeat*1.1);',
    '  vec2 d=rq-L.xy;',
    '  float st1=exp(-abs(d.y)*130.0)*exp(-abs(d.x)*6.0);',
    '  float st2=exp(-abs(d.x)*130.0)*exp(-abs(d.y)*8.0);',
    '  col+=vec3(0.86,0.94,1.0)*(st1*1.15+st2*0.32)*(1.0+uBeat*0.9);',
    '  vec2 d2=rq-vec2(0.40,-0.34);',
    '  float st3=exp(-abs(d2.y)*150.0)*exp(-abs(d2.x)*9.0);',
    '  col+=mix(uNeonA,uNeonB,0.55)*(st3*0.95)*(1.0+uBeat*1.3);',
    '  float fres=pow(1.0-clamp(dot(N,V),0.0,1.0),2.6);',
    '  col+=mix(uNeonA,uNeonB,0.45)*fres*1.40;',
    '  float body=smoothstep(0.18,0.88,h);',
    '  col*=mix(0.70,1.0,body);',
    '  col*=mix(1.0,mix(0.76,1.12,smoothstep(0.08,0.98,uv.y)),body);',
    '  col+=mix(uNeonA,uNeonB,0.30)*hal*(1.1+uBass*1.1);',
    '  float a=clamp(max(smoothstep(0.10,0.52,h)*1.02, hal*0.62),0.0,1.0);',
    '  gl_FragColor=vec4(clamp(col,0.0,1.6),a);',
    '}'
  ].join('\n');

  function compile(gl,type,src){
    var s=gl.createShader(type);
    gl.shaderSource(s,src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      gl.deleteShader(s); return null;
    }
    return s;
  }

  function glInit(){
    if(GL.tried) return;
    GL.tried=true;
    GL.cvs=document.getElementById('gl');
    var gl=null;
    try{
      gl=GL.cvs.getContext('webgl',{alpha:true,antialias:false,depth:false,stencil:false,
        premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
    }catch(e){ gl=null; }
    if(!gl){ showFallback(); return; }
    var vs=compile(gl,gl.VERTEX_SHADER,VS), fs=compile(gl,gl.FRAGMENT_SHADER,FS);
    if(!vs||!fs){ showFallback(); return; }
    var p=gl.createProgram();
    gl.attachShader(p,vs); gl.attachShader(p,fs);
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)){ showFallback(); return; }
    gl.useProgram(p);
    GL.gl=gl; GL.prog=p;
    var names=['uTex','uUvK','uPx','uRect','uTime','uBeat','uBass','uTreble','uRm','uNeonA','uNeonB'];
    for(var i=0;i<names.length;i++) GL.u[names[i]]=gl.getUniformLocation(p,names[i]);
    GL.buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,GL.buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(8),gl.DYNAMIC_DRAW);
    var loc=gl.getAttribLocation(p,'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    try{
      GL.tex=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,GL.tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    }catch(e){ showFallback(); return; }
    GL.on=true;
    glResize();
  }

  function showFallback(){
    GL.on=false;
    fallbackEl.style.display='block';
  }

  function glResize(){
    if(!GL.on) return;
    var c=GL.cvs;
    c.width=Math.max(2,Math.round(W*dpr));
    c.height=Math.max(2,Math.round(H*dpr));
    c.style.width=W+'px'; c.style.height=H+'px';
    GL.gl.viewport(0,0,c.width,c.height);
    buildTitleTexture();
    GL.quad=buildQuad();
  }

  function buildQuad(){
    var cw=GL.cvs.width, ch=GL.cvs.height;
    var pad=26*dpr;
    var x0=hero.x*dpr-pad, y0=(H-hero.y-hero.h)*dpr-pad;
    var x1=(hero.x+hero.w)*dpr+pad, y1=(H-hero.y)*dpr+pad;
    var ax=Math.max(0,Math.min(cw,x0)), ay=Math.max(0,Math.min(ch,y0));
    var bx2=Math.max(0,Math.min(cw,x1)), by2=Math.max(0,Math.min(ch,y1));
    var cx=(ax/cw)*2-1, cy=(ay/ch)*2-1, dx=(bx2/cw)*2-1, dy=(by2/ch)*2-1;
    var arr=new Float32Array([cx,cy, dx,cy, cx,dy, dx,dy]);
    var gl=GL.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER,GL.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,arr);
    return arr;
  }

  /* --- 标题排版 --- */
  var titleMC=document.createElement('canvas').getContext('2d');
  function titleFont(sz){ return '900 italic '+sz.toFixed(1)+'px "Arial Black","Segoe UI Black",Impact,"Helvetica Neue",Arial,sans-serif'; }
  function setFont(ctx,sz){
    ctx.font=titleFont(sz);
    try{ ctx.letterSpacing='-0.018em'; }catch(e){}
  }
  function titleText(){ return (S.name||S.artist||'untitled').slice(0,120); }

  function wrapTitle(text, budgetProbe, probe, mc){
    var out=[], cur='', i, ch, test;
    var chars=text.split('');
    for(i=0;i<chars.length;i++){
      ch=chars[i];
      if(ch==='\n'){ out.push(cur); cur=''; continue; }
      test=cur+ch;
      if(cur && mc.measureText(test).width>budgetProbe){
        var sp=cur.lastIndexOf(' ');
        if(sp>cur.length*0.45 && /[A-Za-z0-9\u00C0-\u024F]/.test(ch)){
          out.push(cur.slice(0,sp).replace(/\s+$/,''));
          cur=cur.slice(sp+1)+ch;
        }else{
          out.push(cur); cur=ch;
        }
      }else cur=test;
    }
    if(cur) out.push(cur);
    return out.length?out:[''];
  }

  function fitTitle(text, maxW, maxH, maxLines){
    var probe=120, mc=titleMC, wmax=1, it;
    setFont(mc,probe);
    var size=Math.max(8, Math.min(maxH/1.06, Math.max(8,maxW)));
    var lines=[''];
    for(it=0; it<8; it++){
      var budget=Math.max(40, maxW*probe/Math.max(8,size));
      lines=wrapTitle(text, budget, probe, mc);
      wmax=1;
      for(var i=0;i<lines.length;i++) wmax=Math.max(wmax, mc.measureText(lines[i]).width);
      var needW=wmax*size/probe, needH=lines.length*1.06*size;
      var over=Math.max(needW/maxW, needH/maxH);
      if(over<=1.001) break;
      if(lines.length>maxLines){
        size*=0.82;
      }else if(over>1){
        size*=1/over*0.985;
      }
      if(!isFinite(size)||size<6){ size=6; break; }
    }
    wmax=1;
    for(var j=0;j<lines.length;j++) wmax=Math.max(wmax, mc.measureText(lines[j]).width);
    var sFinal=Math.min(size, maxW*probe/Math.max(1,wmax), maxH/(Math.max(1,lines.length)*1.06));
    if(!isFinite(sFinal)||sFinal<4) sFinal=4;
    return {lines:lines, size:sFinal};
  }

  function buildTitleTexture(){
    if(!GL.on||!GL.gl) return;
    var gl=GL.gl;
    var maxTex=gl.getParameter(gl.MAX_TEXTURE_SIZE)||2048;
    maxTex=Math.min(maxTex,2600);
    var cw=Math.max(8,Math.min(maxTex,Math.round(hero.w*dpr)));
    var ch=Math.max(8,Math.min(maxTex,Math.round(hero.h*dpr)));
    if(!isFinite(cw)||cw<8) cw=8;
    if(!isFinite(ch)||ch<8) ch=8;
    if(!GL.cvs) return;
    var cv=document.createElement('canvas');
    cv.width=cw; cv.height=ch;
    var ctx=cv.getContext('2d');
    if(!ctx) return;
    ctx.clearRect(0,0,cw,ch);
    var fit=fitTitle(titleText(), cw*0.94, ch*0.96, portrait?3:2);
    var size=fit.size, lines=fit.lines, n=lines.length;
    setFont(ctx,size);
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle='#ffffff';
    var lh=size*1.06;
    var cx=cw/2, cy0=ch/2-(n-1)*lh/2;
    for(var i=0;i<n;i++){
      ctx.fillText(lines[i], cx, cy0+i*lh);
    }
    gl.bindTexture(gl.TEXTURE_2D,GL.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
    GL.texW=cw; GL.texH=ch;
    GL.rectW=Math.max(1,hero.w*dpr);
    GL.rectH=Math.max(1,hero.h*dpr);
    GL.kx=cw/GL.rectW; GL.ky=ch/GL.rectH;
    GL.titleLines=lines;
  }

  function drawTitle(){
    if(!GL.on) return;
    var gl=GL.gl;
    gl.viewport(0,0,GL.cvs.width,GL.cvs.height);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if(!GL.tex){ return; }
    var rx=hero.x*dpr, ry=(H-hero.y-hero.h)*dpr;
    var rw=Math.max(1,hero.w*dpr), rh=Math.max(1,hero.h*dpr);
    gl.useProgram(GL.prog);
    gl.uniform1i(GL.u.uTex,0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,GL.tex);
    gl.uniform2f(GL.u.uUvK,GL.kx,GL.ky);
    gl.uniform2f(GL.u.uPx,1/rw,1/rh);
    gl.uniform4f(GL.u.uRect,rx,ry,rw,rh);
    gl.uniform1f(GL.u.uTime,S.anim);
    gl.uniform1f(GL.u.uBeat,S.beat);
    gl.uniform1f(GL.u.uBass,S.bass);
    gl.uniform1f(GL.u.uTreble,S.treble);
    gl.uniform1f(GL.u.uRm,S.rm?1:0);
    gl.uniform3f(GL.u.uNeonA,NEON_A[0],NEON_A[1],NEON_A[2]);
    gl.uniform3f(GL.u.uNeonB,NEON_B[0],NEON_B[1],NEON_B[2]);
    gl.bindBuffer(gl.ARRAY_BUFFER,GL.buf);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  /* ================= 5 · 主循环 ================= */
  var lastNow=0;
  function frame(now){
    if(typeof now!=='number'||!isFinite(now)) now=performance.now();
    var dt = lastNow ? (now-lastNow)/1000 : 0.016;
    if(!isFinite(dt)||dt<0) dt=0.016;
    if(dt>0.10) dt=0.10;
    lastNow=now;
    S.wall += dt;

    S.frames++;
    if(!started){ started=true; sendReady(); }

    var t0=performance.now();
    S.beat *= Math.exp(-dt*4.2);
    S.sinceBeat += dt;
    S.anim += dt*(S.playing?1:0.28);
    var target = 0.18 + S.level*0.55 + S.beat*0.9;
    S.energy += (target-S.energy)*Math.min(1,dt*6);
    pulseDeck();

    drawBg();
    drawTitle();
    updateLyricLive();
    if(S.frames%6===0) updateClock();

    S.js = performance.now()-t0;
    requestAnimationFrame(frame);
  }

  function updateClock(){
    var d=S.dur||0, p=d>0?clamp01(S.t/d):0;
    progEl.style.width=(p*100).toFixed(2)+'%';
    headEl.style.left=(p*100).toFixed(2)+'%';
    var a=fmtTime(S.t), b=fmtTime(d);
    if(tcEl.textContent!==a) tcEl.textContent=a;
    if(tdEl.textContent!==b) tdEl.textContent=b;
  }

  function pulseDeck(){
    if(S.frames%2) return;
    var k=S.rm?0.30:1;
    var y=(-1.4*S.energy-S.beat*3.2)*k;
    deckEl.style.transform='translate3d(0,'+y.toFixed(1)+'px,0)';
  }

  function boot(){
    computeHero();
    dpr=Math.min(2,Math.max(1,window.devicePixelRatio||1));
    if(!isFinite(dpr)||dpr<=0) dpr=1;
    buildGrain();
    bgResize();
    if(GL.on) glResize(); else glInit();
    updateClock();
  }

  var rzTimer=0;
  function onResize(){
    if(rzTimer) clearTimeout(rzTimer);
    rzTimer=setTimeout(function(){ rzTimer=0; boot(); }, 90);
  }
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',onResize);

  boot();
  requestAnimationFrame(frame);
  setTimeout(sendReady,260);

  window.__stage=function(){ return {
    lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing, frames:S.frames,
    js:S.js, err:'', text:(S.idx>=0&&S.lines[S.idx])?S.lines[S.idx].text:'', gl:!!GL.on, rm:S.rm }; };
})();
</script>
