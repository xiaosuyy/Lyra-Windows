<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>鹿角绣林 · 433</title>
<style>
  :root{
    --cream:#f3e6c8; --cream-dim:#c6ab7d; --gold:#d8a94e;
    --wine:#4a1424; --teal:#0c3733;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#08201e; }
  body{
    font-family: Georgia, "Times New Roman", "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #cv{ position:fixed; inset:0; display:block; width:100%; height:100%; }
  #lyr{
    position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center;
    padding:0 0 8.2vh; pointer-events:none;
  }
  #band{
    position:relative; width:min(76vw, 880px);
    padding:2.5vh 3.2vw 2.1vh; text-align:center;
    background:linear-gradient(180deg, rgba(74,20,36,.90), rgba(26,8,15,.95));
    border-top:2px dashed rgba(216,169,78,.66);
    border-bottom:2px dashed rgba(216,169,78,.66);
    box-shadow:0 16px 50px rgba(0,0,0,.46), inset 0 0 70px rgba(0,0,0,.38);
  }
  #band::before, #band::after{
    content:""; position:absolute; left:7px; right:7px; height:4px; pointer-events:none;
    background:repeating-linear-gradient(90deg, rgba(243,230,200,.22) 0 1px, transparent 1px 9px);
  }
  #band::before{ top:-8px; }
  #band::after{ bottom:-8px; }
  #prev, #next{
    color:var(--cream-dim); opacity:.42; font-size:clamp(10px, 1.45vmin, 18px);
    line-height:1.55; height:1.6em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    letter-spacing:.03em;
  }
  #cur{
    margin:1vh auto .7vh; color:var(--cream);
    font-size:clamp(20px, 3.25vmin, 40px); line-height:1.42; letter-spacing:.04em;
    word-break:break-word; overflow-wrap:anywhere;
  }
  #cur.long{ font-size:clamp(15px, 2.45vmin, 30px); letter-spacing:.015em; line-height:1.5; }
  #cur .ch{ color:rgba(243,230,200,.46); }
  #cur .ch.on{ color:#fff8e6; text-shadow:0 0 16px rgba(255,224,150,.32); }
  #sewWrap{ width:min(42%, 300px); margin:0 auto; padding-top:8px; }
  #sew{
    height:3px; width:0%;
    background:repeating-linear-gradient(90deg, var(--gold) 0 7px, transparent 7px 12px);
    opacity:.86;
  }
  #empty{
    display:none; color:#c6ab7d; font-size:clamp(12px, 1.8vmin, 19px);
    letter-spacing:.28em; padding:1.5vh 0 .7vh;
  }
  #band.empty #prev, #band.empty #next, #band.empty #cur, #band.empty #sewWrap{ display:none; }
  #band.empty #empty{ display:block; }
  #tag{
    position:fixed; left:3.2vw; top:3.2vh; max-width:38vw;
    color:rgba(243,230,200,.42); font-size:clamp(9px, 1.15vmin, 14px);
    letter-spacing:.16em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none;
  }
  @media (max-aspect-ratio: 3/4){
    #lyr{ padding:0 0 12vh; }
    #band{ width:90vw; padding:2.2vh 4.6vw 2vh; }
    #cur{ font-size:clamp(19px, 5.3vmin, 34px); }
    #cur.long{ font-size:clamp(15px, 4.1vmin, 26px); }
    #tag{ max-width:60vw; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tag"></div>
<div id="lyr">
  <div id="band">
    <div id="prev"></div>
    <div id="cur"></div>
    <div id="next"></div>
    <div id="sewWrap"><div id="sew"></div></div>
    <div id="empty">挂毯上还没有绣下歌词</div>
  </div>
</div>
<script>
/* 433 · 鹿角绣林 — 中世纪千花挂毯 / 怪奇民谣 */
var cv = document.getElementById('cv');
var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
var elBand = document.getElementById('band');
var elPrev = document.getElementById('prev');
var elNext = document.getElementById('next');
var elCur  = document.getElementById('cur');
var elSew  = document.getElementById('sew');
var elTag  = document.getElementById('tag');

var view = { w: 1440, h: 900, dpr: 1, s: 1, k: 1, por: false };
var T = {
  lines: [], idx: -1, t: 0, playing: true,
  frames: 0, js: 0, err: '', text: '', gl: false, rm: false,
  accent: [214, 169, 78], songName: '',
  gold: '#d8a94e', goldSoft: 'rgba(216,169,78,.6)',
  live: { level: 0, bass: 0, mid: 0, treble: 0, bpm: 0, playing: true },
  beatFlash: 0, beatCount: 0, dur: 0,
  readySent: false, tickPerf: 0
};
var bgc = null, bctx = null;
var seedRnd = mulberry32(43377);
var flora = [], motes = [], stars = [], birds = [];
var vign = null, oculus = { x: 0, y: 0, r: 0 };
var curLine = null, curChars = null, curSpans = [], curRects = [], curOn = -1, curHasSpans = false;
var bandRect = { x: 0, y: 0, w: 0, h: 0 };

/* ---------- 自检口：脚本最外层、无条件赋值 ---------- */
window.__stage = function(){
  return {
    lines: T.lines.length,
    idx: T.idx,
    t: T.t,
    playing: !!T.playing,
    frames: T.frames,
    js: T.js,
    err: T.err,
    text: T.text || '',
    gl: false,
    rm: T.rm
  };
};

/* ---------- 工具 ---------- */
function nz(v, d){ v = +v; return (isFinite(v) && v > 0) ? v : d; }
function nAny(v, d){ v = +v; return isFinite(v) ? v : d; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
try { T.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
catch (e) { T.rm = false; }

function sendReady(){
  if (T.readySent) return;
  T.readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error('[433] ready post failed', e); }
}

/* ---------- 尺寸 ---------- */
function measure(){
  var w = nz(window.innerWidth, 1440);
  var h = nz(window.innerHeight, 900);
  var dpr = clamp(nz(window.devicePixelRatio, 1), 1, 2);
  view.w = w; view.h = h; view.dpr = dpr;
  view.s = Math.min(w / 1440, h / 900);
  view.k = clamp(Math.min(w, h) / 900, 0.52, 1.7);
  view.por = h > w * 1.12;
  if (cv){
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(h * dpr));
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
  }
  if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildVignette(w, h);
}
function buildVignette(w, h){
  vign = null;
  if (!ctx) return;
  try {
    var g = ctx.createRadialGradient(w * 0.5, h * 0.52, Math.min(w, h) * 0.24,
                                     w * 0.5, h * 0.52, Math.max(w, h) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.72, 'rgba(3,14,13,.20)');
    g.addColorStop(1, 'rgba(2,10,9,.62)');
    vign = g;
  } catch (e){ console.error('[433] vignette failed', e); }
}
var resizeTimer = 0, lastW = 0, lastH = 0;
function resize(){
  try {
    measure();
    paintStatic();
    buildDynamic();
    relayoutLyrics();
    lastW = view.w; lastH = view.h;
  } catch (e){ console.error('[433] resize failed', e); }
}
function onResize(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ resizeTimer = 0; resize(); }, 170);
}

/* ---------- 纹理小工具（手绣感的断线） ---------- */
function stitchLine(g, x1, y1, x2, y2, dash, gap, lw, col, alpha){
  g.save();
  g.globalAlpha = alpha == null ? 1 : alpha;
  g.strokeStyle = col; g.lineWidth = lw || 1.4; g.lineCap = 'round';
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (!isFinite(len) || len < 0.5) { g.restore(); return; }
  var ux = dx / len, uy = dy / len;
  var step = (dash || 5) + (gap || 4);
  var n = Math.min(220, Math.floor(len / step));
  g.beginPath();
  for (var i = 0; i < n; i++){
    var a = i * step, b = Math.min(a + (dash || 5), len);
    g.moveTo(x1 + ux * a, y1 + uy * a);
    g.lineTo(x1 + ux * b, y1 + uy * b);
  }
  g.stroke();
  g.restore();
}

/* ---------- 静态底子：绒布 + 织纹 + 花海 + 独角兽 + 狐狸 ---------- */
var PAL = ['#f3e6c8', '#c96a5a', '#d8a94e', '#7f9b6a', '#8a5a86', '#4f8c80', '#e8c98a'];
function pick(rng, arr){ return arr[Math.min(arr.length - 1, Math.floor(rng() * arr.length))]; }

function motif(g, kind, x, y, r, col, rng){
  g.save();
  g.translate(x, y);
  g.strokeStyle = col; g.fillStyle = col;
  g.lineWidth = Math.max(0.9, r * 0.11);
  g.lineCap = 'round'; g.lineJoin = 'round';
  var i, a, px, py;
  if (kind === 0){ /* 蕨卷 */
    g.beginPath();
    g.moveTo(0, r * 1.05);
    g.quadraticCurveTo(r * 0.42, r * 0.2, 0, -r * 0.62);
    g.stroke();
    for (i = 1; i <= 4; i++){
      var t = i / 5;
      py = r * 1.05 - t * r * 1.7;
      px = Math.sin(t * 2.1) * r * 0.20;
      var rr = r * (0.42 - t * 0.26);
      var dir = (i % 2 === 0) ? 1 : -1;
      g.beginPath();
      g.arc(px + dir * rr * 0.9, py, rr, dir > 0 ? -0.5 : Math.PI - 0.6, dir > 0 ? 2.4 : 3.9);
      g.stroke();
    }
  } else if (kind === 1){ /* 雏菊 */
    var pet = 7;
    for (i = 0; i < pet; i++){
      a = (i / pet) * Math.PI * 2 + rng() * 0.12;
      g.save(); g.rotate(a);
      g.beginPath(); g.ellipse(0, -r * 0.62, r * 0.20, r * 0.40, 0, 0, Math.PI * 2);
      g.stroke(); g.restore();
    }
    g.beginPath(); g.arc(0, 0, r * 0.18, 0, Math.PI * 2); g.fill();
  } else if (kind === 2){ /* 五瓣小花 */
    for (i = 0; i < 5; i++){
      a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      g.beginPath();
      g.arc(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.26, 0, Math.PI * 2);
      g.fill();
    }
    g.beginPath(); g.arc(0, 0, r * 0.16, 0, Math.PI * 2); g.fill();
  } else if (kind === 3){ /* 双叶 */
    g.beginPath(); g.moveTo(0, r); g.quadraticCurveTo(r * 0.1, 0, 0, -r); g.stroke();
    for (i = 0; i < 2; i++){
      g.save();
      g.scale(i ? -1 : 1, 1);
      g.beginPath();
      g.moveTo(0, -r * 0.1);
      g.quadraticCurveTo(r * 0.9, -r * 0.5, 0, -r * 0.85);
      g.quadraticCurveTo(-r * 0.72, -r * 0.5, 0, -r * 0.1);
      g.stroke(); g.restore();
    }
  } else if (kind === 4){ /* 十字绣星 */
    var q = r * 0.30;
    g.beginPath();
    g.rect(-q, -r, q * 2, r * 2);
    g.rect(-r, -q, r * 2, q * 2);
    g.stroke();
    g.beginPath(); g.arc(0, 0, q * 0.5, 0, Math.PI * 2); g.fill();
  } else if (kind === 5){ /* 小浆果/草莓 */
    g.beginPath();
    g.moveTo(0, r * 0.95);
    g.bezierCurveTo(-r * 0.95, r * 0.10, -r * 0.60, -r * 0.80, 0, -r * 0.55);
    g.bezierCurveTo(r * 0.60, -r * 0.80, r * 0.95, r * 0.10, 0, r * 0.95);
    g.stroke();
    for (i = 0; i < 4; i++){
      g.beginPath();
      g.arc((rng() - 0.5) * r * 0.7, (rng() - 0.4) * r * 0.8, r * 0.055, 0, Math.PI * 2);
      g.fill();
    }
  } else { /* 花园结 */
    var s2 = r * 0.16;
    for (i = 0; i < 3; i++) for (var j = 0; j < 3; j++){
      g.beginPath();
      g.arc((i - 1) * s2 * 2.1, (j - 1) * s2 * 2.1, s2 * 0.62, 0, Math.PI * 2);
      g.fill();
    }
  }
  g.restore();
}

function drawLattice(g, w, h){
  /* 像挂毯底布的素色藤蔓暗纹：只比底色亮一点点 */
  var rng = mulberry32(31313);
  g.save();
  g.globalAlpha = 0.16;
  g.strokeStyle = '#7fb6a5';
  g.lineWidth = Math.max(0.8, view.k * 0.9);
  var i, x, y, k;
  var cols = Math.min(26, Math.max(8, Math.round(w / 64)));
  for (i = 0; i < cols; i++){
    x = (i + 0.5) * (w / cols);
    y = h * 0.22;
    for (k = 0; k < 9; k++){
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + (i % 2 ? 1 : -1) * w * 0.012, y + h * 0.035,
                         x, y + h * 0.075);
      g.stroke();
      y += h * 0.075;
      if (y > h * 0.98) break;
    }
  }
  /* 稀疏的刺绣虚线格 */
  g.globalAlpha = 0.10;
  g.strokeStyle = '#d8a94e';
  var rows = Math.min(16, Math.max(5, Math.round(h / 90)));
  for (i = 0; i < rows; i++){
    var yy = h * (0.24 + 0.74 * (i / Math.max(1, rows - 1)));
    g.setLineDash([3 * view.k, 9 * view.k]);
    g.beginPath(); g.moveTo(w * 0.04, yy); g.lineTo(w * 0.96, yy); g.stroke();
  }
  g.setLineDash([]);
  g.restore();
}

function drawFloraField(g, w, h, rng){
  var rows = [0.255, 0.312, 0.369, 0.426, 0.483, 0.540, 0.597, 0.654, 0.711,
              0.765, 0.816, 0.864, 0.908, 0.950, 0.982];
  var tx0 = w * 0.13, tx1 = w * 0.87;
  var ty0 = h * (view.por ? 0.58 : 0.615), ty1 = h * 0.995;
  var i, r, drew = 0;
  for (i = 0; i < rows.length; i++){
    var y = h * rows[i];
    var x = -w * 0.03 + rng() * w * 0.05;
    var guard = 0;
    while (x < w * 1.04 && guard++ < 220){
      var r0 = (6.5 + rng() * 13.5) * view.k * (0.66 + 0.50 * (y / h));
      var inText = (x > tx0 && x < tx1 && y > ty0 && y < ty1);
      if (!inText && drew < 420){
        var kind = Math.floor(rng() * 7);
        var alpha = 0.28 + rng() * 0.30;
        g.globalAlpha = alpha;
        motif(g, kind, x, y + (rng() - 0.5) * h * 0.016, r0, pick(rng, PAL), rng);
        drew++;
        if (rng() < 0.20){
          g.globalAlpha = alpha * 0.62;
          motif(g, (kind + 3) % 7, x + r0 * 1.45, y - r0 * 0.85, r0 * 0.52, pick(rng, PAL), rng);
          drew++;
        }
      }
      x += r0 * (1.55 + rng() * 1.9) + w * 0.003;
    }
  }
  g.globalAlpha = 1;
  /* 稀疏散点 */
  for (i = 0; i < 110; i++){
    g.globalAlpha = 0.09 + rng() * 0.20;
    g.fillStyle = pick(rng, PAL);
    g.beginPath();
    g.arc(rng() * w, rng() * h, (0.6 + rng() * 1.4) * view.k, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
}

function drawUnicorn(g, x, y, sc, flip){
  g.save();
  g.translate(x, y); g.scale(flip ? -sc : sc, sc);
  var body = '#12100f';
  g.lineJoin = 'round'; g.lineCap = 'round';
  /* 影 */
  g.globalAlpha = 0.45; g.fillStyle = '#05100f';
  g.beginPath(); g.ellipse(0, 46, 40, 6, 0, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  /* 腿 */
  g.fillStyle = body;
  var lx = [-20, -8, 14, 26];
  for (var i = 0; i < 4; i++){
    g.beginPath();
    g.moveTo(lx[i] - 4.5, 8);
    g.quadraticCurveTo(lx[i] - 3, 30, lx[i] - 2, 44);
    g.lineTo(lx[i] + 4, 44);
    g.quadraticCurveTo(lx[i] + 4.5, 24, lx[i] + 5, 8);
    g.closePath(); g.fill();
  }
  /* 尾 */
  g.strokeStyle = body; g.lineWidth = 7;
  g.beginPath();
  g.moveTo(-33, -6);
  g.bezierCurveTo(-52, -2, -50, 22, -40, 30);
  g.stroke();
  g.strokeStyle = '#d8a94e'; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(-36, 0); g.bezierCurveTo(-48, 6, -46, 20, -40, 26); g.stroke();
  /* 躯干 */
  g.fillStyle = body;
  g.beginPath(); g.ellipse(0, 0, 36, 21, 0, 0, Math.PI * 2); g.fill();
  /* 颈 + 头 */
  g.beginPath();
  g.moveTo(22, -6);
  g.quadraticCurveTo(38, -22, 44, -44);
  g.lineTo(56, -40);
  g.quadraticCurveTo(48, -16, 34, 4);
  g.closePath(); g.fill();
  g.beginPath(); g.ellipse(52, -48, 12, 7, -0.45, 0, Math.PI * 2); g.fill();
  /* 耳 */
  g.beginPath(); g.moveTo(48, -56); g.lineTo(52, -66); g.lineTo(55, -54); g.closePath(); g.fill();
  /* 角 */
  g.strokeStyle = '#e2b757'; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(56, -56); g.quadraticCurveTo(62, -72, 70, -84); g.stroke();
  g.strokeStyle = '#f3e6c8'; g.lineWidth = 1.1;
  for (i = 0; i < 5; i++){
    var t = i / 5;
    g.beginPath();
    g.moveTo(56 + t * 13, -56 - t * 27);
    g.lineTo(60 + t * 13, -59 - t * 27);
    g.stroke();
  }
  /* 鬃毛 */
  g.strokeStyle = '#c96a5a'; g.lineWidth = 2.6;
  for (i = 0; i < 5; i++){
    var ty = -12 - i * 8;
    g.beginPath();
    g.moveTo(34 + i * 1.6, ty);
    g.quadraticCurveTo(24 + i * 1.2, ty + 2, 17 + i * 1.1, ty + 12);
    g.stroke();
  }
  /* 鞍毯刺绣 */
  g.save();
  g.translate(-2, -13); g.rotate(-0.06);
  g.fillStyle = '#5e1b30';
  g.beginPath(); g.rect(-20, -8, 34, 17); g.fill();
  g.strokeStyle = '#d8a94e'; g.lineWidth = 1.4;
  g.strokeRect(-20, -8, 34, 17);
  g.strokeStyle = '#f3e6c8'; g.lineWidth = 1;
  for (i = 0; i < 5; i++){
    g.beginPath(); g.arc(-16 + i * 7, 0, 2.1, 0, Math.PI * 2); g.stroke();
  }
  for (i = 0; i < 3; i++){
    g.beginPath(); g.moveTo(-20 + i * 12, 9); g.lineTo(-18 + i * 12, 16); g.stroke();
  }
  g.restore();
  /* 眼睛 */
  g.fillStyle = '#f3e6c8';
  g.beginPath(); g.arc(56, -50, 1.7, 0, Math.PI * 2); g.fill();
  g.restore();
}

function drawFox(g, x, y, sc, flip){
  g.save();
  g.translate(x, y); g.scale(flip ? -sc : sc, sc);
  var body = '#1a100f';
  g.globalAlpha = 0.42; g.fillStyle = '#05100f';
  g.beginPath(); g.ellipse(0, 34, 34, 5, 0, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  /* 尾 */
  g.fillStyle = body;
  g.beginPath();
  g.moveTo(-26, 2);
  g.quadraticCurveTo(-56, 6, -50, -22);
  g.quadraticCurveTo(-46, -34, -38, -24);
  g.quadraticCurveTo(-40, -8, -24, -4);
  g.closePath(); g.fill();
  g.fillStyle = '#f3e6c8';
  g.beginPath(); g.ellipse(-47, -25, 6, 7, -0.4, 0, Math.PI * 2); g.fill();
  /* 腿 */
  g.fillStyle = body;
  var lx = [-16, -6, 10, 18];
  for (var i = 0; i < 4; i++){
    g.beginPath();
    g.moveTo(lx[i] - 3.6, 6);
    g.quadraticCurveTo(lx[i] - 3, 22, lx[i] - 2.6, 32);
    g.lineTo(lx[i] + 3.4, 32);
    g.quadraticCurveTo(lx[i] + 4, 18, lx[i] + 4.2, 6);
    g.closePath(); g.fill();
  }
  /* 身 */
  g.beginPath(); g.ellipse(0, 0, 27, 15, 0, 0, Math.PI * 2); g.fill();
  /* 胸 */
  g.fillStyle = '#f3e6c8'; g.globalAlpha = 0.86;
  g.beginPath(); g.ellipse(16, 4, 9, 10, 0.2, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  /* 头 */
  g.fillStyle = body;
  g.beginPath(); g.arc(22, -16, 12, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(28, -22); g.lineTo(43, -13); g.lineTo(28, -8); g.closePath(); g.fill();
  /* 耳 */
  g.beginPath(); g.moveTo(14, -25); g.lineTo(15, -37); g.lineTo(23, -27); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(25, -27); g.lineTo(31, -37); g.lineTo(32, -24); g.closePath(); g.fill();
  /* 眼 + 音符（会说话的狐狸） */
  g.fillStyle = '#f3e6c8';
  g.beginPath(); g.arc(24, -18, 1.8, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#d8a94e'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(46, -34); g.lineTo(46, -46); g.stroke();
  g.beginPath(); g.ellipse(43.6, -46.5, 2.8, 2.1, 0.3, 0, Math.PI * 2); g.fill();
  g.restore();
}

function drawHare(g, x, y, sc){

  g.fillStyle = '#12100f';

  g.beginPath(); g.ellipse(-3.6, -27, 2.5, 8, 0.16, 0, Math.PI * 2); g.fill();

}

function drawMaskedBard(g, cx, cy, r){
  /* 拱窗里的鹿角面具吟游诗人 */
  g.save();
  g.translate(cx, cy);
  var gold = '#e0b45a', cream = '#f3e6c8';
  /* 披风肩线 */
  g.strokeStyle = cream; g.lineWidth = Math.max(1, r * 0.045); g.lineCap = 'round';
  g.beginPath(); g.arc(0, r * 0.52, r * 0.66, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
  g.strokeStyle = '#c96a5a';
  g.beginPath(); g.arc(0, r * 0.52, r * 0.55, Math.PI * 1.18, Math.PI * 1.82); g.stroke();
  /* 头 */
  g.fillStyle = '#0a1010';
  g.beginPath(); g.ellipse(0, -r * 0.02, r * 0.33, r * 0.40, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = cream; g.lineWidth = Math.max(1, r * 0.035);
  g.stroke();
  /* 面具：长鼻 + 闭眼 */
  g.beginPath();
  g.moveTo(0, -r * 0.20);
  g.quadraticCurveTo(r * 0.12, -r * 0.02, r * 0.02, r * 0.24);
  g.stroke();
  g.lineWidth = Math.max(1, r * 0.03);
  g.beginPath();
  g.moveTo(-r * 0.24, -r * 0.10); g.quadraticCurveTo(-r * 0.16, -r * 0.02, -r * 0.07, -r * 0.10);
  g.moveTo(r * 0.07, -r * 0.10);  g.quadraticCurveTo(r * 0.16, -r * 0.02, r * 0.24, -r * 0.10);
  g.stroke();
  /* 鹿角 */
  function antler(dir){
    g.save(); g.scale(dir, 1);
    g.strokeStyle = gold; g.lineWidth = Math.max(1.2, r * 0.05);
    g.beginPath();
    g.moveTo(r * 0.14, -r * 0.30);
    g.quadraticCurveTo(r * 0.24, -r * 0.72, r * 0.62, -r * 0.80);
    g.stroke();
    g.lineWidth = Math.max(1, r * 0.035);
    g.beginPath();
    g.moveTo(r * 0.26, -r * 0.46); g.lineTo(r * 0.46, -r * 0.68);
    g.moveTo(r * 0.40, -r * 0.66); g.lineTo(r * 0.52, -r * 0.94);
    g.moveTo(r * 0.52, -r * 0.75); g.lineTo(r * 0.76, -r * 0.88);
    g.stroke();
    g.restore();
  }
  antler(-1); antler(1);
  /* 冠饰点 */
  g.fillStyle = '#c96a5a';
  g.beginPath(); g.arc(0, -r * 0.36, r * 0.045, 0, Math.PI * 2); g.fill();
  g.restore();
}

function drawArch(g, w, h){
  var topH = h * (view.por ? 0.20 : 0.235);
  var wine = '#43121f';
  /* 顶部绒布横幅 */
  g.fillStyle = wine;
  g.fillRect(0, 0, w, topH);
  g.strokeStyle = 'rgba(216,169,78,.55)'; g.lineWidth = Math.max(1, h * 0.0018);
  stitchLine(g, 0, topH * 0.985, w, topH * 0.985, 8, 7, Math.max(1.2, h * 0.0022), '#d8a94e', 0.5);
  /* 横幅内细密织纹 */
  var i;
  g.globalAlpha = 0.16; g.strokeStyle = '#f3e6c8'; g.lineWidth = 1;
  for (i = 0; i < 26; i++){
    var yy = (i / 26) * topH;
    g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke();
  }
  g.globalAlpha = 1;
  /* 拱窗（圆） */
  var r = Math.min(topH * 0.40, w * 0.15);
  var cx = w * 0.5, cy = topH * 0.56;
  oculus = { x: cx, y: cy, r: r };
  /* 圆环外的金色刺绣光环 */
  g.save();
  g.strokeStyle = 'rgba(216,169,78,.42)';
  g.lineWidth = Math.max(1, r * 0.06);
  g.beginPath(); g.arc(cx, cy, r * 1.30, 0, Math.PI * 2); g.stroke();
  g.restore();
  /* 圆内深青底 */
  g.save();
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = '#0a2f2c'; g.fillRect(cx - r, cy - r, r * 2, r * 2);
  /* 内部放射光线：用深色画，太阳才亮得出来 */
  g.globalAlpha = 0.55; g.strokeStyle = '#06201e'; g.lineWidth = Math.max(1.2, r * 0.024);
  for (i = 0; i < 28; i++){
    var a = (i / 28) * Math.PI * 2;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * r * 0.20, cy + Math.sin(a) * r * 0.20);
    g.lineTo(cx + Math.cos(a) * r * 0.99, cy + Math.sin(a) * r * 0.99);
    g.stroke();
  }
  g.globalAlpha = 0.22;
  g.strokeStyle = '#e8c98a'; g.lineWidth = Math.max(1, r * 0.013);
  for (i = 0; i < 28; i++){
    var a2 = (i / 28) * Math.PI * 2 + 0.11;
    g.beginPath();
    g.moveTo(cx + Math.cos(a2) * r * 0.20, cy + Math.sin(a2) * r * 0.20);
    g.lineTo(cx + Math.cos(a2) * r * 0.99, cy + Math.sin(a2) * r * 0.99);
    g.stroke();
  }
  g.globalAlpha = 1;
  /* 日 */
  var sr = r * 0.30;
  g.fillStyle = '#b8762a'; g.beginPath(); g.arc(cx - r * 0.02, cy - r * 0.03, sr, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#e8bf68'; g.beginPath(); g.arc(cx - r * 0.02, cy - r * 0.055, sr * 0.88, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#f6e2ac'; g.beginPath(); g.arc(cx - r * 0.06, cy - r * 0.09, sr * 0.52, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#f3e6c8'; g.lineWidth = Math.max(1, r * 0.014);
  for (i = 0; i < 16; i++){
    var b = (i / 16) * Math.PI * 2 + 0.2;
    g.beginPath();
    g.moveTo(cx + Math.cos(b) * sr * 1.22, cy + Math.sin(b) * sr * 1.22);
    g.lineTo(cx + Math.cos(b) * sr * 1.54, cy + Math.sin(b) * sr * 1.54);
    g.stroke();
  }
  /* 月牙 */
  g.fillStyle = '#efe0bb';
  g.beginPath(); g.arc(cx + r * 0.60, cy - r * 0.46, r * 0.13, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0a2f2c';
  g.beginPath(); g.arc(cx + r * 0.665, cy - r * 0.505, r * 0.12, 0, Math.PI * 2); g.fill();
  /* 星点 */
  var rng = mulberry32(9);
  g.fillStyle = '#f3e6c8';
  for (i = 0; i < 22; i++){
    g.globalAlpha = 0.30 + rng() * 0.5;
    var ang = rng() * Math.PI * 2, rad = r * (0.36 + rng() * 0.58);
    g.beginPath();
    g.arc(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, Math.max(0.7, r * 0.022), 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  g.restore();
  /* 圆框刺绣 */
  g.save();
  g.strokeStyle = '#d8a94e'; g.lineWidth = Math.max(1.4, r * 0.055);
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  g.restore();
  /* 面具人 */
  drawMaskedBard(g, cx, cy + r * 0.10, r * 0.72);
  /* 拱肩藤蔓 */
  drawVine(g, 0, topH, 30, 1);
  drawVine(g, w, topH, -30, -1);
}

function drawVine(g, x, y, dir, _unused){
  g.save();
  g.translate(x, y);
  g.strokeStyle = '#7f9b6a'; g.lineWidth = Math.max(1, view.k * 1.3);
  g.globalAlpha = 0.55;
  for (var k = 0; k < 3; k++){
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(dir * 22, -26 - k * 8, dir * 6, -58 - k * 16, dir * 34, -76 - k * 22);
    g.stroke();
    g.fillStyle = '#c96a5a';
    g.beginPath(); g.arc(dir * 30, -70 - k * 22, 2.6, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#e8c98a';
    g.beginPath(); g.arc(dir * 12, -40 - k * 12, 1.9, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

function drawFrameBorders(g, w, h){
  var sw = Math.max(10, Math.min(w, h) * 0.038);
  var bh = Math.max(16, h * 0.075);
  /* 侧柱 */
  g.fillStyle = 'rgba(67,18,31,.86)';
  g.fillRect(0, 0, sw, h);
  g.fillRect(w - sw, 0, sw, h);
  /* 侧柱刺绣小菱形 */
  var n = Math.min(14, Math.floor(h / 70));
  for (var i = 0; i < n; i++){
    var y = h * 0.12 + i * (h * 0.78 / Math.max(1, n - 1));
    for (var s = 0; s < 2; s++){
      var x = s ? w - sw * 0.5 : sw * 0.5;
      g.save();
      g.translate(x, y); g.rotate(Math.PI / 4);
      g.strokeStyle = 'rgba(216,169,78,.60)'; g.lineWidth = Math.max(1, sw * 0.05);
      var q = sw * 0.22;
      g.strokeRect(-q, -q, q * 2, q * 2);
      g.fillStyle = 'rgba(201,106,90,.65)';
      g.fillRect(-q * 0.34, -q * 0.34, q * 0.68, q * 0.68);
      g.restore();
    }
  }
  /* 底部横幅 */
  g.fillStyle = '#3d1020';
  g.fillRect(0, h - bh, w, bh);
  g.strokeStyle = 'rgba(216,169,78,.62)'; g.lineWidth = Math.max(1.2, h * 0.0022);
  stitchLine(g, 0, h - bh, w, h - bh, 7, 6, Math.max(1.2, h * 0.0022), '#d8a94e', 0.7);
  stitchLine(g, 0, h - bh * 0.16, w, h - bh * 0.16, 5, 8, 1.1, '#f3e6c8', 0.28);
  /* 横幅内四叶连纹 */
  var step = Math.max(52, w / 14);
  var cnt = Math.min(40, Math.floor(w / step));
  for (var j = 0; j < cnt; j++){
    var cx = (j + 0.5) * step;
    var cy = h - bh * 0.52;
    var rr = Math.min(bh * 0.26, step * 0.28);
    g.strokeStyle = 'rgba(216,169,78,.52)'; g.lineWidth = Math.max(1, rr * 0.16);
    g.beginPath();
    g.arc(cx - rr, cy, rr * 0.62, 0, Math.PI * 2);
    g.arc(cx + rr, cy, rr * 0.62, 0, Math.PI * 2);
    g.arc(cx, cy - rr, rr * 0.62, 0, Math.PI * 2);
    g.arc(cx, cy + rr, rr * 0.62, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = 'rgba(201,106,90,.75)';
    g.beginPath(); g.arc(cx, cy, rr * 0.26, 0, Math.PI * 2); g.fill();
  }
}

function paintStatic(){
  if (!ctx) return;
  try { paintStaticInner(); }
  catch (e){ console.error('[433] stage art failed', e); }
}
function paintStaticInner(){
  var w = view.w, h = view.h, dpr = view.dpr;
  if (!bgc){ bgc = document.createElement('canvas'); bctx = bgc.getContext('2d'); }
  if (!bctx) return;
  bgc.width = Math.max(1, Math.round(w * dpr));
  bgc.height = Math.max(1, Math.round(h * dpr));
  var g = bctx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  /* 先铺一层底色：任何后续绘制出错都还有底 */
  g.fillStyle = '#0a2f2c';
  g.fillRect(0, 0, w, h);
  /* 绒布底色（深青） */
  var base = g.createLinearGradient(0, 0, w * 0.4, h);
  base.addColorStop(0, '#0e3d38');
  base.addColorStop(0.55, '#0a2f2c');
  base.addColorStop(1, '#072421');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  /* 纬线 */
  var i, y;
  g.globalAlpha = 0.10; g.strokeStyle = '#7fb6a5'; g.lineWidth = 1;
  for (y = 0; y < h; y += 3){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  /* 经线 */
  g.globalAlpha = 0.055; g.strokeStyle = '#cfe6d4';
  for (i = 0; i < w; i += 3){ g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); }
  g.globalAlpha = 1;
  /* 花海 */
  /* 千花挂毯的格架：细竖纹 + 蜿蜒藤线 */
  drawLattice(g, w, h);
  drawFloraField(g, w, h, mulberry32(20260903));
  /* 动物 */
  if (view.por){
    drawUnicorn(g, w * 0.27, h * 0.34, view.k * 1.05, false);
    drawFox(g, w * 0.74, h * 0.44, view.k * 0.95, true);
    drawHare(g, w * 0.16, h * 0.22, view.k * 0.9);
  } else {
    drawUnicorn(g, w * 0.155, h * 0.575, view.k * 1.5, false);
    drawFox(g, w * 0.85, h * 0.645, view.k * 1.32, true);
    drawHare(g, w * 0.055, h * 0.845, view.k * 1.05);
  }
  /* 拱窗 + 边框 */
  drawArch(g, w, h);
  drawFrameBorders(g, w, h);
  /* 花海再压一层在最外，让边框有过渡 */
  g.globalAlpha = 0.16;
  drawFloraField(g, w, h, mulberry32(777001));
  g.globalAlpha = 1;
}

/* ---------- 动态：飞鸟 / 星尘 / 针线 ---------- */
function buildDynamic(){
  var w = view.w, h = view.h, i;
  var rng = mulberry32(4455);
  motes = [];
  var mn = T.rm ? 24 : 54;
  for (i = 0; i < mn; i++){
    motes.push({
      x: rng() * w, y: rng() * h,
      r: (0.5 + rng() * 1.7) * view.k,
      sp: 0.12 + rng() * 0.5,
      ph: rng() * 6.28,
      a: 0.10 + rng() * 0.35
    });
  }
  stars = [];
  var o = oculus;
  for (i = 0; i < 18; i++){
    var ang = rng() * Math.PI * 2, rad = o.r * (0.45 + rng() * 0.5);
    stars.push({
      x: o.x + Math.cos(ang) * rad, y: o.y + Math.sin(ang) * rad,
      r: Math.max(0.9, o.r * (0.012 + rng() * 0.022)),
      ph: rng() * 6.28
    });
  }
  birds = [];
  var by = view.por ? h * 0.28 : h * 0.30;
  for (i = 0; i < 7; i++){
    birds.push({
      x: rng() * w, y: by + (rng() - 0.5) * h * 0.10,
      s: (3 + rng() * 4.5) * view.k, ph: rng() * 6.28, sp: 0.10 + rng() * 0.16
    });
  }
}

function drawDecor(now){
  var w = view.w, h = view.h;
  var t = now * 0.001;
  var lv = clamp(T.live.level, 0, 1);
  var bass = clamp(T.live.bass, 0, 1);
  var i;
  /* 日轮鼓点呼吸 */
  if (!T.rm && oculus.r > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var pulse = 0.10 + lv * 0.22 + T.beatFlash * 0.30 + bass * 0.10;
    var rg = ctx.createRadialGradient(oculus.x, oculus.y, oculus.r * 0.2,
                                      oculus.x, oculus.y, oculus.r * 2.5);
    rg.addColorStop(0, 'rgba(255,214,140,' + clamp(pulse, 0, 0.8).toFixed(3) + ')');
    rg.addColorStop(0.45, 'rgba(216,169,78,' + (pulse * 0.30).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(216,169,78,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  /* 星点闪烁 */
  ctx.save();
  for (i = 0; i < stars.length; i++){
    var s = stars[i];
    var tw = T.rm ? 0.6 : (0.42 + 0.58 * Math.abs(Math.sin(t * 1.7 + s.ph)));
    ctx.globalAlpha = tw * (0.5 + lv * 0.5);
    ctx.fillStyle = '#ffe8b8';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.8 + T.beatFlash * 0.7), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  /* 飞鸟 */
  ctx.save();
  ctx.strokeStyle = 'rgba(243,230,200,.62)'; ctx.lineWidth = Math.max(1.1, 1.5 * view.k);
  ctx.lineCap = 'round';
  for (i = 0; i < birds.length; i++){
    var b = birds[i];
    var bx = b.x + (T.rm ? 0 : ((t * 16 * b.sp + i * 137) % (w + 200)) - 100);
    var fl = T.rm ? 0.5 : Math.abs(Math.sin(t * 3.1 + b.ph));
    var s2 = b.s;
    ctx.beginPath();
    ctx.moveTo(bx - s2 * 2, b.y + s2 * (0.4 + fl * 0.6));
    ctx.quadraticCurveTo(bx - s2, b.y - s2 * (0.5 + fl * 0.7), bx, b.y);
    ctx.quadraticCurveTo(bx + s2, b.y - s2 * (0.5 + fl * 0.7), bx + s2 * 2, b.y + s2 * (0.4 + fl * 0.6));
    ctx.stroke();
  }
  ctx.restore();
  /* 绒线尘絮 */
  if (motes.length){
    ctx.save();
    for (i = 0; i < motes.length; i++){
      var m = motes[i];
      var drift = T.rm ? 0 : Math.sin(t * 0.5 + m.ph) * 14;
      var rise = T.rm ? 0 : (t * 9 * m.sp) % (h + 60);
      var my = (m.y - rise + h + 60) % (h + 60);
      ctx.globalAlpha = m.a * (0.4 + 0.6 * Math.abs(Math.sin(t * 0.9 + m.ph)));
      ctx.fillStyle = (i % 9 === 0) ? '#e8c98a' : '#cfe6d4';
      ctx.beginPath(); ctx.arc(m.x + drift, my, m.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- 歌词：逐字点亮 + 针脚 ---------- */
function buildSpans(text, chars){
  curHasSpans = false; curSpans = []; curRects = []; curOn = -1;
  if (!elCur) return;
  var n = text.length;
  if (n === 0){ elCur.textContent = ''; return; }
  if (n > 56){ elCur.textContent = text; return; }
  var html = '', i;
  var t0 = curLine ? curLine.t : 0, dr = curLine ? curLine.dur : 0;
  for (i = 0; i < n; i++){
    var ch = text.charAt(i);
    var esc = ch === '&' ? '&amp;' : (ch === '<' ? '&lt;' : (ch === '>' ? '&gt;' : ch));
    html += '<span class="ch" data-i="' + i + '">' + esc + '</span>';
  }
  elCur.innerHTML = html;
  curHasSpans = true;
  var nodes = elCur.getElementsByTagName('span');
  curSpans = [];
  for (i = 0; i < nodes.length; i++) curSpans.push(nodes[i]);
  measureSpans();
}
function measureSpans(){
  curRects = [];
  if (!curHasSpans || !curSpans.length) return;
  try {
    for (var i = 0; i < curSpans.length; i++){
      var r = curSpans[i].getBoundingClientRect();
      curRects.push({ x: r.left, y: r.top, w: r.width, h: r.height });
    }
    var br = elBand.getBoundingClientRect();
    bandRect = { x: br.left, y: br.top, w: br.width, h: br.height };
  } catch (e){ console.error('[433] measure spans failed', e); }
}
function charTime(i, n){
  if (curChars && curChars.length === n && i < curChars.length){
    var v = +curChars[i].t;
    if (isFinite(v)) return v;
  }
  var t0 = curLine ? curLine.t : 0;
  var dr = curLine ? Math.max(0.05, curLine.dur || 0) : 0;
  if (!dr) return t0;
  return t0 + dr * (i / Math.max(1, n));
}
function updateCharPaint(){
  if (!curHasSpans || !curSpans.length || !curLine) return;
  var n = curSpans.length;
  var on = 0;
  for (var i = 0; i < n; i++){
    if (charTime(i, n) <= T.t + 0.045) on = i + 1; else break;
  }
  if (on !== curOn){
    var from = Math.max(0, curOn);
    for (var j = from; j < on; j++){
      if (curSpans[j]) curSpans[j].className = 'ch on';
    }
    if (on < Math.max(0, curOn)){ /* 回退（拖动进度） */
      for (var k = on; k < n; k++){ if (curSpans[k]) curSpans[k].className = 'ch'; }
    }
    curOn = on;
  }
}
function drawStitches(now){
  if (!curHasSpans || !curRects.length || !bandRect.w) return;
  var n = curRects.length;
  var on = curOn > 0 ? curOn : 0;
  if (on <= 0) return;
  ctx.save();
  ctx.strokeStyle = T.goldSoft || 'rgba(216,169,78,.72)';
  ctx.lineWidth = Math.max(1, 1.25 * view.k);
  ctx.lineCap = 'round';
  var baseY = 0;
  for (var i = 0; i < on; i++){
    var r = curRects[i];
    if (!r || r.w < 1) continue;
    if (r.w < 3) continue;
    baseY = r.y + r.h + Math.max(3, 2 * view.k);
    var cw = Math.min(r.w * 0.62, 13 * view.k);
    var hh = Math.max(1.8, Math.min(4.2, cw * 0.34));
    var cx = r.x + r.w * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx - cw * 0.5, baseY); ctx.lineTo(cx + cw * 0.5, baseY);
    ctx.moveTo(cx - cw * 0.34, baseY - hh); ctx.lineTo(cx + cw * 0.34, baseY + hh);
    ctx.stroke();
  }
  /* 针 + 金线，从当前字垂到横幅 */
  if (!T.rm && T.playing && on > 0 && on <= n){
    var last = curRects[on - 1];
    if (last){
      var nx = last.x + last.w * 0.5, ny = last.y + last.h + 6 * view.k;
      var sway = Math.sin(now * 0.0016) * 6 * view.k;
      var endY = bandRect.y + bandRect.h + 10 * view.k;
      var endX = bandRect.x + bandRect.w * (0.30 + 0.40 * (on / Math.max(1, n))) + sway * 0.4;
      ctx.strokeStyle = T.goldSoft || 'rgba(216,169,78,.50)';
      ctx.lineWidth = Math.max(1, 1.2 * view.k);
      ctx.beginPath();
      ctx.moveTo(nx, ny);
      ctx.bezierCurveTo(nx + sway, ny + (endY - ny) * 0.35,
                        endX - sway, endY - (endY - ny) * 0.30, endX, endY);
      ctx.stroke();
      /* 针 */
      var ang = -0.9 + Math.sin(now * 0.0012) * 0.16;
      var nlen = 9 * view.k;
      ctx.strokeStyle = 'rgba(233,240,236,.86)';
      ctx.lineWidth = Math.max(1.2, 1.5 * view.k);
      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX + Math.cos(ang) * nlen, endY + Math.sin(ang) * nlen);
      ctx.stroke();
      ctx.fillStyle = 'rgba(233,240,236,.9)';
      ctx.beginPath(); ctx.arc(endX, endY, Math.max(1.1, 1.3 * view.k), 0, Math.PI * 2); ctx.fill();
      /* 虚线残迹 */
      ctx.globalAlpha = 0.4;
      ctx.setLineDash([2 * view.k, 5 * view.k]);
      ctx.strokeStyle = 'rgba(255,240,200,.5)';
      ctx.beginPath();
      ctx.moveTo(nx, ny); ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

/* ---------- 歌词文本与状态 ---------- */
var lastSewW = -1;
function setSew(ratio){
  if (!elSew) return;
  var pct = clamp(ratio * 100, 0, 100);
  var q = Math.round(pct * 4) / 4;
  if (q === lastSewW) return;
  lastSewW = q;
  elSew.style.width = q.toFixed(2) + '%';
}
function relayoutLyrics(){
  if (curLine) measureSpans();
}
function setCurLine(line){
  var changed = (curLine !== line);
  curLine = line || null;
  curChars = line ? line.chars : null;
  if (!line){
    if (elCur) elCur.textContent = '';
    curHasSpans = false; curSpans = []; curRects = []; curOn = -1;
    return;
  }
  var txt = line.text || '';
  if (elCur){
    var long = txt.length > 26;
    if (long) elCur.classList.add('long'); else elCur.classList.remove('long');
  }
  buildSpans(txt, curChars);
  if (!changed) measureSpans();
}
function updateLyrics(force){
  if (!elBand || !elCur) return;
  var has = T.lines.length > 0;
  elBand.classList.toggle('empty', !has);
  if (!has){
    elPrev.textContent = ''; elNext.textContent = '';
    elCur.textContent = '';
    curLine = null; curChars = null; curHasSpans = false; curSpans = []; curRects = [];
    setSew(0); T.text = ''; T.idx = -1;
    return;
  }
  var i = T.idx;
  if (i < 0 || i >= T.lines.length) i = -1;
  T.idx = i;
  var cur = i >= 0 ? T.lines[i] : T.lines[0];
  T.text = (i >= 0 && cur) ? (cur.text || '') : '';
  if (i < 0){
    /* 还没到第一句：显示第一句作为预告，全部暗着 */
    if (curLine !== T.lines[0] || force) setCurLine(T.lines[0]);
    if (curHasSpans){
      for (var q = 0; q < curSpans.length; q++) curSpans[q].className = 'ch';
      curOn = 0;
    }
    setSew(0);
  } else {
    if (force || curLine !== T.lines[i]) setCurLine(T.lines[i]);
  }
  elPrev.textContent = i > 0 ? (T.lines[i - 1].text || '') : '';
  var nx = (i < 0) ? 1 : i + 1;
  elNext.textContent = nx < T.lines.length ? (T.lines[nx].text || '') : '';
}

/* ---------- 消息处理 ---------- */
function normChars(chars, text){
  if (!chars || !chars.length || !text) return null;
  if (chars.length !== text.length) return null;
  var out = [], i, c, ch, tt;
  for (i = 0; i < chars.length; i++){
    c = chars[i];
    if (!c) return null;
    ch = (c.c == null) ? '' : String(c.c);
    if (ch.length !== 1) return null;
    tt = +c.t;
    if (!isFinite(tt)) return null;
    out.push({ c: ch, t: tt });
  }
  return out.length ? out : null;
}
function applyAccent(){
  /* 封面色只用来"染金线"：底色仍是深青/酒红，保证中世纪挂毯的骨相 */
  var a = T.accent || [214, 169, 78];
  var lum = (a[0] * 0.299 + a[1] * 0.587 + a[2] * 0.114) / 255;
  if (lum < 0.34){
    var k = 0.34 / Math.max(0.05, lum);
    a = [clamp(Math.round(a[0] * k), 40, 255),
         clamp(Math.round(a[1] * k), 40, 255),
         clamp(Math.round(a[2] * k), 40, 255)];
  }
  T.gold = 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')';
  T.goldSoft = 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',.55)';
  try {
    document.documentElement.style.setProperty('--gold', T.gold);
    elBand.style.borderTopColor = T.goldSoft;
    elBand.style.borderBottomColor = T.goldSoft;
    elSew.style.background = 'repeating-linear-gradient(90deg,' + T.gold + ' 0 7px, transparent 7px 12px)';
  } catch (e){ console.error('[433] accent failed', e); }
}
function onInit(p){
  try {
    p = p || {};
    if (Array.isArray(p.accent) && p.accent.length >= 3){
      T.accent = [
        clamp(Math.round(nAny(p.accent[0], 214)), 0, 255),
        clamp(Math.round(nAny(p.accent[1], 169)), 0, 255),
        clamp(Math.round(nAny(p.accent[2], 78)), 0, 255)
      ];
    }
    T.dur = Math.max(0, nAny(p.duration, 0));
    applyAccent();
    var song = p.song || {};
    var nm = (song.name == null) ? '' : String(song.name);
    var ar = song.artists;
    if (Array.isArray(ar)) ar = ar.filter(function(x){ return x != null && String(x).length; }).join(' / ');
    ar = (ar == null) ? '' : String(ar);
    var label = '';
    if (nm) label += nm;
    if (ar) label += (label ? '  ·  ' : '') + ar;
    T.songName = label;
    if (elTag) elTag.textContent = label;
    var src = Array.isArray(p.lines) ? p.lines : [];
    var out = [], n = Math.min(src.length, 900), i, L, txt, tt, dr;
    for (i = 0; i < n; i++){
      L = src[i];
      if (!L) continue;
      txt = (L.text == null) ? '' : String(L.text);
      if (!txt || !txt.replace(/\s+/g, '')) continue;
      tt = nAny(L.t, 0); if (tt < 0) tt = 0;
      dr = Math.max(0, nAny(L.dur, 0));
      out.push({ t: tt, dur: dr, text: txt, chars: normChars(L.chars, txt) });
    }
    for (i = 1; i < out.length; i++){ if (out[i].t < out[i - 1].t) out[i].t = out[i - 1].t; }
    T.lines = out;
    /* 重发 init（换歌 / 取色完成）时时间轴可能还在跑：按当前时间重算句索引，
       否则会一直停在 -1 等下一次 tick，画面像卡死 */
    T.idx = out.length ? findIdx(T.t) : -1;
    curLine = null;
    updateLyrics(true);
  } catch (e){
    console.error('[433] init failed', e);
  }
}
function findIdx(t){
  var lo = 0, hi = T.lines.length - 1, ans = -1;
  while (lo <= hi){
    var mid = (lo + hi) >> 1;
    if (T.lines[mid].t <= t + 0.0005){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}
function onTick(p){
  try {
    p = p || {};
    var t = nAny(p.time, T.t);
    if (t < 0) t = 0;
    T.t = t;
    T.playing = (p.playing !== false);
    T.tickPerf = nowMs();
    var ni = findIdx(t);
    if (ni !== T.idx){ T.idx = ni; updateLyrics(false); }
  } catch (e){
    console.error('[433] tick failed', e);
  }
}
function onBeat(p){
  try {
    var lv = clamp(nAny(p && p.level, 0.5), 0, 1);
    T.beatFlash = Math.min(1, 0.45 + lv * 0.75);
    T.beatCount++;
  } catch (e){ console.error('[433] beat failed', e); }
}
function onLive(p){
  try {
    p = p || {};
    var L = T.live;
    L.level = clamp(nAny(p.level, L.level), 0, 1);
    L.bass = clamp(nAny(p.bass, L.bass), 0, 1);
    L.mid = clamp(nAny(p.mid, L.mid), 0, 1);
    L.treble = clamp(nAny(p.treble, L.treble), 0, 1);
    L.bpm = Math.max(0, nAny(p.bpm, L.bpm));
    if (p.playing === false) L.playing = false; else if (p.playing === true) L.playing = true;
  } catch (e){ console.error('[433] live failed', e); }
}

/* ---------- 每帧 ---------- */
function drawFrame(now){
  if (!ctx) return;
  var w = view.w, h = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, w, h);
  if (bgc) ctx.drawImage(bgc, 0, 0, w, h);
  drawDecor(now);
  /* 当前句进度 */
  if (curLine){
    var dr = curLine.dur > 0 ? curLine.dur : 0;
    if (dr > 0) setSew((T.t - curLine.t) / dr);
    else setSew(T.idx >= 0 ? 1 : 0);
    updateCharPaint();
    drawStitches(now);
  } else {
    setSew(0);
  }
  if (vign){ ctx.fillStyle = vign; ctx.fillRect(0, 0, w, h); }
  /* 顶部与底部轻微压暗，保证歌词可读 */
  ctx.fillStyle = 'rgba(4,16,15,.20)';
  ctx.fillRect(0, h * 0.52, w, h * 0.48);
  T.beatFlash *= 0.90;
  if (T.beatFlash < 0.002) T.beatFlash = 0;
}
function frame(now){
  var t0 = nowMs();
  T.frames++;
  if (T.frames === 1) sendReady();
  try { drawFrame(now || t0); }
  catch (e){ T.err = String((e && e.message) || e); console.error('[433] draw failed', e); }
  T.js = Math.round((nowMs() - t0) * 100) / 100;
  requestAnimationFrame(frame);
}

/* ---------- 事件与启动 ---------- */
window.addEventListener('message', function(ev){
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') onBeat(d.payload);
    else if (d.type === 'live') onLive(d.payload);
  } catch (e){ console.error('[433] message failed', e); }
});
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 140); });
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && ctx){ try { drawFrame(nowMs()); } catch (e){ console.error(e); } }
});
if (window.matchMedia){
  try {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    var onMq = function(e){ T.rm = !!(e && e.matches); };
    if (mq.addEventListener) mq.addEventListener('change', onMq);
    else if (mq.addListener) mq.addListener(onMq);
  } catch (e){ console.error('[433] mq failed', e); }
}

/* 顶层同步初始化：view / T / 各 DOM 引用在此之前已全部建立 */
try {
  resize();
  updateLyrics(true);
} catch (e){
  console.error('[433] boot failed', e);
}
/* 兜底 ready（只发一次；正常情况首帧 rAF 已发） */
setTimeout(sendReady, 600);
requestAnimationFrame(frame);
</script>
</body>
</html>
