<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>330 · 涡街铬球</title>
<style>
  :root{
    --neon: rgb(178,42,208);
    --neon-soft: rgba(178,42,208,.42);
    --ink: #f4f1fa;
    --hair: rgba(255,255,255,.22);
    --sans: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
    --mono: ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#06040a;overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    -webkit-user-select:none;user-select:none;cursor:default}
  #gl,#cv2{position:fixed;inset:0;display:block;width:100%;height:100%}
  #gl[hidden],#cv2[hidden]{display:none}

  /* ---- 图表框架：气动示意图的横轴与刻度 ---- */
  .fig{position:fixed;left:0;right:0;top:calc(48% - 6px);z-index:4;pointer-events:none;
    mix-blend-mode:difference;opacity:.85}
  .fig .axis{display:block;height:1px;background:linear-gradient(90deg,
    transparent 0 4%,rgba(255,255,255,.26) 10% 90%,transparent 96% 100%)}
  .fig .tick{display:block;height:6px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 1px,transparent 1px 5.6vw);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}

  /* ---- HUD ---- */
  .hud{position:fixed;z-index:5;font-family:var(--mono);color:#fff;
    font-size:clamp(8px,.72vw,11px);letter-spacing:.2em;text-transform:uppercase;
    line-height:1.55;mix-blend-mode:difference;pointer-events:none}
  .hud-tl{top:clamp(14px,3.4vh,36px);left:clamp(14px,3.2vw,44px);max-width:min(56vw,460px)}
  .hud-tr{top:clamp(14px,3.4vh,36px);right:clamp(14px,3.2vw,44px);text-align:right}
  .hud-bl{bottom:clamp(12px,2.6vh,26px);left:clamp(14px,3.2vw,44px);z-index:7;
    display:flex;align-items:center;gap:.9em;opacity:.62}
  .kicker{opacity:.72;font-size:clamp(7px,.64vw,10px);letter-spacing:.34em}
  .title{font-family:var(--sans);font-weight:800;text-transform:none;
    font-size:clamp(12px,1.45vw,20px);letter-spacing:.01em;
    margin:.7em 0 .35em;line-height:1.25;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .meta{font-size:clamp(7px,.66vw,10px);opacity:.68;letter-spacing:.24em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{opacity:.8}
  .tag b{display:inline-block;width:.6em;height:.6em;margin-right:.7em;border-radius:50%;
    background:#fff;vertical-align:middle;transform:translateY(-1px)}
  .re{margin-top:.5em;opacity:.55;font-size:clamp(7px,.62vw,10px)}
  .bar{width:clamp(30px,5vw,74px);height:1px;background:rgba(255,255,255,.42)}
  .bar span{display:block;height:100%;width:12%;background:#fff}

  /* ---- 歌词 ---- */
  .lyrics{position:fixed;left:0;right:0;bottom:clamp(18px,7.5vh,92px);z-index:6;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:.28em;padding:0 clamp(18px,7vw,140px);text-align:center;
    pointer-events:none;font-family:var(--sans);transition:opacity .4s ease}
  .lyrics::before{content:"";position:fixed;left:0;right:0;bottom:0;
    height:clamp(150px,30vh,310px);z-index:-1;
    background:
      radial-gradient(ellipse 56% 96% at 50% 100%,
        rgba(4,2,9,.97) 0%,rgba(4,2,9,.88) 34%,rgba(4,2,9,.46) 64%,rgba(4,2,9,0) 100%),
      linear-gradient(to top,rgba(4,2,9,.94) 0%,rgba(4,2,9,.58) 44%,rgba(4,2,9,0) 100%)}
  .ly{width:100%;margin:0;line-height:1.24;word-break:break-word;
    text-wrap:balance;overflow-wrap:anywhere}
  .l-prev{font-size:clamp(11px,1.22vw,17px);font-weight:600;
    color:rgba(244,241,250,.42);letter-spacing:.02em;min-height:1.24em}
  .l-cur{font-size:clamp(21px,3.05vw,48px);font-weight:800;color:var(--ink);
    letter-spacing:-.008em;min-height:1.24em;
    text-shadow:0 0 28px var(--neon-soft),0 1px 10px rgba(0,0,0,.72)}
  .l-cur.pop{animation:rise .5s cubic-bezier(.16,.84,.32,1) both}
  @keyframes rise{
    from{opacity:0;transform:translateY(.26em)}
    to{opacity:1;transform:translateY(0)}
  }
  @media (prefers-reduced-motion:reduce){
    .l-cur.pop{animation:none}
    .ch{transition:none}
  }
  .l-next{font-size:clamp(12px,1.46vw,21px);font-weight:600;
    color:rgba(244,241,250,.27);min-height:1.24em}
  .ch{color:rgba(244,241,250,.30);white-space:pre-wrap;
    transition:color .18s linear,text-shadow .22s linear}
  .ch.on{color:#fff;text-shadow:0 0 24px var(--neon-soft),0 0 4px rgba(255,255,255,.55)}

  /* ---- 空歌词 ---- */
  .empty{position:fixed;left:0;right:0;bottom:clamp(24px,9vh,110px);z-index:6;
    display:none;flex-direction:column;align-items:center;gap:1.1em;
    font-family:var(--mono);color:rgba(244,241,250,.66);
    letter-spacing:.46em;font-size:clamp(9px,.96vw,12px);text-align:center}
  .empty em{font-style:normal;display:block;width:clamp(40px,7vw,110px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
  body.no-lyrics .lyrics{opacity:0}
  body.no-lyrics .empty{display:flex}

  @media (orientation:portrait){
    .lyrics{bottom:clamp(20px,9vh,120px);padding:0 7vw}
    .l-cur{font-size:clamp(20px,5.6vw,38px)}
    .l-prev{font-size:clamp(11px,3.2vw,15px)}
    .l-next{font-size:clamp(11px,3.4vw,17px)}
    .hud-tl{max-width:66vw}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv2" hidden></canvas>

<div class="fig" aria-hidden="true">
  <div class="tick"></div><div class="axis"></div><div class="tick"></div>
</div>

<header class="hud hud-tl">
  <div class="kicker">26 / 50 · NEO-OP × FLUID DYNAMICS</div>
  <div class="title" id="songTitle">—</div>
  <div class="meta" id="songMeta">—</div>
</header>

<div class="hud hud-tr">
  <div class="tag"><b id="lamp"></b>KÁRMÁN VORTEX STREET</div>
  <div class="re" id="reLabel">Re 3.3 × 10⁵ · CHROME BALL Ø 0.326</div>
</div>

<div class="hud hud-bl">
  <span>FIG.330</span><span class="bar"><span id="barFill"></span></span>
</div>

<figure class="lyrics" id="lyr">
  <div class="ly l-prev" id="lnPrev"></div>
  <div class="ly l-cur" id="lnCur"></div>
  <div class="ly l-next" id="lnNext"></div>
</figure>

<div class="empty" id="empty"><em></em><span>NO LYRIC / 纯器乐</span></div>
<script>
(function(){
  'use strict';
  var gcv = document.getElementById('gl');
  var cv = document.getElementById('cv2');
  var ctx = cv.getContext('2d');
  var W = 1440, H = 900, DPR = 1;

  var LINES = [], DUR = 0;
  var st = { t: 0, playing: true, idx: -1, text: '', frames: 0, js: 0, err: '',
             spans: [], litN: -1 };
  var lampP = 0;
  var elTitle = document.getElementById('songTitle');
  var elMeta = document.getElementById('songMeta');
  var elRe = document.getElementById('reLabel');
  var elLamp = document.getElementById('lamp');
  var elBar = document.getElementById('barFill');
  var barP = -1;
  var lnPrev = document.getElementById('lnPrev');
  var lnCur = document.getElementById('lnCur');
  var lnNext = document.getElementById('lnNext');
  var readySent = false, baseT = 0, baseStamp = 0, rm = false;

  /* 视觉状态 */
  var visT = 0, pulse = 0, last = 0;
  var lvl = { bass: 0, mid: 0, treble: 0 };
  var tgt = { bass: 0, mid: 0, treble: 0 };
  var ACC = [0.62, 0.24, 0.95], accentMix = 0.62;

  /* ---------- 保险丝：所有进渲染的数值都先夹取 ---------- */
  function num(v, d){ v = +v; return isFinite(v) ? v : d; }
  function clamp(v, a, b){ v = +v; if (!isFinite(v)) return a; return v < a ? a : (v > b ? b : v); }
  function byte(v, d){ return Math.round(clamp(num(v, d), 0, 255)); }

  function setAccent(a){
    if (!a || typeof a.length !== 'number' || a.length < 3) return;
    var r = byte(a[0], 0), g2 = byte(a[1], 0), b = byte(a[2], 0);
    ACC[0] = r / 255; ACC[1] = g2 / 255; ACC[2] = b / 255;
    accentMix = clamp(0.5 + (b - r) / 255 * 0.9, 0.06, 0.94);
    var mag = [255, 41, 158], vio = [138, 44, 255], t = accentMix;
    var nr = Math.round(mag[0] + (vio[0] - mag[0]) * t);
    var ng = Math.round(mag[1] + (vio[1] - mag[1]) * t);
    var nb = Math.round(mag[2] + (vio[2] - mag[2]) * t);
    try {
      document.documentElement.style.setProperty('--neon', 'rgb(' + nr + ',' + ng + ',' + nb + ')');
      document.documentElement.style.setProperty('--neon-soft', 'rgba(' + nr + ',' + ng + ',' + nb + ',.42)');
    } catch (e) {}
  }

  function ready(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {}
  }

  function resize(){
    var w = window.innerWidth | 0, h = window.innerHeight | 0;
    if (!w || !h || !isFinite(w) || !isFinite(h)) { w = 1440; h = 900; }
    if (w < 200 || h < 120) { w = 1440; h = 900; }
    W = w; H = h;
    DPR = Math.min(window.devicePixelRatio || 1.75, 2);
    /* 拼像素总量封顶，4K 屏也不掉帧 */
    var px = w * h * DPR * DPR, CAP = 3100000;
    if (px > CAP) DPR = Math.sqrt(CAP / (w * h));
    gcv.width = Math.max(1, Math.round(w * DPR));
    gcv.height = Math.max(1, Math.round(h * DPR));
    gcv.style.width = w + 'px';
    gcv.style.height = h + 'px';
    var fdp = Math.min(DPR, 1.4);
    cv.width = Math.max(1, Math.round(w * fdp));
    cv.height = Math.max(1, Math.round(h * fdp));
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(fdp, 0, 0, fdp, 0, 0);
  }

  function setMode(){
    gcv.hidden = !GL;
    cv.hidden = !!GL;
  }

  function fmtTime(s){
    s = clamp(num(s, 0), 0, 86400);
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function buildLines(payload){
    var src = (payload && payload.lines) || [];
    LINES = [];
    DUR = clamp(num(payload && payload.duration, 0), 0, 86400);
    for (var i = 0; i < src.length; i++) {
      var l = src[i] || {};
      var txt = (typeof l.text === 'string' ? l.text : '').replace(/^\s+|\s+$/g, '');
      if (!txt) continue;
      var t = clamp(num(l.t, 0), 0, 86400);
      var dur = clamp(num(l.dur, 0), 0, 3600);
      if (!dur) {
        dur = i + 1 < src.length
          ? Math.max(1.4, clamp(num(src[i + 1].t, t + 3.6), t, 86400) - t)
          : 3.6;
      }
      var chs = null, raw = l.chars;
      if (raw && raw.length) {
        chs = [];
        for (var j = 0; j < raw.length; j++) {
          var c = raw[j];
          if (!c) continue;
          var cc = typeof c.c === 'string' ? c.c : (typeof c.c === 'number' ? String(c.c) : '');
          if (!cc) continue;
          chs.push({ c: cc, t: clamp(num(c.t, t), 0, 86400) });
        }
        if (!chs.length) chs = null;
      }
      LINES.push({ t: t, dur: dur, text: txt, chars: chs, timing: null });
    }
    LINES.sort(function(a, b){ return a.t - b.t; });
    if (!DUR) DUR = LINES.length ? (LINES[LINES.length - 1].t + LINES[LINES.length - 1].dur) : 0;
    st.idx = -1; st.text = '';
    document.body.classList.toggle('no-lyrics', !LINES.length);
    if (elRe) elRe.textContent = DUR ? ('Re 3.3 × 10⁵ · T ' + fmtTime(DUR)) : 'Re 3.3 × 10⁵';
  }

  function idxAt(t){
    if (!LINES.length) return -1;
    var lo = 0, hi = LINES.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (LINES[mid].t <= t + 1e-4) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  /* 逐字时序：YRC 用它自带的；LRC 按句长均分 */
  function timingOf(L){
    if (L.timing) return L.timing;
    var txt = L.text, n = txt.length, out = [], i;
    var span = Math.max(0.4, num(L.dur, 3.6));
    if (L.chars && L.chars.length) {
      var q = L.chars, qi = 0, guard = 0;
      for (i = 0; i < n; i++) {
        var ch = txt.charAt(i), hit = null;
        while (qi < q.length && guard++ < q.length + 4) {
          var cand = q[qi];
          if (!cand.c) { qi++; continue; }
          if (cand.c === ch || cand.c.charAt(0) === ch ||
              (/\s/.test(ch) && /^\s+$/.test(cand.c))) { hit = cand; qi++; break; }
          qi++;
        }
        out.push({ c: ch, t: hit ? hit.t : L.t + span * (i / Math.max(1, n)) });
      }
    } else {
      for (i = 0; i < n; i++) out.push({ c: txt.charAt(i), t: L.t + span * (i / Math.max(1, n)) });
    }
    L.timing = out;
    return out;
  }

  /* 长句不溢出：先按字数降一档，再按宽度收，固定次数上限 */
  function fitLine(){
    if (!lnCur) return;
    lnCur.style.fontSize = '';
    var n = (lnCur.textContent || '').length;
    var base = parseFloat(window.getComputedStyle(lnCur).fontSize) || 22;
    if (n > 26) {
      var f = Math.max(0.56, 26 / n);
      base = base * f;
      lnCur.style.fontSize = base.toFixed(1) + 'px';
    }
    var pw = lnCur.parentNode ? lnCur.parentNode.clientWidth : 0;
    if (!pw) return;
    var maxW = pw - 2, guard = 0;
    while (guard++ < 12) {
      if (lnCur.scrollWidth <= maxW || base <= 12) break;
      base *= 0.9;
      lnCur.style.fontSize = base.toFixed(1) + 'px';
    }
  }

  function setLine(i){
    st.idx = i;
    if (i < 0 || !LINES[i]) {
      st.text = '';
      if (lnCur) lnCur.textContent = '';
      if (lnPrev) lnPrev.textContent = '';
      if (lnNext) lnNext.textContent = '';
      st.spans = []; st.litN = -1;
      return;
    }
    var L = LINES[i];
    st.text = L.text || '';
    if (lnPrev) lnPrev.textContent = i > 0 ? LINES[i - 1].text : '';
    if (lnNext) lnNext.textContent = i + 1 < LINES.length ? LINES[i + 1].text : '';
    var tm = timingOf(L), fr = document.createDocumentFragment();
    st.spans = new Array(tm.length);
    st.litN = -1;
    for (var k = 0; k < tm.length; k++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = tm[k].c === ' ' ? '\u00a0' : tm[k].c;
      fr.appendChild(s);
      st.spans[k] = s;
    }
    if (lnCur) { lnCur.textContent = ''; lnCur.appendChild(fr); }
    fitLine();
    if (lnCur) {
      lnCur.classList.remove('pop');
      void lnCur.offsetWidth;          /* 强制回流，让入场动画能重播 */
      lnCur.classList.add('pop');
    }
  }

  function updateChars(t){
    var L = LINES[st.idx];
    if (!L || !st.spans || !st.spans.length) return;
    var tm = L.timing || timingOf(L), n = 0, k;
    for (k = 0; k < tm.length; k++) if (t >= tm[k].t) n = k + 1;
    if (n === st.litN) return;
    if (n > st.litN) {
      for (k = st.litN < 0 ? 0 : st.litN; k < n; k++) st.spans[k].className = 'ch on';
    } else {
      for (k = Math.max(0, n); k < st.litN; k++) st.spans[k].className = 'ch';
    }
    st.litN = n;
  }

  function setSong(p){
    var s = (p && p.song) || {};
    var name = typeof s.name === 'string'
      ? s.name.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '') : '';
    var ar = s.artists, arTxt = '';
    if (Array.isArray(ar)) {
      var tmp = [];
      for (var i = 0; i < ar.length; i++) {
        if (typeof ar[i] !== 'string') continue;
        var a = ar[i].replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
        if (a) tmp.push(a);
      }
      arTxt = tmp.join(' / ');
    } else if (typeof ar === 'string') {
      arTxt = ar.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    }
    if (elTitle) elTitle.textContent = name || '未知曲目';
    if (elMeta) elMeta.textContent = (arTxt || '未知艺术家') + (DUR ? ' · ' + fmtTime(DUR) : '');
  }

  /* ================= 视觉内核：卡门涡街 + 铬球 ================= */
  var VERT = 'attribute vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';

  var FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2  uRes;
uniform float uAspect;
uniform float uTime;
uniform float uBeat;
uniform float uBass;
uniform float uMid;
uniform float uAccentMix;
uniform float uReduce;
uniform vec3  uAccent;

#define NV 7

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

/* 黑白平行条纹：三角波 + 按像素宽度解析抗锯齿 */
float stripes(vec2 q, float aa){
  float f = (q.y + q.x * 0.14) * 44.0;
  float tri = abs(fract(f) - 0.5) * 2.0;
  return smoothstep(0.5 - aa, 0.5 + aa, tri);
}

/* 卡门涡街：交错排列的涡旋，向下游逐步发散、衰减 */
vec2 street(vec2 p, float t, out float glow){
  vec2 disp = vec2(0.0);
  glow = 0.0;
  float x0 = uAspect * 0.5 + 0.185;
  float y0 = 0.52;
  float fx = clamp(uAspect / 1.55, 0.34, 1.0);
  /* 全街共用一次正弦，省掉每涡旋的三角函数开销 */
  float wob = sin(t * 0.55) * 0.012;
  float wb2 = cos(t * 0.42) * 0.010;
  float rmf = mix(1.0, 0.45, uReduce);
  for (int i = 0; i < NV; i++){
    float s  = float(i);
    float sg = (mod(s, 2.0) < 0.5) ? 1.0 : -1.0;
    float pr = s / float(NV - 1);
    float cx = x0 + s * (0.115 + 0.062 * pr) * fx + wob * (1.0 + 0.35 * s);
    float cy = y0 + sg * (0.052 + pr * 0.17) + wb2 * sg;
    vec2  d  = p - vec2(cx, cy);
    float r2 = dot(d, d);
    float r  = sqrt(r2) + 1e-4;
    float amp = 0.0012 * (0.65 + 0.7 * uBass) * (1.0 - 0.42 * pr) * rmf;
    vec2  dir = vec2(-d.y, d.x) / r;
    disp += dir * (amp / (r + 0.05));
    float g = 1.0 / (1.0 + r2 * 1500.0);
    glow += g * g * (0.55 + 0.9 * uBeat) * (1.0 - 0.42 * pr);
  }
  return disp;
}

void main(){
  vec2  p  = gl_FragCoord.xy / uRes.y;
  float as = uAspect;
  vec2  c  = vec2(as * 0.5, 0.52);
  float R  = 0.163;

  float glow;
  vec2 disp = street(p, uTime, glow);
  disp.y += 0.0030 * sin(p.x * 8.0 - uTime * 0.5) * (0.55 + 0.6 * uMid) * mix(1.0, 0.35, uReduce);
  disp.x += 0.0018 * sin(p.y * 6.0 + uTime * 0.35) * mix(1.0, 0.35, uReduce);

  vec2  q  = p + disp;
  float aa = clamp(44.0 * 1.7 / uRes.y, 0.06, 0.42);

  float sg = stripes(q, aa);
  float sr = stripes(q + vec2(0.0018, 0.0), aa);
  float sb = stripes(q - vec2(0.0018, 0.0), aa);

  vec3 dark  = vec3(0.026, 0.019, 0.040);
  vec3 light = vec3(0.952, 0.938, 0.982);
  vec3 col   = mix(dark, light, vec3(sr, sg, sb));

  vec3 violet  = vec3(0.55, 0.18, 1.0);
  vec3 magenta = vec3(1.0, 0.16, 0.62);
  vec3 neon    = mix(magenta, violet, clamp(uAccentMix, 0.0, 1.0));

  float gl2 = clamp(glow, 0.0, 1.6);
  col = mix(col, mix(dark, vec3(0.92, 0.55, 1.0), sg) * neon * 1.9, clamp(gl2 * 0.8, 0.0, 0.9));
  col += neon * gl2 * 0.42;

  /* ---- 液态铬球：把被扰动的条纹场当环境贴图反射 ---- */
  vec2  d  = p - c;
  float rr = length(d);
  if (rr < R + 0.006){
    float zi  = max(R * R - rr * rr, 0.0);
    vec3  n   = vec3(d / R, sqrt(zi) / R);
    vec3  rfl = reflect(vec3(0.0, 0.0, -1.0), n);
    vec2  ep  = p + rfl.xy * vec2(0.15, 0.21) + disp * 0.5;
    float env = stripes(ep, aa);
    float sky = clamp(rfl.y * 0.5 + 0.5, 0.0, 1.0);
    float ch  = mix(0.05, 1.0, env) * mix(0.42, 1.0, pow(sky, 1.35));
    ch += (1.0 - smoothstep(0.0, 0.035, abs(rfl.y - 0.04))) * 0.55;
    vec3 scol = vec3(ch) * vec3(0.97, 0.955, 1.0);
    vec3 L    = normalize(vec3(-0.5, 0.68, 0.5));
    float sp  = pow(max(dot(normalize(rfl), L), 0.0), 70.0);
    scol += vec3(1.0) * sp * (1.05 + 0.7 * uBeat);
    float fres = pow(1.0 - clamp(n.z, 0.0, 1.0), 2.6);
    scol += neon * fres * (0.30 + 0.55 * uBeat);
    scol += uAccent * fres * 0.10;
    scol *= mix(0.70, 1.0, smoothstep(-0.95, 0.35, n.y));
    float edge = 1.0 - smoothstep(R - 0.0022, R, rr);
    col = mix(col, scol, edge);
    col += neon * (1.0 - smoothstep(0.0, 0.005, abs(rr - R))) * 0.22;
  }

  /* ---- 涡核霓虹辉光（压在球上面） ---- */
  col += neon * clamp(glow, 0.0, 1.4) * 0.5;
  col += vec3(1.0, 0.92, 1.0) * pow(clamp(glow, 0.0, 1.0), 3.0) * 0.3;

  /* ---- 后处理：暗角 / 颗粒 / 扫描线 ---- */
  vec2  vp  = (p - vec2(as * 0.5, 0.5)) * vec2(1.0, 1.12);
  float vig = 1.0 - smoothstep(0.28, 1.15, length(vp));
  col *= mix(0.45, 1.0, vig);
  float gn = hash21(gl_FragCoord.xy * 0.7 + fract(uTime * 0.37) * 91.0);
  col += (gn - 0.5) * mix(0.055, 0.02, uReduce);
  col *= 1.0 - 0.05 * step(0.5, fract(gl_FragCoord.y * 0.5));

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  var GL = null, gl = null;

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
    return s;
  }

  function glInit(){
    try {
      gl = gcv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false }) ||
           gcv.getContext('experimental-webgl', { alpha: false, antialias: false, depth: false });
    } catch (e) { gl = null; }
    if (!gl) return null;
    try {
      var vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, FRAG);
      if (!vs || !fs) return null;
      var prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
      gl.useProgram(prog);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      var u = {};
      var names = ['uRes', 'uAspect', 'uTime', 'uBeat', 'uBass', 'uMid',
                   'uAccentMix', 'uReduce', 'uAccent'];
      for (var i = 0; i < names.length; i++) u[names[i]] = gl.getUniformLocation(prog, names[i]);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);
      return { prog: prog, u: u };
    } catch (e) { return null; }
  }

  function glRender(){
    var u = GL.u;
    gl.viewport(0, 0, gcv.width, gcv.height);
    gl.useProgram(GL.prog);
    if (u.uRes) gl.uniform2f(u.uRes, gcv.width, gcv.height);
    if (u.uAspect) gl.uniform1f(u.uAspect, gcv.width / Math.max(1, gcv.height));
    if (u.uTime) gl.uniform1f(u.uTime, visT);
    if (u.uBeat) gl.uniform1f(u.uBeat, pulse);
    if (u.uBass) gl.uniform1f(u.uBass, lvl.bass);
    if (u.uMid) gl.uniform1f(u.uMid, lvl.mid);
    if (u.uAccentMix) gl.uniform1f(u.uAccentMix, accentMix);
    if (u.uReduce) gl.uniform1f(u.uReduce, rm ? 1 : 0);
    if (u.uAccent) gl.uniform3f(u.uAccent, ACC[0], ACC[1], ACC[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return true;
  }

  /* 无 WebGL 时的降级：几何条纹 + 径向球体，仍然出画 */
  function drawFallback(){
    var per = Math.max(8, H / 30), amp = per * 1.1;
    ctx.fillStyle = '#07050c';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#f1eef7';
    ctx.lineWidth = per * 0.54;
    ctx.lineCap = 'butt';
    for (var y = -per * 2; y < H + per * 2; y += per) {
      ctx.beginPath();
      for (var x = 0; x <= W + 16; x += 16) {
        var k = x / Math.max(W, 1);
        var yy = y + Math.sin(k * 7.4 - visT * 0.9) * amp * 0.5 +
                     Math.cos(k * 3.1 + visT * 0.5) * amp * 0.28;
        if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    var cx = W * 0.5, cy = H * 0.48, R = H * 0.163;
    var g1 = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.45, R * 0.05, cx, cy, R * 1.02);
    g1.addColorStop(0, '#ffffff');
    g1.addColorStop(0.35, '#b9b4c9');
    g1.addColorStop(0.62, '#14101d');
    g1.addColorStop(1, '#05030a');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
    var g2 = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.5);
    g2.addColorStop(0, 'rgba(196,86,255,.5)');
    g2.addColorStop(1, 'rgba(196,86,255,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.5, 0, Math.PI * 2);
    ctx.fill();
    for (var i = 0; i < 7; i++) {
      var vx = cx + R * 1.4 + i * W * 0.055, vy = cy + (i % 2 ? 1 : -1) * H * (0.06 + i * 0.02);
      var g3 = ctx.createRadialGradient(vx, vy, 0, vx, vy, H * 0.09);
      g3.addColorStop(0, 'rgba(255,64,180,.32)');
      g3.addColorStop(0.5, 'rgba(150,60,255,.14)');
      g3.addColorStop(1, 'rgba(150,60,255,0)');
      ctx.fillStyle = g3;
      ctx.beginPath();
      ctx.arc(vx, vy, H * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render(){
    if (GL) {
      try { glRender(); return; } catch (e) { GL = null; setMode(); }
    }
    drawFallback();
  }

  function frame(ts){
    var t0 = performance.now();
    if (!readySent) ready();   /* 首帧再兜一次：播放器等 ready 才发 init */
    var now = ts || performance.now();
    if (st.playing) st.t = baseT + (now - baseStamp) / 1000;
    var dt = last ? Math.min(0.12, Math.max(0, (now - last) / 1000)) : 0.016;
    last = now;
    visT += dt * (st.playing ? 1 : 0.32) * (rm ? 0.4 : 1);
    pulse *= Math.exp(-dt * 5.0);
    var k = 1 - Math.exp(-dt * 6.0);
    lvl.bass += (tgt.bass - lvl.bass) * k;
    lvl.mid += (tgt.mid - lvl.mid) * k;
    lvl.treble += (tgt.treble - lvl.treble) * k;

    var i = idxAt(st.t);
    if (i !== st.idx) setLine(i);
    updateChars(st.t);
    if (elLamp && Math.abs(pulse - lampP) > 0.03) {
      lampP = pulse;
      elLamp.style.transform = 'scale(' + (1 + pulse * 1.15).toFixed(2) + ')';
      elLamp.style.opacity = (0.5 + pulse * 0.5).toFixed(2);
    }
    if (elBar && DUR > 0) {
      var pc = Math.round(clamp(st.t / DUR, 0, 1) * 100);
      if (pc !== barP) { barP = pc; elBar.style.width = pc + '%'; }
    }
    render();
    st.frames++;
    st.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    if (d.type === 'init') {
      var p = d.payload || {};
      setAccent(p.accent);
      buildLines(p);
      setSong(p);
      /* 重发 init（换歌 / 歌词晚到 / 取色完成）不许把时钟打回 0 */
      baseT = st.t; baseStamp = performance.now();
      st.playing = true;
      setLine(idxAt(st.t));
      st.err = '';
    } else if (d.type === 'tick') {
      var tp = d.payload || {};
      /* 无条件采纳：拖进度条 / 切歌的大跳变必须立刻跟上 */
      if (isFinite(+tp.time)) {
        baseT = Math.max(0, +tp.time);
        baseStamp = performance.now();
        st.t = baseT;
      }
      if (typeof tp.playing === 'boolean') st.playing = tp.playing;
    } else if (d.type === 'beat') {
      var bp = d.payload || {};
      pulse = Math.max(pulse, clamp(num(bp.level, 0.55), 0, 1));
    } else if (d.type === 'live') {
      var lp = d.payload || {};
      tgt.bass = clamp(num(lp.bass, tgt.bass), 0, 1);
      tgt.mid = clamp(num(lp.mid, tgt.mid), 0, 1);
      tgt.treble = clamp(num(lp.treble, tgt.treble), 0, 1);
      if (typeof lp.playing === 'boolean') st.playing = lp.playing;
    }
  });

  window.__stage = function(){
    return { lines: LINES.length, idx: st.idx, t: st.t, playing: st.playing,
             frames: st.frames, js: st.js, err: st.err, text: st.text, gl: !!GL, rm: rm };
  };

  try { rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { rm = false; }

  resize();
  try { GL = glInit(); } catch (e) { GL = null; }
  setMode();
  gcv.addEventListener('webglcontextlost', function(e){
    if (e && e.preventDefault) e.preventDefault();
    GL = null;
    setMode();
  }, false);
  baseStamp = performance.now();
  requestAnimationFrame(frame);
  ready();
  setTimeout(ready, 260);
  setTimeout(ready, 1100);
})();
</script>
