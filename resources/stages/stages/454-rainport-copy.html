<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雨港備忘</title>
<style>
  :root{
    --ink:#12161a;
    --unsung:#565950;
    --line:#2f3a40;
    --accent:#6c7c78;
    --seal:#8c2f24;
    --fs:clamp(25px,3.6vw,52px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0f10;
    -webkit-font-smoothing:antialiased}
  #stagebody{position:fixed;inset:0;overflow:hidden;
    background:#d9d6cb;font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif}

  #bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  #glow{position:absolute;inset:0;z-index:1;pointer-events:none;transform:translateZ(0)}
  #glow i{position:absolute;display:block;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,240,214,.85),rgba(240,196,148,.34) 46%,rgba(226,168,126,0) 100%);
    will-change:transform,opacity;mix-blend-mode:screen}
  @keyframes drift{
    0%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(2.2vw,-1.6vh,0) scale(1.06)}
    100%{transform:translate3d(0,0,0) scale(1)}
  }
  @media (prefers-reduced-motion:reduce){
    #glow i{animation-duration:60s !important}
  }
  #warm{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(70% 55% at 78% 88%,rgba(140,60,40,.20),rgba(140,60,40,0) 70%);
    opacity:.55;transition:opacity .5s linear;
    mix-blend-mode:multiply}
  #vig{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(135% 115% at 40% 44%,rgba(0,0,0,0) 46%,rgba(26,30,32,.24) 100%),
      linear-gradient(90deg,rgba(20,24,26,.16) 0%,rgba(20,24,26,0) 16%,rgba(20,24,26,0) 84%,rgba(20,24,26,.14) 100%)}
  #grain{position:absolute;z-index:2;left:-6%;top:-6%;width:112%;height:112%;
    pointer-events:none;opacity:.5;background-repeat:repeat;background-size:220px 220px;
    will-change:transform}
  #fiber{position:absolute;z-index:2;left:-4%;top:-4%;width:108%;height:108%;
    pointer-events:none;opacity:.34;background-repeat:repeat;background-size:420px 420px;
    will-change:transform}
  #fold{position:absolute;left:0;right:0;top:0;height:100%;z-index:3;pointer-events:none;
    display:flex;justify-content:center;gap:clamp(60px,11vw,190px);opacity:.5}
  #fold i{display:block;width:1px;height:100%;
    background:linear-gradient(to bottom,rgba(48,60,66,0) 0%,rgba(48,60,66,.34) 22%,rgba(48,60,66,.20) 62%,rgba(48,60,66,0) 100%)}

  /* ------- 竖排文案 ------- */
  #copy{position:absolute;z-index:4;left:clamp(12px,2.6vw,40px);top:14%;height:58%;
    display:flex;flex-direction:row-reverse;gap:clamp(9px,1.3vw,22px);
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:clamp(10px,1.02vw,15px);line-height:2.05;letter-spacing:.34em;
    color:#3f4745;opacity:.94}
  #copy div{white-space:nowrap;padding-top:1px}
  #copy div:first-child{color:#2c3436}
  #seal{margin-top:clamp(10px,2vh,26px);width:1.55em;height:1.55em;border:1px solid var(--seal);
    color:var(--seal);font-size:clamp(9px,.86vw,13px);line-height:1.5;text-align:center;
    letter-spacing:0;opacity:.86;background:rgba(255,255,255,.10);writing-mode:vertical-rl;
    display:flex;align-items:center;justify-content:center;padding:1px}

  /* ------- 歌词本体 ------- */
  #lyricStage{position:absolute;z-index:5;
    left:clamp(70px,12vw,200px);right:clamp(18px,4vw,80px);top:50%;
    max-width:min(64vw,900px);transform:translateY(-52%)}
  #lyricStage.narrow{left:clamp(18px,6vw,80px);right:clamp(16px,5vw,70px);top:47%;
    max-width:none}

  #lyric{font-size:var(--fs);line-height:1.82;letter-spacing:.075em;
    color:var(--ink);text-align:left;word-break:break-word;overflow-wrap:anywhere;
    transition:opacity .42s ease,transform .42s ease}
  #lyric.swap{opacity:0;transform:translateY(7px)}
  .ch{color:var(--unsung);transition:color .18s linear;white-space:pre-wrap}
  .ch.on{color:var(--ink)}
  .ch.sp{display:inline-block;min-width:.32em}

  #nextline{margin-top:.55em;font-size:calc(var(--fs) * .5);line-height:1.9;
    letter-spacing:.12em;color:#5d6159;opacity:.78;min-height:1.2em;text-align:left;
    transition:opacity .42s ease}
  #nextline.swap{opacity:0}

  #empty{margin-top:.2em;font-size:calc(var(--fs) * .62);color:#3d4341;letter-spacing:.22em;line-height:2;
    display:none}
  #empty .dim{display:block;font-size:.55em;letter-spacing:.5em;color:#6c6f66;margin-top:.9em}

  /* ------- 页脚信息 / 进度 ------- */
  #meta{position:absolute;z-index:6;left:clamp(70px,12vw,200px);right:clamp(18px,7.5vw,150px);
    bottom:clamp(16px,4.2vh,42px);display:flex;align-items:flex-end;justify-content:space-between;
    gap:14px;font-size:clamp(9px,.86vw,12.5px);letter-spacing:.30em;color:#414845;
    font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}
  #meta .l{max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #meta .r{white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.16em;color:#565d58}
  #bar{position:absolute;z-index:6;left:clamp(70px,12vw,200px);right:clamp(18px,7.5vw,150px);
    bottom:clamp(9px,1.9vh,18px);height:1px;background:rgba(38,48,52,.22)}
  #barFill{height:100%;width:0%;background:#3b4340;transform-origin:left center}
  #barMark{position:absolute;top:-3px;width:1px;height:7px;background:var(--seal);
    left:0%;opacity:.85}

  @media (max-width:760px),(max-aspect-ratio:1/1){
    #copy{display:none}
    #lyricStage{left:clamp(18px,6vw,80px);right:clamp(16px,5vw,70px)}
    #meta,#bar{left:clamp(18px,6vw,80px);right:clamp(16px,5vw,70px)}
    #meta .l{max-width:70%}
  }
  @media (max-width:420px){
    #lyric{line-height:1.95;letter-spacing:.05em}
  }

  /* 雨幕：预渲染 tile + CSS 位移，零每帧 JS */
  #rainA,#rainB{position:absolute;left:0;right:0;top:-620px;height:calc(100% + 1240px);z-index:2;
    pointer-events:none;background-repeat:repeat;will-change:transform;
    background-size:240px 620px}
  #rainA{opacity:.50;animation:rainfall 2.4s linear infinite}
  #rainB{opacity:.28;animation:rainfall 3.7s linear infinite;
    background-size:210px 380px}
  @keyframes rainfall{from{transform:translate3d(0,-620px,0)}to{transform:translate3d(0,0,0)}}
  @media (prefers-reduced-motion:reduce){
    #rainA,#rainB{animation-duration:14s;opacity:.26}
  }
</style>
</head>
<body>
<div id="stagebody">
  <canvas id="bg"></canvas>
  <div id="glow"></div>
  <div id="warm"></div>
  <div id="grain"></div>
  <div id="fiber"></div>
  <div id="rainA"></div>
  <div id="rainB"></div>
  <div id="vig"></div>
  <div id="fold"><i></i><i></i><i></i></div>

  <div id="copy">
    <div>雨把整座城市洗成一張底片</div>
    <div>我在人潮的縫裡站了很久</div>
    <div id="seal">備忘</div>
  </div>

  <div id="lyricStage">
    <div id="lyric"></div>
    <div id="nextline"></div>
    <div id="empty">這首歌沒有留下文字<span class="dim">靜 聽</span></div>
  </div>

  <div id="meta">
    <div class="l" id="songInfo">—</div>
    <div class="r"><span id="clock">00:00</span> / <span id="total">00:00</span></div>
  </div>
  <div id="bar"><div id="barFill"></div><div id="barMark"></div></div>
</div>
<script>
(function(){
  'use strict';

  var W = 1440, H = 900, dpr = 1;
  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
    text: '', gl: false, rm: false, dur: 0, sung: -1, beatLvl: 0, bass: 0,
    name: '', artist: '', cover: ''
  };
  window.__stage = function(){
    return { lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
             frames: S.frames, js: S.js, err: S.err, text: S.text,
             gl: false, rm: S.rm };
  };

  var cv = document.getElementById('bg');
  var ctx = cv.getContext('2d', { alpha: false });
  var lyrEl = document.getElementById('lyric');
  var nextEl = document.getElementById('nextline');
  var emptyEl = document.getElementById('empty');
  var songInfo = document.getElementById('songInfo');
  var clockEl = document.getElementById('clock');
  var totalEl = document.getElementById('total');
  var barFill = document.getElementById('barFill');
  var barMark = document.getElementById('barMark');
  var warmEl = document.getElementById('warm');
  var stageLy = document.getElementById('lyricStage');
  var root = document.documentElement;

  var scene = document.createElement('canvas');   // static 场景，resize 时重建
  var sctx = scene.getContext('2d');
  var bokeh = null;
  var paperTile = document.createElement('canvas');// 胶片颗粒 tile
  var fiberTile = document.createElement('canvas');
  var rainTile = document.createElement('canvas'); // 雨幕 tile
  var grainPats = [];

  var baseGrad = null;
  var grainEl = document.getElementById('grain');
  var fiberEl = document.getElementById('fiber');
  var rainAEl = document.getElementById('rainA');
  var rainBEl = document.getElementById('rainB');
  var glowEl = document.getElementById('glow');

  function clampNum(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function fmt(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return pad2(m) + ':' + pad2(s);
  }

  /* ---------------- 纹理与场景预渲染 ---------------- */
  function buildTiles(){
    var n = 220, i, d;
    paperTile.width = n; paperTile.height = n;
    var p = paperTile.getContext('2d');
    var id = p.createImageData(n, n);
    d = id.data;
    for (i = 0; i < d.length; i += 4){
      var v = Math.random();
      var g = v < 0.5 ? 0 : 255;
      d[i] = d[i+1] = d[i+2] = g;
      d[i+3] = Math.floor(Math.random() * 46);
    }
    p.putImageData(id, 0, 0);

    var f = 320;
    fiberTile.width = f; fiberTile.height = f;
    var fx = fiberTile.getContext('2d');
    fx.clearRect(0, 0, f, f);
    fx.strokeStyle = 'rgba(70,64,52,.16)';
    fx.lineWidth = 1;
    for (i = 0; i < 40; i++){
      var x = Math.random() * f, y = Math.random() * f;
      var len = 6 + Math.random() * 30, ang = (Math.random() - 0.5) * 0.5;
      fx.beginPath(); fx.moveTo(x, y);
      fx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      fx.stroke();
    }
    for (i = 0; i < 260; i++){
      fx.fillStyle = 'rgba(58,54,44,' + (0.05 + Math.random() * 0.14).toFixed(3) + ')';
      fx.fillRect(Math.random() * f, Math.random() * f, 1, 1);
    }

    // 雨幕 tile：细斜线，上下左右无缝（平铺时首尾对齐）
    var rw = 240, rh = 620;
    rainTile.width = rw; rainTile.height = rh;
    var r = rainTile.getContext('2d');
    r.clearRect(0, 0, rw, rh);
    for (var q = 0; q < 54; q++){
      var rx = Math.random() * rw, ry = Math.random() * rh;
      var rl = 26 + Math.random() * 62;
      var dx = -rl * 0.19;
      r.strokeStyle = 'rgba(68,84,90,' + (0.14 + Math.random() * 0.30).toFixed(3) + ')';
      r.lineWidth = Math.random() < 0.18 ? 1.5 : 0.9;
      r.beginPath(); r.moveTo(rx, ry); r.lineTo(rx + dx, ry + rl); r.stroke();
      // 越出边界的部分补到另一侧，消除平铺接缝
      if (ry + rl > rh){ r.beginPath(); r.moveTo(rx, ry - rh); r.lineTo(rx + dx, ry - rh + rl); r.stroke(); }
      if (rx + dx < 0){ r.beginPath(); r.moveTo(rx + rw, ry); r.lineTo(rx + rw + dx, ry + rl); r.stroke(); }
    }
  }

  function buildScene(){
    scene.width = Math.max(2, Math.round(W * dpr));
    scene.height = Math.max(2, Math.round(H * dpr));
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, W, H);

    // 天光：上冷下暖的旧纸
    baseGrad = sctx.createLinearGradient(W * 0.08, 0, W * 0.82, H);
    baseGrad.addColorStop(0, '#e7e3d6');
    baseGrad.addColorStop(0.46, '#dad8cd');
    baseGrad.addColorStop(0.78, '#cdccc1');
    baseGrad.addColorStop(1, '#bcbcb2');
    sctx.fillStyle = baseGrad;
    sctx.fillRect(0, 0, W, H);

    // 远处建筑：竖列冷灰，边缘柔
    var bw = W * 0.14, bx = W * 0.60;
    for (var k = 0; k < 4; k++){
      var x0 = bx + k * bw * 0.92;
      var g = sctx.createLinearGradient(x0, 0, x0 + bw, 0);
      var a = 0.10 + k * 0.022;
      g.addColorStop(0, 'rgba(74,84,86,0)');
      g.addColorStop(0.45, 'rgba(74,84,86,' + a.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(74,84,86,0)');
      sctx.fillStyle = g;
      sctx.fillRect(x0, 0, bw, H * 0.66);
    }

    // 天桥栏杆：细横线 + 立柱
    var railY = H * 0.705;
    sctx.strokeStyle = 'rgba(44,56,60,.30)';
    sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(0, railY); sctx.lineTo(W, railY); sctx.stroke();
    sctx.strokeStyle = 'rgba(44,56,60,.17)';
    sctx.beginPath(); sctx.moveTo(0, railY + H * 0.032); sctx.lineTo(W, railY + H * 0.032); sctx.stroke();
    var post = Math.max(46, W / 26);
    sctx.strokeStyle = 'rgba(44,56,60,.20)';
    for (var px = 0; px < W + post; px += post){
      sctx.beginPath(); sctx.moveTo(px, railY); sctx.lineTo(px, railY + H * 0.032); sctx.stroke();
    }

    // 桥面下缘：渐隐的暗带
    var under = sctx.createLinearGradient(0, railY + H * 0.033, 0, H);
    under.addColorStop(0, 'rgba(46,52,52,.16)');
    under.addColorStop(0.55, 'rgba(46,52,52,.05)');
    under.addColorStop(1, 'rgba(46,52,52,.14)');
    sctx.fillStyle = under;
    sctx.fillRect(0, railY + H * 0.033, W, H);

    // 左下湿地面反光
    var wet = sctx.createLinearGradient(0, H * 0.80, W * 0.5, H);
    wet.addColorStop(0, 'rgba(226,224,212,.34)');
    wet.addColorStop(1, 'rgba(226,224,212,0)');
    sctx.fillStyle = wet;
    sctx.fillRect(0, H * 0.78, W * 0.6, H * 0.22);

    buildFigure(railY);
  }

  /* 逆光人影：中画幅失焦的都市知识分子剪影（风衣/高领），只做柔和团块，不用 filter */
  function buildFigure(railY){
    var cx = W * 0.705;
    var baseY = railY + H * 0.012;
    var scale = clampNum(Math.min(W / 1440, H / 900), 0.62, 1.5);

    // 背后的光：让人从纸面里浮出来
    var halo = sctx.createRadialGradient(cx, baseY - H * 0.20, H * 0.02,
                                        cx, baseY - H * 0.20, H * 0.52);
    halo.addColorStop(0, 'rgba(255,252,238,.72)');
    halo.addColorStop(0.55, 'rgba(250,246,230,.26)');
    halo.addColorStop(1, 'rgba(250,246,230,0)');
    sctx.fillStyle = halo;
    sctx.beginPath();
    sctx.ellipse(cx, baseY - H * 0.20, H * 0.50, H * 0.54, 0, 0, Math.PI * 2);
    sctx.fill();

    // 剪影主体：头 + 肩 + 风衣
    var ink = 'rgba(38,46,50,';
    var headR = H * 0.052 * scale;
    var headY = baseY - H * 0.425 * scale;

    // 风衣：上窄下宽
    var coat = sctx.createLinearGradient(cx, headY, cx, baseY);
    coat.addColorStop(0, ink + '0.34)');
    coat.addColorStop(0.5, ink + '0.27)');
    coat.addColorStop(1, ink + '0.12)');
    sctx.fillStyle = coat;
    sctx.beginPath();
    sctx.moveTo(cx - headR * 1.15, headY + headR * 1.5);
    sctx.quadraticCurveTo(cx - headR * 3.1, headY + headR * 4.2, cx - headR * 3.3, baseY);
    sctx.lineTo(cx + headR * 3.3, baseY);
    sctx.quadraticCurveTo(cx + headR * 3.1, headY + headR * 4.2, cx + headR * 1.15, headY + headR * 1.5);
    sctx.closePath();
    sctx.fill();

    // 头：略椭圆，边缘柔（低 alpha 叠两次近似虚焦）
    var head = sctx.createRadialGradient(cx, headY, headR * 0.20, cx, headY, headR * 1.26);
    head.addColorStop(0, ink + '0.40)');
    head.addColorStop(0.62, ink + '0.34)');
    head.addColorStop(1, ink + '0.0)');
    sctx.fillStyle = head;
    sctx.beginPath();
    sctx.ellipse(cx, headY, headR * 1.05, headR * 1.18, 0, 0, Math.PI * 2);
    sctx.fill();

    // 颈部/高领
    sctx.fillStyle = ink + '0.26)';
    sctx.beginPath();
    sctx.ellipse(cx, headY + headR * 1.15, headR * 0.62, headR * 0.60, 0, 0, Math.PI * 2);
    sctx.fill();

    // 右缘轮廓光（浅，替代强高光，避免脏）
    sctx.strokeStyle = 'rgba(255,253,244,.55)';
    sctx.lineWidth = Math.max(1, 1.4 * scale);
    sctx.beginPath();
    sctx.moveTo(cx + headR * 0.95, headY - headR * 0.55);
    sctx.quadraticCurveTo(cx + headR * 1.18, headY + headR * 0.9, cx + headR * 1.55, headY + headR * 2.1);
    sctx.stroke();

    // 地面投影：脚下一抹暗
    var foot = sctx.createRadialGradient(cx, baseY, 1, cx, baseY, H * 0.20);
    foot.addColorStop(0, 'rgba(40,48,50,.24)');
    foot.addColorStop(1, 'rgba(40,48,50,0)');
    sctx.fillStyle = foot;
    sctx.beginPath();
    sctx.ellipse(cx, baseY + H * 0.004, H * 0.20, H * 0.030, 0, 0, Math.PI * 2);
    sctx.fill();
  }

  function resize(){
    try{
      var w = window.innerWidth || 0, h = window.innerHeight || 0;
      if (!(w > 0) || !isFinite(w)) w = 1440;
      if (!(h > 0) || !isFinite(h)) h = 900;
      W = w; H = h;
      dpr = clampNum(window.devicePixelRatio || 1, 1, 2);
      cv.width = Math.max(2, Math.round(W * dpr));
      cv.height = Math.max(2, Math.round(H * dpr));
      cv.style.width = W + 'px';
      cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildScene();

      root.style.setProperty('--fs',
        (clampNum(W * 0.030, 22, 52) * clampNum(H / 900, 0.62, 1.15)).toFixed(1) + 'px');

      if (!grainPats.length){
        grainEl.style.backgroundImage = 'url(' + paperTile.toDataURL('image/png') + ')';
        fiberEl.style.backgroundImage = 'url(' + fiberTile.toDataURL('image/png') + ')';
        rainAEl.style.backgroundImage = 'url(' + rainTile.toDataURL('image/png') + ')';
        rainBEl.style.backgroundImage = 'url(' + rainTile.toDataURL('image/png') + ')';
        grainPats.push(1);
      }
      stageLy.classList.toggle('narrow', W < 760 || W / H < 1.05);
      painted = false;
      paintStatic();
      buildGlow();
    }catch(e){ S.err = String(e && e.message || e); console.error('[454] resize', e); }
  }

  /* ---------------- 逐帧绘制 ---------------- */
  // 只在需要时重绘（场景是静态的），每帧只做极小的动态叠加
  var painted = false;
  function paintStatic(){
    if (painted) return;
    ctx.globalAlpha = 1;
    if (scene.width > 1) ctx.drawImage(scene, 0, 0, W, H);
    else { ctx.fillStyle = '#d9d6cb'; ctx.fillRect(0, 0, W, H); }
    painted = true;
  }

  function buildGlow(){
    while (glowEl.firstChild) glowEl.removeChild(glowEl.firstChild);
    var n = clampNum(Math.round(W / 320), 2, 6);
    for (var i = 0; i < n; i++){
      var el = document.createElement('i');
      var sz = (14 + ((i * 7) % 20)) * (H / 100);
      el.style.width = sz + 'px';
      el.style.height = sz + 'px';
      el.style.left = ((6 + i * 19) % 88) + '%';
      el.style.top = (78 + ((i * 5) % 14)) + '%';
      el.style.opacity = (0.30 + (i % 3) * 0.12).toFixed(2);
      el.style.animation = 'drift ' + (11 + i * 3.7).toFixed(1) + 's ease-in-out infinite';
      el.style.animationDelay = (-i * 2.3).toFixed(1) + 's';
      glowEl.appendChild(el);
    }
  }

  /* ---------------- 歌词 ---------------- */
  var MAXC = 140;
  var chNodes = [], lineDur = 0, lineStart = 0, chTimes = null;

  function countSung(){
    var ln = S.lines[S.idx];
    if (!ln) return 0;
    var n = chNodes.length;
    if (n === 0) return 0;
    var now = S.t;
    if (chTimes && chTimes.length){
      var c = 0;
      for (var i = 0; i < n; i++){
        var ct = chTimes[i];
        if (ct != null && ct <= now + 0.02) c = i + 1; else break;
      }
      return c;
    }
    if (lineDur > 0.15){
      var r = (now - lineStart) / lineDur;
      if (r < 0) r = 0; if (r > 1) r = 1;
      return Math.round(r * n);
    }
    return now >= lineStart ? n : 0;
  }

  function applySung(n, force){
    if (n === S.sung && !force) return;
    var prev = S.sung;
    S.sung = n;
    var lo = Math.min(prev < 0 ? 0 : prev, n), hi = Math.max(prev < 0 ? 0 : prev, n);
    for (var i = lo; i < hi && i < chNodes.length; i++){
      if (i < n) chNodes[i].classList.add('on');
      else chNodes[i].classList.remove('on');
    }
  }

  function renderLine(){
    var ln = S.lines[S.idx] || null;
    lyrEl.classList.add('swap');
    nextEl.classList.add('swap');
    var timer = window.setTimeout(function(){
      lyrEl.classList.remove('swap');
      nextEl.classList.remove('swap');
    }, 40);

    while (lyrEl.firstChild) lyrEl.removeChild(lyrEl.firstChild);
    chNodes.length = 0;
    S.sung = -1;

    if (!ln){
      S.text = '';
      emptyEl.style.display = S.lines.length ? 'none' : 'block';
      nextEl.textContent = '';
      return;
    }
    emptyEl.style.display = 'none';
    S.text = String(ln.text == null ? '' : ln.text);
    lineStart = ln.t;
    lineDur = ln.dur > 0 ? ln.dur : 0;
    chTimes = ln.chars;

    var chars = Array.from(S.text);
    if (chars.length > MAXC) chars = chars.slice(0, MAXC);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < chars.length; i++){
      var sp = document.createElement('span');
      sp.className = 'ch' + (chars[i] === ' ' ? ' sp' : '');
      sp.textContent = chars[i] === ' ' ? '\u00a0' : chars[i];
      frag.appendChild(sp);
      chNodes.push(sp);
    }
    lyrEl.appendChild(frag);
    applySung(countSung(), true);

    var nx = S.lines[S.idx + 1];
    nextEl.textContent = nx && nx.text ? String(nx.text).slice(0, 80) : '';
    void timer;
  }

  function pick(t){
    var best = -1;
    for (var i = 0; i < S.lines.length; i++){
      if (S.lines[i].t <= t + 0.05) best = i; else break;
    }
    return best;
  }

  function sync(){
    var i = pick(S.t);
    if (i !== S.idx){ S.idx = i; renderLine(); return; }
    if (i < 0) return;
    applySung(countSung(), false);
  }

  /* ---------------- 进度 / 元信息 ---------------- */
  var lastClock = '';
  function syncMeta(){
    var d = S.dur > 0 ? S.dur : 0;
    var pct = d > 0 ? clampNum(S.t / d, 0, 1) * 100 : 0;
    barFill.style.width = pct.toFixed(2) + '%';
    barMark.style.left = pct.toFixed(2) + '%';
    var c = fmt(S.t);
    if (c !== lastClock){ lastClock = c; clockEl.textContent = c; }
  }

  function setSong(p){
    var song = p.song || {};
    var nm = song.name ? String(song.name) : '';
    var ar = song.artists;
    if (Array.isArray(ar)) ar = ar.filter(Boolean).map(String).join(' / ');
    else ar = ar ? String(ar) : '';
    S.name = nm; S.artist = ar;
    var txt = nm || ar ? ((nm || '無題') + (ar ? '  —  ' + ar : '')) : '—';
    songInfo.textContent = txt;
    if (isFinite(+p.duration) && +p.duration > 0){
      S.dur = +p.duration;
      totalEl.textContent = fmt(S.dur);
    } else { S.dur = 0; totalEl.textContent = '00:00'; }

    var acc = p.accent;
    if (Array.isArray(acc) && acc.length >= 3){
      var r = clampNum(+acc[0] || 0, 0, 255), g = clampNum(+acc[1] || 0, 0, 255), bb = clampNum(+acc[2] || 0, 0, 255);
      var lum = (0.299 * r + 0.587 * g + 0.114 * bb) / 255;
      var k = lum > 0.72 ? 0.55 : 0.9;
      root.style.setProperty('--accent', 'rgb(' + Math.round(r * k) + ',' + Math.round(g * k) + ',' + Math.round(bb * k) + ')');
      S.acc = [r, g, bb];
    }
  }

  /* ---------------- 消息 ---------------- */
  function onMsg(ev){
    try{
      var d = ev && ev.data;
      if (!d || d.__c100 !== 1) return;
      if (d.type === 'init'){
        var p = d.payload || {};
        setSong(p);
        var arr = Array.isArray(p.lines) ? p.lines : [];
        var out = [];
        var cap = Math.min(arr.length, 1500);
        for (var i = 0; i < cap; i++){
          var l = arr[i];
          if (!l) continue;
          var tt = +l.t;
          if (!isFinite(tt) || tt < 0) tt = 0;
          var dd = +l.dur;
          var txt = l.text == null ? '' : String(l.text);
          var times = null;
          // YRC: chars 是 {c,t} 对象数组，逐字时间必须抽成数字并按字符对齐
          if (Array.isArray(l.chars) && l.chars.length){
            var nch = txt ? txt.length : l.chars.length;
            var tm = new Array(nch);
            var ok = 0;
            for (var k = 0; k < nch; k++){
              var c0 = l.chars[k];
              var vt = c0 && typeof c0 === 'object' ? +c0.t : NaN;
              if (isFinite(vt) && vt >= 0){ tm[k] = vt; ok++; } else tm[k] = null;
            }
            if (ok > 0) times = tm;
          }
          out.push({
            t: tt, dur: isFinite(dd) && dd > 0 ? dd : 0,
            text: txt, chars: times
          });
        }
        out.sort(function(a, b){ return a.t - b.t; });
        S.lines = out;
        S.idx = -2;
        S.sung = -1;
        sync();
        syncMeta();
      } else if (d.type === 'tick'){
        var q = d.payload || {};
        var t = +q.time;
        if (isFinite(t) && t >= 0) S.t = t;
        if (typeof q.playing === 'boolean') S.playing = q.playing;
        sync(); syncMeta();
      } else if (d.type === 'beat'){
        var bp = d.payload || {};
        S.beatLvl = clampNum(+bp.level || 0, 0, 1);
      } else if (d.type === 'live'){
        var lp = d.payload || {};
        S.bass = clampNum(+lp.bass || 0, 0, 1);
        S.beatLvl = clampNum(+lp.level || 0, 0, 1);
        if (typeof lp.playing === 'boolean') S.playing = lp.playing;
      }
    }catch(e){ S.err = String(e && e.message || e); console.error('[454] message', e); }
  }

  /* ---------------- 主循环 ---------------- */
  function loop(now){
    var t0 = performance.now();
    try{
      S.frames++;
      paintStatic();
      // 极轻的动态：底部暖光随低频呼吸（只改一个 opacity，成本可忽略）
      if (!S.rm){
        var o = 0.38 + 0.30 * S.bass + 0.10 * S.beatLvl;
        if (o > 0.98) o = 0.98;
        var os = o.toFixed(2);
        if (os !== S._warm){ S._warm = os; warmEl.style.opacity = os; }
      }
      S.js = Math.round((performance.now() - t0) * 100) / 100;
    }catch(e){ S.err = String(e && e.message || e); console.error('[454] frame', e); }
    requestAnimationFrame(loop);
  }

  /* ---------------- 启动 ---------------- */
  try{
    S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    window.addEventListener('message', onMsg, false);
    window.addEventListener('resize', resize, { passive: true });
    window.addEventListener('orientationchange', resize, { passive: true });
    buildTiles();
    resize();
    ctx.fillStyle = '#d9d6cb'; ctx.fillRect(0, 0, W, H);
    lyrEl.textContent = '';
    emptyEl.style.display = 'none';
    syncMeta();
  }catch(e){ S.err = String(e && e.message || e); console.error('[454] boot', e); }

  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try{ parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch(e){ console.error('[454] ready', e); }
  }
  requestAnimationFrame(function(){
    sendReady();
    requestAnimationFrame(loop);
  });
  setTimeout(sendReady, 1100);
})();
</script>
</body>
</html>
