<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雨冢</title>
<style>
  :root {
    --ink: #04080a;
    --bone: #f0e4cc;
    --ash: #94a29c;
    --accent-rgb: 178, 176, 158;
    --frame-line: rgba(228, 216, 190, 0.22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04080a; }
  body {
    color: var(--bone);
    font-family: "Didot", "Bodoni MT", "Playfair Display", "Optima", Georgia, "Times New Roman",
      "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  /* 暗角与暗房镀色 */
  .veil {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(118% 92% at 50% 38%, rgba(0,0,0,0) 30%, rgba(3,7,9,0.4) 66%, rgba(1,4,6,0.94) 100%),
      radial-gradient(72% 44% at 50% 104%, rgba(2,6,8,0.6), rgba(2,6,8,0) 74%),
      radial-gradient(64% 40% at 50% -8%, rgba(12,20,20,0.66), rgba(12,20,20,0) 70%);
  }
  .scrim {
    position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none; z-index: 1;
    background: linear-gradient(to top, rgba(2,6,8,0.8) 0%, rgba(2,6,8,0.34) 42%, rgba(2,6,8,0) 100%);
  }
  .grain {
    position: fixed; inset: -12%; pointer-events: none; z-index: 4;
    opacity: 0.055; mix-blend-mode: screen; background-repeat: repeat;
    animation: grainShift 1.15s steps(1, end) infinite;
    will-change: transform;
  }
  @keyframes grainShift {
    0% { transform: translate3d(0, 0, 0); }
    20% { transform: translate3d(-1.6%, 0.9%, 0); }
    40% { transform: translate3d(0.9%, -1.4%, 0); }
    60% { transform: translate3d(-0.8%, 1.6%, 0); }
    80% { transform: translate3d(1.4%, -0.7%, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }
  .frame { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .frame svg { width: 100%; height: 100%; display: block; }

  /* 顶部曲名 */
  .head {
    position: fixed; top: 3.4vh; left: 50%; transform: translateX(-50%);
    z-index: 3; text-align: center; max-width: 62vw; pointer-events: none;
    transition: opacity 600ms ease;
  }
  .head .diamond {
    width: 5px; height: 5px; margin: 0 auto 1.5vh; transform: rotate(45deg);
    background: rgba(228, 216, 190, 0.42);
  }
  .head .name {
    font-size: clamp(10px, 0.92vw, 14px); letter-spacing: 0.44em; text-indent: 0.44em;
    color: rgba(240, 228, 204, 0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.35);
  }
  .head .artist {
    margin-top: 0.66vh; font-size: clamp(8.5px, 0.72vw, 11px); letter-spacing: 0.32em; text-indent: 0.32em;
    color: rgba(148, 162, 156, 0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.no-head .head { opacity: 0; }

  /* 纪念椭圆肖像 */
  .medallion {
    position: fixed; top: 8.4vh; right: 5.6vw; z-index: 3; pointer-events: none;
    width: clamp(52px, 5vw, 78px); height: clamp(66px, 6.4vw, 100px);
    opacity: 0; transition: opacity 900ms ease;
  }
  .medallion.is-on { opacity: 0.72; }
  .medallion::before {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 1px solid rgba(228, 216, 190, 0.3);
    box-shadow: 0 0 18px rgba(0,0,0,0.55) inset;
  }
  .medallion::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(228, 216, 190, 0.5); pointer-events: none;
  }
  .medallion img {
    width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover;
    filter: sepia(0.72) grayscale(0.28) contrast(1.12) brightness(0.82);
  }

  /* 歌词 */
  .lyric {
    position: fixed; left: 50%; bottom: 11.5vh; transform: translateX(-50%);
    width: min(76vw, 1010px); z-index: 3; text-align: center; pointer-events: none;
  }
  .line { font-size: clamp(16px, 2.2vw, 36px); line-height: 1.62; letter-spacing: 0.055em; }
  .line--cur {
    color: var(--bone);
    text-shadow: 0 0 1px rgba(var(--accent-rgb), 0.55), 0 0 26px rgba(var(--accent-rgb), 0.3),
                 0 1px 0 rgba(0,0,0,0.55);
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .line--cur.line--dense { font-size: clamp(14px, 1.72vw, 27px); line-height: 1.5; }
  .line--cur.line--tiny { font-size: clamp(12px, 1.42vw, 22px); line-height: 1.45; letter-spacing: 0.03em; }
  .line--prev, .line--next {
    font-size: clamp(11px, 1.06vw, 16px); letter-spacing: 0.09em;
    color: rgba(148, 162, 156, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .line--prev { margin-bottom: 1.7vh; opacity: 0.9; }
  .line--next { margin-top: 2.1vh; opacity: 0.78; }
  .line--prev:empty, .line--next:empty { opacity: 0; }

  .ch { color: rgba(240, 228, 204, 0.4); transition: color 300ms linear, text-shadow 300ms linear; }
  .ch.on {
    color: #fbf1da;
    text-shadow: 0 0 18px rgba(var(--accent-rgb), 0.55), 0 0 2px rgba(255, 248, 232, 0.6);
  }

  /* 无词的空状态 */
  .empty {
    position: absolute; left: 0; right: 0; bottom: 0;
    opacity: 0; transition: opacity 900ms ease; pointer-events: none;
  }
  .empty.is-on { opacity: 1; }
  .empty .rule {
    width: min(38vw, 320px); height: 1px; margin: 0 auto 3.2vh;
    background: linear-gradient(to right, rgba(228,216,190,0), rgba(228,216,190,0.4), rgba(228,216,190,0));
  }
  .empty .note {
    font-size: clamp(14px, 1.3vw, 20px); letter-spacing: 0.42em; text-indent: 0.42em;
    color: rgba(240, 228, 204, 0.66);
  }
  .empty .sub {
    margin-top: 1.6vh; font-size: clamp(9px, 0.78vw, 12px); letter-spacing: 0.34em; text-indent: 0.34em;
    color: rgba(148, 162, 156, 0.55);
  }
  .empty .rule--low {
    margin: 3.2vh auto 0;
    background: linear-gradient(to right, rgba(228,216,190,0), rgba(228,216,190,0.28), rgba(228,216,190,0));
  }
  .empty .wing {
    display: block; width: 46px; height: 46px; margin: 0 auto 2.2vh;
    border-top: 1px solid rgba(228, 216, 190, 0.32);
    border-left: 1px solid rgba(228, 216, 190, 0.32);
    border-radius: 50% 0 0 0; transform: rotate(45deg);
  }

  .epigraph {
    position: fixed; left: 50%; bottom: 4.4vh; transform: translateX(-50%);
    z-index: 3; pointer-events: none;
    font-size: clamp(7.5px, 0.64vw, 10px); letter-spacing: 0.52em; text-indent: 0.52em;
    color: rgba(148, 162, 156, 0.42);
  }

  @media (max-aspect-ratio: 1/1) {
    .lyric { width: 84vw; bottom: 9vh; }
    .head { top: 6vh; max-width: 74vw; }
    .medallion { top: 6.2vh; right: 8vw; width: clamp(46px, 12vw, 64px); height: clamp(58px, 15vw, 82px); }
    .epigraph { bottom: 3.2vh; letter-spacing: 0.44em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .grain { animation: none !important; }
    .ch { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="veil"></div>
<div class="scrim"></div>
<div class="frame"><svg id="frameSvg" aria-hidden="true"></svg></div>
<header class="head" id="head">
  <div class="diamond"></div>
  <div class="name" id="songName"></div>
  <div class="artist" id="songArtist"></div>
</header>
<div class="medallion" id="medallion">
  <img id="coverImage" alt="" decoding="async">
</div>
<div class="lyric" id="lyric">
  <div class="line line--prev" id="linePrev"></div>
  <div class="line line--cur" id="lineCur"></div>
  <div class="line line--next" id="lineNext"></div>
  <div class="empty" id="emptyState">
    <span class="wing"></span>
    <div class="rule"></div>
    <div class="note">此曲无词</div>
    <div class="sub">唯余风声与石上落雨</div>
    <div class="rule rule--low"></div>
  </div>
</div>
<div class="epigraph">IN MEMORIAM</div>
<div class="grain" id="grain"></div>
<script>
var stageState = { lines: 0, idx: -1, t: 0, playing: true, frames: 0, js: 0, text: "", gl: false, rm: false };
window.__stage = function () {
  return {
    lines: stageState.lines, idx: stageState.idx, t: stageState.t, playing: stageState.playing,
    frames: stageState.frames, js: stageState.js, err: "", text: stageState.text,
    gl: false, rm: stageState.rm
  };
};

var sceneCanvas = document.getElementById("scene");
var sceneCtx = sceneCanvas.getContext("2d");
var lineCurEl = document.getElementById("lineCur");
var linePrevEl = document.getElementById("linePrev");
var lineNextEl = document.getElementById("lineNext");
var songNameEl = document.getElementById("songName");
var songArtistEl = document.getElementById("songArtist");

var viewWidth = 1440, viewHeight = 900;
var scenePixelRatio = 1;
var sceneClock = 0;
var beatPulse = 0;
var liveLevel = 0;
var hasTick = false;
var tickBaseTime = 0;
var tickBaseAt = 0;
var clockTime = 0;
var currentSongId = "";
var lastFrameStamp = 0;
var readySent = false;
var lastErrorAt = -1e9;
var lineList = [];
var charSpans = [];
var charTimes = [];
var litCount = -1;
var emptyStateEl = document.getElementById("emptyState");
var medallionEl = document.getElementById("medallion");
var frameSvgEl = document.getElementById("frameSvg");
var coverImageEl = document.getElementById("coverImage");
var grainEl = document.getElementById("grain");
var nowTime = (typeof performance !== "undefined" && performance.now)
  ? function () { return performance.now(); }
  : function () { return Date.now(); };

stageState.rm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

function reportError(where, error) {
  var stamp = (typeof performance !== "undefined" ? performance.now() : Date.now());
  if (stamp - lastErrorAt < 1000) { return; }
  lastErrorAt = stamp;
  console.error("[376] " + where, error);
}

function sendReady() {
  if (readySent) { return; }
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); }
  catch (error) { reportError("ready", error); }
}

function clampNumber(value, low, high, fallback) {
  var numeric = Number(value);
  if (!isFinite(numeric)) { return fallback; }
  return Math.min(high, Math.max(low, numeric));
}

function artistText(artists) {
  if (!artists) { return ""; }
  if (Object.prototype.toString.call(artists) === "[object Array]") {
    var parts = [];
    for (var index = 0; index < Math.min(artists.length, 6); index++) {
      if (artists[index]) { parts.push(String(artists[index])); }
    }
    return parts.join(" / ");
  }
  return String(artists);
}

/* ---------- 设计坐标系与预烘焙图层 ---------- */
var DESIGN_WIDTH = 1440;
var DESIGN_HEIGHT = 900;
var DESIGN_TOP = -200;
var DESIGN_BOTTOM = 960;
var DESIGN_SPAN = DESIGN_BOTTOM - DESIGN_TOP;
var STATUE_HEAD_Y = 300;
var STATUE_CENTER_X = 720;

var farCanvas = null;
var statueCanvas = null;
var statueReady = false;
var fogCoolCanvas = null;
var fogWarmCanvas = null;
var fogCoolPattern = null;
var fogWarmPattern = null;
var bakeRatio = 1;
var bakeQueue = [];
var bakeWidth = 0;
var bakeHeight = 0;
var accentColor = [176, 178, 158];
var scaleValue = 1;
var offsetX = 0;
var offsetY = 0;
var sceneGradients = null;
var rainDrops = [];
var dustMotes = [];

function clampChannel(value) {
  var numeric = Math.round(Number(value));
  if (!isFinite(numeric)) { return 0; }
  return Math.min(255, Math.max(0, numeric));
}

function rgbaColor(red, green, blue, alpha) {
  var safeAlpha = Math.min(1, Math.max(0, isFinite(Number(alpha)) ? Number(alpha) : 0));
  return "rgba(" + clampChannel(red) + "," + clampChannel(green) + "," + clampChannel(blue) + "," + safeAlpha + ")";
}

function safeStop(gradient, stop, color) {
  if (!gradient || typeof gradient.addColorStop !== "function") { return; }
  try {
    gradient.addColorStop(Math.min(1, Math.max(0, stop)), color);
  } catch (error) {
    reportError("addColorStop", error);
  }
}

function hasPathApi(target) {
  return !!target && typeof target.beginPath === "function" && typeof target.fill === "function";
}

function canDrawLayer(layer) {
  if (!layer || typeof layer.getContext !== "function") { return false; }
  if (String(layer.tagName || "").toUpperCase() !== "CANVAS") { return false; }
  return typeof layer.width === "number" && typeof layer.height === "number" && layer.width > 0 && layer.height > 0;
}

function makeLayer(width, height) {
  var layer = document.createElement("canvas");
  layer.width = Math.max(1, Math.round(width));
  layer.height = Math.max(1, Math.round(height));
  return layer;
}

function createSeed(seedValue) {
  var seedState = seedValue >>> 0;
  return function nextSeed() {
    seedState = (seedState * 1664525 + 1013904223) >>> 0;
    return seedState / 4294967296;
  };
}

function paintBlob(target, centerX, centerY, radiusX, radiusY, angle, fillStyle, alpha) {
  if (!hasPathApi(target)) { return; }
  target.save();
  target.globalAlpha = alpha == null ? 1 : alpha;
  target.translate(centerX, centerY);
  if (angle) { target.rotate(angle); }
  target.scale(Math.max(0.001, radiusX), Math.max(0.001, radiusY));
  target.beginPath();
  target.arc(0, 0, 1, 0, Math.PI * 2, false);
  target.fillStyle = fillStyle;
  target.fill();
  target.restore();
}

function paintLimb(target, startX, startY, endX, endY, thickness, fillStyle) {
  var deltaX = endX - startX;
  var deltaY = endY - startY;
  var limbLength = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
  if (!(limbLength > 0.5)) { return; }
  paintBlob(
    target,
    (startX + endX) * 0.5,
    (startY + endY) * 0.5,
    limbLength * 0.5 + thickness * 0.42,
    thickness * 0.5,
    Math.atan2(deltaY, deltaX),
    fillStyle,
    1
  );
}

function strokePath(target, lineWidth, strokeStyle, builder) {
  if (!hasPathApi(target) || typeof builder !== "function") { return; }
  target.save();
  target.lineWidth = Math.max(0.1, lineWidth);
  target.strokeStyle = strokeStyle;
  target.lineCap = "round";
  target.beginPath();
  try {
    builder(target);
  } catch (error) {
    reportError("strokePath", error);
  }
  target.stroke();
  target.restore();
}

function quadraticPointAt(startX, startY, controlX, controlY, endX, endY, ratio) {
  var inverse = 1 - ratio;
  return {
    x: inverse * inverse * startX + 2 * inverse * ratio * controlX + ratio * ratio * endX,
    y: inverse * inverse * startY + 2 * inverse * ratio * controlY + ratio * ratio * endY
  };
}

function quadraticPath(target, startX, startY, controlX, controlY, endX, endY) {
  target.moveTo(startX, startY);
  target.quadraticCurveTo(controlX, controlY, endX, endY);
}

/* ---------- 墓碑、十字、柏树 ---------- */
function paintGrave(target, centerX, topY, width, height, tilt) {
  if (!hasPathApi(target)) { return; }
  target.save();
  target.translate(centerX, topY);
  if (tilt) { target.rotate(tilt); }
  var shoulder = width * 0.5;
  target.beginPath();
  target.moveTo(-shoulder, height);
  target.lineTo(-shoulder, shoulder * 1.05);
  target.quadraticCurveTo(-shoulder, 0, 0, 0);
  target.quadraticCurveTo(shoulder, 0, shoulder, shoulder * 1.05);
  target.lineTo(shoulder, height);
  target.closePath();
  target.fillStyle = "#0b1416";
  target.fill();
  target.globalAlpha = 0.34;
  strokePath(target, 1.6, rgbaColor(196, 200, 178, 0.5), function (pathTarget) {
    pathTarget.moveTo(-shoulder + 1, height);
    pathTarget.lineTo(-shoulder + 1, shoulder * 1.05);
    pathTarget.quadraticCurveTo(-shoulder + 1, 1.5, 0, 1.5);
    pathTarget.quadraticCurveTo(shoulder - 1, 1.5, shoulder - 1, shoulder * 1.05);
  });
  target.restore();
}

function paintCross(target, centerX, centerY, size) {
  if (!hasPathApi(target)) { return; }
  var bar = Math.max(2, size * 0.12);
  target.fillStyle = "#0a1214";
  target.fillRect(centerX - bar * 0.5, centerY - size * 0.5, bar, size);
  target.fillRect(centerX - size * 0.22, centerY - size * 0.22, size * 0.44, bar * 0.92);
  target.globalAlpha = 0.3;
  strokePath(target, 1.2, rgbaColor(198, 202, 180, 0.55), function (pathTarget) {
    pathTarget.moveTo(centerX + bar * 0.5, centerY - size * 0.5);
    pathTarget.lineTo(centerX + bar * 0.5, centerY + size * 0.5);
  });
  target.globalAlpha = 1;
}

function paintCypress(target, centerX, baseY, height, width) {
  if (!hasPathApi(target)) { return; }
  target.save();
  target.beginPath();
  target.moveTo(centerX, baseY - height);
  target.quadraticCurveTo(centerX + width, baseY - height * 0.46, centerX + width * 0.42, baseY);
  target.lineTo(centerX - width * 0.42, baseY);
  target.quadraticCurveTo(centerX - width, baseY - height * 0.46, centerX, baseY - height);
  target.closePath();
  target.fillStyle = "#060d0f";
  target.fill();
  target.restore();
}

/* ---------- 远景：墓园、台座、地面薄雾 ---------- */
function paintBackdrop(context) {
  if (!hasPathApi(context)) { return; }
  context.globalCompositeOperation = "source-over";
  context.globalAlpha = 1;

  paintCypress(context, 96, 902, 660, 84);
  paintCypress(context, 1352, 902, 720, 92);
  paintCypress(context, 262, 900, 430, 58);
  paintCypress(context, 1198, 902, 388, 52);

  paintCross(context, 1088, 610, 210);
  paintCross(context, 402, 646, 150);

  paintGrave(context, 208, 726, 104, 190, -0.02);
  paintGrave(context, 336, 762, 82, 150, 0.015);
  paintGrave(context, 1236, 714, 118, 200, 0.018);
  paintGrave(context, 1112, 758, 76, 142, -0.012);
  paintGrave(context, 128, 792, 72, 132, 0.03);

  context.fillStyle = "#0c1517";
  context.fillRect(STATUE_CENTER_X - 336, 812, 672, 46);
  context.fillRect(STATUE_CENTER_X - 392, 856, 784, 52);
  context.fillRect(STATUE_CENTER_X - 448, 906, 896, 60);
  context.globalAlpha = 0.26;
  strokePath(context, 1.6, rgbaColor(206, 208, 186, 0.6), function (pathTarget) {
    pathTarget.moveTo(STATUE_CENTER_X - 336, 813);
    pathTarget.lineTo(STATUE_CENTER_X + 336, 813);
  });
  strokePath(context, 1.4, rgbaColor(190, 196, 178, 0.42), function (pathTarget) {
    pathTarget.moveTo(STATUE_CENTER_X - 392, 857);
    pathTarget.lineTo(STATUE_CENTER_X + 392, 857);
  });
  context.globalAlpha = 1;

  var groundHaze = context.createLinearGradient(0, 690, 0, 940);
  safeStop(groundHaze, 0, rgbaColor(150, 176, 172, 0));
  safeStop(groundHaze, 0.62, rgbaColor(150, 176, 172, 0.24));
  safeStop(groundHaze, 1, rgbaColor(120, 146, 142, 0.42));
  context.fillStyle = groundHaze;
  context.fillRect(-80, 690, DESIGN_WIDTH + 160, 300);

  context.globalCompositeOperation = "destination-out";
  var fadeBack = context.createLinearGradient(0, 830, 0, DESIGN_BOTTOM);
  safeStop(fadeBack, 0, "rgba(0,0,0,0)");
  safeStop(fadeBack, 1, "rgba(0,0,0,1)");
  context.fillStyle = fadeBack;
  context.fillRect(-200, 830, DESIGN_WIDTH + 400, DESIGN_SPAN);
  context.globalCompositeOperation = "source-over";
}

/* ---------- 天使：翼 ---------- */
function wingFeatherAngle(side, ratio) {
  return -Math.PI * 0.5 + side * (0.66 - 0.48 * ratio);
}

function drawWing(context, side, stoneColor) {
  var rootX = STATUE_CENTER_X + side * 92;
  var rootY = 452;
  var controlX = STATUE_CENTER_X + side * 310;
  var controlY = 250;
  var tipX = STATUE_CENTER_X + side * 430;
  var tipY = 8;
  var featherRandom = createSeed(side > 0 ? 90210 : 4711);

  for (var index = 0; index < 12; index++) {
    var ratio = index / 11;
    var point = quadraticPointAt(rootX, rootY, controlX, controlY, tipX, tipY, ratio);
    var angle = wingFeatherAngle(side, ratio);
    var featherLength = 330 * (1 - 0.28 * ratio) * (0.88 + featherRandom() * 0.24);
    var featherWidth = 68 * (1 - 0.3 * ratio);
    paintBlob(
      context,
      point.x + Math.cos(angle) * featherLength * 0.42,
      point.y + Math.sin(angle) * featherLength * 0.42,
      featherLength * 0.5,
      featherWidth * 0.5,
      angle,
      stoneColor,
      1
    );
  }

  var armPoint = quadraticPointAt(rootX, rootY, controlX, controlY, tipX, tipY, 0.42);
  paintBlob(context, armPoint.x, armPoint.y, 226, 64, -Math.PI * 0.5 + side * 0.46, stoneColor, 1);
  paintBlob(context, rootX + side * 22, rootY - 16, 118, 74, side * -0.38, stoneColor, 1);
}

function paintWingDetail(context, side, seedValue) {
  var rootX = STATUE_CENTER_X + side * 92;
  var rootY = 452;
  var controlX = STATUE_CENTER_X + side * 310;
  var controlY = 250;
  var tipX = STATUE_CENTER_X + side * 430;
  var tipY = 8;
  var detailRandom = createSeed(seedValue);
  for (var index = 0; index < 10; index++) {
    var ratio = index / 9;
    var point = quadraticPointAt(rootX, rootY, controlX, controlY, tipX, tipY, ratio);
    var angle = wingFeatherAngle(side, ratio) + side * 0.04;
    var reach = 190 + detailRandom() * 110;
    context.save();
    context.globalAlpha = 0.34;
    strokePath(context, 3 + detailRandom() * 6, rgbaColor(5, 10, 12, 0.85), function (pathTarget) {
      pathTarget.moveTo(point.x, point.y);
      pathTarget.lineTo(point.x + Math.cos(angle) * reach, point.y + Math.sin(angle) * reach);
    });
    context.restore();
  }
  context.save();
  context.globalAlpha = 0.2;
  strokePath(context, 2, rgbaColor(214, 212, 188, 0.8), function (pathTarget) {
    pathTarget.moveTo(rootX, rootY);
    pathTarget.quadraticCurveTo(controlX, controlY, tipX, tipY);
  });
  context.restore();
}

/* ---------- 天使本体 ---------- */
function paintStatue(context) {
  if (!hasPathApi(context)) { return; }
  var stoneColor = "#0d1719";
  context.globalCompositeOperation = "source-over";
  context.globalAlpha = 1;

  drawWing(context, -1, stoneColor);
  drawWing(context, 1, stoneColor);

  var masses = [
    [720, 300, 62, 74, 0.10],
    [716, 258, 78, 66, -0.06],
    [656, 340, 27, 48, 0.32],
    [786, 340, 27, 48, -0.32],
    [722, 382, 33, 31, 0],
    [720, 428, 148, 54, 0],
    [720, 474, 136, 66, 0],
    [718, 524, 124, 78, 0],
    [716, 580, 111, 74, 0],
    [714, 630, 97, 58, 0],

  /* 双臂上举、双手掩面 —— 哭泣天使的经典姿态，肘部外张才看得见 */

  context.globalCompositeOperation = "source-atop";

  var keyLight = context.createLinearGradient(430, 40, 880, 900);
  safeStop(keyLight, 0, rgbaColor(170, 178, 158, 0.62));
  safeStop(keyLight, 0.34, rgbaColor(112, 128, 120, 0.26));
  safeStop(keyLight, 0.72, rgbaColor(26, 38, 40, 0.2));
  safeStop(keyLight, 1, rgbaColor(3, 7, 9, 0.72));
  context.fillStyle = keyLight;
  context.fillRect(-60, DESIGN_TOP, DESIGN_WIDTH + 120, DESIGN_SPAN);

  var chestLight = context.createRadialGradient(642, 420, 10, 700, 520, 360);

  safeStop(lowerShade, 0.7, rgbaColor(2, 6, 8, 0.55));
  safeStop(lowerShade, 1, rgbaColor(2, 5, 7, 0.9));
  context.fillStyle = lowerShade;
  context.fillRect(-60, 600, DESIGN_WIDTH + 120, 420);

  paintWingDetail(context, -1, 8081);
  paintWingDetail(context, 1, 6161);
  context.globalAlpha = 1;
  context.globalCompositeOperation = "source-over";
}

/* ---------- 天使细节：纹脉、青苔、雨痕、边缘光 ---------- */
function paintStatueDetail(context) {
  if (!hasPathApi(context)) { return; }
  context.globalCompositeOperation = "source-atop";
  context.globalAlpha = 1;

  var veinRandom = createSeed(376001);
  for (var veinIndex = 0; veinIndex < 22; veinIndex++) {
    var startX = 470 + veinRandom() * 500;
    var startY = 210 + veinRandom() * 620;
    var driftX = (veinRandom() - 0.5) * 90;
    var dropY = 40 + veinRandom() * 150;
    context.globalAlpha = 0.16 + veinRandom() * 0.14;
    strokePath(context, 0.7 + veinRandom() * 1.5, rgbaColor(8, 16, 18, 0.9), function (pathTarget) {
      quadraticPath(
        pathTarget,
        startX,
        startY,
        startX + driftX,
        startY + dropY * 0.5,
        startX + driftX * 0.4,
        startY + dropY
      );
    });
  }

  var mossRandom = createSeed(376002);
  for (var mossIndex = 0; mossIndex < 18; mossIndex++) {
    var mossX = 520 + mossRandom() * 400;
    var mossY = 300 + mossRandom() * 520;
    var mossRadius = 18 + mossRandom() * 42;
    var moss = context.createRadialGradient(mossX, mossY, 0, mossX, mossY, mossRadius);
    safeStop(moss, 0, rgbaColor(74, 110, 84, 0.34));
    safeStop(moss, 0.6, rgbaColor(58, 96, 78, 0.16));
    safeStop(moss, 1, rgbaColor(58, 96, 78, 0));
    context.fillStyle = moss;
    context.fillRect(mossX - mossRadius, mossY - mossRadius, mossRadius * 2, mossRadius * 2);
  }

  var rainRandom = createSeed(376003);
  for (var rainIndex = 0; rainIndex < 26; rainIndex++) {
    var rainX = 500 + rainRandom() * 440;
    var rainY = 220 + rainRandom() * 620;
    var rainLength = 60 + rainRandom() * 210;
    var wetStreak = context.createLinearGradient(rainX, rainY, rainX, rainY + rainLength);
    safeStop(wetStreak, 0, rgbaColor(214, 220, 204, 0.2));
    safeStop(wetStreak, 0.35, rgbaColor(190, 202, 188, 0.1));
    safeStop(wetStreak, 1, rgbaColor(190, 202, 188, 0));
    context.fillStyle = wetStreak;
    context.fillRect(rainX, rainY, 1.2 + rainRandom() * 2.4, rainLength);
  }

  var crackRandom = createSeed(376004);
  for (var crackIndex = 0; crackIndex < 8; crackIndex++) {
    var crackX = 540 + crackRandom() * 360;
    var crackY = 250 + crackRandom() * 380;
    var crackSteps = 5;
    var points = [];
    for (var step = 0; step < crackSteps; step++) {
      points.push([crackX + (crackRandom() - 0.5) * 26, crackY + step * (16 + crackRandom() * 22)]);
    }
    context.globalAlpha = 0.3;
    strokePath(context, 0.9, rgbaColor(6, 12, 14, 0.9), function (pathTarget) {
      pathTarget.moveTo(points[0][0], points[0][1]);
      for (var pointIndex = 1; pointIndex < points.length; pointIndex++) {
        pathTarget.lineTo(points[pointIndex][0], points[pointIndex][1]);
      }
    });
  }
  context.globalAlpha = 1;

  strokePath(context, 3.4, rgbaColor(232, 226, 202, 0.44), function (pathTarget) {
    pathTarget.arc(720, 298, 68, Math.PI * 1.04, Math.PI * 1.68, false);
  });
  strokePath(context, 2.6, rgbaColor(224, 222, 198, 0.34), function (pathTarget) {
    pathTarget.arc(720, 306, 76, Math.PI * 1.18, Math.PI * 1.52, false);
  });
  strokePath(context, 4, rgbaColor(230, 228, 206, 0.4), function (pathTarget) {
    quadraticPath(pathTarget, 578, 432, 640, 404, 702, 398);
  });
  strokePath(context, 4, rgbaColor(222, 222, 202, 0.3), function (pathTarget) {
    quadraticPath(pathTarget, 862, 432, 800, 404, 738, 398);
  });
  strokePath(context, 5, rgbaColor(238, 232, 210, 0.46), function (pathTarget) {
    quadraticPath(pathTarget, 812, 452, 1030, 250, 1150, 8);
  });
  strokePath(context, 5, rgbaColor(238, 232, 210, 0.4), function (pathTarget) {
    quadraticPath(pathTarget, 628, 452, 410, 250, 290, 8);
  });
  strokePath(context, 3, rgbaColor(234, 230, 206, 0.36), function (pathTarget) {
    quadraticPath(pathTarget, 552, 520, 596, 436, 662, 382);
  });
  strokePath(context, 3, rgbaColor(234, 230, 206, 0.3), function (pathTarget) {
    quadraticPath(pathTarget, 888, 520, 844, 436, 778, 382);
  });
  strokePath(context, 2.6, rgbaColor(236, 232, 208, 0.34), function (pathTarget) {
    pathTarget.arc(566, 520, 30, Math.PI * 0.55, Math.PI * 1.35, false);
  });
  strokePath(context, 2.2, rgbaColor(236, 230, 206, 0.42), function (pathTarget) {
    pathTarget.moveTo(674, 332);
    pathTarget.lineTo(690, 344);
    pathTarget.lineTo(682, 356);
  });
  strokePath(context, 2, rgbaColor(236, 230, 206, 0.3), function (pathTarget) {
    pathTarget.moveTo(766, 334);
    pathTarget.lineTo(750, 346);
    pathTarget.lineTo(758, 358);
  });

  var tearSpots = [706, 734];
  for (var tearIndex = 0; tearIndex < tearSpots.length; tearIndex++) {
    var tearX = tearSpots[tearIndex];
    var tearFade = context.createLinearGradient(tearX, 352, tearX, 486);
    safeStop(tearFade, 0, rgbaColor(244, 240, 218, 0.36));
    safeStop(tearFade, 0.4, rgbaColor(226, 226, 204, 0.18));
    safeStop(tearFade, 1, rgbaColor(226, 226, 204, 0));
    context.fillStyle = tearFade;
    context.fillRect(tearX, 352, 2.2, 134);
  }

  context.globalCompositeOperation = "destination-out";
  var topFade = context.createLinearGradient(0, DESIGN_TOP, 0, -58);
  safeStop(topFade, 0, "rgba(0,0,0,1)");
  safeStop(topFade, 0.58, "rgba(0,0,0,0.6)");
  safeStop(topFade, 1, "rgba(0,0,0,0)");
  context.fillStyle = topFade;
  context.fillRect(-100, DESIGN_TOP, DESIGN_WIDTH + 200, 150);
  context.globalCompositeOperation = "destination-out";
  var statueFade = context.createLinearGradient(0, 700, 0, DESIGN_BOTTOM);
  safeStop(statueFade, 0, "rgba(0,0,0,0)");
  safeStop(statueFade, 0.72, "rgba(0,0,0,0.28)");
  safeStop(statueFade, 1, "rgba(0,0,0,1)");
  context.fillStyle = statueFade;
  context.fillRect(-100, 700, DESIGN_WIDTH + 200, DESIGN_SPAN);
  context.globalCompositeOperation = "source-over";
  context.globalAlpha = 1;
}

/* ---------- 雾贴图 ---------- */
function paintFogLayer(canvas, seedValue, warm) {
  var context = canvas.getContext("2d");
  if (!context) { return; }
  context.setTransform(1, 0, 0, 1, 0, 0);
  context.clearRect(0, 0, canvas.width, canvas.height);
  var fogRandom = createSeed(seedValue);
  var width = canvas.width;
  var height = canvas.height;
  for (var index = 0; index < 170; index++) {
    var centerX = fogRandom() * width;
    var centerY = height * (0.25 + fogRandom() * 0.95);
    var radius = Math.max(18, (0.08 + fogRandom() * 0.3) * height);
    var tint = warm
      ? rgbaColor(206, warm ? 186 : 176, 148, 0.085 + fogRandom() * 0.1)
      : rgbaColor(126, 158, 162, 0.08 + fogRandom() * 0.1);
    var cloud = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
    safeStop(cloud, 0, tint);
    safeStop(cloud, 0.55, tint.replace(/[\d.]+\)$/, "0.05)"));
    safeStop(cloud, 1, "rgba(0,0,0,0)");
    context.fillStyle = cloud;
    context.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);
  }
}

/* ---------- 台座字母（刻在石阶上的铭文） ---------- */
function buildBakeTasks() {
  bakeQueue = [];
  bakeQueue.push(function bakeFarLayer() {
    farCanvas = makeLayer(DESIGN_WIDTH * bakeRatio, DESIGN_SPAN * bakeRatio);
    var context = farCanvas.getContext("2d");
    if (!context) { return; }
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, farCanvas.width, farCanvas.height);
    context.scale(bakeRatio, bakeRatio);
    context.translate(0, -DESIGN_TOP);
    try { paintBackdrop(context); } catch (error) { reportError("bakeBackdrop", error); }
  });
  bakeQueue.push(function bakeStatueBase() {
    statueCanvas = makeLayer(DESIGN_WIDTH * bakeRatio, DESIGN_SPAN * bakeRatio);
    statueReady = false;
    var context = statueCanvas.getContext("2d");
    if (!context) { return; }
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, statueCanvas.width, statueCanvas.height);
    context.scale(bakeRatio, bakeRatio);
    context.translate(0, -DESIGN_TOP);
    try { paintStatue(context); } catch (error) { reportError("bakeStatue", error); }
  });
  bakeQueue.push(function bakeStatueDetail() {
    if (!canDrawLayer(statueCanvas)) { return; }
    var detailContext = statueCanvas.getContext("2d");
    if (!detailContext) { return; }
    detailContext.setTransform(bakeRatio, 0, 0, bakeRatio, 0, -DESIGN_TOP * bakeRatio);
    try { paintStatueDetail(detailContext); } catch (error) { reportError("bakeStatueDetail", error); }
    statueReady = true;
  });
  bakeQueue.push(function bakeFogLayers() {
    var fogWidth = Math.max(160, Math.round(viewWidth * 0.62));
    var fogHeight = Math.max(120, Math.round(viewHeight * 0.62));
    fogCoolCanvas = makeLayer(fogWidth, fogHeight);
    fogWarmCanvas = makeLayer(fogWidth, fogHeight);
    try {
      paintFogLayer(fogCoolCanvas, 37610, false);
      paintFogLayer(fogWarmCanvas, 37620, true);
    } catch (error) { reportError("bakeFog", error); }
    try {
      fogCoolPattern = sceneCtx.createPattern(fogCoolCanvas, "repeat");
      fogWarmPattern = sceneCtx.createPattern(fogWarmCanvas, "repeat");
    } catch (error) {
      fogCoolPattern = null;
      fogWarmPattern = null;
      reportError("fogPattern", error);
    }
    buildRainAndDust();
  });
}

/* ---------- 胶片颗粒（CSS 平铺，零每帧成本） ---------- */
function buildGrainTexture() {
  if (!grainEl) { return; }
  try {
    var tileSize = 128;
    var grainTile = makeLayer(tileSize, tileSize);
    var grainContext = grainTile.getContext("2d");
    if (!grainContext) { return; }
    var imageData = grainContext.createImageData(tileSize, tileSize);
    var grainRandom = createSeed(37699);
    for (var index = 0; index < imageData.data.length; index += 4) {
      var value = Math.round(grainRandom() * 255);
      imageData.data[index] = value;
      imageData.data[index + 1] = value;
      imageData.data[index + 2] = value;
      imageData.data[index + 3] = 255;
    }
    grainContext.putImageData(imageData, 0, 0);
    grainEl.style.backgroundImage = "url(" + grainTile.toDataURL("image/png") + ")";
    grainEl.style.backgroundSize = "168px 168px";
  } catch (error) {
    reportError("grain", error);
  }
}

function buildRainAndDust() {
  var rainRandom = createSeed(3760);
  rainDrops = [];
  var rainCount = Math.min(64, Math.max(18, Math.round(viewWidth / 26)));
  for (var index = 0; index < rainCount; index++) {
    rainDrops.push({
      x: rainRandom() * viewWidth,
      y: rainRandom() * viewHeight,
      length: 8 + rainRandom() * 26,
      speed: 26 + rainRandom() * 74,
      alpha: 0.05 + rainRandom() * 0.1
    });
  }
  var dustRandom = createSeed(3761);
  dustMotes = [];
  var dustCount = Math.min(60, Math.max(20, Math.round(viewWidth / 32)));
  for (var dustIndex = 0; dustIndex < dustCount; dustIndex++) {
    dustMotes.push({
      x: dustRandom() * viewWidth,
      y: dustRandom() * viewHeight,
      radius: 0.6 + dustRandom() * 1.7,
      phase: dustRandom() * Math.PI * 2,
      speed: 0.12 + dustRandom() * 0.4,
      drift: 0.4 + dustRandom() * 1.1,
      alpha: 0.1 + dustRandom() * 0.28
    });
  }
}

function computeBakeRatio() {
  var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  var target = scaleValue * pixelRatio * 0.72;
  return Math.min(1.18, Math.max(0.88, target));
}

function requestBake(force) {
  if (!force && statueCanvas && Math.abs(viewWidth - bakeWidth) < 48 && Math.abs(viewHeight - bakeHeight) < 48) {
    return;
  }
  bakeWidth = viewWidth;
  bakeHeight = viewHeight;
  bakeRatio = computeBakeRatio();
  if (!(bakeRatio > 0) || !isFinite(bakeRatio)) { bakeRatio = 1; }
  buildSceneGradients();
  buildBakeTasks();
}

function resizeScene() {
  var rawWidth = window.innerWidth || 0;
  var rawHeight = window.innerHeight || 0;
  viewWidth = clampNumber(rawWidth, 1, 8192, 1440);
  viewHeight = clampNumber(rawHeight, 1, 8192, 900);
  if (!(viewWidth > 0) || !(viewHeight > 0)) { viewWidth = 1440; viewHeight = 900; }
  var ratio = Math.min(window.devicePixelRatio || 1, 2);
  scenePixelRatio = ratio;
  sceneCanvas.width = Math.max(1, Math.round(viewWidth * ratio));
  sceneCanvas.height = Math.max(1, Math.round(viewHeight * ratio));
  sceneCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
  updateSceneTransform();
  requestBake(false);
  rebuildFrame();
  drawFrame(0.016);
}

function updateSceneTransform() {
  var aspect = viewWidth / Math.max(1, viewHeight);
  var isPortrait = aspect < 1.02;
  if (isPortrait) {
    var fitWidth = (viewWidth * 0.98) / 940;
    var fitHeight = (viewHeight * 1.04) / 1160;
    scaleValue = Math.min(fitWidth, fitHeight);
  } else {
    scaleValue = Math.max(viewWidth / DESIGN_WIDTH, viewHeight / DESIGN_HEIGHT) * 1.04;
  }
  if (!isFinite(scaleValue) || !(scaleValue > 0)) { scaleValue = 1; }
  var anchorRatio = isPortrait ? 0.42 : 0.4;
  offsetX = viewWidth * 0.5 - STATUE_CENTER_X * scaleValue;
  offsetY = viewHeight * anchorRatio - STATUE_HEAD_Y * scaleValue;
}

function buildSceneGradients() {
  if (!sceneCtx || typeof sceneCtx.createLinearGradient !== "function") { return; }
  var base = sceneCtx.createLinearGradient(0, 0, viewWidth * 0.25, viewHeight);
  safeStop(base, 0, rgbaColor(9, 17, 19, 1));
  safeStop(base, 0.42, rgbaColor(6, 12, 14, 1));
  safeStop(base, 1, rgbaColor(2, 5, 7, 1));
  var halo = sceneCtx.createRadialGradient(
    viewWidth * 0.5, viewHeight * 0.36, 0,
    viewWidth * 0.5, viewHeight * 0.36, Math.max(viewWidth, viewHeight) * 0.62
  );
  safeStop(halo, 0, rgbaColor(198, 192, 164, 0.26));
  safeStop(halo, 0.22, rgbaColor(150, 168, 158, 0.13));
  safeStop(halo, 0.55, rgbaColor(84, 116, 118, 0.05));
  safeStop(halo, 1, rgbaColor(0, 0, 0, 0));
  var shafts = [];
  for (var index = 0; index < 3; index++) {
    var shaft = sceneCtx.createLinearGradient(0, -viewHeight * 0.1, 0, viewHeight * 1.02);
    safeStop(shaft, 0, rgbaColor(236, 232, 208, 0.3 - index * 0.062));
    safeStop(shaft, 0.42, rgbaColor(180, 196, 180, 0.1));
    safeStop(shaft, 0.78, rgbaColor(120, 150, 150, 0.03));
    safeStop(shaft, 1, rgbaColor(0, 0, 0, 0));
    shafts.push(shaft);
  }
  sceneGradients = { base: base, halo: halo, shafts: shafts };
}

function wrapOffsetX(value, layer, scaleFactor) {
  if (!canDrawLayer(layer) || !(scaleFactor > 0)) { return 0; }
  var period = layer.width * scaleFactor;
  var wrapped = value % period;
  return isFinite(wrapped) ? wrapped : 0;
}

function wrapOffsetY(value, layer, scaleFactor) {
  if (!canDrawLayer(layer) || !(scaleFactor > 0)) { return 0; }
  var period = layer.height * scaleFactor;
  var wrapped = value % period;
  return isFinite(wrapped) ? wrapped : 0;
}

function fillFogLayer(pattern, scaleFactor, shiftX, shiftY, alpha) {  if (!pattern) { return; }
  sceneCtx.save();
  sceneCtx.globalCompositeOperation = "lighter";
  sceneCtx.globalAlpha = Math.min(1, Math.max(0, alpha));
  sceneCtx.fillStyle = pattern;
  if (typeof pattern.setTransform === "function" && typeof DOMMatrix === "function") {
    try {
      pattern.setTransform(new DOMMatrix([scaleFactor, 0, 0, scaleFactor, shiftX, shiftY]));
    } catch (error) {
      reportError("fogTransform", error);
    }
  }
  sceneCtx.fillRect(0, 0, viewWidth, viewHeight);
  sceneCtx.restore();
}

function drawLightShafts(pulse, breatheRatio) {
  if (!sceneGradients || !sceneGradients.shafts) { return; }
  var apexX = viewWidth * 0.5;
  sceneCtx.save();
  sceneCtx.globalCompositeOperation = "lighter";
  for (var index = 0; index < sceneGradients.shafts.length; index++) {
    var topHalf = viewWidth * (0.008 + index * 0.006);
    var bottomHalf = viewWidth * (0.07 + index * 0.045);
    var lean = (index - 1) * viewWidth * 0.028;
    var alpha = (0.42 + pulse * 0.4) * (1 - index * 0.22) * breatheRatio;
    sceneCtx.globalAlpha = Math.min(0.75, Math.max(0, alpha));
    sceneCtx.fillStyle = sceneGradients.shafts[index];
    sceneCtx.beginPath();
    sceneCtx.moveTo(apexX - topHalf + lean * 0.24, -viewHeight * 0.08);
    sceneCtx.lineTo(apexX + topHalf + lean * 0.24, -viewHeight * 0.08);
    sceneCtx.lineTo(apexX + bottomHalf + lean, viewHeight * 1.04);
    sceneCtx.lineTo(apexX - bottomHalf + lean, viewHeight * 1.04);
    sceneCtx.closePath();
    sceneCtx.fill();
  }
  sceneCtx.restore();
}

function drawRain(deltaSeconds) {
  if (!rainDrops.length) { return; }
  var speedScale = stageState.rm ? 0.32 : 1;
  sceneCtx.save();
  sceneCtx.globalCompositeOperation = "lighter";
  sceneCtx.lineWidth = 1;
  for (var index = 0; index < rainDrops.length; index++) {
    var drop = rainDrops[index];
    drop.y += drop.speed * deltaSeconds * speedScale;
    drop.x -= drop.speed * 0.18 * deltaSeconds * speedScale;
    if (drop.y > viewHeight + 40) {
      drop.y = -drop.length - Math.random() * viewHeight * 0.5;
      drop.x = Math.random() * viewWidth;
    }
    if (drop.x < -20) { drop.x = viewWidth + Math.random() * 20; }
    sceneCtx.globalAlpha = drop.alpha;
    sceneCtx.strokeStyle = rgbaColor(206, 220, 212, 0.9);
    sceneCtx.beginPath();
    sceneCtx.moveTo(drop.x, drop.y);
    sceneCtx.lineTo(drop.x + drop.length * 0.24, drop.y - drop.length);
    sceneCtx.stroke();
  }
  sceneCtx.restore();
}

function drawDust(pulse) {
  if (!dustMotes.length) { return; }
  sceneCtx.save();
  sceneCtx.globalCompositeOperation = "lighter";
  var motion = stageState.rm ? 0.3 : 1;
  for (var index = 0; index < dustMotes.length; index++) {
    var mote = dustMotes[index];
    var drift = Math.sin(sceneClock * mote.speed + mote.phase);
    var moteX = mote.x + drift * 26 * motion;
    var moteY = mote.y + Math.cos(sceneClock * mote.speed * 0.7 + mote.phase) * 16 * motion;
    if (moteY < -10) { moteY = viewHeight + 10; }
    if (moteY > viewHeight + 10) { moteY = -10; }
    sceneCtx.globalAlpha = mote.alpha * (0.55 + pulse * 0.5);
    sceneCtx.fillStyle = rgbaColor(232, 228, 202, 0.9);
    sceneCtx.beginPath();
    sceneCtx.arc(moteX, moteY, mote.radius, 0, Math.PI * 2, false);
    sceneCtx.fill();
  }
  sceneCtx.restore();
}

function drawFrame(deltaSeconds) {
  var startedAt = (typeof performance !== "undefined" ? performance.now() : Date.now());
  try {
    var context = sceneCtx;
    context.setTransform(scenePixelRatio, 0, 0, scenePixelRatio, 0, 0);
    context.globalCompositeOperation = "source-over";
    context.globalAlpha = 1;

    if (!sceneGradients) {
      context.fillStyle = "#05090b";
      context.fillRect(0, 0, viewWidth, viewHeight);
      return;
    }

    context.fillStyle = sceneGradients.base;
    context.fillRect(0, 0, viewWidth, viewHeight);

    context.globalCompositeOperation = "lighter";
    context.globalAlpha = Math.min(1, 0.8 + beatPulse * 0.5);
    context.fillStyle = sceneGradients.halo;
    context.fillRect(0, 0, viewWidth, viewHeight);
    context.globalAlpha = 1;
    context.globalCompositeOperation = "source-over";

    if (canDrawLayer(farCanvas)) {
      context.drawImage(
        farCanvas,
        offsetX,
        offsetY + DESIGN_TOP * scaleValue,
        DESIGN_WIDTH * scaleValue,
        DESIGN_SPAN * scaleValue
      );
    }

    if (statueReady && canDrawLayer(statueCanvas)) {
      var breathe = stageState.rm ? 1 : 1 + Math.sin(sceneClock * 0.42) * 0.004;
      var focusX = offsetX + STATUE_CENTER_X * scaleValue;
      var focusY = offsetY + STATUE_HEAD_Y * scaleValue;
      context.save();
      context.translate(focusX, focusY);
      context.scale(breathe, breathe);
      context.translate(-focusX, -focusY);
      context.drawImage(
        statueCanvas,
        offsetX,
        offsetY + DESIGN_TOP * scaleValue,
        DESIGN_WIDTH * scaleValue,
        DESIGN_SPAN * scaleValue
      );
      context.restore();
    }

    drawLightShafts(beatPulse, 1);

    var fogDrift = stageState.rm ? 0.15 : 1;
    var warmScale = Math.min(2.6, Math.max(1.1, viewWidth / 900)) * 1.15;
    var coolScale = Math.min(2.9, Math.max(1.2, viewWidth / 780)) * 1.05;
    fillFogLayer(
      fogWarmPattern,
      warmScale,
      wrapOffsetX(-sceneClock * 150 * fogDrift, fogWarmCanvas, warmScale),
      wrapOffsetY(-sceneClock * 48 * fogDrift, fogWarmCanvas, warmScale),
      0.55
    );
    fillFogLayer(
      fogCoolPattern,
      coolScale,
      wrapOffsetX(sceneClock * 96 * fogDrift, fogCoolCanvas, coolScale),
      wrapOffsetY(sceneClock * 62 * fogDrift, fogCoolCanvas, coolScale),
      0.34
    );

    drawRain(deltaSeconds);
    drawDust(beatPulse);
  } catch (error) {
    reportError("drawFrame", error);
  } finally {
    var endedAt = (typeof performance !== "undefined" ? performance.now() : Date.now());
    stageState.js = Math.round((endedAt - startedAt) * 100) / 100;
  }
}

/* ---------- 新艺术运动藤蔓边框 ---------- */
function svgPath(pathData, strokeColor, lineWidth, closed) {
  var pathNode = document.createElementNS("http://www.w3.org/2000/svg", "path");
  pathNode.setAttribute("d", pathData);
  pathNode.setAttribute("fill", closed ? "none" : "none");
  pathNode.setAttribute("stroke", strokeColor);
  pathNode.setAttribute("stroke-width", String(lineWidth));
  pathNode.setAttribute("stroke-linecap", "round");
  pathNode.setAttribute("stroke-linejoin", "round");
  return pathNode;
}

function svgCircle(centerX, centerY, radius, fillColor) {
  var circleNode = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circleNode.setAttribute("cx", String(centerX));
  circleNode.setAttribute("cy", String(centerY));
  circleNode.setAttribute("r", String(radius));
  circleNode.setAttribute("fill", fillColor);
  return circleNode;
}

function leafShape(centerX, centerY, angle, length) {
  var halfWidth = Math.max(1, length * 0.3);
  var directionX = Math.cos(angle);
  var directionY = Math.sin(angle);
  var tipX = centerX + directionX * length * 0.5;
  var tipY = centerY + directionY * length * 0.5;
  var tailX = centerX - directionX * length * 0.5;
  var tailY = centerY - directionY * length * 0.5;
  var bulgeX = -directionY * halfWidth;
  var bulgeY = directionX * halfWidth;
  return "M " + tailX + " " + tailY +
    " Q " + (centerX + bulgeX) + " " + (centerY + bulgeY) + " " + tipX + " " + tipY +
    " Q " + (centerX - bulgeX) + " " + (centerY - bulgeY) + " " + tailX + " " + tailY + " Z";
}

function cornerVine(cornerX, cornerY, inwardX, inwardY, size) {
  var startX = cornerX + inwardX * size * 1.5;
  var startY = cornerY + inwardY * size * 0.16;
  var shoulderX = cornerX + inwardX * size * 0.1;
  var shoulderY = cornerY + inwardY * size * 1.5;
  var path = "M " + startX + " " + startY;
  path += " C " + (cornerX + inwardX * size * 0.42) + " " + (cornerY + inwardY * size * 0.12) +
    ", " + (cornerX + inwardX * size * 0.12) + " " + (cornerY + inwardY * size * 0.42) +
    ", " + shoulderX + " " + shoulderY;
  path += " C " + (cornerX + inwardX * size * 0.12) + " " + (cornerY + inwardY * size * 0.72) +
    ", " + (cornerX + inwardX * size * 0.66) + " " + (cornerY + inwardY * size * 0.96) +
    ", " + (cornerX + inwardX * size * 0.92) + " " + (cornerY + inwardY * size * 0.46);
  return path;
}

function rebuildFrame() {
  if (!frameSvgEl) { return; }
  try {
    var width = viewWidth;
    var height = viewHeight;
    var inset = Math.max(13, Math.min(width, height) * 0.038);
    var innerInset = inset + Math.max(5, inset * 0.22);
    frameSvgEl.setAttribute("viewBox", "0 0 " + width + " " + height);
    while (frameSvgEl.firstChild) { frameSvgEl.removeChild(frameSvgEl.firstChild); }

    var glowColor = rgbaColor(230, 218, 192, 0.24);
    var faintColor = rgbaColor(214, 206, 184, 0.12);

    frameSvgEl.appendChild(svgPath(
      "M " + inset + " " + inset + " L " + (width - inset) + " " + inset +
      " L " + (width - inset) + " " + (height - inset) + " L " + inset + " " + (height - inset) + " Z",
      glowColor, 1, true
    ));
    frameSvgEl.appendChild(svgPath(
      "M " + innerInset + " " + innerInset + " L " + (width - innerInset) + " " + innerInset +
      " L " + (width - innerInset) + " " + (height - innerInset) + " L " + innerInset + " " + (height - innerInset) + " Z",
      faintColor, 1, true
    ));

    var curlSize = Math.min(width, height) * 0.088;
    var corners = [
      [inset, inset, 1, 1],
      [width - inset, inset, -1, 1],
      [width - inset, height - inset, -1, -1],
      [inset, height - inset, 1, -1]
    ];
    for (var index = 0; index < corners.length; index++) {
      var corner = corners[index];
      frameSvgEl.appendChild(svgPath(cornerVine(corner[0], corner[1], corner[2], corner[3], curlSize), glowColor, 1.5));
      var leafX = corner[0] + corner[2] * curlSize * 1.02;
      var leafY = corner[1] + corner[3] * curlSize * 0.6;
      frameSvgEl.appendChild(svgPath(
        leafShape(leafX, leafY, Math.atan2(-corner[3], -corner[2]) + 0.35, curlSize * 0.52),
        faintColor, 1
      ));
      frameSvgEl.appendChild(svgCircle(corner[0] + corner[2] * inset * 0.55, corner[1] + corner[3] * inset * 0.55, 1.5, faintColor));
    }

    var ornamentSize = Math.min(width, height) * 0.03;
    var ornamentSpots = [
      [width * 0.5, innerInset, 1],
      [width * 0.5, height - innerInset, -1]
    ];
    for (var spotIndex = 0; spotIndex < ornamentSpots.length; spotIndex++) {
      var spot = ornamentSpots[spotIndex];
      for (var wingIndex = 0; wingIndex < 2; wingIndex++) {
        var sideSign = wingIndex === 0 ? -1 : 1;
        frameSvgEl.appendChild(svgPath(
          leafShape(spot[0] + sideSign * ornamentSize * 1.4, spot[1] + spot[2] * ornamentSize * 0.5,
            sideSign > 0 ? -0.5 : Math.PI + 0.5, ornamentSize * 1.5),
          faintColor, 1
        ));
      }
      frameSvgEl.appendChild(svgCircle(spot[0], spot[1] + spot[2] * ornamentSize * 0.4, 1.6, faintColor));
    }
  } catch (error) {
    reportError("rebuildFrame", error);
  }
}

/* ---------- 歌词引擎 ---------- */
function findLineIndex(time) {
  var foundIndex = -1;
  var limit = Math.min(lineList.length, 400);
  for (var index = 0; index < limit; index++) {
    if (lineList[index].t <= time + 0.05) { foundIndex = index; }
  }
  return foundIndex;
}

function rebuildSpans(line) {
  lineCurEl.textContent = "";
  charSpans = [];
  charTimes = [];
  litCount = 0;
  if (!line) { return; }
  var text = line.text || "";
  var limit = Math.min(text.length, 240);
  if (limit <= 0) { return; }
  var charsData = (line.chars && line.chars.length) ? line.chars : null;
  var fallbackSpan = Math.max(1.4, line.dur > 0 ? line.dur : Math.max(1.8, text.length * 0.24));
  var fragment = document.createDocumentFragment();
  for (var index = 0; index < limit; index++) {
    var character = text.charAt(index);
    var span = document.createElement("span");
    span.className = "ch";
    span.textContent = character === " " ? "\u00a0" : character;
    fragment.appendChild(span);
    charSpans.push(span);
    var charTime = line.t + (index / Math.max(1, limit)) * fallbackSpan;
    if (charsData && index < charsData.length && charsData[index] && isFinite(Number(charsData[index].t))) {
      charTime = Number(charsData[index].t);
    }
    charTimes.push(charTime);
  }
  lineCurEl.appendChild(fragment);
  lineCurEl.classList.toggle("line--dense", text.length > 30);
  lineCurEl.classList.toggle("line--tiny", text.length > 48);
}

function paintCharProgress(targetCount) {
  var bounded = Math.min(charSpans.length, Math.max(0, targetCount));
  if (bounded === litCount) { return; }
  if (bounded > litCount) {
    for (var index = litCount; index < bounded; index++) {
      if (charSpans[index]) { charSpans[index].classList.add("on"); }
    }
  } else {
    for (var revertIndex = bounded; revertIndex < litCount; revertIndex++) {
      if (charSpans[revertIndex]) { charSpans[revertIndex].classList.remove("on"); }
    }
  }
  litCount = bounded;
}

function renderLines() {
  try {
    var current = (stageState.idx >= 0 && stageState.idx < lineList.length) ? lineList[stageState.idx] : null;
    var previous = (stageState.idx > 0) ? lineList[stageState.idx - 1] : null;
    var upcoming = (stageState.idx + 1 >= 0 && stageState.idx + 1 < lineList.length) ? lineList[stageState.idx + 1] : null;
    linePrevEl.textContent = previous ? previous.text : "";
    lineNextEl.textContent = upcoming ? upcoming.text : "";
    lineCurEl.classList.remove("line--dense", "line--tiny");
    rebuildSpans(current);
    stageState.text = current ? current.text : "";
  } catch (error) {
    reportError("renderLines", error);
  }
}

function updateLyrics() {
  try {
    var targetIndex = findLineIndex(clockTime);
    if (targetIndex !== stageState.idx) {
      stageState.idx = targetIndex;
      renderLines();
    }
    if (stageState.idx < 0) { return; }
    var targetCount = 0;
    for (var index = 0; index < charTimes.length; index++) {
      if (charTimes[index] <= clockTime + 0.01) { targetCount = index + 1; }
    }
    paintCharProgress(targetCount);
  } catch (error) {
    reportError("updateLyrics", error);
  }
}

function updateEmptyState() {
  var hasLines = lineList.length > 0;
  if (emptyStateEl) { emptyStateEl.classList.toggle("is-on", !hasLines); }
  document.body.classList.toggle("no-lyrics", !hasLines);
}

/* ---------- 时钟：tick 无条件采纳 ---------- */
function advanceClock(deltaSeconds) {
  sceneClock += deltaSeconds;
  if (hasTick && stageState.playing) {
    clockTime = tickBaseTime + (nowTime() - tickBaseAt) / 1000;
    stageState.t = clockTime;
  }
  if (beatPulse > 0) {
    beatPulse = Math.max(0, beatPulse - deltaSeconds * 2.15);
  }
}

/* ---------- 主循环 ---------- */
function animationLoop(stamp) {
  var frameStamp = (typeof stamp === "number" && isFinite(stamp)) ? stamp : 0;
  try {
    var deltaSeconds = lastFrameStamp > 0 ? (frameStamp - lastFrameStamp) / 1000 : 0.016;
    lastFrameStamp = frameStamp;
    if (!(deltaSeconds > 0) || deltaSeconds > 0.6) { deltaSeconds = 0.016; }
    sendReady();
    if (bakeQueue.length > 0) {
      var bakeTask = bakeQueue.shift();
      try {
        bakeTask();
      } catch (error) {
        reportError("bakeTask", error);
      }
    }
    advanceClock(deltaSeconds);
    updateLyrics();
    drawFrame(deltaSeconds);
    stageState.frames += 1;
  } catch (error) {
    reportError("animationLoop", error);
  }
  window.requestAnimationFrame(animationLoop);
}

/* ---------- 消息 ---------- */
function applyInit(payload) {
  try {
    var safePayload = payload || {};
    var song = safePayload.song || {};
    var songName = song.name == null ? "" : String(song.name);
    var songArtists = artistText(song.artists);
    songNameEl.textContent = songName;
    songArtistEl.textContent = songArtists;
    document.body.classList.toggle("no-head", !songName && !songArtists);

    var accent = safePayload.accent;
    if (accent && accent.length >= 3) {
      accentColor = [clampChannel(accent[0]), clampChannel(accent[1]), clampChannel(accent[2])];
    }
    document.documentElement.style.setProperty("--accent-rgb",
      accentColor[0] + ", " + accentColor[1] + ", " + accentColor[2]);

    var cover = typeof song.cover === "string" ? song.cover : "";
    if (medallionEl) {
      if (cover && coverImageEl) {
        medallionEl.classList.add("is-on");
        coverImageEl.setAttribute("src", cover);
      } else {
        medallionEl.classList.remove("is-on");
        if (coverImageEl) { coverImageEl.removeAttribute("src"); }
      }
    }

    var incoming = (safePayload.lines && safePayload.lines.length) ? safePayload.lines : [];
    lineList = [];
    var lineLimit = Math.min(incoming.length, 400);
    for (var index = 0; index < lineLimit; index++) {
      var rawLine = incoming[index] || {};
      var bodyText = rawLine.text == null ? "" : String(rawLine.text);
      if (!bodyText.replace(/\s+/g, "")) { continue; }
      lineList.push({
        t: clampNumber(rawLine.t, 0, 1e6, 0),
        dur: clampNumber(rawLine.dur, 0, 600, 0),
        text: bodyText,
        chars: rawLine.chars || null
      });
    }

    stageState.lines = lineList.length;
    stageState.idx = -1;
    stageState.text = "";

    var incomingId = song.id == null ? "" : String(song.id);
    var songChanged = incomingId !== currentSongId;
    currentSongId = incomingId;
    if (songChanged || !hasTick) {
      clockTime = 0;
      tickBaseTime = 0;
      tickBaseAt = nowTime();
      stageState.t = 0;
      if (songChanged) { stageState.playing = true; }
    }
    updateEmptyState();
    renderLines();
    if (hasTick) {
      updateLyrics();
    }
  } catch (error) {
    reportError("init", error);
  }
}

function applyTick(payload) {
  try {
    if (!payload) { return; }
    var nextTime = Number(payload.time);
    if (isFinite(nextTime)) {
      tickBaseTime = nextTime;
      tickBaseAt = nowTime();
      clockTime = nextTime;
      stageState.t = nextTime;
      hasTick = true;
    }
    if (typeof payload.playing === "boolean") { stageState.playing = payload.playing; }
  } catch (error) {
    reportError("tick", error);
  }
}

function applyBeat(payload) {
  try {
    if (!payload) { return; }
    var level = clampNumber(payload.level, 0, 1, 0.5);
    beatPulse = Math.max(beatPulse, level);
  } catch (error) {
    reportError("beat", error);
  }
}

function applyLive(payload) {
  try {
    if (!payload) { return; }
    liveLevel = clampNumber(payload.level, 0, 1, liveLevel);
    var bass = clampNumber(payload.bass, 0, 1, 0);
    beatPulse = Math.max(beatPulse, bass * 0.55 + liveLevel * 0.18);
    if (typeof payload.playing === "boolean") { stageState.playing = payload.playing; }
  } catch (error) {
    reportError("live", error);
  }
}

window.addEventListener("message", function (event) {
  var data = event.data;
  if (!data || data.__c100 !== 1) { return; }
  if (data.type === "init") { applyInit(data.payload || {}); }
  else if (data.type === "tick") { applyTick(data.payload || {}); }
  else if (data.type === "beat") { applyBeat(data.payload || {}); }
  else if (data.type === "live") { applyLive(data.payload || {}); }
}, false);

if (coverImageEl) {
  coverImageEl.addEventListener("error", function () {
    if (medallionEl) { medallionEl.classList.remove("is-on"); }
  }, false);
}

window.addEventListener("resize", function () {
  try { resizeScene(); } catch (error) { reportError("resize", error); }
}, false);

requestAnimationFrame(animationLoop);
requestAnimationFrame(function () { sendReady(); });
setTimeout(sendReady, 800);
buildGrainTexture();
resizeScene();

</script>
</body>
</html>
