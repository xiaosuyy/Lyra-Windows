<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aloha Tube</title>
<style>
  :root{
    --paper:#f7eccd; --coral:#f2603c; --teal:#0a5361; --sun:#ffcf3d; --ink:#062a33;
    --brush:"Brush Script MT","Snell Roundhand","Segoe Script","Kaiti SC","STKaiti","KaiTi",cursive;
    --sans:"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  html,body{margin:0;height:100%;background:var(--teal);overflow:hidden;font-family:var(--brush);}
  #w{position:fixed;inset:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #cc{opacity:.94}
  #ch{mix-blend-mode:multiply;opacity:.9}
  #ci{opacity:.97}
  #lyr{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:3.6vh 6vw 4.4vh;text-align:center;
    pointer-events:none;background:var(--paper);font-family:var(--brush);
    box-shadow:inset 0 .9vh 0 rgba(242,96,60,.95), 0 -1.6vh 3vh rgba(4,38,47,.22);}
  #lyr::before{content:"";position:absolute;left:0;right:0;top:0;height:1.15vh;
    background:repeating-linear-gradient(135deg,
      var(--teal) 0 9px, var(--paper) 9px 18px, var(--coral) 18px 27px, var(--paper) 27px 36px);}
  #swash{height:.62vh;width:62%;margin:1.5vh auto 0;border-radius:99px;
    background:linear-gradient(90deg,#f2603c,#f7a33c);
    transform-origin:50% 50%;transform:scaleX(0);opacity:.85}
  .curline{color:#0d4652;font-weight:700;line-height:1.22;letter-spacing:.01em;
    font-size:clamp(23px,5.1vw,68px);
    word-break:break-word;overflow-wrap:anywhere;max-width:100%;margin:0 auto;}
  .curline .ch{display:inline-block;white-space:pre;color:#5c8a8f;
    transition:color .12s linear,text-shadow .12s linear}
  .curline .ch.on{color:#bf3213;text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .ghost,.next{font-family:var(--brush);color:#356b73;opacity:.68;line-height:1.25;
    font-size:clamp(13px,1.9vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:88%;margin:0 auto;}
  .ghost{margin-bottom:.9vh;opacity:.56}
  .next{margin-top:.9vh;opacity:.60}
  #cap{position:absolute;left:3.4vw;top:3.2vh;z-index:7;font-family:var(--sans);
    font-size:clamp(9px,1.05vw,13px);letter-spacing:.24em;text-transform:uppercase;
    color:#0b4b58;max-width:52vw;line-height:1.7;opacity:.9}
  #cap b{display:block;font-weight:700;letter-spacing:.3em}
  #cap span{opacity:.72;letter-spacing:.2em}
  #empty{position:absolute;left:0;right:0;top:26%;z-index:6;
    font-family:var(--sans);font-size:clamp(10px,1.3vw,15px);letter-spacing:.42em;
    color:#0b4b58;text-transform:uppercase;opacity:.62;text-align:center;
    text-shadow:0 1px 0 rgba(255,246,220,.7)}
  #empty[hidden]{display:none}
  @media (prefers-reduced-motion: reduce){ .curline .ch{transition:none} }
</style>
</head>
<body>
<div id="w">
  <canvas id="cc"></canvas>
  <canvas id="ch"></canvas>
  <canvas id="ci"></canvas>
  <div id="cap"><b id="sname"></b><span id="sart"></span></div>
  <div id="empty" hidden>纯音乐 · 无词</div>
  <div id="lyr">
    <div class="ghost" id="prev"></div>
    <div class="curline" id="cur"></div>
    <div id="swash"></div>
    <div class="next" id="next"></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var RM = false;
  try{ RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var state = { lines:[], idx:-1, t:0, playing:true, frames:0, js:0, err:'', gl:false, rm:RM };
  var ready = false;
  var curEl = document.getElementById('cur');
  var prevEl = document.getElementById('prev');
  var nextEl = document.getElementById('next');
  var emptyEl = document.getElementById('empty');
  var snameEl = document.getElementById('sname');
  var sartEl = document.getElementById('sart');
  var swashEl = document.getElementById('swash');
  var curKey = '\u0000', prevKey = '\u0000', nextKey = '\u0000';

  // ---- 尺寸 / 缓冲 ----
  var W = 1440, H = 900, DPR = 1;
  var cc = document.getElementById('cc'), ch = document.getElementById('ch'), ci = document.getElementById('ci');
  var cctx = null, hctx = null, ictx = null;
  var pBlot = null, pPaper = '#f7eccd', pCoral = '#ef5a35', pInk = '#0a3138', pSky = '#bfe6e2';
  var grid = [], rays = [], sprites = [];
  var patHalf = null, patBlot = null, pFore = null;
  var songT = 0, songTAt = 0, songEst = 0;
  var lay = { portrait:false, compact:false, tubeCx:0, tubeCy:0, tubeR:1 };
  var meta = { id:'', name:'', artists:'', cover:'' };
  var accent = [242,96,60];
  var accentDark = [170,54,32];
  var bpm = 0, lvl = 0, bass = 0, mid = 0, treb = 0, beatPulse = 0;
  var lastBeatAt = -9999, spin = 0, sceneT = 0;
  var reduced = RM;
  var errFlag = '';
  var initSeq = 0;

  function clampN(v,a,b){ return v < a ? a : (v > b ? b : v); }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function hex(rgb){ return '#' + pad2(rgb[0].toString(16)) + pad2(rgb[1].toString(16)) + pad2(rgb[2].toString(16)); }
  function mixRGB(a,b,k){ return [Math.round(a[0]+(b[0]-a[0])*k),Math.round(a[1]+(b[1]-a[1])*k),Math.round(a[2]+(b[2]-a[2])*k)]; }
  function rgba(rgb,a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }
  // 2D 关掉 alpha 的画布不算 WebGL
  function mkCanvas(w,h){
    var c = document.createElement('canvas');
    c.width = Math.max(1,Math.round(w)); c.height = Math.max(1,Math.round(h));
    return c;
  }
  function setA(ctx,a){ try{ ctx.globalAlpha = a; }catch(e){} }
  function roundRect(ctx,x,y,w,h,r){
    var rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function safeCtx(c){
    if(!c) return null;
    try{ return c.getContext('2d'); }catch(e){ console.error('[438] 2d ctx',e); return null; }
  }
  cctx = safeCtx(cc); hctx = safeCtx(ch); ictx = safeCtx(ci);
  if(!cctx || !hctx || !ictx){ errFlag = '2d context unavailable'; state.err = errFlag; }

  // ---- 尺寸 ----
  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    if(!isFinite(w) || w < 2) w = 1440;
    if(!isFinite(h) || h < 2) h = 900;
    W = w; H = h;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    DPR = dpr;
    var cw = Math.max(2, Math.round(W * dpr)), chh = Math.max(2, Math.round(H * dpr));
    var cs = [cc, ch, ci], cx = [cctx, hctx, ictx];
    for(var i=0;i<3;i++){
      if(!cs[i]) continue;
      cs[i].width = cw; cs[i].height = chh;
    }
    for(var j=0;j<3;j++){ if(cx[j]){ try{ cx[j].setTransform(dpr,0,0,dpr,0,0); }catch(e){} } }
    patHalf = null; patBlot = null;
    lay.portrait = H > W * 1.05;
    lay.compact = W < 560 || H < 460;
    lay.tubeCx = lay.portrait ? W * 0.50 : W * 0.275;
    lay.tubeCy = lay.portrait ? H * 0.360 : H * 0.415;
    lay.tubeR = lay.portrait ? Math.min(W * 0.46, H * 0.25) : Math.min(W * 0.27, H * 0.34);
    buildAssets();
    buildHalftone();
    bakeForeground();
  }

  // ---- 程序化贴图：帆布颗粒 / 套印网点 / 浪花泡沫 ----
  function buildGrid(){
    var s = 84, c = mkCanvas(s,s), x = c.getContext('2d');
    if(!x) return null;
    x.clearRect(0,0,s,s);
    x.fillStyle = '#000';
    var step = 7;
    for(var yy=step/2; yy<s; yy+=step){
      for(var xx=step/2; xx<s; xx+=step){
        var d = 2.5 * (0.55 + 0.45*Math.sin(xx*3.1 + yy*1.7));
        x.beginPath(); x.arc(xx,yy,d,0,6.2832); x.fill();
      }
    }
    return c;
  }
  function buildFoam(){
    sprites = [];
    for(var i=0;i<5;i++){
      var c = mkCanvas(96,160), x = c.getContext('2d');
      if(!x) return;
      var g = x.createRadialGradient(48,80,2,48,80,78);
      g.addColorStop(0,'rgba(255,255,255,.95)');
      g.addColorStop(.5,'rgba(255,255,255,.45)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(48,80,78,0,6.2832); x.fill();
      for(var k=0;k<24;k++){
        x.fillStyle = 'rgba(255,255,255,' + (.18 + Math.random()*.5).toFixed(2) + ')';
        x.beginPath();
        x.arc(48 + (Math.random()-.5)*86, 80 + (Math.random()-.5)*128, .8 + Math.random()*4.2, 0, 6.2832);
        x.fill();
      }
      sprites.push(c);
    }
  }
  function buildRays(){
    rays = [];
    var n = 13;
    for(var i=0;i<n;i++){
      rays.push({ a:(i/n)*6.28318, w:.030 + (i%3)*.011, s:(i%2?1:-1) });
    }
  }
  function buildAssets(){
    pPaper = '#f7eccd';
    pCoral = '#ef5a35';
    pInk   = '#0a3138';
    pSky   = '#bfe6e2';
    buildBlot();
    grid = [buildGrid()];
    if(!sprites.length) buildFoam();
    buildRays();
  }

  // 套印"油墨不匀"贴图：程序化生成，无外部请求
  function buildBlot(){
    if(pBlot) return;
    var s = 320, c = mkCanvas(s,s), x = c.getContext('2d');
    if(!x) return;
    x.clearRect(0,0,s,s);
    for(var i=0;i<150;i++){
      var rr = 8 + Math.random()*54;
      var g = x.createRadialGradient(0,0,1,0,0,rr);
      var a = .02 + Math.random()*.05;
      g.addColorStop(0,'rgba(0,0,0,' + a.toFixed(3) + ')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      x.save();
      x.translate(Math.random()*s, Math.random()*s);
      x.scale(1, .5 + Math.random());
      x.fillStyle = g;
      x.beginPath(); x.arc(0,0,rr,0,6.2832); x.fill();
      x.restore();
    }
    // 少量白点做"漏墨"
    for(var k=0;k<120;k++){
      x.fillStyle = 'rgba(255,255,255,' + (.05 + Math.random()*.14).toFixed(3) + ')';
      x.beginPath(); x.arc(Math.random()*s, Math.random()*s, .6 + Math.random()*2.4, 0, 6.2832); x.fill();
    }
    pBlot = c;
  }


  window.__stage = function(){
    var text = '';
    if(state.idx >= 0 && state.lines[state.idx]) text = state.lines[state.idx].text || '';
    return { lines:state.lines.length, idx:state.idx, t:state.t, playing:!!state.playing,
      frames:state.frames, js:state.js, err:state.err, text:text, gl:state.gl, rm:!!state.rm };
  };

  function sendReady(){
    if(ready) return;
    ready = true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }
    catch(err){ console.error('[438] ready postMessage failed',err); state.err = String(err); }
  }

  function normLines(raw){
    var out = [];
    if(!raw || !raw.length) return out;
    var n = Math.min(raw.length, 3000);
    for(var i=0;i<n;i++){
      var l = raw[i]; if(!l) continue;
      var txt = (l.text === null || l.text === undefined) ? '' : String(l.text);
      if(!txt) continue;
      var t = Number(l.t); if(!isFinite(t) || t < 0) t = 0;
      var d = Number(l.dur); if(!isFinite(d) || d <= 0) d = 0;
      out.push({ t:t, dur:d, text:txt, chars:Array.isArray(l.chars) ? l.chars : null });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    return out;
  }

  function findIdx(t){
    var L = state.lines, lo = 0, hi = L.length - 1, r = -1;
    while(lo <= hi){
      var m = (lo + hi) >> 1;
      if(L[m].t <= t + 0.001){ r = m; lo = m + 1; } else { hi = m - 1; }
    }
    return r;
  }

  // ---- 歌词：当前句逐字点亮 ----
  var curChars = [], curCharsKey = '';
  function pickChars(line){
    var txt = line.text, out = [], i, n;
    var cs = line.chars;
    if(cs && cs.length){
      n = Math.min(cs.length, 400);
      for(i=0;i<n;i++){
        var o = cs[i];
        var ch = (o && o.c !== undefined && o.c !== null) ? String(o.c) : '';
        if(!ch) ch = (i < txt.length ? txt.charAt(i) : '');
        if(!ch) continue;
        var ct = Number(o && o.t);
        if(!isFinite(ct)) ct = line.t;
        out.push({ c:ch, t:ct * 1000 });
      }
      if(out.length) return out;
    }
    n = Math.min(txt.length, 400);
    var base = line.t * 1000;
    var span = line.dur > 0 ? line.dur * 1000 : Math.max(1200, n * 150);
    for(i=0;i<n;i++){
      out.push({ c: txt.charAt(i), t: base + span * (i / Math.max(1,n)) });
    }
    return out;
  }

  function buildLineDom(line){
    curEl.textContent = '';
    curChars = [];
    curCharsKey = '';
    if(!line){ return; }
    var parts = pickChars(line);
    var frag = document.createDocumentFragment();
    var maxN = Math.min(parts.length, 260);
    for(var i=0;i<maxN;i++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = parts[i].c;
      frag.appendChild(sp);
      curChars.push({ el:sp, t:parts[i].t, on:null });
    }
    curEl.appendChild(frag);
    curCharsKey = line.t + '|' + line.text;
    fitLine();
  }

  function fitLine(){
    var n = curChars.length;
    if(!n) return;
    var w = W * 0.90;
    var fs = clampN(Math.min(w / Math.max(4, n) * 1.30, Math.min(H * 0.19, W * 0.115)), 14, 110);
    if(n > 24) fs *= 0.84;
    if(n > 40) fs *= 0.84;
    if(n > 60) fs *= 0.86;
    curEl.style.fontSize = fs.toFixed(1) + 'px';
  }

  var lastPaintedMs = -1;
  function paintChars(){
    var n = curChars.length;
    if(!n) return;
    var nowMs = songEst * 1000;
    if(Math.abs(nowMs - lastPaintedMs) < 40) return;
    lastPaintedMs = nowMs;
    for(var i=0;i<n;i++){
      var c = curChars[i];
      var on = nowMs >= c.t;
      if(on !== c.on){ c.on = on; c.el.classList.toggle('on', on); }
    }
    // 笔刷进度条跟着唱到哪儿
    var line = (state.idx >= 0 && state.lines[state.idx]) ? state.lines[state.idx] : null;
    if(line && swashEl){
      var t0 = line.t * 1000;
      var t1 = line.dur > 0 ? (line.t + line.dur) * 1000 : (n ? curChars[n-1].t + 260 : t0 + 2000);
      var k = t1 > t0 ? (nowMs - t0) / (t1 - t0) : 0;
      k = clampN(k, 0, 1);
      swashEl.style.transform = 'scaleX(' + (0.001 + k * 0.999).toFixed(3) + ')';
    } else if(swashEl){
      swashEl.style.transform = 'scaleX(0.001)';
    }
  }

  function setGhost(el, key, txt){
    if(key === txt) return txt;
    el.textContent = txt || '';
    return txt;
  }

  function renderLine(force){
    var L = state.lines, i = state.idx, line = (i >= 0 && L[i]) ? L[i] : null;
    var txt = line ? line.text : '';
    var key = i + '|' + txt;
    if(key !== curKey || force){
      curKey = key;
      buildLineDom(line);
      lastPaintedMs = -1;
    }
    var pi = i - 1, ni = i + 1;
    if(i < 0) pi = -1;
    prevKey = setGhost(prevEl, prevKey, (pi >= 0 && L[pi]) ? L[pi].text : '');
    nextKey = setGhost(nextEl, nextKey, (ni >= 0 && ni < L.length && L[ni]) ? L[ni].text : '');
    emptyEl.hidden = L.length > 0;
    if(!L.length){
      prevKey = setGhost(prevEl, prevKey, '');
      nextKey = setGhost(nextEl, nextKey, '');
      curEl.textContent = '';
      curChars = [];
    }
  }

  function applyMeta(p){
    var m = p && p.song ? p.song : {};
    var name = (m && m.name) ? String(m.name) : '';
    var art = m ? m.artists : '';
    if(Array.isArray(art)) art = art.filter(function(x){ return x !== null && x !== undefined && x !== ''; }).join(' / ');
    else if(art === null || art === undefined) art = '';
    else art = String(art);
    meta.name = name; meta.artists = art; meta.id = (m && m.id) ? String(m.id) : '';
    snameEl.textContent = name || 'ALOHA';
    sartEl.textContent = art || 'SURF \u00b7 1962';
    var a = p && p.accent;
    if(Array.isArray(a) && a.length >= 3){
      var r = clampN(Math.round(Number(a[0])), 0, 255), g = clampN(Math.round(Number(a[1])), 0, 255), b = clampN(Math.round(Number(a[2])), 0, 255);
      if(isFinite(r) && isFinite(g) && isFinite(b)){
        accent = [r,g,b];
        accentDark = [Math.round(r*.6), Math.round(g*.55), Math.round(b*.55)];
      }
    }
  }

  function onMessage(ev){
    var d = ev && ev.data;
    if(!d || d.__c100 !== 1) return;
    try{
      if(d.type === 'init'){
        var p = d.payload || {};
        applyMeta(p);
        state.lines = normLines(p.lines);
        state.idx = -1;
        var t0 = Number(p.time);
        state.t = isFinite(t0) ? t0 : 0;
        songT = state.t; songEst = state.t;
        state.playing = (typeof p.playing === 'boolean') ? p.playing : true;
        if(!state.lines.length){ state.idx = -1; }
        renderLine(true);
      } else if(d.type === 'tick'){
        var tp = d.payload || {};
        var t = Number(tp.time);
        if(isFinite(t)){
          state.t = t;
          songT = t; songEst = t;
          var ni = findIdx(t);
          if(ni !== state.idx){ state.idx = ni; renderLine(false); }
        }
        if(typeof tp.playing === 'boolean') state.playing = tp.playing;
      } else if(d.type === 'beat'){
        var bp = d.payload || {};
        beatPulse = 1;
        lastBeatAt = sceneT;
        var bl = Number(bp.level);
        if(isFinite(bl)) lvl = clampN(bl, 0, 1);
      } else if(d.type === 'live'){
        var lp = d.payload || {};
        var nb = Number(lp.bpm); if(isFinite(nb) && nb > 20 && nb < 300) bpm = nb;
        var v;
        v = Number(lp.level);  if(isFinite(v)) lvl  = clampN(v,0,1);
        v = Number(lp.bass);   if(isFinite(v)) bass = clampN(v,0,1);
        v = Number(lp.mid);    if(isFinite(v)) mid  = clampN(v,0,1);
        v = Number(lp.treble); if(isFinite(v)) treb = clampN(v,0,1);
        if(typeof lp.playing === 'boolean') state.playing = lp.playing;
      }
    }catch(err){ console.error('[438] message error', err); state.err = String(err); }
  }
  window.addEventListener('message', onMessage);

  // ---- 主视觉：60s 丝网印套色海报 ----
  var bctxW = 0;

  function drawSky(ctx,t){
    var horizon = H * 0.462;
    var g = ctx.createLinearGradient(0,0,0,horizon);
    g.addColorStop(0,'#f8efd4');
    g.addColorStop(.34,'#f6e5c0');
    g.addColorStop(.70,'#f3d7ae');
    g.addColorStop(1,'#eec9a4');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,horizon + 2);

    // 珊瑚色日轮（后印一层）
    var sunR = Math.min(W,H) * 0.175;
    var sunX = W * 0.735, sunY = horizon - sunR * 0.78;
    if(W < H * 0.85){ sunX = W * 0.74; sunR = Math.min(W,H) * 0.20; sunY = horizon - sunR * 0.95; }
    rays.length || buildRays();
    var rot = reduced ? 0 : (spin * 0.16);
    for(var i=0;i<rays.length;i++){
      var r = rays[i];
      var a0 = r.a + rot * r.s;
      ctx.beginPath();
      ctx.moveTo(sunX, sunY);
      ctx.arc(sunX, sunY, sunR*6.2, a0, a0 + r.w);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? 'rgba(242,96,60,.20)' : 'rgba(255,207,61,.26)';
      ctx.fill();
    }

    var sg = ctx.createRadialGradient(sunX,sunY,2,sunX,sunY,sunR);
    sg.addColorStop(0,'#ffd94e'); sg.addColorStop(.78,'#f7b733'); sg.addColorStop(1,'#ef8b2c');
    ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,6.2832); ctx.fillStyle = sg; ctx.fill();
    // 套印错位
    ctx.beginPath(); ctx.arc(sunX - sunR*.055, sunY + sunR*.05, sunR*.995,0,6.2832);
    ctx.fillStyle = 'rgba(242,96,60,.20)'; ctx.fill();
  }

  function wavePath(ctx, baseY, amp, phase, freq, w){
    ctx.beginPath();
    ctx.moveTo(-8, H + 8);
    var stepX = Math.max(10, w / 44);
    var x = -8;
    while(x <= w + 8){
      var y = baseY + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.7 + phase * 1.6) * amp * .32;
      ctx.lineTo(x, y);
      x += stepX;
    }
    ctx.lineTo(w + 8, H + 8);
    ctx.closePath();
  }

  function drawSea(ctx,t){
    var horizon = H * 0.462;
    var g = ctx.createLinearGradient(0,horizon,0,H*0.80);
    g.addColorStop(0,'#9fdcd8'); g.addColorStop(.28,'#4fb4bc'); g.addColorStop(1,'#0d6c7c');
    ctx.fillStyle = g; ctx.fillRect(0,horizon,W,H - horizon + 2);

    var layers = [
      { y: H*0.505, amp: H*0.014, f: 0.0042, a: 0.55, col:'#a9e6e0', sp: 0.55 },
      { y: H*0.585, amp: H*0.022, f: 0.0033, a: 0.80, col:'#3ea2ae', sp: 0.85 },
      { y: H*0.672, amp: H*0.030, f: 0.0026, a: 0.96, col:'#0a5c6e', sp: 1.15 }
    ];
    for(var i=0;i<layers.length;i++){
      var L = layers[i];
      setA(ctx, L.a);
      wavePath(ctx, L.y, L.amp * (1 + lvl*.4), t * L.sp + i*1.7, L.f, W);
      ctx.fillStyle = L.col; ctx.fill();
      setA(ctx, .5);
      ctx.strokeStyle = 'rgba(255,248,225,.9)';
      ctx.lineWidth = Math.max(1.2, H * 0.003);
      ctx.stroke();
      setA(ctx, 1);
    }
  }

  // 管浪：卷曲的浪管 + 浪唇 + 光束
  function drawTube(ctx,t){
    var cx = lay.tubeCx, cy = lay.tubeCy;
    var R = lay.tubeR;
    var breathe = 1 + (lvl*.10) + (bass*.06);
    var curl = 2.05 + Math.sin(t*.42) * .10 + beatPulse * .18;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-.16 + Math.sin(t*.33)*.02);
    ctx.scale(breathe, breathe);

    // 浪身体（外轮廓）
    ctx.beginPath();
    ctx.moveTo(-R*1.06, R*.86);
    ctx.bezierCurveTo(-R*1.12, -R*.10, -R*.52, -R*.92, R*.20, -R*.94);
    ctx.bezierCurveTo(R*.92, -R*.95, R*1.10, -R*.28, R*.92, R*.20);
    ctx.bezierCurveTo(R*.80, R*.56, R*.40, R*.74, R*.08, R*.72);
    ctx.lineTo(-R*1.06, R*.86);
    ctx.closePath();
    var gr = ctx.createLinearGradient(-R, -R*.9, R*.9, R*.9);
    gr.addColorStop(0,'#136074'); gr.addColorStop(.42,'#0b4d60'); gr.addColorStop(.78,'#0a3f52'); gr.addColorStop(1,'#082f3f');
    ctx.fillStyle = gr; ctx.fill();

    // 浪管内壁（深色隧道）
    ctx.beginPath();
    ctx.moveTo(-R*.62, R*.62);
    ctx.bezierCurveTo(-R*.70, -R*.02, -R*.24, -R*.58, R*.30, -R*.56);
    ctx.bezierCurveTo(R*.74, -R*.55, R*.80, -R*.10, R*.60, R*.20);
    ctx.bezierCurveTo(R*.44, R*.44, -R*.10, R*.62, -R*.62, R*.62);
    ctx.closePath();
    var ig = ctx.createRadialGradient(R*.05, R*.05, R*.06, R*.05, R*.05, R*.92);
    ig.addColorStop(0,'#0a2b38'); ig.addColorStop(.55,'#0d4252'); ig.addColorStop(1,'#12657a');
    ctx.fillStyle = ig; ctx.fill();

    // 浪唇：沿开口的厚白浪舌
    ctx.beginPath();
    ctx.moveTo(-R*.62, R*.62);
    ctx.bezierCurveTo(-R*.70, -R*.02, -R*.24, -R*.58, R*.30, -R*.56);
    ctx.bezierCurveTo(R*.74, -R*.55, R*.80, -R*.10, R*.60, R*.20);
    ctx.lineWidth = Math.max(3, R*.085);
    ctx.strokeStyle = '#fdf6de';
    ctx.lineCap = 'round';
    ctx.stroke();
    setA(ctx,.5);
    ctx.lineWidth = Math.max(2, R*.034);
    ctx.strokeStyle = '#bfe9e4';
    ctx.stroke();
    setA(ctx,1);

    // 浪舌下方的背光
    var ug = ctx.createLinearGradient(0, -R*.5, 0, R*.3);
    ug.addColorStop(0,'rgba(255,224,150,.34)');
    ug.addColorStop(1,'rgba(255,224,150,0)');
    ctx.fillStyle = ug;
    ctx.beginPath();
    ctx.moveTo(-R*.60, R*.58);
    ctx.bezierCurveTo(-R*.66, -R*.02, -R*.22, -R*.54, R*.28, -R*.52);
    ctx.lineTo(R*.05, R*.30);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 浪花点：从浪唇向外飞的泡沫碎点
  function drawFoamDots(ctx,t){
    if(!sprites.length) return;
    var n = reduced ? 9 : Math.min(18, Math.round(8 + W / 130));
    for(var i=0;i<n;i++){
      var seed = i * 12.9898;
      var ph = (t * (0.30 + (i % 5) * 0.06) + i * 0.37) % 1;
      if(ph < 0) ph += 1;
      var ang = -0.55 + (i % 7) * 0.26 + Math.sin(t*.5 + seed) * .22;
      var rad = lay.tubeR * (0.62 + ((i * 37) % 100) / 100 * 1.15);
      var x = lay.tubeCx + Math.cos(ang) * rad * 1.10;
      var y = lay.tubeCy + Math.sin(ang) * rad * 0.70;
      var s = Math.min(W,H) * (0.030 + ((i*53)%100)/100*0.062) * (1 + lvl*.30);
      var sp = sprites[i % sprites.length];
      setA(ctx, clampN(0.34 + (1 - ph) * 0.34, 0, .78));
      try{ ctx.drawImage(sp, x - s, y - s*1.5, s*2, s*3); }catch(e){}
    }
    setA(ctx,1);
  }

  // 冲浪手剪影：站在浪管口
  function drawSurfer(ctx,t){
    var s = Math.min(W,H) * (lay.portrait ? 0.150 : 0.110);
    var cx = lay.tubeCx + lay.tubeR * 0.62 + Math.sin(t*.55) * W * 0.005;
    var cy = lay.tubeCy + lay.tubeR * 0.30 + Math.cos(t*.47) * H * 0.005;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(-0.20 + Math.sin(t*.8)*.03);
    ctx.scale(s/100, s/100);
    ctx.fillStyle = '#08222b';
    // 板
    ctx.beginPath();
    ctx.ellipse(0, 34, 62, 8.5, 0, 0, 6.2832);
    ctx.fill();
    // 腿
    ctx.lineWidth = 11; ctx.strokeStyle = '#08222b'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, 30); ctx.lineTo(-4, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16, 30); ctx.lineTo(6, 10); ctx.stroke();
    // 躯干
    ctx.beginPath(); ctx.ellipse(0, -8, 13, 22, .12, 0, 6.2832); ctx.fill();
    // 手臂
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-6, -18); ctx.lineTo(-42, -40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(40, -34); ctx.stroke();
    // 头
    ctx.beginPath(); ctx.arc(2, -38, 11.5, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // 火烈鸟霓虹招牌：暗底块上的一根霓虹，落在亮底之上靠块底托住对比
  function drawFlamingo(ctx,t){
    var s = Math.min(W * 0.135, H * 0.175);
    var cx = W * 0.865, cy = H * 0.395;
    if(lay.portrait){ cx = W * 0.740; cy = H * 0.300; s = Math.min(W * 0.30, H * 0.115); }
    var glow = .78 + (reduced ? 0 : (Math.sin(t*2.1)*.5+.5) * .14) + beatPulse * .18;
    // 深色背板，保证霓虹在米色天空上仍然亮得起来
    ctx.save();
    var bw = s * 2.05, bh = s * 1.72;
    ctx.fillStyle = 'rgba(9,52,62,.90)';
    setA(ctx, .88); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(cx,cy); ctx.scale(s/100, s/100);
    // 三层描叠加模拟霓虹辉光（比 shadowBlur 便宜得多）
    var neon = 'rgba(255,120,158,' + clampN(glow,0,1).toFixed(3) + ')';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,96,142,.20)'; ctx.lineWidth = 20;
    neonBody(ctx);
    ctx.strokeStyle = 'rgba(255,120,158,.42)'; ctx.lineWidth = 12;
    neonBody(ctx);
    ctx.strokeStyle = neon; ctx.lineWidth = 5;
    ctx.fillStyle = neon;
    neonBody(ctx);
    ctx.restore();
  }

  function neonBody(ctx){
    // 身子
    ctx.beginPath(); ctx.ellipse(0, 12, 34, 21, -.12, 0, 6.2832);
    ctx.stroke(); ctx.fill();
    // 脖子
    ctx.beginPath();
    ctx.moveTo(24, 4);
    ctx.bezierCurveTo(52, -14, 34, -46, 12, -46);
    ctx.bezierCurveTo(-2, -46, -6, -34, 2, -28);
    ctx.stroke();
    // 头 + 喙
    ctx.beginPath(); ctx.arc(6, -44, 7, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,-46); ctx.lineTo(-16,-53); ctx.lineTo(-1,-40); ctx.closePath(); ctx.fill();
    // 腿
    ctx.beginPath(); ctx.moveTo(-8,30); ctx.lineTo(-10,56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10,30); ctx.lineTo(12,56); ctx.stroke();
  }

  // 木质旅行车（Woodie Wagon）侧影：落在浪脚，不进明信片书写带
  function drawWoodie(ctx,t){
    var w = Math.min(W * 0.40, H * 0.62), h = w * 0.30;
    var x = lay.portrait ? W * 0.10 : W * 0.595;
    var y = (lay.portrait ? H * 0.640 : H * 0.615) + Math.sin(t*.9) * H * 0.0035;
    ctx.save();
    ctx.translate(x,y);
    var sx = w/300, sy = h/90;
    ctx.scale(sx,sy);
    // 车身
    ctx.fillStyle = '#f3e7c8';
    ctx.beginPath();
    ctx.moveTo(0,62); ctx.lineTo(6,34); ctx.lineTo(52,30); ctx.lineTo(74,6);
    ctx.lineTo(214,4); ctx.lineTo(238,28); ctx.lineTo(296,34); ctx.lineTo(298,62);
    ctx.closePath(); ctx.fill();
    // 木纹板
    ctx.fillStyle = '#8a4a26';
    ctx.beginPath(); ctx.moveTo(52,30); ctx.lineTo(74,6); ctx.lineTo(214,4); ctx.lineTo(238,28);
    ctx.lineTo(238,40); ctx.lineTo(52,42); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(16,60,72,.62)';
    ctx.beginPath(); ctx.moveTo(80,10); ctx.lineTo(118,10); ctx.lineTo(118,30); ctx.lineTo(80,30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(126,10); ctx.lineTo(166,10); ctx.lineTo(166,30); ctx.lineTo(126,30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(174,10); ctx.lineTo(208,10); ctx.lineTo(226,29); ctx.lineTo(174,29); ctx.closePath(); ctx.fill();
    // 木纹横条
    ctx.strokeStyle = 'rgba(120,62,30,.55)'; ctx.lineWidth = 2;
    for(var i=0;i<4;i++){
      ctx.beginPath(); ctx.moveTo(8, 44 + i*5); ctx.lineTo(292, 42 + i*5); ctx.stroke();
    }
    // 轮子
    ctx.fillStyle = '#0a2b35';
    ctx.beginPath(); ctx.arc(66,64,17,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(238,64,17,0,6.2832); ctx.fill();
    ctx.fillStyle = '#f3e7c8';
    ctx.beginPath(); ctx.arc(66,64,6.5,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(238,64,6.5,0,6.2832); ctx.fill();
    ctx.restore();
  }

  // 棕榈叶剪影（前景压边，静态预烘焙）
  function drawPalm(ctx,t,still){
    var s = Math.min(W * 0.40, H * 0.58);
    var cx = lay.portrait ? W * 1.02 : W * 0.955;
    var cy = lay.portrait ? H * 0.735 : H * 0.760;
    ctx.save(); ctx.translate(cx,cy);
    ctx.fillStyle = 'rgba(7,45,55,.92)';
    var n = 9;
    for(var i=0;i<n;i++){
      var a = -2.95 + i * 0.42 + (still ? 0 : Math.sin(t*.42 + i)*.018);
      var len = s * (0.52 + ((i*29)%100)/100 * 0.46);
      ctx.save(); ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(len*.5, -len*.20, len, len*.10);
      ctx.quadraticCurveTo(len*.5, len*.06, 0,0);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }


  function drawCaptionStamp(ctx,t,still){
    // 手绘邮资章：珊瑚色双圈 + 文字，纯装饰
    var r = Math.min(W,H) * 0.058;
    var cx = lay.portrait ? W * 0.845 : W * 0.905;
    var cy = lay.portrait ? H * 0.700 : H * 0.735;
    ctx.save(); ctx.translate(cx,cy);
    ctx.rotate(-.12 + (still ? 0 : Math.sin(t*.3)*.01));
    ctx.globalAlpha = .62;
    ctx.strokeStyle = '#f7eccd'; ctx.lineWidth = Math.max(1.4, r*.075);
    ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*.72,0,6.2832); ctx.stroke();
    ctx.font = '700 ' + (r*.30).toFixed(1) + 'px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f7eccd';
    ctx.fillText('ALOHA', 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawColor(ctx,t){
    ctx.clearRect(0,0,W,H);
    drawSky(ctx,t);
    drawSea(ctx,t);
    drawTube(ctx,t);
  }

  // 网点层：静态预烘焙（只在尺寸变化时重画），每帧只调透明度
  function buildHalftone(){
    if(!hctx || !grid[0]) return;
    hctx.setTransform(1,0,0,1,0,0);
    var cv = ch;
    hctx.clearRect(0,0,cv.width,cv.height);
    hctx.setTransform(DPR,0,0,DPR,0,0);
    var p = null;
    try{ p = hctx.createPattern(grid[0],'repeat'); }catch(e){ p = null; }
    if(!p) return;
    hctx.save();
    hctx.globalAlpha = .46; hctx.fillStyle = p;
    var y0 = H * 0.462;
    hctx.fillRect(0, y0, W, H - y0);
    hctx.globalAlpha = .22;
    hctx.fillRect(0, H*0.10, W, H*0.30);
    hctx.restore();
  }
  function drawHalftone(){
    if(!ch) return;
    var k = clampN(.70 + bass*.55 + mid*.15, .55, 1);
    ch.style.opacity = k.toFixed(2);
  }

  // 静态前景（棕榈 + 邮资章）预烘焙，省掉每帧大量路径
  function bakeForeground(){
    pFore = null;
    var c = mkCanvas(W * DPR, H * DPR);
    var x = c.getContext('2d');
    if(!x) return;
    x.setTransform(DPR,0,0,DPR,0,0);
    drawPalm(x, 0, true);
    drawCaptionStamp(x, 0, true);
    pFore = c;
  }
  function drawForeground(){
    if(!pFore) return;
    if(!ictx) return;
    try{ ictx.drawImage(pFore, 0, 0, W, H); }catch(e){}
  }

  function drawInk(ctx,t){
    ctx.clearRect(0,0,W,H);
    drawFoamDots(ctx,t);
    drawSurfer(ctx,t);
    drawWoodie(ctx,t);
    drawFlamingo(ctx,t);
    drawForeground();
    // 整幅"油墨不匀"：极淡一层，让套印看起来是印出来的
    if(pBlot && !reduced){
      if(!patBlot){ try{ patBlot = ctx.createPattern(pBlot,'repeat'); }catch(e){ patBlot = null; } }
      if(patBlot){
        ctx.save(); setA(ctx,.50); ctx.fillStyle = patBlot;
        ctx.fillRect(0,0,W,H); ctx.restore();
      }
    }
  }

  function render(){
    var t = reduced ? sceneT * .35 : sceneT;
    if(cctx) drawColor(cctx, t);
    drawHalftone();
    if(ictx) drawInk(ictx, t);
    paintChars();
  }

  // ---- 主循环 ----
  var last = 0;
  var acc = 0;
  function frame(ts){
    var t0 = (window.performance ? performance.now() : Date.now());
    state.frames++;
    if(!ready) sendReady();
    var dt = last ? Math.min(0.06, (ts - last) / 1000) : 0.016;
    last = ts;
    sceneT += dt;
    if(!isFinite(sceneT)) sceneT = 0;

    beatPulse *= Math.pow(0.02, dt);
    if(!isFinite(beatPulse) || beatPulse < 0.0005) beatPulse = 0;
    if(state.playing || reduced) spin += dt * (0.30 + lvl * 0.5);
    if(!isFinite(spin)) spin = 0;

    try{ render(); }
    catch(err){ console.error('[438] render error', err); state.err = String(err); }

    state.js = Math.max(0, (window.performance ? performance.now() : Date.now()) - t0);
    songT += dt;
    songEst = songT;
    requestAnimationFrame(frame);
  }

  // ---- 启动：先建尺寸与贴图，再进 rAF ----
  try{
    resize();
    renderLine(true);
  }catch(err){
    console.error('[438] 初始化失败，已回落基础渲染', err);
    state.err = String(err);
    W = 1440; H = 900;
  }
  requestAnimationFrame(frame);
  setTimeout(sendReady, 900);

  var rzTimer = 0;
  window.addEventListener('resize', function(){
    if(rzTimer) return;
    rzTimer = setTimeout(function(){
      rzTimer = 0;
      try{ resize(); renderLine(true); }
      catch(err){ console.error('[438] resize error', err); state.err = String(err); }
    }, 120);
  });
  try{
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    if(mq && mq.addEventListener){
      mq.addEventListener('change', function(e){ reduced = !!e.matches; state.rm = reduced; });
    }
  }catch(e){}
})();
</script>
</body>
