<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蚁群信息素</title>
<style>
  html,body{margin:0;height:100%;background:#0a0704;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(118% 94% at 50% 52%,transparent 34%,rgba(8,5,3,.55) 76%,rgba(3,2,1,.96))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(255,206,140,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   lyra06 · 蚁群信息素 —— 字不是"粒子摆出来的"，是**蚂蚁走出来的路**
   ---------------------------------------------------------------------------
   机制（和 001 吸附 / 004 落沙 / 05 磁流体都不同）：**轨迹沉积**。
     · 400 多只蚂蚁贴在地面上跑，每只都有一段"要去的节线点"
     · 到了就换下一段 —— 而且是换成**数组里相邻的采样点**，因为采样是扫描线顺序，
       相邻下标在空间上就挨着。于是蚂蚁会顺着笔画走，而不是乱跑
     · 每帧把自己这一小段路**画到一张离屏"地面"上**，同时地面极慢地褪色：
       走过的路越踩越亮（信息素自我强化），没蚁走的慢慢淡掉
     · 字就是这些亮起来的路 —— 蚂蚁唱到哪个字，那个字附近的蚁分泌更猛，路更亮

   为什么这样能看清字：蚂蚁**沿笔画行进**，轨迹天然是笔画；再叠上"越踩越亮"，
   笔画中心和边缘自然拉出浓淡差，所以是一笔有灰度的墨，而不是均匀的点阵。

   AE 手法：
     · 微距缓推（Slow Push）—— 整场一直在极缓慢地放大，像贴地跟拍
     · 顿帧 Hit-Stop + 定向震动 —— 换句那一下
     · 冲击波环 —— 每个字点亮时，从那个字向外扩一圈"气味波"
     · 缓急变速 —— 换句瞬间蚂蚁速度整体掉到 0.35 再拉回（像群体被惊动）
     · 镜头锁定 —— 缓慢偏向正在唱的那个字
     · 次级动作 —— 地面浮尘被蚁群搅动

   配色：琥珀 + 泥土棕
   ========================================================================== */

/* ============================ 0 · 画布 ============================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
let bgCv = null, ground = null, gctx = null;   // 地面：蚁走过的新痕迹（会褪）
let baseCv = null, bctx = null;                 // 地面：信息素底色（不褪）
let GW = 0, GH = 0;
const GK = 2;                                   // 地面降采样倍数
let L = null, curIdx = -1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  GW = Math.max(2, Math.round(W / GK)); GH = Math.max(2, Math.round(H / GK));
  if (!ground) ground = document.createElement('canvas');
  ground.width = GW; ground.height = GH;
  gctx = ground.getContext('2d');
  /* 底色层单独一张：它不能跟着蚁的痕迹一起褪色，
     否则几百毫秒就被 destination-out 擦干净，字直接没了。 */
  if (!baseCv) baseCv = document.createElement('canvas');
  baseCv.width = GW; baseCv.height = GH;
  bctx = baseCv.getContext('2d');
  buildBg();
  if (L && curIdx >= 0) assignLine(curIdx);
}
addEventListener('resize', resize);

/* ============================ 1 · 时钟 ============================ */
let lines = [];
let accent = [255, 188, 112];                   // 琥珀
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ============================ 2 · 分词（词典法 + 双向最大匹配） ============================ */
let DICT = null;
fetch('/segdict.bin').then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); }).catch(() => {});
const fnv = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function isWord(s, i, Ln) {
  if (!DICT) return false;
  const h = fnv(s.substr(i, Ln));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = DICT[m]; if (v === h) return true; if (v < h) lo = m + 1; else hi = m - 1; }
  return false;
}
function segWords(text) {
  const fwd = [];
  for (let i = 0; i < text.length;) {
    let hit = 0;
    for (let Ln = Math.min(4, text.length - i); Ln >= 2; Ln--) if (isWord(text, i, Ln)) { hit = Ln; break; }
    if (hit) { fwd.push(text.substr(i, hit)); i += hit; } else { fwd.push(text[i]); i++; }
  }
  const bwd = [];
  for (let j = text.length; j > 0;) {
    let hit = 0;
    for (let Ln = Math.min(4, j); Ln >= 2; Ln--) if (isWord(text, j - Ln, Ln)) { hit = Ln; break; }
    if (hit) { bwd.unshift(text.substr(j - hit, hit)); j -= hit; } else { bwd.unshift(text[j - 1]); j--; }
  }
  return fwd.length <= bwd.length ? fwd : bwd;
}
const MAXG = 3;
const PUNCT = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】"]/;
const SPACE = /\s/;
function isLatin(text) { let la = 0, cjk = 0; for (let i = 0; i < text.length; i++) { const c = text[i]; if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++; else if (c >= '\u4e00' && c <= '\u9fff') cjk++; } return la > cjk; }
function latinSpans(text) {
  const out = []; let i = 0;
  while (i < text.length) {
    if (SPACE.test(text[i])) { i++; continue; }
    let j = i; while (j < text.length && !SPACE.test(text[j])) j++;
    out.push({ i0: i, i1: j }); i = j;
  }
  return out;
}
const SUFFIX = /^[的了着过地得吗呢吧啊嘛]$/;
const PREFIX = /^[但还就才又也都把被在从向对和与而却很不没最更将已曾让给]$/;
const countChars = (s) => { let n = 0; for (let i = 0; i < s.length; i++) if (!PUNCT.test(s[i]) && !SPACE.test(s[i])) n++; return n; };
function groupByWords(text) {
  const words = segWords(text), out = [];
  let cur = '', start = 0, chars = 0, pos = 0;
  const flush = (end) => { if (cur) { out.push({ i0: start, i1: end }); cur = ''; chars = 0; } };
  for (const w of words) {
    const at = pos; pos += w.length;
    const isP = PUNCT.test(w);
    if (!cur) { cur = w; start = at; chars = isP ? 0 : w.length; continue; }
    if (isP) { cur += w; if (chars >= 2) flush(pos); continue; }
    const single = w.length === 1;
    if (single && SUFFIX.test(w)) { cur += w; chars++; if (chars >= MAXG) flush(pos); continue; }
    if (single && PREFIX.test(w) && chars >= 2) { flush(at); cur = w; start = at; chars = 1; continue; }
    if (chars + w.length <= MAXG) { cur += w; chars += w.length; } else { flush(at); cur = w; start = at; chars = w.length; }
  }
  flush(text.length);
  for (let k = 0; k < out.length; k++) {
    const g = out[k];
    if (countChars(text.slice(g.i0, g.i1)) > 1) continue;
    const prev = out[k - 1], next = out[k + 1];
    if (prev && prev.i1 === g.i0 && countChars(text.slice(prev.i0, prev.i1)) < MAXG) { prev.i1 = g.i1; out.splice(k, 1); k--; }
    else if (next && next.i0 === g.i1 && countChars(text.slice(next.i0, next.i1)) < MAXG) { next.i0 = g.i0; out.splice(k, 1); k--; }
  }
  return out;
}
function groupByRule(text) {
  const out = []; let start = 0, chars = 0;
  for (let i = 0; i < text.length; i++) {
    const s = PUNCT.test(text[i]) || SPACE.test(text[i]);
    if (!s) chars++;
    if (s && chars >= 2) { out.push({ i0: start, i1: i + 1 }); start = i + 1; chars = 0; continue; }
    if (!s && chars > MAXG) { out.push({ i0: start, i1: i }); start = i; chars = 1; }
  }
  if (start < text.length) out.push({ i0: start, i1: text.length });
  return out;
}
const spansForLine = (t) => (isLatin(t) ? latinSpans(t) : (DICT ? groupByWords(t) : groupByRule(t)));

/* ============================ 3 · 字形采样 ============================ */
const offCv = document.createElement('canvas');
const octx = offCv.getContext('2d', { willReadFrequently: true });
const FONT = (px, wt) => `${wt || 800} ${px}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
function wrapText(text, fs, maxW, wt) {
  octx.font = FONT(fs, wt);
  /* 拉丁行按**整词**折行（按字符断会把 goodbye 切成 g/oodbye） */
  const latin = isLatin(text);
  const rows = []; let start = 0, w = 0;
  for (let i = 0; i < text.length; i++) {
    const cw = octx.measureText(text[i]).width;
    if (!cw) continue;
    if (w + cw > maxW && i > start) {
      let brk = i;
      if (latin) { let j = i; while (j > start && !SPACE.test(text[j])) j--; if (j > start) brk = j; }
      rows.push({ i0: start, i1: brk, w: octx.measureText(text.slice(start, brk)).width });
      start = brk; w = 0;
      while (start < text.length && SPACE.test(text[start])) start++;
      if (start >= text.length) break;
      i = start - 1; continue;
    }
    w += cw;
  }
  if (start < text.length) rows.push({ i0: start, i1: text.length, w: octx.measureText(text.slice(start)).width });
  for (const r of rows) while (r.i1 - r.i0 > 1 && SPACE.test(text[r.i0])) r.i0++;
  return rows.length ? rows : [{ i0: 0, i1: text.length, w: octx.measureText(text).width }];
}
function sampleGlyph(text, opt) {
  opt = opt || {};
  const wt = opt.weight || 800;
  let fs = opt.fs || 92;
  const maxW = opt.maxW || Math.min(W * 0.70, 1120);
  const maxH = opt.maxH || H * 0.46;
  let rows = wrapText(text, fs, maxW, wt);
  let lh = fs * 1.16;
  if (rows.length * lh > maxH) { fs *= maxH / (rows.length * lh); rows = wrapText(text, fs, maxW, wt); lh = fs * 1.16; }
  octx.font = FONT(fs, wt);
  const widest = Math.max(1, ...rows.map((r) => octx.measureText(text.slice(r.i0, r.i1)).width));
  const padW = Math.ceil(widest) + 24, padH = Math.ceil(lh * rows.length) + 12;
  offCv.width = padW; offCv.height = padH;
  /* 改尺寸会重置上下文 → font 必须重新设，否则 measureText 全错、字挤成一团 */
  octx.font = FONT(fs, wt);
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.clearRect(0, 0, padW, padH);
  const n = text.length;
  const charCx = new Float32Array(n), charCy = new Float32Array(n);
  const rowMaps = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], str = text.slice(row.i0, row.i1);
    const cy = padH / 2 + (r - (rows.length - 1) / 2) * lh;
    octx.fillText(str, padW / 2, cy);
    const x0 = (padW - row.w) / 2, map = new Int16Array(padW).fill(-1);
    let acc = 0;
    for (let i = row.i0; i < row.i1; i++) {
      const cw = octx.measureText(text[i]).width;
      charCx[i] = x0 + acc + cw / 2 - padW / 2; charCy[i] = cy - padH / 2;
      for (let x = Math.max(0, Math.floor(x0 + acc)); x < Math.min(padW, Math.ceil(x0 + acc + cw)); x++) map[x] = i;
      acc += cw;
    }
    rowMaps.push({ y0: cy - lh / 2, y1: cy + lh / 2, map });
  }
  const d = octx.getImageData(0, 0, padW, padH).data;
  const pxA = [], pyA = [], ownA = [];
  const step = opt.step || 3;
  for (let y = 0; y < padH; y += step) {
    let rm = null;
    for (let r = 0; r < rowMaps.length; r++) { const m = rowMaps[r]; if (y >= m.y0 && y < m.y1) { rm = m; break; } }
    if (!rm) continue;
    const map = rm.map, base = y * padW;
    for (let x = 0; x < padW; x += step) {
      if (d[(base + x) * 4 + 3] <= 128) continue;
      const c = map[x]; if (c < 0) continue;
      pxA.push(x - padW / 2); pyA.push(y - padH / 2); ownA.push(c);
    }
  }
  return { px: Float32Array.from(pxA), py: Float32Array.from(pyA), own: Int16Array.from(ownA),
           pc: pxA.length, n, charCx, charCy, fs, w: widest, h: lh * rows.length, rows: rows.length };
}

/* ============================ 4 · 句索引 ============================ */
let brewIdx = -1, lastT = -1;
const hintShow = (s, o) => { hint.textContent = s; hint.style.opacity = o; };

/* ============================ 5 · 相机（微距缓推） ============================ */
const cam = { x: 0, y: 0, z: 1, tz: 1, vz: 0, tx: 0, ty: 0, rot: 0, vrot: 0, sh: 0, dirx: 0, diry: 0, shx: 0, shy: 0 };
function camShake(dx, dy, amp) { const l = Math.hypot(dx, dy) || 1; cam.dirx = dx / l; cam.diry = dy / l; cam.sh = Math.min(20, Math.max(cam.sh, amp)); }
function camUpdate(dt, T) {
  const ke = 1 - Math.pow(0.002, dt);
  cam.x += (cam.tx - cam.x) * ke * 0.9;
  cam.y += (cam.ty - cam.y) * ke * 0.9;
  cam.vz += ((cam.tz - cam.z) * 150 - cam.vz * 24) * dt;
  cam.z += cam.vz * dt;
  cam.vrot += (-cam.rot * 220 - cam.vrot * 22) * dt;
  cam.rot += cam.vrot * dt;
  cam.sh *= Math.pow(0.00004, dt);
  const wob = Math.sin(T * 57.3) * 0.6 + Math.sin(T * 39.7 + 1.4) * 0.4;
  cam.shx = cam.dirx * cam.sh * wob;
  cam.shy = cam.diry * cam.sh * wob;
}

/* ============================ 6 · 顿帧 / 闪白 ============================ */
const AE = { freeze: 0, flash: 0, slow: 0 };
const hitStop = (s) => { AE.freeze = Math.max(AE.freeze, s); };
const flash = (v) => { AE.flash = Math.max(AE.flash, v); };

/* ============================ 7 · 蚂蚁 ============================ */
const NA = 380;
const ax = new Float32Array(NA), ay = new Float32Array(NA);
const pax = new Float32Array(NA), pay = new Float32Array(NA);   // 上一帧位置（画轨迹用）
const atx = new Float32Array(NA), aty = new Float32Array(NA);   // 当前目标
const aci = new Int16Array(NA);                                 // 这次走的是第几个字
const asp = new Float32Array(NA);                               // 速度（个体差异）
const aph = new Float32Array(NA);                               // 游走相位
const awob = new Float32Array(NA);                              // 游走幅度
const apTi = new Int32Array(NA);                                // 目标在采样数组里的下标
for (let i = 0; i < NA; i++) {
  ax[i] = rnd(-0.5, 0.5) * W; ay[i] = rnd(-0.5, 0.5) * H;
  pax[i] = ax[i]; pay[i] = ay[i];
  asp[i] = rnd(42, 86);
  aph[i] = rnd(0, 6.2832);
  awob[i] = rnd(9, 26);
  aci[i] = -1; apTi[i] = 0;
}

/* 手势/事件 */
let ripples = [];
let spanFired = new Uint8Array(0);
let charChars = null;
let charGlow = new Float32Array(0);
let spans = [];
let blockGx = 0, blockGy = 0;
let groundFade = 0.012;         // 地面褪色速度

/* 浮尘（地面被搅动的次级动作） */
const ND = 180;
const dx2 = new Float32Array(ND), dy2 = new Float32Array(ND), dvx = new Float32Array(ND), dvy = new Float32Array(ND);
for (let i = 0; i < ND; i++) { dx2[i] = rnd(0, W); dy2[i] = rnd(0, H); dvx[i] = rnd(-8, 8); dvy[i] = rnd(-8, 8); }

let bgGrad = null;
function buildBg() {
  if (!bgCv) bgCv = document.createElement('canvas');
  const bw = Math.round(W / 2), bh = Math.round(H / 2);
  bgCv.width = bw; bgCv.height = bh;
  const g = bgCv.getContext('2d');
  const grd = g.createRadialGradient(bw / 2, bh * 0.5, 0, bw / 2, bh * 0.5, Math.max(bw, bh) * 0.78);
  grd.addColorStop(0, '#1a120a');
  grd.addColorStop(0.4, '#100b06');
  grd.addColorStop(1, '#070402');
  g.fillStyle = grd; g.fillRect(0, 0, bw, bh);
}

/* ============================ 8 · 布局（预取） ============================ */
let prep = null;
function prepLine(idx) {
  const line = lines[idx];
  if (!line || !line.text) return null;
  const text = line.text;
  const latin = isLatin(text);
  const fs0 = latin ? 74 : (text.length <= 10 ? 100 : text.length <= 16 ? 86 : 72);
  const g = sampleGlyph(text, { fs: fs0, maxW: Math.min(W * 0.70, 1120), maxH: H * 0.44 });
  if (!g.pc) return null;
  g.text = text;
  charChars = line.chars && line.chars.length === text.length ? line.chars : null;
  const raw = spansForLine(text);
  const spanOf = new Int16Array(g.n).fill(-1);
  const spList = [];
  for (let k = 0; k < raw.length; k++) {
    const s = raw[k];
    if (!s || s.i1 <= s.i0) continue;
    let t;
    if (charChars && charChars[s.i0] && typeof charChars[s.i0].t === 'number') t = charChars[s.i0].t;
    else t = line.t + (line.dur || 4) * (s.i0 / Math.max(1, text.length));
    spList.push({ i0: s.i0, i1: s.i1, t });
    for (let c = s.i0; c < s.i1; c++) spanOf[c] = spList.length - 1;
  }
  if (!spList.length) return null;
  for (let k = 1; k < spList.length; k++) if (spList[k].t < spList[k - 1].t) spList[k].t = spList[k - 1].t;
  return { idx, g, spans: spList, spanOf, cc: charChars };
}

function assignLine(idx) {
  const use = (prep && prep.idx === idx) ? prep : prepLine(idx);
  if (!use) { L = null; return; }
  const g = use.g;
  L = g; spans = use.spans; charChars = use.cc;
  charGlow = new Float32Array(g.n);
  spanFired = new Uint8Array(spans.length);
  blockGx = W / 2;
  blockGy = H * 0.45;

  /* 把每只蚂蚁派到某个采样点附近起步；起点在字的外围，看起来像"从四面爬过来" */
  for (let i = 0; i < NA; i++) {
    const pi = (Math.random() * g.pc) | 0;
    apTi[i] = pi;
    atx[i] = blockGx + g.px[pi];
    aty[i] = blockGy + g.py[pi];
    aci[i] = g.own[pi];
    /* 起点就在笔画上，不要从外围飞进来 ——
       从外面起步会让所有轨迹变成一堆放射状长直线，画面像爆炸而不像字。
       蚁是"本来就在笔画上爬"，字是它们的路踩出来的。 */
    const a = rnd(0, 6.2832), r = rnd(0, 7);
    ax[i] = atx[i] + Math.cos(a) * r; ay[i] = aty[i] + Math.sin(a) * r;
    pax[i] = ax[i]; pay[i] = ay[i];
  }
  /* 信息素底色层：把字形采样点铺成一层"旧路"。
     为什么必须有这一层：380 只蚁盖不满 5000 个采样点，覆盖率不到一成，
     只靠蚁走出来的路字根本读不出来（第一版就是一片横着糊掉的拖影）。
     铺底之后字从一开始就在，蚁的作用是沿着笔画把它踩亮 —— 这也更像真实的蚁路。
     这一层必须画进 bctx（不褪色那张），画进 gctx 会被 destination-out 很快擦掉。 */
  if (bctx) {
    bctx.clearRect(0, 0, GW, GH);
    bctx.globalCompositeOperation = 'lighter';
    bctx.fillStyle = 'rgba(' + Math.min(255, accent[0] - 8) + ',' + Math.min(255, accent[1] - 24) + ',' + Math.min(255, accent[2] - 38) + ',0.6)';
    bctx.beginPath();
    for (let k = 0; k < g.pc; k++) {
      const gx2 = (blockGx + g.px[k]) / GK, gy2 = (blockGy + g.py[k]) / GK;
      bctx.rect(gx2 - 1.4, gy2 - 1.4, 2.9, 2.9);
    }
    bctx.fill();
    bctx.globalCompositeOperation = 'source-over';
  }
  if (gctx) gctx.clearRect(0, 0, GW, GH);
  cam.tz = 1.06;
  groundFade = 0.020;
}

/* ============================ 9 · 主循环 ============================ */
let last = performance.now();
let T0 = 0;
let lookX = 0, lookY = 0;

function frame(nowMs) {
  const dtReal = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; T0 += dtReal;
  if (AE.freeze > 0) AE.freeze -= dtReal;
  let dt = AE.freeze > 0 ? 0 : dtReal;
  if (AE.slow > 0) { AE.slow -= dtReal; dt *= 0.35; }

  const T = now();
  timing(T);

  /* ---- 镜头：缓推 + 跟随正在唱的字（幅度 0.35） ---- */
  if (L && curIdx >= 0 && L.n > 0) {
    let c = 0;
    if (charChars) { for (let k = 0; k < charChars.length; k++) if (charChars[k].t <= T) c = k; }
    else c = Math.min(L.n - 1, Math.floor(clamp01((T - lines[curIdx].t) / Math.max(0.3, lines[curIdx].dur || 4)) * L.n));
    lookX += (blockGx + L.charCx[c] - lookX) * Math.min(1, dtReal * 2.0);
    lookY += (blockGy + L.charCy[c] - lookY) * Math.min(1, dtReal * 2.0);
  }
  cam.tx = W / 2 + (lookX - W / 2) * 0.35;
  cam.ty = H / 2 + (lookY - H / 2) * 0.35;
  camUpdate(dtReal, T0);
  /* 微距缓推：整场一直在极慢地放大，然后周期性回落（像贴地跟拍） */
  cam.tz = 1.035 + Math.sin(T0 * 0.11) * 0.035;

  const z = cam.z;
  const cosR = Math.cos(cam.rot), sinR = Math.sin(cam.rot);
  const ex = W / 2 + cam.shx, ey = H / 2 + cam.shy;
  /* 世界 → 屏幕 */
  const sxOf = (x, y) => { const dxx = (x - cam.x) * z, dyy = (y - cam.y) * z; return ex + dxx * cosR - dyy * sinR; };
  const syOf = (x, y) => { const dxx = (x - cam.x) * z, dyy = (y - cam.y) * z; return ey + dxx * sinR + dyy * cosR; };

  /* ---- 逐字亮度 ---- */
  if (L) {
    if (charChars) for (let c = 0; c < L.n; c++) charGlow[c] = charChars[c] ? clamp01((T - charChars[c].t) / 0.22) : 0;
    else {
      const lt = lines[curIdx] ? lines[curIdx].t : 0, ld = lines[curIdx] ? (lines[curIdx].dur || 4) : 4;
      for (let c = 0; c < L.n; c++) charGlow[c] = clamp01((T - lt - ld * 0.85 * c / L.n) / 0.3);
    }
  }

  /* ---- 每团到点：顿帧 + 慢动作 + 震动 + 气味波 ---- */
  if (L && curIdx >= 0) {
    for (let k = 0; k < spans.length; k++) {
      if (spanFired[k] || T < spans[k].t) continue;
      spanFired[k] = 1;
      const first = k === 0;
      hitStop(first ? 0.05 : 0.026);
      if (first) AE.slow = 0.42;
      flash(first ? 0.55 : 0.3);
      camShake(Math.cos(k * 1.7), Math.sin(k * 1.7), first ? 9 : 5);
      cam.vrot += (Math.random() < 0.5 ? -1 : 1) * (first ? 0.9 : 0.45);
      const s = spans[k];
      let cx0 = 0, cy0 = 0, cnt = 0;
      for (let c = s.i0; c < s.i1; c++) { cx0 += L.charCx[c]; cy0 += L.charCy[c]; cnt++; }
      ripples.push({ x: blockGx + cx0 / Math.max(1, cnt), y: blockGy + cy0 / Math.max(1, cnt), t: 0, life: 0.6, power: first ? 1 : 0.55 });
      groundFade = 0.055;                 // 换团瞬间地面褪得快一点，旧路让位
    }
    cam.tz += (1.0 - cam.tz) * Math.min(1, dtReal * 1.6);
  }
  groundFade += (0.012 - groundFade) * Math.min(1, dtReal * 1.2);

  /* ================= 蚂蚁 ================= */
  const speedScale = 0.35 + 0.65 * (AE.slow > 0 ? 0.45 : 1);
  let onChar = 0;
  if (dt > 0) {
    for (let i = 0; i < NA; i++) {
      pax[i] = ax[i]; pay[i] = ay[i];
      const dx = atx[i] - ax[i], dy = aty[i] - ay[i];
      const d2 = Math.hypot(dx, dy);
      if (d2 < 4.5) {
        /* 到了：换成采样数组里相邻的点（扫描线顺序 → 空间上也相邻）→ 会顺着笔画走 */
        if (L && L.pc > 0) {
          let ni = apTi[i] + (Math.random() < 0.5 ? -1 : 1) * (1 + (Math.random() * 6 | 0));
          if (ni < 0) ni += L.pc; if (ni >= L.pc) ni -= L.pc;
          apTi[i] = ni;
          atx[i] = blockGx + L.px[ni];
          aty[i] = blockGy + L.py[ni];
          aci[i] = L.own[ni];
        }
      } else {
        /* 朝目标走 + 横向游走（蚁不会走直线） */
        const ux = dx / d2, uy = dy / d2;
        const wob = Math.sin(T0 * 2.6 + aph[i]) * awob[i];
        const mvx = ux * asp[i] + (-uy) * wob;
        const mvy = uy * asp[i] + (ux) * wob;
        const ml = Math.hypot(mvx, mvy) || 1;
        const v = asp[i] * speedScale;
        ax[i] += (mvx / ml) * v * dt;
        ay[i] += (mvy / ml) * v * dt;
      }
      if (aci[i] >= 0) onChar++;
    }

    /* ---- 把轨迹画到地面（一批两档：唱到的更亮） ---- */
    gctx.globalCompositeOperation = 'destination-out';
    gctx.fillStyle = `rgba(0,0,0,${groundFade.toFixed(4)})`;
    gctx.fillRect(0, 0, GW, GH);
    gctx.globalCompositeOperation = 'lighter';
    gctx.lineCap = 'round';
    for (let band = 0; band < 2; band++) {
      gctx.strokeStyle = band
        ? `rgba(${Math.min(255, accent[0] + 30)},${Math.min(255, accent[1] + 16)},${Math.min(255, accent[2] - 10)},0.48)`
        : `rgba(${Math.min(255, accent[0] - 26)},${Math.min(255, accent[1] - 38)},${Math.min(255, accent[2] - 40)},0.24)`;
      gctx.lineWidth = band ? 2.1 : 1.5;
      gctx.beginPath();
      let any = false;
      for (let i = band; i < NA; i += 2) {
        const lit = aci[i] >= 0 && charGlow[aci[i]] > 0.5;
        if (lit !== !!band) continue;
        gctx.moveTo(pax[i] / GK, pay[i] / GK);
        gctx.lineTo(ax[i] / GK, ay[i] / GK);
        any = true;
      }
      if (any) gctx.stroke();
    }
    gctx.globalCompositeOperation = 'source-over';
  }

  /* 浮尘 */
  for (let i = 0; i < ND; i++) {
    dx2[i] += dvx[i] * dtReal; dy2[i] += dvy[i] * dtReal;
    dvx[i] *= 0.995; dvy[i] *= 0.995;
    if (Math.random() < 0.01) { dvx[i] += rnd(-6, 6); dvy[i] += rnd(-6, 6); }
    if (Math.abs(dx2[i] - cam.x) > W * 0.7) dx2[i] = cam.x + rnd(-W * 0.7, W * 0.7);
    if (Math.abs(dy2[i] - cam.y) > H * 0.7) dy2[i] = cam.y + rnd(-H * 0.7, H * 0.7);
  }

  for (let k = ripples.length - 1; k >= 0; k--) { ripples[k].t += dtReal; if (ripples[k].t > ripples[k].life) ripples.splice(k, 1); }

  /* ================= 绘制 ================= */
  const [ar, ag, ab] = accent;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0a0704';
  ctx.fillRect(0, 0, W, H);
  if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);

  /* 地面：底色层（字形信息素床）+ 新痕迹层（蚁刚踩的），两张加色叠加 */
  ctx.globalCompositeOperation = 'lighter';
  if (baseCv) { ctx.globalAlpha = 1; ctx.drawImage(baseCv, 0, 0, W, H); }
  if (ground) { ctx.globalAlpha = 0.9; ctx.drawImage(ground, 0, 0, W, H); }
  ctx.globalAlpha = 1;

  /* 浮尘 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(${Math.min(255, ar - 30)},${Math.min(255, ag - 50)},${Math.min(255, ab - 60)},0.18)`;
  ctx.beginPath();
  for (let i = 0; i < ND; i++) {
    const sx = sxOf(dx2[i], dy2[i]), sy = syOf(dx2[i], dy2[i]);
    if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) continue;
    ctx.rect(sx, sy, 1.8, 1.8);
  }
  ctx.fill();

  /* 蚂蚁本体：小亮点（让人相信"是活的"） */
  ctx.fillStyle = `rgba(255,244,220,0.34)`;
  ctx.beginPath();
  for (let i = 0; i < NA; i++) {
    const sx = sxOf(ax[i], ay[i]), sy = syOf(ax[i], ay[i]);
    if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) continue;
    ctx.rect(sx - 0.8, sy - 0.8, 1.8, 1.8);
  }
  ctx.fill();

  /* 气味波：一圈很细的暖环 */
  for (let k = 0; k < ripples.length; k++) {
    const r = ripples[k];
    const p = r.t / r.life;
    const rad = (14 + 190 * r.power) * (1 - Math.pow(1 - p, 3)) * z;
    const a = 0.34 * r.power * Math.pow(1 - p, 2);
    const cxp = sxOf(r.x, r.y), cyp = syOf(r.x, r.y);
    ctx.strokeStyle = `rgba(${Math.min(255, ar)},${Math.min(255, ag - 20)},${Math.min(255, ab - 50)},${a.toFixed(3)})`;
    ctx.lineWidth = 1.6 * (1 - p);
    ctx.beginPath(); ctx.arc(cxp, cyp, rad, 0, 6.2832); ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';

  if (AE.flash > 0.012) {
    ctx.fillStyle = `rgba(255,238,206,${(AE.flash * 0.055).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    AE.flash *= Math.pow(0.0000045, dtReal);
  }

  requestAnimationFrame(frame);
}

/* ============================ 10 · 节奏 ============================ */
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1; L = null; prep = null;
    if (gctx) gctx.clearRect(0, 0, GW, GH);
    if (bctx) bctx.clearRect(0, 0, GW, GH);
    for (let i = 0; i < NA; i++) aci[i] = -1;
  }
  lastT = T;
  let c = curIdx;
  while (c + 1 < lines.length && T >= lines[c + 1].t) c++;
  if (c !== curIdx) {
    curIdx = c; brewIdx = -1; prep = null;
    if (curIdx >= 0) { lookX = W / 2; lookY = H * 0.45; assignLine(curIdx); hintShow('', 0); }
    else hintShow(lines.length ? '等待第一句…' : '这首没有歌词', 0.5);
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    if (T >= lines[nx].t - Math.min(1.5, Math.max(0.55, gap * 0.5))) { brewIdx = nx; prep = prepLine(nx); }
  }
}

/* ============================ 11 · 通信协议 ============================ */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent && p.accent.length >= 3) accent = p.accent;
    curIdx = -1; brewIdx = -1; lastT = -1; L = null; prep = null;
    if (gctx) gctx.clearRect(0, 0, GW, GH);
    if (bctx) bctx.clearRect(0, 0, GW, GH);
    for (let i = 0; i < NA; i++) aci[i] = -1;
    clockT = 0; clockAt = performance.now();
    hintShow(lines.length ? '等待第一句…' : '这首没有歌词', lines.length ? 1 : 0.5);
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 踩拍：整群一起被惊动（相干），不是逐只乱窜 */
    const lv = (d.payload && d.payload.level) || 0.6;
    camShake(Math.cos(T0), Math.sin(T0), 2 + lv * 3);
    AE.slow = Math.max(AE.slow, 0.10 * lv);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => {
  let lit = 0;
  for (let i = 0; i < NA; i++) if (aci[i] >= 0 && charGlow[aci[i]] > 0.5) lit++;
  return { curIdx, n: lines.length, ants: NA, onChar: lit, pc: L ? L.pc : 0,
           spans: spans.length, z: +cam.z.toFixed(3), t: +now().toFixed(2) };
};

/* ============================ 12 · 启动 ============================ */
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
