<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>343 · 冷艳彩绘</title>
<style>
  :root{
    --bone:#e8e3db; --ink:#191512; --mute:#6d655c;
    --red:#e0241a; --blue:#1d3fd6;
    --serif: Georgia, 'Times New Roman', 'Songti SC', 'STSong', 'SimSun', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#dcd7cf}
  body{font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #type{position:fixed;inset:0;z-index:3;pointer-events:none;
        display:flex;flex-direction:column;justify-content:flex-start;
        padding:28vh 7vw 0;color:var(--ink)}
  #type .frame{width:min(34vw,470px);position:relative}
  #type .idx{font-size:9px;letter-spacing:.46em;color:var(--red);margin-bottom:1.35em;
             font-variant-numeric:tabular-nums;opacity:.9}
  #type .cur{font-size:clamp(16px,1.60vw,27px);letter-spacing:.235em;line-height:1.95;min-height:1.95em;
             font-weight:400;max-width:19em;word-break:normal;overflow-wrap:normal}
  #type .frame.long .cur{font-size:clamp(14px,1.32vw,21px);letter-spacing:.16em;max-width:21em;line-height:1.9}
  #type .rule{width:46px;height:1px;background:rgba(25,21,18,.22);margin:1.55em 0 1.35em}
  #type .nxt{font-size:clamp(10.5px,.92vw,14px);letter-spacing:.30em;line-height:2.1;
             color:#6d655c;opacity:.52;max-width:26em}
  #type .meta{margin-top:2.6em;font-size:8.5px;letter-spacing:.42em;text-transform:uppercase;
              color:#6d655c;opacity:.72;line-height:1.9;display:flex;gap:.9em;flex-wrap:wrap;align-items:baseline}
  #type .meta .dot{opacity:.45;letter-spacing:0}
  #type .empty{font-size:clamp(11px,1.0vw,15px);letter-spacing:.44em;color:#6d655c;opacity:.7}
  #type .empty small{display:block;margin-top:1.1em;font-size:.68em;letter-spacing:.52em;opacity:.7}

  .ch{display:inline-block;white-space:pre;opacity:.10;
      transition:opacity .34s ease,transform .34s ease;transform:translateY(.30em)}
  .ch.on{opacity:1;transform:translateY(0)}
  .ch.sp{width:.42em}
  @media (prefers-reduced-motion: reduce){ .ch{transition:none;transform:none} }

  /* narrow screens: figure on top, type in the bottom air */
  body.narrow #type{justify-content:flex-end;padding:0 8vw 11vh}
  body.narrow #type .frame{width:min(84vw,520px)}
  body.narrow #type .cur{font-size:clamp(17px,4.4vw,25px);letter-spacing:.20em;line-height:1.95;max-width:16em}
  body.narrow #type .frame.long .cur{font-size:clamp(15px,3.8vw,21px);letter-spacing:.14em;max-width:18em}
  body.narrow #type .nxt{font-size:clamp(11px,2.6vw,14px);letter-spacing:.24em;max-width:22em}
  body.narrow #type .meta{margin-top:2.1em}
  body.narrow #type:before{content:'';position:absolute;left:0;right:0;bottom:0;height:42vh;
        background:linear-gradient(to top,rgba(238,233,226,.92) 12%,rgba(238,233,226,.55) 46%,rgba(238,233,226,0) 100%);
        z-index:-1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="type">
  <div class="frame">
    <div class="idx"></div>
    <div class="cur"></div>
    <div class="rule"></div>
    <div class="nxt"></div>
    <div class="meta"><span class="song"></span><span class="dot">·</span><span class="art"></span></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d', {alpha:false});
  var curEl = document.querySelector('#type .cur'), nxtEl = document.querySelector('#type .nxt');
  var idxEl = document.querySelector('#type .idx'), ruleEl = document.querySelector('#type .rule');
  var metaEl = document.querySelector('#type .meta'), songEl = document.querySelector('#type .song');
  var artEl = document.querySelector('#type .art'), dotEl = document.querySelector('#type .dot');
  var frameEl = document.querySelector('#type .frame');
  var W = 1440, H = 900, DPR = 1;

  var S = { lines:[], idx:-1, t:0, dur:0, playing:true, frames:0, js:0, err:'', text:'', gl:false, rm:false,
            pulse:0, livePulse:0, bass:0, liveLevel:0, beatIndex:-1, songId:null,
            meta:{ name:'', artist:'' } };
  var readySent = false, booted = false, lastNow = 0;

  function send(msg){ try{ parent.postMessage(msg, '*'); }catch(e){} }
  function markReady(){
    if(readySent) return;
    readySent = true;
    send({__c100:1, type:'ready'});
  }

  /* ---------- offscreen bake: studio + porcelain figure (static) ---------- */
  var bk = document.createElement('canvas'), bx = bk.getContext('2d');
  var L = { narrow:false, hw:120, hh:160, a:60, b:80, cx:0, cy:0, chin:0, crown:0, neckBot:0, clav:0 };

  function layout(){
    var narrow = W / H < 0.95;
    var hw = narrow ? Math.min(W * 0.60, H * 0.30) : Math.min(W * 0.255, H * 0.355);
    if(!isFinite(hw) || hw < 40) hw = 300;
    var hh = hw * 1.30;
    L.narrow = narrow;
    L.hw = hw; L.hh = hh; L.a = hw / 2; L.b = hh / 2;
    L.cx = narrow ? W * 0.5 : W * 0.645;
    L.cy = narrow ? H * 0.315 : H * 0.385;
    L.crown = L.cy - L.b;
    L.chin = L.cy + L.b;
    L.neckBot = L.chin + hh * 0.34;
    L.clav = L.chin + hh * 0.47;
    buildCracks();
  }

  function facePath(x, cX, cY, a, b){
    x.beginPath();
    x.moveTo(cX, cY - b);
    x.bezierCurveTo(cX + a*0.34, cY - b*0.99, cX + a*1.00, cY - b*0.70, cX + a*1.01, cY - b*0.24);
    x.bezierCurveTo(cX + a*1.02, cY + b*0.03, cX + a*0.96, cY + b*0.20, cX + a*0.83, cY + b*0.44);
    x.bezierCurveTo(cX + a*0.68, cY + b*0.74, cX + a*0.34, cY + b*0.95, cX, cY + b*0.97);
    x.bezierCurveTo(cX - a*0.34, cY + b*0.95, cX - a*0.68, cY + b*0.74, cX - a*0.83, cY + b*0.44);
    x.bezierCurveTo(cX - a*0.96, cY + b*0.20, cX - a*1.02, cY + b*0.03, cX - a*1.01, cY - b*0.24);
    x.bezierCurveTo(cX - a*1.00, cY - b*0.70, cX - a*0.34, cY - b*0.99, cX, cY - b);
    x.closePath();
  }

  function torsoPath(x, cx, neckBot, hw, hh){
    var s = hw;
    x.beginPath();
    x.moveTo(cx - s*0.27, neckBot - hh*0.12);
    x.bezierCurveTo(cx - s*0.50, neckBot + hh*0.10, cx - s*0.78, neckBot + hh*0.16, cx - s*1.12, neckBot + hh*0.30);
    x.bezierCurveTo(cx - s*1.62, neckBot + hh*0.50, cx - s*2.05, neckBot + hh*0.86, cx - s*2.22, H + hh);
    x.lineTo(cx + s*2.22, H + hh);
    x.bezierCurveTo(cx + s*2.05, neckBot + hh*0.86, cx + s*1.62, neckBot + hh*0.50, cx + s*1.12, neckBot + hh*0.30);
    x.bezierCurveTo(cx + s*0.78, neckBot + hh*0.16, cx + s*0.50, neckBot + hh*0.10, cx + s*0.27, neckBot - hh*0.12);
    x.closePath();
  }

  function drawBackdrop(){
    var g = bx.createLinearGradient(0, 0, W * 0.18, H);
    g.addColorStop(0, '#f4efe8');
    g.addColorStop(0.55, '#e6e0d8');
    g.addColorStop(1, '#cbc4bb');
    bx.fillStyle = g; bx.fillRect(0, 0, W, H);

    var kx = L.cx - L.hw * 0.70, ky = L.cy - L.hh * 0.30, kr = L.hw * 3.1;
    var kg = bx.createRadialGradient(kx, ky, 0, kx, ky, kr);
    kg.addColorStop(0, 'rgba(255,252,246,0.72)');
    kg.addColorStop(0.45, 'rgba(255,250,242,0.28)');
    kg.addColorStop(1, 'rgba(255,250,242,0)');
    bx.fillStyle = kg; bx.fillRect(0, 0, W, H);

    // coloured spill — the paint bleeding into the studio air
    var rs = bx.createRadialGradient(L.cx - L.a*1.5, L.cy - L.b*0.28, 0, L.cx - L.a*1.5, L.cy - L.b*0.28, L.hw*1.35);
    rs.addColorStop(0, 'rgba(214,32,26,0.15)');
    rs.addColorStop(0.55, 'rgba(214,32,26,0.05)');
    rs.addColorStop(1, 'rgba(214,32,26,0)');
    bx.fillStyle = rs; bx.fillRect(0, 0, W, H);

    var bs = bx.createRadialGradient(L.cx + L.a*1.55, L.cy - L.b*0.52, 0, L.cx + L.a*1.55, L.cy - L.b*0.52, L.hw*1.30);
    bs.addColorStop(0, 'rgba(26,54,200,0.14)');
    bs.addColorStop(0.55, 'rgba(26,54,200,0.045)');
    bs.addColorStop(1, 'rgba(26,54,200,0)');
    bx.fillStyle = bs; bx.fillRect(0, 0, W, H);

    // the body's soft shadow falling on the seamless
    var shx = L.cx + L.hw * 1.15, shy = L.neckBot + L.hh * 0.16;
    var sh = bx.createRadialGradient(shx, shy, 0, shx, shy, L.hw * 2.0);
    sh.addColorStop(0, 'rgba(88,70,66,0.16)');
    sh.addColorStop(0.55, 'rgba(88,70,66,0.06)');
    sh.addColorStop(1, 'rgba(88,70,66,0)');
    bx.fillStyle = sh; bx.fillRect(0, 0, W, H);

    // a hairline mandorla behind the head — the icon frame
    bx.save();
    bx.strokeStyle = 'rgba(25,21,18,0.085)';
    bx.lineWidth = 1;
    bx.beginPath();
    bx.ellipse(L.cx, L.cy - L.hh * 0.02, L.hw * 0.86, L.hh * 0.80, 0, 0, 6.2832);
    bx.stroke();
    bx.restore();

    var vg = bx.createRadialGradient(W*0.52, H*0.44, Math.min(W,H)*0.28, W*0.52, H*0.44, Math.max(W,H)*0.82);
    vg.addColorStop(0, 'rgba(60,48,44,0)');
    vg.addColorStop(0.72, 'rgba(60,48,44,0.10)');
    vg.addColorStop(1, 'rgba(48,38,36,0.28)');
    bx.fillStyle = vg; bx.fillRect(0, 0, W, H);
  }

  function drawFigure(){
    var cx = L.cx, cy = L.cy, a = L.a, b = L.b, hw = L.hw, hh = L.hh;

    // neck + torso, one mass
    bx.save();
    torsoPath(bx, cx, L.neckBot, hw, hh);
    var sg = bx.createLinearGradient(cx - hw, L.neckBot - hh*0.1, cx + hw, H);
    sg.addColorStop(0, '#f0e3da');
    sg.addColorStop(0.42, '#e7d6cd');
    sg.addColorStop(1, '#c9b2b0');
    bx.fillStyle = sg; bx.fill();
    bx.restore();

    // neck column shading (in front of torso top)
    bx.save();
    bx.beginPath();
    bx.moveTo(cx - a*0.40, L.chin - b*0.16);
    bx.bezierCurveTo(cx - a*0.44, L.chin + hh*0.16, cx - a*0.50, L.neckBot, cx - a*0.54, L.neckBot + hh*0.04);
    bx.lineTo(cx + a*0.54, L.neckBot + hh*0.04);
    bx.bezierCurveTo(cx + a*0.50, L.neckBot, cx + a*0.44, L.chin + hh*0.16, cx + a*0.40, L.chin - b*0.16);
    bx.closePath();
    var ng = bx.createLinearGradient(cx - a*0.6, 0, cx + a*0.6, 0);
    ng.addColorStop(0, '#d8c3bf');
    ng.addColorStop(0.30, '#ecdbd3');
    ng.addColorStop(0.62, '#f3e5dc');
    ng.addColorStop(1, '#cdb6b4');
    bx.fillStyle = ng; bx.fill();
    // dissolve the neck's lower edge into the torso so there is no seam
    var nf = bx.createLinearGradient(0, L.neckBot - hh*0.13, 0, L.neckBot + hh*0.05);
    nf.addColorStop(0, 'rgba(232,213,204,0)');
    nf.addColorStop(0.62, 'rgba(229,209,200,0.55)');
    nf.addColorStop(1, 'rgba(226,206,198,0.96)');
    bx.fillStyle = nf; bx.fill();
    // jaw shadow cast onto the throat
    var js = bx.createRadialGradient(cx - a*0.10, L.chin + b*0.02, 0, cx - a*0.10, L.chin + b*0.02, a*1.15);
    js.addColorStop(0, 'rgba(120,86,96,0.40)');
    js.addColorStop(0.55, 'rgba(130,96,104,0.16)');
    js.addColorStop(1, 'rgba(130,96,104,0)');
    bx.fillStyle = js; bx.fill();
    bx.restore();

    // head
    bx.save();
    bx.shadowColor = 'rgba(58,40,44,0.30)';
    bx.shadowBlur = hw * 0.10;
    bx.shadowOffsetX = hw * 0.02;
    bx.shadowOffsetY = hh * 0.02;
    facePath(bx, cx, cy, a, b);
    var fg = bx.createRadialGradient(cx - a*0.30, cy - b*0.42, a*0.10, cx - a*0.05, cy + b*0.10, a*1.55);
    fg.addColorStop(0, '#fdf5ee');
    fg.addColorStop(0.42, '#f2e4dc');
    fg.addColorStop(0.74, '#e2cec8');
    fg.addColorStop(1, '#c9b1b1');
    bx.fillStyle = fg; bx.fill();
    bx.restore();

    // jaw/chin core shadow
    bx.save();
    facePath(bx, cx, cy, a, b); bx.clip();
    var jg = bx.createRadialGradient(cx, L.chin - b*0.10, b*0.05, cx, L.chin - b*0.02, b*0.62);
    jg.addColorStop(0, 'rgba(150,110,116,0.19)');
    jg.addColorStop(1, 'rgba(150,110,116,0)');
    bx.fillStyle = jg; bx.fillRect(cx - a*1.2, cy, a*2.4, b*1.3);
    // temple falloff
    var tg = bx.createLinearGradient(cx + a*0.25, cy, cx + a*1.1, cy + b*0.2);
    tg.addColorStop(0, 'rgba(120,90,104,0)');
    tg.addColorStop(1, 'rgba(120,90,104,0.26)');
    bx.fillStyle = tg; bx.fillRect(cx, cy - b, a*1.2, b*2);
    bx.restore();

    // ears
    bx.save();
    bx.fillStyle = '#e8d5cd';
    bx.beginPath(); bx.ellipse(cx - a*0.99, cy + b*0.04, a*0.075, b*0.115, -0.12, 0, 6.2832); bx.fill();
    bx.beginPath(); bx.ellipse(cx + a*0.99, cy + b*0.04, a*0.075, b*0.115, 0.12, 0, 6.2832); bx.fill();
    bx.restore();
  }

  function drawFace(){
    var cx = L.cx, cy = L.cy, a = L.a, b = L.b;

    // socket / brow-bone shading
    bx.save();
    facePath(bx, cx, cy, a, b); bx.clip();

    var i, sgn, ex, ey;
    for(i = 0; i < 2; i++){
      sgn = i ? 1 : -1; ex = cx + sgn * a * 0.40; ey = cy - b * 0.055;
      var sg = bx.createRadialGradient(ex, ey - b*0.03, a*0.02, ex, ey, a*0.30);
      sg.addColorStop(0, 'rgba(148,112,124,0.26)');
      sg.addColorStop(0.6, 'rgba(148,112,124,0.11)');
      sg.addColorStop(1, 'rgba(148,112,124,0)');
      bx.fillStyle = sg;
      bx.beginPath(); bx.ellipse(ex, ey, a*0.30, b*0.17, 0, 0, 6.2832); bx.fill();
    }

    // cheek hollows + cheekbone light (key from the upper left, so asymmetric)
    for(i = 0; i < 2; i++){
      sgn = i ? 1 : -1;
      var lit = sgn < 0 ? 1 : 0;
      var cg = bx.createRadialGradient(cx + sgn*a*0.60, cy + b*0.26, a*0.02, cx + sgn*a*0.60, cy + b*0.26, a*0.38);
      cg.addColorStop(0, 'rgba(139,100,112,' + (lit ? 0.07 : 0.17) + ')');
      cg.addColorStop(1, 'rgba(139,100,112,0)');
      bx.fillStyle = cg;
      bx.beginPath(); bx.ellipse(cx + sgn*a*0.58, cy + b*0.25, a*0.36, b*0.26, sgn*0.25, 0, 6.2832); bx.fill();

      var hg = bx.createRadialGradient(cx + sgn*a*0.52, cy + b*0.05, a*0.01, cx + sgn*a*0.52, cy + b*0.05, a*0.26);
      hg.addColorStop(0, 'rgba(255,248,240,' + (lit ? 0.34 : 0.14) + ')');
      hg.addColorStop(1, 'rgba(255,248,240,0)');
      bx.fillStyle = hg;
      bx.beginPath(); bx.ellipse(cx + sgn*a*0.52, cy + b*0.05, a*0.26, b*0.15, 0, 0, 6.2832); bx.fill();
    }

    // nose shadow (light from upper-left)
    var noseX = cx + a * 0.045, noseTop = cy - b*0.135, noseBot = cy + b*0.30;
    var ng = bx.createLinearGradient(noseX - a*0.01, 0, noseX + a*0.21, 0);
    ng.addColorStop(0, 'rgba(146,104,112,0.30)');
    ng.addColorStop(0.42, 'rgba(146,104,112,0.14)');
    ng.addColorStop(1, 'rgba(146,104,112,0)');
    bx.fillStyle = ng;
    bx.beginPath();
    bx.moveTo(noseX + a*0.02, noseTop);
    bx.bezierCurveTo(noseX + a*0.06, cy + b*0.06, noseX + a*0.12, noseBot - b*0.05, noseX + a*0.10, noseBot);
    bx.bezierCurveTo(noseX + a*0.04, noseBot + b*0.03, noseX - a*0.01, noseBot + b*0.01, noseX - a*0.02, noseBot - b*0.02);
    bx.bezierCurveTo(noseX - a*0.01, cy + b*0.04, noseX + a*0.00, noseTop + b*0.09, noseX + a*0.02, noseTop);
    bx.closePath(); bx.fill();

    // bridge light
    var nb = bx.createLinearGradient(noseX - a*0.10, 0, noseX + a*0.04, 0);
    nb.addColorStop(0, 'rgba(255,250,244,0)');
    nb.addColorStop(1, 'rgba(255,250,244,0.34)');
    bx.fillStyle = nb;
    bx.beginPath();
    bx.moveTo(noseX - a*0.08, noseTop + b*0.06);
    bx.bezierCurveTo(noseX - a*0.05, cy, noseX - a*0.03, noseBot - b*0.10, noseX - a*0.05, noseBot - b*0.02);
    bx.lineTo(noseX - a*0.12, noseBot - b*0.02);
    bx.bezierCurveTo(noseX - a*0.11, noseBot - b*0.12, noseX - a*0.08, cy, noseX - a*0.11, noseTop + b*0.06);
    bx.closePath(); bx.fill();

    // nose tip / alar highlight
    var hg2 = bx.createRadialGradient(noseX - a*0.03, noseBot - b*0.05, a*0.01, noseX - a*0.03, noseBot - b*0.05, a*0.14);
    hg2.addColorStop(0, 'rgba(255,250,244,0.55)');
    hg2.addColorStop(1, 'rgba(255,250,244,0)');
    bx.fillStyle = hg2;
    bx.beginPath(); bx.ellipse(noseX - a*0.03, noseBot - b*0.05, a*0.10, b*0.07, 0, 0, 6.2832); bx.fill();

    // nostrils
    bx.fillStyle = 'rgba(112,78,84,0.42)';
    bx.beginPath(); bx.ellipse(noseX - a*0.075, noseBot + b*0.005, a*0.026, b*0.014, -0.35, 0, 6.2832); bx.fill();
    bx.beginPath(); bx.ellipse(noseX + a*0.075, noseBot + b*0.005, a*0.026, b*0.014, 0.35, 0, 6.2832); bx.fill();

    // mouth
    var my = cy + b * 0.535, mw = a * 0.235;
    var lipG = bx.createLinearGradient(0, my - b*0.06, 0, my + b*0.07);
    lipG.addColorStop(0, 'rgba(184,126,122,0.52)');
    lipG.addColorStop(0.48, 'rgba(166,104,104,0.60)');
    lipG.addColorStop(1, 'rgba(188,132,126,0.46)');
    bx.fillStyle = lipG;
    bx.beginPath();
    bx.moveTo(cx - mw, my);
    bx.bezierCurveTo(cx - mw*0.62, my - b*0.038, cx - mw*0.26, my - b*0.040, cx - mw*0.10, my - b*0.020);
    bx.bezierCurveTo(cx - mw*0.04, my - b*0.012, cx + mw*0.04, my - b*0.012, cx + mw*0.10, my - b*0.020);
    bx.bezierCurveTo(cx + mw*0.26, my - b*0.040, cx + mw*0.62, my - b*0.038, cx + mw, my);
    bx.bezierCurveTo(cx + mw*0.62, my + b*0.058, cx + mw*0.22, my + b*0.076, cx, my + b*0.072);
    bx.bezierCurveTo(cx - mw*0.22, my + b*0.076, cx - mw*0.62, my + b*0.058, cx - mw, my);
    bx.closePath(); bx.fill();

    // mouth seam
    bx.strokeStyle = 'rgba(108,62,66,0.55)';
    bx.lineWidth = Math.max(0.7, a * 0.006);
    bx.beginPath();
    bx.moveTo(cx - mw*0.94, my + b*0.002);
    bx.bezierCurveTo(cx - mw*0.45, my + b*0.012, cx + mw*0.45, my + b*0.012, cx + mw*0.94, my + b*0.002);
    bx.stroke();

    // lip light
    bx.fillStyle = 'rgba(255,242,236,0.30)';
    bx.beginPath(); bx.ellipse(cx - mw*0.18, my + b*0.036, mw*0.30, b*0.010, 0, 0, 6.2832); bx.fill();
    bx.restore();
  }

  function drawEyes(){
    var cx = L.cx, cy = L.cy, a = L.a, b = L.b, i, sgn, ex, ey;

    for(i = 0; i < 2; i++){
      sgn = i ? 1 : -1;
      ex = cx + sgn * a * 0.40;
      ey = cy - b * 0.045;
      var w = a * 0.235, h = b * 0.062;

      // closed lid: the margin dips, the crease rides above it
      var xi = ex - sgn * w, xo = ex + sgn * w;
      var m0 = { x: xi, y: ey - h * 0.02 };
      var m1 = { x: xi + sgn * w * 0.50, y: ey + h * 0.56 };
      var m2 = { x: xo - sgn * w * 0.54, y: ey + h * 0.44 };
      var m3 = { x: xo, y: ey - h * 0.34 };

      var cubic = function(a0, a1, a2, a3, tt){
        var u = 1 - tt;
        return u*u*u*a0 + 3*u*u*tt*a1 + 3*u*tt*tt*a2 + tt*tt*tt*a3;
      };
      var mx = function(tt){ return cubic(m0.x, m1.x, m2.x, m3.x, tt); };
      var my = function(tt){ return cubic(m0.y, m1.y, m2.y, m3.y, tt); };

      // lid field between crease and margin
      bx.save();
      bx.beginPath();
      bx.moveTo(xi, ey - h*0.05);
      bx.bezierCurveTo(xi + sgn*w*0.46, ey - h*1.12, xo - sgn*w*0.50, ey - h*1.02, xo, ey - h*0.40);
      bx.bezierCurveTo(m2.x, m2.y, m1.x, m1.y, m0.x, m0.y);
      bx.closePath();
      var lidG = bx.createLinearGradient(0, ey - h*0.7, 0, ey + h*0.4);
      lidG.addColorStop(0, 'rgba(206,176,180,0.34)');
      lidG.addColorStop(0.42, 'rgba(232,208,203,0.24)');
      lidG.addColorStop(1, 'rgba(243,226,219,0.10)');
      bx.fillStyle = lidG; bx.fill();

      // the margin itself — the darkest thing in the face
      bx.strokeStyle = 'rgba(58,38,46,0.82)';
      bx.lineWidth = Math.max(1.2, a*0.0125);
      bx.lineCap = 'round';
      bx.beginPath();
      bx.moveTo(m0.x, m0.y);
      bx.bezierCurveTo(m1.x, m1.y, m2.x, m2.y, m3.x, m3.y);
      bx.stroke();

      // lid thickness shadow under the margin
      bx.strokeStyle = 'rgba(150,110,118,0.30)';
      bx.lineWidth = Math.max(1.4, a*0.016);
      bx.beginPath();
      bx.moveTo(m0.x, m0.y + h*0.18);
      bx.bezierCurveTo(m1.x, m1.y + h*0.16, m2.x, m2.y + h*0.16, m3.x, m3.y + h*0.18);
      bx.stroke();

      // lashes hanging from the outer half
      bx.strokeStyle = 'rgba(62,42,50,0.62)';
      bx.lineWidth = Math.max(0.8, a*0.0055);
      var lashT = [0.30, 0.46, 0.62, 0.77, 0.90, 0.99], li;
      for(li = 0; li < lashT.length; li++){
        var tt = lashT[li];
        var lx = mx(tt), ly = my(tt);
        var drift = (tt - 0.5) * sgn * w * 0.42;
        bx.beginPath();
        bx.moveTo(lx, ly);
        bx.lineTo(lx + drift * 0.55, ly + h * (0.62 + tt * 0.5));
        bx.stroke();
      }

      // crease line
      bx.strokeStyle = 'rgba(150,112,122,0.26)';
      bx.lineWidth = Math.max(0.6, a*0.005);
      bx.beginPath();
      bx.moveTo(xi + sgn*w*0.10, ey - h*0.80);
      bx.bezierCurveTo(xi + sgn*w*0.52, ey - h*1.18, xo - sgn*w*0.52, ey - h*1.12, xo - sgn*w*0.04, ey - h*0.56);
      bx.stroke();

      // small catch of light just under the brow
      var lg = bx.createRadialGradient(ex - sgn*w*0.06, ey - h*0.86, 0, ex - sgn*w*0.06, ey - h*0.86, w*0.66);
      lg.addColorStop(0, 'rgba(255,250,246,0.42)');
      lg.addColorStop(1, 'rgba(255,250,246,0)');
      bx.fillStyle = lg;
      bx.beginPath(); bx.ellipse(ex - sgn*w*0.06, ey - h*0.86, w*0.66, h*0.80, 0, 0, 6.2832); bx.fill();
      bx.restore();

      // brow — pale, diffuse, tapering
      bx.save();
      var by = ey - b * 0.135, bw = a * 0.255;
      bx.strokeStyle = 'rgba(138,106,102,0.62)';
      bx.lineCap = 'round';
      var steps = 14, k, pt;
      for(k = 0; k < steps; k++){
        var f = k / (steps - 1);
        var px = ex - sgn*bw + sgn*bw*2*f;
        var py = by - Math.sin(f * Math.PI * 0.92) * b*0.042 + sgn*f*0 - (sgn>0? -f*b*0.008 : f*b*0.008);
        bx.lineWidth = Math.max(0.8, a * 0.020 * (0.42 + Math.sin(f*Math.PI)*0.75));
        bx.beginPath();
        bx.moveTo(px, py);
        bx.lineTo(px + sgn*a*0.012, py + b*0.004);
        bx.stroke();
      }
      bx.restore();
    }
  }

  function drawBody(){
    var cx = L.cx, hw = L.hw, hh = L.hh, cY = L.clav, i, sgn;

    // trapezius shading
    for(i = 0; i < 2; i++){
      sgn = i ? 1 : -1;
      var tg = bx.createRadialGradient(cx + sgn*hw*0.62, L.neckBot + hh*0.10, hw*0.02, cx + sgn*hw*0.62, L.neckBot + hh*0.10, hw*0.55);
      tg.addColorStop(0, 'rgba(146,108,114,0.26)');
      tg.addColorStop(1, 'rgba(146,108,114,0)');
      bx.fillStyle = tg;
      bx.beginPath(); bx.ellipse(cx + sgn*hw*0.62, L.neckBot + hh*0.10, hw*0.55, hh*0.16, 0, 0, 6.2832); bx.fill();
    }

    // clavicles
    bx.save();
    bx.lineCap = 'round';
    for(i = 0; i < 2; i++){
      sgn = i ? 1 : -1;
      bx.strokeStyle = 'rgba(150,110,114,0.40)';
      bx.lineWidth = Math.max(1, hw*0.012);
      bx.beginPath();
      bx.moveTo(cx, cY - hh*0.035);
      bx.bezierCurveTo(cx + sgn*hw*0.34, cY - hh*0.055, cx + sgn*hw*0.74, cY - hh*0.030, cx + sgn*hw*1.02, cY + hh*0.045);
      bx.stroke();

      bx.strokeStyle = 'rgba(255,248,240,0.50)';
      bx.lineWidth = Math.max(1.2, hw*0.016);
      bx.beginPath();
      bx.moveTo(cx, cY - hh*0.052);
      bx.bezierCurveTo(cx + sgn*hw*0.34, cY - hh*0.072, cx + sgn*hw*0.74, cY - hh*0.048, cx + sgn*hw*1.02, cY + hh*0.026);
      bx.stroke();
    }
    bx.restore();

    // sternum notch
    var ng = bx.createRadialGradient(cx, cY - hh*0.02, 0, cx, cY - hh*0.02, hw*0.30);
    ng.addColorStop(0, 'rgba(132,96,102,0.30)');
    ng.addColorStop(1, 'rgba(132,96,102,0)');
    bx.fillStyle = ng;
    bx.beginPath(); bx.ellipse(cx, cY - hh*0.02, hw*0.30, hh*0.12, 0, 0, 6.2832); bx.fill();

    // supraclavicular hollow — the pool the bead sits in
    L.pool = { x: cx - hw*0.32, y: cY - hh*0.050, r: hw*0.13 };
    var pg = bx.createRadialGradient(L.pool.x, L.pool.y, 0, L.pool.x, L.pool.y, L.pool.r*1.5);
    pg.addColorStop(0, 'rgba(126,90,98,0.34)');
    pg.addColorStop(0.55, 'rgba(140,102,108,0.16)');
    pg.addColorStop(1, 'rgba(140,102,108,0)');
    bx.fillStyle = pg;
    bx.beginPath(); bx.ellipse(L.pool.x, L.pool.y, L.pool.r*1.5, L.pool.r*0.9, -0.18, 0, 6.2832); bx.fill();
  }

  /* ---------- real skin micro-texture (local asset, optional) ---------- */
  var skinImg = null, skinPat = null;

  function loadSkin(){
    var im = new Image();
    im.onload = function(){
      skinImg = im;
      try { skinPat = bx.createPattern(im, 'repeat'); } catch(e){ skinPat = null; }
      if(skinPat){ if(typeof bake === 'function'){ bake(); paint(); } }
    };
    im.onerror = function(){ skinImg = null; skinPat = null; };
    im.src = 'assets/343-skin.jpg';
  }

  function drawSkin(g){
    if(!skinPat) return;
    var cx = L.cx, cy = L.cy, a = L.a, b = L.b, hw = L.hw, hh = L.hh, sc = 0.22;

    g.save();
    g.globalCompositeOperation = 'overlay';
    g.globalAlpha = 0.10;

    facePath(g, cx, cy, a, b);
    g.clip();
    g.save();
    g.scale(sc, sc);
    g.fillStyle = skinPat;
    g.fillRect((cx - a*1.3)/sc, (cy - b*1.3)/sc, (a*2.6)/sc, (b*2.6)/sc);
    g.restore();
    g.restore();

    g.save();
    g.globalCompositeOperation = 'overlay';
    g.globalAlpha = 0.085;
    torsoPath(g, cx, L.neckBot, hw, hh);
    g.clip();
    g.save();
    g.scale(sc * 1.35, sc * 1.35);
    g.fillStyle = skinPat;
    g.fillRect((cx - hw*2.3)/sc/1.35, (L.neckBot - hh*0.5)/sc/1.35, (hw*4.6)/sc/1.35, (H - L.neckBot + hh)/sc/1.35);
    g.restore();
    g.restore();
  }

  function bake(){
    if(!bk.width || !bk.height){ bk.width = 8; bk.height = 8; }
    bk.width = Math.max(2, Math.round(W * DPR));
    bk.height = Math.max(2, Math.round(H * DPR));
    bx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bx.clearRect(0, 0, W, H);
    drawBackdrop();
    drawFigure();
    drawFace();
    drawEyes();
    drawBody();
    drawSkin(bx);
    paintCracks();
  }

  function resize(){
    var w = (window.innerWidth || 0), h = (window.innerHeight || 0);
    if(!isFinite(w) || w < 2) w = 1440;
    if(!isFinite(h) || h < 2) h = 900;
    W = w; H = h; DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(2, Math.round(W * DPR));
    cv.height = Math.max(2, Math.round(H * DPR));
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    document.body.className = (W / H < 0.95) ? 'narrow' : '';
    layout();
    bake();
    paint();
  }

  function paint(now){
    if(now == null) now = performance.now();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bk, 0, 0, W, H);
    if(crkCv.width > 8) ctx.drawImage(crkCv, 0, 0, W, H);
    drawCharge(ctx, S.rm ? 0 : now);
    drawBead(ctx, S.rm ? 0 : now);
    drawGrain(ctx);
  }

  /* ---------- body-art: red / blue lightning fissures ---------- */
  function jitter(i, k){ var v = Math.sin((i * 12.9898 + k * 78.233) * 43758.5453); return v - Math.floor(v); }

  function pathIn(pts, n){
    // resample a polyline of control points into a jagged lightning path
    var out = [], seg, j, s, t, x, y, nx, ny, off;
    for(seg = 0; seg < pts.length - 1; seg++){
      var p0 = pts[seg], p1 = pts[seg + 1];
      var dx = p1[0] - p0[0], dy = p1[1] - p0[1];
      var len = Math.sqrt(dx*dx + dy*dy) || 1;
      nx = -dy / len; ny = dx / len;
      for(s = 0; s < n; s++){
        t = s / n;
        off = (jitter(seg * 7 + s, 3) - 0.5) * len * 0.10 * Math.sin(t * Math.PI);
        x = p0[0] + dx*t + nx*off;
        y = p0[1] + dy*t + ny*off;
        out.push([x, y]);
      }
    }
    out.push([pts[pts.length-1][0], pts[pts.length-1][1]]);
    return out;
  }

  function buildCracks(){
    var cx = L.cx, cy = L.cy, a = L.a, b = L.b, hw = L.hw, hh = L.hh;
    function P(x, y){ return [cx + a * x, cy + b * y]; }
    L.cracks = [];
    // RED: left temple → brow → cheekbone → jaw → neck
    L.cracks.push({ c: [226, 30, 22], w: 0.042, pts: pathIn([
      P(-0.99, -0.42), P(-0.78, -0.30), P(-0.62, -0.22), P(-0.66, -0.02),
      P(-0.52, 0.13), P(-0.44, 0.24), P(-0.34, 0.40), P(-0.36, 0.56), P(-0.30, 0.72)
    ], 3) });
    // RED branch: cheekbone → out to the ear
    L.cracks.push({ c: [214, 26, 30], w: 0.020, pts: pathIn([
      P(-0.52, 0.14), P(-0.72, 0.17), P(-0.86, 0.11), P(-0.96, 0.16)
    ], 3) });
    // BLUE: crown → forehead → brow → cheek → jaw → neck
    L.cracks.push({ c: [26, 58, 214], w: 0.044, pts: pathIn([
      P(0.06, -0.90), P(0.28, -0.78), P(0.42, -0.62), P(0.36, -0.44),
      P(0.54, -0.28), P(0.56, -0.08), P(0.50, 0.08), P(0.44, 0.26),
      P(0.46, 0.42), P(0.38, 0.58), P(0.40, 0.74)
    ], 3) });
    // BLUE branch: from the outer brow up across the temple
    L.cracks.push({ c: [30, 50, 200], w: 0.018, pts: pathIn([
      P(0.55, -0.27), P(0.74, -0.36), P(0.88, -0.30), P(0.99, -0.40)
    ], 3) });
    // RED: clavicle → up the throat
    L.cracks.push({ c: [220, 34, 26], w: 0.026, pts: pathIn([
      [cx - hw*0.32, L.clav + hh*0.06], [cx - hw*0.26, L.clav - hh*0.04],
      [cx - a*0.30, L.chin + hh*0.10], [cx - a*0.36, L.chin - b*0.02],
      [cx - a*0.30, L.chin - b*0.20]
    ], 3) });
    // BLUE: sternum → up the other side of the throat
    L.cracks.push({ c: [24, 54, 208], w: 0.022, pts: pathIn([
      [cx + hw*0.06, L.clav + hh*0.10], [cx + hw*0.10, L.clav - hh*0.02],
      [cx + a*0.30, L.chin + hh*0.12], [cx + a*0.38, L.chin - b*0.04]
    ], 3) });

    // measured arc-length for the travelling ignition
    var i, j, p, q, d;
    for(i = 0; i < L.cracks.length; i++){
      var cr = L.cracks[i], acc = [0], tot = 0;
      for(j = 1; j < cr.pts.length; j++){
        p = cr.pts[j-1]; q = cr.pts[j];
        d = Math.sqrt((q[0]-p[0])*(q[0]-p[0]) + (q[1]-p[1])*(q[1]-p[1]));
        tot += d; acc.push(tot);
      }
      cr.acc = acc; cr.len = tot || 1;
    }

    // a few paint drips — proof it is pigment, not a tattoo
    L.drips = [
      { x0: cx + a*-0.505, y0: cy + b*0.150, x1: cx + a*-0.492, y1: cy + b*0.315, w: hw*0.0105, c: [220,30,24] },
      { x0: cx + a*-0.720, y0: cy + b*0.185, x1: cx + a*-0.742, y1: cy + b*0.300, w: hw*0.0075, c: [214,26,30] },
      { x0: cx + a* 0.520, y0: cy + b*0.075, x1: cx + a* 0.545, y1: cy + b*0.230, w: hw*0.0090, c: [26,58,214] },
      { x0: cx + a* 0.405, y0: cy + b*0.560, x1: cx + a* 0.418, y1: cy + b*0.700, w: hw*0.0080, c: [26,58,214] }
    ];
  }

  function strokeTaper(g, cr, from, to, mul){
    var pts = cr.pts, acc = cr.acc, i;
    mul = mul || 1;
    var w0 = cr.w * L.hw * mul, w1 = cr.w * L.hw * 0.16 * mul;
    g.lineCap = 'round'; g.lineJoin = 'round';
    for(i = 1; i < pts.length; i++){
      if(acc[i] < from || acc[i-1] > to) continue;
      var f0 = Math.max(0, (acc[i-1] - from) / (to - from));
      var f1 = Math.min(1, (acc[i] - from) / (to - from));
      var f = (f0 + f1) * 0.5;
      g.lineWidth = Math.max(0.6, w0 + (w1 - w0) * f);
      g.beginPath();
      g.moveTo(pts[i-1][0], pts[i-1][1]);
      g.lineTo(pts[i][0], pts[i][1]);
      g.stroke();
    }
  }

  var crkCv = document.createElement('canvas'), crx = null;

  function paintCracks(){
    if(!L.cracks) return;
    if(!crkCv.width || !crkCv.height){ crkCv.width = 8; crkCv.height = 8; }
    crkCv.width = Math.max(2, Math.round(W * DPR));
    crkCv.height = Math.max(2, Math.round(H * DPR));
    crx = crkCv.getContext('2d');
    crx.setTransform(DPR, 0, 0, DPR, 0, 0);
    crx.clearRect(0, 0, W, H);
    var i, cr, col;
    for(i = 0; i < L.cracks.length; i++){
      cr = L.cracks[i]; col = cr.c;
      // pigment under-shadow, so it sits in the skin
      crx.strokeStyle = 'rgba(120,70,66,0.10)';
      strokeTaper(crx, cr, 0, cr.len, 2.6);
      crx.strokeStyle = 'rgba(74,34,40,0.24)';
      strokeTaper(crx, cr, 0, cr.len, 1.55);
      // the paint itself
      crx.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.94)';
      strokeTaper(crx, cr, 0, cr.len);
      // wet luster along the stroke
      crx.save();
      crx.globalCompositeOperation = 'lighter';
      crx.strokeStyle = 'rgba(' + Math.min(255, col[0] + 40) + ',' + Math.min(255, col[1] + 40) + ',' + Math.min(255, col[2] + 40) + ',0.20)';
      strokeTaper(crx, cr, 0, cr.len);
      crx.restore();
    }

    // drips
    var dr = L.drips || [];
    for(i = 0; i < dr.length; i++){
      var dp = dr[i], dc = dp.c;
      crx.strokeStyle = 'rgba(74,34,40,0.20)';
      crx.lineWidth = dp.w * 1.8;
      crx.beginPath(); crx.moveTo(dp.x0, dp.y0); crx.lineTo(dp.x1, dp.y1); crx.stroke();
      crx.strokeStyle = 'rgba(' + dc[0] + ',' + dc[1] + ',' + dc[2] + ',0.90)';
      crx.lineWidth = dp.w;
      crx.beginPath(); crx.moveTo(dp.x0, dp.y0); crx.lineTo(dp.x1, dp.y1); crx.stroke();
      crx.fillStyle = 'rgba(' + dc[0] + ',' + dc[1] + ',' + dc[2] + ',0.92)';
      crx.beginPath(); crx.arc(dp.x1, dp.y1, dp.w * 0.95, 0, 6.2832); crx.fill();
      crx.fillStyle = 'rgba(255,255,255,0.30)';
      crx.beginPath(); crx.arc(dp.x1 - dp.w*0.28, dp.y1 - dp.w*0.26, dp.w * 0.28, 0, 6.2832); crx.fill();
    }
  }

  function drawCharge(g, now){
    if(S.rm || !L.cracks) return;
    var i, cr, ph, head = (now * 0.00013) % 1;
    for(i = 0; i < L.cracks.length; i++){
      cr = L.cracks[i];
      ph = (head + i * 0.17) % 1;
      var at = ph * cr.len, idx = 0;
      while(idx < cr.acc.length - 1 && cr.acc[idx+1] < at) idx++;
      if(idx >= cr.pts.length - 1) continue;
      var segLen = (cr.acc[idx+1] - cr.acc[idx]) || 1;
      var f = (at - cr.acc[idx]) / segLen;
      var px = cr.pts[idx][0] + (cr.pts[idx+1][0] - cr.pts[idx][0]) * f;
      var py = cr.pts[idx][1] + (cr.pts[idx+1][1] - cr.pts[idx][1]) * f;
      var rad = Math.max(6, L.hw * 0.05 * (0.5 + S.pulse * 1.6));
      var rg = g.createRadialGradient(px, py, 0, px, py, rad);
      rg.addColorStop(0, 'rgba(255,255,255,' + (0.55 + S.pulse * 0.3) + ')');
      rg.addColorStop(0.35, 'rgba(' + cr.c[0] + ',' + cr.c[1] + ',' + cr.c[2] + ',0.55)');
      rg.addColorStop(1, 'rgba(' + cr.c[0] + ',' + cr.c[1] + ',' + cr.c[2] + ',0)');
      g.save(); g.globalCompositeOperation = 'lighter';
      g.fillStyle = rg;
      g.beginPath(); g.arc(px, py, rad, 0, 6.2832); g.fill();
      g.restore();
    }
  }

  /* ---------- the bead of water in the hollow ---------- */
  function drawBead(g, now){
    var p = L.pool; if(!p) return;
    var r = p.r * (0.46 + S.pulse * 0.06);
    var t = now * 0.0011;
    var x = p.x + Math.sin(t * 0.7) * r * 0.05;
    var y = p.y + Math.cos(t * 0.53) * r * 0.04;

    // contact shadow
    var cs = g.createRadialGradient(x + r*0.14, y + r*0.52, 0, x + r*0.14, y + r*0.52, r*1.5);
    cs.addColorStop(0, 'rgba(80,48,54,0.42)');
    cs.addColorStop(1, 'rgba(80,48,54,0)');
    g.fillStyle = cs;
    g.beginPath(); g.ellipse(x + r*0.14, y + r*0.52, r*1.5, r*0.62, 0, 0, 6.2832); g.fill();

    // body: inverted refraction
    var bg = g.createRadialGradient(x - r*0.32, y - r*0.38, r*0.05, x, y, r*1.05);
    bg.addColorStop(0, 'rgba(255,255,255,0.92)');
    bg.addColorStop(0.30, 'rgba(236,226,222,0.55)');
    bg.addColorStop(0.68, 'rgba(150,120,126,0.30)');
    bg.addColorStop(0.88, 'rgba(228,214,208,0.62)');
    bg.addColorStop(1, 'rgba(120,92,100,0.20)');
    g.fillStyle = bg;
    g.beginPath(); g.ellipse(x, y, r, r*0.90, 0, 0, 6.2832); g.fill();

    // refracted stripe of the red paint inside the drop
    g.save();
    g.beginPath(); g.ellipse(x, y, r*0.94, r*0.85, 0, 0, 6.2832); g.clip();
    g.globalCompositeOperation = 'multiply';
    var rg = g.createLinearGradient(x - r, y - r, x + r, y + r);
    rg.addColorStop(0, 'rgba(226,30,22,0.34)');
    rg.addColorStop(0.55, 'rgba(226,30,22,0.06)');
    rg.addColorStop(1, 'rgba(28,58,214,0.22)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, r*2, r*2);
    g.restore();

    // specular
    g.save();
    g.globalCompositeOperation = 'lighter';
    var sp = g.createRadialGradient(x - r*0.34, y - r*0.42, 0, x - r*0.34, y - r*0.42, r*0.52);
    sp.addColorStop(0, 'rgba(255,255,255,0.98)');
    sp.addColorStop(0.5, 'rgba(255,255,255,0.22)');
    sp.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sp;
    g.beginPath(); g.ellipse(x - r*0.34, y - r*0.42, r*0.52, r*0.34, -0.5, 0, 6.2832); g.fill();
    // caustic at the bottom
    g.fillStyle = 'rgba(255,246,236,0.42)';
    g.beginPath(); g.ellipse(x + r*0.16, y + r*0.50, r*0.26, r*0.12, 0.2, 0, 6.2832); g.fill();
    g.restore();
  }

  /* ---------- grain ---------- */
  var grainCv = null;
  function buildGrain(){
    grainCv = document.createElement('canvas');
    grainCv.width = 160; grainCv.height = 160;
    var gc = grainCv.getContext('2d');
    var img = gc.createImageData(160, 160), d = img.data, i, v;
    for(i = 0; i < d.length; i += 4){
      v = 118 + Math.round((Math.random() - 0.5) * 96);
      d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
    }
    gc.putImageData(img, 0, 0);
  }

  var grainPat = null;
  function drawGrain(g){
    if(!grainCv) return;
    if(!grainPat){ try { grainPat = g.createPattern(grainCv, 'repeat'); } catch(e){ return; } }
    if(!grainPat) return;
    g.save();
    g.globalCompositeOperation = 'overlay';
    g.globalAlpha = 0.075;
    g.fillStyle = grainPat;
    g.fillRect(0, 0, W, H);
    g.restore();
  }


  function esc(s){ return String(s == null ? '' : s); }

  function buildLines(raw){
    var out = [], i, L;
    if(!raw || !raw.length) return out;
    for(i=0;i<raw.length;i++){
      L = raw[i]; if(!L) continue;
      out.push({
        t: isFinite(L.t) ? +L.t : 0,
        dur: isFinite(L.dur) && L.dur > 0 ? +L.dur : 0,
        text: esc(L.text),
        chars: Array.isArray(L.chars) && L.chars.length ? L.chars : null
      });
    }
    return out;
  }

  function pickIndex(t){
    var lo = 0, hi = S.lines.length - 1, ans = -1;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(S.lines[mid].t <= t + 0.02){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  /* ---------- lyric typesetting ---------- */
  var CH = { els: [], times: [], n: 0, on: 0 };

  function charAt(chars, i, fallback){
    var c = chars[i];
    if(c && isFinite(c.t)) return +c.t;
    var j;
    for(j = i - 1; j >= 0; j--){ if(chars[j] && isFinite(chars[j].t)) return +chars[j].t; }
    for(j = i + 1; j < chars.length; j++){ if(chars[j] && isFinite(chars[j].t)) return +chars[j].t; }
    return fallback;
  }

  function tokenize(text){
    var arr = text.split(''), toks = [], k = 0, w, s0;
    var wordRe = /[A-Za-z0-9\u00C0-\u024F'\u2019-]/;
    while(k < arr.length){
      if(wordRe.test(arr[k])){
        w = arr[k]; s0 = k;
        while(k + 1 < arr.length && wordRe.test(arr[k+1])){ k++; w += arr[k]; }
        toks.push({ s: w, i: s0 });
      } else {
        toks.push({ s: arr[k], i: k });
      }
      k++;
    }
    return toks;
  }

  function buildLyric(L){
    CH.els = []; CH.times = []; CH.n = 0; CH.on = 0;
    while(curEl.firstChild) curEl.removeChild(curEl.firstChild);
    if(!L || !L.text){ return; }

    var text = L.text, n = text.length;
    var next = S.lines[S.idx + 1];
    var base = L.dur > 0 ? L.dur : (next && next.t > L.t ? next.t - L.t : 3.4);
    var spread = Math.max(0.45, Math.min(base * 0.70, 4.8));
    var chars = L.chars && L.chars.length ? L.chars : null;
    var toks = tokenize(text), frag = document.createDocumentFragment(), i, tok, tStart, el;

    for(i = 0; i < toks.length; i++){
      tok = toks[i];
      el = document.createElement('span');
      if(tok.s === ' '){ el.className = 'ch sp'; }
      else { el.className = 'ch'; }
      el.textContent = tok.s;
      frag.appendChild(el);
      if(tok.s !== ' '){
        tStart = chars ? charAt(chars, tok.i, L.t) : (L.t + spread * (tok.i / Math.max(1, n - 0.6)));
        if(tStart < L.t - 0.25) tStart = L.t;
        CH.els.push(el); CH.times.push(tStart);
      }
    }
    CH.n = CH.els.length;
    curEl.appendChild(frag);
  }

  function applyReveal(t){
    var target = 0, k;
    while(target < CH.n && CH.times[target] <= t + 0.001) target++;
    if(target === CH.on) return;
    if(target > CH.on){
      for(k = CH.on; k < target; k++) CH.els[k].classList.add('on');
    } else {
      for(k = CH.on - 1; k >= target; k--) CH.els[k].classList.remove('on');
    }
    CH.on = target;
  }

  function renderText(){
    var i = S.idx, L = i >= 0 ? S.lines[i] : null;
    S.text = L ? L.text : '';

    if(!S.lines.length){
      idxEl.textContent = '';
      curEl.innerHTML = '<span class="empty">纯器乐 / INSTRUMENTAL<small>NO LYRICS · 此曲无词</small></span>';
      CH.els = []; CH.times = []; CH.n = 0; CH.on = 0;
      nxtEl.textContent = '';
      ruleEl.style.opacity = '.45';
      frameEl.className = 'frame';
      applyMeta();
      return;
    }
    ruleEl.style.opacity = '1';
    frameEl.className = 'frame' + (L && L.text.length > 30 ? ' long' : '');
    idxEl.textContent = i >= 0 ? ((i + 1) < 10 ? '0' + (i + 1) : '' + (i + 1)) : '';
    ruleEl.style.opacity = i >= 0 ? '1' : '.5';
    if(L){ buildLyric(L); applyReveal(S.t); }
    else { curEl.textContent = ''; }

    var nx = S.lines[i + 1] || (i < 0 ? S.lines[0] : null);
    nxtEl.textContent = nx ? nx.text : '';
    applyMeta();
  }

  function applyMeta(){
    var nm = (S.meta.name || '').trim();
    var ar = (S.meta.artist || '').trim();
    songEl.textContent = nm;
    artEl.textContent = ar;
    dotEl.style.display = (nm && ar) ? '' : 'none';
    metaEl.style.display = (nm || ar) ? '' : 'none';
  }

  function update(t){
    t = +t;
    if(!isFinite(t)) return;
    S.t = t;
    var i = pickIndex(t);
    if(i !== S.idx){ S.idx = i; renderText(); }
    else { applyReveal(t); }
  }

  function fmtArtists(a){
    var out, i;
    if(Array.isArray(a)){
      out = [];
      for(i = 0; i < a.length; i++){ if(a[i] != null && String(a[i]).trim()) out.push(String(a[i]).trim()); }
      return out.join(' / ');
    }
    if(typeof a === 'string') return a.trim();
    return a == null ? '' : String(a);
  }

  function onInit(p){
    p = p || {};
    var song = p.song || {};
    var sid = song.id == null ? '' : String(song.id);
    S.lines = buildLines(p.lines);
    S.dur = isFinite(p.duration) && p.duration > 0 ? +p.duration : 0;
    if(typeof p.playing === 'boolean') S.playing = p.playing; else S.playing = true;
    S.meta.name = song.name == null ? '' : String(song.name);
    S.meta.artist = fmtArtists(song.artists);
    if(sid !== S.songId){ S.songId = sid; S.t = 0; }
    S.idx = -2;
    update(S.t);
    if(!S.lines.length){ S.idx = -1; renderText(); }
    paint();
  }

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || d.__c100 !== 1) return;
    if(d.type === 'init'){ onInit(d.payload); return; }
    if(d.type === 'tick'){
      var p = d.payload || {};
      if(typeof p.playing === 'boolean') S.playing = p.playing;
      update(p.time);
      return;
    }
    if(d.type === 'beat'){
      var b = d.payload || {};
      var lv = isFinite(b.level) ? Math.max(0, Math.min(1, +b.level)) : 0.5;
      if(isFinite(b.index)) S.beatIndex = +b.index;
      boom(0.35 + lv * 0.65);
      return;
    }
    if(d.type === 'live'){
      var l = d.payload || {};
      if(isFinite(l.level)) S.liveLevel = Math.max(0, Math.min(1, +l.level));
      if(isFinite(l.bass)) S.bass = Math.max(0, Math.min(1, +l.bass));
      if(typeof l.playing === 'boolean') S.playing = l.playing;
      return;
    }
  });

  window.addEventListener('resize', resize);
  window.__stage = function(){
    return { lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing, frames:S.frames,
             js:S.js, err:S.err, text:S.text, gl:false, rm:S.rm };
  };

  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  S.rm = !!(mq && mq.matches);
  if(mq && mq.addEventListener) mq.addEventListener('change', function(e){ S.rm = !!e.matches; });

  function boom(v){
    if(S.rm) return;
    S.pulse = Math.min(1, S.pulse + v);
    S.pulseAt = lastNow || 0;
  }

  function loop(now){
    requestAnimationFrame(loop);
    S.frames++;
    var t0 = performance.now();
    if(!booted){ booted = true; markReady(); }
    var dt = lastNow ? Math.min(0.25, (now - lastNow) / 1000) : 0.016;
    lastNow = now;
    S.pulse = Math.max(0, S.pulse - dt * 2.6);
    S.livePulse = Math.max(0, S.livePulse - dt * 3.0);
    try { paint(now); } catch(e){ if(!S.err) S.err = String((e && e.message) || e); }
    S.js = Math.round((performance.now() - t0) * 100) / 100;
  }

  try { buildGrain(); } catch(e0){}
  try { resize(); } catch(e1){ S.err = String((e1 && e1.message) || e1); }
  try { loadSkin(); } catch(e2){}
  requestAnimationFrame(loop);
  setTimeout(markReady, 90);
})();
</script>
</body>
</html>
