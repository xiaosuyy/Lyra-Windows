<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>335 · 霓虹图腾</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;}
  #lyr{position:fixed;left:0;right:0;bottom:8.5vh;pointer-events:none;text-align:center;padding:0 6vw;
       box-sizing:border-box;
       font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
  #cur{font-size:clamp(20px,3.6vw,60px);line-height:1.26;letter-spacing:.02em;font-weight:500;
       color:#f5f1e6;text-shadow:0 2px 18px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);
       margin:0 auto;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;}
  #cur .ch{color:rgba(240,234,218,.24);transition:color .14s linear;}
  #cur .ch.on{color:#f8f4e8;}
  #cur.empty{color:rgba(245,241,230,.34);letter-spacing:.16em;font-weight:400;}
  #nxt{margin:.85em auto 0;font-size:clamp(12px,1.5vw,22px);color:rgba(245,241,230,.32);
       text-shadow:0 2px 12px rgba(0,0,0,.8);white-space:pre-wrap;word-break:break-word;}
  #meta{position:fixed;left:4.2vw;top:4.4vh;pointer-events:none;opacity:.78;
        max-width:40vw;transform:rotate(-1.5deg);
        font-family:"Arial Black","Helvetica Neue",Impact,system-ui,sans-serif;
        text-transform:uppercase;letter-spacing:.14em;line-height:1.1;}
  #meta .mt{display:block;font-size:clamp(12px,1.5vw,24px);color:#f6f1e2;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
            text-shadow:0 2px 10px rgba(0,0,0,.9);}
  #meta .ma{display:block;margin-top:.5em;font-size:clamp(9px,.86vw,12px);letter-spacing:.26em;
            color:rgba(245,241,230,.42);}
  #meta .bar{display:block;width:3.2em;height:3px;margin-top:.7em;background:#ff2a3e;
             box-shadow:0 0 12px rgba(255,42,62,.85);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lyr"><div id="cur"></div><div id="nxt"></div></div>
<div id="meta"><span class="mt"></span><span class="ma"></span><i class="bar"></i></div>
<script>
(function(){
  'use strict';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d', { alpha: false });
  var elCur = document.getElementById('cur');
  var elNxt = document.getElementById('nxt');

  var W = 1440, H = 900, DPR = 1;

  var S = {
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, err: '', text: '',
    accent: [255, 45, 60], duration: 0, song: null, cover: '',
    level: 0, bass: 0, mid: 0, treble: 0, bpm: 92, pulse: 0, idle: 0, vt: 0, lp: 0,
    inited: false, spans: [], ci: 0, lkey: '', fs: 0,
    pal: [[255, 42, 62], [66, 255, 138], [255, 206, 24]], ink: [248, 244, 232]
  };
  var rm = false;
  try { rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}

  function num(v, d) { v = +v; return isFinite(v) ? v : d; }

  /* ---------------- 霓虹调色 ---------------- */
  function c8(v) { v = Math.round(+v); if (!isFinite(v)) v = 0; return v < 0 ? 0 : (v > 255 ? 255 : v); }
  function col(c, a) {
    a = (a === undefined) ? 1 : Math.max(0, Math.min(1, +a || 0));
    return 'rgba(' + c8(c[0]) + ',' + c8(c[1]) + ',' + c8(c[2]) + ',' + a + ')';
  }
  function mixc(a, b, k) {
    k = Math.max(0, Math.min(1, k));
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  }
  var HOT = [255, 42, 62], LIME = [66, 255, 138], SUN = [255, 206, 24];

  /* 用封面主色把「红 / 绿 / 黄」三根荧光管往歌里染一点，
     既不脱离「荧光红绿黄」的方向，又让每首歌略有差别。 */
  function buildPal() {
    var a = S.accent, k = 0.26;
    var sat = (Math.max(a[0], a[1], a[2]) - Math.min(a[0], a[1], a[2])) / 255;
    if (sat < 0.12) k = 0.10;
    var p1 = mixc(HOT, a, k), p2 = mixc(LIME, a, k * 0.8), p3 = mixc(SUN, a, k * 0.6);
    S.pal = [p1, p2, p3];
    S.ink = [248, 244, 232];
  }
  buildPal();

  /* ---------------- 喷漆颗粒（一次性生成，之后只贴图） ---------------- */
  var grainPat = null;
  function buildGrain() {
    try {
      var n = 160, cc = document.createElement('canvas');
      cc.width = n; cc.height = n;
      var g = cc.getContext('2d');
      var img = g.createImageData(n, n), d = img.data, i;
      for (i = 0; i < n * n; i++) {
        var v = Math.random();
        v = v * v * v;
        d[i * 4] = 255; d[i * 4 + 1] = 255; d[i * 4 + 2] = 250;
        d[i * 4 + 3] = Math.round(v * 120);
      }
      g.putImageData(img, 0, 0);
      grainPat = ctx.createPattern(cc, 'repeat');
    } catch (e) { grainPat = null; }
  }
  buildGrain();

  function fit() {
    var w = cv.clientWidth || window.innerWidth || 0;
    var h = cv.clientHeight || window.innerHeight || 0;
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    DPR = Math.min(2, num(window.devicePixelRatio, 1) || 1);
    W = w; H = h;
    cv.width = Math.max(1, Math.round(w * DPR));
    cv.height = Math.max(1, Math.round(h * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    if (S.inited) setLyric(true);
  }
  window.addEventListener('resize', fit, { passive: true });

  function idxAt(t) {
    var L = S.lines, lo = 0, hi = L.length - 1, r = -1, guard = 0;
    while (lo <= hi && guard++ < 64) {
      var m = (lo + hi) >> 1;
      var lt = num(L[m].t, 1e9);
      if (lt <= t) { r = m; lo = m + 1; } else { hi = m - 1; }
    }
    return r;
  }

  var meas = null, mFam = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
  try { meas = document.createElement('canvas').getContext('2d'); } catch (e) { meas = null; }

  function layoutLine(text) {
    var maxW = Math.min(W * 0.84, 1280);
    var base = Math.max(19, Math.min(W * 0.055, H * 0.070, 58));
    var fs = base;
    if (meas) {
      try {
        meas.font = '500 ' + fs + 'px ' + mFam;
        try { meas.letterSpacing = '0.02em'; } catch (e2) {}
        var w = meas.measureText(text || '').width;
        if (w > maxW && w > 1) fs = Math.max(base * 0.56, fs * maxW / w);
      } catch (e) {}
    }
    elCur.style.fontSize = fs.toFixed(1) + 'px';
    elCur.style.maxWidth = maxW.toFixed(0) + 'px';
    elNxt.style.fontSize = Math.max(11, fs * 0.36).toFixed(1) + 'px';
    elNxt.style.maxWidth = maxW.toFixed(0) + 'px';
    S.fs = fs;
  }

  // 逐字生成 span（YRC 用真时间；LRC 按句长均分）
  function buildChars(line) {
    elCur.textContent = '';
    S.spans = [];
    S.ci = 0;
    var cps = Array.from(line.text || '');
    var n = cps.length;
    if (!n) return;
    var ch = line.chars, useY = false, i;
    if (ch && ch.length === n) {
      useY = true;
      for (i = 0; i < n; i++) {
        if (!ch[i] || !isFinite(+ch[i].t)) { useY = false; break; }
      }
    }
    var lt = num(line.t, 0);
    var dur = num(line.dur, 0);
    if (!(dur > 0)) dur = Math.max(1.8, Math.min(7.5, n * 0.24));
    var per = dur / n;
    var frag = document.createDocumentFragment();
    for (i = 0; i < n; i++) {
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = cps[i];
      frag.appendChild(sp);
      S.spans.push({ el: sp, t: useY ? num(ch[i].t, lt + i * per) : (lt + i * per) });
    }
    elCur.appendChild(frag);
  }

  function tickChars() {
    var sp = S.spans, n = sp.length;
    if (!n) return;
    var t = S.t, i = S.ci, k;
    if (i > n) i = S.ci = n;
    for (k = 0; k < n && i > 0 && sp[i - 1].t > t; k++) { i--; sp[i].el.classList.remove('on'); }
    for (k = 0; k < n && i < n && sp[i].t <= t; k++) { sp[i].el.classList.add('on'); i++; }
    S.ci = i;
  }

  function setLyric(force) {
    var L = S.lines, i = S.idx;
    var key = i + '#' + L.length + '#' + Math.round(W) + '#' + Math.round(H);
    if (!force && key === S.lkey) { tickChars(); return; }
    S.lkey = key;
    elCur.className = '';
    S.spans = []; S.ci = 0;

    if (!S.inited) {
      elCur.textContent = '♪   ♪   ♪';
      elNxt.textContent = '';
      layoutLine('♪   ♪   ♪');
      S.text = '';
      return;
    }
    if (!L.length) {
      elCur.textContent = '无歌词 · 听鼓点';
      elCur.className = 'empty';
      elNxt.textContent = '';
      layoutLine('无歌词 · 听鼓点');
      S.text = '';
      return;
    }
    if (i < 0) {
      elCur.textContent = '♪';
      var first = L[0] ? String(L[0].text || '') : '';
      elNxt.textContent = first;
      layoutLine('♪');
      S.text = '';
      return;
    }
    var ln = L[i] || {};
    var tx = (ln.text === null || ln.text === undefined) ? '' : String(ln.text);
    S.text = tx;
    if (!tx.trim()) {
      elCur.textContent = '·  ·  ·';
      elCur.className = 'empty';
      layoutLine('·  ·  ·');
    } else {
      buildChars(ln);
      layoutLine(tx);
      tickChars();
    }
    var nb = L[i + 1];
    elNxt.textContent = nb ? String(nb.text || '') : '';
  }

  function setMeta() {
    var mt = document.querySelector('#meta .mt'), ma = document.querySelector('#meta .ma');
    if (!mt || !ma) return;
    var s = S.song || {};
    var nm = s.name ? String(s.name) : '';
    var ar = s.artists;
    if (Array.isArray(ar)) ar = ar.join(' / ');
    ar = ar ? String(ar) : '';
    mt.textContent = nm || 'NEON TRIBAL';
    ma.textContent = ar;
    var bar = document.querySelector('#meta .bar');
    if (bar) {
      bar.style.background = col(S.pal[0], 1);
      bar.style.boxShadow = '0 0 14px ' + col(S.pal[0], 0.85);
    }
  }

  function paint() {
    if (!(W > 2) || !(H > 2)) { W = 1440; H = 900; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // 身体背后的一团热光，让纯黑不至于死平
    if (G.bg) {
      ctx.fillStyle = G.bg;
      ctx.fillRect(0, 0, W, H);
    }

    drawDeco();
    drawFigure();

    // 喷漆颗粒
    if (grainPat) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.055 + 0.05 * (S.treble || 0);
      ctx.fillStyle = grainPat;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // 侧边图腾刻线 + 喷漆飞点 + 地面反光
  var DEC = null;
  function buildDeco() {
    var a = [], i, j;
    for (i = 0; i < 8; i++) {
      var cx = 0.07 + Math.random() * 0.86, cy = 0.09 + Math.random() * 0.63;
      var n = 5 + (Math.random() * 11 | 0);
      for (j = 0; j < n; j++) {
        var an = Math.random() * Math.PI * 2, rr = Math.pow(Math.random(), 0.65) * 0.042;
        a.push([cx + Math.cos(an) * rr, cy + Math.sin(an) * rr * 1.7,
                0.4 + Math.random() * 1.4, 0.05 + Math.random() * 0.22]);
      }
    }
    DEC = a;
  }

  function drawDeco() {
    var tt = S.vt || 0, beat = S.pulse || 0, i, k;
    var xL = W * 0.052, xR = W * 0.948;
    var top = H * 0.17, bot = H * 0.72;
    var seg = Math.max(9, H * 0.021);
    var rows = Math.min(40, Math.floor((bot - top) / seg));

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 地面的一层暖反光
    if (G.floor) {
      ctx.fillStyle = G.floor;
      ctx.fillRect(0, H * 0.55, W, H * 0.45);
    }

    for (k = 0; k < rows; k++) {
      var y = top + k * seg;
      var a = 0.09 + 0.15 * (0.5 + 0.5 * Math.sin(k * 0.85 + tt * 1.1));
      var c = S.pal[k % 3];
      ctx.lineWidth = Math.max(1, W * 0.0009);
      ctx.strokeStyle = col(c, a + beat * 0.1);
      ctx.beginPath();
      ctx.moveTo(xL - seg * 0.42, y);
      ctx.lineTo(xL + seg * 0.42, y + seg * 0.20);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(xR + seg * 0.42, y);
      ctx.lineTo(xR - seg * 0.42, y + seg * 0.20);
      ctx.stroke();
      if (k % 4 === 0) {
        ctx.beginPath();
        ctx.moveTo(xL - seg * 0.55, y - seg * 0.10);
        ctx.lineTo(xL - seg * 0.20, y - seg * 0.10);
        ctx.strokeStyle = col(S.pal[2], a * 0.8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(xR + seg * 0.55, y - seg * 0.10);
        ctx.lineTo(xR + seg * 0.20, y - seg * 0.10);
        ctx.stroke();
      }
    }

    if (DEC) {
      var sp = 0.45 + 0.9 * (S.treble || 0) + 0.3 * beat;
      for (i = 0; i < DEC.length; i++) {
        var d = DEC[i];
        ctx.fillStyle = col(mixc(S.pal[i % 3], [255, 250, 235], 0.45), d[3] * sp);
        ctx.beginPath();
        ctx.arc(d[0] * W, d[1] * H, d[2], 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawFigure() {
    if (!(G.fh > 10) || !G.sil) return;
    var tt = S.vt || 0;
    var bass = S.bass || 0, beat = S.pulse || 0;
    var hw = G.hw, fh = G.fh;

    var mr = rm ? 0.3 : 1;
    ctx.save();
    ctx.translate(G.cx + Math.sin(tt * 0.55) * hw * 0.022 * mr, G.top + Math.sin(tt * 0.9) * fh * 0.004 * mr);
    ctx.rotate(Math.sin(tt * 0.42 + 0.7) * 0.012 * mr);

    drawWaves(tt, bass, beat);
    drawArms(tt, beat);

    ctx.save();
    ctx.clip(G.sil);
    ctx.fillStyle = col([30, 17, 20], 0.85);
    ctx.fillRect(-hw * 1.3, 0, hw * 2.6, fh);
    stripeField(tt);

    // 圆柱感的侧暗：光当从左上打过来
    if (G.cyl) { ctx.fillStyle = G.cyl; ctx.fillRect(-hw * 1.3, 0, hw * 2.6, fh); }

    // 下缘化进黑里，像被裁掉的一截
    if (G.fade) { ctx.fillStyle = G.fade; ctx.fillRect(-hw * 1.3, 0, hw * 2.6, fh); }
    ctx.restore();

    ctx.lineWidth = 1.15;
    ctx.strokeStyle = col(S.pal[2], 0.22 + beat * 0.2);
    ctx.stroke(G.sil);
    drawMask();
    ctx.restore();
  }

  // 头后的声波弧
  function drawWaves(tt, bass, beat) {
    var fh = G.fh, hw = G.hw, i;
    var cy = fh * 0.085;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < 6; i++) {
      var ph = ((tt * 0.13 + i / 6) % 1 + 1) % 1;
      var r = hw * (0.85 + ph * 2.35);
      var a = (1 - ph) * (0.16 + 0.34 * bass + 0.22 * beat);
      if (a < 0.015) continue;
      ctx.beginPath();
      ctx.arc(0, cy, r, Math.PI * 1.03, Math.PI * 1.97);
      ctx.lineWidth = Math.max(1, hw * 0.012);
      ctx.strokeStyle = col(S.pal[2 - (i % 3)], a);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, cy, r * 0.985, Math.PI * 1.12, Math.PI * 1.40);
      ctx.strokeStyle = col(S.pal[i % 3], a * 0.8);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 举起来的手臂：几条并行的荧光带
  function drawArms(tt, beat) {
    var hw = G.hw, fh = G.fh, s, b, k;
    var sw = Math.sin(tt * 0.85) * 0.055 * (rm ? 0.3 : 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (s = -1; s <= 1; s += 2) {
      var p0 = [s * hw * 0.46, fh * 0.285];
      var p1 = [s * hw * (0.97 + sw * 0.4), fh * (0.175 + sw * 0.5)];
      var p2 = [s * hw * (1.06 + sw), fh * 0.012];
      var ax = p2[0] - p0[0], ay = p2[1] - p0[1];
      var al = Math.max(1, Math.sqrt(ax * ax + ay * ay));
      var nx = -ay / al, ny = ax / al;
      for (b = 0; b < 4; b++) {
        var off = (b - 1.5) * fh * 0.013;
        ctx.beginPath();
        for (k = 0; k <= 16; k++) {
          var u = k / 16, v = 1 - u;
          var x = v * v * p0[0] + 2 * v * u * p1[0] + u * u * p2[0] + nx * off;
          var y = v * v * p0[1] + 2 * v * u * p1[1] + u * u * p2[1] + ny * off;
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        var w = Math.max(1, fh * 0.005);
        ctx.lineWidth = w * 3.6;
        ctx.strokeStyle = col(S.pal[b % 3], 0.09 + 0.12 * (S.treble || 0));
        ctx.stroke();
        ctx.lineWidth = w;
        ctx.strokeStyle = col(S.pal[b % 3], 0.70 + 0.25 * beat);
        ctx.stroke();
      }
      // 手
      ctx.beginPath();
      ctx.arc(p2[0], p2[1], fh * 0.016, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(1, fh * 0.004);
      ctx.strokeStyle = col(S.pal[2], 0.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p2[0], p2[1], fh * 0.032, 0, Math.PI * 2);
      ctx.strokeStyle = col(S.pal[0], 0.35);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMask() {
    if (!(G.fh > 10)) return;
    var fh = G.fh, hw = G.hw, beat = S.pulse || 0, lp = S.lp || 0;
    var hx = hw * 0.34, i, k;
    var eye = col([255, 250, 232], Math.min(1, 0.66 + 0.22 * beat + 0.22 * lp));

    // 面具外形（尖下巴的盾形）
    function shape() {
      ctx.beginPath();
      ctx.moveTo(0, -fh * 0.004);
      ctx.bezierCurveTo(-hx * 0.52, fh * 0.004, -hx * 0.96, fh * 0.045, -hx * 0.90, fh * 0.092);
      ctx.bezierCurveTo(-hx * 0.80, fh * 0.140, -hx * 0.40, fh * 0.166, 0, fh * 0.168);
      ctx.bezierCurveTo(hx * 0.40, fh * 0.166, hx * 0.80, fh * 0.140, hx * 0.90, fh * 0.092);
      ctx.bezierCurveTo(hx * 0.96, fh * 0.045, hx * 0.52, fh * 0.004, 0, -fh * 0.004);
      ctx.closePath();
    }

    // 面具底：压暗一层，让线看得清
    shape();
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fill();

    // 冠上的羽饰
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * hx * 0.30, fh * 0.004);
      ctx.lineTo(i * hx * 0.54, -fh * (0.030 + (2 - Math.abs(i)) * 0.012));
      ctx.lineWidth = Math.max(1, fh * 0.0042);
      ctx.strokeStyle = col(S.pal[(i + 5) % 3], 0.55 + 0.3 * beat);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(i * hx * 0.54, -fh * (0.030 + (2 - Math.abs(i)) * 0.012), fh * 0.006, 0, Math.PI * 2);
      ctx.fillStyle = col(S.pal[(i + 5) % 3], 0.9);
      ctx.fill();
    }
    ctx.restore();

    // 轮廓
    shape();
    ctx.lineWidth = Math.max(1.4, fh * 0.006);
    ctx.strokeStyle = col(S.pal[2], 0.86);
    ctx.stroke();
    ctx.lineWidth = Math.max(3, fh * 0.014);
    ctx.strokeStyle = col(S.pal[2], 0.12 + 0.14 * beat + 0.20 * lp);
    ctx.globalCompositeOperation = 'lighter';
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';

    // 额上人字纹
    for (i = 0; i < 3; i++) {
      var yy = fh * (0.014 + i * 0.011), ww = hx * (0.62 - i * 0.10);
      ctx.beginPath();
      ctx.moveTo(-ww, yy);
      ctx.lineTo(0, yy + fh * 0.020);
      ctx.lineTo(ww, yy);
      ctx.lineWidth = Math.max(1, fh * 0.0038);
      ctx.strokeStyle = col(S.pal[i % 3], 0.72 - i * 0.14);
      ctx.stroke();
    }

    // 眼：细长杏仁，亮得干净
    for (i = -1; i <= 1; i += 2) {
      var ex = i * hx * 0.42, ey = fh * 0.058, ew = hx * 0.24, eh = fh * 0.019;
      ctx.beginPath();
      ctx.moveTo(ex - ew, ey + eh * 0.30);
      ctx.quadraticCurveTo(ex, ey - eh, ex + ew, ey + eh * 0.30);
      ctx.quadraticCurveTo(ex, ey + eh * 0.85, ex - ew, ey + eh * 0.30);
      ctx.closePath();
      ctx.fillStyle = eye;
      ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = Math.max(4, fh * 0.020);
      ctx.strokeStyle = col(S.pal[2], 0.16 + 0.28 * beat);
      ctx.stroke();
      ctx.restore();
      // 眼下的两道刻痕
      for (k = 1; k <= 2; k++) {
        ctx.beginPath();
        ctx.moveTo(ex - ew * 0.75, ey + eh * (0.9 + k * 0.55));
        ctx.lineTo(ex + ew * 0.75, ey + eh * (1.05 + k * 0.55));
        ctx.lineWidth = Math.max(1, fh * 0.0034);
        ctx.strokeStyle = col(S.pal[0], 0.45 - k * 0.10);
        ctx.stroke();
      }
    }

    // 鼻梁与嘴：横条 + 点阵
    ctx.beginPath();
    ctx.moveTo(0, fh * 0.038);
    ctx.lineTo(0, fh * 0.118);
    ctx.lineWidth = Math.max(1, fh * 0.0034);
    ctx.strokeStyle = col(S.pal[1], 0.5);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-hx * 0.12, fh * 0.118);
    ctx.lineTo(0, fh * 0.128);
    ctx.lineTo(hx * 0.12, fh * 0.118);
    ctx.strokeStyle = col(S.pal[1], 0.7);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-hx * 0.052, fh * 0.126, fh * 0.005, 0, Math.PI * 2);
    ctx.arc(hx * 0.052, fh * 0.126, fh * 0.005, 0, Math.PI * 2);
    ctx.fillStyle = col(S.pal[0], 0.85);
    ctx.fill();

    for (i = 0; i < 3; i++) {
      var mw = hx * (0.30 - i * 0.07), my = fh * (0.136 + i * 0.011);
      ctx.beginPath();
      ctx.moveTo(-mw, my);
      ctx.lineTo(mw, my);
      ctx.lineWidth = Math.max(1, fh * (0.006 - i * 0.0014));
      ctx.strokeStyle = col(S.pal[(i + 2) % 3], 0.78 - i * 0.12);
      ctx.stroke();
    }

    // 腮边的刻线 + 耳盘
    for (i = -1; i <= 1; i += 2) {
      for (k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(i * hx * (0.72 - k * 0.05), fh * (0.100 + k * 0.020));
        ctx.lineTo(i * hx * (0.86 - k * 0.05), fh * (0.112 + k * 0.020));
        ctx.lineWidth = Math.max(1, fh * 0.0036);
        ctx.strokeStyle = col(S.pal[0], 0.62);
        ctx.stroke();
      }
      var dx = i * hx * 0.92, dy = fh * 0.088;
      ctx.beginPath();
      ctx.arc(dx, dy, fh * 0.019, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(1, fh * 0.0042);
      ctx.strokeStyle = col(S.pal[1], 0.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(dx, dy, fh * 0.008, 0, Math.PI * 2);
      ctx.fillStyle = col(S.pal[1], 0.9);
      ctx.fill();
      for (k = 0; k < 6; k++) {
        var an = k / 6 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(dx + Math.cos(an) * fh * 0.026, dy + Math.sin(an) * fh * 0.026);
        ctx.lineTo(dx + Math.cos(an) * fh * 0.034, dy + Math.sin(an) * fh * 0.034);
        ctx.lineWidth = Math.max(1, fh * 0.0032);
        ctx.strokeStyle = col(S.pal[2], 0.55);
        ctx.stroke();
      }
    }
  }

  /* ---------------- 人体：一条闭合轮廓 + 横向波状纹 ---------------- */
  var G = { fh: 0, hw: 0, cx: 0, cy: 0, top: 0, sil: null };

  // 右半边轮廓（x 以半宽为单位，y 以身高为单位），左半镜像
  var PROF = [
    [0.000, 0.000], [0.200, 0.014], [0.330, 0.050], [0.372, 0.092],
    [0.348, 0.132], [0.240, 0.162], [0.152, 0.182], [0.156, 0.206],
    [0.340, 0.236], [0.580, 0.264], [0.660, 0.302], [0.600, 0.338],
    [0.530, 0.396], [0.455, 0.452], [0.450, 0.492], [0.520, 0.536],
    [0.600, 0.586], [0.575, 0.662], [0.520, 0.742], [0.500, 0.822],
    [0.520, 0.902], [0.552, 0.980], [0.570, 1.000]
  ];

  function catmull(pts, sub) {
    var out = [], n = pts.length, i, j;
    for (i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      for (j = 0; j < sub; j++) {
        var t = j / sub, t2 = t * t, t3 = t2 * t;
        out.push([
          0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
        ]);
      }
    }
    return out;
  }

  function build() {
    var portrait = H > W * 1.02;
    var top = H * (portrait ? 0.060 : 0.070);
    var bottom = H * (portrait ? 0.735 : 0.795);
    var avail = Math.max(120, bottom - top);
    var fhCap = portrait ? W * 1.22 : W * 0.62;
    var fh = Math.max(80, Math.min(avail, fhCap));
    var hw = fh * 0.33;
    G.fh = fh; G.hw = hw; G.top = top;
    G.cx = W * 0.5; G.cy = top + fh * 0.5;

    var pts = [], i;
    for (i = 0; i < PROF.length; i++) pts.push([PROF[i][0] * hw, PROF[i][1] * fh]);
    var loop = pts.slice();
    for (i = PROF.length - 1; i >= 1; i--) loop.push([-PROF[i][0] * hw, PROF[i][1] * fh]);
    var dense = catmull(loop, 5);

    var p = new Path2D();
    p.moveTo(dense[0][0], dense[0][1]);
    for (i = 1; i < dense.length; i++) p.lineTo(dense[i][0], dense[i][1]);
    p.closePath();
    G.sil = p;
    buildDeco();
    buildGradients();
  }

  function buildGradients() {
    G.bg = G.floor = G.cyl = G.fade = null;
    if (!(W > 2) || !(H > 2) || !(G.fh > 10)) return;
    var hw = G.hw, fh = G.fh;
    try {
      var g1 = ctx.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.44, Math.max(W, H) * 0.55);
      g1.addColorStop(0, col(S.pal[0], 0.13));
      g1.addColorStop(0.42, col(S.pal[1], 0.05));
      g1.addColorStop(1, 'rgba(0,0,0,0)');
      G.bg = g1;

      var g2 = ctx.createRadialGradient(W * 0.5, H * 0.80, 0, W * 0.5, H * 0.80, Math.max(W, H) * 0.42);
      g2.addColorStop(0, col(S.pal[0], 0.10));
      g2.addColorStop(0.5, col(S.pal[0], 0.03));
      g2.addColorStop(1, 'rgba(0,0,0,0)');
      G.floor = g2;

      var g3 = ctx.createLinearGradient(-hw, 0, hw, 0);
      g3.addColorStop(0, 'rgba(0,0,0,0.95)');
      g3.addColorStop(0.22, 'rgba(0,0,0,0.44)');
      g3.addColorStop(0.44, 'rgba(0,0,0,0.02)');
      g3.addColorStop(0.66, 'rgba(0,0,0,0.30)');
      g3.addColorStop(1, 'rgba(0,0,0,0.95)');
      G.cyl = g3;

      var g4 = ctx.createLinearGradient(0, fh * 0.74, 0, fh * 1.02);
      g4.addColorStop(0, 'rgba(0,0,0,0)');
      g4.addColorStop(1, 'rgba(0,0,0,0.97)');
      G.fade = g4;
    } catch (e) { G.bg = G.floor = G.cyl = G.fade = null; }
  }

  function stripeField(tt) {
    var fh = G.fh, hw = G.hw;
    var lvl = S.level || 0, bass = S.bass || 0, hi = S.treble || 0;
    var beat = S.pulse || 0;
    var mr = rm ? 0.34 : 1;
    var amp = fh * (0.009 + 0.020 * (0.35 + bass * 1.1)) * (1 + beat * 0.35) * mr;
    var cyl = fh * 0.030 * (0.65 + 0.35 * Math.sin(tt * 0.7));
    var sp = (0.5 + (S.bpm || 90) / 240) * mr;
    var n = 26, i, k;

    for (i = 0; i < n; i++) {
      if (i % 7 === 3) continue;                 // 留白，让条纹像手工画的
      var baseY = fh * (i + 0.45) / n;
      var ph = i * 0.62 + Math.sin(i * 1.7) * 0.9;
      var thick = (i % 5 === 1) ? 2.6 : 1.7;
      var c = S.pal[i % 3];
      var alpha = 0.72 + 0.22 * ((i * 7) % 5) / 5 + beat * 0.18 + (S.lp || 0) * 0.10;

      ctx.beginPath();
      var steps = 26;
      for (k = 0; k <= steps; k++) {
        var u = k / steps;
        var x = (-1 + 2 * u) * hw * 0.955;
        var th = (x / hw) * (Math.PI * 0.5);
        var y = baseY + cyl * (1 - Math.cos(th)) + amp * Math.sin(x / hw * 3.4 + ph + tt * sp * 1.4);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      // 外层柔光
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = thick * 4.2;
      ctx.strokeStyle = col(c, 0.10 + 0.10 * hi);
      ctx.stroke();
      // 灯管本体
      ctx.lineWidth = thick;
      ctx.strokeStyle = col(c, Math.min(1, alpha));
      ctx.stroke();
      // 高光芯
      ctx.lineWidth = Math.max(0.7, thick * 0.38);
      ctx.strokeStyle = col(mixc(c, [255, 255, 245], 0.55), 0.55);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    var perf = (window.performance && performance.now) ? function () { return performance.now(); } : function () { return Date.now(); };
    var t0 = perf();
    S.frames++;
    if (S.pulse > 0) S.pulse = Math.max(0, S.pulse - (rm ? 0.11 : 0.055));
    if (S.lp > 0) S.lp = Math.max(0, S.lp - 0.045);
    if (S.playing) S.idle *= 0.985; else S.idle = Math.min(40, S.idle + (rm ? 0.004 : 0.010));
    S.vt = (S.t || 0) + S.idle;
    try { tickChars(); } catch (e2) { S.err = String(e2 && e2.message || e2); }
    try { paint(); } catch (e3) { S.err = String(e3 && e3.message || e3); }
    S.js = perf() - t0;
    if (!readySent) { readySent = true; post('ready'); }
    requestAnimationFrame(frame);
  }

  var readySent = false;
  function post(type, payload) {
    try {
      var m = { __c100: 1, type: type };
      if (payload !== undefined) m.payload = payload;
      parent.postMessage(m, '*');
    } catch (e) {}
  }

  function onInit(p) {
    p = p || {};
    var song = p.song || {};
    S.song = { name: song.name || '', artists: song.artists || '', id: song.id || '' };
    var ac = p.accent;
    if (ac && ac.length >= 3) {
      S.accent = [Math.max(0, Math.min(255, Math.round(num(ac[0], 255)))),
                  Math.max(0, Math.min(255, Math.round(num(ac[1], 45)))),
                  Math.max(0, Math.min(255, Math.round(num(ac[2], 60))))];
    }
    var raw = Array.isArray(p.lines) ? p.lines : [];
    var out = [], i;
    for (i = 0; i < raw.length && out.length < 4000; i++) {
      var ln = raw[i];
      if (!ln || typeof ln !== 'object') continue;
      var tt = num(ln.t, 0);
      if (!isFinite(tt) || tt < 0) tt = 0;
      out.push({
        t: tt,
        dur: Math.max(0, num(ln.dur, 0)),
        text: (ln.text === null || ln.text === undefined) ? '' : String(ln.text),
        chars: Array.isArray(ln.chars) ? ln.chars : null
      });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    S.lines = out;
    S.duration = Math.max(0, num(p.duration, 0));
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    S.inited = true;
    buildPal();
    buildGradients();
    setMeta();
    S.idx = idxAt(S.t);
    setLyric(true);
  }

  function onTick(p) {
    p = p || {};
    var raw = p.time;
    var t = (typeof raw === 'number' || typeof raw === 'string') ? +raw : NaN;
    if (isFinite(t) && t >= 0) S.t = t;
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    var i = idxAt(S.t);
    if (i !== S.idx) { S.idx = i; S.lp = 1; setLyric(); }
  }

  function onBeat(p) {
    p = p || {};
    var lv = num(p.level, 0.6);
    lv = Math.max(0, Math.min(1, lv));
    S.pulse = Math.max(S.pulse, rm ? 0.55 : 1);
    S.level = Math.max(S.level * 0.6, lv);
  }

  function onLive(p) {
    p = p || {};
    S.bpm = Math.max(40, Math.min(220, num(p.bpm, S.bpm || 92)));
    S.level = Math.max(0, Math.min(1, num(p.level, S.level)));
    S.bass = Math.max(0, Math.min(1, num(p.bass, S.bass)));
    S.mid = Math.max(0, Math.min(1, num(p.mid, S.mid)));
    S.treble = Math.max(0, Math.min(1, num(p.treble, S.treble)));
    if (typeof p.playing === 'boolean') S.playing = p.playing;
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch (e) { S.err = String(e && e.message || e); }
  });

  window.__stage = function () {
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: !!S.playing,
      frames: S.frames, js: S.js, err: S.err, text: S.text,
      gl: false, rm: !!rm
    };
  };

  fit();
  var started = false;
  function boot() {
    if (!readySent) { readySent = true; post('ready'); }
    if (!started) { started = true; requestAnimationFrame(frame); }
  }
  requestAnimationFrame(boot);
  setTimeout(boot, 120);
})();
</script>
</body>
</html>
