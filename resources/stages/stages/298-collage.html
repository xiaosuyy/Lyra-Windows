<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night Swim · Lyric Scene</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#04070d;overflow:hidden}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:#e9f1ff;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#04070d;isolation:isolate}
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
  #sky{z-index:1;transform-origin:50% 56%;will-change:transform,filter}
  #art{z-index:3;pointer-events:none}

  .halo{
    position:absolute;z-index:2;pointer-events:none;left:-16%;top:-30%;width:78vw;height:78vw;border-radius:50%;
    background:radial-gradient(circle at 44% 40%,rgba(196,226,255,.46),rgba(126,178,238,.22) 38%,rgba(52,104,176,.07) 62%,rgba(20,50,100,0) 74%);
    filter:blur(26px);mix-blend-mode:screen;opacity:.85;will-change:transform,opacity;
  }
  .halo.warm{
    left:auto;right:-24%;top:auto;bottom:-34%;width:64vw;height:64vw;
    background:radial-gradient(circle at 50% 50%,rgba(255,196,152,.18),rgba(240,150,120,.06) 46%,rgba(120,60,40,0) 70%);
    opacity:.7;
  }
  .scrim{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:
      radial-gradient(52% 54% at 26% 50%,rgba(4,9,20,.40),rgba(4,9,20,.12) 56%,rgba(4,9,20,0) 72%),
      linear-gradient(0deg,rgba(3,7,14,.52) 0%,rgba(3,7,14,.10) 22%,rgba(3,7,14,0) 40%);
  }
  .collage{position:absolute;inset:0;z-index:5;pointer-events:none}
  .tape{
    position:absolute;display:block;mix-blend-mode:soft-light;
    background:linear-gradient(102deg,rgba(236,246,255,.11),rgba(198,222,248,.03) 58%,rgba(236,246,255,.08));
    border-left:1px solid rgba(240,250,255,.10);border-right:1px solid rgba(240,250,255,.06);
  }
  .tape.t1{
    left:-4%;top:10%;width:30%;height:40px;transform:rotate(-3.2deg);
    clip-path:polygon(0 22%,4% 4%,18% 15%,33% 2%,52% 13%,70% 0,86% 11%,100% 3%,99% 78%,88% 96%,71% 84%,54% 100%,37% 86%,20% 98%,6% 86%);
  }
  .tape.t2{
    right:-6%;bottom:16%;width:28%;height:32px;transform:rotate(6.5deg);opacity:.7;
    clip-path:polygon(0 12%,12% 0,26% 12%,41% 2%,57% 14%,73% 3%,88% 13%,100% 4%,98% 82%,84% 100%,69% 86%,52% 98%,36% 84%,21% 96%,7% 84%);
  }
  .strip{position:absolute;display:block;mix-blend-mode:screen;opacity:.45}
  .strip.s1{left:52%;top:-2%;width:22%;height:30%;transform:rotate(9deg);
    background:linear-gradient(178deg,rgba(214,236,255,.16),rgba(214,236,255,.02))}
  .strip.s2{left:8%;bottom:-4%;width:26%;height:22%;transform:rotate(-5deg);
    background:linear-gradient(0deg,rgba(180,208,240,.10),rgba(180,208,240,0))}
  .dust-ring{
    position:absolute;right:9%;top:9%;width:9px;height:9px;border-radius:50%;
    border:1px solid rgba(214,235,255,.35);box-shadow:0 0 22px rgba(170,210,255,.35) inset;
  }

  #lyr{
    position:absolute;z-index:6;pointer-events:none;
    left:clamp(24px,7.2vw,124px);top:0;height:100%;width:min(38vw,560px);
    opacity:0;transition:opacity .9s ease;
  }
  #lyr.show{opacity:1}
  #stack{position:relative;will-change:transform}
  .lrow{position:relative;padding:.30em 0;margin:0;opacity:0;filter:blur(2.4px);
    transition:opacity .62s ease,filter .62s ease}
  .lrow.gone{opacity:0}
  .lrow.far2{opacity:.10;filter:blur(2.6px)}
  .lrow.next{opacity:.26;filter:blur(1.5px)}
  .lrow.prev{opacity:.34;filter:blur(1.3px)}
  .lrow.cur{opacity:1;filter:none}
  .ltext{
    display:block;font-size:clamp(25px,3.05vw,49px);line-height:1.36;font-weight:500;
    letter-spacing:.012em;color:#c9dcf2;text-shadow:0 2px 30px rgba(3,8,18,.7);
    transition:color .5s ease;
  }
  .lrow.cur .ltext{
    color:#f4f9ff;font-weight:600;
    text-shadow:0 0 34px rgba(150,196,255,.38),0 0 12px rgba(190,220,255,.26),0 3px 26px rgba(2,6,14,.9);
  }
  .ch{
    display:inline-block;white-space:pre;opacity:.22;filter:blur(4px);transform:translateY(.06em);
    transition:opacity .46s cubic-bezier(.2,.7,.25,1),filter .55s ease,transform .5s ease;
  }
  .ch.on{opacity:1;filter:blur(0);transform:translateY(0)}
  .ul{
    position:absolute;left:0;bottom:.16em;height:1px;width:100%;transform-origin:0 50%;transform:scaleX(0);
    background:linear-gradient(90deg,var(--acc,#9fc4ff),rgba(160,200,255,.14));opacity:.7;
  }

  .frame{position:absolute;inset:clamp(12px,1.7vw,26px);z-index:7;pointer-events:none;
    border:1px solid rgba(212,232,255,.13)}
  .frame i{position:absolute;width:13px;height:13px;border:0 solid rgba(226,242,255,.5)}
  .frame i.tl{left:-1px;top:-1px;border-left-width:1px;border-top-width:1px}
  .frame i.tr{right:-1px;top:-1px;border-right-width:1px;border-top-width:1px}
  .frame i.bl{left:-1px;bottom:-1px;border-left-width:1px;border-bottom-width:1px}
  .frame i.br{right:-1px;bottom:-1px;border-right-width:1px;border-bottom-width:1px}

  .top{
    position:absolute;z-index:8;left:clamp(24px,2.9vw,46px);right:clamp(24px,2.9vw,46px);
    top:clamp(24px,2.9vw,44px);display:flex;align-items:center;justify-content:space-between;pointer-events:none;
  }
  #chip{position:relative;width:42px;height:42px;opacity:0;transition:opacity .8s ease}
  #chip.on{opacity:1}
  #chip img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;
    filter:grayscale(.15) contrast(1.05) brightness(.92);box-shadow:0 6px 22px rgba(2,6,14,.6)}
  #chip .ring{position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(214,234,255,.22)}
  #chip .ring:after{content:"";position:absolute;inset:0;border-radius:50%;
    border-top:1px solid rgba(236,247,255,.55);animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tag{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:.42em;
    text-transform:uppercase;color:rgba(210,230,252,.52);font-weight:500}
  .tag i{display:block;width:34px;height:1px;background:rgba(210,230,252,.28)}

  .meta{
    position:absolute;z-index:8;left:clamp(24px,2.9vw,46px);right:clamp(24px,2.9vw,46px);
    bottom:clamp(20px,2.5vw,36px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:rgba(206,226,250,.46);
    font-weight:500;pointer-events:none;
  }
  .meta .l{display:flex;align-items:center;gap:10px}
  .meta .dot{width:4px;height:4px;border-radius:50%;background:var(--acc,#9fc4ff);box-shadow:0 0 12px var(--acc,#9fc4ff)}
  .meta .r{font-variant-numeric:tabular-nums;letter-spacing:.2em;color:rgba(222,238,255,.62)}

  #grain{
    position:absolute;inset:-8%;z-index:9;pointer-events:none;background-repeat:repeat;
    background-size:200px 200px;opacity:.16;mix-blend-mode:overlay;will-change:transform;
  }

  @media (max-width:820px){
    #lyr{left:8vw;right:8vw;width:auto}
    .ltext{font-size:clamp(24px,6.4vw,38px)}
    .scrim{background:
      radial-gradient(80% 46% at 40% 78%,rgba(4,9,20,.62),rgba(4,9,20,.2) 62%,rgba(4,9,20,0) 80%),
      linear-gradient(0deg,rgba(3,7,14,.7) 0%,rgba(3,7,14,.1) 42%,rgba(3,7,14,0) 62%)}
    .tape.t1{height:30px}
  }
  @media (prefers-reduced-motion:reduce){
    .ch{transition:opacity .2s linear,filter .2s linear}
    #chip .ring:after{animation:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>
  <div class="halo" id="halo"></div>
  <div class="halo warm"></div>
  <canvas id="art"></canvas>
  <div class="scrim"></div>
  <div class="collage" aria-hidden="true">
    <span class="tape t1"></span>
    <span class="tape t2"></span>
    <span class="strip s1"></span>
    <span class="strip s2"></span>
    <span class="dust-ring"></span>
  </div>
  <div id="lyr"><div id="stack"></div></div>
  <div class="frame" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <div class="top">
    <div id="chip"><img id="cover" alt=""><span class="ring"></span></div>
    <div class="tag">Lyric&nbsp;Scene<i></i></div>
  </div>
  <div class="meta">
    <div class="l"><span class="dot"></span>Night&nbsp;Swim&nbsp;/&nbsp;01</div>
    <div class="r"><span id="tc">00:00&nbsp;/&nbsp;00:00</span></div>
  </div>
  <div id="grain" aria-hidden="true"></div>
</div>

<script>
(function(){
"use strict";

/* ===================== state / public api ===================== */
var S = {
  lines: [], idx: -1, t: 0, playing: false,
  frames: 0, js: 0, err: "", text: "", gl: false, rm: false,
  song: null, duration: 0
};
try {
  var tc0 = document.createElement("canvas");
  S.gl = !!(tc0.getContext("webgl2") || tc0.getContext("webgl"));
} catch(e){ S.gl = false; }

window.__stage = function(){
  return {
    lines: S.lines, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm
  };
};
window.addEventListener("error", function(ev){
  if(!S.err) S.err = String((ev && ev.message) || "error");
});
try { S.rm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch(e){}

/* ===================== dom ===================== */
var stageEl = document.getElementById("stage");
var skyEl   = document.getElementById("sky");
var artEl   = document.getElementById("art");
var grainEl = document.getElementById("grain");
var lyrEl   = document.getElementById("lyr");
var stackEl = document.getElementById("stack");
var tcEl    = document.getElementById("tc");
var chipEl  = document.getElementById("chip");
var coverEl = document.getElementById("cover");
var haloEl  = document.getElementById("halo");
var sctx = skyEl.getContext("2d");
var actx = artEl.getContext("2d");

/* ===================== utils ===================== */
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function pad2(n){ n = Math.floor(n); return n<10 ? "0"+n : ""+n; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x,y){
  var n = Math.sin(x*127.1 + y*311.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x,y){
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  var a = hash2(xi,yi), b = hash2(xi+1,yi), c = hash2(xi,yi+1), d = hash2(xi+1,yi+1);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm1(x, seed){
  var amp = .5, fr = 1, sum = 0, tot = 0;
  for(var i=0;i<4;i++){
    sum += amp * vnoise(x*fr + seed*0.37, seed*1.7 + i*3.11);
    tot += amp; amp *= .52; fr *= 2.07;
  }
  return sum / tot;
}
function rr(p,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  p.moveTo(x+r,y);
  p.lineTo(x+w-r,y); p.quadraticCurveTo(x+w,y,x+w,y+r);
  p.lineTo(x+w,y+h-r); p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  p.lineTo(x+r,y+h); p.quadraticCurveTo(x,y+h,x,y+h-r);
  p.lineTo(x,y+r); p.quadraticCurveTo(x,y,x+r,y);
  p.closePath();
}

/* ===================== sizing ===================== */
var W = 1200, H = 800, DPR = 1, narrow = false;
var geo = { x:0, y:0, s:200 };
var centers = [], stackY = 0, stackTarget = 0, targetY = 0;
var rangeC = null, motes = [], pines = [];
var B = null;

function resize(){
  W = Math.max(320, window.innerWidth || 1200);
  H = Math.max(320, window.innerHeight || 800);
  DPR = Math.min(2.5, Math.max(1, window.devicePixelRatio || 1));
  narrow = W < 820;

  skyEl.width = Math.round(W*DPR);  skyEl.height = Math.round(H*DPR);
  artEl.width = Math.round(W*DPR);  artEl.height = Math.round(H*DPR);
  sctx.setTransform(DPR,0,0,DPR,0,0);
  actx.setTransform(DPR,0,0,DPR,0,0);

  var bs = narrow ? Math.min(W*0.46, H*0.22) : Math.min(W*0.21, H*0.315);
  geo.s = Math.max(90, bs);
  geo.x = narrow ? W*0.615 : W*0.765;
  geo.y = (narrow ? H*0.155 : H*0.085) + 1.40*geo.s;

  buildPaths();
  paintSky();
  buildRange();
  buildMotes();
  buildPines();
  measure(true);
  updateGrainPos(0);
}

/* ===================== sky painting ===================== */
var vortices = [[.755,.235,.185,1.05],[.27,.395,.225,-.95],[.56,.115,.135,.75],[.875,.52,.16,-.6],[.11,.70,.15,.5]];

function fieldAngle(x,y){
  var a = -1.32 + (vnoise(x*0.0013, y*0.0013) - .5) * 2.1;
  var vx = Math.cos(a), vy = Math.sin(a);
  for(var i=0;i<vortices.length;i++){
    var v = vortices[i];
    var dx = x - v[0]*W, dy = y - v[1]*H;
    var d2 = dx*dx + dy*dy + 900;
    var d = Math.sqrt(d2);
    var f = v[3] * 260000 / d2;
    f = clamp(f, -2.4, 2.4);
    vx += (-dy/d) * f;
    vy += ( dx/d) * f;
  }
  return Math.atan2(vy, vx);
}

function paintSky(){
  if(!W || !H) return;
  var g = sctx, rnd = mulberry32(20261101), i, x, y;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation = "source-over";
  g.globalAlpha = 1;
  g.clearRect(0,0,W,H);

  var bg = g.createLinearGradient(W*0.1,0,W*0.62,H);
  bg.addColorStop(0.00,"#071528");
  bg.addColorStop(0.13,"#0d2c52");
  bg.addColorStop(0.28,"#1b537f");
  bg.addColorStop(0.44,"#3a86ac");
  bg.addColorStop(0.58,"#83bacb");
  bg.addColorStop(0.675,"#c8e1e1");
  bg.addColorStop(0.72,"#e6efe7");
  bg.addColorStop(0.775,"#7fa1b2");
  bg.addColorStop(0.87,"#1b2c46");
  bg.addColorStop(1.00,"#050b15");
  g.fillStyle = bg;
  g.fillRect(0,0,W,H);

  var cols = [["#08213f",.14],["#103f6d",.19],["#1e639a",.21],["#3f89bd",.18],["#80bdd6",.15],["#cde6e7",.09],["#f2f6ed",.04]];
  function pick(r){
    var acc = 0;
    for(var k=0;k<cols.length;k++){ acc += cols[k][1]; if(r <= acc) return cols[k][0]; }
    return cols[cols.length-1][0];
  }

  var count = clamp(Math.round(W*H/2100), 480, 1300);
  var minSide = Math.min(W,H);
  g.lineCap = "round"; g.lineJoin = "round";

  for(i=0;i<count;i++){
    x = rnd()*W;
    y = Math.pow(rnd(),0.75) * H * 0.95;
    var col = pick(rnd());
    var wdt = 0.8 + Math.pow(rnd(),2.0) * 10.5;
    var steps = 9 + Math.floor(rnd()*13);
    var seg = minSide * (0.0060 + rnd()*0.0135) * (0.72 + wdt/14);

    g.beginPath(); g.moveTo(x,y);
    for(var s=0;s<steps;s++){
      var ang = fieldAngle(x,y);
      x += Math.cos(ang)*seg; y += Math.sin(ang)*seg;
      g.lineTo(x,y);
    }
    g.lineWidth = wdt;
    g.strokeStyle = col;
    g.globalAlpha = 0.075 + rnd()*0.185;
    g.stroke();
    if(rnd() < 0.32){
      g.globalAlpha = 0.045 + rnd()*0.095;
      g.lineWidth = Math.max(0.55, wdt*0.30);
      g.strokeStyle = "#f4f8ef";
      g.stroke();
    }
  }

  /* broad impasto sweeps */
  for(i=0;i<70;i++){
    var hx = rnd()*W, hy = rnd()*H*0.86;
    g.beginPath(); g.moveTo(hx,hy);
    for(var hh=0; hh<8; hh++){
      var aa = fieldAngle(hx,hy) + (rnd()-.5)*0.30;
      hx += Math.cos(aa)*minSide*0.032;
      hy += Math.sin(aa)*minSide*0.032;
      g.lineTo(hx,hy);
    }
    g.lineWidth = 4 + rnd()*17;
    g.strokeStyle = rnd() < 0.5 ? "#b7d6e4" : "#eaf1e6";
    g.globalAlpha = 0.030 + rnd()*0.065;
    g.stroke();
  }
  g.globalAlpha = 1;

  g.globalCompositeOperation = "screen";
  for(i=0;i<vortices.length;i++){
    var v = vortices[i];
    var R = v[2]*minSide*1.55;
    var rg = g.createRadialGradient(v[0]*W, v[1]*H, 0, v[0]*W, v[1]*H, R);
    rg.addColorStop(0,"rgba(226,241,241,.36)");
    rg.addColorStop(.42,"rgba(130,186,220,.13)");
    rg.addColorStop(1,"rgba(16,44,84,0)");
    g.fillStyle = rg;
    g.beginPath(); g.arc(v[0]*W, v[1]*H, R, 0, TAU); g.fill();
  }
  for(i=0;i<80;i++){
    var vv = vortices[Math.floor(rnd()*vortices.length)];
    var cx = vv[0]*W + (rnd()-.5)*minSide*0.10;
    var cy = vv[1]*H + (rnd()-.5)*minSide*0.10;
    var rad = minSide*(0.035 + rnd()*0.20);
    var a0 = rnd()*TAU, sweep = 0.5 + rnd()*1.9;
    g.beginPath();
    g.arc(cx, cy, rad, a0, a0+sweep);
    g.lineWidth = 0.6 + rnd()*3.4;
    g.strokeStyle = "rgba(236,246,238," + (0.03 + rnd()*0.075).toFixed(3) + ")";
    g.stroke();
  }
  var hz = g.createLinearGradient(0, H*0.645, 0, H*0.79);
  hz.addColorStop(0,"rgba(232,244,241,0)");
  hz.addColorStop(.48,"rgba(232,244,241,.22)");
  hz.addColorStop(1,"rgba(232,244,241,0)");
  g.fillStyle = hz; g.fillRect(0, H*0.63, W, H*0.18);

  var ember = g.createRadialGradient(W*0.18, H*0.725, 0, W*0.18, H*0.725, Math.min(W,H)*0.4);
  ember.addColorStop(0,"rgba(255,205,160,.22)");
  ember.addColorStop(1,"rgba(255,160,110,0)");
  g.fillStyle = ember; g.fillRect(0, H*0.54, W*0.62, H*0.4);
  g.globalCompositeOperation = "source-over";

  var bot = g.createLinearGradient(0,H*0.66,0,H);
  bot.addColorStop(0,"rgba(5,12,24,0)");
  bot.addColorStop(1,"rgba(4,8,17,.30)");
  g.fillStyle = bot; g.fillRect(0,H*0.64,W,H*0.38);
}

/* ===================== mountain range (cached) ===================== */
function ridgeY(u, seed, sharp){
  var n1 = fbm1(u*2.55 + seed, seed*2.1);
  var v = 1 - Math.abs(n1*2 - 1);
  v = Math.pow(v, sharp);
  var n2 = fbm1(u*7.3 + seed*3.7, seed*5.3);
  return v*0.82 + n2*0.18;
}
function ridgePath(g, seed, baseY, amp, sharp){
  var n = 132, i, u, y;
  g.beginPath();
  g.moveTo(0, H);
  for(i=0;i<=n;i++){
    u = i/n;
    y = baseY*H - ridgeY(u, seed, sharp)*amp*H;
    g.lineTo(u*W, y);
  }
  g.lineTo(W,H); g.closePath();
}
function buildRange(){
  var c = document.createElement("canvas");
  c.width = Math.round(W*DPR); c.height = Math.round(H*DPR);
  var g = c.getContext("2d");
  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalAlpha = 1;

  ridgePath(g, 11.3, 0.700, 0.105, 2.2);
  g.fillStyle = "#5d87ad"; g.globalAlpha = .52; g.fill(); g.globalAlpha = 1;
  g.save(); g.clip();
  var fg = g.createLinearGradient(0, H*0.58, 0, H*0.72);
  fg.addColorStop(0,"rgba(190,220,236,.34)");
  fg.addColorStop(1,"rgba(190,220,236,0)");
  g.fillStyle = fg; g.fillRect(0,H*0.55,W,H*0.2); g.restore();

  ridgePath(g, 4.7, 0.742, 0.155, 2.6);
  g.fillStyle = "#2a4468"; g.globalAlpha = .92; g.fill(); g.globalAlpha = 1;
  g.save(); g.clip();
  var mg = g.createLinearGradient(0, H*0.60, 0, H*0.80);
  mg.addColorStop(0,"rgba(150,190,220,.20)");
  mg.addColorStop(.5,"rgba(120,160,200,.05)");
  mg.addColorStop(1,"rgba(10,20,36,0)");
  g.fillStyle = mg; g.fillRect(0,H*0.58,W,H*0.3); g.restore();

  ridgePath(g, 8.1, 0.80, 0.115, 3.0);
  g.fillStyle = "#0e1a2c"; g.fill();
  g.save();
  g.clip();
  var ng = g.createLinearGradient(0, H*0.70, 0, H);
  ng.addColorStop(0,"rgba(60,96,138,.50)");
  ng.addColorStop(.45,"rgba(20,34,56,.26)");
  ng.addColorStop(1,"rgba(4,8,16,0)");
  g.fillStyle = ng; g.fillRect(0,H*0.66,W,H*0.36);
  g.restore();

  var rim = g.createLinearGradient(0, H*0.60, 0, H*0.84);
  rim.addColorStop(0,"rgba(214,238,252,.34)");
  rim.addColorStop(1,"rgba(214,238,252,0)");
  g.strokeStyle = rim; g.lineWidth = 1.1;
  var n = 132, i, u, y;
  g.beginPath();
  for(i=0;i<=n;i++){ u=i/n; y = 0.80*H - ridgeY(u,8.1,3.0)*0.115*H; if(i===0) g.moveTo(u*W,y); else g.lineTo(u*W,y); }
  g.stroke();

  var rnd = mulberry32(771);
  for(i=0;i<28;i++){
    u = rnd();
    var tx = u*W;
    var ty = 0.80*H - ridgeY(u,8.1,3.0)*0.115*H + 2;
    var th = H*(0.014 + rnd()*0.026);
    g.fillStyle = "rgba(7,14,26,.92)";
    g.beginPath();
    g.moveTo(tx, ty-th);
    g.lineTo(tx + th*0.20, ty);
    g.lineTo(tx - th*0.20, ty);
    g.closePath(); g.fill();
  }
  rangeC = c;
}

/* ===================== particles / trees ===================== */
function buildMotes(){
  var rnd = mulberry32(4242), i, n = narrow ? 34 : 58;
  motes = [];
  for(i=0;i<n;i++){
    motes.push({
      x: rnd(), y: rnd(), r: 0.5 + rnd()*1.8,
      sp: 0.01 + rnd()*0.05, ph: rnd()*TAU, a: 0.05 + rnd()*0.22
    });
  }
}
function buildPines(){
  var rnd = mulberry32(9001), i, n = narrow ? 6 : 10;
  pines = [];
  for(i=0;i<n;i++){
    var x = i < n*0.45 ? rnd()*0.34 : 0.58 + rnd()*0.46;
    pines.push({
      x: x, h: 0.20 + rnd()*0.20, w: 0.075 + rnd()*0.055,
      ph: rnd()*TAU, a: 0.82 + rnd()*0.18
    });
  }
}
function pine(g, cx, baseY, h, w, alpha, sway){
  g.save();
  g.translate(cx, baseY);
  g.rotate(sway);
  g.globalAlpha = alpha;
  g.fillStyle = "#050a13";
  for(var i=0;i<5;i++){
    var t = i/5;
    var yy = -h*(0.30 + t*0.62);
    var ww = w*(1 - t*0.70);
    g.beginPath();
    g.moveTo(0, yy - h*0.30*(1 - t*0.35));
    g.lineTo(ww/2, yy + h*0.03);
    g.lineTo(-ww/2, yy + h*0.03);
    g.closePath();
    g.fill();
  }
  g.fillRect(-w*0.016, -h*0.34, w*0.032, h*0.34);
  g.globalAlpha = 1;
  g.restore();
}

/* ===================== torn paper helpers ===================== */
function raggedLine(g, s){
  var y0 = 0.94*s, x0 = -1.85*s, x1 = 1.85*s, n = 13, i;
  g.beginPath();
  g.moveTo(x0, y0);
  for(i=1;i<=n;i++){
    var x = x0 + (x1-x0)*(i/n);
    var j = ((i*37) % 13)/13 - 0.5;
    g.lineTo(x, y0 + j*0.125*s);
  }
}
function raggedRegion(g, s){
  raggedLine(g, s);
  g.lineTo(1.85*s, 2.40*s);
  g.lineTo(-1.85*s, 2.40*s);
  g.closePath();
}

  g.strokeStyle = rim; g.lineWidth = 1.55;

}

    g.beginPath(); g.arc(xx*W, yy*H*0.86, m.r, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;

  g.save();
  g.globalCompositeOperation = "screen";
  g.translate(W*0.52, H*0.06);
  g.rotate(-0.32);
  var lg = g.createLinearGradient(0,0,0,H*0.52);
  lg.addColorStop(0,"rgba(255,222,192,0)");
  lg.addColorStop(.45,"rgba(255,213,175," + (0.045 + beatS*0.05).toFixed(3) + ")");

  g.fillStyle = lg;
  g.fillRect(-W*0.9, Math.sin(t*0.09)*H*0.05 - H*0.10, W*1.8, H*0.54);
  g.restore();

  if(beatS > 0.012 && !S.rm){
    var bg2 = g.createRadialGradient(W*0.86, H*0.10, 0, W*0.86, H*0.10, Math.max(W,H)*0.60);
    bg2.addColorStop(0,"rgba(214,238,255," + (beatS*0.14).toFixed(3) + ")");
    bg2.addColorStop(1,"rgba(214,238,255,0)");
    g.globalCompositeOperation = "screen";
    g.fillStyle = bg2; g.fillRect(0,0,W,H);
    g.globalCompositeOperation = "source-over";
  }

  if(pulse > 0.02 && !S.rm){
    var lp = g.createRadialGradient(W*0.30, H*0.50, 0, W*0.30, H*0.50, Math.max(W,H)*0.40);
    lp.addColorStop(0,"rgba(190,220,255," + (pulse*0.05).toFixed(3) + ")");
    lp.addColorStop(1,"rgba(190,220,255,0)");
    g.globalCompositeOperation = "screen";
    g.fillStyle = lp; g.fillRect(0,0,W,H);
    g.globalCompositeOperation = "source-over";
  }

  var vg = g.createRadialGradient(W*0.52,H*0.46,Math.min(W,H)*0.22, W*0.52,H*0.46, Math.max(W,H)*0.82);
  vg.addColorStop(0,"rgba(3,7,15,0)");
  vg.addColorStop(.62,"rgba(3,7,15,.13)");
  vg.addColorStop(1,"rgba(2,5,11,.55)");
  g.fillStyle = vg; g.fillRect(0,0,W,H);

  g.globalCompositeOperation = "multiply";
  g.fillStyle = "rgba(199,217,243,.07)";
  g.fillRect(0,0,W,H);
  g.globalCompositeOperation = "source-over";
}

/* ===================== lyrics ===================== */
var rows = [], curIdx = -2, curN = -1;

function normalizeLines(raw){
  var out = [], i, k;
  for(i=0;i<raw.length;i++){
    var src = raw[i] || {};
    var text = String(src.text == null ? "" : src.text);
    if(!text.replace(/\s/g,"").length) continue;
    var arr = Array.from(text);
    var tt = Number(src.t); if(!isFinite(tt)) tt = 0;
    var dur = Number(src.dur); if(!isFinite(dur) || dur < 0) dur = 0;
    var charsIn = Array.isArray(src.chars) ? src.chars : null;
    var times = new Array(arr.length);
    var prev = tt;
    var fbd = dur > 0 ? dur : 3.2;
    for(k=0;k<arr.length;k++){
      var ct = null;
      if(charsIn && charsIn[k] && typeof charsIn[k] === "object"){
        var v = Number(charsIn[k].t);
        if(isFinite(v)) ct = v;
      }
      if(ct == null) ct = tt + fbd * (k / Math.max(1, arr.length));
      if(ct < prev) ct = prev;
      times[k] = ct; prev = ct;
    }
    out.push({ t:tt, dur:dur, text:text, arr:arr, chars:charsIn, times:times });
  }
  out.sort(function(a,b){ return a.t - b.t; });
  for(i=0;i<out.length;i++){
    var nxt = out[i+1];
    out[i]._end = out[i].dur > 0 ? out[i].t + out[i].dur : (nxt ? nxt.t : out[i].t + 3.2);
  }
  return out;
}

function buildLyrics(){
  stackEl.innerHTML = "";
  rows = [];
  curIdx = -2; curN = -1;
  if(!S.lines.length){ lyrEl.classList.remove("show"); return; }
  for(var i=0;i<S.lines.length;i++){
    var ln = S.lines[i];
    var row = document.createElement("div");
    row.className = "lrow";
    var ul = document.createElement("span");
    ul.className = "ul";
    var tx = document.createElement("span");
    tx.className = "ltext";
    var chs = [];
    for(var k=0;k<ln.arr.length;k++){
      var ch = document.createElement("span");
      ch.className = "ch";
      ch.textContent = ln.arr[k];
      tx.appendChild(ch);
      chs.push(ch);
    }
    row.appendChild(ul);
    row.appendChild(tx);
    row._chs = chs;
    stackEl.appendChild(row);
    rows.push(row);
  }
  lyrEl.classList.add("show");
  measure(true);
}

function measure(snap){
  if(!rows.length) return;
  centers = rows.map(function(r){ return r.offsetTop + r.offsetHeight/2; });
  targetY = H * (narrow ? 0.595 : 0.515);
  var i = S.idx >= 0 ? S.idx : 0;
  stackTarget = targetY - (centers[i] || 0);
  if(snap){ stackY = stackTarget; }
  applyStack();
}
function applyStack(){
  if(!rows.length) return;
  stackEl.style.transform = "translate3d(0," + stackY.toFixed(2) + "px,0)";
}
function markRow(row, n){
  var chs = row._chs || [];
  for(var i=0;i<chs.length;i++){
    var on = i < n;
    if(chs[i]._on !== on){ chs[i]._on = on; chs[i].classList.toggle("on", on); }
  }
}
function revealedCount(ln, t){
  var n = 0, a = ln.times;
  for(var i=0;i<a.length;i++){ if(a[i] <= t + 0.0005) n++; }
  return n;
}
function indexAt(t){
  var lo = 0, hi = S.lines.length - 1, res = -1;
  while(lo <= hi){
    var mid = (lo + hi) >> 1;
    if(S.lines[mid].t <= t + 0.0005){ res = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return res;
}
function syncLyrics(){
  var i, d, cls;
  if(S.idx !== curIdx){
    curIdx = S.idx;
    for(i=0;i<rows.length;i++){
      d = i - curIdx;
      cls = "lrow";
      if(d === 0) cls += " cur";
      else if(d === -1) cls += " prev";
      else if(d === 1) cls += " next";
      else if(Math.abs(d) === 2) cls += " far2";
      else cls += " gone";
      rows[i].className = cls;
      if(d < 0) markRow(rows[i], 1e9);
      else if(d > 0) markRow(rows[i], 0);
    }
    curN = -1;
    if(curIdx >= 0 && rows[curIdx]){
      S.text = S.lines[curIdx].text;
      stackTarget = targetY - (centers[curIdx] || 0);
      pulse = 1;
    } else {
      S.text = "";
      stackTarget = targetY - (centers[0] || 0);
    }
  }
  if(curIdx >= 0 && rows[curIdx]){
    var ln = S.lines[curIdx];
    var n = revealedCount(ln, S.t);
    if(n !== curN){ curN = n; markRow(rows[curIdx], n); }
    var ul = rows[curIdx].firstChild;
    if(ul){
      var f = ln.arr.length ? n / ln.arr.length : 1;
      ul.style.transform = "scaleX(" + clamp(f,0,1).toFixed(4) + ")";
    }
  }
}

/* ===================== chrome ===================== */
function fmt(s){ s = Math.max(0, Math.floor(s)); return pad2(s/60) + ":" + pad2(s % 60); }
function updateTc(){
  tcEl.textContent = fmt(S.t) + " / " + (S.duration > 0 ? fmt(S.duration) : "--:--");
}
function applyAccent(c){
  if(typeof c === "string" && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(c.trim())){
    document.documentElement.style.setProperty("--acc", c.trim());
  }
}
function loadCover(url){
  chipEl.classList.remove("on");
  if(typeof url !== "string" || !url){ coverEl.removeAttribute("src"); return; }
  coverEl.onload = function(){ chipEl.classList.add("on"); };
  coverEl.onerror = function(){ chipEl.classList.remove("on"); };
  coverEl.src = url;
}
function makeGrain(){
  var c = document.createElement("canvas"), s = 200;
  c.width = s; c.height = s;
  var g = c.getContext("2d");
  var img = g.createImageData(s, s), d = img.data, i;
  for(i=0;i<d.length;i+=4){
    var v = 92 + Math.random()*126;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 40 + Math.random()*86;
  }
  g.putImageData(img,0,0);
  grainEl.style.backgroundImage = "url(" + c.toDataURL("image/png") + ")";
}
var gx = 0, gy = 0;
function updateGrainPos(now){
  if(S.rm){ grainEl.style.transform = "none"; return; }
  gx = (gx + 37) % 199;
  gy = (gy + 53) % 197;
  grainEl.style.transform = "translate3d(" + (-gx) + "px," + (-gy) + "px,0)";
}

/* ===================== messaging ===================== */
var initSeen = false, readySent = false;
function postReady(){
  if(readySent) return;
  readySent = true;
  try { window.parent.postMessage({ __c100:1, type:"ready" }, "*"); } catch(e){}
}
function onInit(m){
  initSeen = true;
  demoOn = false;
  S.song = (m && m.song) || null;
  var d = Number(m && m.duration);
  S.duration = isFinite(d) ? d : 0;
  S.lines = normalizeLines(Array.isArray(m && m.lines) ? m.lines : []);
  S.idx = -1; S.text = "";
  buildLyrics();
  if(S.song){
    try{ if(S.song && S.song.accent) applyAccent(S.song.accent); }catch(e){}
    try{ if(S.song && S.song.cover) loadCover(S.song.cover); }catch(e){}
  }
  updateTc();
}
function onTick(m){
  var t = Number(m && m.time);
  if(isFinite(t)) S.t = Math.max(0, t);
  S.playing = !!(m && m.playing);
}
function onBeat(m){
  var l = Number(m && m.level);
  if(isFinite(l)) beatTarget = Math.max(beatTarget, clamp(l, 0, 1));
}
function onLive(m){
  var b = Number(m && m.bass), h = Number(m && m.treble);
  if(isFinite(b)) bassTarget = Math.max(bassTarget, clamp(b, 0, 1));
  if(isFinite(h)) trebTarget = Math.max(trebTarget, clamp(h, 0, 1));
}
window.addEventListener("message", function(ev){
  var d = ev && ev.data;
  if(!d || typeof d !== "object") return;
  if(d.__c100 !== 1 && d.__c100 !== "1") return;
  try {
    if(d.type === "init") onInit(d);
    else if(d.type === "tick") onTick(d);
    else if(d.type === "beat") onBeat(d);
    else if(d.type === "live") onLive(d);
  } catch(err){ if(!S.err) S.err = String((err && err.message) || err); }
});

/* ===================== local demo ===================== */
var demoOn = false, demoT0 = 0;
var DEMO = [
  {t:0.9,  d:4.4, text:"你把耳机按进夜里"},
  {t:5.7,  d:4.4, text:"整座山开始退潮"},
  {t:10.5, d:4.4, text:"我把脸埋进袖口"},
  {t:15.3, d:4.6, text:"光从指缝漏下来"},
  {t:20.3, d:4.4, text:"蓝得没有尽头"},
  {t:25.1, d:4.6, text:"谁在很远的地方叫我"},
  {t:30.1, d:4.4, text:"我假装听不见"},
  {t:34.9, d:4.6, text:"风把星星吹成粉"},
  {t:39.9, d:5.0, text:"我们就这样漂着"},
  {t:45.3, d:6.0, text:"漂到不必解释的地方"}
];
function demoStart(offset){
  demoOn = true;
  S.duration = 62;
  var raw = DEMO.map(function(l){
    var arr = Array.from(l.text);
    var chars = arr.map(function(_, i){
      return { t: +(l.t + l.d*0.05 + l.d*0.85*(i/Math.max(1, arr.length-1))).toFixed(3) };
    });
    return { t:l.t, dur:l.d, text:l.text, chars:chars };
  });
  S.lines = normalizeLines(raw);
  S.idx = -1; S.text = "";
  buildLyrics();
  S.song = { accent: "#9fc4ff", cover: "" };
  applyAccent("#9fc4ff");
  var off = isFinite(offset) ? Math.max(0, offset) : 0;
  demoT0 = performance.now() - off*1000;
  S.t = off;
  S.playing = true;
  lyrEl.classList.add("show");
  updateTc();
}
function demoTick(){
  if(!demoOn || !S.playing) return;
  S.t = (performance.now() - demoT0) / 1000;
  if(S.duration > 0 && S.t > S.duration + 1.2){
    demoT0 = performance.now();
    S.t = 0;
  }
  var bt = S.t % 1.15;
  if(bt < 0.09) beatTarget = 0.72;
  if(bt > 0.45 && bt < 0.53) beatTarget = 0.38;
}

/* ===================== loop ===================== */
var last = 0, lastTc = 0, lastGrain = 0;

function step(now){
  if(!last) last = now;
  var dt = clamp((now - last)/1000, 0.0005, 0.06);
  last = now;

  animT += dt * (S.playing ? 1 : 0) * (S.rm ? 0.32 : 1);

  var dec = Math.pow(0.35, dt);
  beatTarget *= dec; bassTarget *= dec; trebTarget *= dec;
  var k = 1 - Math.pow(0.0015, dt);
  beatS += (beatTarget - beatS) * k;
  bassS += (bassTarget - bassS) * k;
  trebS += (trebTarget - trebS) * k;
  pulse *= Math.pow(0.02, dt);

  if(demoOn) demoTick();

  S.idx = indexAt(S.t);
  syncLyrics();

  if(rows.length){
    var kk = S.rm ? 1 : (1 - Math.pow(0.0000002, dt));
    var diff = stackTarget - stackY;
    if(Math.abs(diff) < 0.22) stackY = stackTarget;
    else stackY += diff * kk;
    applyStack();
  }

  drawFrame();
  S.frames++;
  S.js++;

  var sx = S.rm ? 0 : Math.sin(animT*0.09)*6;
  var sy = S.rm ? 0 : Math.cos(animT*0.07)*4;
  var sc = 1.045 + (S.rm ? 0 : beatS*0.006);
  skyEl.style.transform = "translate3d(" + sx.toFixed(2) + "px," + sy.toFixed(2) + "px,0) scale(" + sc.toFixed(4) + ")";
  skyEl.style.filter = "brightness(" + (0.95 + beatS*0.13 + pulse*0.04).toFixed(3) +
                        ") saturate(" + (1.02 + trebS*0.12).toFixed(3) + ")";

  haloEl.style.opacity = (0.76 + beatS*0.22).toFixed(3);
  haloEl.style.transform = "scale(" + (1 + beatS*0.022).toFixed(3) + ")";

  if(now - lastTc > 120){ lastTc = now; updateTc(); }
  if(now - lastGrain > 88){ lastGrain = now; updateGrainPos(now); }
}

var errLock = false;
function loop(now){
  window.requestAnimationFrame(loop);
  try { step(now); }
  catch(e){
    if(!errLock){
      errLock = true;
      S.err = String((e && e.message) || e);
    }
  }
}

/* ===================== boot ===================== */
function boot(){
  resize();
  makeGrain();
  updateTc();

  try {
    var q = new URLSearchParams(window.location.search);
    var startT = parseFloat(q.get("t"));
    if(q.get("demo")){
      demoStart(isFinite(startT) ? startT : 0);
      if(q.get("paused")) S.playing = false;
    } else {
      window.setTimeout(function(){
        if(initSeen || demoOn) return;
        demoStart(0);
      }, 820);
    }
  } catch(e){}

  window.requestAnimationFrame(loop);
  window.requestAnimationFrame(function(){ postReady(); });

  var rzT = 0;
  window.addEventListener("resize", function(){
    clearTimeout(rzT);
    rzT = setTimeout(resize, 130);
  });
  window.addEventListener("orientationchange", function(){
    clearTimeout(rzT);
    rzT = setTimeout(resize, 220);
  });

  try {
    var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    var onMq = function(e){
      S.rm = !!e.matches;
      if(S.rm) grainEl.style.transform = "none";
    };
    if(mq.addEventListener) mq.addEventListener("change", onMq);
    else if(mq.addListener) mq.addListener(onMq);
  } catch(e){}

  document.addEventListener("visibilitychange", function(){
    last = performance.now();
  });
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
})();
</script>
</body>
