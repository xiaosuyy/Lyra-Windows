<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字怀漫灌</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
       background:radial-gradient(132% 108% at 50% 48%,transparent 38%,rgba(2,4,8,.50) 74%,rgba(1,2,5,.92))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(150,205,220,.32);letter-spacing:.10em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/*! title: 字怀漫灌
    ----------------------------------------------------------------------------
    机制一句话：字被当成**盛墨的容器** —— 只在"字怀"（闭口负形）里灌墨：
    从画布边界 flood-fill 标记出"字外"，剩下的非墨像素就是字怀，逐个连通域标号、
    每个字怀烘成一张自己的遮罩画布；液面是一根**水平线**，从字脚涨到字顶，
    每个字怀按自己被这根线切到的高度算出填充比（大怀涨得慢、小怀先满）。

    与已有形态的边界：200 是距离场的等高线（线在字外一圈圈退）；203 是网点面积率；
    209 是拓包逐点拍墨；这里是**字的负形**被当成容器灌满 —— 换一句，灌的位置全变。

    做精的地方：
      ① 字怀是 flood-fill + 连通域算出来的，不是猜的；细缝（>=26 device px）也算一个；
      ② 灌的是"形"不是矩形：每怀一张遮罩，液面用 drawImage 取遮罩的下半截裁剪；
      ③ 弯月面：液面处 2px 的近白亮边也从遮罩里切出来，随形走；
      ④ 液面的水平延长线穿过字外，把"这只墨盘"交代出来；底部读 COUNTERS / AREA / LEVEL；
      ⑤ 无歌词：一个方框（口字的怀）在自己的液面上呼吸。
    ========================================================================== */

/* ============================================================================
   A 组公共骨架（构建期拼进每个形态的 <script> 里，不是外部依赖）
   ----------------------------------------------------------------------------
   机制文件需要实现（可选，缺省是空实现）：
     mechInit()                 脚本加载后一次
     mechResize()               resize 之后（W/H/DPR/SS 已更新）
     mechBuild(i) -> kit        换句预烘；返回该句要用的数据（可以在 i<0 时返回 null）
     mechCommit(kit)            切到这一句
     mechSeek()                 拖进度条：清状态
     mechUpdate(dt, T)          每帧物理（暂停时 dt = 0）
     mechDraw(T)                每帧绘制（背景已画好）
     mechEmpty(T)               无歌词 / 还没到第一句时的纯音频视觉
     mechChrome(T)              叠加本形态自己的文字（在通用角标之前画）
     mechStats()                额外塞进 window.__stage() 的字段
   机制文件还可以定义：
     const META = { label, sub, right, footer, cross, grid, song, ticks }
   ----------------------------------------------------------------------------
   骨架保证的四条纪律（每个形态都免费拿到，机制不用自己写）：
     · 空歌词   init 里 lines=[] → cur 永远是 null → 只走 mechEmpty()，不崩不空白
     · resize   W/H/DPR/SS 更新后重烘当前句；重建失败保留旧图，不黑屏
     · 减少动态 matchMedia 实时监听（不是启动时读一次），机制里读 RM 即得当前值
     · 暂停冻结 t 不再前进 → dt=0，mechUpdate 不再积分；画面逐字节不变
   另有 ERR 捕获：机制里任何一处抛异常，__stage().err 会变成非空（验收会红），
   而不是静默黑屏。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');

/* 机制没实现的钩子就用这些空实现（同名 function 声明后面会覆盖掉它们） */
function mechInit() { }
function mechResize() { }
function mechBuild() { return null; }
function mechCommit() { }
function mechSeek() { }
function mechUpdate() { }
function mechDraw() { }
function mechEmpty() { }
let META = { label: '', sub: '', right: '', footer: '', grid: 0, grain: 0, cross: true };

let W = 1, H = 1, MN = 1, DPR = 1, SS = 1;

/* 减少动态：实时监听（用户中途改系统设置 / 验收脚本 setEmulatedMedia 都能收到），
   不是启动时读一次 —— 机制代码里读 RM 拿到的永远是当前值。 */
const rmq = matchMedia('(prefers-reduced-motion: reduce)');
let RM = rmq.matches;
try {
  rmq.addEventListener('change', (e) => { RM = !!e.matches; });
} catch (_) {
  try { rmq.addListener((e) => { RM = !!e.matches; }); } catch (__) {}
}

/* 机制抛错不要静默：记在 ERR 里，__stage().err 非空 = 这个形态坏了 */
let ERR = '';
function fail(where, e) {
  const m = (e && e.message ? e.message : String(e || 'unknown')).slice(0, 120);
  if (!ERR) ERR = where + ': ' + m;
  try { parent.postMessage({ __c100: 1, type: 'error', payload: { message: ERR } }, '*'); } catch (_) {}
}
function guard(where, fn, fallback) {
  try { return fn(); } catch (e) { fail(where, e); return fallback; }
}

/* 主色：只允许"主色 + 近白"两种强调色，饱和度压下来（不要彩虹） */
let ACC = [140, 208, 222];
function setAccent(a) {
  if (Array.isArray(a) && a.length >= 3) {
    const r = Math.max(0, Math.min(255, a[0] | 0));
    const g = Math.max(0, Math.min(255, a[1] | 0));
    const b = Math.max(0, Math.min(255, a[2] | 0));
    const mx = Math.max(r, g, b) || 1;
    const k = 0.66 / mx;
    ACC = [
      Math.round(r * k + 158 * (1 - k)),
      Math.round(g * k + 198 * (1 - k)),
      Math.round(b * k + 212 * (1 - k))
    ];
  }
}
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const mixc = (a, b, t) => [
  Math.round(a[0] + (b[0] - a[0]) * t),
  Math.round(a[1] + (b[1] - a[1]) * t),
  Math.round(a[2] + (b[2] - a[2]) * t)
];
const FONT = (w, s) => w + ' ' + s + 'px "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';

/* ---------------------------- 画布 / 底色 ---------------------------- */
let bgGrad = null, glowGrad = null, grainPat = null;
function bakeGrain() {
  const n = 128;
  const c = document.createElement('canvas');
  c.width = n; c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  const d = img.data;
  for (let i = 0; i < n * n; i++) {
    const v = 128 + (Math.random() - 0.5) * 96;
    d[i * 4] = v; d[i * 4 + 1] = v; d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return ctx.createPattern(c, 'repeat');
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  MN = Math.min(W, H);
  SS = Math.max(1, Math.min(2, DPR));
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#05080d');
  bgGrad.addColorStop(0.5, '#04060a');
  bgGrad.addColorStop(1, '#020406');
  glowGrad = ctx.createRadialGradient(W * 0.5, H * 0.48, 0, W * 0.5, H * 0.48, MN * 0.92);
  glowGrad.addColorStop(0, rgba(ACC, 0.055));
  glowGrad.addColorStop(0.55, rgba(ACC, 0.014));
  glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  if (!grainPat) grainPat = bakeGrain();
  guard('resize', mechResize);
}

/* 网格 / 颗粒：形态可以只用其中一层 */
const GRID_STEP = 72;
function drawBackdrop(T) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad || '#04060a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = glowGrad || 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, W, H);
  if (META.grid) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += GRID_STEP) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += GRID_STEP) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.strokeStyle = rgba(ACC, META.grid);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  if (META.grain && grainPat) {
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = META.grain;
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------- 字形工具 ---------------------------- */
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

function wrapRows(text, maxChars) {
  const chars = Array.from(text || '');
  if (chars.length <= maxChars) return [text || ''];
  const R = Math.ceil(chars.length / maxChars);
  const per = Math.ceil(chars.length / R);
  const out = [];
  for (let i = 0; i < chars.length; i += per) out.push(chars.slice(i, i + per).join(''));
  return out;
}
function measureRows(rows, fs, weight) {
  octx.font = FONT(weight || 800, fs);
  let w = 0;
  for (let i = 0; i < rows.length; i++) {
    const m = octx.measureText(rows[i]).width;
    if (m > w) w = m;
  }
  return w;
}
function fitFont(rows, maxW, maxFs, weight) {
  let fs = maxFs;
  const w = measureRows(rows, fs, weight);
  if (w > maxW) fs = Math.max(18, fs * (maxW / w));
  return fs;
}
/* 把字画成一张白色遮罩（device px = CSS × SS） */
function maskCanvas(rows, fs, lh, cw, chh, weight, align) {
  const m = document.createElement('canvas');
  m.width = Math.max(2, Math.ceil(cw * SS));
  m.height = Math.max(2, Math.ceil(chh * SS));
  const g = m.getContext('2d', { willReadFrequently: true });
  g.setTransform(SS, 0, 0, SS, 0, 0);
  g.font = FONT(weight || 800, fs);
  g.textAlign = align || 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  const ax = align === 'left' ? 0 : cw / 2;
  for (let r = 0; r < rows.length; r++) g.fillText(rows[r], ax, (r + 0.5) * lh);
  return m;
}
function tintMask(mcv, col) {
  const c = document.createElement('canvas');
  c.width = mcv.width; c.height = mcv.height;
  const g = c.getContext('2d');
  g.drawImage(mcv, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = col;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
/* 渐变实心字：上白下淡主色 */
function bakeCore(mcv, top, bottom) {
  const c = document.createElement('canvas');
  c.width = mcv.width; c.height = mcv.height;
  const g = c.getContext('2d');
  g.drawImage(mcv, 0, 0);
  g.globalCompositeOperation = 'source-in';
  const grd = g.createLinearGradient(0, 0, 0, c.height);
  grd.addColorStop(0, top || '#ffffff');
  grd.addColorStop(0.45, '#f4fbff');
  grd.addColorStop(0.84, '#dceef6');
  grd.addColorStop(1, bottom || rgba([Math.min(255, ACC[0] + 90), Math.min(255, ACC[1] + 40), Math.min(255, ACC[2] + 26)], 1));
  g.fillStyle = grd;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
function bakeHalo(mcv, blurPx, scale) {
  const sc = scale || 0.5;
  const t = document.createElement('canvas');
  t.width = Math.max(2, Math.round(mcv.width * sc));
  t.height = Math.max(2, Math.round(mcv.height * sc));
  const g = t.getContext('2d');
  g.filter = 'blur(' + (blurPx || 5) + 'px)';
  g.drawImage(mcv, 0, 0, t.width, t.height);
  g.filter = 'none';
  return t;
}

/* 两遍 chamfer 距离变换（4 邻 + 对角，权重 1 / √2） */
function edt(gw, gh, target, d) {
  const INF = 1e8, A = 1, B = Math.SQRT2;
  for (let j = 0; j < gh; j++) {
    const row = j * gw;
    for (let i = 0; i < gw; i++) d[row + i] = target[row + i] ? 0 : INF;
  }
  for (let j = 0; j < gh; j++) {
    const row = j * gw;
    for (let i = 0; i < gw; i++) {
      const k = row + i;
      let v = d[k];
      if (i > 0) { const t = d[k - 1] + A; if (t < v) v = t; }
      if (j > 0) {
        let t = d[k - gw] + A; if (t < v) v = t;
        if (i > 0) { t = d[k - gw - 1] + B; if (t < v) v = t; }
        if (i < gw - 1) { t = d[k - gw + 1] + B; if (t < v) v = t; }
      }
      d[k] = v;
    }
  }
  for (let j = gh - 1; j >= 0; j--) {
    const row = j * gw;
    for (let i = gw - 1; i >= 0; i--) {
      const k = row + i;
      let v = d[k];
      if (i < gw - 1) { const t = d[k + 1] + A; if (t < v) v = t; }
      if (j < gh - 1) {
        let t = d[k + gw] + A; if (t < v) v = t;
        if (i < gw - 1) { t = d[k + gw + 1] + B; if (t < v) v = t; }
        if (i > 0) { t = d[k + gw - 1] + B; if (t < v) v = t; }
      }
      d[k] = v;
    }
  }
}
function blurField(src, gw, gh, passes) {
  let a = src, b = new Float32Array(src.length);
  for (let p = 0; p < passes; p++) {
    for (let j = 0; j < gh; j++) {
      const row = j * gw;
      const up = j > 0 ? row - gw : row;
      const dn = j < gh - 1 ? row + gw : row;
      for (let i = 0; i < gw; i++) {
        const l = i > 0 ? i - 1 : i, r = i < gw - 1 ? i + 1 : i;
        b[row + i] = (a[up + l] + a[up + i] + a[up + r] +
                      a[row + l] + a[row + i] + a[row + r] +
                      a[dn + l] + a[dn + i] + a[dn + r]) / 9;
      }
    }
    const t = a; a = b; b = t;
  }
  return a;
}

/* Marching squares：抽等值线段（塞进 out，不做连线） */
const MS_TABLE = {
  1: [3, 0], 2: [0, 1], 3: [3, 1], 4: [1, 2], 5: [3, 0, 1, 2], 6: [0, 2],
  7: [3, 2], 8: [2, 3], 9: [0, 2], 10: [0, 1, 2, 3], 11: [1, 2],
  12: [1, 3], 13: [0, 1], 14: [3, 0], 15: []
};
function isoLines(sd, gw, gh, level, out) {
  for (let j = 0; j < gh - 1; j++) {
    const r0 = j * gw, r1 = r0 + gw;
    for (let i = 0; i < gw - 1; i++) {
      const a = sd[r0 + i], b = sd[r0 + i + 1], c = sd[r1 + i + 1], d = sd[r1 + i];
      let idx = 0;
      if (a > level) idx |= 1;
      if (b > level) idx |= 2;
      if (c > level) idx |= 4;
      if (d > level) idx |= 8;
      if (idx === 0 || idx === 15) continue;
      const t1 = (level - a) / (b - a), t2 = (level - b) / (c - b);
      const t3 = (level - c) / (d - c), t4 = (level - d) / (a - d);
      const P = [i + t1, j, i + 1, j + t2, i + t3, j + 1, i, j + t4];
      const e = MS_TABLE[idx];
      for (let q = 0; q < e.length; q += 2) {
        out.push(P[e[q] * 2], P[e[q] * 2 + 1], P[e[q + 1] * 2], P[e[q + 1] * 2 + 1]);
      }
    }
  }
}

/* ---------------------------- 歌词时序 ---------------------------- */
let lines = [];
let cur = null, curIdx = -1, brewIdx = -1, prep = null, lastT = -1;
let lineAt = 0, kick = 0, lastBuild = 0;
let clockT = 0, clockAt = 0, playing = false, lastTickAt = 0;
let frames = 0, ready = false, T = 0;
let songTitle = '', songArtist = '';

const nowT = () => clockT + ((playing && performance.now() - lastTickAt < 1000) ? (performance.now() - clockAt) / 1000 : 0);
const isLive = () => playing && (performance.now() - lastTickAt < 1000);

/* 每个字的起唱时刻：chars 逐字可信才用 YRC，否则按句长均分 */
function onsetOf(line, k, n) {
  const ch = line && line.chars;
  if (ch && ch.length === n && ch[k] && typeof ch[k].t === 'number') return ch[k].t;
  const dur = (line && line.dur) || 4;
  return ((line && line.t) || 0) + (k / Math.max(1, n)) * dur * 0.85;
}

function timing(t) {
  if (!lines.length) {
    if (cur) { cur = null; curIdx = -1; mechSeek(); }
    return;
  }
  const jump = (t < lastT - 0.6) || (t > lastT + 2.0);
  if (jump) {
    cur = null; curIdx = -1; brewIdx = -1; prep = null; kick = 0;
    mechSeek();
    hint.style.opacity = '1';
    hint.textContent = '等待第一句…';
  }
  lastT = t;
  let ci = curIdx;
  while (ci + 1 < lines.length && t >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    const t0 = performance.now();
    const kit = (prep && prep.i === ci) ? prep.kit : guard('build', () => mechBuild(ci), null);
    lastBuild = performance.now() - t0;
    prep = null;
    if (ci >= 0) {
      cur = kit;
      lineAt = t;
      kick = Math.max(kick, 0.4);
      hint.style.opacity = '0';
      guard('commit', () => mechCommit(kit));
    } else {
      cur = null;
    }
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(1.2, Math.max(0.35, gap * 0.45));
    if (t >= lines[nx].t - lead) { brewIdx = nx; prep = { i: nx, kit: guard('prep', () => mechBuild(nx), null) }; }
  }
}

/* ---------------------------- 交互 ---------------------------- */
let ptrX = -999, ptrY = -999, ptrIn = false, ptrDown = false;
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', (e) => { ptrX = e.clientX; ptrY = e.clientY; ptrIn = true; ping(); }, { passive: true });
addEventListener('pointerleave', () => { ptrIn = false; }, { passive: true });
addEventListener('pointerdown', (e) => { ptrDown = true; if (typeof mechDown === 'function') mechDown(e.clientX, e.clientY); }, { passive: true });
addEventListener('pointerup', () => { ptrDown = false; }, { passive: true });
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

/* ---------------------------- 通用角标 ---------------------------- */
function drawFurniture() {
  const m = 26, L = 13;
  const c = rgba(ACC, 0.34);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = c;
  ctx.strokeStyle = c;
  ctx.lineWidth = 1;
  ctx.font = '500 10px ui-monospace,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  if (META.ticks !== false) {
  ctx.beginPath();
  ctx.moveTo(m, m + L); ctx.lineTo(m, m); ctx.lineTo(m + L, m);
  ctx.moveTo(W - m - L, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + L);
  ctx.moveTo(W - m, H - m - L); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m - L, H - m);
  ctx.moveTo(m + L, H - m); ctx.lineTo(m, H - m); ctx.lineTo(m, H - m - L);
  ctx.stroke();
  }

  ctx.fillStyle = rgba(ACC, 0.30);
  ctx.fillText(META.label || '', m + 20, m + 9);
  ctx.font = '500 8.5px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.17);
  if (META.sub) ctx.fillText(META.sub, m + 20, m + 23);
  if (META.song !== false && songTitle) {
    ctx.font = '500 9px ui-monospace,Consolas,monospace';
    ctx.fillStyle = rgba(ACC, 0.24);
    ctx.fillText(songTitle + (songArtist ? ' — ' + songArtist : ''), m + 20, m + 37);
  }
  ctx.font = '500 10px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.28);
  ctx.textAlign = 'right';
  if (META.right) ctx.fillText(META.right, W - m - 20, m + 9);
  const total = lines.length;
  const no = total && curIdx >= 0 ? String(curIdx + 1).padStart(2, '0') : '--';
  ctx.fillText(no + ' / ' + String(total || 0).padStart(2, '0'), W - m - 20, H - m - 12);
  ctx.textAlign = 'left';
  ctx.fillText(META.footer || '', m + 20, H - m - 12);

  if (META.cross !== false && ptrIn) {
    ctx.strokeStyle = rgba(ACC, 0.16);
    ctx.beginPath();
    ctx.moveTo(ptrX, 0); ctx.lineTo(ptrX, H);
    ctx.moveTo(0, ptrY); ctx.lineTo(W, ptrY);
    ctx.stroke();
    ctx.strokeStyle = rgba(ACC, 0.44);
    ctx.beginPath();
    ctx.arc(ptrX, ptrY, 4.5, 0, Math.PI * 2);
    ctx.moveTo(ptrX - 10, ptrY); ctx.lineTo(ptrX - 7, ptrY);
    ctx.moveTo(ptrX + 7, ptrY); ctx.lineTo(ptrX + 10, ptrY);
    ctx.moveTo(ptrX, ptrY - 10); ctx.lineTo(ptrX, ptrY - 7);
    ctx.moveTo(ptrX, ptrY + 7); ctx.lineTo(ptrX, ptrY + 10);
    ctx.stroke();
  }
}

/* ---------------------------- 主循环 ---------------------------- */
let raf = 0, prevMs = 0, jsMs = 0;
function frame(ms) {
  const jsT0 = performance.now();
  const dt = prevMs ? Math.min(0.05, (ms - prevMs) / 1000) : 0.016;
  prevMs = ms;
  T = nowT();
  timing(T);
  const live = isLive();
  kick *= Math.exp(-(live ? dt : 0) * 3.4);
  /* 暂停时 dt = 0：机制里的物理不再积分，画面逐字节冻结 */
  guard('update', () => mechUpdate(live ? dt : 0, T));
  drawBackdrop(T);
  if (cur) guard('draw', () => mechDraw(T)); else guard('empty', () => mechEmpty(T));
  if (typeof mechChrome === 'function') guard('chrome', () => mechChrome(T));
  drawFurniture();
  jsMs = performance.now() - jsT0;
  frames++;
  if (!ready) {
    ready = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
  }
  raf = requestAnimationFrame(frame);
}

/* ---------------------------- 生命周期 ---------------------------- */
/* 启动放在整段脚本最后（构建器拼在所有机制代码之后）：
   机制的 let/const 必须先初始化，resize 里才敢调 mechResize */
addEventListener('pagehide', () => { cancelAnimationFrame(raf); raf = 0; });

let rzTimer = 0;
addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    resize();
    if (curIdx >= 0) {
      /* 重建失败就保留旧图（不黑屏），但 ERR 会记下来 → 验收会红 */
      const kit = guard('rebuild', () => mechBuild(curIdx), null);
      if (kit) { cur = kit; lineAt = T; guard('commit', () => mechCommit(kit)); }
    }
  }, 140);
});

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent) setAccent(p.accent);
    /* 父页给的是 song.name + artists[]，也兼容 title/artist 写法 */
    const sg = p.song || {};
    const ar = sg.artist || (Array.isArray(sg.artists) && sg.artists[0] && sg.artists[0].name) || '';
    songTitle = sg.title || sg.name || '';
    songArtist = typeof ar === 'string' ? ar : (ar.name || '');
    cur = null; curIdx = -1; brewIdx = -1; prep = null; lastT = -1;
    kick = 0;
    clockT = 0; clockAt = performance.now(); lastTickAt = 0; playing = false;
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词 · 纯音频';
    hint.style.opacity = lines.length ? '1' : '0.55';
    resize();
    guard('seek', mechSeek);
  } else if (d.type === 'tick') {
    const pl = d.payload || {};
    clockT = +pl.time || 0;
    clockAt = performance.now();
    playing = !!pl.playing;
    lastTickAt = performance.now();
  } else if (d.type === 'beat') {
    kick = Math.min(1.1, kick + 0.20 + (d.payload.level || 0) * 0.45);
  } else if (d.type === 'live') {
    if (d.payload && d.payload.playing === false) playing = false;
  }
});

try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => Object.assign({
  lines: lines.length,
  idx: curIdx,
  t: +T.toFixed(2),
  playing: isLive(),
  frames: frames,
  js: +jsMs.toFixed(2),
  hasLyric: !!cur,
  buildMs: +lastBuild.toFixed(1),
  rm: RM,
  err: ERR,
  /* 有句该唱却烘不出字 → false（验收据此判 resize 后是否还能读） */
  glyph: (lines.length === 0 || curIdx < 0) ? true : !!cur
}, typeof mechStats === 'function' ? mechStats() : {});

/*! title: 字怀漫灌
    ----------------------------------------------------------------------------
    机制一句话：字被当成**盛墨的容器** —— 只在"字怀"（闭口负形）里灌墨：
    从画布边界 flood-fill 标记出"字外"，剩下的非墨像素就是字怀，逐个连通域标号、
    每个字怀烘成一张自己的遮罩画布；液面是一根**水平线**，从字脚涨到字顶，
    每个字怀按自己被这根线切到的高度算出填充比（大怀涨得慢、小怀先满）。

    与已有形态的边界：200 是距离场的等高线（线在字外一圈圈退）；203 是网点面积率；
    209 是拓包逐点拍墨；这里是**字的负形**被当成容器灌满 —— 换一句，灌的位置全变。

    做精的地方：
      ① 字怀是 flood-fill + 连通域算出来的，不是猜的；细缝（>=26 device px）也算一个；
      ② 灌的是"形"不是矩形：每怀一张遮罩，液面用 drawImage 取遮罩的下半截裁剪；
      ③ 弯月面：液面处 2px 的近白亮边也从遮罩里切出来，随形走；
      ④ 液面的水平延长线穿过字外，把"这只墨盘"交代出来；底部读 COUNTERS / AREA / LEVEL；
      ⑤ 无歌词：一个方框（口字的怀）在自己的液面上呼吸。
    ========================================================================== */

META = {
  label: 'COUNTER FLOOD / NEGATIVE SPACE',
  sub: '字怀（闭口负形）被墨从下往上灌满',
  right: 'LEVEL',
  footer: 'INK RISES IN THE COUNTERS',
  grid: 0.012,
  grain: 0.045,
  cross: true
};

const cfClamp = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
/* 墨色：比主色更饱和更沉一档，才能在近白的字身上看得出来（每次烘都按当前主色算） */
const CF_RIM = [236, 250, 255];
/* 墨色：主色的"加饱和"版（同一支色，只是把色度推上去），
   才在近白的字身上和黑底上都看得出来 —— 不引入第三种强调色 */
function cfInk0() { return [Math.round(ACC[0] * 0.50), Math.min(255, Math.round(ACC[1] * 0.94)), Math.min(255, Math.round(ACC[2] * 1.00))]; }
function cfInk1() { return [Math.round(ACC[0] * 0.32), Math.min(255, Math.round(ACC[1] * 0.62)), Math.min(255, Math.round(ACC[2] * 0.72))]; }

let cfLevel = 0;            /* 0 = 全空，1 = 灌满 */

function cfBuild(i) {
  const line = lines[i];
  if (!line || !line.text) return null;
  const rows = wrapRows(line.text, 9);
  const fs = fitFont(rows, W * 0.78, Math.min(186, H * 0.20));
  const lh = fs * 1.14;
  const cw = Math.ceil(measureRows(rows, fs)) + Math.ceil(fs * 0.30);
  const chh = Math.ceil(rows.length * lh) + Math.ceil(fs * 0.10);
  if (cw < 8) return null;
  const mcv = maskCanvas(rows, fs, lh, cw, chh);
  const gw = mcv.width, gh = mcv.height;
  const src = mcv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, gw, gh).data;

  const ink = new Uint8Array(gw * gh);
  for (let k = 0; k < gw * gh; k++) ink[k] = src[k * 4 + 3] > 96 ? 1 : 0;

  /* ① 从边界 flood-fill 出"字外" */
  const ext = new Uint8Array(gw * gh);     /* 0 未定 / 1 字外 */
  const stack = new Int32Array(gw * gh);
  let sp = 0;
  const seed = (k) => { if (!ink[k] && !ext[k]) { ext[k] = 1; stack[sp++] = k; } };
  for (let x = 0; x < gw; x++) { seed(x); seed((gh - 1) * gw + x); }
  for (let y = 0; y < gh; y++) { seed(y * gw); seed(y * gw + gw - 1); }
  while (sp) {
    const k = stack[--sp];
    const x = k % gw, y = (k - x) / gw;
    if (x > 0) seed(k - 1);
    if (x < gw - 1) seed(k + 1);
    if (y > 0) seed(k - gw);
    if (y < gh - 1) seed(k + gw);
  }
  /* ② 没被标到的非墨像素 = 字怀，连通域标号 */
  const lab = new Int32Array(gw * gh);
  const comps = [];
  let nextLab = 0;
  for (let k = 0; k < gw * gh; k++) {
    if (ink[k] || ext[k] || lab[k]) continue;
    nextLab++;
    let n = 0, minX = gw, maxX = 0, minY = gh, maxY = 0;
    lab[k] = nextLab; stack[sp++] = k;
    while (sp) {
      const p = stack[--sp];
      const x = p % gw, y = (p - x) / gw;
      n++;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (x > 0 && !ink[p - 1] && !ext[p - 1] && !lab[p - 1]) { lab[p - 1] = nextLab; stack[sp++] = p - 1; }
      if (x < gw - 1 && !ink[p + 1] && !ext[p + 1] && !lab[p + 1]) { lab[p + 1] = nextLab; stack[sp++] = p + 1; }
      if (y > 0 && !ink[p - gw] && !ext[p - gw] && !lab[p - gw]) { lab[p - gw] = nextLab; stack[sp++] = p - gw; }
      if (y < gh - 1 && !ink[p + gw] && !ext[p + gw] && !lab[p + gw]) { lab[p + gw] = nextLab; stack[sp++] = p + gw; }
    }
    if (n >= 26) comps.push({ id: nextLab, n: n, x0: minX, y0: minY, x1: maxX + 1, y1: maxY + 1 });
  }

  /* ③ 每个字怀一张遮罩画布（device px），坐标一律留在遮罩自己的像素里 */
  const ctr = [];
  let area = 0;
  for (let q = 0; q < comps.length; q++) {
    const c = comps[q];
    const bw = c.x1 - c.x0, bh = c.y1 - c.y0;
    if (bw < 2 || bh < 2) continue;
    area += c.n;
    const mk = (col) => {
      const cn = document.createElement('canvas');
      cn.width = bw; cn.height = bh;
      const g = cn.getContext('2d');
      const id = g.createImageData(bw, bh);
      const d = id.data;
      for (let y = 0; y < bh; y++) {
        for (let x = 0; x < bw; x++) {
          if (lab[(c.y0 + y) * gw + (c.x0 + x)] !== c.id) continue;
          const o = (y * bw + x) * 4;
          d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
        }
      }
      g.putImageData(id, 0, 0);
      return cn;
    };
    /* 墨：竖向渐变，按整句的高度对齐（相邻字怀的色阶是连的） */
    const fillCv = document.createElement('canvas');
    fillCv.width = bw; fillCv.height = bh;
    const fg = fillCv.getContext('2d');
    const oy = c.y0 / SS, oh = chh;
    const grd = fg.createLinearGradient(0, -oy, 0, oh - oy);
    const i0 = cfInk0(), i1 = cfInk1();
    grd.addColorStop(0, rgba(mixc(i0, [255, 255, 255], 0.34), 1));
    grd.addColorStop(0.55, rgba(i0, 1));
    grd.addColorStop(1, rgba(i1, 1));
    fg.fillStyle = grd;
    fg.fillRect(0, 0, bw, bh);
    fg.globalCompositeOperation = 'destination-in';
    fg.drawImage(mk([255, 255, 255]), 0, 0);
    fg.globalCompositeOperation = 'source-over';
    const rim = mk(CF_RIM);
    /* 墨的湿光：字怀外面一圈被墨洇开的晕（预烘一次，不每帧建） */
    const gsc = 0.5, gb = Math.max(1.6, Math.min(5, bw * 0.12));
    const glow = document.createElement('canvas');
    glow.width = Math.max(2, Math.round(bw * gsc));
    glow.height = Math.max(2, Math.round(bh * gsc));
    const gg = glow.getContext('2d');
    gg.filter = 'blur(' + gb.toFixed(1) + 'px)';
    gg.drawImage(rim, 0, 0, glow.width, glow.height);
    gg.filter = 'none';
    gg.globalCompositeOperation = 'source-in';
    gg.fillStyle = rgba(cfInk0(), 1);
    gg.fillRect(0, 0, glow.width, glow.height);
    ctr.push({
      cv: fillCv, rim: rim, glow: glow, gpad: gb * 0.9 / gsc,
      dx: c.x0 / SS, dy: c.y0 / SS,       /* 相对整句左上角的 CSS 偏移 */
      dw: bw / SS, dh: bh / SS,
      pw: bw, ph: bh                       /* 遮罩的 device px 尺寸 */
    });
  }
  ctr.sort((a, b) => a.dy - b.dy);
  return { fs: fs, cw: cw, chh: chh, core: bakeCore(mcv), ctr: ctr, areaRate: area / (gw * gh) };
}

function mechBuild(i) { return cfBuild(i); }
function mechCommit() { cfLevel = 0; }
function mechSeek() { cfLevel = 0; }

function mechUpdate(dt, time) {
  const age = Math.max(0, time - lineAt);
  const p = cfClamp((age - 0.10) / 1.05);
  const e = 1 - Math.pow(1 - p, 3);
  const br = 0.012 * Math.sin(time * 0.8) + kick * 0.03;
  cfLevel = cfClamp(e * 0.99 + (p >= 1 ? br : 0));
}

function mechDraw(T) {
  if (!cur) return;
  const cx = W / 2, cy = H * 0.5;
  const x0 = cx - cur.cw / 2, y0 = cy - cur.chh / 2;
  const amp = RM ? 0.35 : 1;
  const lv = cfLevel;
  const surfL = cur.chh * (1 - lv);          /* 液面相对整句顶的 CSS y */
  const surf = y0 + surfL;

  /* 版心竖线 + 液面的水平延长线（这只墨盘的边） */
  ctx.strokeStyle = rgba(ACC, 0.09);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0 - 20.5, y0 - 10); ctx.lineTo(x0 - 20.5, y0 + cur.chh + 12);
  ctx.moveTo(x0 + cur.cw + 20.5, y0 - 10); ctx.lineTo(x0 + cur.cw + 20.5, y0 + cur.chh + 12);
  ctx.stroke();
  ctx.strokeStyle = rgba(ACC, 0.34);
  ctx.beginPath();
  ctx.moveTo(x0 - 40, surf + 0.5); ctx.lineTo(x0 + cur.cw + 40, surf + 0.5);
  ctx.moveTo(x0 - 40, surf - 4.5); ctx.lineTo(x0 - 40, surf + 5.5);
  ctx.moveTo(x0 + cur.cw + 40, surf - 4.5); ctx.lineTo(x0 + cur.cw + 40, surf + 5.5);
  ctx.stroke();
  /* 左侧液位标尺 0 / 50 / 100 */
  ctx.strokeStyle = rgba(ACC, 0.13);
  ctx.beginPath();
  for (let s = 0; s <= 4; s++) {
    const yy = y0 + cur.chh * (s / 4);
    ctx.moveTo(x0 - 27, yy + 0.5); ctx.lineTo(x0 - 20.5, yy + 0.5);
  }
  ctx.stroke();
  ctx.font = '500 8px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.38);
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(lv * 100) + '%', x0 - 46, surf + 3);

  /* ① 字：近白的实体，字怀是它身上的洞 */
  ctx.globalAlpha = 0.92;
  ctx.drawImage(cur.core, x0, y0, cur.cw, cur.chh);
  ctx.globalAlpha = 1;

  /* ② 字怀里的墨（外面先洇一圈湿光，让灌进去的东西看得见） */
  const ctr = cur.ctr;
  for (let q = 0; q < ctr.length; q++) {
    const c = ctr[q];
    let f = cfClamp((c.dy + c.dh - surfL) / c.dh);
    if (f <= 0.008) continue;
    const dh = c.dh * f, sh = c.ph * f;
    const gp = c.gpad;
    ctx.globalAlpha = 0.13 + 0.15 * f;
    ctx.drawImage(c.glow, x0 + c.dx - gp, y0 + c.dy - gp, c.dw + gp * 2, c.dh + gp * 2);
    ctx.globalAlpha = 1;
    ctx.drawImage(c.cv, 0, c.ph - sh, c.pw, sh,
      x0 + c.dx, y0 + c.dy + c.dh - dh, c.dw, dh);
    /* ③ 弯月面 / 满溢的顶边 */
    if (f < 0.995) {
      const rh = Math.min(2 * SS, sh);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(c.rim, 0, c.ph - sh, c.pw, rh,
        x0 + c.dx, y0 + c.dy + c.dh - dh - rh / SS * 0.5, c.dw, rh / SS);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 0.42 + 0.18 * amp;
      const rh = Math.min(1.5 * SS, c.ph);
      ctx.drawImage(c.rim, 0, 0, c.pw, rh, x0 + c.dx, y0 + c.dy, c.dw, rh / SS);
      ctx.globalAlpha = 1;
    }
  }

  /* ④ 仪表 */
  ctx.font = '500 8.5px ui-monospace,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = rgba(ACC, 0.30);
  const bx = x0 - 20, by = y0 + cur.chh + 40;
  ctx.fillText('COUNTERS ' + String(ctr.length).padStart(2, '0') +
    '   AREA ' + (cur.areaRate * 100).toFixed(1) + '%', bx, by);
  ctx.fillStyle = rgba(ACC, 0.16);
  ctx.fillText('LEVEL ' + (lv * 100).toFixed(0) + '%   SURFACE ' + Math.round(surfL) + 'px / ' + Math.round(cur.chh) + 'px', bx, by + 13);
  ctx.textAlign = 'left';
}

/* 无歌词：一个"口"的方框，墨在自己的怀面涨落 */
function mechEmpty(T) {
  const cx = W / 2, cy = H * 0.5;
  const s = Math.min(W, H) * 0.30;
  const x = cx - s / 2, y = cy - s / 2;
  const lv = 0.26 + 0.44 * (0.5 + 0.5 * Math.sin(T * 0.55));
  ctx.strokeStyle = rgba(ACC, 0.30);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.5, y + 0.5, s, s);
  const iw = s * 0.62, ih = s * 0.66;
  const ix = cx - iw / 2, iy = cy - ih / 2 + s * 0.02;
  const surf = iy + ih * (1 - lv);
  const grd = ctx.createLinearGradient(0, iy, 0, iy + ih);
  const i0 = cfInk0(), i1 = cfInk1();
  grd.addColorStop(0, rgba(mixc(i0, [255, 255, 255], 0.34), 0.95));
  grd.addColorStop(1, rgba(i1, 0.95));
  ctx.fillStyle = grd;
  ctx.fillRect(ix, surf, iw, iy + ih - surf);
  ctx.fillStyle = 'rgba(240,251,255,0.78)';
  ctx.fillRect(ix, surf, iw, 1.6);
  ctx.strokeStyle = rgba(ACC, 0.14);
  ctx.setLineDash([4, 5]);
  ctx.strokeRect(ix + 0.5, iy + 0.5, iw, ih);
  ctx.setLineDash([]);
  ctx.font = '500 9px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.34);
  ctx.textAlign = 'left';
  ctx.fillText('NO COPY · EMPTY COUNTER ' + (lv * 100).toFixed(0) + '%', cx - s * 0.5, cy + s * 0.62);
}

function mechStats() {
  return {
    counters: cur ? cur.ctr.length : 0,
    level: +cfLevel.toFixed(2),
    rmAmp: RM ? 0.35 : 1
  };
}


/* ---- 启动（必须在所有机制代码之后） ---- */
mechInit();
resize();
requestAnimationFrame(frame);
</script>
