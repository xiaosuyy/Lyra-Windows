<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>皮科热带</title>
<style>
  :root{
    --ink:#170c34;
    --c-y:#ffe600; --c-p:#ff2ea6; --c-g:#c6ff2e; --c-b:#22d3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f30}
  body{font-family:"Arial Black","Impact","Microsoft YaHei","PingFang SC",system-ui,sans-serif}

  #v{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0;
     transform-origin:50% 88%;will-change:transform}

  #art{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;
       transform-origin:50% 88%;transition:transform .16s ease-out;will-change:transform}
  #art.hit{transform:scale(1.016)}

  #glare{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(125% 95% at 50% 90%, rgba(0,0,0,0) 42%, rgba(5,6,24,.55) 100%)}

  /* painted-canvas tooth: two cheap repeating gradients, no image request */
  #grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background-image:
      repeating-linear-gradient(37deg, rgba(255,255,255,.045) 0 1px, rgba(0,0,0,0) 1px 3px),
      repeating-linear-gradient(-52deg, rgba(0,0,0,.06) 0 1px, rgba(255,255,255,0) 1px 4px)}

  #fx{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}

  #lyrics{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;
    padding:0 clamp(12px,3.5vw,56px) clamp(20px,7vh,76px);pointer-events:none}

  #lyric{position:relative;max-width:min(95vw,1200px);text-align:center;font-weight:900;
    font-size:clamp(24px,7vw,110px);line-height:1.12;letter-spacing:.01em}

  .ln{display:block}

  #lyric.pre .b,#lyric.pre .h{letter-spacing:.16em;opacity:.9}
  #lyric.pad .unit .b{opacity:.62}
  #lyric.pad .unit .h{opacity:0}

  .unit{position:relative;display:inline-block;white-space:pre;
    rotate:var(--rot,0deg);translate:0 var(--dy,0);
    animation:unitIn .44s cubic-bezier(.2,1.4,.4,1) both;
    animation-delay:calc(var(--i,0) * 14ms)}
  .unit .b{position:relative;display:inline-block;color:var(--c1, #ffe600);
    -webkit-text-stroke:.018em #170c34;
    paint-order:stroke fill;
    text-shadow:.05em .075em 0 #170c34, .1em .15em 0 rgba(8,3,24,.8),
                -.01em -.02em 0 rgba(255,255,255,.22)}
  .unit .h{position:absolute;left:0;top:0;color:var(--c2, #c6ff2e);opacity:0;
    transition:opacity .09s linear;will-change:opacity;
    -webkit-text-stroke:.018em #170c34;paint-order:stroke fill;
    text-shadow:0 0 .22em currentColor, .05em .075em 0 #170c34}
  .unit.on .h{opacity:1}

  @keyframes unitIn{
    from{opacity:0;translate:0 .48em;scale:.84;rotate:3deg}
    to{opacity:1;translate:0 0;scale:1;rotate:0deg}
  }

  .pop{position:absolute;left:0;top:0;font-weight:900;font-size:clamp(18px,3vw,52px);
    color:var(--c-p);-webkit-text-stroke:.022em var(--ink);
    text-shadow:.055em .065em 0 var(--ink);
    transform:translate(-50%,-50%) rotate(var(--r,-8deg));opacity:0;
    white-space:nowrap;animation:popIn .9s ease-out forwards;will-change:transform,opacity}
  @keyframes popIn{
    0%{opacity:0;scale:.35}
    16%{opacity:1;scale:1.08}
    62%{opacity:.9;scale:1}
    100%{opacity:0;scale:1.18}
  }

  #tag{position:fixed;left:clamp(12px,2.6vw,36px);top:clamp(12px,2.6vh,30px);z-index:6;
    pointer-events:none;transform:rotate(-3deg);max-width:min(64vw,420px);display:flex;
    flex-direction:column;gap:.32em}
  #tag .t1{font-size:clamp(12px,1.45vw,21px);line-height:1.05;color:var(--c-y);
    -webkit-text-stroke:.02em var(--ink);text-shadow:.05em .06em 0 var(--ink);
    letter-spacing:.1em;text-transform:uppercase}
  #tag .t2{font-size:clamp(9px,1vw,14px);line-height:1.25;color:#d9fff4;opacity:.82;
    letter-spacing:.16em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #fb{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    padding:12vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .45s;
    color:var(--c-g);font-weight:900;font-size:clamp(20px,4.4vw,52px);line-height:1.4;
    letter-spacing:.08em;white-space:pre-line;
    -webkit-text-stroke:.018em var(--ink);text-shadow:.05em .06em 0 var(--ink)}
  #fb.on{opacity:1}

  @media (max-aspect-ratio:5/6){
    #lyrics{align-items:flex-end;padding-bottom:clamp(26px,9vh,88px)}
    #tag .t2{display:none}
    #tag{max-width:80vw}
    .unit .b{text-shadow:.05em .065em 0 #170c34,.1em .13em 0 rgba(10,4,30,.7)}
    .unit .h{text-shadow:0 0 .22em currentColor,.05em .065em 0 #170c34}
  }
</style>
</head>
<body>
<canvas id="v" aria-label="歌词舞台"></canvas>
<svg id="art" aria-hidden="true"></svg>
<div id="glare"></div>
<div id="grain"></div>
<div id="fx"></div>
<div id="lyrics"><div id="lyric"></div></div>
<div id="tag"><div class="t1">PICÓ FLUORESCENTE</div><div class="t2">CUMBIA · CARIBE</div></div>
<div id="fb"></div>
<script>
'use strict';
(function(){
  var canvas = document.getElementById('v');
  var fbEl = document.getElementById('fb');
  var ctx = canvas.getContext('2d', { alpha: false });

  var W = 1440, H = 900, DPR = 1;

  var S = {
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, err: '', text: '', gl: false, rm: false,
    beat: 0, beatIdx: -1, live: { level: 0, bass: 0, mid: 0, treble: 0 },
    accent: [57, 255, 120], title: '', artist: '', cover: null,
    dur: 0, started: 0
  };

  /* self-check hook: single top-level definition, reads live state */
  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm
    };
  };

  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[485] ready postMessage failed', e); }
  }

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  function markPhase(name){
    try { parent.postMessage({ __c100: 1, type: 'phase', name: name }, '*'); }
    catch (e) { console.error('[485] phase failed', e); }
  }

  function setEmpty(msg){
    if (fbEl){
      if (msg){ fbEl.textContent = msg; fbEl.classList.add('on'); }
      else { fbEl.textContent = ''; fbEl.classList.remove('on'); }
    }
  }

  function resize(){
    var w = Math.round(window.innerWidth || 0);
    var h = Math.round(window.innerHeight || 0);
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = w; H = h;
    var dpr = window.devicePixelRatio || 1;
    if (!isFinite(dpr) || dpr <= 0) dpr = 1;
    var budget = 3.4e6;
    while (dpr > 1 && w * h * dpr * dpr > budget) dpr -= 0.25;
    DPR = clamp(dpr, 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildPalette();
    buildBackdrop();
    buildArt();
    paintTitle();
    layoutLyric(true);
  }

  /* ---------- pigment palette ---------- */
  var BASE = {
    ink:  '#170c34',
    lime: '#c6ff2e',
    pink: '#ff2ea6',
    yel:  '#ffe600',
    cyan: '#22d3ff',
    orng: '#ff7a18',
    violet:'#7b3cff',
    cream:'#fff3d0'
  };

  function hex2rgb(h){
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mixHex(a, b, k){
    var A = hex2rgb(a), B = hex2rgb(b), o = [0, 0, 0], i;
    for (i = 0; i < 3; i++) o[i] = Math.round(A[i] + (B[i] - A[i]) * k);
    return 'rgb(' + o[0] + ',' + o[1] + ',' + o[2] + ')';
  }
  function rgba(rgb, a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }
  /* deterministic pseudo random so repaints are stable */
  var RND = { s: 20260101 };
  function rnd(){
    RND.s = (RND.s * 1664525 + 1013904223) % 4294967296;
    return RND.s / 4294967296;
  }
  function rndRange(a, b){ return a + (b - a) * rnd(); }

  var P = null;
  function buildPalette(){
    var ac = S.accent || [80, 255, 120];
    var lum = (ac[0] * 0.299 + ac[1] * 0.587 + ac[2] * 0.114) / 255;
    var acHex = '#' + [ac[0], ac[1], ac[2]].map(function(v){
      var s = clamp(Math.round(v), 0, 255).toString(16); return s.length < 2 ? '0' + s : s;
    }).join('');
    /* the picó palette stays fluorescent even when the cover is muddy */
    P = {
      key: mixHex(acHex, BASE.lime, lum > 0.62 ? 0.55 : 0.3),
      key2: '#' + [clamp(ac[0] * 0.55, 8, 255), clamp(ac[1] * 0.55, 8, 255), clamp(ac[2] * 0.55, 8, 255)]
        .map(function(v){ var s = Math.round(v).toString(16); return s.length < 2 ? '0' + s : s; }).join(''),
      hot: lum > 0.6 ? BASE.pink : BASE.yel,
      cool: lum > 0.6 ? BASE.cyan : BASE.violet
    };
    document.documentElement.style.setProperty('--c-y', P.hot);
    document.documentElement.style.setProperty('--c-p', P.hot === BASE.pink ? BASE.yel : BASE.pink);
    document.documentElement.style.setProperty('--c-g', P.key);
  }

  /* ---------- backdrop: night sky, bunting, palms ---------- */
  var bgCanvas = null;

  function penScallop(c, cx, cy, rx, ry, fill, stroke, lw){
    c.beginPath();
    c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    if (fill){ c.fillStyle = fill; c.fill(); }
    if (stroke){ c.lineWidth = lw || 3; c.strokeStyle = stroke; c.stroke(); }
  }

  function drawPalm(c, x, y, s, rot, flip, col, edge){
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.scale(flip ? -s : s, s);

    /* trunk */
    c.beginPath();
    c.moveTo(-16, 0);
    c.bezierCurveTo(-6, -110, 14, -210, 30, -300);
    c.lineTo(70, -296);
    c.bezierCurveTo(52, -206, 30, -104, 26, 0);
    c.closePath();
    c.fillStyle = col; c.fill();
    c.lineWidth = 9; c.strokeStyle = edge; c.stroke();

    /* trunk bands */
    var i;
    c.lineWidth = 5; c.strokeStyle = edge; c.globalAlpha = .55;
    for (i = 0; i < 7; i++){
      var yy = -34 - i * 38;
      c.beginPath(); c.moveTo(-4 + i * 1.6, yy); c.quadraticCurveTo(22 + i * 3, yy - 12, 46 + i * 4, yy - 4); c.stroke();
    }
    c.globalAlpha = 1;

    /* fronds */
    for (i = 0; i < 7; i++){
      var a = -Math.PI * 0.92 + (i / 6) * Math.PI * 1.62;
      c.save();
      c.translate(34, -300);
      c.rotate(a);
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(96, -46, 216, -14);
      c.quadraticCurveTo(104, 6, 0, 22);
      c.closePath();
      c.fillStyle = i % 2 ? col : mixHex(col === BASE.lime ? '#c6ff2e' : '#2fbf6a', '#0b3b2a', .25);
      c.fill();
      c.lineWidth = 7; c.strokeStyle = edge; c.stroke();
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(100, -22, 206, -12);
      c.lineWidth = 3; c.strokeStyle = edge; c.globalAlpha = .4; c.stroke(); c.globalAlpha = 1;
      c.restore();
    }
    /* coconuts */
    c.globalAlpha = 1;
    penScallop(c, 30, -286, 15, 15, BASE.orng, edge, 6);
    penScallop(c, 56, -274, 12, 12, BASE.yel, edge, 6);
    c.restore();
  }

  /* ---------- pre-rendered sun-ray rosette ---------- */
  var rayCanvas = null, rayR = 200, rayCX = 0, rayCY = 0;
  function buildRays(){
    var portrait = (W / Math.max(1, H)) <= 1.02;
    /* keep the blit small: it is drawn every frame, so cap it hard */
    var r = Math.min(Math.max(W, H) * 0.42, Math.min(W, H) * 0.95);
    if (!isFinite(r) || r < 60) r = 360;
    rayR = r;
    rayCX = W * (portrait ? 0.5 : 0.2);
    rayCY = H * (portrait ? 0.2 : 0.44);
    var px = Math.min(Math.round(r * 2), 900);
    rayCanvas = document.createElement('canvas');
    rayCanvas.width = px; rayCanvas.height = px;
    var c = rayCanvas.getContext('2d');
    if (!c) { rayCanvas = null; return; }
    c.translate(px / 2, px / 2);
    c.scale(px / (r * 2), px / (r * 2));
    var ra, a0, a1, i, n = 28;
    for (ra = 0; ra < n; ra++){
      a0 = (ra / n) * Math.PI * 2; a1 = a0 + Math.PI / n;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(Math.cos(a0) * r, Math.sin(a0) * r);
      c.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
      c.closePath();
      c.fillStyle = ra % 2 ? 'rgba(255,214,0,.20)' : 'rgba(255,46,166,.24)';
      c.fill();
    }
    /* soft hot core so the rays always read on screen */
    var core = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.5);
    core.addColorStop(0, 'rgba(198,255,46,.20)');
    core.addColorStop(.5, 'rgba(255,46,166,.07)');
    core.addColorStop(1, 'rgba(255,46,166,0)');
    c.fillStyle = core;
    c.beginPath(); c.arc(0, 0, r * 0.5, 0, Math.PI * 2); c.fill();
    /* a few concentric paint rings, hand-lettered style */
    for (i = 1; i <= 3; i++){
      c.beginPath(); c.arc(0, 0, r * (0.16 + i * 0.11), 0, Math.PI * 2);
      c.strokeStyle = i % 2 ? 'rgba(34,211,255,.20)' : 'rgba(255,230,0,.16)';
      c.lineWidth = r * 0.012; c.stroke();
    }
  }

  function buildBackdrop(){
    if (!W || !H) return;
    buildRays();
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = Math.max(1, Math.round(W * DPR));
    bgCanvas.height = Math.max(1, Math.round(H * DPR));
    var c = bgCanvas.getContext('2d');
    if (!c) return;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);

    var gy = H * 0.58;

    /* deep night wall of the sound truck */
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#100b38');
    g.addColorStop(.38, '#1a1050');
    g.addColorStop(.72, '#2a0f46');
    g.addColorStop(1, '#0d0b2b');
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    /* two big neon washes so the wall is never flat */
    var w1 = c.createRadialGradient(W * .18, H * .12, 0, W * .18, H * .12, Math.max(W, H) * .7);
    w1.addColorStop(0, 'rgba(255,46,166,.30)'); w1.addColorStop(.55, 'rgba(255,46,166,.06)'); w1.addColorStop(1, 'rgba(255,46,166,0)');
    c.fillStyle = w1; c.fillRect(0, 0, W, H);
    var w2 = c.createRadialGradient(W * .86, H * .78, 0, W * .86, H * .78, Math.max(W, H) * .62);
    w2.addColorStop(0, 'rgba(34,211,255,.26)'); w2.addColorStop(.6, 'rgba(34,211,255,.05)'); w2.addColorStop(1, 'rgba(34,211,255,0)');
    c.fillStyle = w2; c.fillRect(0, 0, W, H);

    /* baked wide ray fan behind the mascot: static, so it costs nothing */
    c.save();
    c.translate(rayCX, rayCY);
    var ra2, a02, a12, RR = Math.max(W, H) * 0.95;
    for (ra2 = 0; ra2 < 40; ra2++){
      a02 = (ra2 / 40) * Math.PI * 2; a12 = a02 + Math.PI / 40;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(Math.cos(a02) * RR, Math.sin(a02) * RR);
      c.lineTo(Math.cos(a12) * RR, Math.sin(a12) * RR);
      c.closePath();
      c.fillStyle = ra2 % 2 ? 'rgba(255,214,0,.042)' : 'rgba(255,46,166,.058)';
      c.fill();
    }
    c.restore();

    /* iron rivets of the truck body */
    c.globalAlpha = .16;
    var step = Math.max(70, Math.min(W, H) * 0.13);
    var gx, gyy;
    for (gyy = step; gyy < H; gyy += step){
      for (gx = step * .7; gx < W; gx += step){
        c.beginPath(); c.arc(gx, gyy, 2.6, 0, Math.PI * 2);
        c.fillStyle = '#8fd8ff'; c.fill();
      }
    }
    c.globalAlpha = 1;

    /* painted horizon stripe (the truck's lower panel) */
    c.beginPath();
    c.moveTo(0, gy);
    c.lineTo(W, gy - H * .02);
    c.lineTo(W, H); c.lineTo(0, H); c.closePath();
    var g2 = c.createLinearGradient(0, gy, 0, H);
    g2.addColorStop(0, 'rgba(21,9,52,.86)');
    g2.addColorStop(1, 'rgba(9,7,30,.95)');
    c.fillStyle = g2; c.fill();

    /* hand-painted scallop trim along the stripe */
    var sx = -10, sr = Math.max(16, W / 34);
    c.beginPath();
    c.moveTo(-10, gy + 4);
    var guard = 0;
    while (sx < W + sr && guard < 200){
      c.quadraticCurveTo(sx + sr * .5, gy + sr * .95, sx + sr, gy + 4);
      sx += sr; guard++;
    }
    c.lineWidth = Math.max(6, W / 190); c.strokeStyle = P.hot; c.globalAlpha = .85; c.stroke(); c.globalAlpha = 1;

    /* palms at both feet */
    var ps = Math.max(W, H) / 1500;
    drawPalm(c, -W * .02, H * 1.06, ps * 1.05, -0.13, false, BASE.lime, BASE.ink);
    drawPalm(c, W * 1.02, H * 1.08, ps * 1.12, 0.16, true, mixHex(BASE.lime, '#0f8f52', .45), BASE.ink);

    /* papel-picado pennant string */
    var cols = [P.hot, BASE.yel, P.key, BASE.cyan, P.hot === BASE.pink ? BASE.violet : BASE.pink];
    var n = clamp(Math.round(W / 120), 6, 20);
    var i, t0, t1, x0, y0, x1, y1, mx, my, sag = H * .055;
    c.lineWidth = 2.2; c.strokeStyle = 'rgba(255,243,208,.5)';
    for (i = 0; i <= n; i++){
      t0 = i / n; t1 = (i + 1) / n;
      x0 = -W * .04 + t0 * W * 1.08; x1 = -W * .04 + t1 * W * 1.08;
      y0 = H * .045 + Math.sin(t0 * Math.PI) * sag;
      y1 = H * .045 + Math.sin(t1 * Math.PI) * sag;
      if (i === 0){
        c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      } else {
        c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      }
      mx = (x0 + x1) / 2; my = (y0 + y1) / 2;
      var fw = (x1 - x0) * 0.44, fh = Math.max(24, H * .052);
      c.globalAlpha = i % 2 ? .9 : .78;
      c.beginPath();
      c.moveTo(mx - fw, my);
      c.lineTo(mx + fw, my);
      c.lineTo(mx, my + fh);
      c.closePath();
      c.fillStyle = cols[i % cols.length]; c.fill();
      c.lineWidth = 3; c.strokeStyle = 'rgba(12,6,32,.55)'; c.stroke();
      /* punched holes */
      c.globalAlpha = .5; c.fillStyle = 'rgba(12,6,32,.7)';
      c.beginPath(); c.arc(mx, my + fh * .38, Math.max(2, fh * .085), 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(mx - fw * .5, my + fh * .3, Math.max(1.6, fh * .06), 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(mx + fw * .5, my + fh * .3, Math.max(1.6, fh * .06), 0, Math.PI * 2); c.fill();
      c.globalAlpha = 1;
    }
  }

  /* ---------- SVG hand-painted mascot + fluorescent wordmark ---------- */
  var svgArt = document.getElementById('art');
  var lionG = null, dolphinG = null, sparkG = null, flashEl = null;
  var lionBase = null, dolphinBase = null, lionTilt = 0;

  function svgEl(name, attrs){
    var e = document.createElementNS('http://www.w3.org/2000/svg', name);
    if (attrs){
      for (var k in attrs){
        if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
      }
    }
    return e;
  }
  function svgText(attrs, str){
    var e = svgEl('text', attrs);
    e.textContent = str;
    return e;
  }

  function buildArt(){
    if (!svgArt || !P) return;
    while (svgArt.firstChild) svgArt.removeChild(svgArt.firstChild);
    var wide = (W / Math.max(1, H)) > 1.02;
    var VBW = wide ? 1200 : 760, VBH = wide ? 760 : 1280;
    svgArt.setAttribute('viewBox', '0 0 ' + VBW + ' ' + VBH);

  /* ---------- lyric layer ---------- */
  var FONT_STACK = '"Arial Black","Impact","Microsoft YaHei","PingFang SC",system-ui,sans-serif';
  var lyricEl = document.getElementById('lyric');
  var unitList = [];       /* {el, h, t0, on} */
  var curIdx = -2;
  var curText = '';
  var curMode = '';

  function isWordChar(ch){ return /[A-Za-z0-9'’\-]/.test(ch); }

  function tokenize(str){
    var out = [], i = 0, n = str.length, cur = '', start = 0;
    var limit = Math.min(n, 400);
    while (i < limit){
      var ch = str.charAt(i);
      if (isWordChar(ch)){
        cur = ch; start = i; i++;
        var g2 = 0;
        while (i < limit && isWordChar(str.charAt(i)) && g2 < 40){ cur += str.charAt(i); i++; g2++; }
        out.push({ s: cur, i0: start, i1: i - 1 });
      } else {
        out.push({ s: ch, i0: i, i1: i });
        i++;
      }
    }
    return out;
  }

  function fitFont(text, maxW){
    var portrait = H > W;
    var fs = Math.min(portrait ? W * 0.155 : W * 0.105, portrait ? H * 0.062 : H * 0.135, 150);
    if (!isFinite(fs) || fs <= 0) fs = 40;
    var guard = 0;
    ctx.font = '900 ' + fs + 'px ' + FONT_STACK;
    while (guard < 18 && fs > 17){
      if (ctx.measureText(text).width <= maxW * 1.85) break;
      fs *= 0.9;
      ctx.font = '900 ' + fs + 'px ' + FONT_STACK;
      guard++;
    }
    return fs;
  }

  function clearPops(){
    var fx = document.getElementById('fx');
    if (fx && fx.firstChild){
      while (fx.firstChild) fx.removeChild(fx.firstChild);
    }
  }

  function layoutLyric(force){
    if (!lyricEl) return;
    var line = S.idx >= 0 ? S.lines[S.idx] : null;
    var txt = line ? line.text : '';
    var mode = line ? (txt ? 'line' : 'blank') : (S.lines.length ? 'pre' : 'none');
    if (!force && S.idx === curIdx && txt === curText && mode === curMode) return;
    curIdx = S.idx; curText = txt; curMode = mode;
    clearPops();
    unitList = [];
    while (lyricEl.firstChild) lyricEl.removeChild(lyricEl.firstChild);
    if (mode === 'none') return;

    var isPre = mode === 'pre';
    var isPost = !isPre && S.idx >= S.lines.length - 1 && S.dur > 0 && S.t > S.dur - 22;
    var show = txt;
    if (isPre) show = 'PICÓ · FLUORESCENTE';
    else if (!show) show = '· · ·';

    var maxW = Math.max(200, W * (isPre ? 0.84 : 0.92));
    var fs = fitFont(show, maxW);
    if (isPre) fs *= 0.62;
    lyricEl.style.fontSize = fs.toFixed(1) + 'px';
    lyricEl.style.width = maxW.toFixed(0) + 'px';
    lyricEl.className = isPre ? 'pre' : (txt ? '' : 'pad');

    var toks = tokenize(show);
    var dur = estimateDur(line);
    var chars = line ? line.chars : null;
    var hasChars = !!(chars && chars.length);
    var span = document.createElement('span');
    span.className = 'ln';

    var i, tk, t0, ci, c, found, el, b, h, colIdx, base, step;
    for (i = 0; i < toks.length; i++){
      tk = toks[i];
      if (tk.s === ' '){
        span.appendChild(document.createTextNode(' '));
        continue;
      }
      t0 = null;
      if (hasChars && !isPre){
        found = null;
        for (ci = 0; ci < chars.length; ci++){
          c = chars[ci];
          if (c && typeof c.t === 'number' && isFinite(c.t) && ci >= tk.i0 && ci <= tk.i1){
            if (found === null || c.t < found) found = c.t;
          }
        }
        if (found !== null) t0 = found;
      }
      base = isPre ? 0 : (line ? line.t : 0);
      step = isPre ? 0.11 : (tk.i0 / Math.max(1, show.length)) * dur * 0.92;
      if (t0 === null) t0 = base + step;

      colIdx = i % 4;
      el = document.createElement('span');
      el.className = 'unit';
      el.style.setProperty('--i', String(isPre ? i + 6 : Math.min(i, 40)));
      /* hand-lettered wobble: each glyph sits slightly off the line */
      if (!isPre){
        el.style.setProperty('--rot', (((i * 53) % 11) - 5).toFixed(1) + 'deg');
        el.style.setProperty('--dy', (((i * 31) % 9) - 4).toFixed(1) + 'px');
      }
      b = document.createElement('span');
      b.className = 'b';
      b.textContent = tk.s;
      el.appendChild(b);
      h = document.createElement('span');
      h.className = 'h';
      h.setAttribute('aria-hidden', 'true');
      h.textContent = tk.s;
      el.appendChild(h);
      var c1 = [P.key, BASE.yel, P.hot, BASE.cyan][colIdx];
      var c2 = [BASE.yel, P.hot, P.key, BASE.cream][colIdx];
      el.style.setProperty('--c1', c1);
      el.style.setProperty('--c2', c2);
      span.appendChild(el);
      unitList.push({ el: el, h: h, t0: t0, on: false, s: tk.s });
    }
    lyricEl.appendChild(span);
    syncHits(true);
    if (!isPre && txt) popStamp(S.idx);
  }

  /* a hand-painted sticker slaps onto the truck each time the song moves */
  var stampEls = [];
  function popStamp(seed){
    var fx = document.getElementById('fx');
    if (!fx || S.rm) return;
    if (stampEls.length > 2){
      var old = stampEls.shift();
      if (old && old.parentNode) old.parentNode.removeChild(old);
    }
    var el = document.createElement('div');
    el.className = 'pop';
    var words = ['¡CUMBIA!', '¡WEPA!', '¡SALSA!', '¡AY!'];
    el.textContent = words[Math.abs(seed) % words.length];
    el.style.left = (W * (0.12 + (Math.abs(seed) * 37 % 70) / 100)).toFixed(0) + 'px';
    el.style.top = (H * (0.13 + (Math.abs(seed) * 23 % 30) / 100)).toFixed(0) + 'px';
    el.style.setProperty('--r', ((Math.abs(seed) * 17 % 26) - 13).toFixed(1) + 'deg');
    el.style.color = [P.key, BASE.yel, P.hot][Math.abs(seed) % 3];
    fx.appendChild(el);
    stampEls.push(el);
  }

  function syncHits(force){
    var i, u;
    for (i = 0; i < unitList.length; i++){
      u = unitList[i];
      var on = S.t >= u.t0 - 0.03;
      if (force || on !== u.on){
        u.on = on;
        if (on) u.el.classList.add('on'); else u.el.classList.remove('on');
      }
    }
  }

  /* ---------- fx: bokeh / confetti canvas particles ---------- */
  var FX = [], MAXF = 34;
  function spawnBurst(x, y, n, lvl){
    var i, a, sp;
    for (i = 0; i < n && FX.length < MAXF; i++){
      a = rndRange(0, Math.PI * 2); sp = rndRange(40, 150) * (0.5 + lvl);
      FX.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        r: rndRange(2, 7), l: rndRange(0.5, 1.2), life: 0,
        c: [P.key, BASE.yel, P.hot, P.cyan][(Math.random() * 4) | 0] });
    }
  }
  function stepFx(dt){
    var i, p;
    for (i = FX.length - 1; i >= 0; i--){
      p = FX[i]; p.life += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 140 * dt; p.vx *= 0.985;
      if (p.life > p.l) { FX.splice(i, 1); }
    }
  }
  function drawFx(){
    var i, p, a;
    for (i = 0; i < FX.length; i++){
      p = FX[i]; a = 1 - p.life / p.l;
      if (a <= 0) continue;
      ctx.globalAlpha = a * 0.75;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- draw ---------- */
  var raysAngle = 0, beatEnv = 0, bob = 0, lastFxBeat = -1, deadT = 0;
  function draw(now, dt){
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
    else { ctx.fillStyle = '#150c3a'; ctx.fillRect(0, 0, W, H); }

    var playing = S.playing;

    /* beat envelope first: everything below it reacts to the same number */
    var target = Math.max(S.beat * 0.9, S.live.bass * 0.7);
    beatEnv += (target - beatEnv) * Math.min(1, dt * 9);
    S.beat *= Math.exp(-dt * 3.2);

    var spin = S.rm ? 0.08 : 0.34;
    raysAngle += dt * (spin + (playing ? S.live.level * 0.6 : 0));
    if (raysAngle > 6.28318) raysAngle -= 6.28318;

    /* baked ray rosette rotated and additively blended: one blit per frame */
    if (rayCanvas){
      ctx.save();
      ctx.translate(rayCX, rayCY);
      ctx.rotate(raysAngle);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4 + beatEnv * 0.4;
      ctx.drawImage(rayCanvas, -rayR, -rayR, rayR * 2, rayR * 2);
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    bob = Math.sin(now / 620) * (S.rm ? 1.2 : 5);

    lionTilt = Math.sin(now / 900) * 1.4;
    applyLion(bob);
    if (flashEl) flashEl.setAttribute('opacity', (beatEnv * 0.85).toFixed(2));
    applyDolphin(Math.sin(now / 780 + 1.2) * 9);
    if (sparkG) sparkG.setAttribute('opacity', (0.45 + 0.4 * Math.abs(Math.sin(now / 1100)) + beatEnv * 0.3).toFixed(2));

    if (!S.rm && S.beatIdx !== lastFxBeat && S.beat > 0.45){
      lastFxBeat = S.beatIdx;
      spawnBurst(W * 0.5 + (Math.random() - 0.5) * W * 0.35, H * 0.6, 6, S.beat);
    }
    stepFx(dt);
    drawFx();

    /* when paused everything settles into a dimmer groove */
    if (!S.playing){
      ctx.fillStyle = 'rgba(8,5,24,.20)';
      ctx.fillRect(0, 0, W, H);
    }

    syncHits(false);
  }


  var lastT = 0;
  function frame(now){
    var t0 = performance.now();
    S.frames++;
    /* ready goes out before any drawing work: nothing may delay first paint */
    if (S.frames === 1) sendReady();
    if (!S.started) S.started = now;
    var dt = now - lastT; lastT = now;
    if (!isFinite(dt) || dt < 0 || dt > 220) dt = 16.7;
    dt = dt / 1000;
    try { draw(now, dt); }
    catch (e) { S.err = String(e && e.message || e); console.error('[485] draw failed', e); }
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  function estimateDur(l){
    if (!l || !l.text) return 1;
    if (l.dur && isFinite(l.dur) && l.dur > 0.2) return l.dur;
    return clamp(l.text.length * 0.34, 0.8, 14);
  }

  function setIdx(){
    var i, found = -1;
    for (i = 0; i < S.lines.length; i++){ if (S.lines[i].t <= S.t + 0.06) found = i; else break; }
    if (found !== S.idx){
      S.idx = found;
      S.text = found >= 0 ? (S.lines[found].text || '') : '';
      layoutLyric(false);
    }
  }

  /* ---------- protocol ---------- */
  function normLines(raw){
    var out = [], i, it, txt;
    if (!raw || !raw.length) return out;
    var n = Math.min(raw.length, 4000);
    for (i = 0; i < n; i++){
      it = raw[i];
      if (!it) continue;
      txt = it.text == null ? '' : String(it.text).replace(/\s+/g, ' ').trim();
      var tt = Number(it.t);
      if (!isFinite(tt) || tt < 0) tt = 0;
      out.push({
        t: tt,
        dur: (it.dur != null && isFinite(it.dur) && it.dur > 0) ? Number(it.dur) : 0,
        text: txt,
        chars: Array.isArray(it.chars) ? it.chars : null
      });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    return out;
  }

  function onInit(p){
    p = p || {};
    S.cover = p.song && p.song.cover ? p.song.cover : null;
    S.title = (p.song && p.song.name) ? String(p.song.name) : '';
    var ar = p.song && p.song.artists;
    if (Array.isArray(ar)) S.artist = ar.filter(Boolean).map(String).join(' / ');
    else S.artist = ar ? String(ar) : '';
    S.dur = (typeof p.duration === 'number' && isFinite(p.duration) && p.duration > 0) ? p.duration : 0;
    if (Array.isArray(p.accent) && p.accent.length >= 3){
      S.accent = [clamp(Number(p.accent[0]) || 0, 0, 255), clamp(Number(p.accent[1]) || 0, 0, 255), clamp(Number(p.accent[2]) || 0, 0, 255)];
    }
    S.lines = normLines(p.lines);
    S.idx = -2;
    S.text = '';
    buildPalette();
    buildBackdrop();
    buildArt();
    setIdx();
    layoutLyric(true);
    paintTitle();
    if (!S.lines.length){
      setEmpty(S.title ? '《' + S.title.slice(0, 24) + '》\n这首歌没有歌词' : '这首歌没有歌词');
    } else setEmpty('');
  }

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick'){
        var p2 = d.payload || {};
        if (typeof p2.time === 'number' && isFinite(p2.time)) S.t = Math.max(0, p2.time);
        if (typeof p2.playing === 'boolean') S.playing = p2.playing;
        setIdx();
      }
      else if (d.type === 'beat'){
        var b = d.payload || {};
        S.beat = clamp(Number(b.level) || 0, 0, 1);
        S.beatIdx = (b.index || 0) | 0;
      }
      else if (d.type === 'live'){
        var lv = d.payload || {};
        S.live.level = clamp(Number(lv.level) || 0, 0, 1);
        S.live.bass = clamp(Number(lv.bass) || 0, 0, 1);
        S.live.mid = clamp(Number(lv.mid) || 0, 0, 1);
        S.live.treble = clamp(Number(lv.treble) || 0, 0, 1);
        if (typeof lv.playing === 'boolean') S.playing = lv.playing;
      }
    } catch (e){ S.err = String(e && e.message || e); console.error('[485] message handling failed', e); }
  });

  try {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    S.rm = !!(mq && mq.matches);
    if (mq && mq.addEventListener) mq.addEventListener('change', function(e){ S.rm = !!e.matches; });
  } catch (e){ console.error('[485] reduced-motion probe failed', e); }

  window.addEventListener('resize', function(){ try { resize(); } catch (e){ console.error('[485] resize failed', e); } });
  window.addEventListener('orientationchange', function(){ try { resize(); } catch (e){ console.error('[485] orient failed', e); } });

  try { resize(); } catch (e){ S.err = String(e && e.message || e); console.error('[485] init resize failed', e); }

  requestAnimationFrame(frame);
  setTimeout(sendReady, 300);
  setTimeout(sendReady, 1200);
})();
</script>
</body>
</html>
