<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>501 · Free Word Letterpress</title>
<style>
  :root{
    --accent:rgb(190,58,32);
    --mark:rgb(150,46,26);
    --ink:#16130e;
    --inkGhost:rgba(22,19,14,.20);
    --paper:#eae0c9;
    --board:#141210;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#141210;}
  body{font-family:"Times New Roman",Georgia,"Songti SC","STSong","SimSun",serif;
       -webkit-font-smoothing:antialiased;}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block;
      z-index:0;will-change:transform;}
  #collage{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;
           transform:rotate(-0.9deg);transform-origin:50% 50%;}
  #ghost{position:absolute;inset:0;z-index:1;overflow:hidden;}
  #ghost span{position:absolute;font-family:"Times New Roman",Georgia,serif;
              color:var(--mark);opacity:.12;white-space:nowrap;will-change:opacity;}
  #tears{position:absolute;inset:0;z-index:2;overflow:hidden;}
  .tear{position:absolute;will-change:transform;}
  #lipWrap{position:absolute;z-index:2;opacity:.5;pointer-events:none;
           will-change:transform;}
  #lip{display:block;width:100%;height:100%;}
  #echo{position:absolute;z-index:2;font-family:"Times New Roman",Georgia,serif;
        font-weight:700;color:var(--mark);opacity:.10;white-space:nowrap;
        pointer-events:none;will-change:transform;}
  #lyr{position:absolute;inset:0;z-index:4;transform-origin:50% 50%;will-change:transform;}
  #lyr span{position:absolute;left:0;top:0;text-align:center;
            color:var(--ink);font-weight:700;white-space:pre;
            text-shadow:.022em .015em 0 var(--inkGhost);
            will-change:transform,opacity;}
  #margin{position:absolute;z-index:3;left:0;top:0;color:var(--ink);opacity:.42;
          font:400 clamp(8px,1.0vmin,12px)/1 "Times New Roman",Georgia,serif;
          letter-spacing:.52em;text-transform:uppercase;white-space:nowrap;
          writing-mode:vertical-rl;pointer-events:none;}
  #under{position:absolute;z-index:3;background:var(--mark);opacity:.18;
         transform-origin:0 50%;will-change:transform;}
  #num{position:absolute;z-index:3;font-family:Georgia,"Times New Roman",serif;
       font-weight:700;line-height:.80;color:var(--mark);opacity:.88;
       letter-spacing:-.03em;white-space:nowrap;will-change:transform;}
  #num i{font-style:normal;font-size:.26em;opacity:.6;letter-spacing:.02em;
         vertical-align:super;font-weight:400;}
  #frag{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;}
  #frag b{position:absolute;left:0;top:0;font-family:"Times New Roman",Georgia,serif;
          font-weight:400;will-change:transform;}
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;
       display:flex;justify-content:space-between;align-items:flex-end;
       padding:0 4.4vmin 3.4vmin;color:var(--ink);opacity:.6;
       font:400 clamp(8px,1.02vmin,12px)/1.4 "Times New Roman",Georgia,serif;
       letter-spacing:.30em;text-transform:uppercase;}
  #hud .r{text-align:right;letter-spacing:.20em;}
  #empty{position:fixed;inset:0;z-index:6;display:none;
         flex-direction:column;align-items:center;justify-content:center;
         pointer-events:none;color:var(--ink);gap:2.4vmin;}
  #empty b{font:700 clamp(26px,7vmin,88px)/1 "Songti SC","STSong","SimSun",serif;
           letter-spacing:.30em;text-indent:.30em;opacity:.9;}
  #empty i{font:400 clamp(8px,1.05vmin,12px)/1 Georgia,serif;font-style:normal;
           letter-spacing:.48em;opacity:.45;text-transform:uppercase;}
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="collage">
    <div id="ghost"></div>
    <div id="tears"></div>
    <div id="lipWrap"><canvas id="lip"></canvas></div>
    <div id="echo"></div>
    <div id="under"></div>
    <div id="num"></div>
    <div id="margin"></div>
    <div id="lyr"></div>
  </div>
  <div id="frag"></div>
  <div id="hud"><span id="hudL">—</span><span class="r" id="hudR"></span></div>
  <div id="empty"><b>无 词</b><i>instrumental</i></div>
<script>
"use strict";
(function(){

  /* ================================================================ state */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
            err: '', gl: false, song: {} };
  var ACC = [190, 58, 32];
  var ROT = -0.9 * Math.PI / 180;
  var rm = false;
  try {
    rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { rm = false; console.error('[501] mq', e); }

  var P = (window.parent !== window) ? window.parent : (window.opener || window);
  var readySent = false;

  /* ================================================================== dom */
  var cv    = document.getElementById('bg');
  var g2    = cv.getContext('2d', { alpha: false });
  var coll  = document.getElementById('collage');
  var lyrEl = document.getElementById('lyr');
  var numEl = document.getElementById('num');
  var ghostEl = document.getElementById('ghost');
  var tearsEl = document.getElementById('tears');
  var underEl = document.getElementById('under');
  var echoEl  = document.getElementById('echo');
  var marginEl = document.getElementById('margin');
  var fragEl  = document.getElementById('frag');
  var lipWrap = document.getElementById('lipWrap');
  var lipCv   = document.getElementById('lip');
  var lipCtx  = lipCv.getContext('2d');
  var hudL    = document.getElementById('hudL');
  var hudR    = document.getElementById('hudR');
  var emptyEl = document.getElementById('empty');

  /* ================================================================ utils */
  function clamp(v, a, b) { v = +v; if (!isFinite(v)) return a; return v < a ? a : (v > b ? b : v); }
  function pad2(n) { n = Math.floor(n); return (n < 10 ? '0' : '') + n; }
  function lum(c) { return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
  function dims() {
    var w = cv.clientWidth || window.innerWidth || 0;
    var h = cv.clientHeight || window.innerHeight || 0;
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    return [w, h];
  }

  /* =============================================================== layout */
  var W = 1440, H = 900, DPR = 1;
  var sheet = { w: 1300, h: 800, m: 30 };
  var paperCv = null;
  var lipFrames = [];
  var lipW = 0, lipH = 0;
  var underW = -1;

  function layout() {
    W = dims()[0]; H = dims()[1];
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(2, Math.round(W * DPR));
    cv.height = Math.max(2, Math.round(H * DPR));
    var m = Math.max(10, Math.min(W, H) * 0.045);
    sheet.m = m;
    sheet.w = Math.max(40, W - m * 2);
    sheet.h = Math.max(40, H - m * 2);
    measureNum();
    underW = -1;
    placeExtras();
    buildPaper();
    paintStatic();
    paintLipFrames();
    buildFrags();
  }

  function measureNum() {
    var fs = clamp(Math.min(W, H) * 0.19, 42, 268);
    numEl.style.fontSize = fs + 'px';
    numEl.style.left = (W * 0.078) + 'px';
    numEl.style.top = (H * 0.075) + 'px';
    numEl.style.transform = 'rotate(-4.5deg)';
  }

  function placeExtras() {
    /* open-mouth silhouette, bottom right, nudged off the sheet edge */
    lipW = Math.round(Math.min(W * 0.40, H * 0.52));
    lipH = Math.round(lipW * 0.52);
    lipWrap.style.width = lipW + 'px';
    lipWrap.style.height = lipH + 'px';
    lipWrap.style.left = (W * 0.985 - lipW) + 'px';
    lipWrap.style.top = (H * 0.895 - lipH) + 'px';
    lipWrap.style.transform = 'rotate(-13deg)';
    echoEl.style.left = (W * 0.030) + 'px';
    echoEl.style.top = (H * 0.815) + 'px';
    echoEl.style.fontSize = clamp(Math.min(W, H) * 0.10, 18, 150) + 'px';
    echoEl.style.transform = 'rotate(-2.4deg)';
    if (marginEl) {
      marginEl.style.left = (W * 0.955) + 'px';
      marginEl.style.top = (H * 0.070) + 'px';
      marginEl.style.height = (H * 0.30) + 'px';
      marginEl.style.fontSize = clamp(Math.min(W, H) * 0.014, 8, 13) + 'px';
      marginEl.textContent = 'STIMME \u00b7 \u0283\u0298\u0281 \u00b7 FREIE WORTE';
    }
  }

  /* ========================================================= paper (static) */
  function buildPaper() {
    try {
      var pd = Math.min(DPR, 1.5);
      var pw = Math.max(8, Math.round(sheet.w * pd));
      var ph = Math.max(8, Math.round(sheet.h * pd));
      var c = document.createElement('canvas');
      c.width = pw; c.height = ph;
      var x = c.getContext('2d');
      if (!x) { paperCv = null; return; }
      x.setTransform(pd, 0, 0, pd, 0, 0);
      var w = sheet.w, h = sheet.h;

    var jit = clamp(Math.min(w, h) * 0.012, 6, 15);
      x.beginPath();
      var steps = 26, i, q;
      x.moveTo(jit * 0.6, jit * 1.4);
      for (i = 1; i <= steps; i++) { q = i / steps; x.lineTo(jit * 0.6 + (w - jit * 1.2) * q, jit * (0.5 + 1.6 * Math.abs(Math.sin(i * 2.3 + 0.7)))); }
      for (i = 1; i <= steps; i++) { q = i / steps; x.lineTo(w - jit * (0.4 + 1.5 * Math.abs(Math.cos(i * 1.9))), jit * 0.6 + (h - jit * 1.4) * q); }
      for (i = 1; i <= steps; i++) { q = 1 - i / steps; x.lineTo(jit * 0.6 + (w - jit * 1.2) * q, h - jit * (0.5 + 1.8 * Math.abs(Math.sin(i * 2.7 + 1.9)))); }
      for (i = 1; i <= steps; i++) { q = 1 - i / steps; x.lineTo(jit * (0.4 + 1.5 * Math.abs(Math.cos(i * 2.2 + 0.4))), jit * 0.6 + (h - jit * 1.4) * q); }
      x.closePath();
      x.save();
      x.clip();

      var grd = x.createLinearGradient(0, 0, w * 0.85, h);
      grd.addColorStop(0, '#f2e9d6');
      grd.addColorStop(0.40, '#ebe1ca');
      grd.addColorStop(0.75, '#e3d6b8');
      grd.addColorStop(1, '#d5c3a0');
      x.fillStyle = grd;
      x.fillRect(0, 0, w, h);

      var st = [
        [0.16, 0.20, 0.40, 'rgba(122,96,56,0.09)'],
        [0.88, 0.10, 0.32, 'rgba(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ',0.10)'],
        [0.74, 0.90, 0.42, 'rgba(94,72,42,0.11)'],
        [0.30, 0.94, 0.28, 'rgba(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ',0.07)']
      ];
      for (i = 0; i < st.length; i++) {
        var rr = Math.max(w, h) * st[i][2];
        var rg = x.createRadialGradient(w * st[i][0], h * st[i][1], 0, w * st[i][0], h * st[i][1], rr);
        rg.addColorStop(0, st[i][3]);
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = rg; x.fillRect(0, 0, w, h);
      }

      var tile = document.createElement('canvas');
      tile.width = 96; tile.height = 96;
      var tx = tile.getContext('2d');
      if (tx) {
        var id = tx.createImageData(96, 96);
        for (i = 0; i < id.data.length; i += 4) {
          var v = Math.random() * 255;
          id.data[i] = v; id.data[i + 1] = v * 0.95; id.data[i + 2] = v * 0.85; id.data[i + 3] = 22;
        }
        tx.putImageData(id, 0, 0);
        var pat = x.createPattern(tile, 'repeat');
        if (pat) { x.fillStyle = pat; x.fillRect(0, 0, w, h); }
      }

      var eg = x.createLinearGradient(0, 0, 0, h);
      eg.addColorStop(0, 'rgba(42,30,16,0.22)');
      eg.addColorStop(0.09, 'rgba(42,30,16,0)');
      eg.addColorStop(0.91, 'rgba(42,30,16,0)');
      eg.addColorStop(1, 'rgba(42,30,16,0.20)');
      x.fillStyle = eg; x.fillRect(0, 0, w, h);

      /* faint printed register rules + hinge fold */
      x.globalAlpha = 0.13;
      x.strokeStyle = 'rgba(60,48,32,1)';
      x.lineWidth = 1;
      for (i = 1; i < 7; i++) {
        var yy = h * (0.10 + i * 0.128);
        x.beginPath(); x.moveTo(w * 0.035, yy); x.lineTo(w * 0.965, yy); x.stroke();
      }
      x.beginPath();
      x.moveTo(w * 0.5, 0); x.lineTo(w * 0.5, h * 0.14);
      x.moveTo(w * 0.5, h * 0.86); x.lineTo(w * 0.5, h);
      x.stroke();
      x.globalAlpha = 1;
      x.restore();
      paperCv = c;
    } catch (e) {
      paperCv = null;
      S.err = String(e && e.message ? e.message : e);
      console.error('[501] paper', e);
    }
  }

  /* =============================================== static board + printed marks */
  function paintStatic() {
    try {
      g2.setTransform(1, 0, 0, 1, 0, 0);
      g2.fillStyle = '#141210';
      g2.fillRect(0, 0, cv.width, cv.height);
      g2.setTransform(DPR, 0, 0, DPR, 0, 0);

      /* board vignette */
      var vg = g2.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.78);
      vg.addColorStop(0, 'rgba(58,48,38,0.30)');
      vg.addColorStop(1, 'rgba(0,0,0,0)');
      g2.fillStyle = vg;
      g2.fillRect(0, 0, W, H);

      if (!paperCv) return;
      g2.save();
      g2.translate(W / 2, H / 2);
      g2.rotate(ROT);
      g2.drawImage(paperCv, -sheet.w / 2, -sheet.h / 2, sheet.w, sheet.h);
      g2.restore();

      /* oversized letterpress 'a' plate, accent */
      g2.save();
      g2.globalAlpha = 0.14;
      g2.fillStyle = 'rgb(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ')';
      g2.translate(W * 0.845, H * 0.285);
      g2.rotate(-0.22);
      g2.font = '700 ' + (Math.min(W, H) * 0.50) + 'px "Times New Roman",Georgia,serif';
      g2.textAlign = 'center'; g2.textBaseline = 'middle';
      g2.fillText('a', 0, 0);
      g2.restore();

      /* registration cross */
      g2.save();
      g2.globalAlpha = 0.5;
      g2.strokeStyle = 'rgb(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ')';
      g2.lineWidth = 1.6;
      var cx = W * 0.905, cy = H * 0.845, r = clamp(Math.min(W, H) * 0.030, 8, 40);
      g2.beginPath();
      g2.moveTo(cx - r, cy); g2.lineTo(cx + r, cy);
      g2.moveTo(cx, cy - r); g2.lineTo(cx, cy + r); g2.stroke();
      g2.beginPath(); g2.arc(cx, cy, r * 0.62, 0, Math.PI * 2); g2.stroke();
      g2.restore();
    } catch (e) {
      S.err = String(e && e.message ? e.message : e);
      console.error('[501] static', e);
    }
  }

  /* ======================================================= lip silhouette */
  function paintLipFrames() {
    lipFrames = [];
    var n = 5, i;
    lipCv.width = Math.max(2, Math.round(lipW * DPR));
    lipCv.height = Math.max(2, Math.round(lipH * DPR));
    for (i = 0; i < n; i++) {
      var c = document.createElement('canvas');
      c.width = lipCv.width; c.height = lipCv.height;
      var x = c.getContext('2d');
      if (!x) continue;
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawMouth(x, lipW, lipH, i / (n - 1));
      lipFrames.push(c);
    }
    showLip(0);
  }

  function drawMouth(x, w, h, open) {
    var cx = w * 0.5, cy = h * 0.5;
    var rx = w * 0.47, ry = h * 0.30;
    var ink = '#16130e';
    var openH = (0.10 + 0.72 * clamp(open, 0, 1)) * h;

    /* lips as one silhouette with an even-odd mouth hole */
    x.beginPath();
    x.moveTo(cx - rx, cy);
    x.bezierCurveTo(cx - rx * 0.80, cy - ry * 1.30, cx - rx * 0.30, cy - ry * 1.12, cx - rx * 0.10, cy - ry * 0.62);
    x.bezierCurveTo(cx - rx * 0.04, cy - ry * 0.80, cx + rx * 0.04, cy - ry * 0.80, cx + rx * 0.10, cy - ry * 0.62);
    x.bezierCurveTo(cx + rx * 0.30, cy - ry * 1.12, cx + rx * 0.80, cy - ry * 1.30, cx + rx, cy);
    x.bezierCurveTo(cx + rx * 0.82, cy + ry * 1.42, cx + rx * 0.34, cy + ry * 1.62, cx, cy + ry * 1.62);
    x.bezierCurveTo(cx - rx * 0.34, cy + ry * 1.62, cx - rx * 0.82, cy + ry * 1.42, cx - rx, cy);
    x.closePath();

    /* mouth hole (reversed winding for even-odd cut) */
    x.moveTo(cx - rx * 0.82, cy - openH * 0.06);
    x.bezierCurveTo(cx - rx * 0.50, cy - openH * 0.62, cx + rx * 0.50, cy - openH * 0.62, cx + rx * 0.82, cy - openH * 0.06);
    x.bezierCurveTo(cx + rx * 0.52, cy + openH * 0.60, cx - rx * 0.52, cy + openH * 0.60, cx - rx * 0.82, cy - openH * 0.06);
    x.closePath();

    x.fillStyle = ink;
    x.fill('evenodd');

    /* tongue + teeth suggestion inside the hole */
    x.save();
    x.beginPath();
    x.ellipse(cx - rx * 0.86, cy, rx * 0.88, openH * 0.32, 0, 0, Math.PI * 2);
    x.ellipse(cx + rx * 0.86, cy, rx * 0.88, openH * 0.32, 0, 0, Math.PI * 2);
    x.clip();
    x.globalAlpha = 0.55;
    x.fillStyle = ink;
    x.beginPath();
    x.ellipse(cx, cy + openH * 0.30, rx * 0.46, openH * 0.26, 0, 0, Math.PI * 2);
    x.fill();
    x.globalAlpha = 0.28;
    x.fillRect(cx - rx * 0.5, cy - openH * 0.30, rx * 1.0, openH * 0.15);
    x.restore();
  }

  var lipShown = -1, lipTarget = 0;
  function showLip(i) {
    if (i === lipShown) return;
    if (!lipFrames.length || !lipCtx) return;
    lipShown = i;
    lipCtx.setTransform(1, 0, 0, 1, 0, 0);
    lipCtx.clearRect(0, 0, lipCv.width, lipCv.height);
    var f = lipFrames[Math.min(i, lipFrames.length - 1)];
    if (f) lipCtx.drawImage(f, 0, 0);
  }

  /* ========================================================= lyric metrics */
  var LM = { size: 64, perChar: 58, perRow: 8, rows: 1, x0: 0, y0: 0, lh: 70 };

  function measureLine(txt) {
    var n = Math.max(1, txt ? Math.min(txt.length, 140) : 1);
    var maxW = W * 0.72;
    var maxH = H * 0.60;
    var size = Math.min(H * 0.28, (maxW / Math.min(n, 6)) * 0.98, W * 0.22);
    size = clamp(size, 17, 300);
    var per = 1, rows = 1, guard = 0;
    do {
      per = Math.max(1, Math.floor(maxW / (size * 0.92)));
      rows = Math.ceil(n / per);
      if (rows <= 4 && rows * size * 1.09 <= maxH) break;
      size *= 0.86;
      guard++;
    } while (guard < 18 && size > 16);

    var perChar = size * 0.92;
    var lh = size * 1.09;
    var blockH = rows * lh;
    var blockW = Math.min(maxW, per * perChar);
    LM.size = size; LM.perChar = perChar; LM.perRow = per; LM.rows = rows; LM.lh = lh;
    LM.x0 = (W - blockW) / 2;
    LM.y0 = H * 0.505 - blockH / 2;
    return { per: per, rows: rows };
  }

  /* =========================================================== lyric build */
  var CH = [], nCh = 0, curText = '', curLine = null, echoText = '';
  var STAMP = rm ? 0.001 : 0.30;

  function buildChars(line) {
    lyrEl.textContent = '';
    CH = []; nCh = 0;
    curLine = line || null;
    var txt = (line && typeof line.text === 'string') ? line.text : '';
    curText = txt;
    if (!txt) {
      measureLine('');
      echoEl.textContent = '';
      echoText = '';
      underEl.style.opacity = '0';
      return;
    }
    var m = measureLine(txt);
    var len = Math.min(txt.length, 140);
    var perChar = LM.perChar, lh = LM.lh, size = LM.size;
    var x0 = LM.x0, y0 = LM.y0;

    var half = size * 0.56;
    var chars = (line && line.chars && line.chars.length) ? line.chars : null;
    var lt = (line && isFinite(line.t)) ? +line.t : 0;
    var ld = (line && isFinite(line.dur) && +line.dur > 0) ? +line.dur : 0;
    if (!(ld > 0)) ld = Math.max(1.8, len * 0.26);

    var frag = document.createDocumentFragment();
    for (var k = 0; k < len; k++) {
      var ch = txt.charAt(k);
      var row = Math.floor(k / m.per);
      var col = k % m.per;
      var gx = x0 + (col + 0.5) * perChar + (Math.sin(k * 12.9898) * 1.9);
      var gy = y0 + (row + 0.5) * lh + (Math.cos(k * 7.233) * 1.7);

      var h1 = Math.sin(k * 12.9898 + 4.1);
      var h2 = Math.sin(k * 78.233 + 1.7);
      var h3 = Math.sin(k * 39.425 + 8.3);
      var rot1 = h1 * 0.030 + (k % 11 === 5 ? 0.055 : 0);
      var sc1 = 1 + h2 * 0.045;

      /* loose type: scattered, raised, rotated before it is sung */
      var ang = h3 * Math.PI * 2.0;
      var rad = size * (0.55 + Math.abs(h2) * 0.95);
      var sx = gx + Math.cos(ang) * rad;
      var sy = gy + Math.sin(ang) * rad * 0.62;
      sx = clamp(sx, size * 0.5, W - size * 0.5);
      sy = clamp(sy, size * 0.5, H - size * 0.5);
      var rot0 = rot1 + h1 * 1.15;
      var sc0 = sc1 * (0.62 + Math.abs(h3) * 0.55);

      var sp = document.createElement('span');
      sp.textContent = ch === ' ' ? '\u00a0' : ch;
      sp.style.fontSize = size + 'px';
      sp.style.lineHeight = (size * 1.12) + 'px';
      sp.style.width = (size * 1.12) + 'px';
      sp.style.height = (size * 1.12) + 'px';
      sp.style.opacity = '0.20';
      sp.style.transform = 'translate3d(' + (sx - half).toFixed(2) + 'px,' + (sy - half).toFixed(2) +
        'px,0) rotate(' + rot0.toFixed(4) + 'rad) scale(' + sc0.toFixed(3) + ')';
      frag.appendChild(sp);

      /* misregistration ghost: the same letter reprinted a few px off */
      var gh = null;
      if (k % 6 < 3) {
        gh = document.createElement('span');
        gh.textContent = ch === ' ' ? '\u00a0' : ch;
        gh.style.fontSize = size + 'px';
        gh.style.lineHeight = (size * 1.12) + 'px';
        gh.style.width = (size * 1.12) + 'px';
        gh.style.height = (size * 1.12) + 'px';
        gh.style.color = 'var(--mark)';
        gh.style.opacity = '0.10';
        gh.style.transform = 'translate3d(' + (sx - half + 3).toFixed(2) + 'px,' +
          (sy - half + 5).toFixed(2) + 'px,0) rotate(' + (rot0 + 0.012).toFixed(4) +
          'rad) scale(' + (sc0 * 1.008).toFixed(3) + ')';
        frag.appendChild(gh);
      }

      var tm = lt + ld * (k / Math.max(1, len));
      if (chars && chars.length) {
        var src = chars[k] || null;
        if (src && isFinite(src.t)) tm = +src.t;
      }

      CH.push({
        el: sp, gh: gh, sx: sx, sy: sy, gx: gx, gy: gy,
        r0: rot0, r1: rot1, s0: sc0, s1: sc1,
        tm: tm, done: false, live: false
      });
    }
    lyrEl.appendChild(frag);
    nCh = CH.length;

    echoText = txt.slice(0, Math.min(3, txt.length));
    echoEl.textContent = echoText;
    echoEl.style.opacity = '0.10';
    underEl.style.opacity = '0.18';
  }

  var EASE = function (p) { var q = 1 - p; return 1 - q * q * q; };

  function paintLyrics(t) {
    for (var i = 0; i < nCh; i++) {
      var c = CH[i];
      if (!c || c.done) continue;
      var d = t - c.tm;
      if (d < 0) {
        if (!c.live) { c.live = true; }
        continue;
      }
      var p = STAMP > 0 ? clamp(d / STAMP, 0, 1) : 1;
      var e = EASE(p);
      var x = c.sx + (c.gx - c.sx) * e;
      var y = c.sy + (c.gy - c.sy) * e;
      var rot = c.r0 + (c.r1 - c.r0) * e;
      var sc = c.s0 + (c.s1 - c.s0) * e;
      if (p < 0.62) sc *= 1 + (1 - p) * 0.14;
      var op = 0.20 + 0.80 * clamp(p * 1.55, 0, 1);

      if (p >= 1) {
        x = c.gx; y = c.gy; rot = c.r1; sc = c.s1; op = 1;
        c.done = true;
        c.el.style.opacity = '1';
        c.el.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' +
          rot.toFixed(4) + 'rad) scale(' + sc.toFixed(3) + ')';
        if (c.gh) {
          c.gh.style.opacity = '0.10';
          c.gh.style.transform = 'translate3d(' + (x + 3).toFixed(2) + 'px,' + (y + 5).toFixed(2) +
            'px,0) rotate(' + (rot + 0.012).toFixed(4) + 'rad) scale(' + (sc * 1.008).toFixed(3) + ')';
        }
        continue;
      }
      c.el.style.opacity = op.toFixed(3);
      c.el.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' +
        rot.toFixed(4) + 'rad) scale(' + sc.toFixed(3) + ')';
      if (c.gh) {
        c.gh.style.opacity = (op * 0.16).toFixed(3);
        c.gh.style.transform = 'translate3d(' + (x + 5).toFixed(2) + 'px,' + (y + 7).toFixed(2) +
          'px,0) rotate(' + (rot + 0.02).toFixed(4) + 'rad) scale(' + (sc * 1.012).toFixed(3) + ')';
      }
    }
  }

  /* ============================================================== decorations */
  var GH = ['\u0283', '\u0298', '\u0281', '\u0294', '\u0250', '\u0254', '\u00e6', '\u00df',
            '\u014b', '\u0278', '\u028e', '\u0292'];
  var gEls = [];

  function buildGhost(idx) {
    ghostEl.textContent = '';
    gEls = [];
    var seed = Math.abs(idx | 0), i;
    var spec = [
      [0.045, 0.115, 0.40, -13],
      [0.885, 0.330, 0.24, 9],
      [0.070, 0.760, 0.20, -4]
    ];
    for (i = 0; i < spec.length; i++) {
      var s = document.createElement('span');
      s.textContent = GH[(seed + i * 5) % GH.length];
      s.style.fontSize = (Math.min(W, H) * spec[i][2]) + 'px';
      s.style.fontStyle = i === 1 ? 'italic' : 'normal';
      s.style.left = (W * spec[i][0]) + 'px';
      s.style.top = (H * spec[i][1]) + 'px';
      s.style.transform = 'rotate(' + spec[i][3] + 'deg)';
      s.style.opacity = '0.12';
      ghostEl.appendChild(s);
      gEls.push(s);
    }
  }

  function buildTears() {
    tearsEl.textContent = '';
    var specs = [
      { x: 0.030, y: 0.300, w: 0.035, h: 0.260, rot: -1.4, col: 'var(--mark)', op: 0.80 },
      { x: 0.720, y: 0.055, w: 0.230, h: 0.030, rot: 1.2, col: 'var(--ink)', op: 0.72 },
      { x: 0.055, y: 0.905, w: 0.300, h: 0.026, rot: -0.6, col: 'var(--mark)', op: 0.55 },
      { x: 0.960, y: 0.560, w: 0.026, h: 0.200, rot: 0.8, col: 'var(--ink)', op: 0.55 }
    ];
    for (var i = 0; i < specs.length; i++) {
      var s = specs[i];
      var d = document.createElement('div');
      d.className = 'tear';
      var ww = Math.max(6, W * s.w), hh = Math.max(6, H * s.h);
      d.style.width = ww + 'px';
      d.style.height = hh + 'px';
      d.style.left = (W * s.x) + 'px';
      d.style.top = (H * s.y) + 'px';
      d.style.background = s.col;
      d.style.opacity = String(s.op);
      d.style.transform = 'rotate(' + s.rot + 'deg)';
      var pts = [], n = 12, k, a, b;
      if (ww >= hh) {
        for (k = 0; k <= n; k++) { a = (k / n) * 100; b = (k % 2 ? 2 : 20) + Math.sin(k * 2.7) * 6; pts.push(a.toFixed(1) + '% ' + b.toFixed(1) + '%'); }
        for (k = n; k >= 0; k--) { a = (k / n) * 100; b = 100 - ((k % 2 ? 3 : 24) + Math.cos(k * 3.1) * 6); pts.push(a.toFixed(1) + '% ' + b.toFixed(1) + '%'); }
      } else {
        for (k = 0; k <= n; k++) { b = (k / n) * 100; a = (k % 2 ? 2 : 22) + Math.sin(k * 2.3) * 7; pts.push(a.toFixed(1) + '% ' + b.toFixed(1) + '%'); }
        for (k = n; k >= 0; k--) { b = (k / n) * 100; a = 100 - ((k % 2 ? 4 : 26) + Math.cos(k * 2.9) * 7); pts.push(a.toFixed(1) + '% ' + b.toFixed(1) + '%'); }
      }
      d.style.clipPath = 'polygon(' + pts.join(',') + ')';
      d.style.webkitClipPath = d.style.clipPath;
      tearsEl.appendChild(d);
    }
  }

  var FR = ['\u00c6', '\u0152', '\u00df', 'fr', '\u222b', '\u0259', '\u0283', '\u0292', '\u00f0',
            '\u03b8', '\u014b', '\u028e', '\u0294', '\u0298', '!', '?', '&', '\u00a7', '\u00b6',
            '\u00c4', '\u03a9', '\u0281', '\u0250', '\u0254', '\u025c', '\u028a', '\u00e6',
            '\u0278', '\u03b2', '\u00e7', '\u00a1', '\u00bf', '%', '#', '\u0416', '\u0424'];
  var fEls = [];

  function buildFrags() {
    fragEl.textContent = '';
    fEls = [];
    var n = 12;
    for (var i = 0; i < n; i++) {
      var b = document.createElement('b');
      b.textContent = FR[(i * 5 + 3) % FR.length];
      var s = clamp(Math.min(W, H) * (0.040 + ((i * 37) % 100) / 100 * 0.062), 14, 120);
      b.style.fontSize = s + 'px';
      b.style.fontStyle = (i % 3 === 1) ? 'italic' : 'normal';
      b.style.fontWeight = (i % 4 === 0) ? '700' : '400';
      b.style.color = (i % 4 === 0) ? 'var(--mark)' : 'var(--ink)';
      b.style.opacity = String(0.14 + ((i * 13) % 10) / 100 * 0.55);
      var left = (i % 2 === 0)
        ? (0.012 + ((i * 17) % 100) / 100 * 0.060)
        : (0.948 - ((i * 23) % 100) / 100 * 0.055);
      var top = 0.055 + ((i * 29) % 100) / 100 * 0.845;
      var rot = ((i * 41) % 74) - 37;
      b.style.transform = 'translate3d(' + (W * left).toFixed(1) + 'px,' + (H * top).toFixed(1) +
        'px,0) rotate(' + rot + 'deg)';
      fragEl.appendChild(b);
      fEls.push({ el: b, x: W * left, y: H * top, rot: rot, sp: 0.45 + (i % 5) * 0.28, ph: i * 0.9 });
    }
  }

  /* =============================================================== beat fx */
  var beatLv = 0, bass = 0, mid = 0, treb = 0, lastNow = 0, voice = 0;
  function decay(dt) {
    var k = Math.pow(0.885, dt * 60);
    beatLv *= k; if (beatLv < 0.0015) beatLv = 0;
    bass *= Math.pow(0.982, dt * 60);
    mid *= Math.pow(0.986, dt * 60);
    treb *= Math.pow(0.968, dt * 60);
  }

  /* ================================================================= frame */
  function frame(now) {
    var t0 = performance.now();
    try {
      if (!readySent) { readySent = true; sendReady(); }
      S.frames++;
      var dt = lastNow ? Math.min(0.10, (now - lastNow) / 1000) : 0.016;
      lastNow = now;
      if (!rm) decay(dt);

      paintLyrics(S.t);
      if (!rm) animateDecor(now * 0.001);
      /* the mouth opens on vocal energy, not on a timer */
      voice += ((beatLv * 0.45 + bass * 0.8 + treb * 0.35) - voice) * Math.min(1, dt * 9);
      lipTarget = Math.round(clamp(voice, 0, 1) * 4);
      showLip(lipTarget);
      pulse(S.t);
      S.js = performance.now() - t0;
    } catch (e) {
      S.err = String(e && e.message ? e.message : e);
      console.error('[501] frame', e);
    }
    requestAnimationFrame(frame);
  }

  function animateDecor(t) {
    for (var i = 0; i < fEls.length; i++) {
      var f = fEls[i];
      var dy = Math.sin(t * 0.28 * f.sp + f.ph) * 7;
      var dx = Math.cos(t * 0.19 * f.sp + f.ph) * 3;
      f.el.style.transform = 'translate3d(' + (f.x + dx).toFixed(1) + 'px,' + (f.y + dy).toFixed(1) +
        'px,0) rotate(' + (f.rot + Math.sin(t * 0.21 + f.ph) * 2.2).toFixed(2) + 'deg)';
    }
    for (var j = 0; j < gEls.length; j++) {
      gEls[j].style.opacity = (0.12 + j * 0.015 + beatLv * 0.05).toFixed(3);
    }
  }

  function pulse(t) {
    /* Beat acts on small compositor layers only: re-rasterising the full-bleed
       canvas or the whole type block every frame would blow the 8ms budget. */
    numEl.style.transform = 'rotate(-4.5deg) scale(' + (1 + beatLv * 0.022).toFixed(3) + ')';
    echoEl.style.transform = 'rotate(-2.4deg) scale(' + (1 + beatLv * 0.012).toFixed(3) + ')';
    lipWrap.style.opacity = (0.42 + beatLv * 0.24).toFixed(3);

    var prog = 0;
    if (curLine) {
      var lt = isFinite(curLine.t) ? +curLine.t : 0;
      var ld = (isFinite(curLine.dur) && +curLine.dur > 0) ? +curLine.dur : 3;
      prog = clamp((S.t - lt) / ld, 0, 1);
    }
    var bw = Math.round(LM.perRow * LM.perChar);
    var bh = Math.round(Math.max(5, LM.size * 0.26));
    if (bw !== underW) {
      underW = bw;
      underEl.style.left = LM.x0.toFixed(1) + 'px';
      underEl.style.top = (LM.y0 + LM.rows * LM.lh - bh * 0.35).toFixed(1) + 'px';
      underEl.style.width = bw + 'px';
      underEl.style.height = bh + 'px';
    }
    underEl.style.transform = 'scaleX(' + (0.015 + prog * 0.985).toFixed(4) + ')';
  }

  /* ============================================================== line UI */
  var drawnIdx = -999;

  function renderLineUI(idx) {
    var line = (idx >= 0 && idx < S.lines.length) ? S.lines[idx] : S.lines[0] || null;
    buildChars(line);
    buildGhost(idx < 0 ? 0 : idx);
    var total = S.lines.length;
    if (total > 0) {
      numEl.textContent = pad2(clamp(idx + 1, 1, total));
      var sub = document.createElement('i');
      sub.textContent = '/' + pad2(total);
      numEl.appendChild(sub);
      numEl.style.display = 'block';
    } else {
      numEl.textContent = '';
      numEl.style.display = 'none';
    }
    lyrEl.style.opacity = (idx < 0 && total > 0) ? '0.66' : '1';
    if (line && line.text) echoEl.style.opacity = '0.10';
    hud();
  }

  function hud() {
    var s = S.song || {};
    var nm = (typeof s.name === 'string' && s.name) ? s.name : '';
    var ar = s.artists;
    if (Array.isArray(ar)) ar = ar.filter(function (v) { return v != null; }).join(' / ');
    if (typeof ar !== 'string') ar = '';
    var txt = (nm + (ar ? '  \u00b7  ' + ar : '')).trim();
    if (txt.length > 60) txt = txt.slice(0, 60) + '\u2026';
    hudL.textContent = txt || '\u2014';
    hudR.textContent = S.lines.length ? (pad2(clamp(S.idx + 1, 0, S.lines.length)) + ' / ' + pad2(S.lines.length)) : 'INSTRUMENTAL';
  }

  /* ============================================================== protocol */
  function sendReady() {
    try { P.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[501] ready', e); }
  }

  function setAccent(a) {
    if (!a || !a.length) return;
    var r = +a[0], g = +a[1], b = +a[2];
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return;
    ACC = [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
    var L = lum(ACC), mk = ACC;
    if (L > 0.58) {
      var f = 0.58 / Math.max(0.001, L);
      mk = [Math.round(ACC[0] * f), Math.round(ACC[1] * f), Math.round(ACC[2] * f)];
    }
    var st = document.documentElement.style;
    st.setProperty('--accent', 'rgb(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ')');
    st.setProperty('--mark', 'rgb(' + mk[0] + ',' + mk[1] + ',' + mk[2] + ')');
  }

  function normLines(arr) {
    var out = [];
    if (!arr || !arr.length) return out;
    var n = Math.min(arr.length, 3000);
    for (var i = 0; i < n; i++) {
      var l = arr[i];
      if (!l || typeof l !== 'object') continue;
      var txt = (typeof l.text === 'string') ? l.text : (l.text == null ? '' : String(l.text));
      var tt = isFinite(l.t) ? +l.t : 0;
      var dd = (isFinite(l.dur) && +l.dur > 0) ? +l.dur : 0;
      var chs = (l.chars && l.chars.length) ? l.chars : null;
      out.push({ t: tt, dur: dd, text: txt, chars: chs });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function findIdx(t) {
    var lo = 0, hi = S.lines.length - 1, r = -1;
    if (hi < 0) return -1;
    while (lo <= hi) {
      var md = (lo + hi) >> 1;
      if (S.lines[md].t <= t + 0.06) { r = md; lo = md + 1; }
      else hi = md - 1;
    }
    return r;
  }

  function onInit(p) {
    try {
      p = p || {};
      S.song = (p.song && typeof p.song === 'object') ? p.song : {};
      setAccent(p.accent);
      S.lines = normLines(p.lines);
      S.t = 0;
      S.playing = (typeof p.playing === 'boolean') ? p.playing : true;
      drawnIdx = -999;
      if (!S.lines.length) {
        lyrEl.textContent = '';
        CH = []; nCh = 0; curLine = null; curText = '';
        measureLine('');
        numEl.textContent = '';
        numEl.style.display = 'none';
        echoEl.textContent = '';
        echoEl.style.opacity = '0';
        underEl.style.opacity = '0';
        emptyEl.style.display = 'flex';
        lyrEl.style.opacity = '0';
      } else {
        emptyEl.style.display = 'none';
        lyrEl.style.opacity = '1';
        S.idx = -1;
        renderLineUI(-1);
        drawnIdx = -1;
      }
      hud();
      buildPaper();
      paintStatic();
    } catch (e) {
      S.err = String(e && e.message ? e.message : e);
      console.error('[501] init', e);
    }
  }

  function onTick(p) {
    try {
      if (!p) return;
      var tt = +p.time;
      var back = false;
      if (isFinite(tt)) {
        back = tt < S.t - 0.35;
        S.t = Math.max(0, tt);
      }
      if (typeof p.playing === 'boolean') S.playing = p.playing;
      if (S.lines.length) {
        var i = findIdx(S.t);
        if (i !== S.idx) {
          S.idx = i;
          renderLineUI(i);
          drawnIdx = i;
        } else if (back) {
          rewindChars();
        }
      }
    } catch (e) {
      S.err = String(e && e.message ? e.message : e);
      console.error('[501] tick', e);
    }
  }

  function rewindChars() {
    for (var i = 0; i < nCh; i++) {
      var c = CH[i];
      if (!c) continue;
      if (S.t < c.tm) {
        c.done = false;
        c.el.style.opacity = '0.20';
        c.el.style.transform = 'translate3d(' + (c.sx - LM.size * 0.56).toFixed(2) + 'px,' +
          (c.sy - LM.size * 0.56).toFixed(2) + 'px,0) rotate(' + c.r0.toFixed(4) +
          'rad) scale(' + c.s0.toFixed(3) + ')';
      }
    }
  }

  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    var ty = d.type;
    if (ty === 'init') onInit(d.payload || {});
    else if (ty === 'tick') onTick(d.payload || {});
    else if (ty === 'beat') {
      var b = d.payload || {};
      beatLv = Math.max(beatLv, clamp(+b.level || 0, 0, 1));
    } else if (ty === 'live') {
      var v = d.payload || {};
      if (isFinite(+v.bass)) bass = clamp(+v.bass, 0, 1);
      if (isFinite(+v.mid)) mid = clamp(+v.mid, 0, 1);
      if (isFinite(+v.treble)) treb = clamp(+v.treble, 0, 1);
    }
  });

  /* ============================================================ self-check */
  window.__stage = function () {
    var txt = '';
    if (S.idx >= 0 && S.idx < S.lines.length) {
      var l = S.lines[S.idx];
      if (l && typeof l.text === 'string') txt = l.text;
    }
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: Math.round(S.js * 100) / 100,
      err: S.err || '',
      text: txt,
      gl: false,
      rm: !!rm
    };
  };

  /* ================================================================== boot */
  window.addEventListener('resize', function () {
    try {
      layout();
      buildTears();
      if (S.lines.length) { renderLineUI(S.idx); drawnIdx = S.idx; }
      else measureLine('');
    } catch (e) {
      S.err = String(e && e.message ? e.message : e);
      console.error('[501] resize', e);
    }
  });

  function boot() {
    try {
      layout();
      setAccent(ACC);
      buildTears();
      measureLine('');
      hud();
    } catch (e) {
      S.err = String(e && e.message ? e.message : e);
      console.error('[501] boot', e);
    }
    requestAnimationFrame(frame);
    setTimeout(function () {
      if (!readySent) { readySent = true; sendReady(); }
    }, 600);
  }

  boot();
})();
</script>
</body>
</html>
