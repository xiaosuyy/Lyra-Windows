      alpha: 0.18 + (((attempt * 17) % 7) / 7) * 0.5
    });
  }
  dustField = { serial: layout.serial, list: motes };
  return dustField;
}

function drawDust(pen, layout, seconds) {
  var level = qualityState.level;
  if (level <= 0 || stageState.rm) { return; }
  var field = ensureDustField(layout);
  var count = Math.min(field.list.length, level >= 2 ? 52 : 24);
  var live = stageState.live || { level: 0, treble: 0 };
  var backgroundBoost = 0.45 + live.level * 0.8 + live.treble * 0.3;
  pen.save();
  pen.globalCompositeOperation = 'lighter';
  for (var index = 0; index < count; index++) {
    var mote = field.list[index];
    var swayX = Math.sin(seconds * 0.33 + mote.phase) * mote.sway;
    var swayY = Math.cos(seconds * 0.24 + mote.phase * 1.7) * mote.sway * 0.7;
    var shimmer = 0.55 + 0.45 * Math.sin(seconds * 1.7 + mote.phase * 3);
    pen.globalAlpha = clampAlpha(mote.alpha * shimmer * backgroundBoost * 0.5);
    pen.fillStyle = 'rgba(255, 226, 178, 1)';
    startPath(pen);
    pen.arc(mote.x + swayX, mote.y + swayY, mote.radius, 0, Math.PI * 2);
    pen.fill();
  }
  pen.restore();
}

function drawBeatWash(pen, layout, seconds) {
  var beats = stageState.beats || [];
  var energy = 0;
  var stamp = nowMs();
  for (var index = 0; index < beats.length; index++) {
    var age = (stamp - beats[index].at) / 1000;
    if (age >= 0 && age < 0.5) { energy = Math.max(energy, beats[index].level * (1 - age / 0.5)); }
  }
  if (energy <= 0.02) { return; }
  var anchor = layout.mug;
  pen.save();
  pen.globalCompositeOperation = 'lighter';
  glowSpot(pen, anchor.cx, anchor.cy, layout.unit * 0.5, [255, 176, 104], 0.05 * energy);
  pen.restore();
  /* 咖啡面上的涟漪 */
  var rimY = layout.mug.cy - layout.mug.bodyH * 0.45;
  pen.save();
  startPath(pen);
  pen.ellipse(anchor.cx, rimY, layout.mug.bodyW * 0.38 * (1 + energy * 0.1), layout.mug.bodyH * 0.09, 0, 0, Math.PI * 2);
  pen.strokeStyle = 'rgba(255, 214, 160,' + clampAlpha(0.2 * energy) + ')';
  pen.lineWidth = Math.max(1, layout.mug.bodyW * 0.012);
  pen.stroke();
  pen.restore();
}

/* ---------- 9j · 歌词：手记纸上的逐字上墨 ---------- */
var lyricCache = null;
var glyphCache = { spec: '', widths: {}, count: 0 };

function resetGlyphCache() {
  glyphCache = { spec: '', widths: {}, count: 0 };
}

function measureGlyph(pen, glyph, spec) {
  if (glyphCache.spec !== spec) {
    glyphCache.spec = spec;
    glyphCache.widths = {};
    glyphCache.count = 0;
  }
  var cached = glyphCache.widths[glyph];
  if (typeof cached === 'number') { return cached; }
  if (glyphCache.count > 3600) {
    glyphCache.widths = {};
    glyphCache.count = 0;
  }
  var width = 0;
  try { width = pen.measureText(glyph).width; }
  catch (err) { width = 12; reportError('measureText', err); }
  if (!(width >= 0)) { width = 12; }
  glyphCache.widths[glyph] = width;
  glyphCache.count += 1;
  return width;
}

function rowWidthOf(chars) {
  var total = 0;
  for (var index = 0; index < chars.length; index++) { total += chars[index].width; }
  return total;
}

function buildLyricRows(pen, line, maxWidth, fontSize) {
  var spec = '600 ' + Math.round(fontSize) + 'px ' + LYRIC_FONT_STACK;
  pen.font = spec;
  var text = line.text;
  var glyphs = [];
  for (var index = 0; index < text.length; index++) {
    var glyph = text.charAt(index);
    glyphs.push({
      c: glyph,
      width: measureGlyph(pen, glyph, spec),
      time: isFinite(line.charTimes[index]) ? line.charTimes[index] : line.t
    });
  }
  var rows = [];
  var current = [];
  var currentWidth = 0;
  for (var glyphIndex = 0; glyphIndex < glyphs.length; glyphIndex++) {
    var item = glyphs[glyphIndex];
    if (current.length > 0 && currentWidth + item.width > maxWidth) {
      var isClosing = CLOSING_PUNCT.indexOf(item.c) >= 0;
      if (isClosing && currentWidth + item.width <= maxWidth * 1.14) {
        current.push(item);
        currentWidth += item.width;
        continue;
      }
      var carry = [];
      var spaceAt = -1;
      for (var back = current.length - 1; back >= 0 && current.length - back <= 26; back--) {
        if (current[back].c === ' ') { spaceAt = back; break; }
      }
      if (/[A-Za-z0-9]/.test(item.c) && spaceAt > 0) {
        carry = current.splice(spaceAt + 1);
      }
      rows.push({ chars: current.slice(0), width: rowWidthOf(current) });
      while (carry.length > 0 && carry[0].c === ' ') { carry.shift(); }
      current = carry;
      currentWidth = rowWidthOf(current);
    }
    current.push(item);
    currentWidth += item.width;
  }
  if (current.length > 0) { rows.push({ chars: current.slice(0), width: rowWidthOf(current) }); }
  return rows;
}

function fitLyricLine(pen, line, paper, baseFont) {
  var maxRows = paper.h > 420 ? 3 : 4;
  var budgetHeight = paper.innerH * 0.68;
  var fontSize = baseFont;
  var rows = [];
  var lineHeight = baseFont * 1.42;
  for (var attempt = 0; attempt < 9; attempt++) {
    rows = buildLyricRows(pen, line, paper.innerW, fontSize);
    lineHeight = fontSize * 1.42;
    var fits = rows.length <= maxRows && rows.length * lineHeight <= budgetHeight;
    if (fits || fontSize <= baseFont * 0.4) { break; }
    fontSize *= 0.9;
  }
  return { rows: rows, fontSize: fontSize, lineHeight: lineHeight };
}

function getLyricPageLayout(pen, layout) {
  var paper = layout.paper;
  var baseFont = paper.h * 0.100;
  var key = layout.serial + '|' + (stageState.generation || 0) + '|' + stageState.idx + '|' + stageState.lines + '|' + Math.round(baseFont);
  if (lyricCache && lyricCache.key === key) { return lyricCache; }
  var cache = {
    key: key,
    rows: [],
    nextRows: [],
    fontSize: baseFont,
    nextSize: baseFont * 0.56,
    lineHeight: baseFont * 1.42,
    nextLineHeight: baseFont * 0.8,
    text: '',
    index: stageState.idx
  };
  var list = stageState.lrcLines;
  if (list.length > 0) {
    var activeIndex = stageState.idx >= 0 ? stageState.idx : 0;
    var active = list[activeIndex];
    if (active) {
      var fitted = fitLyricLine(pen, active, paper, baseFont);
      cache.rows = fitted.rows;
      cache.fontSize = fitted.fontSize;
      cache.lineHeight = fitted.lineHeight;
      cache.text = active.text;
      var next = list[activeIndex + 1];
      if (next) {
        var nextFitted = fitLyricLine(pen, next, paper, baseFont * 0.56);
        cache.nextRows = nextFitted.rows.slice(0, 2);
        cache.nextSize = nextFitted.fontSize;
        cache.nextLineHeight = nextFitted.lineHeight;
      }
    }
  }
  lyricCache = cache;
  return cache;
}

function paintedCharCount(line, seconds) {
  var times = line.charTimes;
  var limit = Math.min(times.length, 2048);
  var count = 0;
  for (var index = 0; index < limit; index++) {
    if (seconds >= times[index] - 0.002) { count = index + 1; }
    else { break; }
  }
  return count;
}

function drawLyricPage(pen, layout, seconds) {
  var paper = layout.paper;
  ensureInkRamp();
  pen.save();
  pen.translate(paper.cx, paper.cy);
  pen.rotate(paper.rot);
  if (stageState.lines > 0) { drawLyricBody(pen, layout, seconds); }
  else { drawEmptyLyricState(pen, layout, seconds); }
  /* 让字也吃到纸的颗粒，像真的印上去 */
  if (qualityState.level >= 2 && grainPattern) {
    paintGrain(pen, -paper.w / 2, -paper.h / 2, paper.w, paper.h, 0.32);
  }
  drawPaperMetadata(pen, layout);
  pen.restore();
}

function drawLyricBody(pen, layout, seconds) {
  var paper = layout.paper;
  var list = stageState.lrcLines;
  var activeIndex = stageState.idx >= 0 ? stageState.idx : 0;
  var active = list[activeIndex];
  if (!active) { return; }
  var page = getLyricPageLayout(pen, layout);
  if (!page.rows.length) { return; }

  var innerLeft = -paper.w / 2 + paper.padX;
  var top = -paper.h / 2 + paper.padTop + page.lineHeight * 0.92;
  var painted = paintedCharCount(active, seconds);
  var cursor = 0;
  var accent = stageState.accent;

  pen.textAlign = 'left';
  pen.textBaseline = 'alphabetic';
  pen.font = '600 ' + Math.round(page.fontSize) + 'px ' + LYRIC_FONT_STACK;

  for (var rowIndex = 0; rowIndex < page.rows.length; rowIndex++) {
    var row = page.rows[rowIndex];
    var baseline = top + rowIndex * page.lineHeight;
    var paintedWidth = 0;
    var runningX = innerLeft;
    for (var charIndex = 0; charIndex < row.chars.length; charIndex++) {
      if (cursor + charIndex < painted) { paintedWidth = runningX + row.chars[charIndex].width - innerLeft; }
      runningX += row.chars[charIndex].width;
    }
    /* 马克笔划过的底色（在字下面） */
    if (paintedWidth > 1) {
      pen.save();
      pen.fillStyle = rgbaString(accent, 0.16);
      pen.fillRect(
        innerLeft - page.fontSize * 0.06,
        baseline - page.fontSize * 0.78,
        paintedWidth + page.fontSize * 0.06,
        page.fontSize * 0.94
      );
      pen.fillStyle = rgbaString(accent, 0.30);
      pen.fillRect(innerLeft - page.fontSize * 0.06, baseline + page.fontSize * 0.14, paintedWidth + page.fontSize * 0.06, Math.max(1, page.fontSize * 0.05));
      pen.restore();
    }
    /* 逐字上墨 */
    var drawX = innerLeft;
    for (var glyphIndex = 0; glyphIndex < row.chars.length; glyphIndex++) {
      var item = row.chars[glyphIndex];
      var charNumber = cursor + glyphIndex;
      var rampIndex = 0;
      if (charNumber < painted) {
        var since = seconds - item.time;
        rampIndex = since < 0.18 ? Math.round(12 + (since / 0.18) * 11) : 23;
        rampIndex = Math.max(0, Math.min(23, rampIndex));
      }
      pen.fillStyle = inkRamp[rampIndex];
      pen.fillText(item.c, drawX, baseline);
      drawX += item.width;
    }
    cursor += row.chars.length;
  }

  /* 页边的一小竖：正在唱的那一行 */
  if (stageState.idx >= 0) {
    pen.fillStyle = rgbaString(accent, 0.55);
    pen.fillRect(innerLeft - page.fontSize * 0.42, top - page.fontSize * 0.78, Math.max(1.5, page.fontSize * 0.07), page.fontSize * 0.9);
  }

  /* 下一句：淡淡的，提前看到 */
  if (page.nextRows.length > 0 && stageState.idx >= 0) {
    var previewTop = top + (page.rows.length - 1) * page.lineHeight + page.nextLineHeight * 1.5;
    if (previewTop + page.nextRows.length * page.nextLineHeight < paper.h / 2 - paper.padBottom * 0.85) {
      pen.save();
      pen.globalAlpha = 0.44;
      pen.strokeStyle = 'rgba(58, 40, 24, 0.30)';
      pen.lineWidth = 1;
      pen.setLineDash([Math.max(2, page.nextSize * 0.16), Math.max(3, page.nextSize * 0.3)]);
      pen.beginPath();
      pen.moveTo(innerLeft, previewTop - page.nextLineHeight * 0.72);
      pen.lineTo(innerLeft + paper.innerW * 0.34, previewTop - page.nextLineHeight * 0.72);
      pen.stroke();
      pen.setLineDash([]);
      pen.font = '600 ' + Math.round(page.nextSize) + 'px ' + LYRIC_FONT_STACK;
      pen.fillStyle = 'rgba(44, 28, 16, 0.62)';
      for (var nextRowIndex = 0; nextRowIndex < page.nextRows.length; nextRowIndex++) {
        var nextRow = page.nextRows[nextRowIndex];
        var nextX = innerLeft;
        var nextBaseline = previewTop + nextRowIndex * page.nextLineHeight;
        for (var nextCharIndex = 0; nextCharIndex < nextRow.chars.length; nextCharIndex++) {
          pen.fillText(nextRow.chars[nextCharIndex].c, nextX, nextBaseline);
          nextX += nextRow.chars[nextCharIndex].width;
        }
      }
      pen.restore();
    }
  }
}

function drawEmptyLyricState(pen, layout, seconds) {
  var paper = layout.paper;
  var innerLeft = -paper.w / 2 + paper.padX;
  var recordRadius = Math.min(paper.h * 0.155, paper.w * 0.17);
  var centerX = innerLeft + recordRadius;
  var centerY = -paper.h / 2 + paper.padTop + recordRadius * 0.95;

  paintRecordDisc(pen, centerX, centerY, recordRadius, [156, 96, 54], 0.82 + 0.18 * Math.sin(seconds * 0.8));

  var textX = centerX + recordRadius + paper.h * 0.055;
  var titleSize = Math.round(paper.h * 0.052);
  var subSize = Math.round(paper.h * 0.034);
  pen.textAlign = 'left';
  pen.textBaseline = 'alphabetic';
  pen.fillStyle = 'rgba(44, 28, 16, 0.86)';
  pen.font = '600 ' + titleSize + 'px ' + LYRIC_FONT_STACK;
  pen.fillText('这张唱片没有歌词', textX, centerY - paper.h * 0.012);
  pen.fillStyle = 'rgba(44, 28, 16, 0.48)';
  pen.font = '500 ' + subSize + 'px ' + LYRIC_FONT_STACK;
  pen.fillText('把耳朵交给唱针', textX, centerY + subSize * 1.55);
  pen.fillStyle = rgbaString(stageState.accent, 0.42);
  pen.font = '600 ' + Math.max(7, Math.round(paper.h * 0.022)) + 'px ' + MONO_FONT_STACK;
  pen.fillText('INSTRUMENTAL TAKE', textX, centerY + subSize * 2.9);

  /* 页脚一枚手盖的章 */
  pen.save();
  pen.translate(innerLeft + paper.w * 0.04, paper.h / 2 - paper.padBottom * 0.98);
  pen.rotate(-0.05);
  pen.strokeStyle = rgbaString(stageState.accent, 0.34);
  pen.lineWidth = Math.max(1, paper.h * 0.0035);
  pen.strokeRect(0, 0, paper.w * 0.34, paper.h * 0.058);
  pen.fillStyle = rgbaString(stageState.accent, 0.44);
  pen.font = '600 ' + Math.max(7, Math.round(paper.h * 0.026)) + 'px ' + MONO_FONT_STACK;
  pen.fillText('NO LYRIC SHEET', paper.w * 0.022, paper.h * 0.040);
  pen.restore();
}

function fitTextWidth(pen, text, maxWidth) {
  if (!text) { return ''; }
  if (pen.measureText(text).width <= maxWidth) { return text; }
  var cut = text;
  var guard = 0;
  while (cut.length > 1 && pen.measureText(cut + '…').width > maxWidth && guard < 80) {
    cut = cut.slice(0, cut.length - 1);
    guard += 1;
  }
  return cut + '…';
}

function drawPaperMetadata(pen, layout) {
  var paper = layout.paper;
  var bottom = paper.h / 2 - paper.padBottom * 0.42;
  var nameSize = Math.max(8, Math.round(paper.h * 0.027));
  var artistSize = Math.max(7, Math.round(paper.h * 0.023));
  pen.textAlign = 'left';
  pen.textBaseline = 'alphabetic';

  pen.font = '600 ' + nameSize + 'px ' + MONO_FONT_STACK;
  pen.fillStyle = 'rgba(56, 38, 24, 0.60)';
  var songName = stageState.track.name ? stageState.track.name.toUpperCase() : 'UNTITLED TAKE';
  pen.fillText(fitTextWidth(pen, songName, paper.innerW * 0.6), -paper.w / 2 + paper.padX, bottom);

  pen.font = '500 ' + artistSize + 'px ' + MONO_FONT_STACK;
  pen.fillStyle = 'rgba(56, 38, 24, 0.44)';
  var artistLabel = stageState.track.artists || '未知制作人';
  pen.fillText(fitTextWidth(pen, artistLabel, paper.innerW * 0.6), -paper.w / 2 + paper.padX, bottom + artistSize * 1.5);

  pen.textAlign = 'right';
  pen.font = '600 ' + nameSize + 'px ' + MONO_FONT_STACK;
  pen.fillStyle = 'rgba(56, 38, 24, 0.40)';
  var counter = stageState.lines > 0
    ? String(Math.max(0, stageState.idx) + 1).padStart(2, '0') + ' / ' + String(stageState.lines).padStart(2, '0')
    : '-- / --';
  pen.fillText(counter, paper.w / 2 - paper.padX, bottom);
  pen.textAlign = 'left';
}

/* ---------- 9k · 桌上的小照片：封面印张（有就画，没有就空着） ---------- */
var coverState = { image: null, url: '', ready: false, failed: false };

function loadCover(url) {
  var source = typeof url === 'string' ? url.trim() : '';
  if (!source) { coverState = { image: null, url: '', ready: false, failed: false }; return; }
  if (coverState.url === source && (coverState.ready || coverState.failed)) { return; }
  try {
    var image = new Image();
    coverState = { image: image, url: source, ready: false, failed: false };
    image.onload = function () {
      if (image.naturalWidth > 0) { coverState.ready = true; }
      else { coverState.failed = true; }
    };
    image.onerror = function () {
      coverState.failed = true;
      try { console.warn('[420 crate-light] 封面没能载入，桌面留白：' + source); } catch (ignored) { /* 无控制台 */ }
    };
    image.src = source;
  } catch (err) {
    coverState = { image: null, url: source, ready: false, failed: true };
    reportError('cover.load', err);
  }
}

function drawCoverPrint(pen, layout) {
  if (!coverState.ready || !coverState.image) { return; }
  var print = layout.coverPrint;
  var size = print.size;
  if (!(size > 8)) { return; }
  pen.save();
  pen.translate(print.cx, print.cy);
  pen.rotate(print.rot);
  castShadow(pen, size * 0.16, size * 0.2, size * 0.78, size * 0.72, 0.42, 0.02);
  pen.fillStyle = 'rgba(250, 244, 230, 0.95)';
  pen.fillRect(-size * 0.54, -size * 0.54, size * 1.08, size * 1.08);
  var painted = drawImageSource(pen, coverState.image, -size * 0.47, -size * 0.47, size * 0.94, size * 0.94);
  if (!painted) {
    pen.fillStyle = 'rgba(120, 96, 64, 0.5)';
    pen.fillRect(-size * 0.47, -size * 0.47, size * 0.94, size * 0.94);
  }
  /* 压进场景的暖色 */
  pen.globalCompositeOperation = 'overlay';
  pen.fillStyle = 'rgba(255, 168, 92, 0.30)';
  pen.fillRect(-size * 0.47, -size * 0.47, size * 0.94, size * 0.94);
  pen.globalCompositeOperation = 'source-over';
  /* 一条胶带 */
  pen.fillStyle = 'rgba(236, 214, 168, 0.55)';
  pen.fillRect(-size * 0.22, -size * 0.66, size * 0.44, size * 0.2);
  pen.restore();
}

/* ---------- 10 · 画布与主循环 ---------- */
var stageCanvas = document.getElementById('stage-canvas');
var stageCtx = stageCanvas ? stageCanvas.getContext('2d') : null;
var stageView = { width: 0, height: 0, dpr: 1, serial: 0, layout: null };
var stageClock = { seconds: 0, lastFrame: 0, driftX: 0, driftY: 0 };
var qualityState = { level: 2, frameMs: 4, adjustedAt: 0, degradedNotice: false };

function resizeStage() {
  var width = Math.round(finiteNumber(stageCanvas ? stageCanvas.clientWidth : 0, 0) || finiteNumber(window.innerWidth, 0));
  var height = Math.round(finiteNumber(stageCanvas ? stageCanvas.clientHeight : 0, 0) || finiteNumber(window.innerHeight, 0));
  if (!(width > 0)) { width = 1440; }
  if (!(height > 0)) { height = 900; }
  width = Math.round(clampValue(width, 240, 3840));
  height = Math.round(clampValue(height, 240, 3840));
  var dpr = clampValue(window.devicePixelRatio, 1, 2);
  if (width * height * dpr * dpr > 3400000) {
    dpr = Math.max(1, Math.sqrt(3400000 / (width * height)));
  }
  stageView.width = width;
  stageView.height = height;
  stageView.dpr = dpr;
  stageView.serial += 1;
  if (stageCanvas) {
    stageCanvas.width = Math.max(1, Math.round(width * dpr));
    stageCanvas.height = Math.max(1, Math.round(height * dpr));
  }
  if (stageCtx) { stageCtx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  stageView.layout = buildLayout(width, height);
  lyricCache = null;
  dustField = null;
  resetGlyphCache();
  scheduleBackdrop();
}

function updateCameraDrift() {
  var level = qualityState.level;
  if (level <= 0 || stageState.rm) { stageClock.driftX = 0; stageClock.driftY = 0; return; }
  var seconds = stageClock.seconds;
  var amount = level >= 2 ? 3.2 : 1.6;
  stageClock.driftX = Math.sin(seconds * 0.21) * amount;
  stageClock.driftY = Math.cos(seconds * 0.17) * amount * 0.7;
}

function drawScene() {
  var pen = stageCtx;
  var width = stageView.width;
  var height = stageView.height;
  var layout = stageView.layout;
  if (!pen || !(width > 0) || !(height > 0) || !layout) { return; }

  pen.setTransform(stageView.dpr, 0, 0, stageView.dpr, 0, 0);
  pen.fillStyle = '#160e07';
  pen.fillRect(0, 0, width, height);

  var bleed = backdrop.bleed;
  if (backdrop.canvas) {
    drawBakedImage(
      pen, backdrop.canvas,
      -bleed + stageClock.driftX, -bleed + stageClock.driftY,
      width + bleed * 2, height + bleed * 2
    );
  }

  var seconds = stageClock.seconds;
  drawCoverPrint(pen, layout);
  drawMpcDynamic(pen, layout, seconds);
  drawSteam(pen, layout, seconds);
  drawBeatWash(pen, layout, seconds);
  drawDust(pen, layout, seconds);
  drawLyricPage(pen, layout, stageState.t);
}

function renderFrame(timestamp) {
  stageState.frames += 1;
  var frameStart = nowMs();
  var stamp = finiteNumber(timestamp, frameStart);
  if (stageClock.lastFrame > 0) {
    var delta = clampValue((stamp - stageClock.lastFrame) / 1000, 0, 0.08);
    stageClock.seconds += delta * (stageState.playing ? 1 : 0.3);
  }
  stageClock.lastFrame = stamp;
  try {
    runBackdropSteps(5.5);
    updateCameraDrift();
    drawScene();
  } catch (err) {
    reportError('frame', err);
  }
  var spent = nowMs() - frameStart;
  stageState.js = Math.round(spent * 100) / 100;
  updateQuality(spent);
  requestAnimationFrame(renderFrame);
}

function updateQuality(frameMs) {
  qualityState.frameMs = qualityState.frameMs * 0.9 + frameMs * 0.1;
  var stamp = nowMs();
  if (qualityState.adjustedAt === 0) { qualityState.adjustedAt = stamp; return; }
  if (stamp - qualityState.adjustedAt < 2600) { return; }
  if (qualityState.frameMs > 17 && qualityState.level > 0) {
    qualityState.level -= 1;
    qualityState.adjustedAt = stamp;
    if (!qualityState.degradedNotice) {
      qualityState.degradedNotice = true;
      try { console.warn('[420 crate-light] 帧耗时偏高，自动降级到 level ' + qualityState.level); } catch (ignored) { /* 无控制台 */ }
    }
  } else if (qualityState.frameMs < 7 && qualityState.level < 2) {
    qualityState.level += 1;
    qualityState.adjustedAt = stamp;
  }
}

try {
  if (window.matchMedia) {
    stageState.rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (stageState.rm) { qualityState.level = Math.min(qualityState.level, 1); }
  }
} catch (err) {
  reportError('reduced-motion', err);
}

var resizeTimer = 0;
window.addEventListener('resize', function () {
  if (resizeTimer) { clearTimeout(resizeTimer); }
  resizeTimer = setTimeout(function () {
    resizeTimer = 0;
    try { resizeStage(); } catch (err) { reportError('resize', err); }
  }, 140);
});

if (stageCanvas && stageCtx) {
  resizeStage();
  requestAnimationFrame(renderFrame);
} else {
  reportError('canvas', new Error('canvas 2d context unavailable'));
}
</script>
