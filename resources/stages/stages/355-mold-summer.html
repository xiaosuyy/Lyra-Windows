<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>发霉的夏天</title>
<style>
  :root{
    color-scheme: dark;
    --ink:#f6f0dc;
    --dust:#cdc2a2;
    --fs: clamp(21px, 3.05vw, 46px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#070a08;overflow:hidden;}
  body{
    font-family:"Songti SC","Source Han Serif SC","Noto Serif SC",SimSun,"PingFang SC","Microsoft YaHei",serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .stage{position:fixed;inset:0;overflow:hidden;background:#070a08;}
  #film{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* ---- scanner / tape lines ---- */
  .scan{
    position:absolute;inset:0;pointer-events:none;z-index:2;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,.20) 0px, rgba(0,0,0,.20) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
    opacity:.55;
  }

  /* ---- burned-in broadcast HUD ---- */
  .hud{
    position:absolute;z-index:4;pointer-events:none;
    font-family:ui-monospace,"SFMono-Regular",Menlo,"Courier New",monospace;
    font-size:clamp(9px,1.02vw,13px);
    letter-spacing:.24em;
    color:rgba(235,227,196,.60);
    text-transform:uppercase;
    text-shadow:0 0 12px rgba(0,0,0,.95),0 1px 0 rgba(0,0,0,.75);
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .tl{top:4.4vh;left:4vw;max-width:46vw;}
  .tr{top:4.4vh;right:4vw;text-align:right;}
  .bl{bottom:3.4vh;left:4vw;max-width:50vw;letter-spacing:.16em;}
  .br{bottom:3.4vh;right:4vw;letter-spacing:.14em;color:rgba(235,227,196,.75);}
  .dot{
    display:inline-block;width:.58em;height:.58em;border-radius:50%;
    background:#efd79a;box-shadow:0 0 10px rgba(239,215,154,.9);
    margin-right:.85em;vertical-align:.02em;
    animation:blink 1.7s steps(1,end) infinite;
  }
  @keyframes blink{ 0%,54%{opacity:1} 55%,100%{opacity:.10} }
  .sep{opacity:.4;padding:0 .5em;}

  /* ---- subtitles ---- */
  .subs{
    position:absolute;left:0;right:0;bottom:0;z-index:3;
    padding:0 5vw clamp(62px,12.5vh,148px);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    pointer-events:none;
  }
  .subs::before{
    content:"";position:absolute;left:-4vw;right:-4vw;bottom:0;
    height:min(62vh,560px);
    background:linear-gradient(to top,
      rgba(5,8,6,.76) 0%, rgba(5,8,6,.48) 34%, rgba(5,8,6,.18) 66%, rgba(5,8,6,0) 100%);
    pointer-events:none;
  }
  .ghost,.line{position:relative;z-index:1;margin:0;text-align:center;max-width:100%;}
  .ghost{
    font-size:clamp(12px,1.45vw,20px);
    line-height:1.5;letter-spacing:.06em;
    color:var(--dust);
    opacity:0;transition:opacity 1.1s ease;
    margin-bottom:.62em;
    max-width:min(84vw,860px);
    text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  .ghost.show{opacity:.30;}
  .ghost:empty{display:none;}

  .line{
    font-size:calc(var(--fs) * var(--k, 1));
    line-height:1.52;
    font-weight:500;
    letter-spacing:.035em;
    color:var(--ink);
    max-width:min(92vw,1120px);
    word-break:break-word;
    overflow-wrap:anywhere;
    opacity:1;
    text-shadow:
      0 2px 9px rgba(0,0,0,.96),
      0 0 30px rgba(6,10,7,.92),
      0 0 54px rgba(6,10,7,.72),
      .9px 0 0 rgba(255,72,72,.14),
      -.9px 0 0 rgba(74,232,255,.14);
    transition:opacity .28s linear;
  }
  .c{opacity:.55;transition:opacity .17s linear, text-shadow .17s linear;}
  .c.on{
    opacity:1;
    text-shadow:
      0 2px 9px rgba(0,0,0,.96),
      0 0 22px rgba(255,246,214,.34),
      .9px 0 0 rgba(255,72,72,.16),
      -.9px 0 0 rgba(74,232,255,.16);
  }

  /* ---- no-lyrics state ---- */
  .none{
    position:absolute;left:0;right:0;bottom:clamp(80px,16vh,190px);z-index:3;
    display:none;flex-direction:column;align-items:center;gap:1.1em;
    pointer-events:none;padding:0 8vw;
  }
  .none.show{display:flex;}
  .none .tag{
    font-family:ui-monospace,"Courier New",monospace;
    font-size:clamp(8px,.86vw,11px);letter-spacing:.42em;
    color:rgba(210,190,140,.50);text-transform:uppercase;
  }
  .none .msg{
    font-size:clamp(14px,1.6vw,21px);letter-spacing:.14em;
    color:rgba(236,228,203,.72);text-align:center;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
  }

  @media (max-width: 640px){
    .scan{opacity:.40;}
    .tl,.tr{top:3vh;}
    .bl,.br{bottom:2.6vh;font-size:9px;letter-spacing:.12em;}
    .bl{max-width:52vw;}
    .subs{padding:0 6vw 15vh;}
    .subs::before{height:min(66vh,460px);}
  }
  @media (prefers-reduced-motion: reduce){
    .dot{animation:none;}
    .c{transition:none;}
    .ghost{transition:none;}
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="film"></canvas>
  <div class="scan" aria-hidden="true"></div>

  <div class="hud tl"><span class="dot"></span><span id="hPlay">PLAY</span><span class="sep">/</span><span>SP</span></div>
  <div class="hud tr"><span>CH 07</span><span class="sep">·</span><span id="hDate">1987.08.14</span></div>

  <div class="subs">
    <p class="ghost" id="ghost"></p>
    <p class="line" id="line"></p>
  </div>

  <div class="none" id="none">
    <span class="tag">no subtitle track</span>
    <span class="msg">这一卷磁带里，没有留下能辨认的字</span>
  </div>

  <div class="hud bl" id="hTape">家庭录像带 03 · 未标注</div>
  <div class="hud br" id="hTc">00:00:00:00</div>
</div>
<script>
(function(){
  'use strict';

  var cv = document.getElementById('film');
  var ctx = cv.getContext('2d');
  var elLine = document.getElementById('line');
  var elGhost = document.getElementById('ghost');
  var elNone = document.getElementById('none');
  var elHPlay = document.getElementById('hPlay');
  var elHDate = document.getElementById('hDate');
  var elHTape = document.getElementById('hTape');
  var elTc = document.getElementById('hTc');

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', gl: false, rm: false, dur: 0, accent: [201, 178, 120], text: '',
    live: null, beatLevel: 0
  };

  var W = 1440, H = 900;
  var readySent = false;

  function num(v, f){ v = Number(v); return isFinite(v) ? v : f; }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function fmtDim(w, h){
    w = num(w, 0); h = num(h, 0);
    if (!(w > 8) || !(h > 8)) { w = 1440; h = 900; }
    return [Math.round(w), Math.round(h)];
  }

  function resize(){
    var d = fmtDim(window.innerWidth || document.documentElement.clientWidth,
                   window.innerHeight || document.documentElement.clientHeight);
    var cssW = d[0], cssH = d[1];
    var s = clamp(window.devicePixelRatio || 1, 1, 1.4);
    var maxPx = 2000000;
    if (cssW * cssH > 0 && cssW * cssH * s * s > maxPx) s = Math.sqrt(maxPx / (cssW * cssH));
    s = clamp(s, 0.5, 1.4);
    W = Math.max(2, Math.round(cssW * s));
    H = Math.max(2, Math.round(cssH * s));
    cv.width = W; cv.height = H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    try { buildAll(); } catch (e) { S.err = String(e && e.message || e); }
  }

  // ---------------------------------------------------------------- helpers
  function mk(w, h){
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(num(w, 1)));
    c.height = Math.max(1, Math.round(num(h, 1)));
    return c;
  }
  function rgc(r, g, b, a){
    return 'rgba(' + clamp(Math.round(num(r, 0)), 0, 255) + ',' +
                    clamp(Math.round(num(g, 0)), 0, 255) + ',' +
                    clamp(Math.round(num(b, 0)), 0, 255) + ',' +
                    clamp(num(a, 1), 0, 1).toFixed(3) + ')';
  }
  function ell(c, x, y, rx, ry, col, a){
    c.save();
    c.globalAlpha = clamp(num(a, 1), 0, 1);
    c.fillStyle = col;
    c.beginPath();
    c.ellipse(x, y, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
  function rad(c, x, y, r, stops){
    if (!(r > 0.5) || !isFinite(r)) return;
    var g = null, i;
    try {
      g = c.createRadialGradient(x, y, 0, x, y, r);
      for (i = 0; i < stops.length; i++) g.addColorStop(clamp(stops[i][0], 0, 1), stops[i][1]);
    } catch (e) { return; }
    var prev = c.fillStyle;
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = prev;
  }

  // ---------------------------------------------------------------- scene
  function sceneBg(c, w, h){
    var i, x, y, r;
    var hor = h * 0.655;

    var g = c.createLinearGradient(0, 0, 0, hor);
    g.addColorStop(0, '#9db3a0');
    g.addColorStop(0.34, '#c5cdaf');
    g.addColorStop(0.72, '#e5d9b7');
    g.addColorStop(1, '#dccfa8');
    c.fillStyle = g;
    c.fillRect(0, 0, w, hor);

    rad(c, w * 0.58, h * 0.28, w * 0.44, [
      [0, 'rgba(255,249,226,0.52)'], [0.5, 'rgba(248,238,206,0.22)'], [1, 'rgba(248,238,206,0)']
    ]);

    for (i = 0; i < 24; i++){
      x = (i / 24) * w + (Math.random() - 0.5) * w * 0.06;
      y = h * (0.155 + Math.random() * 0.07);
      ell(c, x, y, w * (0.035 + Math.random() * 0.05), h * (0.03 + Math.random() * 0.05),
          i % 3 ? '#8b9579' : '#77846c', 0.42);
    }

    var wy = h * 0.315;
    c.fillStyle = '#d6c9a4';
    c.fillRect(-w * 0.06, wy, w * 1.12, hor - wy);
    c.fillStyle = '#b3a482';
    c.beginPath();
    c.moveTo(-w * 0.06, wy); c.lineTo(w * 0.10, wy - h * 0.09);
    c.lineTo(w * 0.90, wy - h * 0.09); c.lineTo(w * 1.06, wy);
    c.closePath(); c.fill();

    // wall weathering
    for (i = 0; i < 26; i++){
      x = Math.random() * w;
      ell(c, x, wy + Math.random() * (hor - wy), w * (0.03 + Math.random() * 0.10),
          h * (0.006 + Math.random() * 0.03), i % 2 ? '#c9bd97' : '#bfb28b', 0.30);
    }
    c.fillStyle = 'rgba(80,74,56,0.16)';
    c.fillRect(-w * 0.06, wy, w * 1.12, h * 0.012);

    // doorway
    var dx0 = w * 0.355, dw0 = w * 0.082, dy0 = h * 0.435;
    c.fillStyle = 'rgba(58,52,40,0.55)';
    c.fillRect(dx0, dy0, dw0, hor - dy0);
    c.fillStyle = 'rgba(36,33,25,0.55)';
    c.fillRect(dx0 + dw0 * 0.42, dy0 + (hor - dy0) * 0.34, dw0 * 0.16, (hor - dy0) * 0.10);
    c.strokeStyle = 'rgba(120,110,84,0.35)';
    c.lineWidth = Math.max(1, w * 0.004);
    c.strokeRect(dx0, dy0, dw0, hor - dy0);

    var wx = w * 0.545, wy2 = h * 0.372, ww = w * 0.235, wh2 = h * 0.205;
    var wg = c.createLinearGradient(wx, wy2, wx, wy2 + wh2);
    wg.addColorStop(0, '#fcf6e1');
    wg.addColorStop(0.62, '#f6eecf');
    wg.addColorStop(1, '#e5d8b4');
    c.fillStyle = wg;
    c.fillRect(wx, wy2, ww, wh2);
    c.fillStyle = 'rgba(163,152,121,0.30)';
    c.fillRect(wx + ww * 0.47, wy2, ww * 0.035, wh2);
    c.fillRect(wx, wy2 + wh2 * 0.45, ww, wh2 * 0.028);
    c.strokeStyle = 'rgba(122,112,86,0.26)';
    c.lineWidth = Math.max(1, w * 0.004);
    c.strokeRect(wx, wy2, ww, wh2);

    var gg = c.createLinearGradient(0, hor, 0, h);
    gg.addColorStop(0, '#a6a377');
    gg.addColorStop(0.36, '#7f8656');
    gg.addColorStop(1, '#576241');
    c.fillStyle = gg;
    c.fillRect(0, hor, w, h - hor);

    for (i = 0; i < 9; i++){
      var sy = hor + (h - hor) * Math.pow(i / 9, 1.35);
      c.fillStyle = i % 2 ? 'rgba(232,226,190,0.09)' : 'rgba(46,56,38,0.09)';
      c.fillRect(0, sy, w, (h - hor) * (0.03 + i * 0.011));
    }

    rad(c, w * 0.53, h * 0.82, w * 0.32, [
      [0, 'rgba(240,228,186,0.26)'], [1, 'rgba(240,228,186,0)']
    ]);

    ell(c, w * 0.330, h * 0.874, w * 0.090, h * 0.024, '#3d4830', 0.40);
    ell(c, w * 0.672, h * 0.874, w * 0.084, h * 0.022, '#3d4830', 0.40);
    ell(c, w * 0.500, h * 0.886, w * 0.052, h * 0.015, '#3d4830', 0.38);

    c.strokeStyle = '#4a4230';
    c.lineWidth = Math.max(1, w * 0.012);
    c.beginPath(); c.moveTo(w * 0.10, h * 0.62); c.lineTo(w * 0.14, h * 0.02); c.stroke();
    for (i = 0; i < 26; i++){
      x = w * (0.01 + Math.random() * 0.29);
      y = h * (Math.random() * 0.40);
      r = w * (0.018 + Math.random() * 0.052);
      ell(c, x, y, r, r * (0.7 + Math.random() * 0.6), i % 4 ? '#3f4d38' : '#2e3a2a', 0.26);
    }
    for (i = 0; i < 16; i++){
      x = w * (0.60 + Math.random() * 0.42);
      y = h * (Math.random() * 0.15);
      r = w * (0.02 + Math.random() * 0.05);
      ell(c, x, y, r, r * 0.72, '#3b4a34', 0.22);
    }

    for (i = 0; i < 90; i++){
      x = Math.random() * w;
      y = hor + Math.random() * (h - hor);
      var len = h * (0.006 + Math.random() * 0.015);
      c.strokeStyle = 'rgba(182,184,134,' + (0.08 + Math.random() * 0.13).toFixed(3) + ')';
      c.lineWidth = Math.max(1, w * 0.0015);
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + (Math.random() - 0.5) * len, y - len); c.stroke();
    }
  }

  function fig(c, x, fy, hh, dir, lean){
    if (!(hh > 6)) return;
    var hr = hh * 0.105;
    var headY = fy - hh + hr;
    var shY = headY + hr * 1.55;
    var hipY = fy - hh * 0.43;
    var sw = hh * 0.155, hw = hh * 0.112;
    var body = '#6e5838', dark = '#4d3e27';

    c.save();
    c.translate(x, 0); c.rotate(lean * dir); c.translate(-x, 0);

    c.fillStyle = dark;
    for (var s = -1; s <= 1; s += 2){
      c.beginPath();
      c.moveTo(x + s * hw * 0.30, hipY);
      c.lineTo(x + s * hw * 1.02, hipY);
      c.lineTo(x + s * hw * 0.96, fy);
      c.lineTo(x + s * hw * 0.20, fy);
      c.closePath(); c.fill();
    }

    c.fillStyle = body;
    c.beginPath();
    c.moveTo(x - sw, shY);
    c.quadraticCurveTo(x - sw * 1.16, hipY - hh * 0.13, x - hw, hipY + hh * 0.02);
    c.lineTo(x + hw, hipY + hh * 0.02);
    c.quadraticCurveTo(x + sw * 1.16, hipY - hh * 0.13, x + sw, shY);
    c.quadraticCurveTo(x, shY - hh * 0.05, x - sw, shY);
    c.closePath(); c.fill();

    c.strokeStyle = body;
    c.lineWidth = Math.max(1, hh * 0.05);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(x - sw * 0.86, shY + hh * 0.02);
    c.quadraticCurveTo(x - sw * 1.38, shY + hh * 0.20, x - sw * 1.04, hipY + hh * 0.02);
    c.stroke();
    c.beginPath();
    c.moveTo(x + sw * 0.86, shY + hh * 0.02);
    c.quadraticCurveTo(x + sw * 1.42, shY + hh * 0.18, x + sw * 1.10, hipY - hh * 0.03);
    c.stroke();

    c.fillStyle = body;
    c.fillRect(x - sw * 0.30, headY + hr * 0.45, sw * 0.60, shY - headY - hr * 0.3);

    c.beginPath(); c.ellipse(x, headY, hr * 0.86, hr, 0, 0, Math.PI * 2); c.fill();

    c.fillStyle = '#453924';
    c.beginPath();
    c.ellipse(x, headY - hr * 0.20, hr * 0.92, hr * 0.80, 0, Math.PI * 0.94, Math.PI * 2.06);
    c.fill();

    // the face is chemically burned away
    rad(c, x + dir * hr * 0.05, headY + hr * 0.16, hr * 1.30, [
      [0, 'rgba(246,238,216,0.86)'],
      [0.45, 'rgba(242,231,203,0.55)'],
      [0.78, 'rgba(238,226,196,0.20)'],
      [1, 'rgba(238,226,196,0)']
    ]);
    c.fillStyle = 'rgba(244,236,212,0.42)';
    c.fillRect(x - hr * 1.25, headY + hr * 0.02, hr * 2.5, hr * 0.26);

    c.restore();
  }

  function sceneFig(c, w, h){
    var gy = h * 0.868;
    fig(c, w * 0.330, gy, h * 0.320, 1, 0.012);
    fig(c, w * 0.672, gy, h * 0.298, -1, -0.010);
    fig(c, w * 0.500, gy + h * 0.014, h * 0.178, 1, 0.006);
  }

  function sceneMold(c, w, h){
    var i, x, y, r;

    // sun-bleached light leak across the print
    try {
      c.save();
      c.translate(w * 0.28, -h * 0.05);
      c.rotate(0.30);
      var lg = c.createLinearGradient(0, 0, 0, h * 0.46);
      lg.addColorStop(0, 'rgba(255,240,200,0)');
      lg.addColorStop(0.42, 'rgba(255,238,192,0.20)');
      lg.addColorStop(1, 'rgba(255,238,192,0)');
      c.fillStyle = lg;
      c.fillRect(-w * 0.25, 0, w * 1.0, h * 0.46);
      c.restore();
    } catch (e) {}

    for (i = 0; i < 14; i++){
      x = Math.random() * w; y = Math.random() * h;
      r = w * (0.07 + Math.random() * 0.15);
      rad(c, x, y, r, (i % 3 !== 1)
        ? [[0, 'rgba(52,84,66,0.13)'], [0.55, 'rgba(52,84,66,0.07)'], [1, 'rgba(52,84,66,0)']]
        : [[0, 'rgba(158,104,98,0.11)'], [0.55, 'rgba(158,104,98,0.05)'], [1, 'rgba(158,104,98,0)']]);
    }
    for (i = 0; i < 7; i++){
      x = Math.random() * w; y = Math.random() * h;
      r = w * (0.05 + Math.random() * 0.13);
      c.strokeStyle = 'rgba(120,140,110,0.15)';
      c.lineWidth = Math.max(1, w * 0.0025);
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
    }
    for (i = 0; i < 9; i++){
      x = Math.random() * w;
      c.strokeStyle = 'rgba(250,246,224,' + (0.05 + Math.random() * 0.09).toFixed(3) + ')';
      c.lineWidth = Math.max(1, w * (0.0008 + Math.random() * 0.002));
      c.beginPath();
      c.moveTo(x, -h * 0.05);
      c.bezierCurveTo(x + w * 0.01, h * 0.3, x - w * 0.012, h * 0.65, x + w * 0.004, h * 1.05);
      c.stroke();
    }
    for (i = 0; i < 60; i++){
      x = Math.random() * w; y = Math.random() * h;
      c.fillStyle = 'rgba(30,34,26,' + (0.09 + Math.random() * 0.22).toFixed(3) + ')';
      c.beginPath();
      c.arc(x, y, Math.max(0.6, w * 0.0012 * (0.6 + Math.random())), 0, Math.PI * 2);
      c.fill();
    }
  }

  function makeGrain(n, w, h){
    var out = [], k, i, len, v, img, cc, c;
    for (k = 0; k < n; k++){
      c = mk(w, h);
      cc = c.getContext('2d');
      if (!cc) { out.push(c); continue; }
      img = null;
      try { img = cc.createImageData(c.width, c.height); } catch (e) { out.push(c); continue; }
      var d = img.data;
      len = d.length;
      for (i = 0; i < len; i += 4){
        v = 112 + ((Math.random() * 86) | 0) - 43;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      cc.putImageData(img, 0, 0);
      out.push(c);
    }
    return out;
  }

  var L = { base: null, fig: null, mold: null, grain: [], vig: null, w: 0, h: 0 };

  function softBlit(dst, src, w, h, blur){
    dst.setTransform(1, 0, 0, 1, 0, 0);
    dst.imageSmoothingEnabled = true;
    try { dst.imageSmoothingQuality = 'high'; } catch (e) {}
    if (blur > 0) { try { dst.filter = 'blur(' + blur.toFixed(2) + 'px)'; } catch (e) {} }
    dst.drawImage(src, 0, 0, src.width, src.height, -w * 0.02, -h * 0.02, w * 1.04, h * 1.04);
    try { dst.filter = 'none'; } catch (e) {}
  }

  function buildAll(){
    var w = Math.max(2, W), h = Math.max(2, H);
    var lw = Math.max(4, Math.round(w * 0.5)), lh = Math.max(4, Math.round(h * 0.5));

    var lo = mk(lw, lh);
    sceneBg(lo.getContext('2d'), lw, lh);
    L.base = mk(w, h);
    softBlit(L.base.getContext('2d'), lo, w, h, Math.max(1.2, w / 320));
    lo = null;

    var lo2 = mk(lw, lh);
    sceneFig(lo2.getContext('2d'), lw, lh);
    L.fig = mk(w, h);
    softBlit(L.fig.getContext('2d'), lo2, w, h, Math.max(1.0, w / 520));
    lo2 = null;

    L.mold = mk(w, h);
    sceneMold(L.mold.getContext('2d'), w, h);
    L.grain = makeGrain(3, Math.max(160, Math.round(w * 0.42)), Math.max(100, Math.round(h * 0.42)));

    L.vig = null;
    try {
      var vg = ctx.createRadialGradient(w * 0.5, h * 0.44, Math.min(w, h) * 0.10,
                                        w * 0.5, h * 0.5, Math.max(w, h) * 0.80);
      vg.addColorStop(0, 'rgba(255,255,255,1)');
      vg.addColorStop(0.52, 'rgba(208,204,180,1)');
      vg.addColorStop(0.80, 'rgba(124,126,106,1)');
      vg.addColorStop(1, 'rgba(46,52,42,1)');
      L.vig = vg;
    } catch (e) { L.vig = null; }

    L.w = w; L.h = h;
  }

  var rollY = -1, rollSpd = 1.5;

  function paint(now, dt){
    if (!L.base || L.w !== W || L.h !== H) buildAll();
    var w = W, h = H;
    if (!(w > 1) || !(h > 1)) return;
    var rm = S.rm;
    var jx = rm ? 0 : (Math.random() - 0.5) * 2.6;
    var jy = rm ? 0 : (Math.random() - 0.5) * 2.2;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0a0e0b';
    ctx.fillRect(0, 0, w, h);

    var zoom = rm ? 1.042 : 1.044 + Math.sin(now / 11000) * 0.012;
    var dw = w * zoom, dh = h * zoom;
    var ox = (w - dw) / 2 + jx;
    var oy = (h - dh) / 2 + jy;

    ctx.drawImage(L.base, ox, oy, dw, dh);

    var bass = (S.live && isFinite(S.live.bass)) ? clamp(S.live.bass, 0, 1) : 0;
    var sway = rm ? 0 : Math.sin(now / 2100) * 2.0 + bass * 2.6;

    // VHS edge ghost of the same bodies
    if (!rm){
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.16;
      ctx.drawImage(L.fig, ox + w * 0.009 + sway * 0.45, oy + sway, dw, dh);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.drawImage(L.fig, ox + sway * 0.45, oy + sway, dw, dh);

    if (!rm){
      var nb = 1 + (Math.random() < 0.4 ? 1 : 0);
      for (var b = 0; b < nb; b++){
        var bhh = h * (0.012 + Math.random() * 0.05);
        var by = Math.random() * Math.max(1, h - bhh);
        var dx = (Math.random() - 0.5) * w * 0.028;
        ctx.drawImage(cv, 0, by, w, bhh, dx, by, w, bhh);
      }
    }

    rollY += rollSpd * (dt * 60);
    if (rollY > h * 1.15) { rollY = -h * 0.25; rollSpd = 0.7 + Math.random() * 1.5; }

    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(74,104,86,0.22)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = 'rgba(222,186,116,0.10)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';

    if (L.mold) {
      ctx.globalAlpha = 0.9;
      ctx.drawImage(L.mold, 0, 0, w, h);
      ctx.globalAlpha = 1;
    }

    var ac = S.accent, ba = clamp(S.beatLevel, 0, 1);
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = rgc(ac[0], ac[1], ac[2], 0.10 + ba * 0.12);
    ctx.fillRect(0, 0, w, h);
    if (ba > 0.02){
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = rgc(238, 224, 178, 0.03 + ba * 0.07);
      ctx.fillRect(0, 0, w, h);
    }
    ctx.globalCompositeOperation = 'source-over';

    if (L.vig){
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = L.vig;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }

    // slow vertical tape roll, lifted from the graded picture itself
    if (!rm && rollY > 0 && rollY < h){
      var rbh = h * 0.05;
      var rdx = w * 0.010 + Math.sin(now / 900) * w * 0.004;
      ctx.drawImage(cv, 0, Math.max(0, rollY - rbh * 2), w, rbh, rdx, rollY, w, rbh);
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = 'rgba(255,250,230,0.045)';
      ctx.fillRect(0, rollY, w, rbh);
      ctx.globalCompositeOperation = 'source-over';
    }

    if (L.grain.length){
      var gi = ((now / 120) | 0) % L.grain.length;
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = rm ? 0.10 : 0.17;
      ctx.drawImage(L.grain[gi], 0, 0, w, h);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    var hbh = Math.max(5, h * 0.018);
    var off = rm ? 0 : (Math.random() - 0.5) * w * 0.018;
    ctx.drawImage(L.base, 0, h - hbh * 2, w, hbh * 2, off, h - hbh, w, hbh * 2);
    ctx.fillStyle = 'rgba(242,236,214,0.05)';
    ctx.fillRect(0, h - hbh, w, hbh);

    if (!rm && Math.random() < 0.5){
      var dw = w * (0.02 + Math.random() * 0.11);
      ctx.fillStyle = 'rgba(245,240,220,' + (0.10 + Math.random() * 0.18).toFixed(3) + ')';
      ctx.fillRect(Math.random() * Math.max(1, w - dw), Math.random() * h, dw, Math.max(1, h * 0.002));
    }
  }

  // ---------------------------------------------------------------- lyrics
  var chSpans = [], lastLit = -1, domIdx = -2, lastOp = 1, ghostOn = false;
  var lastTc = '', lastPlay = null;

  function pad2(v){
    v = Math.max(0, Math.floor(num(v, 0)));
    return v < 10 ? '0' + v : '' + v;
  }
  function hashStr(s){
    var h = 2166136261, i;
    s = String(s == null ? '' : s);
    for (i = 0; i < s.length && i < 240; i++){
      h ^= s.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function archiveDate(seed){
    var h = hashStr(seed);
    return (1978 + (h % 14)) + '.' + pad2(1 + ((h >> 4) % 12)) + '.' + pad2(1 + ((h >> 9) % 28));
  }
  function archiveNo(seed){
    return '0' + (1 + (hashStr(seed) % 9));
  }

  function charTimes(Ln){
    var txt = Ln.text, n = Math.min(txt.length, 600), k, v;
    var ts = new Array(n);
    var cs = Ln.chars;
    var useYrc = !!(cs && cs.length && cs.length >= n * 0.55);
    if (useYrc){
      for (k = 0; k < n; k++){
        v = (k < cs.length) ? Number(cs[k] && cs[k].t) : NaN;
        ts[k] = isFinite(v) ? v : NaN;
      }
      var nxt = new Array(n), cur = Ln.t + Ln.dur;
      for (k = n - 1; k >= 0; k--){ if (isFinite(ts[k])) cur = ts[k]; nxt[k] = cur; }
      var prev = Ln.t;
      for (k = 0; k < n; k++){
        if (isFinite(ts[k])) prev = ts[k];
        else ts[k] = (prev + nxt[k]) / 2;
      }
      for (k = 0; k < n; k++) if (!isFinite(ts[k])) ts[k] = Ln.t;
    } else {
      var step = Ln.dur / Math.max(1, n);
      for (k = 0; k < n; k++) ts[k] = Ln.t + step * k;
    }
    for (k = 1; k < n; k++) if (ts[k] < ts[k - 1]) ts[k] = ts[k - 1];
    return ts;
  }

  function buildLineDom(i){
    var Ln = S.lines[i], txt = Ln.text;
    var n = Math.min(txt.length, 600), k, ch, sp;
    elLine.textContent = '';
    chSpans = [];
    var frag = document.createDocumentFragment();
    for (k = 0; k < n; k++){
      ch = txt.charAt(k);
      if (ch === ' ' || ch === '\u3000'){
        frag.appendChild(document.createTextNode(ch));
        continue;
      }
      sp = document.createElement('span');
      sp.className = 'c';
      sp.textContent = ch;
      frag.appendChild(sp);
      chSpans.push({ el: sp, t: num(Ln.ct[k], Ln.t) });
    }
    if (txt.length > n){
      sp = document.createElement('span');
      sp.className = 'c on';
      sp.textContent = '…';
      frag.appendChild(sp);
    }
    elLine.appendChild(frag);
    elLine.style.setProperty('--k', clamp(1 - (txt.length - 26) * 0.013, 0.52, 1).toFixed(3));
    lastLit = -1;
  }

  function setLit(cnt){
    var m = chSpans.length, k;
    if (cnt === lastLit) return;
    if (cnt > lastLit){
      for (k = Math.max(0, lastLit); k < cnt && k < m; k++) chSpans[k].el.classList.add('on');
    } else {
      for (k = Math.max(0, cnt); k < lastLit && k < m; k++) chSpans[k].el.classList.remove('on');
    }
    lastLit = cnt;
  }

  function setLines(raw){
    S.lines = [];
    var i, L, tx, ln;
    if (Array.isArray(raw)){
      for (i = 0; i < raw.length && i < 4000; i++){
        L = raw[i];
        if (!L || typeof L !== 'object') continue;
        tx = (L.text == null) ? '' : String(L.text);
        if (!tx.replace(/\s/g, '')) continue;
        ln = {
          t: num(L.t, 0),
          dur: Math.max(0.25, num(L.dur, 3)),
          text: tx,
          chars: Array.isArray(L.chars) ? L.chars : null
        };
        ln.ct = charTimes(ln);
        S.lines.push(ln);
      }
    }
    S.lines.sort(function(a, b){ return a.t - b.t; });
    S.idx = -1;
    domIdx = -2;
    lastLit = -1;
    lastOp = 1;
    ghostOn = false;
    chSpans = [];
    elLine.textContent = '';
    elLine.style.opacity = '0';
    elGhost.textContent = '';
    elGhost.classList.remove('show');
    if (S.lines.length) elNone.classList.remove('show');
    else elNone.classList.add('show');
  }

  function seek(t){
    var lo = 0, hi = S.lines.length - 1, ans = -1, mid, k;
    for (k = 0; k < 26 && lo <= hi; k++){
      mid = (lo + hi) >> 1;
      if (S.lines[mid].t <= t + 0.001){ ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function paintLyrics(){
    var n = S.lines.length;
    if (!n){
      if (!elNone.classList.contains('show')) elNone.classList.add('show');
      return;
    }
    var i = S.idx;
    if (i < 0){
      if (domIdx !== -1){
        domIdx = -1;
        elLine.textContent = '';
        chSpans = [];
        lastLit = -1;
        elLine.style.opacity = '0';
        lastOp = 0;
        elGhost.textContent = '';
        elGhost.classList.remove('show');
        ghostOn = false;
      }
      return;
    }
    var Ln = S.lines[i];
    if (domIdx !== i){
      domIdx = i;
      buildLineDom(i);
      elLine.style.opacity = '1';
      lastOp = 1;
      if (i > 0 && S.lines[i - 1].text !== Ln.text){
        elGhost.textContent = S.lines[i - 1].text;
        ghostOn = false;
      } else {
        elGhost.textContent = '';
        elGhost.classList.remove('show');
        ghostOn = false;
      }
    }

    var t = S.t, cnt = 0, k, m = chSpans.length;
    for (k = 0; k < m; k++){
      if (chSpans[k].t <= t) cnt = k + 1;
      else break;
    }
    setLit(cnt);

    var end = Ln.t + Ln.dur;
    var op = (t > end) ? clamp(1 - (t - end) / 0.55, 0, 1) : 1;
    if (Math.abs(op - lastOp) > 0.015){
      elLine.style.opacity = op.toFixed(2);
      lastOp = op;
    }
    if (op <= 0.02){
      if (ghostOn){ elGhost.classList.remove('show'); ghostOn = false; }
    } else if (!ghostOn && elGhost.textContent){
      elGhost.classList.add('show');
      ghostOn = true;
    }
  }

  function paintHud(){
    var t = Math.max(0, num(S.t, 0));
    var s = Math.floor(t);
    var str = pad2(s / 3600) + ':' + pad2((s / 60) % 60) + ':' + pad2(s % 60) + ':' + pad2((t - s) * 25);
    if (str !== lastTc){ elTc.textContent = str; lastTc = str; }
    var pl = S.playing ? 'PLAY' : 'PAUSE';
    if (pl !== lastPlay){ elHPlay.textContent = pl; lastPlay = pl; }
  }

  var lastNow = 0;

  function frame(now){
    S.frames++;
    if (!readySent){
      readySent = true;
      try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {}
    }
    var t0 = performance.now();
    var dt = clamp((now - lastNow) / 1000, 0, 0.1);
    lastNow = now;
    try {
      paint(now, dt);
      S.idx = seek(S.t);
      S.text = S.idx >= 0 ? S.lines[S.idx].text : '';
      paintLyrics();
      paintHud();
    } catch (e) { S.err = String(e && e.message || e); }
    S.beatLevel = Math.max(0, S.beatLevel - 0.085);
    S.js = performance.now() - t0;

    requestAnimationFrame(frame);
  }

  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === 'init') {
      S.accent = Array.isArray(p.accent) ? p.accent.slice(0, 3).map(function(v){ return clamp(Math.round(num(v, 128)), 0, 255); }) : S.accent;
      S.dur = num(p.duration, 0);
      S.playing = (p.playing === undefined) ? true : !!p.playing;
      var song = (p.song && typeof p.song === 'object') ? p.song : {};
      var sname = (song.name == null) ? '' : String(song.name).trim();
      var arts = song.artists;
      if (Array.isArray(arts)) arts = arts.join(' / ');
      arts = (arts == null) ? '' : String(arts).trim();
      var seed = String(song.id == null ? '' : song.id) + '|' + sname;
      elHTape.textContent = '家庭录像带 ' + archiveNo(seed) + ' · ' + (sname || '未标注') +
                            (arts ? ' — ' + arts : '');
      elHDate.textContent = archiveDate(seed);
      lastPlay = null;
      setLines(p.lines);
    } else if (d.type === 'tick') {
      S.t = num(p.time, S.t);
      if (p.playing !== undefined) S.playing = !!p.playing;
    } else if (d.type === 'beat') {
      var bl = clamp(num(p.level, 0.4), 0, 1);
      S.beatLevel = Math.max(S.beatLevel, bl);
    } else if (d.type === 'live') {
      S.live = {
        bpm: num(p.bpm, 0), level: clamp(num(p.level, 0), 0, 1),
        bass: clamp(num(p.bass, 0), 0, 1), mid: clamp(num(p.mid, 0), 0, 1),
        treble: clamp(num(p.treble, 0), 0, 1)
      };
      if (p.playing !== undefined) S.playing = !!p.playing;
    }
  });

  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
      text: S.text, gl: S.gl, rm: S.rm
    };
  };

  S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  window.addEventListener('error', function(e){ S.err = String(e && e.message || 'error'); });
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
  setTimeout(function(){
    if (!readySent) { readySent = true; try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {} }
  }, 400);
})();
</script>
</body>
</html>
