<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>325 · 星际花火</title>
<style>
  :root{
    --ink:#06040f; --bone:#f7edd9; --gold:#e9b463; --ember:#ff7c3d;
    --teal:#57d6c4; --violet:#8a63d2; --deep:#0a0620; --acc:#d4783f;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC","STSong",SimSun,Georgia,"Times New Roman",serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#05030e; }
  body{ font-family:var(--serif); color:var(--bone); -webkit-font-smoothing:antialiased; }
  #cv{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }
  /* 油画布纹 + 颗粒：纯程序化，零外部请求；压在文字之下，不吃字的锐度 */
  #grain{ position:fixed; inset:0; pointer-events:none; z-index:1;
          mix-blend-mode:overlay; opacity:.26; background-repeat:repeat; }
  #stage{ position:fixed; inset:0; pointer-events:none; z-index:2; }

  /* ——— 顶部署名 ——— */
  #top{ position:absolute; top:clamp(16px,3.2vh,34px); left:clamp(18px,3.4vw,52px);
        right:clamp(18px,3.4vw,52px); display:flex; align-items:flex-start;
        justify-content:space-between; gap:16px; }
  #meta{ max-width:min(58vw,520px); }
  #title{ font-size:clamp(11px,1.05vw,15px); letter-spacing:.42em; text-transform:uppercase;
          color:rgba(247,237,217,.86); font-weight:600; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis;
          text-shadow:0 2px 14px rgba(0,0,0,.85); }
  #artist{ margin-top:.62em; font-size:clamp(9px,.82vw,12px); letter-spacing:.3em;
           color:rgba(233,180,99,.72); text-transform:uppercase;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sig{ font-size:clamp(9px,.8vw,11px); letter-spacing:.34em; color:rgba(247,237,217,.4);
        text-align:right; line-height:1.9; white-space:nowrap; }
  #sig b{ display:block; color:rgba(233,180,99,.66); font-weight:500; }

  /* ——— 歌词区：稳定的暗底，不靠发光 ——— */
  #wash{ position:absolute; left:-6%; right:-6%; bottom:-4vh; height:66vh;
         background:
           radial-gradient(120% 74% at 50% 74%, rgba(4,2,12,.94) 0%, rgba(5,3,15,.86) 34%, rgba(6,4,18,.52) 62%, rgba(6,4,18,0) 100%);
         -webkit-mask-image:linear-gradient(to top, #000 0%, #000 46%, rgba(0,0,0,.72) 68%, transparent 100%);
         mask-image:linear-gradient(to top, #000 0%, #000 46%, rgba(0,0,0,.72) 68%, transparent 100%);
         filter:blur(2px); }
  #lyr{ position:absolute; left:0; right:0; bottom:clamp(6vh,9.5vh,12vh);
        padding:0 clamp(20px,6vw,120px); text-align:center; }
  #inner{ max-width:min(94vw,1180px); margin:0 auto; }
  .lrow{ font-family:var(--serif); }
  #prev,#next{ color:rgba(247,237,217,.34); font-size:clamp(12px,1.34vw,19px);
               letter-spacing:.14em; line-height:1.5; white-space:nowrap;
               min-height:1.5em;
               overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 12px rgba(0,0,0,.95);
               transition:opacity .5s ease; }
  #prev{ margin-bottom:clamp(10px,1.8vh,20px); }
  #next{ margin-top:clamp(12px,2.1vh,24px); color:rgba(247,237,217,.26); }
  #cur{ font-size:clamp(21px,3.05vw,46px); line-height:1.42; font-weight:600;
        color:#fff6e4; letter-spacing:.045em; text-shadow:0 2px 3px rgba(0,0,0,.62), 0 10px 34px rgba(0,0,0,.9); }
  #cur .ch{ display:inline-block; color:rgba(233,220,201,.44);
            transition:color .22s ease, transform .28s cubic-bezier(.2,.8,.3,1), opacity .22s ease;
            transform:translateY(.10em); }
  #cur .ch.on{ color:#fff6e4; transform:none; }
  #cur .ch.sp{ transform:none; }
  #cur .ch.hot{ color:#ffd9a0; }
  #cur{ overflow-wrap:anywhere; word-break:break-word; }
  @media (prefers-reduced-motion: reduce){
    #cur .ch{ transition-duration:.01s; transform:none; }
    #prev,#next{ transition:none; }
  }

  /* ——— 无歌词 ——— */
  #empty{ display:none; text-align:center; }
  #empty.on{ display:block; }
  #empty .glyph{ font-size:clamp(14px,1.5vw,20px); letter-spacing:.7em; color:rgba(233,180,99,.6);
                 margin-bottom:.9em; }
  #empty .word{ font-size:clamp(14px,1.5vw,20px); letter-spacing:.52em; text-transform:uppercase;
                color:rgba(247,237,217,.62); }
  #empty .sub{ margin-top:.9em; font-size:clamp(10px,.92vw,12px); letter-spacing:.3em;
               color:rgba(247,237,217,.3); }
  @media (max-width:620px){
    #title{ letter-spacing:.3em; } #artist{ letter-spacing:.2em; }
    #cur{ letter-spacing:.02em; }
    #prev,#next{ letter-spacing:.06em; }
  }
  @media (max-aspect-ratio: 4/5){
    #wash{ height:54vh; }
    #lyr{ bottom:7vh; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="grain"></div>
<div id="stage">
  <div id="top">
    <div id="meta">
      <div id="title">Untitled</div>
      <div id="artist"></div>
    </div>
    <div id="sig"><b>No. 325</b>星际花火</div>
  </div>
  <div id="wash"></div>
  <div id="lyr">
    <div id="inner">
      <div id="prev" class="lrow"></div>
      <div id="cur" class="lrow"></div>
      <div id="next" class="lrow"></div>
      <div id="empty">
        <div class="glyph">✳ ❋ ✳</div>
        <div class="word">Instrumental</div>
        <div class="sub">没有歌词 · 让画面替它说话</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('cv'), cx=cv.getContext('2d');
  var W=1440, H=900;
  var lines=[], idx=-1, t=0, tt=0, playing=true, frames=0, js=0;
  var dur=0, song={name:'', artists:'', cover:''};
  var PW=420, PH=260;            // 油画缓冲 = 画布后备分辨率，显示时由合成就器拉伸
  var reduced=false;
  try{ reduced=!!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}
  var readySent=false, accent=[212,120,64];
  var pal={ a:'#d4783f', b:'#e9b463', c:'#8a63d2', d:'#57d6c4', e:'#ff7c3d', ink:'#05030e' };
  var en={ kick:0, lvl:0, bass:0, mid:0, treble:0, bpm:0, beatLvl:0, liveLvl:0 };
  var tBase=0, tAt=0;            // tick 时钟 + 本地插值
  var ui={ cur:document.getElementById('cur'), prev:document.getElementById('prev'),
           next:document.getElementById('next'), empty:document.getElementById('empty'),
           title:document.getElementById('title'), artist:document.getElementById('artist') };
  var built=-1, lastLit=-1, curChars=[];

  /* ---------- 颜色：一律数值拼装，绝不手拼 CSS 串 ---------- */
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function num(v,d){ v=+v; return isFinite(v)?v:d; }
  function nr(v,d,lo,hi){ v=num(v,d); return v<lo?lo:(v>hi?hi:v); }

  // col()：唯一颜色出口。分量取整夹取，alpha 夹 0..1，NaN 有默认值，永远拼得出合法色
  function col(r,g,b,a){
    r=Math.round(nr(r,0,0,255)); g=Math.round(nr(g,0,0,255)); b=Math.round(nr(b,0,0,255));
    var aa=Math.round(nr(a,1,0,1)*1000)/1000;
    return 'rgba('+r+','+g+','+b+','+aa+')';
  }
  // hsl()：HSL→RGB 在 JS 里算完再交给 col()，名字保留是为了不动 30 个调用点
  function hsl(h,s,l,a){
    h=num(h,0); s=nr(s,0,0,1); l=nr(l,0,0,1); a=nr(a,1,0,1);
    h=((h%360)+360)%360;
    var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r,g,b;
    if(h<60){ r=c; g=x; b=0; }
    else if(h<120){ r=x; g=c; b=0; }
    else if(h<180){ r=0; g=c; b=x; }
    else if(h<240){ r=0; g=x; b=c; }
    else if(h<300){ r=x; g=0; b=c; }
    else { r=c; g=0; b=x; }
    return col((r+m)*255,(g+m)*255,(b+m)*255,a);
  }
  // 改已有颜色的 alpha：走数值，不再用正则动字符串
  function alpha(c,a){
    var m=/^rgba?\(([^)]+)\)$/.exec(String(c==null?'':c));
    if(!m) return col(255,255,255,a);
    var p=m[1].split(',');
    if(p.length<3) return col(255,255,255,a);
    return col(p[0],p[1],p[2],a);
  }
  // 唯一的 addColorStop 入口：某一站颜色坏掉只退化这一站，不拖垮整帧
  function stop(g,off,c){
    off=nr(off,0,0,1);
    try{ g['addColorStop'](off,c); }
    catch(e){ try{ g['addColorStop'](off,'rgba(0,0,0,0)'); }catch(e2){} }
  }

  function buildPalette(acc){
    acc = (acc && acc.length>=3) ? acc : [212,120,64];
    var r=clamp(Number(acc[0])||0,0,255), g=clamp(Number(acc[1])||0,0,255), b=clamp(Number(acc[2])||0,0,255);
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
    var hh=0, ss=0, ll=(mx+mn)/510;
    if(d>0.0001){
      ss = ll>0.5 ? d/(510-mx-mn) : d/(mx+mn);
      if(mx===r) hh=((g-b)/d)%6; else if(mx===g) hh=(b-r)/d+2; else hh=(r-g)/d+4;
      hh*=60; if(hh<0) hh+=360;
    } else ss=0;
    pal.a = hsl(hh, clamp(ss,0.35,0.9), clamp(ll,0.42,0.62), 1);
    pal.b = hsl(hh+18, clamp(ss*0.92,0.4,0.85), 0.68, 1);
    pal.e = hsl(hh+6, clamp(ss*1.05,0.5,0.95), 0.55, 1);
    pal.c = hsl(hh+152, 0.52, 0.50, 1);   // 青
    pal.d = hsl(hh+196, 0.50, 0.56, 1);   // 靛蓝
    pal.m = hsl(hh+304, 0.62, 0.50, 1);   // 洋红
    pal.hue = hh;
    document.documentElement.style.setProperty('--acc', col(r,g,b,1));
  }

  /* ---------- 画布尺寸 ---------- */
  function resize(){
    var w=Math.round(window.innerWidth||0), h=Math.round(window.innerHeight||0);
    if(!isFinite(w)||w<2) w=1440;
    if(!isFinite(h)||h<2) h=900;
    W=w; H=h;

    // 画布后备分辨率 = 油画缓冲，放大交给合成器（CSS 拉伸）。
    // 以前是每帧 drawImage 放大到全屏，软件渲染下这一步就要 15ms；现在 JS 里零拷贝。
    var bs = clamp(920/Math.max(W, H*1.4), 0.32, 0.62);
    bs = Math.max(bs, 200/W, 140/H);            // 保底像素，且不破坏长宽比
    PW = Math.round(W*bs); PH = Math.round(H*bs);
    var cap=900*560;
    if(PW*PH>cap){ var k=Math.sqrt(cap/(PW*PH)); PW=Math.round(PW*k); PH=Math.round(PH*k); }
    PW=Math.max(180,PW); PH=Math.max(120,PH);
    cv.width=PW; cv.height=PH;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cx.setTransform(1,0,0,1,0,0);
    geom=null; dirty=true;
    buildGeom();            // 构图/星点/Path2D 在尺寸变化时一次算完，不进 rAF
    facePath(); ringPath();
    if(lines.length) syncIdx();
  }

  /* ---------- 颗粒/布纹（一次性生成，之后零成本） ---------- */
  function makeGrain(){
    var n=128, c=document.createElement('canvas'); c.width=n; c.height=n;
    var g=c.getContext('2d'), img=g.createImageData(n,n), d=img.data;
    for(var i=0;i<n*n;i++){
      var v=110 + (Math.random()*90-45) + (i%n%4===0?18:0);
      v=clamp(v,0,255);
      var o=i*4; d[o]=v; d[o+1]=v; d[o+2]=v; d[o+3]=255;
    }
    g.putImageData(img,0,0);
    document.getElementById('grain').style.backgroundImage='url('+c.toDataURL('image/png')+')';
  }

  /* ================= 构图 ================= */
  var geom=null;
  function hash(n){ var x=Math.sin(n*127.1+31.7)*43758.5453; return x-Math.floor(x); }

  var FPATH=null;
  function facePath(){
    if(FPATH) return FPATH;
    var p=new Path2D();
    p.moveTo(0.00,-0.500);
    p.bezierCurveTo(0.200,-0.500,0.280,-0.360,0.290,-0.200);
    p.bezierCurveTo(0.295,-0.140,0.280,-0.100,0.300,-0.060);
    p.bezierCurveTo(0.345,-0.015,0.345, 0.020,0.295, 0.045);
    p.bezierCurveTo(0.275, 0.055,0.272, 0.065,0.272, 0.085);
    p.bezierCurveTo(0.305, 0.088,0.305, 0.108,0.272, 0.118);
    p.bezierCurveTo(0.300, 0.135,0.288, 0.152,0.252, 0.163);
    p.bezierCurveTo(0.262, 0.205,0.240, 0.238,0.205, 0.256);
    p.bezierCurveTo(0.120, 0.300,0.090, 0.380,0.100, 1.030);
    p.lineTo(-0.100,1.030);
    p.bezierCurveTo(-0.145,0.340,-0.175,0.120,-0.145,-0.060);
    p.bezierCurveTo(-0.130,-0.280,-0.100,-0.440,0.000,-0.500);
    p.closePath();
    FPATH=p; return p;
  }

  var RPATH=null;
  function ringPath(){
    if(RPATH) return RPATH;
    var p=new Path2D();
    function dots(r,count,size,off){
      for(var i=0;i<count;i++){
        var a=(i/count)*Math.PI*2+off;
        p.moveTo(Math.cos(a)*r+size, Math.sin(a)*r);
        p.arc(Math.cos(a)*r, Math.sin(a)*r, size, 0, Math.PI*2);
      }
    }
    dots(1.000,44,0.0115,0);
    dots(1.062,26,0.0075,0.09);
    dots(0.938,64,0.0048,0.03);
    RPATH=p; return p;
  }

  function buildGeom(){
    var wide = (W > H*1.02);
    var s=Math.min(PW*(wide?0.92:0.78), PH*0.63, 640);
    s=Math.max(70,s);
    var cy = PH*(wide?0.40:0.335);
    var ringX=Math.min(s*0.60, PW*0.54);
    var ringY=Math.min(s*0.62, cy*0.84);
    geom={
      s:s, cx:PW*0.5, cy:cy, gap:s*0.050,
      ringX:ringX, ringY:ringY,
      flx:PW*0.5, fly:cy-s*0.075, fr:s*0.165,
      stars:(function(){ var a=[]; for(var i=0;i<70;i++){ a.push([hash(i)*PW, hash(i+99)*PH, 0.6+hash(i+7)*1.5, 0.10+hash(i+3)*0.34]); } return a; })(),
      brush:(function(){
        // 颜色串在这里一次算好：每帧零字符串分配，少给 GC 找事
        var a=[], keys=['a','b','c','d','e','m'];
        for(var i=0;i<110;i++){
          var al=0.045+hash(i+601)*0.085;
          a.push([hash(i+201)*PW, hash(i+307)*PH*0.74,
                  (7+hash(i+401)*26)*(PW/700), 0.7+hash(i+503)*2.6,
                  al, hash(i+701)*6.283,
                  (i%3===0) ? col(18,9,30,al) : alpha(pal[keys[(i*7)%6]], al)]);
        }
        return a;
      })(),
      blobs:(function(){
        var a=[], cs=['c','m','e','b','d','m','e','c'];
        for(var i=0;i<8;i++) a.push({x:0.14+hash(i+11)*0.72, y:0.10+hash(i+41)*0.66, r:0.26+hash(i+71)*0.24, c:cs[i], ph:hash(i+5)*6.283, sp:0.5+hash(i+23)*0.8});
        return a;
      })()
    };
  }

  /* ================= 背景：星云 / 深海 ================= */
  function paintBase(g, wall, lvl){
    var grd=g.createLinearGradient(0,0,PW*0.55,PH);
    stop(grd, 0,'#171037');
    stop(grd, 0.40,'#120c2c');
    stop(grd, 0.72,'#0a0620');
    stop(grd, 1,'#05030f');
    g.fillStyle=grd; g.fillRect(0,0,PW,PH);

    g.globalCompositeOperation='lighter';
    // 星云油画团块（α 抬起来，让它真的像一张上色的油画，而不是灰底）
    for(var i=0;i<geom.blobs.length;i++){
      var b=geom.blobs[i];
      var dx=Math.sin(wall*b.sp+b.ph)*PW*0.05;
      var dy=Math.cos(wall*b.sp*0.8+b.ph*1.7)*PH*0.045;
      var X=b.x*PW+dx, Y=b.y*PH+dy, R=b.r*PW*(1+lvl*0.10);
      if(R<2) continue;
      var pc=(pal[b.c]||pal.c);
      var rg=g.createRadialGradient(X,Y,0,X,Y,R);
      stop(rg, 0, alpha(pc, 0.30+lvl*0.07));
      stop(rg, 0.42, alpha(pc, 0.15));
      stop(rg, 0.74, alpha(pc, 0.05));
      stop(rg, 1, alpha(pc, 0));
      g.fillStyle=rg;
      g.beginPath(); g.arc(X,Y,R,0,6.2832); g.fill();
    }

    // 双头之间的一柱天光：整幅画的"光源"，从上方压下来
    var beam=g.createLinearGradient(PW*0.5, 0, PW*0.5, PH*0.62);
    stop(beam, 0, hsl(pal.hue+38,0.85,0.58,0.065));
    stop(beam, 0.55, hsl(pal.hue+28,0.9,0.54,0.032));
    stop(beam, 1, 'rgba(0,0,0,0)');
    g.fillStyle=beam;
    g.beginPath();
    g.moveTo(PW*0.5-PW*0.030, 0);
    g.lineTo(PW*0.5+PW*0.030, 0);
    g.lineTo(PW*0.5+PW*0.115, PH*0.62);
    g.lineTo(PW*0.5-PW*0.115, PH*0.62);
    g.closePath(); g.fill();

    // 深海光池（底部）
    var pool=g.createRadialGradient(PW*0.5,PH*1.04,0,PW*0.5,PH*1.04,PH*0.80);
    stop(pool, 0, hsl(pal.hue+198,0.62,0.42,0.26));
    stop(pool, 0.55, hsl(pal.hue+182,0.6,0.36,0.10));
    stop(pool, 1,'rgba(0,0,0,0)');
    g.fillStyle=pool; g.beginPath(); g.arc(PW*0.5,PH*1.04,PH*0.80,0,6.2832); g.fill();

    g.globalCompositeOperation='source-over';
  }

  function paintRipples(g, wall){
    g.globalCompositeOperation='lighter';
    g.lineWidth=Math.max(0.6,PH*0.004);
    for(var k=0;k<4;k++){
      var y0=PH*(0.70+k*0.075);
      g.strokeStyle=hsl(pal.hue+192+k*10,0.5,0.62,0.10-k*0.015);
      g.beginPath();
      for(var x=0;x<=PW;x+=PW/28){
        var y=y0+Math.sin(x*0.013+wall*(0.5+k*0.2)+k)*PH*0.012;
        if(x===0) g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.stroke();
    }
    g.globalCompositeOperation='source-over';
  }

  function paintStars(g, wall){
    g.globalCompositeOperation='lighter';
    var st=geom.stars;
    for(var i=0;i<st.length;i++){
      var s=st[i], tw=0.55+0.45*Math.sin(wall*1.3+i*1.7);
      g.fillStyle=col(255,246,224,s[3]*tw);
      g.fillRect(s[0],s[1],s[2],s[2]);
    }
    g.globalCompositeOperation='source-over';
  }

  /* ================= 液态油彩带 ================= */
  function paintRibbons(g, wall){
    var w=Math.max(6, geom.s*0.11);
    g.globalCompositeOperation='lighter';
    g.lineCap='round';
    for(var k=0;k<2;k++){
      var y0=PH*(0.30+k*0.30), y1=PH*(0.62+k*0.10);
      var gd=g.createLinearGradient(0,0,PW,0);
      stop(gd, 0,'rgba(0,0,0,0)');
      stop(gd, 0.28,hsl(pal.hue+158+k*30,0.72,0.50,0.14));
      stop(gd, 0.52,hsl(pal.hue+20+k*18,0.90,0.56,0.13));
      stop(gd, 0.78,hsl(pal.hue+186+k*10,0.68,0.48,0.10));
      stop(gd, 1,'rgba(0,0,0,0)');
      g.strokeStyle=gd; g.lineWidth=w*(0.75+0.35*Math.sin(wall*0.9+k));
      g.beginPath();
      g.moveTo(-PW*0.15, y0);
      g.bezierCurveTo(PW*0.30, y0-PH*0.16, PW*0.62, y1+PH*0.18, PW*1.15, y1);
      g.stroke();
    }
    g.globalCompositeOperation='source-over';
  }

  /* ================= 图腾环 ================= */
  function paintRing(g, wall){
    var a=wall*0.055*(1+en.kick*0.9);
    g.save();
    g.translate(geom.cx,geom.cy);
    g.rotate(a);
    g.scale(geom.ringX,geom.ringY);
    g.fillStyle=hsl(pal.hue+24,0.68,0.66,0.34);
    g.fill(ringPath());
    g.restore();

    // 两道虚线弧
    g.save();
    g.translate(geom.cx,geom.cy);
    g.rotate(-a*0.7);
    g.strokeStyle=hsl(pal.hue+186,0.5,0.66,0.13);
    g.lineWidth=Math.max(0.5,geom.s*0.0022);
    g.setLineDash([geom.s*0.014, geom.s*0.05]);
    g.beginPath();
    g.ellipse(0,0,geom.ringX*1.16,geom.ringY*1.16,0,0,6.2832);
    g.stroke();
    g.setLineDash([geom.s*0.006, geom.s*0.075]);
    g.strokeStyle=hsl(pal.hue+8,0.55,0.7,0.10);
    g.beginPath();
    g.ellipse(0,0,geom.ringX*0.78,geom.ringY*0.78,0,0,6.2832);
    g.stroke();
    g.setLineDash([]);
    g.restore();
  }

  /* ================= 图腾边饰 ================= */
  function paintBorder(g, wall){
    var step=Math.max(6, geom.s*0.052);
    var w1=Math.max(1.4, PW*0.0075);
    var y0=PH*0.09, y1=PH*0.60;
    g.globalCompositeOperation='lighter';
    var row=0;
    for(var y=y0; y<y1; y+=step){
      var a=0.07+0.075*Math.max(0,Math.sin(wall*1.1+row*0.42));
      g.fillStyle=col(238,190,120,a);
      g.fillRect(PW*0.042, y, w1, w1);
      g.fillRect(PW*0.958-w1, y, w1, w1);
      var hh=(row%3===0)? step*0.36 : step*0.16;
      g.fillStyle=col(96,214,196,a*0.85);
      g.fillRect(PW*0.042+w1*1.9, y, w1*0.7, hh);
      g.fillRect(PW*0.958-w1*2.6, y, w1*0.7, hh);
      row++;
    }
    g.globalCompositeOperation='source-over';
  }

  /* ================= 双面轮廓（不同肤色） ================= */
  function drawFace(g, mirror, fillA, fillB, rim, rimGlow, markCol, tintA, tintB, rot, wr){
    var s=geom.s, gap=geom.gap;
    var ax = mirror ? (geom.cx+gap+0.345*s) : (geom.cx-gap-0.345*s);
    g.save();
    g.translate(ax, geom.cy);
    g.scale(mirror?-s:s, s);
    g.rotate(rot||0);

    var fp=facePath();
    var lg=g.createRadialGradient(0.04,-0.14,0.04, 0.04,-0.14,0.96);
    stop(lg, 0,fillA); stop(lg, 1,fillB);
    g.fillStyle=lg;
    g.fill(fp);

    // 内层油彩：贴着轮廓扫几笔，让脸不是一块死色
    g.save();
    g.clip(fp);
    g.globalCompositeOperation='lighter';
    for(var b=0;b<4;b++){
      var by=-0.36+b*0.25;
      g.strokeStyle=alpha(b%2?tintA:tintB, 0.10+0.05*Math.sin(wr*0.7+b));
      g.lineWidth=0.13+0.05*Math.sin(wr*0.5+b*1.7);
      g.beginPath();
      g.moveTo(-0.22, by);
      g.bezierCurveTo(0.02, by-0.12, 0.18, by+0.09, 0.36, by-0.03);
      g.stroke();
    }
    // 脖子一路沉进深水，直接切出画面底边
    var sink=g.createLinearGradient(0,0.10,0,1.02);
    stop(sink, 0,'rgba(4,2,12,0)');
    stop(sink, 0.42,'rgba(4,2,12,0.58)');
    stop(sink, 1,'rgba(3,1,9,0.97)');
    g.globalCompositeOperation='source-over';
    g.fillStyle=sink; g.fill(fp);
    g.restore();

    // 边缘光：宽笔触 + 细线，模拟油画刮刀高光；越靠下越暗，脖子溶进深水
    var sg=g.createLinearGradient(0,-0.62,0,0.72);
    stop(sg, 0,'transparent');
    stop(sg, 0.14,rim);
    stop(sg, 0.70,rim);
    stop(sg, 1,'transparent');
    var sgg=g.createLinearGradient(0,-0.62,0,0.72);
    stop(sgg, 0,'transparent');
    stop(sgg, 0.14,rimGlow);
    stop(sgg, 0.70,rimGlow);
    stop(sgg, 1,'transparent');
    g.globalCompositeOperation='lighter';
    g.strokeStyle=sgg;
    g.lineWidth=5/s;
    g.stroke(fp);
    g.strokeStyle=sg;
    g.lineWidth=1.6/s;
    g.stroke(fp);

    // 面部标记：闭着的眼 + 眉 + 三笔颊纹（裁在轮廓里，帮观众认出这是一张脸）
    g.save();
    g.clip(fp);
    g.strokeStyle=markCol;
    g.lineWidth=2.2/s;
    g.lineCap='round';
    g.beginPath(); g.moveTo(0.140,-0.030); g.quadraticCurveTo(0.195,-0.088,0.248,-0.030); g.stroke();
    g.beginPath(); g.moveTo(0.128,-0.122); g.quadraticCurveTo(0.196,-0.170,0.258,-0.112); g.stroke();
    g.strokeStyle=alpha(markCol,0.30);
    g.lineWidth=1.3/s;
    for(var q=0;q<3;q++){
      g.beginPath();
      g.moveTo(0.118+q*0.020, 0.098+q*0.028);
      g.quadraticCurveTo(0.170+q*0.022, 0.120+q*0.028, 0.212+q*0.020, 0.096+q*0.030);
      g.stroke();
    }
    g.restore();
    g.globalCompositeOperation='source-over';
    g.restore();
  }

  function paintFaces(g, wall, lvl, kick){
    var s=geom.s;
    var breath=1+Math.sin(wall*0.7)*0.006+lvl*0.012+kick*0.01;
    g.save();
    g.translate(geom.cx,geom.cy);
    g.scale(breath,breath);
    g.translate(-geom.cx,-geom.cy);
    // 左：深靛皮，暖金边光（微微后仰）
    drawFace(g,false,'#2f2058','#0b0719',
      hsl(pal.hue+32,0.82,0.70,0.66), hsl(pal.hue+22,0.85,0.55,0.13),
      hsl(pal.hue+32,0.75,0.76,0.50),
      hsl(pal.hue+186,0.7,0.55,1), hsl(pal.hue+24,0.9,0.62,1), -0.018, wall);
    // 右：赭铜皮，青绿边光（微微前倾，打破镜像对称）
    drawFace(g,true,'#3d1a10','#120812',
      hsl(pal.hue+196,0.72,0.72,0.62), hsl(pal.hue+186,0.75,0.58,0.13),
      hsl(pal.hue+196,0.66,0.76,0.50),
      hsl(pal.hue+30,0.85,0.58,1), hsl(pal.hue+200,0.75,0.62,1), 0.026, wall);
    g.restore();
  }

  /* ================= 花 → 火 ================= */
  function petal(g, x, y, len, wdt, ang, bend, c1, c2, c3, edge, ew){
    g.save();
    g.translate(x,y); g.rotate(ang);
    var gd=g.createLinearGradient(0,0,0,-len);
    stop(gd, 0,c1); stop(gd, 0.55,c2); stop(gd, 1,c3);
    g.beginPath();
    g.moveTo(0,0);
    // 火舌形：根细、腰宽、尖头带一点弯
    g.bezierCurveTo(-wdt*0.92, -len*0.20, -wdt*0.62+bend, -len*0.66, bend*0.55, -len);
    g.bezierCurveTo( wdt*0.62+bend, -len*0.66,  wdt*0.92, -len*0.20, 0, 0);
    g.closePath();
    g.fillStyle=gd; g.fill();
    if(edge){ g.strokeStyle=edge; g.lineWidth=ew||1; g.stroke(); }
    g.restore();
  }

  function paintFlower(g, wall, lvl, kick){
    var cx0=geom.flx, cy0=geom.fly, r0=geom.fr;
    var heat=clamp(lvl*0.9+kick*0.55,0,1);

    // 花瓣用 source-over 画成"有厚度的油彩"，不是加法发光的一缕烟
    g.globalCompositeOperation='source-over';
    var n=7;
    for(var i=0;i<n;i++){
      var idxp=(i-(n-1)/2);
      var base=(-Math.PI/2)+idxp*0.46;
      var v=hash(i*3.7+1);
      var sway=Math.sin(wall*1.30+i*0.9)*0.09*(1+heat);
      var len=r0*(1.45+heat*0.70+v*0.55+0.10*Math.sin(wall*2.1+i));
      var wdt=r0*(0.34+v*0.16);
      petal(g, cx0, cy0, len, wdt, base+sway, Math.sin(wall+i)*r0*0.34,
        hsl(pal.hue+2,  0.95,0.30,0.94),
        hsl(pal.hue+18, 1.00,0.54,0.90),
        hsl(pal.hue+46, 1.00,0.74,0.08),
        hsl(pal.hue+0,  0.9, 0.22,0.30), 1.3);
    }
    // 内层五瓣：偏红偏亮，压出层次
    for(var j=0;j<5;j++){
      var an=(-Math.PI/2)+(j-2)*0.56+0.20;
      petal(g, cx0, cy0-r0*0.04, r0*(0.86+heat*0.40), r0*0.26, an,
        Math.sin(wall*1.4+j)*r0*0.20,
        hsl(pal.hue+28,1,0.58,0.96),
        hsl(pal.hue+44,1,0.76,0.92),
        hsl(pal.hue+58,1,0.90,0.05),
        hsl(pal.hue+20,1,0.44,0.28), 1.1);
    }

    // 火舌：这一层才用加法，给花心一点"在烧"的光
    g.globalCompositeOperation='lighter';
    for(var f=0;f<3;f++){
      var fx=cx0+(f-1)*r0*0.34, fl=r0*(1.6+0.40*Math.sin(wall*2.4+f*2.1)+heat*0.85);
      var fw=r0*0.26;
      var fg=g.createLinearGradient(0,cy0-fl,0,cy0);
      stop(fg, 0,'rgba(255,236,190,0)');
      stop(fg, 0.34,hsl(pal.hue+40,1,0.70,0.24));
      stop(fg, 0.80,hsl(pal.hue+16,0.98,0.54,0.12));
      stop(fg, 1,'rgba(0,0,0,0)');
      g.fillStyle=fg;
      g.beginPath();
      g.moveTo(fx-fw, cy0);
      g.bezierCurveTo(fx-fw*1.15, cy0-fl*0.42, fx+fw*0.2, cy0-fl*0.52, fx+Math.sin(wall*1.9+f)*fw*0.5, cy0-fl);
      g.bezierCurveTo(fx+fw*0.9, cy0-fl*0.44, fx+fw*1.05, cy0-fl*0.2, fx+fw, cy0);
      g.closePath(); g.fill();
    }

    // 核：一小团暖光，收着点
    var kr=r0*(0.20+heat*0.10);
    var kg=g.createRadialGradient(cx0,cy0,0,cx0,cy0,kr*2.4);
    stop(kg, 0,col(255,206,152,0.40+heat*0.18));
    stop(kg, 0.34,hsl(pal.hue+30,1,0.60,0.26));
    stop(kg, 1,'rgba(0,0,0,0)');
    g.fillStyle=kg; g.beginPath(); g.arc(cx0,cy0,kr*2.4,0,6.2832); g.fill();
    g.globalCompositeOperation='source-over';
  }

  function paintVignette(g){
    var vg=g.createRadialGradient(PW*0.5,PH*0.46,PH*0.16,PW*0.5,PH*0.46,Math.max(PW,PH)*0.78);
    stop(vg, 0,'rgba(4,2,12,0)');
    stop(vg, 0.62,'rgba(4,2,12,0.18)');
    stop(vg, 1,'rgba(3,1,9,0.70)');
    g.fillStyle=vg; g.fillRect(0,0,PW,PH);
  }

  /* ================= 油画笔触层 ================= */
  function paintBrush(g, wall){
    var st=geom.brush, n=st.length;
    g.lineCap='round';
    for(var i=0;i<n;i++){
      var b=st[i];
      g.strokeStyle=b[6];
      g.lineWidth=b[3]*(0.8+0.35*Math.sin(wall*0.5+b[5]));
      g.beginPath();
      g.moveTo(b[0], b[1]);
      g.lineTo(b[0]+b[2], b[1]+b[2]*0.34);
      g.stroke();
    }
  }

  /* ================= 合帧 ================= */
  var wall=0, lastNow=0;

  function drawScene(){
    if(!geom) buildGeom();
    var g=cx;
    g.setTransform(1,0,0,1,0,0);
    g.clearRect(0,0,PW,PH);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
    paintBase(g, wall, en.lvl);
    paintRibbons(g, wall);
    paintRipples(g, wall);
    paintStars(g, wall);
    paintFaces(g, wall, en.lvl, en.kick);
    paintRing(g, wall);
    paintFlower(g, wall, en.lvl, en.kick);

    // 花心渗出的一层暖光：画在低分辨率缓冲里，放大后自带油画的柔边
    var R=Math.max(40, geom.s*0.70);
    var bl=g.createRadialGradient(geom.flx,geom.fly,0,geom.flx,geom.fly,R);
    stop(bl, 0,col(255,214,150,0.055+en.kick*0.05));
    stop(bl, 0.45,'rgba(240,120,70,0.030)');
    stop(bl, 1,'rgba(0,0,0,0)');
    g.globalCompositeOperation='lighter';
    g.fillStyle=bl; g.beginPath(); g.arc(geom.flx,geom.fly,R,0,6.2832); g.fill();
    g.globalCompositeOperation='source-over';

    paintVignette(g);
    paintBrush(g, wall);
    paintBorder(g, wall);
  }

  /* ================= 歌词引擎 ================= */
  var curT=[];

  function isCJK(c){ return /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/.test(c); }

  function unitsOf(text){
    var u=0;
    for(var i=0;i<text.length;i++) u+= isCJK(text.charAt(i))?1.02:0.58;
    return u;
  }

  function buildTimes(L){
    var n=L.text.length, out=[], i;
    var end=L.t + (L.dur>0.2?L.dur:Math.max(1.6, n*0.24));
    if(L.chars && L.chars.length){
      var cs=L.chars, m=cs.length;
      for(i=0;i<n;i++){
        var src=cs[Math.min(m-1, Math.round(i*(m-1)/Math.max(1,n-1)))];
        var v=(src&&isFinite(Number(src.t)))?Number(src.t):L.t;
        out.push(clamp(v, L.t-0.05, end+5));
      }
    } else {
      var span=Math.max(0.6, end-L.t);
      for(i=0;i<n;i++) out.push(L.t + span*(i/Math.max(1,n)));
    }
    return out;
  }

  function fitFont(text){
    var base=clamp(Math.min(W*0.062, H*0.056), 17, 50);
    var u=Math.max(1, unitsOf(text)*1.06);
    var fit=(W*0.88)/u;
    return Math.max(15, Math.min(base, fit));
  }

  function buildLine(i){
    built=i; lastLit=-1; lastHot=-1;
    var L=lines[i];
    if(!L){ ui.cur.textContent=''; curT=[]; curChars=[]; return; }
    curT=buildTimes(L);
    ui.cur.style.fontSize=fitFont(L.text).toFixed(1)+'px';
    ui.cur.textContent='';
    var frag=document.createDocumentFragment(), arr=[];
    var n=Math.min(L.text.length, 600);
    for(var k=0;k<n;k++){
      var ch=L.text.charAt(k);
      var sp=document.createElement('span');
      sp.className='ch'+((ch===' '||ch==='\t')?' sp':'');
      sp.textContent = (ch===' '||ch==='\t') ? '\u00A0' : ch;
      frag.appendChild(sp); arr.push(sp);
    }
    ui.cur.appendChild(frag);
    curChars=arr;
  }

  function setTxt(el, s){
    if(el.__s!==s){ el.__s=s; el.textContent=s; }
  }

  function paintLyric(){
    var i=idx;
    if(i<0){ setTxt(ui.prev,''); setTxt(ui.next, lines.length?lines[0].text:''); return; }
    setTxt(ui.prev, i>0 ? lines[i-1].text : '');
    setTxt(ui.next, (i+1<lines.length) ? lines[i+1].text : '');
    var lit=0, n=curT.length;
    while(lit<n && curT[lit]<=tt+0.02) lit++;
    if(lit!==lastLit){
      var lo=Math.min(lit,lastLit), hi=Math.max(lit,lastLit);
      if(lastLit<0){ lo=0; hi=lit; }
      for(var k=lo;k<hi;k++){
        if(!curChars[k]) continue;
        curChars[k].classList.toggle('on', k<lit);
      }
      // 正在唱的那个字
      var hot=lit-1;
      if(hot>=0 && curChars[hot] && (tt-curT[hot])<0.55){
        if(lastHot>=0 && lastHot!==hot && curChars[lastHot]) curChars[lastHot].classList.remove('hot');
        curChars[hot].classList.add('hot'); lastHot=hot;
      } else if(lastHot>=0 && curChars[lastHot]){
        curChars[lastHot].classList.remove('hot'); lastHot=-1;
      }
      lastLit=lit;
    }
  }
  var lastHot=-1;



  function sendReady(){
    if(readySent) return; readySent=true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){}
  }

  function init(p){
    p=p||{};
    var s=p.song||{};
    var rawName=(s.name==null?'':String(s.name)).trim().slice(0,120);
    song.name=rawName;
    var ar=s.artists;
    if(Array.isArray(ar)) ar=ar.filter(function(x){return x!=null&&String(x).trim();}).map(function(x){return String(x).trim();}).join(' · ');
    else ar=(ar==null?'':String(ar)).trim();
    song.artists=ar.slice(0,120);
    song.cover=s.cover?String(s.cover):'';

    buildPalette(p.accent);

    var raw=Array.isArray(p.lines)?p.lines:[];
    var out=[];
    for(var i=0;i<raw.length && i<4000;i++){
      var l=raw[i]; if(!l) continue;
      var tx=(l.text==null?'':String(l.text));
      if(!tx.trim()) continue;
      if(tx.length>320) tx=tx.slice(0,320);
      var st=Number(l.t); if(!isFinite(st)||st<0) st=0;
      var du=Number(l.dur); if(!isFinite(du)||du<0) du=0;
      var cs=null;
      if(Array.isArray(l.chars)&&l.chars.length){
        cs=[];
        var cm=Math.min(l.chars.length,400);
        for(var j=0;j<cm;j++){
          var cObj=l.chars[j];
          cs.push({t:Number(cObj&&cObj.t)});
        }
      }
      out.push({t:st,dur:du,text:tx,chars:cs});
    }
    out.sort(function(a,b){ return a.t-b.t; });
    lines=out;

    var dv=Number(p.duration);
    dur=(isFinite(dv)&&dv>0)?dv:0;
    playing = (typeof p.playing==='boolean') ? p.playing : true;

    idx=-1; built=-1; lastLit=-1; lastHot=-1; dirty=true;
    curChars=[]; curT=[]; ui.cur.textContent='';
    ui.title.textContent=song.name||'Untitled';
    ui.artist.textContent=song.artists||'';
    syncIdx();
  }

  function pick(cur){
    var lo=0, hi=lines.length-1, ans=-1;
    while(lo<=hi){ var m=(lo+hi)>>1; if(lines[m].t<=cur+0.04){ ans=m; lo=m+1; } else hi=m-1; }
    return ans;
  }

  var dirty=true;
  // 换行才重建 DOM（在消息处理里做），rAF 里只做逐字状态，帧内开销恒定
  function syncIdx(){
    var i = lines.length ? pick(t) : -1;
    if(i!==idx || dirty){
      idx=i; dirty=false;
      buildLine(i);
      if(i<0){
        setTxt(ui.prev,'');
        setTxt(ui.next, lines.length ? lines[0].text : '');
      } else {
        setTxt(ui.prev, i>0 ? lines[i-1].text : '');
        setTxt(ui.next, (i+1<lines.length) ? lines[i+1].text : '');
      }
      ui.empty.classList.toggle('on', lines.length===0);
    }
  }
  function render(){
    if(idx>=0) paintLyric();
  }

  var err='';
  function frame(){
    var t0=performance.now();
    frames++;
    try{
      var dt = lastNow ? (t0-lastNow)/1000 : 0.016;
      if(!(dt>0) || !isFinite(dt)) dt=0.016;
      if(dt>0.12) dt=0.12;
      lastNow=t0;
      wall += dt*(reduced?0.28:1);

      tt = playing ? (tBase + (t0-tAt)/1000) : tBase;
      if(!isFinite(tt)) tt=tBase;
      if(tt<t) tt=t;
      if(tt>t+0.34) tt=t+0.34;

      en.kick *= (1-Math.min(1,dt*7));
      en.beatLvl *= (1-Math.min(1,dt*2.0));
      var target=clamp(Math.max(en.beatLvl*0.95, en.liveLvl),0,1);
      en.lvl += (target-en.lvl)*Math.min(1,dt*3.4);

      drawScene();
      render();
      sendReady();
    }catch(e){
      err=String((e&&e.message)||e);
      try{ sendReady(); }catch(e2){}
    }
    js = performance.now()-t0;
    requestAnimationFrame(frame);
  }

  function onMessage(ev){
    var d=ev&&ev.data;
    if(!d || d.__c100!==1) return;
    try{
      if(d.type==='init'){
        init(d.payload||{});
      } else if(d.type==='tick'){
        var p=d.payload||{};
        var nt=Number(p.time);
        if(isFinite(nt)){ t=Math.max(0,nt); tBase=t; tAt=performance.now(); syncIdx(); }
        if(typeof p.playing==='boolean') playing=p.playing;
      } else if(d.type==='beat'){
        var b=d.payload||{};
        var lv=Number(b.level);
        var kk=clamp(isFinite(lv)?lv:0.45,0,1);
        en.kick=Math.max(en.kick,kk);
        en.beatLvl=Math.max(en.beatLvl,kk);
      } else if(d.type==='live'){
        var v=d.payload||{};
        en.liveLvl=clamp(Number(v.level)||0,0,1);
        en.bass=clamp(Number(v.bass)||0,0,1);
        en.bpm=Number(v.bpm)||0;
        if(typeof v.playing==='boolean') playing=v.playing;
      }
    }catch(e){ err=String((e&&e.message)||e); }
  }

  window.addEventListener('message',onMessage);
  window.addEventListener('resize',function(){ try{ resize(); }catch(e){} });
  window.addEventListener('orientationchange',function(){ try{ setTimeout(resize,80); }catch(e){} });
  window.addEventListener('error',function(e){ if(!err) err=String((e&&e.message)||'error'); });

  window.__stage=function(){
    return { lines:lines.length, idx:idx, t:t, playing:!!playing, frames:frames,
             js:Math.round(js*100)/100, err:err,
             text:(idx>=0&&lines[idx]?lines[idx].text:''), gl:false, rm:!!reduced };
  };

  buildPalette(accent);
  makeGrain();
  resize();
  // 预热一帧：画布的首次分配/首帧光栅化是最大的一次性开销，别让它落在被计时的帧里
  try{ drawScene(); }catch(e){ if(!err) err=String((e&&e.message)||e); }
  tAt=performance.now();
  requestAnimationFrame(frame);
  // ready：rAF 首帧里发一次，另加定时兜底（rAF 在隐藏 iframe 里可能被节流）
  setTimeout(sendReady,80);
  setTimeout(sendReady,700);
})();
</script>
</body>
</html>
