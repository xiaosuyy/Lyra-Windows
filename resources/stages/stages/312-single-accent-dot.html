<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>312 · SINGLE ACCENT</title>
<style>
  :root{
    --ink:#050507; --paper:#F2EFE6; --accent:#FF5A1E;
    --gut:clamp(16px,3.4vw,54px);
    --mono:"SFMono-Regular",Consolas,"Roboto Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #stage{position:fixed;inset:0;overflow:hidden;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}

  #scrim{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(5,5,7,0) 40%,rgba(5,5,7,.42) 60%,rgba(5,5,7,.80) 100%);
  }
  body.narrow #scrim{
    background:linear-gradient(0deg,rgba(5,5,7,.94) 4%,rgba(5,5,7,.62) 34%,rgba(5,5,7,.10) 62%,rgba(5,5,7,0) 78%);
  }

  .rule{
    position:absolute;top:9vh;bottom:9vh;left:50.5%;width:1px;pointer-events:none;
    background:linear-gradient(rgba(242,239,230,0),rgba(242,239,230,.16) 18%,rgba(242,239,230,.16) 82%,rgba(242,239,230,0));
  }
  body.narrow .rule{display:none;}

  /* ---- the single accent ---- */
  #dot{
    position:absolute;top:var(--gut);right:var(--gut);
    width:clamp(44px,8vmin,112px);height:clamp(44px,8vmin,112px);
    background:var(--accent);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 0 60px rgba(0,0,0,.55);
    transform-origin:50% 50%;
    will-change:transform;
  }
  #dot::after{
    content:"";position:absolute;inset:-6px;
    border:1px solid rgba(242,239,230,.22);
    pointer-events:none;
  }
  #dot::before{
    content:"";position:absolute;top:50%;right:100%;height:1px;
    width:clamp(48px,16vw,240px);
    background:linear-gradient(90deg,rgba(242,239,230,0),rgba(242,239,230,.34));
  }

  /* ---- corner meta ---- */
  #tag{
    position:absolute;top:calc(var(--gut) + 2px);left:var(--gut);
    display:flex;align-items:center;gap:.85em;
    font-family:var(--mono);font-size:clamp(8px,1.02vw,11px);font-weight:700;
    letter-spacing:.30em;text-transform:uppercase;color:rgba(242,239,230,.50);
    pointer-events:none;line-height:1;
  }
  #tag b{color:var(--accent);font-weight:700;letter-spacing:.14em;}
  #tag i{width:clamp(18px,3.4vw,46px);height:1px;background:rgba(242,239,230,.28);display:block;}

  #foot{
    position:absolute;left:var(--gut);bottom:calc(var(--gut) + 8px);
    display:flex;align-items:baseline;gap:1.1em;max-width:52vw;
    font-family:var(--mono);font-size:clamp(8px,1.02vw,11px);font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:rgba(242,239,230,.42);
    pointer-events:none;line-height:1.4;
  }
  #song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #song em{font-style:normal;color:rgba(242,239,230,.26);}
  #clock{color:rgba(242,239,230,.55);}
  body.narrow #foot{max-width:74vw;bottom:calc(8px + env(safe-area-inset-bottom,0px));}

  #prog{
    position:absolute;left:0;bottom:0;height:2px;width:100%;
    background:var(--accent);transform:scaleX(0);transform-origin:0 50%;
    opacity:.92;
  }

  /* ---- lyrics ---- */
  #lyr{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
    padding:calc(14vh) var(--gut) calc(14vh);
    pointer-events:none;
  }
  .col{width:min(42vw,640px);text-align:right;}
  body.narrow #lyr{
    align-items:flex-end;justify-content:flex-start;
    padding:0 var(--gut) calc(15vh);
  }
  body.narrow .col{width:min(88vw,560px);text-align:left;}

  .line{
    font-weight:900;line-height:1.02;letter-spacing:-0.016em;
    margin:0.10em 0;overflow-wrap:anywhere;white-space:pre-wrap;
  }
  .prev,.next{
    font-size:clamp(10px,1.32vw,17px);font-weight:700;letter-spacing:0.05em;
    line-height:1.42;text-shadow:0 2px 18px rgba(0,0,0,.9);
  }
  .prev{opacity:0.26;}
  .next{opacity:0.15;}
  .cur{
    font-size:var(--fs,clamp(24px,4.1vw,62px));
    margin:0.12em 0 0.20em;
    text-shadow:0 3px 30px rgba(0,0,0,.92),0 1px 4px rgba(0,0,0,.75);
    animation:rise .38s cubic-bezier(.16,.84,.30,1);
  }
  @keyframes rise{from{transform:translateY(.20em);}to{transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .cur{animation:none;} }
  .cur span{transition:opacity .16s linear,color .16s linear;}
  .u{opacity:0.155;}
  .s{opacity:1;}
  .n{color:var(--accent);text-shadow:0 0 26px var(--accent-glow,rgba(255,90,30,.35));}
  .rest{
    font-family:var(--mono);font-size:clamp(9px,1.15vw,12px);font-weight:700;
    letter-spacing:.34em;text-transform:uppercase;color:rgba(242,239,230,.38);
  }
  .rest b{color:var(--accent);}
  .rest::before{
    content:"";display:inline-block;width:.62em;height:.62em;
    background:var(--accent);margin-right:1.05em;vertical-align:baseline;
    box-shadow:0 0 22px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="scrim"></div>
  <div class="rule"></div>

  <div id="tag"><b>312</b><i></i><span>NEO&nbsp;/&nbsp;NOIR</span></div>
  <div id="dot"></div>

  <div id="lyr"><div class="col" id="col"></div></div>

  <footer id="foot"><span id="song"></span><span id="clock">0:00</span></footer>
  <div id="prog"></div>
</div>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', {alpha:false});
  var col = document.getElementById('col');
  var dotEl = document.getElementById('dot');
  var progEl = document.getElementById('prog');
  var clockEl = document.getElementById('clock');
  var songEl = document.getElementById('song');

  var S = {
    lines: [], idx: -1, t: 0, playing: true, dur: 0,
    readySent:false, frames:0, js:0, err:'', reduced:false,
    accent:[255,90,30], beat:0, level:0, bass:0, mid:0, treble:0, bpm:0,
    idxShown:-2, ptr:0, head:-1, spans:[], curT:[], curEl:null, whole:false,
    lastDot:-1, lastProg:-1, lastClk:'',
    W:0, H:0, dpr:1, narrow:false, needBake:true
  };

  // ---------- resize ----------
  function resize(){
    var w = Math.max(320, window.innerWidth|0), h = Math.max(240, window.innerHeight|0);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    S.W = w; S.H = h; S.dpr = dpr;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    cv.style.width = w+'px'; cv.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    layout();
    S.needBake = true;
    S.bakeAfter = S.baked ? ((window.performance && performance.now ? performance.now() : Date.now()) + 110) : 0;
  }

  // ---------- data ----------
  function normLines(raw){
    var out = [], i, j;
    if(!Array.isArray(raw)) return out;
    for(i=0;i<raw.length;i++){
      var l = raw[i] || {};
      var text = (l.text==null) ? '' : String(l.text);
      if(!text.trim()) continue;
      var t = (typeof l.t==='number' && isFinite(l.t)) ? l.t : (out.length ? out[out.length-1].t + (out[out.length-1].dur||3) : 0);
      var dur = (typeof l.dur==='number' && isFinite(l.dur)) ? l.dur : 0;
      var chars = null;
      if(Array.isArray(l.chars) && l.chars.length){
        chars = [];
        for(j=0;j<l.chars.length;j++){
          var c = l.chars[j] || {};
          chars.push({ c: c.c==null?'':String(c.c), t: (typeof c.t==='number'&&isFinite(c.t)) ? c.t : t });
        }
      }
      out.push({t:t, dur:dur, text:text, chars:chars, len:text.length});
    }
    out.sort(function(a,b){ return a.t-b.t; });
    return out;
  }

  function applyInit(p){
    p = p || {};
    var song = p.song || {};
    S.lines = normLines(p.lines);
    S.dur = (typeof p.duration==='number' && isFinite(p.duration) && p.duration>0) ? p.duration : 0;
    var ac = p.accent;
    if(Array.isArray(ac) && ac.length>=3){
      setAccent([clamp255(ac[0]), clamp255(ac[1]), clamp255(ac[2])]);
    }
    S.inited = true;
    S.idxShown = -2;
    S.curEl = null; S.whole = false;
    if(typeof p.playing === 'boolean') S.playing = p.playing;
    setMeta(song);
  }
  function clamp255(v){ v = Number(v); return isFinite(v) ? Math.max(0,Math.min(255, v)) : 0; }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'; }); }

  // keep the cover hue, but force it to fluorescent intensity;
  // a grey / near-black cover colour falls back to the house orange.
  function hsl2rgb(h,s,l){
    var c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs(((h/60)%2)-1)), m = l-c/2, r=0,g=0,b=0;
    if(h<60){ r=c; g=x; } else if(h<120){ r=x; g=c; } else if(h<180){ g=c; b=x; }
    else if(h<240){ g=x; b=c; } else if(h<300){ r=x; b=c; } else { r=c; b=x; }
    return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
  }
  function setAccent(a){
    var r=a[0]/255, g=a[1]/255, b=a[2]/255;
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, l=(mx+mn)/2;
    var s = d===0 ? 0 : d/(1-Math.abs(2*l-1));
    var out;
    if(mx < 0.16 || s < 0.26){ out = [255,90,30]; }
    else {
      var h;
      if(mx===r) h = ((g-b)/d)%6;
      else if(mx===g) h = (b-r)/d + 2;
      else h = (r-g)/d + 4;
      h *= 60; if(h<0) h += 360;
      out = hsl2rgb(h, 1, 0.54);
    }
    S.accent = out;
    document.documentElement.style.setProperty('--accent', 'rgb('+out[0]+','+out[1]+','+out[2]+')');
    document.documentElement.style.setProperty('--accent-glow', 'rgba('+out[0]+','+out[1]+','+out[2]+',0.38)');
  }

  function setMeta(song){
    var nm = (song && song.name != null && String(song.name).trim()) ? String(song.name).trim() : 'UNTITLED';
    var ar = '';
    if(song && song.artists){
      ar = Array.isArray(song.artists) ? song.artists.filter(Boolean).join(' / ') : String(song.artists);
      ar = ar.trim();
    }
    songEl.innerHTML = esc(nm) + (ar ? ' <em>/ ' + esc(ar) + '</em>' : '');
  }

  function fmt(t){
    if(!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ':' + (s<10?'0':'') + s;
  }

  function findIdx(t){
    var L = S.lines, lo = 0, hi = L.length-1, r = -1;
    if(!L.length) return -1;
    while(lo<=hi){
      var m = (lo+hi)>>1;
      if(L[m].t <= t + 0.04){ r = m; lo = m+1; } else { hi = m-1; }
    }
    return r;
  }

  // ---------- lyric dom ----------
  function fontFor(len, colW){
    var base = Math.max(20, Math.min(64, Math.min(S.W, S.H) * 0.078));
    var need = colW / Math.max(4, Math.ceil(len/3.0));
    var fs = Math.min(base, need);
    if(len > 60) fs = Math.min(fs, colW / Math.max(9, Math.ceil(len/3.6)));
    return Math.max(14, Math.round(fs));
  }

  function buildLine(L){
    var d = document.createElement('div');
    d.className = 'line cur';
    S.spans = []; S.curT = []; S.ptr = 0; S.head = -1; S.whole = false; S.curEl = d;
    var txt = L.text, k, times = [];
    if(L.chars && L.chars.length === L.len){
      for(k=0;k<L.chars.length;k++) times.push(L.chars[k].t);
    } else if(L.dur > 0){
      var wsum = 0, ws = [];
      for(k=0;k<L.len;k++){
        var ch = txt.charCodeAt(k), wgt = (ch > 0x2E80) ? 1 : (txt[k]===' ' ? 0.42 : 0.56);
        ws.push(wgt); wsum += wgt;
      }
      var acc = 0;
      for(k=0;k<L.len;k++){ times.push(L.t + L.dur*(acc/wsum)); acc += ws[k]; }
    } else {
      for(k=0;k<L.len;k++) times.push(L.t);
    }
    if(L.len > 60){
      d.textContent = txt;
      S.whole = true; S.curT = [L.t]; S.curEl = d;
      d.style.opacity = '0.14';
    } else {
      var frag = document.createDocumentFragment();
      for(k=0;k<txt.length;k++){
        var sp = document.createElement('span');
        sp.className = 'u';
        sp.textContent = txt[k];
        frag.appendChild(sp);
        S.spans.push(sp);
      }
      d.appendChild(frag);
      S.curT = times;
    }
    return d;
  }

  function renderLyrics(){
    var i = S.idx;
    if(i === S.idxShown) return;
    S.idxShown = i;
    var colW = col.clientWidth || (S.narrow ? S.W*0.86 : S.W*0.42);
    col.textContent = '';
    if(!S.lines.length){
      var e = document.createElement('div');
      e.className = 'rest';
      if(!S.inited){ e.style.opacity = '0.55'; e.textContent = '待机 / STANDBY'; }
      else e.textContent = '器乐 / INSTRUMENTAL';
      col.appendChild(e);
      S.spans = []; S.curT = []; S.ptr = 0; S.curEl = null; S.whole = false;
      return;
    }
    var j = i < 0 ? 0 : i;
    if(j > 0){
      var pv = document.createElement('div');
      pv.className = 'line prev'; pv.textContent = S.lines[j-1].text;
      col.appendChild(pv);
    }
    var L = S.lines[j];
    var el = buildLine(L);
    el.style.setProperty('--fs', fontFor(L.len, colW)+'px');
    if(i < 0) el.style.opacity = '0.52';
    col.appendChild(el);
    if(j+1 < S.lines.length){
      var nx = document.createElement('div');
      nx.className = 'line next'; nx.textContent = S.lines[j+1].text;
      col.appendChild(nx);
    }
  }

  function revealChars(){
    var t = S.t;
    if(S.whole){
      var Lw = S.lines[S.idx < 0 ? 0 : S.idx];
      var p = 1;
      if(Lw){
        if(Lw.dur > 0) p = (t - Lw.t) / Lw.dur;
        else p = (t >= Lw.t) ? 1 : 0;
      }
      p = p < 0 ? 0 : (p > 1 ? 1 : p);
      if(S.curEl) S.curEl.style.opacity = (0.14 + 0.86*p).toFixed(3);
      return;
    }
    var n = S.spans.length;
    if(!n) return;
    while(S.ptr < n && S.curT[S.ptr] <= t + 0.02){
      S.spans[S.ptr].className = 's';
      S.ptr++;
    }
    var h = S.ptr - 1;
    if(h !== S.head){
      if(S.head >= 0 && S.head < n) S.spans[S.head].className = 's';
      S.head = h;
      if(h >= 0 && h < n) S.spans[h].className = 's n';
    }
  }

  // ---------- layout ----------
  function layout(){
    var W = S.W, H = S.H, narrow = (W/H) < 0.98;
    var f;
    if(narrow){
      f = { x: -0.22*W, y: -0.02*H, w: 1.44*W, h: 0.80*H };
    } else {
      var fh = 1.16*H;
      var fw = fh * 0.80;
      f = { x: -0.055*W, y: -0.10*H, w: fw, h: fh };
    }
    S.narrow = narrow;
    S.face = f;
    document.body.classList.toggle('narrow', narrow);
  }

  // ---------- portrait geometry ----------
  function headPath(f){
    var x=f.x, y=f.y, w=f.w, h=f.h, p=new Path2D();
    p.moveTo(x+0.500*w, y+0.048*h);
    p.bezierCurveTo(x+0.690*w, y+0.052*h, x+0.800*w, y+0.196*h, x+0.806*w, y+0.400*h);
    p.bezierCurveTo(x+0.812*w, y+0.560*h, x+0.762*w, y+0.672*h, x+0.700*w, y+0.726*h);
    p.bezierCurveTo(x+0.646*w, y+0.802*h, x+0.572*w, y+0.838*h, x+0.500*w, y+0.838*h);
    p.bezierCurveTo(x+0.404*w, y+0.838*h, x+0.318*w, y+0.780*h, x+0.266*w, y+0.706*h);
    p.bezierCurveTo(x+0.202*w, y+0.640*h, x+0.188*w, y+0.500*h, x+0.196*w, y+0.378*h);
    p.bezierCurveTo(x+0.208*w, y+0.188*h, x+0.330*w, y+0.044*h, x+0.500*w, y+0.048*h);
    p.closePath();
    return p;
  }

  function visorPath(f){
    var x=f.x, y=f.y, w=f.w, h=f.h, p=new Path2D();
    p.moveTo(x+0.148*w, y+0.334*h);
    p.lineTo(x+0.852*w, y+0.298*h);
    p.lineTo(x+0.836*w, y+0.458*h);
    p.lineTo(x+0.564*w, y+0.490*h);
    p.lineTo(x+0.500*w, y+0.450*h);
    p.lineTo(x+0.438*w, y+0.490*h);
    p.lineTo(x+0.158*w, y+0.506*h);
    p.closePath();
    return p;
  }

  // ---------- bake ----------
  function bake(){
    var W = S.W, H = S.H, f = S.face;
    var tw = Math.max(220, Math.min(880, Math.round(W*0.55)));
    var th = Math.max(160, Math.round(tw * H / Math.max(1,W)));
    var tone = document.createElement('canvas');
    tone.width = tw; tone.height = th;
    var tc = tone.getContext('2d');
    tc.fillStyle = '#000000';
    tc.fillRect(0,0,tw,th);
    tc.setTransform(tw/W, 0, 0, th/H, 0, 0);

    var hp = headPath(f), vp = visorPath(f);

    // ---- neck + shoulders mass ----
    var sh = new Path2D();
    sh.moveTo(f.x+0.10*f.w, f.y+0.62*f.h);
    sh.bezierCurveTo(f.x+0.24*f.w, f.y+0.70*f.h, f.x+0.40*f.w, f.y+0.86*f.h, f.x+0.46*f.w, f.y+1.02*f.h);
    sh.lineTo(f.x+0.46*f.w, f.y+1.16*f.h);
    sh.lineTo(f.x+1.12*f.w, f.y+1.16*f.h);
    sh.bezierCurveTo(f.x+1.04*f.w, f.y+0.86*f.h, f.x+0.92*f.w, f.y+0.80*f.h, f.x+0.80*f.w, f.y+0.74*f.h);
    sh.closePath();
    var gsh = tc.createLinearGradient(f.x+0.2*f.w, f.y+0.6*f.h, f.x+0.95*f.w, f.y+1.15*f.h);
    gsh.addColorStop(0, '#2a2a2e'); gsh.addColorStop(0.42, '#131316'); gsh.addColorStop(1, '#020203');
    tc.fillStyle = gsh; tc.fill(sh);

    // ---- head ----
    tc.save();
    tc.clip(hp);
    var gb = tc.createLinearGradient(f.x+0.10*f.w, f.y+0.06*f.h, f.x+0.95*f.w, f.y+0.95*f.h);
    gb.addColorStop(0, '#565659'); gb.addColorStop(0.46, '#26262a'); gb.addColorStop(1, '#0b0b0d');
    tc.fillStyle = gb; tc.fillRect(f.x-0.1*f.w, f.y-0.1*f.h, f.w*1.3, f.h*1.3);

    // key light (upper-left)
    var kl = tc.createRadialGradient(f.x+0.370*f.w, f.y+0.300*f.h, 0, f.x+0.370*f.w, f.y+0.300*f.h, f.h*0.50);
    kl.addColorStop(0, 'rgba(255,255,255,0.96)');
    kl.addColorStop(0.30, 'rgba(246,244,238,0.72)');
    kl.addColorStop(0.62, 'rgba(220,220,220,0.20)');
    kl.addColorStop(1, 'rgba(255,255,255,0)');
    tc.fillStyle = kl; tc.fillRect(f.x-0.1*f.w, f.y-0.1*f.h, f.w*1.3, f.h*1.3);

    // brow shelf shadow (just above visor)
    var br = tc.createLinearGradient(0, f.y+0.20*f.h, 0, f.y+0.36*f.h);
    br.addColorStop(0, 'rgba(0,0,0,0)'); br.addColorStop(1, 'rgba(0,0,0,0.55)');
    tc.fillStyle = br; tc.fillRect(f.x, f.y+0.20*f.h, f.w, f.h*0.16);

    // temple falloff to the right
    var tf = tc.createLinearGradient(f.x+0.56*f.w, 0, f.x+0.84*f.w, 0);
    tf.addColorStop(0, 'rgba(0,0,0,0)'); tf.addColorStop(1, 'rgba(0,0,0,0.82)');
    tc.fillStyle = tf; tc.fillRect(f.x+0.56*f.w, f.y, f.w*0.30, f.h);

    // cheekbone plane
    var cb = tc.createRadialGradient(f.x+0.315*f.w, f.y+0.585*f.h, 0, f.x+0.315*f.w, f.y+0.585*f.h, f.h*0.20);
    cb.addColorStop(0, 'rgba(255,255,255,0.42)'); cb.addColorStop(1, 'rgba(255,255,255,0)');
    tc.fillStyle = cb; tc.fillRect(f.x, f.y+0.38*f.h, f.w, f.h*0.42);

    // nose: lit bridge + shadow plane
    var nb = tc.createLinearGradient(f.x+0.470*f.w, f.y+0.42*f.h, f.x+0.470*f.w, f.y+0.66*f.h);
    nb.addColorStop(0, 'rgba(0,0,0,0)'); nb.addColorStop(0.55, 'rgba(255,255,255,0.62)'); nb.addColorStop(1, 'rgba(255,255,255,0.20)');
    tc.fillStyle = nb;
    tc.beginPath();
    tc.moveTo(f.x+0.452*f.w, f.y+0.44*f.h);
    tc.lineTo(f.x+0.516*f.w, f.y+0.44*f.h);
    tc.lineTo(f.x+0.540*f.w, f.y+0.640*f.h);
    tc.lineTo(f.x+0.470*f.w, f.y+0.660*f.h);
    tc.closePath(); tc.fill();

    var ns = tc.createLinearGradient(f.x+0.54*f.w, 0, f.x+0.66*f.w, 0);
    ns.addColorStop(0, 'rgba(0,0,0,0.72)'); ns.addColorStop(1, 'rgba(0,0,0,0)');
    tc.fillStyle = ns; tc.fillRect(f.x+0.54*f.w, f.y+0.44*f.h, f.w*0.14, f.h*0.26);

    // nostril + under-nose shadow
    var un = tc.createRadialGradient(f.x+0.505*f.w, f.y+0.672*f.h, 0, f.x+0.505*f.w, f.y+0.672*f.h, f.h*0.075);
    un.addColorStop(0, 'rgba(0,0,0,0.92)'); un.addColorStop(1, 'rgba(0,0,0,0)');
    tc.fillStyle = un; tc.fillRect(f.x+0.40*f.w, f.y+0.60*f.h, f.w*0.26, f.h*0.16);

    // lips
    var lip = new Path2D();
    lip.moveTo(f.x+0.392*f.w, f.y+0.706*f.h);
    lip.bezierCurveTo(f.x+0.450*f.w, f.y+0.694*f.h, f.x+0.540*f.w, f.y+0.696*f.h, f.x+0.600*f.w, f.y+0.712*f.h);
    lip.bezierCurveTo(f.x+0.548*f.w, f.y+0.742*f.h, f.x+0.452*f.w, f.y+0.744*f.h, f.x+0.392*f.w, f.y+0.706*f.h);
    tc.fillStyle = 'rgba(6,6,8,0.80)'; tc.fill(lip);
    var lh = tc.createLinearGradient(0, f.y+0.694*f.h, 0, f.y+0.716*f.h);
    lh.addColorStop(0, 'rgba(255,255,255,0.50)'); lh.addColorStop(1, 'rgba(255,255,255,0)');
    tc.fillStyle = lh; tc.fillRect(f.x+0.392*f.w, f.y+0.692*f.h, f.w*0.21, f.h*0.014);
    var lo = tc.createLinearGradient(0, f.y+0.714*f.h, 0, f.y+0.742*f.h);
    lo.addColorStop(0, 'rgba(255,255,255,0)'); lo.addColorStop(0.6, 'rgba(255,255,255,0.30)'); lo.addColorStop(1, 'rgba(0,0,0,0.5)');
    tc.fillStyle = lo; tc.fillRect(f.x+0.400*f.w, f.y+0.714*f.h, f.w*0.20, f.h*0.030);

    // chin + jaw core shadow
    var cj = tc.createRadialGradient(f.x+0.500*f.w, f.y+0.760*f.h, 0, f.x+0.500*f.w, f.y+0.760*f.h, f.h*0.13);
    cj.addColorStop(0, 'rgba(255,255,255,0.30)'); cj.addColorStop(1, 'rgba(255,255,255,0)');
    tc.fillStyle = cj; tc.fillRect(f.x+0.36*f.w, f.y+0.70*f.h, f.w*0.30, f.h*0.14);
    var jd = tc.createLinearGradient(0, f.y+0.80*f.h, 0, f.y+0.86*f.h);
    jd.addColorStop(0, 'rgba(0,0,0,0)'); jd.addColorStop(1, 'rgba(0,0,0,0.95)');
    tc.fillStyle = jd; tc.fillRect(f.x, f.y+0.79*f.h, f.w, f.h*0.08);

    // rim light on the shadow-side silhouette
    tc.globalCompositeOperation = 'lighter';
    tc.lineWidth = Math.max(1.2, f.w*0.006);
    tc.strokeStyle = 'rgba(210,210,215,0.30)';
    tc.stroke(hp);
    tc.globalCompositeOperation = 'source-over';
    tc.restore();

    // ---- mask plate (flat vector, not halftoned) ----
    var gm = tc.createLinearGradient(f.x+0.12*f.w, f.y+0.30*f.h, f.x+0.88*f.w, f.y+0.50*f.h);
    gm.addColorStop(0.00, '#131316');
    gm.addColorStop(0.16, '#8d8d95');
    gm.addColorStop(0.30, '#f1f0ea');
    gm.addColorStop(0.44, '#6a6a72');
    gm.addColorStop(0.58, '#2a2a30');
    gm.addColorStop(0.74, '#b9b9c0');
    gm.addColorStop(0.88, '#3a3a40');
    gm.addColorStop(1.00, '#101013');
    tc.fillStyle = gm; tc.fill(vp);
    tc.lineWidth = Math.max(1, f.w*0.004);
    tc.strokeStyle = 'rgba(0,0,0,0.85)'; tc.stroke(vp);
    // rivets
    tc.fillStyle = 'rgba(10,10,12,0.9)';
    for(var r=0;r<3;r++){
      tc.beginPath(); tc.arc(f.x+(0.205+r*0.235)*f.w, f.y+0.375*f.h, Math.max(1.2,f.w*0.008), 0, 6.2832); tc.fill();
    }
    // plate seam
    tc.strokeStyle = 'rgba(255,255,255,0.28)'; tc.lineWidth = Math.max(1, f.w*0.0025);
    tc.beginPath(); tc.moveTo(f.x+0.160*f.w, f.y+0.428*f.h); tc.lineTo(f.x+0.840*f.w, f.y+0.392*f.h); tc.stroke();

    // the plate casts a shadow down the cheekbones
    tc.save(); tc.clip(hp);
    var cst = tc.createLinearGradient(0, f.y+0.470*f.h, 0, f.y+0.585*f.h);
    cst.addColorStop(0, 'rgba(0,0,0,0.78)');
    cst.addColorStop(0.45, 'rgba(0,0,0,0.42)');
    cst.addColorStop(1, 'rgba(0,0,0,0)');
    tc.fillStyle = cst;
    tc.fillRect(f.x, f.y+0.470*f.h, f.w, f.h*0.12);
    // and a thin hot edge where the plate meets the light
    tc.strokeStyle = 'rgba(255,255,255,0.55)'; tc.lineWidth = Math.max(1, f.w*0.0022);
    tc.beginPath();
    tc.moveTo(f.x+0.152*f.w, f.y+0.336*f.h);
    tc.lineTo(f.x+0.848*f.w, f.y+0.300*f.h);
    tc.stroke();
    tc.restore();

    S.visorPath = vp;

    // ---- halftone screen over the plate ----
    var bw = Math.max(320, Math.min(2000, Math.round(W)));
    var bh = Math.max(240, Math.round(bw * H / Math.max(1,W)));
    var out = S.baked || document.createElement('canvas');
    out.width = bw; out.height = bh;
    var oc = out.getContext('2d');
    oc.setTransform(1,0,0,1,0,0);
    oc.fillStyle = '#050507';
    oc.fillRect(0,0,bw,bh);
    oc.imageSmoothingEnabled = true;
    oc.drawImage(tone, 0, 0, bw, bh);

    var img = tc.getImageData(0,0,tw,th).data;
    var pitch = Math.max(6, Math.min(13, Math.round(Math.min(bw,bh)/104)));
    var ang = 0.26;
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var path = new Path2D();
    var nx, ny, mx, my;
    var maxR = pitch*0.615;
    for(ny=-bh; ny<bh*2; ny+=pitch){
      for(nx=-bw; nx<bw*2; nx+=pitch){
        mx = nx*ca - ny*sa;
        my = nx*sa + ny*ca;
        if(mx < -pitch || my < -pitch || mx > bw+pitch || my > bh+pitch) continue;
        var sx = (mx/bw*tw)|0, sy = (my/bh*th)|0;
        if(sx<0) sx=0; if(sx>=tw) sx=tw-1;
        if(sy<0) sy=0; if(sy>=th) sy=th-1;
        var o = (sy*tw + sx) << 2;
        var lum = (img[o]*0.299 + img[o+1]*0.587 + img[o+2]*0.114)/255;
        if(lum < 0.06) continue;
        var rad = maxR * Math.pow(lum, 0.78);
        if(rad < 0.42) continue;
        path.moveTo(mx+rad, my);
        path.arc(mx, my, rad, 0, 6.2832);
      }
    }
    oc.fillStyle = 'rgba(244,241,232,0.90)';
    oc.fill(path);

    S.baked = out;
    S.bakeW = bw; S.bakeH = bh;

    // grain tile
    if(!S.noisePat){
      var ns2 = 256, nz = document.createElement('canvas');
      nz.width = ns2; nz.height = ns2;
      var nc = nz.getContext('2d');
      var nd = nc.createImageData(ns2, ns2);
      for(var i=0;i<nd.data.length;i+=4){
        var v = (Math.random()*255)|0;
        nd.data[i] = v; nd.data[i+1] = v; nd.data[i+2] = v;
        nd.data[i+3] = Math.random() < 0.55 ? 255 : 90;
      }
      nc.putImageData(nd, 0, 0);
      S.noisePat = ctx.createPattern(nz, 'repeat');
    }
  }

  // ---------- frame ----------
  function draw(t0){
    var W = S.W, H = S.H;
    if(S.needBake && W>1 && t0 >= (S.bakeAfter||0)){ S.needBake = false; bake(); }
    ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if(S.baked){
      var k = S.reduced ? 1 : (1 + 0.008*S.bass + 0.004*S.level);
      if(k < 1.0015){
        ctx.drawImage(S.baked, 0, 0, W, H);
      } else {
        var dw = W*k, dh = H*k;
        ctx.drawImage(S.baked, (W-dw)/2, (H-dh)/2, dw, dh);
      }
    } else {
      ctx.fillStyle = '#050507'; ctx.fillRect(0,0,W,H);
    }
    drawSheen(t0);
    drawGrain(t0);
  }

  function drawSheen(t0){
    if(!S.visorPath) return;
    var W = S.W, H = S.H, f = S.face;
    var sp = S.reduced ? 0.5 : (0.5 + 0.5*Math.sin(t0*0.00042 + S.bass*2.4));
    ctx.save();
    ctx.clip(S.visorPath);
    ctx.globalCompositeOperation = 'lighter';
    var x0 = f.x + (0.05 + 0.85*sp)*f.w;
    var g = ctx.createLinearGradient(x0 - f.w*0.16, f.y, x0 + f.w*0.16, f.y + 0.20*f.h);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.48, 'rgba(255,255,255,'+(0.10 + 0.30*(S.reduced?0:S.treble)).toFixed(3)+')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, f.y, W, f.h*0.30);
    ctx.restore();
  }

  function drawGrain(t0){
    if(!S.noisePat) return;
    var W = S.W, H = S.H;
    if(S.frames % 3 === 0){
      S.gox = (Math.random()*256)|0;
      S.goy = (Math.random()*256)|0;
    }
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = S.reduced ? 0.075 : (0.10 + 0.045*S.level);
    ctx.translate(S.gox||0, S.goy||0);
    ctx.fillStyle = S.noisePat;
    ctx.fillRect(-(S.gox||0), -(S.goy||0), W, H);
    ctx.restore();
  }

  function chrome(){
    // the single accent swells on the kick
    var sc = S.reduced ? 1 : (1 + 0.085*S.beat + 0.02*S.level);
    sc = Math.round(sc*1000)/1000;
    if(sc !== S.lastDot){
      S.lastDot = sc;
      dotEl.style.transform = 'scale(' + sc + ')';
    }
    var pr = S.dur > 0 ? (S.t / S.dur) : 0;
    pr = pr < 0 ? 0 : (pr > 1 ? 1 : pr);
    var pq = Math.round(pr*900)/900;
    if(pq !== S.lastProg){
      S.lastProg = pq;
      progEl.style.transform = 'scaleX(' + pq.toFixed(4) + ')';
    }
    var clk = fmt(S.t) + (S.dur > 0 ? ' / ' + fmt(S.dur) : '');
    if(clk !== S.lastClk){ S.lastClk = clk; clockEl.textContent = clk; }
  }

  var readyTimer = 0;
  function sendReady(){
    if(S.readySent) return;
    S.readySent = true;
    try{ if(readyTimer) clearTimeout(readyTimer); }catch(e){}
    try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }catch(e){}
  }

  var last = 0;
  function loop(now){
    requestAnimationFrame(loop);
    var t0 = (performance && performance.now) ? performance.now() : now;
    S.frames++;
    if(!S.readySent) sendReady();
    try{
      // decay the reactive envelope when the audio goes quiet / pauses
      S.beat *= 0.90;
      if(S.beat < 0.002) S.beat = 0;
      S.level *= 0.94; S.bass *= 0.94; S.mid *= 0.94; S.treble *= 0.94;

      S.idx = findIdx(S.t);
      renderLyrics();
      revealChars();
      draw(t0);
      chrome();
    }catch(err){
      if(!S.err) S.err = String(err && err.message ? err.message : err).slice(0,120);
    }
    S.js = ((performance && performance.now) ? performance.now() : now) - t0;
    last = now;
  }

  // ---------- messages ----------
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if(d.type === 'init'){ applyInit(p); }
    else if(d.type === 'tick'){
      if(typeof p.time === 'number' && isFinite(p.time)) S.t = p.time;
      if(typeof p.playing === 'boolean') S.playing = p.playing;
    }
    else if(d.type === 'beat'){
      S.beat = (typeof p.level === 'number' && isFinite(p.level)) ? p.level : S.beat*0.8;
      S.level = S.beat;
    }
    else if(d.type === 'live'){
      if(typeof p.bpm === 'number' && isFinite(p.bpm)) S.bpm = p.bpm;
      if(typeof p.level === 'number' && isFinite(p.level)) S.level = p.level;
      if(typeof p.bass === 'number' && isFinite(p.bass)) S.bass = p.bass;
      if(typeof p.mid === 'number' && isFinite(p.mid)) S.mid = p.mid;
      if(typeof p.treble === 'number' && isFinite(p.treble)) S.treble = p.treble;
      if(typeof p.playing === 'boolean') S.playing = p.playing;
    }
  }, false);

  window.__stage = function(){
    var L = S.lines[Math.max(0,S.idx)];
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: S.js,
      err: S.err,
      text: (S.idx>=0 && L) ? L.text : '',
      gl: false,
      rm: S.reduced
    };
  };

  try{
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    S.reduced = !!mq.matches;
    if(mq.addEventListener) mq.addEventListener('change', function(e){ S.reduced = !!e.matches; });
  }catch(e){}

  window.addEventListener('resize', resize, {passive:true});
  resize();
  requestAnimationFrame(loop);
  readyTimer = setTimeout(sendReady, 90);
  window.__312ok = true;
})();
</script>
</body>
