<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>场线歌词</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.6 ui-monospace,Consolas,monospace;color:rgba(150,190,255,.26);
        letter-spacing:.16em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   222 · 场线 —— 字不是点画的，是一整片"流场"里的线被点亮的那一段

   机制一句话：整个画面铺一层散度为零的噪声流场，从随机种子做 RK2 积分得到
   上千条流线；字的作用只有一件 —— 凡是落在笔画墨迹里的线段，亮度抬起来并
   沿线的走向跑一道亮脉冲。于是字是**场线的密度与亮度**读出来的，而不是
   另画一遍图形；线还会从笔画里穿出去，继续在画外流动。

   · 流线在换句时烘一次（约 14k 个点），每帧只做：脉冲相位 + 三档合批描边。
   · 墨迹判定用半分辨率掩码（一次 getImageData）。
   · 极简兜底：没有歌词时，同一片场线照样流动（只是没有"被点亮"的区域）。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');

let W = 1, H = 1, DPR = 1, VX = 1, VY = 1;
const RM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } })();

let ACC = [126, 178, 255];
let ICE = [214, 234, 255];
let FOG = [4, 7, 14];
function buildColors() {
  const r = ACC[0] | 0, g = ACC[1] | 0, b = ACC[2] | 0;
  ICE = [Math.min(255, Math.round(r * 0.35 + 168)), Math.min(255, Math.round(g * 0.35 + 182)), Math.min(255, Math.round(b * 0.32 + 190))];
  FOG = [2 + (r * 0.035) | 0, 3 + (g * 0.042) | 0, 7 + (b * 0.055) | 0];
}

/* ---------------------------- 排版 ---------------------------- */
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';
const fontStr = (fs) => '800 ' + fs + 'px ' + FAMILY;
const TRACK = 0.035;
const OPUNCT = '，。、；：！？）】》」』”’,.!?;:)]}%…';
const LPUNCT = '（【《「『“‘({[';
const measCtx = document.createElement('canvas').getContext('2d');

function measureStr(s, fs) {
  measCtx.font = fontStr(fs);
  let w = 0;
  for (let i = 0; i < s.length; i++) w += measCtx.measureText(s[i]).width + fs * TRACK;
  return Math.max(0, w - fs * TRACK);
}
function splitRows(s, L) {
  const n = s.length, cuts = [];
  for (let i = 1; i < L; i++) {
    let c = Math.round(i * n / L);
    while (c < n && OPUNCT.indexOf(s[c]) >= 0) c++;
    if (c > 0 && c < n && LPUNCT.indexOf(s[c - 1]) >= 0) c--;
    if (c <= 0 || c >= n) continue;
    if (cuts.length && c <= cuts[cuts.length - 1]) continue;
    cuts.push(c);
  }
  const rows = [];
  let prev = 0;
  for (let i = 0; i < cuts.length; i++) { rows.push(s.slice(prev, cuts[i])); prev = cuts[i]; }
  rows.push(s.slice(prev));
  return rows.filter((r) => r.length > 0);
}
function layout(raw) {
  if (!raw) return null;
  const s = raw.replace(/\s+/g, ' ').trim();
  if (!s) return null;
  const n = s.length;
  const maxW = Math.min(W * 0.74, 1120);
  const maxH = H * 0.36;
  const maxL = n <= 12 ? 1 : (n <= 24 ? 2 : 3);
  let best = null;
  for (let L = 1; L <= maxL; L++) {
    if (L > 1 && n < L + 2) continue;
    const rows = splitRows(s, L);
    let w100 = 0;
    for (let i = 0; i < rows.length; i++) w100 = Math.max(w100, measureStr(rows[i], 100));
    const fs = Math.min(maxW / (Math.max(1, w100) / 100), maxH / (1.22 * rows.length), 168);
    if (fs < 24) continue;
    if (best && fs < best.fs * 1.07) continue;
    best = { rows: rows, fs: fs };
  }
  if (!best) {
    const w100 = Math.max(1, measureStr(s, 100));
    best = { rows: [s], fs: Math.max(20, Math.min(maxW / (w100 / 100), maxH / 1.22, 168)) };
  }
  const fs = best.fs, lh = fs * 1.22;
  measCtx.font = fontStr(fs);
  const rows = [];
  let bw = 0;
  for (let r = 0; r < best.rows.length; r++) {
    const txt = best.rows[r], chars = [];
    let x = 0;
    for (let k = 0; k < txt.length; k++) {
      const c = txt[k], wch = measCtx.measureText(c).width;
      if (c !== ' ') chars.push({ c: c, x: x, w: wch });
      x += wch + fs * TRACK;
    }
    const rw = Math.max(0, x - fs * TRACK);
    rows.push({ chars: chars, w: rw, ly: (r + 0.5) * lh });
    if (rw > bw) bw = rw;
  }
  const bh = lh * rows.length;
  return { rows: rows, fs: fs, lh: lh, bw: Math.max(1, bw), bh: bh };
}
function paintRows(g, lay, ox, oy) {
  g.font = fontStr(lay.fs);
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  for (let r = 0; r < lay.rows.length; r++) {
    const row = lay.rows[r];
    for (let k = 0; k < row.chars.length; k++) g.fillText(row.chars[k].c, ox + row.chars[k].x, oy + row.ly);
  }
}

/* ---------------------------- 场 ----------------------------
   ψ(x,y) = 三个正弦叠加；速度 = (∂ψ/∂y, -∂ψ/∂x)，散度恒为零 —— 所以流线
   永远不打结、也不会聚成一团。 */
const F1 = 0.0013, F2 = 0.0021, F3 = 0.0034;
function vx(x, y) {
  return 0.00045 * Math.cos(x * 0.00045 + y * 0.0011 + 0.7)
    + F2 * 0.70 * Math.cos(y * F2 - x * 0.0009 + 1.9)
    + F3 * 0.42 * Math.cos((x + y) * F3 + 2.6);
}
function vy(x, y) {
  return -F1 * Math.cos(x * F1 + y * 0.0011 + 0.7)
    - 0.70 * (-0.0009) * Math.cos(y * F2 - x * 0.0009 + 1.9)
    - 0.42 * F3 * Math.cos((x + y) * F3 + 2.6);
}
/* 归一化成一个稳定的方向，避免近静止点把积分卡住 */
function dirAt(x, y, out) {
  let ax = vx(x, y), ay = vy(x, y);
  const m = Math.hypot(ax, ay) || 1e-6;
  out[0] = ax / m; out[1] = ay / m;
}

/* ---------------------------- 墨迹掩码 ---------------------------- */
const MS = 0.5;
const offCv = document.createElement('canvas');
const offCtx = offCv.getContext('2d', { willReadFrequently: true });
let mask = null, mw = 0, mh = 0, mox = 0, moy = 0;

function inkAt(sx, sy) {
  if (!mask) return 0;
  const i = ((sy - moy) * MS) | 0, j = ((sx - mox) * MS) | 0;
  if (i < 0 || j < 0 || i >= mh || j >= mw) return 0;
  return mask[i * mw + j];
}

/* ---------------------------- 预烘：流线 ---------------------------- */
let fX = new Float32Array(0), fY = new Float32Array(0), fPar = new Float32Array(0), fInk = new Uint8Array(0);
let fOff = new Int32Array(1), fN = 0;
let glyph = null;


/* 从种子出发做 RK2 积分，把整片流线烘进 typed array（只换句时跑一次） */
const STEP = 8;            // 积分步长（CSS 像素）
const FWD = 22;            // 正/反各走多少步
let gX = [], gY = [], gP = [], gI = [], gO = [0];

function integrate(seeds, fwd) {
  const FWDN = fwd || FWD;
  const dir = [0, 0];
  for (let s = 0; s < seeds.length / 2; s++) {
    const sx = seeds[s * 2], sy = seeds[s * 2 + 1];
    /* 反向 FWDN 步 + 正向 FWDN 步，拼成一条穿过种子的长线 */
    const back = [];
    let x = sx, y = sy;
    for (let i = 0; i < FWDN; i++) {
      dirAt(x, y, dir);
      const mx2 = x - dir[0] * STEP * 0.5, my2 = y - dir[1] * STEP * 0.5;
      dirAt(mx2, my2, dir);
      x -= dir[0] * STEP; y -= dir[1] * STEP;
      if (x < -80 || x > W + 80 || y < -80 || y > H + 80) break;
      back.push(x, y);
    }
    const seq = [];
    for (let i = back.length - 2; i >= 0; i -= 2) seq.push(back[i], back[i + 1]);
    seq.push(sx, sy);
    x = sx; y = sy;
    for (let i = 0; i < FWDN; i++) {
      dirAt(x, y, dir);
      const mx2 = x + dir[0] * STEP * 0.5, my2 = y + dir[1] * STEP * 0.5;
      dirAt(mx2, my2, dir);
      x += dir[0] * STEP; y += dir[1] * STEP;
      if (x < -80 || x > W + 80 || y < -80 || y > H + 80) break;
      seq.push(x, y);
    }
    const n = seq.length / 2;
    if (n < 4) continue;
    for (let i = 0; i < n; i++) {
      const px2 = seq[i * 2], py2 = seq[i * 2 + 1];
      gX.push(px2); gY.push(py2); gP.push(i / (n - 1)); gI.push(inkAt(px2, py2));
    }
    gO.push(gX.length);
  }
}

/* 两批种子（笔画内 + 画面自由）要**追加**到同一份里再收口 ——
   分两次 integrate 各自重建数组的话，第二批会把第一批整个覆盖掉。 */
function resetField() { gX = []; gY = []; gP = []; gI = []; gO = [0]; }
function finishField() {
  fN = gX.length;
  fX = new Float32Array(fN); fY = new Float32Array(fN);
  fPar = new Float32Array(fN); fInk = new Uint8Array(fN);
  for (let i = 0; i < fN; i++) { fX[i] = gX[i]; fY[i] = gY[i]; fPar[i] = gP[i]; fInk[i] = gI[i]; }
  fOff = new Int32Array(gO);
  resetField();
}

function bakeField(text) {
  const lay = text ? layout(text) : null;
  if (!lay) {
    /* 没有歌词：只烘一片环境流线（种子固定，所以换尺寸时位置也是连续的） */
    mask = null; glyph = null;
    const seeds = [];
    let rs = 987654321;
    const rnd = () => ((rs = (rs * 1664525 + 1013904223) >>> 0) / 4294967296);
    const ambN = RM ? 150 : 300;
    for (let i = 0; i < ambN; i++) seeds.push(rnd() * W, rnd() * H);
    resetField();
    integrate(seeds, 26);
    finishField();
    return null;
  }
  const pad = Math.round(lay.fs * 0.30) + 16;
  const bw = Math.ceil(lay.bw) + pad * 2;
  const bh = Math.ceil(lay.bh) + pad * 2;
  const gx = VX - bw / 2, gy = VY - bh / 2;

  /* 清晰字形（很淡的一层底，只用来把字"钉"住，主要靠场线读） */
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(bw * DPR));
  c.height = Math.max(2, Math.round(bh * DPR));
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#fff';
  paintRows(g, lay, pad, pad);

  /* 掩码 */
  mw = Math.max(2, Math.round(bw * MS));
  mh = Math.max(2, Math.round(bh * MS));
  offCv.width = mw; offCv.height = mh;
  offCtx.setTransform(1, 0, 0, 1, 0, 0);
  offCtx.clearRect(0, 0, mw, mh);
  offCtx.setTransform(MS, 0, 0, MS, 0, 0);
  offCtx.fillStyle = '#fff';
  paintRows(offCtx, lay, pad, pad);
  mox = gx; moy = gy;
  const d = offCtx.getImageData(0, 0, mw, mh).data;
  mask = new Uint8Array(mw * mh);
  const inkPts = [];
  for (let y = 0; y < mh; y++) {
    for (let x = 0; x < mw; x++) {
      if (d[(y * mw + x) * 4 + 3] > 110) { mask[y * mw + x] = 1; inkPts.push(x / MS + mox, y / MS + moy); }
    }
  }

  /* --- 种子 A：墨迹内部按**抖动网格**均匀铺（随机撒会结块，笔画就花了） --- */
  const inSeeds = [];
  const ST = RM ? 9 : 7;                 // 掩码像素为单位的步距
  for (let y = 2; y < mh - 2; y += ST) {
    for (let x = 2; x < mw - 2; x += ST) {
      if (!mask[y * mw + x]) continue;
      inSeeds.push(x / MS + mox + (Math.random() - 0.5) * 7, y / MS + moy + (Math.random() - 0.5) * 7);
    }
  }
  /* 种子 B：画面里少量自由种子，走得更长 —— 于是字外是长缓流，字内是均匀的短梳齿 */
  const ambSeeds = [];
  const ambLine = RM ? 55 : 90;
  for (let i = 0; i < ambLine; i++) ambSeeds.push(Math.random() * W, Math.random() * H);

  resetField();
  integrate(inSeeds, 14);
  integrate(ambSeeds, 26);
  finishField();

  return { lay: lay, crisp: c, bw: bw, bh: bh, pad: pad, gx: gx, gy: gy, seeds: inSeeds.length / 2 + ambSeeds.length / 2 };
}

/* ---------------------------- 状态 ---------------------------- */
let lines = [];
let curIdx = -1, brewIdx = -1, lastT = -1;
let prep = null, prepIdx = -1;
let reveal = 0, needRebake = false;
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
let vT = 0, beat = 0;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(2, window.innerWidth);
  H = Math.max(2, window.innerHeight);
  VX = W / 2;
  VY = H * 0.50;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBG();
  needRebake = true;
}

let bgGrad = null;
function buildBG() {
  const g = ctx.createRadialGradient(VX, VY, 0, VX, VY, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgb(' + (FOG[0] + 9) + ',' + (FOG[1] + 14) + ',' + (FOG[2] + 24) + ')');
  g.addColorStop(0.55, 'rgb(' + (FOG[0] + 4) + ',' + (FOG[1] + 7) + ',' + (FOG[2] + 12) + ')');
  g.addColorStop(1, 'rgb(' + FOG[0] + ',' + FOG[1] + ',' + FOG[2] + ')');
  bgGrad = g;
}

function timing(T) {
  if (!lines.length) { if (glyph) { glyph = null; curIdx = -1; } if (!fN) bakeField(null); return; }
  if (T < lastT - 0.6) { curIdx = -1; brewIdx = -1; prep = null; prepIdx = -1; glyph = null; reveal = 0; fN = 0; }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci; brewIdx = -1;
    if (ci >= 0) {
      glyph = (prep && prepIdx === ci) ? prep : bakeField(lines[ci].text);
    } else {
      glyph = null;
      if (!fN) bakeField(null);
    }
    reveal = 0;
    prep = null; prepIdx = -1;
    hint.style.opacity = ci >= 0 ? '0' : '1';
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(1.7, Math.max(0.55, gap * 0.62));
    if (T >= lines[nx].t - lead) { brewIdx = nx; prep = bakeField(lines[nx].text); prepIdx = nx; }
  }
}

/* ---------------------------- 主循环 ---------------------------- */
let last = performance.now(), frames = 0, raf = 0;

/* 三档颜色 + 脉冲：所有线段先分类，再一条 path 一次 stroke */
const PULSE_W = 2.6;
function frame(ms) {
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
  last = ms; frames++;
  vT += dt * (playing ? 1 : 0.08);
  beat *= Math.exp(-dt * 2.8);
  if (needRebake) { needRebake = false; if (curIdx >= 0 && lines[curIdx]) { glyph = bakeField(lines[curIdx].text); reveal = 1; } }
  timing(now());
  if (reveal < 1) reveal = Math.min(1, reveal + dt / 0.5);

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  /* 整个场轻轻漂：流线本身是静态积分，画面靠这一下缓慢平移活着 */
  const ox = (RM ? 2 : 9) * Math.sin(vT * 0.10);
  const oy = (RM ? 2 : 7) * Math.cos(vT * 0.083 + 1.1);

  /* 淡底：把字的整体轮廓钉住。清晰版给"形"，再来一层模糊版给"团" */
  if (glyph) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.20 * reveal;
    ctx.drawImage(glyph.crisp, glyph.gx + ox, glyph.gy + oy, glyph.bw, glyph.bh);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.30 * reveal;
    ctx.drawImage(glyph.crisp, glyph.gx + ox, glyph.gy + oy, glyph.bw, glyph.bh);
    ctx.globalAlpha = 1;
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  const spd = RM ? 0.06 : 0.20;
  const N = fN;
  const X = fX, Y = fY, P = fPar, K = fInk;

  /* 三档：0 = 场里的暗线，1 = 场里的中线，2 = 落在笔画里的亮线 */
  for (let band = 0; band < 3; band++) {
    if (band === 0) {
      ctx.strokeStyle = 'rgba(' + ICE[0] + ',' + ICE[1] + ',' + ICE[2] + ',0.055)';
      ctx.lineWidth = 0.85;
    } else if (band === 1) {
      ctx.strokeStyle = 'rgba(' + Math.min(255, ICE[0] + 6) + ',' + Math.min(255, ICE[1] + 8) + ',' + ICE[2] + ',0.115)';
      ctx.lineWidth = 1.0;
    } else {
      ctx.strokeStyle = 'rgba(' + Math.min(255, ICE[0] + 26) + ',' + Math.min(255, ICE[1] + 20) + ',' + Math.min(255, ICE[2] + 8) + ',' + (0.30 + beat * 0.16).toFixed(3) + ')';
      ctx.lineWidth = 1.55;
    }
    ctx.beginPath();
    for (let li = 0; li + 1 < fOff.length; li++) {
      const s = fOff[li], e = fOff[li + 1];
      let started = false;
      for (let i = s; i < e - 1; i++) {
        const ink = K[i];
        /* 脉冲沿线的参数位置传播；笔画里的线更"热" */
        const pulse = Math.sin((P[i] * 3.1 - vT * spd) * 6.2832);
        let b;
        if (ink) b = 2;
        else b = (pulse * 0.5 + 0.5) > 0.72 ? 1 : 0;
        if (b !== band) { started = false; continue; }
        const x0 = X[i] + ox, y0 = Y[i] + oy;
        const x1 = X[i + 1] + ox, y1 = Y[i + 1] + oy;
        if (!started) { ctx.moveTo(x0, y0); started = true; }
        ctx.lineTo(x1, y1);
      }
    }
    ctx.stroke();
  }

  /* 亮脉冲头：笔画里偶尔有一颗更亮的"粒子"沿流线走 */
  if (N && !RM) {
    ctx.fillStyle = 'rgba(' + Math.min(255, ICE[0] + 40) + ',' + Math.min(255, ICE[1] + 34) + ',' + Math.min(255, ICE[2] + 14) + ',0.55)';
    for (let i = 0; i < N; i += 17) {
      if (!K[i]) continue;
      const q = Math.sin((P[i] * 3.1 - vT * spd) * 6.2832);
      if (q < 0.94) continue;
      ctx.fillRect(X[i] + ox - 1, Y[i] + oy - 1, 2.2, 2.2);
    }
  }
  ctx.lineCap = 'butt';
  ctx.globalCompositeOperation = 'source-over';

  /* 暗角 */
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  raf = requestAnimationFrame(frame);
}

let vigGrad = null;

/* ---------------------------- 协议 ---------------------------- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1; prep = null; prepIdx = -1;
    glyph = null; reveal = 0; fN = 0; mask = null;
    clockT = 0; clockAt = performance.now();
    if (p.accent && p.accent.length >= 3) {
      ACC = [p.accent[0] | 0, p.accent[1] | 0, p.accent[2] | 0];
      buildColors(); buildBG();
    }
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.45';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    beat = Math.min(1.0, beat + 0.3 + (d.payload.level || 0) * 0.5);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
addEventListener('pagehide', () => { cancelAnimationFrame(raf); });

buildColors();
resize();
const vg0 = ctx.createRadialGradient(VX, VY, Math.min(W, H) * 0.34, VX, VY, Math.min(W, H) * 1.02);
vg0.addColorStop(0, 'rgba(0,0,0,0)');
vg0.addColorStop(1, 'rgba(1,2,5,0.62)');
vigGrad = vg0;
raf = requestAnimationFrame(frame);

window.__stage = () => ({
  lines: lines.length, idx: curIdx, curIdx: curIdx, t: +now().toFixed(2), playing: playing,
  frames: frames, pts: fN, segs: Math.max(0, fOff.length - 1), reveal: +reveal.toFixed(2),
  ink: !!glyph, vT: +vT.toFixed(2)
});
</script>
