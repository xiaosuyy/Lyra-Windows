<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Y2K 极限</title>
<!-- 295b · 千禧极限运动海报：鱼眼蓝天 + 星爆 + 怼脸华夫鞋底 + 镀铬字；歌词用独立驱动 -->
<style>
  html,body{margin:0;height:100%;background:#1a86dd;overflow:hidden;
    font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ty{position:fixed;inset:0;pointer-events:none;z-index:3}
  #cur{position:absolute;left:6.5%;bottom:15%;width:56%;text-align:left;
    font-family:Impact,"Arial Black","PingFang SC",sans-serif;font-style:italic;
    font-size:clamp(26px,4.2vw,68px);line-height:1.14;letter-spacing:.01em;
    color:#fff;-webkit-text-stroke:1.6px rgba(4,20,40,.92);
    text-shadow:2px 2px 0 #041322,-2px 2px 0 #041322,2px -2px 0 #041322,-2px -2px 0 #041322,
      0 3px 0 #041322,0 10px 26px rgba(2,14,30,.55)}
  #cur span{opacity:.42}
  #cur span.on{opacity:1}
  #prev{position:absolute;left:6.5%;bottom:calc(15% + clamp(30px,4.6vw,76px));width:52%;
    font-weight:800;font-style:italic;font-size:clamp(13px,1.5vw,24px);letter-spacing:.02em;
    color:rgba(255,255,255,.62);text-shadow:0 2px 6px rgba(2,14,30,.5);white-space:nowrap;overflow:hidden}
  #next{position:absolute;left:6.5%;bottom:calc(15% - clamp(20px,2.4vw,36px));width:52%;
    font-weight:800;font-style:italic;font-size:clamp(13px,1.5vw,24px);letter-spacing:.02em;
    color:rgba(255,255,255,.4);text-shadow:0 2px 6px rgba(2,14,30,.5);white-space:nowrap;overflow:hidden}
  #hint{position:fixed;left:6.5%;bottom:8%;font:500 12px/1.6 ui-monospace,monospace;
    letter-spacing:.2em;color:rgba(255,255,255,.55);z-index:4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ty"><div id="prev"></div><div id="cur"></div><div id="next"></div></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
const cv=document.getElementById('c'), curEl=document.getElementById('cur'),
      prevEl=document.getElementById('prev'), nextEl=document.getElementById('next'),
      hint=document.getElementById('hint');
const now=()=>clockT+(playing?(performance.now()-clockAt)/1000:0);
let W=1,H=1,PR=1,lines=[],idx=-1,clockT=0,clockAt=0,playing=false,vT=0;
let frames=0,jsMs=0,errMsg='',readySent=false,dirty=true,tickN=0;
let RM=false; try{ RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){}

const bc=document.createElement('canvas'), bx=bc.getContext('2d');

function bake(){
  bc.width=Math.round(W*PR); bc.height=Math.round(H*PR);
  bx.setTransform(PR,0,0,PR,0,0);
  const g=bx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2ea0ef'); g.addColorStop(.55,'#1a86dd'); g.addColorStop(1,'#0d5aa8');
  bx.fillStyle=g; bx.fillRect(0,0,W,H);

  /* 星爆射线 */
  bx.save(); bx.translate(W*0.52,H*0.02);
  for(let i=0;i<26;i++){
    bx.rotate(Math.PI*2/26);
    bx.beginPath(); bx.moveTo(0,0);
    bx.lineTo(Math.tan(0.045)*H*1.9, -H*2.0);
    bx.lineTo(-Math.tan(0.045)*H*1.9, -H*2.0);
    bx.closePath();
    bx.fillStyle = i%2 ? 'rgba(255,255,255,.075)' : 'rgba(255,255,255,.03)';
    bx.fill();
  }
  bx.restore();

  /* 鱼眼网格 */
  bx.strokeStyle='rgba(255,255,255,.12)'; bx.lineWidth=1;
  const cx=W*0.5, cy=H*0.46, R=Math.max(W,H)*0.78;
  for(let k=-9;k<=9;k++){
    bx.beginPath();
    for(let t=0;t<=1.001;t+=0.02){
      const a=k*0.085;
      const r=R*(0.06+t*1.05);
      const x=cx+Math.cos(a+t*0.06)*r*1.25, y=cy+Math.sin(a+t*0.06)*r*0.78;
      t?bx.lineTo(x,y):bx.moveTo(x,y);
    }
    bx.stroke();
  }
  for(let k=-6;k<=6;k++){
    bx.beginPath();
    for(let t=0;t<=1.001;t+=0.02){
      const r=R*(0.10+t*1.0);
      const a=k*0.16;
      const x=cx+Math.cos(a)*r*1.25, y=cy+Math.sin(a)*r*0.78;
      t?bx.lineTo(x,y):bx.moveTo(x,y);
    }
    bx.stroke();
  }

  /* 云 */
  function cloud(x,y,s,a){
    bx.fillStyle='rgba(255,255,255,'+a+')';
    for(let i=0;i<5;i++){
      const dx=(i-2)*s*0.5, dy=(i%2?-.22:.16)*s;
      bx.beginPath(); bx.ellipse(x+dx,y+dy,s*(0.52+((i*7)%3)*0.1),s*0.34,0,0,6.2832); bx.fill();
    }
  }
  cloud(W*0.30,H*0.62,W*0.075,0.92);
  cloud(W*0.52,H*0.24,W*0.055,0.8);
  cloud(W*0.70,H*0.55,W*0.045,0.7);
  cloud(W*0.40,H*0.40,W*0.032,0.6);

  /* 滑手剪影（尖刺头 + 滑板） */
  (function skater(){
    const x=W*0.20, y=H*0.44, s=Math.min(W,H)/900*1.15;
    bx.save(); bx.translate(x,y); bx.scale(s,s);
    bx.fillStyle='#0b2440';
    /* 头 */
    bx.beginPath(); bx.arc(0,-52,15,0,6.2832); bx.fill();
    /* 尖刺发 */
    for(let i=0;i<7;i++){
      const a=-Math.PI*0.92+i*0.30;
      bx.beginPath(); bx.moveTo(Math.cos(a)*10,-52+Math.sin(a)*10);
      bx.lineTo(Math.cos(a)*30,-52+Math.sin(a)*30); bx.lineTo(Math.cos(a+0.16)*10,-52+Math.sin(a+0.16)*10);
      bx.closePath(); bx.fill();
    }
    /* 身体 */
    bx.beginPath(); bx.moveTo(-22,10); bx.quadraticCurveTo(-20,-34,-6,-38);
    bx.lineTo(8,-38); bx.quadraticCurveTo(22,-32,24,10); bx.closePath(); bx.fill();
    /* 腿 */
    bx.lineWidth=15; bx.strokeStyle='#0b2440'; bx.lineCap='round';
    bx.beginPath(); bx.moveTo(-8,10); bx.lineTo(-34,52); bx.stroke();
    bx.beginPath(); bx.moveTo(10,10); bx.lineTo(34,50); bx.stroke();
    /* 手臂 */
    bx.beginPath(); bx.moveTo(-16,-24); bx.lineTo(-52,-44); bx.stroke();
    bx.beginPath(); bx.moveTo(16,-26); bx.lineTo(50,-56); bx.stroke();
    /* 板 */
    bx.fillStyle='#f4f7fb'; bx.beginPath(); bx.ellipse(0,62,44,8,0,0,6.2832); bx.fill();
    bx.fillStyle='#ff5a1f'; bx.fillRect(-40,58,80,5);
    bx.restore();
  })();

  /* 怼脸华夫鞋底（右侧） */
  (function sole(){
    const w=W*0.24, h=H*0.92, x=W*0.86, y=H*0.50;
    bx.save(); bx.translate(x,y); bx.rotate(0.10);
    bx.fillStyle='#eef3f8'; bx.strokeStyle='#b9c8d8'; bx.lineWidth=3;
    bx.beginPath();
    bx.moveTo(-w*0.42,-h*0.45);
    bx.quadraticCurveTo(w*0.5,-h*0.40,w*0.44,-h*0.02);
    bx.quadraticCurveTo(w*0.40,h*0.30,w*0.24,h*0.46);
    bx.quadraticCurveTo(0,h*0.52,-w*0.28,h*0.44);
    bx.quadraticCurveTo(-w*0.48,h*0.10,-w*0.44,-h*0.10);
    bx.quadraticCurveTo(-w*0.46,-h*0.44,-w*0.42,-h*0.45);
    bx.closePath(); bx.fill(); bx.stroke();
    /* 华夫格 */
    bx.fillStyle='#c9d6e3';
    for(let gy=-h*0.40;gy<h*0.42;gy+=h*0.075){
      for(let gx=-w*0.36;gx<w*0.36;gx+=w*0.115){
        bx.beginPath(); bx.roundRect(gx,gy,w*0.075,h*0.052,3); bx.fill();
      }
    }
    /* 气垫圆 */
    bx.strokeStyle='#8fa8bf'; bx.lineWidth=5;
    bx.beginPath(); bx.arc(0,-h*0.10,w*0.19,0,6.2832); bx.stroke();
    bx.fillStyle='#0b2440'; bx.font='900 '+Math.round(w*0.13)+'px Arial'; bx.textAlign='center';
    bx.fillText('AIR',0,-h*0.075);
    /* 红条 */
    bx.fillStyle='#ff5a1f'; bx.fillRect(-w*0.40,h*0.05,w*0.80,h*0.035);
    bx.fillStyle='#0b2440'; bx.font='900 '+Math.round(w*0.10)+'px Arial';
    bx.save(); bx.translate(0,h*0.19); bx.rotate(-0.06); bx.fillText('AIR 2000',0,0); bx.restore();
    bx.restore();
  })();

  /* 顶部镀铬标题 */
  (function title(){
    const t='LIFT OFF';
    const fs=Math.round(Math.min(W*0.115,H*0.16));
    bx.save(); bx.translate(W*0.52,H*0.115); bx.rotate(-0.055);
    bx.font='900 italic '+fs+'px "Arial Black",Impact,Arial';
    bx.textAlign='center'; bx.textBaseline='middle';
    const tg=bx.createLinearGradient(0,-fs*0.6,0,fs*0.6);
    tg.addColorStop(0,'#ffffff'); tg.addColorStop(.45,'#cdd9e6'); tg.addColorStop(.52,'#8fa2b6');
    tg.addColorStop(.72,'#eef4fa'); tg.addColorStop(1,'#9fb2c6');
    bx.lineWidth=fs*0.075; bx.strokeStyle='#0b2440'; bx.strokeText(t,0,0);
    bx.fillStyle=tg; bx.fillText(t,0,0);
    bx.restore();
  })();

  /* 角标 */
  bx.fillStyle='#ff5a1f'; bx.fillRect(W*0.022,H*0.075,W*0.115,H*0.032);
  bx.fillStyle='#0b2440'; bx.font='800 '+Math.round(H*0.021)+'px Arial'; bx.textAlign='left';
  bx.fillText('TRK 04 / LIFT OFF',W*0.030,H*0.098);
  bx.font='800 '+Math.round(H*0.017)+'px Arial'; bx.fillStyle='rgba(255,255,255,.85)';
  bx.fillText('A E R O',W*0.024,H*0.048);
  bx.textAlign='right'; bx.fillText('MP3 128 · 2000',W*0.976,H*0.048);
  dirty=true;
}

function resize(){
  W=Math.max(2,innerWidth); H=Math.max(2,innerHeight); PR=Math.min(1.5,devicePixelRatio||1);
  cv.width=Math.round(W*PR); cv.height=Math.round(H*PR); bake(); dirty=true;
}
addEventListener('resize',()=>{ clearTimeout(resize._t); resize._t=setTimeout(resize,140); });

function draw(){ const g=cv.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.drawImage(bc,0,0); }

function build(i){
  const L=lines[i]; curEl.innerHTML='';
  if(!L){ prevEl.textContent=''; nextEl.textContent=''; return; }
  for(const ch of Array.from(String(L.text||''))){
    const s=document.createElement('span'); s.textContent = ch===' '?'\u00a0':ch; curEl.appendChild(s);
  }
  prevEl.textContent = lines[i-1] ? lines[i-1].text : '';
  nextEl.textContent = lines[i+1] ? lines[i+1].text : '';
  hint.style.opacity='0';
}

function loop(){
  const js0=performance.now();
  const T=now(); vT = RM ? T*0.24 : T;
  let i=-1; for(let k=0;k<lines.length;k++){ if(lines[k].t<=T+1e-4) i=k; else break; }
  if(i!==idx){ idx=i; if(i<0){ curEl.innerHTML=''; hint.style.opacity='.9'; } else build(i); dirty=true; }
  if(idx>=0 && lines[idx]){
    const L=lines[idx], sp=curEl.children, n=sp.length;
    const dur=Math.max(0.8,(L.dur==null?4:+L.dur)), cs=L.chars;
    for(let k=0;k<n;k++){
      let tt;
      if(cs && cs.length){ const j=Math.min(cs.length-1,Math.floor(k*cs.length/n)); tt=(cs[j]&&cs[j].t!=null)?+cs[j].t:(L.t+dur*0.88*k/n); }
      else tt=L.t+dur*0.88*k/n;
      const on = T>=tt;
      if((sp[k].className==='on') !== on) sp[k].className = on?'on':'';
    }
  }
  try{ if(playing||dirty){ draw(); dirty=false; } }catch(e){ errMsg='draw:'+(e&&e.message||e); }
  if(!readySent){ readySent=true; try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(_){} }
  frames++; jsMs=performance.now()-js0; requestAnimationFrame(loop);
}

addEventListener('message',(e)=>{
  const d=e.data; if(!d||d.__c100!==1) return;
  const p=d.payload||{};
  if(d.type==='init'){
    lines=(p.lines||[]).slice().sort((a,b)=>a.t-b.t);
    idx=-1; clockT=0; clockAt=performance.now(); playing=true;
    hint.textContent = lines.length?'等待第一句…':'这首没有歌词';
    hint.style.opacity = lines.length?'.9':'.5';
    curEl.innerHTML=''; prevEl.textContent=''; nextEl.textContent=''; dirty=true;
  } else if(d.type==='tick'){
    clockT=+p.time||0; clockAt=performance.now();
    playing = (p.playing===undefined)? true : !!p.playing;
    tickN++; dirty=true;
  } else if(d.type==='beat'){ dirty=true; }
});

window.__stage=()=>({
  lines:lines.length, idx, t:+now().toFixed(2), playing, frames,
  js:+jsMs.toFixed(2), err:errMsg, text:(idx>=0&&lines[idx])?lines[idx].text:'',
  gl:false, rm:RM
});

resize(); draw(); loop();
</script>
</body>
</html>
