<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>495 · FIELD PLATE</title>
<style>
  :root{
    --paper:#e7e2d3;
    --ink:#141610;
    --ink2:rgba(20,22,16,.62);
    --ink3:rgba(20,22,16,.34);
    --hair:rgba(20,22,16,.22);
    --accent:#8d3b2e;
    --footH:clamp(24px,4.4vh,38px);
    --bandH:clamp(16px,4.2vh,40px);
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    --mono:"Consolas","SF Mono",ui-monospace,"DejaVu Sans Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{font-family:var(--serif);-webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block}
  #sheet{position:fixed;inset:0;width:100%;height:100%}
  #cont{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform}
  #over{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #shade{position:fixed;inset:0;pointer-events:none;background:#141610;opacity:0;will-change:opacity}
  #gram{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;
        background:radial-gradient(124% 98% at 44% 40%,rgba(20,22,16,0) 46%,rgba(20,22,16,.13) 100%)}

  .label{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
  .label b{color:var(--ink2);font-weight:400}
  #hab{color:var(--accent);letter-spacing:.14em;opacity:.92;font-size:9.5px}

  /* ---------- header ---------- */
  #hdr{position:fixed;left:max(3.2vw,22px);top:max(3.2vh,18px);opacity:0;transition:opacity .8s ease}
  .ln{display:flex;align-items:baseline;gap:.9em}
  #hdr h1{font-size:clamp(15px,1.55vw,22px);font-weight:400;letter-spacing:.06em}
  #hdr .no{font-family:var(--mono);font-size:clamp(9px,.72vw,11px);letter-spacing:.3em;color:var(--accent)}
  #hdr .rule{width:clamp(48px,7vw,110px);height:1px;background:var(--ink3);margin:.9em 0 .7em}
  #hdr .label{margin-top:.35em}

  /* ---------- data table ---------- */
  #data{position:fixed;left:max(3.2vw,22px);top:clamp(118px,16.5vh,190px);width:min(26vw,290px);opacity:0;transition:opacity .9s ease}
  #data .row{display:grid;grid-template-columns:1fr auto;gap:1em;padding:.5em 0;border-bottom:1px solid var(--hair)}
  #data .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
  #data .v{font-family:var(--mono);font-size:clamp(9px,.78vw,11.5px);letter-spacing:.05em;color:var(--ink);font-variant-numeric:tabular-nums}

  /* ---------- specimen plate ---------- */
  #plate{position:fixed;right:max(3.2vw,22px);top:44%;transform:translateY(-50%);width:min(30vw,42vh);opacity:0;transition:opacity 1s ease}
  #plate .frame{position:relative;padding:6px;border:1px solid var(--ink3);background:rgba(255,255,255,.16)}
  #plate canvas{width:100%;height:auto;display:block}
  #plate .cap{display:flex;justify-content:space-between;margin-top:.6em;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink3)}
  #plate .tick{position:absolute;width:9px;height:9px;border:1px solid var(--ink2)}
  #plate .tick.tl{left:-4px;top:-4px;border-right:0;border-bottom:0}
  #plate .tick.tr{right:-4px;top:-4px;border-left:0;border-bottom:0}
  #plate .tick.bl{left:-4px;bottom:-4px;border-right:0;border-top:0}
  #plate .tick.br{right:-4px;bottom:-4px;border-left:0;border-top:0}

  /* ---------- lyrics ---------- */
  #lyr{position:fixed;left:max(3.2vw,22px);right:max(3.2vw,22px);bottom:calc(var(--footH) + var(--bandH) + clamp(12px,2.8vh,36px));opacity:0;transition:opacity .9s ease}
  #lyr .top{display:flex;align-items:center;gap:1em;margin-bottom:clamp(10px,1.6vh,20px)}
  #lyr .top .rule{flex:1;height:1px;background:var(--hair)}
  #lyr .top .take{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--accent)}
  #line{font-size:clamp(21px,3.9vmin,52px);line-height:1.46;letter-spacing:.05em;color:var(--ink);max-width:min(58vw,820px);text-wrap:balance}
  #line .c{opacity:1;color:rgba(20,22,16,.46);transition:color .16s linear,opacity .16s linear}
  #line .c.on{color:var(--ink);opacity:1}
  #line .c.dim{color:rgba(20,22,16,.46)}
  #line.fresh{animation:settle .5s cubic-bezier(.2,.8,.25,1) both}
  @keyframes settle{
    from{opacity:0;transform:translateY(9px);letter-spacing:.13em}
    to{opacity:1;transform:none;letter-spacing:.05em}
  }
  #empty{display:none;font-size:clamp(14px,1.7vmin,20px);letter-spacing:.18em;color:var(--ink2)}

  /* ---------- footer ---------- */
  #foot{position:fixed;left:0;right:0;bottom:0;height:var(--footH);display:flex;align-items:center;justify-content:space-between;
        padding:0 max(3.2vw,22px);border-top:1px solid var(--hair);opacity:0;transition:opacity 1s ease;
        font-family:var(--mono);font-size:clamp(7.5px,.62vw,9px);letter-spacing:.2em;color:var(--ink3);text-transform:uppercase}
  #foot .mid{display:flex;gap:1.6em;align-items:center}

  .on-air{display:inline-flex;align-items:center;gap:.55em}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.35}

  @media (max-aspect-ratio: 4/5){
    #hdr h1{font-size:16px}
    #plate{right:auto;left:max(3.4vw,18px);top:clamp(96px,15vh,150px);transform:none;width:43vw}
    #data{left:auto;right:max(3.4vw,18px);top:clamp(100px,15.8vh,158px);width:43vw}
    #data .row{padding:.4em 0}
    #data .k{font-size:7px;letter-spacing:.1em}
    #data .v{font-size:8px;letter-spacing:0}
    #lyr{bottom:calc(var(--footH) + var(--bandH) + clamp(10px,2.4vh,26px))}
    #lyr .top{margin-bottom:8px}
    #line{font-size:clamp(20px,5.4vw,32px);line-height:1.5;max-width:100%}
    #foot{font-size:7px;letter-spacing:.12em}
    #foot .mid{gap:.8em}
  }
  @media (max-aspect-ratio: 4/5) and (max-height: 720px){
    #plate{top:clamp(84px,13vh,120px);width:42vw}
    #data{top:clamp(88px,13.6vh,126px);width:46vw}
  }
</style>
</head>
<body>
<canvas id="sheet"></canvas>
<canvas id="cont"></canvas>
<canvas id="over"></canvas>
<div id="shade"></div>
<div id="gram"></div>

<header id="hdr">
  <div class="ln"><span class="no">FR·495</span><h1>待命名录音</h1></div>
  <div class="rule"></div>
  <div class="label">FIELD RECORDING <b>/ SOUNDSCAPE ECOLOGY</b></div>
  <div class="label" id="hab">针阔混交林 · 夜</div>
</header>

<section id="data">
  <div class="row"><span class="k">LAT / LON</span><span class="v" id="d-lat">46°48'12"N 121°03'44"E</span></div>
  <div class="row"><span class="k">ALTITUDE</span><span class="v" id="d-alt">1 842 M</span></div>
  <div class="row"><span class="k">TEMP / RH</span><span class="v" id="d-th">−3.4 °C / 81 %</span></div>
  <div class="row"><span class="k">DATE / TIME</span><span class="v" id="d-dt">2024.11.03  02:41</span></div>
  <div class="row"><span class="k">MICROPHONE</span><span class="v" id="d-mic">SENN. MKH 8020</span></div>
</section>

<figure id="plate">
  <div class="frame">
    <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
    <canvas id="spec" width="620" height="760"></canvas>
  </div>
  <figcaption class="cap"><span id="p-a">PLATE 01 · IR 850nm</span><span id="p-b">2.4 s · f/2.0</span></figcaption>
</figure>

<section id="lyr">
  <div class="top"><span class="take" id="take">TAKE 03</span><span class="rule"></span><span class="take" id="tc">00:00</span></div>
  <div id="line"><span class="c">等待信号</span></div>
  <div id="empty" style="display:none">本录音无歌词记录 · NO TRANSCRIPT ATTACHED</div>
</section>

<footer id="foot">
  <span id="f1">46°48'12"N · 121°03'44"E</span>
  <span class="mid"><span class="on-air"><i class="dot"></i>REC</span><span id="f2">-18.4 dBFS</span></span>
  <span id="f3">48 kHz / 24 bit</span>
</footer>

<script>
(function(){
  'use strict';

  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var S = {
    W: 1440, H: 900, dpr: 1,
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, gl: false, err: '',
    accent: [141, 59, 46],
    dur: 0, song: null, inited: false, seed: 495,
    lastTick: 0, beat: 0, beatT: -9, live: null
  };

  var cvs = document.getElementById('sheet');
  var ctx = cvs.getContext('2d');
  var elLine = document.getElementById('line');
  var elEmpty = document.getElementById('empty');
  var elHdr = document.getElementById('hdr');
  var elData = document.getElementById('data');
  var elPlate = document.getElementById('plate');
  var elLyr = document.getElementById('lyr');
  var elFoot = document.getElementById('foot');
  var elTc = document.getElementById('tc');
  var elF1 = document.getElementById('f1');
  var elF2 = document.getElementById('f2');
  var elF3 = document.getElementById('f3');
  var elTake = document.getElementById('take');

  var oc = document.getElementById('over');
  var octx = oc.getContext('2d');
  var contEl = document.getElementById('cont');
  var cctx = contEl.getContext('2d');
  var contCv = contEl;
  var shadeEl = document.getElementById('shade');
  var staticCv = document.createElement('canvas');   /* 纸面，预渲染一次 */
  var sctx = staticCv.getContext('2d');
  var terrainDirty = true;
  var paperDirty = true;
  /* 主色 → 印刷墨色（保证在浅纸上足够深，不会出现浅色细线） */
  var inkCache = null, inkCacheKey = '';
  function inkOf(rgb){
    var key = rgb[0] + ',' + rgb[1] + ',' + rgb[2];
    if (inkCache && key === inkCacheKey) return inkCache;
    var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
    var lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    if (!isFinite(lum)) lum = 0.3;
    var k = lum > 0.42 ? 0.34 / Math.max(0.08, lum) : 1;   /* 太亮的色压暗 */
    r = Math.min(1, r * k); g = Math.min(1, g * k); b = Math.min(1, b * k);
    /* 与墨色调和，避免荧光 */
    r = r * 0.60 + 0.10; g = g * 0.60 + 0.10; b = b * 0.60 + 0.08;
    inkCacheKey = key;
    inkCache = 'rgb(' + Math.round(r * 255) + ',' + Math.round(g * 255) + ',' + Math.round(b * 255) + ')';
    return inkCache;
  }
  function inkRGBA(a){
    var c = inkOf(S.accent);
    return 'rgba(' + c.slice(4, -1) + ',' + a.toFixed(3) + ')';
  }

  /* ---------- sizing ---------- */
  function sizeNow(){
    var w = window.innerWidth | 0, h = window.innerHeight | 0;
    if (!w || !isFinite(w) || w < 2) w = 1440;
    if (!h || !isFinite(h) || h < 2) h = 900;
    S.W = w; S.H = h;
    S.dpr = Math.min(1.5, Math.max(1, window.devicePixelRatio || 1));
    var dw = Math.round(w * S.dpr), dh = Math.round(h * S.dpr);
    cvs.width = dw; cvs.height = dh;
    oc.width = dw; oc.height = dh;
    staticCv.width = dw; staticCv.height = dh;
    ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    octx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    terrainDirty = true;
    paperDirty = true;
  }

  /* ---------- 4-octave value noise（固定表，零随机开销） ---------- */
  function hash2(x, y){
    var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function vnoise(x, y){
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
  }
  var OCT = [1, 0.5, 0.26, 0.13];
  function fbm(x, y){
    var s = 0, amp = 0.5, f = 1, norm = 0;
    for (var i = 0; i < 4; i++){
      s += amp * vnoise(x * f, y * f);
      norm += amp; amp *= 0.5; f *= 2.03;
    }
    return s / norm;
  }

  /* 地形场：零访问默认；分帧填充，避免单帧超时 */
  var tw = 0, th = 0, field = null;
  var fieldRow = 0, fieldReady = false;
  var levelCursor = 0, contourReady = false;

  function allocField(){
    tw = Math.max(64, Math.min(200, Math.round(S.W / 8)));
    th = Math.max(48, Math.min(140, Math.round(S.H / 8)));
    field = new Float32Array(tw * th);
    fieldRow = 0; fieldReady = false;
    levelCursor = 0; contourReady = false;
    try { contourPrepare(); } catch(e){ console.error('[495] contour prepare', e); }
  }

  function fillFieldChunk(rows){
    if (!field) return;
    var ax = S.W * 0.70, ay = S.H * 0.40;
    var end = Math.min(th, fieldRow + rows);
    for (var j = fieldRow; j < end; j++){
      for (var i = 0; i < tw; i++){
        var nx = i / tw * 3.1, ny = j / th * Math.min(2.4, S.H / S.W * 3.1);
        var n = fbm(nx, ny);
        var ridge = 1 - Math.abs(fbm(nx * 1.7 + 11, ny * 1.7 - 4) * 2 - 1);
        n = n * 0.62 + ridge * 0.38;
        if (S.W > 10 && S.H > 10){
          var dx = (i / tw * S.W - ax) / S.W, dy = (j / th * S.H - ay) / S.H;
          n += 0.16 * (1 - Math.min(1, Math.sqrt(dx * dx + dy * dy) * 2.1));
        }
        field[j * tw + i] = n;
      }
    }
    fieldRow = end;
    if (fieldRow >= th){ normalizeField(); fieldReady = true; }
  }

  /* 拉伸到 0..1，保证 16 层等高线全都有实际地形 */
  function normalizeField(){
    var lo = 1e9, hi = -1e9, i, n = field.length, v;
    for (i = 0; i < n; i++){ v = field[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    var span = hi - lo;
    if (!(span > 1e-6)) span = 1;
    for (i = 0; i < n; i++) field[i] = (field[i] - lo) / span;
  }
  function sampleField(fx, fy){
    if (!field || !tw || !th) return 0.5;
    var x = fx * (tw - 1), y = fy * (th - 1);
    if (x < 0) x = 0; else if (x > tw - 1) x = tw - 1;
    if (y < 0) y = 0; else if (y > th - 1) y = th - 1;
    var x0 = x | 0, y0 = y | 0;
    var x1 = x0 + 1 < tw ? x0 + 1 : x0, y1 = y0 + 1 < th ? y0 + 1 : y0;
    var u = x - x0, v = y - y0;
    var a = field[y0 * tw + x0], b = field[y0 * tw + x1];
    var c = field[y1 * tw + x0], d = field[y1 * tw + x1];
    return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
  }

  /* ---------- 等高线（画在独立 canvas 上，呼吸交给 CSS transform） ---------- */
  var LEVELS = 13;
  function contourPrepare(){
    var W = S.W, H = S.H, D = S.dpr;
    var needW = Math.round(W * D), needH = Math.round(H * D);
    if (contCv.width !== needW || contCv.height !== needH){
      contCv.width = needW; contCv.height = needH;
    }
    cctx.setTransform(1, 0, 0, 1, 0, 0);
    cctx.clearRect(0, 0, contCv.width, contCv.height);
    cctx.setTransform(D, 0, 0, D, 0, 0);
    levelCursor = 0; contourReady = false;
  }

  /* 每次只画几个等高线层级 */
  var EB = new Float32Array(8);   /* 复用交点缓冲，避免每格分配 */
  function contourStep(count){
    if (!field || !fieldReady) return;
    var W = S.W, H = S.H;
    var cw = tw, ch = th;
    var sx = W / (cw - 1), sy = H / (ch - 1);
    var stop = Math.min(LEVELS, levelCursor + count);
    for (var lv = levelCursor; lv < stop; lv++){
      var thr = 0.06 + lv * (0.84 / (LEVELS - 1));
      var major = (lv % 4 === 3);
      cctx.beginPath();
      for (var j = 0; j < ch - 1; j++){
        var row = j * cw;
        for (var i = 0; i < cw - 1; i++){
          var a = field[row + i], b = field[row + i + 1];
          var c = field[row + cw + i + 1], d = field[row + cw + i];
          var m = (a > thr ? 1 : 0) | (b > thr ? 2 : 0) | (c > thr ? 4 : 0) | (d > thr ? 8 : 0);
          if (m === 0 || m === 15) continue;
          var x0 = i * sx, y0 = j * sy, np = 0, f;
          if ((m & 1) !== ((m >> 1) & 1)){ f = (thr - a) / (b - a); EB[np++] = x0 + f * sx; EB[np++] = y0; }
          if (((m >> 1) & 1) !== ((m >> 2) & 1)){ f = (thr - b) / (c - b); EB[np++] = x0 + sx; EB[np++] = y0 + f * sy; }
          if (((m >> 2) & 1) !== ((m >> 3) & 1)){ f = (thr - c) / (d - c); EB[np++] = x0 + sx - f * sx; EB[np++] = y0 + sy; }
          if (((m >> 3) & 1) !== (m & 1)){ f = (thr - d) / (a - d); EB[np++] = x0; EB[np++] = y0 + sy - f * sy; }
          if (np === 4){
            cctx.moveTo(EB[0], EB[1]); cctx.lineTo(EB[2], EB[3]);
          } else if (np === 8){
            cctx.moveTo(EB[0], EB[1]); cctx.lineTo(EB[2], EB[3]);
            cctx.moveTo(EB[4], EB[5]); cctx.lineTo(EB[6], EB[7]);
          }
        }
      }
      cctx.strokeStyle = major ? 'rgba(20,22,16,.42)' : 'rgba(20,22,16,.16)';
      cctx.lineWidth = major ? 1.1 : 0.7;
      cctx.stroke();
    }
    levelCursor = stop;
    if (levelCursor >= LEVELS) contourFinish();
  }

  function contourFinish(){
    var W = S.W, H = S.H;
    /* 遮罩：歌词区留白 */
    cctx.globalCompositeOperation = 'destination-in';
    var g = cctx.createLinearGradient(W * 0.94, H * 0.04, W * 0.08, H * 1.04);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.5, 'rgba(0,0,0,.74)');
    g.addColorStop(1, 'rgba(0,0,0,.14)');
    cctx.fillStyle = g;
    cctx.fillRect(0, 0, W, H);
    cctx.globalCompositeOperation = 'source-over';

    /* 高程标注 */
    cctx.font = '9px Consolas,monospace';
    cctx.fillStyle = 'rgba(20,22,16,.36)';
    for (var t = 0; t < 7; t++){
      var lx = W * (0.34 + t * 0.09), ly = H * (0.11 + ((t * 7) % 5) * 0.058);
      cctx.fillText(String(1180 + t * 60 + (t % 3) * 12), lx, ly);
    }

    /* 采集点十字准星 */
    var ax = W * 0.70, ay = H * 0.40;
    cctx.strokeStyle = inkRGBA(0.86);
    cctx.lineWidth = 1;
    cctx.beginPath();
    cctx.moveTo(ax - 12, ay); cctx.lineTo(ax - 3, ay);
    cctx.moveTo(ax + 3, ay); cctx.lineTo(ax + 12, ay);
    cctx.moveTo(ax, ay - 12); cctx.lineTo(ax, ay - 3);
    cctx.moveTo(ax, ay + 3); cctx.lineTo(ax, ay + 12);
    cctx.stroke();
    cctx.beginPath(); cctx.arc(ax, ay, 2.1, 0, 6.2832);
    cctx.fillStyle = inkRGBA(0.92); cctx.fill();
    cctx.beginPath(); cctx.arc(ax, ay, 16, 0, 6.2832);
    cctx.strokeStyle = inkRGBA(0.32); cctx.stroke();
    cctx.font = '8.5px Consolas,monospace';
    cctx.fillStyle = inkRGBA(0.92);
    cctx.fillText('REC · PT.01', ax + 18, ay - 5);
    cctx.fillStyle = 'rgba(20,22,16,.36)';
    cctx.fillText((S.alt || 1842) + ' m', ax + 18, ay + 9);

    /* 比例尺 + 指北 */
    var sbx = W * 0.035, sby = H * 0.63, sbw = Math.min(W * 0.14, 190);
    cctx.strokeStyle = 'rgba(20,22,16,.5)';
    cctx.lineWidth = 1;
    cctx.beginPath();
    cctx.moveTo(sbx, sby); cctx.lineTo(sbx, sby - 5);
    cctx.moveTo(sbx, sby); cctx.lineTo(sbx + sbw, sby);
    cctx.moveTo(sbx + sbw, sby); cctx.lineTo(sbx + sbw, sby - 5);
    cctx.moveTo(sbx + sbw / 2, sby); cctx.lineTo(sbx + sbw / 2, sby - 3.5);
    cctx.stroke();
    cctx.font = '8.5px Consolas,monospace';
    cctx.fillStyle = 'rgba(20,22,16,.44)';
    cctx.fillText('0', sbx - 2, sby + 12);
    cctx.fillText('500 m', sbx + sbw - 17, sby + 12);

    /* 指北针 */
    var nx = sbx + sbw + 34, ny = sby - 16;
    cctx.strokeStyle = 'rgba(20,22,16,.44)';
    cctx.beginPath();
    cctx.moveTo(nx, ny - 14); cctx.lineTo(nx, ny + 6);
    cctx.moveTo(nx, ny - 14); cctx.lineTo(nx - 4, ny - 6);
    cctx.moveTo(nx, ny - 14); cctx.lineTo(nx + 4, ny - 6);
    cctx.stroke();
    cctx.font = '8px Consolas,monospace';
    cctx.fillText('N', nx - 2.5, ny - 18);
    cctx.fillStyle = 'rgba(20,22,16,.3)';
    cctx.fillText('1:25 000', sbx, sby - 10);

    contourReady = true;
  }

  /* ---------- 纸面颗粒（预渲染一次，避免每帧 filter） ---------- */
  var grainCv = document.createElement('canvas');
  function buildGrain(){
    var s = 160;
    grainCv.width = s; grainCv.height = s;
    var g = grainCv.getContext('2d');
    var img = g.createImageData(s, s), d = img.data;
    for (var i = 0, p = 0; i < s * s; i++, p += 4){
      var n = (hash2(i % s, (i / s) | 0) * 255) | 0;
      d[p] = d[p + 1] = d[p + 2] = n;
      d[p + 3] = 24;
    }
    g.putImageData(img, 0, 0);
  }

  /* ---------- 静态纸层 ---------- */
  function drawTerrain(){
    var D = S.dpr;
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.clearRect(0, 0, S.W * D, S.H * D);
    sctx.setTransform(D, 0, 0, D, 0, 0);
    var W = S.W, H = S.H;
    if (W < 2 || H < 2) return;

    var paper = '#e7e2d3';
    sctx.fillStyle = paper;
    sctx.fillRect(0, 0, W, H);

    /* 纸面横向纸纹 */
    sctx.globalAlpha = 0.5;
    sctx.lineWidth = 1;
    for (var g = 0; g < 26; g++){
      var gy = (g + 0.5) * H / 26;
      sctx.strokeStyle = (g % 3 === 0) ? 'rgba(20,22,16,.045)' : 'rgba(20,22,16,.022)';
      sctx.beginPath();
      sctx.moveTo(0, gy);
      sctx.lineTo(W, gy + Math.sin(g * 2.1) * 1.4);
      sctx.stroke();
    }
    sctx.globalAlpha = 1;

    /* 纸面颗粒 */
    if (grainCv.width){
      var pat = sctx.createPattern(grainCv, 'repeat');
      if (pat){ sctx.fillStyle = pat; sctx.globalAlpha = 0.5; sctx.fillRect(0, 0, W, H); sctx.globalAlpha = 1; }
    }

    /* 印刷角标 */
    sctx.strokeStyle = 'rgba(20,22,16,.20)';
    sctx.lineWidth = 1;
    var pad = Math.max(14, Math.min(W, H) * 0.028);
    var arm = Math.max(10, Math.min(W, H) * 0.022);
    var corners = [[pad, pad, 1, 1], [W - pad, pad, -1, 1], [pad, H - pad, 1, -1], [W - pad, H - pad, -1, -1]];
    for (var ci = 0; ci < 4; ci++){
      var c = corners[ci];
      sctx.beginPath();
      sctx.moveTo(c[0] + c[2] * arm, c[1]);
      sctx.lineTo(c[0], c[1]);
      sctx.lineTo(c[0], c[1] + c[3] * arm);
      sctx.stroke();
    }
  }

  /* 频谱条（声谱仪）— 单次预渲染的柱高，按 live 电平缩放 */
  var GRAM_BARS = 128;
  var gramBars = new Float32Array(GRAM_BARS);
  function buildGram(){
    for (var i = 0; i < GRAM_BARS; i++){
      var x = i / GRAM_BARS;
      var env = Math.exp(-Math.pow((x - 0.34) / 0.42, 2));
      var jitter = 0.42 + 0.58 * Math.abs(Math.sin(i * 1.93 + 0.7) * Math.cos(i * 0.61));
      gramBars[i] = Math.min(1, Math.max(0.08, env * jitter));
    }
  }
  buildGram();

  /* ---------- 逐字点亮 ---------- */
  var spans = [];
  var litCount = -1;
  function bindLine(i){
    var ln = S.lines[i];
    elLine.innerHTML = '';
    spans = []; litCount = -1;
    if (!ln){
      elLine.style.display = 'none';
      elEmpty.style.display = 'block';
      elEmpty.textContent = !S.inited ? '等待采集信号 · AWAITING SIGNAL'
        : S.lines.length ? '前奏 · 未进入记录'
        : '本录音无歌词记录 · NO TRANSCRIPT ATTACHED';
      return;
    }
    elEmpty.style.display = 'none';
    elLine.style.display = 'block';
    elLine.classList.remove('fresh');
    var text = String(ln.text == null ? '' : ln.text);
    if (!text.trim()){
      elLine.style.display = 'none';
      elEmpty.style.display = 'block';
      elEmpty.textContent = '（此段为环境声 · NO DIALOGUE）';
      return;
    }
    var chars = Array.from(text);
    if (chars.length > 420) chars = chars.slice(0, 420);
    var frag = document.createDocumentFragment();
    for (var k = 0; k < chars.length; k++){
      var s = document.createElement('span');
      s.className = 'c';
      s.textContent = chars[k];
      frag.appendChild(s);
      spans.push(s);
    }
    elLine.appendChild(frag);
    /* 每句入场：纸面显影 */
    if (!reduce && chars.length){
      void elLine.offsetWidth;
      elLine.classList.add('fresh');
    }
    /* 超长句自动降字号（不溢出） */
    var n = chars.length;
    elLine.style.fontSize = n > 46 ? 'clamp(17px,2.5vmin,34px)'
      : n > 30 ? 'clamp(19px,3.1vmin,42px)'
      : n > 18 ? 'clamp(20px,3.5vmin,48px)' : '';
  }

  /* 返回该句第 k 字的显影进度 0..1 */
  function charProgress(ln, k, chars){
    if (!ln || !chars.length) return 0;
    if (ln.chars && ln.chars.length){
      var cur = ln.chars[k];
      if (!cur && ln.chars.length){
        /* chars 长度与正文不符：截断处之后按已全部点亮处理 */
        return k >= ln.chars.length ? 1 : 0;
      }
      var st = cur && isFinite(cur.t) ? +cur.t : ln.t;
      var nx = ln.chars[k + 1];
      var en = nx && isFinite(nx.t) ? +nx.t : (st + 0.24);
      return Math.min(1, Math.max(0, (S.t - st) / Math.max(0.04, en - st)));
    }
    var dur = ln.dur > 0.1 ? ln.dur : (chars.length * 0.22);
    var per = dur / Math.max(1, chars.length);
    return Math.min(1, Math.max(0, (S.t - ln.t - k * per) / Math.max(0.04, per)));
  }

  function updateChars(){
    var ln = S.lines[S.idx];
    if (!ln || !spans.length) return;
    var i, n = spans.length;
    /* 每帧只在跨越阈值时改 DOM */
    var lit = 0;
    for (i = 0; i < n; i++){
      if (charProgress(ln, i, spans) > 0.02){ lit = i + 1; } else { break; }
    }
    if (lit === litCount) return;
    litCount = lit;
    for (i = 0; i < n; i++) spans[i].className = i < lit ? 'c on' : 'c';
  }

  /* ---------- 声谱仪 + 采集头 ---------- */
  var lastScan = 0, lastFlash = -1;
  function drawOverlay(now){
    var W = S.W, H = S.H;
    octx.clearRect(0, 0, W, H);
    var lv = S.live;
    var lvl = lv ? Math.max(0, Math.min(1, +lv.level || 0)) : 0.4;
    var bass = lv ? Math.max(0, Math.min(1, +lv.bass || 0)) : 0.3;
    var mid = lv ? Math.max(0, Math.min(1, +lv.mid || 0)) : 0.3;
    var tre = lv ? Math.max(0, Math.min(1, +lv.treble || 0)) : 0.2;
    var pulse = Math.max(0, 1 - (now - S.beatT) / 260) * S.beat;
    var energy = Math.max(lvl * 0.7 + bass * 0.5, pulse * 0.9);
    /* 无频谱时给一个缓慢起伏，画面不至于死 */
    if (!lv) energy = Math.max(energy, 0.34 + 0.16 * Math.sin(now * 0.0011));
    var clock = S.playing ? now : (S._freeze || (S._freeze = now));
    if (reduce) clock = 0;   /* 减动效：波形静止，但仍出帧 */

    /* 底部声谱带：紧贴页脚，把歌词让上去 */
    var bandH = Math.max(14, Math.min(38, H * 0.042));
    var footH = Math.max(24, Math.min(38, H * 0.044));
    var baseY = H - footH - Math.max(6, H * 0.008);
    octx.globalAlpha = 0.38;
    for (var i = 0; i < GRAM_BARS; i++){
      var wob = 0.55 + 0.45 * Math.sin(i * 0.41 + now * 0.0016 + i * 0.13);
      var hgt = gramBars[i] * wob * (0.34 + energy * 1.5);
      if (hgt < 0.6) hgt = 0.6;
      var bh = Math.min(bandH, hgt * bandH);
      var bx = (i / GRAM_BARS) * W + (W / GRAM_BARS) * 0.22;
      octx.fillStyle = i % 7 === 0 ? inkRGBA(0.30 + energy * 0.5)
                                   : 'rgba(20,22,16,' + (0.16 + energy * 0.4).toFixed(3) + ')';
      octx.fillRect(bx, baseY - bh, Math.max(1, W / GRAM_BARS * 0.5), bh);
    }
    octx.globalAlpha = 1;
    octx.strokeStyle = 'rgba(20,22,16,.22)';
    octx.lineWidth = 1;
    octx.beginPath(); octx.moveTo(0, baseY + 0.5); octx.lineTo(W, baseY + 0.5); octx.stroke();

    /* 走带扫描柱：像录音机磁头，随时间横向推进 */
    if (now - lastScan > 90){
      lastScan = now;
      var sx = W * (0.08 + ((clock * 0.00021) % 0.84));
      octx.strokeStyle = inkRGBA(0.18 + energy * 0.26);
      octx.lineWidth = 1;
      octx.beginPath(); octx.moveTo(sx, H * 0.055); octx.lineTo(sx, baseY - bandH * 1.6); octx.stroke();
      octx.beginPath(); octx.moveTo(sx, H * 0.055); octx.lineTo(sx - 5, H * 0.055 + 7); octx.stroke();
      octx.beginPath(); octx.moveTo(sx, H * 0.055); octx.lineTo(sx + 5, H * 0.055 + 7); octx.stroke();
    }

    /* 实时波形迹线：限制在底部声谱带内，绝不压到歌词 */
    var wy = baseY - bandH * 0.5;
    var amp = Math.max(1.5, bandH * 0.46);
    var N = 84;
    octx.save();
    octx.beginPath();
    octx.rect(0, baseY - bandH - 1, W, bandH + 1);
    octx.clip();
    octx.beginPath();
    for (var k = 0; k <= N; k++){
      var u = k / N;
      var xx = u * W;
      var env = Math.sin(u * 3.14159);
      var p = clock * 0.0022 + u * 17.0;
      var v = Math.sin(p) * 0.55 + Math.sin(p * 2.37 + 1.3) * 0.3 + Math.sin(p * 5.1) * 0.15;
      v *= 0.5 + bass * 0.9 + mid * 0.5;
      var yy = wy - v * amp * env;
      if (k === 0) octx.moveTo(xx, yy); else octx.lineTo(xx, yy);
    }
    octx.strokeStyle = inkRGBA(0.62 + energy * 0.3);
    octx.lineWidth = 1.2;
    octx.stroke();
    octx.restore();

    /* 采集点呼吸环 */
    var ax = W * 0.70, ay = H * 0.40;
    var rad = 10 + energy * 26;
    octx.strokeStyle = inkRGBA(Math.max(0.08, 0.34 - energy * 0.22));
    octx.lineWidth = 1;
    octx.beginPath(); octx.arc(ax, ay, rad, 0, 6.2832); octx.stroke();
    if (tre > 0.05){
      octx.strokeStyle = 'rgba(20,22,16,' + (0.10 + tre * 0.2).toFixed(3) + ')';
      octx.beginPath(); octx.arc(ax, ay, rad + 8 + mid * 16, 0, 6.2832); octx.stroke();
    }

    /* 鼓点：准星闪一下（时间点之间变化最明显的元素） */
    var flash = Math.round(Math.max(0, 1 - (now - S.beatT) / 340) * S.beat * 20) / 20;
    if (flash !== lastFlash){
      lastFlash = flash;
      octx.globalAlpha = flash;
      octx.strokeStyle = inkRGBA(0.9);
      octx.lineWidth = 1.4;
      octx.beginPath(); octx.arc(ax, ay, 5 + flash * 34, 0, 6.2832); octx.stroke();
      octx.globalAlpha = 1;
    }
  }

  /* ---------- 标本板：黑白红外森林 ---------- */
  var specCv = document.getElementById('spec');
  var spctx = specCv.getContext('2d');
  var specDrawn = false;
  function drawSpecimen(){
    var w = specCv.width, h = specCv.height;
    if (!w || !h) { w = 620; h = 760; }
    spctx.setTransform(1, 0, 0, 1, 0, 0);
    /* 黑白红外底 */
    var g = spctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#262a24');
    g.addColorStop(0.46, '#31352d');
    g.addColorStop(0.72, '#14170f');
    g.addColorStop(1, '#090b08');
    spctx.fillStyle = g;
    spctx.fillRect(0, 0, w, h);

    /* 树干 */
    var trunks = 7;
    var sd = S.seed || 495;
    for (var i = 0; i < trunks; i++){
      var bx = (i + 0.5) * w / trunks + Math.sin(i * 2.3 + (sd % 17) * 0.1) * 26;
      var bw = 12 + (i % 3) * 13;
      var tg = spctx.createLinearGradient(bx - bw, 0, bx + bw, 0);
      tg.addColorStop(0, 'rgba(12,14,10,0)');
      tg.addColorStop(0.34, 'rgba(118,124,110,.78)');
      tg.addColorStop(0.55, 'rgba(150,156,140,.9)');
      tg.addColorStop(0.78, 'rgba(86,92,80,.7)');
      tg.addColorStop(1, 'rgba(12,14,10,0)');
      spctx.fillStyle = tg;
      spctx.beginPath();
      spctx.moveTo(bx - bw, h * 0.60);
      spctx.quadraticCurveTo(bx - bw * 0.7, h * 0.3, bx - bw * 0.42, 0);
      spctx.lineTo(bx + bw * 0.42, 0);
      spctx.quadraticCurveTo(bx + bw * 0.7, h * 0.3, bx + bw, h * 0.60);
      spctx.closePath();
      spctx.fill();
    }

    /* 枝桠 */
    spctx.strokeStyle = 'rgba(150,156,140,.5)';
    for (var b = 0; b < 16; b++){
      var ox = ((b * 97) % w), oy = h * (0.06 + ((b * 13) % 40) / 100);
      spctx.lineWidth = 1 + (b % 3) * 0.6;
      spctx.beginPath();
      spctx.moveTo(ox, oy);
      spctx.lineTo(ox + Math.sin(b) * 46, oy - 34 - (b % 4) * 9);
      spctx.stroke();
    }

    /* 地面雾 */
    var fog = spctx.createLinearGradient(0, h * 0.48, 0, h * 0.86);
    fog.addColorStop(0, 'rgba(196,200,186,0)');
    fog.addColorStop(0.55, 'rgba(196,200,186,.28)');
    fog.addColorStop(1, 'rgba(196,200,186,0)');
    spctx.fillStyle = fog;
    spctx.fillRect(0, h * 0.44, w, h * 0.46);

    /* 动物 */
    var fx = w * 0.53, fy = h * 0.71;
    spctx.fillStyle = 'rgba(216,220,204,.94)';
    spctx.beginPath();
    spctx.ellipse(fx, fy, 54, 25, -0.06, 0, 6.2832);
    spctx.fill();
    /* 颈 */
    spctx.beginPath();
    spctx.moveTo(fx - 40, fy - 12);
    spctx.quadraticCurveTo(fx - 62, fy - 50, fx - 54, fy - 66);
    spctx.lineTo(fx - 38, fy - 62);
    spctx.quadraticCurveTo(fx - 42, fy - 36, fx - 26, fy - 16);
    spctx.closePath();
    spctx.fill();
    /* 头 */
    spctx.beginPath();
    spctx.ellipse(fx - 52, fy - 74, 17, 11, -0.5, 0, 6.2832);
    spctx.fill();
    /* 耳 */
    spctx.beginPath();
    spctx.moveTo(fx - 58, fy - 84); spctx.lineTo(fx - 66, fy - 100); spctx.lineTo(fx - 48, fy - 88);
    spctx.closePath(); spctx.fill();
    spctx.beginPath();
    spctx.moveTo(fx - 47, fy - 83); spctx.lineTo(fx - 40, fy - 101); spctx.lineTo(fx - 38, fy - 80);
    spctx.closePath(); spctx.fill();
    /* 腿 */
    spctx.strokeStyle = 'rgba(206,210,194,.9)';
    spctx.lineWidth = 5;
    for (var l = 0; l < 4; l++){
      var lx = fx - 34 + l * 21;
      spctx.beginPath();
      spctx.moveTo(lx, fy + 18);
      spctx.lineTo(lx + (l % 2 ? 5 : -4), fy + 62);
      spctx.stroke();
    }
    /* 眼点 */
    spctx.fillStyle = 'rgba(255,255,246,.95)';
    spctx.beginPath(); spctx.arc(fx - 56, fy - 76, 1.9, 0, 6.2832); spctx.fill();

    /* 红外噪点 */
    spctx.globalAlpha = 0.16;
    for (var n = 0; n < 1400; n++){
      var nx = ((n * 7919) % 100000) / 100000 * w;
      var ny = ((n * 104729) % 100000) / 100000 * h;
      spctx.fillStyle = (n % 3) ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.6)';
      spctx.fillRect(nx, ny, 1, 1);
    }
    spctx.globalAlpha = 1;

    /* 暗角 */
    var vg = spctx.createRadialGradient(w / 2, h * 0.52, h * 0.18, w / 2, h * 0.52, h * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.58)');
    spctx.fillStyle = vg;
    spctx.fillRect(0, 0, w, h);

    /* 十字分划 + 编号 */
    spctx.strokeStyle = 'rgba(255,255,255,.22)';
    spctx.lineWidth = 1;
    spctx.beginPath();
    spctx.moveTo(w / 2, h * 0.1); spctx.lineTo(w / 2, h * 0.9);
    spctx.moveTo(w * 0.06, h / 2); spctx.lineTo(w * 0.94, h / 2);
    spctx.stroke();
    spctx.fillStyle = 'rgba(255,255,255,.62)';
    spctx.font = '16px Consolas,monospace';
    spctx.fillText('IR 850nm   f/2.0   2.4s', 22, 40);
    spctx.fillText('CAM 04 · 02:41:07', 22, h - 26);
    specDrawn = true;
    try { drawSpecimenNote(); } catch(e){ console.error('[495] specimen note', e); }
  }

  /* ---------- 由歌曲信息派生一份"考察报告"字段 ---------- */
  function seedOf(){
    var s = S.song || {}, str = String(s.name || '') + '|' + String(s.id || '');
    var h = 2166136261;
    for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  var MICS = ['SENN. MKH 8020', 'DPA 4060 / STEREO', 'SOUND DEV. 833', 'SCHOeps CMC 6', 'LOM USI PRO'];
  var HABIT = ['针阔混交林 · 夜', '高山灌丛 · 霜降', '冰川融水 · 午后', '苔原湿甸 · 黎明', '河谷次生林 · 阴'];
  function deriveData(){
    var h = seedOf() || 495;
    S.seed = h;
    var latD = 24 + (h % 2600) / 100;
    var lonD = 97 + ((h >>> 9) % 2500) / 100;
    var latM = (h >>> 5) % 60, latS = (h >>> 11) % 60;
    var lonM = (h >>> 7) % 60, lonS = (h >>> 17) % 60;
    function two(n){ return (n < 10 ? '0' : '') + n; }
    S.lat = Math.floor(latD) + '°' + two(latM) + "'" + two(latS) + '"N';
    S.lon = Math.floor(lonD) + '°' + two(lonM) + "'" + two(lonS) + '"E';
    S.alt = 640 + (h % 2400);
    S.temp = (-6 + (h >>> 4) % 190 / 10).toFixed(1);
    S.rh = 52 + (h >>> 13) % 44;
    var y = 2019 + (h % 6), mo = 1 + (h >>> 3) % 12, dd = 1 + (h >>> 8) % 28;
    var hh = (h >>> 15) % 24, mi = (h >>> 19) % 60;
    S.date = y + '.' + two(mo) + '.' + two(dd) + '  ' + two(hh) + ':' + two(mi);
    S.mic = MICS[h % MICS.length];
    S.habitat = HABIT[(h >>> 6) % HABIT.length];
    S.take = 'TAKE ' + two(1 + (h % 12));
    S.plateNo = 'PLATE ' + two(1 + (h >>> 2) % 24);
  }

  function setData(){
    deriveData();
    var s = S.song || {};
    var nm = (s.name && String(s.name).trim()) ? String(s.name) : '未命名录音';
    document.querySelector('#hdr h1').textContent = nm;
    var art = s.artists;
    if (Array.isArray(art)) art = art.filter(Boolean).join(' / ');
    art = art ? String(art) : '';
    document.querySelector('#hdr .label').innerHTML = 'FIELD RECORDING / <b>' + (art ? esc(art).slice(0, 30) : 'SOUNDSCAPE ECOLOGY') + '</b>';
    document.getElementById('d-lat').textContent = S.lat + '  ' + S.lon;
    document.getElementById('d-alt').textContent = S.alt + ' M';
    document.getElementById('d-th').textContent = S.temp + ' °C / ' + S.rh + ' %';
    document.getElementById('d-dt').textContent = S.date;
    document.getElementById('d-mic').textContent = S.mic;
    document.getElementById('p-a').textContent = S.plateNo + ' · IR 850nm';
    document.getElementById('p-b').textContent = 'f/2.0 · 2.4 s';
    elTake.textContent = S.take;
    document.getElementById('hab').textContent = S.habitat;
    drawSpecimenNote();
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){ return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; });
  }
  function drawSpecimenNote(){
    var s = S.song || {};
    var art = s.artists;
    if (Array.isArray(art)) art = art.filter(Boolean).join(' / ');
    var w = specCv.width, h = specCv.height;
    if (!specDrawn || !w) return;
    spctx.setTransform(1, 0, 0, 1, 0, 0);
    /* 重新压一层底部条，写死考察信息 */
    var barH = Math.max(64, h * 0.105);
    spctx.fillStyle = 'rgba(8,10,7,.82)';
    spctx.fillRect(0, h - barH, w, barH);
    spctx.fillStyle = 'rgba(226,222,205,.92)';
    spctx.font = 'bold 15px Consolas,monospace';
    spctx.fillText((S.plateNo || 'PLATE 01') + '  ·  IR 850 nm', 20, h - barH + 26);
    spctx.font = '13px Consolas,monospace';
    spctx.fillStyle = 'rgba(200,196,180,.72)';
    spctx.fillText((S.lat || '—') + '  ' + (S.lon || '—') + '   ' + (S.alt || 1842) + ' m', 20, h - barH + 47);
    var nm = (s.name && String(s.name).trim()) ? String(s.name) : '未命名录音';
    spctx.fillStyle = 'rgba(226,222,205,.9)';
    spctx.fillText(String(nm).slice(0, 22) + (art ? '  /  ' + String(art).slice(0, 18) : ''), 20, h - barH + 66 > h - 6 ? h - 8 : h - barH + 66);
  }

  /* ---------- 每帧：纸面静止，呼吸交给 CSS 合成 ---------- */
  function energyNow(now){
    var energy = 0;
    var lv = S.live;
    if (lv) energy = Math.max(0, Math.min(1, +lv.level || 0)) * 0.7 + Math.max(0, Math.min(1, +lv.bass || 0)) * 0.4;
    if (S.beat > 0.02){
      var pulse = Math.max(0, 1 - (now - S.beatT) / 300) * S.beat;
      if (pulse * 0.9 > energy) energy = pulse * 0.9;
    }
    return Math.max(0, Math.min(1, energy));
  }
  var lastTx = '', lastShade = -1;
  function drawSheet(now){
    var energy = energyNow(now);
    var breathe = reduce ? 0 : Math.sin(now * 0.00042) * 2.2;
    var push = 1 + (reduce ? 0 : energy * 0.012) + breathe * 0.0016;
    var lift = reduce ? 0 : energy * 7 - breathe * 0.6;

    var tx = 'translate3d(0,' + lift.toFixed(2) + 'px,0) scale(' + push.toFixed(4) + ')';
    if (tx !== lastTx){ contEl.style.transform = tx; lastTx = tx; }

    /* 低音重时压暗一线（CSS 合成，零重绘） */
    var shade = reduce ? 0 : Math.max(0, (energy - 0.26)) * 0.16;
    if (Math.abs(shade - lastShade) > 0.004){
      lastShade = shade;
      shadeEl.style.opacity = shade.toFixed(3);
    }
  }

  function boot(){
    try { buildGrain(); } catch(e){ console.error('[495] grain', e); }
  }
  boot();

  /* ---------- 主循环 ---------- */
  var t0 = performance.now();
  var shown = false;

  function frame(now){
    var js0 = performance.now();
    S.frames++;
    try {
      /* 纸面：只在尺寸变化时重画一次 */
      if (paperDirty){
        paperDirty = false;
        if (specDrawn) drawSpecimen();
        drawTerrain();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        if (staticCv.width) ctx.drawImage(staticCv, 0, 0);
      }
      /* 分帧建地形：每帧只填几行，绝不单帧爆 */
      if (terrainDirty){
        terrainDirty = false;
        allocField();
      } else if (!fieldReady){
        fillFieldChunk(12);
      } else if (!contourReady){
        contourStep(5);
      }
      if (!specDrawn && now - t0 > 140){
        drawSpecimen();
      }

      /* 静态纸层 + 等高线层合成为底 */
      drawSheet(now);

      if (S.idx !== S._idxShown || S._forceLine){
        S._forceLine = false;
        S._idxShown = S.idx;
        bindLine(S.idx);
      }
      updateChars();
      drawOverlay(now);

      /* 走时 + dBFS */
      if (!S._txtShown || now - S._txtShown > 220){
        S._txtShown = now;
        var mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
        elTc.textContent = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
        var raw = S.live && isFinite(S.live.level) ? +S.live.level : 0.55;
        var db = -46 + 30 * Math.min(1, Math.max(0, raw));
        elF2.textContent = '−' + Math.abs(db).toFixed(1) + ' dBFS';
        if (S.lat) elF1.textContent = S.lat + ' · ' + S.lon;
      }

      if (!shown && now - t0 > 260){
        shown = true;
        elHdr.style.opacity = 1; elData.style.opacity = 1;
        elPlate.style.opacity = 1; elLyr.style.opacity = 1; elFoot.style.opacity = 1;
      }
    } catch(e){
      console.error('[495] frame', e);
      S.err = String((e && e.message) || e);
    }
    S.js = performance.now() - js0;
    requestAnimationFrame(frame);
  }

  /* ---------- protocol ---------- */
  function onMsg(e){
    var d = e && e.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init'){
        var p = d.payload || {};
        S.song = p.song || null;
        S.dur = Math.max(0, +p.duration || 0);
        S.lines = (Array.isArray(p.lines) ? p.lines : []).map(function(l){
          var tx = (l && l.text != null) ? String(l.text) : '';
          return { t: Math.max(0, +((l && l.t) || 0)), dur: Math.max(0, +((l && l.dur) || 0)), text: tx, chars: (l && Array.isArray(l.chars)) ? l.chars : null };
        });
        if (Array.isArray(p.accent) && p.accent.length >= 3){
          S.accent = [+p.accent[0] || 0, +p.accent[1] || 0, +p.accent[2] || 0];
        }
        S.idx = -1; S._idxShown = null;
        S.inited = true;
        S._forceLine = true;
        updateIdx();
        setData();
      } else if (d.type === 'tick'){
        var q = d.payload || {};
        S.t = Math.max(0, +q.time || 0);
        S.playing = !!q.playing;
        updateIdx();
      } else if (d.type === 'beat'){
        var bl = d.payload && +d.payload.level;
        S.beat = isFinite(bl) ? Math.max(0, Math.min(1, bl)) : 0;
        S.beatT = performance.now();
        S.pulseN = (S.pulseN || 0) + 1;
      } else if (d.type === 'live'){
        S.live = d.payload || null;
        S.playing = !!(d.payload && d.payload.playing);
      }
    } catch(err){
      console.error('[495] message error', err);
      S.err = String(err && err.message || err);
    }
  }
  function updateIdx(){
    var L = S.lines, lo = 0, hi = L.length - 1, r = -1;
    while (lo <= hi){
      var m = (lo + hi) >> 1;
      if (L[m].t <= S.t + 0.001){ r = m; lo = m + 1; } else hi = m - 1;
    }
    while (r >= 0 && L[r].t > S.t + 0.001) r--;
    S.idx = r;
  }

  window.addEventListener('message', onMsg);
  sizeNow();
  window.addEventListener('resize', function(){ try { sizeNow(); } catch(e){ console.error('[495] resize', e); } });

  /* ready: first rAF, unconditional, once */
  var sent = false;
  function sendReady(){
    if (sent) return; sent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch(e){ console.error('[495] ready failed', e); }
  }
  requestAnimationFrame(function(){ sendReady(); });
  setTimeout(sendReady, 900);

  requestAnimationFrame(frame);

  /* ---------- self check ---------- */
  window.__stage = function(){
    var ln = S.lines[S.idx];
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: +S.t.toFixed(3),
      playing: !!S.playing,
      frames: S.frames,
      js: +S.js.toFixed(3),
      err: S.err || '',
      text: ln ? String(ln.text || '') : '',
      gl: !!S.gl,
      rm: !!reduce
    };
  };
})();
</script>
</body>
</html>
