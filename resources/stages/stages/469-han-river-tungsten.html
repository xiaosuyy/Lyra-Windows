<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汉江夜雨</title>
<style>
  :root{
    --warm:#ffb46a; --warm-soft:#ffd7a8; --cool:#7fd8e8; --ink:#f4ece0;
    --bar:6.5vh;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05070a;overflow:hidden}
  body{font-family:"Helvetica Neue","Segoe UI","PingFang SC","Malgun Gothic","Noto Sans KR","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(120% 80% at 50% 18%,#101a25 0%,#0a1018 45%,#05070a 100%);}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .bar{position:absolute;left:0;right:0;height:calc(var(--bar) + 26px);z-index:9;pointer-events:none}
  .bar.top{top:0;background:linear-gradient(#020304 0%,#020304 62%,rgba(2,3,4,.86) 80%,rgba(2,3,4,0) 100%)}
  .bar.bot{bottom:0;background:linear-gradient(rgba(2,3,4,0) 0%,rgba(2,3,4,.86) 20%,#020304 38%,#020304 100%)}
  #ticks{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.35}
  #lyr{position:absolute;left:0;right:0;z-index:6;display:flex;flex-direction:column;
       align-items:center;justify-content:center;padding:0 7vw;text-align:center;pointer-events:none;
       top:50%;transform:translateY(-52%)}
  #cap{font-size:clamp(9px,.74vw,12px);letter-spacing:.42em;text-transform:uppercase;
       color:var(--acc,#ffb46a);opacity:.66;margin-bottom:.9vh;white-space:nowrap;overflow:hidden;
       max-width:86vw;text-overflow:ellipsis}
  #line{font-size:clamp(20px,3.05vw,44px);line-height:1.5;font-weight:400;letter-spacing:.06em;
        color:rgba(214,224,232,.40);max-width:min(88vw,1120px);text-wrap:balance;
        transition:color .35s ease, transform .5s cubic-bezier(.2,.7,.3,1)}
  #line .c{transition:color .22s linear,text-shadow .22s linear;color:rgba(210,222,232,.38)}
  #line .c.on{color:#fdf0dc;text-shadow:0 0 18px rgba(255,166,92,.42),0 0 2px rgba(255,205,160,.5)}
  #line .c.cur{color:#fff7ec}
  #rule{width:min(34vw,220px);height:1px;margin-top:1.5vh;
        background:linear-gradient(90deg,transparent,rgba(255,178,120,.55),transparent)}
  #sub{margin-top:1.1vh;font-size:clamp(8px,.66vw,11px);letter-spacing:.3em;
       color:rgba(150,200,214,.30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
       max-width:84vw}
  #prev{font-size:clamp(12px,1.28vw,19px);line-height:1.6;letter-spacing:.08em;
        color:rgba(196,212,222,.24);max-width:min(78vw,900px);margin-bottom:1.6vh;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .5s ease}
  #next{font-size:clamp(11px,1.12vw,16px);line-height:1.6;letter-spacing:.1em;
        color:rgba(168,196,208,.18);max-width:min(72vw,820px);margin-top:1.3vh;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s ease}
  #meta{position:absolute;z-index:7;left:0;right:0;text-align:center;pointer-events:none;
        font-size:clamp(10px,1vw,13px);letter-spacing:.2em;color:rgba(226,236,240,.45);
        text-transform:uppercase}
  #meta b{font-weight:500;color:rgba(255,206,168,.7)}
  #grain{position:absolute;z-index:5;pointer-events:none;opacity:.42;
         left:-12%;top:-12%;width:124%;height:124%;
         animation:grainShift .6s steps(3) infinite;will-change:transform}
  @keyframes grainShift{
    0%{transform:translate3d(0,0,0)} 33%{transform:translate3d(-1.4%,1.1%,0)}
    66%{transform:translate3d(1.2%,-1.3%,0)} 100%{transform:translate3d(0,0,0)} }
  #line.small{font-size:clamp(17px,2.25vw,33px)}
  #line.tiny{font-size:clamp(14px,1.72vw,25px);line-height:1.62}
  #line .em{letter-spacing:.34em;opacity:.5;font-size:.74em}
  @media (orientation:portrait){ :root{--bar:4.5vh} #line{font-size:clamp(19px,5.4vw,34px);line-height:1.62} }
  @media (prefers-reduced-motion:reduce){ #line{transition:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="grain"></div>
  <div class="bar top"></div>
  <div class="bar bot"></div>
  <svg id="ticks" aria-hidden="true"></svg>
  <div id="lyr">
    <div id="cap">SEOUL · NIGHT</div>
    <div id="prev"></div>
    <div id="line"></div>
    <div id="rule"></div>
    <div id="next"></div>
    <div id="sub">RAIN ON THE WINDOW · HANGANG BRIDGE</div>
  </div>
  <div id="meta"></div>
</div>
<script>
var ST = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
           gl: false, rm: false, err: '', text: '', dur: 0, accent: [255,160,96] };
window.__stage = function () {
  return { lines: ST.lines.length, idx: ST.idx, t: ST.t, playing: ST.playing,
           frames: ST.frames, js: ST.js, err: ST.err, text: ST.text,
           gl: ST.gl, rm: ST.rm };
};
var W = 1440, H = 900, dpr = 1;
var bg = document.getElementById('bg');
var ctx = bg.getContext('2d');
var elLine = document.getElementById('line');
var elPrev = document.getElementById('prev');
var elCap = document.getElementById('cap');
var elMeta = document.getElementById('meta');
var elTicks = document.getElementById('ticks');
var gEl = document.getElementById('grain');
var curLineKey = '';

ST.rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- 离屏素材：散景光斑 / 噪点 / 暗角 ---------- */
var LAY = document.createElement('canvas');       /* 静态底：夜空 + 远景城市 + 车窗框 */
var VIG = document.createElement('canvas');       /* 暗角 + 车窗玻璃反光 */
var NOISE = document.createElement('canvas');     /* 胶片颗粒 */
var sprites = [];                                 /* 3 暖 2 冷 */
var orbs = [], rain = [];
var STB = { level: 0, bass: 0, treble: 0 };

function makeSprite(r, g, b) {
  var s = 128, c = document.createElement('canvas');
  c.width = s; c.height = s;
  var x = c.getContext('2d');
  var rad = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
  rad.addColorStop(0.28, 'rgba(' + r + ',' + g + ',' + b + ',0.60)');
  rad.addColorStop(0.62, 'rgba(' + r + ',' + g + ',' + b + ',0.20)');
  rad.addColorStop(0.86, 'rgba(' + r + ',' + g + ',' + b + ',0.06)');
  rad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  x.fillStyle = rad; x.fillRect(0, 0, s, s);
  return c;
}
function buildSprites() {
  sprites = [makeSprite(255, 172, 96), makeSprite(255, 138, 60), makeSprite(255, 206, 150),
             makeSprite(120, 206, 224), makeSprite(84, 172, 200)];
}
function buildNoise() {
  var s = 128, c = document.createElement('canvas');
  c.width = s; c.height = s;
  var x = c.getContext('2d'), img = x.createImageData(s, s), d = img.data, i;
  for (i = 0; i < d.length; i += 4) {
    var v = 128 + (Math.random() * 96 - 48) | 0;
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  NOISE = c;
}

/* 随机数（每次 resize 固定种子，避免布局跳动） */
var seed = 20250469;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

function buildOrbs() {
  seed = 20250469;
  orbs = [];
  var n = W < 760 ? 14 : 26, i;
  for (i = 0; i < n; i++) {
    var warm = rnd() > 0.34;
    var r = (warm ? 0.030 : 0.024) + rnd() * (warm ? 0.115 : 0.085);
    var px = 0.04 + rnd() * 0.94;
    var py = 0.10 + rnd() * 0.82;
    /* 让暖光集中在中下与右侧，冷光偏高 */
    if (warm && rnd() > 0.45) py = 0.42 + rnd() * 0.50;
    orbs.push({
      x: px * W, y: py * H, r: r * Math.min(W, H) * 1.55,
      sp: warm ? 0 : 3,
      a: (warm ? 0.30 : 0.17) + rnd() * 0.30,
      ph: rnd() * 6.283, w: 0.09 + rnd() * 0.22, am: 5 + rnd() * 22
    });
  }
}
function buildRain() {
  rain = [];
  var n = W < 760 ? 46 : 92, i;
  for (i = 0; i < n; i++) {
    rain.push({ x: rnd() * W, y: rnd() * H, l: 14 + rnd() * 46,
                v: 420 + rnd() * 620, a: 0.05 + rnd() * 0.16, w: rnd() > 0.8 ? 1.5 : 0.9 });
  }
}

/* 静态底：夜空 / 汉江对岸灯火 / 车窗立柱 / 底光 */
function buildLayer() {
  var dw = bg.width, dh = bg.height;
  LAY.width = dw; LAY.height = dh;
  var g = LAY.getContext('2d');
  g.setTransform(dw / W, 0, 0, dh / H, 0, 0);
  var sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0a141d');
  sky.addColorStop(0.34, '#0b1620');
  sky.addColorStop(0.66, '#080e14');
  sky.addColorStop(1, '#030507');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  /* 城市天际线：模糊后的竖条灯火（一次生成，之后只是贴图） */
  var cityY = H * 0.545;
  g.save();
  if (g.filter !== undefined) g.filter = 'blur(' + Math.round(Math.max(2, W * 0.004)) + 'px)';
  var i, x = -20;
  for (i = 0; i < 90 && x < W + 20; i++) {
    var bw = 6 + rnd() * 26, bh = 12 + rnd() * 96, cold = rnd() > 0.28;
    g.fillStyle = cold ? 'rgba(126,206,226,' + (0.05 + rnd() * 0.14) + ')'
                       : 'rgba(255,178,120,' + (0.04 + rnd() * 0.16) + ')';
    g.fillRect(x, cityY - bh, bw, bh + 60);
    x += bw + 3 + rnd() * 22;
  }
  /* 江面反光带 */
  g.fillStyle = 'rgba(255,168,104,0.10)';
  g.fillRect(0, cityY + 18, W, Math.max(2, H * 0.004));
  g.fillStyle = 'rgba(120,200,220,0.06)';
  g.fillRect(0, cityY + 30, W, Math.max(1, H * 0.002));
  g.restore();

  /* 失焦的人物侧影：车窗外/副驾位置的背影，只剩轮廓与轮廓光 */
  var fx = W * (W < 760 ? 0.74 : 0.775), fy = H * 0.60;
  var sc = Math.min(W, H);
  g.save();
  if (g.filter !== undefined) g.filter = 'blur(' + Math.round(Math.max(6, sc * 0.026)) + 'px)';
  g.globalAlpha = 0.92;
  g.fillStyle = 'rgba(3,5,8,1)';
  /* 头 */
  g.beginPath(); g.ellipse(fx, fy - sc * 0.205, sc * 0.078, sc * 0.092, -0.12, 0, 6.2832); g.fill();
  /* 颈肩 */
  g.beginPath();
  g.moveTo(fx - sc * 0.055, fy - sc * 0.145);
  g.lineTo(fx + sc * 0.070, fy - sc * 0.150);
  g.lineTo(fx + sc * 0.215, fy + sc * 0.045);
  g.lineTo(fx + sc * 0.250, fy + sc * 0.46);
  g.lineTo(fx - sc * 0.260, fy + sc * 0.46);
  g.lineTo(fx - sc * 0.215, fy + sc * 0.02);
  g.closePath(); g.fill();
  g.globalAlpha = 0.55;
  g.fillStyle = 'rgba(6,9,13,1)';
  g.beginPath(); g.ellipse(fx - sc * 0.02, fy - sc * 0.10, sc * 0.24, sc * 0.10, -0.1, 0, 6.2832); g.fill();
  g.restore();

  /* 轮廓光：暖光勾右肩，冷光勾左肩（胶片分色） */
  g.save();
  if (g.filter !== undefined) g.filter = 'blur(' + Math.round(Math.max(4, sc * 0.012)) + 'px)';
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = 'rgba(255,168,96,0.34)'; g.lineWidth = Math.max(2, sc * 0.007);
  g.beginPath(); g.ellipse(fx, fy - sc * 0.205, sc * 0.078, sc * 0.092, -0.12, -0.9, 1.75); g.stroke();
  g.beginPath(); g.moveTo(fx + sc * 0.068, fy - sc * 0.148); g.lineTo(fx + sc * 0.214, fy + sc * 0.045); g.stroke();
  g.strokeStyle = 'rgba(130,206,224,0.26)';
  g.beginPath(); g.ellipse(fx, fy - sc * 0.205, sc * 0.078, sc * 0.092, -0.12, 3.3, 5.5); g.stroke();
  g.restore();

  /* 钨丝灯底部暖底光 */
  var warmG = g.createRadialGradient(W * 0.5, H * 1.16, H * 0.02, W * 0.5, H * 1.16, H * 0.96);
  warmG.addColorStop(0, 'rgba(255,142,56,0.30)');
  warmG.addColorStop(0.42, 'rgba(214,96,32,0.13)');
  warmG.addColorStop(1, 'rgba(10,8,6,0)');
  g.fillStyle = warmG; g.fillRect(0, 0, W, H);
  var coolG = g.createRadialGradient(W * 0.60, H * 0.10, H * 0.02, W * 0.60, H * 0.10, H * 0.78);
  coolG.addColorStop(0, 'rgba(88,176,206,0.26)');
  coolG.addColorStop(0.55, 'rgba(46,112,150,0.07)');
  coolG.addColorStop(1, 'rgba(4,8,12,0)');
  g.fillStyle = coolG; g.fillRect(0, 0, W, H);

  /* 车窗：左右深色立柱 + 顶部弧顶阴影 */
  var post = Math.max(10, W * 0.035);
  var pg = g.createLinearGradient(0, 0, post * 3.2, 0);
  pg.addColorStop(0, 'rgba(2,3,5,0.96)'); pg.addColorStop(0.55, 'rgba(3,5,8,0.72)'); pg.addColorStop(1, 'rgba(3,5,8,0)');
  g.fillStyle = pg; g.fillRect(0, 0, post * 3.2, H);
  g.save(); g.translate(W, 0); g.scale(-1, 1);
  g.fillStyle = pg; g.fillRect(0, 0, post * 3.2, H);
  g.restore();
  var topG = g.createLinearGradient(0, 0, 0, H * 0.26);
  topG.addColorStop(0, 'rgba(2,3,5,0.80)'); topG.addColorStop(1, 'rgba(2,3,5,0)');
  g.fillStyle = topG; g.fillRect(0, 0, W, H * 0.26);
}

function buildVignette() {
  var dw = bg.width, dh = bg.height;
  VIG.width = dw; VIG.height = dh;
  var v = VIG.getContext('2d');
  v.setTransform(dw / W, 0, 0, dh / H, 0, 0);
  var vg = v.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.16, W * 0.5, H * 0.48, Math.max(W, H) * 0.86);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(0,0,0,0.26)');
  vg.addColorStop(1, 'rgba(0,0,0,0.86)');
  v.fillStyle = vg; v.fillRect(0, 0, W, H);
  /* 玻璃反光：一道极淡的斜向冷光，压在画面上 */
  v.save();
  v.globalCompositeOperation = 'lighter';
  var lg = v.createLinearGradient(W * 0.08, 0, W * 0.42, H * 0.5);
  lg.addColorStop(0, 'rgba(120,190,215,0.05)');
  lg.addColorStop(0.5, 'rgba(120,190,215,0.02)');
  lg.addColorStop(1, 'rgba(120,190,215,0)');
  v.fillStyle = lg; v.fillRect(0, 0, W, H);
  v.restore();
}

function fit() {
  var w = window.innerWidth | 0, h = window.innerHeight | 0;
  if (!w || !h || !isFinite(w) || !isFinite(h)) { w = 1440; h = 900; }
  W = w; H = h;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  bg.width = Math.min(2400, Math.round(W * dpr));
  bg.height = Math.min(1600, Math.round(H * dpr));
  bg.style.width = W + 'px'; bg.style.height = H + 'px';
  ctx.setTransform(bg.width / W, 0, 0, bg.height / H, 0, 0);
  var top = Math.max(24, Math.min(74, H * 0.065));
  document.documentElement.style.setProperty('--bar', top + 'px');
  buildTicks(W, H, top);
  elMeta.style.left = '0'; elMeta.style.right = '0';
  elMeta.style.bottom = (top + 14) + 'px';
  buildLayer();
  buildVignette();
  buildOrbs();
  buildRain();
}

function buildTicks(w, h, bar) {
  elTicks.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  elTicks.setAttribute('width', w); elTicks.setAttribute('height', h);
  var s = '', i, n = Math.min(44, Math.round(w / 26));
  for (i = 0; i < n; i++) {
    var x = (i + 0.5) * (w / n);
    s += '<line x1="' + x.toFixed(1) + '" y1="' + (bar - 8) + '" x2="' + x.toFixed(1) + '" y2="' + (bar - 2) +
         '" stroke="#8fb6c4" stroke-width="1" opacity=".45"/>';
    s += '<line x1="' + x.toFixed(1) + '" y1="' + (h - bar + 2) + '" x2="' + x.toFixed(1) + '" y2="' + (h - bar + 8) +
         '" stroke="#8fb6c4" stroke-width="1" opacity=".45"/>';
  }
  elTicks.innerHTML = s;
}

function setMeta(song) {
  if (!song) { elMeta.innerHTML = ''; return; }
  var name = (song.name || '').toString().trim();
  var ar = song.artists;
  if (Array.isArray(ar)) ar = ar.filter(function (x) { return !!x; }).join(' · ');
  ar = (ar || '').toString().trim();
  var head = (ar ? '<b>' + esc(ar) + '</b>' : '') + (ar && name ? '  —  ' : '') + esc(name);
  elMeta.innerHTML = head + '<span id="tc" style="margin-left:1.4em;color:rgba(255,196,152,.55)"></span>';
  ST.songName = name;
}
function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  var m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
}
function setTC() {
  var tc = document.getElementById('tc');
  if (!tc) return;
  tc.textContent = fmt(ST.t) + (ST.dur > 0 ? ' / ' + fmt(ST.dur) : '');
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderLine() {
  var L = ST.lines;
  if (!L.length) {
    if (curLineKey !== '@empty') {
      curLineKey = '@empty';
      elLine.className = '';
      elLine.innerHTML = '<span class="c em">· · ·</span>';
      elPrev.textContent = '';
      elCap.textContent = 'SEOUL · NIGHT';
      var sb = document.getElementById('sub');
      if (sb) sb.textContent = 'INSTRUMENTAL · NO LYRICS';
    }
    return;
  }
  var sb2 = document.getElementById('sub');
  if (sb2) sb2.textContent = 'RAIN ON THE WINDOW · HANGANG BRIDGE';
  var i = ST.idx < 0 ? 0 : ST.idx;
  var line = L[i];
  if (!line) return;
  var key = i + '|' + (line.text || '');
  if (key === curLineKey) return;
  curLineKey = key;
  var txt = (line.text || '').toString();
  var out = '', k, n = Math.min(240, txt.length);
  for (k = 0; k < n; k++) {
    var ch = txt.charAt(k);
    out += ch === ' ' ? ' ' : '<span class="c">' + esc(ch) + '</span>';
  }
  elLine.innerHTML = out || '<span class="c em">· · ·</span>';
  /* 超长句自动缩排，避免溢出 */
  var L2 = n;
  elLine.className = L2 > 34 ? 'tiny' : (L2 > 20 ? 'small' : '');
  /* 上一句淡出为残影（王家卫式拖影） */
  var prevIdx = i - 1;
  if (prevIdx >= 0 && L[prevIdx]) {
    elPrev.textContent = (L[prevIdx].text || '').toString();
    elPrev.style.opacity = '.26';
  } else {
    elPrev.textContent = '';
  }
  /* 下一句：极淡的预排，制造"台词截图"层次 */
  var nx = L[i + 1] ? (L[i + 1].text || '').toString() : '';
  var elNext = document.getElementById('next');
  if (elNext) {
    elNext.textContent = nx;
    elNext.style.opacity = nx ? '.16' : '0';
  }
}
function paintChars() {
  if (!ST.lines.length) return;
  var spans = elLine.children, n = spans.length;
  if (!n) return;
  var line = ST.lines[ST.idx < 0 ? 0 : ST.idx];
  var lt = line && typeof line.t === 'number' ? line.t : 0;
  var dur = line && line.dur > 0 ? line.dur : Math.max(1.6, (line && line.text ? line.text.length : 8) * 0.32);
  var chars = line && line.chars && line.chars.length ? line.chars : null;
  var p = chars ? 0 : Math.max(0, Math.min(1, (ST.t - lt) / dur));
  var k;
  if (chars) {
    for (k = 0; k < n; k++) {
      var cs = chars[k];
      var on = !!(cs && typeof cs.t === 'number' && ST.t >= cs.t);
      if (on) p = (k + 1) / n;
      spans[k].className = on ? 'c on' : 'c';
    }
    var ic = Math.min(n - 1, Math.floor(p * n));
    if (ic >= 0 && spans[ic] && !spans[ic].className.match(/on/)) spans[ic].className = 'c cur';
  } else {
    var upto = Math.round(p * n);
    for (k = 0; k < n; k++) spans[k].className = k < upto ? 'c on' : 'c';
  }
}

function msg(ev) {
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') {
      var p = d.payload || {};
      var lines = Array.isArray(p.lines) ? p.lines : [];
      ST.lines = lines.filter(function (x) { return x && typeof x.t === 'number'; })
                       .map(function (x) {
                         return { t: x.t, dur: +x.dur || 0, text: (x.text == null ? '' : String(x.text)),
                                  chars: Array.isArray(x.chars) && x.chars.length ? x.chars : null };
                       });
      if (!ST.lines.length && lines.length) {
        ST.lines = lines.slice(0, 400).map(function (x, i) {
          return { t: i, dur: 3, text: x && x.text != null ? String(x.text) : '', chars: null };
        });
      }
      ST.dur = +p.duration || 0;
      if (Array.isArray(p.accent) && p.accent.length >= 3) {
        ST.accent = p.accent.slice(0, 3);
        var r0 = Math.max(0, Math.min(255, ST.accent[0] | 0));
        var g0 = Math.max(0, Math.min(255, ST.accent[1] | 0));
        var b0 = Math.max(0, Math.min(255, ST.accent[2] | 0));
        /* 保证强调色在暗底上可读：亮度太低就往暖橙拉 */
        var lum = (r0 * 0.299 + g0 * 0.587 + b0 * 0.114) / 255;
        if (lum < 0.34) {
          var m = 0.34 / Math.max(0.04, lum);
          r0 = Math.min(255, Math.round(r0 * m * 0.55 + 150));
          g0 = Math.min(255, Math.round(g0 * m * 0.45 + 70));
          b0 = Math.min(255, Math.round(b0 * m * 0.30 + 30));
        }
        document.documentElement.style.setProperty('--acc', 'rgb(' + r0 + ',' + g0 + ',' + b0 + ')');
      }
      ST.idx = -1; ST.t = 0; curLineKey = '';
      setMeta(p.song);
      elCap.textContent = 'SEOUL · NIGHT';
      renderLine(); paintChars();
    } else if (d.type === 'tick') {
      var q = d.payload || {};
      if (typeof q.time === 'number' && isFinite(q.time)) ST.t = q.time;
      if (typeof q.playing === 'boolean') ST.playing = q.playing;
    } else if (d.type === 'beat') {
      var b = d.payload || {};
      if (typeof b.level === 'number') STB.level = Math.max(STB.level, Math.min(1, b.level));
      if (typeof b.playing === 'boolean') ST.playing = b.playing;
    } else if (d.type === 'live') {
      var v = d.payload || {};
      if (typeof v.level === 'number') STB.level = Math.max(0, Math.min(1, v.level));
      if (typeof v.bass === 'number') STB.bass = Math.max(0, Math.min(1, v.bass));
      if (typeof v.treble === 'number') STB.treble = Math.max(0, Math.min(1, v.treble));
      if (typeof v.playing === 'boolean') ST.playing = v.playing;
    }
  } catch (e) {
    ST.err = '';
    console.error('[469] msg', e);
  }
}
window.addEventListener('message', msg);

var lastIdx = -99;
function updateLyrics() {
  var L = ST.lines, n = L.length, i, found = -1;
  if (n) {
    for (i = 0; i < n; i++) { if (L[i].t <= ST.t + 0.02) found = i; else break; }
    if (found < 0) found = -1;
  }
  ST.idx = found;
  if (found !== lastIdx) { lastIdx = found; renderLine(); }
  if (found >= 0) ST.text = L[found].text || '';
  else ST.text = '';
  paintChars();
}

var lastT = 0;
function frame(now) {
  var t0 = performance.now();
  ST.frames++;
  var dt = lastT ? Math.min(0.05, (now - lastT) * 0.001) : 0.016;
  lastT = now;
  /* 包络衰减：beat 冲上去，之后自然回落 */
  STB.level *= 0.90; STB.bass *= 0.92; STB.treble *= 0.92;
  if (STB.level < 0.02) STB.level = 0.02;
  updateLyrics();
  if (!ST.rm) stepRain(dt);
  draw(now, dt);
  if ((ST.frames & 15) === 0) setTC();
  ST.js = Math.round((performance.now() - t0) * 100) / 100;
  requestAnimationFrame(frame);
}
function draw(now, dt) {
  var t = now * 0.001;
  var lvl = STB.level, bass = STB.bass;
  var slow = ST.rm ? 0.15 : 1;
  var jx = 0, jy = 0;
  if (!ST.rm && bass > 0.05) {
    /* 手持/路面的微小呼吸位移 */
    jx = Math.sin(t * 21.7) * bass * 1.9;
    jy = Math.cos(t * 17.3) * bass * 1.4;
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(jx, jy);
  if (LAY.width) ctx.drawImage(LAY, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,150,70,' + (0.04 + lvl * 0.10).toFixed(3) + ')';
  ctx.fillRect(0, H * 0.70, W, H * 0.30);

  /* 散景光斑：叠加成失焦的城市灯火 */
  ctx.globalCompositeOperation = 'lighter';
  var i, o, s, a;
  for (i = 0; i < orbs.length; i++) {
    o = orbs[i];
    var dx = Math.sin(t * o.w * slow + o.ph) * o.am;
    var dy = Math.cos(t * o.w * 0.73 * slow + o.ph * 1.7) * o.am * 0.6;
    s = o.r * (1 + bass * 0.16 + lvl * 0.10);
    a = o.a * (0.74 + lvl * 0.45 + 0.13 * Math.sin(t * 1.9 + o.ph));
    if (a < 0.01) continue;
    if (a > 0.86) a = 0.86;
    ctx.globalAlpha = a;
    ctx.drawImage(sprites[o.sp], o.x + dx - s, o.y + dy - s, s * 2, s * 2);
  }

  /* 车窗雨痕：分冷/暖两条路径一次描完 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'round';
  var k, r0;
  ctx.strokeStyle = 'rgba(169,212,226,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (k = 0; k < rain.length; k++) {
    r0 = rain[k];
    if (k % 7 === 0) continue;
    ctx.moveTo(r0.x, r0.y);
    ctx.lineTo(r0.x - r0.l * 0.10, r0.y + r0.l);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,208,160,0.55)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (k = 0; k < rain.length; k += 7) {
    r0 = rain[k];
    ctx.moveTo(r0.x, r0.y);
    ctx.lineTo(r0.x - r0.l * 0.10, r0.y + r0.l);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  /* 暗角 + 玻璃反光 */
  if (VIG.width) ctx.drawImage(VIG, 0, 0, W, H);
  ctx.restore();
}

function stepRain(dt) {
  var k, r0;
  for (k = 0; k < rain.length; k++) {
    r0 = rain[k];
    r0.y += r0.v * dt;
    r0.x -= r0.v * dt * 0.10;
    if (r0.y > H + 60) { r0.y = -60 - Math.random() * 120; r0.x = Math.random() * (W + 80); }
    if (r0.x < -60) r0.x = W + 40;
  }
}

var readySent = false;
function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) { console.error('[469] ready', e); }
}
function applyGrain() {
  try {
    gEl.style.backgroundImage = 'url(' + NOISE.toDataURL('image/png') + ')';
    gEl.style.backgroundRepeat = 'repeat';
  } catch (e) { console.error('[469] grain', e); gEl.style.opacity = '0'; }
}
window.addEventListener('resize', fit);

try {
  buildSprites();
  buildNoise();
  fit();
  applyGrain();
} catch (e) {
  ST.err = '';
  console.error('[469] boot', e);
}

requestAnimationFrame(function () {
  sendReady();
  try { ST.frames++; draw(performance.now()); } catch (e) { console.error('[469] firstdraw', e); }
  requestAnimationFrame(frame);
});
setTimeout(sendReady, 60);
</script>
</body>
