<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>皂泡晴天</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#c9f2ff}
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}

  .topbar{position:absolute;top:clamp(12px,2.6vh,30px);left:clamp(12px,2.6vw,34px);z-index:5;
    display:flex;align-items:center;gap:9px;max-width:min(64vw,520px);
    padding:8px 16px 8px 12px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(219,247,255,.66));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(120,200,225,.45),
      0 0 0 1px rgba(150,230,248,.55),0 8px 20px rgba(3,70,95,.18);
    color:#06455c;font-size:clamp(10px,1.2vw,13px);font-weight:600;letter-spacing:.05em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff 6%,#7ce8ff 52%,#0a9ecf 100%);
    box-shadow:0 0 9px rgba(96,226,255,.95)}
  .art{flex:0 0 auto;display:none;width:clamp(15px,2vh,21px);height:clamp(15px,2vh,21px);
    border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.92),0 2px 6px rgba(0,40,60,.3)}
  .art.show{display:block}
  .topbar span{overflow:hidden;text-overflow:ellipsis;min-width:0}

  .lyr{position:absolute;left:0;right:0;bottom:clamp(5vh,9vh,13vh);z-index:3;opacity:0;
    transition:opacity .55s ease;
    display:flex;justify-content:center;padding:0 clamp(12px,4vw,40px);pointer-events:none}
  .lyr.ready{opacity:1}
  .lyr::before{content:"";position:absolute;left:50%;bottom:-4vh;z-index:-1;pointer-events:none;
    width:min(1040px,96vw);height:min(400px,46vh);transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 68%,var(--halo,rgba(126,244,255,.5)),transparent 68%);
    filter:blur(10px);opacity:.3;transition:opacity .24s ease}

  .plate{position:relative;max-width:min(980px,92vw);overflow:hidden;
    padding:clamp(13px,2.3vh,26px) clamp(20px,3.4vw,48px) clamp(15px,2.6vh,28px);
    border-radius:clamp(16px,2.4vw,30px);
    background:linear-gradient(178deg,rgba(4,56,74,.93) 0%,rgba(3,40,56,.955) 62%,rgba(2,28,42,.97) 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.42),inset 0 0 0 1px rgba(150,246,255,.34),
      inset 0 -14px 26px rgba(0,26,40,.35),
      0 16px 40px rgba(3,54,74,.38),0 0 46px rgba(112,236,255,.26)}
  .plate::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
  .plate::after{content:"";position:absolute;left:7%;right:7%;top:0;height:2px;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0))}

  .now{position:relative;z-index:2;text-align:center;color:#fff;
    font-weight:700;font-size:clamp(20px,4vw,46px);line-height:1.42;letter-spacing:.03em;
    text-shadow:0 2px 10px rgba(0,24,38,.55);text-wrap:balance}
  .plate.t2 .now{font-size:clamp(17px,3.3vw,38px);line-height:1.5}
  .plate.t3 .now{font-size:clamp(14px,2.55vw,29px);line-height:1.55}

  .c{display:inline-block;white-space:pre;color:rgba(186,236,255,.48);
    transition:color .2s ease,text-shadow .2s ease}
  .c.on{color:#fff;text-shadow:0 0 12px rgba(126,244,255,.5),0 2px 8px rgba(0,22,36,.55)}
  .c.cur{color:#ffffff;text-shadow:0 0 20px rgba(178,252,255,.95),0 0 6px rgba(255,255,255,.9)}

  .next{position:relative;z-index:2;margin-top:clamp(5px,1vh,11px);text-align:center;
    color:rgba(196,240,255,.60);font-weight:500;letter-spacing:.16em;
    font-size:clamp(10px,1.35vw,14px);line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em}
  .next:empty{min-height:0;margin-top:0}

  .plate.empty .now{font-weight:600;letter-spacing:.3em;font-size:clamp(16px,2.5vw,26px);
    color:rgba(228,250,255,.92)}
  .lyr.hit::before{opacity:.72}

  .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.09);z-index:2}
  .bar i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,rgba(120,245,255,.35),#c8f9ff);
    box-shadow:0 0 12px rgba(150,246,255,.95);transition:width .28s linear}

  .sweep{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
    background:linear-gradient(104deg,transparent 34%,rgba(255,255,255,.16) 46%,
      rgba(255,255,255,.26) 50%,rgba(255,255,255,.14) 55%,transparent 66%)}
  .plate.run .sweep{animation:glint .82s cubic-bezier(.3,.6,.4,1) both}
  @keyframes glint{from{opacity:.9;transform:translateX(-112%)}to{opacity:0;transform:translateX(112%)}}

  .now.in{animation:rise .42s cubic-bezier(.2,.8,.25,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .now.in{animation:none}
    .plate.run .sweep{animation:none}
    .c{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="topbar"><img id="art" class="art" alt=""><i class="dot"></i><span id="meta">正在等待歌曲…</span></div>
  <div class="lyr">
    <div class="plate" id="plate">
      <div class="now" id="now"></div>
      <div class="next" id="next"></div>
      <div class="bar"><i id="bar"></i></div>
      <i class="sweep"></i>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha: false });
var plateEl = document.getElementById('plate');
var nowEl = document.getElementById('now');
var nextEl = document.getElementById('next');
var barEl = document.getElementById('bar');
var metaEl = document.getElementById('meta');
var artEl = document.getElementById('art');
var dotEl = document.querySelector('.dot');
var lyrEl = document.querySelector('.lyr');
var hitTimer = 0;

var W = 1440, H = 900, DPR = 1;
var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

var st = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', gl: false, rm: REDUCED };
var accent = [64, 200, 255];
var readySent = false;

function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {}
}

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function num(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }
function pos(v, d){ v = num(v, d); return v > 0 ? v : d; }

/* ---------- 程序化"草坡 + 天空"底片，只在尺寸变化时重画 ---------- */
var bg = document.createElement('canvas');
var bgx = bg.getContext('2d');
var scene = { sunX: 0, sunY: 0, sunR: 0, horizon: 0, bands: [] };

function hash(n){
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function hillY(x, base, amp, f, ph){
  return base - amp * Math.sin(x * f + ph) - amp * 0.42 * Math.sin(x * f * 2.17 + ph * 1.63) - amp * 0.2 * Math.sin(x * f * 3.9 + ph);
}

function cloud(c, x, y, sc, al){
  var i, puffs = 5;
  for (i = 0; i < puffs; i++){
    var ox = (i - 2) * 46 * sc;
    var oy = -Math.abs(i - 2) * 7 * sc + (i % 2) * 5 * sc;
    var r = (46 - Math.abs(i - 2) * 8) * sc;
    var g = c.createRadialGradient(x + ox, y + oy, r * 0.12, x + ox, y + oy, r);
    try {
      g.addColorStop(0, 'rgba(255,255,255,' + (al * 0.95) + ')');
      g.addColorStop(0.55, 'rgba(250,254,255,' + (al * 0.55) + ')');
      g.addColorStop(1, 'rgba(226,248,255,0)');
    } catch (e) {}
    c.fillStyle = g;
    c.beginPath();
    c.arc(x + ox, y + oy, r, 0, Math.PI * 2);
    c.fill();
  }
}

function bandPath(c, base, amp, f, ph){
  var i, n = 96, x, y;
  c.beginPath();
  c.moveTo(-2, H + 2);
  for (i = 0; i <= n; i++){
    x = -2 + (W + 4) * (i / n);
    y = hillY(x, base, amp, f, ph);
    c.lineTo(x, y);
  }
  c.lineTo(W + 2, H + 2);
  c.closePath();
}

function drawTrees(c, base, amp, f, ph){
  var trees = [[0.155, 0.052], [0.212, 0.034], [0.862, 0.044]];
  var i, tx, th, ty, tw, tg;
  for (i = 0; i < trees.length; i++){
    tx = trees[i][0] * W;
    th = trees[i][1] * H;
    ty = hillY(tx, base, amp, f, ph);
    tw = th * 0.5;
    c.save();
    c.globalAlpha = 0.62;
    c.fillStyle = '#3d7a45';
    c.fillRect(tx - th * 0.035, ty - th * 0.5, th * 0.07, th * 0.55);
    tg = c.createRadialGradient(tx - tw * 0.25, ty - th * 0.85, th * 0.08, tx, ty - th * 0.6, th * 0.8);
    try { tg.addColorStop(0, '#9ce78f'); tg.addColorStop(1, '#37a04c'); } catch (e) {}
    c.fillStyle = tg;
    c.beginPath(); c.arc(tx, ty - th * 0.66, th * 0.40, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(tx - tw * 0.5, ty - th * 0.47, th * 0.27, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(tx + tw * 0.5, ty - th * 0.47, th * 0.27, 0, Math.PI * 2); c.fill();
    c.restore();
  }
}

function buildBG(){
  var vw = Math.max(1, Math.round(W * DPR));
  var vh = Math.max(1, Math.round(H * DPR));
  bg.width = vw; bg.height = vh;
  bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgx.clearRect(0, 0, W, H);

  var horizon = H * 0.63;
  scene.horizon = horizon;
  var sunR = Math.min(W, H) * 0.085;
  var sunX = W * 0.755, sunY = H * 0.185;
  scene.sunX = sunX; scene.sunY = sunY; scene.sunR = sunR;

  // 天空渐变（顶部饱和蔚蓝 -> 地平线奶白）
  var sky = bgx.createLinearGradient(0, 0, 0, horizon);
  try {
    sky.addColorStop(0, '#1489cf');
    sky.addColorStop(0.35, '#4dbde9');
    sky.addColorStop(0.72, '#9fe2f7');
    sky.addColorStop(1, '#e8fbff');
  } catch (e) {}
  bgx.fillStyle = sky;
  bgx.fillRect(0, 0, W, horizon + 2);
  var skyLow = bgx.createLinearGradient(0, horizon, 0, H);
  try { skyLow.addColorStop(0, '#e8fbff'); skyLow.addColorStop(1, '#c9f1ff'); } catch (e) {}
  bgx.fillStyle = skyLow;
  bgx.fillRect(0, horizon, W, H - horizon);

  // 太阳光柱
  var i, a, len, rg;
  bgx.save();
  bgx.globalCompositeOperation = 'lighter';
  for (i = 0; i < 10; i++){
    a = (-0.62 + i * 0.138) + Math.PI * 0.5;
    len = Math.max(W, H) * 1.05;
    rg = bgx.createLinearGradient(sunX, sunY, sunX + Math.cos(a) * len, sunY + Math.sin(a) * len);
    try {
      rg.addColorStop(0, 'rgba(255,252,214,0.20)');
      rg.addColorStop(0.45, 'rgba(255,250,205,0.07)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
    } catch (e) {}
    bgx.fillStyle = rg;
    bgx.beginPath();
    bgx.moveTo(sunX, sunY);
    var wid = 0.022 + hash(i * 3.3) * 0.03;
    bgx.lineTo(sunX + Math.cos(a - wid) * len, sunY + Math.sin(a - wid) * len);
    bgx.lineTo(sunX + Math.cos(a + wid) * len, sunY + Math.sin(a + wid) * len);
    bgx.closePath();
    bgx.fill();
  }
  bgx.restore();

  // 太阳本体 + 光晕
  var halo = bgx.createRadialGradient(sunX, sunY, sunR * 0.2, sunX, sunY, sunR * 4.4);
  try {
    halo.addColorStop(0, 'rgba(255,253,232,0.95)');
    halo.addColorStop(0.22, 'rgba(255,250,210,0.55)');
    halo.addColorStop(0.55, 'rgba(255,248,205,0.18)');
    halo.addColorStop(1, 'rgba(255,255,255,0)');
  } catch (e) {}
  bgx.fillStyle = halo;
  bgx.beginPath();
  bgx.arc(sunX, sunY, sunR * 4.4, 0, Math.PI * 2);
  bgx.fill();
  var disc = bgx.createRadialGradient(sunX - sunR * 0.3, sunY - sunR * 0.35, sunR * 0.1, sunX, sunY, sunR);
  try {
    disc.addColorStop(0, '#ffffff');
    disc.addColorStop(0.6, '#fffbe0');
    disc.addColorStop(1, 'rgba(255,244,190,0.75)');
  } catch (e) {}
  bgx.fillStyle = disc;
  bgx.beginPath();
  bgx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  bgx.fill();

  // 太阳四芒星眩光（千禧年数码摄影味）
  bgx.save();
  bgx.translate(sunX, sunY);
  bgx.globalCompositeOperation = 'lighter';
  for (i = 0; i < 2; i++){
    var rl = (i ? sunR * 4.2 : sunR * 6.6);
    var rw = Math.max(1.4, sunR * (i ? 0.035 : 0.05));
    var lg = bgx.createLinearGradient(-rl, 0, rl, 0);
    try {
      lg.addColorStop(0, 'rgba(255,255,238,0)');
      lg.addColorStop(0.5, 'rgba(255,255,240,0.55)');
      lg.addColorStop(1, 'rgba(255,255,238,0)');
    } catch (e) {}
    bgx.save();
    bgx.rotate(i * Math.PI * 0.5);
    bgx.fillStyle = lg;
    bgx.fillRect(-rl, -rw / 2, rl * 2, rw);
    bgx.restore();
  }
  bgx.restore();

  // 云
  cloud(bgx, W * 0.16, H * 0.14, Math.min(W, H) * 0.0022 + 0.55, 0.72);
  cloud(bgx, W * 0.46, H * 0.075, Math.min(W, H) * 0.0016 + 0.42, 0.5);
  cloud(bgx, W * 0.86, H * 0.30, Math.min(W, H) * 0.0018 + 0.45, 0.44);
  cloud(bgx, W * 0.30, H * 0.33, Math.min(W, H) * 0.0013 + 0.34, 0.34);

  // 淡彩虹拱（千禧年天真感，压低到"耳语"级别）
  bgx.save();
  bgx.globalCompositeOperation = 'lighter';
  var arcC = { x: W * 0.30, y: H * 1.02 };
  var arcR = Math.min(W * 0.42, H * 0.62);
  var bandW = Math.max(4, Math.min(W, H) * 0.017);
  for (i = 0; i < 7; i++){
    bgx.beginPath();
    bgx.strokeStyle = 'hsla(' + Math.round(i * 44) + ',92%,62%,0.085)';
    bgx.lineWidth = bandW;
    bgx.arc(arcC.x, arcC.y, arcR + i * bandW, Math.PI * 1.02, Math.PI * 1.98);
    bgx.stroke();
  }
  bgx.restore();

  // 山（三条带：远雾绿 / 中翠绿 / 近深绿）
  scene.bands = [];
  var TAU = Math.PI * 2;
  var hz = [
    { base: horizon + H * 0.015, amp: H * 0.030, f: TAU * 2.3 / Math.max(1, W), ph: 0.7, top: '#a7e2a0', bot: '#8bd58c', rim: 'rgba(233,255,214,0.85)' },
    { base: horizon + H * 0.075, amp: H * 0.048, f: TAU * 2.0 / Math.max(1, W), ph: 2.4, top: '#63d066', bot: '#43b556', rim: 'rgba(224,255,190,0.95)' },
    { base: horizon + H * 0.165, amp: H * 0.062, f: TAU * 1.6 / Math.max(1, W), ph: 4.9, top: '#46c352', bot: '#1f8b3c', rim: 'rgba(214,255,168,0.9)' }
  ];
  for (i = 0; i < hz.length; i++){
    var b = hz[i];
    var grd = bgx.createLinearGradient(0, b.base - b.amp * 2, 0, H);
    try { grd.addColorStop(0, b.top); grd.addColorStop(1, b.bot); } catch (e) {}
    bgx.fillStyle = grd;
    bandPath(bgx, b.base, b.amp, b.f, b.ph);
    bgx.fill();
    bgx.strokeStyle = b.rim;
    bgx.lineWidth = Math.max(1, Math.min(3, H * 0.0022));
    bgx.beginPath();
    for (var k = 0; k <= 96; k++){
      var xx = -2 + (W + 4) * (k / 96);
      var yy = hillY(xx, b.base, b.amp, b.f, b.ph);
      if (k === 0) bgx.moveTo(xx, yy); else bgx.lineTo(xx, yy);
    }
    bgx.stroke();
    scene.bands.push(b);
    // 中景小树画在第二条带之后、第三条带之前，让近坡自然遮住树根
    if (i === 1) drawTrees(bgx, b.base, b.amp, b.f, b.ph);
  }

  // 近坡草叶（固定上限，防爆）
  var front = hz[2];
  var blades = Math.min(300, Math.round(W / 5));
  bgx.save();
  bgx.lineCap = 'round';
  for (i = 0; i < blades; i++){
    var fx = hash(i * 1.7) * W;
    var baseY = hillY(fx, front.base, front.amp, front.f, front.ph);
    if (baseY > H + 4) continue;
    var depth = clamp((baseY - (front.base - front.amp)) / (H - front.base + front.amp * 2 + 1), 0, 1);
    var bl = (H * 0.012 + H * 0.022 * depth) * (0.6 + hash(i * 5.1) * 0.8);
    var lean = (hash(i * 9.3) - 0.5) * bl * 0.7;
    var alpha = 0.16 + depth * 0.34;
    bgx.strokeStyle = depth > 0.45 ? 'rgba(16,104,50,' + alpha + ')' : 'rgba(232,255,200,' + alpha + ')';
    bgx.lineWidth = 1 + depth * 1.6;
    bgx.beginPath();
    bgx.moveTo(fx, baseY + 2);
    bgx.quadraticCurveTo(fx + lean * 0.4, baseY - bl * 0.55, fx + lean, baseY - bl);
    bgx.stroke();
  }
  bgx.restore();

  // 地平线雾光（千禧年那种发白的空气感）
  var haze = bgx.createLinearGradient(0, horizon - H * 0.09, 0, horizon + H * 0.02);
  try {
    haze.addColorStop(0, 'rgba(255,255,255,0)');
    haze.addColorStop(0.7, 'rgba(240,253,255,0.55)');
    haze.addColorStop(1, 'rgba(255,255,255,0.18)');
  } catch (e) {}
  bgx.fillStyle = haze;
  bgx.fillRect(0, horizon - H * 0.09, W, H * 0.12);

  // 左上角玻璃面反光（静态烘进底片，省每帧一次大面积渐变）
  var sh = bgx.createLinearGradient(0, 0, W * 0.55, H * 0.52);
  try {
    sh.addColorStop(0, 'rgba(255,255,255,0.30)');
    sh.addColorStop(0.45, 'rgba(255,255,255,0.09)');
    sh.addColorStop(1, 'rgba(255,255,255,0)');
  } catch (e) {}
  bgx.save();
  bgx.globalAlpha = 0.75;
  bgx.fillStyle = sh;
  bgx.beginPath();
  bgx.moveTo(0, 0);
  bgx.lineTo(W * 0.50, 0);
  bgx.lineTo(0, H * 0.56);
  bgx.closePath();
  bgx.fill();
  bgx.restore();
}

function resize(){
  var w = pos(window.innerWidth, 1440);
  var h = pos(window.innerHeight, 900);
  W = w; H = h;
  var budget = Math.sqrt(4200000 / Math.max(1, W * H));
  DPR = clamp(Math.min(num(window.devicePixelRatio, 1) || 1, budget), 1, 2);
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  try { buildBG(); } catch (e) { st.err = String(e && e.message || e); }
  try { buildBubbles(); } catch (e) {}
  try { buildMotes(); } catch (e) {}
}

/* ---------- 肥皂泡精灵（一次画好，逐帧缩放贴图） ---------- */
var sprites = [];
var bubbles = [];
var sparks = [];

function makeBubbleSprite(hue){
  var S = 256, c = document.createElement('canvas');
  c.width = S; c.height = S;
  var x = c.getContext('2d');
  var cx = S / 2, cy = S / 2, R = S / 2 - 8;

  var body = x.createRadialGradient(cx - R * 0.26, cy - R * 0.30, R * 0.06, cx, cy, R);
  try {
    body.addColorStop(0, 'rgba(255,255,255,0.44)');
    body.addColorStop(0.34, 'rgba(255,255,255,0.10)');
    body.addColorStop(0.62, 'rgba(206,251,255,0.06)');
    body.addColorStop(0.86, 'hsla(' + hue + ',95%,72%,0.20)');
    body.addColorStop(0.97, 'rgba(255,255,255,0.55)');
    body.addColorStop(1, 'rgba(255,255,255,0.10)');
  } catch (e) {}
  x.fillStyle = body;
  x.beginPath();
  x.arc(cx, cy, R, 0, Math.PI * 2);
  x.fill();

  // 虹彩边（青 / 品 / 黄绿 三段弧）
  var arcs = [[hue, -2.45, -0.85], [hue + 62, -0.7, 0.75], [hue + 128, 0.9, 2.5]];
  for (var i = 0; i < arcs.length; i++){
    x.beginPath();
    x.strokeStyle = 'hsla(' + Math.round((arcs[i][0] % 360 + 360) % 360) + ',100%,66%,0.55)';
    x.lineWidth = 4.5;
    x.arc(cx, cy, R * 0.985, arcs[i][1], arcs[i][2]);
    x.stroke();
  }

  // 外圈亮边
  x.beginPath();
  x.strokeStyle = 'rgba(255,255,255,0.78)';
  x.lineWidth = 2.2;
  x.arc(cx, cy, R - 1, 0, Math.PI * 2);
  x.stroke();

  // 高光：左上大弧光 + 右下反光
  x.save();
  x.beginPath();
  x.arc(cx, cy, R * 0.94, 0, Math.PI * 2);
  x.clip();
  var hl = x.createRadialGradient(cx - R * 0.34, cy - R * 0.38, 1, cx - R * 0.34, cy - R * 0.38, R * 0.75);
  try {
    hl.addColorStop(0, 'rgba(255,255,255,0.92)');
    hl.addColorStop(0.45, 'rgba(255,255,255,0.28)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
  } catch (e) {}
  x.fillStyle = hl;
  x.beginPath();
  x.ellipse(cx - R * 0.30, cy - R * 0.34, R * 0.42, R * 0.30, -0.7, 0, Math.PI * 2);
  x.fill();
  x.fillStyle = 'rgba(255,255,255,0.95)';
  x.beginPath();
  x.ellipse(cx - R * 0.40, cy - R * 0.44, R * 0.085, R * 0.062, -0.6, 0, Math.PI * 2);
  x.fill();
  var rimLow = x.createRadialGradient(cx + R * 0.28, cy + R * 0.42, 1, cx + R * 0.28, cy + R * 0.42, R * 0.5);
  try {
    rimLow.addColorStop(0, 'rgba(255,255,255,0.30)');
    rimLow.addColorStop(1, 'rgba(255,255,255,0)');
  } catch (e) {}
  x.fillStyle = rimLow;
  x.beginPath();
  x.ellipse(cx + R * 0.30, cy + R * 0.44, R * 0.34, R * 0.16, 0.55, 0, Math.PI * 2);
  x.fill();
  x.restore();
  return c;
}

function buildSprites(){
  if (sprites.length) return;
  var hues = [190, 205, 165, 288, 44];
  for (var i = 0; i < hues.length; i++){
    try { sprites.push(makeBubbleSprite(hues[i])); } catch (e) {}
  }
}

function buildBubbles(){
  buildSprites();
  bubbles = [];
  var m = Math.min(W, H);
  var n = Math.round(clamp(W * H / 52000, 9, 26));
  var i, b;
  for (i = 0; i < n; i++){
    b = {
      x: hash(i * 2.7 + 1.3) * W,
      y: hash(i * 7.9 + 4.1) * H,
      r: m * (0.016 + hash(i * 3.3) * 0.045),
      vy: 10 + hash(i * 5.7) * 26,
      ph: hash(i * 11.1) * 6.28,
      sp: 0.5 + hash(i * 13.7) * 1.3,
      wob: 0.6 + hash(i * 17.3) * 2.2,
      a: 0.55 + hash(i * 19.1) * 0.35,
      s: i % sprites.length
    };
    bubbles.push(b);
  }
  // 贴脸大泡（压在画面边缘，不抢歌词）
  var hero = [
    [0.07, 0.20, 0.115, 0.42], [0.93, 0.36, 0.135, 0.36],
    [0.16, 0.78, 0.10, 0.30], [0.86, 0.80, 0.085, 0.28]
  ];
  for (i = 0; i < hero.length; i++){
    bubbles.push({
      x: hero[i][0] * W, y: hero[i][1] * H, r: m * hero[i][2],
      vy: 3 + i * 1.5, ph: i * 1.9, sp: 0.35 + i * 0.1, wob: 1.4,
      a: hero[i][3], s: (i + 2) % sprites.length
    });
  }
}

function updateBubbles(dt){
  var k = REDUCED ? 0.35 : 1;
  var i, b;
  for (i = 0; i < bubbles.length; i++){
    b = bubbles[i];
    b.ph += dt * 0.0011 * b.sp * k;
    b.y -= b.vy * (0.5 + live.bass * 1.6) * (dt / 1000) * k;
    b.x += Math.sin(b.ph) * b.wob * dt * 0.012 * k;
    if (b.y < -b.r * 1.6){ b.y = H + b.r * 1.3; b.x = hash(i * 13.7 + st.t * 0.11) * W; }
    if (b.x < -b.r * 1.5) b.x = W + b.r;
    else if (b.x > W + b.r * 1.5) b.x = -b.r;
  }
  for (i = sparks.length - 1; i >= 0; i--){
    sparks[i].life -= dt / 520;
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }
}

function drawBubbles(){
  var i, b, r;
  for (i = 0; i < bubbles.length; i++){
    b = bubbles[i];
    if (!sprites.length) break;
    r = b.r * (1 + pulse * 0.06 + live.bass * 0.07);
    ctx.globalAlpha = clamp(b.a * (0.72 + live.level * 0.3), 0, 1);
    ctx.drawImage(sprites[b.s % sprites.length], b.x - r, b.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;

  // 鼓点的小星芒
  for (i = 0; i < sparks.length; i++){
    var sp = sparks[i];
    var lf = sp.life, rr = sp.r * (1.6 - lf * 0.6);
    ctx.save();
    ctx.globalAlpha = clamp(lf, 0, 1) * 0.9;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sp.x - rr, sp.y); ctx.lineTo(sp.x + rr, sp.y);
    ctx.moveTo(sp.x, sp.y - rr); ctx.lineTo(sp.x, sp.y + rr);
    ctx.stroke();
    ctx.strokeStyle = 'hsla(190,100%,70%,0.85)';
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, rr * 0.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------- 歌词层 ---------- */
var spans = [], cTimes = [], cOn = [], curIdx = -1;
var lineKey = '', nextText = '', metaText = '', curText = '';
var st_dur = 0, inited = false;

function setMeta(song){
  song = typeof song === 'object' && song ? song : {};
  var name = (typeof song.name === 'string') ? song.name.trim() : '';
  var ar = song.artists, artists = '';
  if (Array.isArray(ar)){
    var parts = [], i;
    for (i = 0; i < ar.length && i < 8; i++) if (typeof ar[i] === 'string' && ar[i].trim()) parts.push(ar[i].trim());
    artists = parts.join(' / ');
  } else if (typeof ar === 'string') artists = ar.trim();
  var s = name || artists || '未知曲目';
  if (name && artists) s = name + ' — ' + artists;
  if (s !== metaText){ metaText = s; metaEl.textContent = s; }

  var cover = (typeof song.cover === 'string' && song.cover) ? song.cover : '';
  if (cover && artEl){
    artEl.onerror = function(){
      artEl.classList.remove('show');
      artEl.removeAttribute('src');
      if (dotEl) dotEl.style.display = '';
    };
    if (artEl.getAttribute('src') !== cover){
      artEl.setAttribute('src', cover);
      artEl.classList.add('show');
      if (dotEl) dotEl.style.display = 'none';
    }
  } else if (artEl){
    artEl.removeAttribute('src');
    artEl.classList.remove('show');
    if (dotEl) dotEl.style.display = '';
  }
}

function buildSpans(text, chars, t0, dur){
  nowEl.textContent = '';
  spans = []; cTimes = []; cOn = []; curIdx = -1;
  var n = Math.min(text.length, 160);
  if (n <= 0) return;
  var i, times = null;
  if (chars && chars.length === text.length && n === text.length){
    var ok = true, arr = [];
    for (i = 0; i < n; i++){
      var cobj = chars[i];
      var ct = (cobj && typeof cobj.t === 'number' && isFinite(cobj.t)) ? cobj.t : null;
      if (ct === null){ ok = false; break; }
      arr.push(ct);
    }
    if (ok) times = arr;
  }
  if (!times){
    times = [];
    var d = (dur > 0.05) ? dur : 3;
    for (i = 0; i < n; i++) times.push(t0 + d * (i / n));
  }
  var frag = document.createDocumentFragment();
  for (i = 0; i < n; i++){
    var sp = document.createElement('span');
    sp.className = 'c';
    sp.textContent = text.charAt(i);
    frag.appendChild(sp);
    spans.push(sp);
    cTimes.push(times[i]);
    cOn.push(false);
  }
  nowEl.appendChild(frag);
  if (text.length > n) nowEl.appendChild(document.createTextNode('…'));
}

function updateChars(t){
  var i, on, last = -1;
  for (i = 0; i < spans.length; i++){
    on = cTimes[i] <= t + 0.016;
    if (on !== cOn[i]){
      cOn[i] = on;
      if (on) spans[i].classList.add('on');
      else spans[i].classList.remove('on');
    }
    if (on) last = i;
  }
  if (last !== curIdx){
    if (curIdx >= 0 && spans[curIdx]) spans[curIdx].classList.remove('cur');
    if (last >= 0 && spans[last]) spans[last].classList.add('cur');
    curIdx = last;
  }
}

function showEmpty(){
  if (lineKey === '__empty__') return;
  lineKey = '__empty__';
  plateEl.classList.add('empty');
  plateEl.classList.remove('t2', 't3');
  nowEl.textContent = '纯音乐';
  spans = []; cTimes = []; cOn = []; curIdx = -1;
  nextEl.textContent = '让气泡自己漂一会儿';
  nextText = '让气泡自己漂一会儿';
  st.text = ''; curText = '';
}

function renderCurrent(){
  if (!inited) return;
  var ls = st.lines;
  if (!ls.length){ showEmpty(); return; }
  plateEl.classList.remove('empty');

  var idx = st.idx;
  var ln = (idx >= 0 && idx < ls.length) ? ls[idx] : null;
  var text = ln ? (ln.text || '') : '';
  var key = idx + '|' + text;
  if (key !== lineKey){
    lineKey = key;
    st.text = text; curText = text;
    if (!text){
      nowEl.textContent = '·  ·  ·';
      spans = []; cTimes = []; cOn = []; curIdx = -1;
      plateEl.classList.remove('t2', 't3');
    } else {
      buildSpans(text, ln.chars, ln.t, ln.dur);
      plateEl.classList.remove('t2', 't3');
      var n = text.length;
      if (n >= 26) plateEl.classList.add('t3');
      else if (n >= 15) plateEl.classList.add('t2');
      nowEl.classList.remove('in');
      void nowEl.offsetWidth;
      nowEl.classList.add('in');
      if (!REDUCED){
        plateEl.classList.remove('run');
        void plateEl.offsetWidth;
        plateEl.classList.add('run');
      }
    }
  }
  var ni = idx + 1, nt = '';
  if (ni >= 0 && ni < ls.length) nt = ls[ni].text || '';
  if (nt !== nextText){ nextText = nt; nextEl.textContent = nt; }
}
var live = { level: 0, bass: 0, mid: 0, treble: 0, bpm: 0 };
var liveT = { level: 0, bass: 0, mid: 0, treble: 0, bpm: 0 };
var pulse = 0;
var lastT = 0;

function drawScene(){
  if (bg.width < 2 || bg.height < 2) { try { buildBG(); } catch (e) {} }
  ctx.drawImage(bg, 0, 0, W, H);

  // 太阳光斑随高频呼吸
  var s = 1 + live.treble * 0.35 + pulse * 0.5;
  var R = scene.sunR * 3.1 * s;
  var g = ctx.createRadialGradient(scene.sunX, scene.sunY, scene.sunR * 0.1, scene.sunX, scene.sunY, R);
  try {
    g.addColorStop(0, 'rgba(255,255,236,' + (0.20 + live.treble * 0.18) + ')');
    g.addColorStop(0.5, 'rgba(255,252,214,' + (0.07 + live.treble * 0.06) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
  } catch (e) {}
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(scene.sunX, scene.sunY, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* ---------- 空气里的光尘 ---------- */
var motes = [];

function buildMotes(){
  motes = [];
  var n = Math.round(clamp(W * H / 95000, 8, 22));
  for (var i = 0; i < n; i++){
    motes.push({
      x: hash(i * 4.13 + 2.2) * W,
      y: hash(i * 6.71 + 8.8) * H,
      r: 0.8 + hash(i * 8.31) * 2.0,
      sp: 0.4 + hash(i * 9.77) * 1.5,
      ph: hash(i * 2.19) * 6.28,
      a: 0.20 + hash(i * 5.55) * 0.45
    });
  }
}

function drawGaia(){
  var i, m, mt = performance.now() * 0.001 * (REDUCED ? 0.22 : 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < motes.length; i++){
    m = motes[i];
    var yy = m.y - ((mt * 10 * m.sp) % (H + 40));
    if (yy < -20) yy += H + 40;
    var xx = m.x + Math.sin(mt * 0.6 * m.sp + m.ph) * 12;
    var al = m.a * (0.45 + live.mid * 0.9);
    ctx.globalAlpha = clamp(al, 0, 1);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(xx, yy, m.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function frame(){
  var t0 = performance.now();
  var dt = clamp(t0 - lastT, 0, 64);
  if (!lastT) dt = 16;
  lastT = t0;

  var k = REDUCED ? 0.16 : 0.34;
  live.level += (liveT.level - live.level) * k;
  live.bass += (liveT.bass - live.bass) * k;
  live.mid += (liveT.mid - live.mid) * k;
  live.treble += (liveT.treble - live.treble) * k;

  drawScene();
  updateBubbles(dt);
  drawBubbles();
  drawGaia();

  renderCurrent();
  updateChars(st.t);
  pulse *= 0.90;
  st.frames++;
  requestAnimationFrame(frame);
  st.js = performance.now() - t0;
}

function onInit(p){
  p = p || {};
  var ls = Array.isArray(p.lines) ? p.lines : [];
  st.lines = [];
  var i, ln;
  for (i = 0; i < ls.length && i < 4000; i++){
    ln = ls[i] || {};
    st.lines.push({
      t: num(ln.t, 0),
      dur: Math.max(0.05, num(ln.dur, 0) || 3),
      text: typeof ln.text === 'string' ? ln.text : '',
      chars: Array.isArray(ln.chars) ? ln.chars : null
    });
  }
  sorted = true;
  for (i = 1; i < st.lines.length; i++){
    if (st.lines[i].t + 0.001 < st.lines[i - 1].t){ sorted = false; break; }
  }
  if (Array.isArray(p.accent) && p.accent.length >= 3){
    accent = [clamp(Math.round(num(p.accent[0], 64)), 0, 255),
              clamp(Math.round(num(p.accent[1], 200)), 0, 255),
              clamp(Math.round(num(p.accent[2], 255)), 0, 255)];
    try {
      var ar = Math.round(accent[0] * 0.34 + 120 * 0.66);
      var ag = Math.round(accent[1] * 0.34 + 244 * 0.66);
      var ab = Math.round(accent[2] * 0.34 + 255 * 0.66);
      document.documentElement.style.setProperty('--halo',
        'rgba(' + clamp(ar, 0, 255) + ',' + clamp(ag, 0, 255) + ',' + clamp(ab, 0, 255) + ',.55)');
    } catch (e) {}
  }
  st.playing = (typeof p.playing === 'boolean') ? p.playing : true;
  st_dur = Math.max(0, num(p.duration, 0));
  setMeta(p.song);
  inited = true;
  if (lyrEl) lyrEl.classList.add('ready');
  lineKey = ''; nextText = ''; curText = ''; st.text = '';
  nowEl.classList.remove('in');
  st.idx = -1;
  findIndex(st.t);
  updateChars(st.t);
  setProgress();
}

function setProgress(){
  if (barEl) barEl.style.width = (st_dur > 0 ? clamp(st.t / st_dur, 0, 1) * 100 : 0).toFixed(2) + '%';
}

var sorted = true;

function findIndex(t){
  var ls = st.lines, idx = -1, i;
  if (sorted){
    var lo = 0, hi = ls.length - 1;
    var guard = 0;
    while (lo <= hi && guard++ < 64){
      var mid = (lo + hi) >> 1;
      if (ls[mid].t <= t + 0.02){ idx = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
  } else {
    var lim = Math.min(ls.length, 4000);
    for (i = 0; i < lim; i++){
      if (ls[i].t <= t + 0.02) idx = i;
    }
  }
  st.idx = idx;
  renderCurrent();
}

window.addEventListener('message', function(ev){
  var d = ev.data;
  if (typeof d === 'string' && d.charAt(0) === '{'){
    try { d = JSON.parse(d); } catch (e) { return; }
  }
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init'){ onInit(d.payload); }
  else if (d.type === 'tick'){
    var p = d.payload || {};
    st.t = num(p.time, st.t);
    if (typeof p.playing === 'boolean') st.playing = p.playing;
    findIndex(st.t);
    setProgress();
  }
  else if (d.type === 'beat'){
    var bp = d.payload || {};
    var lv = clamp(num(bp.level, 0.6), 0, 1);
    pulse = Math.max(pulse, 0.35 + lv * 0.65);
    if (lyrEl && !REDUCED){
      lyrEl.classList.add('hit');
      if (hitTimer) clearTimeout(hitTimer);
      hitTimer = setTimeout(function(){
        lyrEl.classList.remove('hit');
        hitTimer = 0;
      }, 200);
    }
    if (bubbles.length && sparks.length < 7 && !REDUCED){
      for (var s = 0; s < 2; s++){
        var bb = bubbles[Math.floor(hash(st.frames + s * 3.7) * bubbles.length) % bubbles.length];
        if (bb) sparks.push({ x: bb.x, y: bb.y, r: bb.r * 0.55, life: 1 });
      }
    }
  }
  else if (d.type === 'live'){
    var lp = d.payload || {};
    liveT.level = clamp(num(lp.level, 0), 0, 1);
    liveT.bass = clamp(num(lp.bass, 0), 0, 1);
    liveT.mid = clamp(num(lp.mid, 0), 0, 1);
    liveT.treble = clamp(num(lp.treble, 0), 0, 1);
    liveT.bpm = num(lp.bpm, 0);
    if (typeof lp.playing === 'boolean') st.playing = lp.playing;
  }
});

window.__stage = function(){
  return {
    lines: st.lines.length, idx: st.idx, t: st.t, playing: st.playing,
    frames: st.frames, js: Math.round(st.js * 100) / 100, err: st.err,
    text: st.text, gl: false, rm: REDUCED
  };
};

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(function first(){
  sendReady();
  requestAnimationFrame(frame);
});
setTimeout(sendReady, 700);
})();
</script>
</body>
