<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>黑豹誓约</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #070605; overflow: hidden; }
  #stage-canvas { display: block; width: 100%; height: 100%; }
  #sr-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="stage-canvas"></canvas>
<div id="sr-text" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  var stageCanvas = document.getElementById('stage-canvas');
  var drawContext = stageCanvas.getContext('2d');
  var reduceMotion = false;
  try {
    reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (queryError) { reduceMotion = false; }

  var view = { W: 0, H: 0, dpr: 1, portrait: false };
  var songState = { name: '', artists: '', cover: '', duration: 0 };
  var lyricLines = [];
  var accentColor = [198, 36, 28];
  var playhead = { time: 0, playing: true, lineIndex: -1, text: '' };
  var energy = { beatIndex: -1, beatLevel: 0, liveLevel: 0, bass: 0, mid: 0, treble: 0, bpm: 0 };
  var frameCount = 0;
  var frameJsMs = 0;
  var frameTime = 0;
  var lastFrameStamp = 0;
  var sunAngle = 0;
  var beatPulse = 0;
  var lastBeatStamp = 0;
  var lastErrorAt = -1e9;

  // 自检口：脚本最外层无条件赋值，先于任何绘制/初始化。
  window.__stage = function () {
    return {
      lines: lyricLines.length,
      idx: playhead.lineIndex,
      t: playhead.time,
      playing: playhead.playing,
      frames: frameCount,
      js: frameJsMs,
      err: '',
      text: playhead.text,
      gl: false,
      rm: reduceMotion
    };
  };

  function reportError(where, error) {
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (now - lastErrorAt < 1000) { return; }
    lastErrorAt = now;
    try {
      console.error('[stage 373 ' + where + ']', error && error.stack ? error.stack : error);
    } catch (consoleError) { /* 日志不可用时无处可说，忽略 */ }
  }

  function clampNumber(value, low, high, fallback) {
    var numeric = Number(value);
    if (!Number.isFinite(numeric)) { return fallback; }
    return numeric < low ? low : (numeric > high ? high : numeric);
  }

  var PALETTE = {
    ground: '#080606',
    groundWarm: '#180d09',
    paper: '#ecd6ae',
    paperShade: '#d3b487',
    ink: '#141010',
    inkSoft: '#2b2320',
    red: '#c22a1c',
    redDeep: '#8b1913',
    gold: '#dfa733',
    goldLight: '#f4d077',
    cream: '#f5e8ca'
  };

  var layout = {
    W: 0, H: 0, portrait: false,
    sheet: { x: 0, y: 0, w: 0, h: 0, cx: 0, cy: 0, angle: -0.014 },
    lyric: { cx: 0, top: 0, maxWidth: 0, baseSize: 0, maxRows: 2, centerY: 0 },
    ui: { bottomY: 0 }
  };

  var scene = {
    dirty: true,
    background: null,
    paper: null,
    tornPath: null,
    sunburst: null,
    panther: null,
    eyeGlow: null,
    banner: null,
    bannerKey: ''
  };

  function clampByte(value, fallback) {
    return Math.round(clampNumber(value, 0, 255, fallback));
  }

  function rgbaString(red, green, blue, alpha) {
    return 'rgba(' + clampByte(red, 0) + ',' + clampByte(green, 0) + ',' + clampByte(blue, 0) + ',' +
      (Math.round(clampNumber(alpha, 0, 1, 1) * 1000) / 1000) + ')';
  }

  function safeAddStop(gradient, offset, color) {
    try {
      gradient.addColorStop(clampNumber(offset, 0, 1, 0), color);
    } catch (stopError) {
      reportError('gradient-stop', stopError);
    }
  }

  function makeRandom(seed) {
    var randomState = (seed >>> 0) || 0x9e3779b9;
    return function () {
      randomState = (randomState + 0x6d2b79f5) >>> 0;
      var mixed = randomState;
      mixed = Math.imul(mixed ^ (mixed >>> 15), mixed | 1);
      mixed ^= mixed + Math.imul(mixed ^ (mixed >>> 7), mixed | 61);
      return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeCanvas(width, height) {
    var node = document.createElement('canvas');
    node.width = Math.max(2, Math.round(clampNumber(width, 2, 4096, 1440)));
    node.height = Math.max(2, Math.round(clampNumber(height, 2, 4096, 900)));
    return node;
  }

  function traceTornRect(target, x, y, width, height, jitter, seed, step) {
    var random = makeRandom(seed);
    var stride = Math.max(8, step || 16);
    var inset = Math.min(jitter || 3, Math.min(width, height) * 0.02);
    /* target 可能是 2D 上下文，也可能是 Path2D（Path2D 没有 beginPath） */
    if (typeof target.beginPath === 'function') target.beginPath();
    var side;
    var cursor;
    for (side = 0; side < 4; side += 1) {
      var startX = x;
      var startY = y;
      var endX = x + width;
      var endY = y + height;
      if (side === 0) { startX = x; startY = y; endX = x + width; endY = y; }
      else if (side === 1) { startX = x + width; startY = y; endX = x + width; endY = y + height; }
      else if (side === 2) { startX = x + width; startY = y + height; endX = x; endY = y + height; }
      else { startX = x; startY = y + height; endX = x; endY = y; }
      var span = Math.max(1, Math.hypot(endX - startX, endY - startY));
      var steps = Math.min(80, Math.max(2, Math.ceil(span / stride)));
      for (cursor = 0; cursor <= steps; cursor += 1) {
        var ratio = cursor / steps;
        var pointX = startX + (endX - startX) * ratio;
        var pointY = startY + (endY - startY) * ratio;
        if (cursor > 0 && cursor < steps) {
          var offset = (random() - 0.5) * 2 * inset;
          if (side === 0 || side === 2) { pointY += offset; } else { pointX += offset; }
        }
        if (side === 0 && cursor === 0) { target.moveTo(pointX, pointY); } else { target.lineTo(pointX, pointY); }
      }
    }
    target.closePath();
  }

  var buildQueue = [];
  var artQueue = ['sunburst', 'panther', 'eyeGlow'];

  function markSceneDirty() {
    scene.dirty = true;
    buildQueue = ['background', 'paper', 'clip'];
  }

  function processSceneBuild() {
    if (!buildQueue.length) {
      scene.dirty = false;
      return;
    }
    var step = buildQueue.shift();
    try {
      if (step === 'background') {
        scene.background = buildBackground();
      } else if (step === 'paper') {
        scene.paper = buildPaper();
      } else if (step === 'clip') {
        scene.tornPath = new Path2D();
        traceTornRect(scene.tornPath, -layout.sheet.w / 2, -layout.sheet.h / 2, layout.sheet.w, layout.sheet.h,
          Math.min(layout.sheet.w, layout.sheet.h) * 0.006, 1117, 18);
      }
    } catch (buildError) {
      reportError('build:' + step, buildError);
    }
    scene.dirty = buildQueue.length > 0;
  }

  function processArtBuild() {
    if (!artQueue.length) { return; }
    var step = artQueue.shift();
    try {
      if (step === 'sunburst') { scene.sunburst = buildSunburst(); }
      else if (step === 'panther') { scene.panther = buildPanther(); }
      else if (step === 'eyeGlow') { scene.eyeGlow = buildEyeGlow(); }
    } catch (artError) {
      reportError('art:' + step, artError);
    }
  }

  function buildBackground() {
    var viewWidth = view.W;
    var viewHeight = view.H;
    // 封面色只做两成暗示，剩下压回红金黑，守住闪图的调色板
    var warmAccent = [
      Math.round(clampNumber(accentColor[0] * 0.22 + 168 * 0.78, 0, 255, 168)),
      Math.round(clampNumber(accentColor[1] * 0.22 + 52 * 0.78, 0, 255, 46)),
      Math.round(clampNumber(accentColor[2] * 0.22 + 38 * 0.78, 0, 255, 34))
    ];
    var canvas = makeCanvas(viewWidth, viewHeight);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return null; }
    var base = ctx.createLinearGradient(0, 0, viewWidth * 0.25, viewHeight);
    safeAddStop(base, 0, '#0d0806');
    safeAddStop(base, 0.5, PALETTE.groundWarm);
    safeAddStop(base, 1, '#070504');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, viewWidth, viewHeight);

    var glow = ctx.createRadialGradient(viewWidth * 0.5, viewHeight * 0.4, Math.min(viewWidth, viewHeight) * 0.04, viewWidth * 0.5, viewHeight * 0.46, Math.max(viewWidth, viewHeight) * 0.76);
    safeAddStop(glow, 0, rgbaString(warmAccent[0], warmAccent[1], warmAccent[2], 0.32));
    safeAddStop(glow, 0.45, rgbaString(warmAccent[0], warmAccent[1], warmAccent[2], 0.10));
    safeAddStop(glow, 1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, viewWidth, viewHeight);

    var random = makeRandom(37311);
    var dotCount = Math.min(1500, Math.round((viewWidth * viewHeight) / 1700));
    for (var dotIndex = 0; dotIndex < dotCount; dotIndex += 1) {
      var dotX = random() * viewWidth;
      var dotY = viewHeight * 0.48 + random() * viewHeight * 0.52;
      var depth = (dotY - viewHeight * 0.48) / (viewHeight * 0.52);
      var dotRadius = 0.5 + random() * 2.4 * (0.35 + depth);
      ctx.fillStyle = rgbaString(150, 38, 26, 0.04 + random() * 0.12 * depth);
      ctx.beginPath();
      ctx.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    var topShade = ctx.createLinearGradient(0, 0, 0, viewHeight * 0.26);
    safeAddStop(topShade, 0, 'rgba(0,0,0,0.62)');
    safeAddStop(topShade, 1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topShade;
    ctx.fillRect(0, 0, viewWidth, viewHeight * 0.26);

    var bottomShade = ctx.createLinearGradient(0, viewHeight, 0, viewHeight * 0.82);
    safeAddStop(bottomShade, 0, 'rgba(0,0,0,0.55)');
    safeAddStop(bottomShade, 1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bottomShade;
    ctx.fillRect(0, viewHeight * 0.82, viewWidth, viewHeight * 0.18);

    // 闪图贴在墙上的投影，预烘一次，避免每帧 shadowBlur
    var sheetBox = layout.sheet;
    if (sheetBox.w > 2 && sheetBox.h > 2) {
      var shadowPass;
      for (shadowPass = 0; shadowPass < 2; shadowPass += 1) {
        ctx.save();
        ctx.translate(sheetBox.cx + sheetBox.w * 0.004 * shadowPass, sheetBox.cy + sheetBox.h * (0.045 + shadowPass * 0.03));
        ctx.rotate(sheetBox.angle);
        traceTornRect(ctx, -sheetBox.w / 2, -sheetBox.h / 2, sheetBox.w, sheetBox.h,
          Math.min(sheetBox.w, sheetBox.h) * 0.006, 1117, 18);
        ctx.fillStyle = rgbaString(0, 0, 0, shadowPass === 0 ? 0.50 : 0.22);
        ctx.fill();
        ctx.restore();
      }
    }
    return canvas;
  }

  function drawSpacedText(ctx, text, centerX, baselineY, fontSize, spacing, fillStyle, strokeStyle, strokeWidth) {
    var characters = String(text || '').slice(0, 90).split('');
    var totalWidth = 0;
    var widths = [];
    var index;
    ctx.font = '900 ' + Math.round(fontSize) + 'px "Arial Black", "Haettenschweiler", Impact, "Microsoft YaHei", sans-serif';
    for (index = 0; index < characters.length; index += 1) {
      var measured = ctx.measureText(characters[index]).width;
      widths.push(measured);
      totalWidth += measured + spacing;
    }
    totalWidth = Math.max(1, totalWidth - spacing);
    var cursorX = centerX - totalWidth / 2;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    for (index = 0; index < characters.length; index += 1) {
      if (characters[index] !== ' ') {
        if (strokeStyle && strokeWidth > 0) {
          ctx.lineWidth = strokeWidth;
          ctx.strokeStyle = strokeStyle;
          ctx.lineJoin = 'round';
          ctx.strokeText(characters[index], cursorX, baselineY);
        }
        ctx.fillStyle = fillStyle;
        ctx.fillText(characters[index], cursorX, baselineY);
      }
      cursorX += widths[index] + spacing;
    }
    return totalWidth;
  }

  function buildPaper() {
    var width = layout.sheet.w;
    var height = layout.sheet.h;
    var scale = clampNumber(Math.min(view.dpr, 1.75), 1, 1.75, 1);
    var canvas = makeCanvas(width * scale, height * scale);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return null; }
    ctx.scale(scale, scale);
    var base = ctx.createLinearGradient(0, 0, width * 0.4, height);
    safeAddStop(base, 0, '#f2ddb9');
    safeAddStop(base, 0.45, PALETTE.paper);
    safeAddStop(base, 1, PALETTE.paperShade);
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, width, height);

    var random = makeRandom(3737);
    var fiberCount = Math.min(1100, Math.round((width * height) / 850));
    ctx.lineCap = 'round';
    for (var fiberIndex = 0; fiberIndex < fiberCount; fiberIndex += 1) {
      var fiberX = random() * width;
      var fiberY = random() * height;
      var fiberLength = 2 + random() * 10;
      ctx.strokeStyle = rgbaString(92, 63, 38, 0.03 + random() * 0.05);
      ctx.lineWidth = 0.5 + random() * 0.9;
      ctx.beginPath();
      ctx.moveTo(fiberX, fiberY);
      ctx.lineTo(fiberX + fiberLength * (random() - 0.5), fiberY + fiberLength * (random() - 0.5));
      ctx.stroke();
    }

    var stainCount = 22;
    for (var stainIndex = 0; stainIndex < stainCount; stainIndex += 1) {
      var stainX = random() * width;
      var stainY = random() * height;
      var stainRadius = Math.min(width, height) * (0.03 + random() * 0.12);
      var stain = ctx.createRadialGradient(stainX, stainY, 0, stainX, stainY, Math.max(4, stainRadius));
      safeAddStop(stain, 0, rgbaString(120, 82, 44, 0.05 + random() * 0.05));
      safeAddStop(stain, 1, 'rgba(120,82,44,0)');
      ctx.fillStyle = stain;
      ctx.beginPath();
      ctx.arc(stainX, stainY, Math.max(4, stainRadius), 0, Math.PI * 2);
      ctx.fill();
    }

    var halftoneCount = Math.min(1700, Math.round((width * height) / 620));
    for (var halftoneIndex = 0; halftoneIndex < halftoneCount; halftoneIndex += 1) {
      var pointX = random() * width;
      var pointY = random() * height;
      var edgeDistance = Math.min(pointX, width - pointX, pointY, height - pointY) / Math.min(width, height);
      var density = Math.max(0, 0.20 - edgeDistance);
      if (random() > density * 6.5) { continue; }
      var pointRadius = 0.7 + random() * 2.6;
      ctx.fillStyle = random() > 0.32
        ? rgbaString(150, 44, 30, 0.10 + random() * 0.20)
        : rgbaString(28, 20, 18, 0.10 + random() * 0.18);
      ctx.beginPath();
      ctx.arc(pointX, pointY, pointRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    var speckCount = Math.min(420, Math.round((width * height) / 2600));
    for (var speckIndex = 0; speckIndex < speckCount; speckIndex += 1) {
      ctx.fillStyle = rgbaString(24, 17, 15, 0.16 + random() * 0.28);
      ctx.beginPath();
      ctx.arc(random() * width, random() * height, 0.6 + random() * 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    var inset = Math.min(width, height) * 0.055;
    traceTornRect(ctx, inset, inset, width - inset * 2, height - inset * 2, Math.min(width, height) * 0.004, 1117, 18);
    ctx.strokeStyle = rgbaString(20, 15, 13, 0.90);
    ctx.lineWidth = Math.max(1.6, height * 0.012);
    ctx.stroke();
    var insetTwo = inset * 0.82;
    traceTornRect(ctx, insetTwo, insetTwo, width - insetTwo * 2, height - insetTwo * 2, Math.min(width, height) * 0.0025, 2229, 22);
    ctx.strokeStyle = rgbaString(150, 44, 30, 0.72);
    ctx.lineWidth = Math.max(1, height * 0.006);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    drawSpacedText(ctx, 'HONOR · LOYALTY · CREW', width / 2, height * 0.108, Math.min(width * 0.044, height * 0.058), Math.max(1, width * 0.006), rgbaString(24, 18, 15, 0.88), null, 0);
    drawSpacedText(ctx, 'EST. 373 · OLD SCHOOL FLASH', width / 2, height * 0.925, Math.min(width * 0.032, height * 0.044), Math.max(1, width * 0.004), rgbaString(24, 18, 15, 0.70), null, 0);

    ctx.strokeStyle = rgbaString(24, 18, 15, 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(width * 0.16, height * 0.878);
    ctx.lineTo(width * 0.84, height * 0.878);
    ctx.stroke();
    return canvas;
  }

  function traceDiamond(target, centerX, centerY, halfWidth, halfHeight) {
    target.beginPath();
    target.moveTo(centerX, centerY - halfHeight);
    target.lineTo(centerX + halfWidth, centerY);
    target.lineTo(centerX, centerY + halfHeight);
    target.lineTo(centerX - halfWidth, centerY);
    target.closePath();
  }

  function drawFourStar(target, centerX, centerY, radius) {
    var waist = radius * 0.14;
    target.beginPath();
    target.moveTo(centerX, centerY - radius);
    target.quadraticCurveTo(centerX + waist, centerY - waist, centerX + radius, centerY);
    target.quadraticCurveTo(centerX + waist, centerY + waist, centerX, centerY + radius);
    target.quadraticCurveTo(centerX - waist, centerY + waist, centerX - radius, centerY);
    target.quadraticCurveTo(centerX - waist, centerY - waist, centerX, centerY - radius);
    target.closePath();
  }

  function buildSunburst() {
    var size = 900;
    var canvas = makeCanvas(size, size);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return null; }
    var center = size / 2;
    ctx.translate(center, center);
    var rayCount = 28;
    for (var rayIndex = 0; rayIndex < rayCount; rayIndex += 1) {
      var startAngle = (rayIndex / rayCount) * Math.PI * 2;
      var endAngle = startAngle + (Math.PI * 2 / rayCount) * 0.56;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, center * 0.99, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = rgbaString(178, 38, 26, rayIndex % 2 === 0 ? 0.30 : 0.16);
      ctx.fill();
    }
    ctx.strokeStyle = rgbaString(24, 18, 15, 0.30);
    ctx.lineWidth = 2;
    for (var lineIndex = 0; lineIndex < rayCount; lineIndex += 1) {
      var lineAngle = (lineIndex / rayCount) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(lineAngle) * center * 0.10, Math.sin(lineAngle) * center * 0.10);
      ctx.lineTo(Math.cos(lineAngle) * center * 0.99, Math.sin(lineAngle) * center * 0.99);
      ctx.stroke();
    }
    return canvas;
  }

  function buildPanther() {
    var size = 760;
    var canvas = makeCanvas(size, size);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return null; }
    var unit = size / 2;
    ctx.translate(size / 2, size / 2);
    ctx.scale(unit * 0.90, unit * 0.90);
    ctx.lineJoin = 'round';

    var rightHalf = [
      [0.00, -0.64], [0.20, -0.62], [0.34, -0.50],
      [0.40, -0.68], [0.60, -0.96], [0.78, -0.48],
      [0.80, -0.34], [0.68, -0.30], [0.90, -0.16],
      [0.70, -0.06], [0.92, 0.06], [0.70, 0.14],
      [0.80, 0.26], [0.60, 0.30], [0.52, 0.42],
      [0.36, 0.52], [0.16, 0.58], [0.00, 0.60]
    ];
    ctx.beginPath();
    ctx.moveTo(rightHalf[0][0], rightHalf[0][1]);
    var pointIndex;
    for (pointIndex = 1; pointIndex < rightHalf.length; pointIndex += 1) {
      ctx.lineTo(rightHalf[pointIndex][0], rightHalf[pointIndex][1]);
    }
    for (pointIndex = rightHalf.length - 2; pointIndex >= 1; pointIndex -= 1) {
      ctx.lineTo(-rightHalf[pointIndex][0], rightHalf[pointIndex][1]);
    }
    ctx.closePath();
    ctx.fillStyle = PALETTE.ink;
    ctx.fill();
    ctx.lineWidth = 0.018;
    ctx.strokeStyle = rgbaString(24, 18, 15, 0.95);
    ctx.stroke();

    // 耳朵内侧红
    ctx.fillStyle = PALETTE.red;
    ctx.beginPath();
    ctx.moveTo(0.45, -0.64); ctx.lineTo(0.59, -0.90); ctx.lineTo(0.71, -0.56);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.45, -0.64); ctx.lineTo(-0.59, -0.90); ctx.lineTo(-0.71, -0.56);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgbaString(24, 18, 15, 0.85);
    ctx.lineWidth = 0.012;
    ctx.stroke();

    // 额头小菱形记号
    ctx.fillStyle = PALETTE.cream;
    ctx.beginPath();
    ctx.moveTo(0, -0.54); ctx.lineTo(0.055, -0.44); ctx.lineTo(0, -0.36); ctx.lineTo(-0.055, -0.44);
    ctx.closePath(); ctx.fill();

    // 口鼻米白区
    ctx.fillStyle = PALETTE.cream;
    ctx.beginPath();
    ctx.ellipse(0, 0.26, 0.42, 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgbaString(24, 18, 15, 0.55);
    ctx.lineWidth = 0.012;
    ctx.stroke();

    // 张开的嘴：红色口腔
    ctx.fillStyle = PALETTE.redDeep;
    ctx.beginPath();
    ctx.moveTo(-0.26, 0.20);
    ctx.quadraticCurveTo(0, 0.16, 0.26, 0.20);
    ctx.quadraticCurveTo(0.14, 0.46, 0, 0.50);
    ctx.quadraticCurveTo(-0.14, 0.46, -0.26, 0.20);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 0.016;
    ctx.stroke();

    // 獠牙
    ctx.fillStyle = PALETTE.cream;
    var fangs = [
      [-0.22, 0.21, -0.14, 0.21, -0.19, 0.44],
      [0.22, 0.21, 0.14, 0.21, 0.19, 0.44],
      [-0.09, 0.20, -0.03, 0.20, -0.06, 0.33],
      [0.09, 0.20, 0.03, 0.20, 0.06, 0.33]
    ];
    for (var fangIndex = 0; fangIndex < fangs.length; fangIndex += 1) {
      var fang = fangs[fangIndex];
      ctx.beginPath();
      ctx.moveTo(fang[0], fang[1]);
      ctx.lineTo(fang[2], fang[3]);
      ctx.lineTo(fang[4], fang[5]);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = rgbaString(24, 18, 15, 0.7);
      ctx.lineWidth = 0.008;
      ctx.stroke();
    }

    // 鼻头
    ctx.fillStyle = PALETTE.ink;
    ctx.beginPath();
    ctx.moveTo(-0.11, 0.06);
    ctx.quadraticCurveTo(0, 0.02, 0.11, 0.06);
    ctx.lineTo(0.045, 0.15);
    ctx.lineTo(-0.045, 0.15);
    ctx.closePath();
    ctx.fill();

    // 眼睛：金黄杏仁眼 + 竖瞳
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 0.022;
    ctx.fillStyle = PALETTE.goldLight;
    var eyeOffsets = [-0.35, 0.35];
    for (var eyeIndex = 0; eyeIndex < eyeOffsets.length; eyeIndex += 1) {
      var eyeX = eyeOffsets[eyeIndex];
      ctx.beginPath();
      ctx.ellipse(eyeX, -0.28, 0.155, 0.082, eyeOffsets[eyeIndex] > 0 ? 0.16 : -0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = PALETTE.ink;
      ctx.beginPath();
      ctx.ellipse(eyeX, -0.28, 0.032, 0.070, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = PALETTE.goldLight;
    }

    // 怒眉高光
    ctx.strokeStyle = PALETTE.cream;
    ctx.lineWidth = 0.035;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-0.50, -0.40); ctx.lineTo(-0.22, -0.45);
    ctx.moveTo(0.50, -0.40); ctx.lineTo(0.22, -0.45);
    ctx.stroke();

    // 胡须
    ctx.strokeStyle = rgbaString(24, 18, 15, 0.85);
    ctx.lineWidth = 0.010;
    ctx.beginPath();
    ctx.moveTo(-0.30, 0.30); ctx.lineTo(-0.46, 0.26);
    ctx.moveTo(-0.31, 0.36); ctx.lineTo(-0.48, 0.37);
    ctx.moveTo(0.30, 0.30); ctx.lineTo(0.46, 0.26);
    ctx.moveTo(0.31, 0.36); ctx.lineTo(0.48, 0.37);
    ctx.stroke();

    // 颈下阴影排线
    ctx.strokeStyle = rgbaString(24, 18, 15, 0.30);
    ctx.lineWidth = 0.010;
    for (var hatchIndex = 0; hatchIndex < 7; hatchIndex += 1) {
      var hatchY = 0.58 + hatchIndex * 0.055;
      ctx.beginPath();
      ctx.moveTo(-0.34 + hatchIndex * 0.02, hatchY);
      ctx.lineTo(0.34 - hatchIndex * 0.02, hatchY - 0.03);
      ctx.stroke();
    }
    return canvas;
  }

  function buildEyeGlow() {
    var size = 760;
    var canvas = makeCanvas(size, size);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return null; }
    var unit = size / 2;
    ctx.translate(size / 2, size / 2);
    ctx.globalCompositeOperation = 'lighter';
    var eyeOffsets = [-0.35, 0.35];
    for (var eyeIndex = 0; eyeIndex < eyeOffsets.length; eyeIndex += 1) {
      var eyeX = eyeOffsets[eyeIndex] * unit * 0.90;
      var eyeY = -0.28 * unit * 0.90;
      var glowRadius = unit * 0.30;
      var glow = ctx.createRadialGradient(eyeX, eyeY, 0, eyeX, eyeY, Math.max(4, glowRadius));
      safeAddStop(glow, 0, rgbaString(244, 208, 119, 0.85));
      safeAddStop(glow, 0.35, rgbaString(223, 167, 51, 0.35));
      safeAddStop(glow, 1, 'rgba(223,167,51,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, Math.max(4, glowRadius), 0, Math.PI * 2);
      ctx.fill();
    }
    return canvas;
  }

  function buildBanner(width, height, label) {
    var tail = height * 0.85;
    var scale = clampNumber(Math.min(view.dpr, 1.75), 1, 1.75, 1);
    var logicalWidth = width + tail * 2 + 6;
    var logicalHeight = height * 1.9;
    var canvas = makeCanvas(logicalWidth * scale, logicalHeight * scale);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return null; }
    ctx.scale(scale, scale);
    var centerX = logicalWidth / 2;
    var centerY = logicalHeight / 2;
    var halfWidth = width / 2;
    var halfHeight = height / 2;

    ctx.fillStyle = PALETTE.redDeep;
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = Math.max(1.4, height * 0.045);
    ctx.beginPath();
    ctx.moveTo(centerX + halfWidth, centerY - halfHeight * 0.92);
    ctx.lineTo(centerX + halfWidth + tail, centerY - halfHeight * 0.70);
    ctx.lineTo(centerX + halfWidth + tail * 0.46, centerY);
    ctx.lineTo(centerX + halfWidth + tail, centerY + halfHeight * 0.70);
    ctx.lineTo(centerX + halfWidth, centerY + halfHeight * 0.92);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(centerX - halfWidth, centerY - halfHeight * 0.92);
    ctx.lineTo(centerX - halfWidth - tail, centerY - halfHeight * 0.70);
    ctx.lineTo(centerX - halfWidth - tail * 0.46, centerY);
    ctx.lineTo(centerX - halfWidth - tail, centerY + halfHeight * 0.70);
    ctx.lineTo(centerX - halfWidth, centerY + halfHeight * 0.92);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = PALETTE.ink;
    ctx.beginPath();
    ctx.moveTo(centerX - halfWidth, centerY - halfHeight);
    ctx.lineTo(centerX + halfWidth, centerY - halfHeight);
    ctx.lineTo(centerX + halfWidth, centerY + halfHeight);
    ctx.lineTo(centerX - halfWidth, centerY + halfHeight);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = rgbaString(223, 167, 51, 0.85);
    ctx.lineWidth = Math.max(1, height * 0.028);
    ctx.beginPath();
    ctx.moveTo(centerX - halfWidth + height * 0.12, centerY - halfHeight + height * 0.10);
    ctx.lineTo(centerX + halfWidth - height * 0.12, centerY - halfHeight + height * 0.10);
    ctx.lineTo(centerX + halfWidth - height * 0.12, centerY + halfHeight - height * 0.10);
    ctx.lineTo(centerX - halfWidth + height * 0.12, centerY + halfHeight - height * 0.10);
    ctx.closePath();
    ctx.stroke();

    var fontSize = Math.max(9, height * 0.60);
    ctx.font = '900 ' + Math.round(fontSize) + 'px "Arial Black", "Haettenschweiler", Impact, "Microsoft YaHei", sans-serif';
    var measured = Math.max(1, ctx.measureText(label).width);
    var targetWidth = width * 0.84;
    if (measured > targetWidth) { fontSize = fontSize * (targetWidth / measured); }
    ctx.textBaseline = 'middle';
    drawSpacedText(ctx, label, centerX, centerY + fontSize * 0.34, fontSize, fontSize * 0.10, PALETTE.cream, null, 0);
    return canvas;
  }

  function buildSheetBanner() {
    var sheet = layout.sheet;
    var label = (songState.name || 'YOUTH CREW').toUpperCase().slice(0, 26);
    scene.banner = buildBanner(sheet.w * 0.80, sheet.h * 0.125, label);
    scene.bannerKey = songState.name + '|' + Math.round(sheet.w) + 'x' + Math.round(sheet.h);
  }

  function drawSheetArt(ctx) {
    var sheet = layout.sheet;
    var width = sheet.w;
    var height = sheet.h;
    var halfWidth = width * 0.335;
    var halfHeight = height * 0.300;
    var centerX = 0;
    var centerY = -height * 0.055;
    var breathe = reduceMotion ? 1 : 1 + clampNumber(energy.bass, 0, 1, 0) * 0.018 + beatPulse * 0.035;

    var bannerKeyDesired = songState.name + '|' + Math.round(width) + 'x' + Math.round(height);
    if (scene.bannerKey !== bannerKeyDesired) {
      try {
        buildSheetBanner();
      } catch (bannerError) {
        reportError('banner', bannerError);
      }
      scene.bannerKey = bannerKeyDesired;
    }

    // 菱形内底色
    traceDiamond(ctx, centerX, centerY, halfWidth, halfHeight);
    ctx.fillStyle = '#f7ead0';
    ctx.fill();

    ctx.save();
    traceDiamond(ctx, centerX, centerY, halfWidth * 0.985, halfHeight * 0.985);
    ctx.clip();
    if (canvasReady(scene.sunburst)) {
      var sunSize = Math.max(halfWidth, halfHeight) * 3.0;
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(sunAngle);
      ctx.globalAlpha = 0.88;
      ctx.drawImage(scene.sunburst, -sunSize / 2, -sunSize / 2, sunSize, sunSize);
      ctx.restore();
    }
    if (canvasReady(scene.panther)) {
      var pantherSize = Math.min(halfWidth * 1.90, halfHeight * 2.35) * breathe;
      ctx.save();
      ctx.translate(centerX, centerY + halfHeight * 0.04);
      ctx.drawImage(scene.panther, -pantherSize / 2, -pantherSize / 2, pantherSize, pantherSize);
      ctx.restore();
    }
    ctx.restore();

    // 眼里的光
    if (canvasReady(scene.eyeGlow)) {
      var glowSize = Math.min(halfWidth * 1.90, halfHeight * 2.35) * breathe;
      var glowAlpha = 0.20 + clampNumber(energy.beatLevel, 0, 1, 0) * 0.18 + beatPulse * 0.45;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clampNumber(glowAlpha, 0, 0.95, 0.2);
      ctx.translate(centerX, centerY + halfHeight * 0.04);
      ctx.drawImage(scene.eyeGlow, -glowSize / 2, -glowSize / 2, glowSize, glowSize);
      ctx.restore();
    }

    // 菱形框线
    traceDiamond(ctx, centerX, centerY, halfWidth, halfHeight);
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = Math.max(2, width * 0.010);
    ctx.stroke();
    traceDiamond(ctx, centerX, centerY, halfWidth * 0.945, halfHeight * 0.945);
    ctx.strokeStyle = rgbaString(223, 167, 51, 0.78);
    ctx.lineWidth = Math.max(1, width * 0.0035);
    ctx.stroke();
    traceDiamond(ctx, centerX, centerY, halfWidth * 1.045, halfHeight * 1.045);
    ctx.strokeStyle = rgbaString(194, 42, 28, 0.55);
    ctx.lineWidth = Math.max(1, width * 0.0025);
    ctx.stroke();

    // 鼓点把金线点亮一圈
    if (beatPulse > 0.02 && !reduceMotion) {
      traceDiamond(ctx, centerX, centerY, halfWidth * 1.045, halfHeight * 1.045);
      ctx.strokeStyle = rgbaString(244, 208, 119, 0.34 * beatPulse);
      ctx.lineWidth = Math.max(1.5, width * 0.014 * beatPulse);
      ctx.stroke();
    }

    // 菱形外面一圈手绘放线
    var dashCount = 36;
    var unitLength = Math.min(width, height);
    for (var dashIndex = 0; dashIndex < dashCount; dashIndex += 1) {
      var dashAngle = (dashIndex / dashCount) * Math.PI * 2;
      var dashCos = Math.cos(dashAngle);
      var dashSin = Math.sin(dashAngle);
      var boundary = 1 / (Math.abs(dashCos) / halfWidth + Math.abs(dashSin) / halfHeight);
      var innerRadius = boundary + unitLength * 0.024;
      var outerRadius = innerRadius + unitLength * (0.018 + (dashIndex % 3) * 0.010);
      ctx.beginPath();
      ctx.moveTo(centerX + dashCos * innerRadius, centerY + dashSin * innerRadius);
      ctx.lineTo(centerX + dashCos * outerRadius, centerY + dashSin * outerRadius);
      ctx.strokeStyle = rgbaString(24, 18, 15, dashIndex % 3 === 0 ? 0.45 : 0.24);
      ctx.lineWidth = Math.max(1, width * 0.0035);
      ctx.stroke();
    }

    // 菱形左右各一枚星
    var starRadius = Math.min(width, height) * 0.032;
    var starSpots = [
      [centerX - halfWidth * 1.22, centerY + halfHeight * 0.10],
      [centerX + halfWidth * 1.22, centerY + halfHeight * 0.10]
    ];
    ctx.fillStyle = PALETTE.gold;
    for (var starIndex = 0; starIndex < starSpots.length; starIndex += 1) {
      var spot = starSpots[starIndex];
      drawFourStar(ctx, spot[0], spot[1], starRadius);
      ctx.fill();
      ctx.strokeStyle = rgbaString(24, 18, 15, 0.7);
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 横幅
    if (canvasReady(scene.banner)) {
      var bannerWidth = width * 0.80;
      var bannerHeight = height * 0.125;
      var bannerDrawWidth = bannerWidth + bannerHeight * 1.70;
      var bannerDrawHeight = bannerHeight * 1.90;
      ctx.drawImage(scene.banner, -bannerDrawWidth / 2, height * 0.30 - bannerDrawHeight / 2, bannerDrawWidth, bannerDrawHeight);
    }
  }

  function drawSheet(ctx) {
    var sheet = layout.sheet;
    if (!canvasReady(scene.paper) || !scene.tornPath) { return; }
    ctx.save();
    ctx.translate(sheet.cx, sheet.cy);
    ctx.rotate(sheet.angle);
    if (!reduceMotion) {
      var punch = 1 + beatPulse * 0.006;
      ctx.scale(punch, punch);
    }
    ctx.save();
    ctx.clip(scene.tornPath);
    ctx.drawImage(scene.paper, -sheet.w / 2, -sheet.h / 2, sheet.w, sheet.h);
    drawSheetArt(ctx);
    ctx.restore();
    ctx.restore();
  }

  function drawDivider(ctx) {
    var dividerY = layout.sheet.y + layout.sheet.h + view.H * 0.018;
    if (dividerY > view.H * 0.86) { return; }
    var centerX = layout.lyric.cx;
    var span = Math.min(layout.lyric.maxWidth * 0.34, view.W * 0.30);
    var gap = Math.max(16, view.W * 0.022);
    var starRadius = Math.max(5, Math.min(view.W, view.H) * 0.012);
    ctx.save();
    ctx.strokeStyle = rgbaString(223, 167, 51, 0.55);
    ctx.lineWidth = Math.max(1, view.H * 0.0016);
    ctx.beginPath();
    ctx.moveTo(centerX - gap - span, dividerY);
    ctx.lineTo(centerX - gap, dividerY);
    ctx.moveTo(centerX + gap, dividerY);
    ctx.lineTo(centerX + gap + span, dividerY);
    ctx.stroke();
    ctx.fillStyle = rgbaString(194, 42, 28, 0.9);
    drawFourStar(ctx, centerX, dividerY, starRadius);
    ctx.fill();
    ctx.restore();
  }

  function renderScene() {
    var ctx = drawContext;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = PALETTE.ground;
    ctx.fillRect(0, 0, view.W, view.H);
    if (canvasReady(scene.background)) { ctx.drawImage(scene.background, 0, 0, view.W, view.H); }
    drawSheet(ctx);
    drawDivider(ctx);
  }

  function layoutScene() {
    var viewWidth = view.W;
    var viewHeight = view.H;
    var portrait = view.portrait;
    var sheetWidth;
    var sheetHeight;
    layout.W = viewWidth;
    layout.H = viewHeight;
    layout.portrait = portrait;
    if (portrait) {
      sheetHeight = Math.min(viewHeight * 0.40, (viewWidth * 0.92) / 1.30);
      sheetWidth = sheetHeight * 1.30;
    } else {
      sheetHeight = Math.min(viewHeight * 0.50, viewWidth * 0.36);
      sheetWidth = sheetHeight * 1.30;
      if (sheetWidth > viewWidth * 0.74) { sheetWidth = viewWidth * 0.74; sheetHeight = sheetWidth / 1.30; }
    }
    sheetWidth = Math.max(160, sheetWidth);
    sheetHeight = Math.max(120, sheetHeight);
    layout.sheet.w = sheetWidth;
    layout.sheet.h = sheetHeight;
    layout.sheet.x = (viewWidth - sheetWidth) / 2;
    layout.sheet.y = portrait ? viewHeight * 0.045 : viewHeight * 0.05;
    layout.sheet.cx = layout.sheet.x + sheetWidth / 2;
    layout.sheet.cy = layout.sheet.y + sheetHeight / 2;
    layout.sheet.angle = portrait ? -0.012 : -0.016;
    layout.lyric.cx = viewWidth / 2;
    layout.lyric.top = layout.sheet.y + sheetHeight + viewHeight * (portrait ? 0.045 : 0.05);
    layout.lyric.maxWidth = viewWidth * (portrait ? 0.90 : 0.84);
    layout.lyric.baseSize = portrait
      ? clampNumber(viewWidth * 0.165, 30, 150, 60)
      : clampNumber(Math.min(viewHeight * 0.135, viewWidth * 0.095), 40, 220, 110);
    layout.lyric.maxRows = portrait ? 4 : 2;
    layout.ui.bottomY = viewHeight * 0.945;
    var available = Math.max(80, layout.ui.bottomY - layout.lyric.top - viewHeight * 0.06);
    layout.lyric.centerY = layout.lyric.top + available * 0.46;
  }

  function readViewport() {
    var width = stageCanvas.clientWidth;
    var height = stageCanvas.clientHeight;
    if (!Number.isFinite(width) || width <= 0) { width = window.innerWidth; }
    if (!Number.isFinite(height) || height <= 0) { height = window.innerHeight; }
    if (!Number.isFinite(width) || width <= 0) { width = 1440; }
    if (!Number.isFinite(height) || height <= 0) { height = 900; }
    width = Math.round(clampNumber(width, 1, 8192, 1440));
    height = Math.round(clampNumber(height, 1, 8192, 900));
    if (!(width > 0) || !(height > 0)) { width = 1440; height = 900; }
    view.W = width;
    view.H = height;
    view.portrait = height > width * 1.08;
    view.dpr = Math.round(clampNumber(window.devicePixelRatio, 1, 2.5, 1) * 100) / 100;
  }

  function fitCanvas() {
    readViewport();
    stageCanvas.width = Math.max(2, Math.round(view.W * view.dpr));
    stageCanvas.height = Math.max(2, Math.round(view.H * view.dpr));
    drawContext.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    layoutScene();
    markSceneDirty();
  }

  function normalizeText(value) {
    if (value === null || value === undefined) { return ''; }
    return String(value);
  }

  function normalizeLines(rawLines) {
    var source = Array.isArray(rawLines) ? rawLines : [];
    var limit = Math.min(source.length, 600);
    var output = [];
    var previousTime = 0;
    for (var lineCursor = 0; lineCursor < limit; lineCursor += 1) {
      var entry = source[lineCursor];
      if (!entry || typeof entry !== 'object') { continue; }
      var lineTime = Number(entry.t);
      if (!Number.isFinite(lineTime)) { lineTime = previousTime; }
      if (lineTime < previousTime) { lineTime = previousTime; }
      previousTime = lineTime;
      var rawText = normalizeText(entry.text).replace(/\s+/g, ' ').trim().slice(0, 120);
      var charList = null;
      if (Array.isArray(entry.chars) && entry.chars.length) {
        charList = [];
        var charLimit = Math.min(entry.chars.length, 400);
        for (var charCursor = 0; charCursor < charLimit; charCursor += 1) {
          var charEntry = entry.chars[charCursor];
          if (!charEntry || typeof charEntry !== 'object') { continue; }
          var charTime = Number(charEntry.t);
          if (!Number.isFinite(charTime)) { charTime = lineTime; }
          charList.push({ c: normalizeText(charEntry.c).slice(0, 2), t: charTime });
        }
        if (!charList.length) { charList = null; }
      }
      var lineText = rawText;
      if (!lineText && charList) {
        lineText = charList.map(function (charItem) { return charItem.c; }).join('').replace(/\s+/g, ' ').trim().slice(0, 120);
      }
      if (!lineText) { continue; }
      var lineDuration = Number(entry.dur);
      if (!Number.isFinite(lineDuration) || lineDuration < 0) { lineDuration = 0; }
      output.push({ t: lineTime, dur: lineDuration, text: lineText, chars: charList });
    }
    return output;
  }

  function findLineIndex(timeValue) {
    if (!lyricLines.length) { return -1; }
    if (timeValue < lyricLines[0].t) { return -1; }
    var low = 0;
    var high = lyricLines.length - 1;
    var found = 0;
    for (var guard = 0; guard < 24 && low <= high; guard += 1) {
      var middle = (low + high) >> 1;
      if (lyricLines[middle].t <= timeValue + 0.0005) { found = middle; low = middle + 1; }
      else { high = middle - 1; }
    }
    return found;
  }

  var spokenText = '';

  function syncPlayheadText() {
    playhead.lineIndex = findLineIndex(playhead.time);
    if (playhead.lineIndex >= 0 && playhead.lineIndex < lyricLines.length) {
      playhead.text = lyricLines[playhead.lineIndex].text;
    } else {
      playhead.text = '';
    }
    if (playhead.text === spokenText) { return; }
    spokenText = playhead.text;
    var srNode = document.getElementById('sr-text');
    if (srNode) { srNode.textContent = playhead.text; }
  }

  function handleInit(payload) {
    var data = (payload && typeof payload === 'object') ? payload : {};
    if (data.song && typeof data.song === 'object') {
      songState.name = normalizeText(data.song.name).trim();
      var artistValue = data.song.artists;
      if (Array.isArray(artistValue)) {
        songState.artists = artistValue.slice(0, 8).map(function (artistItem) {
          if (typeof artistItem === 'string' || typeof artistItem === 'number') { return String(artistItem).trim(); }
          if (artistItem && typeof artistItem === 'object' && typeof artistItem.name === 'string') { return artistItem.name.trim(); }
          return '';
        }).filter(Boolean).join(' / ');
      } else {
        songState.artists = normalizeText(artistValue).trim();
      }
      songState.cover = normalizeText(data.song.cover);
    }
    if (Array.isArray(data.accent) && data.accent.length >= 3) {
      accentColor = [
        Math.round(clampNumber(data.accent[0], 0, 255, 198)),
        Math.round(clampNumber(data.accent[1], 0, 255, 36)),
        Math.round(clampNumber(data.accent[2], 0, 255, 28))
      ];
    }
    lyricLines = normalizeLines(data.lines);
    songState.duration = clampNumber(data.duration, 0, 86400, 0);
    playhead.playing = (typeof data.playing === 'boolean') ? data.playing : true;
    initReceived = true;
    syncPlayheadText();
    resetLyricArt();
  }

  function resetLyricArt() {
    lyricEntry = null;
    emptyEntry = null;
    emptyEntryKey = '';
    brushStroke = null;
    scene.banner = null;
    scene.bannerKey = '';
  }

  var measureCanvas = document.createElement('canvas');
  var measureContext = measureCanvas.getContext('2d');
  var lyricEntry = null;
  var emptyEntry = null;
  var emptyEntryKey = '';
  var initReceived = false;
  var brushStroke = null;

  function lyricFont(size) {
    return '900 ' + Math.round(size) + 'px "Arial Black", "Haettenschweiler", Impact, "Segoe UI Black", "Microsoft YaHei", sans-serif';
  }

  function isWideCharacter(character) {
    return /[\u1100-\u11ff\u2e80-\u9fff\ua960-\ua97f\uac00-\ud7ff\uf900-\ufaff\ufe30-\ufe4f\uff00-\uffef]/.test(character);
  }

  function isClosingPunctuation(character) {
    return /[，。！？、；：,.!?;:）」』】》〉…—]/.test(character);
  }

  function tokenizeLyric(text) {
    var tokens = [];
    var latinBuffer = '';
    var budget = Math.min(240, text.length);
    for (var charIndex = 0; charIndex < budget; charIndex += 1) {
      var character = text.charAt(charIndex);
      if (character === ' ' || character === '\t') {
        if (latinBuffer) { tokens.push({ text: latinBuffer, space: false }); latinBuffer = ''; }
        tokens.push({ text: ' ', space: true });
      } else if (isWideCharacter(character)) {
        if (latinBuffer) { tokens.push({ text: latinBuffer, space: false }); latinBuffer = ''; }
        tokens.push({ text: character, space: false });
      } else {
        latinBuffer += character;
      }
    }
    if (latinBuffer) { tokens.push({ text: latinBuffer, space: false }); }
    return tokens;
  }

  function wrapLyric(text, maxWidth, size) {
    var ctx = measureContext;
    if (!ctx) { return [{ chars: [{ c: text, x: 0, w: maxWidth }], width: maxWidth }]; }
    ctx.font = lyricFont(size);
    var tokens = tokenizeLyric(text);
    var rows = [];
    var currentRow = { chars: [], width: 0 };
    for (var tokenIndex = 0; tokenIndex < tokens.length; tokenIndex += 1) {
      var token = tokens[tokenIndex];
      var tokenWidth = ctx.measureText(token.text).width;
      if (token.space) {
        if (currentRow.chars.length) {
          currentRow.chars.push({ c: ' ', x: currentRow.width, w: tokenWidth, space: true });
          currentRow.width += tokenWidth;
        }
        continue;
      }

    for (var rowIndex = 0; rowIndex < entry.rows.length; rowIndex += 1) {

      for (var charIndex = 0; charIndex < rowChars.length; charIndex += 1) {

    var size = empty.size;
    var blockTop = layout.lyric.centerY - size * 0.6;
    var sprite = empty.sprite;
    var left = layout.lyric.cx - empty.row.width / 2 - sprite.pad;

    drawFourStar(ctx, layout.lyric.cx + size * 1.05, starY, starRadius * 0.7);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

  function formatClock(seconds) {

    ctx.save();
    ctx.textBaseline = 'alphabetic';
    ctx.font = '700 ' + Math.round(textSize) + 'px "Arial Black", Impact, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = rgbaString(245, 232, 202, 0.66);
    ctx.textAlign = 'left';
    var artistLabel = (songState.artists || 'YOUTH CREW').toUpperCase().slice(0, 42);
    ctx.fillText(artistLabel, margin, height - textSize * 2.4);
    ctx.textAlign = 'right';
    var duration = clampNumber(songState.duration, 0, 86400, 0);
    var timeLabel = formatClock(playhead.time) + (duration > 0 ? ' / ' + formatClock(duration) : '');
    ctx.fillText(timeLabel, width - margin, height - textSize * 2.4);

    var barWidth = width - margin * 2;
    var barY = height - textSize * 1.35;

      window.requestAnimationFrame(animate);
    }
  });
  window.setTimeout(sendReady, 900);
})();
</script>
