<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>夜视残像 · NIGHT VISION AFTERIMAGE</title>
<style>
  @font-face{
    font-family:"GothicCyr";
    src:url("assets/362-gothic-cyrillic.ttf") format("truetype");
    font-display:swap;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050306}
  #stage{position:fixed;inset:0;isolation:isolate;background:#050306}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;filter:contrast(1.15) saturate(.88)}
  .ghostWord{
    position:absolute;pointer-events:none;z-index:2;
    font-family:"GothicCyr","Times New Roman",serif;
    color:rgba(242,234,224,.055);
    white-space:nowrap;line-height:.78;letter-spacing:.02em;
  }
  #ghostA{left:-2.4vmin;bottom:1vmin;font-size:clamp(72px,21vmin,290px)}
  #ghostB{
    right:-.6vmin;top:9vmin;font-size:clamp(46px,12vmin,170px);
    writing-mode:vertical-rl;color:rgba(242,234,224,.042);
  }
  #scan{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.42) 0 1px,rgba(0,0,0,0) 1px 3px);
    opacity:.55;mix-blend-mode:multiply;
  }
  #vig{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 52% 48%,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.9) 100%),
      linear-gradient(90deg,rgba(255,255,255,.05),rgba(0,0,0,0) 12%,rgba(0,0,0,0) 88%,rgba(255,255,255,.05));
  }
  #hud{position:absolute;inset:0;pointer-events:none;color:#efe6da}
  .frame{position:absolute;inset:2.6vmin;border:1px solid rgba(238,228,218,.14)}
  .frameIn{position:absolute;inset:3.4vmin;border:1px solid rgba(238,228,218,.07)}
  .corner{position:absolute;width:3.2vmin;height:3.2vmin;border:1px solid rgba(244,236,228,.5)}
  .corner.tl{top:2.6vmin;left:2.6vmin;border-right:0;border-bottom:0}
  .corner.tr{top:2.6vmin;right:2.6vmin;border-left:0;border-bottom:0}
  .corner.bl{bottom:2.6vmin;left:2.6vmin;border-right:0;border-top:0}
  .corner.br{bottom:2.6vmin;right:2.6vmin;border-left:0;border-top:0}
  .mono{
    font-family:"Courier New",ui-monospace,monospace;
    font-size:clamp(8px,1.02vmin,13px);
    letter-spacing:.22em;text-transform:uppercase;
    color:rgba(238,230,222,.62);
  }
  .cyr{
    font-family:"GothicCyr","Times New Roman",serif;
    letter-spacing:.14em;line-height:1;
  }
  #recTop{position:absolute;top:4.6vmin;left:5.2vmin;display:flex;align-items:center;gap:.7em}
  #recDot{
    width:.85em;height:.85em;background:var(--hot,#f2ece2);
    box-shadow:0 0 12px 2px var(--accent,rgba(214,44,96,.7));
    animation:recblink 1.35s steps(1,end) infinite;
  }
  @keyframes recblink{0%,58%{opacity:.95}59%,100%{opacity:.16}}
  #camTag{position:absolute;top:4.4vmin;right:5.2vmin;text-align:right;line-height:1.35}
  #camTag .big{font-size:clamp(13px,2.05vmin,25px);color:rgba(246,240,232,.86)}
  #vBrand{
    position:absolute;left:1.55vmin;top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;text-orientation:mixed;
    font-size:clamp(10px,1.75vmin,22px);color:rgba(244,236,228,.34);
    letter-spacing:.46em;white-space:nowrap;
  }
  #telemetry{position:absolute;left:5.2vmin;bottom:5vmin;line-height:1.8}
  #telemetry b{font-weight:400;color:rgba(246,240,232,.85)}
  #speedBox{position:absolute;right:5.2vmin;bottom:4.9vmin;text-align:right;line-height:1.5}
  #speedVal{font-family:"Courier New",ui-monospace,monospace;font-size:clamp(14px,2.6vmin,30px);letter-spacing:.06em;color:rgba(248,242,234,.9)}
  #meterWrap{margin-top:.7em;width:clamp(92px,15vmin,190px);height:.5em;border:1px solid rgba(238,230,222,.28);padding:1px}
  #meterBar{height:100%;width:8%;background:linear-gradient(90deg,var(--accent,#d62c60),var(--hot,#f2ece2))}
  #timecode{position:absolute;top:4.7vmin;left:50%;transform:translateX(-50%);letter-spacing:.3em;color:rgba(240,232,224,.5)}
  #tcAccent{position:absolute;left:5.2vmin;top:calc(4.6vmin + 1.9em);width:clamp(48px,9vmin,120px);height:1px;background:linear-gradient(90deg,var(--accent,#d62c60),rgba(0,0,0,0))}
  #standby{
    position:absolute;left:0;right:0;top:52%;text-align:center;
    font-size:clamp(9px,1.15vmin,14px);letter-spacing:.4em;
    color:rgba(238,230,222,.4);opacity:0;transition:opacity .4s linear;
  }
  #standby.on{opacity:1}
  .rm #recDot{animation:none;opacity:.85}
  .rm #scan{opacity:.42}
  @media (max-width: 560px){
    #telemetry{display:none}
    #vBrand{display:none}
    #camTag .mono{display:none}
    #timecode{font-size:8px;letter-spacing:.16em}
  }
  @media (max-height: 420px){
    #telemetry,#vBrand,#meterWrap{display:none}
  }
  #empty{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:1.6vmin;text-align:center;pointer-events:none;
  }
  #empty.on{display:flex}
  #empty .ghost{
    font-family:"GothicCyr","Times New Roman",serif;
    font-size:clamp(28px,7.2vmin,88px);line-height:1;
    letter-spacing:.12em;color:rgba(242,234,226,.2);
  }
  #empty .cn{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:clamp(11px,1.7vmin,19px);letter-spacing:.42em;
    color:rgba(236,228,220,.62);
  }
  #empty .sm{
    font-family:"Courier New",ui-monospace,monospace;
    font-size:clamp(7.5px,1vmin,12px);letter-spacing:.36em;
    color:rgba(200,190,196,.44);
  }
  #empty .rule{
    width:clamp(120px,26vmin,340px);height:1px;margin-top:.6vmin;
    background:linear-gradient(90deg,rgba(0,0,0,0),var(--accent,#d62c60),rgba(0,0,0,0));
    opacity:.7;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="scan"></div>
  <div id="vig"></div>
  <div id="ghostA" class="ghostWord">ДРИФТ</div>
  <div id="ghostB" class="ghostWord">ПОЛНОЧЬ</div>
  <div id="hud">
    <div class="frame"></div>
    <div class="frameIn"></div>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div id="recTop">
      <span id="recDot"></span>
      <span class="mono">REC</span>
      <span class="mono" style="opacity:.42">CH 02 · IR</span>
    </div>
    <div id="camTag">
      <div class="cyr big">НОЧЬ · ДРИФТ</div>
      <div class="mono" style="margin-top:.55em">NIGHT VISION / 03:24</div>
    </div>
    <div id="timecode" class="mono">00:00:00:00</div>
    <div id="tcAccent"></div>
    <div id="vBrand" class="cyr">ПОЛНОЧЬ · 走行 · ДРИФТ</div>
    <div id="telemetry" class="mono">
      <div>ISO <b>6400</b> &nbsp; F<b>1.4</b> &nbsp; <b>1/60</b></div>
      <div>LAT <b id="latVal">00.000</b> &nbsp; LON <b>139.69</b></div>
    </div>
    <div id="speedBox">
      <div id="speedVal"><b id="speedNum">000</b> <span class="mono" style="letter-spacing:.14em">KM/H</span></div>
      <div id="meterWrap"><div id="meterBar"></div></div>
    </div>
  </div>
  <div id="empty">
    <div class="ghost">НЕТ ТЕКСТА</div>
    <div class="cn">这首歌没有歌词</div>
    <div class="rule"></div>
    <div class="sm">INSTRUMENTAL · AUDIO ONLY</div>
  </div>
  <div id="standby" class="mono">SYNC · STANDBY</div>
</div>
<script>
(function () {
  "use strict";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var emptyEl = document.getElementById("empty");
  var stageEl = document.getElementById("stage");
  var timecodeEl = document.getElementById("timecode");
  var latEl = document.getElementById("latVal");
  var speedEl = document.getElementById("speedNum");
  var meterEl = document.getElementById("meterBar");
  var standbyEl = document.getElementById("standby");

  var ST = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "", text: "",
    clock: 0, level: 0, bass: 0, mid: 0.3, treble: 0.2,
    drift: 0, glitch: 0, pulse: 0, bpm: 0, beatFlash: 0,
    speed: 96, chromeAt: 0, accentKey: "", inited: false
  };
  var PAL = { r: 214, g: 44, b: 96 };
  var VW = 1440, VH = 900, DPR = 1;
  var sentReady = false;

  function sendReady() {
    if (sentReady) return;
    sentReady = true;
    try {
      parent.postMessage({ __c100: 1, type: "ready" }, "*");
    } catch (err) {
      console.error("ready postMessage failed", err);
    }
  }

  window.__stage = function () {
    return {
      lines: ST.lines.length,
      idx: ST.idx,
      t: ST.t,
      playing: ST.playing,
      frames: ST.frames,
      js: ST.js,
      err: ST.err,
      text: ST.text,
      gl: false,
      rm: RM
    };
  };

  var RM = false;
  try {
    RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (err) {
    console.error("motion query failed", err);
  }

  function num(value, fallback) {
    var n = Number(value);
    return isFinite(n) ? n : fallback;
  }

  function resize() {
    var w = cv.clientWidth || Math.floor(window.innerWidth);
    var h = cv.clientHeight || Math.floor(window.innerHeight);
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    VW = w;
    VH = h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * DPR);
    cv.height = Math.round(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();
  }

  function applyLines(raw) {
    var list = Array.isArray(raw) ? raw : [];
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var item = list[i] || {};
      var text = typeof item.text === "string" ? item.text : "";
      var chars = Array.isArray(item.chars) ? item.chars : null;
      out.push({
        t: num(item.t, 0),
        dur: Math.max(0, num(item.dur, 0)),
        text: text,
        chars: chars
      });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    ST.lines = out;
    ST.idx = -1;
    ST.text = "";
    LYRIC.stamp = "";
    LYRIC.lineRef = null;
    if (emptyEl) emptyEl.classList.toggle("on", ST.inited && out.length === 0);
  }

  function findIndex(time) {
    var lo = 0;
    var hi = ST.lines.length - 1;
    var found = -1;
    for (var step = 0; step < 64 && lo <= hi; step++) {
      var mid = (lo + hi) >> 1;
      if (ST.lines[mid].t <= time + 0.03) {
        found = mid;
        lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    return found;
  }

  /* ---------------------------------------------------------------
     palette helpers: every colour is rounded + clamped on the way in
     --------------------------------------------------------------- */
  function clampN(value, lo, hi) {
    return value < lo ? lo : value > hi ? hi : value;
  }

  function paintColor(r, g, b, a) {
    var rr = Math.round(clampN(num(r, 0), 0, 255));
    var gg = Math.round(clampN(num(g, 0), 0, 255));
    var bb = Math.round(clampN(num(b, 0), 0, 255));
    var aa = Math.round(clampN(num(a, 1), 0, 1) * 1000) / 1000;
    return "rgba(" + rr + "," + gg + "," + bb + "," + aa + ")";
  }

  function inkHot(alpha) {
    return paintColor(252, 247, 238, alpha);
  }

  function inkBlood(alpha) {
    return paintColor(
      clampN(PAL.r * 0.62 + 62, 58, 196),
      clampN(PAL.g * 0.16 + 8, 6, 44),
      clampN(PAL.b * 0.28 + 18, 12, 82),
      alpha
    );
  }

  function inkViolet(alpha) {
    return paintColor(
      clampN(PAL.r * 0.36 + 20, 16, 120),
      clampN(PAL.g * 0.1 + 10, 6, 52),
      clampN(PAL.b * 0.55 + 62, 46, 200),
      alpha
    );
  }

  function addStop(grad, position, color) {
    try {
      grad.addColorStop(clampN(num(position, 0), 0, 1), color);
    } catch (err) {
      console.error("addColorStop failed", position, err);
    }
  }

  function makeRand(seed) {
    var state = seed >>> 0;
    return function rand() {
      state = (state * 1664525 + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  function makeGlow(radius, innerColor) {
    var size = Math.max(8, Math.round(radius * 2));
    var canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    var g = canvas.getContext("2d");
    if (!g) return canvas;
    var grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    addStop(grad, 0, innerColor);
    addStop(grad, 0.45, innerColor.replace(/[\d.]+\)$/, "0.25)"));
    addStop(grad, 1, innerColor.replace(/[\d.]+\)$/, "0)"));
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return canvas;
  }

  var SCENE = { bg: null, carWhite: null, carBlood: null, carViolet: null, box: null, haze: null };

  /* ---------------------------------------------------------------
     static night frame: sky, city blocks, horizon bloom, road, rails
     --------------------------------------------------------------- */
  function buildBackground() {
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(VW * DPR);
    canvas.height = Math.round(VH * DPR);
    var g = canvas.getContext("2d");
    if (!g) return null;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var horizon = VH * 0.585;
    var rand = makeRand(3621990);

    var sky = g.createLinearGradient(0, 0, 0, horizon);
    addStop(sky, 0, paintColor(4, 3, 7, 1));
    addStop(sky, 0.55, paintColor(9, 6, 15, 1));
    addStop(sky, 0.86, inkViolet(0.5));
    addStop(sky, 1, inkBlood(0.62));
    g.fillStyle = sky;
    g.fillRect(0, 0, VW, horizon + 2);

    /* moon / sodium-lamp bloom, blown out to pure white */
    var moonX = VW * 0.715;
    var moonY = horizon - VH * 0.235;
    var moonR = Math.max(28, VH * 0.062);
    var bloom = g.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 5.2);
    addStop(bloom, 0, inkHot(0.9));
    addStop(bloom, 0.16, inkHot(0.38));
    addStop(bloom, 0.42, inkBlood(0.16));
    addStop(bloom, 1, paintColor(0, 0, 0, 0));
    g.fillStyle = bloom;
    g.fillRect(moonX - moonR * 5.2, moonY - moonR * 5.2, moonR * 10.4, moonR * 10.4);
    g.fillStyle = inkHot(0.96);
    g.beginPath();
    g.arc(moonX, moonY, moonR, 0, Math.PI * 2);
    g.fill();

    /* distant skyline: black blocks with rare lit windows */
    var cursor = -VW * 0.04;
    for (var guard = 0; guard < 40 && cursor < VW * 1.06; guard++) {
      var bw = 22 + rand() * (VW * 0.075);
      var bh = 26 + rand() * (VH * 0.24);
      g.fillStyle = paintColor(1, 1, 3, 1);
      g.fillRect(cursor, horizon - bh, bw, bh + 2);
      g.fillStyle = inkViolet(0.16);
      g.fillRect(cursor, horizon - bh, bw, 1.2);
      if (rand() > 0.55) {
        g.fillStyle = inkHot(0.34);
        g.fillRect(cursor + bw * 0.2, horizon - bh * 0.78, Math.max(1, bw * 0.12), Math.max(1, bh * 0.06));
      }
      if (rand() > 0.72) {
        g.fillStyle = inkBlood(0.5);
        g.fillRect(cursor + bw * 0.62, horizon - bh * 0.46, Math.max(1, bw * 0.09), Math.max(1, bh * 0.05));
      }
      cursor += bw * (0.65 + rand() * 0.5);
    }

    /* power cables */
    g.strokeStyle = inkHot(0.16);
    g.lineWidth = 1;
    for (var cable = 0; cable < 3; cable++) {
      var cy = horizon - VH * (0.19 + cable * 0.045);
      g.beginPath();
      g.moveTo(-VW * 0.05, cy - VH * 0.03);
      g.quadraticCurveTo(VW * 0.5, cy + VH * 0.035, VW * 1.05, cy - VH * 0.02);
      g.stroke();
    }

    /* horizon haze */
    var haze = g.createLinearGradient(0, horizon - VH * 0.09, 0, horizon + VH * 0.06);
    addStop(haze, 0, paintColor(0, 0, 0, 0));
    addStop(haze, 0.5, inkBlood(0.34));
    addStop(haze, 1, paintColor(0, 0, 0, 0));
    g.fillStyle = haze;
    g.fillRect(0, horizon - VH * 0.09, VW, VH * 0.15);

    /* road bed */
    var road = g.createLinearGradient(0, horizon, 0, VH);
    addStop(road, 0, paintColor(3, 2, 5, 1));
    addStop(road, 0.22, paintColor(9, 6, 12, 1));
    addStop(road, 1, paintColor(16, 10, 20, 1));
    g.fillStyle = road;
    g.beginPath();
    g.moveTo(VW * 0.5 - VW * 0.055, horizon);
    g.lineTo(VW * 0.5 + VW * 0.055, horizon);
    g.lineTo(VW * 1.45, VH);
    g.lineTo(-VW * 0.45, VH);
    g.closePath();
    g.fill();

    /* wet asphalt sheen running toward camera */
    var sheen = g.createLinearGradient(0, horizon, 0, VH);
    addStop(sheen, 0, inkBlood(0.05));
    addStop(sheen, 0.55, inkBlood(0.16));
    addStop(sheen, 1, inkViolet(0.1));
    g.fillStyle = sheen;
    g.beginPath();
    g.moveTo(VW * 0.5 - VW * 0.02, horizon);
    g.lineTo(VW * 0.5 + VW * 0.02, horizon);
    g.lineTo(VW * 0.72, VH);
    g.lineTo(VW * 0.2, VH);
    g.closePath();
    g.fill();

    /* guard rails + reflector posts, perspective spaced */
    var railSteps = 17;
    for (var side = -1; side <= 1; side += 2) {
      var prevX = 0, prevY = 0;
      for (var i = 0; i <= railSteps; i++) {
        var u = i / railSteps;
        var y = horizon + (VH - horizon) * Math.pow(u, 1.85);
        var spread = VW * 0.055 + Math.pow(u, 1.7) * VW * 0.92;
        var x = VW * 0.5 + side * spread;
        if (i > 0) {
          g.strokeStyle = inkHot(0.12 + u * 0.5);
          g.lineWidth = 1 + u * 3.2;
          g.beginPath();
          g.moveTo(prevX, prevY);
          g.lineTo(x, y);
          g.stroke();
        }
        if (i % 2 === 0 && i > 0) {
          var postH = 4 + u * VH * 0.1;
          g.fillStyle = inkHot(0.22 + u * 0.4);
          g.fillRect(x - (1 + u * 1.6), y - postH, 2 + u * 3.2, postH);
          g.fillStyle = inkHot(0.85);
          g.fillRect(x - (1 + u * 1.6), y - postH, 2 + u * 3.2, 2 + u * 3);
        }
        prevX = x;
        prevY = y;
      }
    }

    /* street lamps on the left, blown to white */
    for (var lamp = 0; lamp < 4; lamp++) {
      var lu = 0.16 + lamp * 0.24;
      var ly = horizon + (VH - horizon) * Math.pow(lu, 1.85);
      var lspread = VW * 0.055 + Math.pow(lu, 1.7) * VW * 0.92;
      var lx = VW * 0.5 - lspread * 1.02;
      var poleH = VH * (0.1 + lu * 0.3);
      g.strokeStyle = inkHot(0.28);
      g.lineWidth = 1 + lu * 2.6;
      g.beginPath();
      g.moveTo(lx, ly);
      g.lineTo(lx - lu * VW * 0.02, ly - poleH);
      g.stroke();
      var headX = lx - lu * VW * 0.02;
      var headY = ly - poleH;
      var lampGlow = makeGlow(26 + lu * 90, inkHot(0.55 + lu * 0.4));
      g.drawImage(lampGlow, headX - lampGlow.width / 2, headY - lampGlow.height / 2);
      g.fillStyle = inkHot(0.9);
      g.fillRect(headX - 4 - lu * 6, headY - 2, 8 + lu * 12, 3 + lu * 3);
    }

    /* foreground vignette burned into the plate */
    var vig = g.createRadialGradient(VW * 0.5, VH * 0.56, Math.min(VW, VH) * 0.18, VW * 0.5, VH * 0.56, Math.max(VW, VH) * 0.78);
    addStop(vig, 0, paintColor(0, 0, 0, 0));
    addStop(vig, 1, paintColor(0, 0, 0, 0.86));
    g.fillStyle = vig;
    g.fillRect(0, 0, VW, VH);

    return canvas;
  }

  /* ---------------------------------------------------------------
     the car: a wide-body JDM coupe silhouette, pure threshold white
     --------------------------------------------------------------- */
  function bodyOutline() {
    return [
      [0.012, 0.120], [0.000, 0.298], [0.020, 0.396], [0.076, 0.452],
      [0.152, 0.470], [0.238, 0.500], [0.300, 0.522], [0.352, 0.548],
      [0.420, 0.690], [0.520, 0.762], [0.648, 0.776], [0.724, 0.738],
      [0.782, 0.628], [0.836, 0.586], [0.884, 0.616], [0.932, 0.578],
      [0.968, 0.558], [0.988, 0.498], [0.999, 0.428], [0.994, 0.300],
      [0.986, 0.150], [0.932, 0.074], [0.760, 0.068], [0.600, 0.066],
      [0.430, 0.066], [0.262, 0.070], [0.120, 0.076], [0.030, 0.092]
    ];
  }

  function tracePoly(g, pts, ox, oy, w, h) {
    g.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var px = ox + pts[i][0] * w;
      var py = oy + (1 - pts[i][1]) * h;
      if (i === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
    }
    g.closePath();
  }

  function buildCar() {
    var boxW = Math.min(VW * 0.5, VH * 0.95);
    if (VW < 720) boxW = VW * 0.96;
    var boxH = boxW * 0.46;
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(boxW * DPR);
    canvas.height = Math.round(boxH * DPR);
    var g = canvas.getContext("2d");
    if (!g) return null;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    var pad = boxH * 0.1;
    var ox = pad;
    var oy = pad * 0.5;
    var w = boxW - pad * 2;
    var h = boxH - pad * 1.5;

    /* body */
    g.fillStyle = inkHot(1);
    tracePoly(g, bodyOutline(), ox, oy, w, h);
    g.fill();

    /* greenhouse: black glass cut into the white shell */
    g.fillStyle = paintColor(2, 1, 3, 1);
    tracePoly(g, [
      [0.372, 0.556], [0.446, 0.678], [0.536, 0.742], [0.700, 0.742],
      [0.742, 0.690], [0.688, 0.610], [0.640, 0.560], [0.470, 0.545]
    ], ox, oy, w, h);
    g.fill();
    g.fillStyle = inkHot(1);
    g.fillRect(ox + w * 0.588, oy + h * (1 - 0.742), w * 0.016, h * 0.196);

    /* hood / roof shut lines, door seam, skirt */
    g.strokeStyle = paintColor(2, 1, 3, 0.92);
    g.lineWidth = Math.max(1, w * 0.0035);
    g.beginPath();
    g.moveTo(ox + w * 0.318, oy + h * (1 - 0.545));
    g.lineTo(ox + w * 0.318, oy + h * (1 - 0.300));
    g.stroke();
    g.beginPath();
    g.moveTo(ox + w * 0.336, oy + h * (1 - 0.300));
    g.lineTo(ox + w * 0.906, oy + h * (1 - 0.300));
    g.stroke();

    /* wheel arches, tyres, five-spoke rims */
    var wheels = [
      { cx: 0.243, cy: 0.148, r: 0.148, dish: 0.108 },
      { cx: 0.812, cy: 0.148, r: 0.156, dish: 0.112 }
    ];
    for (var wi = 0; wi < wheels.length; wi++) {
      var wh = wheels[wi];
      var cx = ox + wh.cx * w;
      var cy = oy + (1 - wh.cy) * h;
      var rr = wh.r * w;
      g.fillStyle = paintColor(2, 1, 3, 1);
      g.beginPath();
      g.arc(cx, cy, rr * 1.16, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = inkHot(1);
      g.beginPath();
      g.arc(cx, cy, rr, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = paintColor(3, 2, 4, 1);
      g.beginPath();
      g.arc(cx, cy, rr * 0.93, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = inkHot(0.95);
      g.beginPath();
      g.arc(cx, cy, wh.dish * w, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = paintColor(4, 2, 5, 1);
      g.beginPath();
      g.arc(cx, cy, wh.dish * w * 0.34, 0, Math.PI * 2);
      g.fill();
      for (var spoke = 0; spoke < 5; spoke++) {
        var ang = (spoke / 5) * Math.PI * 2 + 0.4;
        g.strokeStyle = paintColor(4, 2, 5, 0.95);
        g.lineWidth = Math.max(1, rr * 0.14);
        g.beginPath();
        g.moveTo(cx + Math.cos(ang) * wh.dish * w * 0.34, cy + Math.sin(ang) * wh.dish * w * 0.34);
        g.lineTo(cx + Math.cos(ang) * wh.dish * w, cy + Math.sin(ang) * wh.dish * w);
        g.stroke();
      }
    }

    /* rear wing on two stanchions */
    g.fillStyle = inkHot(0.98);
    g.fillRect(ox + w * 0.845, oy + h * (1 - 0.652), w * 0.132, h * 0.03);
    g.fillRect(ox + w * 0.872, oy + h * (1 - 0.64), w * 0.014, h * 0.075);
    g.fillRect(ox + w * 0.938, oy + h * (1 - 0.64), w * 0.014, h * 0.075);

    /* pop-up headlight pod + tail lamp bar */
    g.fillStyle = inkHot(1);
    g.fillRect(ox + w * 0.042, oy + h * (1 - 0.452), w * 0.072, h * 0.018);
    g.fillStyle = inkBlood(1);
    g.fillRect(ox + w * 0.955, oy + h * (1 - 0.400), w * 0.038, h * 0.05);
    g.fillStyle = inkHot(0.9);
    g.fillRect(ox + w * 0.962, oy + h * (1 - 0.352), w * 0.026, h * 0.009);

    /* number plate */
    g.fillStyle = paintColor(2, 1, 3, 1);
    g.fillRect(ox + w * 0.792, oy + h * (1 - 0.235), w * 0.078, h * 0.06);
    g.strokeStyle = inkHot(0.75);
    g.lineWidth = Math.max(1, w * 0.0022);
    g.strokeRect(ox + w * 0.792, oy + h * (1 - 0.235), w * 0.078, h * 0.06);

    /* floor smear + underglow bloom */
    var floor = g.createLinearGradient(0, oy + h * 0.9, 0, oy + h * 1.25);
    addStop(floor, 0, inkHot(0.16));
    addStop(floor, 1, paintColor(255, 255, 255, 0));
    g.fillStyle = floor;
    g.fillRect(ox - w * 0.02, oy + h * 0.9, w * 1.02, h * 0.35);

    return { canvas: canvas, boxW: boxW, boxH: boxH };
  }

  function tintCopy(source, cssColor) {
    var canvas = document.createElement("canvas");
    canvas.width = source.width;
    canvas.height = source.height;
    var g = canvas.getContext("2d");
    if (!g) return canvas;
    g.drawImage(source, 0, 0);
    g.globalCompositeOperation = "source-in";
    g.fillStyle = cssColor;
    g.fillRect(0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function buildScene() {
    if (VW < 4 || VH < 4) return;
    try {
      SCENE.bg = buildBackground();
      SCENE.noise = buildNoise();
      SCENE.noisePattern = null;
      var car = buildCar();
      if (car) {
        SCENE.carWhite = car.canvas;
        SCENE.carBlood = tintCopy(car.canvas, inkBlood(1));
        SCENE.carViolet = tintCopy(car.canvas, inkViolet(1));
        SCENE.box = { w: car.boxW, h: car.boxH };
      }
    } catch (err) {
      console.error("scene build failed", err);
    }
  }

  function drawBackgroundPlate(glitch, drift) {
    if (!SCENE.bg) {
      ctx.fillStyle = paintColor(5, 3, 6, 1);
      ctx.fillRect(0, 0, VW, VH);
      return;
    }
    if (glitch < 0.02) {
      ctx.drawImage(SCENE.bg, 0, 0, VW, VH);
      return;
    }
    var bands = 14;
    var bandH = VH / bands;
    for (var i = 0; i < bands; i++) {
      var shift = Math.sin(i * 2.7 + drift * 3.1) * glitch * VW * 0.022;
      ctx.drawImage(
        SCENE.bg,
        0, i * bandH * DPR, VW * DPR, bandH * DPR,
        shift, i * bandH, VW, bandH + 0.6
      );
    }
  }

  function drawHeadBeam(bx, by, bw, bh) {
    var noseX = bx + bw * 0.055;
    var noseY = by + bh * 0.52;
    var flicker = 0.86 + Math.sin(ST.clock * 6.1) * 0.05 + ST.level * 0.16;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var beam = ctx.createLinearGradient(noseX, 0, noseX - VW * 0.6, 0);
    addStop(beam, 0, inkHot(0.2 * flicker));
    addStop(beam, 0.4, inkHot(0.07 * flicker));
    addStop(beam, 1, paintColor(255, 255, 255, 0));
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(noseX, noseY - bh * 0.12);
    ctx.lineTo(noseX - VW * 0.62, noseY + VH * 0.3);
    ctx.lineTo(noseX - VW * 0.62, noseY - VH * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawCar(drift, glitch) {
    if (!SCENE.carWhite || !SCENE.box) return;
    var bw = SCENE.box.w;
    var bh = SCENE.box.h;
    var bx, by;
    if (VW < 720) {
      bx = (VW - bw) * 0.55;
      by = VH - bh * 0.9;
    } else {
      bx = VW * 0.52;
      by = VH - bh * 0.94;
    }
    bx += Math.sin(drift * 1.7) * VW * 0.014;
    by += Math.cos(drift * 1.3) * VH * 0.006;
    SCENE.carTopY = by + bh * 0.1;
    var split = 2 + glitch * 7;

    drawHeadBeam(bx, by, bw, bh);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.5 + glitch * 0.35;
    ctx.drawImage(SCENE.carBlood, bx + split, by - split * 0.4, bw, bh);
    ctx.globalAlpha = 0.42 + glitch * 0.3;
    ctx.drawImage(SCENE.carViolet, bx - split, by + split * 0.4, bw, bh);
    ctx.restore();

    ctx.globalAlpha = 0.97;
    ctx.drawImage(SCENE.carWhite, bx, by, bw, bh);
    ctx.globalAlpha = 1;
  }

  function drawRoadMotion(time, drift, level) {
    var horizon = VH * 0.585;
    var span = VH - horizon;
    for (var i = 0; i < 13; i++) {
      var phase = ((i / 13) + drift * 0.55 + time * 0.09) % 1;
      var near = Math.pow(phase, 2.1);
      var y = horizon + span * near;
      var spread = VW * 0.055 + Math.pow(near, 1.7) * VW * 0.92;
      var dashW = 2 + near * VW * 0.028;
      var dashH = 3 + near * VH * 0.05;
      var alpha = 0.1 + near * 0.62 + level * 0.12;
      ctx.fillStyle = inkHot(alpha);
      ctx.fillRect(VW * 0.5 - dashW / 2, y, dashW, dashH);
    }
    /* speed streaks skimming past the rails */
    for (var s = 0; s < 10; s++) {
      var sp = ((s / 10) + drift * 0.9 + time * 0.16) % 1;
      var sy = horizon + span * Math.pow(sp, 1.7);
      var sw = VW * (0.02 + sp * 0.16);
      var sAlpha = 0.05 + sp * 0.14;
      var side = s % 2 === 0 ? -1 : 1;
      ctx.fillStyle = side > 0 ? inkBlood(sAlpha) : inkHot(sAlpha * 0.8);
      ctx.fillRect(VW * 0.5 + side * (VW * 0.08 + sp * VW * 0.55), sy, sw, 1 + sp * 2.4);
    }
  }

  /* ---------------------------------------------------------------
     lyric plate: rasterised once per lyric character, then blitted
     --------------------------------------------------------------- */
  var LYRIC = { canvas: null, g: null, stamp: "", alpha: 1, rows: [] };

  function ensureLyricCanvas() {
    if (!LYRIC.canvas) {
      LYRIC.canvas = document.createElement("canvas");
      LYRIC.g = LYRIC.canvas.getContext("2d");
    }
    var w = Math.round(VW * DPR);
    var h = Math.round(VH * DPR);
    if (LYRIC.canvas.width !== w || LYRIC.canvas.height !== h) {
      LYRIC.canvas.width = w;
      LYRIC.canvas.height = h;
      LYRIC.stamp = "";
    }
    if (LYRIC.g) LYRIC.g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return LYRIC.g;
  }

  function lyricFont(size) {
    return '800 ' + size.toFixed(1) + "px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif";
  }

  function lyricFrame() {
    var portrait = VW < 720;
    var baseY = portrait ? VH * 0.5 : VH * 0.615;
    if (!portrait && SCENE.carTopY > 0) {
      baseY = Math.min(baseY, SCENE.carTopY - VH * 0.1);
    }
    if (baseY < VH * 0.3) baseY = VH * 0.3;
    return {
      portrait: portrait,
      maxW: VW * (portrait ? 0.86 : 0.56),
      x0: portrait ? VW * 0.07 : VW * 0.062,
      baseY: baseY,
      center: portrait,
      baseSize: clampN(VH * 0.108, 20, 94),
      maxRows: portrait ? 4 : 3
    };
  }

  function wrapText(g, text, maxW) {
    var rows = [];
    var row = [];
    var rowW = 0;
    var limit = Math.min(text.length, 140);
    for (var i = 0; i < limit; i++) {
      var ch = text.charAt(i);
      var cw = g.measureText(ch).width;
      if (rowW + cw > maxW && row.length > 0) {
        rows.push({ chars: row, w: rowW });
        row = [];
        rowW = 0;
        if (ch === " ") continue;
      }
      row.push({ c: ch, dx: rowW, w: cw });
      rowW += cw;
      if (rows.length >= 12) break;
    }
    if (row.length > 0) rows.push({ chars: row, w: rowW });
    return rows;
  }

  function layoutLine(g, text, frame) {
    var steps = [1, 0.93, 0.86, 0.79, 0.72, 0.65, 0.58, 0.51, 0.45, 0.4, 0.34];
    var result = null;
    var lastStep = steps.length - 1;
    for (var s = 0; s < steps.length; s++) {
      var size = Math.max(13, frame.baseSize * steps[s]);
      g.font = lyricFont(size);
      var rows = wrapText(g, text, frame.maxW);
      var lh = size * 1.3;
      var blockH = rows.length * lh;
      result = { size: size, rows: rows, lh: lh, blockH: blockH };
      if (rows.length <= frame.maxRows && blockH <= VH * 0.52) break;
      if (s === lastStep && blockH <= VH * 0.66) break;
    }
    var maxRows = Math.max(1, Math.floor((VH * 0.68) / (result.lh || 1)));
    if (result.rows.length > maxRows) {
      result.rows = result.rows.slice(0, maxRows);
      result.blockH = result.rows.length * result.lh;
    }
    return result;
  }

  function charLitCount(line, time) {
    var text = line.text || "";
    var chars = line.chars;
    if (Array.isArray(chars) && chars.length > 0) {
      var lit = 0;
      var n = Math.min(chars.length, text.length);
      for (var i = 0; i < n; i++) {
        var ct = num(chars[i] ? chars[i].t : null, NaN);
        if (isFinite(ct) && time >= ct - 0.02) lit = i + 1;
      }
      if (n !== text.length && n > 0) {
        return clampN(Math.round((lit * text.length) / n), 0, text.length);
      }
      return lit;
    }
    if (!text.length) return 0;
    var dur = line.dur > 0 ? line.dur : 3.4;
    var progress = clampN((time - line.t) / dur, 0, 1);
    if (time < line.t) return 0;
    return clampN(Math.floor(text.length * progress) + 1, 0, text.length);
  }

  function paintRowChars(g, row, x0, baseline, size, litUntil, rowStartIndex) {
    var chroma = Math.max(1.5, size * 0.035);
    g.textBaseline = "alphabetic";
    for (var i = 0; i < row.chars.length; i++) {
      var ch = row.chars[i];
      var px = x0 + ch.dx;
      var index = rowStartIndex + i;
      if (index < litUntil) {
        g.fillStyle = inkBlood(0.85);
        g.fillText(ch.c, px + chroma, baseline + chroma * 0.35);
        g.fillStyle = inkViolet(0.7);
        g.fillText(ch.c, px - chroma, baseline - chroma * 0.25);
        g.fillStyle = paintColor(250, 244, 232, 1);
        g.fillText(ch.c, px, baseline);
      } else {
        g.fillStyle = paintColor(198, 188, 206, 0.42);
        g.fillText(ch.c, px, baseline);
      }
    }
  }

  function paintLyric() {
    var g = ensureLyricCanvas();
    if (!g) return;
    g.clearRect(0, 0, VW, VH);
    var frame = lyricFrame();
    var line = ST.lines[ST.idx];
    if (!line) return;
    var layout = layoutLine(g, line.text || "", frame);
    if (!layout || layout.rows.length === 0) return;
    LYRIC.rows = layout.rows;

    var prev = ST.idx > 0 ? ST.lines[ST.idx - 1] : null;
    var next = ST.idx + 1 < ST.lines.length ? ST.lines[ST.idx + 1] : null;

    var topY = frame.baseY - layout.blockH;

    /* soft scrim so the type always sits on black, never on the car or the moon */
    var scrim = g.createLinearGradient(frame.x0 - VW * 0.08, 0, frame.x0 + frame.maxW + VW * 0.12, 0);
    addStop(scrim, 0, paintColor(0, 0, 0, 0.46));
    addStop(scrim, 0.62, paintColor(0, 0, 0, 0.34));
    addStop(scrim, 1, paintColor(0, 0, 0, 0));
    g.fillStyle = scrim;
    g.fillRect(frame.x0 - VW * 0.1, topY - layout.lh * 0.9, frame.maxW + VW * 0.24, layout.blockH + layout.lh * 2.1);

    g.font = lyricFont(layout.size);
    g.textAlign = "left";

    /* previous line, ghosted above the block */
    if (prev && prev.text) {
      var prevSize = Math.max(12, layout.size * 0.34);
      g.font = lyricFont(prevSize);
      g.fillStyle = paintColor(170, 158, 182, 0.36);
      var prevY = Math.max(VH * 0.1, frame.baseY - layout.blockH - layout.lh * 0.75);
      g.fillText((prev.text || "").slice(0, 46), frame.x0, prevY);
    }

    g.font = lyricFont(layout.size);
    var litCount = charLitCount(line, ST.t);
    var cursor = 0;

    for (var r = 0; r < layout.rows.length; r++) {
      var row = layout.rows[r];
      var baseline = topY + r * layout.lh + layout.lh * 0.78;
      var rowX = frame.center ? frame.x0 + (frame.maxW - row.w) * 0.5 : frame.x0;
      g.fillStyle = paintColor(198, 188, 206, 0.42);
      paintRowChars(g, row, rowX, baseline, layout.size, litCount, cursor);
      cursor += row.chars.length;
    }

    /* continuation hint at the top of the block: a thin accent tick */
    g.fillStyle = inkBlood(0.75);
    g.fillRect(frame.x0, topY - layout.lh * 0.42, Math.max(18, layout.size * 1.5), Math.max(2, layout.size * 0.05));

    /* running line counter, surveillance-subtitle style */
    g.font = "500 " + Math.max(9, layout.size * 0.21).toFixed(1) + "px 'Courier New',ui-monospace,monospace";
    g.fillStyle = inkHot(0.4);
    g.fillText(pad2(ST.idx + 1) + " / " + pad2(ST.lines.length), frame.x0 + Math.max(18, layout.size * 1.5) + layout.size * 0.28, topY - layout.lh * 0.34);

    /* next line, smaller, printed under the block */
    if (next && next.text) {
      var nextSize = Math.max(12, layout.size * 0.34);
      g.font = lyricFont(nextSize);
      g.fillStyle = paintColor(170, 158, 182, 0.3);
      g.fillText((next.text || "").slice(0, 46), frame.x0, frame.baseY + layout.lh * 0.95);
    }
  }

  function lyricStampKey(line, litCount) {
    return ST.idx + "|" + litCount + "|" + Math.round(VW) + "|" + Math.round(VH) + "|" + (line ? (line.text || "").length : 0);
  }

  function drawLyricPlate() {
    var line = ST.lines[ST.idx];
    if (!line) {
      LYRIC.stamp = "";
      return;
    }
    var lit = charLitCount(line, ST.t);
    var key = lyricStampKey(line, lit);
    if (key !== LYRIC.stamp) {
      LYRIC.stamp = key;
      try {
        paintLyric();
      } catch (err) {
        console.error("paintLyric failed", err);
      }
    }
    if (!LYRIC.canvas) return;
    if (LYRIC.lineRef !== line) {
      LYRIC.lineRef = line;
      LYRIC.alpha = 0;
    }
    var age = ST.t - line.t;
    var fade = RM ? 1 : clampN(age / 0.26, 0, 1);
    LYRIC.alpha += (fade - LYRIC.alpha) * 0.35;

    ctx.globalAlpha = LYRIC.alpha;
    ctx.drawImage(LYRIC.canvas, 0, 0, VW, VH);

    /* tracking-error slices over the type */
    if (!RM && ST.glitch > 0.34) {
      var slices = 3;
      var amount = ST.glitch * VW * 0.02;
      for (var s = 0; s < slices; s++) {
        var sy = VH * (0.34 + s * 0.11) + Math.sin(ST.clock * 4.3 + s) * VH * 0.03;
        var sh = VH * 0.035;
        var dx = Math.sin(ST.clock * 9.1 + s * 2.3) * amount;
        ctx.drawImage(
          LYRIC.canvas,
          0, sy * DPR, VW * DPR, sh * DPR,
          dx, sy, VW, sh
        );
      }
    }
    ctx.globalAlpha = 1;
  }

  function buildNoise() {
    var tile = document.createElement("canvas");
    tile.width = 220;
    tile.height = 220;
    var g = tile.getContext("2d");
    if (!g) return null;
    var rand = makeRand(99123);
    var img = g.createImageData(tile.width, tile.height);
    var data = img.data;
    for (var i = 0; i < data.length; i += 4) {
      var v = 40 + rand() * 215;
      data[i] = v;
      data[i + 1] = v * 0.94;
      data[i + 2] = v * 1.02;
      data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return tile;
  }

  function drawGrain() {
    if (!SCENE.noise) return;
    if (!SCENE.noisePattern) {
      try {
        SCENE.noisePattern = ctx.createPattern(SCENE.noise, "repeat");
      } catch (err) {
        console.error("noise pattern failed", err);
        return;
      }
    }
    if (!SCENE.noisePattern) return;
    var ox = Math.floor((ST.clock * 91) % 220);
    var oy = Math.floor((ST.clock * 173) % 220);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.055 + ST.treble * 0.045 + ST.glitch * 0.05;
    ctx.translate(-ox, -oy);
    ctx.fillStyle = SCENE.noisePattern;
    ctx.fillRect(0, 0, VW + 220, VH + 220);
    ctx.restore();
  }

  function drawTrackingBand() {
    var phase = (ST.clock * 0.16) % 1;
    var y = phase * VH * 1.25 - VH * 0.12;
    var bandH = Math.max(14, VH * 0.05);
    var grad = ctx.createLinearGradient(0, y, 0, y + bandH);
    addStop(grad, 0, paintColor(255, 255, 255, 0));
    addStop(grad, 0.35, inkHot(0.05 + ST.glitch * 0.07));
    addStop(grad, 0.62, inkBlood(0.05 + ST.glitch * 0.06));
    addStop(grad, 1, paintColor(255, 255, 255, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, VW, bandH);
    if (ST.glitch > 0.55 && !RM) {
      var dash = ctx.createLinearGradient(0, y - bandH * 0.2, 0, y + bandH * 1.2);
      addStop(dash, 0, paintColor(255, 255, 255, 0));
      addStop(dash, 0.5, inkHot(0.09));
      addStop(dash, 1, paintColor(255, 255, 255, 0));
      ctx.fillStyle = dash;
      ctx.fillRect(0, y + Math.sin(ST.clock * 15) * bandH, VW, bandH * 1.4);
    }
  }

  function draw() {
    ctx.fillStyle = paintColor(4, 2, 5, 1);
    ctx.fillRect(0, 0, VW, VH);
    var drift = ST.drift;
    var glitch = ST.glitch;
    drawBackgroundPlate(glitch, drift);
    drawRoadMotion(ST.clock, drift, ST.level);
    drawCar(drift, glitch);
    drawLyricPlate();
    drawTrackingBand();
    drawGrain();
  }

  function pad2(value) {
    var n = Math.floor(Math.abs(value));
    return (n < 10 ? "0" : "") + n;
  }

  function syncAccent(rebuild) {
    var key = Math.round(clampN(PAL.r, 0, 255)) + "," + Math.round(clampN(PAL.g, 0, 255)) + "," + Math.round(clampN(PAL.b, 0, 255));
    var bloodR = Math.round(clampN(PAL.r * 0.62 + 62, 58, 196));
    var bloodG = Math.round(clampN(PAL.g * 0.16 + 8, 6, 44));
    var bloodB = Math.round(clampN(PAL.b * 0.28 + 18, 12, 82));
    if (stageEl) {
      stageEl.style.setProperty("--accent", "rgb(" + bloodR + "," + bloodG + "," + bloodB + ")");
      stageEl.style.setProperty("--hot", "rgb(244,238,228)");
    }
    if (key !== ST.accentKey) {
      ST.accentKey = key;
      LYRIC.stamp = "";
      if (rebuild !== false) buildScene();
    }
  }

  function paintChrome(now) {
    if (now - ST.chromeAt < 110) return;
    ST.chromeAt = now;
    var t = Math.max(0, ST.t);
    var secs = Math.floor(t);
    var frameNo = Math.floor((t - secs) * 24);
    if (timecodeEl) {
      timecodeEl.textContent =
        pad2(Math.floor(secs / 3600)) + ":" + pad2(Math.floor(secs / 60) % 60) + ":" +
        pad2(secs % 60) + ":" + pad2(frameNo);
    }
    if (speedEl) {
      var spd = Math.round(clampN(ST.speed, 0, 999));
      speedEl.textContent = (spd < 100 ? "0" + (spd < 10 ? "0" : "") : "") + spd;
    }
    if (meterEl) {
      meterEl.style.width = Math.round(clampN(8 + ST.level * 88, 4, 100)) + "%";
    }
    if (latEl) {
      latEl.textContent = (35.6812 + ST.drift * 0.014).toFixed(3);
    }
    var hasLine = ST.lines.length > 0;
    if (standbyEl) standbyEl.classList.toggle("on", !ST.inited || (hasLine && ST.idx < 0));
    if (emptyEl) emptyEl.classList.toggle("on", ST.inited && !hasLine);
  }

  function frame() {
    var now = performance.now();
    var start = now;
    ST.frames++;
    ST.clock = now * 0.001;
    if (!sentReady) sendReady();
    try {
      var target = clampN(ST.bass * 0.75 + ST.level * 0.7 - 0.1, 0, 1);
      ST.drift += (target - ST.drift) * 0.07;
      ST.glitch = clampN(ST.beatFlash * 0.75 + ST.level * 0.18 + ST.treble * 0.1, 0, 1);
      ST.beatFlash *= 0.88;
      ST.speed += (86 + ST.bass * 70 + ST.level * 108 - ST.speed) * 0.07;
      var nextIdx = findIndex(ST.t);
      if (ST.idx !== nextIdx) {
        ST.idx = nextIdx;
        ST.text = ST.lines[ST.idx] ? ST.lines[ST.idx].text : "";
      }
      draw();
      paintChrome(now);
    } catch (err) {
      ST.err = String(err && err.message ? err.message : err);
      console.error("frame failed", err);
    }
    ST.js = Math.max(0, performance.now() - start);
    requestAnimationFrame(frame);
  }

  window.addEventListener("message", function (ev) {
    var msg = ev.data;
    if (!msg || msg.__c100 !== 1) return;
    try {
      if (msg.type === "init") {
        var p = msg.payload || {};
        var ac = Array.isArray(p.accent) ? p.accent : null;
        if (ac && ac.length >= 3) {
          PAL.r = Math.round(Math.min(255, Math.max(0, num(ac[0], PAL.r))));
          PAL.g = Math.round(Math.min(255, Math.max(0, num(ac[1], PAL.g))));
          PAL.b = Math.round(Math.min(255, Math.max(0, num(ac[2], PAL.b))));
        }
        applyLines(p.lines);
        ST.inited = true;
        if (emptyEl) emptyEl.classList.toggle("on", ST.lines.length === 0);
        syncAccent(true);
        ST.playing = p.playing === false ? false : true;
      } else if (msg.type === "tick") {
        var tp = msg.payload || {};
        ST.t = Math.max(0, num(tp.time, ST.t));
        if (typeof tp.playing === "boolean") ST.playing = tp.playing;
      } else if (msg.type === "beat") {
        var bp = msg.payload || {};
        ST.beatFlash = Math.max(ST.beatFlash, clampN(num(bp.level, 0.6), 0, 1));
      } else if (msg.type === "live") {
        var lp = msg.payload || {};
        ST.bpm = num(lp.bpm, ST.bpm);
        ST.level = clampN(num(lp.level, 0), 0, 1);
        ST.bass = clampN(num(lp.bass, 0), 0, 1);
        ST.mid = clampN(num(lp.mid, 0), 0, 1);
        ST.treble = clampN(num(lp.treble, 0), 0, 1);
        if (typeof lp.playing === "boolean") ST.playing = lp.playing;
      }
    } catch (err) {
      ST.err = String(err && err.message ? err.message : err);
      console.error("message failed", err);
    }
  });

  var resizeTimer = 0;

  function requestResize() {
    if (resizeTimer) return;
    resizeTimer = setTimeout(function () {
      resizeTimer = 0;
      try {
        resize();
      } catch (err) {
        console.error("resize failed", err);
      }
    }, 100);
  }

  window.addEventListener("resize", requestResize);
  window.addEventListener("orientationchange", requestResize);

  try {
    if (typeof ResizeObserver === "function") {
      var ro = new ResizeObserver(requestResize);
      ro.observe(cv);
    }
  } catch (err) {
    console.error("ResizeObserver unavailable", err);
  }

  resize();
  syncAccent(false);
  try {
    document.documentElement.classList.toggle("rm", RM);
  } catch (err) {
    console.error("rm class failed", err);
  }
  requestAnimationFrame(frame);
  setTimeout(sendReady, 900);
})();
</script>
</body>
</html>
