<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>晨光旅馆</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0c1015;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d');

var view = { w: 1440, h: 900, dpr: 1 };

var state = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
  text: '', reduced: false, beat: 0, level: 0, smoothT: 0, accent: [214, 178, 132]
};

window.__stage = function () {
  return {
    lines: state.lines.length,
    idx: state.idx,
    t: state.t,
    playing: state.playing,
    frames: state.frames,
    js: state.js,
    err: state.err,
    text: state.text,
    gl: false,
    rm: state.reduced
  };
};

var bg = document.createElement('canvas');
var bgx = bg.getContext('2d');
var motes = [];
var lastTickAt = 0;
var lastFrameAt = 0;
var frameInit = false;
var readySent = false;
var needRoom = false;

function nowMs() {
  return (window.performance && performance.now) ? performance.now() : Date.now();
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

try {
  state.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
} catch (e) { console.error('[434] matchMedia failed', e); }

function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error('[434] ready postMessage failed', e); }
}

/* ---------- room ---------- */
var rngS = 20260911;
function rnd() {
  rngS = (rngS * 1103515245 + 12345) & 0x7fffffff;
  return rngS / 0x7fffffff;
}

function poly(g, pts) {
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  g.closePath();
}

/* the album colour is only allowed to warm the light, never to tint the room flat */
function warmC() {
  var a = state.accent;
  var base = [222, 180, 126];
  var k = 0.42, o = [0, 0, 0], i;
  for (i = 0; i < 3; i++) o[i] = Math.round(base[i] * (1 - k) + a[i] * k);
  return 'rgba(' + o[0] + ',' + o[1] + ',' + o[2] + ',';
}

function buildRoom() {
  rngS = 20260911;
  var w = view.w, h = view.h, dpr = view.dpr;
  var wc = warmC();
  bg.width = Math.max(1, Math.round(w * dpr));
  bg.height = Math.max(1, Math.round(h * dpr));
  bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bgx.clearRect(0, 0, w, h);

  var floorY = h * 0.635;
  var wx = w * 0.515, wy = h * 0.105, ww = w * 0.395, wh = h * 0.495;
  var reach = w * 0.315, skew = h * 0.075;
  var g;

  /* wall */
  g = bgx.createLinearGradient(0, 0, w * 0.62, floorY);
  g.addColorStop(0, '#101620');
  g.addColorStop(0.45, '#222a34');
  g.addColorStop(1, '#2d343d');
  bgx.fillStyle = g;
  bgx.fillRect(0, 0, w, floorY + 1);

  /* faint wall seams */
  bgx.strokeStyle = 'rgba(255,236,208,0.020)';
  bgx.lineWidth = 1;
  var i;
  for (i = 1; i < 4; i++) {
    bgx.beginPath();
    bgx.moveTo(w * 0.02, floorY * (i / 4));
    bgx.lineTo(w * 0.98, floorY * (i / 4) - h * 0.004);
    bgx.stroke();
  }

  /* floor */
  g = bgx.createLinearGradient(0, floorY, 0, h);
  g.addColorStop(0, '#2a303a');
  g.addColorStop(0.45, '#1b2028');
  g.addColorStop(1, '#080b0f');
  bgx.fillStyle = g;
  bgx.fillRect(0, floorY, w, h - floorY);

  /* parquet */
  bgx.save();
  bgx.beginPath();
  bgx.rect(0, floorY, w, h - floorY);
  bgx.clip();
  var rows = 9, r;
  for (r = 0; r < rows; r++) {
    var y0 = floorY + (h - floorY) * Math.pow(r / rows, 1.35);
    var y1 = floorY + (h - floorY) * Math.pow((r + 1) / rows, 1.35);
    bgx.strokeStyle = (r % 2) ? 'rgba(255,240,214,0.026)' : 'rgba(255,240,214,0.014)';
    bgx.lineWidth = 1;
    bgx.beginPath();
    bgx.moveTo(0, y1);
    bgx.lineTo(w, y1);
    bgx.stroke();
    var seam = 3 + (r % 3);
    var j;
    for (j = 0; j < seam; j++) {
      var px = w * ((j + 0.45 + 0.2 * (r % 2)) / seam);
      bgx.strokeStyle = 'rgba(255,240,214,0.020)';
      bgx.beginPath();
      bgx.moveTo(px, y0 + (y0 - floorY) * 0.02 + (h - floorY) * 0.004);
      bgx.lineTo(px, y1);
      bgx.stroke();
    }
  }
  bgx.restore();

  bgx.fillStyle = 'rgba(150,166,184,0.10)';
  bgx.fillRect(0, floorY - h * 0.005, w, h * 0.005);

  /* ------- light patch on the wall (projected slats) ------- */
  var lit = [{ x: wx, y: wy }, { x: wx - reach, y: wy + skew },
             { x: wx - reach, y: wy + wh + skew * 1.7 }, { x: wx, y: wy + wh }];

  bgx.save();
  poly(bgx, lit);
  bgx.clip();
  g = bgx.createLinearGradient(wx, wy, wx - reach, wy + wh);
  g.addColorStop(0, wc + '0.34)');
  g.addColorStop(0.45, wc + '0.20)');
  g.addColorStop(1, wc + '0.07)');
  bgx.fillStyle = g;
  bgx.fillRect(0, 0, w, h);

  /* slat shadows inside the patch */
  var n = 13, s;
  for (s = 0; s < n; s++) {
    var a = s / n;
    var b = a + 0.42 / n;
    var p0 = { x: wx, y: wy + wh * a };
    var p1 = { x: wx - reach, y: wy + skew + wh * a };
    var p2 = { x: wx - reach, y: wy + skew + wh * b };
    var p3 = { x: wx, y: wy + wh * b };
    poly(bgx, [p0, p1, p2, p3]);
    bgx.fillStyle = 'rgba(10,14,19,0.42)';
    bgx.fill();
  }
  /* soft falloff at the far edge */
  g = bgx.createLinearGradient(wx, 0, wx - reach, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(8,11,15,0.72)');
  bgx.fillStyle = g;
  bgx.fillRect(wx - reach, 0, reach, h);
  bgx.restore();

  /* ------- window ------- */
  /* outer frame */
  bgx.fillStyle = '#0c1116';
  bgx.fillRect(wx - w * 0.012, wy - h * 0.014, ww + w * 0.024, wh + h * 0.028);

  /* glass: cold dawn outside */
  g = bgx.createLinearGradient(wx, wy, wx, wy + wh);
  g.addColorStop(0, '#39616f');
  g.addColorStop(0.42, '#2e5463');
  g.addColorStop(0.78, '#233d4a');
  g.addColorStop(1, '#16232c');
  bgx.fillStyle = g;
  bgx.fillRect(wx, wy, ww, wh);

  /* far buildings */
  bgx.save();
  bgx.beginPath();
  bgx.rect(wx, wy, ww, wh);
  bgx.clip();
  var bx;
  for (bx = 0; bx < 5; bx++) {
    var bw2 = ww * (0.10 + rnd() * 0.16);
    var bh2 = wh * (0.20 + rnd() * 0.26);
    var ex = wx + ww * (0.02 + rnd() * 0.92);
    bgx.fillStyle = 'rgba(14,26,34,' + (0.34 + rnd() * 0.30).toFixed(3) + ')';
    bgx.fillRect(ex, wy + wh - bh2, bw2, bh2);
  }
  /* horizon haze */
  g = bgx.createLinearGradient(0, wy + wh * 0.55, 0, wy + wh);
  g.addColorStop(0, 'rgba(122,158,168,0)');
  g.addColorStop(1, 'rgba(150,176,180,0.16)');
  bgx.fillStyle = g;
  bgx.fillRect(wx, wy, ww, wh);
  bgx.restore();

  /* glazing bars */
  bgx.fillStyle = '#0e141a';
  bgx.fillRect(wx + ww * 0.5 - w * 0.0035, wy, w * 0.007, wh);
  bgx.fillRect(wx, wy + wh * 0.47, ww, h * 0.009);

  /* venetian blinds */
  var slats = 17, k;
  for (k = 0; k < slats; k++) {
    var sy = wy + (wh * (k + 0.5) / slats);
    var sh = wh / slats * 0.46;
    bgx.fillStyle = 'rgba(11,16,21,0.80)';
    bgx.fillRect(wx - w * 0.004, sy - sh * 0.5, ww + w * 0.008, sh);
    bgx.fillStyle = 'rgba(196,206,208,0.055)';
    bgx.fillRect(wx - w * 0.004, sy + sh * 0.5, ww + w * 0.008, 1);
  }

  /* slats let a few threads of dawn through */
  bgx.save();
  bgx.beginPath();
  bgx.rect(wx, wy, ww, wh);
  bgx.clip();
  for (k = 0; k < slats; k += 3) {
    var gy = wy + (wh * (k + 0.5) / slats);
    var gh = wh / slats * 0.16;
    g = bgx.createLinearGradient(wx, gy, wx, gy + gh);
    g.addColorStop(0, 'rgba(226,232,226,0.30)');
    g.addColorStop(1, 'rgba(226,232,226,0.02)');
    bgx.fillStyle = g;
    bgx.fillRect(wx, gy + wh / slats * 0.28, ww, gh);
  }
  bgx.restore();

  /* window reveal (right side wall thickness) */
  g = bgx.createLinearGradient(wx + ww, 0, wx + ww + w * 0.026, 0);
  g.addColorStop(0, 'rgba(108,122,136,0.22)');
  g.addColorStop(1, 'rgba(20,26,33,0.9)');
  bgx.fillStyle = g;
  bgx.fillRect(wx + ww, wy - h * 0.014, w * 0.026, wh + h * 0.028);

  /* sill */
  bgx.fillStyle = '#3b434c';
  bgx.fillRect(wx - w * 0.030, wy + wh + h * 0.014, ww + w * 0.055, h * 0.016);
  bgx.fillStyle = 'rgba(228,214,186,0.20)';
  bgx.fillRect(wx - w * 0.030, wy + wh + h * 0.014, ww + w * 0.055, h * 0.004);

  /* ------- light on the floor ------- */
  var fl = [{ x: wx + ww * 0.03, y: floorY },
            { x: wx + ww * 0.55, y: floorY },
            { x: wx + ww * 0.02, y: h },
            { x: wx - reach * 0.55, y: h }];
  bgx.save();
  poly(bgx, fl);
  bgx.clip();
  g = bgx.createLinearGradient(0, floorY, 0, h);
  g.addColorStop(0, wc + '0.30)');
  g.addColorStop(1, wc + '0.05)');
  bgx.fillStyle = g;
  bgx.fillRect(0, floorY, w, h - floorY);
  for (k = 0; k < 11; k++) {
    var fa = k / 11;
    poly(bgx, [
      { x: wx - reach * 0.55 + ww * 0.57 * fa, y: h },
      { x: wx - reach * 0.55 + ww * 0.57 * fa + ww * 0.05, y: h },
      { x: wx + ww * 0.03 + ww * 0.52 * fa + ww * 0.05, y: floorY },
      { x: wx + ww * 0.03 + ww * 0.52 * fa, y: floorY }
    ]);
    bgx.fillStyle = 'rgba(9,13,18,0.30)';
    bgx.fill();
  }
  bgx.restore();

  /* ------- chair against the window light ------- */
  var cx = w * 0.30, cy = floorY + h * 0.055;
  var cs = Math.min(w * 0.115, h * 0.16);
  /* cast shadow */
  bgx.save();
  bgx.translate(cx + cs * 0.9, cy + cs * 0.55);
  bgx.transform(1, 0, -0.55, 0.34, 0, 0);
  bgx.fillStyle = 'rgba(5,8,11,0.5)';
  bgx.beginPath();
  bgx.ellipse(0, 0, cs * 0.62, cs * 0.42, 0, 0, 6.2832);
  bgx.fill();
  bgx.restore();

  /* legs */
  bgx.strokeStyle = '#2a2c30';
  bgx.lineWidth = Math.max(2, cs * 0.045);
  bgx.lineCap = 'round';
  bgx.beginPath();
  bgx.moveTo(cx - cs * 0.38, cy - cs * 0.30); bgx.lineTo(cx - cs * 0.44, cy + cs * 0.62);
  bgx.moveTo(cx + cs * 0.38, cy - cs * 0.30); bgx.lineTo(cx + cs * 0.46, cy + cs * 0.62);
  bgx.moveTo(cx - cs * 0.30, cy - cs * 0.05); bgx.lineTo(cx - cs * 0.34, cy + cs * 0.58);
  bgx.moveTo(cx + cs * 0.30, cy - cs * 0.05); bgx.lineTo(cx + cs * 0.36, cy + cs * 0.58);
  bgx.stroke();

  /* seat */
  poly(bgx, [
    { x: cx - cs * 0.56, y: cy - cs * 0.30 },
    { x: cx + cs * 0.56, y: cy - cs * 0.34 },
    { x: cx + cs * 0.48, y: cy - cs * 0.12 },
    { x: cx - cs * 0.48, y: cy - cs * 0.08 }
  ]);
  g = bgx.createLinearGradient(cx - cs * 0.6, cy - cs * 0.34, cx + cs * 0.6, cy - cs * 0.1);
  g.addColorStop(0, '#5d503c');
  g.addColorStop(0.55, '#3d3529');
  g.addColorStop(1, '#2a2520');
  bgx.fillStyle = g;
  bgx.fill();
  bgx.strokeStyle = 'rgba(224,196,146,0.28)';
  bgx.lineWidth = 1;
  bgx.stroke();

  /* backrest */
  var by = cy - cs * 0.30, bh = cs * 0.72;
  poly(bgx, [
    { x: cx - cs * 0.52, y: by },
    { x: cx + cs * 0.52, y: by - cs * 0.03 },
    { x: cx + cs * 0.46, y: by - bh },
    { x: cx - cs * 0.46, y: by - bh + cs * 0.03 }
  ]);
  g = bgx.createLinearGradient(cx - cs * 0.5, 0, cx + cs * 0.5, 0);
  g.addColorStop(0, 'rgba(92,80,60,0.55)');
  g.addColorStop(0.6, 'rgba(52,46,38,0.85)');
  g.addColorStop(1, 'rgba(30,28,25,0.9)');
  bgx.fillStyle = g;
  bgx.fill();

  /* back slats, warm rim on the lit side */
  var sl2;
  for (sl2 = 0; sl2 < 3; sl2++) {
    var ry = by - bh * (0.26 + sl2 * 0.27);
    bgx.fillStyle = 'rgba(150,128,96,' + (0.30 - sl2 * 0.06).toFixed(3) + ')';
    bgx.fillRect(cx - cs * 0.44, ry, cs * 0.88, Math.max(2, cs * 0.035));
  }
  bgx.strokeStyle = 'rgba(232,206,158,0.30)';
  bgx.lineWidth = 1.4;
  bgx.beginPath();
  bgx.moveTo(cx - cs * 0.46, by - bh + cs * 0.03);
  bgx.lineTo(cx - cs * 0.52, by);
  bgx.stroke();

  /* ------- olive tree in a pot, bottom right ------- */
  var ox = w * 0.845, oy = floorY + h * 0.20;
  bgx.save();
  bgx.translate(ox, oy);
  bgx.transform(1, 0, -0.5, 0.30, 0, 0);
  bgx.fillStyle = 'rgba(4,7,10,0.55)';
  bgx.beginPath();
  bgx.ellipse(0, 0, w * 0.055, h * 0.028, 0, 0, 6.2832);
  bgx.fill();
  bgx.restore();

  bgx.strokeStyle = 'rgba(96,88,72,0.85)';
  bgx.lineWidth = Math.max(2, w * 0.0035);
  bgx.beginPath();
  bgx.moveTo(ox, oy - h * 0.02);
  bgx.quadraticCurveTo(ox + w * 0.012, oy - h * 0.11, ox - w * 0.006, oy - h * 0.19);
  bgx.stroke();

  var lf = 0;
  for (lf = 0; lf < 22; lf++) {
    var ang = rnd() * 6.2832;
    var rad = (0.02 + rnd() * 0.075) * w;
    var lx = ox + Math.cos(ang) * rad * 0.75;
    var ly = oy - h * 0.20 + Math.sin(ang) * rad * 0.42;
    var lw = w * (0.008 + rnd() * 0.010);
    bgx.save();
    bgx.translate(lx, ly);
    bgx.rotate(rnd() * 1.4 - 0.7);
    bgx.fillStyle = 'rgba(' + (58 + Math.floor(rnd() * 30)) + ',' + (74 + Math.floor(rnd() * 26)) + ',' + (66 + Math.floor(rnd() * 20)) + ',0.72)';
    bgx.beginPath();
    bgx.ellipse(0, 0, lw, lw * 0.42, 0, 0, 6.2832);
    bgx.fill();
    bgx.restore();
  }

  /* pot */
  poly(bgx, [
    { x: ox - w * 0.030, y: oy - h * 0.052 },
    { x: ox + w * 0.030, y: oy - h * 0.052 },
    { x: ox + w * 0.022, y: oy + h * 0.012 },
    { x: ox - w * 0.022, y: oy + h * 0.012 }
  ]);
  g = bgx.createLinearGradient(ox - w * 0.03, 0, ox + w * 0.03, 0);
  g.addColorStop(0, '#6a5c48');
  g.addColorStop(0.5, '#4a4034');
  g.addColorStop(1, '#241f1a');
  bgx.fillStyle = g;
  bgx.fill();

  /* ------- dresser / dark mass on the left ------- */
  g = bgx.createLinearGradient(0, 0, w * 0.16, 0);
  g.addColorStop(0, 'rgba(6,9,13,0.92)');
  g.addColorStop(1, 'rgba(6,9,13,0)');
  bgx.fillStyle = g;
  bgx.fillRect(0, floorY - h * 0.30, w * 0.16, h * 0.30);

  /* ------- vignette ------- */
  g = bgx.createRadialGradient(w * 0.56, h * 0.42, Math.min(w, h) * 0.18, w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(4,7,10,0.32)');
  g.addColorStop(1, 'rgba(2,4,6,0.80)');
  bgx.fillStyle = g;
  bgx.fillRect(0, 0, w, h);

  /* ------- grain (static, baked once) ------- */
  var gi, gp = Math.min(2600, Math.floor(w * h / 900));
  for (gi = 0; gi < gp; gi++) {
    var gx2 = rnd() * w, gy2 = rnd() * h;
    var al = 0.012 + rnd() * 0.030;
    bgx.fillStyle = 'rgba(232,222,200,' + al.toFixed(3) + ')';
    bgx.fillRect(gx2, gy2, 1, 1);
  }
}

function seedMotes() {
  motes.length = 0;
  var n = 46, i;
  for (i = 0; i < n; i++) {
    motes.push({
      x: Math.random(), y: Math.random(),
      r: 0.5 + Math.random() * 1.6,
      vy: 0.006 + Math.random() * 0.014,
      vx: 0.002 + Math.random() * 0.006,
      ph: Math.random() * 6.283
    });
  }
}

/* ---------- motes drifting through the light ---------- */
function drawMotes(w, h) {
  var i, m, n = motes.length;
  var bx = w * 0.515, by = h * 0.105, bw = w * 0.395, bh = h * 0.495;
  for (i = 0; i < n; i++) {
    m = motes[i];
    if (!state.reduced) {
      m.y -= m.vy * 0.0045;
      m.x += m.vx * 0.0022;
      if (m.y < 0) { m.y = 1; m.x = Math.random(); }
      if (m.x > 1) m.x = 0;
    }
    var px = bx - w * 0.20 + m.x * (bw + w * 0.26);
    var py = by + m.y * (bh + h * 0.22);
    var a = 0.10 + 0.34 * Math.abs(Math.sin(m.ph + m.y * 8.0));
    a *= 0.5 + 0.5 * (1 - m.y);
    a *= 1 + state.level * 0.7;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(238,218,182,1)';
    ctx.beginPath();
    ctx.arc(px, py, m.r * (1 + state.beat * 0.5), 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- lyric ---------- */
function computeIdx(t) {
  var a = state.lines, lo = 0, hi = a.length - 1, r = -1, g;
  for (g = 0; g < 16 && lo <= hi; g++) {
    var m = (lo + hi) >> 1;
    if (a[m].t <= t + 0.001) { r = m; lo = m + 1; } else { hi = m - 1; }
  }
  return r;
}

var DIM = 'rgba(196,186,168,0.34)';
var HOT = 'rgba(244,235,216,0.96)';

function lineAlpha(i) {
  if (i === state.idx) return 1;
  var k = Math.abs(i - state.idx);
  if (k === 1) return 0.26;
  return 0;
}

function drawLyric() {
  var w = view.w, h = view.h;
  var gap = clamp(h * 0.05, 22, 58);
  var baseY = h * 0.845;
  var size = clamp(w * 0.031, 18, 43);
  if (view.h > view.w) size = clamp(w * 0.052, 18, 36);
  ctx.font = '400 ' + Math.round(size) + 'px "Songti SC","STSong","SimSun","Noto Serif CJK SC",serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  if (!state.lines.length) {
    var fs = clamp(w * 0.017, 12, 19);
    ctx.font = '400 ' + Math.round(fs) + 'px "Songti SC","STSong","SimSun",serif';
    ctx.fillStyle = DIM;
    var empty = '安静的房间，没有歌词';
    ctx.fillText(empty, w * 0.075, baseY - 4);
    ctx.fillStyle = 'rgba(196,186,168,0.18)';
    ctx.fillRect(w * 0.075, baseY + fs * 0.75, Math.min(w * 0.16, 180), 1);
    return;
  }

  var nx = state.idx + 1 < state.lines.length ? state.idx + 1 : -1;
  var step, txt = '';

  /* next line, small and dim, above */
  if (nx >= 0) {
    var ntxt = state.lines[nx]._text || '';
    var ns = size * 0.55;
    ctx.font = '400 ' + Math.round(ns) + 'px "Songti SC","STSong","SimSun",serif';
    for (step = 0; step < 14; step++) {
      if (ctx.measureText(ntxt).width <= w * 0.78 || ns <= 11) break;
      ns *= 0.92;
      ctx.font = '400 ' + Math.round(ns) + 'px "Songti SC","STSong","SimSun",serif';
    }
    ctx.fillStyle = 'rgba(190,182,166,0.20)';
    ctx.fillText(ntxt, w * 0.075, baseY - gap);
  }

  var line = state.lines[state.idx];
  if (!line) return;

  txt = line._text;
  /* fit to width: fixed iteration budget, never an unbounded while */
  var maxW = w - w * 0.15;
  for (step = 0; step < 24; step++) {
    if (ctx.measureText(txt).width <= maxW || size <= 13) break;
    size *= 0.94;
    ctx.font = '400 ' + Math.round(size) + 'px "Songti SC","STSong","SimSun",serif';
  }
  if (ctx.measureText(txt).width > maxW) {
    var keep = txt.length;
    for (step = 0; step < 60; step++) {
      if (keep <= 4) break;
      if (ctx.measureText(txt.slice(0, keep) + '…').width <= maxW) break;
      keep = Math.floor(keep * 0.9);
    }
    txt = txt.slice(0, keep) + '…';
  }

  /* glow pass, then per-character ink */
  var chs = line._chars;
  var useChars = !state.reduced && chs && chs.length === txt.length && txt.length <= 80;

  ctx.save();
  ctx.shadowColor = 'rgba(226,184,126,0.46)';
  ctx.shadowBlur = 24 * (1 + state.beat * 0.22);
  ctx.fillStyle = 'rgba(244,235,216,0.30)';
  ctx.fillText(txt, w * 0.075, baseY);
  ctx.restore();

  if (useChars) {
    var cx = w * 0.075, ci, reach2 = state.t - 0.05;
    for (ci = 0; ci < chs.length; ci++) {
      var cEl = chs[ci];
      var ct = (cEl && isFinite(Number(cEl.t))) ? Number(cEl.t) : line.t;
      var on = reach2 >= ct;
      var ch = txt.charAt(ci);
      ctx.fillStyle = on ? HOT : DIM;
      ctx.fillText(ch, cx, baseY);
      cx += ctx.measureText(ch).width;
    }
  } else {
    ctx.fillStyle = HOT;
    ctx.fillText(txt, w * 0.075, baseY);
  }

  /* thin rule */
  ctx.fillStyle = 'rgba(222,196,152,0.16)';
  ctx.fillRect(w * 0.075, baseY + size * 0.62, Math.min(w * 0.30, 320) * (0.4 + state.level * 0.6), 1);
}

/* ---------- frame ---------- */
function draw(ts) {
  var t0 = nowMs();
  var w = view.w, h = view.h;
  var stamp = (typeof ts === 'number' && isFinite(ts)) ? ts : t0;

  if (!frameInit) { frameInit = true; lastFrameAt = stamp; }
  var dt = clamp((stamp - lastFrameAt) / 1000, 0, 0.1);
  lastFrameAt = stamp;
  state.frames++;

  if (!readySent) sendReady();

  if (needRoom) {
    needRoom = false;
    try { buildRoom(); } catch (e) { console.error('[434] buildRoom', e); }
  }

  if (state.playing && lastTickAt) {
    state.smoothT = Math.min(state.t + (nowMs() - lastTickAt) / 1000, state.t + 0.55);
  } else {
    state.smoothT = state.t;
  }

  state.idx = computeIdx(state.t);
  var line = state.lines[state.idx];
  state.text = line ? line._text : '';

  state.beat = Math.max(0, state.beat - dt * 2.2);

  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(bg, 0, 0, w, h);

  /* slow breath of the light on the bare wall */
  var breath = state.reduced ? 0 : (0.5 + 0.5 * Math.sin(state.smoothT * 0.21));
  var lv = clamp(state.level * 0.55 + state.beat * 0.45, 0, 1);
  var gA = ctx.createRadialGradient(w * 0.40, h * 0.26, 0, w * 0.40, h * 0.26, Math.max(w, h) * 0.62);
  gA.addColorStop(0, warmC() + (0.055 + 0.075 * breath + lv * 0.09).toFixed(3) + ')');
  gA.addColorStop(0.45, warmC() + (0.020 + 0.030 * breath).toFixed(3) + ')');
  gA.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = gA;
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';

  drawMotes(w, h);
  drawLyric();

  var t1 = nowMs();
  state.js = t1 - t0;
  requestAnimationFrame(draw);
}

/* ---------- messages ---------- */
function parseLines(raw) {
  if (!raw || typeof raw.length !== 'number') return [];
  var out = [], i;
  for (i = 0; i < raw.length && out.length < 400; i++) {
    var l = raw[i];
    if (!l || typeof l !== 'object') continue;
    var t = Number(l.t);
    if (!isFinite(t) || t < 0) t = 0;
    var text = (l.text == null) ? '' : String(l.text);
    var chars = l.chars;
    if (!text && chars && chars.length) {
      text = '';
      var k;
      for (k = 0; k < chars.length && k < 200; k++) text += (chars[k] && chars[k].c != null) ? String(chars[k].c) : '';
    }
    if (!text) continue;
    out.push({ t: t, dur: Number(l.dur) || 0, _text: text, _chars: (chars && chars.length) ? chars : null });
  }
  out.sort(function (a, b) { return a.t - b.t; });
  return out;
}

function onInit(p) {
  if (!p || typeof p !== 'object') return;
  var acc = p.accent;
  if (acc && typeof acc.length === 'number' && acc.length >= 3) {
    var a = [Number(acc[0]), Number(acc[1]), Number(acc[2])];
    if (isFinite(a[0]) && isFinite(a[1]) && isFinite(a[2])) {
      state.accent = a;
      needRoom = true;
    }
  }
  state.lines = parseLines(p.lines);
  state.idx = computeIdx(state.t);
  state.playing = (typeof p.playing === 'boolean') ? p.playing : true;
}

function onTick(p) {
  if (!p) return;
  var t = Number(p.time);
  if (isFinite(t)) { state.t = t; lastTickAt = nowMs(); }
  if (typeof p.playing === 'boolean') state.playing = p.playing;
}

window.addEventListener('message', function (ev) {
  try {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') {
      var lv = Number(d.payload && d.payload.level);
      state.beat = clamp(isFinite(lv) ? lv : 0.6, 0, 1);
    } else if (d.type === 'live') {
      var lv2 = Number(d.payload && d.payload.level);
      state.level = clamp(isFinite(lv2) ? lv2 : 0, 0, 1);
    }
  } catch (e) { console.error('[434] message handler', e); }
}, false);

window.addEventListener('error', function (e) {
  console.error('[434] window error', e && e.message);
});

window.addEventListener('resize', function () {
  try { resize(); } catch (e) { console.error('[434] resize', e); }
});

function resize() {
  var w = Math.round(window.innerWidth || 0), h = Math.round(window.innerHeight || 0);
  if (!isFinite(w) || w <= 0) w = 1440;
  if (!isFinite(h) || h <= 0) h = 900;
  var dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  view.w = w; view.h = h; view.dpr = dpr;
  cvs.width = Math.round(w * dpr);
  cvs.height = Math.round(h * dpr);
  cvs.style.width = w + 'px';
  cvs.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildRoom();
  seedMotes();
}

/* ---------- boot ---------- */
resize();
lastFrameAt = 0;
requestAnimationFrame(draw);
setTimeout(sendReady, 600);
</script>
</body>
</html>
