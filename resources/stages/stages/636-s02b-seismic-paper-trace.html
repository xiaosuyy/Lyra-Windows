<!-- 636 / S02B —— 歌词是地震仪纸带上的墨迹：人声是波形，鼓点是笔尖的每次惊跳。 -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>636 · 声纹地震仪</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#141210;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var cvs = document.getElementById("c");
  var ctx = cvs.getContext("2d", { alpha: false });

  /* ---------- 0. 自检状态 / 契约 ---------- */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}

  window.__stage = function () {
    var i = S.idx, L = S.lines, tx = "";
    if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
    return {
      lines: L.length,
      idx: i,
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: Math.round(S.js * 100) / 100,
      err: S.err,
      text: tx,
      gl: false,
      rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var n = (window.performance && performance.now()) || Date.now();
    if (n - lastErrAt > 1000) {
      lastErrAt = n;
      try { console.error(e); } catch (_) {}
    }
  }

  /* ---------- 1. ready：首帧 rAF + 800ms 兜底，只发一次 ---------- */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }
  var booted = false;
  function start() {
    if (booted) return;
    booted = true;
    resize();
    lastNow = performance.now();
    raf = requestAnimationFrame(loop);
  }
  requestAnimationFrame(function () { sendReady(); start(); });
  setTimeout(function () { sendReady(); start(); }, 800);

  /* ---------- 2. 尺寸 / 几何 ---------- */
  var W = 1440, H = 900, DPR = 1;
  var PX = 16, PY = 16, PW = 1408, PH = 868;
  var LEFT = 82, RIGHT = 1396, TOP = 120, BOT = 788, ROWH = 222, MAXW = 1250;
  var bg = document.createElement("canvas");
  var bgx = bg.getContext("2d");

  function geometry() {
    var m = W < 620 ? 10 : 16;
    PX = m; PY = m; PW = W - m * 2; PH = H - m * 2;
    var head = W < 620 ? 88 : 100;
    var foot = W < 620 ? 74 : 92;
    TOP = PY + head;
    BOT = PY + PH - foot;
    ROWH = Math.max(70, (BOT - TOP) / 3);
    LEFT = PX + (W < 620 ? 34 : 66);
    RIGHT = PX + PW - (W < 620 ? 14 : 28);
    MAXW = Math.max(120, RIGHT - LEFT - 24);
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = Math.round(w); H = Math.round(h);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width = W + "px";
    cvs.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    geometry();
    for (var i = 0; i < S.lines.length; i++) S.lines[i]._lay = null;
    buildBg();
  }
  addEventListener("resize", resize);

  /* ---------- 3. 数据 ---------- */
  var AC = [198, 59, 36];
  var DUR = 0;
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 };
  var beatImp = 0, beatPhase = 0, visT = 0;
  var lastTickAt = 0, startedTick = false, lastNow = 0;
  var penX = 700, penY = 400, penReady = false;
  var raf = 0, stopped = false;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoothstep(a, b, x) {
    var t = clamp((x - a) / ((b - a) || 1e-6), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function damp(cur, target, lambda, dt) {
    return cur + (target - cur) * (1 - Math.exp(-lambda * dt));
  }
  function normAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return [198, 59, 36];
    var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return [198, 59, 36];
    r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
    return [r, g, b];
  }
  function inkA(a) { return "rgba(28,25,20," + a + ")"; }
  function accA(a) {
    return "rgba(" + AC[0] + "," + AC[1] + "," + AC[2] + "," + a + ")";
  }
  function mono(size) { return Math.round(size) + 'px "Courier New",Courier,"SimSun",monospace'; }
  function serif(size) { return Math.round(size) + 'px "Georgia","Songti SC","STSong","SimSun",serif'; }

  function charTimes(line) {
    var chars = Array.from(line.text || ""), n = chars.length, out = new Array(n);
    var cs = line.chars, i, j, rec, ct;
    if (cs && cs.length) {
      var rel = cs[0] && isFinite(cs[0].t) && cs[0].t < line.t - 0.08;
      for (i = 0; i < n; i++) {
        j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        rec = cs[j];
        ct = rec && rec.t;
        out[i] = isFinite(ct) ? (rel ? line.t + ct : ct) : null;
      }
      return out;
    }
    var d = line.dur > 0 ? line.dur : 3.4;
    for (i = 0; i < n; i++) out[i] = line.t + d * 0.86 * i / Math.max(1, n);
    return out;
  }

  function parseLines(raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      if (!l || typeof l !== "object") continue;
      var text = (l.text == null) ? "" : String(l.text);
      if (!text.trim()) continue;
      var t = Number(l.t); if (!isFinite(t) || t < 0) t = 0;
      var dur = Number(l.dur); if (!isFinite(dur) || dur < 0) dur = 0;
      var line = {
        t: t, dur: dur, text: text,
        chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null,
        _lay: null
      };
      line.times = charTimes(line);
      out.push(line);
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  /* ---------- 4. 消息 ---------- */
  var lastAct = 0;
  function activity() {
    var n = performance.now();
    if (n - lastAct < 90) return;
    lastAct = n;
    try { parent.postMessage({ __c100: 1, type: "activity" }, "*"); } catch (_) {}
  }
  addEventListener("mousemove", activity, { passive: true });
  addEventListener("pointerdown", activity, { passive: true });
  addEventListener("touchstart", activity, { passive: true });
  addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      try { parent.postMessage({ __c100: 1, type: "key", payload: { key: "Space" } }, "*"); } catch (_) {}
    }
  });

  function applyInit(p) {
    if (p && Array.isArray(p.lines)) {
      S.lines = parseLines(p.lines);
      S.idx = idxAt(S.t);
      penReady = false;
    }
    if (p && Array.isArray(p.accent)) {
      var na = normAccent(p.accent);
      /* 与朱红取得平衡，再按纸面亮度校正可读性 */
      AC = [
        Math.round(198 * 0.55 + na[0] * 0.45),
        Math.round(59 * 0.55 + na[1] * 0.45),
        Math.round(36 * 0.55 + na[2] * 0.45)
      ];
      var lum = (0.299 * AC[0] + 0.587 * AC[1] + 0.114 * AC[2]) / 255;
      if (lum > 0.70) { AC = AC.map(function (v) { return Math.round(v * 0.55); }); }
      if (lum < 0.12) { AC = AC.map(function (v) { return Math.min(255, Math.round(v * 1.6 + 34)); }); }
    }
    var d = Number(p && p.duration);
    DUR = isFinite(d) && d > 0 ? d : 0;
    live.bpm = 0; live.level = 0; live.bass = 0; live.mid = 0; live.treble = 0;
    beatImp = 0;
  }

  function resetSeek() {
    beatImp = 0; beatPhase = 0; visT = 0;
    penReady = false;
  }

  addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    try {
      if (d.type === "init") applyInit(p);
      else if (d.type === "tick") {
        var t = Number(p.time);
        if (isFinite(t)) {
          if (startedTick && (t < S.t - 0.02 || t - S.t > 0.5)) resetSeek();
          S.t = t;
          startedTick = true;
          lastTickAt = performance.now();
          S.idx = idxAt(t);
        }
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") {
        var bv = Number(p.level);
        bv = isFinite(bv) ? clamp(bv, 0, 1) : 0.5;
        beatImp = Math.max(beatImp, 0.45 + bv * 0.55);
      } else if (d.type === "live") {
        var q;
        q = Number(p.bpm); if (isFinite(q)) live.bpm = clamp(q, 0, 300);
        q = Number(p.level); if (isFinite(q)) live.level = clamp(q, 0, 1);
        q = Number(p.bass); if (isFinite(q)) live.bass = clamp(q, 0, 1);
        q = Number(p.mid); if (isFinite(q)) live.mid = clamp(q, 0, 1);
        q = Number(p.treble); if (isFinite(q)) live.treble = clamp(q, 0, 1);
        if (typeof p.playing === "boolean") S.playing = p.playing;
      }
    } catch (e) { logErr(e); }
  });

  addEventListener("pagehide", function () {
    stopped = true;
    if (raf) cancelAnimationFrame(raf);
  });

  /* ---------- 5. 排版缓存 ---------- */
  function fontOf(size) { return serif(size); }

  function buildLay(line) {
    var chars = Array.from(line.text || "");
    var base = clamp(ROWH * 0.40, 21, 74);
    var maxW = MAXW;
    var size = base, advances = [], w = 0, i, a;
    ctx.font = fontOf(size);
    for (i = 0; i < chars.length; i++) {
      a = ctx.measureText(chars[i]).width;
      advances.push(a); w += a;
    }
    if (w > maxW && w > 0) {
      size = Math.max(12, Math.floor(size * maxW / w));
      advances = []; w = 0;
      ctx.font = fontOf(size);
      for (i = 0; i < chars.length; i++) {
        a = ctx.measureText(chars[i]).width;
        advances.push(a); w += a;
      }
    }
    var pre = new Array(chars.length + 1);
    pre[0] = 0;
    for (i = 0; i < chars.length; i++) pre[i + 1] = pre[i] + advances[i];
    line._lay = { chars: chars, adv: advances, pre: pre, w: w, size: size };
  }

  function getLay(line) {
    if (!line._lay) buildLay(line);
    return line._lay;
  }

  /* ---------- 6. 背景纸（缓存） ---------- */
  function buildBg() {
    bg.width = Math.max(2, Math.round(W * DPR));
    bg.height = Math.max(2, Math.round(H * DPR));
    bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgx.clearRect(0, 0, W, H);

    /* 纸 */
    bgx.save();
    bgx.shadowColor = "rgba(0,0,0,.62)";
    bgx.shadowBlur = 30;
    bgx.shadowOffsetY = 10;
    var g = bgx.createLinearGradient(0, PY, 0, PY + PH);
    g.addColorStop(0, "#f3ecda");
    g.addColorStop(0.55, "#eee6d2");
    g.addColorStop(1, "#e7dec8");
    bgx.fillStyle = g;
    bgx.fillRect(PX, PY, PW, PH);
    bgx.restore();

    /* 纸边 */
    bgx.strokeStyle = inkA(0.16);
    bgx.lineWidth = 1;
    bgx.strokeRect(PX + 0.5, PY + 0.5, PW - 1, PH - 1);

    /* 纸面顶部一道折光 */
    var g2 = bgx.createLinearGradient(0, PY, 0, PY + 26);
    g2.addColorStop(0, "rgba(255,255,255,.5)");
    g2.addColorStop(1, "rgba(255,255,255,0)");
    bgx.fillStyle = g2;
    bgx.fillRect(PX + 1, PY + 1, PW - 2, 26);

    /* 栏内横向细线 */
    bgx.save();
    bgx.beginPath();
    bgx.rect(LEFT - 8, TOP - 6, RIGHT - LEFT + 16, BOT - TOP + 12);
    bgx.clip();
    bgx.strokeStyle = inkA(0.075);
    bgx.lineWidth = 1;
    var step = ROWH / 4, y;
    for (y = TOP; y <= BOT + 1; y += step) {
      bgx.beginPath();
      bgx.moveTo(LEFT - 8, Math.round(y) + 0.5);
      bgx.lineTo(RIGHT + 8, Math.round(y) + 0.5);
      bgx.stroke();
    }
    /* 竖格 */
    bgx.strokeStyle = inkA(0.05);
    for (var x = LEFT; x <= RIGHT; x += 62) {
      bgx.beginPath();
      bgx.moveTo(Math.round(x) + 0.5, TOP);
      bgx.lineTo(Math.round(x) + 0.5, BOT);
      bgx.stroke();
    }
    bgx.restore();

    /* 三条基线 */
    bgx.save();
    bgx.setLineDash([2, 7]);
    bgx.lineWidth = 1;
    bgx.strokeStyle = inkA(0.16);
    for (var r = 0; r < 3; r++) {
      var by = TOP + ROWH * (r + 0.60);
      bgx.beginPath();
      bgx.moveTo(LEFT - 8, Math.round(by) + 0.5);
      bgx.lineTo(RIGHT + 8, Math.round(by) + 0.5);
      bgx.stroke();
    }
    bgx.restore();

    /* 角标 */
    bgx.strokeStyle = inkA(0.28);
    bgx.lineWidth = 1;
    var cm = 12;
    [[PX + 8, PY + 8, 1, 1], [PX + PW - 8, PY + 8, -1, 1],
     [PX + 8, PY + PH - 8, 1, -1], [PX + PW - 8, PY + PH - 8, -1, -1]].forEach(function (c) {
      bgx.beginPath();
      bgx.moveTo(c[0], c[1] + c[3] * cm);
      bgx.lineTo(c[0], c[1]);
      bgx.lineTo(c[0] + c[2] * cm, c[1]);
      bgx.stroke();
    });

    /* 打孔边 */
    bgx.fillStyle = inkA(0.10);
    for (var py = PY + 46; py < PY + PH - 30; py += 46) {
      bgx.beginPath();
      bgx.arc(PX + 7, py, 1.7, 0, Math.PI * 2);
      bgx.fill();
    }
  }

  /* ---------- 7. 波形 ---------- */
  function waveAt(x, row, t, active) {
    var amp = RM ? 0.22 : 1;
    var a = (2.4 + live.bass * 13 + beatImp * 10) * amp;
    var v = 0;
    v += Math.sin(x * 0.0082 + t * 1.85 + row * 1.9) * a;
    v += Math.sin(x * 0.026 - t * 3.1 + row * 2.7) * (0.9 + live.treble * 5.5) * amp;
    v += Math.sin(x * 0.0031 + t * 0.72 + row * 0.8) * (2.6 + live.level * 8) * amp;
    if (active && !RM) {
      var dx = (x - penX) / 34;
      v += beatImp * 30 * Math.exp(-dx * dx);
    }
    return v;
  }

  function waveSlope(x, row, t, active) {
    var a = waveAt(x - 7, row, t, active);
    var b = waveAt(x + 7, row, t, active);
    return (b - a) / 14;
  }

  /* ---------- 8. 绘制工具 ---------- */
  function tracked(txt, x, y, sp, color, font, align, alpha) {
    ctx.save();
    ctx.font = font;
    var chars = Array.from(txt), i, w = 0;
    for (i = 0; i < chars.length; i++) w += ctx.measureText(chars[i]).width + sp;
    w -= sp;
    var sx = align === "right" ? x - w : (align === "center" ? x - w / 2 : x);
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    for (i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], sx, y);
      sx += ctx.measureText(chars[i]).width + sp;
    }
    ctx.restore();
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function timecode(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60), c = Math.floor((sec % 1) * 100);
    return pad2(m) + ":" + pad2(s) + "." + pad2(c);
  }

  function baseline(r) { return TOP + ROWH * (r + 0.60); }

  /* ---------- 9. 一行歌词 ---------- */
  function drawLine(line, row, active, t, alphaMul, penRef) {
    var lay = getLay(line);
    var base = baseline(row);
    var cx0 = (LEFT + RIGHT) / 2 - lay.w / 2;
    /* 行内极缓的纸带漂移，不破坏排版 */
    var drift = (active && !RM) ? -Math.min(26, Math.max(0, t - line.t) * 4.5) : 0;
    var x0 = cx0 + drift;
    var font = fontOf(lay.size);

    ctx.save();
    ctx.font = font;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#211d17";

    var lastShown = -1;
    for (var i = 0; i < lay.chars.length; i++) {
      var ct = line.times[i];
      if (!isFinite(ct)) ct = line.t;
      if (active && t < ct - 0.0005) break;
      var ch = lay.chars[i];
      var ax = x0 + lay.pre[i] + lay.adv[i] / 2;
      if (ax < LEFT - 60 || ax > RIGHT + 60) continue;
      var wy = waveAt(ax, row, t, active);
      var slope = waveSlope(ax, row, t, active);
      var age = t - ct;
      var aIn = active ? smoothstep(0, 0.13, age) : 1;
      var sc = RM ? 1 : 1 + (1 - aIn) * 0.20;
      if (ch !== " ") {
        ctx.save();
        ctx.globalAlpha = alphaMul * (0.12 + 0.88 * aIn);
        ctx.translate(ax, base + wy);
        ctx.rotate(clamp(slope * 0.45, -0.15, 0.15));
        ctx.scale(sc, sc);
        ctx.fillText(ch, -lay.adv[i] / 2, 0);
        ctx.restore();
      }
      lastShown = i;
    }

    /* 当前字：笔尖下的朱红顿点 */
    if (active && lastShown >= 0 && !RM) {
      var lx = x0 + lay.pre[lastShown] + lay.adv[lastShown] / 2;
      var ly = base + waveAt(lx, row, t, true);
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = accA(1);
      ctx.fillRect(lx - 1.5, ly + 7, 3, 6);
    }
    ctx.restore();

    if (penRef) {
      var px;
      if (lastShown >= 0) px = x0 + lay.pre[lastShown + 1];
      else px = x0 - 6;
      penRef.x = px;
      penRef.y = base;
    }
  }

  /* ---------- 10. 笔架 / 波形 ---------- */
  function drawTrace(row, active, t, penPx, alpha, drawTo) {
    var base = baseline(row);
    var end = drawTo == null ? RIGHT : Math.max(LEFT, drawTo);
    ctx.save();
    ctx.lineWidth = active ? 1.35 : 1;
    ctx.strokeStyle = active ? inkA(0.80 * alpha) : inkA(0.34 * alpha);
    ctx.beginPath();
    var first = true;
    for (var x = LEFT - 6; x <= end + 0.5; x += 4.5) {
      var y = base + waveAt(x, row, t, active);
      if (first) { ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    /* 笔端一小段更实的墨 */
    if (active) {
      var x1 = Math.max(LEFT, end - 46);
      ctx.strokeStyle = inkA(0.92 * alpha);
      ctx.lineWidth = 1.9;
      ctx.beginPath();
      first = true;
      for (var xx = x1; xx <= end + 0.5; xx += 2.5) {
        var yy = base + waveAt(xx, row, t, true);
        if (first) { ctx.moveTo(xx, yy); first = false; }
        else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 11. 主绘制 ---------- */
  function draw(now, dt, alive) {
    var t = S.t;

    /* 桌面 */
    ctx.fillStyle = "#131110";
    ctx.fillRect(0, 0, W, H);
    var rg = ctx.createRadialGradient(W * 0.5, H * 0.42, 40, W * 0.5, H * 0.42, Math.max(W, H) * 0.75);
    rg.addColorStop(0, "#2a231d");
    rg.addColorStop(0.55, "#1b1713");
    rg.addColorStop(1, "#0e0c0b");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    var jolt = 0;
    if (alive && !RM) {
      jolt = beatImp * Math.sin(beatPhase) * 1.8;
    }

    ctx.save();
    ctx.translate(0, jolt);

    /* 纸 */
    ctx.drawImage(bg, 0, 0, W, H);

    /* 页眉 */
    var u = clamp(Math.min(W / 1280, H / 800), 0.7, 1.15);
    var fs = clamp(9.5 * u, 8, 11.5);
    tracked("636 / S02B", PX + 22, PY + 25, 1.8, accA(0.95), mono(fs), "left");
    var titleSize = clamp(W * 0.0185, 16, 27);
    tracked("SEISMOGRAPH", PX + 22, PY + 47, 3.2, inkA(0.92), serif(titleSize), "left");
    tracked("VOCAL TRACE / 声纹纸带 · 25 mm·s⁻¹", PX + 22, PY + 65, 1.15, inkA(0.46), mono(fs * 0.82), "left");

    /* 页眉右：BPM / 振幅 */
    var rx = PX + PW - 22;
    tracked("BPM", rx - 84, PY + 27, 1.4, inkA(0.42), mono(fs * 0.85), "left");
    var bpmTxt = live.bpm > 0 ? Math.round(live.bpm) + "" : "---";
    ctx.save();
    ctx.font = mono(clamp(22 * u, 16, 27));
    ctx.fillStyle = inkA(0.9);
    ctx.textAlign = "right";
    ctx.fillText(bpmTxt, rx, PY + 55);
    ctx.restore();

    tracked("AMP", rx - 84, PY + 72, 1.4, inkA(0.42), mono(fs * 0.85), "left");
    var bx = rx - 84, by = PY + 79, bw = 56, bh = 4;
    ctx.fillStyle = inkA(0.12);
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = accA(0.9);
    ctx.fillRect(bx, by, bw * clamp(live.level, 0, 1), bh);
    ctx.fillStyle = accA(0.55);
    ctx.fillRect(bx, by + 7, bw * clamp(live.bass, 0, 1), 2);

    /* 状态点 */
    var led = 2.6 + (alive ? beatImp * 2.4 : 0);
    ctx.fillStyle = accA(alive ? 0.95 : 0.4);
    ctx.fillRect(rx - 6, PY + 24, led, led);
    tracked("REC", rx - 22, PY + 27, 1.2, inkA(0.55), mono(fs * 0.85), "right");

    /* 通道 */
    var activeRow = S.idx >= 0 ? ((S.idx % 3) + 3) % 3 : 1;
    var penTargetX = (LEFT + RIGHT) * 0.5;
    var penTargetY = baseline(activeRow);
    var penRef = null;

    if (S.lines.length && S.idx >= 0) {
      for (var k = 0; k < 3; k++) {
        var li = S.idx - k;
        if (li < 0) continue;
        var line = S.lines[li];
        if (!line) continue;
        var row = ((li % 3) + 3) % 3;
        var active = k === 0;
        var am = active ? 1 : (k === 1 ? 0.34 : 0.15);
        var lay = getLay(line);

        /* 通道标签 */
        var labY = W < 620 ? baseline(row) - ROWH * 0.31 : baseline(row) + 4;
        ctx.fillStyle = active ? accA(0.95) : inkA(0.34);
        if (active) ctx.fillRect(PX + 16, labY - 9, 5, 5);
        else {
          ctx.strokeStyle = inkA(0.32);
          ctx.lineWidth = 1;
          ctx.strokeRect(PX + 16.5, labY - 8.5, 4, 4);
        }
        tracked("CH " + (row + 1), PX + 28, labY, 1.2, active ? inkA(0.82) : inkA(0.42), mono(fs * 0.9), "left");
        tracked("E." + pad2(li + 1), PX + 28, labY + 13, 0.8, active ? accA(0.9) : inkA(0.30), mono(fs * 0.78), "left");

        /* 该行的完整波形（旧行较淡） */
        drawTrace(row, active, t, penX, am, active ? null : RIGHT);

        /* 歌词 */
        var ref = active ? { x: 0, y: 0 } : null;
        drawLine(line, row, active, t, am, ref);
        if (ref) {
          penTargetX = ref.x;
          penTargetY = ref.y;
        }

        /* 行首波形事件刻度 */
        if (active) {
          var ex = LEFT - 1;
          ctx.fillStyle = accA(0.5);
          ctx.fillRect(ex, baseline(row) - 13, 1, 15);
        }
      }
    } else {
      /* 无歌词：纯音频三通道 */
      for (var z = 0; z < 3; z++) {
        drawTrace(z, false, t, penX, 0.5, RIGHT);
        ctx.save();
        ctx.fillStyle = inkA(0.28);
        for (var ex2 = LEFT; ex2 < RIGHT; ex2 += 62) ctx.fillRect(ex2, baseline(z) - 1, 1, 2);
        ctx.restore();
      }
      trackNoText(fs);
    }

    /* 笔 */
    if (!alive) dt = 0;
    if (!penReady) { penX = penTargetX; penY = penTargetY; penReady = true; }
    penX = damp(penX, penTargetX, 16, dt);
    penY = damp(penY, penTargetY, 12, dt);
    drawPen(penX, penY, activeRow, alive);

    /* 页脚 */
    drawFooter(t, u);

    ctx.restore();
  }

  function trackNoText(fs) {
    tracked("NO TRANSCRIPT / AUDIO ONLY", W / 2, baseline(1) - ROWH * 0.34, 2.4, inkA(0.34), mono(clamp(fs * 1.4, 9, 14)), "center");
  }

  function drawPen(x, y, row, alive) {
    var top = TOP + ROWH * row;
    /* 导轨 */
    ctx.save();
    ctx.strokeStyle = inkA(0.11);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(LEFT - 4, Math.round(TOP - 7) + 0.5);
    ctx.lineTo(RIGHT + 4, Math.round(TOP - 7) + 0.5);
    ctx.stroke();

    /* 笔杆 */
    ctx.strokeStyle = inkA(0.26);
    ctx.beginPath();
    ctx.moveTo(Math.round(x) + 0.5, TOP - 7);
    ctx.lineTo(Math.round(x) + 0.5, y - 2);
    ctx.stroke();

    /* 顶部滑块 */
    ctx.fillStyle = accA(0.95);
    ctx.fillRect(x - 3.5, TOP - 11, 7, 7);
    ctx.fillStyle = inkA(0.75);
    ctx.fillRect(x - 1, TOP - 9, 2, 2);

    /* 笔尖 */
    ctx.fillStyle = accA(1);
    ctx.beginPath();
    ctx.moveTo(x, y + 3);
    ctx.lineTo(x - 4, y - 6);
    ctx.lineTo(x + 4, y - 6);
    ctx.closePath();
    ctx.fill();

    /* 朱红垂直准星 */
    ctx.strokeStyle = accA(0.18);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.round(x) + 0.5, y + 4);
    ctx.lineTo(Math.round(x) + 0.5, BOT);
    ctx.stroke();
    ctx.restore();
  }

  function drawFooter(t, u) {
    var fs = clamp(9.5 * u, 8, 11.5);
    var y = PY + PH - 58;
    ctx.save();
    ctx.strokeStyle = inkA(0.16);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PX + 22, y - 18);
    ctx.lineTo(PX + PW - 22, y - 18);
    ctx.stroke();

    tracked("T+ " + timecode(t), PX + 22, y, 1.1, inkA(0.78), mono(fs), "left");
    tracked("PAPER FEED 25 mm/s · INK V", W / 2, y, 1.2, inkA(0.38), mono(fs * 0.88), "center");
    tracked("TOTAL " + (DUR > 0 ? timecode(DUR) : "--:--.--"), PX + PW - 22, y, 1.1, inkA(0.52), mono(fs), "right");

    /* 进度 */
    var ty = y + 18, tw = PW - 44;
    ctx.fillStyle = inkA(0.13);
    ctx.fillRect(PX + 22, ty, tw, 2);
    var p = DUR > 0 ? clamp(t / DUR, 0, 1) : 0;
    if (DUR > 0) {
      ctx.fillStyle = accA(0.9);
      ctx.fillRect(PX + 22, ty, tw * p, 2);
      ctx.fillStyle = accA(1);
      ctx.fillRect(PX + 22 + tw * p - 2, ty - 3, 4, 8);
    }
    ctx.restore();
  }

  /* ---------- 12. 循环 ---------- */
  function loop(now) {
    if (stopped) return;
    var t0 = performance.now();
    var dt = 0;
    var alive = S.playing && (now - lastTickAt < 650);
    if (alive) {
      dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
      visT += dt;
      beatPhase += dt * 25;
      beatImp *= Math.exp(-dt * 5.2);
      if (beatImp < 0.002) beatImp = 0;
    }
    lastNow = now;

    try {
      draw(now, dt, alive);
    } catch (e) {
      logErr(e);
    }
    S.frames++;
    S.js = performance.now() - t0;
    raf = requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
