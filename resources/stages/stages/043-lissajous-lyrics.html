<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>利萨如曲线</title>
<style>
  html,body{margin:0;height:100%;background:#020806;overflow:hidden}
  body{background:radial-gradient(120% 100% at 50% 50%,#03110c,#020604 70%)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #scope{position:fixed;inset:clamp(46px,8vh,88px) clamp(20px,5vw,80px);z-index:5;pointer-events:none;
    border:1px solid rgba(92,255,168,.13);border-radius:8px;
    background-image:
      linear-gradient(rgba(96,255,172,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(96,255,172,.055) 1px,transparent 1px),
      linear-gradient(rgba(96,255,172,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(96,255,172,.10) 1px,transparent 1px);
    background-size:48px 48px,48px 48px,240px 240px,240px 240px;
    background-position:center center;
    box-shadow:inset 0 0 90px rgba(0,0,0,.6);
    -webkit-mask-image:radial-gradient(120% 100% at 50% 50%,#000 42%,rgba(0,0,0,.45) 82%,transparent 100%);
    mask-image:radial-gradient(120% 100% at 50% 50%,#000 42%,rgba(0,0,0,.45) 82%,transparent 100%)}
  /* 原来这里是 mix-blend-mode:multiply —— 全屏混合模式会让整块画布每帧重新合成，
     实测把 60fps 压到 50。源色是纯黑，multiply 与 source-over 数学上完全等价
     （都是 dst*(1-a)），换回 normal 画面一模一样、帧率回到 60。 */
  #scan{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.22;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 1px,transparent 1px 3px)}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(110% 90% at 50% 50%,transparent 46%,rgba(1,4,3,.55) 82%,rgba(1,4,3,.9))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(130,220,175,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="scope"></div>
<div id="scan"></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   043 · 利萨如曲线 —— 字的亮度来自束流的**驻留**与 z 轴调制
   ---------------------------------------------------------------------------
   和已有 10 个的区别：003 是"一堆萤火虫各自飞、长曝光累积"，粒子是主体；
   这里**没有粒子**，只有 3 道示波器束流，它们永远在跑同一条李萨如轨迹，
   谁也不朝字形飞。字是束流被"拖慢 + 加亮"之后留下的余辉。

   机制（参考页只有 X/Y 两个通道，我加了 z 轴）：
     · 屏幕先算一张字形的距离场；束流每走一步都查一次表，
       离笔画越近，参数 u 推进得越慢 —— 束流在笔画上**驻留**，
       肉眼能看见它到了字上就慢下来、一笔一笔地蹭过去；
     · 同一张表还控制 z 轴（亮度）：笔画上 alpha 0.85，字外 0.06。
       所以字不是被画出来的，是束流"路过时被调亮"的地方。
     · 换句那一刻，束流把这句的字形点云**烧一次**到磷光屏上（burn 图层，半分辨率、
       只由点云生成，不用 fillText）——束流是 1 维曲线，单靠它巡逻永远铺不满 2 维的笔画，
       烧一次之后字才读得出来；之后 3 道束流的热斑在字上蹭来蹭去，让它忽明忽暗。
     · 频率比 a/b 与相位 φ 一直在缓慢漂移（参考页的 AUTO SWEEP），
       一句词唱完，李萨如族正好扫过整块字形。
   换句 = 换一张距离场；余辉在换句后的半秒里加快消退，把上一句烧掉的痕迹清掉。

   为什么快：轨迹累积在一张离屏画布上（每帧一次半透明填充 = 磷光衰减）；
   每帧只往上面加 3 条折线，按亮度分 3 档合批 → 每帧不到 12 次 stroke；
   烧屏图层每句只建一次，每帧一次 drawImage。

   精修记录：① YRC 逐字烧屏 —— 烧屏不再是"换句整句烧一次"，而是整句先以
   42% 的**潜影**烧一遍（任何时刻整句可读），第 k 字在 chars[k].t 那一刻再从
   潜影烧到全亮（缺 chars / 长度不符按 t+dur*k/n 均分；__stage 增 yrc 字段）；
   ② 距离场每格也记所属字的成立时刻，束流只在"已唱到的字"上驻留/加亮 ——
   所以驻留顺序 = 唱字顺序；③ 长句自动折 2~3 行 + 字号自适应（41 字 @96px 三行，
   旧版压成一行 28px 且丢形）；④ 镜头：烧屏点云相对束流做 ±7px 的缓慢视差漂移
   + 频率比继续 AUTO SWEEP，beat 仍是三道束流相干加速。
   分词：不使用。逐字时间已精确到字、潜影让整句始终可读，分词只会让"逐字驻留"
   变成按拍闪的整团。
   ========================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
const TAU = Math.PI * 2;
const FONT = (fs) => '800 ' + fs + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';

let W = 0, H = 0, DPR = 1;

const trail = document.createElement('canvas');
const tctx = trail.getContext('2d', { alpha: false });

/* 字形烧屏图层（半分辨率建，放大时自带柔边）。整句先烧潜影，逐字再烧亮。 */
let burn = null, burnA = 0;
const burnG = { g: null, s: 0.5 };

/* ---- 字形距离场（一次建，之后每帧 O(1) 查表；坑⑯）---- */
const CELL = 8;
let gw = 0, gh = 0, dist = null, wgt = null, cellT = null;
let hasField = false;
let fieldBox = { x0: 0, y0: 0, x1: 0, y1: 0 };

/* ---- 束流 ---- */
const NB = 3;
let lastPts = null;                      // 当前句的点云（resize 时重建距离场要用）
const beams = [];
for (let i = 0; i < NB; i++) {
  beams.push({
    a0: 2 + i * 1.5, b0: 1 + i * 0.5,
    u: Math.random() * TAU, ph: Math.random() * TAU,
    x: 0, y: 0, px: 0, py: 0, started: false,
    cr: i === 0 ? [120, 255, 180] : (i === 1 ? [96, 236, 255] : [180, 255, 150])
  });
}
let ampA = 600, ampB = 300;
let beatPulse = 0, clearT = 0;

/* ---- 排版 / 逐字 ---- */
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });
let lay = null, ctArr = null, curYrc = false, lit = 0, curT = 0;
let charPts = null;                      // 每个字的点云（画布坐标）
let curLineRef = null;

let lines = [], accent = [120, 255, 180];

/* 束流头部光斑：预渲染（坑⑪：不要逐帧 createRadialGradient）*/
let dotSprite = null;
function makeDot() {
  const s = 96, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0, 'rgba(232,255,242,0.95)');
  rg.addColorStop(0.16, 'rgba(150,255,196,0.42)');
  rg.addColorStop(0.5, 'rgba(80,255,150,0.10)');
  rg.addColorStop(1, 'rgba(60,220,130,0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
  dotSprite = c;
}
makeDot();

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  trail.width = cv.width; trail.height = cv.height;
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  tctx.lineJoin = 'round'; tctx.lineCap = 'round';
  clearTrail();
  if (curLineRef) relayout();
}
function clearTrail() {
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.globalCompositeOperation = 'source-over';
  tctx.fillStyle = '#020806';
  tctx.fillRect(0, 0, trail.width, trail.height);
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  tctx.globalCompositeOperation = 'lighter';
  for (const b of beams) b.started = false;
}

/* ---- 排版：长句折 2~3 行，字号自适应 ---- */
function splitRows(text) {
  const n = text.length;
  if (n <= 13) return [text];
  const cut = (i) => {
    if (i > 0 && i < n) {
      const c = text.charCodeAt(i);
      if (c >= 0xDC00 && c <= 0xDFFF) return i - 1;
    }
    return i;
  };
  if (n <= 26) { const c = cut(Math.round(n / 2)); return [text.slice(0, c), text.slice(c)]; }
  const a = cut(Math.round(n / 3)), b = cut(Math.round(n * 2 / 3));
  return [text.slice(0, a), text.slice(a, b), text.slice(b)];
}

function makeLayout(text) {
  if (!text) return null;
  const rows = splitRows(text);
  const nr = rows.length;
  const maxW = Math.min(W * 0.80, 1280);
  const maxH = H * 0.50;
  const LHK = 1.20;
  octx.font = FONT(96);
  let widest = 0;
  for (const r of rows) widest = Math.max(widest, octx.measureText(r).width);
  let fs = 96 * Math.min(1, maxW / Math.max(1, widest), maxH / (nr * LHK * 96));
  fs = Math.max(28, Math.floor(fs));
  octx.font = FONT(fs);
  let wMax = 0;
  for (const r of rows) wMax = Math.max(wMax, octx.measureText(r).width);
  if (wMax > maxW) { fs = Math.max(28, Math.floor(fs * maxW / wMax)); octx.font = FONT(fs); }
  const LH = fs * LHK;
  const glyphs = [], rowInfo = [];
  const y0 = H / 2 - (nr - 1) * LH / 2;
  let gi = 0;
  for (let r = 0; r < nr; r++) {
    const row = rows[r];
    let wsum = 0; const ws = [];
    for (let j = 0; j < row.length; j++) { const w = octx.measureText(row[j]).width; ws.push(w); wsum += w; }
    let x = W / 2 - wsum / 2;
    const y = y0 + r * LH;
    for (let j = 0; j < row.length; j++) {
      const w = ws[j];
      glyphs.push({ ch: row[j], x: x + w / 2, y: y, w: w, i: gi++ });
      x += w;
    }
    rowInfo.push({ text: row, x0: W / 2 - wsum / 2, w: wsum, y: y });
  }
  return { glyphs: glyphs, rowInfo: rowInfo, fs: fs, LH: LH, nr: nr };
}

function charTimes(line) {
  const n = line.text.length;
  const ct = new Float32Array(n);
  const chs = line.chars;
  let ok = !!(chs && chs.length === n && n > 0);
  if (ok) {
    for (let k = 0; k < n; k++) {
      const v = chs[k] ? +chs[k].t : NaN;
      if (!isFinite(v)) { ok = false; break; }
      ct[k] = v;
    }
  }
  if (!ok) {
    const dur = line.dur > 0 ? line.dur : 3;
    const t0 = +line.t || 0;
    for (let k = 0; k < n; k++) ct[k] = t0 + dur * k / Math.max(1, n);
  }
  for (let k = 1; k < n; k++) if (ct[k] < ct[k - 1]) ct[k] = ct[k - 1];
  return { ct: ct, yrc: ok };
}

/* ---- 单字采样（相对字心）---- */
function sampleChar(ch, fs) {
  octx.font = FONT(fs);
  const w = Math.max(6, Math.ceil(octx.measureText(ch).width) + 8);
  const h = Math.max(6, Math.ceil(fs * 1.35) + 8);
  if (off.width !== w || off.height !== h) { off.width = w; off.height = h; }
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, w, h);
  octx.font = FONT(fs);
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(ch, w / 2, h / 2);
  const d = octx.getImageData(0, 0, w, h).data;
  const pts = [];
  for (let y = 0; y < h; y += 2)
    for (let x = 0; x < w; x += 2)
      if (d[(y * w + x) * 4 + 3] > 128) pts.push(x - w / 2, y - h / 2);
  return pts;
}

/* 每字的点云（绝对画布坐标）＝ 烧屏与距离场共用同一批点 */
function buildCharPts(L) {
  const arr = [];
  const all = [];
  for (let i = 0; i < L.glyphs.length; i++) {
    const g = L.glyphs[i];
    const p = sampleChar(g.ch, L.fs);
    const abs = new Float32Array(p.length);
    for (let k = 0; k < p.length; k += 2) {
      abs[k] = g.x + p[k]; abs[k + 1] = g.y + p[k + 1];
      all.push(abs[k], abs[k + 1]);
    }
    arr.push(abs);
  }
  return { arr: arr, all: all };
}

function buildField(pts) {
  gw = Math.ceil(W / CELL) + 1; gh = Math.ceil(H / CELL) + 1;
  const n = gw * gh;
  if (!dist || dist.length !== n) { dist = new Float32Array(n); wgt = new Float32Array(n); cellT = new Float32Array(n); }
  const INF = 1e6;
  cellT.fill(Infinity);
  for (let i = 0; i < n; i++) dist[i] = INF;
  const cx = W / 2, cy = H / 2;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let i = 0; i < pts.length; i += 2) {
    const sx = pts[i], sy = pts[i + 1];            // 点云已是画布绝对坐标
    const gx = (sx / CELL) | 0, gy = (sy / CELL) | 0;
    if (gx >= 0 && gx < gw && gy >= 0 && gy < gh) dist[gy * gw + gx] = 0;
    if (sx < x0) x0 = sx; if (sx > x1) x1 = sx;
    if (sy < y0) y0 = sy; if (sy > y1) y1 = sy;
  }
  /* 两遍倒角距离变换 */
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = y * gw + x; let v = dist[i];
    if (x > 0 && dist[i - 1] + 1 < v) v = dist[i - 1] + 1;
    if (y > 0 && dist[i - gw] + 1 < v) v = dist[i - gw] + 1;
    if (x > 0 && y > 0 && dist[i - gw - 1] + 1.414 < v) v = dist[i - gw - 1] + 1.414;
    if (x < gw - 1 && y > 0 && dist[i - gw + 1] + 1.414 < v) v = dist[i - gw + 1] + 1.414;
    dist[i] = v;
  }
  for (let y = gh - 1; y >= 0; y--) for (let x = gw - 1; x >= 0; x--) {
    const i = y * gw + x; let v = dist[i];
    if (x < gw - 1 && dist[i + 1] + 1 < v) v = dist[i + 1] + 1;
    if (y < gh - 1 && dist[i + gw] + 1 < v) v = dist[i + gw] + 1;
    if (x < gw - 1 && y < gh - 1 && dist[i + gw + 1] + 1.414 < v) v = dist[i + gw + 1] + 1.414;
    if (x > 0 && y < gh - 1 && dist[i + gw - 1] + 1.414 < v) v = dist[i + gw - 1] + 1.414;
    dist[i] = v;
  }
  const SIG = 11;
  for (let i = 0; i < n; i++) {
    const t = dist[i] * CELL / SIG;
    wgt[i] = t < 3 ? Math.exp(-t * t) : 0;
  }
  fieldBox = { x0: x0, y0: y0, x1: x1, y1: y1 };
  hasField = pts.length > 0;
  /* 振幅跟着字形的包围盒走：束流必须真的会穿过笔画，否则再亮也没用 */
  const bw = Math.max(60, x1 - x0), bh = Math.max(40, y1 - y0);
  ampA = Math.max(Math.min(W, H) * 0.30, Math.min(W * 0.46, bw * 0.60));
  ampB = Math.max(Math.min(H, W) * 0.24, Math.min(H * 0.42, bh * 1.55));
  lastPts = pts;
}

/* ---- 逐字成立时刻落到距离场的格子上（束流只对已唱到的字驻留/加亮）---- */
function stampCellT() {
  if (!cellT || !lay || !ctArr) return;
  cellT.fill(Infinity);
  for (let i = 0; i < lay.glyphs.length; i++) {
    const g = lay.glyphs[i], t = ctArr[i];
    const R = Math.max(6, lay.fs * 0.5);
    const gx0 = Math.max(0, ((g.x - R) / CELL) | 0), gx1 = Math.min(gw - 1, ((g.x + R) / CELL) | 0);
    const gy0 = Math.max(0, ((g.y - R) / CELL) | 0), gy1 = Math.min(gh - 1, ((g.y + R) / CELL) | 0);
    for (let y = gy0; y <= gy1; y++) for (let x = gx0; x <= gx1; x++) {
      const i2 = y * gw + x;
      if (t < cellT[i2]) cellT[i2] = t;
    }
  }
}

function fieldAt(x, y) {
  const gx = (x / CELL) | 0, gy = (y / CELL) | 0;
  if (gx < 0 || gx >= gw || gy < 0 || gy >= gh) return 0;
  const i = gy * gw + gx;
  const w = wgt[i];
  if (w <= 0) return 0;
  return cellT[i] <= curT ? w : w * 0.22;      // 还没唱到的字只留一点冷光
}

/* ---- 烧屏：潜影（整句，42%）+ 逐字提亮（chars[k].t）---- */
function burnSetup() {
  const s = 0.5;
  const bw = Math.max(1, Math.round(W * s)), bh = Math.max(1, Math.round(H * s));
  if (!burn) burn = document.createElement('canvas');
  if (burn.width !== bw || burn.height !== bh) { burn.width = bw; burn.height = bh; }
  burnG.g = burn.getContext('2d');
  burnG.s = s;
  burnG.g.clearRect(0, 0, bw, bh);
  burnA = 0.45;
}

function burnGuide() {
  const g = burnG.g, s = burnG.s;
  if (!g || !charPts) return;
  const p = new Path2D();
  for (let i = 0; i < charPts.length; i++) {
    const a = charPts[i];
    for (let k = 0; k < a.length; k += 2) p.rect(a[k] * s, a[k + 1] * s, 1.4, 1.4);
  }
  g.fillStyle = 'rgba(128,214,178,0.40)';
  g.fill(p);
}

function burnChar(k) {
  const g = burnG.g, s = burnG.s;
  if (!g || !charPts || !charPts[k]) return;
  const a = charPts[k];
  const p = new Path2D();
  for (let i = 0; i < a.length; i += 2) p.rect(a[i] * s, a[i + 1] * s, 1.5, 1.5);
  g.fillStyle = 'rgba(206,255,226,0.96)';
  g.fill(p);
}

/* ================= 节奏：1-10 的教训固化在这里 =================
   ① 显示与酝酿分离 —— curIdx 只在句首切换，brewIdx 提前 lead 秒准备
   ② 索引单调不回退 —— 时钟在 tick 之间外推、tick 一来会往回缩一点，
      不锁单调的话句边界来回跳、同一句被反复重建
   ③ 提前量自适应 —— 快歌早开始，慢歌不提前太多
   ④ 只有拖进度条（时间明显倒退）才允许重置
   ================================================================ */
let curIdx = -1, brewIdx = -1, lastT = -1;
const LEAD = 1.3;
let pend = null, pendIdx = -1;

function brewLine(i) {
  const L = lines[i];
  const tm = charTimes(L);
  const ly = makeLayout(L.text);
  const cp = ly ? buildCharPts(ly) : { arr: [], all: [] };
  pend = { lay: ly, ct: tm.ct, yrc: tm.yrc, pts: cp.arr, all: cp.all };
  pendIdx = i;
}

function relayout() {
  if (!curLineRef) return;
  const tm = charTimes(curLineRef);
  lay = makeLayout(curLineRef.text);
  ctArr = tm.ct; curYrc = tm.yrc;
  const cp = lay ? buildCharPts(lay) : { arr: [], all: [] };
  charPts = cp.arr;
  startBurn(cp.all);
}

function startBurn(all) {
  buildField(all);
  stampCellT();
  burnSetup();
  lit = 0;
  if (charPts && charPts.length) burnGuide();
}

function startLine(i) {
  if (pendIdx !== i) brewLine(i);
  const b = pend;
  pend = null; pendIdx = -1;
  curLineRef = lines[i];
  if (!b || !b.lay) {
    lay = null; ctArr = null; curYrc = false; charPts = null;
    hasField = false; burn = null; burnA = 0; lastPts = null;
    return;
  }
  lay = b.lay; ctArr = b.ct; curYrc = b.yrc; charPts = b.pts;
  buildField(b.all);
  stampCellT();
  burnSetup();
  lit = 0;
  burnGuide();
  clearT = 0.45;                                 // 换句：余辉加快消退，把上一句烧掉的痕迹清掉
}

function timing(T) {
  curT = T;
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1;
    pend = null; pendIdx = -1; hasField = false;
    lay = null; ctArr = null; charPts = null; curLineRef = null; lit = 0;
    burn = null; burnA = 0;
    clearTrail();
  }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    if (ci >= 0) startLine(ci);
    hint.style.opacity = lines.length ? (ci >= 0 ? '0' : '1') : '0.5';
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) { brewIdx = nx; brewLine(nx); }
  }
  /* YRC：第 k 字的烧屏提亮压在 chars[k].t 上 */
  if (ctArr) while (lit < ctArr.length && T >= ctArr[lit]) { burnChar(lit); lit++; }
}

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1;
    pend = null; pendIdx = -1; hasField = false; lastPts = null;
    lay = null; ctArr = null; charPts = null; curLineRef = null; lit = 0;
    burn = null; burnA = 0;
    if (p.accent) accent = p.accent;
    clearTrail();
    clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 踩拍：三道束流一起加速（相干），不是逐点乱踢 */
    beatPulse = Math.min(1, beatPulse + 0.6 * (0.35 + (d.payload.level || 0)));
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

/* ---------------- 主循环 ---------------- */
let last = performance.now();
let t0 = 0;
/* 三档亮度。原值 COLD .075 比参考页(.38)低 5 倍 —— 束流是一条每帧都在走的细线，
   同一个像素一秒钟只被扫到几次，单帧沉积量就是这个像素的全部可见亮度，
   所以 0.075 的绿几乎等于黑（实测整屏 0.5% 采样点过亮阈值）。
   参考页单档 .38，这里按三档拉开：冷档也要能被看见，否则"全黑"。 */
const COLD = 'rgba(74,210,150,0.30)';
const WARM = 'rgba(126,246,182,0.62)';
const HOT = 'rgba(200,255,222,0.95)';

function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();
  timing(T);
  beatPulse *= Math.exp(-dt * 3.0);

  /* ---- 磷光衰减 ---- */
  tctx.globalCompositeOperation = 'source-over';
  tctx.fillStyle = clearT > 0 ? 'rgba(2,8,6,0.30)' : 'rgba(2,8,6,0.062)';
  tctx.fillRect(0, 0, W, H);
  if (clearT > 0) clearT -= dt;

  const cx = W / 2, cy = H / 2;
  const rate = 2.35 * (1 + 0.55 * beatPulse);

  /* ---- 三道束流 ---- */
  const pathC = new Path2D(), pathW = new Path2D(), pathH = new Path2D();
  let hotAny = false;

  for (let bi = 0; bi < NB; bi++) {
    const b = beams[bi];
    const a = b.a0 + 0.55 * Math.sin(t0 * 0.083 + bi * 2.1) + 0.22 * Math.sin(t0 * 0.031 + bi);
    const bb = b.b0 + 0.35 * Math.sin(t0 * 0.061 + bi * 1.3);
    b.ph += dt * (0.11 + bi * 0.037);
    const x = cx + ampA * Math.sin(a * b.u + b.ph);
    const y = cy + ampB * Math.sin(bb * b.u);
    if (!b.started) { b.started = true; b.x = x; b.y = y; }
    b.px = b.x; b.py = b.y;
    b.x = x; b.y = y;

    /* 速度被距离场拖慢：到笔画上就驻留（这就是"束流在蹭字"）*/
    const w = hasField ? fieldAt(x, y) : 0;
    const du = rate * dt * (1 - 0.88 * w);
    /* 分段数按空间步长定：束流快的时候不能画成一根直线 */
    const spd = Math.sqrt(Math.pow(ampA * a * Math.cos(a * b.u + b.ph), 2) +
                          Math.pow(ampB * bb * Math.cos(bb * b.u), 2));
    const steps = Math.max(1, Math.min(28, Math.ceil(spd * du / 6)));
    let u0 = b.u, x0 = b.px, y0 = b.py;
    for (let i = 1; i <= steps; i++) {
      const uu = u0 + du * (i / steps);
      const xx = cx + ampA * Math.sin(a * uu + b.ph);
      const yy = cy + ampB * Math.sin(bb * uu);
      const ww = hasField ? fieldAt(xx, yy) : 0;
      const p = ww > 0.45 ? pathH : (ww > 0.12 ? pathW : pathC);
      p.moveTo(x0, y0); p.lineTo(xx, yy);
      if (ww > 0.45) hotAny = true;
      x0 = xx; y0 = yy;
    }
    b.u += du;
    if (b.u > 1e6) b.u -= 1e6;
  }

  /* ---- 上磷光：3 档亮度各自一次 stroke（坑⑨⑩：绝不逐段设颜色）---- */
  tctx.globalCompositeOperation = 'lighter';
  tctx.lineWidth = 1.05;
  tctx.strokeStyle = COLD; tctx.stroke(pathC);
  tctx.strokeStyle = WARM; tctx.stroke(pathW);
  if (hotAny) {
    /* 笔画上：先一条宽而暗的晕，再一条细而亮的芯（参考页的双重描边）*/
    tctx.lineWidth = 5.0; tctx.strokeStyle = 'rgba(60,255,150,0.045)'; tctx.stroke(pathH);
    tctx.lineWidth = 1.25; tctx.strokeStyle = HOT; tctx.stroke(pathH);
  }

  /* ---- 合成 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(trail, 0, 0, W, H);

  /* ---- 字形烧屏：换句后 ~0.1 秒内亮起来（带底线，不能有一段"看不见字"的空窗），
         之后稳在屏上微微起伏。潜影 42% + 逐字烧亮 —— 整句始终可读，唱到哪个字
         哪个字就更亮一档，这就是 YRC 的"成立"。 ---- */
  const parX = Math.sin(t0 * 0.052) * 7, parY = Math.cos(t0 * 0.041) * 5;   // 镜头视差
  if (burn) {
    burnA = Math.min(1, burnA + dt * 6);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.52 * (0.34 + 0.66 * burnA) * (0.90 + 0.10 * Math.sin(t0 * 1.7));
    ctx.drawImage(burn, parX, parY, W, H);
    ctx.globalAlpha = 1;
  }

  /* 束流头部光斑 */
  ctx.globalCompositeOperation = 'lighter';
  for (let bi = 0; bi < NB; bi++) {
    const b = beams[bi];
    const w = hasField ? fieldAt(b.x, b.y) : 0;
    const s = 26 + 40 * w;
    ctx.drawImage(dotSprite, b.x - s, b.y - s, s * 2, s * 2);
    ctx.fillStyle = 'rgba(238,255,246,' + (0.55 + 0.4 * w).toFixed(2) + ')';
    ctx.fillRect(b.x - 1.4, b.y - 1.4, 2.8, 2.8);
  }

  if (beatPulse > 0.01) {
    ctx.fillStyle = 'rgba(' + Math.min(255, accent[0] * 0.4 + 60) + ',' +
                    Math.min(255, accent[1] * 0.7 + 60) + ',' + Math.min(255, accent[2] * 0.5 + 40) + ',' +
                    (0.030 * beatPulse).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

window.__stage = () => ({
  lines: lines.length, curIdx: curIdx, brewIdx: brewIdx, hasField: hasField,
  yrc: !!curYrc, lit: lit, rows: lay ? lay.rowInfo.length : 0, fs: lay ? lay.fs : 0,
  chars: ctArr ? ctArr.length : 0, T: +now().toFixed(2),
  beam: beams.map((b) => [+b.x.toFixed(0), +b.y.toFixed(0)])
});
</script>
</body>
</html>
