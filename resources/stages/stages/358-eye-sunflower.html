<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>眼睛向日葵</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#eef7f8;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;
       filter:saturate(1.06) contrast(1.02);}
  #grain,#scan{position:fixed;inset:-12%;pointer-events:none;z-index:1;}
  #grain{opacity:.34;mix-blend-mode:soft-light;background-repeat:repeat;
       animation:gr 0.6s steps(1) infinite;}
  #scan{opacity:.38;background:repeating-linear-gradient(0deg,rgba(50,40,32,.10) 0 1px,rgba(0,0,0,0) 1px 4px);
       animation:sc 7s linear infinite;}
  @keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-37px,23px)}
       50%{transform:translate(19px,-41px)}75%{transform:translate(-11px,-17px)}
       100%{transform:translate(0,0)}}
  @keyframes sc{0%{transform:translateY(0)}100%{transform:translateY(8px)}}
  @media (prefers-reduced-motion: reduce){#grain,#scan{animation:none;}}
  #lyr{position:fixed;inset:auto 0 0 0;bottom:8.5vh;display:flex;flex-direction:column;
       align-items:center;gap:.5em;pointer-events:none;padding:0 5vw;box-sizing:border-box;
       font-family:"Bookman Old Style",Georgia,"Songti SC","SimSun",serif;text-align:center;
       z-index:2;}
  #lyr::before{content:"";position:absolute;left:0;right:0;bottom:-8.5vh;height:40vh;
       background:radial-gradient(120% 92% at 50% 80%,rgba(255,253,244,.86) 0%,rgba(255,253,244,.46) 45%,rgba(255,253,244,0) 100%);
       z-index:-1;pointer-events:none;}
  #prev{font-size:clamp(12px,1.35vw,20px);letter-spacing:.08em;color:#4a4139;opacity:.36;
       filter:blur(2.4px);transform:scaleY(.94);white-space:nowrap;overflow:hidden;max-width:86vw;
       text-overflow:clip;}
  #cur{font-weight:600;line-height:1.22;color:#241f1c;max-width:80vw;box-sizing:border-box;
       letter-spacing:.015em;transform:rotate(-.55deg) scaleY(.9);transform-origin:50% 55%;
       text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 26px rgba(255,252,240,.95),
                   2px 0 rgba(84,206,255,.38),-2px 0 rgba(255,102,186,.32);
       white-space:pre-wrap;word-break:break-word;
       background:linear-gradient(180deg,rgba(255,253,244,.66),rgba(255,249,236,.50));
       padding:.10em .40em;border-radius:2px;
       box-shadow:0 2px 20px rgba(96,74,52,.10);}
  #cur .ch{opacity:.32;color:#5b5248;
       text-shadow:0 1px 0 rgba(255,255,255,.85),2px 0 rgba(84,206,255,.28),-2px 0 rgba(255,102,186,.24);
       transition:opacity .16s linear,color .16s linear;}
  #cur .ch.on{opacity:1;color:#1d1915;
       text-shadow:0 1px 0 rgba(255,255,255,.9),2px 0 rgba(84,206,255,.42),-2px 0 rgba(255,102,186,.36);}
  #empty{font-size:clamp(13px,1.5vw,20px);letter-spacing:.16em;color:#6b6157;opacity:.72;
       transform:scaleY(.92);}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="grain"></div>
<div id="scan"></div>
<div id="lyr"></div>
<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),lyrEl=document.getElementById('lyr');
  var W=1440,H=900,dpr=1;
  var S={t:0,playing:true,idx:-1,lines:[],dur:0,frames:0,js:0,gl:false,err:'',text:''};
  var readySent=false,rm=false,hasInit=false;
  try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){rm=false;}

  var bg=document.createElement('canvas'), bgx=bg.getContext('2d');
  var LAY={}, CLOUDS=[], MARKS=[], ANGELS=[], STARS=[];
  var beatPulse=0, liveLv=0, liveBass=0, liveTreb=0, bpm=92;

  function clamp(v,a,b){v=+v;if(!isFinite(v))v=a;return v<a?a:(v>b?b:v);}
  function ch(v){v=Math.round(+v);if(!isFinite(v))v=0;return v<0?0:(v>255?255:v);}
  function C(r,g,b,a){a=(a==null?1:+a);a=Math.round(clamp(a,0,1)*1000)/1000;
    return 'rgba('+ch(r)+','+ch(g)+','+ch(b)+','+a+')';}
  function addStops(g,stops){
    var i;
    for(i=0;i<stops.length;i++){
      try{ g.addColorStop(clamp(stops[i][0],0,1),stops[i][1]); }catch(e){}
    }
  }
  function LGR(c,x0,y0,x1,y1,stops){
    try{ var g=c.createLinearGradient(x0,y0,x1,y1); addStops(g,stops); return g; }
    catch(e){ return 'rgba(247,251,239,1)'; }
  }
  function RGR(c,x,y,r0,r1,stops){
    try{ var g=c.createRadialGradient(x,y,Math.max(0,r0),x,y,Math.max(r0+0.01,r1)); addStops(g,stops); return g; }
    catch(e){ return 'rgba(255,255,255,0.12)'; }
  }
  function srng(s){ return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
  function ell(c,x,y,rx,ry,rot){ c.beginPath(); c.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot||0,0,Math.PI*2); }
  function post(m){try{parent.postMessage(m,'*');}catch(e){}}
  function sendReady(){ if(readySent)return; readySent=true; post({__c100:1,type:'ready'}); }

  function layout(){
    var land=W>=H*0.92;
    LAY.land=land;
    LAY.horizon=land?H*0.665:H*0.60;
    LAY.sunX=W*0.80; LAY.sunY=H*(land?0.175:0.135);
    LAY.sunR=Math.min(W,H)*(land?0.075:0.135);
    if(land){
      LAY.flower={x:W*0.715,y:H*0.44,r:Math.min(W*0.17,H*0.265)};
      LAY.tv={x:W*0.205,y:H*0.545,s:Math.min(W,H)*0.20};
      LAY.stairs={x:W*0.275,y:H*0.575,w:Math.min(W,H)*0.29};
    }else{
      LAY.flower={x:W*0.64,y:H*0.29,r:Math.min(W*0.335,H*0.148)};
      LAY.tv={x:W*0.235,y:H*0.50,s:Math.min(W,H)*0.215};
      LAY.stairs={x:W*0.44,y:H*0.585,w:Math.min(W,H)*0.30};
    }
  }

  function buildStuff(){
    var r=srng(7),i;
    CLOUDS.length=0;
    for(i=0;i<7;i++)CLOUDS.push({x:r(),y:r()*0.82,s:0.55+r()*0.9,o:0.3+r()*0.42});
    var m=srng(31);
    MARKS.length=0;
    for(i=0;i<64;i++)MARKS.push({x:m(),y:m(),s:0.4+m()*1.2,h:m()});
    var a=srng(99);
    ANGELS.length=0;
    for(i=0;i<6;i++)ANGELS.push({x:a(),y:a()*0.7,sc:0.7+a()*0.8,ph:a()*6.283,gl:a()>0.45});
    var s2=srng(101);
    STARS.length=0;
    for(i=0;i<24;i++)STARS.push({x:s2(),y:s2()*0.85,ph:s2()*6.283,sz:0.5+s2()*1.3});
  }

  function paintBG(){
    var w=W,h=H,hy=LAY.horizon,i;
    bg.width=Math.max(2,Math.round(w*dpr)); bg.height=Math.max(2,Math.round(h*dpr));
    bgx.setTransform(dpr,0,0,dpr,0,0);
    bgx.clearRect(0,0,w,h);
    bgx.fillStyle=LGR(bgx,0,0,0,hy,[[0,'#a9e3f3'],[0.42,'#d5f0f6'],[0.78,'#f4fbef'],[1,'#fffdf2']]);
    bgx.fillRect(0,0,w,hy+1);
    var sx=LAY.sunX,sy=LAY.sunY,sr=LAY.sunR;
    bgx.fillStyle=RGR(bgx,sx,sy,sr*0.1,sr*9,[[0,'rgba(255,253,232,0.95)'],[0.18,'rgba(255,252,226,0.5)'],[0.5,'rgba(255,251,226,0.15)'],[1,'rgba(255,251,232,0)']]);
    bgx.fillRect(0,0,w,hy+1);
    bgx.fillStyle=C(255,110,190,0.5); ell(bgx,sx+sr*0.055,sy-sr*0.035,sr,sr,0); bgx.fill();
    bgx.fillStyle=C(90,225,255,0.45); ell(bgx,sx-sr*0.055,sy+sr*0.035,sr,sr,0); bgx.fill();
    bgx.fillStyle='#fffef8'; ell(bgx,sx,sy,sr*0.985,sr*0.985,0); bgx.fill();
    for(i=0;i<CLOUDS.length;i++){
      var cl=CLOUDS[i], cx=cl.x*w, cy=cl.y*hy*0.94, cr=Math.min(w,h)*0.115*cl.s;
      bgx.globalAlpha=cl.o;
      bgx.fillStyle=RGR(bgx,cx,cy,0,cr*1.6,[[0,'rgba(255,255,255,0.9)'],[0.5,'rgba(255,255,253,0.45)'],[1,'rgba(255,255,255,0)']]);
      ell(bgx,cx,cy,cr*2.0,cr*0.6,0); bgx.fill();
      ell(bgx,cx-cr*0.5,cy+cr*0.2,cr*1.1,cr*0.5,0); bgx.fill();
    }
    bgx.globalAlpha=1;

    var pv=srng(77), pw=w*(LAY.land?0.235:0.40), ph=pw*0.72;
    var px=LAY.land?w*0.435:w*0.36, py=LAY.land?hy*0.30:hy*0.26;
    bgx.save();
    bgx.translate(px,py); bgx.rotate(-0.085);
    bgx.fillStyle='rgba(80,60,45,0.10)';
    bgx.fillRect(-pw/2+6,-ph/2+10,pw+10,ph+8);
    bgx.fillStyle='rgba(255,253,244,0.92)';
    bgx.fillRect(-pw/2-6,-ph/2-6,pw+12,ph+12);
    bgx.fillStyle=LGR(bgx,0,-ph/2,0,ph/2,[[0,'#101a3f'],[0.5,'#2c2a63'],[1,'#513a68']]);
    bgx.fillRect(-pw/2,-ph/2,pw,ph);
    var si;
    for(si=0;si<46;si++){
      var sxp=-pw/2+pv()*pw, syp=-ph/2+pv()*ph;
      var sr2=Math.max(0.5,(0.4+pv()*1.3)*Math.max(1,pw*0.006));
      bgx.fillStyle='rgba(255,250,226,'+(0.3+pv()*0.6).toFixed(2)+')';
      bgx.beginPath(); bgx.arc(sxp,syp,sr2,0,Math.PI*2); bgx.fill();
    }
    var mx=pw*0.24, my=-ph*0.2, mr=ph*0.115;
    bgx.fillStyle=RGR(bgx,mx,my,0,mr*2.8,[[0,'rgba(255,246,210,0.45)'],[1,'rgba(255,246,210,0)']]);
    bgx.beginPath(); bgx.arc(mx,my,mr*2.8,0,Math.PI*2); bgx.fill();
    bgx.fillStyle='rgba(255,248,220,0.96)';
    bgx.beginPath(); bgx.arc(mx,my,mr,0,Math.PI*2); bgx.fill();
    bgx.fillStyle='rgba(255,255,250,0.5)';
    bgx.save(); bgx.translate(-pw/2,-ph/2); bgx.rotate(-0.55);
    bgx.fillRect(-pw*0.14,-pw*0.03,pw*0.28,pw*0.06); bgx.restore();
    bgx.save(); bgx.translate(pw/2,ph/2); bgx.rotate(-0.55);
    bgx.fillRect(-pw*0.14,-pw*0.03,pw*0.28,pw*0.06); bgx.restore();
    bgx.restore();

    bgx.fillStyle=LGR(bgx,0,hy-h*0.15,0,hy+1,[[0,'rgba(255,255,246,0)'],[1,'rgba(255,255,249,0.94)']]);
    bgx.fillRect(0,hy-h*0.15,w,h*0.15+1);
    bgx.fillStyle=LGR(bgx,0,hy,0,h,[[0,'#eaf3b6'],[0.3,'#d3e79d'],[1,'#b3d07f']]);
    bgx.fillRect(0,hy,w,h-hy);
    var n=9, sw=w/n;
    for(i=0;i<n;i+=2){
      bgx.fillStyle='rgba(255,255,240,0.17)';
      bgx.beginPath(); bgx.moveTo(i*sw,hy); bgx.lineTo((i+1)*sw,hy);
      bgx.lineTo((i+1)*sw+sw*0.55,h); bgx.lineTo(i*sw+sw*0.55,h); bgx.closePath(); bgx.fill();
    }
    for(i=0;i<MARKS.length;i++){
      var mk=MARKS[i], mx=mk.x*w, my=hy+(h-hy)*mk.y, ml=(h-hy)*0.06*mk.s;
      bgx.strokeStyle=mk.h>0.55?C(120,150,80,0.18):C(255,255,235,0.4);
      bgx.lineWidth=Math.max(0.7,Math.min(w,h)*0.0016);
      bgx.beginPath(); bgx.moveTo(mx,my); bgx.lineTo(mx+ml*0.18,my-ml); bgx.stroke();
    }
    bgx.fillStyle=LGR(bgx,0,hy-1,0,hy+Math.max(14,(h-hy)*0.1),[[0,'rgba(255,255,250,0.9)'],[1,'rgba(255,255,250,0)']]);
    bgx.fillRect(0,hy-1,w,Math.max(14,(h-hy)*0.1));
  }

  function resize(){
    var w=Math.round(window.innerWidth||document.documentElement.clientWidth||0);
    var h=Math.round(window.innerHeight||document.documentElement.clientHeight||0);
    if(!isFinite(w)||w<2)w=1440; if(!isFinite(h)||h<2)h=900;
    W=w;H=h; dpr=Math.min(2,Math.max(1,window.devicePixelRatio||1));
    cv.width=Math.max(2,Math.round(W*dpr)); cv.height=Math.max(2,Math.round(H*dpr));
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled=true;
    buildStuff(); layout(); paintBG(); buildOverlayTextures();
    VIGN=RGR(ctx,W*0.5,H*0.46,Math.min(W,H)*0.34,Math.max(W,H)*0.85,
      [[0,'rgba(90,70,50,0)'],[0.60,'rgba(90,70,50,0.02)'],[1,'rgba(84,62,44,0.26)']]);
    LEAK=RGR(ctx,0,0,0,Math.min(W,H)*0.66,
      [[0,'rgba(255,226,180,0.34)'],[0.45,'rgba(255,240,200,0.11)'],[1,'rgba(255,255,255,0)']]);
    ANGEL_SPRITES=[
      makeAngelSprite('#fff3f8','rgba(255,180,225,0.95)'),
      makeAngelSprite('#fbf7ff','rgba(150,228,255,0.95)'),
      makeAngelSprite('#ffedcf','rgba(255,214,150,0.95)')
    ];
  }

  function normalizeLines(raw){
    if(!raw||typeof raw.length!=='number')return [];
    var out=[],i,n=Math.min(raw.length,1200);
    for(i=0;i<n;i++){
      var L=raw[i]||{};
      var txt=(L.text==null)?'':String(L.text);
      if(!txt.replace(/\s+/g,'')){ out.push({t:0,dur:0,text:'',chars:null}); continue; }
      var t=+L.t, d=+L.dur;
      if(!isFinite(t))t=0; if(!isFinite(d)||d<0)d=0;
      var cs=null;
      if(L.chars&&typeof L.chars.length==='number'&&L.chars.length){
        cs=[]; var m=Math.min(L.chars.length,2000);
        for(var j=0;j<m;j++){
          var c=L.chars[j]||{};
          cs.push({c:(c.c==null?'':String(c.c)), t:isFinite(+c.t)?+c.t:t});
        }
      }
      out.push({t:t,dur:d,text:txt,chars:cs});
    }
    return out;
  }

  var LY={cur:null,prev:null,spans:[],times:[],lineIdx:-2,charN:0,text:'',scale:1};

  function on(id){ return document.getElementById(id); }

  function lyricSkeleton(){
    var has=hasInit&&faLyrCount()>0;
    if(!hasInit){ lyrEl.innerHTML=''; }
    else lyrEl.innerHTML= has ? '<div id="prev"></div><div id="cur"></div>'
                              : '<div id="empty">这首歌没有歌词</div>';
    LY.cur=on('cur'); LY.prev=on('prev'); LY.spans=[]; LY.times=[]; LY.lineIdx=-2; LY.charN=0; LY.text='';
  }

  function faLyrCount(){
    var i,n=0;
    for(i=0;i<S.lines.length;i++){ if(S.lines[i]&&S.lines[i].text)n++; }
    return n;
  }

  function idxAt(t){
    var i,idx=-1;
    for(i=0;i<S.lines.length;i++){ if(S.lines[i].t<=t+0.06)idx=i; }
    return idx;
  }

  function applyInit(p){
    p=p||{};
    hasInit=true;
    S.lines=normalizeLines(p.lines);
    S.dur=isFinite(+p.duration)?Math.max(0,+p.duration):0;
    if(typeof p.playing==='boolean')S.playing=p.playing; else S.playing=true;
    if(!isFinite(S.t))S.t=0;
    if(S.dur>0&&S.t>S.dur)S.t=0;
    S.idx=idxAt(S.t);
    S.text=(S.idx>=0&&S.lines[S.idx])?S.lines[S.idx].text:'';
    lyricSkeleton();
    LY.lineIdx=-2;
    renderLyric();
  }

  function applyTime(time){
    if(!isFinite(time))return;
    S.t=time;
    var ni=idxAt(time);
    if(ni!==S.idx){ S.idx=ni; S.text=(ni>=0&&S.lines[ni])?S.lines[ni].text:''; }
  }

  function fitCur(){
    if(!LY.cur)return;
    LY.cur.style.maxWidth='80vw';
    var base=Math.round(clamp(Math.min(W*0.037,H*0.056),19,60));
    LY.cur.style.fontSize=base+'px';
    for(var k=0;k<10;k++){
      if(LY.cur.scrollHeight<=H*0.34)break;
      base=Math.max(15,Math.round(base*0.86));
      LY.cur.style.fontSize=base+'px';
    }
    if(LY.cur.scrollWidth>W*0.86){
      LY.cur.style.maxWidth='92vw';
      for(var q=0;q<8;q++){
        if(LY.cur.scrollWidth<=W*0.92)break;
        base=Math.max(14,Math.round(base*0.9));
        LY.cur.style.fontSize=base+'px';
      }
    }
  }

  function buildLine(L){
    var txt=L.text||'';
    LY.text=txt;
    if(!txt){ LY.cur.textContent=''; LY.spans=[]; LY.times=[]; LY.charN=0; return; }
    var n=txt.length, times=new Array(n), j;
    if(L.chars&&L.chars.length){
      var cm=L.chars.length;
      for(j=0;j<n;j++){
        var ci=Math.floor(j*cm/n);
        if(ci>=cm)ci=cm-1;
        times[j]=L.chars[ci].t;
      }
    }else{
      var d=(L.dur&&L.dur>0.15)?L.dur:2.6;
      for(j=0;j<n;j++)times[j]=L.t+d*(j/n);
    }
    LY.times=times;
    if(n>380){ LY.cur.textContent=txt; LY.spans=[]; LY.charN=0; fitCur(); return; }
    var frag=document.createDocumentFragment(),arr=[];
    for(var i=0;i<n;i++){
      var sp=document.createElement('span');
      sp.className='ch'; sp.textContent=txt.charAt(i);
      frag.appendChild(sp); arr.push(sp);
    }
    LY.cur.innerHTML=''; LY.cur.appendChild(frag);
    LY.spans=arr; LY.charN=0;
    fitCur();
    LY.cur.style.transition='none';
    LY.cur.style.opacity='0';
    if(LY.cur.offsetHeight>=0){ LY.cur.style.transition='opacity .2s ease-out'; LY.cur.style.opacity='1'; }
  }

  function renderLyric(){
    if(!LY.cur)return;
    var idx=S.idx;
    if(idx!==LY.lineIdx){
      LY.lineIdx=idx;
      if(idx<0||!S.lines[idx]){
        if(LY.cur)LY.cur.textContent='';
        if(LY.prev)LY.prev.textContent='';
        LY.spans=[]; LY.times=[]; LY.charN=0; LY.text='';
        return;
      }
      var L=S.lines[idx],p='',k;
      for(k=idx-1;k>=0;k--){ if(S.lines[k]&&S.lines[k].text){p=S.lines[k].text;break;} }
      if(LY.prev)LY.prev.textContent=p;
      buildLine(L);
      var tn=performance.now()*0.001;
      if(EYE&&tn-EYE.blinkAt>1.3){ EYE.blinkAt=tn; EYE.next=tn+3.8+Math.random()*2.2; }
    }
    var L2=S.lines[idx];
    if(!L2||!LY.spans.length)return;
    var tt=S.t, tl=LY.times.length, m=0, i;
    for(i=0;i<tl;i++){ if(LY.times[i]<=tt+0.001)m=i+1; else break; }
    if(m>LY.spans.length)m=LY.spans.length;
    if(m<0)m=0;
    if(m>LY.charN){ for(i=LY.charN;i<m;i++)LY.spans[i].classList.add('on'); }
    else if(m<LY.charN){ for(i=m;i<LY.charN;i++)LY.spans[i].classList.remove('on'); }
    LY.charN=m;
    var sc=1+beatPulse*0.018;
    if(Math.abs(sc-(LY.scale||1))>0.003){
      LY.scale=sc;
      LY.cur.style.transform='rotate(-.55deg) scaleY(.9) scale('+sc.toFixed(3)+')';
    }
  }

  window.addEventListener('message',function(e){
    var m=e.data; if(!m||m.__c100!==1)return;
    try{
      if(m.type==='init'){ applyInit(m.payload); }
      else if(m.type==='tick'){ var tp=m.payload||{}; applyTime(+tp.time);
        if(typeof tp.playing==='boolean')S.playing=tp.playing; }
      else if(m.type==='beat'){ var bp=m.payload||{}; var bl=+bp.level;
        if(isFinite(bl))beatPulse=Math.max(beatPulse,0.3+clamp(bl,0,1)*0.7); }
      else if(m.type==='live'){ var lp=m.payload||{};
        if(isFinite(+lp.bpm)&&+lp.bpm>0)bpm=+lp.bpm;
        liveLv=clamp(lp.level,0,1); liveBass=clamp(lp.bass,0,1); liveTreb=clamp(lp.treble,0,1); }
    }catch(err){ S.err=String(err&&err.message||err); }
  });

  /* ---------- 主视觉：长眼睛的向日葵 ---------- */
  var EYE={blinkAt:1.6,next:2.4,lookX:0,lookY:0,tx:0,ty:0,nextLook:1.2,lastLook:0};

  function updateEye(clk){
    if(clk>EYE.nextLook){
      EYE.nextLook=clk+2.2+Math.random()*3.2;
      EYE.tx=(Math.random()*2-1)*0.75;
      EYE.ty=(Math.random()*2-1)*0.4;
      if(Math.random()<0.4){ EYE.tx*=0.25; EYE.ty=0.62; }
    }
    var k=rm?0.5:0.055;
    EYE.lookX+=(EYE.tx-EYE.lookX)*k;
    EYE.lookY+=(EYE.ty-EYE.lookY)*k;
  }

  function drawHaze(clk){
    if(rm)return;
    var hy=LAY.horizon,i;
    for(i=0;i<3;i++){
      var off=Math.sin(clk*0.7+i*1.9)*H*0.006*(1+liveBass*1.6);
      ctx.strokeStyle=C(255,255,250,0.06+liveBass*0.08);
      ctx.lineWidth=Math.max(2,H*0.012);
      ctx.beginPath();
      ctx.moveTo(-20,hy-off);
      ctx.bezierCurveTo(W*0.3,hy-off-H*0.012,W*0.65,hy-off+H*0.012,W+20,hy-off);
      ctx.stroke();
    }
  }

  function drawFlower(clk){
    var f=LAY.flower,R=f.r;
    if(!R||!isFinite(R))return;
    var sway=rm?0.004:(Math.sin(clk*0.53)*0.02*(1+liveBass*0.8)+Math.sin(clk*1.31+1.2)*0.006);
    var cx=f.x, cy=f.y+Math.sin(clk*0.61)*R*0.02;
    var stemTop=cx-R*0.02;

    ctx.save();
    ctx.lineCap='round';
    ctx.strokeStyle=C(139,186,96,1);
    ctx.lineWidth=Math.max(3,R*0.085);
    ctx.beginPath();
    ctx.moveTo(stemTop,cy+R*0.42);
    ctx.quadraticCurveTo(cx-R*0.3,LAY.horizon-R*0.55,stemTop-R*0.06,LAY.horizon+H*0.055);
    ctx.stroke();
    ctx.strokeStyle=C(255,255,255,0.22); ctx.lineWidth=Math.max(1,R*0.024);
    ctx.beginPath();
    ctx.moveTo(stemTop-R*0.02,cy+R*0.42);
    ctx.quadraticCurveTo(cx-R*0.32,LAY.horizon-R*0.55,stemTop-R*0.09,LAY.horizon+H*0.05);
    ctx.stroke();

    leaf(cx-R*0.26,LAY.horizon-R*0.2,R*0.34,-0.5,true);
    leaf(cx-R*0.12,LAY.horizon+R*0.12,R*0.28,-0.15,false);

    ctx.save();
    ctx.globalAlpha=0.14;
    ctx.fillStyle=C(74,102,42,1);
    ctx.beginPath(); ell(ctx,stemTop-R*0.06,LAY.horizon+H*0.055,R*0.30,R*0.055,0); ctx.fill();
    ctx.restore();

    ctx.translate(cx,cy);
    ctx.rotate(sway);

    var n1=22,n2=15,i,a,pet;
    for(pet=0;pet<2;pet++){
      var n=pet?n2:n1, ringR=R*(pet?0.42:0.48), len=R*(pet?0.44:0.56), wid=R*(pet?0.085:0.105);
      for(i=0;i<n;i++){
        a=i/n*Math.PI*2+pet*0.19+sway*1.4;
        var jit=Math.sin(i*2.3+pet)*0.02;
        var grow=1+beatPulse*0.06*(pet?0.6:1);
        ctx.save();
        ctx.rotate(a+jit);
        ctx.fillStyle=LGR(ctx,0,-ringR,0,-ringR-len,
          [[0,'#f6cf4f'],[0.55,'#f8dd6b'],[1,'#f2b93c']]);
        ctx.beginPath(); ell(ctx,0,-(ringR+len*0.5*grow),wid,wid*2.7*grow,0); ctx.fill();
        ctx.strokeStyle=C(184,134,44,0.38); ctx.lineWidth=Math.max(0.8,R*0.009); ctx.stroke();
        ctx.restore();
      }
    }

    ctx.fillStyle=C(233,197,157,1);
    ctx.beginPath(); ctx.arc(0,0,R*0.545,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=RGR(ctx,0,0,R*0.2,R*0.56,[[0,'rgba(240,210,176,0.9)'],[1,'rgba(228,188,146,0.95)']]);
    ctx.beginPath(); ctx.arc(0,0,R*0.545,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C(178,132,96,0.4); ctx.lineWidth=Math.max(1,R*0.012); ctx.stroke();

    drawEye(clk,R*0.52,R*0.44);

    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.lineWidth=Math.max(1,R*0.011);
    ctx.strokeStyle='rgba(255,70,160,0.15)';
    ctx.save(); ctx.translate(R*0.014,-R*0.009); eyePath(R*0.52,R*0.42); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='rgba(70,220,255,0.13)';
    ctx.save(); ctx.translate(-R*0.014,R*0.009); eyePath(R*0.52,R*0.42); ctx.stroke(); ctx.restore();
    ctx.restore();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha=0.6;
    var bloom=RGR(ctx,f.x,f.y,R*0.25,R*2.1,[[0,'rgba(255,255,245,0.20)'],[1,'rgba(255,255,245,0)']]);
    ctx.fillStyle=bloom;
    ctx.beginPath(); ctx.arc(f.x,f.y,R*2.1,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function leaf(x,y,s,rot,up){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot);
    ctx.fillStyle=LGR(ctx,-s,-s*0.5,s,s*0.5,[[0,'#a4cc74'],[1,'#7fae56']]);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-s*0.5,-s*0.55*(up?-1:1),0,-s*(up?1.15:0.95));
    ctx.quadraticCurveTo(s*0.5,-s*0.55*(up?-1:1),0,0);
    ctx.fill();
    ctx.strokeStyle=C(96,128,66,0.5); ctx.lineWidth=Math.max(0.9,s*0.03); ctx.stroke();
    ctx.restore();
  }

  function drawEye(clk,rx,ry){
    var eb=eyeBlink(clk);
    var gazeX=EYE.lookX*0.55+Math.sin(clk*0.37)*0.08;
    var gazeY=EYE.lookY*0.5+Math.sin(clk*0.29+1.1)*0.05;
    var openK=1-eb*0.96;

    ctx.save();
    var sclera=LGR(ctx,0,-ry,0,ry,[[0,'rgba(215,226,220,0.95)'],[0.35,'#fdfaf2'],[1,'#f4ece0']]);
    ctx.fillStyle=sclera;
    eyePath(rx,ry*openK);
    ctx.fill();
    ctx.strokeStyle=C(92,66,58,0.55); ctx.lineWidth=Math.max(1,rx*0.022); ctx.stroke();

    if(openK>0.22){
      ctx.save();
      eyePath(rx,ry*openK);
      ctx.clip();
      var vk;
      for(vk=0;vk<5;vk++){
        var vx=(vk<2?-1:1)*rx*(0.52+vk*0.07);
        ctx.strokeStyle=C(206,116,106,0.18);
        ctx.lineWidth=Math.max(0.6,rx*0.009);
        ctx.beginPath();
        ctx.moveTo(vx,-ry*0.5);
        ctx.quadraticCurveTo(vx*0.7,-ry*0.05,vx*0.92,ry*0.5);
        ctx.stroke();
      }
      var ix=rx*0.06+gazeX*rx*0.3, iy=gazeY*ry*0.3;
      var ir=rchr(rx*0.5,ry*0.55)*(1-beatPulse*0.06);
      var iris=RGR(ctx,ix,iy,ir*0.15,ir,[[0,'#8fd0bd'],[0.55,'#4a9687'],[0.88,'#2c6f6c'],[1,'#204f52']]);
      ctx.fillStyle=iris;
      ctx.beginPath(); ctx.arc(ix,iy,ir,0,Math.PI*2); ctx.fill();
      var k;
      for(k=0;k<26;k++){
        var aa=k/26*Math.PI*2, lr=ir*(0.45+0.55*((k*37)%11)/11);
        ctx.strokeStyle=C(30,80,80,0.16); ctx.lineWidth=Math.max(0.5,rx*0.008);
        ctx.beginPath();
        ctx.moveTo(ix+Math.cos(aa)*ir*0.28,iy+Math.sin(aa)*ir*0.28);
        ctx.lineTo(ix+Math.cos(aa)*lr,iy+Math.sin(aa)*lr); ctx.stroke();
      }
      ctx.fillStyle='rgba(18,26,24,0.92)';
      ctx.beginPath(); ctx.arc(ix,iy,ir*0.46,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(ix-ir*0.34,iy-ir*0.36,ir*0.19,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(ix+ir*0.3,iy+ir*0.32,ir*0.09,0,Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.strokeStyle=C(38,60,58,0.85); ctx.lineWidth=Math.max(1,rx*0.03);
      ctx.beginPath(); ctx.ellipse(0,0,rx*0.97,ry*openK*0.97,0,0,Math.PI*2); ctx.stroke();
    }

    if(eb>0.55){
      ctx.strokeStyle=C(74,52,44,0.9);
      ctx.lineWidth=Math.max(1.6,rx*0.05);
      ctx.beginPath();
      ctx.moveTo(-rx*0.72,-ry*0.05);
      ctx.quadraticCurveTo(0,ry*0.16*(eb-0.4),rx*0.72,-ry*0.05);
      ctx.stroke();
    }

    ctx.fillStyle='rgba(120,74,60,0.16)';
    ctx.beginPath(); ell(ctx,0,-ry*0.55,rx*0.92,ry*0.35,0); ctx.fill();

    ctx.strokeStyle=C(50,35,32,0.85);
    ctx.lineWidth=Math.max(1.4,rx*0.045);
    var k2,m=Math.max(8,Math.round(rx*0.28));
    for(k2=0;k2<=m;k2++){
      var px=-rx*0.85+ (k2/m)*rx*1.7;
      var py=-Math.sqrt(Math.max(0,1-(px/rx)*(px/rx)))*ry*0.9;
      ctx.beginPath();
      ctx.moveTo(px,py+ry*0.1);
      ctx.quadraticCurveTo(px*1.02,py-ry*0.16,px*1.05+rx*0.03,py-ry*0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function eyePath(rx,ry){
    ctx.beginPath();
    ctx.moveTo(-rx,0);
    ctx.bezierCurveTo(-rx*0.55,-ry*1.12,rx*0.55,-ry*1.12,rx,0);
    ctx.bezierCurveTo(rx*0.55,ry*1.02,-rx*0.55,ry*1.02,-rx,0);
    ctx.closePath();
  }

  function rchr(a,b){ return Math.max(1,Math.min(a,b)); }

  function eyeBlink(clk){
    if(rm)return 0;
    if(clk>EYE.next){ EYE.blinkAt=clk; EYE.next=clk+3.4+Math.abs(Math.sin(clk*1.7))*2.6; }
    var bt=clk-EYE.blinkAt;
    if(bt<0||bt>0.34)return 0;
    if(bt<0.09)return bt/0.09;
    if(bt<0.15)return 1;
    return Math.max(0,(0.34-bt)/0.19);
  }

  /* ---------- 彩虹阶梯 ---------- */
  function drawStairs(clk){
    var st=LAY.stairs; if(!st||!st.w)return;
    var w=st.w, n=9, tw=w*0.16, th=w*0.072, run=w*0.115, rise=w*0.084;
    var dx=-w*0.055, dy=-w*0.035;
    var cols=[[255,178,206],[255,206,170],[249,239,157],[183,233,175],[164,219,240],[189,186,243],[228,175,232]];
    ctx.save();
    ctx.translate(st.x,st.y);
    ctx.rotate(-0.10);
    ctx.fillStyle=RGR(ctx,w*0.7,-w*0.45,0,w*1.2,[[0,'rgba(255,252,255,0.5)'],[1,'rgba(255,252,255,0)']]);
    ctx.fillRect(-w*0.4,-w*1.25,w*2.0,w*1.7);
    var i,c,baseY=Math.sin(clk*0.8)*w*0.012;
    for(i=n-1;i>=0;i--){
      var x=i*run, y=-i*rise+baseY+Math.sin(clk*0.9+i*0.5)*w*0.008;
      c=cols[i%cols.length];
      var topF=C(c[0]+16,c[1]+14,c[2]+8,0.95);
      var frontF=C(c[0],c[1],c[2],0.96);
      var sideF=C(c[0]-46,c[1]-44,c[2]-34,0.95);
      ctx.fillStyle=sideF;
      ctx.beginPath(); ctx.moveTo(x+tw,y); ctx.lineTo(x+tw+dx,y+dy);
      ctx.lineTo(x+tw+dx,y+dy+th); ctx.lineTo(x+tw,y+th); ctx.closePath(); ctx.fill();
      ctx.fillStyle=frontF;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+tw,y);
      ctx.lineTo(x+tw,y+th); ctx.lineTo(x,y+th); ctx.closePath(); ctx.fill();
      ctx.fillStyle=topF;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+tw,y);
      ctx.lineTo(x+tw+dx,y+dy); ctx.lineTo(x+dx,y+dy); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=C(255,255,255,0.5); ctx.lineWidth=Math.max(1,w*0.005);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+tw,y); ctx.lineTo(x+tw+dx,y+dy);
      ctx.lineTo(x+dx,y+dy); ctx.closePath(); ctx.stroke();
    }
    var tx=(n-1)*run+tw*0.55+dx*0.5, ty=-(n-1)*rise+baseY+dy*0.5;
    ctx.fillStyle='rgba(255,253,246,0.95)';
    ctx.beginPath(); ctx.arc(tx,ty-w*0.05,Math.max(1.5,w*0.019),0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx-w*0.02,ty-w*0.035); ctx.lineTo(tx+w*0.02,ty-w*0.035);
    ctx.lineTo(tx+w*0.026,ty+w*0.03); ctx.lineTo(tx-w*0.026,ty+w*0.03); ctx.closePath(); ctx.fill();
    ctx.restore();
    var k;
    for(k=0;k<STARS.length;k++){
      var sp=STARS[k];
      if(sp.x>0.55)continue;
      var tw2=0.55+0.45*Math.sin(clk*1.6+sp.ph);
      ctx.fillStyle=C(255,255,240,0.35+tw2*0.4);
      var px=sp.x*W, py=sp.y*LAY.horizon*0.9;
      var r=Math.max(0.8,Math.min(W,H)*0.0022*sp.sz*(0.7+tw2*0.6));
      ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
    }
  }

  /* ---------- 长翅膀的电视机 ---------- */
  function tvWing(dir,clk,s){
    var sp=1+(bpm-92)/260;
    var flap=Math.sin(clk*2.0*sp+0.6)*0.5+0.5;
    var i;
    ctx.save();
    ctx.translate(dir*s*0.6,-s*0.04);
    ctx.rotate(dir*(-0.28-flap*0.26));
    for(i=0;i<4;i++){
      var len=s*(0.62-i*0.075), ang=dir*(0.1+i*0.30);
      ctx.save();
      ctx.rotate(ang);
      ctx.fillStyle=C(255,255,252,0.94-i*0.05);
      ctx.beginPath(); ell(ctx,dir*len*0.52,0,len*0.52,len*0.115,-dir*0.18); ctx.fill();
      ctx.strokeStyle=C(196,192,178,0.55); ctx.lineWidth=Math.max(0.7,s*0.006); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawTV(clk){
    var tv=LAY.tv; if(!tv||!tv.s)return;
    var s=tv.s, x=tv.x, y=tv.y+Math.sin(clk*0.72)*s*0.035;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(Math.sin(clk*0.47)*0.028);
    var shadowY=LAY.horizon+H*0.11-y+Math.sin(clk*0.72+1)*s*0.01;
    ctx.save();
    ctx.globalAlpha=0.16;
    ctx.fillStyle=C(70,90,40,1);
    ctx.beginPath(); ell(ctx,0,shadowY,s*0.95,s*0.16,0); ctx.fill();
    ctx.restore();

    tvWing(-1,clk,s); tvWing(1,clk,s);

    var bw=s*1.28, bh=s*0.98;
    ctx.lineJoin='round';
    ctx.fillStyle=C(246,239,223,1);
    ctx.strokeStyle=C(64,56,48,0.9);
    ctx.lineWidth=Math.max(1.4,s*0.022);
    rrect(-bw/2,-bh/2,bw,bh,s*0.07); ctx.fill(); ctx.stroke();

    var sx=-bw*0.42, sy=-bh*0.33, sw=bw*0.72, sh=bh*0.66;
    ctx.save();
    rrect(sx,sy,sw,sh,s*0.09);
    ctx.fillStyle='#243134'; ctx.fill();
    ctx.clip();
    var i;
    for(i=0;i<26;i++){
      var nx=sx+Math.random()*sw, ny=sy+Math.random()*sh;
      ctx.fillStyle='rgba(190,240,235,'+(0.05+Math.random()*0.22)+')';
      ctx.fillRect(nx,ny,Math.max(1,sw*0.02),Math.max(1,sh*0.02));
    }
    for(i=0;i<5;i++){
      var ly=sy+((clk*0.4+i*0.21)%1)*sh;
      ctx.fillStyle='rgba(255,255,255,0.10)';
      ctx.fillRect(sx,ly,sw,Math.max(1,sh*0.02));
    }
    ctx.fillStyle='rgba(255,120,190,0.14)';
    ctx.fillRect(sx, sy, sw*0.08, sh);
    ctx.fillStyle='rgba(90,210,255,0.12)';
    ctx.fillRect(sx+sw*0.92, sy, sw*0.08, sh);
    ctx.fillStyle='rgba(160,245,240,'+(0.03+liveLv*0.10).toFixed(3)+')';
    ctx.fillRect(sx,sy,sw,sh);
    ctx.restore();
    ctx.strokeStyle=C(64,56,48,0.85); ctx.lineWidth=Math.max(1.2,s*0.018);
    rrect(sx,sy,sw,sh,s*0.09); ctx.stroke();

    var kx=bw*0.40, ky=-bh*0.18;
    ctx.fillStyle=C(228,214,190,1); ctx.strokeStyle=C(64,56,48,0.85);
    ctx.beginPath(); ctx.arc(kx,ky,s*0.055,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(kx,ky+s*0.20,s*0.055,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle=C(64,56,48,0.8); ctx.lineWidth=Math.max(1,s*0.016);
    for(i=0;i<4;i++){
      ctx.beginPath(); ctx.moveTo(kx-s*0.075,ky+bh*0.27+i*s*0.028);
      ctx.lineTo(kx+s*0.075,ky+bh*0.27+i*s*0.028); ctx.stroke();
    }
    ctx.strokeStyle=C(64,56,48,0.85); ctx.lineWidth=Math.max(1.2,s*0.02);
    ctx.beginPath(); ctx.moveTo(-bw*0.18,-bh*0.5); ctx.lineTo(-bw*0.34,-bh*0.95); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bw*0.12,-bh*0.5); ctx.lineTo(bw*0.32,-bh*0.9); ctx.stroke();
    ctx.fillStyle=C(240,235,220,1);
    ctx.beginPath(); ctx.arc(-bw*0.34,-bh*0.95,s*0.028,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.32,-bh*0.9,s*0.028,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function rrect(x,y,w,h,r){
    r=Math.max(0,Math.min(r,Math.min(Math.abs(w),Math.abs(h))/2));
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  /* ---------- 像素天使贴纸 ---------- */
  var ANGEL_ART=[
    '....##....',
    '...#..#...',
    '....##....',
    '...####...',
    '..######..',
    '.#.######.',
    '##.######.',
    '.#.######.',
    '..######..',
    '...##..##.',
    '..#......#'
  ];
  var ANGEL_SPRITES=[];

  function makeAngelSprite(col,glow){
    var size=96, cell=8, pad=8;
    var src=document.createElement('canvas'); src.width=size; src.height=size;
    var sg=src.getContext('2d'), y, x;
    for(y=0;y<ANGEL_ART.length;y++){
      for(x=0;x<ANGEL_ART[y].length;x++){
        if(ANGEL_ART[y].charAt(x)!=='#')continue;
        sg.fillStyle=col;
        sg.fillRect(pad+x*cell,pad+y*cell,cell,cell);
      }
    }
    var out=document.createElement('canvas'); out.width=size; out.height=size;
    var og=out.getContext('2d');
    try{
      og.filter='blur(7px)'; og.globalAlpha=0.9; og.drawImage(src,0,0);
      og.filter='none';
      og.globalCompositeOperation='source-atop';
      og.fillStyle=glow; og.fillRect(0,0,size,size);
      og.globalCompositeOperation='source-over';
      og.globalAlpha=1; og.drawImage(src,0,0);
    }catch(e){ og.drawImage(src,0,0); }
    return out;
  }

  function drawAngels(clk){
    var i,j;
    for(i=0;i<ANGELS.length;i++){
      var a=ANGELS[i];
      var px=a.x*W+Math.sin(clk*0.3+a.ph)*W*0.012;
      var py=a.y*H*0.78+Math.sin(clk*0.42+a.ph*1.7)*H*0.012;
      var sz=Math.min(W,H)*0.085*a.sc;
      var spr=ANGEL_SPRITES[i%ANGEL_SPRITES.length];
      if(!spr)continue;
      ctx.save();
      ctx.globalAlpha=a.gl?(0.55+0.35*Math.sin(clk*0.8+a.ph)):0.5;
      ctx.translate(px,py);
      ctx.rotate(Math.sin(clk*0.25+a.ph)*0.16);
      ctx.drawImage(spr,-sz/2,-sz/2,sz*11/10,sz);
      ctx.restore();
    }
  }

  /* ---------- 过曝 / 颗粒 / 划痕 ---------- */
  var VIGN=null, LEAK=null, DUST=[];

  function makeNoise(){
    var c=document.createElement('canvas'); c.width=128; c.height=128;
    var g=c.getContext('2d'), img=g.createImageData(128,128), d=img.data, i;
    for(i=0;i<d.length;i+=4){
      var v=Math.random()*255;
      d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=Math.random()*90;
    }
    g.putImageData(img,0,0);
    return c;
  }

  function buildOverlayTextures(){
    var r=srng(404), i;
    DUST.length=0;
    for(i=0;i<26;i++)DUST.push({x:r(),y:r(),z:0.4+r()*1.2,ph:r()*6.283});
    try{
      var el=document.getElementById('grain');
      if(el&&!el.getAttribute('data-set')){
        el.style.backgroundImage='url('+makeNoise().toDataURL('image/png')+')';
        el.setAttribute('data-set','1');
      }
    }catch(e){}
  }

  function drawOverlay(clk){
    var i;
    ctx.save();
    if(VIGN){ ctx.fillStyle=VIGN; ctx.fillRect(0,0,W,H); }
    for(i=0;i<DUST.length;i++){
      var d=DUST[i];
      var dx=((d.x*W+clk*7*d.z)%(W+40))-20;
      var dy=(d.y*H+Math.sin(clk*0.6+d.ph)*H*0.02);
      ctx.fillStyle=C(255,255,244,0.30*d.z);
      ctx.beginPath(); ctx.arc(dx,dy,Math.max(0.7,Math.min(W,H)*0.0022*d.z),0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle=LEAK; ctx.fillRect(0,0,W*0.72,H*0.72);
    if(beatPulse>0.02){
      ctx.fillStyle=C(255,250,235,beatPulse*0.09);
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function draw(now){
    var clk=now*0.001;
    updateEye(clk);
    ctx.drawImage(bg,0,0,W,H);
    drawHaze(clk);
    drawStairs(clk);
    drawFlower(clk);
    drawTV(clk);
    drawAngels(clk);
    drawOverlay(clk);
  }

  function frame(now){
    var t0=performance.now();
    S.frames++;
    beatPulse*=0.90; if(beatPulse<0.002)beatPulse=0;
    try{ draw(now); renderLyric(); }catch(err){ S.err=String(err&&err.message||err); }
    S.js=Math.max(0,performance.now()-t0);
    requestAnimationFrame(frame);
  }

  window.__stage=function(){
    return {lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing, frames:S.frames,
            js:S.js, err:S.err, text:S.text, gl:false, rm:rm};
  };

  window.addEventListener('resize',function(){ resize(); });
  resize();
  requestAnimationFrame(function(ts){ sendReady(); frame(ts); });
  setTimeout(sendReady,1200);
})();
</script>
</body>
