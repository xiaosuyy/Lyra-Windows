<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汞珠</title>
<!--
  机制：地上一汪水银（凸液面 + 贴壁的弯月面），十万颗珠子铺成这汪液面；每一句换一次机位（池子长宽、
        池心高低、水面倾角都变），窗光从右边甩到左边，液面上的高光跟着换边；字是 DOM 文字，倒影是同字的一份
        翻过来的副本，随水位贴着液面、随水波抖。没想到窗口里整池被抽走、抽成一颗悬起来的汞珠，再砸回池里，
        砸出一圈往里收的亮环。
  用了：WebGL2 实例化（drawArraysInstanced，10 万颗粒子 = 10 万个实例圆片；每帧 CPU 只发 14 个 uniform，
        不遍历粒子）；三类颗粒（液膜 / 珠 / 弯月面湿珠）在顶点着色器里各自定位；每颗的镜面高光用半角向量算。
        无 getImageData、无字形采样：字是真 DOM 文字 + 一份翻转副本当倒影。
  最像的三个：215-liquid-mercury / 122-liquid-metal / 015-liquid-metal
  差在哪：那三个是"金属渐变 + 文字倒影"的 2D 观感；这里是一汪有边界、有凸面、有弯月面亮环的水银，
        每一句换机位换光向，而且整池会被抽成一颗球再砸回来 —— 是量变到形态变，不是调渐变。
-->
<style>
  html,body{margin:0;height:100%;background:#06070a;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif;
       color:#eef4ff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #type{position:fixed;inset:0;pointer-events:none;overflow:hidden;--lit:.25;--rf:1}
  .slot{position:absolute;left:50%;top:37%;width:min(84vw,1080px);transform:translate(-50%,-50%);
        text-align:center;opacity:0;filter:blur(7px);z-index:3;isolation:isolate}
  /* 汞面里的倒影：同一句话，翻过来、横着抖、只留半截 */
  #refl{position:absolute;left:50%;top:52%;width:min(84vw,1080px);text-align:center;
        transform:translateX(-50%) translateY(-100%) scaleY(-0.62);transform-origin:50% 100%;
        font-weight:800;font-size:clamp(36px,7.0vh,96px);line-height:1.28;letter-spacing:.07em;
        white-space:pre-wrap;text-wrap:balance;color:rgba(232,243,255,.80);
        filter:blur(2.6px);opacity:0;z-index:2;pointer-events:none;
        background:radial-gradient(62% 130% at 50% 0%,rgba(2,3,5,.88) 0%,rgba(2,3,5,.58) 52%,rgba(2,3,5,0) 88%);
        -webkit-mask-image:radial-gradient(76% 96% at 50% 0%,#000 0%,rgba(0,0,0,.58) 48%,rgba(0,0,0,0) 86%);
        mask-image:radial-gradient(76% 96% at 50% 0%,#000 0%,rgba(0,0,0,.58) 48%,rgba(0,0,0,0) 86%)}
  .slot::before{content:'';position:absolute;inset:-58% -10%;z-index:-1;pointer-events:none;
        background:radial-gradient(56% 48% at 50% 50%,rgba(4,5,8,.90) 0%,rgba(4,5,8,.50) 52%,rgba(4,5,8,0) 78%)}
  .slot .in{display:block;font-weight:800;font-size:clamp(36px,7.0vh,96px);line-height:1.28;
        letter-spacing:.07em;color:#f8fcff;text-wrap:balance;white-space:pre-wrap;
        text-shadow:0 0 6px rgba(0,0,0,.98),0 2px 24px rgba(0,0,0,.96),0 8px 44px rgba(0,0,0,.88),
                    0 0 80px rgba(150,190,255,calc(var(--lit) * .24))}
  .slot .in span{display:inline-block;will-change:transform,opacity}
  .slot.gst .in{color:rgba(160,186,220,.32);text-shadow:none}
  .slot.gst::before{background:none}
  #vig{position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(112% 90% at 50% 46%,rgba(0,0,0,0) 38%,rgba(0,0,0,.70) 100%)}
  #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);pointer-events:none;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(168,200,240,.32);transition:opacity .8s;white-space:nowrap}
  html.fb #c{display:none}
  html.fb body{background:radial-gradient(118% 94% at 50% 62%,#1b2734 0%,#0a0e14 58%,#05070a 100%)}
  html.fb #type{z-index:1}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="type"><div id="refl"></div></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   A 车道内核（单文件内联，每个形态自带一份）
   协议 / 时钟 / 两句槽位（前奏·进场·余韵）/ 暂停冻结 / resize / RM / 降级
   形态只提供：片元与顶点着色器、配色、以及 stage 钩子
   ══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const typeBox = document.getElementById('type');
const refl = document.getElementById('refl');
const hint = document.getElementById('hint');
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';

const N = 100000;                 /* 10 万颗粒子，全部住在 GPU 上 */
let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, beatN = 0, bass = 0, treb = 0, beatAt = -9;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false, hintOn = true;
let inAmt = 0, preAmt = 0, act = 0, pol = 0, sweep = 1, sbt = 1, mrg = 0, kick = 0, cam = 0, wTop = -0.10, wWid = 0.66;
let cur = null, ghost = null, ghostAt = 0, slotFlip = 0, ghostStartV = 0, reflShow = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const ease3 = (x) => 1 - Math.pow(1 - x, 3);

/* prefers-reduced-motion：随时切换都要跟得上 */
let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) {
    RM = !!mq.matches;
    const onMQ = (e) => { RM = !!e.matches; skipToEnd(); };
    if (mq.addEventListener) mq.addEventListener('change', onMQ);
    else if (mq.addListener) mq.addListener(onMQ);
  }
} catch (_) {}
function skipToEnd() { if (cur && cur.chars) for (const c of cur.chars) { c.style.opacity = '1'; c.style.transform = 'none'; } }

/* ---------------- 文字槽位：两句交替，旧句留残影 ---------------- */
function mkSlot() {
  const el = document.createElement('div'); el.className = 'slot';
  const inner = document.createElement('div'); inner.className = 'in';
  el.appendChild(inner); typeBox.appendChild(el);
  return { el, inner, chars: [], cx: [], t0: 0, voice: 0, dir: 1, noanim: false, text: '' };
}
const slots = [mkSlot(), mkSlot()];

function fillSlot(slot, text) {
  slot.inner.textContent = '';
  slot.chars = [];
  slot.cx = [];
  const arr = Array.from(text);
  for (let i = 0; i < arr.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = arr[i];
    sp.style.opacity = '0';
    slot.inner.appendChild(sp);
    slot.chars.push(sp);
  }
  slot.text = text;
  for (const sp of slot.chars) {
    const r = sp.getBoundingClientRect();
    slot.cx.push((r.left + r.width / 2) / W * 2 - 1);
  }
}

function showLine(ci, instant) {
  const s = slots[slotFlip]; slotFlip ^= 1;
  if (cur && cur !== s) { ghost = cur; ghostAt = now(); ghostStartV = vT; }
  cur = s; ghost === s && (ghost = null);
  s.el.style.transform = 'translate(-50%,-50%)';
  fillSlot(s, (lines[ci] || {}).text || '');
  s.noanim = true;
  s.t0 = instant ? now() - 2 : lines[ci].t;
  s.voice = ci % 3;
  s.dir = (ci % 2) ? 1 : -1;
  s.amb = ci % 2;
  s.el.style.zIndex = '3';
  s.el.classList.remove('gst');
  if (ghost) { ghost.el.style.zIndex = '2'; ghost.el.classList.add('gst'); }
  s.el.style.opacity = '1';
  s.el.style.filter = 'none';
  for (const c of s.chars) { c.style.opacity = instant ? '1' : '0'; c.style.transform = instant ? 'none' : ''; }
  /* 汞面上那句话的倒影：整块换字，不逐字动 */
  refl.textContent = (lines[ci] || {}).text || '';
  reflShow = instant ? 1 : 0;
  hintOn = false; hint.style.opacity = '0';
}

function hideAll() {
  cur = null; ghost = null;
  for (const s of slots) { s.el.style.opacity = '0'; s.chars = []; s.el.classList.remove('gst'); }
  refl.textContent = ''; reflShow = 0;
  hintOn = true; hint.style.opacity = '0.9';
}

/* ---------------- 时钟：空歌词 / seek / 句首 ---------------- */
function timing(T) {
  if (!lines.length) { if (idx !== -1) { idx = -1; hideAll(); } lastT = T; return; }
  let ci = -1;
  for (let i = lines.length - 1; i >= 0; i--) { if (T >= lines[i].t) { ci = i; break; } }
  if (ci !== idx) {
    const jump = (lastT > -1e8 && (Math.abs(T - lastT) > 0.9 || ci > idx + 1 || ci < idx));
    idx = ci;
    if (ci < 0) { hideAll(); }
    else showLine(ci, jump);
  }
  lastT = T;
}

/* ---------------- 每帧：uniform 状态 ---------------- */
function state(T) {
  if (idx >= 0 && lines[idx]) {
    const lt = lines[idx].t;
    inAmt = clamp01((T - lt) / 1.10);
    const nx = lines[idx + 1];
    preAmt = nx ? clamp01(1 - (nx.t - T) / 0.30) : 0;
  } else { inAmt = 0; preAmt = 0; }
  act = (vT > 8.6 && vT < 12.4) ? 1 : 0;
  pol = beatN % 2;
  sweep = idx >= 0 ? clamp01((inAmt * 1.10 - 0.02) / 0.95) : 0;
  sweep = clamp01(sweep + preAmt * 0.02);

  /* 拍点：表面张力收一下再弹开（0.62s） */
  sbt = clamp01((T - beatAt) / 0.62);
  /* 机位随句子换（0/1/2/3…），这是"每一句都换一个镜头" */
  cam = idx < 0 ? 0 : Math.min(idx, 6);
  /* 没想到：整池被抽走、抽成一颗悬起来的汞珠，然后砸回来 */
  mrg = vT > 8.70 ? clamp01((vT - 8.70) / 0.70) : 0;
  if (vT > 10.30) mrg = clamp01(1 - (vT - 10.30) / 0.55);
  kick = clamp01(1 - Math.abs(vT - 10.95) / 0.45);

  /* 水位：和顶点着色器里同一套式子（倒影要严丝合缝贴在液面上） */
  const Wt = 0.030 + 0.060 * Math.sin(1.55 * cam + 0.70);
  const Bt = -1.36 - 0.24 * Math.sin(1.10 * cam + 1.90);
  const prx = 1.02 + 0.10 * Math.sin(1.90 * cam);
  const pry = (Wt - Bt) * 0.5, pcy = (Wt + Bt) * 0.5;
  const br = 1 + 0.022 * Math.sin(vT * 0.55) + 0.032 * Math.exp(-sbt * 7) - 0.020 * preAmt;
  wTop = pcy + pry * br + 0.022;
  wWid = Math.min(0.80, prx * 0.62);

  typeBox.style.setProperty('--lit', (0.22 + 0.78 * Math.max(beatPulse, inAmt * 0.7)).toFixed(3));
}

/* ---------------- 文字：逐字进场 / 残影 ---------------- */
function updDom(T) {
  if (cur) {
    const stg = 0.032, dur = 0.52;
    for (let i = 0; i < cur.chars.length; i++) {
      const p = cur.noanim ? 1 : clamp01((T - (cur.t0 + i * stg)) / dur);
      const e = ease3(p);
      const c = cur.chars[i];
      /* 液面先到（前奏），字才从水银里浮出来 */
      const vis = RM ? 1 : clamp01((sweep * 1.92 - 0.96 - (cur.cx[i] || 0)) / 0.055);
      if (cur.voice === 0) c.style.transform = 'translateY(' + ((1 - e) * 26).toFixed(2) + 'px) scaleY(' + (0.62 + 0.38 * e).toFixed(3) + ')';
      else if (cur.voice === 1) c.style.transform = 'translate(' + ((1 - e) * 16 * cur.dir).toFixed(2) + 'px,' + ((1 - e) * 18).toFixed(2) + 'px) scale(' + (0.90 + 0.10 * e).toFixed(3) + ')';
      else c.style.transform = 'translateY(' + ((1 - e) * -20).toFixed(2) + 'px) scaleY(' + (1 + (1 - e) * 0.16).toFixed(3) + ')';
      c.style.opacity = (p * vis).toFixed(3);
      /* 冷的银蓝，越"湿"越白 */
      const k = RM ? 1 : clamp01((sweep * 1.92 - 0.96 - (cur.cx[i] || 0)) / 0.26);
      c.style.color = 'rgb(' + Math.round(186 + 69 * k) + ',' + Math.round(203 + 49 * k) + ',' + Math.round(226 + 29 * k) + ')';
    }
    cur.el.style.filter = 'blur(' + ((1 - clamp01((T - cur.t0) / 0.42)) * 4.2).toFixed(2) + 'px)';
    /* 前景层 2.5×：跟着液面横移，拍上被液面顶起来 */
    const px = (sweep * 2 - 1) * 4, py = -beatPulse * 6;
    cur.el.style.transform = 'translate(-50%,-50%) translate(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px)';
  }
  /* ── 汞面上的倒影：贴在液面下方，随水位走、随水波抖、并镜时消失 ── */
  if (refl.textContent) {
    const rf = clamp01(reflShow === 1 ? 1 : (inAmt * 1.45 - 0.18));
    refl.style.top = ((1 - wTop) * 50).toFixed(2) + '%';
    refl.style.width = (wWid * 94).toFixed(1) + '%';
    refl.style.transform = 'translateX(-50%) translateY(-100%) scaleY(-0.62)'
      + ' translateY(' + (0.5 * Math.sin(vT * 2.30)).toFixed(2) + 'px)'
      + ' skewX(' + (0.55 * Math.sin(vT * 1.70 + 0.8)).toFixed(2) + 'deg)';
    refl.style.opacity = (rf * (0.62 + 0.34 * Math.min(1, beatPulse)) * (1 - mrg)).toFixed(3);
  } else if (reflShow) refl.style.opacity = '0';
  if (ghost) {
    const q = clamp01((T - ghostAt) / 0.72);
    if (q >= 1) { ghost.el.style.opacity = '0'; ghost.el.classList.remove('gst'); ghost = null; }
    else {
      ghost.el.style.opacity = (0.28 * (1 - q) * (1 - q)).toFixed(3);
      ghost.el.style.filter = 'blur(' + (q * 10).toFixed(2) + 'px)';
      ghost.el.style.transform = 'translate(-50%,-50%) translateY(' + (-q * 12).toFixed(2) + 'px) scaleY(' + (1 + q * 0.05).toFixed(3) + ')';
    }
  }
}

/* ══════════════════════════════ GPU ══════════════════════════════ */
const GL_OPT = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false,
  powerPreference: 'high-performance', preserveDrawingBuffer: false };
let gl = null, P = null, U = {}, bgP = null, bgU = {}, pVao = null, bgVao = null, glOk = false;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader');
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'link');
  return p;
}
function locs(p, names) { const o = {}; for (const n of names) o[n] = gl.getUniformLocation(p, n); return o; }

/* —— 背景：汞蒸气室的暗场（0.3× 速度的第一层） —— */
const BG_VS = `#version 300 es
in vec2 aQ; out vec2 vUV;
void main(){ vUV = aQ; gl_Position = vec4(aQ * 2.0 - 1.0, 0.0, 1.0); }`;
/* —— 背景片元：形态改这里 —— */
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform float uT; uniform vec2 uRes;
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
void main(){
  vec2 p = vUV;
  /* 一间关灯的房间：上近黑、地面以下更黑 */
  vec3 c = mix(vec3(0.0045,0.0055,0.0085), vec3(0.0135,0.0165,0.0235), smoothstep(0.28,1.0,p.y));
  /* 池子背后那一小团冷光——光有主人，就在水银上方半尺 */
  float g1 = exp(-pow((p.x-0.48)*1.75,2.0) - pow((p.y-0.395)*3.30,2.0));
  c += vec3(0.0295,0.0410,0.0625) * g1;
  /* 光团上方极淡的窗影（两竖一横），只在中间偏上 */
  float win = smoothstep(0.055,0.0,abs(p.x-0.35)) + smoothstep(0.045,0.0,abs(p.x-0.585));
  c += vec3(0.020,0.026,0.036) * win * smoothstep(0.86,0.52,p.y) * smoothstep(0.30,0.52,p.y);
  /* 静态颗粒（不动，所以暂停帧一致） */
  float g = h21(floor(p*uRes*0.62));
  c += vec3(0.0055) * g;
  o = vec4(c,1.0);
}`;
/* —— 粒子（形态改这里）：10 万颗汞珠，一块悬在地板上的水银池 —— */
const P_VS = `#version 300 es
precision highp float;
in vec2 aQ; in vec4 aSeed;
uniform float uT, uBass, uTre, uBeat, uPre, uIn, uPol, uAct, uBT, uMrg, uKick, uCam;
uniform vec2 uRes;
uniform vec4 uText;
out vec2 vQ; out vec3 vCol; out float vA;

float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=h21(i), b=h21(i+vec2(1,0)), c=h21(i+vec2(0,1)), d=h21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }

void main(){
  float asp = uRes.x / uRes.y;
  float c1 = clamp(uCam, 0.0, 6.0);
  float cz = aSeed.z;
  float th = aSeed.y * 6.2831853;
  float r0 = sqrt(aSeed.x);                       /* 圆盘内均匀铺开 */

  /* 侧壁那圈湿珠：把半径顶到 0.966–1.00，贴着弯月面 */
  float isRim = step(0.940, cz) * step(cz, 0.978);
  r0 = mix(r0, 0.966 + 0.034*aSeed.x, isRim);

  /* ── 机位：每一句换一次。池子大到近侧边沿出画，只留横贯画面的一道弯月面 ── */
  float Wt = 0.030 + 0.060*sin(1.55*c1 + 0.70);       /* 液面（水位） */
  float Bt = -1.36 - 0.45*sin(1.10*c1 + 1.90);        /* 池底（大多在画面外） */
  vec2 pr = vec2(1.02 + 0.10*sin(1.90*c1), (Wt - Bt)*0.5);
  vec2 pc = vec2(0.045*sin(1.20*c1), (Wt + Bt)*0.5);
  /* 表面张力：拍点收一下、前奏再收一下、还有一层呼吸 */
  pr *= 1.0 + 0.022*sin(uT*0.55) + 0.032*exp(-uBT*7.0) - 0.020*uPre;
  float tilt = 0.045*sin(0.90*c1) + 0.010*uBeat;

  float lx = cos(th)*r0, ly = sin(th)*r0;
  vec2 pP = pc + vec2(lx*pr.x + tilt*ly, ly*pr.y);
  float zn = sqrt(max(0.0, 1.0 - r0*r0));
  float men = smoothstep(0.84, 1.0, r0);          /* 弯月面（贴壁抬起的那圈） */
  pP.y += 0.036*zn + 0.022*men*men;                /* 汞不润湿，液面是凸的 */
  float kk = 1.0/(0.26 + 0.74*zn);
  vec3 nD = normalize(vec3(lx*kk*0.90, ly*kk*1.40, 0.86 - 0.30*men));

  /* ── 没想到：整池被抽成一颗悬起来的汞珠 ── */
  float rise = clamp((uT - 9.25)/0.85, 0.0, 1.0);
  float R = 0.300 + 0.018*sin(uT*2.1);
  vec2 sc = vec2(uText.x*0.30, mix(-0.455, -0.165, rise));
  vec2 pB = sc + vec2(cos(th)*r0*R/asp, sin(th)*r0*R);
  float zn2 = sqrt(max(0.0, 1.0 - r0*r0));
  vec3 nS = normalize(vec3(cos(th)*r0*asp, sin(th)*r0, zn2 + 0.035));

  vec2 p = mix(pP, pB, uMrg);
  vec3 n = normalize(mix(nD, nS, uMrg));

  /* ── 三类颗粒的尺度与基准透明度 ── */
  float film = 1.0 - step(0.780, cz);
  float bead = step(0.780, cz) * step(cz, 0.940);
  float rr = (film*0.0128 + bead*0.0041 + isRim*0.0047) * (0.72 + 0.56*aSeed.w);
  rr *= 1.0 + 0.22*uMrg;
  float baseA = film*0.0092 + bead*0.042 + isRim*0.070;
  /* 并成球时所有珠子挤进 1/4 的面积，必须按面积比把透明度压回来，否则一片死白 */
  baseA *= mix(1.0, 0.250, uMrg);

  /* ── 光照：一颗斜上方的窗，随句子换边（拍点再抖一下）── */
  vec3 V = normalize(vec3(p.x*0.40, p.y*0.40, 1.0));
  vec3 L = normalize(vec3(0.80*cos(2.20*c1) + 0.18*uPol, 0.62, 0.52));
  vec3 H = normalize(L + V);
  vec3 Rv = reflect(-V, n);
  float sp = pow(max(dot(n, H), 0.0), 220.0);
  /* 汞是镜子：把头顶那扇窗原样映出来 —— 一条/一圈极亮的窗影，其余全是黑 */
  float winY = smoothstep(0.10, 0.31, Rv.y) * (1.0 - smoothstep(0.52, 0.96, Rv.y));
  float wy0 = clamp(winY, 0.0, 1.0);
  /* 窗的位置随句子换：液面上那团亮影会在穹顶上游走 */
  float wx0 = 0.62*cos(2.20*c1);
  float winX = 1.0 - smoothstep(0.40, 0.92, abs(Rv.x - wx0));
  float sheet = wy0 * winX;
  float up = smoothstep(0.08, 0.62, n.y);
  float fres = pow(1.0 - clamp(n.z, 0.0, 1.0), 3.0) * (0.30 + 0.70*up);
  /* 弯月面那圈只亮远侧：光在池子后上方，近侧的贴壁圈不该亮 */
  float sidew = 0.10 + 0.90*smoothstep(-0.25, 0.55, ly);
  float rimL = exp(-pow((r0 - 0.986)*17.0, 2.0)) * sidew * (1.0 - uMrg);
  /* 回落的撞击：一圈往里收的亮环 */
  float rk = 0.12 + 0.96*(1.0 - uKick);
  float ring = uKick * exp(-pow((r0 - rk)*7.0, 2.0));
  float micro = 0.70 + 0.60*h21(floor(aSeed.xy*vec2(311.0,197.0)) + 7.1);

  float lum = 0.06 + 0.46*up + 2.60*sheet + 4.20*sp + 0.45*fres + 2.10*rimL + 2.40*ring;
  lum *= micro;
  lum *= 1.0 + 0.55*uBeat + 0.35*uBass;
  float a = baseA * lum;

  vec3 cCool = vec3(0.29, 0.39, 0.57);
  vec3 cSilv = vec3(0.97, 0.99, 1.0);
  vec3 col = mix(cCool, cSilv, clamp(0.04 + 0.95*sheet + 1.50*sp + 0.80*fres + 0.95*rimL + 0.35*up, 0.0, 1.0));
  col = mix(col, vec3(0.52, 0.62, 0.80), 0.25*uMrg);

  /* ── 悬浮汞雾：池面上方那点细珠（2.5× 视差层）── */
  if (cz > 0.978) {
    float dx = (aSeed.w*2.0 - 1.0)*1.02;
    float dy = fract(aSeed.x + uT*0.016)*0.62;
    vec2 q2 = vec2(dx + 0.02*sin(uT*0.31 + aSeed.y*6.28), pc.y + pr.y + dy + 0.02);
    float r2 = 0.0011 + aSeed.w*0.0012;
    float a2 = (0.020 + 0.030*aSeed.w) * (0.55 + 0.70*uTre + 0.55*uBeat);
    gl_Position = vec4(q2 + vec2((aQ.x - 0.5)*2.0*r2/asp, (aQ.y - 0.5)*2.0*r2), 0.0, 1.0);
    vQ = aQ; vA = a2; vCol = vec3(0.80, 0.89, 1.0);
    return;
  }

  vec2 q = (aQ - 0.5)*2.0*rr;
  q.x /= asp;
  gl_Position = vec4(p + q, 0.0, 1.0);
  vQ = aQ; vA = a; vCol = col;
}`;

const P_FS = `#version 300 es
precision highp float;
in vec2 vQ; in vec3 vCol; in float vA; out vec4 o;
void main(){
  vec2 d = vQ - 0.5;
  float r = length(d) * 2.0;                       /* 0 = 球心, 1 = 球的边 */
  float mask = 1.0 - smoothstep(0.86, 1.0, r);
  float nz = sqrt(max(0.0, 1.0 - r*r));
  /* 一颗锐利的白高光（偏左上） */
  vec2 dh = d - vec2(-0.135, -0.165);
  float hs = exp(-dot(dh, dh)*260.0);
  /* 球体明暗：中心亮、边缘暗（暗边靠"没有光"读出来） */
  float body = (0.24 + 0.62*nz);
  /* 边缘的一圈反光 */
  float rim = smoothstep(0.60, 0.94, r) * (1.0 - smoothstep(0.94, 1.0, r));
  float k = body*mask + hs*2.4 + rim*0.34;
  o = vec4(vCol * vA * k, 1.0);
}`;

function initGL() {
  try { gl = cv.getContext('webgl2', GL_OPT); } catch (_) { gl = null; }
  if (!gl) { document.documentElement.classList.add('fb'); return false; }
  P = program(P_VS, P_FS);
  U = locs(P, ['uT','uBass','uTre','uBeat','uPre','uIn','uPol','uAct','uBT','uMrg','uKick','uCam','uRes','uText']);
  bgP = program(BG_VS, BG_FS);
  bgU = locs(bgP, ['uT','uRes']);

  const quad = new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

  /* 分层抽样（Halton）保证 10 万颗铺得均匀，不结块 */
  const hal = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
  let sd = 20260248;
  const rnd = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
  const seeds = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    seeds[i*4] = hal(i + 1, 2); seeds[i*4+1] = hal(i + 1, 3);
    seeds[i*4+2] = rnd(); seeds[i*4+3] = rnd();
  }
  const sb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);

  pVao = gl.createVertexArray(); gl.bindVertexArray(pVao);
  const aQ = gl.getAttribLocation(P, 'aQ'), aS = gl.getAttribLocation(P, 'aSeed');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(aQ); gl.vertexAttribPointer(aQ, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.enableVertexAttribArray(aS); gl.vertexAttribPointer(aS, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(aS, 1);

  bgVao = gl.createVertexArray(); gl.bindVertexArray(bgVao);
  const bQ = gl.getAttribLocation(bgP, 'aQ');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(bQ); gl.vertexAttribPointer(bQ, 2, gl.FLOAT, false, 0, 0);

  gl.bindVertexArray(null);
  gl.clearColor(0.014, 0.018, 0.026, 1);
  gl.disable(gl.DEPTH_TEST);
  glOk = true;
  return true;
}

let uTextV = [0, 0, 0.3, 0.1];
function draw() {
  if (!glOk) return;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.useProgram(bgP); gl.bindVertexArray(bgVao);
  gl.uniform1f(bgU.uT, vT); gl.uniform2f(bgU.uRes, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.useProgram(P); gl.bindVertexArray(pVao);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.uniform1f(U.uT, vT); gl.uniform1f(U.uBass, bass); gl.uniform1f(U.uTre, treb);
  gl.uniform1f(U.uBeat, beatPulse); gl.uniform1f(U.uPre, preAmt); gl.uniform1f(U.uIn, inAmt);
  gl.uniform1f(U.uPol, pol); gl.uniform1f(U.uAct, act);
  gl.uniform1f(U.uBT, sbt); gl.uniform1f(U.uMrg, mrg); gl.uniform1f(U.uKick, kick);
  gl.uniform1f(U.uCam, cam);
  gl.uniform2f(U.uRes, W, H); gl.uniform4f(U.uText, uTextV[0], uTextV[1], uTextV[2], uTextV[3]);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);
  gl.bindVertexArray(null);
}

/* ---------------- 尺寸 ---------------- */
function resize() {
  W = Math.max(2, window.innerWidth); H = Math.max(2, window.innerHeight);
  PR = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * PR); cv.height = Math.round(H * PR);
  if (glOk) { gl.viewport(0, 0, cv.width, cv.height); }
  dirty = true;
}
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });

function textRect() {
  if (!cur || !cur.chars.length) return [0, 0, 0.34, 0.09];
  const r = cur.el.getBoundingClientRect();
  return [ (r.left + r.width/2) / W * 2 - 1, 1 - (r.top + r.height/2) / H * 2,
           Math.max(0.02, r.width / W), Math.max(0.02, r.height / H) ];
}

/* ══════════════════════════════ 主循环 ══════════════════════════════ */
let last = performance.now(), raf = 0, dirty = true;
function frame(ms) {
  const js0 = performance.now();
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
  last = ms; frames++;
  const T = now();
  vT = RM ? T * 0.24 : T;
  if (playing) {
    beatPulse *= Math.exp(-dt * 3.6);
    bass *= Math.exp(-dt * 0.08);
    treb *= Math.exp(-dt * 0.10);
  }
  try { timing(T); } catch (e) { errMsg = 'timing: ' + (e && e.message ? e.message : e); }
  state(T);
  if (!RM && cur) uTextV = textRect();
  try {
    if (playing || dirty) { draw(); updDom(T); dirty = false; }
  } catch (e) { errMsg = 'draw: ' + (e && e.message ? e.message : e); }
  if (!readySent) { readySent = true; try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {} }
  jsMs = performance.now() - js0;
  raf = requestAnimationFrame(frame);
}

/* ---------------- 协议 ---------------- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', (e) => {
  ping();
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    idx = -1; lastT = -1e9;
    cur = null; ghost = null;
    for (const s of slots) { s.el.style.opacity = '0'; s.chars = []; s.el.style.transform = 'translate(-50%,-50%)'; s.el.classList.remove('gst'); }
    vT = 0; beatPulse = 0; bass = 0; treb = 0; beatN = 0; beatAt = -9;
    clockT = 0; clockAt = performance.now(); playing = true;
    inAmt = 0; preAmt = 0; sbt = 1; mrg = 0; kick = 0; cam = 0; reflShow = 0; refl.textContent = '';
    hint.style.opacity = lines.length ? '0.9' : '0.4';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    dirty = true;
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    playing = !!d.payload.playing; dirty = true;
  } else if (d.type === 'beat') {
    beatPulse = Math.min(1, beatPulse + 0.32 + (d.payload.level || 0) * 0.5);
    beatN++; beatAt = now(); dirty = true;
  } else if (d.type === 'live') {
    const l = d.payload || {};
    if (typeof l.bass === 'number') bass = Math.max(bass, clamp01(l.bass));
    if (typeof l.treble === 'number') treb = Math.max(treb, clamp01(l.treble));
    if (typeof l.level === 'number') beatPulse = Math.max(beatPulse, Math.min(0.9, l.level * 0.8));
  }
});
addEventListener('pagehide', () => cancelAnimationFrame(raf));

/* ---------------- 自查 ---------------- */
window.__stage = () => ({
  lines: lines.length, idx: idx, t: +now().toFixed(2), playing: playing, frames: frames,
  js: +jsMs.toFixed(2), err: errMsg, text: (idx >= 0 && lines[idx]) ? lines[idx].text : '',
  gl: glOk, rm: RM, vT: +vT.toFixed(2)
});

/* ---------------- 启动 ---------------- */
resize();
try { initGL(); } catch (e) { errMsg = 'gl: ' + (e && e.message ? e.message : e); document.documentElement.classList.add('fb'); }
raf = requestAnimationFrame(frame);
</script>
</body>
