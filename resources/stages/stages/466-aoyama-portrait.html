<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青山留白</title>
<style>
:root{
  --paper:#f4f1ea;
  --ink:#16130f;
  --muted:#5f5a50;
  --faint:#8b8478;
  --pad:clamp(18px,3.6vw,68px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",Georgia,serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;
}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(200px,29vw,400px);gap:clamp(16px,3vw,58px);padding:var(--pad)}
#col{grid-column:1;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#cap{display:flex;gap:1em;align-items:baseline;font-size:clamp(8px,.72vw,11px);letter-spacing:.3em;text-transform:uppercase;color:#66604f;padding-bottom:clamp(10px,1.4vw,22px)}
#cap .jp{letter-spacing:.34em;color:#938b7d;font-size:1.05em}
#lyrWrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#track{position:absolute;left:0;right:0;top:0;transition:transform .62s cubic-bezier(.22,.61,.36,1);will-change:transform}
.ln{font-size:clamp(16px,1.95vw,31px);line-height:1.64;letter-spacing:.02em;color:var(--faint);padding:.22em 0;max-width:88%;overflow-wrap:anywhere;transform-origin:left center;transition:color .5s ease,transform .5s cubic-bezier(.22,.61,.36,1)}
.ln.sm{font-size:clamp(13.5px,1.5vw,24px);line-height:1.56}
.ln.xs{font-size:clamp(12px,1.2vw,19px);line-height:1.5;letter-spacing:0}
.ln.past{color:var(--muted)}
.ln.on{color:var(--ink);transform:scale(1.1)}
.ln .ch{color:#8b8478;transition:color .28s ease}
.ln.past .ch{color:#7c756a}
.ln.on .ch{color:#9a9384}
.ln.on .ch.lit{color:#16130f}
#empty{position:absolute;left:0;top:44%;font-size:clamp(11px,1vw,14px);letter-spacing:.34em;text-transform:uppercase;color:#9b9488}
#meta{display:flex;flex-direction:column;gap:.55em;padding-top:clamp(10px,1.6vw,24px)}
#prog{position:relative;height:1px;background:rgba(22,19,15,.14);overflow:hidden}
#progbar{position:absolute;left:0;top:0;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left center}
.mrow{display:flex;flex-wrap:wrap;gap:.9em;align-items:baseline;font-size:clamp(9px,.86vw,13px);letter-spacing:.16em;color:#6b655b}
#title{letter-spacing:.2em;color:#2c2820}
#print{grid-column:2;grid-row:1;position:relative;border:1px solid rgba(22,19,15,.16);box-shadow:0 30px 64px -38px rgba(60,48,30,.5);min-height:0}
#print:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(22,19,15,.1);pointer-events:none}
@media (max-width:780px),(max-aspect-ratio:5/6){
  #stage{grid-template-columns:1fr;grid-template-rows:minmax(0,36vh) minmax(0,1fr)}
  #col{grid-column:1;grid-row:2}
  #print{grid-column:1;grid-row:1}
}
@media (prefers-reduced-motion:reduce){
  #track,.ln{transition:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="col">
    <header id="cap"><span class="en">Aoyama Studio</span><span class="jp">青山肖像</span></header>
    <div id="lyrWrap"><div id="track"></div><div id="empty">Instrumental</div></div>
    <footer id="meta">
      <div id="prog"><i id="progbar"></i></div>
      <div class="mrow"><span id="title">—</span><span id="artist"></span></div>
    </footer>
  </div>
  <div id="print"></div>
</div>
<script>
/* 状态对象必须在最外层声明：window.__stage 需要直接读它 */
var state={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',text:'',gl:false,rm:false};
var view={w:1440,h:900,dpr:1,panel:{x:0,y:0,w:0,h:0}};
(function(){
'use strict';
var D=document;
var cv=D.getElementById('cv');
var ctx=cv.getContext('2d',{alpha:false});
var rootEl=D.documentElement;
var trackEl=D.getElementById('track');
var wrapEl=D.getElementById('lyrWrap');
var printEl=D.getElementById('print');
var emptyEl=D.getElementById('empty');
var titleEl=D.getElementById('title');
var artistEl=D.getElementById('artist');
var progEl=D.getElementById('progbar');
var lineEls=[];
var dur=0, accent='rgb(150,120,90)';
var pulse=0, live={bass:0,mid:0,treble:0};
var printCache=null, printDirty=true;
var readySent=false;

try{ state.rm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ state.rm=false; }

/* ---------- protocol ---------- */
function post(type){
  try{ if(window.parent) window.parent.postMessage({__c100:1,type:type},'*'); }
  catch(e){ console.error('[466] post failed',e); }
}
function num(v,d){ v=+v; return isFinite(v)?v:(d||0); }
function clamp01(v){ return v<0?0:(v>1?1:v); }

/* ---------- lyric model ---------- */
function normLines(src){
  var out=[],i,it,t,txt,raw;
  if(!src||typeof src.length!=='number') return out;
  for(i=0;i<src.length;i++){
    it=src[i]||{};
    txt=(it.text==null||it.text===false)?'':String(it.text);
    txt=txt.replace(/[\r\n\t]+/g,' ').replace(/ {2,}/g,' ');
    t=+it.t; if(!isFinite(t)||t<0) t=0;
    raw=(it.chars&&it.chars.length)?it.chars:null;
    out.push({t:t,dur:(+it.dur>0?+it.dur:0),text:txt,raw:raw,sz:lineSize(txt),el:null,cspans:null,ctimes:null,u:-1});
  }
  out.sort(function(a,b){ return a.t-b.t; });
  return out;
}
function lineSize(txt){
  var n=Array.from(txt||'').length;
  if(n>30) return ' xs';
  if(n>18) return ' sm';
  return '';
}
function lineSpan(L,i){  if(L.dur>0) return L.dur;
  var n=state.lines[i+1];
  if(n&&n.t>L.t) return Math.min(24,Math.max(0.7,n.t-L.t));
  return 4.2;
}

/* ---------- DOM lyric layer ---------- */
function buildLines(){
  var n=state.lines.length,i,L,el;
  trackEl.textContent='';
  lineEls=[];
  for(i=0;i<n;i++){
    L=state.lines[i];
    el=D.createElement('div');
    el.className='ln'+L.sz;
    el.textContent=L.text||'';
    trackEl.appendChild(el);
    L.el=el; L.u=-1;
    lineEls.push(el);
  }
  emptyEl.style.display=n?'none':'block';
  state.idx=-2;
  placeLyric(true);
}
function placeLyric(instant){
  var i=state.idx, el=(i>=0&&lineEls[i])?lineEls[i]:null;
  var wrapH=wrapEl.clientHeight||1;
  var mid=el?(el.offsetTop+el.offsetHeight*0.5):(wrapH*0.36);
  var y=wrapH*0.36-mid;
  if(instant) trackEl.style.transition='none';
  trackEl.style.transform='translate3d(0,'+y.toFixed(1)+'px,0)';
  if(instant){ void trackEl.offsetWidth; trackEl.style.transition=''; }
}
function setIdx(i){
  var prev=state.idx, L=state.lines, n=L.length, k;
  state.idx=i;
  if(prev>=-1&&prev<n&&L[prev].el) L[prev].el.className='ln'+L[prev].sz+' past';
  if(i>=0&&i<n&&L[i].el){ L[i].el.className='ln'+L[i].sz+' on'; buildChars(L[i],i); }
  if(Math.abs(i-prev)>1){
    for(k=0;k<n;k++){ if(L[k].el&&k!==i&&k!==prev) L[k].el.className='ln'+L[k].sz+(k<i?' past':''); }
  }
  placeLyric(false);
}
function buildChars(L,i){
  var txt=L.text||'', arr=Array.from(txt), n=arr.length;
  var el=L.el, base=L.t, span=lineSpan(L,i), ct=[], j;
  el.textContent='';
  L.cspans=[]; L.u=-1;
  if(!n){ L.ctimes=[]; return; }
  for(j=0;j<n;j++){
    ct.push(j===0?base:(base+span*0.92*(j/n)));
  }
  if(L.raw){
    for(j=0;j<n&&j<L.raw.length;j++){
      var c=L.raw[j], v=c?(+c.t):NaN;
      if(isFinite(v)&&v>=base-0.6) ct[j]=Math.max(base,v);
    }
  }
  var frag=D.createDocumentFragment(), sp;
  for(j=0;j<n;j++){
    sp=D.createElement('span');
    sp.className='ch';
    sp.textContent=arr[j];
    frag.appendChild(sp);
    L.cspans.push(sp);
  }
  el.appendChild(frag);
  L.ctimes=ct;
}
function fillChars(){
  var i=state.idx, L=state.lines[i];
  if(!L||!L.cspans) return;
  var sp=L.cspans, ct=L.ctimes, t=state.t, n=sp.length, k=0, j;
  for(j=0;j<n;j++){ if(t>=ct[j]) k=j+1; else break; }
  if(k===L.u) return;
  if(k>L.u){ for(j=Math.max(0,L.u);j<k;j++) sp[j].classList.add('lit'); }
  else{ for(j=k;j<L.u;j++) sp[j].classList.remove('lit'); }
  L.u=k;
}

/* ---------- time ---------- */
function onTick(t){
  state.t=t;
  var L=state.lines, n=L.length, i=-1;
  if(n){
    var lo=0,hi=n-1,m;
    while(lo<=hi){ m=(lo+hi)>>1; if(L[m].t<=t+0.0001){ i=m; lo=m+1; } else hi=m-1; }
  }
  if(i!==state.idx) setIdx(i);
  state.text=(i>=0&&L[i])?L[i].text:'';
  fillChars();
  if(dur>0) progEl.style.transform='scaleX('+clamp01(t/dur).toFixed(4)+')';
}

/* ---------- paint ---------- */
var lastW=0,lastH=0,lastPL=0,lastPT=0,lastPW=0,lastPH=0,resizeQueued=false;
function measure(){
  var w=rootEl.clientWidth||window.innerWidth||0;
  var h=rootEl.clientHeight||window.innerHeight||0;
  if(!w||!h||!isFinite(w)||!isFinite(h)){ w=1440; h=900; }
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var cw=Math.round(w*dpr), ch=Math.round(h*dpr);
  if(cw!==cv.width||ch!==cv.height||w!==view.w||h!==view.h){
    view.w=w; view.h=h; view.dpr=dpr;
    cv.width=cw; cv.height=ch;
    cv.style.width=w+'px'; cv.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    printDirty=true;
  }
  var r=printEl.getBoundingClientRect();
  if(Math.abs(r.left-lastPL)>0.7||Math.abs(r.top-lastPT)>0.7||
     Math.abs(r.width-lastPW)>0.7||Math.abs(r.height-lastPH)>0.7){
    view.panel.x=r.left; view.panel.y=r.top;
    view.panel.w=Math.max(1,r.width); view.panel.h=Math.max(1,r.height);
    lastPL=r.left; lastPT=r.top; lastPW=r.width; lastPH=r.height;
    printDirty=true;
  }
}
function fit(){
  measure();
  placeLyric(true);
}
function draw(now){
  ctx.fillStyle='#f4f1ea';
  ctx.fillRect(0,0,view.w,view.h);
  var P=view.panel;
  if(P.w>2&&P.h>2){
    var pc=getPrint(P);
    var s=state.rm?1:(1+0.004*Math.sin(now/7000)+0.010*pulse+0.006*live.bass);
    ctx.save();
    ctx.translate(P.x+P.w*0.5,P.y+P.h*0.5);
    ctx.rotate(state.rm?0:(Math.sin(now/9000)*0.0016));
    ctx.scale(s,s);
    ctx.drawImage(pc.c,-P.w*0.5,-P.h*0.5,P.w,P.h);
    ctx.restore();
  }
  /* 顶部细进度线：贯穿整幅留白 */
  if(dur>0){
    var pr=clamp01(state.t/dur);
    ctx.fillStyle='rgba(22,19,15,0.10)';
    ctx.fillRect(view.w*0.04,view.h*0.028,view.w*0.92,1);
    ctx.fillStyle=accent;
    ctx.globalAlpha=0.85;
    ctx.fillRect(view.w*0.04,view.h*0.028,view.w*0.92*pr,1);
    ctx.globalAlpha=1;
  }
}
var grainTile=null;
function grain(){
  if(grainTile) return grainTile;
  var c=D.createElement('canvas'); c.width=c.height=72;
  var g=c.getContext('2d');
  var img=g.createImageData(72,72), d=img.data, i;
  for(i=0;i<d.length;i+=4){
    var v=Math.random()*255;
    d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=26;
  }
  g.putImageData(img,0,0);
  grainTile=c;
  return c;
}
function bustPath(g,w,h){
  g.beginPath();
  g.moveTo(0,h);
  g.lineTo(0,0.815*h);
  g.bezierCurveTo(0.06*w,0.755*h,0.15*w,0.712*h,0.225*w,0.692*h);
  g.bezierCurveTo(0.283*w,0.676*h,0.312*w,0.640*h,0.322*w,0.592*h);
  g.bezierCurveTo(0.300*w,0.530*h,0.281*w,0.470*h,0.291*w,0.404*h);
  g.bezierCurveTo(0.302*w,0.222*h,0.383*w,0.104*h,0.503*w,0.104*h);
  g.bezierCurveTo(0.630*w,0.104*h,0.703*w,0.206*h,0.712*w,0.344*h);
  g.bezierCurveTo(0.719*w,0.444*h,0.702*w,0.540*h,0.671*w,0.598*h);
  g.bezierCurveTo(0.722*w,0.628*h,0.803*w,0.658*h,0.881*w,0.700*h);
  g.bezierCurveTo(0.955*w,0.740*h,1.0*w,0.788*h,1.0*w,0.815*h);
  g.lineTo(w,h);
  g.closePath();
}
function drawPrint(g,w,h){
  var i;
  /* 1. 摄影棚背景纸：极缓的竖gradient */
  var bg=g.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,'#f0eee8');
  bg.addColorStop(0.45,'#e4e0d7');
  bg.addColorStop(1,'#cfc9bd');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  /* 2. 柔光箱溢光（右上） */
  var bl=g.createRadialGradient(w*0.78,h*0.16,1,w*0.78,h*0.16,w*0.95);
  bl.addColorStop(0,'rgba(255,253,246,0.95)');
  bl.addColorStop(0.42,'rgba(255,252,244,0.38)');
  bl.addColorStop(1,'rgba(255,252,244,0)');
  g.fillStyle=bl; g.fillRect(0,0,w,h);
  /* 3. 地面/背景纸转折 */
  var fl=g.createLinearGradient(0,h*0.74,0,h);
  fl.addColorStop(0,'rgba(120,110,94,0)');
  fl.addColorStop(1,'rgba(96,86,70,0.20)');
  g.fillStyle=fl; g.fillRect(0,h*0.74,w,h*0.26);
  /* 4. 人像剪影 */
  g.save();
  bustPath(g,w,h);
  var sg=g.createLinearGradient(w*0.18,h*0.1,w*0.86,h);
  sg.addColorStop(0,'#2a2622');
  sg.addColorStop(0.55,'#191613');
  sg.addColorStop(1,'#0d0b09');
  g.fillStyle=sg; g.fill();
  /* 5. 轮廓光：沿右缘的内侧光带 */
  g.clip();
  var rl=g.createRadialGradient(w*0.70,h*0.40,w*0.02,w*0.70,h*0.40,w*0.54);
  rl.addColorStop(0,'rgba(255,246,228,0.34)');
  rl.addColorStop(0.55,'rgba(255,244,224,0.10)');
  rl.addColorStop(1,'rgba(255,244,224,0)');
  g.fillStyle=rl; g.fillRect(0,0,w,h);
  /* 肩线一抹主色，只有一丝 */
  var ac=g.createLinearGradient(0,h*0.72,w*0.5,h);
  ac.addColorStop(0,'rgba(255,255,255,0)');
  ac.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=ac; g.fillRect(0,0,w,h);
  g.restore();
  /* 6. 剪影边缘的细亮线（模拟布光轮廓） */
  g.save();
  g.globalCompositeOperation='lighter';
  bustPath(g,w,h);
  g.strokeStyle='rgba(255,250,238,0.30)';
  g.lineWidth=Math.max(0.6,w*0.0022);
  g.stroke();
  g.restore();
  /* 7. 版记：右侧竖排小字 */
  g.save();
  g.translate(w*0.955,h*0.075);
  g.font='600 '+Math.max(7,Math.round(w*0.026))+'px "Songti SC","Noto Serif SC",Georgia,serif';
  g.fillStyle='rgba(30,26,20,0.5)';
  g.textAlign='center';
  g.fillText('青',0,0); g.fillText('山',0,w*0.062); g.fillText('肖',0,w*0.124); g.fillText('像',0,w*0.186);
  g.restore();
  /* 8. 颗粒 */
  var pat=g.createPattern(grain(),'repeat');
  if(pat){ g.save(); g.globalAlpha=0.5; g.fillStyle=pat; g.fillRect(0,0,w,h); g.restore(); }
  /* 9. 暗角 */
  var vg=g.createRadialGradient(w*0.5,h*0.46,h*0.28,w*0.5,h*0.5,h*0.92);
  vg.addColorStop(0,'rgba(40,32,20,0)');
  vg.addColorStop(1,'rgba(40,32,20,0.30)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  /* 10. 内细线 */
  g.strokeStyle='rgba(244,241,234,0.55)';
  g.lineWidth=1;
  g.strokeRect(w*0.022,h*0.020,w*0.956,h*0.960);
}
function getPrint(P){
  var w=Math.max(2,Math.round(P.w)), h=Math.max(2,Math.round(P.h));
  if(!printDirty&&printCache&&printCache.w===w&&printCache.h===h) return printCache;
  var dpr=Math.min(view.dpr,2);
  var c=D.createElement('canvas');
  c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
  var g=c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  try{ drawPrint(g,w,h); }
  catch(e){ g.fillStyle='#e7e1d6'; g.fillRect(0,0,w,h); console.error('[466] print',e); }
  printCache={w:w,h:h,c:c};
  printDirty=false;
  return printCache;
}

/* ---------- loop ---------- */
var lastWrapH=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!readySent){ readySent=true; post('ready'); }
  var t0=performance.now();
  try{
    pulse*=0.90;
    measure();
    var wh=wrapEl.clientHeight|0;
    if(wh!==lastWrapH){ lastWrapH=wh; placeLyric(true); }
    draw(now);    state.frames++;
  }catch(e){
    state.err=String((e&&e.message)||e);
    console.error('[466] frame',e);
  }
  state.js=performance.now()-t0;
}

/* ---------- messages ---------- */
function doInit(p){
  var song=p.song||{}, nm, ar;
  nm=(song.name==null?'':String(song.name)).trim();
  ar=song.artists;
  if(Object.prototype.toString.call(ar)==='[object Array]') ar=ar.filter(function(x){return !!x;}).join(' / ');
  ar=(ar==null?'':String(ar)).trim();
  titleEl.textContent=nm||'Untitled';
  artistEl.textContent=ar;
  var d=+p.duration;
  dur=(isFinite(d)&&d>0)?d:0;
  if(p.accent&&p.accent.length>=3){
    accent='rgb('+Math.round(clamp01(num(p.accent[0])/255)*255)+','+Math.round(clamp01(num(p.accent[1])/255)*255)+','+Math.round(clamp01(num(p.accent[2])/255)*255)+')';
  }
  state.playing=p.playing!==false;
  state.lines=normLines(p.lines);
  buildLines();
  printDirty=true;
  onTick(state.t);
}
window.addEventListener('message',function(ev){
  var d=ev.data;
  if(!d||typeof d!=='object'||d.__c100!==1) return;
  try{
    if(d.type==='init'){ doInit(d.payload||{}); }
    else if(d.type==='tick'){
      var p=d.payload||{}, tt=+p.time;
      if(p.playing===false) state.playing=false; else if(p.playing===true) state.playing=true;
      if(isFinite(tt)) onTick(tt);
    }
    else if(d.type==='beat'){
      var b=d.payload||{}, lv=+b.level;
      if(isFinite(lv)) pulse=Math.max(pulse,0.2+0.8*clamp01(lv));
    }
    else if(d.type==='live'){
      var v=d.payload||{};
      live.bass=clamp01(num(v.bass)); live.mid=clamp01(num(v.mid)); live.treble=clamp01(num(v.treble));
    }
  }catch(e){
    state.err=String((e&&e.message)||e);
    console.error('[466] message',e);
  }
});
window.addEventListener('resize',function(){ try{ fit(); }catch(e){ console.error('[466] resize',e); } });

/* ---------- boot ---------- */
fit();
requestAnimationFrame(frame);
setTimeout(function(){ try{ if(!readySent){ readySent=true; post('ready'); } }catch(e){ console.error('[466] ready',e); } },600);
})();
