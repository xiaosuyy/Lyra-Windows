<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>棉絮</title>
<!--
  机制：一句词是按进棉胎里的一道压痕。字就是被压下去的那块棉 —— 压模底面把它压平、压实，
        平到能回光，所以整块是亮的；字口外一圈没压到的松纤维还立着、倒着，掠射光一擦就亮成绒毛。
  用了：WebGL2 实例化（10 万根棉纤维 / 短绒 / 飘絮）＋ 真三维相机 ＋ 背景着色器全分辨率画字。
        背景对每像素做 **射线→z=0 棉面求交**，取世界坐标采样字形纹理的三个通道：
        B = 压平的那块（主体，几乎没边），G = 压模的口沿（软一圈），R = 字外倒下来的松纤维；
        G-B 就是口沿外那道暗缝。高度场由纤维噪声立起来、压过的地方塌下去，
        法线用屏幕导数求，灯压得极低（约 10°）贴面横扫 —— 毛尖被擦亮，棉面还是暗的。
  镜头：贴着棉面横推 —— 12° 掠射（纤维在光里亮成一片）／23° 抬起来看字口那圈绒毛／
        34° 退远，整排压痕躺在棉胎上。
-->
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
       background:radial-gradient(128% 96% at 50% 46%,rgba(0,0,0,0) 28%,rgba(0,0,0,.76) 100%)}
  #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);pointer-events:none;z-index:3;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(178,232,236,.30);transition:opacity .8s;white-space:nowrap}
  #type{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0}
  html.fb #c{display:none}
  html.fb #type{opacity:1;display:flex;align-items:center;justify-content:center}
  html.fb #type .in{font-weight:900;font-size:clamp(30px,6vh,80px);letter-spacing:.10em;
       color:#d8fbf8;text-align:center;text-shadow:0 0 40px rgba(120,240,255,.45)}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="type"><div class="in"></div></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   286 · 棉絮 —— 棉胎 · 压出来的那块，边上一圈没压的松纤维 · 贴着棉面横推
   ══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const typeBox = document.getElementById('type');
const typeIn = typeBox.querySelector('.in');
const hint = document.getElementById('hint');
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';

const N = 100000;
let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, beatN = 0, bass = 0, treb = 0;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false;
let inAmt = 0, act = 0, uCut = 0.35, uProgG = 0;

const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;

let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) { RM = !!mq.matches; const onMQ = (e) => { RM = !!e.matches; }; if (mq.addEventListener) mq.addEventListener('change', onMQ); else if (mq.addListener) mq.addListener(onMQ); }
} catch (_) {}

/* ══════════════════════════ 字形纹理（fillText → GPU，不回读） ══════════════════════════ */
const gcv = document.createElement('canvas');
const gctx = gcv.getContext('2d');
const GT = { w: 0, h: 0, box: [-0.7, -0.1, 1.4, 0.35], chars: [], ready: false };
const RAMP_N = 64;
const ramp = new Uint8Array(RAMP_N * 4);
const BOX_W = 1.40;

function bakeText(text) {  const t = (text || '').trim();
  if (!t) { GT.ready = false; return; }
  const fsPx = 190;
  const font = '900 ' + fsPx + 'px ' + FAMILY;
  gctx.font = font;
  const mt = gctx.measureText(t);
  const pad = Math.round(fsPx * 0.34);
  const w = Math.max(32, Math.ceil(mt.width + pad * 6));
  const h = Math.max(32, Math.ceil(fsPx * 2.45));
  gcv.width = w; gcv.height = h;
  gctx.font = font;
  gctx.textBaseline = 'middle';
  gctx.textAlign = 'left';
  gctx.fillStyle = '#000';
  gctx.fillRect(0, 0, w, h);
  /* 三个通道各画一层棉，全用 lighter 往上叠，互不覆盖：
     B = 压模底面压出来的那块：压平、压实，几乎不留边 —— 主体，整幅最亮；
     G = 压模的口沿：比 B 软一圈、宽一圈 —— 取 G-B 就是口沿外那道暗缝；
     R = 字外还没被压到的松纤维，被模子推开、倒在旁边 —— 最软最宽的一圈。 */
  gctx.globalCompositeOperation = 'lighter';
  gctx.globalAlpha = 1;
  gctx.filter = 'none';
  gctx.lineJoin = 'round';
  gctx.lineCap = 'round';
  const by = Math.round(h * 0.30);
  const x0 = pad;

  /* 1) 松纤维：压模边上那一圈没压到的棉，往外倒着 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.055) + 'px)';
  gctx.strokeStyle = 'rgba(255,0,0,0.62)';
  gctx.lineWidth = fsPx * 0.34;
  gctx.strokeText(t, x0, by);
  gctx.fillStyle = 'rgba(255,0,0,0.09)';
  gctx.fillText(t, x0, by);

  /* 2) 口沿：模子的斜坡。棉是被挤过去的，边不是切出来的，是慢慢塌到底的 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.040) + 'px)';
  gctx.fillStyle = 'rgba(0,255,0,0.74)';
  gctx.fillText(t, x0, by);
  gctx.strokeStyle = 'rgba(0,255,0,0.38)';
  gctx.lineWidth = fsPx * 0.090;
  gctx.strokeText(t, x0, by);

  /* 3) 压平的那块：几乎不留边，就是模子底面压出来的那一块 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.008) + 'px)';
  gctx.fillStyle = 'rgba(0,0,255,0.96)';
  gctx.fillText(t, x0, by);
  gctx.strokeStyle = 'rgba(0,0,255,0.28)';
  gctx.lineWidth = fsPx * 0.022;
  gctx.strokeText(t, x0, by);

  /* 4) 被挤出去、粘在字外的那几缕散棉：不跟着字走，横七竖八地躺着 */
  const nT = Math.max(12, Math.round(mt.width / (fsPx * 0.072)));
  let sd2 = 2166136261;
  for (let k = 0; k < t.length; k++) sd2 = ((sd2 ^ t.charCodeAt(k)) * 16777619) >>> 0;
  const rnd2 = () => { sd2 = (sd2 * 1103515245 + 12345) >>> 0; return sd2 / 4294967296; };
  gctx.filter = 'blur(' + Math.round(fsPx * 0.032) + 'px)';
  for (let i = 0; i < nT; i++) {
    const px = x0 + (0.01 + 0.98 * rnd2()) * mt.width;
    const py = by + (rnd2() - 0.5) * fsPx * 1.62;
    const rr = fsPx * (0.010 + 0.030 * rnd2());
    gctx.fillStyle = 'rgba(255,0,0,' + (0.15 + 0.30 * rnd2()).toFixed(2) + ')';
    gctx.beginPath(); gctx.ellipse(px, py, rr * 1.9, rr * 0.55, (rnd2() - 0.5) * 1.4, 0, 6.2832); gctx.fill();
  }
  gctx.filter = 'none';
  gctx.globalCompositeOperation = 'source-over';

  const arr = Array.from(t);
  const chars = [];
  let acc = 0;
  for (const ch of arr) {
    const cw = gctx.measureText(ch).width;
    chars.push({ c: ch, x0: (pad + acc) / w, x1: (pad + acc + cw) / w });
    acc += cw;
  }
  GT.chars = chars;
  GT.w = w; GT.h = h;
  const boxH = BOX_W * (h / w);
  GT.box = [-BOX_W / 2, -boxH / 2, BOX_W, boxH];
  GT.ready = true;
  if (glOk) uploadGlyph();
}

function uploadGlyph() {
  gl.bindTexture(gl.TEXTURE_2D, glyphTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gcv);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

let charProg = [];
function buildRamp() {
  if (!GT.chars.length) { ramp.fill(0); if (glOk) pushRamp(); return; }
  for (let i = 0; i < RAMP_N; i++) {
    const u = (i + 0.5) / RAMP_N;
    let v = 0;
    for (let k = 0; k < GT.chars.length; k++) {
      const c = GT.chars[k];
      if (u >= c.x0 - 0.004 && u <= c.x1 + 0.004) { v = charProg[k] || 0; break; }
      if (u < c.x0) { v = charProg[k] || 0; break; }
    }
    const b = Math.round(clamp01(v) * 255);
    ramp[i * 4] = b; ramp[i * 4 + 1] = b; ramp[i * 4 + 2] = b; ramp[i * 4 + 3] = 255;
  }
  pushRamp();
}
function pushRamp() {
  if (!glOk) return;
  gl.bindTexture(gl.TEXTURE_2D, rampTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RAMP_N, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, ramp);
}

/* ══════════════════════════ 线性代数 ══════════════════════════ */
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function cameraBasis(eye, at, roll) {
  let fx = at[0] - eye[0], fy = at[1] - eye[1], fz = at[2] - eye[2];
  let fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, ry = 0, rz = fx;
  let rl = Math.hypot(rx, ry, rz) || 1;
  if (rl < 1e-4) { rx = 1; ry = 0; rz = 0; rl = 1; }
  rx /= rl; ry /= rl; rz /= rl;
  let ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
  const c = Math.cos(roll), s = Math.sin(roll);
  const RX = rx * c + ux * s, RY = ry * c + uy * s, RZ = rz * c + uz * s;
  const UX = ux * c - rx * s, UY = uy * c - ry * s, UZ = uz * c - rz * s;
  const dt = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const view = new Float32Array([
    RX, UX, -fx, 0,
    RY, UY, -fy, 0,
    RZ, UZ, -fz, 0,
    -dt([RX, RY, RZ], eye), -dt([UX, UY, UZ], eye), dt([fx, fy, fz], eye), 1
  ]);
  return { view, right: [RX, RY, RZ], up: [UX, UY, UZ], fwd: [fx, fy, fz] };
}

/* ══════════════════════════ GLSL ══════════════════════════ */
const BG_VS = `#version 300 es
in vec2 aQ; out vec2 vUV;
void main(){ vUV = aQ; gl_Position = vec4(aQ * 2.0 - 1.0, 0.0, 1.0); }`;

/* 背景：一床棉胎。每像素一条射线打到 z=0 的棉面上，用世界坐标去采样字形纹理的三个通道 ——
   字就是被压模压进去的那块：B 是压平的底（白、亮、几乎没边），G 是口沿那道软坡（G-B = 暗缝），
   R 是字外被推开、还立着的松纤维。高度场由纤维噪声 + 口沿的翘毛立起来，压过的地方整体塌下去；
   法线用屏幕导数求；灯压到 10° 贴面横扫，毛尖一亮、棉面还是暗的。 */
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform vec3 uEye, uRight, uUp, uFwd;
uniform float uTan, uAsp, uT, uBass, uAct, uCut;
uniform sampler2D uGlyph, uRamp;
uniform vec4 uBox;

float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = h21(i), b = h21(i + vec2(1.0, 0.0)), c = h21(i + vec2(0.0, 1.0)), d = h21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

/* 灯压得极低，几乎贴着棉面横扫过来 —— 只有立起来、翘出来的毛尖能被擦到。
   uAct 那一刻灯换到另一边（构图翻一次面），掠射角压得更低，绒毛整圈炸亮。 */
vec3 lampDir(){
  float s = (uAct > 0.5) ? 1.0 : -1.0;
  float el = (uAct > 0.5) ? 0.100 : 0.180;
  return normalize(vec3(0.905 * s, 0.300, el));
}

vec4 gtex(vec2 w){
  vec2 uv = (w - uBox.xy) / uBox.zw;
  if (uv.x < -0.06 || uv.x > 1.06 || uv.y < -0.06 || uv.y > 1.06) return vec4(0.0);
  return texture(uGlyph, uv);
}

/* 棉胎：三层各管一件事 —— 大团块是"多厚的一床"，中频是"哪里松哪里紧"，
   细绒是"表面那层沙沙的毛"。谁都不许太陡，棉不是砂纸。 */
float batt(vec2 w){
  return 0.56 * vnoise(w * 4.6) + 0.29 * vnoise(w * 13.0) + 0.15 * vnoise(w * 39.0);
}
float nap(vec2 w){ return 0.5 * vnoise(w * 118.0) + 0.5 * vnoise(w * 265.0); }
/* 压平那块上还剩下的细褶 —— 比绒面平得多，只在掠射角里留一点起伏 */
float crease(vec2 w){
  return 0.60 * vnoise(vec2(w.x * 62.0, w.y * 210.0)) + 0.40 * vnoise(w * 44.0);
}

void main(){
  vec2 nd = vUV * 2.0 - 1.0;
  vec3 dir = normalize(uRight * (nd.x * uTan * uAsp) + uUp * (nd.y * uTan) + uFwd);
  vec3 Vv = -dir;

  /* 没灯照到的棉胎：暖灰、很暗，只留一点被远处反光泡着的底 */
  vec3 col = vec3(0.0330, 0.0300, 0.0262);
  col *= 0.44 + 0.62 * pow(max(0.0, 1.0 - length(nd * vec2(0.86, 0.98))), 2.0);
  /* 远处那床棉：两层很软的雾贴着地平线，棉面在尽头才不会被刀切成硬边 */
  col += vec3(0.0180, 0.0164, 0.0146) * exp(-max(dir.z, 0.0) * 6.5);
  col += vec3(0.0060, 0.0054, 0.0047) * exp(-max(dir.z, 0.0) * 1.3);

  if (dir.z < -0.008) {
    float t = -uEye.z / dir.z;
    if (t > 0.02 && t < 15.0) {
      vec2 w = uEye.xy + dir.xy * t;
      vec2 uv = (w - uBox.xy) / uBox.zw;
      vec4 g4 = gtex(w);

      float ring = g4.r;   /* 字外没压到的那圈松纤维 */
      float lip  = clamp(g4.g - g4.b, 0.0, 1.0);  /* 压模口沿：G-B，就是那道软坡 */
      float cov  = g4.b;   /* 压平、压密的那块：整幅最亮 */
      float ramp = texture(uRamp, vec2(clamp(uv.x, 0.0, 1.0), 0.5)).r;

      /* 压到几成：一个字一个字压下去，压模在字上走 */
      float press = smoothstep(0.03, 0.60, ramp);
      float depth = smoothstep(0.04, 0.58, cov) * mix(0.55, 1.0, press);

      /* 高度：整床棉有厚薄，压过的地方塌下去；口沿外那圈纤维被模子推得更翘 */
      float b  = batt(w) * (1.0 + 0.10 * uBass);
      float nz = nap(w);
      float H = (0.0190 * b + 0.0026 * nz) * (1.0 - 0.80 * depth);
      H -= 0.0105 * depth;
      H += 0.0056 * ring * (0.30 + 0.70 * vnoise(w * 240.0));
      H += 0.0010 * crease(w) * depth;

      vec2 dxw = dFdx(w), dyw = dFdy(w);
      float hx = dFdx(H), hy = dFdy(H);
      float det = dxw.x * dyw.y - dxw.y * dyw.x;
      vec2 g = (abs(det) > 1e-13) ? vec2((hx * dyw.y - hy * dxw.y) / det, (hy * dxw.x - hx * dyw.x) / det) : vec2(0.0);
      g = clamp(g, vec2(-8.0), vec2(8.0));
      vec3 N = normalize(vec3(-g, 1.0));

      /* 反照率：散棉把光困在绒毛里（闷、灰），压实的棉面把光弹回来（白） */
      float pressed = clamp(depth * 1.15, 0.0, 1.0);
      vec3 alb = mix(vec3(0.360, 0.344, 0.318), vec3(1.000, 0.974, 0.922), pressed);
      /* 压平那块上还留着模子底面的细纹（一把很细的平行褶） */
      alb *= 1.0 - 0.045 * pressed * smoothstep(0.50, 0.96, vnoise(vec2(w.x * 20.0, w.y * 250.0)));
      /* 压得不匀：模子底下的棉有松有紧，块面不能是一张白纸 */
      alb *= mix(1.0, 0.80 + 0.32 * vnoise(w * 26.0), pressed);

      vec3 Ldn = lampDir();
      /* 棉几乎全是漫射：光进去、在绒毛里翻几次再出来，所以明暗非常软。
         压平那块的法线被抹平（模子底面），整块平着回光 —— 哑的，不是湿的。 */
      vec3 Nf = normalize(mix(N, vec3(0.0, 0.0, 1.0), 0.45 * pressed));
      float wrap = 0.5 + 0.5 * clamp(dot(Nf, Ldn), 0.0, 1.0);
      float dens = clamp(0.55 * b + 0.45 * nz, 0.0, 1.0);
      vec3 c = alb * (0.66 + 0.34 * wrap) * mix(0.86 + 0.22 * dens, 1.0, pressed);
      c *= mix(0.80 + 0.40 * vnoise(w * 2.2), 1.0, pressed);

      /* 压在字里那块：一层很宽的钝高光，掠射角一压才出来 */
      vec3 Hv = normalize(Ldn + Vv);
      float spec = pow(clamp(dot(Nf, Hv), 0.0, 1.0), 7.0);
      c += vec3(1.0, 0.977, 0.934) * spec * (0.70 * pressed + 0.04 * ring);

      /* 口沿外那道缝：模子边上的棉吃不到光，一条软暗线把字和棉面分开 */
      c *= 1.0 - 0.52 * smoothstep(0.05, 0.70, lip);

      /* 绒面那层细颗粒：棉不是塑料，暗部得有一层沙沙的毛 */
      c *= 0.955 + 0.075 * nz;

      /* 字外那圈没压到的松纤维：被掠射光挑起来，是这块压痕边上的毛边。
         高频那一下是为了让光边变成一根根毛，不是一圈光晕。 */
      float near = 0.5 + 0.5 * sin(uT * 2.5 + w.x * 8.0);      /* 前景 2.5× 的一层快闪 */
      float nep = 0.35 + 0.65 * smoothstep(0.42, 0.88, vnoise(vec2(w.x * 760.0, w.y * 1320.0)));
      c += vec3(1.0, 0.968, 0.912) * ring * nep * (0.16 + 0.20 * wrap + 0.05 * uAct) * (0.62 + 0.38 * near);

      /* 远一点就沉下去：近处的棉纤维亮，远处被空气吃掉；贴到地平线那头也散开 */
      float hz = smoothstep(0.0, 0.075, -dir.z);
      col = mix(col, c, hz * (0.64 + 0.36 * exp(-t * 1.8)));
    }
  }

    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    idx = -1; lastT = -1e9; curText = '';
    vT = 0; uCut = 0.35; beatPulse = 0; bass = 0; treb = 0; beatN = 0;
    clockT = 0; clockAt = performance.now(); playing = true;
    inAmt = 0;
    GT.ready = false; GT.chars = []; charProg = [];
    hint.style.opacity = lines.length ? '0.9' : '0.4';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    dirty = true;
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    playing = !!d.payload.playing; dirty = true;
  } else if (d.type === 'beat') {
    beatPulse = Math.min(1, beatPulse + 0.32 + (d.payload.level || 0) * 0.5);
    beatN++; dirty = true;
  } else if (d.type === 'live') {
    const l = d.payload || {};
    if (typeof l.bass === 'number') bass = Math.max(bass, clamp01(l.bass));
    if (typeof l.treble === 'number') treb = Math.max(treb, clamp01(l.treble));
    if (typeof l.level === 'number') beatPulse = Math.max(beatPulse, Math.min(0.9, l.level * 0.8));
  }
});
addEventListener('pagehide', () => cancelAnimationFrame(raf));

/* ══════════════════════════ 自查 ══════════════════════════ */
window.__stage = () => ({
  lines: lines.length, idx: idx, t: +now().toFixed(2), playing: playing, frames: frames,
  js: +jsMs.toFixed(2), err: errMsg, text: (idx >= 0 && lines[idx]) ? lines[idx].text : '',
  gl: glOk, rm: RM, vT: +vT.toFixed(2),
  cut: +uCut.toFixed(3), prog: +uProgG.toFixed(3), lit: +uCut.toFixed(3), chars: GT.chars.length
});

/* ══════════════════════════ 启动 ══════════════════════════ */
resize();
try { initGL(); } catch (e) { errMsg = 'gl: ' + (e && e.message ? e.message : e); document.documentElement.classList.add('fb'); }
raf = requestAnimationFrame(frame);
</script>
