<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>铁网零下</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#08090b;overflow:hidden}
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;background:#08090b}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
'use strict';

/* ---------- 0. 自检口与错误上报：脚本最外层，无条件 ---------- */
var report = { lines:0, idx:-1, t:0, playing:true, frames:0, js:0, err:'', text:'', gl:false, rm:false };
window.__stage = function(){ return report; };

var lastErrAt = 0;
function noteError(where, err){
  var now = (Date.now ? Date.now() : 0);
  report.err = String(where) + ': ' + String(err && err.message ? err.message : err);
  if (now - lastErrAt >= 1000){ lastErrAt = now; console.error('[424]', where, err); }
}
window.addEventListener('error', function(event){ noteError('window', event && event.error || event && event.message); });

/* ---------- 1. ready：第一个 rAF 里无条件发出（+ 定时兜底） ---------- */
var readySent = false;
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({__c100:1, type:'ready'}, '*'); }
  catch (err) { noteError('ready', err); }
}
requestAnimationFrame(function(){ sendReady(); });
setTimeout(sendReady, 1200);

/* ---------- 2. 画布 ---------- */
var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var W = 1440, H = 900, dpr = 1;

/* view 必须先于 resize() 建立：resize 内部会调 layout() 写 view.focal */
var view = { horizon: 0, focal: 900, camX: 0.4, eyeY: 1.55, unit: 1 };

function safeSize(){
  var w = canvas.clientWidth || window.innerWidth || 1440;
  var h = canvas.clientHeight || window.innerHeight || 900;
  if (!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0){ w = 1440; h = 900; }
  return { w: w, h: h };
}
function resize(){
  try {
    var size = safeSize();
    W = size.w; H = size.h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    invalidateBake();
  } catch (err) { noteError('resize', err); }
}
resize();
window.addEventListener('resize', function(){ try { resize(); } catch (err) { noteError('resize', err); } });

/* ---------- 3. 状态 ---------- */
var state = {
  song: '', artists: '', accent: [186, 96, 60],
  lines: [], idx: -1, t: 0, playing: true, duration: 0, inited: false
};

function pickAccent(value){
  if (!value || typeof value.length !== 'number' || value.length < 3) return [186, 96, 60];
  var out = [];
  for (var i = 0; i < 3; i++){
    var channel = Number(value[i]);
    if (!isFinite(channel)) return [186, 96, 60];
    out.push(Math.max(0, Math.min(255, Math.round(channel))));
  }
  return out;
}

function applyInit(payload){
  try {
    var data = payload || {};
    var song = data.song || {};
    state.song = typeof song.name === 'string' ? song.name : '';
    var artists = song.artists;
    if (Array.isArray(artists)) state.artists = artists.filter(function(a){ return typeof a === 'string'; }).join(' / ');
    else state.artists = typeof artists === 'string' ? artists : '';
    state.accent = pickAccent(data.accent);
    state.duration = isFinite(Number(data.duration)) ? Math.max(0, Number(data.duration)) : 0;
    var raw = Array.isArray(data.lines) ? data.lines : [];
    var lines = [];
    for (var i = 0; i < raw.length && lines.length < 400; i++){
      var item = raw[i] || {};
      var text = typeof item.text === 'string' ? item.text : '';
      if (!text) continue;
      lines.push({
        t: isFinite(Number(item.t)) ? Number(item.t) : 0,
        dur: isFinite(Number(item.dur)) && Number(item.dur) > 0 ? Number(item.dur) : 3,
        text: text,
        chars: Array.isArray(item.chars) ? item.chars : null
      });
    }
    lines.sort(function(left, right){ return left.t - right.t; });
    state.lines = lines;
    if (typeof data.playing === 'boolean') state.playing = data.playing;
    report.lines = lines.length;
    state.idx = -1;
    state.inited = true;
    if (typeof onLyricsChanged === 'function') onLyricsChanged();
  } catch (err) { noteError('init', err); }
}

function onLyricsChanged(){
  resetLyricCache();
  snowReady = false;
  puffs.length = 0;
}

/* ---------- 4. 消息 ---------- */
window.addEventListener('message', function(event){
  try {
    var msg = event && event.data;
    if (!msg || msg.__c100 !== 1) return;
    if (msg.type === 'init') applyInit(msg.payload);
    else if (msg.type === 'tick'){
      var tickPayload = msg.payload || {};
      var time = Number(tickPayload.time);
      if (isFinite(time)) state.t = time;
      if (typeof tickPayload.playing === 'boolean') state.playing = tickPayload.playing;
    }
    else if (msg.type === 'beat'){
      var bp = msg.payload || {};
      var level = Number(bp.level);
      pulse = 1;
      if (isFinite(level) && level > 0.6) pulse = 1.15;
    }
    else if (msg.type === 'live'){
      var lp = msg.payload || {};
      var key;
      for (key in live){
        if (!live.hasOwnProperty(key)) continue;
        if (key === 'playing') continue;
        var value = Number(lp[key]);
        if (isFinite(value)) live[key] = key === 'bpm' ? value : clamp01(value);
      }
      if (typeof lp.playing === 'boolean') live.playing = lp.playing;
    }
  } catch (err) { noteError('message', err); }
});

/* ---------- 5. 几何与配色 ---------- */
var nearZ = 0.9, farZ = 8.4;

function layout(){
  view.focal = Math.max(560, H * 1.2);
  view.horizon = H * 0.535;
  view.camX = 0.42;
  view.unit = Math.max(0.6, Math.min(1.6, H / 900));
}

function projectPoint(x, y, z){
  var depth = z > 0.2 ? z : 0.2;
  return {
    x: W * 0.5 + (x - view.camX) * view.focal / depth,
    y: view.horizon - (y - view.eyeY) * view.focal / depth
  };
}

function clamp255(value){
  var n = Math.round(Number(value));
  if (!isFinite(n)) return 0;
  return n < 0 ? 0 : (n > 255 ? 255 : n);
}
function clamp01(value){
  var n = Number(value);
  if (!isFinite(n)) return 0;
  return n < 0 ? 0 : (n > 1 ? 1 : n);
}
function rgba(red, green, blue, alpha){
  return 'rgba(' + clamp255(red) + ',' + clamp255(green) + ',' + clamp255(blue) + ',' + clamp01(alpha).toFixed(3) + ')';
}
function mixAccent(base, amount){
  var accent = Array.isArray(state.accent) ? state.accent : [186, 96, 60];
  var from = Array.isArray(base) ? base : [0, 0, 0];
  var weight = clamp01(amount);
  return [
    from[0] + ((accent[0] !== undefined ? accent[0] : 186) - from[0]) * weight,
    from[1] + ((accent[1] !== undefined ? accent[1] : 96) - from[1]) * weight,
    from[2] + ((accent[2] !== undefined ? accent[2] : 60) - from[2]) * weight
  ];
}

/* ---------- 6. 分帧烘焙 ---------- */
var bake = { backdrop: null, far: null, figure: null, near: null, vignette: null, grain: [], done: false, stage: 0 };

function layerScale(){
  return Math.max(1, Math.min(1.5, dpr || 1));
}
function makeLayer(){
  var layer = { c: null, paint: null, scale: layerScale() };
  try {
    layer.c = document.createElement('canvas');
    var sw = Math.max(2, Math.round(W * layer.scale));
    var sh = Math.max(2, Math.round(H * layer.scale));
    layer.c.width = sw;
    layer.c.height = sh;
    layer.paint = layer.c.getContext('2d');
    layer.paint.setTransform(layer.scale, 0, 0, layer.scale, 0, 0);
  } catch (err) { noteError('makeLayer', err); layer.c = null; layer.paint = null; }
  return layer;
}
function isDrawable(layer){
  return !!(layer && layer.c && layer.c.width > 0 && layer.c.height > 0 && layer.paint);
}
function blit(layer, offsetX, offsetY, alpha, mode){
  if (!isDrawable(layer)) return;
  var pad = 8;
  ctx.save();
  try {
    ctx.globalAlpha = clamp01(alpha === undefined ? 1 : alpha);
    ctx.globalCompositeOperation = mode || 'source-over';
    ctx.drawImage(layer.c, 0, 0, layer.c.width, layer.c.height,
      -pad + (offsetX || 0), -pad + (offsetY || 0), W + pad * 2, H + pad * 2);
  } catch (err) { noteError('blit', err); }
  ctx.restore();
}

var pendingBackdrop = null;

function buildBackdropSky(){
  var layer = makeLayer();
  if (!isDrawable(layer)) return;
  pendingBackdrop = layer;
  var paint = layer.paint;
  try {
    layout();
    var sky = paint.createLinearGradient(0, 0, 0, view.horizon + H * 0.1);
    sky.addColorStop(0, '#101418');
    sky.addColorStop(0.42, '#232a30');
    sky.addColorStop(0.74, '#4b545a');
    sky.addColorStop(1, '#8d9599');
    paint.fillStyle = sky;
    paint.fillRect(0, 0, W, view.horizon + 2);

    /* 远处楼群 + 水塔剪影 */
    var farBase = view.horizon + 3;
    var blockWidth = W * 0.115;
    for (var block = 0; block < 9; block++){
      var blockX = block * blockWidth - W * 0.05;
      var blockH = (0.2 + ((block * 37) % 11) / 11 * 0.5) * H * 0.34;
      paint.fillStyle = 'rgba(24,28,32,0.92)';
      paint.fillRect(blockX, farBase - blockH, blockWidth * 0.94, blockH);
      paint.fillStyle = 'rgba(58,64,70,0.35)';
      paint.fillRect(blockX, farBase - blockH, blockWidth * 0.94, 2);
      for (var winRow = 0; winRow < 5; winRow++){
        for (var winCol = 0; winCol < 3; winCol++){
          if (((block + winRow * 3 + winCol * 7) % 5) !== 0) continue;
          var lit = mixAccent([120, 110, 92], 0.35);
          paint.fillStyle = rgba(lit[0], lit[1], lit[2], 0.5);
          paint.fillRect(blockX + blockWidth * 0.16 + winCol * blockWidth * 0.24,
            farBase - blockH + 14 + winRow * (blockH / 6), blockWidth * 0.09, blockH * 0.03);
        }
      }
    }

    /* 水塔 */
    var towerX = W * 0.72, towerTop = view.horizon - H * 0.245;
    paint.fillStyle = 'rgba(18,21,24,0.95)';
    paint.fillRect(towerX - W * 0.021, towerTop, W * 0.042, H * 0.075);
    paint.beginPath();
    paint.moveTo(towerX - W * 0.024, towerTop);
    paint.lineTo(towerX, towerTop - H * 0.028);
    paint.lineTo(towerX + W * 0.024, towerTop);
    paint.closePath();
    paint.fill();
    paint.strokeStyle = 'rgba(18,21,24,0.95)';
    paint.lineWidth = 2.4;
    for (var leg = -1; leg <= 1; leg += 2){
      paint.beginPath();
      paint.moveTo(towerX + leg * W * 0.015, towerTop + H * 0.075);
      paint.lineTo(towerX + leg * W * 0.021, view.horizon + 4);
      paint.stroke();
    }
  } catch (err) { noteError('backdropSky', err); }
}

function buildBackdropWall(){
  var layer = pendingBackdrop;
  if (!isDrawable(layer)) return;
  var paint = layer.paint;
  try {
    /* 左侧砖墙 + 消防梯 */
    var wallW = W * 0.3, wallH = view.horizon - H * 0.02;
    var brick = paint.createLinearGradient(0, 0, wallW, wallH);
    brick.addColorStop(0, '#22262b');
    brick.addColorStop(0.6, '#191d21');
    brick.addColorStop(1, '#121519');
    paint.fillStyle = brick;
    paint.fillRect(0, 0, wallW, wallH);
    var brickH = Math.max(9, H * 0.017), brickW = brickH * 2.6;
    for (var row = 0; row < Math.min(60, Math.ceil(wallH / brickH)); row++){
      var rowY = row * brickH;
      for (var col = 0; col < Math.min(16, Math.ceil(wallW / brickW) + 1); col++){
        var colX = col * brickW + (row % 2 ? brickW * 0.5 : 0);
        paint.fillStyle = rgba(30 + ((row * 7 + col * 13) % 17), 34 + ((row * 5 + col * 11) % 13), 38 + ((row * 3 + col * 7) % 11), 0.85);
        paint.fillRect(colX + 1, rowY + 1, brickW - 2, brickH - 2);
      }
    }
    var shade = paint.createLinearGradient(0, 0, W * 0.34, 0);
    shade.addColorStop(0, 'rgba(8,10,12,0.55)');
    shade.addColorStop(1, 'rgba(8,10,12,0)');
    paint.fillStyle = shade;
    paint.fillRect(0, 0, W * 0.34, wallH);

    /* 消防梯：平台 + 斜梯 */
    paint.strokeStyle = 'rgba(9,11,13,0.95)';
    paint.lineWidth = Math.max(2, H * 0.004);
    for (var floor = 0; floor < 3; floor++){
      var platY = H * 0.12 + floor * H * 0.155;
      var platX = W * 0.055, platW = W * 0.19;
      paint.beginPath();
      paint.moveTo(platX, platY);
      paint.lineTo(platX + platW, platY);
      paint.lineWidth = Math.max(2.5, H * 0.006);
      paint.stroke();
      paint.lineWidth = Math.max(1.2, H * 0.0022);
      for (var rail = 1; rail <= 2; rail++){
        paint.beginPath();
        paint.moveTo(platX, platY - rail * H * 0.030);
        paint.lineTo(platX + platW, platY - rail * H * 0.030);
        paint.stroke();
      }
      for (var picket = 0; picket <= 12; picket++){
        var picketX = platX + platW * picket / 12;
        paint.beginPath();
        paint.moveTo(picketX, platY);
        paint.lineTo(picketX, platY - H * 0.030 * 2);
        paint.stroke();
      }
      paint.beginPath();
      paint.lineWidth = Math.max(2, H * 0.0042);
      paint.moveTo(platX + platW, platY);
      paint.lineTo(platX + platW + W * 0.045, platY + H * 0.125);
      paint.stroke();
    }
  } catch (err) { noteError('backdropWall', err); }
}

function buildBackdropGround(){
  var layer = pendingBackdrop;
  if (!isDrawable(layer)) return;
  var paint = layer.paint;
  try {
    /* 地面：沥青 + 球场线 + 残雪 */
    var ground = paint.createLinearGradient(0, view.horizon, 0, H);
    ground.addColorStop(0, '#23282c');
    ground.addColorStop(0.35, '#171b1f');
    ground.addColorStop(1, '#0d1013');
    paint.fillStyle = ground;
    paint.fillRect(0, view.horizon, W, H - view.horizon);

    paint.strokeStyle = 'rgba(150,158,160,0.20)';
    paint.lineWidth = Math.max(2, H * 0.0045);
    paint.beginPath();
    paint.ellipse(W * 0.52, view.horizon + H * 0.42, W * 0.30, H * 0.135, 0, Math.PI * 1.02, Math.PI * 1.98);
    paint.stroke();
    paint.beginPath();
    paint.moveTo(W * 0.06, view.horizon + H * 0.155);
    paint.lineTo(W * 0.96, view.horizon + H * 0.19);
    paint.stroke();

    for (var patch = 0; patch < 26; patch++){
      var patchX = ((patch * 137) % 1000) / 1000 * W;
      var patchY = view.horizon + 10 + ((patch * 271) % 1000) / 1000 * (H - view.horizon);
      var patchR = (6 + ((patch * 53) % 40)) * view.unit;
      var snow = paint.createRadialGradient(patchX, patchY, 0, patchX, patchY, patchR);
      snow.addColorStop(0, 'rgba(206,216,222,0.20)');
      snow.addColorStop(1, 'rgba(206,216,222,0)');
      paint.fillStyle = snow;
      paint.beginPath();
      paint.ellipse(patchX, patchY, patchR * 1.7, patchR * 0.6, 0, 0, Math.PI * 2);
      paint.fill();
    }

    /* 冷雾 */
    var haze = paint.createLinearGradient(0, view.horizon - H * 0.14, 0, view.horizon + H * 0.05);
    haze.addColorStop(0, 'rgba(150,164,172,0)');
    haze.addColorStop(0.72, 'rgba(150,164,172,0.26)');
    haze.addColorStop(1, 'rgba(150,164,172,0)');
    paint.fillStyle = haze;
    paint.fillRect(0, view.horizon - H * 0.14, W, H * 0.19);

    /* 场地灯：accent 冷光 */
    var lamp = mixAccent([120, 132, 140], 0.5);
    var lampX = W * 0.79, lampY = H * 0.17;
    var glow = paint.createRadialGradient(lampX, lampY, 0, lampX, lampY, Math.max(W, H) * 0.42);
    glow.addColorStop(0, rgba(lamp[0], lamp[1], lamp[2], 0.34));
    glow.addColorStop(0.35, rgba(lamp[0], lamp[1], lamp[2], 0.10));
    glow.addColorStop(1, rgba(lamp[0], lamp[1], lamp[2], 0));
    paint.fillStyle = glow;
    paint.fillRect(0, 0, W, H);
    var core = paint.createRadialGradient(lampX, lampY, 0, lampX, lampY, H * 0.05);
    core.addColorStop(0, rgba(240, 244, 248, 0.55));
    core.addColorStop(1, rgba(240, 244, 248, 0));
    paint.fillStyle = core;
    paint.fillRect(0, 0, W, H);
  } catch (err) { noteError('backdropGround', err); }
  bake.backdrop = layer;
  pendingBackdrop = null;
}

/* 铁网：平面 z 恒定 → 世界坐标里的直线投影后仍是直线，端点即可 */
function traceChainLink(paint, depthZ, spacing, topY){
  var halfWidth = (W * 0.5) * depthZ / view.focal;
  var x0 = view.camX - halfWidth - 0.7;
  var x1 = view.camX + halfWidth + 0.7;
  var yTop = topY, yBottom = -0.5;
  var cMin, cMax, count, i, offset, u0, u1, p0, p1;

  /* 斜线族 A：v = u + c */
  cMin = yBottom - x1;
  cMax = yTop - x0;
  count = Math.min(320, Math.max(1, Math.ceil((cMax - cMin) / spacing) + 1));
  for (i = 0; i < count; i++){
    offset = cMin + i * spacing;
    u0 = Math.max(x0, yBottom - offset);
    u1 = Math.min(x1, yTop - offset);
    if (u1 <= u0) continue;
    p0 = projectPoint(u0, u0 + offset, depthZ);
    p1 = projectPoint(u1, u1 + offset, depthZ);
    paint.moveTo(p0.x, p0.y);
    paint.lineTo(p1.x, p1.y);
  }

  /* 斜线族 B：v = -u + c */
  cMin = yBottom + x0;
  cMax = yTop + x1;
  count = Math.min(320, Math.max(1, Math.ceil((cMax - cMin) / spacing) + 1));
  for (i = 0; i < count; i++){
    offset = cMin + i * spacing;
    u0 = Math.max(x0, offset - yTop);
    u1 = Math.min(x1, offset - yBottom);
    if (u1 <= u0) continue;
    p0 = projectPoint(u0, offset - u0, depthZ);
    p1 = projectPoint(u1, offset - u1, depthZ);
    paint.moveTo(p0.x, p0.y);
    paint.lineTo(p1.x, p1.y);
  }
}

function tracePosts(paint, depthZ, topY){
  var halfWidth = (W * 0.5) * depthZ / view.focal;
  var x0 = Math.max(-9, Math.floor(view.camX - halfWidth));
  var x1 = Math.min(9, Math.ceil(view.camX + halfWidth));
  for (var postX = x0; postX <= x1; postX += 3){
    var foot = projectPoint(postX, 0, depthZ);
    var head = projectPoint(postX, topY, depthZ);
    var postW = Math.max(2, 0.075 * view.focal / depthZ);
    paint.moveTo(foot.x - postW * 0.5, foot.y);
    paint.lineTo(foot.x - postW * 0.5, head.y);
    paint.lineTo(foot.x + postW * 0.5, head.y);
    paint.lineTo(foot.x + postW * 0.5, foot.y);
    paint.closePath();
  }
  /* 顶杆 */
  var leftEdge = projectPoint(view.camX - halfWidth - 0.7, topY, depthZ);
  var rightEdge = projectPoint(view.camX + halfWidth + 0.7, topY, depthZ);
  var railW = Math.max(2, 0.06 * view.focal / depthZ);
  paint.moveTo(leftEdge.x, leftEdge.y - railW * 0.5);
  paint.lineTo(rightEdge.x, rightEdge.y - railW * 0.5);
  paint.lineTo(rightEdge.x, rightEdge.y + railW * 0.5);
  paint.lineTo(leftEdge.x, leftEdge.y + railW * 0.5);
  paint.closePath();
}

function buildFarFence(){
  var layer = makeLayer();
  if (!isDrawable(layer)) return;
  var paint = layer.paint;
  try {
    var depthZ = farZ, topY = 3.68;
    paint.save();
    paint.lineCap = 'round';
    paint.beginPath();
    traceChainLink(paint, depthZ, 0.062, topY);
    paint.strokeStyle = 'rgba(10,13,16,0.62)';
    paint.lineWidth = Math.max(0.8, 1.15 * view.unit);
    paint.stroke();
    paint.beginPath();
    tracePosts(paint, depthZ, topY);
    paint.fillStyle = 'rgba(8,10,13,0.86)';
    paint.fill();
    paint.restore();

    /* 钢材迎光的一面：整体轻移一点，做出边缘反光 */
    paint.save();
    paint.translate(-0.9, -1.0);
    paint.lineCap = 'round';
    paint.beginPath();
    traceChainLink(paint, depthZ, 0.062, topY);
    paint.strokeStyle = 'rgba(206,216,222,0.30)';
    paint.lineWidth = Math.max(0.5, 0.62 * view.unit);
    paint.stroke();
    paint.restore();

    /* 顶杆上积了一层雪 */
    paint.save();
    var spanHalf = (W * 0.5) * depthZ / view.focal;
    var railLeft = projectPoint(view.camX - spanHalf - 0.7, topY, depthZ);
    var railRight = projectPoint(view.camX + spanHalf + 0.7, topY, depthZ);
    var capWidth = Math.max(2, 0.055 * view.focal / depthZ);
    paint.lineCap = 'round';
    paint.lineWidth = capWidth;
    paint.strokeStyle = 'rgba(226,234,240,0.42)';
    paint.beginPath();
    for (var capStep = 0; capStep <= 40; capStep++){
      var capT = capStep / 40;
      var capX = railLeft.x + (railRight.x - railLeft.x) * capT;
      var capY = railLeft.y + (railRight.y - railLeft.y) * capT - capWidth * 0.35 + Math.sin(capStep * 1.7) * capWidth * 0.16;
      if (capStep === 0) paint.moveTo(capX, capY);
      else paint.lineTo(capX, capY);
    }
    paint.stroke();
    paint.restore();

    /* 铁网被雾压住一点，退到后面 */
    paint.save();
    paint.globalCompositeOperation = 'source-atop';
    var fog = paint.createLinearGradient(0, view.horizon - H * 0.3, 0, H);
    fog.addColorStop(0, 'rgba(150,162,170,0.30)');
    fog.addColorStop(0.55, 'rgba(120,132,140,0.12)');
    fog.addColorStop(1, 'rgba(80,90,96,0.26)');
    paint.fillStyle = fog;
    paint.fillRect(0, 0, W, H);
    paint.restore();
  } catch (err) { noteError('farFence', err); }
  bake.far = layer;
}

function buildNearFence(){
  var layer = makeLayer();
  if (!isDrawable(layer)) return;
  var paint = layer.paint;
  try {
    var depthZ = nearZ, topY = 3.7;
    paint.save();
    paint.lineCap = 'round';
    paint.lineJoin = 'round';
    paint.beginPath();
    traceChainLink(paint, depthZ, 0.058, topY);
    var steel = paint.createLinearGradient(0, 0, W, H);
    steel.addColorStop(0, 'rgba(232,240,246,0.62)');
    steel.addColorStop(0.55, 'rgba(186,200,208,0.50)');
    steel.addColorStop(1, 'rgba(130,144,152,0.40)');
    paint.strokeStyle = steel;
    paint.lineWidth = Math.max(2.5, 3.6 * view.unit);
    paint.stroke();
    paint.beginPath();
    tracePosts(paint, depthZ, topY);
    paint.fillStyle = 'rgba(30,36,40,0.5)';
    paint.fill();
    paint.restore();

    /* 近处虚焦：整层模糊；filter 不支持时用多份偏移叠出来 */
    var blurred = makeLayer();
    if (isDrawable(blurred)){
      try {
        if ('filter' in blurred.paint){
          blurred.paint.filter = 'blur(' + Math.max(2, 5 * view.unit).toFixed(1) + 'px)';
          blurred.paint.drawImage(layer.c, 0, 0, W, H);
          blurred.paint.filter = 'none';
          layer = blurred;
        }
      } catch (err) { noteError('nearBlur', err); }
      if (layer !== blurred){
        var spread = Math.max(1.5, 3 * view.unit);
        blurred.paint.globalAlpha = 0.3;
        blurred.paint.drawImage(layer.c, -spread, 0, W, H);
        blurred.paint.drawImage(layer.c, spread, spread * 0.6, W, H);
        blurred.paint.drawImage(layer.c, 0, -spread, W, H);
        blurred.paint.globalAlpha = 1;
        layer = blurred;
      }
    }
  } catch (err) { noteError('nearFence', err); }
  bake.near = layer;
}

/* 人物：一个背对镜头的剪影，羽绒大衣、领子竖起、脚上大黄靴 */
var figureState = { z: 6, x: -1.8, height: 1.79, feetX: 0, headY: 0, pixelHeight: 0 };

function solveFigureDepth(){
  var targetFeet = H * 0.86;
  var span = targetFeet - view.horizon;
  if (!isFinite(span) || span < H * 0.06) span = H * 0.06;
  var depth = view.eyeY * view.focal / span;
  return Math.max(2.6, Math.min(14, depth));
}

function traceFigure(paint){
  /* 单位：figure 高度 = 1，y=0 头顶，y=1 脚底 */
  function puff(cx, cy, rx, ry){
    paint.moveTo(cx + rx, cy);
    paint.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  }
  /* 兜帽 + 头 */
  puff(-0.004, 0.078, 0.104, 0.098);
  puff(0.020, 0.095, 0.056, 0.068);
  /* 竖起的领子 */
  puff(0.002, 0.186, 0.115, 0.048);
  /* 羽绒服的鼓包 */
  puff(0.000, 0.262, 0.182, 0.074);
  puff(0.004, 0.350, 0.190, 0.082);
  puff(0.002, 0.455, 0.178, 0.080);
  puff(0.000, 0.555, 0.163, 0.070);
  /* 兜帽后的鼓包 */
  puff(-0.022, 0.145, 0.100, 0.058);
  /* 靴子 */
  paint.moveTo(-0.138, 0.878);
  paint.lineTo(-0.020, 0.878);
  paint.lineTo(-0.020, 0.996);
  paint.lineTo(-0.150, 0.996);
  paint.closePath();
  paint.moveTo(0.024, 0.878);
  paint.lineTo(0.140, 0.878);
  paint.lineTo(0.152, 0.996);
  paint.lineTo(0.024, 0.996);
  paint.closePath();
}

function buildFigure(){
  var layer = makeLayer();
  if (!isDrawable(layer)) return;
  var paint = layer.paint;
  try {
    figureState.z = solveFigureDepth();
    var anchor = (W / H < 0.86) ? 0.30 : 0.285;
    figureState.x = view.camX + (W * anchor - W * 0.5) * figureState.z / view.focal;
    var feet = projectPoint(figureState.x, 0, figureState.z);
    var head = projectPoint(figureState.x, figureState.height, figureState.z);
    var pixelHeight = feet.y - head.y;
    figureState.feetX = feet.x;
    figureState.headY = head.y;
    figureState.pixelHeight = pixelHeight;
    if (!isFinite(pixelHeight) || pixelHeight < 40) return;

    paint.save();
    paint.translate(feet.x, head.y);
    paint.scale(pixelHeight, pixelHeight);
    paint.fillStyle = '#07090b';
    paint.strokeStyle = '#07090b';
    paint.lineCap = 'round';
    paint.lineJoin = 'round';
    paint.beginPath();
    traceFigure(paint);
    paint.fill();
    /* 袖子与裤腿用粗线画成胶囊 */
    paint.lineWidth = 0.088;
    paint.beginPath();
    paint.moveTo(-0.135, 0.292);
    paint.lineTo(-0.188, 0.492);
    paint.moveTo(0.140, 0.292);
    paint.lineTo(0.196, 0.480);
    paint.stroke();
    paint.lineWidth = 0.082;
    paint.beginPath();
    paint.moveTo(-0.062, 0.600);
    paint.lineTo(-0.074, 0.878);
    paint.moveTo(0.064, 0.600);
    paint.lineTo(0.078, 0.878);
    paint.stroke();
    paint.restore();

    /* 左侧冷调轮廓光，只落在剪影内部的左侧 */
    paint.save();
    paint.globalCompositeOperation = 'source-atop';
    var rim = paint.createLinearGradient(feet.x - pixelHeight * 0.30, 0, feet.x + pixelHeight * 0.03, 0);
    rim.addColorStop(0, 'rgba(196,212,222,0.62)');
    rim.addColorStop(0.42, 'rgba(150,168,180,0.20)');
    rim.addColorStop(1, 'rgba(110,126,138,0)');
    paint.fillStyle = rim;
    paint.fillRect(0, 0, W, H);
    /* 靴子上一点暖色，唯一的暖调 */
    var bootGlow = mixAccent([54, 44, 30], 0.75);
    var bootY = head.y + pixelHeight * 0.90;
    var bootGrad = paint.createLinearGradient(0, bootY, 0, head.y + pixelHeight);
    bootGrad.addColorStop(0, rgba(bootGlow[0], bootGlow[1], bootGlow[2], 0.0));
    bootGrad.addColorStop(1, rgba(bootGlow[0], bootGlow[1], bootGlow[2], 0.42));
    paint.fillStyle = bootGrad;
    paint.fillRect(feet.x - pixelHeight * 0.3, bootY, pixelHeight * 0.6, pixelHeight * 0.12);
    paint.restore();

    /* 虚焦一点点，别太像矢量图 */
    try {
      if ('filter' in paint){
        var soft = makeLayer();
        if (isDrawable(soft)){
          soft.paint.filter = 'blur(' + Math.max(0.8, 1.6 * view.unit).toFixed(1) + 'px)';
          soft.paint.drawImage(layer.c, 0, 0, W, H);
          soft.paint.filter = 'none';
          layer = soft;
        }
      }
    } catch (err) { noteError('figureBlur', err); }
  } catch (err) { noteError('figure', err); }
  bake.figure = layer;
}

function buildSprites(){
  try {
    var sprites = {};
    var bokeh = document.createElement('canvas');
    bokeh.width = 64; bokeh.height = 64;
    var bokehCtx = bokeh.getContext('2d');
    var bokehGrad = bokehCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
    bokehGrad.addColorStop(0, 'rgba(235,242,248,0.85)');
    bokehGrad.addColorStop(0.45, 'rgba(210,222,232,0.32)');
    bokehGrad.addColorStop(1, 'rgba(190,206,218,0)');
    bokehCtx.fillStyle = bokehGrad;
    bokehCtx.fillRect(0, 0, 64, 64);
    sprites.bokeh = bokeh;

    var vapor = document.createElement('canvas');
    vapor.width = 96; vapor.height = 96;
    var vaporCtx = vapor.getContext('2d');
    var vaporGrad = vaporCtx.createRadialGradient(48, 48, 0, 48, 48, 48);
    vaporGrad.addColorStop(0, 'rgba(226,234,240,0.55)');
    vaporGrad.addColorStop(0.5, 'rgba(210,222,230,0.18)');
    vaporGrad.addColorStop(1, 'rgba(200,214,224,0)');
    vaporCtx.fillStyle = vaporGrad;
    vaporCtx.fillRect(0, 0, 96, 96);
    sprites.vapor = vapor;

    bake.sprites = sprites;
  } catch (err) { noteError('sprites', err); bake.sprites = null; }
}

var bakeSteps = [buildBackdropSky, buildBackdropWall, buildBackdropGround, buildFarFence, buildFigure, buildNearFence, buildSprites, buildGrain, buildLeak, buildVignette];
var bakeIndex = 0;
var bakePumping = false;
var started = false;

function invalidateBake(){
  if (!started) return;
  pendingBackdrop = null;
  bake.backdrop = null;
  bake.far = null;
  bake.figure = null;
  bake.near = null;
  bake.vignette = null;
  bake.leak = null;
  bake.grain = [];
  bake.grainPatterns = [];
  bake.sprites = null;
  bake.done = false;
  bakeIndex = 0;
  resetLyricCache();
  if (!bakePumping){
    bakePumping = true;
    requestAnimationFrame(pumpBake);
  }
}

function pumpBake(){
  var startedAt = (window.performance && performance.now) ? performance.now() : Date.now();
  var guard = 0;
  try {
    while (bakeIndex < bakeSteps.length && guard < 8){
      var now = (window.performance && performance.now) ? performance.now() : Date.now();
      if (now - startedAt > 8 && guard > 0) break;
      bakeSteps[bakeIndex]();
      bakeIndex++;
      guard++;
    }
  } catch (err) {
    noteError('bake', err);
    bakeIndex = bakeSteps.length;
  }
  if (bakeIndex < bakeSteps.length) requestAnimationFrame(pumpBake);
  else { bake.done = true; bakePumping = false; }
}

/* ---------- 7. 主循环 ---------- */
var frameCount = 0, lastFrameAt = 0;

function activeIndex(at){
  var lines = state.lines;
  var lo = 0, hi = lines.length - 1, found = -1;
  while (lo <= hi){
    var mid = (lo + hi) >> 1;
    if (lines[mid].t <= at + 0.02){ found = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return found;
}

/* ---------- 8. 歌词 ---------- */
var lyricView = { idx: -1, prevIdx: -1, changedAt: 0, cache: {}, cacheStamp: 0 };
var FONT_STACK = 'Impact,"Arial Narrow","Haettenschweiler","Microsoft YaHei","PingFang SC",sans-serif';

function fontString(size){
  return '900 ' + Math.max(8, size).toFixed(1) + 'px ' + FONT_STACK;
}

function applyTracking(target, pixels){
  try {
    if ('letterSpacing' in target) target.letterSpacing = Math.max(0, pixels).toFixed(2) + 'px';
  } catch (err) { noteError('tracking', err); }
}

function resetLyricCache(){
  lyricView.cache = {};
  lyricView.cacheStamp++;
  lyricView.idx = -1;
  lyricView.prevIdx = -1;
}

function measureWidth(text){
  return ctx.measureText(text).width;
}

function lineCharTimes(line){
  var text = line.text;
  var count = text.length;
  var times = [];
  var source = line.chars;
  var usable = Array.isArray(source) && source.length === count;
  var i;
  if (usable){
    for (i = 0; i < count; i++){
      var raw = source[i] && Number(source[i].t);
      if (!isFinite(raw)){ usable = false; break; }
    }
  }
  if (usable){
    for (i = 0; i < count; i++) times.push(Number(source[i].t));
  } else {
    var span = isFinite(line.dur) && line.dur > 0 ? line.dur : Math.max(1.2, count * 0.22);
    for (i = 0; i < count; i++) times.push(line.t + span * (i / Math.max(1, count)));
  }
  return times;
}

function buildLineLayout(idx){
  var line = state.lines[idx];
  if (!line || typeof line.text !== 'string' || !line.text) return null;
  var text = line.text;
  var baseSize = Math.max(18, Math.min(96, Math.min(W * 0.072, H * 0.098)));
  var maxWidth = W * (W / H < 0.9 ? 0.86 : 0.80);
  var size = baseSize;
  applyTracking(ctx, size * 0.035);
  ctx.font = fontString(size);
  var width = measureWidth(text);
  for (var shrinkStep = 0; shrinkStep < 24; shrinkStep++){
    if (width <= maxWidth || size <= baseSize * 0.40) break;
    size *= 0.93;
    applyTracking(ctx, size * 0.035);
    ctx.font = fontString(size);
    width = measureWidth(text);
  }

  var rowTexts = [text];
  if (width > maxWidth){
    var perRow = Math.max(4, Math.floor(text.length * maxWidth / width));
    rowTexts = [];
    for (var start = 0; start < text.length && rowTexts.length < 3; start += perRow){
      rowTexts.push(text.slice(start, start + perRow));
    }
    ctx.font = fontString(size);
    var widest = 0;
    var measureIndex;
    for (measureIndex = 0; measureIndex < rowTexts.length; measureIndex++){
      widest = Math.max(widest, measureWidth(rowTexts[measureIndex]));
    }
    if (widest > maxWidth && widest > 0){
      size = Math.max(12, size * (maxWidth / widest));
      applyTracking(ctx, size * 0.035);
      ctx.font = fontString(size);
    }
  }

  var tracking = size * 0.035;
  var times = lineCharTimes(line);
  var rows = [];
  var cursor = 0;
  applyTracking(ctx, tracking);
  ctx.font = fontString(size);
  for (var rowIndex = 0; rowIndex < rowTexts.length; rowIndex++){
    var rowText = rowTexts[rowIndex];
    var chars = [];
    var charCursor = 0;
    for (var charIndex = 0; charIndex < rowText.length; charIndex++){
      var charText = rowText.charAt(charIndex);
      var charWidth = measureWidth(charText) + tracking;
      chars.push({ c: charText, x: charCursor, w: charWidth, t: times[cursor] !== undefined ? times[cursor] : line.t });
      charCursor += charWidth;
      cursor++;
    }
    rows.push({ text: rowText, chars: chars, width: Math.max(charCursor, measureWidth(rowText)) });
  }

  return {
    size: size,
    font: fontString(size),
    tracking: tracking,
    lineHeight: size * 1.14,
    rows: rows,
    total: rows.length
  };
}

function getLayout(idx){
  var cached = lyricView.cache[idx];
  if (cached) return cached;
  var built = buildLineLayout(idx);
  lyricView.cache[idx] = built;
  return built;
}

function countRevealed(row, at){
  var total = 0;
  for (var i = 0; i < row.chars.length; i++){
    if (row.chars[i].t <= at + 0.02) total++;
    else break;
  }
  return total;
}

function drawCaption(){
  if (!state.song && !state.artists) return;
  var size = Math.max(10, Math.min(W * 0.0135, 15));
  var label = (state.artists ? state.artists : '') + (state.artists && state.song ? ' — ' : '') + (state.song ? state.song : '');
  if (label.length > 54) label = label.slice(0, 53) + '…';
  ctx.save();
  try {
    applyTracking(ctx, 0);
    ctx.font = '600 ' + size.toFixed(1) + 'px "Arial Narrow","Helvetica Neue",Arial,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    var marginX = Math.max(16, W * 0.035);
    var y = Math.max(18, H * 0.045);
    var accent = mixAccent([210, 220, 226], 0.35);
    ctx.fillStyle = rgba(accent[0], accent[1], accent[2], 0.5);
    ctx.fillRect(marginX, y - size * 0.1, Math.max(12, W * 0.018), Math.max(1, size * 0.09));
    ctx.fillStyle = 'rgba(226,234,240,0.46)';
    ctx.fillText(label.toUpperCase(), marginX, y + size * 0.95);
    ctx.fillStyle = 'rgba(190,202,210,0.28)';
    ctx.font = '500 ' + (size * 0.82).toFixed(1) + 'px "Arial Narrow",Arial,sans-serif';
    ctx.fillText('QUEENS · 35MM · WINTER', marginX, y + size * 2.35);
  } catch (err) { noteError('caption', err); }
  ctx.restore();
}

function drawEmptyState(){
  var centerX = W * 0.5;
  var size = Math.max(17, Math.min(W * 0.032, 34));
  var y = H * 0.74;
  ctx.save();
  try {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    applyTracking(ctx, size * 0.04);
    ctx.font = '900 ' + size.toFixed(1) + 'px ' + FONT_STACK;
    ctx.fillStyle = 'rgba(232,238,242,0.5)';
    ctx.fillText('这一首没有歌词', centerX, y);
    ctx.font = '500 ' + (size * 0.66).toFixed(1) + 'px "Arial Narrow","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(198,210,218,0.32)';
    ctx.fillText('只听风从铁网中间过去', centerX, y + size * 1.75);
    var ruleW = Math.min(W * 0.16, 220);
    ctx.strokeStyle = 'rgba(200,212,220,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(centerX - ruleW, y + size * 2.7);
    ctx.lineTo(centerX + ruleW, y + size * 2.7);
    ctx.stroke();
  } catch (err) { noteError('empty', err); }
  ctx.restore();
}

function drawWaitingDots(){
  var size = Math.max(4, Math.min(W * 0.006, 7));
  var gap = size * 3.2;
  var y = H * 0.80;
  var phase = (frameCount % 90) / 90;
  ctx.save();
  try {
    for (var i = 0; i < 3; i++){
      var wave = 0.28 + 0.5 * Math.max(0, Math.cos((phase - i * 0.15) * Math.PI * 2));
      ctx.fillStyle = 'rgba(220,230,236,' + wave.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(W * 0.5 + (i - 1) * gap, y, size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  } catch (err) { noteError('waiting', err); }
  ctx.restore();
}

function drawCurrentLine(layout, bottomY, at, revealAlpha){
  /* 底纹：整句先排一遍暗字，未唱到的字也有实体 */
  var topY = bottomY - layout.rows.length * layout.lineHeight;
  var centerX = W * 0.5;
  applyTracking(ctx, layout.tracking);
  ctx.font = layout.font;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  var rowIndex, row, rowLeft;
  for (rowIndex = 0; rowIndex < layout.rows.length; rowIndex++){
    row = layout.rows[rowIndex];
    rowLeft = centerX - row.width * 0.5;
    var rowY = topY + layout.lineHeight * (rowIndex + 0.5);
    ctx.fillStyle = 'rgba(206,218,226,0.17)';
    ctx.fillText(row.text, rowLeft, rowY);
  }
  /* 已唱部分：单次 fillText 画前缀，保持字距对齐 */
  for (rowIndex = 0; rowIndex < layout.rows.length; rowIndex++){
    row = layout.rows[rowIndex];
    rowLeft = centerX - row.width * 0.5;
    var lineY = topY + layout.lineHeight * (rowIndex + 0.5);
    var revealed = countRevealed(row, at);
    if (revealed <= 0) continue;
    var prefix = row.text.slice(0, revealed);
    ctx.fillStyle = 'rgba(6,8,10,0.55)';
    ctx.fillText(prefix, rowLeft + 1.6, lineY + 2.2);
    var warm = mixAccent([246, 248, 244], 0.10);
    ctx.fillStyle = rgba(warm[0], warm[1], warm[2], revealAlpha);
    ctx.fillText(prefix, rowLeft, lineY);
    if (revealed < row.chars.length){
      var edge = row.chars[revealed];
      var edgeAlpha = 0.45 * revealAlpha;
      ctx.fillStyle = 'rgba(240,246,250,' + edgeAlpha.toFixed(3) + ')';
      ctx.fillText(edge.c, rowLeft + edge.x, lineY);
    }
  }
  /* 进度针 */
  var duration = 0;
  var nowLine = state.lines[state.idx];
  if (nowLine && isFinite(nowLine.dur) && nowLine.dur > 0) duration = nowLine.dur;
  var progress = duration > 0 ? clamp01((at - nowLine.t) / duration) : 1;
  var accent = mixAccent([210, 222, 228], 0.55);
  var barWidth = Math.min(layout.rows[0] ? layout.rows[0].width : W * 0.4, W * 0.8);
  var barY = bottomY + layout.size * 0.22;
  ctx.fillStyle = rgba(accent[0], accent[1], accent[2], 0.12);
  ctx.fillRect(centerX - barWidth * 0.5, barY, barWidth, Math.max(1, layout.size * 0.022));
  ctx.fillStyle = rgba(accent[0], accent[1], accent[2], 0.5);
  ctx.fillRect(centerX - barWidth * 0.5, barY, barWidth * progress, Math.max(1, layout.size * 0.022));
}

function drawLyrics(){
  var lines = state.lines;
  drawCaption();
  if (!lines.length){
    drawEmptyState();
    return;
  }
  if (state.idx < 0){
    drawWaitingDots();
    return;
  }
  var nowMs = (window.performance && performance.now) ? performance.now() : Date.now();
  if (state.idx !== lyricView.idx){
    lyricView.prevIdx = lyricView.idx;
    lyricView.idx = state.idx;
    lyricView.changedAt = nowMs;
  }
  var layout = getLayout(state.idx);
  if (!layout) return;

  var bottomY = H * 0.822;
  var fadeIn = clamp01((nowMs - lyricView.changedAt) / 260);

  /* 底衬，压住角色和铁网，字才认得出 */
  var scrimTop = Math.max(0, bottomY - layout.rows.length * layout.lineHeight - layout.size * 1.5);
  try {
    var scrim = ctx.createLinearGradient(0, scrimTop, 0, H);
    scrim.addColorStop(0, 'rgba(6,9,12,0)');
    scrim.addColorStop(0.45, 'rgba(6,9,12,' + (0.40 * fadeIn).toFixed(3) + ')');
    scrim.addColorStop(1, 'rgba(6,9,12,' + (0.62 * fadeIn).toFixed(3) + ')');
    ctx.fillStyle = scrim;
    ctx.fillRect(0, scrimTop, W, H - scrimTop);
  } catch (err) {
    noteError('scrim', err);
    try {
      ctx.fillStyle = 'rgba(6,9,12,' + (0.45 * fadeIn).toFixed(3) + ')';
      ctx.fillRect(0, scrimTop, W, H - scrimTop);
    } catch (inner) { noteError('scrimFallback', inner); }
  }

  /* 上一句：缩小、变暗、向上退 */
  if (lyricView.prevIdx >= 0 && lyricView.prevIdx !== state.idx){
    var prevAge = clamp01((nowMs - lyricView.changedAt) / 520);
    if (prevAge < 1){
      var prevLayout = getLayout(lyricView.prevIdx);
      if (prevLayout){
        var prevSize = Math.min(layout.size * 0.44, prevLayout.size * 0.94);
        var prevAlpha = 0.34 * (1 - prevAge);
        ctx.save();
        try {
          ctx.font = fontString(prevSize);
          applyTracking(ctx, prevSize * 0.035);
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(214,224,230,' + prevAlpha.toFixed(3) + ')';
          var prevText = prevLayout.rows[0] ? prevLayout.rows[0].text : '';
          var prevY = bottomY - layout.rows.length * layout.lineHeight - layout.size * 0.55 - prevAge * layout.size * 0.5;
          ctx.fillText(prevText, W * 0.5, prevY);
        } catch (err) { noteError('prevLine', err); }
        ctx.restore();
      }
    }
  }

  drawCurrentLine(layout, bottomY, state.t, fadeIn);
}

/* ---------- 7. 画面合成 ---------- */
var shake = { x: 0, y: 0, targetX: 0, targetY: 0, nextAt: 0 };
var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, playing: true };
var pulse = 0;
var breathBob = 0;
var nearAlpha = 0.55;

function fallbackSky(){
  try {
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#101418');
    sky.addColorStop(0.55, '#3a4249');
    sky.addColorStop(0.72, '#7e878c');
    sky.addColorStop(1, '#14181c');
    ctx.fillStyle = sky;
  } catch (err) {
    noteError('fallbackSky', err);
    ctx.fillStyle = '#2c343a';
  }
  ctx.fillRect(0, 0, W, H);
}

function drawScene(){
  ctx.fillStyle = '#0d1014';
  ctx.fillRect(0, 0, W, H);
  if (isDrawable(bake.backdrop)) blit(bake.backdrop, shake.x * 0.4, shake.y * 0.4, 1);
  else fallbackSky();
  if (isDrawable(bake.far)) blit(bake.far, shake.x * 0.9, shake.y * 0.9, 1);
  drawSnow();
  if (isDrawable(bake.figure)) blit(bake.figure, shake.x * 1.1, shake.y * 1.1 + breathBob, 1);
  drawBreath();
  drawLampFlare();
  drawLyrics();
  if (isDrawable(bake.near)) blit(bake.near, shake.x * 2.6, shake.y * 2.6, nearAlpha, 'screen');
  drawFilm();
}

function drawLampFlare(){
  var sprites = bake.sprites;
  if (!sprites || !sprites.bokeh || !sprites.bokeh.width) return;
  var strength = 0.09 + pulse * 0.07 + clamp01(live.treble) * 0.09;
  var size = Math.max(W, H) * 0.78;
  ctx.save();
  try {
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = clamp01(strength);
    ctx.drawImage(sprites.bokeh, W * 0.79 - size * 0.5, H * 0.17 - size * 0.5, size, size);
  } catch (err) { noteError('lamp', err); }
  ctx.restore();
}

/* 雪：远层小点 + 近层虚焦光斑 */
var snowFar = [];
var snowNear = [];
var snowReady = false;

function seedSnow(){
  var farCount = report.rm ? 40 : 90;
  var nearCount = report.rm ? 6 : 14;
  var i;
  snowFar.length = 0;
  snowNear.length = 0;
  for (i = 0; i < farCount; i++){
    snowFar.push({
      x: Math.random(), y: Math.random(),
      speed: 0.010 + Math.random() * 0.030,
      drift: -0.004 + Math.random() * 0.012,
      size: 0.9 + Math.random() * 2.0,
      alpha: 0.18 + Math.random() * 0.4,
      phase: Math.random() * 6.28
    });
  }
  for (i = 0; i < nearCount; i++){
    snowNear.push({
      x: Math.random(), y: Math.random(),
      speed: 0.030 + Math.random() * 0.055,
      drift: -0.010 + Math.random() * 0.022,
      size: 0.10 + Math.random() * 0.14,
      alpha: 0.07 + Math.random() * 0.14,
      phase: Math.random() * 6.28
    });
  }
  snowReady = true;
}

function drawSnow(){
  if (!snowReady) seedSnow();
  var i, flake;
  ctx.save();
  try {
    ctx.fillStyle = 'rgba(224,234,240,0.9)';
    for (i = 0; i < snowFar.length; i++){
      flake = snowFar[i];
      var px = flake.x * W + Math.sin(flake.phase + state.t * 0.6) * 6;
      var py = flake.y * H;
      ctx.globalAlpha = flake.alpha;
      ctx.fillRect(px, py, flake.size * view.unit, flake.size * view.unit);
    }
    var sprites = bake.sprites;
    if (sprites && sprites.bokeh && sprites.bokeh.width > 0){
      for (i = 0; i < snowNear.length; i++){
        flake = snowNear[i];
        var bx = flake.x * W + Math.sin(flake.phase + state.t * 0.4) * 18;
        var by = flake.y * H;
        var radius = flake.size * Math.min(W, H);
        ctx.globalAlpha = flake.alpha;
        ctx.drawImage(sprites.bokeh, bx - radius, by - radius, radius * 2, radius * 2);
      }
    }
  } catch (err) { noteError('snow', err); }
  ctx.restore();
}

function stepSnow(dt){
  if (!snowReady) return;
  var motion = report.rm ? 0.35 : 1;
  var i, flake;
  for (i = 0; i < snowFar.length; i++){
    flake = snowFar[i];
    flake.y += flake.speed * dt * motion;
    flake.x += flake.drift * dt * motion;
    if (flake.y > 1.05){ flake.y -= 1.1; flake.x = Math.random(); }
    if (flake.x < -0.05) flake.x += 1.1;
    if (flake.x > 1.05) flake.x -= 1.1;
  }
  for (i = 0; i < snowNear.length; i++){
    flake = snowNear[i];
    flake.y += flake.speed * dt * motion;
    flake.x += flake.drift * dt * motion;
    if (flake.y > 1.1){ flake.y -= 1.15; flake.x = Math.random(); }
    if (flake.x < -0.1) flake.x += 1.2;
    if (flake.x > 1.1) flake.x -= 1.2;
  }
}

/* 呼气成雾 */
var puffs = [];
var puffTimer = 0;

function stepBreath(dt){
  if (!puffs.length){
    for (var slot = 0; slot < 14; slot++) puffs.push({ life: 0, x: 0, y: 0, vx: 0, vy: 0, size: 0, spin: 0 });
  }
  var bass = clamp01(live.bass);
  var interval = report.rm ? 3.4 : (2.6 - bass * 1.5);
  puffTimer -= dt;
  if (puffTimer <= 0 && figureState.pixelHeight > 40){
    puffTimer = Math.max(0.55, interval);
    for (var i = 0; i < puffs.length; i++){
      if (puffs[i].life > 0) continue;
      var puff = puffs[i];
      puff.life = 1;
      puff.x = figureState.feetX + figureState.pixelHeight * 0.035;
      puff.y = figureState.headY + figureState.pixelHeight * 0.115;
      puff.vx = figureState.pixelHeight * (0.10 + Math.random() * 0.10);
      puff.vy = -figureState.pixelHeight * (0.16 + Math.random() * 0.12);
      puff.size = figureState.pixelHeight * (0.06 + Math.random() * 0.04);
      puff.spin = (Math.random() - 0.5) * 0.5;
      break;
    }
  }
  for (var puffIndex = 0; puffIndex < puffs.length; puffIndex++){
    var item = puffs[puffIndex];
    if (item.life <= 0) continue;
    item.life -= dt * 0.55;
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    item.vy *= 0.988;
    item.size += item.size * dt * 0.8;
  }
}

function drawBreath(){
  var sprites = bake.sprites;
  if (!sprites || !sprites.vapor || !sprites.vapor.width) return;
  ctx.save();
  try {
    ctx.globalCompositeOperation = 'screen';
    for (var i = 0; i < puffs.length; i++){
      var puff = puffs[i];
      if (puff.life <= 0) continue;
      var alpha = clamp01(puff.life) * 0.30;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprites.vapor, puff.x - puff.size, puff.y - puff.size, puff.size * 2, puff.size * 2);
    }
  } catch (err) { noteError('breath', err); }
  ctx.restore();
}

/* 胶片：颗粒 / 划痕 / 暗角 */
function buildGrain(){
  try {
    var tiles = [];
    var tileSize = 192;
    var tileIndex, channelIndex;
    for (tileIndex = 0; tileIndex < 3; tileIndex++){
      var tile = document.createElement('canvas');
      tile.width = tileSize;
      tile.height = tileSize;
      var tileCtx = tile.getContext('2d');
      var image = tileCtx.createImageData(tileSize, tileSize);
      var data = image.data;
      for (channelIndex = 0; channelIndex < data.length; channelIndex += 4){
        var value = 106 + Math.floor(Math.random() * 46);
        data[channelIndex] = value;
        data[channelIndex + 1] = value;
        data[channelIndex + 2] = value;
        data[channelIndex + 3] = 255;
      }
      tileCtx.putImageData(image, 0, 0);
      tiles.push(tile);
    }
    bake.grain = tiles;
    bake.grainPatterns = [];
    for (channelIndex = 0; channelIndex < tiles.length; channelIndex++){
      try { bake.grainPatterns.push(ctx.createPattern(tiles[channelIndex], 'repeat')); }
      catch (err) { noteError('grainPattern', err); }
    }
  } catch (err) { noteError('grain', err); bake.grain = []; }
}

function buildLeak(){
  var layer = makeLayer();
  if (!isDrawable(layer)) return;
  var paint = layer.paint;
  try {
    var warm = mixAccent([255, 246, 232], 0.42);
    var left = mixAccent([180, 200, 220], 0.22);
    var leakA = paint.createRadialGradient(W * 0.92, H * 0.06, 0, W * 0.92, H * 0.06, Math.max(W, H) * 0.62);
    leakA.addColorStop(0, rgba(warm[0], warm[1], warm[2], 0.42));
    leakA.addColorStop(0.45, rgba(warm[0], warm[1], warm[2], 0.12));
    leakA.addColorStop(1, rgba(warm[0], warm[1], warm[2], 0));
    paint.fillStyle = leakA;
    paint.fillRect(0, 0, W, H);

    var leakB = paint.createRadialGradient(W * 0.03, H * 0.88, 0, W * 0.03, H * 0.88, Math.max(W, H) * 0.45);
    leakB.addColorStop(0, rgba(left[0], left[1], left[2], 0.26));
    leakB.addColorStop(1, rgba(left[0], left[1], left[2], 0));
    paint.fillStyle = leakB;
    paint.fillRect(0, 0, W, H);

    /* 胶片边沿的一点纵向擦痕 */
    paint.globalAlpha = 0.18;
    for (var streak = 0; streak < 6; streak++){
      var streakX = W * (0.86 + (streak % 3) * 0.035);
      var streakGrad = paint.createLinearGradient(0, 0, 0, H);
      streakGrad.addColorStop(0, rgba(warm[0], warm[1], warm[2], 0.16));
      streakGrad.addColorStop(0.5, rgba(warm[0], warm[1], warm[2], 0.02));
      streakGrad.addColorStop(1, rgba(warm[0], warm[1], warm[2], 0.10));
      paint.fillStyle = streakGrad;
      paint.fillRect(streakX, 0, Math.max(1, W * 0.004), H);
    }
    paint.globalAlpha = 1;
  } catch (err) { noteError('leak', err); }
  bake.leak = layer;
}

function buildVignette(){
  var layer = makeLayer();
  if (!isDrawable(layer)) return;
  var paint = layer.paint;
  try {
    var radius = Math.max(W, H) * 0.78;
    var vignette = paint.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.16, W * 0.5, H * 0.5, radius);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(0.55, 'rgba(2,4,6,0.20)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.74)');
    paint.fillStyle = vignette;
    paint.fillRect(0, 0, W, H);
    paint.fillStyle = 'rgba(40,60,78,0.10)';
    paint.fillRect(0, 0, W, H);
    var topShade = paint.createLinearGradient(0, 0, 0, H * 0.28);
    topShade.addColorStop(0, 'rgba(0,0,0,0.42)');
    topShade.addColorStop(1, 'rgba(0,0,0,0)');
    paint.fillStyle = topShade;
    paint.fillRect(0, 0, W, H * 0.28);
  } catch (err) { noteError('vignette', err); }
  bake.vignette = layer;
}

var scratchState = [];
var grainFrame = 0;

function stepScratches(dt){
  if (!scratchState.length){
    for (var slot = 0; slot < 3; slot++){
      scratchState.push({
        x: Math.random(), life: Math.random(), speed: 0.05 + Math.random() * 0.12,
        drift: (Math.random() - 0.5) * 0.010, alpha: 0.05 + Math.random() * 0.06,
        width: 1 + Math.random() * 0.8
      });
    }
  }
  for (var i = 0; i < scratchState.length; i++){
    var scratch = scratchState[i];
    scratch.life -= dt * scratch.speed;
    scratch.x += scratch.drift * dt;
    if (scratch.life <= 0){
      scratch.life = 1;
      scratch.x = Math.random();
      scratch.drift = (Math.random() - 0.5) * 0.012;
      scratch.alpha = 0.05 + Math.random() * 0.06;
    }
    if (scratch.x < -0.02) scratch.x += 1.04;
    if (scratch.x > 1.02) scratch.x -= 1.04;
  }
}

function drawFilm(){
  try {
    if (bake.grainPatterns && bake.grainPatterns.length && qualityLevel < 1){
      grainFrame++;
      var index = grainFrame % bake.grainPatterns.length;
      var pattern = bake.grainPatterns[index];
      if (pattern){
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = 0.10;
        var jitterX = -((grainFrame * 37) % 192);
        var jitterY = -((grainFrame * 61) % 192);
        ctx.translate(jitterX, jitterY);
        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, W + 192, H + 192);
        ctx.restore();
      }
    }
    if (!report.rm){
      var scratchIndex;
      for (scratchIndex = 0; scratchIndex < scratchState.length; scratchIndex++){
        var scratch = scratchState[scratchIndex];
        if (scratch.life <= 0) continue;
        var fade = Math.sin(clamp01(scratch.life) * Math.PI) * scratch.alpha;
        if (fade <= 0.004) continue;
        ctx.fillStyle = 'rgba(232,238,242,' + fade.toFixed(3) + ')';
        ctx.fillRect(scratch.x * W, 0, Math.max(0.6, scratch.width), H);
      }
    }
    if (isDrawable(bake.leak)){
      var leakAlpha = 0.10 + clamp01(live.treble) * 0.10 + pulse * 0.06;
      blit(bake.leak, 0, 0, clamp01(leakAlpha), 'screen');
    }
    if (!state.playing){
      ctx.fillStyle = 'rgba(4,6,9,0.12)';
      ctx.fillRect(0, 0, W, H);
    }
    /* 鼓点上一次极轻的曝光跳变，像有人对着黑夜按了一下闪光灯 */
    if (pulse > 0.02){
      ctx.fillStyle = 'rgba(214,228,238,' + (pulse * 0.030).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (isDrawable(bake.vignette)) blit(bake.vignette, 0, 0, 1);
  } catch (err) { noteError('film', err); }
}

function updateMotion(dt){
  var nowMs = (window.performance && performance.now) ? performance.now() : Date.now();
  if (nowMs >= shake.nextAt){
    var amp = report.rm ? 0.7 : (2.0 + clamp01(live.mid) * 2.8);
    shake.targetX = (Math.random() - 0.5) * amp;
    shake.targetY = (Math.random() - 0.5) * amp * 0.7;
    shake.nextAt = nowMs + 110 + Math.random() * 170;
  }
  var ease = 1 - Math.exp(-dt * 12);
  shake.x += (shake.targetX - shake.x) * ease;
  shake.y += (shake.targetY - shake.y) * ease;
  pulse *= Math.exp(-dt / 0.16);
  if (pulse < 0.002) pulse = 0;
  breathBob = Math.sin(nowMs * 0.0011) * (report.rm ? 0.3 : 1.3) * view.unit;
  nearAlpha = 0.48 + pulse * 0.10 + clamp01(live.bass) * 0.06;
  stepSnow(dt);
  stepBreath(dt);
  stepScratches(dt);
}

var lastNow = 0;
var slowStreak = 0;
var qualityLevel = 0;

function frame(at){
  requestAnimationFrame(frame);
  var nowMs = (window.performance && performance.now) ? performance.now() : Date.now();
  var dt = lastNow ? (nowMs - lastNow) / 1000 : 0.016;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  if (dt > 0.12) dt = 0.12;
  lastNow = nowMs;
  var jsStart = nowMs;
  try {
    frameCount++;
    report.frames = frameCount;
    report.t = state.t;
    report.playing = state.playing;
    state.idx = activeIndex(state.t);
    report.idx = state.idx;
    report.text = state.idx >= 0 && state.lines[state.idx] ? state.lines[state.idx].text : '';
    report.lines = state.lines.length;

    updateMotion(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawScene();
  } catch (err) { noteError('frame', err); }
  var cost = ((window.performance && performance.now) ? performance.now() : Date.now()) - jsStart;
  report.js = Math.round(cost * 100) / 100;
  if (cost > 20){
    slowStreak++;
    if (slowStreak > 45 && qualityLevel < 1){
      qualityLevel = 1;
      slowStreak = 0;
      try { console.warn('[424] frame over 20ms, dropping grain'); }
      catch (warnErr) { noteError('warn', warnErr); }
    }
  } else if (slowStreak > 0) slowStreak = 0;
  lastFrameAt = state.t;
}

report.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
started = true;
requestAnimationFrame(pumpBake);
requestAnimationFrame(frame);

})();
</script>
