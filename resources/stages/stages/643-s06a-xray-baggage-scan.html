<script>
/* ============================================================
   643 / S06A · X-RAY BAGGAGE SCAN
   one rule: no lyric sits on the scene — every line is luggage.
   layers: hall > machine > conveyor > case > phosphor ghost > HUD
   ============================================================ */
(function () {
  "use strict";

  /* ---------- 0. state / contract ---------- */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var W = 1440, H = 900;
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d", { alpha: false });

  window.__stage = function () {
    var i = S.idx, L = S.lines, tx = "";
    if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
    return {
      lines: L.length, idx: i, t: S.t, playing: !!S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
      text: tx, gl: false, rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var n = (window.performance && performance.now()) || Date.now();
    if (n - lastErrAt > 1200) {
      lastErrAt = n;
      try { console.error(e); } catch (_) {}
    }
  }

  /* ---------- 1. ready: first rAF unconditional, 800ms fallback ---------- */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }

  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    resize();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function () { sendReady(); boot(); });
  setTimeout(function () { sendReady(); boot(); }, 800);

  /* ---------- 2. constants ---------- */
  var FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif';
  var MONO = '"SFMono-Regular","Cascadia Mono","Consolas","Liberation Mono",monospace';
  var ACCENT = [90, 226, 214];
  var track = { title: "", artist: "", cover: "" };
  var coverImg = null, coverOK = false, coverURL = "";
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, playing: true };
  var smooth = { level: 0, bass: 0, mid: 0, treble: 0 };
  var lastBeatAt = -99, beatLevel = 0, beatIndex = 0;
  var lastTick = null, lastLine = -2, seekCount = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeOutCubic(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
  function mix(a, b, k) {
    return [Math.round(a[0] + (b[0] - a[0]) * k),
            Math.round(a[1] + (b[1] - a[1]) * k),
            Math.round(a[2] + (b[2] - a[2]) * k)];
  }
  function rgba(a, alpha) { return "rgba(" + a[0] + "," + a[1] + "," + a[2] + "," + alpha + ")"; }
  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function safeSize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    return { w: w, h: h };
  }
  function normAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return [90, 226, 214];
    var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return [90, 226, 214];
    r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
    if (r + g + b < 26) return [90, 226, 214];
    return [r, g, b];
  }
  function pad2(n) { n = Math.floor(n); return (n < 10 ? "0" : "") + n; }
  function timecode(t) {
    t = Math.max(0, t || 0);
    var m = Math.floor(t / 60), s = Math.floor(t % 60), f = Math.floor((t % 1) * 30);
    return pad2(m) + ":" + pad2(s) + ":" + pad2(f);
  }
  function roundRectPath(g, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }
  function drawLabel(str, x, y, size, color, align) {
    ctx.font = "500 " + size + "px " + MONO;
    ctx.fillStyle = color;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "middle";
    ctx.fillText(str, x, y);
  }

  /* ---------- 3. lyric parser (reference comm layer) ---------- */
  function charTimes(line) {
    var chars = Array.from(line.text || ""), n = chars.length, out = new Array(n);
    var cs = line.chars, i, j, rec, ct;
    if (cs && cs.length) {
      var rel = cs[0] && isFinite(cs[0].t) && cs[0].t < line.t - 0.08;
      for (i = 0; i < n; i++) {
        j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        rec = cs[j];
        ct = rec && rec.t;
        out[i] = isFinite(ct) ? (rel ? line.t + ct : ct) : null;
      }
      return out;
    }
    var d = line.dur > 0 ? line.dur : 3.4;
    for (i = 0; i < n; i++) out[i] = line.t + d * 0.88 * i / Math.max(1, n);
    return out;
  }
  function buildLines(raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      if (!l || typeof l !== "object") continue;
      var text = l.text == null ? "" : String(l.text);
      if (!text.trim()) continue;
      var t = Number(l.t); if (!isFinite(t) || t < 0) t = 0;
      var dur = Number(l.dur); if (!isFinite(dur) || dur < 0) dur = 0;
      var line = {
        t: t, dur: dur, text: text,
        chars: Array.isArray(l.chars) && l.chars.length ? l.chars : null
      };
      line.times = charTimes(line);
      out.push(line);
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }
  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  /* ---------- 4. init / tick / beat / live ---------- */
  function loadCover(url) {
    if (!url || url === coverURL) return;
    coverURL = url; coverImg = null; coverOK = false;
    try {
      var im = new Image();
      im.crossOrigin = "anonymous";
      im.onload = function () { coverImg = im; coverOK = true; };
      im.onerror = function () { coverImg = null; coverOK = false; };
      im.src = url;
    } catch (e) { coverImg = null; coverOK = false; }
  }

  function applyInit(p) {
    S.lines = buildLines(p.lines);
    S.idx = idxAt(S.t);
    ACCENT = normAccent(p.accent);
    var song = p.song || {};
    track.title = song.title || song.name || "";
    track.artist = song.artist || song.author || "";
    if (song.cover) loadCover(String(song.cover));
    live.bpm = 0;
    lastTick = null;
    lastBeatAt = -99;
    lastLine = -2;
    seekCount++;
  }

  function resetForSeek() {
    lastBeatAt = S.t - 9;
    beatLevel = 0;
    smooth.level = 0; smooth.bass = 0; smooth.mid = 0; smooth.treble = 0;
    lastLine = idxAt(S.t);
    seekCount++;
  }

  function onTick(p) {
    var t = Number(p.time);
    if (!isFinite(t)) return;
    var prev = lastTick;
    if (prev != null && Math.abs(t - prev) > 0.5) {
      S.t = t;
      resetForSeek();
      lastTick = t;
      S.idx = idxAt(t);
    } else {
      var dt = prev == null ? 0.066 : clamp(t - prev, 0, 0.4);
      if (dt > 0) {
        var k = 1 - Math.exp(-dt * 5);
        smooth.level += (live.level - smooth.level) * k;
        smooth.bass += (live.bass - smooth.bass) * k;
        smooth.mid += (live.mid - smooth.mid) * k;
        smooth.treble += (live.treble - smooth.treble) * k;
      }
      S.t = t;
      lastTick = t;
      var ni = idxAt(t);
      if (ni !== S.idx) { S.idx = ni; lastLine = ni; }
    }
    if (typeof p.playing === "boolean") { S.playing = p.playing; live.playing = p.playing; }
  }

  function onBeat(p) {
    var lv = Number(p.level);
    beatLevel = isFinite(lv) ? clamp(lv, 0, 1) : 0.55;
    beatIndex = isFinite(Number(p.index)) ? Number(p.index) : 0;
    lastBeatAt = S.t;
  }

  function onLive(p) {
    var x;
    x = Number(p.bpm); if (isFinite(x) && x > 0) live.bpm = x;
    x = Number(p.level); if (isFinite(x)) live.level = clamp(x, 0, 1);
    x = Number(p.bass); if (isFinite(x)) live.bass = clamp(x, 0, 1);
    x = Number(p.mid); if (isFinite(x)) live.mid = clamp(x, 0, 1);
    x = Number(p.treble); if (isFinite(x)) live.treble = clamp(x, 0, 1);
    if (typeof p.playing === "boolean") { live.playing = p.playing; S.playing = p.playing; }
  }

  addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    try {
      if (d.type === "init") applyInit(p);
      else if (d.type === "tick") onTick(p);
      else if (d.type === "beat") onBeat(p);
      else if (d.type === "live") onLive(p);
    } catch (e) { logErr(e); }
  });

  function activity() {
    try { parent.postMessage({ __c100: 1, type: "activity" }, "*"); } catch (_) {}
  }
  addEventListener("pointerdown", activity, { passive: true });
  addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      try { parent.postMessage({ __c100: 1, type: "key", payload: { key: "Space" } }, "*"); } catch (_) {}
    }
  });

  /* ---------- 5. canvas / resize / stop ---------- */
  var rafId = 0, stopped = false;
  function resize() {
    var sz = safeSize(); W = sz.w; H = sz.h;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    cv.style.width = W + "px";
    cv.style.height = H + "px";
  }
  addEventListener("resize", resize, { passive: true });
  addEventListener("pagehide", function () {
    stopped = true;
    if (rafId) { try { cancelAnimationFrame(rafId); } catch (_) {} rafId = 0; }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (rafId) { try { cancelAnimationFrame(rafId); } catch (_) {} rafId = 0; }
    } else if (!stopped && !rafId) {
      rafId = requestAnimationFrame(frame);
    }
  });

  /* ---------- 6. layout geometry ---------- */
  function sceneRect() {
    var portrait = W < H * 0.92;
    var vx = W * (portrait ? 0.045 : 0.065);
    var vw = W * (portrait ? 0.91 : 0.87);
    var vy = H * (portrait ? 0.205 : 0.125);
    var vh = H * (portrait ? 0.49 : 0.595);
    var bagW = Math.min(vw * (portrait ? 0.88 : 0.81), 1180);
    var bagH = Math.min(vh * (portrait ? 0.55 : 0.57), H * (portrait ? 0.315 : 0.33));
    var bagX = (W - bagW) * 0.5;
    var bagY = vy + vh * (portrait ? 0.18 : 0.17);
    return { portrait: portrait, vx: vx, vy: vy, vw: vw, vh: vh, bagX: bagX, bagY: bagY, bagW: bagW, bagH: bagH };
  }

  function layoutLine(line, bag, maxW, maxH) {
    var chars = Array.from(line.text || "");
    var fs = Math.min(88, Math.max(28, Math.min(bag.bagW * 0.091, bag.bagH * 0.265)));
    var weight = 700, rows = [], guard, i, row, adv, totalH, lineH;
    for (guard = 0; guard < 14; guard++) {
      ctx.font = weight + " " + fs + "px " + FONT;
      rows = []; row = { items: [], w: 0 };
      for (i = 0; i < chars.length; i++) {
        adv = ctx.measureText(chars[i]).width;
        if (row.w + adv > maxW && row.items.length) { rows.push(row); row = { items: [], w: 0 }; }
        row.items.push({ ch: chars[i], adv: adv, i: i });
        row.w += adv;
      }
      rows.push(row);
      lineH = fs * 1.16;
      totalH = rows.length * lineH;
      if (totalH <= maxH || fs <= 26) break;
      fs -= 4;
    }
    if (!rows.length) return null;
    var centerY = bag.bagY + bag.bagH * 0.51;
    var firstBase = centerY - (rows.length - 1) * lineH * 0.5 + fs * 0.34;
    var out = [], r, it, x, y, tm;
    for (r = 0; r < rows.length; r++) {
      x = bag.bagX + (bag.bagW - rows[r].w) * 0.5;
      y = firstBase + r * lineH;
      for (i = 0; i < rows[r].items.length; i++) {
        it = rows[r].items[i];
        tm = line.times[it.i];
        if (it.ch !== " ") {
          out.push({
            ch: it.ch, x: x, y: y, w: it.adv, i: it.i,
            time: isFinite(tm) ? tm : line.t
          });
        }
        x += it.adv;
      }
    }
    return { chars: out, fs: fs, rows: rows.length, lineH: lineH };
  }

  /* ---------- 7. drawing helpers ---------- */
  var charPattern = null;
  function makePatterns() {
    var p = document.createElement("canvas");
    p.width = 4; p.height = 4;
    var g = p.getContext("2d");
    g.fillStyle = "rgba(255,181,96,0.95)";
    g.fillRect(0, 0, 4, 4);
    g.fillStyle = "rgba(28,9,0,0.32)";
    g.fillRect(0, 0, 4, 1);
    charPattern = ctx.createPattern(p, "repeat");
  }
  makePatterns();

  function drawCase(x, y, w, h, alpha, withDetails) {
    var r = Math.min(30, h * 0.14);
    var accent = mix(ACCENT, [122, 244, 224], 0.55);
    ctx.save();
    ctx.globalAlpha = alpha;
    /* handle */
    ctx.beginPath();
    ctx.moveTo(x + w * 0.37, y + 2);
    ctx.bezierCurveTo(x + w * 0.37, y - h * 0.15, x + w * 0.63, y - h * 0.15, x + w * 0.63, y + 2);
    ctx.strokeStyle = rgba(accent, 0.48);
    ctx.lineWidth = Math.max(2, h * 0.016);
    ctx.stroke();
    /* body */
    roundRectPath(ctx, x, y, w, h, r);
    var bg = ctx.createLinearGradient(x, y, x + w, y + h);
    bg.addColorStop(0, "rgba(8,31,31,0.86)");
    bg.addColorStop(0.48, "rgba(4,19,19,0.73)");
    bg.addColorStop(1, "rgba(13,37,29,0.82)");
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = rgba(accent, 0.62);
    ctx.lineWidth = 1.4;
    ctx.stroke();
    /* inner rim */
    roundRectPath(ctx, x + 7, y + 7, w - 14, h - 14, Math.max(3, r - 6));
    ctx.strokeStyle = rgba(accent, 0.15);
    ctx.lineWidth = 1;
    ctx.stroke();
    if (withDetails) {
      ctx.save();
      roundRectPath(ctx, x, y, w, h, r);
      ctx.clip();
      /* phantom ribs / cavity structure */
      ctx.strokeStyle = rgba(accent, 0.13);
      ctx.lineWidth = 1;
      var rows = 7, i;
      for (i = 1; i < rows; i++) {
        var yy = y + h * i / rows;
        ctx.beginPath(); ctx.moveTo(x + w * 0.04, yy); ctx.lineTo(x + w * 0.96, yy); ctx.stroke();
      }
      /* diagonal stitched seams */
      ctx.setLineDash([3, 7]);
      ctx.strokeStyle = rgba(accent, 0.15);
      for (i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x + w * 0.5 + i * w * 0.22, y);
        ctx.lineTo(x + w * 0.5 + i * w * 0.22 - h * 0.36, y + h);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      /* zipper */
      var zy = y + h * 0.885;
      ctx.strokeStyle = rgba(accent, 0.42);
      ctx.beginPath(); ctx.moveTo(x + w * 0.07, zy); ctx.lineTo(x + w * 0.93, zy); ctx.stroke();
      ctx.setLineDash([2, 4]);
      ctx.strokeStyle = rgba(accent, 0.35);
      ctx.beginPath(); ctx.moveTo(x + w * 0.07, zy); ctx.lineTo(x + w * 0.93, zy); ctx.stroke();
      ctx.setLineDash([]);
      /* zip pull */
      ctx.strokeStyle = rgba(accent, 0.55);
      ctx.strokeRect(x + w * 0.915, zy - 3, 6, 9);
      /* corner protectors */
      ctx.strokeStyle = rgba(accent, 0.32);
      ctx.lineWidth = 2;
      var cp = Math.min(30, w * 0.025, h * 0.12);
      ctx.beginPath();
      ctx.moveTo(x + 4, y + r + cp); ctx.lineTo(x + 4, y + r); ctx.quadraticCurveTo(x + 4, y + 4, x + r, y + 4); ctx.lineTo(x + r + cp, y + 4);
      ctx.moveTo(x + w - 4, y + h - r - cp); ctx.lineTo(x + w - 4, y + h - r); ctx.quadraticCurveTo(x + w - 4, y + h - 4, x + w - r, y + h - 4); ctx.lineTo(x + w - r - cp, y + h - 4);
      ctx.stroke();
      ctx.restore();
      /* wheels */
      ctx.fillStyle = "rgba(2,9,9,0.95)";
      ctx.strokeStyle = rgba(accent, 0.45);
      ctx.lineWidth = 1;
      var wr = Math.max(4, h * 0.026);
      [x + w * 0.13, x + w * 0.87].forEach(function (wx) {
        ctx.beginPath(); ctx.arc(wx, y + h + wr * 0.4, wr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      });
    }
    ctx.restore();
  }

  function drawHall(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#051013");
    g.addColorStop(0.55, "#02090b");
    g.addColorStop(1, "#010506");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    /* terminal architecture: ceiling ribbons */
    var ceiling = H * 0.16;
    ctx.save();
    for (var i = 0; i < 6; i++) {
      var y = ceiling + i * H * 0.026;
      ctx.strokeStyle = "rgba(102,172,165," + (0.035 + i * 0.006) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W * 0.05, y);
      ctx.lineTo(W * 0.95, y + Math.sin(t * 0.01 + i) * 2);
      ctx.stroke();
    }
    /* side columns */
    [W * 0.035, W * 0.965].forEach(function (x, k) {
      var cg = ctx.createLinearGradient(x - 20, 0, x + 20, 0);
      cg.addColorStop(0, "rgba(60,118,111,0)");
      cg.addColorStop(0.5, "rgba(74,143,133,0.055)");
      cg.addColorStop(1, "rgba(60,118,111,0)");
      ctx.fillStyle = cg;
      ctx.fillRect(x - 25, H * 0.17, 50, H * 0.72);
      ctx.strokeStyle = "rgba(100,190,178,0.07)";
      ctx.beginPath(); ctx.moveTo(x, H * 0.17); ctx.lineTo(x, H * 0.9); ctx.stroke();
    });
    ctx.restore();
    /* floor perspective */
    ctx.save();
    var horizon = H * 0.81;
    for (i = -7; i <= 7; i++) {
      ctx.strokeStyle = "rgba(82,160,150,0.045)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W * 0.5 + i * W * 0.035, horizon);
      ctx.lineTo(W * 0.5 + i * W * 0.21, H);
      ctx.stroke();
    }
    for (i = 0; i < 5; i++) {
      var yy = horizon + Math.pow(i / 5, 1.7) * H * 0.19;
      ctx.strokeStyle = "rgba(82,160,150,0.04)";
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    ctx.restore();
  }

  function drawMachine(t, sc) {
    var accent = mix(ACCENT, [106, 235, 218], 0.6);
    var thick = Math.max(10, Math.min(W, H) * 0.016);
    /* machine body */
    var mx = W * 0.035, my = H * 0.065, mw = W * 0.93, mh = H * 0.825;
    roundRectPath(ctx, mx, my, mw, mh, Math.min(36, W * 0.02));
    var mg = ctx.createLinearGradient(mx, my, mx, my + mh);
    mg.addColorStop(0, "rgba(12,31,33,0.88)");
    mg.addColorStop(0.5, "rgba(5,18,19,0.74)");
    mg.addColorStop(1, "rgba(10,24,23,0.92)");
    ctx.fillStyle = mg;
    ctx.fill();
    ctx.strokeStyle = "rgba(126,206,195,0.20)";
    ctx.lineWidth = 1;
    ctx.stroke();
    /* top warning strip */
    ctx.fillStyle = "rgba(255,177,92,0.055)";
    ctx.fillRect(mx + 2, my + 2, mw - 4, 3);
    /* chamber outer */
    var cx = sc.vx - thick * 0.55, cy = sc.vy - thick * 0.55;
    var cw = sc.vw + thick * 1.1, ch = sc.vh + thick * 1.1;
    roundRectPath(ctx, cx, cy, cw, ch, Math.min(28, W * 0.018));
    ctx.fillStyle = "rgba(0,0,0,0.62)";
    ctx.fill();
    ctx.strokeStyle = "rgba(100,190,178,0.22)";
    ctx.lineWidth = 1;
    ctx.stroke();
    /* chamber glass */
    roundRectPath(ctx, sc.vx, sc.vy, sc.vw, sc.vh, Math.min(16, W * 0.012));
    var vg = ctx.createRadialGradient(W * 0.5, sc.vy + sc.vh * 0.44, 10, W * 0.5, sc.vy + sc.vh * 0.5, Math.max(sc.vw, sc.vh) * 0.72);
    vg.addColorStop(0, "rgba(9,43,42,0.68)");
    vg.addColorStop(0.55, "rgba(4,25,26,0.78)");
    vg.addColorStop(1, "rgba(2,11,12,0.95)");
    ctx.fillStyle = vg;
    ctx.fill();
    ctx.strokeStyle = rgba(accent, 0.28);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    /* chamber inner scanlines */
    ctx.save();
    roundRectPath(ctx, sc.vx, sc.vy, sc.vw, sc.vh, Math.min(16, W * 0.012));
    ctx.clip();
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = rgba(accent, 0.5);
    ctx.lineWidth = 1;
    for (var y = sc.vy + 4; y < sc.vy + sc.vh; y += 5) {
      ctx.beginPath(); ctx.moveTo(sc.vx, y); ctx.lineTo(sc.vx + sc.vw, y); ctx.stroke();
    }
    ctx.restore();
    /* chamber corner brackets */
    var bl = Math.max(18, Math.min(W, H) * 0.022);
    ctx.strokeStyle = rgba(accent, 0.62);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sc.vx + 12, sc.vy + 12 + bl); ctx.lineTo(sc.vx + 12, sc.vy + 12); ctx.lineTo(sc.vx + 12 + bl, sc.vy + 12);
    ctx.moveTo(sc.vx + sc.vw - 12 - bl, sc.vy + 12); ctx.lineTo(sc.vx + sc.vw - 12, sc.vy + 12); ctx.lineTo(sc.vx + sc.vw - 12, sc.vy + 12 + bl);
    ctx.moveTo(sc.vx + 12, sc.vy + sc.vh - 12 - bl); ctx.lineTo(sc.vx + 12, sc.vy + sc.vh - 12); ctx.lineTo(sc.vx + 12 + bl, sc.vy + sc.vh - 12);
    ctx.moveTo(sc.vx + sc.vw - 12 - bl, sc.vy + sc.vh - 12); ctx.lineTo(sc.vx + sc.vw - 12, sc.vy + sc.vh - 12); ctx.lineTo(sc.vx + sc.vw - 12, sc.vy + sc.vh - 12 - bl);
    ctx.stroke();
    /* top labels */
    drawLabel("BHS-06 / CABIN INSPECTION", sc.vx + 22, sc.vy + 25, 10, rgba(accent, 0.55), "left");
    drawLabel("DUAL ENERGY  ·  160 kVp", sc.vx + sc.vw - 22, sc.vy + 25, 10, rgba(accent, 0.4), "right");
    /* side ruler */
    ctx.strokeStyle = rgba(accent, 0.22);
    for (var i = 0; i < 18; i++) {
      var ry = sc.vy + 52 + i * (sc.vh - 82) / 17;
      var len = i % 4 === 0 ? 8 : 4;
      ctx.beginPath(); ctx.moveTo(sc.vx + 22, ry); ctx.lineTo(sc.vx + 22 + len, ry); ctx.stroke();
    }
    /* right spectral organ */
    var bars = 10, bx = sc.vx + sc.vw - 32;
    for (i = 0; i < bars; i++) {
      var lvl = i < 3 ? smooth.bass : (i < 7 ? smooth.mid : smooth.treble);
      var bh = 8 + lvl * 72 * (0.45 + 0.55 * hash(i + 4.2));
      ctx.fillStyle = rgba(accent, 0.15 + lvl * 0.28);
      ctx.fillRect(bx, sc.vy + sc.vh - 38 - bh, 2, bh);
      bx += 4;
    }
  }

  function drawConveyor(t, sc) {
    var accent = mix(ACCENT, [102, 230, 212], 0.55);
    var by = sc.bagY + sc.bagH + sc.bagH * 0.16;
    var x0 = sc.vx + 8, x1 = sc.vx + sc.vw - 8;
    var q = Math.floor(t * 12) / 12;
    /* belt body */
    ctx.save();
    var bg = ctx.createLinearGradient(0, by - 10, 0, by + 28);
    bg.addColorStop(0, "rgba(20,42,40,0.5)");
    bg.addColorStop(0.4, "rgba(4,12,12,0.9)");
    bg.addColorStop(1, "rgba(18,36,32,0.3)");
    ctx.fillStyle = bg;
    ctx.fillRect(x0, by - 6, x1 - x0, 32);
    ctx.strokeStyle = "rgba(120,202,188,0.14)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, by + 26); ctx.lineTo(x1, by + 26); ctx.stroke();
    /* rollers */
    var n = Math.max(9, Math.floor((x1 - x0) / 70));
    for (var i = 0; i <= n; i++) {
      var rx = x0 + (x1 - x0) * i / n;
      var rr = 7.5;
      ctx.beginPath(); ctx.arc(rx, by + 7, rr, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(3,14,14,0.9)";
      ctx.fill();
      ctx.strokeStyle = "rgba(126,208,193,0.25)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      var a = q * 4.2 + i * 0.45;
      ctx.moveTo(rx + Math.cos(a) * 2, by + 7 + Math.sin(a) * 2);
      ctx.lineTo(rx + Math.cos(a) * 6, by + 7 + Math.sin(a) * 6);
      ctx.stroke();
    }
    /* moving belt ticks */
    ctx.setLineDash([14, 26]);
    ctx.lineDashOffset = -q * 48;
    ctx.strokeStyle = rgba(accent, 0.16);
    ctx.beginPath(); ctx.moveTo(x0, by + 21); ctx.lineTo(x1, by + 21); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawBagScene(t, sc, pulse) {
    var accent = mix(ACCENT, [105, 235, 218], 0.6);
    var i = idxAt(t);
    S.idx = i;
    var line = i >= 0 ? S.lines[i] : null;
    var age = line ? t - line.t : 0;
    var entry = line ? easeOutCubic(clamp(age / 0.62, 0, 1)) : 0;
    var slide = (1 - entry) * (RM ? 12 : 46);
    var amp = RM ? 0.2 : 1;
    var sway = Math.sin(t * 0.85 + i * 0.7) * 2.2 * amp;
    var x = sc.bagX + slide, y = sc.bagY + sway;
    var w = sc.bagW, h = sc.bagH;

    drawConveyor(t, sc);
    drawCase(x + 7 * (1 - entry), y + 8, w, h, 0.22, false);
    drawCase(x, y, w, h, 1, true);
    /* case fill glow-free amber cavity */
    ctx.save();
    roundRectPath(ctx, x + 2, y + 2, w - 4, h - 4, Math.min(30, h * 0.14));
    ctx.clip();
    var cg = ctx.createLinearGradient(x, y + h * 0.2, x + w, y + h * 0.8);
    cg.addColorStop(0, "rgba(255,155,68,0.025)");
    cg.addColorStop(0.5, "rgba(255,177,92,0.07)");
    cg.addColorStop(1, "rgba(255,120,55,0.02)");
    ctx.fillStyle = cg;
    ctx.fillRect(x, y, w, h);
    /* internal cavity wire contours */
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = "rgba(255,186,113,0.42)";
    ctx.lineWidth = 1;
    for (var k = 0; k < 3; k++) {
      ctx.beginPath();
      var yy = y + h * (0.28 + k * 0.19);
      ctx.moveTo(x + w * 0.08, yy);
      ctx.bezierCurveTo(x + w * 0.32, yy - 13, x + w * 0.66, yy + 15, x + w * 0.92, yy - 3);
      ctx.stroke();
    }
    ctx.restore();

    /* tag with cover or accent chip */
    drawTag(x, y, w, h, accent);
    drawLyrics(t, sc, x, y, w, h, line, pulse);
    drawScanBeam(t, sc, x, y, w, h, line, pulse);
    /* empty state */
    if (!line) drawEmpty(t, x, y, w, h, accent);
  }

  function drawTag(x, y, w, h, accent) {
    var tw = Math.max(112, Math.min(178, w * 0.19));
    var th = Math.max(28, Math.min(40, h * 0.13));
    var tx = x + 18, ty = y - th * 0.72;
    ctx.save();
    roundRectPath(ctx, tx, ty, tw, th, 3);
    ctx.fillStyle = "rgba(4,14,14,0.9)";
    ctx.fill();
    ctx.strokeStyle = "rgba(140,218,204,0.28)";
    ctx.lineWidth = 1;
    ctx.stroke();
    if (coverOK && coverImg) {
      ctx.save();
      roundRectPath(ctx, tx + 4, ty + 4, th - 8, th - 8, 2);
      ctx.clip();
      ctx.globalAlpha = 0.72;
      ctx.drawImage(coverImg, tx + 4, ty + 4, th - 8, th - 8);
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = rgba(accent, 0.8);
      ctx.fillRect(tx + 4, ty + 4, th - 8, th - 8);
      ctx.restore();
    } else {
      ctx.fillStyle = rgba(accent, 0.17);
      ctx.fillRect(tx + 5, ty + 5, th - 10, th - 10);
      ctx.strokeStyle = rgba(accent, 0.4);
      ctx.strokeRect(tx + 8, ty + 8, th - 16, th - 16);
      ctx.beginPath(); ctx.moveTo(tx + 5, ty + th - 5); ctx.lineTo(tx + th - 5, ty + 5); ctx.stroke();
    }
    var title = track.title || "UNCLAIMED / 643";
    if (title.length > 18) title = title.slice(0, 17) + "…";
    ctx.font = "600 " + Math.max(8, th * 0.27) + "px " + MONO;
    ctx.fillStyle = "rgba(221,249,241,0.76)";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(title, tx + th + 5, ty + th * 0.43);
    ctx.font = "400 " + Math.max(7, th * 0.2) + "px " + MONO;
    ctx.fillStyle = "rgba(123,203,190,0.5)";
    ctx.fillText((track.artist || "BAGGAGE HANDLING").slice(0, 24), tx + th + 5, ty + th * 0.72);
    ctx.restore();
  }

  function drawLyrics(t, sc, bx, by, bw, bh, line, pulse) {
    if (!line) return;
    var maxW = bw * 0.82, maxH = bh * 0.63;
    var lay = layoutLine(line, { bagX: bx, bagY: by, bagW: bw, bagH: bh }, maxW, maxH);
    if (!lay) return;
    var accent = mix(ACCENT, [108, 238, 220], 0.55);
    var fs = lay.fs;
    ctx.save();
    ctx.font = "700 " + fs + "px " + FONT;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    for (var i = 0; i < lay.chars.length; i++) {
      var c = lay.chars[i];
      var hit = t >= c.time - 0.01;
      var since = t - c.time;
      if (hit) {
        /* plain phosphor fill — no glow, no particles */
        ctx.fillStyle = charPattern;
        ctx.globalAlpha = 0.88;
        ctx.fillText(c.ch, c.x, c.y);
        ctx.globalAlpha = 0.46;
        ctx.strokeStyle = "rgba(255,213,164,0.8)";
        ctx.lineWidth = 0.7;
        ctx.strokeText(c.ch, c.x, c.y);
        /* detection brackets */
        if (since < 1.15) {
          var a = 0.5 * Math.pow(1 - since / 1.15, 1.6);
          ctx.globalAlpha = a;
          ctx.strokeStyle = rgba(accent, 0.9);
          ctx.lineWidth = 1;
          var l = 5, top = c.y - fs * 0.83, right = c.x + c.w;
          ctx.beginPath();
          ctx.moveTo(c.x + 2, top + l); ctx.lineTo(c.x + 2, top); ctx.lineTo(c.x + 2 + l, top);
          ctx.moveTo(right - 2 - l, top); ctx.lineTo(right - 2, top); ctx.lineTo(right - 2, top + l);
          ctx.moveTo(c.x + 2, c.y + 3 - l); ctx.lineTo(c.x + 2, c.y + 3); ctx.lineTo(c.x + 2 + l, c.y + 3);
          ctx.moveTo(right - 2 - l, c.y + 3); ctx.lineTo(right - 2, c.y + 3); ctx.lineTo(right - 2, c.y + 3 - l);
          ctx.stroke();
        }
        /* sparse measurement label */
        if (i % 5 === 0 && since < 2.2) {
          ctx.globalAlpha = 0.3 * Math.max(0, 1 - since / 2.2);
          ctx.font = "400 " + Math.max(7, fs * 0.105) + "px " + MONO;
          ctx.fillStyle = rgba(accent, 0.9);
          ctx.fillText("0." + (92 + Math.floor(hash(c.i + line.t) * 7)), c.x + 1, c.y + fs * 0.18);
          ctx.font = "700 " + fs + "px " + FONT;
        }
      } else {
        /* not yet scanned: object is only a wireframe */
        ctx.globalAlpha = 0.22;
        ctx.strokeStyle = "rgba(159,231,216,0.65)";
        ctx.lineWidth = 0.75;
        ctx.setLineDash([2, 4]);
        ctx.strokeText(c.ch, c.x, c.y);
        ctx.setLineDash([]);
        if (i === 0 || c.i % 7 === 0) {
          ctx.globalAlpha = 0.18;
          ctx.strokeStyle = rgba(accent, 0.65);
          ctx.strokeRect(c.x + 2, c.y - fs * 0.8, Math.max(4, c.w - 4), fs * 0.88);
        }
      }
    }
    /* object ID string on baseline, deliberately quiet */
    ctx.globalAlpha = 0.34;
    drawLabel("OBJ " + pad2(S.idx + 1) + " / " + pad2(lay.chars.length) + " CH", bx + 18, by + bh - 14, Math.max(8, fs * 0.12), rgba(accent, 0.8), "left");
    ctx.restore();
    /* scan progress notch at bottom of case */
    var det = 0;
    for (i = 0; i < lay.chars.length; i++) if (t >= lay.chars[i].time) det++;
    var p = lay.chars.length ? det / lay.chars.length : 0;
    ctx.fillStyle = "rgba(255,174,92,0.7)";
    ctx.fillRect(bx + 18, by + bh - 8, (bw - 36) * p, 1);
    ctx.fillStyle = "rgba(110,215,200,0.15)";
    ctx.fillRect(bx + 18 + (bw - 36) * p, by + bh - 8, (bw - 36) * (1 - p), 1);
  }

  function drawScanBeam(t, sc, bx, by, bw, bh, line, pulse) {
    var accent = mix(ACCENT, [142, 255, 232], 0.45);
    var p = 0.5;
    if (line) {
      var end = line.t + Math.max(0.9, line.dur || 2.6);
      var last = line.t;
      for (var i = 0; i < line.times.length; i++) if (isFinite(line.times[i])) last = Math.max(last, line.times[i]);
      end = Math.max(end, last + 0.55);
      p = clamp((t - line.t) / Math.max(0.8, end - line.t), 0, 1);
      if (t > end) p = 0.15 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.55));
    } else {
      p = 0.08 + 0.84 * (0.5 + 0.5 * Math.sin(t * 0.38));
    }
    var x = bx + bw * (0.08 + p * 0.84);
    var top = by - 10, bottom = by + bh + 12;
    ctx.save();
    roundRectPath(ctx, sc.vx, sc.vy, sc.vw, sc.vh, Math.min(16, W * 0.012));
    ctx.clip();
    /* broad phosphor band */
    var g = ctx.createLinearGradient(x - 90, 0, x + 90, 0);
    g.addColorStop(0, "rgba(90,220,205,0)");
    g.addColorStop(0.36, rgba(accent, 0.035));
    g.addColorStop(0.5, rgba(accent, 0.11 + pulse * 0.08));
    g.addColorStop(0.64, rgba(accent, 0.035));
    g.addColorStop(1, "rgba(90,220,205,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - 90, top, 180, bottom - top);
    /* crisp beam */
    ctx.globalAlpha = 0.72 + pulse * 0.2;
    ctx.strokeStyle = rgba(accent, 0.7);
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
    ctx.globalAlpha = 0.35;
    ctx.setLineDash([8, 6]);
    ctx.lineDashOffset = -t * 22;
    ctx.beginPath(); ctx.moveTo(x - 11, top); ctx.lineTo(x - 11, bottom); ctx.stroke();
    ctx.setLineDash([]);
    /* beam head ticks */
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = rgba(accent, 0.8);
    for (var k = 0; k < 11; k++) {
      var yy = top + (bottom - top) * k / 10;
      ctx.fillRect(x - 3, yy, hash(k + t * 0.2) > 0.5 ? 6 : 3, 1);
    }
    /* low horizontal scan sweep inside glass */
    var sy = sc.vy + ((t * 42) % (sc.vh + 180)) - 90;
    ctx.globalAlpha = 0.25;
    var sg = ctx.createLinearGradient(0, sy - 25, 0, sy + 25);
    sg.addColorStop(0, "rgba(120,240,219,0)");
    sg.addColorStop(0.5, rgba(accent, 0.12));
    sg.addColorStop(1, "rgba(120,240,219,0)");
    ctx.fillStyle = sg;
    ctx.fillRect(sc.vx, sy - 25, sc.vw, 50);
    ctx.restore();
    /* beam value label */
    ctx.globalAlpha = 0.55;
    drawLabel("SCAN " + pad2(Math.round(p * 100)) + "%", x + 9, by - 17, 9, rgba(accent, 0.8), "left");
    ctx.globalAlpha = 1;
  }

  function drawEmpty(t, x, y, w, h, accent) {
    var lvl = smooth.level, bass = smooth.bass, mid = smooth.mid;
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = rgba(accent, 0.42);
    ctx.lineWidth = 1;
    ctx.beginPath();
    var pts = 80;
    for (var i = 0; i <= pts; i++) {
      var px = x + w * 0.12 + (w * 0.76) * i / pts;
      var env = Math.sin(Math.PI * i / pts);
      var n = Math.sin(i * 1.63 + t * 5.1) * 0.45 + Math.sin(i * 0.31 - t * 2.3) * 0.55;
      var py = y + h * 0.52 + n * (8 + lvl * 40 + bass * 26) * env;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = rgba(accent, 0.55);
    ctx.beginPath();
    for (i = 0; i <= pts; i++) {
      var px2 = x + w * 0.12 + (w * 0.76) * i / pts;
      var n2 = Math.sin(i * 2.1 - t * 3.8);
      var py2 = y + h * 0.64 + n2 * (5 + mid * 18);
      if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    drawLabel("NO MANIFEST / AUDIO RESIDUE", x + w * 0.5, y + h * 0.52, Math.max(10, Math.min(18, w * 0.018)), rgba(accent, 0.62), "center");
    ctx.restore();
  }

  function drawHud(t, sc, pulse) {
    var accent = mix(ACCENT, [116, 241, 223], 0.55);
    var m = Math.max(14, Math.min(W, H) * 0.025);
    var topY = Math.max(18, H * 0.033);
    ctx.save();
    /* top rule */
    ctx.strokeStyle = "rgba(127,208,193,0.13)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(m, topY + 14); ctx.lineTo(W - m, topY + 14); ctx.stroke();
    /* live dot */
    var blink = 0.45 + 0.55 * (0.5 + 0.5 * Math.cos(t * 4.4));
    ctx.globalAlpha = blink;
    ctx.fillStyle = rgba(accent, 0.9);
    ctx.beginPath(); ctx.arc(m + 4, topY, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    drawLabel("BHS·06  /  ARRIVALS", m + 15, topY, 10, "rgba(204,246,236,0.58)", "left");
    drawLabel("643 / S06A  ·  " + timecode(t), W - m, topY, 10, "rgba(204,246,236,0.48)", "right");
    /* right vertical notice */
    if (W > 700) {
      ctx.save();
      ctx.translate(W - m + 4, sc.vy + sc.vh * 0.5);
      ctx.rotate(Math.PI * 0.5);
      ctx.globalAlpha = 0.32;
      drawLabel("X-RAY ACTIVE  ·  KEEP CLEAR  ·  LINE 06", 0, 0, 8, rgba(accent, 0.9), "center");
      ctx.restore();
    }
    /* bottom status */
    var by = H - Math.max(15, H * 0.028);
    drawLabel("CONVEYOR 0.28 m/s", m, by, 9, "rgba(155,220,208,0.4)", "left");
    var bpm = live.bpm > 0 ? Math.round(live.bpm) + " BPM" : "LIVE";
    drawLabel(bpm + "  /  " + (S.playing ? "RUN" : "HOLD"), W - m, by, 9, "rgba(155,220,208,0.4)", "right");
    if (!S.playing) {
      drawLabel("HOLD FRAME", W * 0.5, by - 14, 9, "rgba(255,173,93,0.68)", "center");
    }
    /* bottom center census */
    drawLabel("ACTIVE OBJECT " + (S.idx >= 0 ? pad2(S.idx + 1) : "--") + "  ·  " + pad2(S.lines.length) + " IN QUEUE", W * 0.5, by, 9, "rgba(155,220,208,0.3)", "center");
    /* machine id */
    ctx.globalAlpha = 0.42;
    drawLabel("SN 643-06A", sc.vx + 22, sc.vy + sc.vh - 22, 8, rgba(accent, 0.65), "left");
    drawLabel("0.160 mSv", sc.vx + sc.vw - 22, sc.vy + sc.vh - 22, 8, rgba(accent, 0.65), "right");
    ctx.restore();
  }

  function drawOverlay(t) {
    var accent = mix(ACCENT, [130, 240, 222], 0.5);
    /* vignette */
    var vg = ctx.createRadialGradient(W * 0.5, H * 0.47, Math.min(W, H) * 0.18, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(0.7, "rgba(0,0,0,0.24)");
    vg.addColorStop(1, "rgba(0,0,0,0.72)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    /* fine CRT lines, quantised to 12fps */
    var q = Math.floor(t * 12) / 12;
    ctx.fillStyle = "rgba(0,0,0,0.16)";
    for (var y = (q * 4) % 5; y < H; y += 5) ctx.fillRect(0, y, W, 1);
    /* dust / grain */
    ctx.save();
    ctx.globalAlpha = 0.12;
    var gf = Math.floor(t * 12);
    for (var i = 0; i < 90; i++) {
      var gx = hash(i * 1.37 + gf * 0.71) * W;
      var gy = hash(i * 2.11 - gf * 0.33) * H;
      ctx.fillStyle = i % 7 === 0 ? rgba(accent, 0.7) : "rgba(210,240,232,0.55)";
      ctx.fillRect(gx, gy, i % 5 === 0 ? 2 : 1, 1);
    }
    ctx.restore();
    /* corner marks */
    var m = Math.max(10, Math.min(W, H) * 0.018);
    ctx.strokeStyle = "rgba(130,210,197,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(m, m + 18); ctx.lineTo(m, m); ctx.lineTo(m + 18, m);
    ctx.moveTo(W - m, m + 18); ctx.lineTo(W - m, m); ctx.lineTo(W - m - 18, m);
    ctx.moveTo(m, H - m - 18); ctx.lineTo(m, H - m); ctx.lineTo(m + 18, H - m);
    ctx.moveTo(W - m, H - m - 18); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m - 18, H - m);
    ctx.stroke();
  }

  /* ---------- 8. frame ---------- */
  function frame(now) {
    rafId = 0;
    if (stopped) return;
    var ts = performance.now();
    try {
      var t = isFinite(S.t) ? S.t : 0;
      var pulse = 0;
      if (lastBeatAt > -90) {
        var dtb = t - lastBeatAt;
        if (dtb >= 0 && dtb < 3) pulse = Math.exp(-dtb * 6.2) * (0.45 + beatLevel * 0.55);
      }
      var sc = sceneRect();
      var amp = RM ? 0.18 : 1;
      var shake = pulse * amp * 2.2;
      var sx = (hash(Math.floor(t * 24) + 1) - 0.5) * shake;
      var sy = (hash(Math.floor(t * 24) + 7) - 0.5) * shake;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.save();
      ctx.translate(sx, sy);
      drawHall(t);
      drawMachine(t, sc);
      drawBagScene(t, sc, pulse);
      ctx.restore();
      drawHud(t, sc, pulse);
      drawOverlay(t);
      /* beat indicator in frame, not text glow */
      if (pulse > 0.03) {
        ctx.strokeStyle = "rgba(255,174,92," + (pulse * 0.11) + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(2, 2, W - 4, H - 4);
      }
      S.frames++;
    } catch (e) { logErr(e); }
    S.js = performance.now() - ts;
    rafId = requestAnimationFrame(frame);
  }

  /* geometry is ready before the first rAF; boot owns the only loop */
  resize();

})();
</script>
</body>
</html>
