<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>463 · yearbook signal</title>
<style>
  :root{
    --acc: 255, 96, 170;
    --accText: 255, 132, 190;
    --ink: #0c0a12;
    --cream: #fff4e8;
    --mono: "Consolas", "SFMono-Regular", "Courier New", monospace;
    --sans: "Helvetica Neue", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
  body{ font-family: var(--sans); color: var(--cream); -webkit-font-smoothing: antialiased; }
  #stage{ position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(120% 90% at 18% 8%, rgba(var(--acc), .20), transparent 62%),
      radial-gradient(90% 80% at 88% 92%, rgba(120, 190, 255, .13), transparent 64%),
      linear-gradient(178deg, #0e0b16 0%, #0a0810 58%, #0d0a11 100%);
  }
  #grid{ position: absolute; inset: -12%; pointer-events: none; opacity: .20;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: rotate(-2.2deg);
  }
  #grain{ position: absolute; inset: -10%; pointer-events: none; opacity: .16;
    background-repeat: repeat; background-size: 180px 180px; will-change: transform; }
  #vignette{ position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(115% 100% at 50% 45%, transparent 42%, rgba(0,0,0,.62) 100%); }
  #scan{ position: absolute; inset: 0; pointer-events: none; opacity: .30; mix-blend-mode: soft-light;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.16) 0 1px, transparent 1px 3px); }
  #chroma{ position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background:
      linear-gradient(90deg, rgba(255,0,90,.10), transparent 12%, transparent 88%, rgba(0,200,255,.10));
    mix-blend-mode: screen; }

  /* 贴纸文字 */
  .sticker{ position: absolute; font-family: var(--mono); font-weight: 700; letter-spacing: .24em;
    color: rgba(12,10,18,.92); background: rgba(255,236,120,.92); padding: .34em .7em;
    font-size: clamp(8px, .95vw, 12px); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.4);
    border-radius: 2px; }
  .s1{ left: 4vw; top: 30vh; transform: rotate(-6deg); }
  .s2{ right: 4vw; top: 26vh; transform: rotate(7deg); background: rgba(255,176,207,.94); }
  .s3{ left: 5vw; bottom: 22vh; transform: rotate(4deg); background: rgba(190,235,255,.92); }
  #vlabel{ position: absolute; right: 3.2vw; top: 50%; transform: rotate(90deg) translateX(-50%);
    transform-origin: right center; font-family: var(--mono); font-size: clamp(8px,.9vw,11px);
    letter-spacing: .55em; color: rgba(255,244,232,.31); white-space: nowrap; pointer-events: none; }

  /* 像素面板 */
  #pixel{ position: absolute; left: 4vw; bottom: calc(4.2vh + 4em); width: min(30vw, 260px);
    border: 2px solid rgba(255,244,232,.55); background: rgba(10,8,16,.55);
    padding: 8px 10px; font-family: var(--mono); font-size: clamp(8px,.92vw,11px);
    letter-spacing: .16em; color: rgba(255,244,232,.8); line-height: 1.7;
    box-shadow: 4px 4px 0 rgba(255,176,207,.30); pointer-events: none; }
  #pixel b{ color: rgb(var(--acc)); font-weight: 700; }
  #pixel .row{ display: flex; justify-content: space-between; gap: 1em; }
  #pixel .bars{ display: flex; gap: 2px; margin-top: 5px; }
  #pixel .bars s{ flex: 1; height: 5px; background: rgba(255,244,232,.20); text-decoration: none; }
  #pixel .bars s.on{ background: rgb(var(--acc)); }
  #pixel .dot{ display: inline-block; width: .8em; height: .8em; vertical-align: -1px;
    background: #6cf3b0; border-radius: 50%; margin-right: .4em; }
  @media (max-aspect-ratio: 4/5){ #pixel{ display: none; } #vlabel{ display: none; } .sticker{ font-size: 8px; } }

  /* ---------- concept board stickers ---------- */
  #board{ position: absolute; inset: 0; pointer-events: none; }
  .frame{ position: absolute; border-radius: 3px; overflow: hidden;
    box-shadow: 0 18px 44px rgba(0,0,0,.55), inset 0 0 0 6px rgba(255,255,255,.9);
    opacity: .9; }
  .frame i{ position: absolute; inset: 0; display: block; filter: blur(1.4px) saturate(.92);
    background:
      radial-gradient(circle at 50% 33%, rgba(58,26,52,.6) 0 10%, rgba(58,26,52,0) 11%),
      radial-gradient(ellipse 34% 40% at 50% 88%, rgba(58,26,52,.52) 0 60%, rgba(58,26,52,0) 61%),
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.5) 0 8%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 74% 70%, rgba(255,255,255,.36) 0 6%, rgba(255,255,255,0) 22%); }
  .f1{ width: 20vw; height: 25vw; max-width: 260px; max-height: 330px; left: 3vw; top: 12vh;
    transform: rotate(-7deg); background: linear-gradient(160deg, #ffd9e7, #b8e2ff 62%, #9ad8c8); }
  .f2{ width: 17vw; height: 21vw; max-width: 220px; max-height: 280px; right: 4vw; bottom: 14vh;
    transform: rotate(6.5deg); background: linear-gradient(200deg, #fff0c2, #ffb9d5 55%, #c7b3ff); }
  .f3{ width: 13vw; height: 16vw; max-width: 170px; max-height: 210px; right: 12vw; top: 8vh;
    transform: rotate(11deg); background: linear-gradient(150deg, #bfe7ff, #ffe6f2 70%); opacity: .55; }
  .tape{ position: absolute; width: 8vw; max-width: 118px; height: 3.4vh; max-height: 30px;
    background: rgba(255,255,255,.22); border-left: 1px dashed rgba(255,255,255,.35);
    border-right: 1px dashed rgba(255,255,255,.35); }

  #bunny{ position: absolute; right: -6vw; bottom: -8vh; width: 58vmin; height: 58vmin;
    pointer-events: none; opacity: .95; transform-origin: 58% 88%; will-change: transform; }

  /* ---------- OSD ---------- */
  #osd{ position: absolute; inset: 0; pointer-events: none; font-family: var(--mono);
    font-size: clamp(9px, 1.05vw, 13px); letter-spacing: .14em; color: rgba(255,244,232,.72); }
  #rec{ position: absolute; left: 4vw; top: 4.5vh; display: flex; align-items: center; gap: .7em; }
  #rec b{ width: .72em; height: .72em; border-radius: 50%; background: #ff4d63;
    box-shadow: 0 0 10px rgba(255,77,99,.85); animation: blink 1.6s steps(1,end) infinite; }
  @keyframes blink{ 50%{ opacity: .15 } }
  #cam{ position: absolute; right: 4vw; top: 4.5vh; text-align: right; line-height: 1.7; }
  #tc{ position: absolute; left: 4vw; bottom: 4.2vh; line-height: 1.7; }
  #tc em{ font-style: normal; color: rgba(var(--acc), 1); }
  #sig{ position: absolute; right: 4vw; bottom: 4.2vh; display: flex; align-items: flex-end; gap: 3px; }
  #sig s{ display: block; width: 4px; background: rgba(255,244,232,.75); text-decoration: none;
    height: 5px; border-radius: 1px; }
  .corner{ position: absolute; width: 26px; height: 26px; border: 1.5px solid rgba(255,244,232,.4); }
  .c1{ left: 2.6vw; top: 3vh; border-right: 0; border-bottom: 0; }
  .c2{ right: 2.6vw; top: 3vh; border-left: 0; border-bottom: 0; }
  .c3{ left: 2.6vw; bottom: 3vh; border-right: 0; border-top: 0; }
  .c4{ right: 2.6vw; bottom: 3vh; border-left: 0; border-top: 0; }

  /* ---------- lyric ---------- */
  #lyric{ position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 0 9vw; text-align: center; }
  /* 歌词压暗底（不是乳白柔光）：保证亮暗两态都压得住 */
  #shade{ position: absolute; left: 50%; top: 50%;
    width: min(1120px, 96vw); height: min(56vh, 500px); transform: translate(-50%, -50%);
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(4,3,8,.88) 0%, rgba(4,3,8,.72) 46%, rgba(4,3,8,0) 74%);
    pointer-events: none; }
  #kicker{ font-family: var(--mono); font-size: clamp(9px, 1.05vw, 13px); letter-spacing: .42em;
    color: rgba(255,244,232,.55); text-transform: uppercase; margin-bottom: 2.2vh;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 84vw; }
  #kicker b{ color: rgba(var(--acc),1); font-weight: 700; }
  #prev, #next{ font-size: clamp(11px, 1.5vw, 19px); line-height: 1.5; letter-spacing: .06em;
    color: rgba(255,244,232,.34); max-width: 74vw; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #prev{ margin-bottom: 1.6vh; }
  #next{ margin-top: 2.2vh; }
  #line{ font-weight: 800; line-height: 1.26; letter-spacing: .015em;
    color: var(--cream); max-width: 86vw; text-wrap: balance; overflow-wrap: anywhere;
    text-shadow: 0 0 26px rgba(var(--acc), .34), 0 2px 0 rgba(0,0,0,.34);
    will-change: transform; }
  #line .ch{ color: rgba(255,244,232,.40); transition: color .18s linear; display: inline-block;
    white-space: pre; }
  #line .ch.on{ color: rgba(255,244,232,.99); }
  #line .ch.now{ color: rgb(var(--accText)); text-shadow: 0 0 20px rgba(var(--acc), .8); }
  #empty{ display: none; font-family: var(--mono); font-size: clamp(11px, 1.3vw, 16px);
    letter-spacing: .3em; color: rgba(255,244,232,.5); }
  #lyric.empty #empty{ display: block; }
  #lyric.empty #line{ display: none; }

  /* ---------- pixel HUD ---------- */
  #hud{ position: absolute; left: 50%; bottom: 3.4vh; transform: translateX(-50%);
    font-family: var(--mono); font-size: clamp(9px, 1vw, 12px); letter-spacing: .22em;
    color: rgba(255,244,232,.62); display: flex; gap: 1.6em; align-items: center; white-space: nowrap; }
  #hud .hp{ color: #ff6f9c; letter-spacing: .1em; }
  #bar{ width: 16vw; max-width: 200px; height: 3px; background: rgba(255,255,255,.14); }
  #bar i{ display: block; height: 100%; width: 0%; background: rgba(var(--acc), .95);
    transition: width .3s linear; }

  @media (max-aspect-ratio: 4/5){
    .f1{ width: 34vw; height: 42vw; left: 6vw; top: 10vh; }
    .f2{ width: 30vw; height: 37vw; right: 7vw; bottom: 22vh; }
    .f3{ display: none; }
    #bunny{ width: 78vmin; height: 78vmin; right: -14vw; bottom: -4vh; opacity: .8; }
    #lyric{ padding: 0 7vw; }
    #line{ max-width: 92vw; }
    #prev, #next{ max-width: 86vw; }
    #hud{ bottom: 2.4vh; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="board">
    <div class="frame f1"><i></i></div>
    <div class="frame f2"><i></i></div>
    <div class="frame f3"><i></i></div>
    <div class="tape" style="left:6vw; top:8vh; transform:rotate(-19deg)"></div>
    <div class="tape" style="right:7vw; bottom:9vh; transform:rotate(14deg)"></div>
    <div class="sticker s1">TEEN CRUSH ♡</div>
    <div class="sticker s2">2001. 03. 07</div>
    <div class="sticker s3">! DO NOT ERASE</div>
  </div>
  <svg id="bunny" viewBox="0 0 200 200" aria-hidden="true"></svg>
  <div id="shade"></div>
  <div id="lyric">
    <div id="kicker"></div>
    <div id="prev"></div>
    <div id="line"></div>
    <div id="next"></div>
    <div id="empty">— 无 词 · 只 有 信 号 —</div>
  </div>
  <div id="osd">
    <div id="rec"><b></b><span>REC</span></div>
    <div id="cam">CAM 01 · SP<br>DCR-TRV900</div>
    <div id="tc"><span id="timecode">00:00:00</span><br><em>PLAY ▸</em></div>
    <div id="sig"></div>
    <div class="corner c1"></div><div class="corner c2"></div>
    <div class="corner c3"></div><div class="corner c4"></div>
  </div>
  <div id="hud">
    <span class="hp">♥ ♥ ♥</span>
    <span id="pix">[ 00 ]</span>
    <div id="bar"><i></i></div>
  </div>
  <div id="pixel">
    <div class="row"><span><i class="dot"></i>NOW PLAYING</span><b id="px-idx">--</b></div>
    <div class="row"><span>LYRICS</span><span id="px-total">000</span></div>
    <div class="bars" id="px-bars"></div>
  </div>
  <div id="vlabel">FRUIT&nbsp;&nbsp;ISSUE&nbsp;&nbsp;04</div>
  <div id="scan"></div>
  <div id="chroma"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>
<script>
(function(){
  'use strict';

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
    gl: false, rm: false, text: '', acc: [255, 96, 170], dur: 0, name: '', artist: ''
  };

  // 同步自检口：只读当前状态，不依赖任何外部同步函数
  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm
    };
  };

  var $ = function(id){ return document.getElementById(id); };
  var elLine = $('line'), elPrev = $('prev'), elNext = $('next'),
      elKicker = $('kicker'), elLyric = $('lyric'),
      elTC = $('timecode'), elBar = $('bar').firstChild, elPix = $('pix'),
      elSig = $('sig'), elGrain = $('grain'), elBunny = $('bunny'), elBoard = $('board'),
      elPxIdx = $('px-idx'), elPxTotal = $('px-total'), elPxBars = $('px-bars');

  /* ---------- 一次性噪声纹理 ---------- */
  (function grain(){
    try{
      var c = document.createElement('canvas'); c.width = c.height = 180;
      var g = c.getContext('2d'), d = g.createImageData(180, 180), i, n;
      for (i = 0; i < d.data.length; i += 4){
        n = (Math.random() * 255) | 0;
        d.data[i] = d.data[i+1] = d.data[i+2] = n; d.data[i+3] = 46;
      }
      g.putImageData(d, 0, 0);
      elGrain.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
    }catch(e){ console.error('[463] grain', e); }
  })();

  /* ---------- 兔子吉祥物（内联 SVG，零外部资源） ---------- */
  (function bunny(){
    try{
      var pink = '#8ec5ff', pink2 = '#c2e2ff', line = '#123a63';
      var s = '<g>';
      s += '<ellipse cx="86" cy="96" rx="34" ry="17" transform="rotate(-14 86 96)" fill="' + pink + '"/>';
      s += '<ellipse cx="128" cy="96" rx="34" ry="17" transform="rotate(14 128 96)" fill="' + pink + '"/>';
      s += '<path d="M74 62 C62 22 66 10 78 10 C90 10 94 34 96 60 Z" fill="' + pink + '" stroke="' + line + '" stroke-width="2.4"/>';
      s += '<path d="M122 62 C132 22 128 10 116 10 C104 10 100 34 100 60 Z" fill="' + pink + '" stroke="' + line + '" stroke-width="2.4"/>';
      s += '<path d="M80 66 C82 44 113 44 116 66 C118 84 108 92 98 92 C88 92 78 84 80 66 Z" fill="' + pink2 + '" stroke="' + line + '" stroke-width="2.4"/>';
      s += '<circle cx="90" cy="70" r="3.4" fill="' + line + '"/><circle cx="106" cy="70" r="3.4" fill="' + line + '"/>';
      s += '<path d="M98 76 l0 4" stroke="' + line + '" stroke-width="2.4" stroke-linecap="round"/>';
      s += '<path d="M92 84 q6 6 12 0" stroke="' + line + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
      s += '<circle cx="80" cy="80" r="4" fill="#ff8fbf" opacity=".7"/><circle cx="116" cy="80" r="4" fill="#ff8fbf" opacity=".7"/>';
      s += '<path d="M56 100 C46 120 50 150 70 160 C92 171 118 168 136 154 C152 142 156 116 146 98" fill="none" stroke="' + line + '" stroke-width="2" opacity=".55" stroke-dasharray="5 7"/>';
      s += '<g opacity=".9"><path d="M150 54 h10 v10" stroke="#fff" stroke-width="2.4" fill="none"/><path d="M150 54 l0 -10" stroke="#fff" stroke-width="2.4" fill="none"/></g>';
      s += '</g>';
      elBunny.innerHTML = s;
    }catch(e){ console.error('[463] bunny', e); }
  })();

  elSig.innerHTML = '<s></s><s></s><s></s><s></s><s></s>';

  /* ---------- 像素条（固定 12 格，只切 class） ---------- */
  var pxCells = [];
  (function buildBars(){
    try{
      var frag = document.createDocumentFragment(), i;
      for (i = 0; i < 12; i++){ var s = document.createElement('s'); pxCells.push(s); frag.appendChild(s); }
      elPxBars.appendChild(frag);
    }catch(e){ console.error('[463] bars', e); }
  })();
  var pxOn = -1;
  function paintBars(n){
    if (n === pxOn) return;
    pxOn = n;
    for (var i = 0; i < pxCells.length; i++) pxCells[i].className = i < n ? 'on' : '';
  }

  /* ---------- 主题 ---------- */
  function applyAccent(a){
    var r = 255, g = 96, b = 170;
    if (a && a.length >= 3){
      var rr = +a[0], gg = +a[1], bb = +a[2];
      if (isFinite(rr) && isFinite(gg) && isFinite(bb)){
        r = Math.max(0, Math.min(255, rr|0));
        g = Math.max(0, Math.min(255, gg|0));
        b = Math.max(0, Math.min(255, bb|0));
      }
    }
    if (r + g + b < 90){ r = 255; g = 96; b = 170; } // 太暗的封面色当主题会看不见
    S.acc = [r, g, b];
    document.documentElement.style.setProperty('--acc', r + ', ' + g + ', ' + b);
    // 高亮字色：封面色太暗/太灰时抬亮，保证在深底上认得出
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    var tr = r, tg = g, tb = b;
    if (lum < 0.62){
      var k = 0.62 / Math.max(0.12, lum);
      tr = Math.min(255, Math.round(r * k + 40)); tg = Math.min(255, Math.round(g * k + 40)); tb = Math.min(255, Math.round(b * k + 40));
    }
    document.documentElement.style.setProperty('--accText', tr + ', ' + tg + ', ' + tb);
  }
  applyAccent(S.acc);

  /* ---------- 歌词渲染 ---------- */
  var curSpans = [], curTimes = [];
  var shownIdx = -2, litCount = -1, lastHot = -1, lastTC = '', lastPct = -1, lastSigOn = -1;

  function charTimes(line){
    var n = (line && line.text) ? line.text.length : 0, i, out = [], span;
    if (line && line.chars && line.chars.length === n){
      for (i = 0; i < n; i++){
        var ct = +line.chars[i].t;
        out.push(isFinite(ct) ? ct : (line.t + i * 0.05));
      }
      return out;
    }
    span = (line && +line.dur > 0) ? +line.dur : 3.2;
    if (!isFinite(span) || span <= 0.1) span = 3.2;
    if (span > 12) span = 12;
    for (i = 0; i < n; i++) out.push((line.t || 0) + span * (i / Math.max(1, n)));
    return out;
  }

  function fontSizeFor(text){
    var n = text ? text.length : 0;
    if (n > 34) return 'clamp(15px, 2.3vw, 30px)';
    if (n > 22) return 'clamp(17px, 2.9vw, 38px)';
    if (n > 14) return 'clamp(19px, 3.8vw, 50px)';
    return 'clamp(22px, 4.9vw, 66px)';
  }

  function renderLine(){
    var i, line = S.lines[S.idx] || null;
    elLine.style.fontSize = fontSizeFor(line ? line.text : '');
    elPrev.textContent = S.idx > 0 ? (S.lines[S.idx - 1].text || '') : '';
    elNext.textContent = (S.idx >= 0 && S.lines[S.idx + 1]) ? (S.lines[S.idx + 1].text || '') : '';
    S.text = line ? (line.text || '') : '';

    curSpans = []; curTimes = []; litCount = -1; lastHot = -1;
    if (!line || !line.text){
      elLine.textContent = '';
      return;
    }
    var txt = String(line.text);
    curTimes = charTimes(line);
    var frag = document.createDocumentFragment();
    for (i = 0; i < txt.length; i++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = txt.charAt(i);
      frag.appendChild(sp);
      curSpans.push(sp);
    }
    elLine.textContent = '';
    elLine.appendChild(frag);
  }

  function paintChars(t){
    if (!curSpans.length) return;
    var n = 0, i;
    for (i = 0; i < curTimes.length && i < 400; i++){ if (t >= curTimes[i]) n = i + 1; else break; }
    if (n === litCount) return;
    var from = litCount < 0 ? 0 : litCount;
    litCount = n;
    if (n < from){ from = 0; for (i = 0; i < curSpans.length; i++) curSpans[i].className = 'ch'; }
    for (i = from; i < n; i++) curSpans[i].className = 'ch on';
    // 当前字：只在"未唱完"时高亮到下一个字，避免满句闪烁
    var hot = n - 1;
    if (n > 0 && n <= curSpans.length && curTimes[n - 1] !== undefined){
      var nd = curTimes[n];
      var endAt = (nd !== undefined) ? nd : (curTimes[n - 1] + 0.55);
      if (t > endAt) hot = -1;
    }
    if (hot !== lastHot){
      if (lastHot >= 0 && curSpans[lastHot]) curSpans[lastHot].className = 'ch on';
      if (hot >= 0 && curSpans[hot]) curSpans[hot].className = 'ch on now';
      lastHot = hot;
    }
  }

  function syncTime(t){
    if (!isFinite(t)) return;
    S.t = t;
    // 增量推进索引：从当前 idx 前后各走几步，避免每帧全表扫描
    var idx = S.idx < -1 ? -1 : S.idx, guard = 0, n = S.lines.length;
    while (idx + 1 < n && S.lines[idx + 1].t <= t + 0.04 && guard++ < 4000) idx++;
    while (idx >= 0 && S.lines[idx].t > t + 0.04 && guard++ < 8000) idx--;
    if (idx !== S.idx){
      S.idx = idx;
      renderLine();
      elLyric.classList.toggle('empty', S.lines.length === 0);
      elPxIdx.textContent = idx < 0 ? '--' : pad(idx + 1);
    }
    paintChars(t);
    var mm = Math.floor(t / 60), ss = Math.floor(t % 60), ff = Math.floor((t % 1) * 30);
    var tcs = pad(mm) + ':' + pad(ss) + ':' + pad(ff);
    if (tcs !== lastTC){ elTC.textContent = tcs; lastTC = tcs; }
    if (S.dur > 0){
      var pct = Math.round(Math.max(0, Math.min(100, t / S.dur * 100)) * 10) / 10;
      if (pct !== lastPct){ elBar.style.width = pct + '%'; lastPct = pct; }
    }
    if (S.lines.length){
      paintBars(Math.max(0, Math.min(12, Math.round((idx + 1) / S.lines.length * 12))));
    }
  }
  function pad(n){ n = n | 0; return n < 10 ? '0' + n : '' + n; }

  function clearLyric(){
    S.lines = []; S.idx = -1; S.text = ''; S.dur = 0;
    curSpans = []; curTimes = []; litCount = -1;
    elLine.textContent = ''; elPrev.textContent = ''; elNext.textContent = '';
    elLyric.classList.add('empty');
    elKicker.textContent = '';
    elBar.style.width = '0%';
    elPix.textContent = '[ 00 ]';
  }

  /* ---------- init ---------- */
  function onInit(p){
    p = p || {};
    var song = p.song || {};
    var artists = song.artists;
    if (Object.prototype.toString.call(artists) === '[object Array]') artists = artists.join(' / ');
    S.artist = (artists == null ? '' : String(artists)).slice(0, 40);
    S.name = (song.name == null ? '' : String(song.name)).slice(0, 60);

    // 换歌才重置时间轴；同一首歌重发 init（封面取色）保留进度
    var sid = song.id == null ? '' : String(song.id);
    if (sid !== S.songId){
      S.songId = sid;
      S.t = 0; S.idx = -1; lastTick = null; lastTickAt = 0;
    }

    S.dur = isFinite(+p.duration) && +p.duration > 0 ? +p.duration : 0;

    applyAccent(p.accent);

    var raw = (Object.prototype.toString.call(p.lines) === '[object Array]') ? p.lines : [];
    var out = [], i;
    for (i = 0; i < raw.length && i < 4000; i++){
      var L = raw[i];
      if (!L) continue;
      var t0 = +L.t;
      if (!isFinite(t0) || t0 < 0) t0 = 0;
      var txt = (L.text == null) ? '' : String(L.text);
      if (!txt.replace(/\s+/g, '')) continue;
      out.push({ t: t0, dur: isFinite(+L.dur) && +L.dur > 0 ? +L.dur : 0, text: txt,
                 chars: (L.chars && L.chars.length) ? L.chars : null });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    S.lines = out;
    S.idx = -2;
    lastTC = ''; pxOn = -1; lastPct = -1; lastPix = ''; litCount = -1;
    if (!S.lines.length){ elBar.style.width = '0%'; }

    elKicker.textContent = (S.name || 'UNTITLED') + (S.artist ? '  ·  ' + S.artist : '');
    elKicker.classList.toggle('has-song', !!S.name);
    elPix.textContent = '[ ' + pad(Math.min(99, out.length)) + ' ]';
    elPxTotal.textContent = pad(Math.min(999, out.length));
    elPxIdx.textContent = '--';

    if (!out.length){ clearLyric(); elKicker.textContent = (S.name || 'UNTITLED') + (S.artist ? '  ·  ' + S.artist : ''); paintBars(0); }
    else { elLyric.classList.remove('empty'); renderLine(); }
    syncTime(S.t);
  }

  /* ---------- 消息 ---------- */
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    try{
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick'){
        var p = d.payload || {};
        if (typeof p.playing === 'boolean') S.playing = p.playing;
        if (typeof p.time === 'number' && isFinite(p.time)){ syncTime(p.time); lastTick = p.time; lastTickAt = now(); }
      } else if (d.type === 'beat'){ pulse = 1; }
      else if (d.type === 'live'){ var lp = d.payload || {}; liveLevel = isFinite(+lp.level) ? Math.max(0, Math.min(1, +lp.level)) : 0; }
    }catch(e){ console.error('[463] message', e); }
  });

  /* ---------- 时钟 ---------- */
  var lastTick = null, lastTickAt = 0, pulse = 0, liveLevel = 0;
  function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function curTime(){
    if (!S.playing || lastTick == null) return S.t;
    return lastTick + Math.max(0, (now() - lastTickAt) / 1000);
  }

  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try{ parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch(e){ console.error('[463] ready', e); }
  }
  setTimeout(sendReady, 900);

  var lastPix = '';
  function frame(){
    var t0 = now(), started = t0;
    S.frames++;
    try{
      if (S.frames === 1) sendReady();
      syncTime(curTime());
      pulse *= 0.9;
      var sc = 1 + pulse * 0.035 + liveLevel * 0.02;
      elBunny.style.transform = 'rotate(' + (-3 + pulse * 2.2).toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
      elGrain.style.transform = 'translate3d(' + ((S.frames * 7) % 180 - 90) + 'px,' + ((S.frames * 11) % 180 - 90) + 'px,0)';
      var mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
      var s = '';
      if (S.dur > 0) s = pad(mm) + ':' + pad(ss) + ' / ' + pad(Math.floor(S.dur / 60)) + ':' + pad(Math.floor(S.dur % 60));
      if (s !== lastPix){ elSig.title = s; lastPix = s; }
      S.err = '';
    }catch(e){ S.err = String(e && e.message || e); console.error('[463] frame', e); }
    S.js = now() - t0;
    requestAnimationFrame(frame);
  }

  var mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq){ S.rm = !!mq.matches; if (mq.addEventListener) mq.addEventListener('change', function(e){ S.rm = !!e.matches; }); }

  function safeResize(){
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    var h = window.innerHeight || document.documentElement.clientHeight || 0;
    if (!isFinite(w) || !isFinite(h) || w < 10 || h < 10){ w = 1440; h = 900; }
    document.documentElement.style.setProperty('--vh', (h / 100) + 'px');
  }
  safeResize();
  window.addEventListener('resize', function(){ try{ safeResize(); }catch(e){ console.error('[463] resize', e); } });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
