<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head><body>
<canvas id="c" width="1440" height="810"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1440,H=810;
const N=5200;
const sx=new Float32Array(N),sy=new Float32Array(N),sh=new Float32Array(N),sw=new Float32Array(N);
const band=new Uint8Array(N);
// clustered like a glyph: 1140 x 340 region, dense
for(let i=0;i<N;i++){
  sx[i]=150+ (i*0.2117%1130) ; sy[i]=235+ (i*0.3771%320);
  sh[i]=8+((i*13)%34); sw[i]=1.3+((i*3)%9)/10;
  band[i]= (i%11===0)?4:((i%7===0)?3:((i%3===0)?2:((i%5===0)?1:0)));
}
// fake halo: a canvas with soft text-ish blobs
const hcv=document.createElement('canvas'); hcv.width=1200; hcv.height=380;
{const g=hcv.getContext('2d'); g.fillStyle='rgba(150,190,230,0.5)';
 for(let i=0;i<40;i++){g.fillRect(20+i*29,40+((i*37)%260),24,90);}}
// fake bg
const bgc=document.createElement('canvas'); bgc.width=720; bgc.height=405;
{const g=bgc.getContext('2d'); g.fillStyle='#0a0c12';g.fillRect(0,0,720,405);}
function bg(){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);ctx.drawImage(bgc,0,0,W,H);}
function halo(){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.16;
  ctx.drawImage(hcv,120,215,1200*camz,380*camz);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
let camz=1;
const flush=()=>ctx.getImageData(0,0,1,1);   // 强制刷成像素，否则量到的只是"录制命令"的时间
function bench(name,fn,iters){
  fn();fn();flush();
  const t0=performance.now();
  for(let k=0;k<iters;k++){bg();halo();fn();flush();}
  const t=(performance.now()-t0)/iters;
  console.log(name.padEnd(48)+t.toFixed(2)+' ms');
  return t;
}
// A: full 5-pass with clustering and variable heights
bench('A clustered 5趟(身2+尖3) 5200',()=>{
  for(let b=0;b<2;b++){ctx.fillStyle=b?'rgba(140,172,208,0.42)':'rgba(84,108,142,0.28)';ctx.beginPath();
    for(let i=0;i<N;i++){const bd=band[i];if(((bd>=2)?1:0)!==b)continue;
      ctx.rect(sx[i]-sw[i]*.5,sy[i]+4.5,sw[i],Math.max(.8,sh[i]-4.5));}ctx.fill();}
  for(let b=2;b<5;b++){ctx.fillStyle=b===4?'rgba(255,92,196,.9)':b===3?'rgba(238,247,255,.94)':'rgba(158,182,214,.5)';ctx.beginPath();
    for(let i=0;i<N;i++){if(band[i]!==b)continue;const w=3.2;ctx.rect(sx[i]-w/2,sy[i]-w/2,w,w);}ctx.fill();}
},10);
// B: same but SHORT needles only (h<=14)
bench('B clustered 5趟 短针(h<=14) 5200',()=>{
  for(let b=0;b<2;b++){ctx.fillStyle=b?'rgba(140,172,208,0.42)':'rgba(84,108,142,0.28)';ctx.beginPath();
    for(let i=0;i<N;i++){const bd=band[i];if(((bd>=2)?1:0)!==b)continue;const h=Math.min(sh[i],14);
      ctx.rect(sx[i]-sw[i]*.5,sy[i]+4.5,sw[i],Math.max(.8,h-4.5));}ctx.fill();}
  for(let b=2;b<5;b++){ctx.fillStyle=b===4?'rgba(255,92,196,.9)':b===3?'rgba(238,247,255,.94)':'rgba(158,182,214,.5)';ctx.beginPath();
    for(let i=0;i<N;i++){if(band[i]!==b)continue;const w=3.2;ctx.rect(sx[i]-w/2,sy[i]-w/2,w,w);}ctx.fill();}
},10);
// C: tips only 3 passes
bench('C 只尖3趟 5200',()=>{
  for(let b=2;b<5;b++){ctx.fillStyle=b===4?'rgba(255,92,196,.9)':b===3?'rgba(238,247,255,.94)':'rgba(158,182,214,.5)';ctx.beginPath();
    for(let i=0;i<N;i++){if(band[i]!==b)continue;const w=3.2;ctx.rect(sx[i]-w/2,sy[i]-w/2,w,w);}ctx.fill();}
},10);
// D: shafts only 2 passes
bench('D 只针身2趟 5200',()=>{
  for(let b=0;b<2;b++){ctx.fillStyle=b?'rgba(140,172,208,0.42)':'rgba(84,108,142,0.28)';ctx.beginPath();
    for(let i=0;i<N;i++){const bd=band[i];if(((bd>=2)?1:0)!==b)continue;
      ctx.rect(sx[i]-sw[i]*.5,sy[i]+4.5,sw[i],Math.max(.8,sh[i]-4.5));}ctx.fill();}
},10);
// E: no halo layer
bench('E 无halo层 5趟',()=>{
  for(let b=0;b<2;b++){ctx.fillStyle=b?'rgba(140,172,208,0.42)':'rgba(84,108,142,0.28)';ctx.beginPath();
    for(let i=0;i<N;i++){const bd=band[i];if(((bd>=2)?1:0)!==b)continue;
      ctx.rect(sx[i]-sw[i]*.5,sy[i]+4.5,sw[i],Math.max(.8,sh[i]-4.5));}ctx.fill();}
  for(let b=2;b<5;b++){ctx.fillStyle=b===4?'rgba(255,92,196,.9)':b===3?'rgba(238,247,255,.94)':'rgba(158,182,214,.5)';ctx.beginPath();
    for(let i=0;i<N;i++){if(band[i]!==b)continue;const w=3.2;ctx.rect(sx[i]-w/2,sy[i]-w/2,w,w);}ctx.fill();}
},10);
// F: interleaved scan (1 pass over N, push into 5 sub-paths is impossible) -> single path 5 colors = 1 color test
bench('F 单趟1色 全量5200尖+身同距',()=>{
  ctx.fillStyle='rgba(200,225,255,.9)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]-1.6,sy[i]+4.5,1.6,Math.max(.8,sh[i]-4.5));ctx.rect(sx[i]-1.6,sy[i]-1.6,3.2,3.2);}ctx.fill();
},10);
</script></body></html>
