<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>胎藏曼荼罗 · 483</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#2A0806}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(46% 42% at 50% 37%, rgba(232,116,46,.34) 0%, rgba(196,56,26,.17) 46%, rgba(90,14,10,0) 78%),
      radial-gradient(78% 62% at 50% 30%, rgba(178,44,20,.30) 0%, rgba(96,18,12,.10) 58%, rgba(40,6,5,0) 88%),
      radial-gradient(125% 95% at 50% 46%, rgba(0,0,0,0) 34%, rgba(30,5,5,.55) 74%, rgba(12,2,2,.86) 100%),
      linear-gradient(158deg,#440E0A 0%,#2E0807 42%,#1B0404 100%)}
  #grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-size:170px 170px;background-repeat:repeat}
  #frame{position:fixed;inset:2.3vh 2.2vw;z-index:4;pointer-events:none;
    border:1px solid rgba(244,210,150,.30);box-shadow:inset 0 0 0 5px rgba(36,6,5,.18),inset 0 0 0 6px rgba(244,210,150,.12)}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
  #hdr{position:fixed;left:0;right:0;top:4.4vh;z-index:5;text-align:center;pointer-events:none;
       font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(9px,0.85vw,13px);
       letter-spacing:.34em;color:rgba(247,222,177,.72);text-transform:uppercase;
       text-shadow:0 1px 0 rgba(60,12,8,.9)}
  #hdr i{display:inline-block;width:5px;height:5px;background:#E8A93A;transform:rotate(45deg);
         margin:0 .9em;vertical-align:middle;opacity:.85}
  #lyr{position:fixed;left:0;right:0;bottom:0;z-index:5;height:46%;display:flex;flex-direction:column;
       align-items:center;justify-content:flex-end;padding:0 6vw 7.4vh;pointer-events:none;
       background:linear-gradient(to top,rgba(12,2,2,.62) 0%,rgba(14,3,3,.34) 42%,rgba(16,4,4,0) 100%)}
  #cur,#nxt{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:600;
       text-align:center;max-width:86vw;line-height:1.28;overflow-wrap:anywhere;word-break:break-word;
       text-shadow:0 1px 0 rgba(255,240,205,.20),0 3px 0 rgba(38,4,4,.95),0 8px 26px rgba(10,0,0,.8)}
  #cur{color:#FFF3DA;font-size:clamp(22px,3.5vw,50px);letter-spacing:.02em}
  #nxt{color:#F7E2BC;opacity:.46;font-size:clamp(13px,1.55vw,22px);margin-top:1em;letter-spacing:.04em}
  .ch{opacity:.55;transition:opacity .16s linear,color .16s linear}
  .ch.on{opacity:1;color:#FFD27A;text-shadow:0 1px 0 rgba(255,238,196,.34),0 3px 0 rgba(58,6,4,.95),0 0 18px rgba(255,158,44,.42)}
  #empty{color:#F7E3C0;opacity:.78;font-family:"Noto Serif SC","Songti SC",serif;
         font-size:clamp(16px,2vw,26px);letter-spacing:.2em;text-align:center}
  #empty small{display:block;margin-top:.9em;font-size:.62em;opacity:.7;letter-spacing:.3em}
  @media (max-aspect-ratio:1/1){
    #lyr{height:38%;padding:0 7vw 9vh}
    #cur{font-size:clamp(19px,5.4vw,34px)}
    #nxt{font-size:clamp(12px,3.1vw,17px);margin-top:.8em}
    #rule{margin-bottom:1.8vh;width:min(58vw,300px)}
    #hdr{top:3.4vh;letter-spacing:.24em}
  }
  @media (max-height:520px){
    #lyr{height:56%;padding:0 6vw 5vh}
    #cur{font-size:clamp(17px,3.2vw,30px)}
    #nxt{display:none}
    #rule{display:none}
    #hdr{top:2.4vh}
  }
  #rule{width:min(44vw,380px);height:13px;margin-bottom:2.4vh;opacity:.62;position:relative;flex:0 0 auto}
  #rule::before,#rule::after{content:'';position:absolute;top:6px;width:calc(50% - 16px);height:1px;
    background:linear-gradient(90deg,rgba(242,194,92,0),rgba(242,194,92,.85))}
  #rule::before{left:0}
  #rule::after{right:0;transform:scaleX(-1)}
  #rule span{position:absolute;left:50%;top:1px;width:9px;height:9px;margin-left:-4.5px;
    background:#F2C25C;transform:rotate(45deg);box-shadow:0 0 12px rgba(242,194,92,.6)}
  #rule span::after{content:'';position:absolute;inset:2.5px;background:#7E1D10}
</style>
</head>
<body>
<div id="grain"></div>
<canvas id="cv"></canvas>
<div id="frame"></div>
<div id="hdr"><i></i><span id="cname">&nbsp;</span><i></i></div>
<div id="lyr"><div id="rule"><span></span></div><div id="cur"></div><div id="nxt"></div><div id="empty"></div></div>
<script>
"use strict";
(function(){
  var cv=document.getElementById('cv');
  var ctx=cv.getContext('2d',{alpha:false});
  var curEl=document.getElementById('cur'), nxtEl=document.getElementById('nxt'),
      emptyEl=document.getElementById('empty'), nameEl=document.getElementById('cname'),
      grainEl=document.getElementById('grain');

  var W=1440,H=900,DPR=1,CX=720,CY=315,R0=280,TAU=Math.PI*2;
  var S={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',text:'',accent:[201,58,40],
         readySent:false,level:0,bass:0,mid:0,treb:0,pulse:0,beat:0,duration:0,anim:0,last:0};
  var rm=false;
  try{ rm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ console.error('rm',e); }

  var C={ink:'#2A0705',deep:'#7E1D10',verm:'#C43A1C',hot:'#E4622B',gold:'#F2C25C',
         pale:'#F9E6B8',blue:'#17506B',teal:'#2A8098',tur:'#E19A2C',green:'#1B6A58',
         navy:'#0B2733'};

  /* ---------- helpers ---------- */
  function mk(w,h){
    var c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*DPR)); c.height=Math.max(1,Math.round(h*DPR));
    var g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
    return {c:c,g:g,w:w,h:h};
  }
  function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU); }
  function circle(g,x,y,r){ g.beginPath(); g.arc(x,y,Math.max(.01,r),0,TAU); }
  function rnd(seed){ var s=seed|0; if(!s) s=12345; return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,k){ return a+(b-a)*k; }

  /* ---------- layout ---------- */
  function resize(){
    try{
      var w=Math.round(window.innerWidth||0), h=Math.round(window.innerHeight||0);
      if(!isFinite(w)||!isFinite(h)||w<2||h<2){ w=1440; h=900; }
      W=w; H=h;
      DPR=Math.min(window.devicePixelRatio||1,1.6);
      var budget=3.6e6;
      if(W*H*DPR*DPR>budget) DPR=Math.max(1,Math.sqrt(budget/(W*H)));
      cv.width=Math.max(1,Math.round(W*DPR)); cv.height=Math.max(1,Math.round(H*DPR));
      cv.style.width=W+'px'; cv.style.height=H+'px';
      CX=W*0.5;
      CY=H*(W>H?0.352:0.318);
      R0=Math.max(58, Math.min(W*0.345, H*0.262));
      if(W<520) R0=Math.max(56, Math.min(W*0.42, H*0.235));
    }catch(e){ console.error('resize',e); W=1440;H=900;R0=270;CX=720;CY=319; }
  }

  /* ---------- peacock feather eye ---------- */
  function peacockEye(g,x,y,r,rot){
    g.save(); g.translate(x,y); g.rotate(rot||0);
    // barbs
    g.strokeStyle='rgba(242,194,92,0.16)'; g.lineWidth=Math.max(.6,r*0.025);
    for(var i=0;i<22;i++){
      var a=-Math.PI*0.5+(i/21-0.5)*2.3;
      g.beginPath(); g.moveTo(Math.cos(a)*r*1.02,Math.sin(a)*r*1.02);
      g.lineTo(Math.cos(a)*r*(1.35+0.35*((i*7)%5)/5),Math.sin(a)*r*(1.35+0.35*((i*7)%5)/5));
      g.stroke();
    }
    ell(g,0,0,r*1.06,r*1.5); g.fillStyle='rgba(9,32,40,0.92)'; g.fill();
    g.strokeStyle='rgba(242,194,92,0.62)'; g.lineWidth=Math.max(1,r*0.055); g.stroke();
    ell(g,0,0,r*0.82,r*1.18); g.fillStyle=C.green; g.fill();
    ell(g,0,0,r*0.58,r*0.86); g.fillStyle=C.tur; g.fill();
    ell(g,0,0,r*0.40,r*0.60); g.fillStyle=C.teal; g.fill();
    ell(g,0,0,r*0.22,r*0.34); g.fillStyle=C.navy; g.fill();
    circle(g,-r*0.08,-r*0.16,r*0.085); g.fillStyle='rgba(249,230,184,0.75)'; g.fill();
    g.restore();
  }
  function star4(g,x,y,r,col){
    g.beginPath();
    g.moveTo(x,y-r); g.quadraticCurveTo(x+r*0.22,y-r*0.22,x+r,y);
    g.quadraticCurveTo(x+r*0.22,y+r*0.22,x,y+r);
    g.quadraticCurveTo(x-r*0.22,y+r*0.22,x-r,y);
    g.quadraticCurveTo(x-r*0.22,y-r*0.22,x,y-r);
    g.closePath(); g.fillStyle=col; g.fill();
  }

  /* ---------- layers ---------- */
  var L={bg:null,rays:null,raysB:null,ring:null,ringB:null,deity:null,deityB:null,
         ember:null,glow:null,still:null,shaft:null};
  var scrim=null;

  function buildBG(){
    var b=mk(W,H), g=b.g;
    var grd=g.createLinearGradient(0,0,W*0.4,H);
    grd.addColorStop(0,'#4C100A'); grd.addColorStop(0.42,'#350A07'); grd.addColorStop(1,'#180303');
    g.fillStyle=grd; g.fillRect(0,0,W,H);

    var rg=g.createRadialGradient(CX,CY,R0*0.08,CX,CY,R0*2.15);
    rg.addColorStop(0,'rgba(238,126,44,0.52)');
    rg.addColorStop(0.42,'rgba(200,60,26,0.26)');
    rg.addColorStop(1,'rgba(96,16,10,0)');
    g.fillStyle=rg; g.fillRect(0,0,W,H);

    // collage: peacock eyes
    var m=Math.min(W,H);
    var spots=[[0.115,0.215,-0.62,0.082],[0.885,0.195,0.55,0.075],[0.055,0.560,0.30,0.058],
               [0.950,0.535,-0.26,0.062],[0.175,0.780,0.95,0.046],[0.845,0.760,-1.15,0.050]];
    for(var i=0;i<spots.length;i++){
      var s=spots[i];
      peacockEye(g, s[0]*W, s[1]*H, m*s[3], s[2]);
    }
    // gold stars + bindi dots
    var R=rnd(48317);
    for(var k=0;k<26;k++){
      var sx=R()*W, sy=R()*H;
      var dx=sx-CX, dy=sy-CY;
      if(dx*dx+dy*dy < (R0*1.16)*(R0*1.16)) continue;
      star4(g,sx,sy,m*(0.004+R()*0.008),'rgba(249,230,184,'+(0.20+R()*0.35).toFixed(2)+')');
    }
    g.fillStyle='rgba(242,194,92,0.22)';
    for(var d=0;d<34;d++){
      var px=R()*W, py=R()*H*0.86;
      var ddx=px-CX, ddy=py-CY;
      if(ddx*ddx+ddy*ddy < (R0*1.2)*(R0*1.2)) continue;
      circle(g,px,py,m*(0.0016+R()*0.0022)); g.fill();
    }
    L.bg=b;
  }

  function buildRays(){
    var ext=Math.min(R0*1.66, Math.max(R0*1.05, CY*1.03)), s=Math.ceil(ext*2), b=mk(s,s), g=b.g;
    g.translate(s/2,s/2);
    var n=44, inner=R0*0.99;
    for(var i=0;i<n;i++){
      var a0=(i/n)*TAU, a1=((i+0.52)/n)*TAU;
      g.beginPath();
      g.moveTo(Math.cos(a0)*inner,Math.sin(a0)*inner);
      g.lineTo(Math.cos(a0)*ext,Math.sin(a0)*ext);
      g.lineTo(Math.cos(a1)*ext,Math.sin(a1)*ext);
      g.lineTo(Math.cos(a1)*inner,Math.sin(a1)*inner);
      g.closePath();
      g.fillStyle = i%2 ? 'rgba(242,194,92,0.135)' : 'rgba(230,86,32,0.135)';
      g.fill();
    }
    g.strokeStyle='rgba(242,194,92,0.20)';
    circle(g,0,0,inner); g.stroke();
    // soften the outer edge so rays dissolve instead of being cut by the frame
    g.setTransform(1,0,0,1,0,0);
    var fade=g.createRadialGradient(s/2,s/2,ext*0.52,s/2,s/2,ext*0.99);
    fade.addColorStop(0,'rgba(0,0,0,0)');
    fade.addColorStop(0.55,'rgba(0,0,0,0.18)');
    fade.addColorStop(1,'rgba(0,0,0,1)');
    g.globalCompositeOperation='destination-out';
    g.fillStyle=fade; g.fillRect(0,0,s,s);
    g.globalCompositeOperation='source-over';
    L.rays=b;
  }

  function buildRing(){
    var ext=R0*1.30, s=Math.ceil(ext*2), b=mk(s,s), g=b.g;
    g.translate(s/2,s/2);
    // lotus petal ring
    var n=34, rr=R0*1.155;
    for(var i=0;i<n;i++){
      var a=(i/n)*TAU;
      g.save(); g.rotate(a); g.translate(0,-rr);
      g.beginPath();
      g.moveTo(0,-R0*0.070);
      g.quadraticCurveTo(R0*0.042,-R0*0.012,0,R0*0.052);
      g.quadraticCurveTo(-R0*0.042,-R0*0.012,0,-R0*0.070);
      g.closePath();
      g.fillStyle = i%2 ? 'rgba(196,58,28,0.42)' : 'rgba(225,154,44,0.36)';
      g.fill();
      g.strokeStyle='rgba(242,194,92,0.55)'; g.lineWidth=Math.max(.8,R0*0.005); g.stroke();
      g.restore();
    }
    // dotted circle
    var dn=72;
    g.fillStyle='rgba(249,230,184,0.42)';
    for(var d=0;d<dn;d++){
      var da=(d/dn)*TAU;
      circle(g,Math.cos(da)*R0*1.245,Math.sin(da)*R0*1.245,Math.max(.8,R0*0.006)); g.fill();
    }
    L.ring=b;
  }

  /* ---------- the deity (bazaar chromolithograph icon) ---------- */
  function buildDeity(){
    var Rd=R0*0.965, pad=R0*0.06, s=Math.ceil((Rd+pad)*2), b=mk(s,s), g=b.g;
    g.translate(s/2,s/2);
    var U=function(v){ return v*Rd; };

    // disc body of the prabhamandala
    var dg=g.createRadialGradient(0,-U(0.25),U(0.05),0,0,U(1.0));
    dg.addColorStop(0,'#D1471F'); dg.addColorStop(0.55,'#B2331A'); dg.addColorStop(1,'#7A1A0F');
    circle(g,0,0,Rd); g.fillStyle=dg; g.fill();
    // inner rings
    g.strokeStyle='rgba(242,194,92,0.20)'; g.lineWidth=Math.max(1,Rd*0.006);
    for(var q=1;q<=4;q++){ circle(g,0,0,Rd*(0.24+q*0.17)); g.stroke(); }
    // rim
    circle(g,0,0,Rd*0.995); g.strokeStyle='rgba(249,230,184,0.85)'; g.lineWidth=Math.max(2,Rd*0.017); g.stroke();
    circle(g,0,0,Rd*0.955); g.strokeStyle='rgba(42,7,5,0.55)'; g.lineWidth=Math.max(1,Rd*0.008); g.stroke();

    // halo behind head
    var hy=-U(0.40), hr=U(0.235);
    var hg=g.createRadialGradient(0,hy,hr*0.1,0,hy,hr*1.55);
    hg.addColorStop(0,'rgba(249,230,184,0.85)'); hg.addColorStop(0.42,'rgba(225,154,44,0.62)'); hg.addColorStop(1,'rgba(225,154,44,0)');
    circle(g,0,hy,hr*1.55); g.fillStyle=hg; g.fill();
    g.strokeStyle='rgba(242,194,92,0.75)'; g.lineWidth=Math.max(1,Rd*0.008);
    for(var a2=0;a2<28;a2++){
      var an=(a2/28)*TAU, r1=hr*1.12, r2=hr*(a2%2?1.42:1.34);
      g.beginPath();
      g.moveTo(Math.cos(an)*r1,hy+Math.sin(an)*r1);
      g.lineTo(Math.cos(an)*r2,hy+Math.sin(an)*r2);
      g.stroke();
    }
    circle(g,0,hy,hr*1.08); g.fillStyle='#F7E3BC'; g.fill();
    circle(g,0,hy,hr*0.94); g.strokeStyle='rgba(196,58,28,0.55)'; g.lineWidth=Math.max(1,Rd*0.012); g.stroke();

    // ---- arms (4 pairs) ----
    function arm(side, sx, sy, hx, hy2, cx1, cy1){
      g.beginPath();
      g.moveTo(side*sx,sy);
      g.quadraticCurveTo(side*cx1,cy1,side*hx,hy2);
      g.lineCap='round';
      g.strokeStyle='rgba(242,194,92,0.92)'; g.lineWidth=U(0.084); g.stroke();
      g.strokeStyle=C.blue; g.lineWidth=U(0.058); g.stroke();
      g.strokeStyle='rgba(42,7,5,0.45)'; g.lineWidth=U(0.024); g.stroke();
      // armlets + bangles, the giveaway of a printed icon
      var mx=side*(sx*0.32+cx1*0.52+hx*0.16), my=lerp(sy*0.30+cy1*0.58+hy2*0.12, hy2, 0.0);
      g.save();
      g.strokeStyle=C.gold; g.lineWidth=U(0.020);
      g.beginPath(); g.moveTo(mx-U(0.030),my-U(0.010)); g.lineTo(mx+U(0.030),my+U(0.010)); g.stroke();
      g.beginPath(); g.moveTo(mx-U(0.026),my+U(0.022)); g.lineTo(mx+U(0.026),my+U(0.042)); g.stroke();
      g.restore();
      // hand
      circle(g,side*hx,hy2,U(0.042)); g.fillStyle='#3E93A6'; g.fill();
      g.strokeStyle=C.gold; g.lineWidth=U(0.013); g.stroke();
      circle(g,side*hx,hy2,U(0.019)); g.fillStyle='rgba(196,58,28,0.85)'; g.fill();
    }
    var A=[
      [0.17,-0.235, 0.475,-0.545,  0.30,-0.55],
      [0.175,-0.19, 0.575,-0.235,  0.46,-0.335],
      [0.175,-0.14, 0.545, 0.105,  0.475,-0.06],
      [0.17,-0.10,  0.375, 0.375,  0.42, 0.19]
    ];
    for(var i=0;i<A.length;i++){ arm(1, A[i][0],A[i][1],A[i][2],A[i][3],A[i][4],A[i][5]); }
    for(var i2=0;i2<A.length;i2++){ arm(-1, A[i2][0],A[i2][1],A[i2][2],A[i2][3],A[i2][4],A[i2][5]); }

    // ---- emblems in hands ----
    function chakra(x,y,r){
      circle(g,x,y,r); g.strokeStyle=C.gold; g.lineWidth=U(0.014); g.stroke();
      g.strokeStyle='rgba(249,230,184,0.75)'; g.lineWidth=U(0.008);
      for(var k=0;k<8;k++){ var an=(k/8)*TAU;
        g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r); g.stroke(); }
      circle(g,x,y,r*0.26); g.fillStyle=C.hot; g.fill();
    }
    function lotus(x,y,r){
      for(var k=0;k<6;k++){
        var an=(k/6)*TAU;
        g.save(); g.translate(x,y); g.rotate(an);
        ell(g,0,-r*0.55,r*0.30,r*0.58); g.fillStyle=k%2?C.pale:'#F3B3A0'; g.fill();
        g.strokeStyle='rgba(126,29,16,0.6)'; g.lineWidth=U(0.006); g.stroke();
        g.restore();
      }
      circle(g,x,y,r*0.22); g.fillStyle=C.tur; g.fill();
    }
    function conch(x,y,r){
      g.beginPath(); g.moveTo(x,y-r*0.9);
      g.quadraticCurveTo(x+r*0.95,y-r*0.1,x+r*0.28,y+r*0.95);
      g.quadraticCurveTo(x-r*0.2,y+r*0.55,x-r*0.62,y+r*0.2);
      g.quadraticCurveTo(x-r*0.72,y-r*0.45,x,y-r*0.9);
      g.closePath(); g.fillStyle=C.pale; g.fill();
      g.strokeStyle='rgba(126,29,16,0.65)'; g.lineWidth=U(0.007); g.stroke();
    }
    function flame(x,y,r){
      g.beginPath(); g.moveTo(x,y-r*1.05);
      g.quadraticCurveTo(x+r*0.85,y+r*0.1,x,y+r*0.95);
      g.quadraticCurveTo(x-r*0.85,y+r*0.1,x,y-r*1.05);
      g.closePath(); g.fillStyle='#F5B33E'; g.fill();
      g.strokeStyle='rgba(42,7,5,0.45)'; g.lineWidth=U(0.006); g.stroke();
    }
    chakra(-U(0.475),-U(0.545),U(0.062)); chakra(U(0.475),-U(0.545),U(0.062));
    conch(-U(0.575),-U(0.235),U(0.058));  conch(U(0.575),-U(0.235),U(0.058));
    lotus(-U(0.545),U(0.105),U(0.055));   lotus(U(0.545),U(0.105),U(0.055));
    flame(-U(0.375),U(0.375),U(0.050));   flame(U(0.375),U(0.375),U(0.050));

    // ---- lotus throne ----
    var seatY=U(0.455);
    for(var p=0;p<11;p++){
      var t=(p/10-0.5), px=t*U(0.86), tilt=t*0.75;
      g.save(); g.translate(px,seatY); g.rotate(tilt);
      ell(g,0,0,U(0.165),U(0.075)); g.fillStyle=p%2?'#D9532A':'#B2331A'; g.fill();
      g.strokeStyle='rgba(242,194,92,0.85)'; g.lineWidth=U(0.012); g.stroke();
      ell(g,0,-U(0.012),U(0.10),U(0.030)); g.fillStyle='rgba(249,230,184,0.22)'; g.fill();
      g.restore();
    }

    // ---- torso ----
    g.beginPath();
    g.moveTo(-U(0.185),-U(0.175));
    g.quadraticCurveTo(-U(0.255),U(0.075),-U(0.215),U(0.315));
    g.quadraticCurveTo(0,U(0.395),U(0.215),U(0.315));
    g.quadraticCurveTo(U(0.255),U(0.075),U(0.185),-U(0.175));
    g.quadraticCurveTo(0,-U(0.255),-U(0.185),-U(0.175));
    g.closePath();
    g.fillStyle=C.blue; g.fill();
    g.strokeStyle='rgba(242,194,92,0.95)'; g.lineWidth=U(0.020); g.stroke();
    // sash
    g.beginPath(); g.moveTo(-U(0.175),-U(0.055));
    g.quadraticCurveTo(0,U(0.045),U(0.19),U(0.20));
    g.strokeStyle='rgba(242,194,92,0.72)'; g.lineWidth=U(0.030); g.stroke();
    g.strokeStyle='rgba(196,58,28,0.85)'; g.lineWidth=U(0.015); g.stroke();
    // necklaces
    g.strokeStyle=C.gold; g.lineWidth=U(0.016);
    g.beginPath(); g.arc(0,-U(0.185),U(0.135),0.25,Math.PI-0.25); g.stroke();
    g.beginPath(); g.arc(0,-U(0.135),U(0.175),0.35,Math.PI-0.35); g.stroke();
    circle(g,0,U(0.075),U(0.032)); g.fillStyle=C.tur; g.fill();
    g.strokeStyle=C.gold; g.lineWidth=U(0.010); g.stroke();

    // ---- head ----
    var hyg=-U(0.395), hr2=U(0.128);
    ell(g,0,hyg,hr2*0.92,hr2*1.12); g.fillStyle='#3E93A6'; g.fill();
    g.strokeStyle='rgba(242,194,92,0.95)'; g.lineWidth=U(0.015); g.stroke();
    // hair: a crescent behind the crown, not over the forehead
    ell(g,0,hyg-hr2*0.92,hr2*0.90,hr2*0.50); g.fillStyle=C.navy; g.fill();
    // ears + earrings
    for(var e=-1;e<=1;e+=2){
      ell(g,e*hr2*0.98,hyg+hr2*0.08,hr2*0.16,hr2*0.32); g.fillStyle='#3E93A6'; g.fill();
      circle(g,e*hr2*1.12,hyg+hr2*0.62,hr2*0.14); g.fillStyle=C.gold; g.fill();
    }
    // eyes (almond)
    for(var ey=-1;ey<=1;ey+=2){
      ell(g,ey*hr2*0.42,hyg+hr2*0.02,hr2*0.26,hr2*0.115,ey*0.06);
      g.fillStyle='#F9E6B8'; g.fill();
      g.strokeStyle='#2A0705'; g.lineWidth=U(0.008); g.stroke();
      circle(g,ey*hr2*0.40,hyg+hr2*0.02,hr2*0.075); g.fillStyle='#1A0503'; g.fill();
    }
    // brows
    g.strokeStyle='rgba(42,7,5,0.85)'; g.lineWidth=U(0.010);
    for(var b2=-1;b2<=1;b2+=2){
      g.beginPath(); g.moveTo(b2*hr2*0.18,hyg-hr2*0.20);
      g.quadraticCurveTo(b2*hr2*0.45,hyg-hr2*0.30,b2*hr2*0.70,hyg-hr2*0.18); g.stroke();
    }
    // third eye
    ell(g,0,hyg-hr2*0.42,hr2*0.075,hr2*0.15); g.fillStyle='#F5B33E'; g.fill();
    g.strokeStyle='#2A0705'; g.lineWidth=U(0.006); g.stroke();
    // mouth
    g.strokeStyle='rgba(42,7,5,0.8)'; g.lineWidth=U(0.008);
    g.beginPath(); g.moveTo(-hr2*0.20,hyg+hr2*0.55);
    g.quadraticCurveTo(0,hyg+hr2*0.68,hr2*0.20,hyg+hr2*0.55); g.stroke();
    // tilak
    g.fillStyle=C.verm;
    g.beginPath(); g.moveTo(0,hyg-hr2*0.72); g.lineTo(hr2*0.06,hyg-hr2*0.86);
    g.lineTo(0,hyg-hr2*1.02); g.lineTo(-hr2*0.06,hyg-hr2*0.86); g.closePath(); g.fill();

    // ---- crown (mukut) ----
    var ct=hyg-hr2*1.02;
    g.beginPath();
    g.moveTo(-hr2*0.80,ct+hr2*0.12);
    g.quadraticCurveTo(-hr2*0.18,ct-hr2*0.95,0,ct-hr2*1.28);
    g.quadraticCurveTo(hr2*0.18,ct-hr2*0.95,hr2*0.80,ct+hr2*0.12);
    g.quadraticCurveTo(0,ct+hr2*0.42,-hr2*0.80,ct+hr2*0.12);
    g.closePath(); g.fillStyle=C.tur; g.fill();
    g.strokeStyle='#F9E6B8'; g.lineWidth=U(0.014); g.stroke();
    circle(g,0,ct+hr2*0.02,hr2*0.13); g.fillStyle=C.verm; g.fill();
    g.strokeStyle='#F9E6B8'; g.lineWidth=U(0.008); g.stroke();
    for(var sp=-1;sp<=1;sp+=2){
      circle(g,sp*hr2*0.44,ct+hr2*0.05,hr2*0.09); g.fillStyle='#2F8CA0'; g.fill();
      g.strokeStyle='rgba(249,230,184,0.9)'; g.lineWidth=U(0.006); g.stroke();
    }

    // misregistration ghost (chromolithograph offset)
    g.globalCompositeOperation='screen'; g.globalAlpha=0.10;
    g.drawImage(b.c, 1.6*DPR, 1.4*DPR, b.w, b.h);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';

    L.deity=b;
  }

  function buildEmber(){
    var s=64, b=mk(s,s), g=b.g;
    var rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    rg.addColorStop(0,'rgba(255,232,176,1)');
    rg.addColorStop(0.28,'rgba(245,178,74,0.72)');
    rg.addColorStop(0.62,'rgba(224,110,40,0.22)');
    rg.addColorStop(1,'rgba(200,60,20,0)');
    g.fillStyle=rg; g.fillRect(0,0,s,s);
    L.ember=b;
  }

  /* soft backlight halo — pre-rendered, never a per-frame blur */
  function buildGlow(){
    var s=Math.ceil(R0*2.6), b=mk(s,s), g=b.g;
    var rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    rg.addColorStop(0,'rgba(255,206,120,0.55)');
    rg.addColorStop(0.30,'rgba(238,140,52,0.30)');
    rg.addColorStop(0.62,'rgba(206,62,26,0.13)');
    rg.addColorStop(1,'rgba(150,30,14,0)');
    g.fillStyle=rg; g.fillRect(0,0,s,s);
    L.glow=b;
  }

  /* peacock-blue cousins: same geometry, shifted palette. Cross-faded at runtime
     so the palette breathes between vermilion and peacock without per-frame tinting. */
  function buildTinted(){
    // rays B
    var ext=L.rays ? L.rays.w/2 : R0*1.6, s=Math.ceil(ext*2), b=mk(s,s), g=b.g;
    g.translate(s/2,s/2);
    var n=44, inner=R0*0.99;
    for(var i=0;i<n;i++){
      var a0=(i/n)*TAU, a1=((i+0.52)/n)*TAU;
      g.beginPath();
      g.moveTo(Math.cos(a0)*inner,Math.sin(a0)*inner);
      g.lineTo(Math.cos(a0)*ext,Math.sin(a0)*ext);
      g.lineTo(Math.cos(a1)*ext,Math.sin(a1)*ext);
      g.lineTo(Math.cos(a1)*inner,Math.sin(a1)*inner);
      g.closePath();
      g.fillStyle = i%2 ? 'rgba(225,154,44,0.135)' : 'rgba(42,128,152,0.145)';
      g.fill();
    }
    g.setTransform(1,0,0,1,0,0);
    var fade=g.createRadialGradient(s/2,s/2,ext*0.52,s/2,s/2,ext*0.99);
    fade.addColorStop(0,'rgba(0,0,0,0)');
    fade.addColorStop(0.55,'rgba(0,0,0,0.18)');
    fade.addColorStop(1,'rgba(0,0,0,1)');
    g.globalCompositeOperation='destination-out';
    g.fillStyle=fade; g.fillRect(0,0,s,s);
    g.globalCompositeOperation='source-over';
    L.raysB=b;

    // ring B
    var ext2=R0*1.30, s2=Math.ceil(ext2*2), b2=mk(s2,s2), g2=b2.g;
    g2.translate(s2/2,s2/2);
    var n2=34, rr=R0*1.155;
    for(var j=0;j<n2;j++){
      var a=(j/n2)*TAU;
      g2.save(); g2.rotate(a); g2.translate(0,-rr);
      g2.beginPath();
      g2.moveTo(0,-R0*0.070);
      g2.quadraticCurveTo(R0*0.042,-R0*0.012,0,R0*0.052);
      g2.quadraticCurveTo(-R0*0.042,-R0*0.012,0,-R0*0.070);
      g2.closePath();
      g2.fillStyle = j%2 ? 'rgba(23,80,107,0.50)' : 'rgba(42,128,152,0.42)';
      g2.fill();
      g2.strokeStyle='rgba(225,154,44,0.60)'; g2.lineWidth=Math.max(.8,R0*0.005); g2.stroke();
      g2.restore();
    }
    g2.fillStyle='rgba(249,230,184,0.46)';
    for(var d=0;d<72;d++){
      var da=(d/72)*TAU;
      circle(g2,Math.cos(da)*R0*1.245,Math.sin(da)*R0*1.245,Math.max(.8,R0*0.006)); g2.fill();
    }
    L.ringB=b2;
  }

  /* peacock-blue reading of the same icon, derived once (never per frame):
     draw twice with a hue-rotate shifted copy — cheap, and holds the print feel */
  function buildDeityB(){
    if(!L.deity){ L.deityB=L.deity; return; }
    var w=L.deity.w, h=L.deity.h, b=mk(w,h), g=b.g;
    g.drawImage(L.deity.c,0,0,w,h);
    g.globalCompositeOperation='hue';
    g.globalAlpha=0.72; g.fillStyle='#2A8098'; g.fillRect(0,0,w,h);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
    // keep the warm rim so it still reads as bazaar lithography
    g.globalCompositeOperation='screen'; g.globalAlpha=0.16;
    g.drawImage(L.deity.c,0,0,w,h);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
    L.deityB=b;
  }

  /* raking light shaft sprite: soft vertical beam, pre-blurred by gradient */
  function buildShaft(){
    var w=Math.ceil(R0*0.9), h=Math.ceil(R0*3.2), b=mk(w,h), g=b.g;
    var lg=g.createLinearGradient(0,0,0,h);
    lg.addColorStop(0,'rgba(255,232,170,0.85)');
    lg.addColorStop(0.42,'rgba(255,190,110,0.42)');
    lg.addColorStop(1,'rgba(255,150,60,0)');
    g.fillStyle=lg; g.fillRect(0,0,w,h);
    // feather the horizontal edges
    g.globalCompositeOperation='destination-in';
    var hg=g.createLinearGradient(0,0,w,0);
    hg.addColorStop(0,'rgba(0,0,0,0)');
    hg.addColorStop(0.5,'rgba(0,0,0,1)');
    hg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=hg; g.fillRect(0,0,w,h);
    g.globalCompositeOperation='source-over';
    L.shaft=b;
  }

  var parts=[];
  (function(){
    var R=rnd(97531);
    for(var i=0;i<46;i++){
      parts.push({x:R(),y:R(),vy:0.018+R()*0.045,w:0.5+R()*1.7,p:R()*TAU,r:0.35+R()*0.9});
    }
  })();

  /* film grain / chromolithograph paper tooth — generated once, tiled */
  function buildGrain(){
    var s=170, b=mk(s,s), g=b.g;
    var R=rnd(20240107);
    g.clearRect(0,0,s,s);
    for(var i=0;i<2600;i++){
      var x=R()*s, y=R()*s, a=R();
      g.fillStyle = a>0.5 ? 'rgba(255,238,205,'+(0.05+R()*0.16).toFixed(3)+')'
                          : 'rgba(30,6,4,'+(0.06+R()*0.20).toFixed(3)+')';
      g.fillRect(x,y,1,1);
    }
    for(var k=0;k<70;k++){
      g.strokeStyle='rgba(255,235,200,'+(0.02+R()*0.05).toFixed(3)+')';
      g.lineWidth=0.7;
      var sx=R()*s, sy=R()*s;
      g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+(R()-0.5)*22,sy+(R()-0.5)*10); g.stroke();
    }
    var url=null;
    try{ url=b.c.toDataURL('image/png'); }catch(e){ console.error('grain',e); }
    if(url){ grainEl.style.backgroundImage='url("'+url+'")'; }
  }

  function buildLayers(){
    try{
      buildBG(); buildRays(); buildRing(); buildDeity(); buildEmber();
      buildGrain(); buildGlow(); buildStill();
      buildTinted(); buildDeityB(); buildShaft();
      var sg=ctx.createLinearGradient(0,H*0.40,0,H);
      sg.addColorStop(0,'rgba(20,4,4,0)');
      sg.addColorStop(0.34,'rgba(19,4,3,0.42)');
      sg.addColorStop(0.68,'rgba(15,3,3,0.80)');
      sg.addColorStop(1,'rgba(11,2,2,0.94)');
      scrim=sg;
      var rg2=ctx.createLinearGradient(0,0,W,0);
      rg2.addColorStop(0,'rgba(20,4,4,0.55)');
      rg2.addColorStop(0.22,'rgba(20,4,4,0)');
      rg2.addColorStop(0.78,'rgba(20,4,4,0)');
      rg2.addColorStop(1,'rgba(20,4,4,0.55)');
      sideGrad=rg2;
    }catch(e){ console.error('buildLayers',e); S.err=String(e); }
  }
  var sideGrad=null;

  /* ---------- paint ---------- */
  function drawRot(layer,ang,alpha){
    if(!layer) return;
    var s=layer.w;
    ctx.save(); ctx.globalAlpha=clamp(alpha,0,1);
    ctx.translate(CX,CY); ctx.rotate(ang);
    ctx.drawImage(layer.c,-s/2,-s/2,s,s);
    ctx.restore();
  }

  function draw(now){
    var g=ctx;
    g.setTransform(DPR,0,0,DPR,0,0);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
    if(L.bg) g.drawImage(L.bg.c,0,0,L.bg.w,L.bg.h);
    else { g.fillStyle='#2A0705'; g.fillRect(0,0,W,H); }

    var mot=rm?0.16:1;
    var t=S.anim*mot;
    var pulse=S.pulse;

    // 孔雀蓝的时刻：slow 34s cycle, so the 2.4s / 9.6s / 16.8s checkpoints land on
    // strongly different palettes — warm vermilion, peacock blue, and back again
    var phase=0.5+0.5*Math.sin(t*0.1853);
    var mix=phase>0.36 ? (phase-0.36)/0.64 : 0;
    mix=mix*mix*(3-2*mix)*0.72;

    // backlight bloom behind the whole mandala
    if(L.glow){
      var ga=0.42+0.34*pulse+0.22*S.level;
      g.globalAlpha=clamp(ga,0,1);
      var gs=L.glow.w;
      g.drawImage(L.glow.c, CX-gs/2, CY-gs/2, gs, gs);
      g.globalAlpha=1;
    }

    drawRot(L.rays, t*0.205 + pulse*0.06, 0.60+0.40*pulse);
    if(mix>0.004) drawRot(L.raysB, t*0.205 + pulse*0.06, mix);
    drawRot(L.ring, -t*0.135 - pulse*0.03, 0.85+0.15*pulse);
    if(mix>0.004) drawRot(L.ringB, -t*0.135 - pulse*0.03, mix*0.9);

    if(L.deity){
      var sc=1+0.020*pulse+0.010*S.level;
      g.save(); g.translate(CX,CY); g.scale(sc,sc);
      if(mix>0.004){
        g.globalAlpha=1-mix;
        g.drawImage(L.deity.c,-L.deity.w/2,-L.deity.h/2,L.deity.w,L.deity.h);
        g.globalAlpha=mix;
        g.drawImage(L.deityB.c,-L.deityB.w/2,-L.deityB.h/2,L.deityB.w,L.deityB.h);
        g.globalAlpha=1;
      }else{
        g.drawImage(L.deity.c,-L.deity.w/2,-L.deity.h/2,L.deity.w,L.deity.h);
      }
      g.restore();
    }

    // rim spectrum ticks, just inside the prabhamandala rim
    var n=56, base=R0*0.965;
    for(var i=0;i<n;i++){
      var a=(i/n)*TAU + t*0.205;
      var seed=Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
      var breathe=0.5+0.5*Math.sin(t*1.9 + i*0.78);
      var len=R0*(0.014 + 0.030*breathe + 0.052*(S.bass*0.60+S.mid*0.28+S.level*0.20)*seed);
      g.beginPath();
      g.moveTo(CX+Math.cos(a)*(base-len), CY+Math.sin(a)*(base-len));
      g.lineTo(CX+Math.cos(a)*(base+len*0.55), CY+Math.sin(a)*(base+len*0.55));
      g.strokeStyle='rgba(255,240,205,'+(0.26+0.34*seed+0.24*breathe).toFixed(2)+')';
      g.lineWidth=Math.max(1,R0*0.008); g.stroke();
    }

    // rising embers
    if(L.ember && !rm){
      g.globalCompositeOperation='lighter';
      for(var p=0;p<parts.length;p++){
        var sp=parts[p];
        var prog=(sp.y + t*sp.vy*0.32)%1;
        var py=H*(0.99-0.94*prog);
        var px=W*(sp.x + 0.022*Math.sin(t*sp.w+sp.p));
        var al=Math.sin(prog*Math.PI);
        var sz=Math.min(W,H)*0.030*sp.r;
        g.globalAlpha=clamp(al*0.42*(0.5+0.8*S.level),0,1);
        g.drawImage(L.ember.c, px-sz/2, py-sz/2, sz, sz);
      }
      g.globalAlpha=1; g.globalCompositeOperation='source-over';
    }

    // two slow raking light shafts over the mandala (pre-rendered sprite)
    if(L.shaft){
      g.globalCompositeOperation='screen';
      var sh=L.shaft;
      for(var sIdx=0;sIdx<2;sIdx++){
        var ang=-0.42+sIdx*0.34+0.13*Math.sin(t*0.19+sIdx*2.1);
        var ox=CX+(sIdx?0.30:-0.34)*R0*1.15, oy=CY-R0*1.6;
        g.save(); g.translate(ox,oy); g.rotate(ang);
        g.globalAlpha=(0.42+0.40*phase)*(sIdx?0.68:1);
        g.drawImage(sh.c,0,-sh.h*0.16,sh.w,sh.h);
        g.restore();
      }
      g.globalAlpha=1; g.globalCompositeOperation='source-over';
    }

    // bottom scrim + side vignette
    if(scrim){ g.fillStyle=scrim; g.fillRect(0,H*0.40,W,H*0.60); }
    if(sideGrad){ g.fillStyle=sideGrad; g.fillRect(0,0,W,H); }
    // still (non-animated) collage furniture, pre-rendered once
    if(L.still){ g.drawImage(L.still.c,0,0,L.still.w,L.still.h); }
  }

  /* one-off overlay: gilded border filigree + scattered stylised lotus blooms
     drawn once per resize, never per frame */
  function buildStill(){
    var b=mk(W,H), g=b.g;
    // corner filigree
    var m=Math.min(W,H), pad=Math.min(W*0.022,H*0.038);
    g.strokeStyle='rgba(242,194,92,0.42)'; g.lineWidth=Math.max(1,m*0.0016);
    function corner(sx,sy){
      g.save(); g.translate(sx?W-pad:pad, sy?H-pad:pad); g.scale(sx?-1:1, sy?-1:1);
      g.beginPath();
      g.moveTo(0,m*0.10); g.lineTo(0,0); g.lineTo(m*0.10,0);
      g.stroke();
      g.beginPath();
      g.moveTo(m*0.020,m*0.052); g.quadraticCurveTo(m*0.052,m*0.020,m*0.052,m*0.052);
      g.stroke();
      g.beginPath(); g.arc(m*0.021,m*0.021,m*0.0055,0,TAU);
      g.fillStyle='rgba(242,194,92,0.72)'; g.fill();
      g.restore();
    }
    corner(0,0); corner(1,0); corner(0,1); corner(1,1);

    // a low garland of tiny blooms along the very bottom, under the type
    var R=rnd(60321);
    for(var i=0;i<16;i++){
      var x=W*(0.06+0.88*R()), y=H*(0.955+0.03*R());
      var r=m*(0.006+R()*0.011);
      for(var k=0;k<5;k++){
        var an=(k/5)*TAU+R();
        ell(g,x+Math.cos(an)*r*0.85,y+Math.sin(an)*r*0.85,r*0.62,r*0.26,an);
        g.fillStyle = k%2 ? 'rgba(196,58,28,0.30)' : 'rgba(225,154,44,0.26)';
        g.fill();
      }
      circle(g,x,y,r*0.22); g.fillStyle='rgba(249,230,184,0.34)'; g.fill();
    }
    L.still=b;
  }

  /* ---------- lyrics ---------- */
  var curIdx=-2, spans=[], times=[], lit=-1;
  function buildLine(i){
    curIdx=i;
    curEl.innerHTML=''; spans=[]; times=[]; lit=-1;
    if(i<0||!S.lines[i]){
      // before the first line: show it faintly, as an invocation still to come
      var pre=(i<0&&S.lines.length)?S.lines[0]:null;
      if(pre&&pre.text){
        curEl.textContent=pre.text;
        curEl.style.opacity='0.34';
        curEl.style.fontSize=(Math.max(17,Math.min(W*0.042,H*0.058,52))*0.82).toFixed(1)+'px';
        nxtEl.textContent=''; nxtEl.style.opacity='0';
      }else{
        curEl.innerHTML=''; curEl.style.opacity='0';
      }
      return;
    }
    var ln=S.lines[i], txt=ln.text||'';
    curEl.style.opacity='1';

    var chs=Array.isArray(ln.chars)?ln.chars:null;
    var usable=!!(chs && chs.length && isFinite(chs[0]&&chs[0].t));
    var dur=ln.dur>0?ln.dur:0;
    if(!dur){
      var nx=S.lines[i+1];
      dur=(nx&&isFinite(nx.t)&&nx.t>ln.t)?(nx.t-ln.t):3.2;
    }
    dur=clamp(dur,0.6,14);

    var n=txt.length;
    var unit=Math.max(0.035,dur/Math.max(1,n));
    for(var k=0;k<n;k++){
      var sp=document.createElement('span');
      sp.className='ch';
      sp.textContent=txt.charAt(k);
      curEl.appendChild(sp);
      spans.push(sp);
      var tm;
      if(usable){
        var c=chs[k];
        tm=(c&&isFinite(c.t))?+c.t:(ln.t+Math.min(dur*0.9,unit*k));
      }else{
        tm=ln.t+unit*k;
      }
      if(!isFinite(tm)) tm=ln.t+unit*k;
      times.push(tm);
    }
    // adaptive size so long lines never overflow, on any aspect ratio
    var base=Math.max(16, Math.min(W*0.040, H*0.056, 50));
    var vis=Math.max(1, txt.length);
    // one CJK glyph ≈ 1em; keep the line within ~13 glyphs per row budget
    var avail=(W*0.86)/Math.max(1,vis);
    var kk=Math.min(1, avail/(base*0.98));
    if(vis>13) kk=Math.min(kk, Math.max(0.40, Math.pow(13/vis,0.62)));
    kk=clamp(kk,0.34,1);
    curEl.style.fontSize=(base*kk).toFixed(1)+'px';

    var nx2=S.lines[i+1];
    nxtEl.textContent = nx2? (nx2.text||'') : '';
    nxtEl.style.opacity = nx2? '0.40':'0';
  }

  function findIdx(t){
    var ls=S.lines, lo=0, hi=ls.length-1, ans=-1;
    while(lo<=hi){
      var mid=(lo+hi)>>1;
      if(ls[mid].t<=t+0.02){ ans=mid; lo=mid+1; } else { hi=mid-1; }
    }
    return ans;
  }

  function syncLyrics(){
    var i=findIdx(S.t);
    if(i!==curIdx) buildLine(i);
    S.idx=i;
    S.text=(i>=0&&S.lines[i])?(S.lines[i].text||''):'';
    if(i>=0&&times.length){
      var c=0, n=times.length;
      while(c<n && times[c]<=S.t+0.001) c++;
      if(c!==lit){
        var from=Math.max(0,lit);
        for(var k=from;k<c&&k<n;k++){ if(spans[k]&&spans[k].className!=='ch on') spans[k].className='ch on'; }
        for(var k2=Math.max(c,0);k2<n;k2++){ if(spans[k2]&&spans[k2].className!=='ch') spans[k2].className='ch'; }
        lit=c;
      }
    }
  }

  function sendReady(){
    if(S.readySent) return; S.readySent=true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){ console.error('ready',e); }
  }

  function frame(now){
    var t0=performance.now();
    S.frames++;
    try{
      if(!S.last) S.last=now;
      var dt=now-S.last; S.last=now;
      if(!isFinite(dt)||dt<0) dt=16;
      if(dt>120) dt=120;
      S.anim += dt*0.001*(S.playing?1:0.34);

      var decay=Math.pow(0.0025, dt/1000);
      S.pulse*=decay;
      if(!rm) S.pulse=Math.max(S.pulse, S.bass*0.50);
      S.level*=Math.pow(0.35, dt/1000);
      S.bass*=Math.pow(0.6, dt/1000);
      S.mid*=Math.pow(0.5, dt/1000);
      S.treb*=Math.pow(0.4, dt/1000);

      draw(now);
      syncLyrics();
    }catch(e){ S.err=String(e); console.error('frame',e); }
    S.js=performance.now()-t0;
    sendReady();
    requestAnimationFrame(frame);
  }

  /* ---------- message protocol ---------- */
  function onInit(p){
    p=p||{};
    try{
      var acc=p.accent;
      if(acc&&acc.length>=3&&isFinite(acc[0])) S.accent=[clamp(acc[0]|0,0,255),clamp(acc[1]|0,0,255),clamp(acc[2]|0,0,255)];
      var song=p.song||{};
      var nm=(typeof song.name==='string'&&song.name)?song.name:'';
      nameEl.textContent = nm ? nm : '\u00A0';
      S.duration=isFinite(p.duration)&&p.duration>0?+p.duration:0;

      var ls=Array.isArray(p.lines)?p.lines:[];
      var out=[], prevT=-1;
      for(var i=0;i<ls.length&&i<4000;i++){
        var l=ls[i];
        if(!l||typeof l!=='object'||l.text==null) continue;
        var txt=String(l.text);
        if(!txt.length) continue;
        var lt=(isFinite(l.t)&&l.t>=0)?+l.t:(prevT>=0?prevT+3:0);
        if(lt<prevT) lt=prevT;           // keep times monotonic for the binary search
        prevT=lt;
        out.push({
          t:lt,
          dur:(isFinite(l.dur)&&l.dur>0)?+l.dur:0,
          text:txt,
          chars:(Array.isArray(l.chars)&&l.chars.length)?l.chars:null
        });
      }
      S.lines=out;
      curIdx=-2; buildLine(-2);
      if(!out.length){
        curEl.style.opacity='0';
        nxtEl.textContent=''; nxtEl.style.opacity='0';
        emptyEl.innerHTML='\u6b64\u66f2\u65e0\u8bcd<small>\u9759\u542c\u821a\u97f3</small>';
        emptyEl.style.display='block';
        S.idx=-1; S.text='';
      } else {
        emptyEl.style.display='none';
        curIdx=-2;
        syncLyrics();
      }
      if(typeof p.playing==='boolean') S.playing=p.playing;
    }catch(e){ S.err=String(e); console.error('init',e); }
  }

  function onTick(p){
    if(!p) return;
    if(isFinite(p.time)) S.t=Math.max(0,+p.time);
    if(typeof p.playing==='boolean') S.playing=p.playing;
  }
  function onLive(p){
    if(!p) return;
    if(isFinite(p.level)) S.level=clamp(+p.level,0,1.4);
    if(isFinite(p.bass)) S.bass=clamp(+p.bass,0,1.4);
    if(isFinite(p.mid)) S.mid=clamp(+p.mid,0,1.4);
    if(isFinite(p.treble)) S.treb=clamp(+p.treble,0,1.4);
  }
  function onBeat(p){
    if(!p) return;
    var lv=isFinite(p.level)?clamp(+p.level,0,1):0.6;
    S.pulse=Math.min(1.25,S.pulse*0.6+lv*0.95);
    S.beat++;
  }

  window.addEventListener('message',function(ev){
    var d=ev.data; if(!d||d.__c100!==1) return;
    try{
      if(d.type==='init') onInit(d.payload||{});
      else if(d.type==='tick') onTick(d.payload||{});
      else if(d.type==='live') onLive(d.payload||{});
      else if(d.type==='beat') onBeat(d.payload||{});
    }catch(e){ S.err=String(e); console.error('msg',e); }
  },false);

  var rt=null;
  window.addEventListener('resize',function(){
    try{
      if(rt) clearTimeout(rt);
      rt=setTimeout(function(){
        try{
          resize(); buildLayers();
          curIdx=-2; syncLyrics();
        }catch(e){ console.error('resize2',e); }
      },160);
    }catch(e){ console.error('resizeEvt',e); }
  });
  window.addEventListener('orientationchange',function(){
    try{ resize(); buildLayers(); curIdx=-2; syncLyrics(); }catch(e){ console.error('orient',e); }
  });

  /* ---------- self test hook (defined once, unconditional) ---------- */
  window.__stage=function(){
    return { lines:S.lines.length, idx:S.idx, t:S.t, playing:!!S.playing, frames:S.frames,
             js:S.js, err:S.err, text:S.text, gl:false, rm:!!rm };
  };

  /* ---------- boot ---------- */
  resize();
  requestAnimationFrame(frame);
  buildLayers();
  setTimeout(sendReady, 800);
})();
</script>
</body>
</html>
