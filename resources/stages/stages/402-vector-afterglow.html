<style>

  .meta { position:absolute; z-index:8; left:clamp(24px,7.2vw,124px); bottom:calc(clamp(30px,6.8vh,66px) + env(safe-area-inset-bottom)); right:clamp(24px,6vw,96px); display:flex; align-items:flex-end; justify-content:space-between; gap:22px; border-top:1px solid var(--edge); padding-top:10px; }

  .stamp { text-align:right; font:800 8px/1.55 "Arial Narrow",Arial,sans-serif; letter-spacing:.16em; color:var(--ice); white-space:nowrap; }
  .progress { position:absolute; z-index:9; left:0; right:0; bottom:6px; height:3px; background:rgba(245,243,234,.15); }

    .brand { font-size:clamp(34px,11vw,52px); }
    .brand-sub { font-size:7px; letter-spacing:.2em; }

    .eyebrow { font-size:8px; letter-spacing:.2em; margin-bottom:14px; }
    #lyric { font-size:clamp(36px,10.6vw,64px); line-height:1.07; letter-spacing:-.038em; }
    #lyric.long { font-size:clamp(28px,7.6vw,50px); }
    #lyric.verylong { font-size:clamp(22px,6vw,38px); }

    .song-name { max-width:56vw; font-size:11px; }
    .song-artist { font-size:8px; max-width:56vw; }

    .masthead { top:44px; } .brand { font-size:clamp(28px,4vw,48px); } .brand-sub { display:none; }
    .lyrics-wrap { top:48%; transform:translateY(-34%); } #lyric { font-size:clamp(30px,5vw,62px); }
    .meta { bottom:22px; } .warning-sticker { display:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    #lyric .char { transition:none; } #lyric .line-inner { animation:none; }
    .scanlines { opacity:.18; }
  }
</style>

<body>
<div id="stage">
  <canvas id="paint" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="edge edge-top" aria-hidden="true"></div>
  <div class="edge edge-bottom" aria-hidden="true"></div>
  <div class="hud topline">
    <span>DR//402 · VECTOR AFTERGLOW</span>
    <span class="hide-sm">TECHSTEP ARCHIVE <b class="tick">■</b> <span id="bpmLabel">170 BPM</span></span>
    <span class="clock" id="clock">T+ 00:00:00</span>
  </div>
  <div class="masthead" aria-hidden="true">

    <span class="sticker-top"><i>▲</i>Caution</span><strong>高速音圧<br><em>注意</em></strong>

      <div class="barcode" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  var state = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, text: '', rm: false,
    duration: 0, accent: [255, 89, 24], beatLevel: 0, beatIndex: 0, beatAt: 0,
    live: { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, playing: true }
  };
  var rootEl, canvasEl, ctx, lyricEl, emptyEl, eyebrowEl, nameEl, artistEl, stampEl, clockEl, bpmEl, progressEl;
  var width = 1440, height = 900, dpr = 1, backdrop = null;
  var currentLineKey = '', currentSpans = [], currentStarts = [], currentLit = -1;
  var lastErrorAt = 0, readySent = false, initialized = false, songName = '', songArtist = '';
  var accentMain = [255, 89, 24], accentBright = [255, 123, 66];
  var hudKey = '', lastProgress = -1, resizeQueued = false;
  var TAU = Math.PI * 2;

  window.__stage = function () {
    return {
      lines: state.lines.length, idx: state.idx, t: state.t, playing: !!state.playing,
      frames: state.frames, js: state.js, err: '', text: state.text, gl: false, rm: state.rm
    };
  };

  function reportError(error) {
    var now = Date.now();
    if (now - lastErrorAt < 1000) return;
    lastErrorAt = now;
    console.error('[402 vector-afterglow]', error);
  }

  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (error) { reportError(error); }
  }

  function clamp(value, low, high) {
    var number = Number(value);
    if (!isFinite(number)) number = low;
    return Math.max(low, Math.min(high, number));
  }

  function rgba(rgb, alpha) {
    var red = Math.round(clamp(rgb[0], 0, 255));
    var green = Math.round(clamp(rgb[1], 0, 255));
    var blue = Math.round(clamp(rgb[2], 0, 255));
    return 'rgba(' + red + ',' + green + ',' + blue + ',' + clamp(alpha, 0, 1).toFixed(3) + ')';
  }

  function mixColor(first, second, amount) {
    var ratio = clamp(amount, 0, 1);
    return [
      Math.round(clamp(first[0] * (1 - ratio) + second[0] * ratio, 0, 255)),
      Math.round(clamp(first[1] * (1 - ratio) + second[1] * ratio, 0, 255)),
      Math.round(clamp(first[2] * (1 - ratio) + second[2] * ratio, 0, 255))
    ];
  }

  function setAccent(value) {
    var incoming = [255, 89, 24], valid = false;
    if (Array.isArray(value) && value.length >= 3) {
      var channels = [], index, channel;
      for (index = 0; index < 3; index += 1) {
        channel = Number(value[index]);
        if (!isFinite(channel)) break;
        channels.push(Math.round(clamp(channel, 0, 255)));
      }
      if (channels.length === 3) { incoming = channels; valid = true; }
    }
    if (!valid) incoming = [255, 89, 24];
    var luminance = (incoming[0] * 0.2126 + incoming[1] * 0.7152 + incoming[2] * 0.0722) / 255;
    var visible = incoming;
    if (luminance < 0.18) visible = mixColor(incoming, [255, 89, 24], 0.65);
    else if (luminance > 0.8) visible = mixColor(incoming, [255, 89, 24], 0.58);
    accentMain = visible;
    accentBright = luminance < 0.34 ? mixColor(visible, [245, 243, 234], 0.48) : visible;
    state.accent = accentMain.slice();
    if (rootEl) {
      rootEl.style.setProperty('--accent', rgba(accentMain, 1));
      rootEl.style.setProperty('--accent-bright', rgba(accentBright, 1));
    }
  }

  function makeLinearGradient(context, x0, y0, x1, y1, stops) {
    var gradient, index, stop;
    try {
      gradient = context.createLinearGradient(x0, y0, x1, y1);
      for (index = 0; index < stops.length; index += 1) {
        stop = stops[index];
        if (!stop || stop.length < 2) continue;
        gradient.addColorStop(clamp(stop[0], 0, 1), String(stop[1]));
      }
      return gradient;
    } catch (error) {
      reportError(error);
      return 'rgba(8,9,11,1)';
    }
  }

  function isDrawableCanvas(source) {
    return !!source && source.nodeName === 'CANVAS' && Number(source.width) > 0 && Number(source.height) > 0;
  }

  function queueResize() {
    if (resizeQueued) return;
    resizeQueued = true;
    setTimeout(function () {
      resizeQueued = false;
      try { resize(); } catch (error) { reportError(error); }
    }, 90);
  }

  function resize() {
    var viewWidth = Number(window.innerWidth), viewHeight = Number(window.innerHeight);
    if (!isFinite(viewWidth) || viewWidth <= 0) viewWidth = 1440;
    if (!isFinite(viewHeight) || viewHeight <= 0) viewHeight = 900;
    width = Math.max(1, Math.round(viewWidth));
    height = Math.max(1, Math.round(viewHeight));
    var baseDpr = clamp(Number(window.devicePixelRatio) || 1, 1, 2);
    dpr = Math.min(baseDpr, 2560 / width, 1600 / height);
    if (!isFinite(dpr) || dpr <= 0) dpr = 1;
    dpr = Math.max(0.35, dpr);
    if (canvasEl) {
      canvasEl.width = Math.max(1, Math.round(width * dpr));
      canvasEl.height = Math.max(1, Math.round(height * dpr));
      canvasEl.style.width = width + 'px';
      canvasEl.style.height = height + 'px';
    }
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bakeBackdrop();
  }

  function bakeBackdrop() {
    if (!isDrawableCanvas(backdrop)) backdrop = document.createElement('canvas');
    backdrop.width = Math.max(1, Math.round(width * dpr));
    backdrop.height = Math.max(1, Math.round(height * dpr));
    var field = backdrop.getContext('2d', { alpha: false });
    if (!field) {
      backdrop = null;
      reportError(new Error('Backdrop 2D context unavailable'));
      return;
    }
    field.setTransform(dpr, 0, 0, dpr, 0, 0);
    field.fillStyle = '#08090b';
    field.fillRect(0, 0, width, height);

    field.beginPath();
    field.moveTo(width * 0.31, 0);
    field.lineTo(width, 0);
    field.lineTo(width, height * 0.34);
    field.lineTo(width * 0.53, height);
    field.lineTo(width * 0.24, height * 0.63);
    field.closePath();
    field.fillStyle = '#0c1117';
    field.fill();
    field.save();
    field.clip();
    field.translate(width * 0.69, height * 0.42);
    field.rotate(-0.38);
    field.strokeStyle = 'rgba(169,233,255,.07)';
    field.lineWidth = 1;
    var run = Math.max(width, height) * 1.2;
    var line;
    for (line = -22; line <= 22; line += 1) {
      field.beginPath();
      field.moveTo(line * 78, -run);
      field.lineTo(line * 78, run);
      field.stroke();
      field.beginPath();
      field.moveTo(-run, line * 78);
      field.lineTo(run, line * 78);
      field.stroke();
    }
    field.strokeStyle = 'rgba(255,89,24,.42)';
    field.lineWidth = 2;
    for (line = -4; line <= 4; line += 1) {
      field.beginPath();
      field.moveTo(-run, line * 156 - 30);
      field.lineTo(run, line * 156 + 70);
      field.stroke();
    }
    field.restore();

    field.beginPath();
    field.moveTo(width * 0.31, 0);
    field.lineTo(width * 0.24, height * 0.63);
    field.strokeStyle = 'rgba(245,243,234,.16)';
    field.lineWidth = 1;
    field.stroke();

    var digits = Math.round(Math.min(height * 0.55, width * 0.35));
    field.save();
    field.translate(width * 0.54, height * 0.92);
    field.rotate(-0.055);
    field.font = '900 ' + Math.max(120, digits) + 'px Impact, "Arial Black", sans-serif';
    field.fillStyle = 'rgba(245,243,234,.032)';
    field.fillText('170', 0, 0);
    field.restore();

    field.save();
    field.translate(width * 0.765, height * 0.36);
    var dotRow, dotCol, dotX, dotY, dotDistance;
    for (dotRow = -11; dotRow <= 11; dotRow += 1) {
      for (dotCol = -11; dotCol <= 11; dotCol += 1) {
        dotX = dotCol * 20;
        dotY = dotRow * 20;
        dotDistance = Math.sqrt(dotX * dotX + dotY * dotY);
        if (dotDistance < 172 && dotDistance > 66 && ((dotRow + dotCol) & 1) === 0) {
          field.fillStyle = 'rgba(169,233,255,' + (0.11 + (1 - dotDistance / 172) * 0.1).toFixed(3) + ')';
          field.fillRect(dotX, dotY, 2, 2);
        }
      }
    }
    field.restore();

    var barcodeX = width * 0.835, barcodeY = height * 0.115, barcodeHeight = Math.max(20, height * 0.036);
    field.fillStyle = 'rgba(245,243,234,.68)';
    for (var bar = 0; bar < 48; bar += 1) {
      var barWidth = (bar % 7 === 0) ? 3 : (bar % 3 === 0 ? 2 : 1);
      var barGap = (bar % 5 === 0) ? 4 : 2;
      field.fillRect(barcodeX, barcodeY, barWidth, barcodeHeight);
      barcodeX += barWidth + barGap;
    }
    field.fillStyle = 'rgba(169,233,255,.78)';
    field.font = '700 8px "Arial Narrow", Arial, sans-serif';
    field.fillText('JPN // NC-17 // 00402', width * 0.835, barcodeY - 8);

    var scrim = makeLinearGradient(field, 0, 0, width * 0.74, 0, [
      [0, 'rgba(8,9,11,0.98)'],
      [0.56, 'rgba(8,9,11,0.78)'],
      [1, 'rgba(8,9,11,0)']
    ]);
    field.fillStyle = scrim;
    field.fillRect(0, 0, width * 0.78, height);
    var lowScrim = makeLinearGradient(field, 0, height * 0.62, 0, height, [
      [0, 'rgba(8,9,11,0)'],
      [1, 'rgba(8,9,11,0.82)']
    ]);
    field.fillStyle = lowScrim;
    field.fillRect(0, height * 0.62, width, height * 0.38);

    var seed = 402;
    var grainCount = Math.min(560, Math.max(220, Math.round(width * height / 2600)));
    for (var grain = 0; grain < grainCount; grain += 1) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      var grainX = (seed / 4294967296) * width;
      seed = (seed * 1664525 + 1013904223) >>> 0;
      var grainY = (seed / 4294967296) * height;
      field.fillStyle = 'rgba(245,243,234,' + (0.025 + (grain % 7) * 0.006).toFixed(3) + ')';
      field.fillRect(grainX, grainY, 1, 1);
    }

    field.strokeStyle = 'rgba(245,243,234,.14)';
    field.lineWidth = 1;
    field.beginPath();
    field.moveTo(width * 0.055, height * 0.79);
    field.lineTo(width * 0.285, height * 0.79);
    field.stroke();
    field.beginPath();
    field.moveTo(width * 0.055, height * 0.79);
    field.lineTo(width * 0.073, height * 0.776);
    field.stroke();
  }

  function formatTime(seconds) {
    var total = Math.max(0, Math.floor(Number(seconds) || 0));
    var minutes = Math.floor(total / 60), rest = total % 60;
    return String(minutes).padStart(2, '0') + ':' + String(rest).padStart(2, '0');
  }

  function timecode(seconds) {
    var safe = Math.max(0, Number(seconds) || 0);
    var minutes = Math.floor(safe / 60), whole = Math.floor(safe % 60), frames = Math.floor((safe % 1) * 30);
    return String(minutes).padStart(2, '0') + ':' + String(whole).padStart(2, '0') + ':' + String(frames).padStart(2, '0');
  }

  function updateHud() {
    var bpm = Math.round(state.live.bpm) || 170;
    if (clockEl) clockEl.textContent = 'T+ ' + timecode(state.t) + ' / ' + formatTime(state.duration);
    if (nameEl) nameEl.textContent = songName || 'UNKNOWN SIGNAL';
    if (artistEl) artistEl.textContent = songArtist || 'AWAITING TRANSMISSION';
    if (bpmEl) bpmEl.textContent = bpm + ' BPM';
    var key = (state.playing ? 'play' : 'hold') + '|' + bpm;
    if (stampEl && key !== hudKey) {
      hudKey = key;
      stampEl.innerHTML = (state.playing ? 'PLAY//' : 'HOLD//') + bpm + '<br>CH.402 VECTOR';
    }
    if (progressEl) {
      var ratio = state.duration > 0 ? clamp(state.t / state.duration, 0, 1) : 0;
      if (Math.abs(ratio - lastProgress) > 0.0008) {
        lastProgress = ratio;
        progressEl.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
      }
    }
  }

  function findLineIndex(time) {
    var found = -1;
    for (var index = 0; index < state.lines.length; index += 1) {
      var start = Number(state.lines[index].t);
      if (!isFinite(start)) continue;
      if (start <= time + 0.0005) found = index;
      else break;
    }
    return found;
  }

  function sanitizeLines(rawLines) {
    var cleaned = [];
    var count = Array.isArray(rawLines) ? Math.min(rawLines.length, 900) : 0;
    for (var index = 0; index < count; index += 1) {
      var item = rawLines[index];
      if (!item) continue;
      var text = typeof item.text === 'string' ? item.text.trim() : '';
      if (!text) continue;
      var start = Number(item.t);
      var duration = Number(item.dur);
      cleaned.push({
        t: isFinite(start) ? Math.max(0, start) : 0,
        dur: isFinite(duration) ? clamp(duration, 0, 900) : 0,
        text: text,
        chars: Array.isArray(item.chars) ? item.chars.slice(0, 900) : null
      });
    }
    cleaned.sort(function (first, second) { return first.t - second.t; });
    return cleaned;
  }

  function textTokens(text) {
    var tokens;
    try { tokens = Array.from(text); }
    catch (error) { reportError(error); tokens = text.split(''); }
    if (tokens.length > 900) {
      tokens = tokens.slice(0, 899);
      tokens.push('…');
    }
    return tokens.map(function (token) {
      return (token === '\n' || token === '\r' || token === '\t') ? ' ' : token;
    });
  }

  function lineEndFor(index, line) {
    var start = Math.max(0, Number(line.t) || 0);
    var nextStart = index + 1 < state.lines.length ? Number(state.lines[index + 1].t) : NaN;
    var duration = Number(line.dur);
    if (!isFinite(duration) || duration <= 0) {
      var estimated = Math.max(2.2, Math.min(7.5, line.text.length * 0.26));
      duration = isFinite(nextStart) && nextStart > start ? Math.min(nextStart - start, estimated) : estimated;
    }
    var end = start + clamp(duration, 0.35, 30);
    if (isFinite(nextStart) && nextStart > start + 0.05) end = Math.min(end, nextStart);
    return Math.max(start + 0.35, end);
  }

  function computeLinePieces(index) {
    var line = state.lines[index];
    var start = Math.max(0, Number(line.t) || 0);
    var end = lineEndFor(index, line);
    var pieces = textTokens(line.text);
    var starts = [];
    var sourceChars = Array.isArray(line.chars) ? line.chars : null;
    var yrcPieces = [], yrcStarts = [], yrcValid = !!sourceChars && sourceChars.length > 0;
    var charIndex, item, character, moment;
    if (yrcValid) {
      for (charIndex = 0; charIndex < Math.min(sourceChars.length, 900); charIndex += 1) {
        item = sourceChars[charIndex];
        character = item && typeof item.c === 'string' ? item.c : '';
        moment = item ? Number(item.t) : NaN;
        if (!character || !isFinite(moment)) { yrcValid = false; break; }
        yrcPieces.push(character);
        yrcStarts.push(Math.max(0, moment));
      }
      if (yrcValid && yrcPieces.join('').replace(/\s+/g, '') !== line.text.replace(/\s+/g, '')) yrcValid = false;
    }
    if (yrcValid && yrcPieces.length) {
      pieces = yrcPieces;
      starts = yrcStarts;
      for (charIndex = 1; charIndex < starts.length; charIndex += 1) {
        starts[charIndex] = Math.max(starts[charIndex], starts[charIndex - 1]);
      }
    } else {
      var span = Math.max(0.4, end - start);
      for (charIndex = 0; charIndex < pieces.length; charIndex += 1) {
        starts.push(start + (pieces.length <= 1 ? 0 : span * charIndex / (pieces.length - 1)));
      }
    }
    return { pieces: pieces, starts: starts, start: start, end: end };
  }

  function resetLyricNode() {
    if (!lyricEl) return;
    lyricEl.textContent = '';
    lyricEl.classList.remove('preview', 'long', 'verylong');
    currentSpans = [];
    currentStarts = [];
    currentLit = -1;
  }

  function buildLine(index, preview) {
    var data = computeLinePieces(index);
    resetLyricNode();
    currentStarts = data.starts;
    var inner = document.createElement('span');
    inner.className = 'line-inner';
    for (var charIndex = 0; charIndex < data.pieces.length; charIndex += 1) {
      var span = document.createElement('span');
      span.className = 'char';
      span.textContent = data.pieces[charIndex];
      inner.appendChild(span);
      currentSpans.push(span);
    }
    lyricEl.appendChild(inner);
    lyricEl.classList.toggle('preview', !!preview);
    lyricEl.classList.toggle('long', data.pieces.length >= 24);
    lyricEl.classList.toggle('verylong', data.pieces.length >= 48);
    if (!preview) updateCharProgress();
  }

  function updateCharProgress() {
    if (!currentSpans.length) return;
    var litCount = 0;
    for (var index = 0; index < currentStarts.length; index += 1) {
      if (state.t >= currentStarts[index]) litCount = index + 1;
      else break;
    }
    if (litCount > currentLit) {
      for (var addIndex = Math.max(0, currentLit); addIndex < litCount; addIndex += 1) {
        currentSpans[addIndex].classList.add('lit');
      }
    } else if (litCount < currentLit) {
      for (var removeIndex = Math.max(0, litCount); removeIndex < currentLit; removeIndex += 1) {
        currentSpans[removeIndex].classList.remove('lit', 'hot');
      }
    }
    if (currentLit > 0 && currentLit !== litCount) currentSpans[currentLit - 1].classList.remove('hot');
    if (litCount > 0) {
      var activeIndex = litCount - 1;
      var activeAge = state.t - currentStarts[activeIndex];
      if (activeAge >= 0 && activeAge < 0.9) currentSpans[activeIndex].classList.add('hot');
      else currentSpans[activeIndex].classList.remove('hot');
    }
    currentLit = litCount;
  }

  function renderLyric(force) {
    if (!initialized || !lyricEl || !emptyEl) return;
    if (!state.lines.length) {
      if (!force && currentLineKey === 'empty') return;
      resetLyricNode();
      state.text = '';
      currentLineKey = 'empty';
      lyricEl.style.display = 'none';
      emptyEl.style.display = 'block';
      eyebrowEl.textContent = 'NO VOCAL / 器乐段落';
      return;
    }
    emptyEl.style.display = 'none';
    lyricEl.style.display = 'block';
    var preview = state.idx < 0;
    var visualIndex = preview ? 0 : state.idx;
    var line = state.lines[visualIndex];
    if (!line) return;
    state.text = preview ? '' : line.text;
    var key = (preview ? 'p' : 'a') + visualIndex + '|' + line.t + '|' + line.text + '|' + currentStarts.length;
    if (!force && key === currentLineKey) {
      if (!preview) updateCharProgress();
      return;
    }
    buildLine(visualIndex, preview);
    currentLineKey = key;
    if (preview) {
      eyebrowEl.textContent = 'STANDBY / 前奏 · ' + formatTime(line.t);
    } else {
      eyebrowEl.textContent = 'LINE ' + String(state.idx + 1).padStart(2, '0') + ' / ' + String(state.lines.length).padStart(2, '0') + ' · ' + formatTime(state.t);
    }
  }

  function onInit(payload) {
    initialized = true;
    var song = payload && payload.song ? payload.song : {};
    var artists = song.artists;
    if (Array.isArray(artists)) {
      artists = artists.filter(function (artist) { return typeof artist === 'string' && artist.trim(); }).join(' / ');
    }
    songName = typeof song.name === 'string' ? song.name.trim() : '';
    songArtist = typeof artists === 'string' ? artists.trim() : '';
    var duration = Number(payload && payload.duration);
    state.duration = isFinite(duration) ? clamp(duration, 0, 86400) : 0;
    state.playing = !(payload && payload.playing === false);
    setAccent(payload ? payload.accent : null);
    state.lines = sanitizeLines(payload ? payload.lines : []);
    state.idx = findLineIndex(state.t);
    state.text = state.idx >= 0 && state.lines[state.idx] ? state.lines[state.idx].text : '';
    currentLineKey = '';
    currentLit = -1;
    try { renderLyric(true); }
    catch (error) { reportError(error); }
    updateHud();
  }

  function onTick(payload) {
    var nextTime = Number(payload && payload.time);
    if (isFinite(nextTime)) state.t = nextTime;
    if (payload && typeof payload.playing === 'boolean') state.playing = payload.playing;
    state.idx = findLineIndex(state.t);
    state.text = state.idx >= 0 && state.lines[state.idx] ? state.lines[state.idx].text : '';
    try { renderLyric(false); }
    catch (error) { reportError(error); }
    updateHud();
  }

  function onBeat(payload) {
    var level = Number(payload && payload.level);
    state.beatLevel = isFinite(level) ? clamp(level, 0, 1) : 0.7;
    var index = Number(payload && payload.index);
    state.beatIndex = isFinite(index) ? index : state.beatIndex + 1;
    state.beatAt = performance.now();
  }

  function onLive(payload) {
    if (!payload) return;
    var bpm = Number(payload.bpm), level = Number(payload.level);
    var bass = Number(payload.bass), mid = Number(payload.mid), treble = Number(payload.treble);
    if (isFinite(bpm)) state.live.bpm = clamp(bpm, 0, 300);
    if (isFinite(level)) state.live.level = clamp(level, 0, 1);
    if (isFinite(bass)) state.live.bass = clamp(bass, 0, 1);
    if (isFinite(mid)) state.live.mid = clamp(mid, 0, 1);
    if (isFinite(treble)) state.live.treble = clamp(treble, 0, 1);
    if (typeof payload.playing === 'boolean') state.live.playing = payload.playing;
  }

  function getPulse(now) {
    var pulse = 0;
    if (state.beatAt > 0) {
      var age = Math.max(0, (now - state.beatAt) / 1000);
      pulse = state.beatLevel * Math.exp(-age * 3.1);
    }
    pulse = Math.max(pulse, state.live.bass * 0.3, state.live.level * 0.13);
    if (state.rm) pulse *= 0.32;
    return clamp(pulse, 0, 1);
  }

  function fillSkewBar(context, left, top, barWidth, barHeight, skew) {
    context.beginPath();
    context.moveTo(left + skew, top);
    context.lineTo(left + barWidth + skew, top);
    context.lineTo(left + barWidth, top + barHeight);
    context.lineTo(left, top + barHeight);
    context.closePath();
    context.fill();
  }

  function drawRingField(pulse, seconds) {
    var narrow = width < 760;
    var centerX = width * (narrow ? 0.81 : 0.755);
    var centerY = height * (narrow ? 0.235 : 0.415);
    var base = Math.max(72, Math.min(width, height) * (narrow ? 0.152 : 0.193));
    var motion = state.rm ? 0.16 : 1;
    var bpmRate = (state.live.bpm > 0 ? clamp(state.live.bpm, 60, 220) : 170) / 170;
    var rotation = seconds * (0.085 + bpmRate * 0.04) * motion;
    var ringIndex, tick, angle, inner, outer;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.lineCap = 'butt';
    ctx.strokeStyle = 'rgba(169,233,255,.13)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, base * 1.27, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);

    for (ringIndex = 0; ringIndex < 3; ringIndex += 1) {
      ctx.beginPath();
      ctx.arc(0, 0, base * (1 - ringIndex * 0.17), 0, TAU);
      ctx.strokeStyle = ringIndex === 0 ? 'rgba(245,243,234,.4)' : 'rgba(245,243,234,.16)';
      ctx.lineWidth = ringIndex === 0 ? 1.4 : 1;
      ctx.stroke();
    }

    ctx.beginPath();
    for (tick = 0; tick < 48; tick += 1) {
      angle = rotation + tick * TAU / 48;
      inner = base * (tick % 6 === 0 ? 1.03 : 1.1);
      outer = base * 1.16;
      ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
      ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
    }
    ctx.strokeStyle = 'rgba(169,233,255,.44)';
    ctx.lineWidth = 1;
    ctx.stroke();

    var arcStart = rotation * 1.8 - 1.1;
    ctx.beginPath();
    ctx.arc(0, 0, base * 0.93, arcStart, arcStart + 1.06);
    ctx.strokeStyle = rgba(accentMain, 0.98);
    ctx.lineWidth = Math.max(3, base * 0.035);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, base * 0.93, arcStart + 1.2, arcStart + 1.52);
    ctx.strokeStyle = rgba(accentBright, 0.76);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, base * 0.56 + pulse * base * 0.06, 0, TAU);
    ctx.fillStyle = '#090c11';
    ctx.fill();
    ctx.strokeStyle = 'rgba(169,233,255,.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-base * 0.74, 0);
    ctx.lineTo(base * 0.74, 0);
    ctx.moveTo(0, -base * 0.74);
    ctx.lineTo(0, base * 0.74);
    ctx.strokeStyle = 'rgba(245,243,234,.22)';
    ctx.lineWidth = 1;
    ctx.stroke();

    var pointer = rotation * 2.1 - 0.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(pointer) * base * 0.58, Math.sin(pointer) * base * 0.58);
    ctx.lineTo(Math.cos(pointer) * base * 1.08, Math.sin(pointer) * base * 1.08);
    ctx.strokeStyle = 'rgba(245,243,234,.62)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(Math.cos(pointer) * base * 0.72, Math.sin(pointer) * base * 0.72, Math.max(2, base * 0.021), 0, TAU);
    ctx.fillStyle = rgba(accentBright, 0.95);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(245,243,234,.92)';
    ctx.font = '900 ' + Math.round(Math.max(12, base * 0.19)) + 'px "Arial Narrow", "Arial Black", sans-serif';
    ctx.fillText('402', 0, -base * 0.04);
    ctx.fillStyle = 'rgba(169,233,255,.72)';
    ctx.font = '700 ' + Math.round(Math.max(6, base * 0.052)) + 'px "Arial Narrow", Arial, sans-serif';
    ctx.fillText('AERODYNE / VX', 0, base * 0.19);

    if (pulse > 0.035) {
      ctx.beginPath();
      ctx.arc(0, 0, base * (1.3 + pulse * 0.35), 0, TAU);
      ctx.strokeStyle = rgba(accentBright, pulse * 0.44);
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, 0, base * (1.42 + pulse * 0.16), -0.85, 0.35);
    ctx.strokeStyle = 'rgba(245,243,234,.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawKineticBars(pulse) {
    var narrow = width < 760;
    var startX = width * (narrow ? 0.62 : 0.76);
    var startY = height * (narrow ? 0.655 : 0.585);
    var length = Math.min(width * 0.21, 280) * (0.72 + pulse * 0.4);
    ctx.save();
    ctx.fillStyle = rgba(accentMain, 0.94);
    fillSkewBar(ctx, startX, startY, length, 7, -13);
    ctx.fillStyle = 'rgba(245,243,234,.88)';
    fillSkewBar(ctx, startX + length * 0.16, startY + 18, length * 0.52, 3.5, -7);
    ctx.fillStyle = 'rgba(169,233,255,.7)';
    fillSkewBar(ctx, startX + length * 0.34, startY + 29, length * 0.25, 2, -4);

    ctx.fillStyle = 'rgba(245,243,234,.6)';
    for (var block = 0; block < 5; block += 1) {
      ctx.fillRect(width - 34 - block * 9, height * 0.47 + block * 15, block % 2 === 0 ? 12 : 5, 3);
    }

    ctx.strokeStyle = 'rgba(169,233,255,.46)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(startX - 20, startY + 43);
    ctx.lineTo(startX + length * 0.82, startY + 43);
    ctx.stroke();

    var markerX = startX + length * 0.92;
    ctx.fillStyle = rgba(accentMain, 0.9);
    ctx.beginPath();
    ctx.moveTo(markerX, startY - 20);
    ctx.lineTo(markerX + 18, startY - 11);
    ctx.lineTo(markerX, startY - 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawWave(now, pulse) {
    var narrow = width < 760;
    var margin = narrow ? 24 : 48;
    var baseline = height * (narrow ? 0.78 : 0.755);
    var usable = Math.max(40, width - margin * 2);
    var amplitude = Math.max(3, height * 0.012) + state.live.bass * height * 0.035 + state.live.mid * height * 0.012 + pulse * height * 0.018;
    if (state.rm) amplitude *= 0.4;
    var seconds = now / 1000;
    var waveRate = 1.55 + state.live.treble * 1.8;
    var channel, point, pointX, pointY, envelope, harmonic;
    for (channel = 0; channel < 2; channel += 1) {
      ctx.beginPath();
      for (point = 0; point <= 104; point += 1) {
        pointX = margin + usable * point / 104;
        envelope = Math.sin(Math.PI * point / 104);
        harmonic = Math.sin(point * 0.42 + seconds * 2.2 + channel * 1.4) * 0.56 + Math.sin(point * 0.13 - seconds * waveRate) * 0.44;
        pointY = baseline + channel * 11 + harmonic * envelope * amplitude;
        if (point === 0) ctx.moveTo(pointX, pointY);
        else ctx.lineTo(pointX, pointY);
      }
      ctx.strokeStyle = channel === 0 ? 'rgba(169,233,255,.42)' : rgba(accentMain, 0.42);
      ctx.lineWidth = channel === 0 ? 1.3 : 1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(margin, baseline);
    ctx.lineTo(margin + usable, baseline);
    ctx.strokeStyle = 'rgba(245,243,234,.11)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function draw(now) {
    if (!ctx) return;
    var safeWidth = isFinite(width) && width > 0 ? width : 1440;
    var safeHeight = isFinite(height) && height > 0 ? height : 900;
    if (safeWidth !== width) width = safeWidth;
    if (safeHeight !== height) height = safeHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (isDrawableCanvas(backdrop)) {
      ctx.drawImage(backdrop, 0, 0, backdrop.width, backdrop.height, 0, 0, width, height);
    } else {
      ctx.fillStyle = '#08090b';
      ctx.fillRect(0, 0, width, height);
    }
    var seconds = now / 1000;
    var pulse = getPulse(now);
    drawRingField(pulse, seconds);
    drawKineticBars(pulse);
    drawWave(now, pulse);
  }

  function loop(now) {
    state.frames += 1;
    var began = performance.now();
    try { draw(now); }
    catch (error) { reportError(error); }
    state.js = performance.now() - began;
    if (state.js > 30) reportError(new Error('Frame budget exceeded: ' + state.js.toFixed(1) + 'ms'));
    requestAnimationFrame(loop);
  }

  function handleMessage(event) {
    var data = event.data;
    if (!data || data.__c100 !== 1) return;
    try {
      if (data.type === 'init') onInit(data.payload || {});
      else if (data.type === 'tick') onTick(data.payload || {});
      else if (data.type === 'beat') onBeat(data.payload || {});
      else if (data.type === 'live') onLive(data.payload || {});
    } catch (error) {
      reportError(error);
    }
  }

  function onMotionPreference(event) {
    state.rm = !!(event && event.matches);
  }

  function bindStage() {
    rootEl = document.getElementById('stage');
    canvasEl = document.getElementById('paint');
    lyricEl = document.getElementById('lyric');
    emptyEl = document.getElementById('empty');
    eyebrowEl = document.getElementById('eyebrow');
    nameEl = document.getElementById('songName');
    artistEl = document.getElementById('songArtist');
    stampEl = document.getElementById('stamp');
    clockEl = document.getElementById('clock');
    bpmEl = document.getElementById('bpmLabel');
    progressEl = document.getElementById('progress');
    var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    state.rm = !!(motionQuery && motionQuery.matches);
    if (motionQuery) {
      if (motionQuery.addEventListener) motionQuery.addEventListener('change', onMotionPreference);
      else if (motionQuery.addListener) motionQuery.addListener(onMotionPreference);
    }
    window.addEventListener('resize', queueResize, { passive: true });
    window.addEventListener('message', handleMessage);
    window.addEventListener('error', function (event) { reportError(event && (event.error || event.message)); });
    window.addEventListener('unhandledrejection', function (event) { reportError(event && event.reason); });
    setAccent(null);
    updateHud();
    if (!canvasEl) throw new Error('Canvas element missing');
    ctx = canvasEl.getContext('2d', { alpha: false });
    if (!ctx) throw new Error('Canvas 2D context unavailable');
  }

  function boot() {
    resize();
    updateHud();
    renderLyric(true);
  }

  requestAnimationFrame(function firstFrame() {
    sendReady();
    try { boot(); } catch (error) { reportError(error); }
    try { draw(performance.now()); } catch (error) { reportError(error); }
    requestAnimationFrame(loop);
  });
  setTimeout(sendReady, 950);
  try { bindStage(); } catch (error) { reportError(error); }
})();
</script>
</body>
</html>
