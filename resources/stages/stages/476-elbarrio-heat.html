<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>476 · Fire Wanted</title>
<style>
  :root{
    --ink:#191008; --paper:#f3e3c6; --flame:#e2531c; --hot:#c9350b;
    --acc:#e2531c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e8d5b6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  #stageRoot{position:fixed;inset:0;overflow:hidden;isolation:isolate;
    background:radial-gradient(120% 90% at 50% 18%,#f7e9cf 0%,#efdcba 55%,#e2caa6 100%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:1}
  #fx{z-index:2;pointer-events:none}

  #meta{position:absolute;z-index:4;left:6vw;top:max(4.5vh,18px);max-width:44vw;
    color:var(--ink);pointer-events:none}
  #meta .kicker{display:flex;align-items:center;gap:.55em;font-size:clamp(9px,1.05vw,13px);
    letter-spacing:.42em;font-weight:800;text-transform:uppercase;color:var(--acc);
    margin-bottom:.65em}
  #meta .kicker i{width:1.9em;height:3px;background:var(--acc);display:block;flex:none}
  #meta .name{font-size:clamp(15px,2.1vw,30px);font-weight:900;line-height:1.12;
    letter-spacing:-.01em;text-shadow:2px 2px 0 rgba(243,227,198,.95)}
  #meta .arts{margin-top:.4em;font-size:clamp(10px,1.2vw,15px);font-weight:700;
    letter-spacing:.14em;color:rgba(25,16,8,.66);text-transform:uppercase}

  #stamp{position:absolute;z-index:4;right:6vw;top:max(4.5vh,18px);
    transform:rotate(7deg);padding:.55em .8em;border:2.5px solid var(--acc);
    box-shadow:3px 3px 0 rgba(25,16,8,.85);color:var(--acc);text-align:center;
    font-weight:900;letter-spacing:.22em;font-size:clamp(8px,.95vw,11px);
    line-height:1.5;pointer-events:none;background:rgba(247,233,207,.55)}

  /* ---- lettering panel ---- */
  #plate{position:absolute;z-index:3;left:6vw;right:6vw;bottom:7vh;
    max-width:1080px;margin:0 auto;
    background:var(--paper);
    border:2.5px solid var(--ink);
    box-shadow:11px 11px 0 rgba(25,16,8,.9);
    padding:clamp(13px,2vh,22px) clamp(15px,2.4vw,32px) clamp(15px,2.4vh,26px);
    transform:rotate(-1.1deg);
    transition:opacity .35s linear}
  #plate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background:var(--acc)}
  #tag{position:absolute;top:-11px;left:clamp(15px,2.4vw,32px);
    background:var(--ink);color:var(--paper);font-size:clamp(8px,.95vw,11px);
    font-weight:900;letter-spacing:.3em;padding:3px 9px 3px 11px;transform:rotate(1.4deg)}
  #prev,#cur,#next{display:block;overflow:hidden;white-space:pre-wrap;word-break:break-word;
    overflow-wrap:anywhere;transform-origin:0 50%}
  #prev{font-size:clamp(11px,1.45vw,18px);font-weight:800;color:rgba(25,16,8,.34);
    line-height:1.3;max-height:2.7em;margin-bottom:.42em;letter-spacing:.02em}
  #cur{font-size:clamp(25px,4.35vw,58px);font-weight:900;line-height:1.14;
    max-height:2.35em;letter-spacing:.005em;color:var(--ink)}
  #next{font-size:clamp(11px,1.45vw,18px);font-weight:800;color:rgba(25,16,8,.3);
    line-height:1.3;max-height:2.7em;margin-top:.55em;letter-spacing:.02em}
  .ch{color:rgba(25,16,8,.4);transition:color .16s linear}
  .ch.hit{color:var(--ink)}
  .ch.now{color:var(--hot)}
  #cur.only .ch{color:var(--ink)}
  #cur.q{color:rgba(25,16,8,.5);font-size:clamp(15px,2vw,24px);letter-spacing:.22em;font-weight:800}
  #plate.idle{opacity:.62}

  @media (max-aspect-ratio:3/4){
    #plate{left:5vw;right:5vw;bottom:6vh;transform:rotate(-.7deg)}
    #meta{max-width:62vw}
    #stamp{display:none}
    #cur{font-size:clamp(24px,7.4vw,44px)}
    #prev,#next{font-size:clamp(11px,3vw,16px)}
  }
</style>
</head>
<body>
<div id="stageRoot">
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>
  <div id="meta">
    <div class="kicker"><i></i><span>EL BARRIO · N.Y.</span></div>
    <div class="name" id="songName">—</div>
    <div class="arts" id="songArts"></div>
  </div>
  <div id="stamp">FANIA<br>★ 1974 ★<br>SALSA</div>
  <div id="plate">
    <div id="tag">LETRA</div>
    <span id="prev"></span>
    <span id="cur"></span>
    <span id="next"></span>
  </div>
</div>
<script>
/* ---------- live state (outermost, read by __stage) ---------- */
window.__stageLive = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
  err: '', reduced: false, ready: false
};

window.__stage = function(){
  var L = window.__stageLive;
  var i = L.idx | 0;
  var txt = (i >= 0 && L.lines[i]) ? (L.lines[i].text || '') : '';
  return {
    lines: L.lines.length,
    idx: i,
    t: Math.round(L.t * 1000) / 1000,
    playing: !!L.playing,
    frames: L.frames,
    js: Math.round(L.js * 100) / 100,
    err: L.err || '',
    text: txt,
    gl: false,
    rm: !!L.reduced
  };
};

(function(){
  'use strict';

  var S = window.__stageLive;
  S.lines = [];
  S.idx = -1;

  var root  = document.getElementById('stageRoot');
  var bg    = document.getElementById('bg');
  var fx    = document.getElementById('fx');
  var fx2   = fx.getContext('2d');
  var bg2   = bg.getContext('2d');
  var plate = document.getElementById('plate');
  var prevE = document.getElementById('prev');
  var curE  = document.getElementById('cur');
  var nextE = document.getElementById('next');
  var nameE = document.getElementById('songName');
  var artsE = document.getElementById('songArts');

  var geo = { W: 1440, H: 900, dpr: 1, cx: 720, cy: 306, r: 270 };
  var acc = [226, 83, 28];
  var rayA = 0.25, beat = 0, lvl = 0, bass = 0;
  var glowCv = null, halftone = null;
  var needPoster = true;

  function num(v, d){ v = Number(v); return isFinite(v) ? v : d; }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function mix(a, b, w){
    return [ Math.round(a[0] + (b[0]-a[0])*w), Math.round(a[1] + (b[1]-a[1])*w), Math.round(a[2] + (b[2]-a[2])*w) ];
  }
  function rgb(a, al){ return 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + (al === undefined ? 1 : al) + ')'; }

  /* ---------- sizing ---------- */
  function measure(){
    var w = root.clientWidth || 0, h = root.clientHeight || 0;
    if(!(w > 0) || !(h > 0)){ w = 1440; h = 900; }
    w = Math.max(240, w); h = Math.max(240, h);
    geo.W = w; geo.H = h;
    geo.dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    var dpi = geo.dpr;
    bg.width  = Math.round(w * dpi); bg.height  = Math.round(h * dpi);
    fx.width  = Math.round(w * dpi); fx.height = Math.round(h * dpi);

    var base = Math.min(w, h);
    geo.cx = w * 0.5;
    geo.cy = h * 0.33;
    geo.r  = Math.max(56, base * (w < h ? 0.36 : 0.305));
    buildGlow();
    needPoster = true;
  }

  /* ---------- offscreen sprites ---------- */
  function buildGlow(){
    var s = 256;
    glowCv = document.createElement('canvas');
    glowCv.width = glowCv.height = s;
    var g = glowCv.getContext('2d');
    var grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    grd.addColorStop(0, 'rgba(255,236,198,.55)');
    grd.addColorStop(0.42, 'rgba(242,161,31,.20)');
    grd.addColorStop(1, 'rgba(242,161,31,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
  }

  function buildHalftone(){
    var t = 7, cv = document.createElement('canvas');
    cv.width = cv.height = t * 2;
    var g = cv.getContext('2d');
    g.fillStyle = rgb(acc, 0.5);
    g.beginPath(); g.arc(t * 0.5, t * 0.5, 1.15, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(t * 1.5, t * 1.5, 1.15, 0, 6.2832); g.fill();
    halftone = bg2.createPattern(cv, 'repeat');
  }

  /* ---------- static poster ---------- */
  function drawPoster(){
    var c = bg2, W = geo.W, H = geo.H, dpi = geo.dpr;
    c.setTransform(dpi, 0, 0, dpi, 0, 0);
    c.clearRect(0, 0, W, H);

    /* paper base */
    c.fillStyle = '#f0ddbe';
    c.fillRect(0, 0, W, H);

    /* mottling / aged fibre */
    var seed = 4761;
    function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    var i, x, y, rr, g;
    for(i = 0; i < 46; i++){
      x = rnd() * W; y = rnd() * H; rr = 40 + rnd() * (Math.min(W, H) * 0.35);
      g = c.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, 'rgba(198,164,118,' + (0.035 + rnd() * 0.05).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(198,164,118,0)');
      c.fillStyle = g;
      c.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }

    /* halftone screen */
    if(halftone){
      c.globalAlpha = 0.5;
      c.fillStyle = halftone;
      c.fillRect(0, 0, W, H);
      c.globalAlpha = 1;
    }

    /* registration offset block behind the sun */
    var cx = geo.cx, cy = geo.cy, r = geo.r;
    c.save();
    c.globalAlpha = 0.55;
    c.fillStyle = 'rgba(43,111,113,.55)';
    c.beginPath(); c.arc(cx - 7, cy + 6, r, 0, 6.2832); c.fill();
    c.restore();

    /* the sun / vinyl disc */
    g = c.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.05, cx, cy, r);
    var hot = mix(acc, [226, 83, 28], 0.5);
    var hotIn = mix(hot, [255, 226, 150], 0.62);
    var hotOut = mix(hot, [120, 26, 6], 0.42);
    g.addColorStop(0, rgb(hotIn, 1));
    g.addColorStop(0.55, rgb(hot, 1));
    g.addColorStop(1, rgb(hotOut, 1));
    c.fillStyle = g;
    c.beginPath(); c.arc(cx, cy, r, 0, 6.2832); c.fill();

    /* inner groove rings (vinyl nod) */
    c.save();
    c.strokeStyle = 'rgba(25,16,8,.16)';
    c.lineWidth = 1.2;
    for(i = 1; i <= 4; i++){
      c.beginPath(); c.arc(cx, cy, r * (0.28 + i * 0.14), 0, 6.2832); c.stroke();
    }
    c.restore();

    /* ink rim */
    c.strokeStyle = 'rgba(25,16,8,.92)';
    c.lineWidth = Math.max(2, r * 0.016);
    c.beginPath(); c.arc(cx, cy, r, 0, 6.2832); c.stroke();

    /* label centre */
    c.fillStyle = '#f3e3c6';
    c.beginPath(); c.arc(cx, cy, r * 0.115, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(25,16,8,.9)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(cx, cy, r * 0.115, 0, 6.2832); c.stroke();
    c.fillStyle = 'rgba(25,16,8,.9)';
    c.beginPath(); c.arc(cx, cy, r * 0.032, 0, 6.2832); c.fill();

    /* two ink rules running off the top edge */
    var rw = Math.max(2, H * 0.004);
    c.fillStyle = 'rgba(25,16,8,.86)';
    c.fillRect(0, H * 0.085, W, rw);
    c.fillRect(0, H * 0.085 + rw * 3.2, W, rw * 0.9);

    /* corner blocks, screen-print crop marks */
    c.fillStyle = 'rgba(25,16,8,.9)';
    var cm = Math.min(W, H) * 0.026;
    c.fillRect(0, 0, W, cm * 0.42);
    c.fillRect(0, H - cm * 0.42, W, cm * 0.42);

    /* accent wedge bottom-left, poster furniture */
    c.save();
    c.globalAlpha = 0.9;
    c.fillStyle = rgb(acc, 0.85);
    c.translate(0, H * 0.62);
    c.rotate(-0.36);
    c.fillRect(-W * 0.2, 0, W * 0.42, H * 0.035);
    c.restore();
  }

  /* ---------- dynamic layer ---------- */
  var RAYS = 16;
  function drawFx(){
    var c = fx2, W = geo.W, H = geo.H, dpi = geo.dpr;
    var cx = geo.cx, cy = geo.cy, r = geo.r;
    c.setTransform(dpi, 0, 0, dpi, 0, 0);
    c.clearRect(0, 0, W, H);

    /* rotating sunburst annulus (never covers the disc face) */
    var outer = r * (2.05 + beat * 0.14);
    var step = 6.2832 / RAYS;
    c.fillStyle = 'rgba(243,227,198,.72)';
    for(var i = 0; i < RAYS; i += 2){
      var a0 = rayA + i * step, a1 = a0 + step - 0.045;
      c.beginPath();
      c.arc(cx, cy, outer, a0, a1);
      c.arc(cx, cy, r + 1, a1, a0, true);
      c.closePath();
      c.fill();
    }

    /* glow breathing with bass */
    if(glowCv){
      var gs = r * 4.6;
      c.globalAlpha = clamp(0.14 + bass * 0.34 + beat * 0.16, 0, 0.62);
      c.drawImage(glowCv, cx - gs / 2, cy - gs / 2, gs, gs);
      c.globalAlpha = 1;
    }

    /* beat ring */
    if(beat > 0.02){
      c.strokeStyle = 'rgba(201,53,11,' + (beat * 0.42).toFixed(3) + ')';
      c.lineWidth = Math.max(1.5, r * 0.02 * beat);
      c.beginPath(); c.arc(cx, cy, r + (1 - beat) * r * 0.55, 0, 6.2832); c.stroke();
    }
  }

  /* ---------- lyrics model ---------- */
  function buildLine(raw){
    var txt = (raw && typeof raw.text === 'string') ? raw.text : '';
    var t0 = num(raw && raw.t, 0);
    var dur = num(raw && raw.dur, 0);
    if(!(dur > 0)) dur = 3.4;
    var n = txt.length;
    var ct = new Array(n);
    var ch = raw && raw.chars;
    var i, v;
    if(Object.prototype.toString.call(ch) === '[object Array]' && ch.length){
      for(i = 0; i < n; i++){
        v = null;
        if(i < ch.length && ch[i] && typeof ch[i].t === 'number' && isFinite(ch[i].t)) v = ch[i].t;
        else if(i < ch.length && ch[i] && typeof ch[i].t === 'string' && isFinite(parseFloat(ch[i].t))) v = parseFloat(ch[i].t);
        if(v === null || v < t0) v = t0 + dur * (i / Math.max(1, n));
        ct[i] = v;
      }
    } else {
      for(i = 0; i < n; i++) ct[i] = t0 + dur * (i / Math.max(1, n));
    }
    return { t0: t0, dur: dur, txt: txt, ct: ct };
  }

  function pickIdx(t){
    var L = S.lines, n = L.length, k = -1;
    for(var i = 0; i < n; i++){
      if(t + 0.09 >= L[i].t0) k = i;
    }
    return k;
  }

  function fit(el){
    el.style.fontSize = '';
    var guard = 0, fs;
    while(guard++ < 8 && el.scrollHeight > el.clientHeight + 2 && el.clientHeight > 0){
      fs = parseFloat(window.getComputedStyle(el).fontSize) || 32;
      el.style.fontSize = (fs * 0.88).toFixed(1) + 'px';
    }
  }

  function paintCur(txt){
    curE.textContent = '';
    curE._s = null; curE._lit = 0; curE._now = -1;
    var n = txt.length, i, sp, frag = document.createDocumentFragment(), arr = [];
    if(n === 0){
      curE.className = 'q';
      curE.textContent = '· · ·';
      return;
    }
    curE.className = '';
    for(i = 0; i < n; i++){
      var ch = txt.charAt(i);
      if(ch === '\n'){ frag.appendChild(document.createElement('br')); continue; }
      sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = ch;
      frag.appendChild(sp);
      arr.push(sp);
    }
    curE.appendChild(frag);
    curE._s = arr;
    fit(curE);
  }

  function updateSlots(){
    var L = S.lines, i = S.idx;
    if(!L.length){
      prevE.textContent = '';
      nextE.textContent = '';
      curE.className = 'q';
      curE.textContent = '仅器乐 · SÓLO RITMO';
      curE._s = null;
      return;
    }
    prevE.textContent = i > 0 && L[i-1] ? (L[i-1].text || '') : '';
    nextE.textContent = (i + 1 < L.length && L[i+1]) ? (L[i+1].text || '') : '';
    paintCur(i >= 0 && L[i] ? (L[i].text || '') : '');
  }

  function lightChars(){
    var el = curE, spans = el._s, L = S.lines[S.idx];
    if(!spans || !L) return;
    var t = S.t, n = spans.length, lit = el._lit || 0, i, c = 0;
    for(i = 0; i < n; i++){
      var ct = L.ct[i];
      if(ct !== undefined && t >= ct - 0.02) c = i + 1; else break;
    }
    if(c > lit){ for(i = lit; i < c; i++) spans[i].className = 'ch hit'; }
    else if(c < lit){ for(i = c; i < lit; i++) spans[i].className = 'ch'; }
    if(el._now >= 0 && spans[el._now] && el._now !== c - 1) spans[el._now].className = 'ch hit';
    if(c > 0){ spans[c-1].className = 'ch hit now'; }
    el._now = c - 1;
    el._lit = c;
  }

  /* ---------- meta ---------- */
  function setMeta(p){
    var song = p.song || {};
    var nm = (typeof song.name === 'string' && song.name.trim()) ? song.name.trim() : '无题';
    var ar = song.artists;
    if(Object.prototype.toString.call(ar) === '[object Array]') ar = ar.filter(function(x){ return x; }).join(' · ');
    else if(typeof ar !== 'string') ar = '';
    nameE.textContent = nm;
    artsE.textContent = ar || '';
  }

  /* ---------- main loop ---------- */
  function postReady(){
    try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }
    catch(e){ console.error('[476] ready post failed', e); }
  }

  function frame(){
    var t0 = performance.now();
    S.frames++;

    if(needPoster){ needPoster = false; try{ drawPoster(); }catch(e){ console.error(e); } }

    if(!S.reduced){ rayA += 0.0016 + beat * 0.0065; }
    beat *= 0.93;
    if(beat < 0.001) beat = 0;

    var idx = pickIdx(S.t);
    if(idx !== S.idx){ S.idx = idx; updateSlots(); }
    if(S.idx >= 0) lightChars();

    drawFx();

    if(!S.ready){
      S.ready = true;
      postReady();
    }
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function(){
    try{ measure(); }catch(e){ console.error(e); S.err = String(e && e.message || e); }
  }, { passive: true });

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || d.__c100 !== 1) return;
    try{
      if(d.type === 'init'){
        var p = d.payload || {};
        if(Object.prototype.toString.call(p.accent) === '[object Array]' && p.accent.length === 3){
          acc = [ clamp(Math.round(num(p.accent[0], 226)), 0, 255),
                  clamp(Math.round(num(p.accent[1], 83)), 0, 255),
                  clamp(Math.round(num(p.accent[2], 28)), 0, 255) ];
        }
        root.style.setProperty('--acc', rgb(acc, 1));
        buildHalftone();
        needPoster = true;

        var raw = Object.prototype.toString.call(p.lines) === '[object Array]' ? p.lines : [];
        S.lines = [];
        for(var i = 0; i < raw.length; i++) S.lines.push(buildLine(raw[i]));
        S.idx = -2;                 /* force slot rebuild */
        S.t = num(p.duration, 0) > 0 ? S.t : S.t;
        S.playing = (p.playing === undefined) ? true : !!p.playing;
        plate.classList.toggle('idle', false);
        setMeta(p);
        updateSlots();
      } else if(d.type === 'tick'){
        var q = d.payload || {};
        var tt = num(q.time, NaN);
        if(isFinite(tt)) S.t = tt;
        if(q.playing !== undefined){
          S.playing = !!q.playing;
          plate.classList.toggle('idle', !S.playing);
        }
      } else if(d.type === 'beat'){
        var b = d.payload || {};
        beat = Math.max(beat, clamp(num(b.level, 0.5), 0, 1));
      } else if(d.type === 'live'){
        var l = d.payload || {};
        lvl  = clamp(num(l.level, 0), 0, 1);
        bass = clamp(num(l.bass, 0), 0, 1);
        if(l.playing !== undefined){ S.playing = !!l.playing; plate.classList.toggle('idle', !S.playing); }
      }
    }catch(e){
      S.err = String(e && e.message || e);
      console.error('[476] message error', e);
    }
  });

  try{
    S.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }catch(e){ console.error(e); }

  try{
    measure();
    buildHalftone();
    updateSlots();
  }catch(e){
    S.err = String(e && e.message || e);
    console.error('[476] boot error', e);
  }

  requestAnimationFrame(frame);

  setTimeout(function(){
    if(!S.ready){
      S.ready = true;
      postReady();
    }
  }, 900);
})();
</script>
</body>
</html>
