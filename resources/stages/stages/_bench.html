<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head><body>
<canvas id="c" width="1440" height="810"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1440,H=810;
function bg(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#0a0c12';ctx.fillRect(0,0,W,H);}
const N=5200;
const sx=new Float32Array(N),sy=new Float32Array(N),sh=new Float32Array(N),sw=new Float32Array(N);
for(let i=0;i<N;i++){sx[i]=120+((i*37)%1200);sy[i]=200+((i*53)%300);sh[i]=10+((i*7)%26);sw[i]=1.0+((i*3)%10)/10;}
const N2=2600;
function bench(name,fn,iters){
  fn();fn();
  const t0=performance.now();
  for(let k=0;k<iters;k++){bg();fn();}
  const t=(performance.now()-t0)/iters;
  console.log(name.padEnd(46)+t.toFixed(2)+' ms');
  return t;
}
const out=[];
// A: 5 passes, rect+fill (current approach, full area)
out.push(bench('A 5趟 rect+fill 全量(5200针 身2档+尖3档)',()=>{
  for(let b=0;b<2;b++){ctx.fillStyle=b?'rgba(140,172,208,0.42)':'rgba(84,108,142,0.28)';ctx.beginPath();
    for(let i=0;i<N;i++){if((i&1)!==b)continue;ctx.rect(sx[i]-sw[i]*.5,sy[i]+4.5,sw[i],Math.max(.8,sh[i]-4.5));}ctx.fill();}
  for(let b=0;b<3;b++){ctx.fillStyle=b===2?'rgba(255,92,196,.9)':b===1?'rgba(238,247,255,.94)':'rgba(158,182,214,.5)';ctx.beginPath();
    for(let i=0;i<N;i++){if((i%3)!==b)continue;const w=3.2;ctx.rect(sx[i]-w/2,sy[i]-w/2,w,w);}ctx.fill();}
},8));
// B: fillRect per particle (same style kept)
out.push(bench('B fillRect 逐颗(2色) 全量',()=>{
  ctx.fillStyle='rgba(120,150,190,0.40)';
  for(let i=0;i<N;i++)ctx.fillRect(sx[i]-sw[i]*.5,sy[i]+4.5,sw[i],Math.max(.8,sh[i]-4.5));
  ctx.fillStyle='rgba(238,247,255,0.94)';
  for(let i=0;i<N;i++){const w=3.2;ctx.fillRect(sx[i]-w/2,sy[i]-w/2,w,w);}
},8));
// C: rect+fill but ONLY tips (5200 x 3px)
out.push(bench('C 只有针尖 5200x3.2px 1趟',()=>{
  ctx.fillStyle='rgba(238,247,255,0.94)';ctx.beginPath();
  for(let i=0;i<N;i++){const w=3.2;ctx.rect(sx[i]-w/2,sy[i]-w/2,w,w);}ctx.fill();
},8));
// D: shafts only, halved count
out.push(bench('D 针身 2600根(1.3x20)',()=>{
  ctx.fillStyle='rgba(110,140,180,0.36)';ctx.beginPath();
  for(let i=0;i<N2;i++){const j=i*2;ctx.rect(sx[j]-1.3,sy[j]+4,1.3*2,22);}ctx.fill();
},8));
// E: strokes instead of rects
out.push(bench('E stroke 针身 5200根 lineWidth1.3',()=>{
  ctx.strokeStyle='rgba(110,140,180,0.36)';ctx.lineWidth=1.3;ctx.lineCap='butt';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.moveTo(sx[i],sy[i]+4);ctx.lineTo(sx[i]+0.01,sy[i]+4+sh[i]);}ctx.stroke();
},8));
// F: tall thin triangle path per needle (2 moveTo+lineTo)  -- for tapered look
out.push(bench('F 锥形针 2600根 (3点三角)',()=>{
  ctx.fillStyle='rgba(110,140,180,0.36)';ctx.beginPath();
  for(let i=0;i<N2;i++){const j=i*2,x=sx[j],y=sy[j],w=1.6,h=24;
    ctx.moveTo(x-w,y+4);ctx.lineTo(x+w,y+4);ctx.lineTo(x,y+4-h);ctx.closePath();}ctx.fill();
},8));
// G: no-AA hint via imageSmoothing? measure 5200 rects of 3px with globalAlpha
out.push(bench('G 针尖 5200 用 globalAlpha',()=>{
  ctx.fillStyle='rgb(238,247,255)';ctx.globalAlpha=0.9;ctx.beginPath();
  for(let i=0;i<N;i++){const w=3.2;ctx.rect(sx[i]-w/2,sy[i]-w/2,w,w);}ctx.fill();ctx.globalAlpha=1;
},8));
// H: 5 passes, but rect count same as A with HALF the shaft height
out.push(bench('H 短针身(5200x1.3x12) + 针尖',()=>{
  ctx.fillStyle='rgba(110,140,180,0.36)';ctx.beginPath();
  for(let i=0;i<N;i++)ctx.rect(sx[i]-.65,sy[i]+3,1.3,12);ctx.fill();
  ctx.fillStyle='rgba(238,247,255,0.94)';ctx.beginPath();
  for(let i=0;i<N;i++){const w=3.2;ctx.rect(sx[i]-1.6,sy[i]-1.6,w,w);}ctx.fill();
},8));
window.__done=out;
</script></body></html>
