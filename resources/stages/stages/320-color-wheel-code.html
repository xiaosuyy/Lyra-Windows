<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>320</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0806;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0a0806}
  #plate{position:absolute;inset:-4%;transform-origin:54% 46%;
    background:radial-gradient(120% 100% at 38% 26%,#3a2718,#221609 54%,#120c07 100%)}
  #art{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 1s ease}
  .scrim{position:absolute;inset:0;z-index:2;background:
    linear-gradient(to top,rgba(9,6,4,.94) 0%,rgba(9,6,4,.78) 18%,rgba(9,6,4,.28) 44%,rgba(9,6,4,0) 68%),
    linear-gradient(to right,rgba(8,5,4,.48) 0%,rgba(8,5,4,.15) 26%,rgba(8,5,4,0) 50%)}
  #lyric{position:absolute;left:clamp(20px,5vw,88px);right:clamp(20px,5vw,88px);bottom:clamp(28px,7vh,80px);max-width:min(88vw,1040px);color:#f3e8d5;font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;z-index:3;isolation:isolate;pointer-events:none}
  #lyric::before{content:'';position:absolute;inset:-16% -20% -18% -16%;z-index:-1;pointer-events:none;
    background:radial-gradient(78% 104% at 16% 62%,rgba(6,4,3,.86),rgba(6,4,3,.5) 46%,rgba(6,4,3,0) 74%)}
  .line{font-size:clamp(20px,3.3vw,46px);line-height:1.34}
  .ghost{opacity:.22;font-size:clamp(14px,1.9vw,23px);margin:0 0 8px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  #lnext.ghost{margin:10px 0 0}

  /* ---------- cipher: the bauhaus colour-wheel code plate ---------- */
  #cipher{position:absolute;right:clamp(16px,3.4vw,54px);top:clamp(16px,3.4vw,54px);z-index:4;
    width:clamp(132px,21vmin,268px);height:clamp(132px,21vmin,268px);pointer-events:none;
    filter:drop-shadow(0 8px 26px rgba(0,0,0,.62));will-change:transform}
  #wheel{width:100%;height:100%;display:block;overflow:visible}
  #wheel .sec{stroke:rgba(8,5,4,.5);stroke-width:.55;opacity:.82;transition:opacity .16s linear}
  #wheel .sec.on{opacity:1}
  #wheel .lab{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:10.2px;
    fill:rgba(255,242,220,.4);text-anchor:middle;dominant-baseline:central;transition:fill .16s linear}
  #wheel .lab.on{fill:#fff6e6}
  #needle{transform-box:view-box;transform-origin:120px 120px;transition:transform .26s cubic-bezier(.2,.85,.28,1)}
  #wheel .ring{fill:none;stroke:rgba(255,240,214,.2);stroke-width:.7}
  #wheel .hub{fill:rgba(9,6,4,.66);stroke:rgba(255,240,214,.16);stroke-width:.7}
  #wheel .prog{fill:none;stroke:rgba(255,238,210,.6);stroke-width:1.1;opacity:.45}
  #hubTxt{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:8.6px;
    fill:rgba(255,244,226,.85);letter-spacing:.14em;text-anchor:middle;dominant-baseline:central}

  /* ---------- lyric typesetting ---------- */
  .stack{display:flex;flex-direction:column;align-items:stretch;width:100%}
  .folio{display:flex;align-items:center;gap:.9em;margin-bottom:.62em;
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:clamp(8px,.82vw,11px);
    letter-spacing:.36em;color:rgba(243,232,213,.42);opacity:0;transform:translateY(5px);
    transition:opacity .8s ease,transform .8s ease}
  .folio.on{opacity:1;transform:none}
  .folio:after{content:'';height:1px;width:clamp(26px,5vw,72px);
    background:linear-gradient(90deg,rgba(243,232,213,.32),rgba(243,232,213,0))}
  #lcur{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Songti SC","SimSun",serif;
    font-size:clamp(21px,3.5vw,50px);line-height:1.32;letter-spacing:.012em;
    color:#f8eedb;overflow-wrap:anywhere;font-kerning:normal;
    text-shadow:0 0 2px rgba(0,0,0,.9),0 2px 14px rgba(0,0,0,.85),0 8px 44px rgba(0,0,0,.7);
    transition:opacity .9s ease}
  #lcur.done{opacity:.6}
  @keyframes lineIn{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
  .ch{color:rgba(248,238,219,.3);transition:color .15s linear;white-space:pre-wrap}
  .ch.on{color:#f9efdd}
  .codebar{display:flex;align-items:flex-end;gap:4px;height:13px;margin-top:.78em;opacity:0;transition:opacity .5s}
  .codebar.on{opacity:.92}
  .codebar i{width:2px;height:9px;background:currentColor;opacity:.4;
    transition:opacity .15s linear,height .25s ease}
  .codebar i.on{opacity:1}
  .empty{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:.75em;opacity:0;transition:opacity 1.1s}
  .empty.on{opacity:1}
  .empty b{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-weight:400;
    font-size:clamp(9px,1vw,12px);letter-spacing:.4em;color:rgba(243,232,213,.5)}
  .empty span{font-size:clamp(13px,1.5vw,18px);color:rgba(243,232,213,.32);letter-spacing:.14em}

  /* ---------- entrance + motion policy ---------- */
  @keyframes rise{from{opacity:0}to{opacity:1}}
  #stage{animation:rise 1.15s ease both}
  @media (max-width:700px){
    #cipher{right:13px;top:13px;width:clamp(112px,26vw,168px);height:clamp(112px,26vw,168px)}
    #lprev,#lnext{font-size:13px}
    .codebar{gap:3px}
  }
  @media (prefers-reduced-motion: reduce){
    #sweep{animation:none;opacity:.5}
    #stage{animation:none}
    #needle{transition:none}
  }

  /* ---------- surface: varnish, canvas weave, craquelure, film grain ---------- */
  .veil{position:absolute;inset:0;pointer-events:none;z-index:2}
  #vignette{background:radial-gradient(118% 92% at 54% 40%,rgba(0,0,0,0) 34%,rgba(7,5,3,.5) 74%,rgba(5,3,2,.9) 100%)}
  #weave{opacity:.07;mix-blend-mode:overlay;
    background-image:repeating-linear-gradient(0deg,rgba(255,238,210,.55) 0 1px,transparent 1px 4px),
                     repeating-linear-gradient(90deg,rgba(255,238,210,.45) 0 1px,transparent 1px 4px)}
  #crackle{opacity:.46;mix-blend-mode:multiply;background-repeat:repeat}
  #grain{opacity:.08;mix-blend-mode:overlay;background-repeat:repeat;background-size:220px 220px;image-rendering:pixelated}
  #sweep{position:absolute;inset:-26%;pointer-events:none;z-index:2;mix-blend-mode:soft-light;
    background:radial-gradient(38% 46% at 50% 50%,rgba(255,216,158,.55),rgba(255,216,158,0) 68%);
    animation:sweep 46s ease-in-out infinite alternate}
  @keyframes sweep{from{transform:translate3d(-16%,-10%,0) rotate(-6deg)}to{transform:translate3d(18%,12%,0) rotate(7deg)}}

  /* ---------- printing register: hairline grid, crop marks, rim ---------- */
  #grid{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.85;
    background-image:repeating-linear-gradient(90deg,rgba(255,242,220,.055) 0 1px,transparent 1px calc(100%/12)),
                     repeating-linear-gradient(0deg,rgba(255,242,220,.04) 0 1px,transparent 1px calc(100%/12))}
  #rim{position:absolute;inset:clamp(9px,1.5vw,20px);pointer-events:none;z-index:2;
    border:1px solid rgba(216,180,118,.16);box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),inset 0 0 60px rgba(0,0,0,.35)}
  .cm{position:absolute;width:clamp(15px,2vw,26px);height:clamp(15px,2vw,26px);pointer-events:none;z-index:2;
    border:0 solid rgba(255,240,214,.34)}
  .cm.tl{left:clamp(16px,2.4vw,34px);top:clamp(16px,2.4vw,34px);border-left-width:1px;border-top-width:1px}
  .cm.tr{right:clamp(16px,2.4vw,34px);top:clamp(16px,2.4vw,34px);border-right-width:1px;border-top-width:1px}
  .cm.bl{left:clamp(16px,2.4vw,34px);bottom:clamp(16px,2.4vw,34px);border-left-width:1px;border-bottom-width:1px}
  .cm.br{right:clamp(16px,2.4vw,34px);bottom:clamp(16px,2.4vw,34px);border-right-width:1px;border-bottom-width:1px}
</style>
</head>
<body>
<div id="stage">
  <div id="plate"><img id="art" src="assets/320-painting.jpg" alt=""></div>
  <div class="veil" id="weave"></div>
  <div class="veil" id="crackle"></div>
  <div class="scrim"></div>
  <div class="veil" id="vignette"></div>
  <div class="veil" id="sweep"></div>
  <div class="veil" id="grid"></div>
  <div class="veil" id="grain"></div>
  <div id="rim"></div>
  <i class="cm tl"></i><i class="cm tr"></i><i class="cm bl"></i><i class="cm br"></i>

  <div id="cipher"><svg id="wheel" viewBox="0 0 240 240" aria-hidden="true"></svg></div>

  <main id="lyric">
    <div class="stack" id="stack">
      <div class="line ghost" id="lprev"></div>
      <div class="folio" id="folio"></div>
      <div class="line cur" id="lcur"></div>
      <div class="codebar" id="codebar"></div>
      <div class="line ghost" id="lnext"></div>
    </div>
    <div class="empty" id="empty"><b>NO LYRICS ON THIS PLATE</b><span>此面留白</span></div>
  </main>
</div>
<script>
(function(){
  'use strict';
  var S={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',text:'',reduced:false};
  var $=function(id){return document.getElementById(id);};
  var elPrev=$('lprev'),elCur=$('lcur'),elNext=$('lnext');
  var plate=$('plate');

  /* ---------- procedural surface: craquelure + film grain + weave ---------- */
  function makeCrackle(size){
    var c=document.createElement('canvas'); c.width=c.height=size;
    var g=c.getContext('2d'); g.lineCap='round';
    for(var k=0;k<190;k++){
      var x=Math.random()*size, y=Math.random()*size;
      var a=Math.random()*Math.PI*2, len=5+Math.random()*26;
      var steps=2+(Math.random()*4|0);
      g.beginPath(); g.moveTo(x,y);
      for(var s=0;s<steps;s++){ a+=(Math.random()-.5)*1.2; x+=Math.cos(a)*len; y+=Math.sin(a)*len; g.lineTo(x,y); }
      g.strokeStyle='rgba(26,16,9,'+(0.14+Math.random()*0.26).toFixed(3)+')'; g.lineWidth=.8; g.stroke();
      g.save(); g.translate(.9,.9); g.strokeStyle='rgba(255,236,204,'+(0.04+Math.random()*0.1).toFixed(3)+')'; g.stroke(); g.restore();
    }
    return c.toDataURL('image/png');
  }
  function makeGrain(size){
    var c=document.createElement('canvas'); c.width=c.height=size;
    var g=c.getContext('2d'), d=g.createImageData(size,size), p=d.data;
    for(var i=0;i<p.length;i+=4){ var v=Math.random()*255|0; p[i]=p[i+1]=p[i+2]=v; p[i+3]=255; }
    g.putImageData(d,0,0); return c.toDataURL('image/png');
  }
  var grainTiles=[], grainI=0, grainEl=$('grain');
  function buildSurface(){
    try{
      var cr=$('crackle'); cr.style.backgroundImage='url('+makeCrackle(560)+')'; cr.style.backgroundSize='640px 640px';
      for(var i=0;i<4;i++) grainTiles.push(makeGrain(128));
      grainEl.style.backgroundImage='url('+grainTiles[0]+')';
    }catch(e){ S.err=String(e&&e.message||e); }
  }
  function grainLoop(){
    if(S.reduced||!grainTiles.length) return;
    grainI=(grainI+1)%grainTiles.length;
    grainEl.style.backgroundImage='url('+grainTiles[grainI]+')';
    grainEl.style.backgroundPosition=((Math.random()*220)|0)+'px '+((Math.random()*220)|0)+'px';
  }
  setInterval(grainLoop,220);

  var readySent=false;
  function sendReady(){
    if(readySent) return; readySent=true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){}
  }

  function pickIdx(t){
    var L=S.lines,i,lo=0,hi=L.length-1,res=-1;
    while(lo<=hi){ i=(lo+hi)>>1; if(L[i].t<=t){res=i;lo=i+1;}else{hi=i-1;} }
    return res;
  }

  var txt=function(o){ return (o&&typeof o.text==='string')?o.text:''; };

  /* ---------- the code itself: 24 sectors, A–X, hue = sector ---------- */
  var ALPHA='ABCDEFGHIJKLMNOPQRSTUVWX';
  var secEls=[],labEls=[],needle=null,hubTxt=null,progEl=null,hubEl=null,activeSec=-2,lastProg=-1;

  function sectorOf(ch){
    if(!ch) return 0;
    var c=ch.charCodeAt(0);
    if(c>=65&&c<=88) return c-65;
    if(c>=97&&c<=120) return c-97;
    var h=Math.imul(c^0x9e37,2654435761)>>>0;
    return (h>>>4)%24;
  }
  var secColor=function(i,s,l){ return 'hsl('+(i*15)+','+(s||66)+'%,'+(l||52)+'%)'; };

  function buildWheel(){
    var svg=$('wheel'); if(!svg) return;
    var cx=120,cy=120,r0=60,r1=92,gap=1.0,i,out=[];
    for(i=0;i<24;i++){
      var a0=(i*15-97.5+gap/2)*Math.PI/180, a1=(i*15-82.5-gap/2)*Math.PI/180;
      var d='M'+(cx+r1*Math.cos(a0)).toFixed(2)+' '+(cy+r1*Math.sin(a0)).toFixed(2)+
        'A'+r1+' '+r1+' 0 0 1 '+(cx+r1*Math.cos(a1)).toFixed(2)+' '+(cy+r1*Math.sin(a1)).toFixed(2)+
        'L'+(cx+r0*Math.cos(a1)).toFixed(2)+' '+(cy+r0*Math.sin(a1)).toFixed(2)+
        'A'+r0+' '+r0+' 0 0 0 '+(cx+r0*Math.cos(a0)).toFixed(2)+' '+(cy+r0*Math.sin(a0)).toFixed(2)+'Z';
      out.push('<path class="sec" fill="'+secColor(i,66,50)+'" d="'+d+'"/>');
    }
    for(i=0;i<24;i++){
      var am=(i*15-90)*Math.PI/180;
      out.push('<text class="lab" x="'+(cx+107*Math.cos(am)).toFixed(2)+'" y="'+(cy+107*Math.sin(am)).toFixed(2)+'">'+ALPHA.charAt(i)+'</text>');
    }
    out.push('<circle class="ring" cx="120" cy="120" r="97"/>');
    out.push('<circle class="hub" cx="120" cy="120" r="56"/>');
    out.push('<circle class="prog" cx="120" cy="120" r="51" transform="rotate(-90 120 120)" stroke-dasharray="320" stroke-dashoffset="320"/>');
    out.push('<g id="needle"><line x1="120" y1="120" x2="120" y2="31" stroke="rgba(255,244,226,.72)" stroke-width="1"/><circle cx="120" cy="34" r="1.8" fill="#fff6e6"/></g>');
    out.push('<text id="hubTxt" x="120" y="120">\u2014</text>');
    svg.innerHTML=out.join('');

    secEls=[].slice.call(svg.querySelectorAll('.sec'));
    labEls=[].slice.call(svg.querySelectorAll('.lab'));
    needle=svg.querySelector('#needle');
    hubTxt=svg.querySelector('#hubTxt');
    progEl=svg.querySelector('.prog');
    hubEl=svg.querySelector('.hub');
    if(progEl) progEl.setAttribute('stroke-dasharray',(2*Math.PI*51).toFixed(2));
    setSector(-1);
    setProgress(0);
  }

  function setSector(i){
    if(i===activeSec) return;
    if(activeSec>=0){ if(secEls[activeSec])secEls[activeSec].classList.remove('on'); if(labEls[activeSec])labEls[activeSec].classList.remove('on'); }
    activeSec=i;
    if(i>=0){ if(secEls[i])secEls[i].classList.add('on'); if(labEls[i])labEls[i].classList.add('on'); }
    if(needle) needle.style.transform='rotate('+(i>=0?i*15:0)+'deg)';
    if(hubTxt) hubTxt.textContent=(i>=0)?(ALPHA.charAt(i)+'\u00b7'+(i<9?'0':'')+(i+1)):'\u2014';
  }

  function setProgress(p){
    if(!progEl) return;
    if(Math.abs(p-lastProg)<0.004) return;
    lastProg=p;
    progEl.setAttribute('stroke-dashoffset',(2*Math.PI*51*(1-p)).toFixed(2));
  }

  /* ---------- lyrics: per-character timing, no invented text ---------- */
  var folioEl=$('folio'),codeEl=$('codebar'),emptyEl=$('empty'),stackEl=$('stack');
  var curChars=[],curTimes=[],curRaw=[],curTicks=[],curOn=0,lineKey='';

  function meter(l){
    var arr=Array.from(txt(l)), n=arr.length;
    var t0=(typeof l.t==='number'&&isFinite(l.t))?l.t:0;
    var d=(typeof l.dur==='number'&&isFinite(l.dur)&&l.dur>0)?l.dur:Math.max(1.1,n*0.24);
    var cs=Array.isArray(l.chars)?l.chars:null, out=new Array(n), k;
    for(k=0;k<n;k++){
      var v=null;
      if(cs&&cs[k]&&typeof cs[k].t==='number'&&isFinite(cs[k].t)) v=cs[k].t;
      if(v==null) v=t0+d*(k/Math.max(1,n));
      out[k]=v;
    }
    return {raw:arr,times:out};
  }

  function roman(n){
    if(n<=0) return '0';
    var m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']],s='',i;
    for(i=0;i<m.length;i++){ while(n>=m[i][0]){ s+=m[i][1]; n-=m[i][0]; } }
    return s;
  }

  function buildLine(i,preview){
    var L=S.lines,l=L[i],mt=meter(l),k;
    curRaw=mt.raw; curTimes=mt.times; curChars=[]; curTicks=[]; curOn=0;
    elCur.textContent=''; codeEl.textContent='';
    var f1=document.createDocumentFragment(),f2=document.createDocumentFragment();
    for(k=0;k<mt.raw.length;k++){
      var sp=document.createElement('span'); sp.className='ch'; sp.textContent=mt.raw[k];
      f1.appendChild(sp); curChars.push(sp);
      var s=sectorOf(mt.raw[k]);
      var b=document.createElement('i');
      b.style.color=secColor(s,70,56);
      b.style.height=(7+(s%3)*3)+'px';
      f2.appendChild(b); curTicks.push(b);
    }
    elCur.appendChild(f1); codeEl.appendChild(f2);
    folioEl.textContent=preview?'\u2014':roman(i+1);
    folioEl.classList.add('on');
    codeEl.classList.toggle('on',!preview);
    elPrev.textContent=i>0?txt(L[i-1]):'';
    elNext.textContent=(i+1<L.length)?txt(L[i+1]):'';
    fitCur();
    if(!preview&&!S.reduced){
      elCur.style.animation='none';
      void elCur.offsetWidth;
      elCur.style.animation='lineIn .62s cubic-bezier(.2,.7,.2,1) both';
    }
  }

  function tickChars(t){
    var n=curTimes.length,target=0;
    while(target<n&&t>=curTimes[target]-0.02) target++;
    while(curOn<target){
      if(curChars[curOn]) curChars[curOn].classList.add('on');
      if(curTicks[curOn]) curTicks[curOn].classList.add('on');
      curOn++;
    }
    while(curOn>target){
      curOn--;
      if(curChars[curOn]) curChars[curOn].classList.remove('on');
      if(curTicks[curOn]) curTicks[curOn].classList.remove('on');
    }
    if(target>0&&curRaw[target-1]) setSector(sectorOf(curRaw[target-1]));
  }

  function fitCur(){
    elCur.style.fontSize='';
    var vh=window.innerHeight||800;
    var maxH=Math.max(80,vh*0.34);
    var fs=parseFloat(getComputedStyle(elCur).fontSize)||30, guard=0;
    while(elCur.scrollHeight>maxH&&fs>10&&guard++<18){
      fs*=0.93; elCur.style.fontSize=fs.toFixed(2)+'px';
    }
  }

  function render(){
    var L=S.lines;
    if(!L.length){
      S.text=''; lineKey=''; curRaw=[]; curTimes=[]; curOn=0;
      elCur.textContent=''; elPrev.textContent=''; elNext.textContent=''; codeEl.textContent='';
      emptyEl.classList.add('on'); stackEl.style.display='none';
      setSector(-1);
      return;
    }
    emptyEl.classList.remove('on'); stackEl.style.display='';
    var preview=S.idx<0, i=preview?0:S.idx;
    var key=preview?'p0':String(i);
    if(key!==lineKey){
      lineKey=key;
      buildLine(i,preview);
      if(preview) folioEl.classList.remove('on');
    }
    S.text=preview?'':txt(L[i]);
    if(!preview) tickChars(S.t);
  }

  function onInit(p){
    try{
      var raw=Array.isArray(p&&p.lines)?p.lines:[], clean=[], i;
      for(i=0;i<raw.length;i++){
        var l=raw[i];
        if(!l||typeof l!=='object') continue;
        clean.push({
          t:(typeof l.t==='number'&&isFinite(l.t))?l.t:0,
          dur:(typeof l.dur==='number'&&isFinite(l.dur)&&l.dur>0)?l.dur:0,
          text:(typeof l.text==='string')?l.text:(l.text==null?'':String(l.text)),
          chars:Array.isArray(l.chars)?l.chars:null
        });
      }
      clean.sort(function(a,b){ return a.t-b.t; });
      S.lines=clean;
      dur=(p&&typeof p.duration==='number'&&isFinite(p.duration)&&p.duration>0)?p.duration:0;
      if(p&&typeof p.playing==='boolean') S.playing=p.playing; else S.playing=true;

      /* 同一个 payload 重复 init（例如封面取色完成后重发）不能把时钟打回开头 */
      var sig=clean.length+'|'+dur.toFixed(3)+'|'+(clean.length?clean[0].t:'')+'|'+(clean.length?clean[clean.length-1].t:'');
      var same=(sig===lastSig&&clean.length>0);
      lastSig=sig;
      if(same){
        S.idx=pickIdx(tickSeen?tickT:0);
      }else{
        tickSeen=false; tickT=0; tickAt=performance.now();
        S.idx=-1; lineOver=false;
        elCur.classList.remove('done');
      }
      S.text=''; lineKey=''; lastP=-1;
      render();
    }catch(e){ S.err=String(e&&e.message||e); }
  }

  var tickAt=0,tickT=0,dur=0,lastP=-1,tickSeen=false,lastSig='';
  function onTick(p){
    if(p&&typeof p.time==='number'&&isFinite(p.time)){ tickT=p.time; tickAt=performance.now(); tickSeen=true; }
    if(p&&typeof p.playing==='boolean') S.playing=p.playing;
  }

  var lineOver=false;
  function frame(now){
    var t0=performance.now();
    var dt=(now-tickAt)/1000;
    if(dt>1) dt=1;
    var t=tickSeen?(tickT+(S.playing?dt:0)):tickT;
    if(t<0) t=0;
    S.t=t;
    var i=pickIdx(t);
    if(i!==S.idx){ S.idx=i; render(); }
    else if(i>=0) tickChars(t);
    if(i>=0&&S.lines[i]){
      var l=S.lines[i];
      var end=curTimes.length?curTimes[curTimes.length-1]:l.t;
      var over=t>end+0.55;
      if(over!==lineOver){ lineOver=over; elCur.classList.toggle('done',over); }
    }
    var p=(dur>0?Math.min(1,t/dur):0);
    setProgress(p);
    beatCur+=(beatTarget-beatCur)*0.16;
    beatTarget+=(1-beatTarget)*0.09;
    if(Math.abs(beatCur-1)>0.0008){
      beatCur=Math.abs(beatCur-1)<0.0008?1:beatCur;
      cipher.style.transform='scale('+beatCur.toFixed(4)+')';
    }
    var pz=dur>0?p:Math.min(1,t/240)*0.9;
    if(Math.abs(pz-lastP)>0.0009){
      lastP=pz;
      var s=S.reduced?1.015:(1+0.05*pz);
      plate.style.transform='scale('+s.toFixed(4)+') translate3d('+((0.5-pz)*1.6).toFixed(2)+'%,'+((0.5-pz)*1.1).toFixed(2)+'%,0)';
    }
    S.frames++;
    S.js=performance.now()-t0;
    requestAnimationFrame(frame);
  }

  var beatCur=1,beatTarget=1,bassNow=0,cipher=$('cipher');
  function onBeat(p){
    var lv=(p&&typeof p.level==='number'&&isFinite(p.level))?Math.max(0,Math.min(1,p.level)):0.5;
    beatTarget=1+0.055*lv;
  }
  function onLive(p){
    if(!p) return;
    if(typeof p.bass==='number'&&isFinite(p.bass)) bassNow=Math.max(0,Math.min(1,p.bass));
    if(typeof p.playing==='boolean') S.playing=p.playing;
    if(hubEl) hubEl.setAttribute('r',(56+bassNow*4.5).toFixed(2));
  }

  window.addEventListener('message',function(ev){
    var d=ev.data;
    if(!d||d.__c100!==1) return;
    try{
      if(d.type==='init') onInit(d.payload);
      else if(d.type==='tick') onTick(d.payload);
      else if(d.type==='beat') onBeat(d.payload);
      else if(d.type==='live') onLive(d.payload);
    }catch(e){ S.err=String(e&&e.message||e); }
  });

  window.__stage=function(){
    return {lines:S.lines.length,idx:S.idx,t:S.t,playing:S.playing,frames:S.frames,js:S.js,err:S.err,text:S.text,gl:false,rm:S.reduced};
  };

  try{ S.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  var rzTimer=0;
  window.addEventListener('resize',function(){
    clearTimeout(rzTimer);
    rzTimer=setTimeout(function(){ if(S.lines.length&&S.idx>=0){ try{ fitCur(); }catch(e){} } },140);
  });

  var art=$('art');
  if(art){
    if(art.complete&&art.naturalWidth>0) art.style.opacity='1';
    art.addEventListener('load',function(){ art.style.opacity='1'; });
    art.addEventListener('error',function(){ art.style.display='none'; });
  }
  elCur.addEventListener('animationend',function(){ elCur.style.animation='none'; });

  buildSurface();
  buildWheel();
  requestAnimationFrame(frame);
  requestAnimationFrame(function(){ requestAnimationFrame(sendReady); });
  setTimeout(sendReady,700);
})();
</script>
</body>
</html>
