<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>333 · 泡沫盛夏</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1656d8;overflow:hidden}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
  #cv{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', {alpha:false});
  var W = 1440, H = 900, DPR = 1;

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    accent: [22, 86, 214], duration: 0, title: '', artists: '', songId: null,
    beat: 0, beatLevel: 0, pulse: 0, inited: false,
    live: {bpm:0, level:0, bass:0, mid:0, treble:0},
    tStamp: 0, rt: 0, reduced: false, lastIdx: -999, lineAt: 0
  };
  var readySent = false;

  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
  }
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    var w = cv.clientWidth || window.innerWidth || 0;
    var h = cv.clientHeight || window.innerHeight || 0;
    if (!isFinite(w) || w < 8) w = 1440;
    if (!isFinite(h) || h < 8) h = 900;
    W = w; H = h;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.textBaseline = 'alphabetic';
    layout();
    buildBg();
    seedParticles();
    LYR.valid = false;
  }
  function adopt(p){
    if (!p || typeof p !== 'object') return;
    // 时间无条件采纳
    if (typeof p.time === 'number' && isFinite(p.time)) { S.t = p.time; S.tStamp = performance.now(); }
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    if (typeof p.duration === 'number' && isFinite(p.duration)) S.duration = p.duration;
  }
  function onInit(p){
    if (!p || typeof p !== 'object') return;
    var lines = Array.isArray(p.lines) ? p.lines : [];
    S.lines = lines.filter(function(l){ return l && typeof l === 'object'; });
    S.duration = (typeof p.duration === 'number' && isFinite(p.duration)) ? p.duration : 0;
    var song = p.song || {};
    var ar = song.artists;
    S.artists = Array.isArray(ar) ? ar.filter(Boolean).join(' / ') : (typeof ar === 'string' ? ar : '');
    S.title = (typeof song.name === 'string') ? song.name : '';
    var ac = Array.isArray(p.accent) && p.accent.length >= 3 ? p.accent : null;
    if (ac) {
      S.accent = [clamp255(ac[0]), clamp255(ac[1]), clamp255(ac[2])];
    }
    // 同一首歌重复 init（取色/歌词晚到）不能把时钟打回 0
    var sid = (song.id === undefined || song.id === null) ? null : String(song.id);
    if (!S.inited || (sid !== null && S.songId !== null && sid !== S.songId)) {
      S.t = 0; S.rt = 0; S.idx = -1;
    }
    S.songId = sid;
    S.tStamp = performance.now();
    S.playing = (typeof p.playing === 'boolean') ? p.playing : true;
    S.inited = true;
    S.pulse = 0;
    LYR.valid = false;
  }
  function clamp255(v){ v = Math.round(Number(v)); if (!isFinite(v)) return 0; return v < 0 ? 0 : v > 255 ? 255 : v; }

  window.addEventListener('message', function(ev){
    var m = ev.data;
    if (!m || m.__c100 !== 1) return;
    if (m.type === 'init') { onInit(m.payload); }
    else if (m.type === 'tick') { adopt(m.payload); }
    else if (m.type === 'beat') {
      var b = m.payload || {};
      S.beatLevel = typeof b.level === 'number' ? Math.max(0, Math.min(1, b.level)) : 0.5;
      S.beat = (typeof b.index === 'number') ? b.index : S.beat + 1;
      S.pulse = Math.max(S.pulse, 0.45 + 0.55 * S.beatLevel);
    }
    else if (m.type === 'live') {
      var L = m.payload || {};
      S.live.bpm = num(L.bpm); S.live.level = num(L.level);
      S.live.bass = num(L.bass); S.live.mid = num(L.mid); S.live.treble = num(L.treble);
    }
  });
  function num(v){ v = Number(v); return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0; }

  /* ---------- 色板：高明度、无渐变、赛璐璐平涂 ---------- */
  var C = {
    skyTop:  '#1B5BE0',
    skyLow:  '#2E71EF',
    sun:     '#FFF3CE',
    sunCore: '#FFFFFF',
    cloud:   '#FFFFFF',
    cloudSh: '#AECFF7',
    sea:     '#0B3FA6',
    seaSh:   '#08317F',
    deck:    '#F8F3E4',
    deckSh:  '#E0D6BC',
    pool:    '#22D3E6',
    poolDeep:'#13B6D2',
    poolDark:'#0B8FAF',
    plate:   '#053A4C',
    plateSh: '#02232E',
    cream:   '#FFF8E4',
    leaf:    '#0E6B47',
    leaf2:   '#12875A',
    trunk:   '#C97C3E',
    trunkSh: '#A55F28'
  };
  var L = null;
  function layout(){
    var portrait = H > W * 1.02;
    var u = Math.min(W, H);
    var horizon = H * (portrait ? 0.375 : 0.43);
    var seaH = Math.max(16, H * (portrait ? 0.055 : 0.075));
    var deckH = Math.max(22, H * (portrait ? 0.075 : 0.085));
    var seaY = horizon;
    var deckY = seaY + seaH;
    var poolY = deckY + deckH;
    L = {
      portrait: portrait, u: u, horizon: horizon, seaY: seaY, seaH: seaH,
      deckY: deckY, deckH: deckH, poolY: poolY,
      sunX: W * (portrait ? 0.74 : 0.79), sunY: horizon * 0.40, sunR: u * (portrait ? 0.13 : 0.115),
      plateX: W / 2, plateW: Math.min(W * (portrait ? 0.90 : 0.70), 1000),
      plateY: poolY + (H - poolY) * (portrait ? 0.46 : 0.47)
    };
    return L;
  }

  /* ---------- 平面小工具 ---------- */
  function rect(x, y, w, h, col){ ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
  function disc(x, y, r, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
  function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  /* ---------- 云：白块 + 平涂蓝影 ---------- */
  function cloud(cx, cy, s){
    var blobs = [[0,0,1],[0.42,0.06,0.78],[-0.46,0.08,0.72],[0.18,0.2,0.86],[-0.2,0.22,0.82],[0.72,0.24,0.5],[-0.72,0.26,0.46]];
    var i, b;
    ctx.fillStyle = C.cloudSh;
    for (i = 0; i < blobs.length; i++){
      b = blobs[i];
      ctx.beginPath(); ctx.arc(cx + b[0] * s, cy + b[1] * s + s * 0.14, b[2] * s * 0.62, 0, 6.2832); ctx.fill();
    }
    ctx.fillRect(cx - s * 0.95, cy + s * 0.1, s * 1.9, s * 0.5);
    ctx.fillStyle = C.cloud;
    for (i = 0; i < blobs.length; i++){
      b = blobs[i];
      ctx.beginPath(); ctx.arc(cx + b[0] * s, cy + b[1] * s, b[2] * s * 0.62, 0, 6.2832); ctx.fill();
    }
    ctx.fillRect(cx - s * 0.95, cy + s * 0.02, s * 1.9, s * 0.46);
  }

  /* ---------- 棕榈：平涂剪影 ---------- */
  function frond(bx, by, ang, len, col, bow){
    var tipX = bx + Math.cos(ang) * len, tipY = by + Math.sin(ang) * len;
    var nx = Math.cos(ang - Math.PI / 2), ny = Math.sin(ang - Math.PI / 2);
    var w = len * 0.19 * bow;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo((bx + tipX) / 2 + nx * w, (by + tipY) / 2 + ny * w, tipX, tipY);
    ctx.quadraticCurveTo((bx + tipX) / 2 - nx * w * 0.7, (by + tipY) / 2 - ny * w * 0.7, bx, by);
    ctx.closePath(); ctx.fill();
  }
  function palm(x, baseY, h, lean, dir){
    var topX = x + lean, topY = baseY - h;
    // 树干
    ctx.beginPath();
    ctx.moveTo(x - h * 0.045, baseY);
    ctx.quadraticCurveTo(x + lean * 0.4 - h * 0.02, baseY - h * 0.55, topX - h * 0.016, topY);
    ctx.lineTo(topX + h * 0.016, topY);
    ctx.quadraticCurveTo(x + lean * 0.4 + h * 0.028, baseY - h * 0.55, x + h * 0.052, baseY);
    ctx.closePath();
    ctx.fillStyle = C.trunk; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + h * 0.005, baseY);
    ctx.quadraticCurveTo(x + lean * 0.4 + h * 0.006, baseY - h * 0.55, topX + h * 0.002, topY);
    ctx.lineTo(topX + h * 0.016, topY);
    ctx.quadraticCurveTo(x + lean * 0.4 + h * 0.028, baseY - h * 0.55, x + h * 0.052, baseY);
    ctx.closePath();
    ctx.fillStyle = C.trunkSh; ctx.fill();
    // 叶
    var n = 8;
    for (var i = 0; i < n; i++){
      var a = -Math.PI * 0.92 + (i / (n - 1)) * Math.PI * 0.84 + dir * 0.12;
      frond(topX, topY, a, h * (0.34 + 0.06 * Math.cos(i * 1.7)), i % 2 ? C.leaf : C.leaf2, 1);
    }
    for (var j = 0; j < 5; j++){
      var a2 = -Math.PI * 0.62 + (j / 4) * Math.PI * 0.72;
      frond(topX, topY, a2, h * 0.26, C.leaf, 0.8);
    }
    // 椰果
    disc(topX - h * 0.02, topY + h * 0.028, h * 0.017, '#7A4A1E');
    disc(topX + h * 0.02, topY + h * 0.036, h * 0.016, '#8A5626');
  }

  /* ---------- 池畔道具？ ---------- */
  function parasol(cx, cy, R, poleBaseY){
    // 杆
    ctx.fillStyle = '#EADFC6';
    ctx.fillRect(cx - R * 0.028, cy, R * 0.056, poleBaseY - cy);
    ctx.fillStyle = '#C6B893';
    ctx.fillRect(cx + R * 0.010, cy, R * 0.018, poleBaseY - cy);
    // 伞面：平涂条纹
    var n = 10, i, a0, a1;
    for (i = 0; i < n; i++){
      a0 = Math.PI + (i / n) * Math.PI;
      a1 = Math.PI + ((i + 1) / n) * Math.PI;
      ctx.fillStyle = (i % 2 === 0) ? '#F2604D' : '#FFF8E4';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, a0, a1);
      ctx.closePath();
      ctx.fill();
    }
    // 伞沿：扇形缺口的深色薄边
    ctx.fillStyle = 'rgba(6,58,76,0.16)';
    ctx.fillRect(cx - R, cy - 1, R * 2, Math.max(3, R * 0.05));
    disc(cx, cy - R * 0.07, R * 0.05, '#F2604D');
  }

  function poolLadder(x, topY, depth){
    var gap = L.u * 0.048;
    var lw = Math.max(3, L.u * 0.008);
    ctx.strokeStyle = '#E9F3F5';
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - gap, topY);
    ctx.lineTo(x - gap, topY + depth);
    ctx.moveTo(x + gap, topY);
    ctx.lineTo(x + gap, topY + depth);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(6,58,76,0.25)';
    ctx.lineWidth = Math.max(1, lw * 0.35);
    ctx.beginPath();
    ctx.moveTo(x - gap + lw * 0.5, topY);
    ctx.lineTo(x - gap + lw * 0.5, topY + depth);
    ctx.stroke();
    ctx.strokeStyle = '#E9F3F5';
    ctx.lineWidth = Math.max(2, lw * 0.8);
    var i;
    for (i = 1; i <= 3; i++){
      var sy = topY + depth * (i / 3.6);
      ctx.beginPath();
      ctx.moveTo(x - gap, sy);
      ctx.lineTo(x + gap, sy);
      ctx.stroke();
    }
  }

  function sailboat(x, y, s){
    ctx.fillStyle = '#0B3FA6';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.9, y);
    ctx.lineTo(x + s * 0.9, y);
    ctx.lineTo(x + s * 0.6, y + s * 0.32);
    ctx.lineTo(x - s * 0.6, y + s * 0.32);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFFDF4';
    ctx.beginPath();
    ctx.moveTo(x, y - s * 1.5);
    ctx.lineTo(x + s * 0.62, y - s * 0.06);
    ctx.lineTo(x, y - s * 0.06);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#DCE9F8';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.08, y - s * 1.3);
    ctx.lineTo(x - s * 0.62, y - s * 0.06);
    ctx.lineTo(x - s * 0.08, y - s * 0.06);
    ctx.closePath(); ctx.fill();
  }

  /* ---------- 静态场景缓存 ---------- */
  var bg = document.createElement('canvas');
  function buildBg(){
    var d = DPR;
    bg.width = Math.round(W * d); bg.height = Math.round(H * d);
    var g = bg.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    var old = ctx;
    ctx = g;
    var u = L.u;

    // 天空：两段平涂
    rect(0, 0, W, L.horizon, C.skyTop);
    rect(0, L.horizon - u * 0.16, W, u * 0.16, C.skyLow);

    // 太阳：奶油圆盘 + 白核 + 细描边
    disc(L.sunX, L.sunY, L.sunR * 1.05, 'rgba(255,255,255,0.28)');
    disc(L.sunX, L.sunY, L.sunR, C.sun);
    disc(L.sunX, L.sunY, L.sunR * 0.72, C.sunCore);

    // 云
    cloud(W * 0.20, L.horizon * 0.30, u * 0.095);
    cloud(W * 0.50, L.horizon * 0.14, u * 0.066);
    cloud(W * 0.63, L.horizon * 0.55, u * 0.078);

    // 海：平涂 + 白浪点
    rect(0, L.seaY, W, L.seaH, C.sea);
    rect(0, L.seaY + L.seaH * 0.66, W, L.seaH * 0.34, C.seaSh);
    rect(0, L.seaY, W, Math.max(2, u * 0.004), 'rgba(255,255,255,0.55)');
    g.fillStyle = 'rgba(255,255,255,0.85)';
    for (var i = 0; i < 26; i++){
      var wx = (i * 137.5) % W;
      var wy = L.seaY + L.seaH * (0.20 + 0.40 * ((i % 3) / 2));
      g.fillRect(wx, wy, u * (0.020 + 0.012 * (i % 4)), Math.max(2, u * 0.005));
    }
    sailboat(W * 0.34, L.seaY + L.seaH * 0.34, u * 0.030);

    // 甲板 + 池沿
    rect(0, L.deckY, W, L.deckH, C.deck);
    rect(0, L.deckY, W, Math.max(3, u * 0.008), C.deckSh);
    rect(0, L.poolY - u * 0.026, W, Math.max(3, u * 0.007), '#F2604D');
    rect(0, L.poolY - u * 0.013, W, u * 0.013, C.cream);

    // 池水
    rect(0, L.poolY, W, H - L.poolY, C.pool);
    rect(0, L.poolY, W, (H - L.poolY) * 0.40, C.poolDeep);
    rect(0, H - (H - L.poolY) * 0.19, W, (H - L.poolY) * 0.19, C.poolDark);
    // 台阶入水处的池沿投影
    rect(0, L.poolY, W, (H - L.poolY) * 0.035, 'rgba(6,58,76,0.13)');
    // 池底瓷砖缝
    g.fillStyle = 'rgba(255,255,255,0.17)';
    var tile = Math.max(48, u * 0.13), ty;
    for (ty = L.poolY + tile; ty < H; ty += tile) g.fillRect(0, Math.round(ty), W, Math.max(1, u * 0.003));
    for (var tx = 0; tx < W; tx += tile) g.fillRect(Math.round(tx), L.poolY, Math.max(1, u * 0.003), H - L.poolY);

    // 棕榈（左右框景）
    palm(W * 0.045, L.deckY + L.deckH * 0.55, Math.min(H * 0.50, L.deckY * 0.82), W * 0.030, 1);
    palm(W * 0.960, L.deckY + L.deckH * 0.55, Math.min(H * 0.46, L.deckY * 0.76), -W * 0.026, -1);

    // 池畔阳伞
    parasol(W * 0.145, L.deckY - L.u * 0.055, L.u * 0.105, L.deckY + L.deckH * 0.50);
    // 泳池扶梯
    poolLadder(W * 0.905, L.deckY + L.deckH * 0.35, (H - L.poolY) * 0.42);

    ctx = old;
  }

  /* ---------- 歌词：排版、逐字、池底深色落点 ---------- */
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
  var LYR = {key:'', valid:false};

  function activeLine(){
    if (S.idx >= 0 && S.lines[S.idx]) return {line: S.lines[S.idx], idx: S.idx, intro:false};
    if (S.lines.length && S.idx < 0) return {line: S.lines[0], idx: 0, intro:true};
    return null;
  }

  function charTiming(idx){
    var line = S.lines[idx], text = (line && typeof line.text === 'string') ? line.text : '';
    var arr = Array.from(text), n = arr.length, out = [], i;
    var t0 = (line && typeof line.t === 'number' && isFinite(line.t)) ? line.t : 0;
    var dur = Number(line && line.dur);
    if (!isFinite(dur) || dur <= 0){
      var nx = S.lines[idx + 1];
      dur = (nx && isFinite(nx.t) && nx.t > t0) ? (nx.t - t0) : (n * 0.24);
    }
    dur = Math.max(0.4, Math.min(22, dur));
    var src = (line && Array.isArray(line.chars)) ? line.chars : null;
    var ok = !!(src && src.length === n);
    if (ok) {
      for (i = 0; i < n; i++){ if (!isFinite(Number(src[i] && src[i].t))) { ok = false; break; } }
    }
    if (ok) { for (i = 0; i < n; i++) out.push(Number(src[i].t)); }
    else { for (i = 0; i < n; i++) out.push(t0 + dur * (i / Math.max(1, n)) * 0.93); }
    return {arr: arr, times: out, t0: t0, end: t0 + dur};
  }

  function wrapChars(cs, ts, font, maxW){
    ctx.font = font;
    var lines = [], lc = [], lt = [], w = 0, i, ch, cw, widest = 0;
    for (i = 0; i < cs.length; i++){
      ch = cs[i];
      cw = ctx.measureText(ch).width;
      if (lc.length && w + cw > maxW){
        if (/[，。、；：？！）】》,.;:?!]/.test(ch) && lc.length > 1){
          lc.push(ch); lt.push(ts[i]); lines.push({c: lc, t: lt, w: w + cw});
          lc = []; lt = []; w = 0;
        } else {
          while (lc.length && /\s/.test(lc[lc.length - 1])) { w -= ctx.measureText(lc.pop()).width; lt.pop(); }
          if (lc.length) lines.push({c: lc, t: lt, w: w});
          lc = []; lt = []; w = 0;
          if (!/\s/.test(ch)) { lc.push(ch); lt.push(ts[i]); w = cw; }
        }
      } else {
        lc.push(ch); lt.push(ts[i]); w += cw;
      }
    }
    if (lc.length) lines.push({c: lc, t: lt, w: w});
    if (!lines.length) lines.push({c: [' '], t: [0], w: 0});
    for (i = 0; i < lines.length; i++) widest = Math.max(widest, lines[i].w);
    return {lines: lines, widest: widest};
  }

  function plateCap(){
    return Math.max(118, (H - L.poolY) * (L.portrait ? 0.82 : 0.78));
  }

  function buildLyric(){
    var al = activeLine();
    var availW = L.plateW - Math.max(56, L.u * 0.14);
    var text = (al && al.line && typeof al.line.text === 'string') ? al.line.text : '';
    var key = al
      ? ('L' + al.idx + '|' + W + '|' + H + '|' + text + '|' + ((al.line.chars && al.line.chars.length) || 0))
      : ('E|' + W + '|' + H + '|' + S.inited + '|' + S.title + '|' + S.artists);
    if (LYR.valid && LYR.key === key) return LYR;

    var padX = Math.max(34, L.u * 0.075);
    if (!al){
      LYR = {valid:true, kind:'empty', key:key, plateH: Math.max(120, L.u * 0.30),
             pw: Math.min(L.plateW, Math.max(L.plateW * 0.62, L.u * 0.62)),
             size:0, lines:null, lh:0, padTop:0, availW:availW};
      return LYR;
    }
    if (!text.trim()){
      LYR = {valid:true, kind:'gap', key:key, plateH: Math.max(104, L.u * 0.24),
             pw: Math.min(L.plateW, Math.max(L.plateW * 0.42, L.u * 0.40)),
             size:0, lines:null, lh:0, padTop:0, availW:availW};
      return LYR;
    }

    var ct = charTiming(al.idx);
    var base = L.portrait ? Math.min(W * 0.078, H * 0.055) : Math.min(W * 0.052, H * 0.072);
    base = Math.max(24, Math.min(base, 88));
    var maxLines = L.portrait ? 3 : 2;
    var capH = plateCap();
    var size = base, res = null, lh = 0, padTop = 0, need = 0, k, font;

    for (k = 0; k < 18; k++){
      font = '800 ' + Math.round(size) + 'px ' + FONT;
      res = wrapChars(ct.arr, ct.times, font, availW);
      lh = size * 1.40; padTop = size * 0.84;
      need = padTop + lh * res.lines.length + size * 0.80;
      if (res.lines.length <= maxLines && res.widest <= availW && need <= capH) break;
      if (size <= 18) break;
      size *= 0.90;
    }
    // 短句放大，避免小字孤零零
    var grown = 0;
    while (grown < 5 && res.lines.length === 1 && res.widest < availW * 0.58 && size < base * 1.45){
      var ns = size * 1.10;
      var nt = wrapChars(ct.arr, ct.times, '800 ' + Math.round(ns) + 'px ' + FONT, availW);
      if (nt.lines.length > 1 || nt.widest > availW) break;
      if (ns * 0.84 + ns * 1.40 * nt.lines.length + ns * 0.80 > capH) break;
      size = ns; res = nt; grown++;
    }
    size = Math.round(size);
    lh = size * 1.40;
    padTop = size * 0.84;
    var widest = 0, ii;
    for (ii = 0; ii < res.lines.length; ii++) widest = Math.max(widest, res.lines[ii].w);
    var pw = Math.min(L.plateW, Math.max(Math.min(L.plateW, size * 3.2), widest + padX * 2));
    LYR = {
      valid:true, kind:'text', key:key, size:size, lines:res.lines, lh:lh, padTop:padTop, pw:pw,
      availW:availW, intro:!!al.intro, lineStart:ct.t0, lineEnd:ct.end, text:text,
      plateH: padTop + lh * res.lines.length + size * 0.80
    };
    return LYR;
  }

  function drawCharLine(line, x, cy, size, rt, on, off, alpha){
    ctx.font = '800 ' + Math.round(size) + 'px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    var cx = x, i, c;
    for (i = 0; i < line.c.length; i++){
      c = line.c[i];
      if (rt >= line.t[i] - 0.02) { ctx.globalAlpha = alpha; ctx.fillStyle = on; }
      else { ctx.globalAlpha = alpha; ctx.fillStyle = off; }
      ctx.fillText(c, cx, cy);
      cx += ctx.measureText(c).width;
    }
    ctx.globalAlpha = 1;
  }

  function drawLyric(rt){
    var ly = buildLyric();
    var pw = ly.pw || L.plateW, ph = ly.plateH;
    if (!ph) ph = L.u * 0.26;
    var px = L.plateX - pw / 2;
    var py = L.plateY - ph / 2;
    py = Math.max(L.poolY + L.u * 0.03, Math.min(py, H - ph - L.u * 0.03));

    // 硬投影（无模糊，赛璐璐）
    ctx.fillStyle = C.plateSh;
    rr(px + L.u * 0.012, py + L.u * 0.014, pw, ph, 16); ctx.fill();
    // 深色板（歌词的落点）
    ctx.fillStyle = C.plate;
    rr(px, py, pw, ph, 16); ctx.fill();
    // 奶油描边
    ctx.strokeStyle = C.cream;
    ctx.lineWidth = Math.max(2, L.u * 0.0042);
    rr(px + 9, py + 9, pw - 18, ph - 18, 10); ctx.stroke();
    // 四角泳道刻度
    if (pw > 250){
      ctx.fillStyle = C.cream;
      var tw = Math.max(10, L.u * 0.03), th = Math.max(2, L.u * 0.006);
      ctx.fillRect(px + 26, py + 26, tw, th); ctx.fillRect(px + pw - 26 - tw, py + 26, tw, th);
      ctx.fillRect(px + 26, py + ph - 26 - th, tw, th); ctx.fillRect(px + pw - 26 - tw, py + ph - 26 - th, tw, th);
    }

    if (ly.kind === 'empty' || ly.kind === 'gap'){
      var dots = ly.kind === 'gap';
      var s1 = dots ? '· · ·' : (S.inited ? '纯器乐 · 无歌词' : '· · ·');
      var size1 = dots ? Math.max(24, Math.min(pw * 0.05, H * 0.04))
                       : Math.max(20, Math.min(pw * 0.072, H * 0.052));
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = C.cream;
      ctx.font = '800 ' + Math.round(size1) + 'px ' + FONT;
      ctx.fillText(s1, L.plateX, py + ph / 2 - (dots ? 0 : size1 * 0.42));
      if (!dots && S.inited){
        var meta = [S.title, S.artists].filter(Boolean).join(' — ');
        if (meta){
          ctx.fillStyle = 'rgba(255,255,255,0.58)';
          ctx.font = '600 ' + Math.round(size1 * 0.40) + 'px ' + FONT;
          ctx.fillText(meta.slice(0, 64), L.plateX, py + ph / 2 + size1 * 0.55);
        }
      }
      ctx.textAlign = 'left';
      return {px: px, py: py, pw: pw, ph: ph, ly: ly};
    }

    var topY = py + ly.padTop;
    var i, ln, cy, sx;
    var ent = 1;
    if (!ly.intro){
      var age = Math.max(0, performance.now() - (S.lineAt || 0));
      ent = 0.30 + 0.70 * Math.min(1, age / 240);
    }
    for (i = 0; i < ly.lines.length; i++){
      ln = ly.lines[i];
      cy = topY + ly.lh * (i + 0.5);
      sx = L.plateX - ln.w / 2;
      if (ly.intro) drawCharLine(ln, sx, cy, ly.size, -1e9, 'rgba(255,255,255,0.46)', 'rgba(255,255,255,0.46)', 1);
      else drawCharLine(ln, sx, cy, ly.size, rt, '#FFFFFF', 'rgba(255,255,255,0.42)', ent);
    }

    // 进度条：本句内的时间锚
    var barY = py + ph - ly.size * 0.40 - 4;
    var barX = px + 26, barW = pw - 52, barH = Math.max(3, L.u * 0.006);
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    rr(barX, barY, barW, barH, barH / 2); ctx.fill();
    var prog = ly.intro ? 0 : Math.max(0, Math.min(1, (rt - ly.lineStart) / Math.max(0.3, ly.lineEnd - ly.lineStart)));
    if (prog > 0){
      var al0 = (0.2126 * S.accent[0] + 0.7152 * S.accent[1] + 0.0722 * S.accent[2]) / 255;
      ctx.fillStyle = (al0 > 0.40) ? 'rgb(' + S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2] + ')' : C.cream;
      rr(barX, barY, Math.max(barH, barW * prog), barH, barH / 2); ctx.fill();
    }

    return {px: px, py: py, pw: pw, ph: ph, ly: ly};
  }

  /* ---------- 动态层：光斑、波纹、气泡、泳圈 ---------- */
  var sparks = [], bubbles = [], twinkles = [], air = [], frameDt = 0.016, lastNow = 0;

  function seedParticles(){
    sparks.length = 0; bubbles.length = 0; twinkles.length = 0; air.length = 0;
    var i;
    for (i = 0; i < 44; i++){
      sparks.push({ a: Math.random() * 6.2832, r: Math.random(), v: 0.10 + Math.random() * 0.34,
                    len: 0.10 + Math.random() * 0.22, w: 1 + Math.random() * 2 });
    }
    for (i = 0; i < 24; i++){
      bubbles.push({ x: Math.random(), y: Math.random(), r: 0.006 + Math.random() * 0.016,
                     v: 0.04 + Math.random() * 0.13, ph: Math.random() * 6.2832 });
    }
    for (i = 0; i < 16; i++){
      twinkles.push({ x: Math.random(), y: Math.random() * 0.42, r: 0.004 + Math.random() * 0.008, ph: Math.random() * 6.2832 });
    }
    for (i = 0; i < 14; i++){
      air.push({ x: Math.random(), y: Math.random(), r: 0.005 + Math.random() * 0.011,
                 v: 0.010 + Math.random() * 0.030, ph: Math.random() * 6.2832 });
    }
  }

  function drawAirBubbles(rt){
    var i, b, x, y, r;
    for (i = 0; i < air.length; i++){
      b = air[i];
      if (!S.reduced) b.y -= b.v * frameDt * (S.mo || 1);
      if (b.y < -0.1){ b.y = 1.1; b.x = Math.random(); }
      x = b.x * W + Math.sin(rt * 0.9 + b.ph) * L.u * 0.008;
      y = b.y * L.horizon;
      r = Math.max(2.5, L.u * b.r);
      ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.lineWidth = Math.max(1.2, r * 0.24);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(x - r * 0.30, y - r * 0.34, Math.max(1, r * 0.22), 0, 6.2832); ctx.fill();
    }
  }

  function star4(x, y, r, col){
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x + r * 0.16, y - r * 0.16, x + r, y);
    ctx.quadraticCurveTo(x + r * 0.16, y + r * 0.16, x, y + r);
    ctx.quadraticCurveTo(x - r * 0.16, y + r * 0.16, x - r, y);
    ctx.quadraticCurveTo(x - r * 0.16, y - r * 0.16, x, y - r);
    ctx.fill();
  }

  function drawSunSparks(rt, pulse){
    var cx = L.sunX, cy = L.sunY, R = L.sunR, i, s, ang, d, a, x1, y1, x2, y2;
    var rot = S.reduced ? 0.0 : rt * 0.06;

    // 放射光线：长短交错
    ctx.lineCap = 'round';
    for (i = 0; i < 14; i++){
      ang = rot + i * 0.4488;
      var long = (i % 2 === 0);
      var r0 = R * 1.16, r1 = R * (long ? 1.85 : 1.55) * (1 + pulse * 0.10);
      if (S.reduced) r1 = R * 1.6;
      ctx.strokeStyle = 'rgba(255,255,255,' + (long ? 0.62 : 0.38) + ')';
      ctx.lineWidth = long ? Math.max(2, R * 0.035) : Math.max(1.5, R * 0.022);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
      ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
      ctx.stroke();
    }

    // 飞溅光斑：沿径向飞出、淡入淡出
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineCap = 'round';
    for (i = 0; i < sparks.length; i++){
      s = sparks[i];
      if (!S.reduced) s.r += s.v * frameDt * (S.mo || 1);
      if (s.r > 1) s.r -= 1;
      ang = s.a + rot * 0.4;
      d = R * (1.20 + s.r * 1.05);
      a = Math.sin(Math.PI * s.r);
      if (a <= 0.02) continue;
      x1 = cx + Math.cos(ang) * d;
      y1 = cy + Math.sin(ang) * d;
      x2 = cx + Math.cos(ang) * (d + R * s.len);
      y2 = cy + Math.sin(ang) * (d + R * s.len);
      ctx.globalAlpha = a * 0.75;
      ctx.lineWidth = s.w * Math.max(1, L.u * 0.0035);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 天空里的四角星光
    for (i = 0; i < twinkles.length; i++){
      var tw = twinkles[i];
      var tw2 = S.reduced ? 0.5 : 0.35 + 0.65 * Math.abs(Math.sin(rt * 1.1 + tw.ph));
      star4(tw.x * W, tw.y * L.horizon, Math.max(3, L.u * tw.r) * (1 + pulse * 0.35),
            'rgba(255,255,255,' + (0.35 + tw2 * 0.45) + ')');
    }
  }

  function drawWater(rt, pulse, bass, treble){
    var i, x, y, amp, ph;
    var top = L.poolY, depth = H - L.poolY;
    // 水面高光带
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.fillRect(0, top + depth * 0.015, W, Math.max(3, depth * 0.012));

    // 波纹线
    ctx.lineCap = 'round';
    for (i = 0; i < 7; i++){
      ph = S.reduced ? 0 : rt * (0.55 + i * 0.07) + i * 1.3;
      amp = depth * (0.006 + 0.012 * bass) * (1 + pulse * 0.4);
      y = top + depth * (0.06 + i * 0.075);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.30 - i * 0.026) + ')';
      ctx.lineWidth = Math.max(1.5, depth * 0.006);
      ctx.beginPath();
      for (x = -10; x <= W + 10; x += Math.max(14, W / 46)){
        var wy = y + Math.sin(x * 0.011 + ph) * amp + Math.sin(x * 0.031 - ph * 1.7) * amp * 0.5;
        if (x <= 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
      }
      ctx.stroke();
    }

    // 气泡
    for (i = 0; i < bubbles.length; i++){
      var b = bubbles[i];
      if (!S.reduced) b.y -= b.v * frameDt * (S.mo || 1) * (0.6 + treble * 1.7);
      if (b.y < -0.05){ b.y = 1.05; b.x = Math.random(); }
      x = b.x * W + Math.sin(rt * 1.6 + b.ph) * L.u * 0.006;
      y = top + depth * (0.10 + b.y * 0.86);
      var r = Math.max(2.5, L.u * b.r) * (1 + pulse * 0.12);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = Math.max(1.2, r * 0.22);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }

    // 池底焦散：平涂碎弧
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = Math.max(1.4, depth * 0.004);
    ctx.lineCap = 'round';
    for (i = 0; i < 11; i++){
      var hx = ((i * 0.137) + 0.06) % 1;
      var cxp = hx * W + (S.reduced ? 0 : Math.sin(rt * 0.6 + i * 0.9) * L.u * 0.02);
      var cyp = top + depth * (0.50 + 0.10 * (((i * 0.37) + 0.11) % 1));
      var cr = L.u * (0.035 + 0.045 * (((i * 0.71) + 0.23) % 1));
      ctx.beginPath(); ctx.arc(cxp, cyp, cr, Math.PI * 1.05, Math.PI * 1.78); ctx.stroke();
      ctx.beginPath(); ctx.arc(cxp + cr * 1.35, cyp + cr * 0.22, cr * 0.66, Math.PI * 1.10, Math.PI * 1.92); ctx.stroke();
    }
  }

  function drawFloat(rt, pulse){
    var cx = W - L.u * 0.11, cy = H - (H - L.poolY) * 0.13 + (S.reduced ? 0 : Math.sin(rt * 1.3) * L.u * 0.008);
    var R = L.u * 0.062, w = Math.max(4, R * 0.30);
    ctx.lineWidth = w;
    ctx.strokeStyle = '#F2453A';
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 0.15, Math.PI * 1.05); ctx.stroke();
    ctx.strokeStyle = '#FFF8E4';
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
    ctx.strokeStyle = '#F2453A';
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 1.55, Math.PI * 2.15); ctx.stroke();
    ctx.strokeStyle = '#FFF8E4';
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 2.15, Math.PI * 2.55); ctx.stroke();
    ctx.strokeStyle = '#F2453A';
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 2.55, Math.PI * 2.95); ctx.stroke();
    // 水面接触高光
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = Math.max(2, R * 0.10);
    ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.95, R * 0.8, R * 0.16, 0, 0, 6.2832); ctx.stroke();
  }

  function drawSongChip(){
    if (!S.title && !S.artists) return;
    var label = (S.title || '') + (S.title && S.artists ? '  ·  ' : '') + (S.artists || '');
    var size = Math.max(11, Math.min(L.u * 0.024, 20));
    ctx.font = '700 ' + Math.round(size) + 'px ' + FONT;
    var tw = ctx.measureText(label).width;
    var maxW = Math.min(W * 0.62, tw + size * 3.4);
    var h = size * 2.1;
    var x = Math.max(14, L.u * 0.035), y = Math.max(14, L.u * 0.035);
    ctx.fillStyle = C.cream;
    rr(x, y, maxW, h, h / 2); ctx.fill();
    // 主色圆点
    ctx.fillStyle = 'rgb(' + S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2] + ')';
    ctx.beginPath(); ctx.arc(x + size * 1.05, y + h / 2, size * 0.30, 0, 6.2832); ctx.fill();
    ctx.save();
    rr(x, y, maxW, h, h / 2); ctx.clip();
    ctx.fillStyle = C.plate;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(size) + 'px ' + FONT;
    ctx.fillText(label, x + size * 1.75, y + h / 2 + 1);
    ctx.restore();
  }


  function currentIndex(time){
    var arr = S.lines, i, n = arr.length;
    if (!n) return -1;
    var lo = 0, hi = n - 1, ans = -1;
    for (var guard = 0; guard < 32 && lo <= hi; guard++) {
      var mid = (lo + hi) >> 1;
      var mt = (typeof arr[mid].t === 'number' && isFinite(arr[mid].t)) ? arr[mid].t : 0;
      if (mt <= time + 0.05) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  function draw(){
    var t0 = performance.now();
    var now = t0;
    frameDt = Math.min(0.1, Math.max(0.001, (now - lastNow) / 1000));
    lastNow = now;
    S.frames++;
    if ((S.frames & 31) === 0){
      var cw = cv.clientWidth || 0, ch = cv.clientHeight || 0;
      if (cw > 8 && ch > 8 && (Math.abs(cw - W) > 2 || Math.abs(ch - H) > 2)) resize();
    }
    S.mo = S.playing ? 1 : 0.15;

    var rt = S.t;
    if (S.playing) {
      var d = (now - S.tStamp) / 1000;
      if (d > 0 && d < 0.25) rt = S.t + d;
    }
    S.rt = rt;
    S.idx = currentIndex(rt);
    if (S.idx !== S.lastIdx){ S.lastIdx = S.idx; S.lineAt = now; }

    if (S.pulse > 0) S.pulse = Math.max(0, S.pulse - frameDt * 3.0);
    var pulse = S.pulse;
    var bass = Math.max(S.live.bass, pulse * 0.6);
    var treble = S.live.treble;

    if (bg.width) ctx.drawImage(bg, 0, 0, W, H);

    drawSunSparks(rt, pulse);
    drawAirBubbles(rt);
    drawWater(rt, pulse, bass, treble);
    drawFloat(rt, pulse);
    drawLyric(rt);
    drawSongChip();

    // 节拍闪白（极轻，保持高明度）
    if (pulse > 0.02){
      ctx.fillStyle = 'rgba(255,255,255,' + (pulse * 0.06) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    S.js = performance.now() - t0;
    requestAnimationFrame(draw);
  }

  window.__stage = function(){
    var line = (S.idx >= 0) ? S.lines[S.idx] : null;
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: '',
      text: (line && typeof line.text === 'string') ? line.text : '',
      gl: false, rm: S.reduced
    };
  };

  try {
    var mql = window.matchMedia('(prefers-reduced-motion: reduce)');
    S.reduced = !!mql.matches;
    if (mql.addEventListener) mql.addEventListener('change', function(e){ S.reduced = !!e.matches; });
  } catch(e){}
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(function(){ sendReady(); });
  setTimeout(sendReady, 120);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
