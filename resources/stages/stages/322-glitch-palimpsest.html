<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>322 · 涂改过载</title>
<style>
  :root{
    --paper:#c8d1d5; --paper-hi:#dde4e6; --ink:#0d1316; --ink2:#3b484d;
    --accent:rgb(138,166,178); --plate:#e6ebeb;
    --mono: ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
    --sans: "Helvetica Neue",Arial,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --disp: "Arial Narrow","Haettenschweiler",Impact,"Microsoft YaHei",sans-serif;
    --pad: clamp(16px,4.6vw,110px);
    --ind: clamp(11px,1.5vw,24px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;color:var(--ink)}

  /* ---------- 页眉：表格化的工业标注 ---------- */
  #hdr{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    padding:clamp(14px,2.6vh,30px) var(--pad) 0;
    font-family:var(--mono);font-size:clamp(8px,.74vw,11.5px);
    letter-spacing:.24em;text-transform:uppercase;color:rgba(13,19,22,.52);
  }
  #hdr .cell{display:flex;flex-direction:column;gap:.45em;min-width:0}
  #hdr .cell.mid{text-align:center;align-items:center;flex:1 1 auto}
  #hdr .cell.right{text-align:right;align-items:flex-end}
  #hdr b{font-weight:700;color:rgba(13,19,22,.72);letter-spacing:.16em}
  #sname{
    font-family:var(--sans);font-weight:800;font-size:clamp(11px,1.16vw,17px);
    letter-spacing:.1em;color:rgba(13,19,22,.8);text-transform:none;
    max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #sart{
    font-family:var(--mono);font-size:clamp(8px,.7vw,11px);letter-spacing:.2em;
    color:rgba(13,19,22,.42);max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #stamp{
    border:1px solid rgba(122,58,40,.5);color:rgba(122,58,40,.72);
    padding:.32em .6em .28em;transform:rotate(-1.6deg);letter-spacing:.18em;
    font-size:clamp(7px,.66vw,10px);white-space:nowrap;
  }
  #hdr .bar{display:inline-block;width:34px;height:5px;background:
    repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 4px);opacity:.5}

  /* ---------- 歌词带：唯一被保护的区域 ---------- */
  #band{
    position:absolute;left:var(--pad);right:calc(var(--pad) + 21vw);
    top:27vh;bottom:20vh;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(6px,1.5vh,18px);
  }
  #plate{
    position:absolute;left:calc(clamp(8px,1.6vw,30px) * -1);right:-2.5vw;top:-3.2vh;bottom:-3.2vh;
    background:
      radial-gradient(circle at 1px 1px, rgba(112,134,145,.20) 1px, transparent 1.5px) 0 0/7px 7px,
      var(--paper-hi);
    clip-path:polygon(1% 3%,14% 0.4%,29% 2.2%,43% 0.2%,57% 2.6%,71% 0.6%,85% 2.4%,99% 0.8%,99.6% 22%,98.6% 46%,99.8% 68%,98.8% 88%,99.4% 99%,86% 98.2%,72% 99.8%,58% 98%,44% 99.6%,30% 97.8%,16% 99.9%,2% 98.4%,0.6% 80%,1.6% 58%,0.3% 34%,1.2% 14%);
    opacity:.86;
  }
  #plate2{
    position:absolute;left:-3.5vw;right:1vw;top:-1.4vh;bottom:-1.1vh;
    background:var(--paper-hi);opacity:.45;transform:rotate(-.35deg);
    clip-path:polygon(2% 8%,22% 1%,41% 9%,63% 2%,82% 8%,98% 1%,97% 30%,99% 55%,96% 79%,98% 98%,76% 92%,55% 99%,33% 91%,12% 98%,1% 90%,3% 62%,0.4% 38%,2.4% 20%);
  }
  .line{position:relative;font-weight:800;letter-spacing:.012em;margin:0;word-break:break-word;overflow-wrap:anywhere;padding-left:var(--ind)}
  #lyr{position:relative;z-index:3}
  #lyr::before{
    content:"";position:absolute;left:0;top:.22em;bottom:.24em;width:2px;
    background:rgba(13,19,22,.5);
  }
  #cur{
    font-family:var(--sans);
    font-size:clamp(26px,4.5vw,74px);line-height:1.16;color:var(--ink);
    max-width:min(100%,15.5em);
  }
  #prev,#next{
    font-size:clamp(11px,1.28vw,19px);line-height:1.35;letter-spacing:.05em;
    color:var(--ink2);opacity:.42;max-width:min(100%,30em);z-index:2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #prev.off,#next.off{visibility:hidden}
  #empty{
    position:relative;z-index:3;font-family:var(--mono);padding-left:var(--ind);
    font-size:clamp(10px,1.05vw,14px);letter-spacing:.34em;color:rgba(13,19,22,.5);
    text-transform:uppercase;
  }
  #band.empty #lyr{display:none}
  #empty small{display:block;margin-top:1.1em;font-size:.86em;letter-spacing:.18em;opacity:.7}

  /* 逐字上墨 */
  .ch{display:inline-block;opacity:.13;transition:opacity 90ms linear,filter 90ms linear}
  .ch.on{opacity:1}
  .sp{display:inline-block;width:.28em}

  /* ---------- 页脚：刻度尺与时间码 ---------- */
  #ftr{
    position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(12px,2.4vh,26px);
    display:flex;align-items:flex-end;gap:clamp(10px,2vw,30px);
  }
  #rule{position:relative;flex:1 1 auto;height:16px;border-bottom:1px solid rgba(13,19,22,.34)}
  #rfill{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:rgba(13,19,22,.62)}
  #rmark{
    position:absolute;bottom:-5px;left:0;width:2px;height:9px;background:var(--accent);
    box-shadow:0 0 0 1px rgba(13,19,22,.25);
  }
  #ticks{position:absolute;inset:0;opacity:.5;background:
    repeating-linear-gradient(90deg,rgba(13,19,22,.42) 0 1px,transparent 1px 12.5%);}
  #ftr .meta{font-family:var(--mono);font-size:clamp(9px,.86vw,12.5px);letter-spacing:.16em;
    color:rgba(13,19,22,.62);white-space:nowrap;display:flex;gap:.5em;align-items:baseline}
  #ftr .meta .dim{opacity:.5}
  #ftr .sig{font-family:var(--mono);font-size:clamp(8px,.7vw,10.5px);letter-spacing:.22em;
    color:rgba(13,19,22,.34);text-transform:uppercase;white-space:nowrap}

  /* 右侧条码竖栏：纯纹理，不承载信息 */
  #rail{
    position:absolute;right:calc(var(--pad) * .52);top:25vh;bottom:23vh;
    width:clamp(16px,2.2vw,30px);opacity:.26;
    border-left:1px solid rgba(13,19,22,.5);
    background:
      repeating-linear-gradient(180deg,rgba(13,19,22,.75) 0 1px,transparent 1px 5px),
      repeating-linear-gradient(180deg,rgba(13,19,22,.45) 0 7px,transparent 7px 23px, rgba(13,19,22,.45) 23px 26px, transparent 26px 41px);
  }

  /* 角部定位标记 */
  .reg{position:absolute;width:clamp(14px,1.7vw,24px);height:clamp(14px,1.7vw,24px);opacity:.32}
  .reg::before,.reg::after{content:"";position:absolute;background:rgba(13,19,22,.8)}
  .reg::before{left:50%;top:0;width:1px;height:100%}
  .reg::after{top:50%;left:0;height:1px;width:100%}
  .reg.tl{left:calc(var(--pad) * .38);top:calc(var(--pad) * .38)}
  .reg.br{right:calc(var(--pad) * .38);bottom:calc(var(--pad) * .38)}

  @media (max-width:980px){
    #band{right:var(--pad)}
    #rail{display:none}
  }
  @media (max-width:720px){
    #hdr .cell.right{display:none}
    #band{top:22vh;bottom:19vh;right:var(--pad)}
    #cur{font-size:clamp(23px,7.4vw,40px)}
    #prev,#next{font-size:clamp(10px,2.9vw,13px)}
    #ftr .sig{display:none}
  }
  @media (max-height:520px){
    #band{top:16vh;bottom:20vh}
    #prev{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .ch{transition:none}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="ui">
  <header id="hdr">
    <div class="cell">
      <span><b>PALIMPSEST</b> / NO.322</span>
      <span class="bar"></span>
    </div>
    <div class="cell mid">
      <span id="sname"></span>
      <span id="sart"></span>
    </div>
    <div class="cell right">
      <span id="stamp">REV.03 · DO NOT OVERWRITE</span>
    </div>
  </header>

  <div id="band">
    <div id="plate2"></div>
    <div id="plate"></div>
    <div id="prev" class="line"></div>
    <div id="lyr"><div id="cur" class="line"></div></div>
    <div id="next" class="line"></div>
    <div id="empty" hidden>无歌词<small>this sheet remains blank</small></div>
  </div>

  <div id="rail" aria-hidden="true"></div>
  <footer id="ftr">
    <div id="rule"><div id="ticks"></div><div id="rfill"></div><div id="rmark"></div></div>
    <div class="meta"><span id="tc">00:00</span><span class="dim">/</span><span class="dim" id="durtc">--:--</span></div>
    <div class="sig">digital palimpsest · 18/50</div>
  </footer>
  <div class="reg tl"></div><div class="reg br"></div>
</div>
<script>
(function(){
'use strict';
var V = { lines:[], idx:-1, t:0, playing:true, dur:0, accent:[138,166,178], inited:false,
          song:{name:'',artists:''}, frames:0, js:0, err:'', rm:false };
V.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var elCur = document.getElementById('cur');
var elEmpty = document.getElementById('empty');
var elLyr = document.getElementById('lyr');

/* ---- ready：rAF 首帧发一次 + 定时兜底，且全局只发一次 ---- */
var sent = false;
function ready(){
  if (sent) return; sent = true;
  try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
}

function num(v, d){ v = +v; return isFinite(v) ? v : d; }

function fitIndex(t){
  var L = V.lines, lo = 0, hi = L.length - 1, r = -1;
  if (!L.length) return -1;
  while (lo <= hi){
    var m = (lo + hi) >> 1, mt = num(L[m] && L[m].t, 0);
    if (mt <= t + 1e-4){ r = m; lo = m + 1; } else hi = m - 1;
  }
  return r;
}

function lineText(l){
  if (!l) return '';
  if (typeof l.text === 'string') return l.text;
  if (Array.isArray(l.chars)){
    var s = '', n = Math.min(l.chars.length, 600);
    for (var i = 0; i < n; i++){ var c = l.chars[i]; s += (c && c.c != null) ? String(c.c) : ''; }
    return s;
  }
  return '';
}

var elPrev = document.getElementById('prev');
var elNext = document.getElementById('next');
var elBand = document.getElementById('band');
var elSname = document.getElementById('sname');
var elSart = document.getElementById('sart');
var builtIdx = -99, curSpans = [], curTimes = [], litCount = 0, curLen = 0;

function lineDur(l, i){
  var d = num(l.dur, 0);
  if (d > 0.08) return Math.min(30, d);
  var nx = V.lines[i + 1];
  if (nx && nx.t > l.t) return Math.min(30, nx.t - l.t);
  return Math.min(12, Math.max(1.8, lineText(l).length * 0.22));
}

/* 逐字时间：YRC 用真实字时间；LRC 按句长均分；对不齐就退回均分 */
function charTimes(l, i, n){
  var t0 = Math.max(0, num(l.t, 0));
  var d = lineDur(l, i);
  var out = new Array(n), k;
  var aligned = false;
  if (l.chars && l.chars.length){
    var j = '', q;
    for (q = 0; q < l.chars.length && j.length < 2000; q++){
      var c = l.chars[q];
      j += (c && c.c != null) ? String(c.c) : '';
    }
    if (Array.from(j).length === n) aligned = true;
  }
  for (k = 0; k < n; k++){
    if (aligned){
      var ct = num(l.chars[k] && l.chars[k].t, t0 + d * k / n);
      out[k] = Math.max(t0 - 0.4, Math.min(t0 + d + 0.6, ct));
    } else {
      out[k] = t0 + d * (n > 1 ? k / n : 0);
    }
  }
  return out;
}

function syncChars(t){
  var need = 0, i;
  while (need < curLen && curTimes[need] <= t + 0.015) need++;
  if (need === litCount) return;
  if (need > litCount){
    for (i = litCount; i < need; i++){ if (curSpans[i]) curSpans[i].classList.add('on'); }
  } else {
    for (i = need; i < litCount; i++){ if (curSpans[i]) curSpans[i].classList.remove('on'); }
  }
  litCount = need;
}

function fitLine(){
  elCur.style.fontSize = '';
  var avail = elBand.clientHeight - 6;
  if (!(avail > 40)) avail = 200;
  var ph = elPrev.classList.contains('off') ? 0 : elPrev.offsetHeight;
  var nh = elNext.classList.contains('off') ? 0 : elNext.offsetHeight;
  avail = Math.max(36, avail - ph - nh - 26);
  if (window.innerHeight < 420) avail = Math.max(36, window.innerHeight * 0.22);
  var guard = 0, fs;
  while (elCur.scrollHeight > avail && guard < 14){
    fs = parseFloat(getComputedStyle(elCur).fontSize) || 24;
    if (fs <= 13) break;
    elCur.style.fontSize = Math.max(13, fs * 0.92).toFixed(1) + 'px';
    guard++;
  }
}

function buildLine(i){
  var l = V.lines[i];
  var txt = lineText(l);
  var cps = Array.from(txt.replace(/\r/g, '').replace(/\n/g, ' '));
  if (cps.length > 380) cps = cps.slice(0, 380);
  var n = cps.length;
  curTimes = charTimes(l, i, n);
  curLen = n;
  curSpans = new Array(n);
  litCount = 0;
  elCur.textContent = '';
  var frag = document.createDocumentFragment(), k, ch, e;
  for (k = 0; k < n; k++){
    ch = cps[k];
    if (ch === ' ' || ch === '\u3000'){
      e = document.createElement('span'); e.className = 'sp';
      frag.appendChild(e); curSpans[k] = null;
    } else {
      e = document.createElement('span'); e.className = 'ch'; e.textContent = ch;
      frag.appendChild(e); curSpans[k] = e;
    }
  }
  elCur.appendChild(frag);
  builtIdx = i;
  syncChars(V.t);
  fitLine();
}

function renderLyrics(){
  if (!V.lines.length){
    elCur.textContent = '';
    curLen = 0; litCount = 0; curSpans = []; curTimes = []; builtIdx = -99;
    elPrev.classList.add('off'); elNext.classList.add('off');
    elBand.classList.add('empty');
    elEmpty.hidden = !V.inited;
    return;
  }
  elBand.classList.remove('empty');
  elEmpty.hidden = true;
  var i = V.idx < 0 ? 0 : V.idx;
  if (i >= V.lines.length) i = V.lines.length - 1;

  var p = i - 1, nx = i + 1;
  if (p >= 0){ elPrev.textContent = lineText(V.lines[p]); elPrev.classList.remove('off'); }
  else elPrev.classList.add('off');
  if (nx < V.lines.length){ elNext.textContent = lineText(V.lines[nx]); elNext.classList.remove('off'); }
  else elNext.classList.add('off');

  if (i !== builtIdx) buildLine(i); else syncChars(V.t);
}

function headMeta(){
  var n = V.song.name || 'UNTITLED';
  var a = V.song.artists || '';
  if (elSname.textContent !== n) elSname.textContent = n;
  var at = a ? ' / ' + a : '';
  if (elSart.textContent !== at) elSart.textContent = at;
}

function applyInit(p){
  p = p || {};
  V.inited = true;
  var song = p.song || {};
  V.song = { name: (song.name == null ? '' : String(song.name)).slice(0, 160),
             artists: Array.isArray(song.artists) ? song.artists.map(function(a){ return String(a == null ? '' : a); }).join(' / ')
                    : (song.artists == null ? '' : String(song.artists)).slice(0, 160) };
  V.dur = Math.max(0, num(p.duration, 0));
  var acc = Array.isArray(p.accent) ? p.accent : null;
  if (acc && acc.length >= 3){
    var na = [num(acc[0],138)|0, num(acc[1],166)|0, num(acc[2],178)|0];
    if (na[0] !== ACC[0] || na[1] !== ACC[1] || na[2] !== ACC[2]){
      ACC = na;
      try {
        // 封面主色只作为极小面积的记号色，并压回冷灰家族，避免污染整体色调
        var mr = Math.round(na[0] * 0.42 + 118 * 0.58),
            mg = Math.round(na[1] * 0.42 + 138 * 0.58),
            mb = Math.round(na[2] * 0.42 + 146 * 0.58);
        var lum = (0.299 * mr + 0.587 * mg + 0.114 * mb) / 255;
        if (lum > 0.66){ mr = (mr * 0.7) | 0; mg = (mg * 0.7) | 0; mb = (mb * 0.7) | 0; }
        document.documentElement.style.setProperty('--accent', 'rgb(' + mr + ',' + mg + ',' + mb + ')');
      } catch(e0){}
      if (baked){ try { bake(); } catch(e){} }
    }
  }
  var raw = Array.isArray(p.lines) ? p.lines : [];
  var out = [], i, l, lim = Math.min(raw.length, 4000);
  for (i = 0; i < lim; i++){
    l = raw[i];
    if (!l || typeof l !== 'object') continue;
    out.push({ t: Math.max(0, num(l.t, 0)), dur: Math.max(0, num(l.dur, 0)),
               text: typeof l.text === 'string' ? l.text : null,
               chars: Array.isArray(l.chars) ? l.chars : null });
  }
  out.sort(function(a,b){ return a.t - b.t; });
  V.lines = out;
  V.idx = fitIndex(V.t);
  builtIdx = -99;
  renderLyrics();
  headMeta();
  lastPct = -1; lastTc = '';
}

window.addEventListener('message', function(ev){
  var m = ev && ev.data;
  if (!m || m.__c100 !== 1) return;
  if (m.type === 'init'){ try { applyInit(m.payload); } catch(e){ V.err = String(e && e.message || e); } }
  else if (m.type === 'tick'){
    var p = m.payload || {};
    var t = num(p.time, V.t);
    if (t < 0) t = 0;
    V.t = t;
    if (typeof p.playing === 'boolean') V.playing = p.playing;
    var ni = fitIndex(t);
    if (ni !== V.idx){ V.idx = ni; renderLyrics(); }
    else syncChars(t);
  }
  else if (m.type === 'live'){
    var q = m.payload || {};
    if (typeof q.playing === 'boolean') V.playing = q.playing;
    GA.level = cnum(q.level, GA.level);
    GA.bass = cnum(q.bass, GA.bass);
    GA.mid = cnum(q.mid, GA.mid);
    GA.treble = cnum(q.treble, GA.treble);
  }
  else if (m.type === 'beat'){
    var b = m.payload || {};
    var lv = cnum(b.level, 0.6);
    if (!V.rm){
      T.glitch = Math.min(1.6, Math.max(T.glitch, 0.35 + lv * 0.85));
      T.flash = Math.max(T.flash, 0.35 + lv * 0.65);
    }
  }
});

/* =====================================================================
   画布：非覆盖式涂改层积（collage 烘焙一次 → 每帧只做合成与位移）
   ===================================================================== */
var cv = document.getElementById('bg');
var cx = cv.getContext('2d', { alpha:false });
var col = document.createElement('canvas'), cc = col.getContext('2d');   // 拼贴层
var ovl = document.createElement('canvas'), oc = ovl.getContext('2d');   // 网点/扫描线/暗角
var W = 1, H = 1, DPR = 1, ACC = [138,166,178], baked = false;
var GA = { level:0, bass:0, mid:0, treble:0 };
var T = { a:0, glitch:0, flash:0 };

function cnum(v, a, b){ v = +v; if (!isFinite(v)) return a; return v < a ? a : (v > b ? b : v); }
function mkRnd(seed){
  var a = seed >>> 0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function accA(a){ return 'rgba(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ',' + a + ')'; }
function inkA(a){ return 'rgba(18,30,36,' + a + ')'; }

var GLYPH = '▚▞▓▒░◤◥◣◢␀☒✕⌧▣▤▥▦▧▨▩＃＆＠％／承重禁止通行区段号透视断面层级覆盖留存·—¦⌇⌁⁙∙';

function glyphs(rnd, n){
  n = cnum(n, 1, 200) | 0;
  var s = '', i, k;
  for (i = 0; i < n; i++){ k = (rnd() * GLYPH.length) | 0; s += GLYPH.charAt(k); }
  return s;
}

/* ---------- 立交桥 / 高速残影 ---------- */
function drawInterchange(c, w, h, rnd){
  var R = Math.min(w, h) * cnum(0.26, 0.14, 0.4);
  c.save();
  c.translate(w * 0.76, h * 0.58);
  c.rotate(-0.14);

  // 两层路基（浅色堆叠，像印坏的底片）
  c.lineCap = 'butt';
  c.globalAlpha = 1;
  c.strokeStyle = 'rgba(88,110,120,.085)'; c.lineWidth = Math.max(11, R * 0.30);
  c.beginPath(); c.moveTo(-R * 2.0, 0); c.lineTo(R * 2.0, 0); c.stroke();
  c.beginPath(); c.moveTo(0, -R * 2.0); c.lineTo(0, R * 2.0); c.stroke();
  c.strokeStyle = 'rgba(232,238,239,.30)'; c.lineWidth = Math.max(7, R * 0.19);
  c.beginPath(); c.moveTo(-R * 2.0, 0); c.lineTo(R * 2.0, 0); c.stroke();
  c.beginPath(); c.moveTo(0, -R * 2.0); c.lineTo(0, R * 2.0); c.stroke();

  // 车道虚线
  c.strokeStyle = 'rgba(240,246,246,.62)'; c.lineWidth = Math.max(1, R * 0.012);
  c.setLineDash([R * 0.07, R * 0.09]);
  c.beginPath(); c.moveTo(-R * 2.0, 0); c.lineTo(R * 2.0, 0); c.stroke();
  c.beginPath(); c.moveTo(0, -R * 2.0); c.lineTo(0, R * 2.0); c.stroke();
  c.setLineDash([]);

  // 四个苜蓿叶环道
  var i, a;
  for (i = 0; i < 4; i++){
    a = i * Math.PI / 2;
    c.strokeStyle = 'rgba(70,94,104,.13)'; c.lineWidth = Math.max(8, R * 0.16);
    c.beginPath();
    c.arc(Math.cos(a) * R * 0.56, Math.sin(a) * R * 0.56, R * 0.56, a - Math.PI * 0.5, a + Math.PI * 0.5, false);
    c.stroke();
    c.strokeStyle = 'rgba(236,242,243,.34)'; c.lineWidth = Math.max(1, R * 0.014);
    c.setLineDash([R * 0.05, R * 0.08]);
    c.beginPath();
    c.arc(Math.cos(a) * R * 0.56, Math.sin(a) * R * 0.56, R * 0.56, a - Math.PI * 0.5, a + Math.PI * 0.5, false);
    c.stroke();
    c.setLineDash([]);
  }

  // 桥墩/立柱：短线
  c.strokeStyle = 'rgba(40,58,66,.10)'; c.lineWidth = Math.max(1, R * 0.02);
  for (i = 0; i < 26; i++){
    var px = (rnd() - 0.5) * R * 3.4, py = (rnd() - 0.5) * R * 3.4;
    c.beginPath(); c.moveTo(px, py); c.lineTo(px, py + R * (0.05 + rnd() * 0.1)); c.stroke();
  }
  c.restore();
}

/* ---------- 交通安全 / 航空手册剪贴图标 ---------- */
function iconWarn(c, x, y, s, a, fill){

  if (fill){ c.fillStyle = 'rgba(226,233,234,.55)'; c.fill(); }
  c.strokeStyle = 'rgba(58,78,88,' + a + ')'; c.lineWidth = 1.4 / s * 1.2;
  c.stroke();
  c.beginPath(); c.moveTo(0, -0.16); c.lineTo(0, 0.14); c.stroke();
  c.beginPath(); c.arc(0, 0.26, 0.035, 0, 6.29); c.stroke();

}
function iconPlane(c, x, y, s, a, rot, fill){

  var st = 'rgba(52,72,82,' + a + ')';

  c.lineTo(0.86, 0.3); c.lineTo(0.86, 0.46); c.lineTo(0.1, 0.28);
  c.lineTo(0.1, 0.66); c.lineTo(0.34, 0.84); c.lineTo(0.34, 0.94);
  c.lineTo(0, 0.84); c.lineTo(-0.34, 0.94); c.lineTo(-0.34, 0.84);
  c.lineTo(-0.1, 0.66); c.lineTo(-0.1, 0.28); c.lineTo(-0.86, 0.46);
  c.lineTo(-0.86, 0.3); c.lineTo(-0.1, -0.1); c.quadraticCurveTo(-0.11, -0.7, 0, -0.9);

  c.moveTo(0.02, -0.14); c.lineTo(0.32, -0.02);

/* ---------- 乱码文本块：信息过载的底噪 ---------- */
function drawGarbage(c, w, h, rnd){
  var i, j, block, fs, lines, x, y;
  for (i = 0; i < 7; i++){
    x = rnd() * w; y = rnd() * h * 0.9;
    fs = 7 + rnd() * 7;
    lines = 6 + (rnd() * 22 | 0);
    c.save();
    c.translate(x, y);
    if (rnd() < 0.42) c.rotate(Math.PI / 2);
    c.font = (fs | 0) + 'px Consolas, ui-monospace, monospace';
    c.fillStyle = inkA(0.10 + rnd() * 0.09);
    c.textBaseline = 'top';
    var lh = fs * 1.26;
    for (j = 0; j < lines; j++){
      c.fillText(glyphs(rnd, 6 + rnd() * 30), 0, j * lh);
    }
    c.restore();
  }
  // 两三个极小的“字段”。工业表格感
  c.save();
  c.font = '7px Consolas, ui-monospace, monospace';
  c.fillStyle = inkA(0.22);
  var tags = ['REF.322-18', 'SHEET 03/50', 'DO NOT OVERWRITE', 'STACK LAYER 7', 'SCALE 1:1'];
  for (i = 0; i < tags.length; i++){
    c.fillText(tags[i], w * (0.06 + rnd() * 0.82), h * (0.05 + rnd() * 0.9));
  }
  c.restore();
}

/* ---------- 引线标注：指向不存在的说明 ---------- */
function drawCallouts(c, w, h, rnd){
  var labels = ['SEAT 14C', 'EXIT 3', 'JCT 07', 'LANE 2', 'REF.18/50', 'A-PORT', 'HOLD'];
  var i;
  c.save();
  c.font = '7px Consolas, ui-monospace, monospace';
  c.textBaseline = 'middle';
  for (i = 0; i < 7; i++){
    var x = w * (0.05 + rnd() * 0.9), y = h * (0.06 + rnd() * 0.86);
    var ex = x + (rnd() - 0.5) * w * 0.2, ey = y + (rnd() - 0.45) * h * 0.16;
    c.strokeStyle = inkA(0.15); c.lineWidth = 1;
    c.setLineDash([3, 4]);
    c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
    c.setLineDash([]);
    c.beginPath();
    c.moveTo(ex - 3, ey); c.lineTo(ex + 3, ey);
    c.moveTo(ex, ey - 3); c.lineTo(ex, ey + 3);
    c.stroke();
    c.save();
    c.translate(ex + 6, ey - 5);
    if (rnd() < 0.4) c.rotate(Math.PI / 2);
    c.fillStyle = inkA(0.24);
    c.fillText(labels[i % labels.length], 0, 0);
    c.restore();
  }
  c.restore();
}

/* ---------- 胶带 / 半透明贴条 ---------- */
function drawTape(c, w, h, rnd){
  var i;
  for (i = 0; i < 3; i++){
    var tw = w * (0.10 + rnd() * 0.18), th = h * (0.018 + rnd() * 0.03);
    c.save();
    c.translate(rnd() * w, rnd() * h);
    c.rotate((rnd() - 0.5) * 0.9);
    c.globalAlpha = 0.34;
    c.fillStyle = '#eff3f3';
    c.fillRect(-tw / 2, -th / 2, tw, th);
    c.globalAlpha = 0.22;
    c.strokeStyle = inkA(1); c.lineWidth = 1;
    c.strokeRect(-tw / 2, -th / 2, tw, th);
    c.globalAlpha = 0.16;
    c.fillStyle = '#ffffff';
    c.fillRect(-tw / 2 + 3, -th / 2 + 2, tw - 6, th * 0.24);
    c.restore();
  }
}

/* ---------- 涂改液：不透明覆盖，粗暴地压住下层 ---------- */
function drawWhiteout(c, w, h, rnd){
  var i, k, x, y, n = 9;
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (i = 0; i < n; i++){
    x = rnd() * w; y = rnd() * h;
    var lw = 16 + rnd() * 74;
    c.globalAlpha = 0.62 + rnd() * 0.33;
    c.strokeStyle = '#e4eaea';
    c.lineWidth = lw;
    c.beginPath(); c.moveTo(x, y);
    for (k = 0; k < 3; k++){
      x += (rnd() - 0.35) * w * 0.16;
      y += (rnd() - 0.55) * h * 0.09;
      c.lineTo(x, y);
    }
    c.stroke();
    // 笔刷边缘的干痕
    c.globalAlpha = 0.13; c.strokeStyle = 'rgba(30,46,54,1)'; c.lineWidth = 1;
    c.stroke();
    // 顺着笔势的细刮痕
    c.globalAlpha = 0.10; c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(1, lw * 0.12);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + (rnd() - 0.5) * 60, y + (rnd() - 0.5) * 26); c.stroke();
  }
  // 两块硬边的方涂改
  for (i = 0; i < 2; i++){
    var bw = w * (0.10 + rnd() * 0.16), bh = h * (0.02 + rnd() * 0.045);
    c.globalAlpha = 0.78;
    c.fillStyle = '#e7ecec';
    c.save();
    c.translate(rnd() * w, rnd() * h);
    c.rotate((rnd() - 0.5) * 0.06);
    c.fillRect(-bw / 2, -bh / 2, bw, bh);
    c.globalAlpha = 0.16; c.strokeStyle = inkA(1); c.lineWidth = 1;
    c.strokeRect(-bw / 2, -bh / 2, bw, bh);
    c.restore();
  }
  c.restore();
}

/* ---------- 半透明色块：层积的一层 ---------- */
function drawPatches(c, w, h, rnd){
  var i;
  c.save();
  c.globalCompositeOperation = 'multiply';
  for (i = 0; i < 4; i++){
    c.globalAlpha = 0.06 + rnd() * 0.07;
    c.fillStyle = i % 2 ? accA(0.9) : 'rgba(74,96,108,0.9)';
    c.save();
    c.translate(rnd() * w, rnd() * h);
    c.rotate((rnd() - 0.5) * 0.5);
    c.fillRect(-w * (0.06 + rnd() * 0.22), -h * (0.03 + rnd() * 0.10), w * (0.12 + rnd() * 0.4), h * (0.06 + rnd() * 0.2));
    c.restore();
  }
  c.restore();
}

/* ---------- 烘焙 ---------- */
function bake(){
  var w = W, h = H, rnd = mkRnd(322);
  cc.setTransform(DPR, 0, 0, DPR, 0, 0);
  cc.globalAlpha = 1; cc.globalCompositeOperation = 'source-over';

  var g = cc.createLinearGradient(w * 0.05, 0, w * 0.95, h);
  g.addColorStop(0, '#d2dadc');
  g.addColorStop(0.42, '#c7d0d4');
  g.addColorStop(0.72, '#bcc7cc');
  g.addColorStop(1, '#b0bcc2');
  cc.fillStyle = g; cc.fillRect(0, 0, w, h);

  // 冷光晕（出血感）
  var rg = cc.createRadialGradient(w * 0.68, h * 0.34, 0, w * 0.68, h * 0.34, Math.max(w, h) * 0.62);
  rg.addColorStop(0, 'rgba(226,236,238,.55)');
  rg.addColorStop(0.55, 'rgba(206,218,222,.10)');
  rg.addColorStop(1, 'rgba(120,138,148,.16)');
  cc.fillStyle = rg; cc.fillRect(0, 0, w, h);

  drawInterchange(cc, w, h, rnd);
  drawPatches(cc, w, h, rnd);
  drawGarbage(cc, w, h, rnd);

  // 剪贴风格的图标：贴在下层之上，像从别处剪下来粘上去的
  var S = Math.min(w, h);
  iconPlane(cc, w * 0.30, h * 0.885, S * 0.10, 0.26, -0.35, true);
  iconSeat(cc, w * 0.935, h * 0.70, S * 0.075, 0.22);
  iconWarn(cc, w * 0.135, h * 0.215, S * 0.095, 0.26, true);
  iconNoEntry(cc, w * 0.905, h * 0.165, S * 0.05, 0.24);
  iconExit(cc, w * 0.052, h * 0.60, S * 0.07, 0.20);
  iconWarn(cc, w * 0.74, h * 0.115, S * 0.04, 0.20);
  iconPlane(cc, w * 0.55, h * 0.095, S * 0.034, 0.18, 0.7);

  drawCallouts(cc, w, h, rnd);
  drawTape(cc, w, h, rnd);
  drawWhiteout(cc, w, h, rnd);

  // 纸面颗粒
  var dots = Math.min(9000, Math.max(400, (w * h) / 900)) | 0, i;
  cc.save();
  for (i = 0; i < dots; i++){
    cc.globalAlpha = 0.03 + rnd() * 0.06;
    cc.fillStyle = rnd() < 0.5 ? '#ffffff' : '#5c727c';
    cc.fillRect(rnd() * w, rnd() * h, 1, 1);
  }
  cc.restore();

  // 边缘配准角标 / 刻度
  cc.save();
  cc.strokeStyle = inkA(0.30); cc.lineWidth = 1;
  for (i = 0; i < 22; i++){
    var ty = h * 0.3 + i * 9;
    cc.beginPath(); cc.moveTo(w - 9, ty); cc.lineTo(w - 9 + (i % 5 === 0 ? 7 : 3), ty); cc.stroke();
  }
  cc.restore();

  // 印刷定位框（向内缩进的一圈极细线）
  cc.save();
  cc.strokeStyle = inkA(0.12); cc.lineWidth = 1;
  cc.setLineDash([2, 6]);
  cc.strokeRect(w * 0.022, h * 0.028, w * 0.956, h * 0.944);
  cc.setLineDash([]);
  var cm = Math.min(w, h) * 0.022, cpos = [[w * 0.022, h * 0.028], [w * 0.978, h * 0.972]];
  for (i = 0; i < 2; i++){
    var px0 = cpos[i][0], py0 = cpos[i][1];
    cc.beginPath();
    cc.moveTo(px0 - cm, py0); cc.lineTo(px0 + cm, py0);
    cc.moveTo(px0, py0 - cm); cc.lineTo(px0, py0 + cm);
    cc.stroke();
  }
  cc.restore();

  // 左缘竖排标签
  cc.save();
  cc.translate(w * 0.036, h * 0.5);
  cc.rotate(-Math.PI / 2);
  cc.font = '8px Consolas, ui-monospace, monospace';
  cc.fillStyle = inkA(0.20);
  cc.fillText('PLAYBACK SHEET  ·  LAYER 07  ·  18/50  ·  DO NOT OVERWRITE', 0, 0);
  cc.restore();

  // 覆盖层：网点 + 扫描线 + 暗角（另存，每帧叠）
  oc.setTransform(DPR, 0, 0, DPR, 0, 0);
  oc.clearRect(0, 0, w, h);
  oc.fillStyle = inkA(1);
  var step = 3;
  for (i = 0; i < h; i += step){
    oc.globalAlpha = 0.035;
    oc.fillRect(0, i, w, 1);
  }
  oc.globalAlpha = 1;
  var vg = oc.createRadialGradient(w * 0.5, h * 0.48, Math.min(w, h) * 0.25, w * 0.5, h * 0.48, Math.max(w, h) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(24,38,46,.30)');
  oc.fillStyle = vg; oc.fillRect(0, 0, w, h);
  // 网点（只在右上角一片，克制使用）
  var hx = w * 0.66, hy = 0, hw = w * 0.34, hh = h * 0.4;
  oc.fillStyle = 'rgba(40,58,68,.55)';
  var gs = 9, rr;
  for (var yy = hy; yy < hy + hh; yy += gs){
    for (var xx = hx; xx < hx + hw; xx += gs){
      var f = 1 - ((xx - hx) / hw) * 0.7 - ((yy - hy) / hh) * 0.55;
      rr = Math.max(0, f) * 1.55;
      if (rr > 0.18){ oc.globalAlpha = 0.30; oc.beginPath(); oc.arc(xx, yy, rr, 0, 6.283); oc.fill(); }
    }
  }
  oc.globalAlpha = 1;
  baked = true;
}

function resize(){
  var w = Math.round(cv.clientWidth || window.innerWidth || 0);
  var h = Math.round(cv.clientHeight || window.innerHeight || 0);
  if (!(w > 0) || !isFinite(w)) w = 1200;
  if (!(h > 0) || !isFinite(h)) h = 800;
  w = cnum(w, 320, 3800); h = cnum(h, 240, 2200);
  DPR = cnum(window.devicePixelRatio || 1, 1, 2);
  var maxPx = 3600000;
  if (w * h * DPR * DPR > maxPx) DPR = Math.sqrt(maxPx / (w * h));
  DPR = cnum(DPR, 0.75, 2);
  W = w; H = h;
  cv.width = Math.max(1, Math.round(w * DPR));
  cv.height = Math.max(1, Math.round(h * DPR));
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  col.width = cv.width; col.height = cv.height;
  ovl.width = cv.width; ovl.height = cv.height;
  bake();
}

var rszT = 0, animT = 0, lastFrame = 0;
function onResize(){
  clearTimeout(rszT);
  rszT = setTimeout(function(){
    try { resize(); } catch(e){ V.err = String(e && e.message || e); }
    try { if (builtIdx > -99) fitLine(); } catch(e){}
  }, 180);
}

var lastT = 0;
function loop(now){
  var t0 = performance.now();
  var dt = Math.min(64, Math.max(0, t0 - lastT)); lastT = t0;
  V.frames++;
  try { frame(dt); } catch(e){ if (!V.err) V.err = String(e && e.message || e); }
  V.js = +(performance.now() - t0).toFixed(2);
  requestAnimationFrame(loop);
}

function frame(dt){
  if (!baked) return;
  animT += dt;
  var w = W, h = H, s = DPR, i;
  var amt = T.glitch;

  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.globalCompositeOperation = 'source-over';
  cx.globalAlpha = 1;
  cx.fillStyle = '#bfc9cd';
  cx.fillRect(0, 0, w, h);

  // 缓慢视差：像纸在台面上轻轻移位
  var dx = Math.sin(animT * 0.00019) * 7;
  var dy = Math.cos(animT * 0.00013) * 5;
  if (V.rm){ dx *= 0.25; dy *= 0.25; }
  cx.drawImage(col, dx - 2, dy - 2, w + 4, h + 4);

  // 撕裂条带：从自身切片，横向错位
  if (amt > 0.02 && !V.rm){
    var r = mkRnd((animT * 0.37) | 0);
    var n = 1 + (amt > 0.55 ? 2 : 0);
    for (i = 0; i < n; i++){
      var yy = r() * h, hh = 3 + r() * (10 + amt * 34);
      var off = (r() - 0.5) * (16 + amt * 150);
      var sy = Math.max(0, Math.min(col.height - 1, yy * s));
      var sh = Math.max(1, Math.min(col.height - sy, hh * s));
      cx.drawImage(col, 0, sy, col.width, sh, off, yy, w, hh);
      if (amt > 0.5){
        cx.globalAlpha = 0.22 * amt;
        cx.fillStyle = accA(1);
        cx.fillRect(0, yy, w, hh * 0.5);
        cx.globalAlpha = 1;
      }
    }
  }

  // 漂移的乱码行：信息底噪，永远在动
  if (MARQ.length){
    cx.save();
    cx.font = '10px Consolas, ui-monospace, monospace';
    cx.textBaseline = 'middle';
    var spd = V.rm ? 0 : animT * 0.013;
    for (i = 0; i < MARQ.length; i++){
      var y = h * (i === 0 ? 0.115 : (i === 1 ? 0.155 : 0.905));
      var offx = ((spd * (i ? -1.7 : 1) + i * 340) % 900 + 900) % 900;
      cx.globalAlpha = 0.11 + 0.03 * GA.mid;
      cx.fillStyle = inkA(1);
      cx.fillText(MARQ[i], offx - 900, y);
      cx.fillText(MARQ[i], offx, y);
    }
    cx.restore();
  }

  // 网点 / 扫描线 / 暗角
  cx.globalAlpha = 1;
  cx.drawImage(ovl, 0, 0, w, h);

  // 节拍落笔：一次性白闪
  if (T.flash > 0.01){
    cx.globalAlpha = Math.min(0.5, T.flash * 0.22);
    cx.fillStyle = '#eef3f3';
    cx.fillRect(0, 0, w, h);
    cx.globalAlpha = 1;
  }

  T.glitch *= 0.90;
  T.flash *= 0.86;
  if (T.glitch < 0.004) T.glitch = 0;

  beatUI();
  paintMeta();
}

/* ---- 页脚 / 进度 ---- */
var elTc = document.getElementById('tc'), elDur = document.getElementById('durtc');
var elFill = document.getElementById('rfill'), elMark = document.getElementById('rmark');
var lastPct = -1, lastTc = '';

function fmt(sec){
  sec = cnum(sec, 0, 359999);
  var m = Math.floor(sec / 60), ss = Math.floor(sec % 60);
  return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
}

function paintMeta(){
  var tc = fmt(V.t);
  if (tc !== lastTc){ elTc.textContent = tc; lastTc = tc; }
  var d = V.dur > 0 ? fmt(V.dur) : '--:--';
  if (elDur.textContent !== d) elDur.textContent = d;
  var pct = V.dur > 0 ? Math.max(0, Math.min(1, V.t / V.dur)) : 0;
  if (Math.abs(pct - lastPct) > 0.0012){
    lastPct = pct;
    elFill.style.width = (pct * 100).toFixed(2) + '%';
    elMark.style.left = (pct * 100).toFixed(2) + '%';
  }
}

var MARQ = [];

/* 节拍对 DOM 的影响刻意克制：只有刻度标记在呼吸，字不抖 */
var markOp = -1;
function beatUI(){
  var lv = cnum(GA.level, 0) * 0.5 + cnum(GA.bass, 0) * 0.5;
  var o = 0.55 + lv * 0.45;
  if (Math.abs(o - markOp) > 0.06){ markOp = o; elMark.style.opacity = o.toFixed(2); }
}

window.__stage = function(){
  var l = V.lines[V.idx] || null;
  return { lines: V.lines.length, idx: V.idx, t: +V.t.toFixed(3), playing: !!V.playing,
           frames: V.frames, js: V.js, err: V.err,
           text: l ? lineText(l) : '', gl: false, rm: !!V.rm };
};

var r1 = mkRnd(7717), r2 = mkRnd(8819), r3 = mkRnd(99103);
MARQ = [glyphs(r1, 130), glyphs(r2, 170), glyphs(r3, 100)];
try { resize(); } catch(e){ V.err = String(e && e.message || e); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

renderLyrics();
requestAnimationFrame(function(){
  ready();
  lastT = performance.now();
  V.frames++;
  try { frame(16); } catch(e){ V.err = String(e && e.message || e); }
  requestAnimationFrame(loop);
});
setTimeout(ready, 60);
})();
</script>
