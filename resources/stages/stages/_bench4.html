<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head><body>
<canvas id="c" width="1440" height="810"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
const W=1440,H=810;
const N=5200;
const sx=new Float32Array(N),sy=new Float32Array(N);
for(let i=0;i<N;i++){sx[i]=150+(i*0.2117%1130); sy[i]=235+(i*0.3771%320);}
const half=document.createElement('canvas'); half.width=720; half.height=405;
{const g=half.getContext('2d');g.fillStyle='#0a0c12';g.fillRect(0,0,720,405);
 g.fillStyle='#16233a';g.fillRect(0,240,720,160);}
const full=document.createElement('canvas'); full.width=W; full.height=H;
{const g=full.getContext('2d');g.fillStyle='#0a0c12';g.fillRect(0,0,W,H);
 g.fillStyle='#16233a';g.fillRect(0,480,W,330);}
const flush=()=>ctx.getImageData(0,0,1,1);
function bench(name,fn,iters){
  fn();fn();flush();
  const t0=performance.now();
  for(let k=0;k<iters;k++){fn();flush();}
  console.log(name.padEnd(50)+((performance.now()-t0)/iters).toFixed(2)+' ms');
}
bench('0 只填底',()=>{ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);},12);
bench('1 half→W,H 平滑开',()=>{ctx.imageSmoothingEnabled=true;ctx.drawImage(half,0,0,W,H);},12);
bench('2 half→W,H 平滑关',()=>{ctx.imageSmoothingEnabled=false;ctx.drawImage(half,0,0,W,H);},12);
bench('3 全尺寸 1:1 blit',()=>{ctx.drawImage(full,0,0);},12);
bench('4 全尺寸 1:1 + 填底',()=>{ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);ctx.drawImage(full,0,0);},12);
bench('5 半尺寸居中 1:1 blit',()=>{ctx.drawImage(half,0,0);},12);
// needle height scaling
function needles(n,h,w,label){
  bench(label,()=>{ctx.fillStyle='rgba(140,170,210,.42)';ctx.beginPath();
    for(let i=0;i<n;i++){ctx.rect(sx[i],sy[i]+4,w,h);}ctx.fill();},12);
}
needles(5200,6,1.3,'N 5200针 h=6');
needles(5200,12,1.3,'N 5200针 h=12');
needles(5200,20,1.3,'N 5200针 h=20');
needles(5200,30,1.3,'N 5200针 h=30');
needles(2600,30,1.3,'N 2600针 h=30');
needles(1300,30,2.2,'N 1300针 h=30');
needles(1300,44,2.2,'N 1300针 h=44');
needles(900,44,2.6,'N  900针 h=44');
needles(900,60,2.6,'N  900针 h=60');
// tips
bench('T1 尖5200 3.2px',()=>{ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]-1.6,sy[i]-1.6,3.2,3.2);}ctx.fill();},12);
bench('T2 尖2600 3.2px',()=>{ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
  for(let i=0;i<N;i+=2){ctx.rect(sx[i]-1.6,sy[i]-1.6,3.2,3.2);}ctx.fill();},12);
bench('T3 尖5200 2.6px',()=>{ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]-1.3,sy[i]-1.3,2.6,2.6);}ctx.fill();},12);
</script></body></html>
