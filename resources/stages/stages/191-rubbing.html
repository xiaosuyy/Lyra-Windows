<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拓印</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
       background:radial-gradient(132% 108% at 50% 48%,transparent 38%,rgba(2,4,8,.50) 74%,rgba(1,2,5,.92))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(150,205,220,.32);letter-spacing:.10em;pointer-events:none;transition:opacity .6s}

</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   209 · 拓印 —— 字是被一拍一拍拍出来的，不是画出来的
   ----------------------------------------------------------------------------
   机制一句话：从字身采 5000 个墨点（每 3 个 device px 取一个），按句内时间排序，
   **拓包**逐点拍下去，每一拍在纸上留下一个毛边墨斑，墨斑在**跨帧保留的墨层**上
   一层压一层累积 —— 所以字不是每帧重画的，它是"被拍满"的；上一句的墨痕还留在
   纸上（残拓 0.16），纸有 1400 根纤维和石面的斑驳。

   与已有形态的边界：001/004/005 是粒子**聚成字**（粒子是对象，字是目标）；
   003/010 是光的散点；203 是**网屏**（规则网点、每帧重画）。这里是
   **墨的累积**（随机落点 + 持久缓冲），拍不到的地方就是没有墨。

   做精的地方：
     ① 墨点按 onsetOf 排序 —— 唱到哪个字，墨就拍到哪个字，拖进度条会重拍；
     ② 墨层是独立的 canvas，跨帧累积；换句时整层转成"残拓"再清空；
     ③ 三个不规则墨斑贴图轮换 + 抖 2.6px，边缘才会毛；每 64 拍荡一圈压印环；
     ④ 拓包（可见的那只手）追着最后落点走，带布纹和冷色高光边；
     ⑤ 无歌词：一张空纸，三块很淡的墨晕随呼吸晕开。
   ========================================================================== */

/* ============================================================================
   A 组公共骨架（构建期拼进每个形态的 <script> 里，不是外部依赖）
   ----------------------------------------------------------------------------
   机制文件需要实现（可选，缺省是空实现）：
     mechInit()                 脚本加载后一次
     mechResize()               resize 之后（W/H/DPR/SS 已更新）
     mechBuild(i) -> kit        换句预烘；返回该句要用的数据（可以在 i<0 时返回 null）
     mechCommit(kit)            切到这一句
     mechSeek()                 拖进度条：清状态
     mechUpdate(dt, T)          每帧物理（暂停时 dt = 0）
     mechDraw(T)                每帧绘制（背景已画好）
     mechEmpty(T)               无歌词 / 还没到第一句时的纯音频视觉
     mechChrome(T)              叠加本形态自己的文字（在通用角标之前画）
     mechStats()                额外塞进 window.__stage() 的字段
   机制文件还可以定义：
     const META = { label, sub, right, footer, cross, grid, song, ticks }
   ----------------------------------------------------------------------------
   骨架保证的四条纪律（每个形态都免费拿到，机制不用自己写）：
     · 空歌词   init 里 lines=[] → cur 永远是 null → 只走 mechEmpty()，不崩不空白
     · resize   W/H/DPR/SS 更新后重烘当前句；重建失败保留旧图，不黑屏
     · 减少动态 matchMedia 实时监听（不是启动时读一次），机制里读 RM 即得当前值
     · 暂停冻结 t 不再前进 → dt=0，mechUpdate 不再积分；画面逐字节不变
   另有 ERR 捕获：机制里任何一处抛异常，__stage().err 会变成非空（验收会红），
   而不是静默黑屏。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');

/* 机制没实现的钩子就用这些空实现（同名 function 声明后面会覆盖掉它们） */
function mechInit() { }
function mechResize() { }
function mechBuild() { return null; }
function mechCommit() { }
function mechSeek() { }
function mechUpdate() { }
function mechDraw() { }
function mechEmpty() { }
let META = { label: '', sub: '', right: '', footer: '', grid: 0, grain: 0, cross: true };

let W = 1, H = 1, MN = 1, DPR = 1, SS = 1;

/* 减少动态：实时监听（用户中途改系统设置 / 验收脚本 setEmulatedMedia 都能收到），
   不是启动时读一次 —— 机制代码里读 RM 拿到的永远是当前值。 */
const rmq = matchMedia('(prefers-reduced-motion: reduce)');
let RM = rmq.matches;
try {
  rmq.addEventListener('change', (e) => { RM = !!e.matches; });
} catch (_) {
  try { rmq.addListener((e) => { RM = !!e.matches; }); } catch (__) {}
}

/* 机制抛错不要静默：记在 ERR 里，__stage().err 非空 = 这个形态坏了 */
let ERR = '';
function fail(where, e) {
  const m = (e && e.message ? e.message : String(e || 'unknown')).slice(0, 120);
  if (!ERR) ERR = where + ': ' + m;
  try { parent.postMessage({ __c100: 1, type: 'error', payload: { message: ERR } }, '*'); } catch (_) {}
}
function guard(where, fn, fallback) {
  try { return fn(); } catch (e) { fail(where, e); return fallback; }
}

/* 主色：只允许"主色 + 近白"两种强调色，饱和度压下来（不要彩虹） */
let ACC = [140, 208, 222];
function setAccent(a) {
  if (Array.isArray(a) && a.length >= 3) {
    const r = Math.max(0, Math.min(255, a[0] | 0));
    const g = Math.max(0, Math.min(255, a[1] | 0));
    const b = Math.max(0, Math.min(255, a[2] | 0));
    const mx = Math.max(r, g, b) || 1;
    const k = 0.66 / mx;
    ACC = [
      Math.round(r * k + 158 * (1 - k)),
      Math.round(g * k + 198 * (1 - k)),
      Math.round(b * k + 212 * (1 - k))
    ];
  }
}
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const mixc = (a, b, t) => [
  Math.round(a[0] + (b[0] - a[0]) * t),
  Math.round(a[1] + (b[1] - a[1]) * t),
  Math.round(a[2] + (b[2] - a[2]) * t)
];
const FONT = (w, s) => w + ' ' + s + 'px "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';

/* ---------------------------- 画布 / 底色 ---------------------------- */
let bgGrad = null, glowGrad = null, grainPat = null;
function bakeGrain() {
  const n = 128;
  const c = document.createElement('canvas');
  c.width = n; c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  const d = img.data;
  for (let i = 0; i < n * n; i++) {
    const v = 128 + (Math.random() - 0.5) * 96;
    d[i * 4] = v; d[i * 4 + 1] = v; d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return ctx.createPattern(c, 'repeat');
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  MN = Math.min(W, H);
  SS = Math.max(1, Math.min(2, DPR));
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#05080d');
  bgGrad.addColorStop(0.5, '#04060a');
  bgGrad.addColorStop(1, '#020406');
  glowGrad = ctx.createRadialGradient(W * 0.5, H * 0.48, 0, W * 0.5, H * 0.48, MN * 0.92);
  glowGrad.addColorStop(0, rgba(ACC, 0.055));
  glowGrad.addColorStop(0.55, rgba(ACC, 0.014));
  glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  if (!grainPat) grainPat = bakeGrain();
  guard('resize', mechResize);
}

/* 网格 / 颗粒：形态可以只用其中一层 */
const GRID_STEP = 72;
function drawBackdrop(T) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad || '#04060a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = glowGrad || 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, W, H);
  if (META.grid) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += GRID_STEP) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += GRID_STEP) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.strokeStyle = rgba(ACC, META.grid);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  if (META.grain && grainPat) {
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = META.grain;
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------- 字形工具 ---------------------------- */
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

function wrapRows(text, maxChars) {
  const chars = Array.from(text || '');
  if (chars.length <= maxChars) return [text || ''];
  const R = Math.ceil(chars.length / maxChars);
  const per = Math.ceil(chars.length / R);
  const out = [];
  for (let i = 0; i < chars.length; i += per) out.push(chars.slice(i, i + per).join(''));
  return out;
}
function measureRows(rows, fs, weight) {
  octx.font = FONT(weight || 800, fs);
  let w = 0;
  for (let i = 0; i < rows.length; i++) {
    const m = octx.measureText(rows[i]).width;
    if (m > w) w = m;
  }
  return w;
}
function fitFont(rows, maxW, maxFs, weight) {
  let fs = maxFs;
  const w = measureRows(rows, fs, weight);
  if (w > maxW) fs = Math.max(18, fs * (maxW / w));
  return fs;
}
/* 把字画成一张白色遮罩（device px = CSS × SS） */
function maskCanvas(rows, fs, lh, cw, chh, weight, align) {
  const m = document.createElement('canvas');
  m.width = Math.max(2, Math.ceil(cw * SS));
  m.height = Math.max(2, Math.ceil(chh * SS));
  const g = m.getContext('2d', { willReadFrequently: true });
  g.setTransform(SS, 0, 0, SS, 0, 0);
  g.font = FONT(weight || 800, fs);
  g.textAlign = align || 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  const ax = align === 'left' ? 0 : cw / 2;
  for (let r = 0; r < rows.length; r++) g.fillText(rows[r], ax, (r + 0.5) * lh);
  return m;
}
function tintMask(mcv, col) {
  const c = document.createElement('canvas');
  c.width = mcv.width; c.height = mcv.height;
  const g = c.getContext('2d');
  g.drawImage(mcv, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = col;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
/* 渐变实心字：上白下淡主色 */
function bakeCore(mcv, top, bottom) {
  const c = document.createElement('canvas');
  c.width = mcv.width; c.height = mcv.height;
  const g = c.getContext('2d');
  g.drawImage(mcv, 0, 0);
  g.globalCompositeOperation = 'source-in';
  const grd = g.createLinearGradient(0, 0, 0, c.height);
  grd.addColorStop(0, top || '#ffffff');
  grd.addColorStop(0.45, '#f4fbff');
  grd.addColorStop(0.84, '#dceef6');
  grd.addColorStop(1, bottom || rgba([Math.min(255, ACC[0] + 90), Math.min(255, ACC[1] + 40), Math.min(255, ACC[2] + 26)], 1));
  g.fillStyle = grd;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
function bakeHalo(mcv, blurPx, scale) {
  const sc = scale || 0.5;
  const t = document.createElement('canvas');
  t.width = Math.max(2, Math.round(mcv.width * sc));
  t.height = Math.max(2, Math.round(mcv.height * sc));
  const g = t.getContext('2d');
  g.filter = 'blur(' + (blurPx || 5) + 'px)';
  g.drawImage(mcv, 0, 0, t.width, t.height);
  g.filter = 'none';
  return t;
}

/* 两遍 chamfer 距离变换（4 邻 + 对角，权重 1 / √2） */
function edt(gw, gh, target, d) {
  const INF = 1e8, A = 1, B = Math.SQRT2;
  for (let j = 0; j < gh; j++) {
    const row = j * gw;
    for (let i = 0; i < gw; i++) d[row + i] = target[row + i] ? 0 : INF;
  }
  for (let j = 0; j < gh; j++) {
    const row = j * gw;
    for (let i = 0; i < gw; i++) {
      const k = row + i;
      let v = d[k];
      if (i > 0) { const t = d[k - 1] + A; if (t < v) v = t; }
      if (j > 0) {
        let t = d[k - gw] + A; if (t < v) v = t;
        if (i > 0) { t = d[k - gw - 1] + B; if (t < v) v = t; }
        if (i < gw - 1) { t = d[k - gw + 1] + B; if (t < v) v = t; }
      }
      d[k] = v;
    }
  }
  for (let j = gh - 1; j >= 0; j--) {
    const row = j * gw;
    for (let i = gw - 1; i >= 0; i--) {
      const k = row + i;
      let v = d[k];
      if (i < gw - 1) { const t = d[k + 1] + A; if (t < v) v = t; }
      if (j < gh - 1) {
        let t = d[k + gw] + A; if (t < v) v = t;
        if (i < gw - 1) { t = d[k + gw + 1] + B; if (t < v) v = t; }
        if (i > 0) { t = d[k + gw - 1] + B; if (t < v) v = t; }
      }
      d[k] = v;
    }
  }
}
function blurField(src, gw, gh, passes) {
  let a = src, b = new Float32Array(src.length);
  for (let p = 0; p < passes; p++) {
    for (let j = 0; j < gh; j++) {
      const row = j * gw;
      const up = j > 0 ? row - gw : row;
      const dn = j < gh - 1 ? row + gw : row;
      for (let i = 0; i < gw; i++) {
        const l = i > 0 ? i - 1 : i, r = i < gw - 1 ? i + 1 : i;
        b[row + i] = (a[up + l] + a[up + i] + a[up + r] +
                      a[row + l] + a[row + i] + a[row + r] +
                      a[dn + l] + a[dn + i] + a[dn + r]) / 9;
      }
    }
    const t = a; a = b; b = t;
  }
  return a;
}

/* Marching squares：抽等值线段（塞进 out，不做连线） */
const MS_TABLE = {
  1: [3, 0], 2: [0, 1], 3: [3, 1], 4: [1, 2], 5: [3, 0, 1, 2], 6: [0, 2],
  7: [3, 2], 8: [2, 3], 9: [0, 2], 10: [0, 1, 2, 3], 11: [1, 2],
  12: [1, 3], 13: [0, 1], 14: [3, 0], 15: []
};
function isoLines(sd, gw, gh, level, out) {
  for (let j = 0; j < gh - 1; j++) {
    const r0 = j * gw, r1 = r0 + gw;
    for (let i = 0; i < gw - 1; i++) {
      const a = sd[r0 + i], b = sd[r0 + i + 1], c = sd[r1 + i + 1], d = sd[r1 + i];
      let idx = 0;
      if (a > level) idx |= 1;
      if (b > level) idx |= 2;
      if (c > level) idx |= 4;
      if (d > level) idx |= 8;
      if (idx === 0 || idx === 15) continue;
      const t1 = (level - a) / (b - a), t2 = (level - b) / (c - b);
      const t3 = (level - c) / (d - c), t4 = (level - d) / (a - d);
      const P = [i + t1, j, i + 1, j + t2, i + t3, j + 1, i, j + t4];
      const e = MS_TABLE[idx];
      for (let q = 0; q < e.length; q += 2) {
        out.push(P[e[q] * 2], P[e[q] * 2 + 1], P[e[q + 1] * 2], P[e[q + 1] * 2 + 1]);
      }
    }
  }
}

/* ---------------------------- 歌词时序 ---------------------------- */
let lines = [];
let cur = null, curIdx = -1, brewIdx = -1, prep = null, lastT = -1;
let lineAt = 0, kick = 0, lastBuild = 0;
let clockT = 0, clockAt = 0, playing = false, lastTickAt = 0;
let frames = 0, ready = false, T = 0;
let songTitle = '', songArtist = '';

const nowT = () => clockT + ((playing && performance.now() - lastTickAt < 1000) ? (performance.now() - clockAt) / 1000 : 0);
const isLive = () => playing && (performance.now() - lastTickAt < 1000);

/* 每个字的起唱时刻：chars 逐字可信才用 YRC，否则按句长均分 */
function onsetOf(line, k, n) {
  const ch = line && line.chars;
  if (ch && ch.length === n && ch[k] && typeof ch[k].t === 'number') return ch[k].t;
  const dur = (line && line.dur) || 4;
  return ((line && line.t) || 0) + (k / Math.max(1, n)) * dur * 0.85;
}

function timing(t) {
  if (!lines.length) {
    if (cur) { cur = null; curIdx = -1; mechSeek(); }
    return;
  }
  const jump = (t < lastT - 0.6) || (t > lastT + 2.0);
  if (jump) {
    cur = null; curIdx = -1; brewIdx = -1; prep = null; kick = 0;
    mechSeek();
    hint.style.opacity = '1';
    hint.textContent = '等待第一句…';
  }
  lastT = t;
  let ci = curIdx;
  while (ci + 1 < lines.length && t >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    const t0 = performance.now();
    const kit = (prep && prep.i === ci) ? prep.kit : guard('build', () => mechBuild(ci), null);
    lastBuild = performance.now() - t0;
    prep = null;
    if (ci >= 0) {
      cur = kit;
      lineAt = t;
      kick = Math.max(kick, 0.4);
      hint.style.opacity = '0';
      guard('commit', () => mechCommit(kit));
    } else {
      cur = null;
    }
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(1.2, Math.max(0.35, gap * 0.45));
    if (t >= lines[nx].t - lead) { brewIdx = nx; prep = { i: nx, kit: guard('prep', () => mechBuild(nx), null) }; }
  }
}

/* ---------------------------- 交互 ---------------------------- */
let ptrX = -999, ptrY = -999, ptrIn = false, ptrDown = false;
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', (e) => { ptrX = e.clientX; ptrY = e.clientY; ptrIn = true; ping(); }, { passive: true });
addEventListener('pointerleave', () => { ptrIn = false; }, { passive: true });
addEventListener('pointerdown', (e) => { ptrDown = true; if (typeof mechDown === 'function') mechDown(e.clientX, e.clientY); }, { passive: true });
addEventListener('pointerup', () => { ptrDown = false; }, { passive: true });
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

/* ---------------------------- 通用角标 ---------------------------- */
function drawFurniture() {
  const m = 26, L = 13;
  const c = rgba(ACC, 0.34);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = c;
  ctx.strokeStyle = c;
  ctx.lineWidth = 1;
  ctx.font = '500 10px ui-monospace,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  if (META.ticks !== false) {
  ctx.beginPath();
  ctx.moveTo(m, m + L); ctx.lineTo(m, m); ctx.lineTo(m + L, m);
  ctx.moveTo(W - m - L, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + L);
  ctx.moveTo(W - m, H - m - L); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m - L, H - m);
  ctx.moveTo(m + L, H - m); ctx.lineTo(m, H - m); ctx.lineTo(m, H - m - L);
  ctx.stroke();
  }

  ctx.fillStyle = rgba(ACC, 0.30);
  ctx.fillText(META.label || '', m + 20, m + 9);
  ctx.font = '500 8.5px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.17);
  if (META.sub) ctx.fillText(META.sub, m + 20, m + 23);
  if (META.song !== false && songTitle) {
    ctx.font = '500 9px ui-monospace,Consolas,monospace';
    ctx.fillStyle = rgba(ACC, 0.24);
    ctx.fillText(songTitle + (songArtist ? ' — ' + songArtist : ''), m + 20, m + 37);
  }
  ctx.font = '500 10px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.28);
  ctx.textAlign = 'right';
  if (META.right) ctx.fillText(META.right, W - m - 20, m + 9);
  const total = lines.length;
  const no = total && curIdx >= 0 ? String(curIdx + 1).padStart(2, '0') : '--';
  ctx.fillText(no + ' / ' + String(total || 0).padStart(2, '0'), W - m - 20, H - m - 12);
  ctx.textAlign = 'left';
  ctx.fillText(META.footer || '', m + 20, H - m - 12);

  if (META.cross !== false && ptrIn) {
    ctx.strokeStyle = rgba(ACC, 0.16);
    ctx.beginPath();
    ctx.moveTo(ptrX, 0); ctx.lineTo(ptrX, H);
    ctx.moveTo(0, ptrY); ctx.lineTo(W, ptrY);
    ctx.stroke();
    ctx.strokeStyle = rgba(ACC, 0.44);
    ctx.beginPath();
    ctx.arc(ptrX, ptrY, 4.5, 0, Math.PI * 2);
    ctx.moveTo(ptrX - 10, ptrY); ctx.lineTo(ptrX - 7, ptrY);
    ctx.moveTo(ptrX + 7, ptrY); ctx.lineTo(ptrX + 10, ptrY);
    ctx.moveTo(ptrX, ptrY - 10); ctx.lineTo(ptrX, ptrY - 7);
    ctx.moveTo(ptrX, ptrY + 7); ctx.lineTo(ptrX, ptrY + 10);

let raf = 0, prevMs = 0, jsMs = 0;
function frame(ms) {

  prevMs = ms;
  T = nowT();
  timing(T);
  const live = isLive();
  kick *= Math.exp(-(live ? dt : 0) * 3.4);
  /* 暂停时 dt = 0：机制里的物理不再积分，画面逐字节冻结 */
  guard('update', () => mechUpdate(live ? dt : 0, T));
  drawBackdrop(T);
  if (cur) guard('draw', () => mechDraw(T)); else guard('empty', () => mechEmpty(T));

let rzTimer = 0;
addEventListener('resize', () => {

addEventListener('message', (e) => {

    /* 父页给的是 song.name + artists[]，也兼容 title/artist 写法 */
    const sg = p.song || {};
    const ar = sg.artist || (Array.isArray(sg.artists) && sg.artists[0] && sg.artists[0].name) || '';
    songTitle = sg.title || sg.name || '';

    kick = 0;
    clockT = 0; clockAt = performance.now(); lastTickAt = 0; playing = false;

    const pl = d.payload || {};
    clockT = +pl.time || 0;
    clockAt = performance.now();

  hasLyric: !!cur,

/* ================= 机制 ================= */
/* ---------------------------------------------------------------------------
   209 · 机制实现：拓印（墨是拍上去的，一记一记累积成字）
   ------------------------------------------------------------------------- */
META = {
  label: 'RUBBING / TAKUHON',
  sub: '拓包拍墨 · 墨量累积 · 纸纤维',
  right: 'INK DAB 1.5s',
  footer: 'STONE → PAPER',
  grid: 0.010,
  grain: 0.03,
  cross: true,
  song: true
};

let paper = null;            /* 纸 + 石面纹理（烘一次） */
let ink = null, inkG = null;  /* 累积的墨（跨帧保留） */
let ghost = null, ghostG = null;
let IS = 1;                  /* 墨层的像素比 */
let sprites = null;          /* 三个墨斑贴图 */
let padX = -999, padY = -999, padR = 40;
let kInk = 0, nPts = 0, lastEl = -1;
let pulses = null;           /* 拍打冲击环（复用数组） */

function bakePaper() {
  const c = document.createElement('canvas');
  c.width = Math.round(W); c.height = Math.round(H);
  const g = c.getContext('2d');
  g.fillStyle = '#0b0b0c';
  g.fillRect(0, 0, c.width, c.height);
  /* 石面：低频斑驳 */
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 40 + Math.random() * 260;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.012 + Math.random() * 0.022;
    grd.addColorStop(0, 'rgba(160,164,170,' + a.toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  /* 纸纤维：短毛边（拓片纸是薄宣，能看见纤维） */
  for (let i = 0; i < 1400; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const a = Math.random() * Math.PI;
    const L = 4 + Math.random() * 22;
    g.strokeStyle = 'rgba(214,208,192,' + (0.006 + Math.random() * 0.020).toFixed(3) + ')';
    g.lineWidth = 0.6 + Math.random() * 0.5;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L * 0.5);
    g.stroke();
  }
  /* 纸的云斑（墨吃得不匀） */
  for (let i = 0; i < 10; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 90 + Math.random() * 300;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(200,206,210,0.016)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  return c;
}

/* 墨斑贴图：不规则的三叶团，边缘毛，落点之间会叠出深浅 */
function bakeSprites() {
  const out = [];
  for (let s = 0; s < 3; s++) {
    const n = 40;
    const c = document.createElement('canvas');
    c.width = n; c.height = n;
    const g = c.getContext('2d');
    for (let q = 0; q < 4; q++) {
      const ox = n / 2 + (Math.random() - 0.5) * 5;
      const oy = n / 2 + (Math.random() - 0.5) * 5;
      const rr = n * (0.16 + Math.random() * 0.12);
      const grd = g.createRadialGradient(ox, oy, 0, ox, oy, rr);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.62, 'rgba(255,255,255,0.80)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.arc(ox, oy, rr, 0, Math.PI * 2);
      g.fill();
    }
    /* 墨偏冷一点，和整片的主色是一个族（不是纯白，也不是彩色） */
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = rgba(mixc(ACC, [255, 255, 255], 0.62), 1);
    g.fillRect(0, 0, n, n);
    g.globalCompositeOperation = 'source-over';
    out.push(c);
  }
  return out;
}

function mechResize() {
  IS = Math.max(1, Math.round(Math.min(2, DPR)));
  paper = bakePaper();
  if (!sprites) sprites = bakeSprites();
  ink = document.createElement('canvas');
  ink.width = Math.max(2, Math.round(W * IS));
  ink.height = Math.max(2, Math.round(H * IS));
  inkG = ink.getContext('2d');
  ghost = document.createElement('canvas');
  ghost.width = ink.width; ghost.height = ink.height;
  ghostG = ghost.getContext('2d');
  kInk = 0; lastEl = -1;
  if (cur && cur.pts) { /* resize 后旧墨作废，重新开始拍 */ kInk = 0; }
}

function mechBuild(i) {
  const line = lines[i];
  if (!line || !line.text) return null;
  const rows = wrapRows(line.text, 13);
  const fs = fitFont(rows, W * 0.72, Math.min(160, H * 0.16));
  const lh = fs * 1.16;
  const cw = Math.ceil(measureRows(rows, fs)) + Math.ceil(fs * 0.20);
  const chh = Math.ceil(rows.length * lh);
  if (cw < 6) return null;
  const mcv = maskCanvas(rows, fs, lh, cw, chh);
  const data = mcv.getContext('2d', { willReadFrequently: true })
    .getImageData(0, 0, mcv.width, mcv.height).data;

  /* 每个字在整行里的横向区间（决定墨点属于哪一句的哪个字） */
  const chars = Array.from(line.text);
  const n = chars.length;
  const rowsTxt = rows;
  const charX = [];
  {
    let acc = 0;
    const totalW = measureRows(rowsTxt, fs);
    for (let k = 0; k < n; k++) {
      const w = measureRows([chars[k]], fs);
      charX.push({ x0: (cw - totalW) / 2 + acc, x1: (cw - totalW) / 2 + acc + w });
      acc += w;
    }
  }
  const dur = line.dur || 4;

  /* 采样墨点：按 device px 走，隔 3 个取一个；上限 5200 点 */
  const MW = mcv.width, MH = mcv.height;
  const cand = [];
  for (let y = 0; y < MH; y += 2) {
    for (let x = 0; x < MW; x += 2) {
      if (data[(y * MW + x) * 4 + 3] > 40) cand.push(x, y);
    }
  }
  const total = cand.length / 2;
  if (!total) return null;
  const OX = W / 2 - cw / 2, OY = H / 2 - chh / 2;   /* 字块在画布上的位置：墨点是绝对坐标 */
  const cap = Math.min(7600, total);
  const step = total / cap;
  const pts = [];
  for (let q = 0; q < cap; q++) {
    const idx = Math.min(total - 1, Math.floor(q * step + Math.random() * step));
    const px = cand[idx * 2] / SS, py = cand[idx * 2 + 1] / SS;
    /* 属于哪个字：按横向区间二分（同一行内） */
    let k = 0;
    for (let c = 0; c < n; c++) {
      if (px >= charX[c].x0 - 2 && px <= charX[c].x1 + 2) { k = c; break; }
    }
    const tOn = onsetOf(line, k, n) - (line.t || 0);
    pts.push({
      x: px + OX + (Math.random() - 0.5) * 2.4,
      y: py + OY + (Math.random() - 0.5) * 2.4,
      t: Math.max(0, tOn + Math.random() * (dur / Math.max(6, n)) * 0.9),
      r: 3.6 + Math.random() * 3.2,
      s: (Math.random() * 3) | 0
    });
  }
  pts.sort((a, b) => a.t - b.t);
  return { pts, cw, chh, fs, rows, text: line.text };
}

function mechCommit() {
  /* 上一句的墨拓留在纸上（很淡），新的一句重新拍 */
  if (ink && ghostG) {
    ghostG.clearRect(0, 0, ghost.width, ghost.height);
    ghostG.drawImage(ink, 0, 0);
  }
  if (inkG) inkG.clearRect(0, 0, ink.width, ink.height);
  kInk = 0; lastEl = -1;
  padX = -999; padY = -999;
  pulses = [];
}
function mechSeek() {
  if (inkG) inkG.clearRect(0, 0, ink.width, ink.height);
  if (ghostG) ghostG.clearRect(0, 0, ghost.width, ghost.height);
  kInk = 0; lastEl = -1; padX = -999; padY = -999;
  pulses = [];
}

function dab(p, alpha) {
  const s = sprites[p.s % 3];
  const r = p.r * IS;
  /* 先垫一层更大更软的墨（压力大时墨会渗开），再落这一记的实心墨斑 */
  inkG.globalAlpha = alpha * 0.30;
  inkG.drawImage(s, (p.x - p.r * 1.9) * IS, (p.y - p.r * 1.9) * IS, r * 3.8, r * 3.8);
  inkG.globalAlpha = alpha;
  inkG.drawImage(s, (p.x - p.r) * IS, (p.y - p.r) * IS, r * 2, r * 2);
}

function mechUpdate(dt, time) {
  const amp = RM ? 0.25 : 1;
  if (pulses) {
    for (let i = pulses.length - 1; i >= 0; i--) {
      pulses[i].t += dt;
      if (pulses[i].t > 0.55) pulses.splice(i, 1);
    }
  }
  /* 拓包追着墨点走（减少动态时直接跳过去） */
  if (cur && cur.pts && kInk > 0) {
    const p = cur.pts[Math.min(kInk - 1, cur.pts.length - 1)];
    const ease = RM ? 1 : Math.min(1, dt * 14);
    padX = padX < -500 ? p.x : padX + (p.x - padX) * ease;
    padY = padY < -500 ? p.y : padY + (p.y - padY) * ease;
    padR += ((cur.fs * 0.26) + Math.sin(time * 6) * 1.2 * amp - padR) * Math.min(1, dt * 6);
  }
}

function mechDraw(T) {
  if (!cur) return;
  const pts = cur.pts;
  nPts = pts.length;
  const cx = W / 2, cy = H * 0.5;
  const age = T - lineAt;

  /* ---- 拍墨：按"该唱到哪"决定这一帧要落多少点 ---- */
  const el = Math.max(0, age);
  if (lastEl < 0 || el < lastEl - 0.25) {       /* 同句内回拖：重拍 */
    if (inkG) inkG.clearRect(0, 0, ink.width, ink.height);
    kInk = 0;
  }
  lastEl = el;
  let target = 0;
  while (target < pts.length && pts[target].t <= el * 0.92 + 0.06) target++;
  if (target > kInk) {
    const budget = RM ? 80 : 165;
    let n = 0;
    while (kInk < target && n < budget) {
      const p = pts[kInk];
      dab(p, 0.26 + Math.random() * 0.16);
      if ((kInk & 63) === 0 && pulses && pulses.length < 8) {
        pulses.push({ x: p.x, y: p.y, t: 0 });
      }
      kInk++; n++;
    }
  }

  /* ---- 纸 ---- */
  if (paper) ctx.drawImage(paper, 0, 0, W, H);

  /* ---- 上一句的残拓（碑上留下的旧痕） ---- */
  if (ghost) {
    ctx.globalAlpha = 0.16;
    ctx.drawImage(ghost, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  /* ---- 这一句的墨 ---- */
  if (ink) {
    ctx.globalAlpha = 1;
    ctx.drawImage(ink, 0, 0, W, H);
  }

  /* ---- 压印环：每拍一下，纸上荡开一圈 ---- */
  if (pulses) {
    ctx.lineWidth = 1;
    for (let i = 0; i < pulses.length; i++) {
      const q = pulses[i];
      const u = q.t / 0.55;
      ctx.strokeStyle = rgba(ACC, (1 - u) * 0.16);
      ctx.beginPath();
      ctx.arc(q.x, q.y, 6 + u * 34, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* ---- 拓包：最后落下的那一记（可见的"手"） ---- */
  if (padX > -500 && age < (pts[pts.length - 1].t / 0.92) + 3) {
    const r = Math.max(12, padR);
    ctx.globalCompositeOperation = 'source-over';
    const grd = ctx.createRadialGradient(padX, padY - r * 0.3, r * 0.15, padX, padY, r);
    grd.addColorStop(0, 'rgba(26,30,33,0.34)');
    grd.addColorStop(0.72, 'rgba(14,17,19,0.30)');
    grd.addColorStop(1, 'rgba(6,8,9,0.02)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(padX, padY, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(mixc(ACC, [230, 240, 245], 0.5), 0.34);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(padX, padY, r - 1, 0, Math.PI * 2);
    ctx.stroke();
    /* 拓包上的布纹 */
    ctx.strokeStyle = 'rgba(220,228,232,0.05)';
    ctx.beginPath();
    for (let q = -2; q <= 2; q++) {
      const yy = padY + q * r * 0.34;
      const dx = Math.sqrt(Math.max(0, r * r * 0.86 - (q * r * 0.34) * (q * r * 0.34)));
      ctx.moveTo(padX - dx, yy);
      ctx.lineTo(padX + dx, yy);
    }
    ctx.stroke();
  }

  /* ---- 拓片框（纸的范围）+ 读数 ---- */
  const bx = cx - cur.cw / 2 - 26, by = cy - cur.chh / 2 - 26;
  ctx.strokeStyle = rgba(ACC, 0.10);
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, cur.cw + 52, cur.chh + 52);
  ctx.font = '500 8.5px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.28);
  ctx.textAlign = 'left';
  ctx.fillText('DABS ' + kInk + '/' + nPts, bx, by + cur.chh + 72);
  ctx.fillStyle = rgba(ACC, 0.15);
  ctx.fillText('PRESS ' + Math.round(100 * kInk / Math.max(1, nPts)) + '%   FIBER 1400', bx, by + cur.chh + 85);
}

/* 无歌词：一张空纸，拓包在原地一下一下地拍（墨点稀疏、不组成字） */
function mechEmpty(T) {
  const cx = W / 2, cy = H / 2;
  const amp = RM ? 0.3 : 1;
  if (paper) ctx.drawImage(paper, 0, 0, W, H);
  /* 三块墨晕随呼吸晕开，像没对准的拓 */
  for (let i = 0; i < 3; i++) {
    const ph = (T * 0.12 + i / 3) % 1;
    const x = cx + Math.cos(i * 2.1 + T * 0.09) * W * 0.15 * amp;
    const y = cy + Math.sin(i * 1.7 + T * 0.07) * H * 0.11 * amp;
    const r = 90 + 110 * ph;
    const grd = ctx.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, rgba(ACC, 0.13 * (1 - ph)));
    grd.addColorStop(0.55, rgba(ACC, 0.05 * (1 - ph)));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  /* 拍打环：一记一记往外荡 */
  for (let k = 0; k < 3; k++) {
    const ph = (T * 0.55 + k / 3) % 1;
    ctx.strokeStyle = rgba(ACC, 0.30 * (1 - ph));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, 20 + ph * 120, 0, Math.PI * 2);
    ctx.stroke();
  }
  /* 拓包本体：一个压暗的圆（有布纹），随拍轻压 */
  const pr = 46 + Math.sin(T * 1.6) * 2.5 * amp;
  const pg = ctx.createRadialGradient(cx, cy - pr * 0.3, pr * 0.15, cx, cy, pr);
  pg.addColorStop(0, 'rgba(26,30,33,0.55)');
  pg.addColorStop(0.75, 'rgba(14,17,19,0.55)');
  pg.addColorStop(1, 'rgba(6,8,9,0.05)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(cx, cy, pr, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba(mixc(ACC, [230, 240, 245], 0.5), 0.42);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, pr - 1, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(220,228,232,0.06)';
  ctx.beginPath();
  for (let q = -2; q <= 2; q++) {
    const yy = cy + q * pr * 0.34;
    const dx = Math.sqrt(Math.max(0, pr * pr * 0.86 - (q * pr * 0.34) * (q * pr * 0.34)));
    ctx.moveTo(cx - dx, yy); ctx.lineTo(cx + dx, yy);
  }
  ctx.stroke();
  ctx.font = '500 9px ui-monospace,Consolas,monospace';
  ctx.fillStyle = rgba(ACC, 0.32);
  ctx.textAlign = 'center';
  ctx.fillText('NO INSCRIPTION · 纯音频', cx, cy + pr + 26);
  ctx.textAlign = 'left';
}
