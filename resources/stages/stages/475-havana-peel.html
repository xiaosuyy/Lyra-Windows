<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>475 · 剥落粉彩</title>
<style>
  :root{
    --cream:#f6e8ca;
    --accent:#cb8a4c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#160f0c}
  body{
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
    color:#f6e8ca;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #scene{position:fixed;inset:0;overflow:hidden;isolation:isolate}
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
  #wall{z-index:0}
  #fx{z-index:1}
  #grain{position:absolute;inset:-15%;z-index:2;pointer-events:none;opacity:.42;
    mix-blend-mode:overlay;background-repeat:repeat;background-size:190px 190px}
  #shade{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:
      linear-gradient(to right, rgba(7,14,16,.50) 0%, rgba(7,14,16,.12) 34%, rgba(7,14,16,0) 56%),
      linear-gradient(to bottom, rgba(7,14,16,.34) 0%, rgba(7,14,16,0) 19%);
  }
  #scrim{position:absolute;left:0;right:0;bottom:0;height:47%;z-index:3;pointer-events:none;
    background:linear-gradient(to top, rgba(6,12,14,.84) 0%, rgba(6,12,14,.63) 32%, rgba(6,12,14,.20) 68%, rgba(6,12,14,0) 100%);
  }
  #meta{position:absolute;z-index:4;left:clamp(18px,4.4vw,74px);top:clamp(16px,4vh,52px);max-width:min(56vw,560px)}
  #meta .kicker{
    font-size:clamp(8px,1vw,10.5px);letter-spacing:.44em;text-transform:uppercase;
    color:rgba(250,232,198,.64);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #meta h1{
    margin-top:.55em;font-family:"Palatino Linotype",Palatino,"Songti SC","SimSun",Georgia,serif;
    font-weight:700;font-size:clamp(17px,2.5vw,30px);line-height:1.16;letter-spacing:.01em;
    color:#fbf0d8;text-shadow:0 2px 14px rgba(0,0,0,.62);overflow-wrap:anywhere;
  }
  #artistLine{
    margin-top:.5em;font-size:clamp(9px,1.12vw,12px);letter-spacing:.17em;
    color:rgba(250,232,198,.58);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #edge{
    position:absolute;z-index:4;right:clamp(10px,1.6vw,22px);top:clamp(16px,4vh,52px);
    writing-mode:vertical-rl;font-size:clamp(8px,.9vw,10px);letter-spacing:.42em;
    color:rgba(250,232,198,.36);white-space:nowrap;
  }
  #lyrics{
    position:absolute;z-index:5;left:clamp(18px,4.6vw,80px);right:clamp(18px,4.6vw,80px);
    bottom:clamp(118px,18vh,190px);max-width:min(88vw,1040px);--cur:46px;
  }
  .ln{
    font-weight:700;line-height:1.34;letter-spacing:.015em;color:#f6e8ca;
    opacity:.2;font-size:calc(var(--cur) * .42);
    text-shadow:0 2px 16px rgba(0,0,0,.55);
    overflow-wrap:anywhere;word-break:break-word;margin-bottom:.18em;
    transition:opacity .45s ease,transform .45s ease,font-size .3s ease,color .2s linear;
  }
  .ln.past{opacity:.27}
  .ln.future{opacity:.15}
  .ln.cur{
    opacity:1;font-size:var(--cur);margin:.14em 0 .2em;
    text-shadow:0 3px 18px rgba(0,0,0,.55),0 0 44px rgba(255,178,96,.10);
  }
  .ln.cur.pre{opacity:.58}
  .ln.cur.pre .bar{display:none}
  .ln.cur.pre .ch{color:inherit;text-shadow:none}
  .ln.cur .ch{color:rgba(246,232,202,.4);transition:color .16s linear,text-shadow .16s linear}
  .ln.cur .ch.on{color:#fff7e2;text-shadow:0 0 22px rgba(255,186,104,.42),0 2px 10px rgba(0,0,0,.35)}
  .bar{margin-top:.4em;height:2px;width:100%;background:rgba(255,240,215,.13);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 12px rgba(255,178,96,.75)}
  #empty{
    position:absolute;z-index:5;left:clamp(18px,4.6vw,80px);bottom:clamp(118px,18vh,190px);
    display:none;font-size:clamp(13px,1.7vw,19px);letter-spacing:.2em;color:rgba(246,232,202,.74);
  }
  #empty::before{content:"";display:block;width:58px;height:2px;background:var(--accent);margin-bottom:20px;box-shadow:0 0 12px rgba(255,178,96,.6)}
  #scene.nolyrics #empty{display:block}
  #scene.nolyrics #lyrics{display:none}
  #foot{
    position:absolute;z-index:5;left:clamp(18px,4.6vw,80px);right:clamp(18px,4.6vw,80px);
    bottom:clamp(16px,3vh,38px);display:flex;align-items:center;gap:clamp(12px,2vw,26px);
  }
  #ticks{display:flex;gap:3px;flex:1 1 auto;height:16px;align-items:flex-end;overflow:hidden}
  #ticks i{flex:1 1 0;min-width:1px;height:5px;background:rgba(246,232,202,.18);transition:background .3s,height .3s}
  #ticks i.on{background:rgba(255,235,200,.7);height:9px}
  #ticks i.now{background:var(--accent);height:16px;box-shadow:0 0 10px rgba(255,180,100,.7)}
  #clock{
    font-family:"Consolas","SFMono-Regular",Ui-Monospace,monospace;font-size:clamp(9px,1.05vw,11px);
    letter-spacing:.1em;color:rgba(246,232,202,.55);white-space:nowrap;
  }
  #clock b{font-weight:600;color:rgba(250,238,214,.86)}
  #clock i{font-style:normal;opacity:.4;margin:0 .4em}
  @media (max-width:560px){
    #edge{display:none}
    #meta{max-width:74vw}
    #lyrics{right:clamp(18px,4vw,40px);bottom:clamp(104px,16vh,150px)}
  }
  @media (max-height:520px){
    #lyrics{bottom:clamp(84px,14vh,110px)}
    #meta h1{font-size:clamp(15px,2vw,22px)}
  }
</style>
</head>
<body>
<div id="scene">
  <canvas id="wall" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>
  <div id="shade" aria-hidden="true"></div>
  <div id="scrim" aria-hidden="true"></div>
  <header id="meta">
    <div class="kicker">SON CUBANO · LA HABANA VIEJA</div>
    <h1 id="songName">—</h1>
    <div id="artistLine"></div>
  </header>
  <div id="edge" aria-hidden="true">23°08′N · 82°23′W</div>
  <div id="lyrics" aria-live="polite"></div>
  <div id="empty"><span>♪</span> 纯器乐 · 这首歌没有歌词</div>
  <footer id="foot">
    <div id="ticks"></div>
    <div id="clock"><b id="tc">00:00</b><i>/</i><b id="td">--:--</b></div>
  </footer>
</div>
<script>
(function(){
  'use strict';

  var scene   = document.getElementById('scene');
  var wallCv  = document.getElementById('wall');
  var fxCv    = document.getElementById('fx');
  var lyricsEl= document.getElementById('lyrics');
  var ticksEl = document.getElementById('ticks');
  var songEl  = document.getElementById('songName');
  var artistEl= document.getElementById('artistLine');
  var tcEl    = document.getElementById('tc');
  var tdEl    = document.getElementById('td');
  var grainEl = document.getElementById('grain');
  var wallCtx = (wallCv && wallCv.getContext) ? wallCv.getContext('2d') : null;
  var fxCtx   = (fxCv && fxCv.getContext) ? fxCv.getContext('2d') : null;

  /* ---------- 状态（__stage 与渲染共享同一作用域） ---------- */
  var W = 1440, H = 900;
  var wallScale = 1, fxScaleX = 1, fxScaleY = 1;
  var lines = [], idx = -1, curLine = null, curChars = [], litCount = 0;
  var t = 0, playing = true, duration = 0;
  var frames = 0, lastJs = 0, errMsg = '';
  var songId = null;
  var beatLevel = 0, pulse = 0;
  var live = { bpm: 0, bass: 0, mid: 0, treble: 0, level: 0 };
  var accent = { r: 203, g: 138, b: 76 };
  var reduced = false, readySent = false, started = false;
  var domAcc = 0, tickCount = -1, clockStr = '';
  var TICKS = 56;

  try {
    reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { reduced = false; }

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function num(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function str(v){ return (v === null || v === undefined) ? '' : String(v); }

  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var q = Math.imul(a ^ (a >>> 15), 1 | a);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }

  function two(n){ return n < 10 ? '0' + n : '' + n; }
  function fmt(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    return two(Math.floor(sec / 60)) + ':' + two(sec % 60);
  }

  /* ---------- 自检口：整页只定义一次，字段严格 ---------- */
  window.__stage = function(){
    var ln = (idx >= 0 && idx < lines.length) ? lines[idx] : null;
    var ms = Math.round((lastJs || 0) * 100) / 100;
    return {
      lines: lines.length,
      idx: idx,
      t: isFinite(t) ? Math.round(t * 1000) / 1000 : 0,
      playing: !!playing,
      frames: frames,
      js: ms,
      err: errMsg,
      text: ln ? str(ln.text) : '',
      gl: false,
      rm: !!reduced
    };
  };

  /* ---------- ready：首帧无条件发一次 ---------- */
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[475] ready postMessage failed', e); }
  }

  /* ---------- 尺寸 ---------- */
  function resize(){
    var w = scene ? scene.clientWidth : 0;
    var h = scene ? scene.clientHeight : 0;
    if (!isFinite(w) || w <= 0) w = window.innerWidth || 1440;
    if (!isFinite(h) || h <= 0) h = window.innerHeight || 900;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = Math.round(w); H = Math.round(h);

    var dpr = window.devicePixelRatio || 1;
    if (!isFinite(dpr) || dpr <= 0) dpr = 1;

    wallScale = clamp(Math.min(dpr, 1.6, Math.sqrt(3200000 / (W * H))), 0.55, 1.6);
    if (wallCv){
      wallCv.width  = Math.max(2, Math.round(W * wallScale));
      wallCv.height = Math.max(2, Math.round(H * wallScale));
    }
    var fs = clamp(Math.sqrt(820000 / (W * H)), 0.45, 1);
    if (fxCv){
      fxCv.width  = Math.max(2, Math.round(W * fs));
      fxCv.height = Math.max(2, Math.round(H * fs));
      fxScaleX = fxCv.width / W;
      fxScaleY = fxCv.height / H;
    }
    renderWall();
    buildCar();
    layoutLyrics();
  }

  /* ---------- 歌词模型 ---------- */
  function normalizeLines(raw){
    var out = [], i, item, txt, st, dd, chars, cl, ci, ch;
    if (!raw || typeof raw !== 'object' || typeof raw.length !== 'number') return out;
    var n = Math.min(raw.length, 2000);
    for (i = 0; i < n; i++){
      item = raw[i];
      if (!item || typeof item !== 'object') continue;
      txt = str(item.text);
      st = num(item.t, NaN);
      if (!isFinite(st) || st < 0) st = 0;
      dd = num(item.dur, 0);
      if (!(dd > 0.2)) dd = 3.2;
      chars = null;
      if (item.chars && typeof item.chars.length === 'number' && item.chars.length > 0){
        cl = Math.min(item.chars.length, 400);
        chars = [];
        for (ci = 0; ci < cl; ci++){
          ch = item.chars[ci];
          if (!ch || typeof ch !== 'object') continue;
          var c = str(ch.c);
          if (c === '') continue;
          var ct = num(ch.t, st);
          if (!isFinite(ct)) ct = st;
          chars.push({ c: c, t: Math.max(st, ct) });
        }
        if (chars.length === 0) chars = null;
        else if (chars.map(function(x){ return x.c; }).join('') !== txt){
          /* chars 与正文对不上：以 chars 为准（YRC 权威），否则整句按时长均分 */
          txt = chars.map(function(x){ return x.c; }).join('');
        }
      }
      out.push({ t: st, dur: Math.min(dd, 30), text: txt, chars: chars });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    return out;
  }

  function findIdx(time){
    var lo = 0, hi = lines.length - 1, res = -1, mid;
    while (lo <= hi){
      mid = (lo + hi) >> 1;
      if (lines[mid].t <= time + 0.02){ res = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return res;
  }

  /* ---------- 歌词排版（每次换句/换行重建一次，不每帧重建） ---------- */
  function baseFontSize(){
    return clamp(Math.min(W * 0.058, H * 0.080), 22, 76);
  }

  function charArray(text){
    var out = [];
    if (!text) return out;
    if (typeof Array.from === 'function'){
      try { out = Array.from(text); } catch (e) { out = null; }
    }
    if (!out){
      out = [];
      for (var i = 0; i < text.length; i++) out.push(text.charAt(i));
    }
    return out.slice(0, 400);
  }

  /* 按实际字符宽度估算，超长句自动缩字号，绝不溢出 */
  function textUnits(txt){
    var arr = charArray(txt), i, u = 0, c, code;
    for (i = 0; i < arr.length; i++){
      c = arr[i].charCodeAt(0);
      u += (c > 0x2e80) ? 1.0 : (c === 32 ? 0.34 : 0.56);
    }
    return Math.max(1, u + arr.length * 0.02);
  }

  function layoutLyrics(){
    var base = baseFontSize();
    var avail = lyricsEl.clientWidth || (W * 0.6);
    if (!isFinite(avail) || avail < 40) avail = W * 0.6;
    var i, ln, txt, len, units, fs, curFs = base;
    for (i = 0; i < lyricsEl.children.length; i++){
      ln = lyricsEl.children[i];
      txt = ln.getAttribute('data-txt') || '';
      len = ln.getAttribute('data-len');
      len = len ? parseInt(len, 10) : 10;
      if (!isFinite(len) || len <= 0) len = 10;
      units = textUnits(txt);
      fs = Math.min(base, avail / units);
      fs = Math.max(fs, 12);
      if (ln.className.indexOf('cur') >= 0){
        curFs = fs;
        ln.style.fontSize = fs.toFixed(1) + 'px';
      } else {
        ln.style.fontSize = Math.max(12, Math.min(base * 0.40, fs * 0.72)).toFixed(1) + 'px';
      }
    }
    lyricsEl.style.setProperty('--cur', curFs.toFixed(1) + 'px');
  }

  function charSpans(text, at){
    var arr = charArray(text), out = [], i;
    for (i = 0; i < arr.length; i++){
      out.push('<span class="ch">' + escapeHtml(arr[i]) + '</span>');
    }
    return out.join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
    });
  }

  function buildLines(){
    var start = Math.max(0, idx - 2);
    var end = Math.min(lines.length - 1, (idx < 0 ? 2 : idx + 2));
    var html = [], i, ln, cls, txt, spans, len, isCur, isPre;
    for (i = start; i <= end; i++){
      ln = lines[i];
      txt = ln.text === '' ? '· · ·' : ln.text;
      len = charArray(txt).length;
      isCur = (i === idx);
      isPre = (idx < 0 && i === 0);
      if (isCur) cls = 'ln cur';
      else if (isPre) cls = 'ln cur pre';
      else if (idx < 0) cls = 'ln future';
      else cls = (i < idx ? 'ln past' : 'ln future');
      spans = isCur ? charSpans(txt) : escapeHtml(txt);
      html.push('<div class="' + cls + '" data-i="' + i + '" data-len="' + len + '" data-txt="' +
        escapeHtml(txt) + '">' + spans +
        (isCur ? '<div class="bar"><i></i></div>' : '') + '</div>');
    }
    lyricsEl.innerHTML = html.join('');
    curLine = (idx >= 0 && idx < lines.length) ? lines[idx] : null;
    curChars = idx >= 0 ? Array.prototype.slice.call(lyricsEl.querySelectorAll('.ln.cur .ch')) : [];
    litCount = 0;
    layoutLyrics();
  }

  function charTimes(ln){
    var arr, n, i, out;
    if (!ln) return [];
    if (ln.chars && ln.chars.length){
      return ln.chars;
    }
    arr = charArray(ln.text);
    n = arr.length || 1;
    out = [];
    for (i = 0; i < n; i++){
      out.push({ c: arr[i], t: ln.t + (ln.dur * i) / n });
    }
    return out;
  }

  /* ---------- 画面：哈瓦那老墙 ---------- */
  var NZ_A = null, NZ_B = null, NZ_SPECK = null;
  var maskCv = null, plasterCv = null, carCv = null;
  var builtW = 0, builtH = 0;
  var wallBaseW = 0, wallBaseH = 0, detailDone = false, detailPending = false;

  function noiseGrid(seed){
    var rnd = mulberry32(seed), g = new Float32Array(65536), i;
    for (i = 0; i < 65536; i++) g[i] = rnd();
    return g;
  }
  function vnoise(g, x, y){
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
    var r0 = y0 << 8, r1 = y1 << 8;
    var a = g[r0 | x0], b = g[r0 | x1], c = g[r1 | x0], d = g[r1 | x1];
    var ab = a + (b - a) * u, cd = c + (d - c) * u;
    return ab + (cd - ab) * v;
  }
  function fbm(g, x, y, oct){
    var s = 0, amp = 0.5, f = 1, n = 0, i;
    for (i = 0; i < oct; i++){
      s += vnoise(g, x * f, y * f) * amp;
      n += amp; amp *= 0.5; f *= 2.07;
    }
    return s / n;
  }

  function makeSpeckle(){
    try {
      var n = 128, cv = document.createElement('canvas');
      cv.width = n; cv.height = n;
      var cx = cv.getContext('2d');
      if (!cx) return null;
      var img = cx.createImageData(n, n), d = img.data, rnd = mulberry32(313), i, v;
      for (i = 0; i < d.length; i += 4){
        v = rnd();
        d[i] = 40 + v * 40;
        d[i + 1] = 28 + v * 30;
        d[i + 2] = 20 + v * 24;
        d[i + 3] = rnd() * 46;
      }
      cx.putImageData(img, 0, 0);
      return cv;
    } catch (e) { console.error('[475] speckle', e); return null; }
  }

  /* 剥落蒙版：白色 alpha = 还留着的粉彩 */
  function buildPlaster(){
    var pw = wallCv.width, ph = wallCv.height;
    var mw = clamp(Math.round(pw * 0.60), 8, 760);
    var mh = clamp(Math.round(ph * 0.60), 8, 520);
    if (!NZ_A){ NZ_A = noiseGrid(1337); NZ_B = noiseGrid(4242); }
    if (!NZ_SPECK) NZ_SPECK = makeSpeckle();

    maskCv = document.createElement('canvas');
    maskCv.width = mw; maskCv.height = mh;
    var mc = maskCv.getContext('2d');
    if (!mc) return;
    var img = mc.createImageData(mw, mh);
    var d = img.data;
    var kx = W / mw, ky = H / mh;
    var x, y, i = 0, wx, wy, big, fine, v, a;
    for (y = 0; y < mh; y++){
      wy = y * ky;
      for (x = 0; x < mw; x++){
        wx = x * kx;
        big  = fbm(NZ_A, wx / 235, wy / 235, 2);
        fine = fbm(NZ_B, wx / 33,  wy / 33,  3);
        v = big + (fine - 0.5) * 0.26 + (wy / H - 0.5) * 0.12;
        a = (0.588 - v) / 0.050;
        a = a < 0 ? 0 : (a > 1 ? 1 : a);
        d[i] = 255; d[i + 1] = 248; d[i + 2] = 232;
        d[i + 3] = (a * 255) | 0;
        i += 4;
      }
    }
    mc.putImageData(img, 0, 0);

    plasterCv = document.createElement('canvas');
    plasterCv.width = pw; plasterCv.height = ph;
    var px = plasterCv.getContext('2d');
    if (!px) return;
    px.setTransform(wallScale, 0, 0, wallScale, 0, 0);
    paintPlaster(px);
    px.setTransform(1, 0, 0, 1, 0, 0);
    px.globalCompositeOperation = 'destination-in';
    px.drawImage(maskCv, 0, 0, pw, ph);
    px.globalCompositeOperation = 'source-over';
  }

  function paintPlaster(cx){
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#74a9ad');
    g.addColorStop(0.34, '#8dbbb4');
    g.addColorStop(0.58, '#cbbf92');
    g.addColorStop(0.80, '#eed69a');
    g.addColorStop(1, '#e6c184');
    cx.fillStyle = g;
    cx.fillRect(-2, -2, W + 4, H + 4);

    var rg = cx.createRadialGradient(W * 0.90, -H * 0.14, 0, W * 0.90, -H * 0.14, Math.max(W, H) * 0.95);
    rg.addColorStop(0, 'rgba(255,248,216,.92)');
    rg.addColorStop(0.42, 'rgba(255,229,178,.30)');
    rg.addColorStop(1, 'rgba(255,226,172,0)');
    cx.fillStyle = rg;
    cx.fillRect(0, 0, W, H);

    var rnd = mulberry32(77), i, bx, by, rr, rg2;
    for (i = 0; i < 15; i++){
      bx = rnd() * W; by = rnd() * H;
      rr = Math.min(W, H) * (0.10 + rnd() * 0.30);
      rg2 = cx.createRadialGradient(bx, by, 0, bx, by, rr);
      rg2.addColorStop(0, 'rgba(52,94,94,' + (0.05 + rnd() * 0.11).toFixed(3) + ')');
      rg2.addColorStop(1, 'rgba(52,94,94,0)');
      cx.fillStyle = rg2;
      cx.fillRect(bx - rr, by - rr, rr * 2, rr * 2);
    }

    var sg, sx, sw, sh;
    for (i = 0; i < 20; i++){
      sx = rnd() * W;
      sw = 2 + rnd() * 15;
      sh = H * (0.16 + rnd() * 0.52);
      sg = cx.createLinearGradient(0, 0, 0, sh);
      sg.addColorStop(0, 'rgba(88,106,98,' + (0.09 + rnd() * 0.13).toFixed(3) + ')');
      sg.addColorStop(1, 'rgba(88,106,98,0)');
      cx.fillStyle = sg;
      cx.fillRect(sx, 0, sw, sh);
    }

    if (NZ_SPECK){
      var pat = cx.createPattern(NZ_SPECK, 'repeat');
      if (pat){
        cx.globalAlpha = 0.55;
        cx.fillStyle = pat;
        cx.fillRect(0, 0, W, H);
        cx.globalAlpha = 1;
      }
    }
  }

  function paintBricks(cx){
    var ch = clamp(H / 23, 22, 66);
    var bw = ch * 2.35;
    var rnd = mulberry32(20211);
    cx.fillStyle = '#b08e72';
    cx.fillRect(-2, -2, W + 4, H + 4);
    var rows = Math.min(140, Math.ceil(H / ch) + 1);
    var y, row, off, x, bx, v, col, r2;
    for (row = 0; row < rows; row++){
      y = row * ch;
      off = (row & 1) ? bw * 0.5 : 0;
      for (x = -bw; x < W + bw; x += bw){
        bx = x + off;
        v = rnd();
        if (v > 0.978){
          col = 'rgb(44,30,24)';
        } else if (v > 0.70){
          r2 = rnd();
          col = 'rgb(' + (128 + (r2 * 26 | 0)) + ',' + (66 + (r2 * 22 | 0)) + ',' + (42 + (r2 * 18 | 0)) + ')';
        } else if (v > 0.38){
          col = 'rgb(' + (168 + (rnd() * 22 | 0)) + ',' + (96 + (rnd() * 22 | 0)) + ',' + (60 + (rnd() * 18 | 0)) + ')';
        } else {
          col = 'rgb(' + (146 + (rnd() * 20 | 0)) + ',' + (92 + (rnd() * 18 | 0)) + ',' + (70 + (rnd() * 16 | 0)) + ')';
        }
        cx.fillStyle = col;
        cx.fillRect(bx + 1.6, y + 1.6, bw - 3.2, ch - 3.2);
        cx.fillStyle = 'rgba(255,214,168,' + (0.05 + rnd() * 0.09).toFixed(3) + ')';
        cx.fillRect(bx + 1.6, y + 1.6, bw - 3.2, 1.7);
        if (rnd() > 0.55){
          cx.fillStyle = 'rgba(232,206,170,' + (0.05 + rnd() * 0.10).toFixed(3) + ')';
          cx.fillRect(bx + 2 + rnd() * Math.max(1, bw - 26), y + 2 + rnd() * Math.max(1, ch - 10), 8 + rnd() * 20, 3 + rnd() * 7);
        }
      }
    }
    var gd = cx.createLinearGradient(0, 0, 0, H);
    gd.addColorStop(0, 'rgba(26,20,18,.34)');
    gd.addColorStop(0.55, 'rgba(26,20,18,.05)');
    gd.addColorStop(1, 'rgba(26,20,18,.30)');
    cx.fillStyle = gd;
    cx.fillRect(0, 0, W, H);
  }

  function drawCracks(cx){
    var rnd = mulberry32(5150), n, i, x, y, ang, len, steps, s;
    cx.lineCap = 'round';
    cx.strokeStyle = 'rgba(52,36,28,.38)';
    for (n = 0; n < 6; n++){
      x = rnd() * W;
      y = rnd() * H * 0.9;
      ang = 1.1 + rnd() * 1.3;
      len = 26 + rnd() * 110;
      cx.lineWidth = 1.1 + rnd() * 0.9;
      cx.beginPath();
      cx.moveTo(x, y);
      steps = 20;
      for (s = 0; s < steps; s++){
        ang += (rnd() - 0.5) * 0.8;
        len *= 1.03;
        x += Math.cos(ang) * (len / steps);
        y += Math.sin(ang) * (len / steps);
        cx.lineTo(x, y);
      }
      cx.stroke();
    }
  }

  /* 门洞里逆光的老乐手：怀抱 Tres、叼着雪茄 */
  function groundY(){
    return (W / H < 0.85) ? H * 0.705 : H * 0.858;
  }
  function doorGeo(){
    var portrait = (W / H < 0.85);
    var x0 = portrait ? W * 0.38 : W * 0.626;
    var x1 = portrait ? W * 0.92 : W * 0.860;
    var y0 = portrait ? H * 0.055 : H * 0.145;
    var y1 = groundY();
    return { x0: x0, x1: x1, y0: y0, y1: y1, w: x1 - x0, h: y1 - y0, r: (x1 - x0) * 0.5 };
  }
  function doorPath(cx, g){
    cx.beginPath();
    cx.moveTo(g.x0, g.y1);
    cx.lineTo(g.x0, g.y0 + g.r);
    cx.arc(g.x0 + g.r, g.y0 + g.r, g.r, Math.PI, 0);
    cx.lineTo(g.x1, g.y1);
    cx.closePath();
  }

  function drawFigure(cx, g){
    var fx = g.x0 + g.w * 0.48;
    var fh = g.h * 0.615;
    var foot = g.y1 - g.h * 0.004;
    var headR = fh * 0.066;
    var headY = foot - fh + headR;
    var shY = headY + headR * 1.62;
    var hipY = foot - fh * 0.315;
    var shW = fh * 0.128;
    var i;

    cx.save();
    doorPath(cx, g);
    cx.clip();

    /* 门内的暖背景光，衬出人形 */
    var bg = cx.createRadialGradient(fx, headY + fh * 0.18, 0, fx, headY + fh * 0.18, fh * 0.95);
    bg.addColorStop(0, 'rgba(255,196,126,.62)');
    bg.addColorStop(0.45, 'rgba(238,150,86,.30)');
    bg.addColorStop(1, 'rgba(180,110,64,0)');
    cx.fillStyle = bg;
    cx.fillRect(g.x0, g.y0, g.w, g.h);

    cx.fillStyle = 'rgba(26,17,14,.95)';

    /* 腿 */
    cx.beginPath();
    cx.moveTo(fx - shW * 0.66, hipY + fh * 0.01);
    cx.lineTo(fx - shW * 0.34, foot);
    cx.lineTo(fx - shW * 0.02, foot);
    cx.lineTo(fx - shW * 0.16, hipY + fh * 0.01);
    cx.closePath();
    cx.fill();
    cx.beginPath();
    cx.moveTo(fx + shW * 0.06, hipY + fh * 0.01);
    cx.lineTo(fx + shW * 0.30, foot);
    cx.lineTo(fx + shW * 0.62, foot);
    cx.lineTo(fx + shW * 0.50, hipY + fh * 0.01);
    cx.closePath();
    cx.fill();

    /* 躯干 */
    cx.beginPath();
    cx.moveTo(fx - headR * 1.12, headY + headR * 0.95);
    cx.quadraticCurveTo(fx - shW, shY - fh * 0.012, fx - shW, shY + fh * 0.045);
    cx.quadraticCurveTo(fx - shW * 0.94, hipY, fx - shW * 0.70, hipY + fh * 0.012);
    cx.lineTo(fx + shW * 0.70, hipY + fh * 0.012);
    cx.quadraticCurveTo(fx + shW * 0.94, hipY, fx + shW, shY + fh * 0.045);
    cx.quadraticCurveTo(fx + shW, shY - fh * 0.012, fx + headR * 1.12, headY + headR * 0.95);
    cx.closePath();
    cx.fill();

    /* 头 */
    cx.beginPath();
    cx.ellipse(fx, headY, headR * 0.90, headR, 0, 0, 6.2832);
    cx.fill();
    /* 帽：卷边草帽 */
    cx.beginPath();
    cx.ellipse(fx, headY - headR * 0.62, headR * 1.78, headR * 0.30, -0.05, 0, 6.2832);
    cx.fill();
    cx.beginPath();
    cx.moveTo(fx - headR * 0.86, headY - headR * 0.68);
    cx.quadraticCurveTo(fx - headR * 0.78, headY - headR * 1.72, fx, headY - headR * 1.78);
    cx.quadraticCurveTo(fx + headR * 0.80, headY - headR * 1.74, fx + headR * 0.88, headY - headR * 0.68);
    cx.closePath();
    cx.fill();

    /* 吉他：琴身 + 长颈（暖色反光轮廓，避免糊成一团） */
    var gx = fx - shW * 0.30, gy = foot - fh * 0.335, gr = fh * 0.132;
    cx.save();
    cx.translate(gx, gy);
    cx.rotate(-0.42);
    cx.fillStyle = 'rgba(30,20,16,.96)';
    cx.beginPath();
    cx.ellipse(0, 0, gr * 0.80, gr, 0, 0, 6.2832);
    cx.fill();
    cx.beginPath();
    cx.ellipse(0, -gr * 0.86, gr * 0.58, gr * 0.60, 0, 0, 6.2832);
    cx.fill();
    /* 琴颈 */
    var nl = fh * 0.40;
    cx.fillStyle = 'rgba(30,20,16,.96)';
    cx.fillRect(-gr * 0.10, -gr * 0.86 - nl, gr * 0.20, nl);
    cx.fillRect(-gr * 0.16, -gr * 0.86 - nl - gr * 0.20, gr * 0.32, gr * 0.24);
    /* 一道受光边 */
    cx.strokeStyle = 'rgba(255,204,142,.42)';
    cx.lineWidth = Math.max(1, gr * 0.055);
    cx.beginPath();
    cx.ellipse(0, 0, gr * 0.80, gr, 0, -0.4, 2.1);
    cx.stroke();
    cx.beginPath();
    cx.moveTo(gr * 0.06, -gr * 0.7);
    cx.lineTo(gr * 0.10, -gr * 0.86 - nl);
    cx.stroke();
    cx.restore();

    /* 手臂：环抱琴身 */
    cx.strokeStyle = 'rgba(26,17,14,.95)';
    cx.lineCap = 'round';
    cx.lineWidth = fh * 0.055;
    cx.beginPath();
    cx.moveTo(fx + shW * 0.86, shY + fh * 0.05);
    cx.quadraticCurveTo(fx + shW * 1.02, gy - gr * 0.2, fx + shW * 0.10, gy - gr * 0.45);
    cx.stroke();
    cx.lineWidth = fh * 0.048;
    cx.beginPath();
    cx.moveTo(fx - shW * 0.86, shY + fh * 0.05);
    cx.quadraticCurveTo(fx - shW * 1.06, gy - gr * 0.9, fx - shW * 0.42, gy - gr * 0.5);
    cx.stroke();

    /* 雪茄与青烟 */
    var cxgx = fx + headR * 0.78, cyg = headY + headR * 0.52;
    cx.strokeStyle = 'rgba(232,206,168,.55)';
    cx.lineWidth = Math.max(1.4, headR * 0.16);
    cx.beginPath();
    cx.moveTo(cxgx, cyg);
    cx.lineTo(cxgx + headR * 0.95, cyg + headR * 0.28);
    cx.stroke();
    cx.fillStyle = 'rgba(255,168,86,.95)';
    cx.beginPath();
    cx.arc(cxgx + headR * 0.98, cyg + headR * 0.30, Math.max(1.4, headR * 0.17), 0, 6.2832);
    cx.fill();

    var sy = cyg - headR * 0.2, sx = cxgx + headR * 1.1, k, sag;
    cx.strokeStyle = 'rgba(255,222,182,.20)';
    cx.lineWidth = Math.max(1, headR * 0.11);
    cx.beginPath();
    cx.moveTo(sx, sy);
    for (k = 1; k <= 12; k++){
      sag = Math.sin(k * 0.62) * headR * 0.55;
      cx.lineTo(sx + sag * 0.9 + k * headR * 0.16, sy - k * headR * 0.55);
    }
    cx.stroke();

    /* 轮廓受光边 */
    cx.strokeStyle = 'rgba(255,210,152,.20)';
    cx.lineWidth = Math.max(1, fh * 0.006);
    cx.beginPath();
    cx.moveTo(fx + shW, shY + fh * 0.045);
    cx.quadraticCurveTo(fx + shW * 0.94, hipY, fx + shW * 0.70, hipY + fh * 0.012);
    cx.stroke();

    cx.restore();
  }

  function drawDoor(cx){
    var g = doorGeo();
    var x0 = g.x0, x1 = g.x1, y0 = g.y0, y1 = g.y1, w = g.w, h = g.h, r = g.r;
    var i, plw = w / 9;

    cx.save();
    doorPath(cx, g);
    cx.clip();

    var g = cx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, '#101b1d');
    g.addColorStop(0.55, '#1e1a18');
    g.addColorStop(1, '#3a2418');
    cx.fillStyle = g;
    cx.fillRect(x0, y0, w, h);

    for (i = 0; i < 9; i++){
      cx.fillStyle = (i & 1) ? 'rgba(96,58,38,.92)' : 'rgba(74,44,30,.92)';
      cx.fillRect(x0 + i * plw + 0.6, y0 + r * 0.5, plw - 1.2, h);
      cx.fillStyle = 'rgba(255,206,150,.05)';
      cx.fillRect(x0 + i * plw + 0.6, y0 + r * 0.5, 1.4, h);
    }
    /* 门上气窗的暖光 */
    cx.fillStyle = 'rgba(255,192,112,.34)';
    cx.fillRect(x0 + r * 0.42, y0 + r * 0.30, w * 0.52, r * 0.26);
    cx.fillStyle = 'rgba(255,130,70,.16)';
    cx.fillRect(x0 + w * 0.06, y1 - h * 0.16, w * 0.88, h * 0.16);
    cx.restore();

    cx.strokeStyle = 'rgba(244,222,182,.20)';
    cx.lineWidth = Math.max(2, w * 0.022);
    cx.beginPath();
    cx.moveTo(x0, y1);
    cx.lineTo(x0, y0 + r);
    cx.arc(x0 + r, y0 + r, r, Math.PI, 0);
    cx.lineTo(x1, y1);
    cx.stroke();

    /* 门缝里漫出来的暖光，落在街上 */
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    var lg = cx.createLinearGradient(x0, y1, x0 + w * 0.5, y1 + H * 0.10);
    lg.addColorStop(0, 'rgba(255,178,104,.26)');
    lg.addColorStop(1, 'rgba(255,150,80,0)');
    cx.fillStyle = lg;
    cx.beginPath();
    cx.moveTo(x0, y1);
    cx.lineTo(x1, y1);
    cx.lineTo(x1 + w * 0.22, y1 + H * 0.075);
    cx.lineTo(x0 - w * 0.16, y1 + H * 0.075);
    cx.closePath();
    cx.fill();
    cx.restore();

    cx.fillStyle = 'rgba(30,22,18,.34)';
    cx.fillRect(x0 - w * 0.05, y1 - h * 0.012, w * 1.10, h * 0.012);
  }

  function drawPlinth(cx){
    var y = groundY() - H * 0.007;
    var g = cx.createLinearGradient(0, y, 0, H);
    g.addColorStop(0, '#243133');
    g.addColorStop(1, '#101819');
    cx.fillStyle = g;
    cx.fillRect(0, y, W, H - y);
    cx.fillStyle = 'rgba(255,228,180,.26)';
    cx.fillRect(0, y, W, 2);
    var tw = Math.max(24, H * 0.042), x;
    cx.strokeStyle = 'rgba(255,228,182,.07)';
    cx.lineWidth = 1;
    cx.beginPath();
    for (x = 0; x < W; x += tw){ cx.moveTo(x, y + 3); cx.lineTo(x, H); }
    cx.stroke();
    var gg = cx.createLinearGradient(0, y, 0, H);
    gg.addColorStop(0, 'rgba(255,196,132,.10)');
    gg.addColorStop(1, 'rgba(255,196,132,0)');
    cx.fillStyle = gg;
    cx.fillRect(0, y, W, H - y);
  }

  function drawFrond(cx, ox, oy, len, ang, alpha){
    cx.save();
    cx.translate(ox, oy);
    cx.rotate(ang);
    cx.strokeStyle = 'rgba(18,30,34,' + alpha.toFixed(3) + ')';
    cx.lineCap = 'round';
    cx.lineWidth = Math.max(1.6, len * 0.010);
    cx.beginPath();
    cx.moveTo(0, 0);
    cx.quadraticCurveTo(len * 0.48, -len * 0.14, len, len * 0.14);
    cx.stroke();
    var n = 22, i, p, qx, qy, ll, la, side;
    for (i = 1; i < n; i++){
      p = i / n;
      qx = 2 * (1 - p) * p * (len * 0.48) + p * p * len;
      qy = 2 * (1 - p) * p * (-len * 0.14) + p * p * (len * 0.14);
      ll = Math.sin(Math.PI * p) * len * 0.24;
      for (side = -1; side <= 1; side += 2){
        la = side * (0.62 + 0.30 * p) + 0.18;
        cx.lineWidth = 1;
        cx.beginPath();
        cx.moveTo(qx, qy);
        cx.lineTo(qx + Math.cos(la) * ll, qy + Math.sin(la) * ll);
        cx.stroke();
      }
    }
    cx.restore();
  }

  function drawFronds(cx){
    var m = Math.min(W, H);
    drawFrond(cx, W * 1.03, -H * 0.02, m * 0.92, Math.PI * 0.60, 0.50);
    drawFrond(cx, W * 0.93, -H * 0.08, m * 0.66, Math.PI * 0.70, 0.34);
    drawFrond(cx, W * 1.08, H * 0.20, m * 0.58, Math.PI * 0.44, 0.26);
  }

  function drawWallExtras(cx){
    var rg = cx.createRadialGradient(W * 0.5, H * 0.44, Math.min(W, H) * 0.16, W * 0.5, H * 0.5, Math.max(W, H) * 0.86);
    rg.addColorStop(0, 'rgba(0,0,0,0)');
    rg.addColorStop(1, 'rgba(6,11,13,.58)');
    cx.fillStyle = rg;
    cx.fillRect(0, 0, W, H);
    var g2 = cx.createLinearGradient(0, H * 0.52, 0, H);
    g2.addColorStop(0, 'rgba(8,15,17,0)');
    g2.addColorStop(1, 'rgba(8,15,17,.52)');
    cx.fillStyle = g2;
    cx.fillRect(0, H * 0.52, W, H * 0.48);
  }

  function paintSun(cx){
    var rg = cx.createRadialGradient(W * 0.90, -H * 0.14, 0, W * 0.90, -H * 0.14, Math.max(W, H) * 0.95);
    rg.addColorStop(0, 'rgba(255,248,216,.90)');
    rg.addColorStop(0.42, 'rgba(255,229,178,.28)');
    rg.addColorStop(1, 'rgba(255,226,172,0)');
    cx.fillStyle = rg;
    cx.fillRect(0, 0, W, H);
  }

  function paintVignette(cx){
    var vg = cx.createRadialGradient(W * 0.5, H * 0.44, Math.min(W, H) * 0.16, W * 0.5, H * 0.5, Math.max(W, H) * 0.86);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(6,11,13,.58)');
    cx.fillStyle = vg;
    cx.fillRect(0, 0, W, H);
  }

  function buildWallBase(){
    var c = wallCtx;
    if (!c) return;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, wallCv.width, wallCv.height);
    c.setTransform(wallScale, 0, 0, wallScale, 0, 0);
    var g = c.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, '#74a9ad');
    g.addColorStop(0.46, '#a9b596');
    g.addColorStop(0.78, '#e2cb96');
    g.addColorStop(1, '#dcb882');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    paintBricks(c);
    paintSun(c);
    paintVignette(c);
    wallBaseW = wallCv.width;
    wallBaseH = wallCv.height;
  }
  function buildWallDetail(){
    var c = wallCtx;
    if (!c) return;
    buildPlaster();
    c.setTransform(wallScale, 0, 0, wallScale, 0, 0);
    paintBricks(c);
    paintSun(c);
    paintVignette(c);
    c.setTransform(1, 0, 0, 1, 0, 0);
    if (plasterCv){
      c.save();
      c.shadowColor = 'rgba(34,22,16,.55)';
      c.shadowBlur = 16 * wallScale;
      c.shadowOffsetY = -5 * wallScale;
      c.drawImage(plasterCv, 0, 0);
      c.restore();
      c.save();
      c.shadowColor = 'rgba(255,224,172,.60)';
      c.shadowBlur = 7 * wallScale;
      c.shadowOffsetY = 2.5 * wallScale;
      c.drawImage(plasterCv, 0, 0);
      c.restore();
    }
    c.setTransform(wallScale, 0, 0, wallScale, 0, 0);
    drawDoor(c);
    drawFigure(c, doorGeo());
    drawCracks(c);
    drawPlinth(c);
    drawFronds(c);
    drawWallExtras(c);
    detailDone = true;
    detailPending = false;
  }

  function renderWall(){
    if (!wallCtx) return;
    var changed = (wallBaseW !== wallCv.width || wallBaseH !== wallCv.height);
    if (changed){
      buildWallBase();
      detailDone = false;
    }
    if (!detailDone && !detailPending){
      detailPending = true;
      var run = function(){
        if (!wallCtx) { detailPending = false; return; }
        try { buildWallDetail(); }
        catch (e) {
          detailPending = false;
          console.error('[475] buildWallDetail failed', e);
          errMsg = String(e && e.message ? e.message : e);
        }
      };
      if (window.requestIdleCallback) window.requestIdleCallback(run, { timeout: 700 });
      else setTimeout(run, 50);
    }
  }

  /* ---------- 老爷车剪影（预渲染一次，每帧只 blit） ---------- */
  function carShapes(cx){
    cx.beginPath();
    cx.moveTo(4, 30);
    cx.lineTo(4, 24);
    cx.quadraticCurveTo(4, 20, 10, 19.4);
    cx.lineTo(96, 19.4);
    cx.quadraticCurveTo(99, 19.6, 99, 23);
    cx.lineTo(99, 30);
    cx.closePath();
    cx.fill();

    cx.beginPath();
    cx.moveTo(5, 21);
    cx.lineTo(7, 12.5);
    cx.quadraticCurveTo(8, 10.6, 11.5, 10.8);
    cx.lineTo(14, 11);
    cx.lineTo(15.5, 19.6);
    cx.closePath();
    cx.fill();

    cx.beginPath();
    cx.moveTo(26, 20);
    cx.lineTo(34, 9.2);
    cx.quadraticCurveTo(40, 6.2, 52, 6.2);
    cx.lineTo(58, 6.4);
    cx.quadraticCurveTo(66.5, 6.8, 70, 10.6);
    cx.lineTo(75, 20);
    cx.closePath();
    cx.fill();

    cx.beginPath();
    cx.ellipse(20, 26.4, 12.4, 6.6, 0, 0, 6.2832);
    cx.fill();
    cx.beginPath();
    cx.ellipse(84, 25.6, 11.6, 6.4, 0, 0, 6.2832);
    cx.fill();

    cx.beginPath();
    cx.ellipse(27, 30, 6.4, 6.4, 0, 0, 6.2832);
    cx.fill();
    cx.beginPath();
    cx.ellipse(79, 30, 6.4, 6.4, 0, 0, 6.2832);
    cx.fill();

    cx.beginPath();
    cx.moveTo(96.4, 20.6);
    cx.quadraticCurveTo(100.4, 21.2, 100.4, 25);
    cx.quadraticCurveTo(100.4, 27.6, 97.6, 27.8);
    cx.lineTo(96.4, 27.8);
    cx.closePath();
    cx.fill();
  }

  function carWindows(cx){
    cx.beginPath();
    cx.moveTo(31.6, 19.2);
    cx.lineTo(37, 10.8);
    cx.quadraticCurveTo(41, 8.8, 49.4, 8.8);
    cx.lineTo(50.4, 8.8);
    cx.lineTo(50.4, 19.2);
    cx.closePath();
    cx.fill();
    cx.beginPath();
    cx.moveTo(54, 19.2);
    cx.lineTo(54, 8.8);
    cx.lineTo(57.6, 8.8);
    cx.quadraticCurveTo(64.6, 9.4, 67.6, 13.6);
    cx.lineTo(70, 19.2);
    cx.closePath();
    cx.fill();
  }

  function buildCar(){
    try {
      var unitW = 104, unitH = 42;
      var s = Math.max(2, Math.min(6, (W * 0.34) / unitW));
      carCv = document.createElement('canvas');
      carCv.width = Math.round(unitW * s);
      carCv.height = Math.round(unitH * s);
      var c = carCv.getContext('2d');
      if (!c) return;
      c.setTransform(s, 0, 0, s, 0, 0);

      /* 米色描边（受光的一侧） */
      c.save();
      c.translate(-1.5, -2.1);
      c.fillStyle = 'rgba(255,236,196,.92)';
      carShapes(c);
      c.restore();

      /* 深色剪影本体 */
      c.globalCompositeOperation = 'source-over';
      var g = c.createLinearGradient(0, 5, 0, 36);
      g.addColorStop(0, 'rgba(46,32,26,.96)');
      g.addColorStop(0.55, 'rgba(32,21,18,.97)');
      g.addColorStop(1, 'rgba(22,15,14,.98)');
      c.fillStyle = g;
      carShapes(c);

      /* 车窗透光 */
      c.globalCompositeOperation = 'destination-out';
      c.fillStyle = 'rgba(0,0,0,.80)';
      carWindows(c);
      c.globalCompositeOperation = 'source-over';

      /* 车顶高光 */
      c.strokeStyle = 'rgba(255,240,205,.30)';
      c.lineWidth = 0.9;
      c.beginPath();
      c.moveTo(35, 8.4);
      c.quadraticCurveTo(44, 5.6, 58, 6.1);
      c.stroke();
    } catch (e) { console.error('[475] buildCar', e); }
  }

  function buildGrain(){
    try {
      var n = 96, cv = document.createElement('canvas');
      cv.width = n; cv.height = n;
      var cx = cv.getContext('2d');
      if (!cx) return;
      var img = cx.createImageData(n, n);
      var d = img.data, rnd = mulberry32(90210), i;
      for (i = 0; i < d.length; i += 4){
        var v = 128 + (rnd() * 2 - 1) * 120;
        d[i] = v; d[i + 1] = v; d[i + 2] = v;
        d[i + 3] = 60 + rnd() * 70;
      }
      cx.putImageData(img, 0, 0);
      if (grainEl) grainEl.style.backgroundImage = 'url(' + cv.toDataURL('image/png') + ')';
    } catch (e) { console.error('[475] grain', e); }
  }

  /* ---------- 动效层 ---------- */
  var motes = null;
  function initMotes(){
    motes = [];
    var rnd = mulberry32(7);
    for (var i = 0; i < 26; i++){
      motes.push({
        x: rnd() * W, y: rnd() * H,
        r: 0.7 + rnd() * 1.9,
        vy: -2.5 - rnd() * 7,
        vx: (rnd() - 0.5) * 5,
        ph: rnd() * 6.283,
        a: 0.18 + rnd() * 0.42
      });
    }
  }

  var palmTex = null, glowTex = null;
  function buildTextures(){
    /* 光斑 */
    try {
      glowTex = document.createElement('canvas');
      glowTex.width = 256; glowTex.height = 256;
      var g2 = glowTex.getContext('2d');
      var rg = g2.createRadialGradient(128, 128, 0, 128, 128, 128);
      rg.addColorStop(0, 'rgba(255,228,180,.95)');
      rg.addColorStop(0.32, 'rgba(255,192,124,.42)');
      rg.addColorStop(0.7, 'rgba(255,160,90,.10)');
      rg.addColorStop(1, 'rgba(255,150,80,0)');
      g2.fillStyle = rg;
      g2.fillRect(0, 0, 256, 256);
    } catch (e) { console.error('[475] glowTex', e); }
  }

  function drawFx(now, dt){
    var c = fxCtx;
    if (!c) return;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, fxCv.width, fxCv.height);
    c.setTransform(fxScaleX, 0, 0, fxScaleY, 0, 0);

    /* 太阳光斑：缓慢呼吸 + 跟随低频 */
    c.globalCompositeOperation = 'lighter';
    if (glowTex){
      var breathe = 0.26 + Math.sin(now * 0.62) * 0.055 + Math.sin(now * 0.21 + 1.7) * 0.045 +
                    live.bass * 0.16 + pulse * 0.10;
      var gs = W * 1.52 + Math.sin(now * 0.37) * W * 0.06;
      c.globalAlpha = clamp(breathe, 0, 0.8);
      c.drawImage(glowTex, W * 0.88 - gs * 0.5 - W * 0.16, -H * 0.52, gs, gs);
    }

    /* 尘埃 */
    if (motes){
      var i, m, tw;
      for (i = 0; i < motes.length; i++){
        m = motes[i];
        m.x += (m.vx + Math.sin(now * 0.5 + m.ph) * 2.2) * dt;
        m.y += m.vy * dt;
        if (m.y < -12){ m.y = H + 12; m.x = (m.x * 1.37 + 97) % W; }
        if (m.x < -12) m.x = W + 12;
        if (m.x > W + 12) m.x = -12;
        tw = 0.52 + 0.48 * Math.sin(now * 1.5 + m.ph);
        c.globalAlpha = m.a * tw;
        c.fillStyle = '#ffe9c4';
        c.beginPath();
        c.arc(m.x, m.y, m.r, 0, 6.283);
        c.fill();
      }
    }
    c.globalAlpha = 1;

    /* 街上的老爷车：缓慢横向漂移 + 拖影，随节拍轻微上浮 */
    if (carCv){
      var span = W + carCv.width * 1.3;
      var drift = reduced ? 0.010 : 0.038;
      var cx0 = W - ((now * drift * W) % span) - carCv.width * 0.55;
      var cy0 = groundY() - carCv.height - H * 0.004 + Math.sin(now * 0.9) * H * 0.004 + pulse * H * 0.004;
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.07;
      c.drawImage(carCv, cx0 - carCv.width * 0.34, cy0 - 1);
      c.globalAlpha = 0.13;
      c.drawImage(carCv, cx0 - carCv.width * 0.17, cy0 - 1);
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 0.95;
      c.drawImage(carCv, cx0, cy0);
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.10 + pulse * 0.10;
      c.fillStyle = '#ffd9a4';
      c.fillRect(cx0 - carCv.width * 0.12, cy0 + carCv.height * 0.56, carCv.width * 1.24, carCv.height * 0.10);
      c.globalAlpha = 1;
    }

    /* 高光呼吸条（极淡，让画面不是死的） */
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.05 + 0.03 * Math.sin(now * 0.8);
    c.fillStyle = '#ffe0b0';
    c.fillRect(0, H * 0.30 + Math.sin(now * 0.5) * H * 0.02, W, H * 0.005);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
  }

  /* ---------- 每帧 DOM 同步（轻） ---------- */
  function rebuildIfNeeded(){
    var first = lyricsEl.querySelector('.ln');
    var haveIdx = first ? (idx >= 0 && first.getAttribute('data-i') === String(Math.max(0, idx - 2))) : false;
    var count = lyricsEl.querySelectorAll('.ln').length;
    var want = lines.length === 0 ? 0 : Math.min(lines.length, Math.max(0, Math.min(lines.length - 1, idx + 2) - Math.max(0, idx - 2) + 1));
    if (idx < 0) want = Math.min(lines.length, 3);
    if (!haveIdx || count !== want) buildLines();
  }

  function syncDom(dt){
    var line = (idx >= 0 && idx < lines.length) ? lines[idx] : null;
    var times, n = 0, lit = 0, i;
    if (line && curChars.length){
      times = charTimes(line);
      n = Math.min(times.length, curChars.length);
      for (i = 0; i < n; i++){
        if (t >= times[i].t - 0.001) lit = i + 1;
        else break;
      }
      if (lit !== litCount){
        if (lit > litCount){
          for (i = litCount; i < lit; i++) curChars[i].classList.add('on');
        } else {
          for (i = lit; i < litCount; i++) curChars[i].classList.remove('on');
        }
        litCount = lit;
      }
    }

    domAcc += dt;
    if (domAcc < 0.18) return;
    domAcc = 0;

    var bar = lyricsEl.querySelector('.ln.cur .bar i');
    if (bar && n > 0) bar.style.width = ((litCount / n) * 100).toFixed(2) + '%';

    var tc = fmt(t);
    if (tc !== clockStr){
      clockStr = tc;
      if (tcEl) tcEl.textContent = tc;
    }
    if (tdEl){
      var d = fmt(duration);
      if (tdEl.textContent !== d) tdEl.textContent = duration > 0 ? d : '--:--';
    }
    if (duration > 0 && ticksEl.children.length){
      var p = clamp(t / duration, 0, 1);
      var k = Math.min(TICKS - 1, Math.floor(p * TICKS));
      if (k !== tickCount){
        var kids = ticksEl.children, j;
        for (j = 0; j < kids.length; j++){
          kids[j].className = j < k ? 'on' : (j === k ? 'now' : '');
        }
        tickCount = k;
      }
    }
  }

  /* ---------- 主循环 ---------- */
  var prev = 0;
  function frame(now){
    requestAnimationFrame(frame);
    var t0 = performance.now();
    try {
      if (!started){ started = true; sendReady(); }
      frames++;
      var ms = (typeof now === 'number' && isFinite(now)) ? now : t0;
      if (!prev) prev = ms;
      var dt = (ms - prev) / 1000;
      prev = ms;
      if (!isFinite(dt) || dt < 0) dt = 0.016;
      if (dt > 0.12) dt = 0.12;

      if (playing) t += dt;
      if (t < 0) t = 0;
      if (isFinite(duration) && duration > 0 && t > duration + 4) t = duration + 4;

      var ni = findIdx(t);
      if (ni !== idx){
        idx = ni;
        buildLines();
        rebuildTicksState();
      }

      beatLevel = Math.max(0, beatLevel - dt * 2.6);
      pulse = Math.max(0, pulse - dt * 2.2);
      drawFx(ms / 1000, dt);
      syncDom(dt);
    } catch (e) {
      errMsg = String(e && e.message ? e.message : e);
      console.error('[475] frame error', e);
    }
    lastJs = performance.now() - t0;
    if (lastJs > 40) lastJs = 40;
  }

  function rebuildTicksState(){ tickCount = -1; }

  /* ---------- 协议 ---------- */
  function onInit(p){
    p = (p && typeof p === 'object') ? p : {};
    var song = (p.song && typeof p.song === 'object') ? p.song : {};
    var id = str(song.id);

    if (songEl){
      var nm = str(song.name).trim();
      songEl.textContent = nm || '未命名';
      songEl.style.opacity = nm ? '1' : '.55';
    }
    if (artistEl){
      var ar = song.artists;
      var at = '';
      if (Array.isArray(ar)) at = ar.map(str).filter(Boolean).join(' · ');
      else at = str(ar);
      artistEl.textContent = at;
      artistEl.style.opacity = at ? '1' : '0';
    }

    if (Array.isArray(p.accent) && p.accent.length >= 3){
      var r = clamp(Math.round(num(p.accent[0], 203)), 0, 255);
      var g = clamp(Math.round(num(p.accent[1], 138)), 0, 255);
      var b = clamp(Math.round(num(p.accent[2], 76)), 0, 255);
      accent = { r: r, g: g, b: b };
      document.documentElement.style.setProperty('--accent', 'rgb(' + r + ',' + g + ',' + b + ')');
    }

    var nl = normalizeLines(p.lines);
    lines = nl;
    duration = clamp(num(p.duration, 0), 0, 36000);
    if (id !== songId){ songId = id; t = 0; prev = 0; }
    if ('playing' in p) playing = !!p.playing;

    if (scene){
      if (lines.length) scene.classList.remove('nolyrics');
      else scene.classList.add('nolyrics');
    }
    buildTicks();
    idx = findIdx(t);
    buildLines();
    tickCount = -1;
    if (duration > 0){
      var kids0 = ticksEl.children, q;
      for (q = 0; q < kids0.length; q++) kids0[q].className = '';
    }
    renderWall();
    layoutLyrics();
  }

  function buildTicks(){
    if (!ticksEl) return;
    ticksEl.innerHTML = '';
    if (!(duration > 0)) return;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < TICKS; i++){
      var el = document.createElement('i');
      frag.appendChild(el);
    }
    ticksEl.appendChild(frag);
    tickCount = -1;
  }

  function onTick(p){
    p = (p && typeof p === 'object') ? p : {};
    var nt = num(p.time, NaN);
    if (isFinite(nt) && nt >= 0){
      if (Math.abs(nt - t) > 0.55) t = nt;
      else t += (nt - t) * 0.35;
    }
    if (typeof p.playing === 'boolean') playing = p.playing;
  }

  function onBeat(p){
    p = (p && typeof p === 'object') ? p : {};
    var lv = clamp(num(p.level, 0.5), 0, 1);
    beatLevel = Math.max(beatLevel, lv);
    pulse = Math.min(1.4, pulse + 0.55 + lv * 0.5);
  }

  function onLive(p){
    p = (p && typeof p === 'object') ? p : {};
    live.bpm = num(p.bpm, live.bpm);
    live.level = clamp(num(p.level, 0), 0, 1);
    live.bass = clamp(num(p.bass, 0), 0, 1);
    live.mid = clamp(num(p.mid, 0), 0, 1);
    live.treble = clamp(num(p.treble, 0), 0, 1);
    if (typeof p.playing === 'boolean') playing = p.playing;
  }

  window.addEventListener('message', function(ev){
    try {
      var d = ev.data;
      if (!d || d.__c100 !== 1) return;
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch (e) {
      errMsg = String(e && e.message ? e.message : e);
      console.error('[475] message error', e);
    }
  });

  var rt = 0;
  window.addEventListener('resize', function(){
    if (rt) return;
    rt = setTimeout(function(){ rt = 0; resize(); }, 120);
  });

  /* ---------- 启动 ---------- */
  buildGrain();
  buildTextures();
  initMotes();
  resize();
  requestAnimationFrame(frame);
  setTimeout(sendReady, 600);
})();
</script>
