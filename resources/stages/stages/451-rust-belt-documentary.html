<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>451 · 铁西 · 高炉无声</title>
<style>
:root{
  --ink:#ece6d9;
  --dim:#6f7472;
  --red:#a82b1e;
  --bgc:#0f1213;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bgc);overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;will-change:transform}
#haze{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 78% at 46% 76%,rgba(198,203,204,.10),transparent 62%);
  opacity:.8}
#vign{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(132% 104% at 50% 44%,transparent 40%,rgba(5,6,6,.74) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.17;background-repeat:repeat;background-size:170px 170px}

#slogan b{display:inline}
#slogan .tall{display:none}
#code{position:fixed;left:6vw;top:5vh;max-width:66vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font:clamp(9px,1.02vw,12px)/1.9 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:.4em;color:#8d918e;opacity:.78;text-transform:uppercase}
#code b{color:var(--red);font-weight:700}

#slogan{position:fixed;right:3.4vw;top:11vh;writing-mode:vertical-rl;text-orientation:upright;
  font-family:"STZhongsong","Songti SC",SimSun,serif;font-weight:700;
  font-size:clamp(19px,3.05vw,42px);letter-spacing:.15em;color:var(--red);
  padding-left:.38em;border-left:2px solid var(--red);
  opacity:.9;
  text-shadow:0 0 26px rgba(168,43,30,.26)}

#mark{position:fixed;right:3.4vw;bottom:7vh;text-align:right;
  font:clamp(8px,.95vw,11px)/1.7 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:.3em;color:#7d817e}
#mark em{display:block;font-style:normal;color:var(--red);font-size:1.35em;letter-spacing:.2em}

#lyric{position:fixed;left:6vw;right:19vw;top:0;bottom:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 17%,#000 72%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 17%,#000 72%,transparent 100%)}
#track{position:relative;--base:clamp(24px,5vw,70px);
  padding:32vh 0 48vh;transition:transform .62s cubic-bezier(.22,.72,.26,1);will-change:transform}
.ln{position:relative;font-size:calc(var(--base) * var(--k,1));line-height:1.32;font-weight:700;
  letter-spacing:.005em;margin:.32em 0;color:#6a6f6c;opacity:.34;
  overflow-wrap:anywhere;word-break:break-word;
  transition:color .45s ease,opacity .45s ease}
.ln.past{color:#8d918e;opacity:.52}
.ln.act{color:var(--ink);opacity:1}
.ln.act::before{content:attr(data-no);position:absolute;left:-1.45em;top:.42em;
  font:700 .24em/1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.1em;
  color:var(--red);opacity:.95}
.c{color:#7c807d;transition:color .28s linear}
.ln.act .c{color:#8f938f}
.ln.act .c.on{color:#f3ede1}

#rule{position:fixed;left:6vw;bottom:8.5vh;width:min(44vw,540px);height:2px;background:rgba(236,230,217,.13)}
#rule i{display:block;height:100%;background:var(--red);transform:scaleX(0);transform-origin:left;
  will-change:transform;box-shadow:0 0 12px rgba(168,43,30,.5)}

#empty{position:fixed;left:6vw;bottom:22vh;opacity:0;visibility:hidden;transition:opacity .5s ease}
#empty.show{opacity:1;visibility:visible}
#empty .box{display:inline-block;border:1px solid rgba(168,43,30,.55);padding:.7em 1.1em;
  font:600 clamp(13px,1.5vw,18px)/1.4 "PingFang SC","Microsoft YaHei",sans-serif;
  letter-spacing:.32em;color:#b9564a;background:rgba(20,17,16,.35)}
#empty .sub{margin-top:.8em;font:clamp(9px,1vw,12px)/1.6 ui-monospace,monospace;
  letter-spacing:.28em;color:#7d817e}

@media (max-aspect-ratio:1/1){
  #lyric{left:13vw;right:8vw}
  #track{--base:clamp(22px,7.2vw,46px)}
  #slogan{right:4vw;top:9vh;font-size:clamp(15px,4.6vw,28px);opacity:.52;letter-spacing:.1em}
  #slogan .row{display:none}
  #slogan .tall{display:inline}
  #code{left:13vw;top:4vh;font-size:8px;letter-spacing:.24em}
  #mark{right:4vw;bottom:5vh;font-size:8px;letter-spacing:.2em}
  #rule{left:13vw;width:66vw;bottom:12vh}
  #empty{left:13vw;bottom:30vh}
  .ln.act::before{left:-1.15em;top:.45em;font-size:.28em}
}
@media (prefers-reduced-motion:reduce){
  #track{transition:none}
  .c{transition:none}
  #bg{transform:none}
  #haze,#slogan{transition:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="haze"></div>
<div id="vign"></div>
<div id="grain"></div>

<div id="code">SHENYANG · <b>NO.07</b> · 1978 · 高炉</div>
<aside id="slogan"><span class="row">安全生产　人人有责</span><span class="tall">安全第一</span></aside>
<div id="mark"><em>GB 78—07</em>停产检修</div>

<main id="lyric"><div id="track"></div></main>
<div id="rule"><i></i></div>
<div id="empty"><div class="box">纯器乐 · 无词</div><div class="sub">SILENT ROLLING MILL</div></div>

<script>
/* ---- top-level bridge: __stage is assigned unconditionally, before anything else ---- */
var S451 = { st: null, err: '' };

window.__stage = function () {
  var s = S451.st;
  if (!s) {
    var rmf = false;
    try { rmf = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { rmf = false; }
    return { lines: 0, idx: -1, t: 0, playing: false, frames: 0, js: 0,
             err: S451.err || '', text: '', gl: false, rm: rmf };
  }
  return {
    lines: s.lines.length,
    idx: s.idx,
    t: s.t,
    playing: s.playing,
    frames: s.frames,
    js: s.js,
    err: S451.err || '',
    text: s.lines[s.idx] ? s.lines[s.idx].text : '',
    gl: false,
    rm: s.rm
  };
};

(function () {
  'use strict';

  var errMsg = '';
  function logErr(e) {
    console.error('[451]', e);
    try { errMsg = String((e && e.message) || e); } catch (e2) { errMsg = 'error'; }
    S451.err = errMsg;
  }

  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d', { alpha: false });
  var off = document.createElement('canvas');
  var octx = off.getContext('2d', { alpha: false });

  var lyricEl = document.getElementById('lyric');
  var trackEl = document.getElementById('track');
  var ruleEl = document.querySelector('#rule i');
  var emptyEl = document.getElementById('empty');
  var sloganEl = document.getElementById('slogan');
  var codeEl = document.getElementById('code');

  var view = { w: 1440, h: 900 };
  var DPR = 1;

  var st = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    gl: false, rm: false, baseT: 0, baseAt: 0, charPtr: 0,
    pulse: 0, level: 0, lastTs: 0
  };

  var rmq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  st.rm = !!(rmq && rmq.matches);
  if (rmq && rmq.addEventListener) rmq.addEventListener('change', function (e) { st.rm = !!e.matches; });

  S451.st = st;

  function num(v, d) { v = +v; return isFinite(v) ? v : d; }
  /* ---------------- canvas scene ---------------- */
  var lamp = { x: 0, y: 0 };
  var flakes = [];

  function rnd(i) {
    var x = Math.sin(i * 12.9898 + 4.1414) * 43758.5453;
    return x - Math.floor(x);
  }

  function buildPlate() {
    var w = view.w, h = view.h;
    var horizon = h * 0.70;
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    octx.clearRect(0, 0, w, h);

    // sky: cold overcast, slightly warmer at the smog line
    var g = octx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#111617');
    g.addColorStop(0.42, '#20272a');
    g.addColorStop(0.66, '#2e3230');
    g.addColorStop(0.72, '#3b3a33');
    g.addColorStop(1, '#0e1112');
    octx.fillStyle = g;
    octx.fillRect(0, 0, w, h);

    // smog band
    var fog = octx.createLinearGradient(0, h * 0.42, 0, h * 0.86);
    fog.addColorStop(0, 'rgba(186,192,193,0)');
    fog.addColorStop(0.42, 'rgba(186,192,193,0.13)');
    fog.addColorStop(1, 'rgba(150,155,156,0)');
    octx.fillStyle = fog;
    octx.fillRect(0, h * 0.42, w, h * 0.44);

    // far city blocks
    var i, x, bw, bh, n = 26;
    octx.fillStyle = 'rgba(24,29,30,0.92)';
    for (i = 0; i < n; i++) {
      x = (i / n) * w - 10;
      bw = (w / n) * (0.55 + rnd(i) * 0.8);
      bh = h * (0.03 + rnd(i + 7) * 0.075);
      octx.fillRect(x, horizon - bh, bw, bh);
    }

    // near industrial skyline
    octx.fillStyle = '#0d1011';
    for (i = 0; i < 12; i++) {
      x = (i / 12) * w - 20;
      bw = (w / 12) * (0.7 + rnd(i + 21) * 0.9);
      bh = h * (0.06 + rnd(i + 31) * 0.13);
      octx.fillRect(x, horizon - bh, bw, bh + h * 0.3);
    }

    // twin chimneys
    var cx1 = w * 0.155, cx2 = w * 0.205;
    octx.fillStyle = '#0a0c0d';
    octx.fillRect(cx1, horizon - h * 0.40, w * 0.017, h * 0.42);
    octx.fillRect(cx2, horizon - h * 0.33, w * 0.014, h * 0.36);
    octx.fillRect(cx1 - w * 0.008, horizon - h * 0.405, w * 0.033, h * 0.012);

    // conveyor truss rising to the right
    octx.save();
    octx.strokeStyle = '#0b0d0e';
    octx.lineWidth = Math.max(3, w * 0.006);
    octx.beginPath();
    octx.moveTo(-w * 0.02, horizon - h * 0.02);
    octx.lineTo(w * 0.56, horizon - h * 0.235);
    octx.stroke();
    octx.lineWidth = Math.max(1, w * 0.0016);
    octx.globalAlpha = 0.9;
    for (i = 0; i < 22; i++) {
      var p0 = i / 22, p1 = (i + 1) / 22;
      var ax = -w * 0.02 + (w * 0.58) * p0, ay = horizon - h * 0.02 - h * 0.215 * p0;
      var bx = -w * 0.02 + (w * 0.58) * p1, by = horizon - h * 0.02 - h * 0.215 * p1;
      octx.beginPath();
      octx.moveTo(ax, ay + h * 0.012);
      octx.lineTo(bx, by - h * 0.012);
      octx.stroke();
    }
    octx.restore();

    // gantry crane (龙门吊) on the right third
    var gx = w * 0.60, gw = w * 0.30, top = h * 0.335, legY = horizon + h * 0.05;
    octx.strokeStyle = '#0a0c0d';
    octx.lineWidth = Math.max(3, w * 0.0055);
    octx.lineJoin = 'miter';
    octx.beginPath();
    octx.moveTo(gx, legY); octx.lineTo(gx + w * 0.012, top);
    octx.lineTo(gx + gw, top); octx.lineTo(gx + gw + w * 0.012, legY);
    octx.stroke();
    // top beam girders
    octx.lineWidth = Math.max(2, w * 0.003);
    octx.beginPath();
    octx.moveTo(gx + w * 0.012, top + h * 0.012);
    octx.lineTo(gx + gw, top + h * 0.012);
    octx.moveTo(gx + w * 0.012, top + h * 0.012);
    octx.lineTo(gx + gw, top + h * 0.055);
    octx.moveTo(gx + gw, top + h * 0.012);
    octx.lineTo(gx + w * 0.012, top + h * 0.055);
    octx.stroke();
    // hanging hook block
    octx.lineWidth = Math.max(1.4, w * 0.0014);
    octx.beginPath();
    octx.moveTo(gx + gw * 0.52, top + h * 0.05);
    octx.lineTo(gx + gw * 0.52, top + h * 0.20);
    octx.stroke();
    octx.fillStyle = '#0a0c0d';
    octx.fillRect(gx + gw * 0.52 - w * 0.012, top + h * 0.20, w * 0.024, h * 0.016);

    lamp.x = gx + gw * 0.52;
    lamp.y = top - h * 0.012;

    // rust drips / streaking on the lower band
    var j;
    for (j = 0; j < 34; j++) {
      var dx = rnd(j + 60) * w;
      var dh = h * (0.05 + rnd(j + 90) * 0.20);
      var dy = horizon - dh;
      octx.fillStyle = 'rgba(122,58,34,' + (0.05 + rnd(j + 120) * 0.09).toFixed(3) + ')';
      octx.fillRect(dx, dy, 1 + rnd(j + 150) * 2.4, dh);
    }

    // ground
    octx.fillStyle = '#0b0e0f';
    octx.fillRect(0, horizon + h * 0.045, w, h);
    var gr = octx.createLinearGradient(0, horizon, 0, h);
    gr.addColorStop(0, 'rgba(150,152,148,0.10)');
    gr.addColorStop(0.4, 'rgba(20,23,24,0)');
    octx.fillStyle = gr;
    octx.fillRect(0, horizon - h * 0.02, w, h * 0.2);
  }

  function seedFlakes() {
    flakes = [];
    var n = st.rm ? 16 : 54;
    for (var i = 0; i < n; i++) {
      flakes.push({
        x: rnd(i + 200) * view.w,
        y: rnd(i + 300) * view.h,
        r: 0.7 + rnd(i + 400) * 1.9,
        vy: 8 + rnd(i + 500) * 26,
        vx: 14 + rnd(i + 600) * 26,
        a: 0.10 + rnd(i + 700) * 0.22
      });
    }
  }

  function frameDraw(dt) {
    var w = view.w, h = view.h;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(off, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // beacon on the crane
    var pl = st.pulse, pulseR = (10 + pl * 26) * (Math.min(w, h) / 900 + 0.45);
    ctx.fillStyle = 'rgba(168,43,30,' + (0.14 + pl * 0.26).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(lamp.x, lamp.y, pulseR, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(206,74,52,' + (0.55 + pl * 0.45).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(lamp.x, lamp.y, Math.max(1.6, pulseR * 0.13), 0, 6.2832); ctx.fill();

    // drifting snow / ash
    var i, f;
    ctx.fillStyle = 'rgba(226,230,228,0.7)';
    for (i = 0; i < flakes.length; i++) {
      f = flakes[i];
      f.y += f.vy * dt;
      f.x += f.vx * dt;
      if (f.y > h + 6) { f.y = -6; f.x = rnd(i + st.frames) * w; }
      if (f.x > w + 6) f.x = -6;
      ctx.globalAlpha = f.a;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawScene() {
    buildPlate();
    seedFlakes();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(off, 0, 0);
  }

  function resize() {
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    w = Math.max(320, Math.min(6000, w));
    h = Math.max(320, Math.min(6000, h));
    view.w = w; view.h = h;
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    off.width = canvas.width;
    off.height = canvas.height;
    drawScene();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(off, 0, 0);
    positionTrack();
  }

  /* ---------------- lyrics ---------------- */
  function clearTrack() {
    trackEl.textContent = '';
    st.lines = [];
    st.idx = -1;
    st.charPtr = 0;
  }

  function buildLines(payload) {
    clearTrack();
    var src = payload && payload.lines;
    var out = [];
    if (Array.isArray(src)) {
      for (var i = 0; i < src.length; i++) {
        var raw = src[i] || {};
        var text = raw.text == null ? '' : String(raw.text);
        if (!text) continue;
        out.push({
          t: num(raw.t, 0),
          dur: num(raw.dur, 0),
          text: text,
          chars: Array.isArray(raw.chars) ? raw.chars : null,
          el: null,
          charT: [],
          lastT: -1e9
        });
      }
    }
    out.sort(function (a, b) { return a.t - b.t; });

    var frag = document.createDocumentFragment();
    for (var j = 0; j < out.length; j++) {
      var ln = out[j];
      var nextT = j + 1 < out.length ? out[j + 1].t : ln.t + Math.max(2.2, ln.text.length * 0.24);
      var dur = ln.dur > 0 ? Math.min(30, ln.dur) : Math.max(0.6, nextT - ln.t);
      ln.dur = dur;

      var el = document.createElement('div');
      el.className = 'ln';
      el.setAttribute('data-no', j < 9 ? '0' + (j + 1) : String(j + 1));
      var chars = ln.text.split('');
      var n = chars.length;
      var k = n > 26 ? 0.56 : n > 17 ? 0.72 : n > 11 ? 0.86 : 1;
      el.style.setProperty('--k', k);

      var ct = ln.chars;
      var ok = ct && ct.length === n;
      var tm = [];
      for (var c = 0; c < n; c++) {
        var sp = document.createElement('span');
        sp.className = 'c';
        sp.textContent = chars[c] === ' ' ? '\u00a0' : chars[c];
        el.appendChild(sp);
        var base = ln.t + dur * (n > 1 ? c / n : 0);
        if (ok && ct[c] && isFinite(+ct[c].t)) base = +ct[c].t;
        tm.push(base);
      }
      ln.charT = tm;
      ln.el = el;
      frag.appendChild(el);
    }
    trackEl.appendChild(frag);
    st.lines = out;
    st.idx = -1;
    st.charPtr = 0;

    if (!out.length) {
      emptyEl.classList.add('show');
      ruleEl.style.transform = 'scaleX(0)';
      trackEl.style.transform = 'translate3d(0,0,0)';
    } else {
      emptyEl.classList.remove('show');
    }
    update(st.t);
  }

  function setActive(idx) {
    var old = st.lines[st.idx];
    if (old && old.el) { old.el.classList.remove('act'); old.el.classList.add('past'); }
    st.idx = idx;
    var cur = st.lines[idx];
    if (cur && cur.el) {
      cur.el.classList.remove('past');
      cur.el.classList.add('act');
      var kids = cur.el.children;
      for (var i = 0; i < kids.length; i++) kids[i].classList.remove('on');
      cur.lastT = -1e9;
    }
    var j;
    for (j = idx + 1; j < st.lines.length; j++) {
      if (st.lines[j].el) st.lines[j].el.classList.remove('past');
    }
    st.charPtr = 0;
    positionTrack();
  }

  function positionTrack() {
    var cur = st.lines[st.idx];
    if (!cur || !cur.el) { trackEl.style.transform = 'translate3d(0,0,0)'; return; }
    var anchor = lyricEl.clientHeight * 0.6;
    var y = anchor - (cur.el.offsetTop + cur.el.offsetHeight / 2);
    trackEl.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
  }

  function lightChars(line, t) {
    var n = line.charT.length, k = st.charPtr;
    if (n <= 0) return;
    if (t < line.lastT - 0.06) {
      var kids = line.el.children;
      for (var i = 0; i < kids.length; i++) kids[i].classList.remove('on');
      k = 0;
    }
    var kids2 = line.el.children;
    while (k < n && line.charT[k] <= t) {
      if (kids2[k]) kids2[k].classList.add('on');
      k++;
    }
    line.lastT = t;
    st.charPtr = k;
  }

  function update(t) {
    var L = st.lines;
    if (!L.length) {
      st.idx = -1;
      ruleEl.style.transform = 'scaleX(0)';
      return;
    }
    var idx = -1, i;
    for (i = 0; i < L.length; i++) { if (L[i].t <= t + 0.001) idx = i; }
    if (idx !== st.idx) setActive(idx);
    var cur = L[idx];
    if (!cur) return;
    lightChars(cur, t);
    var p = cur.dur > 0 ? (t - cur.t) / cur.dur : 1;
    if (!isFinite(p)) p = 0;
    p = p < 0 ? 0 : p > 1 ? 1 : p;
    ruleEl.style.transform = 'scaleX(' + p.toFixed(4) + ')';
  }

  /* ---------------- time ---------------- */
  function nowTime(ts) {
    if (!st.playing) return st.baseT;
    var dt = (ts - st.baseAt) / 1000;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 1.2) dt = 1.2;
    return st.baseT + dt;
  }

  /* ---------------- loop ---------------- */
  var rafId = 0;
  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    var t0 = performance.now();
    try {
      st.frames++;
      var t = nowTime(ts);
      st.t = t;
      update(t);
      var gap = ts - st.lastTs;
      if (!isFinite(gap) || gap < 0) gap = 16;
      var dt = Math.min(0.05, gap / 1000);
      if (!st.rm) {
        st.pulse = Math.max(0, st.pulse - gap * 0.0028);
      } else {
        st.pulse = 0;
      }
      st.level = Math.max(0, st.level - gap * 0.0004);
      frameDraw(dt);
      st.lastTs = ts;
    } catch (e) {
      logErr(e);
    }
    st.js = Math.round((performance.now() - t0) * 100) / 100;
  }

  /* ---------------- messages ---------------- */
  function onInit(p) {
    p = p || {};
    st.baseT = 0;
    st.baseAt = performance.now();
    st.playing = p.playing === false ? false : true;
    st.t = 0;
    st.pulse = 0;
    st.level = 0;
    applyAccent(p.accent);
    var song = p.song || {};
    var nm = song && song.name != null ? String(song.name) : '';
    var art = song && song.artists;
    if (Array.isArray(art)) art = art.join(' / ');
    art = art == null ? '' : String(art);
    var label = (nm || '未命名').slice(0, 18);
    if (art) label += ' · ' + art.slice(0, 14);

    codeEl.innerHTML = '';
    var b = document.createElement('b');
    b.textContent = 'NO.07';
    codeEl.appendChild(document.createTextNode('沈阳 · '));
    codeEl.appendChild(b);
    codeEl.appendChild(document.createTextNode(' · 1978 · ' + label.toUpperCase()));
    buildLines(p);
  }

  function applyAccent(a) {
    var r = 168, g = 43, bl = 30;
    if (a && a.length >= 3) {
      var ar = +a[0], ag = +a[1], ab = +a[2];
      if (isFinite(ar) && isFinite(ag) && isFinite(ab)) {
        // keep the rust register: pull the cover colour 45% toward the red marker
        r = Math.round(ar * 0.45 + r * 0.55);
        g = Math.round(ag * 0.45 + g * 0.55);
        bl = Math.round(ab * 0.45 + bl * 0.55);
      }
    }
    var mx = Math.max(r, g, bl) || 1;
    if (mx < 90) { var k = 90 / mx; r = Math.min(255, r * k); g = Math.min(255, g * k); bl = Math.min(255, bl * k); }
    document.documentElement.style.setProperty('--red', 'rgb(' + r + ',' + g + ',' + bl + ')');
  }

  function onTick(p) {
    p = p || {};
    var t = num(p.time, st.t);
    if (t < 0) t = 0;
    st.baseT = t;
    st.baseAt = performance.now();
    st.t = t;
    if (typeof p.playing === 'boolean') st.playing = p.playing;
  }

  function onBeat(p) {
    p = p || {};
    var lv = num(p.level, 0.6);
    st.pulse = Math.min(1, Math.max(st.pulse, 0.35 + lv * 0.65));
  }

  function onLive(p) {
    p = p || {};
    st.level = Math.min(1, Math.max(0, num(p.bass, num(p.level, 0))));
    if (p.playing === false) st.playing = false;
    else if (p.playing === true) st.playing = true;
  }

  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch (err) { logErr(err); }
  });

  /* ---------------- ready ---------------- */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { logErr(e); }
  }

  function makeGrain() {
    try {
      var g = document.createElement('canvas');
      g.width = 128; g.height = 128;
      var gc = g.getContext('2d');
      var img = gc.createImageData(128, 128);
      var d = img.data;
      for (var i = 0; i < d.length; i += 4) {
        var v = 128 + (Math.random() * 90 - 45);
        d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 46;
      }
      gc.putImageData(img, 0, 0);
      document.getElementById('grain').style.backgroundImage = 'url(' + g.toDataURL('image/png') + ')';
    } catch (e) { logErr(e); }
  }

  resize();
  makeGrain();
  window.addEventListener('resize', function () {
    try { resize(); } catch (e) { logErr(e); }
  });
  window.addEventListener('orientationchange', function () {
    try { setTimeout(resize, 120); } catch (e) { logErr(e); }
  });

  requestAnimationFrame(function (ts) {
    sendReady();
    if (!rafId) loop(ts);
  });
  setTimeout(sendReady, 800);

  // last-resort guard: if the first frame was never delivered, still honour the
  // ready contract (sendReady is idempotent, the loop starts only once).
  setTimeout(function () {
    try {
      sendReady();
      if (!rafId) loop(performance.now());
    } catch (e) { logErr(e); }
  }, 1300);
})();
</script>
</body>
</html>
