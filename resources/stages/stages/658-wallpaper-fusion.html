<!-- 658 —— 壁纸融合：当前 Wallpaper Engine 壁纸铺底，歌词以多机位运镜压在其上。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>658 · 壁纸融合</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05060b}
  #bg,#fg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:0}
  #fg{z-index:1;pointer-events:none}
  .wpmedia{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

  /* ---- 壁纸选择：入口按钮 ---- */
  #wpBtn{
    position:fixed;right:18px;bottom:46px;z-index:15;
    padding:7px 11px;border-radius:2px;
    font:500 11px/1 ui-monospace,"SFMono-Regular",Consolas,Menlo,monospace;
    letter-spacing:.2em;color:rgba(233,240,255,.70);
    background:rgba(8,10,17,.34);border:1px solid rgba(255,255,255,.26);
    cursor:pointer;pointer-events:auto;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:opacity .5s ease,color .18s ease,border-color .18s ease;
    -webkit-appearance:none;appearance:none;
  }
  #wpBtn:hover{color:#fff;border-color:rgba(255,255,255,.55)}
  #wpBtn.idle{opacity:0;pointer-events:none}

  /* ---- 壁纸选择：右侧抽屉 ---- */
  #wpPanel{
    --ac:255,255,255;
    position:fixed;top:0;right:0;bottom:0;left:auto;z-index:20;
    width:min(380px,92vw);
    display:none;flex-direction:column;
    background:rgba(9,11,19,.74);
    border-left:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:#e9eefb;outline:none;
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.22,.61,.36,1);
  }
  #wpPanel.on{transform:translateX(0)}
  .wpHead{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 12px;flex:none;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .wpTitle{font-size:12px;letter-spacing:.16em;color:rgba(236,242,255,.86)}
  #wpCount{color:rgba(236,242,255,.40);letter-spacing:.06em}
  #wpClose{
    width:26px;height:26px;padding:0;line-height:22px;text-align:center;
    font-size:16px;color:rgba(236,242,255,.60);background:transparent;
    border:1px solid rgba(255,255,255,.18);border-radius:2px;cursor:pointer;
  }
  #wpClose:hover{color:#fff;border-color:rgba(255,255,255,.5)}
  #wpBody{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px 0 18px;-webkit-overflow-scrolling:touch}
  .wpFollow{
    display:flex;align-items:center;gap:9px;
    margin:0 14px 12px;padding:11px 12px;
    border:1px solid rgba(255,255,255,.14);border-radius:3px;
    background:rgba(255,255,255,.025);cursor:pointer;
    font-size:12px;color:rgba(236,242,255,.82);letter-spacing:.04em;outline-offset:-2px;
  }
  .wpFollow:hover{background:rgba(255,255,255,.06)}
  .wpFollow.sel{outline:2px solid rgba(var(--ac),1);border-color:transparent}
  .wpDot{width:6px;height:6px;border-radius:50%;background:rgba(236,242,255,.5);flex:none}
  .wpFollow.sel .wpDot{background:rgba(var(--ac),1);box-shadow:0 0 8px rgba(var(--ac),.8)}
  .wpNote{margin:0 16px 12px;font-size:10.5px;line-height:1.5;color:rgba(236,242,255,.42);letter-spacing:.04em}
  .wpGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:0 14px}
  .wpCard{min-width:0;cursor:pointer;outline:none}
  .wpThumb{
    position:relative;aspect-ratio:16/10;border-radius:3px;overflow:hidden;
    background:linear-gradient(135deg,rgba(28,32,46,.9),rgba(12,14,21,.9));
    border:1px solid rgba(255,255,255,.07);
  }
  .wpCard:hover .wpThumb{border-color:rgba(255,255,255,.26)}
  .wpCard.sel .wpThumb{outline:2px solid rgba(var(--ac),1);outline-offset:-2px;border-color:transparent}
  .wpCard:focus-visible .wpThumb{outline:1px solid rgba(255,255,255,.62);outline-offset:-2px}
  .wpPrev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .wpBadge{
    position:absolute;top:5px;right:5px;z-index:2;
    padding:2px 5px;border-radius:2px;
    font-size:9px;line-height:1.2;letter-spacing:.08em;
    color:rgba(240,245,255,.82);background:rgba(0,0,0,.52);
    border:1px solid rgba(255,255,255,.14);
  }
  .wpName{
    margin-top:6px;font-size:11px;line-height:1.35;color:rgba(233,239,252,.66);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .wpCard.sel .wpName{color:rgba(240,246,255,.92)}
  @media (prefers-reduced-motion: reduce){
    #wpPanel{transition:none}
    #wpBtn{transition:none}
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fg" aria-hidden="true"></canvas>
<button id="wpBtn" type="button" aria-label="选择壁纸">壁纸</button>
<div id="wpPanel" role="dialog" aria-modal="true" aria-label="本机壁纸" aria-hidden="true" tabindex="-1">
  <div class="wpHead">
    <div class="wpTitle">本机壁纸<span id="wpCount"></span></div>
    <button id="wpClose" type="button" aria-label="关闭">×</button>
  </div>
  <div id="wpBody">
    <div id="wpFollow" class="wpFollow" role="button" tabindex="0">
      <span class="wpDot"></span><span>跟随 Wallpaper Engine</span>
    </div>
    <div id="wpNote" class="wpNote" hidden>壁纸列表接口未就绪</div>
    <div id="wpGrid" class="wpGrid"></div>
  </div>
</div>
<script>
"use strict";
(function () {

  /* ================= 0. 状态 ================= */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}
  var W = 1, H = 1, dpr = 1;

  var AC = [138, 160, 255];
  var DUR = 0;
  var songTitle = "", songArtist = "", coverUrl = "";
  var coverImg = null, coverTried = "", blurCv = null, fbCv = null;

  var liveBpm = 0, liveLevel = 0, liveBass = 0, liveMid = 0, liveTreble = 0, liveGlow = 0;
  var beatPulse = 0, lastBeatAt = -9;
  var dimTarget = 0.46, dimCur = 0.46;
  var lastSampleWall = 0;

  var animT = 0, lastTs = 0, frozen = false;
  var lastTickWall = 0;
  var running = true, rafId = 0, booted = false, started = false;
  var readySent = false;

  var FONT = '"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif';
  var MONO = 'ui-monospace,"SFMono-Regular",Consolas,Menlo,monospace';

  var bgCanvas = document.getElementById("bg");
  var fgCanvas = document.getElementById("fg");
  var bgCtx = bgCanvas.getContext("2d", { alpha: false });
  var fgCtx = fgCanvas.getContext("2d", { alpha: true });
  var measureCv = document.createElement("canvas");
  var measureCtx = measureCv.getContext("2d");
  var sampleCv = document.createElement("canvas");
  sampleCv.width = 32; sampleCv.height = 18;
  var sampleCtx = sampleCv.getContext("2d", { willReadFrequently: true });
  var noiseCv = null, noisePat = null, scanCv = null, scanPat = null;

  /* ================= 1. 自检接口（恰好 10 字段） ================= */
  window.__stage = function () {
    var i = S.idx, L = S.lines, tx = "";
    if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
    return {
      lines: L.length, idx: i, t: S.t, playing: !!S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
      text: tx, gl: false, rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var n = (window.performance && performance.now()) || Date.now();
    if (n - lastErrAt > 1000) { lastErrAt = n; try { console.error(e); } catch (_) {} }
  }

  /* ================= 2. 工具 ================= */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }
  function mix(a, b, p) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * p),
      Math.round(a[1] + (b[1] - a[1]) * p),
      Math.round(a[2] + (b[2] - a[2]) * p)
    ];
  }
  function easeOutCubic(p) { var q = 1 - p; return 1 - q * q * q; }
  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function fontFor(fs) { return "600 " + fs.toFixed(1) + "px " + FONT; }
  function fmtTime(t) {
    t = Math.max(0, t || 0);
    var m = Math.floor(t / 60), s = t - m * 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
  }
  function normAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return AC;
    var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return AC;
    r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
    if (r + g + b < 45) return AC;
    return [r, g, b];
  }

  /* ================= 3. ready：首帧无条件 + 800ms 兜底，同一守卫 ================= */
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }
  requestAnimationFrame(function () { sendReady(); start(); });
  setTimeout(function () { sendReady(); start(); }, 800);

  /* ================= 4. 画布 / resize ================= */
  function resize() {
    W = Math.max(1, window.innerWidth || 1);
    H = Math.max(1, window.innerHeight || 1);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var bw = Math.max(1, Math.round(W * dpr));
    var bh = Math.max(1, Math.round(H * dpr));
    if (bgCanvas.width !== bw) bgCanvas.width = bw;
    if (bgCanvas.height !== bh) bgCanvas.height = bh;
    if (fgCanvas.width !== bw) fgCanvas.width = bw;
    if (fgCanvas.height !== bh) fgCanvas.height = bh;
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildPatterns();
    buildFallback();
    T.seen = -2;
    T.ghost = null;
  }

  function buildPatterns() {
    if (!scanCv) {
      scanCv = document.createElement("canvas");
      scanCv.width = 1; scanCv.height = 3;
      var sg = scanCv.getContext("2d");
      sg.fillStyle = "rgba(0,0,0,0.5)";
      sg.fillRect(0, 2, 1, 1);
    }
    if (!noiseCv) {
      noiseCv = document.createElement("canvas");
      noiseCv.width = 128; noiseCv.height = 128;
      var ng = noiseCv.getContext("2d");
      var id = ng.createImageData(128, 128);
      for (var i = 0; i < id.data.length; i += 4) {
        var v = (Math.random() * 255) | 0;
        id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = 255;
      }
      ng.putImageData(id, 0, 0);
    }
    try { scanPat = fgCtx.createPattern(scanCv, "repeat"); } catch (e) { scanPat = null; }
    try { noisePat = fgCtx.createPattern(noiseCv, "repeat"); } catch (e) { noisePat = null; }
  }

  /* ================= 5. 降级背景：封面重模糊 + accent 渐变 + 噪点 ================= */
  function drawCoverInto(g, im, cw, ch, alpha) {
    var iw = im.naturalWidth || im.width || 0, ih = im.naturalHeight || im.height || 0;
    if (!iw || !ih) return;
    var s = Math.max(cw / iw, ch / ih);
    var dw = iw * s, dh = ih * s;
    g.globalAlpha = alpha;
    g.drawImage(im, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
    g.globalAlpha = 1;
  }

  function buildBlurCache() {
    if (!coverImg) { blurCv = null; return; }
    var cw = 240, ch = Math.max(90, Math.round(cw * H / Math.max(1, W)));
    if (ch > 420) ch = 420;
    var cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    var b = cv.getContext("2d");
    b.fillStyle = "#06070d";
    b.fillRect(0, 0, cw, ch);
    try { b.filter = "blur(11px)"; } catch (e) {}
    drawCoverInto(b, coverImg, cw, ch, 1);
    try { b.filter = "none"; } catch (e) {}
    blurCv = cv;
  }

  function buildFallback() {
    if (W < 2 || H < 2) return;
    buildBlurCache();
    var cv = fbCv || document.createElement("canvas");
    cv.width = Math.round(W);
    cv.height = Math.round(H);
    var g = cv.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = "#05060b";
    g.fillRect(0, 0, W, H);

    var c1 = mix(AC, [5, 6, 12], 0.62);
    var c2 = mix(AC, [5, 6, 12], 0.82);
    var rg = g.createRadialGradient(W * 0.74, H * 0.26, 0, W * 0.74, H * 0.26, Math.max(W, H) * 0.86);
    rg.addColorStop(0, rgba(c1, 0.92));
    rg.addColorStop(0.5, rgba(c2, 0.5));
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    var ac2 = [AC[2], AC[0], AC[1]];
    var rg2 = g.createRadialGradient(W * 0.18, H * 0.82, 0, W * 0.18, H * 0.82, Math.max(W, H) * 0.7);
    rg2.addColorStop(0, rgba(mix(ac2, [5, 6, 12], 0.62), 0.55));
    rg2.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg2;
    g.fillRect(0, 0, W, H);

    if (blurCv) drawCoverInto(g, blurCv, W, H, 0.52);

    if (noisePat) {
      g.globalAlpha = 0.05;
      g.fillStyle = noisePat;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }

    var vg = g.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.2, W * 0.5, H * 0.5, Math.max(W, H) * 0.76);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.6)");
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);

    fbCv = cv;
  }

  function loadCover(url) {
    url = url ? String(url) : "";
    if (url === coverTried) return;
    coverTried = url;
    coverUrl = url;
    coverImg = null;
    blurCv = null;
    if (!url) { buildFallback(); return; }
    var im = new Image();
    im.onload = function () {
      if (coverTried !== url) return;
      coverImg = im;
      buildFallback();
    };
    im.onerror = function () {
      if (coverTried !== url) return;
      coverImg = null;
      buildFallback();
    };
    im.src = url;
  }

  /* ================= 6. 壁纸层：探测 / 重建 / 交叉淡化 ================= */
  var wp = {
    key: "", title: "", kind: "", has: false,
    mode: "follow", pickId: "",
    cur: null, prev: null, fadeStart: -1, busy: false, timer: 0
  };

  function makeLayer(kind, d) {
    var L = { kind: kind, el: null, ready: false, t0: animT, seed: hash(animT + Math.random() * 97) * 6, data: d, degraded: false };
    if (kind === "video") {
      var v = document.createElement("video");
      v.className = "wpmedia";
      v.muted = true;
      v.loop = true;
      v.autoplay = true;
      v.setAttribute("muted", "");
      v.setAttribute("playsinline", "");
      v.setAttribute("loop", "");
      v.addEventListener("loadeddata", function () { L.ready = true; });
      v.addEventListener("canplay", function () { L.ready = true; });
      v.addEventListener("error", function () { downgradeToPreview(L); });
      v.src = d.media || "/api/wallpaper/media";
      L.el = v;
      try { document.body.appendChild(v); } catch (e) {}
      var pr = null;
      try { pr = v.play(); } catch (e) {}
      if (pr && pr.catch) {
        pr.catch(function () {
          setTimeout(function () { if (!L.ready) downgradeToPreview(L); }, 900);
        });
      }
    } else {
      var im = new Image();
      im.onload = function () { L.ready = true; };
      im.onerror = function () {
        L.kind = "fallback";
        L.el = null;
        L.ready = true;
        if (L.onFail) { try { L.onFail(); } catch (e) {} }
      };
      im.src = d.preview || "/api/wallpaper/preview";
      L.el = im;
    }
    return L;
  }

  function downgradeToPreview(L) {
    if (!L || L.degraded || L.disposed) return;
    L.degraded = true;
    var src = (L.data && (L.data.preview || "/api/wallpaper/preview")) || "/api/wallpaper/preview";
    try {
      if (L.el && L.el.tagName === "VIDEO") {
        L.el.pause();
        L.el.removeAttribute("src");
        L.el.load();
        if (L.el.parentNode) L.el.parentNode.removeChild(L.el);
      }
    } catch (e) {}
    var im = new Image();
    im.onload = function () { L.kind = "image"; L.el = im; L.ready = true; };
    im.onerror = function () {
      L.kind = "fallback"; L.el = null; L.ready = true;
      if (L.onFail) { try { L.onFail(); } catch (e) {} }
    };
    im.src = src;
    L.kind = "image";
    L.el = im;
    L.ready = false;
  }

  function disposeLayer(L) {
    if (!L) return;
    L.disposed = true;
    try {
      if (L.el && L.el.tagName === "VIDEO") {
        L.el.pause();
        L.el.removeAttribute("src");
        L.el.load();
        if (L.el.parentNode) L.el.parentNode.removeChild(L.el);
      }
    } catch (e) {}
    L.el = null;
  }

  function swapLayer(L) {
    if (wp.cur) {
      if (wp.prev) disposeLayer(wp.prev);
      wp.prev = wp.cur;
    }
    wp.cur = L;
    wp.fadeStart = -1;
  }

  /* 唯一的重建入口：轮询、手选、降级都走这里 */
  function rebuildBackground(desc) {
    desc = desc || {};
    if (desc.key === wp.key) return;
    wp.key = String(desc.key || "fallback");
    wp.has = !!desc.ok;
    wp.title = desc.ok ? String(desc.title || "") : "";
    wp.kind = desc.ok ? (desc.kind === "video" ? "video" : "image") : "fallback";
    var L;
    if (desc.ok) L = makeLayer(wp.kind, desc);
    else L = { kind: "fallback", el: null, ready: true, t0: animT, seed: 1, data: null, degraded: true };
    L.onFail = typeof desc.fail === "function" ? desc.fail : null;
    swapLayer(L);
  }

  /* Wallpaper Engine 轮询结果 -> 描述信息（跟随模式） */
  function applyWallpaper(d) {
    if (wp.mode === "pick") return;
    var ok = !!(d && d.ok);
    var kind = ok ? (String(d.kind || "image") === "video" ? "video" : "image") : "fallback";
    var key = ok
      ? ("wp|" + kind + "|" + String(d.title || "") + "|" + Number(d.width || 0) + "|" + Number(d.height || 0))
      : "fallback";
    rebuildBackground({
      ok: ok, key: key, kind: kind, title: ok ? String(d.title || "") : "",
      preview: "/api/wallpaper/preview", media: "/api/wallpaper/media"
    });
  }

  function checkWallpaper() {
    if (!running || wp.busy || wp.mode !== "follow") return;
    wp.busy = true;
    var p;
    try { p = fetch("/api/wallpaper", { cache: "no-store", credentials: "same-origin" }); }
    catch (e) { wp.busy = false; return; }
    p.then(function (r) { return r.json(); })
      .then(function (d) { wp.busy = false; applyWallpaper(d); })
      .catch(function () { wp.busy = false; /* 网络抖动：保留当前壁纸 */ });
  }

  function stopPoll() {
    if (wp.timer) { try { clearInterval(wp.timer); } catch (e) {} wp.timer = 0; }
  }
  function startPoll() {
    stopPoll();
    if (wp.mode !== "follow") return;
    checkWallpaper();
    wp.timer = setInterval(checkWallpaper, 6000);
  }

  /* ================= 6b. 壁纸选择面板 ================= */
  var PICK_KEY = "lyra:wp:pick";
  var panelEl = document.getElementById("wpPanel");
  var btnEl = document.getElementById("wpBtn");
  var closeEl = document.getElementById("wpClose");
  var panelBodyEl = document.getElementById("wpBody");
  var gridEl = document.getElementById("wpGrid");
  var followEl = document.getElementById("wpFollow");
  var noteEl = document.getElementById("wpNote");
  var countEl = document.getElementById("wpCount");
  var panelOpen = false, closeTimer = 0, idleTimer = 0;

  var listState = { p: null, ok: false, failed: false, built: false, items: [] };
  var lazy = { io: null, q: [], inflight: 0, MAX: 8 };

  function readPick() {
    try { return localStorage.getItem(PICK_KEY) || ""; } catch (e) { return ""; }
  }
  function writePick(id) {
    try {
      if (id) localStorage.setItem(PICK_KEY, String(id));
      else localStorage.removeItem(PICK_KEY);
    } catch (e) {}
  }

  /* 列表接口：失败也只记状态，不报错、不打断跟随模式 */
  function fetchList() {
    if (listState.p) return listState.p;
    listState.p = fetch("/api/wallpaper/list", { cache: "no-store", credentials: "same-origin" })
      .then(function (r) {
        if (!r || !r.ok) throw new Error("list");
        return r.json();
      })

    return ax;
  }

  /* ================= 10. 单句绘制：逐字进度 + 两次绘制阴影 ================= */
  function drawBlock(lay, cam, ax, ay, opt) {
    if (!lay) return;
    var g = fgCtx;
    var ghost = !!opt.ghost;
    var alpha = opt.alpha == null ? 1 : opt.alpha;
    var fs = lay.fs, rowH = lay.rowH, t = S.t;
    var off = clamp(fs * 0.055, 1.2, 4);
    var pos = [], i, r, c;

    if (lay.vert) {
      var vx = ax + fs * 0.5;
      var col = lay.rows[0] ? lay.rows[0].chars : [];
      for (i = 0; i < col.length; i++) pos.push({ c: col[i], x: vx, y: ay + fs * 0.5 + rowH * i });
    } else {
      var top = ay - lay.totalH / 2;
      for (r = 0; r < lay.rows.length; r++) {
        var row = lay.rows[r];
        var left = rowLeft(cam, ax, row.width);
        var y = top + rowH * (r + 0.5);
        for (i = 0; i < row.chars.length; i++) pos.push({ c: row.chars[i], x: left + row.chars[i].x, y: y });
      }
    }

    g.save();
    g.font = fontFor(fs);
    g.textAlign = "left";
    g.textBaseline = "middle";

    /* 第一遍：偏移暗影（不用 shadowBlur） */
    g.globalAlpha = alpha;
    g.fillStyle = "rgba(0,0,0," + (ghost ? 0.42 : 0.70) + ")";
    for (i = 0; i < pos.length; i++) {
      c = pos[i].c;
      if (c.ch === " ") continue;
      g.fillText(c.ch, pos[i].x + off, pos[i].y + off);
    }

    /* 第二遍：逐字上色 */
    g.globalAlpha = 1;
    for (i = 0; i < pos.length; i++) {
      c = pos[i].c;
      if (c.ch === " ") continue;
      var a, col;
      if (ghost || opt.upcoming) {
        a = opt.upcoming ? 0.34 : 0.9;
        col = "232,240,255";
      } else {
        var ct = c.time;
        if (ct == null || !isFinite(ct)) {
          a = 0.92; col = "238,243,255";
        } else if (t < ct) {
          a = 0.28; col = "208,218,238";
        } else {
          var d2 = t - ct;
          var k2 = d2 < 0.26 ? (1 - d2 / 0.26) : 0;
          var cc = mix([244, 249, 255], AC, 0.10 + 0.42 * k2);
          col = cc[0] + "," + cc[1] + "," + cc[2];
          a = 1;
        }
      }
      g.fillStyle = "rgba(" + col + "," + (a * alpha).toFixed(3) + ")";
      g.fillText(c.ch, pos[i].x, pos[i].y);
    }
    g.restore();
  }

  function drawRule(lay, cam, ax, ay, line, alpha) {
    if (!lay || !line || !(line.dur > 0)) return;
    var g = fgCtx;
    var prog = clamp((S.t - line.t) / Math.max(0.3, line.dur), 0, 1);
    g.save();
    g.globalAlpha = clamp(alpha, 0, 1);
    if (lay.vert) {
      var h = lay.totalH;
      var x = ax - lay.fs * 0.34;
      g.fillStyle = "rgba(255,255,255,0.16)";
      g.fillRect(x, ay, 1.5, h);
      g.fillStyle = rgba(AC, 0.95);
      g.fillRect(x, ay, 1.5, h * prog);
      if (!RM && prog > 0.001) {
        g.fillStyle = rgba(AC, 1);
        g.fillRect(x - 3, ay + h * prog - 1, 7.5, 2);
      }
    } else {
      var w = Math.min(Math.max(lay.width * 0.72, W * 0.08), W * 0.5);
      var left = rowLeft(cam, ax, w);
      var y = ay + lay.totalH / 2 + lay.fs * 0.42;
      g.fillStyle = "rgba(255,255,255,0.16)";
      g.fillRect(left, y, w, 1.5);
      g.fillStyle = rgba(AC, 0.95);
      g.fillRect(left, y, w * prog, 1.5);
      if (!RM && prog > 0.001) {
        g.fillStyle = rgba(AC, 1);
        g.fillRect(left + w * prog - 1, y - 3, 2, 7.5);
      }
    }
    g.restore();
  }

  function drawIdle() {
    var g = fgCtx;
    var cy = H * 0.52;
    g.save();
    g.textAlign = "center";
    g.textBaseline = "middle";
    var fs = clamp(H * 0.055, 22, 60);
    g.font = "600 " + fs.toFixed(1) + "px " + FONT;
    var title = songTitle || "壁纸融合";
    g.fillStyle = "rgba(0,0,0,0.55)";
    g.fillText(title, W / 2 + 2, cy + 3);
    g.fillStyle = "rgba(240,245,255,0.92)";
    g.fillText(title, W / 2, cy);
    if (songArtist) {
      g.font = "500 " + Math.round(clamp(H * 0.016, 10, 15)) + "px " + MONO;
      g.fillStyle = "rgba(226,234,250,0.5)";
      g.fillText(songArtist, W / 2, cy + fs * 0.92);
    }
    g.font = "500 " + Math.round(clamp(H * 0.0125, 9, 12)) + "px " + MONO;
    g.fillStyle = rgba(AC, 0.7);
    g.fillText("658 · WALLPAPER FUSION", W / 2, cy + fs * 1.55);
    g.restore();
  }

  function drawLyrics() {
    if (!S.lines.length) { drawIdle(); return; }
    var p = T.dur > 0 ? clamp((animT - T.start) / T.dur, 0, 1) : 1;
    var e = easeOutCubic(p);
    var ax = T.fromX + (T.toX - T.fromX) * e;
    var ay = T.fromY + (T.toY - T.fromY) * e;
    var alphaMul = T.dur > 0 ? (0.62 + 0.38 * e) : 1;

    if (T.ghost) {
      var gk = clamp((animT - T.ghost.t0) / 0.35, 0, 1);
      if (gk >= 1) {
        T.ghost = null;
      } else {
        drawBlock(T.ghost.lay, T.ghost.cam, T.ghost.x, T.ghost.y, {
          ghost: true, alpha: 0.24 - 0.16 * gk
        });
      }
    }

    if (!T.lay || !T.line) { drawIdle(); return; }
    drawBlock(T.lay, T.cam, ax, ay, { alpha: alphaMul });
    drawRule(T.lay, T.cam, ax, ay, T.line, alphaMul);
  }

  function onLineChange(newIdx) {
    var oldAnchor = currentAnchor();
    var ghost = null;
    if (T.lay && T.line) {
      ghost = {
        lay: T.lay, cam: T.cam,
        x: oldAnchor ? oldAnchor.x : T.toX,
        y: oldAnchor ? oldAnchor.y : T.toY,
        t0: animT
      };
    }
    T.ghost = ghost;
    T.seen = newIdx;

    if (newIdx < 0 || !S.lines[newIdx]) {
      T.cam = null; T.lay = null; T.line = null;
      T.dur = 0;
      return;
    }

    var line = S.lines[newIdx];
    var len = Array.from(line.text).length;
    var cam = pickCam(newIdx, len);
    var lay = layoutBlock(line, cam);
    var to = camAnchor(cam);
    var hard = RM || (newIdx % 2 !== 0) || (animT - lastBeatAt < 0.35);

    T.fromX = oldAnchor ? oldAnchor.x : to.x;
    T.fromY = oldAnchor ? oldAnchor.y : to.y;
    T.toX = to.x;
    T.toY = to.y;
    T.start = animT;
    T.dur = hard ? 0 : 0.55;
    T.cam = cam;
    T.lay = lay;
    T.line = line;
  }

  function resetLineState() {
    T.seen = -2;
    T.ghost = null;
    T.dur = 0;
    beatPulse = 0;
  }

  /* ================= 11. 装饰（仅线条 / 点阵 / 噪点 / 扫描线） ================= */
  function drawDecor() {
    var g = fgCtx;
    if (scanPat) {
      g.save();
      g.globalAlpha = 0.10;
      g.fillStyle = scanPat;
      g.fillRect(0, 0, W, H);
      g.restore();
    }
    if (noisePat) {
      var ox = RM ? 0 : (animT * 37) % 128;
      var oy = RM ? 0 : (animT * 23) % 128;
      g.save();
      g.globalAlpha = RM ? 0.032 : 0.05;
      g.globalCompositeOperation = "overlay";
      g.translate(-ox, -oy);
      g.fillStyle = noisePat;
      g.fillRect(0, 0, W + 128, H + 128);
      g.restore();
    }
    if (!RM && beatPulse > 0.01) {
      g.save();
      g.globalCompositeOperation = "lighter";
      var rg = g.createRadialGradient(W * 0.5, H * 0.6, 0, W * 0.5, H * 0.6, Math.min(W, H) * 0.65);
      rg.addColorStop(0, rgba(AC, 0.055 * beatPulse));
      rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg;
      g.fillRect(0, 0, W, H);
      g.restore();
    }
  }

  function drawMeta() {
    var g = fgCtx;
    var fs = Math.round(clamp(H * 0.0135, 9, 12));
    var pad = Math.max(14, W * 0.014);
    g.save();
    g.font = "500 " + fs + "px " + MONO;
    g.textBaseline = "middle";

    var tag = wp.has
      ? ((wp.mode === "pick" ? "本机 · " : "WE · ") + (wp.kind === "video" ? "VIDEO" : "IMAGE") + (wp.title ? " · " + wp.title : ""))
      : "WE OFFLINE · COVER FALLBACK";
    if (tag.length > 56) tag = tag.slice(0, 56) + "…";
    g.textAlign = "left";
    g.fillStyle = "rgba(228,236,250,0.44)";
    g.fillText(tag, pad, pad + fs * 0.35);

    g.textAlign = "right";
    g.fillStyle = "rgba(228,236,250,0.36)";
    g.fillText("658 · WALLPAPER FUSION", W - pad, pad + fs * 0.35);

    g.textAlign = "left";
    var sname = songTitle + (songArtist ? "  —  " + songArtist : "");
    if (sname) {
      g.fillStyle = "rgba(232,239,252,0.50)";
      g.fillText(sname, pad, H - pad - fs * 0.2);
    }

    g.textAlign = "right";
    var bpm = liveBpm > 0 ? Math.round(liveBpm) + " BPM · " : "";
    g.fillStyle = "rgba(232,239,252,0.42)";
    g.fillText(bpm + fmtTime(S.t) + (DUR > 0 ? " / " + fmtTime(DUR) : ""), W - pad, H - pad - fs * 0.2);

    g.strokeStyle = "rgba(255,255,255,0.16)";
    g.lineWidth = 1;
    var c = 13, o = pad * 0.55;
    g.beginPath();
    g.moveTo(o, o + c); g.lineTo(o, o); g.lineTo(o + c, o);
    g.moveTo(W - o - c, o); g.lineTo(W - o, o); g.lineTo(W - o, o + c);
    g.moveTo(o, H - o - c); g.lineTo(o, H - o); g.lineTo(o + c, H - o);
    g.moveTo(W - o - c, H - o); g.lineTo(W - o, H - o); g.lineTo(W - o, H - o - c);
    g.stroke();
    g.restore();
  }

  function drawForeground() {
    var g = fgCtx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
    drawLyrics();
    drawDecor();
    drawMeta();
  }

  /* ================= 12. 宿主消息 ================= */
  function applyInit(p) {
    p = p || {};
    S.lines = buildLines(p.lines);
    S.idx = -1;
    S.t = 0;
    T.seen = -2;
    T.cam = null; T.lay = null; T.line = null; T.ghost = null;
    T.lastCam = "";
    T.dur = 0;
    beatPulse = 0;
    lastBeatAt = -9;

    DUR = Number(p.duration);
    if (!isFinite(DUR) || DUR < 0) DUR = 0;

    if (Array.isArray(p.accent)) AC = normAccent(p.accent);
    try { panelEl.style.setProperty("--ac", AC[0] + "," + AC[1] + "," + AC[2]); } catch (e) {}

    var song = (p.song && typeof p.song === "object") ? p.song : null;
    songTitle = ""; songArtist = "";
    if (song) {
      songTitle = String(song.title || song.name || "");
      if (Array.isArray(song.artists)) songArtist = song.artists.join(" / ");
      else if (song.artists != null) songArtist = String(song.artists);
      else songArtist = String(song.artist || "");
      loadCover(song.cover || "");
    } else {
      loadCover("");
    }

    if (typeof p.playing === "boolean") S.playing = p.playing;
    buildFallback();
  }

  function onMessage(ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || d;
    try {
      if (d.type === "init") {
        applyInit(p);
      } else if (d.type === "tick") {
        var t = Number(p.time);
        if (isFinite(t)) {
          lastTickWall = (window.performance && performance.now()) || Date.now();
          if (Math.abs(t - S.t) > 0.5) resetLineState();
          S.t = Math.max(0, t);
        }
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") {
        var lv = Number(p.level);
        if (!isFinite(lv)) lv = 0.5;
        lv = clamp(lv, 0, 1);
        var bi = Number(p.index);
        beatPulse = Math.max(beatPulse, (bi === 0 ? 0.72 : 0.32) + lv * 0.42);
        lastBeatAt = animT;
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "live") {
        var a = Number(p.level), b = Number(p.bass), c = Number(p.mid);
        var e2 = Number(p.treble), f = Number(p.bpm);
        if (isFinite(a)) liveLevel = clamp(a, 0, 1);
        if (isFinite(b)) liveBass = clamp(b, 0, 1);
        if (isFinite(c)) liveMid = clamp(c, 0, 1);
        if (isFinite(e2)) liveTreble = clamp(e2, 0, 1);
        if (isFinite(f)) liveBpm = clamp(f, 0, 400);
        if (typeof p.playing === "boolean") S.playing = p.playing;
      }
    } catch (err) { logErr(err); }
  }

  /* ================= 13. 主循环 ================= */
  function frame(now) {
    if (!running) return;
    rafId = requestAnimationFrame(frame);
    var dt = lastTs ? (now - lastTs) / 1000 : 0.016;
    lastTs = now;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0.016;

    var t0 = (window.performance && performance.now()) || Date.now();
    try {
      frozen = S.playing && lastTickWall > 0 && (t0 - lastTickWall > 400);
      if (!frozen) {
        animT += dt;
        if (S.playing) beatPulse *= Math.exp(-dt * 3.0);
        if (beatPulse < 0.002) beatPulse = 0;
      }

      if (t0 - lastSampleWall > 400) {
        lastSampleWall = t0;
        sampleBrightness();
      }
      dimCur += (dimTarget - dimCur) * (1 - Math.exp(-4 * dt));

      S.idx = idxAt(S.t);
      if (S.idx !== T.seen) onLineChange(S.idx);

      drawBackground();
      drawForeground();
    } catch (e) { logErr(e); }
    var t1 = (window.performance && performance.now()) || Date.now();
    S.js = S.js * 0.9 + (t1 - t0) * 0.1;
    S.frames++;
  }

  function start() {
    if (started) return;
    started = true;
    try { resize(); } catch (e) { logErr(e); }
    try { panelEl.style.setProperty("--ac", AC[0] + "," + AC[1] + "," + AC[2]); } catch (e) {}
    rebuildBackground({ ok: false, key: "fallback", kind: "fallback", title: "" });
    var pid = readPick();
    if (pid) {
      /* 手选优先：不轮询，不被 WE 覆盖 */
      wp.mode = "pick";
      wp.pickId = pid;
      bootPick(pid);
    } else {
      wp.mode = "follow";
      startPoll();
    }
    syncPickUI();
    resetIdle();
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
  }

  addEventListener("message", onMessage);
  addEventListener("resize", function () { try { resize(); } catch (e) { logErr(e); } });
  addEventListener("orientationchange", function () {
    setTimeout(function () { try { resize(); } catch (e) { logErr(e); } }, 120);
  });
  addEventListener("pagehide", function () {
    running = false;
    if (rafId) { try { cancelAnimationFrame(rafId); } catch (e) {} rafId = 0; }
    if (wp.timer) { try { clearInterval(wp.timer); } catch (e) {} wp.timer = 0; }
    if (idleTimer) { try { clearTimeout(idleTimer); } catch (e) {} idleTimer = 0; }
    try {
      var pv = gridEl ? gridEl.querySelectorAll("video") : [];
      for (var i = 0; i < pv.length; i++) {
        try { pv[i].pause(); pv[i].removeAttribute("src"); pv[i].load(); } catch (e2) {}
      }
    } catch (e3) {}
    disposeLayer(wp.cur);
    disposeLayer(wp.prev);
    wp.cur = null; wp.prev = null;
  });

})();
</script>
</body>
</html>
