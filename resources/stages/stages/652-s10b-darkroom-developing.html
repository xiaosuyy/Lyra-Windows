<!-- 652 / S10B —— 暗房显影盘：歌词是一张浸在药水里、从银盐噪点中慢慢浮出的相纸。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>652 · 显影</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#060506;overflow:hidden;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  #c{display:block;width:100vw;height:100vh;background:#060506;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  /* ================= 0. 自检状态 ================= */
  var S = { lines: [], idx: -1, t: 0, playing: false, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}
  var GL_OK = false;

  window.__stage = function () {
    var i = S.idx, L = S.lines, tx = "";
    if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
    return {
      lines: L.length, idx: i, t: S.t, playing: !!S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
      text: tx, gl: GL_OK, rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var now = (window.performance && performance.now()) || Date.now();
    if (now - lastErrAt > 1000) {
      lastErrAt = now;
      try { console.error(e); } catch (_) {}
    }
  }
  window.addEventListener("error", function (e) { logErr(e && e.error ? e.error : e); });

  /* ================= 1. ready：第一个 rAF 无条件、只一次 ================= */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }
  var booted = false;
  function start() {
    if (booted) return;
    booted = true;
    setTimeout(boot, 0);
  }
  requestAnimationFrame(function () { sendReady(); start(); });
  setTimeout(function () { sendReady(); start(); }, 800);

  /* ================= 2. 常量与工具 ================= */
  var FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC","Hiragino Sans GB",sans-serif';
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoothstep(e0, e1, x) {
    var t = clamp((x - e0) / ((e1 - e0) || 1e-6), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function damp(cur, target, lambda, dt) {
    return cur + (target - cur) * (1 - Math.exp(-lambda * dt));
  }
  function safeSize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    return { w: w, h: h };
  }
  function normAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return [255, 96, 64];
    var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return [255, 96, 64];
    r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
    if (r + g + b < 30) return [255, 96, 64];
    return [r, g, b];
  }

  /* ================= 3. 歌词数据 ================= */
  function charTimes(line) {
    var chars = Array.from(line.text || ""), n = chars.length, out = new Array(n);
    var cs = line.chars, i, j, rec, ct;
    if (cs && cs.length) {
      var rel = cs[0] && isFinite(cs[0].t) && cs[0].t < line.t - 0.08;
      for (i = 0; i < n; i++) {
        j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        rec = cs[j];
        ct = rec && rec.t;
        out[i] = isFinite(ct) ? (rel ? line.t + ct : ct) : null;
      }
      return out;
    }
    var d = line.dur > 0 ? line.dur : 3.4;
    for (i = 0; i < n; i++) out[i] = line.t + d * 0.88 * i / Math.max(1, n);
    return out;
  }

  function buildLines(raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      if (!l || typeof l !== "object") continue;
      var text = (l.text == null) ? "" : String(l.text);
      if (!text.trim()) continue;
      var t = Number(l.t); if (!isFinite(t) || t < 0) t = 0;
      var dur = Number(l.dur); if (!isFinite(dur) || dur < 0) dur = 0;
      var line = {
        t: t, dur: dur, text: text,
        chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null
      };
      line.times = charTimes(line);
      out.push(line);
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  /* ================= 4. 排版 ================= */
  var measureCv = document.createElement("canvas");
  var measureCtx = measureCv.getContext("2d");

  function isWordChar(ch) { return /[A-Za-z0-9'’\-–—_.&/+:]/.test(ch); }

  function makeTokens(line) {
    var chars = Array.from(line.text || ""), times = line.times || [], toks = [], i = 0;
    while (i < chars.length) {
      var c = chars[i];
      if (/\s/.test(c)) {
        toks.push({ sp: true, chars: [], w: 0 });
        i++;
        continue;
      }
      if (isWordChar(c)) {
        var arr = [];
        while (i < chars.length && isWordChar(chars[i])) {
          arr.push({ ch: chars[i], t: (times[i] != null && isFinite(times[i])) ? times[i] : line.t });
          i++;
        }
        toks.push({ sp: false, chars: arr });
      } else {
        toks.push({ sp: false, chars: [{ ch: c, t: (times[i] != null && isFinite(times[i])) ? times[i] : line.t }] });
        i++;
      }
    }
    return toks;
  }

  function tokenWidth(tk, fs, track) {
    if (tk.sp) return measureCtx.measureText(" ").width;
    var w = 0;
    for (var i = 0; i < tk.chars.length; i++) w += measureCtx.measureText(tk.chars[i].ch).width;
    return w + track * Math.max(0, tk.chars.length - 1);
  }

  function layoutText(line) {
    var toks = makeTokens(line);
    var maxW = W * 0.78;
    var base = clamp(Math.min(W * 0.098, H * 0.135), 20, 138);
    var fs = base, rows = null, track = fs * 0.016;
    for (var attempt = 0; attempt < 28; attempt++) {
      track = fs * 0.016;
      measureCtx.font = "600 " + fs + "px " + FONT;
      var cur = { items: [], w: 0, wTrim: 0 };
      var rr = [];
      for (var k = 0; k < toks.length; k++) {
        var tk = toks[k];
        if (tk.sp) {
          if (cur.items.length) {
            cur.w += measureCtx.measureText(" ").width + track;
            cur.items.push(tk);
          }
          continue;
        }
        var tw = tokenWidth(tk, fs, track);
        if (cur.w + tw > maxW && cur.items.length) {
          rr.push(cur); cur = { items: [], w: 0, wTrim: 0 };
        }
        cur.items.push(tk);
        cur.w += tw + track;
        cur.wTrim = cur.w - track;
      }
      if (cur.items.length) rr.push(cur);
      var wMax = 0;
      for (var r0 = 0; r0 < rr.length; r0++) wMax = Math.max(wMax, rr[r0].wTrim || 0);
      if (rr.length <= 3 && wMax <= maxW + 0.5 && rr.length * fs * 1.36 <= H * 0.56) { rows = rr; break; }
      fs *= 0.92;
      if (fs < 15) { rows = rr; break; }
    }
    if (!rows) rows = [];

    track = fs * 0.016;
    measureCtx.font = "600 " + fs + "px " + FONT;
    var lineH = fs * 1.36;
    var blockH = rows.length * lineH;
    var cy = H * 0.455, cx = W * 0.5;
    var rowW = [];
    var maxRowW = 0;
    for (var r = 0; r < rows.length; r++) {
      var w = 0, its = rows[r].items;
      for (var q = 0; q < its.length; q++) {
        var it = its[q];
        w += it.sp ? (measureCtx.measureText(" ").width + track) : (tokenWidth(it, fs, track) + track);
      }
      w -= track;
      rowW.push(Math.max(0, w));
      if (w > maxRowW) maxRowW = w;
    }

    var glyphs = [];
    for (var r2 = 0; r2 < rows.length; r2++) {
      var x = cx - rowW[r2] / 2;
      var y = cy - blockH / 2 + lineH * (r2 + 0.5);
      var items = rows[r2].items;
      for (var q2 = 0; q2 < items.length; q2++) {
        var it2 = items[q2];
        if (it2.sp) { x += measureCtx.measureText(" ").width + track; continue; }
        for (var c2 = 0; c2 < it2.chars.length; c2++) {
          var co = it2.chars[c2];
          var cw = measureCtx.measureText(co.ch).width;
          glyphs.push({ ch: co.ch, x: x, y: y, t: co.t, w: cw });
          x += cw + track;
        }
      }
    }

    var pad = fs * 0.62 + 16;
    var bw = Math.max(40, maxRowW + pad * 2);
    var bh = Math.max(40, blockH + pad * 1.55);
    var bx = cx - bw / 2;
    var by = cy - bh / 2;
    bx = clamp(bx, W * 0.02, Math.max(W * 0.02, W * 0.98 - bw));
    by = clamp(by, H * 0.04, Math.max(H * 0.04, H * 0.80 - bh));

    return {
      glyphs: glyphs, fs: fs, rows: rows.length, bx: bx, by: by, bw: bw, bh: bh,
      cx: bx + bw / 2, cy: by + bh / 2, lineH: lineH, blockH: blockH,
      maxRowW: maxRowW, line: line
    };
  }

  /* ================= 5. 画布与图层 ================= */
  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");
  var W = 1440, H = 900, DPR = 1;

  function mkCanvas() { var c = document.createElement("canvas"); return c; }
  var bgCv = mkCanvas(), bgCtx = bgCv.getContext("2d");
  var fgCv = mkCanvas(), fgCtx = fgCv.getContext("2d");
  var vigCv = mkCanvas(), vigCtx = vigCv.getContext("2d");
  var grainCv = mkCanvas(), grainCtx = grainCv.getContext("2d");
  var glyphCv = mkCanvas(), glyphCtx = glyphCv.getContext("2d");
  var tmpCv = mkCanvas(), tmpCtx = tmpCv.getContext("2d");
  var maskCv = mkCanvas(), maskCtx = maskCv.getContext("2d");
  var bloomCv = mkCanvas(), bloomCtx = bloomCv.getContext("2d");
  var coverCv = mkCanvas(), coverCtx = coverCv.getContext("2d");
  var dustCv = mkCanvas();
  var maskImg = null;
  var grainPat = null;
  var coverReady = false;
  var coverUrl = "";
  var accent = [255, 96, 64];
  var song = null, duration = 0;
  var layout = null;
  var simT = 0, lastAdvanceAt = -1e9, kick = 0, beatPulse = 0;
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 };
  var ripples = [];
  var dust = [];
  var stopped = false, raf = 0, lastNow = 0;
  var x0 = 1440 >> 1;

  function motionK() { return RM ? 0.35 : 1; }

  function buildGrain() {
    grainCv.width = 256; grainCv.height = 256;
    var img = grainCtx.createImageData(256, 256);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = 70 + Math.random() * 130;
      d[i] = v; d[i + 1] = v; d[i + 2] = v;
      d[i + 3] = Math.random() < 0.10 ? 90 : 34;
    }
    grainCtx.putImageData(img, 0, 0);
    try { grainPat = ctx.createPattern(grainCv, "repeat"); } catch (e) { grainPat = null; }

    dustCv.width = 64; dustCv.height = 64;
    var dc = dustCv.getContext("2d");
    var g = dc.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, "rgba(255,235,215,0.85)");
    g.addColorStop(0.35, "rgba(255,190,150,0.25)");
    g.addColorStop(1, "rgba(255,150,110,0)");
    dc.fillStyle = g; dc.fillRect(0, 0, 64, 64);
  }

  function buildDust() {
    dust = [];
    var n = RM ? 16 : 34;
    for (var i = 0; i < n; i++) {
      dust.push({
        x: Math.random(), y: Math.random(),
        r: 0.8 + Math.random() * 2.6,
        sp: 0.004 + Math.random() * 0.012,
        ph: Math.random() * 6.283,
        a: 0.05 + Math.random() * 0.15
      });
    }
  }

  function buildBackdrop() {
    bgCv.width = Math.max(1, Math.round(W));
    bgCv.height = Math.max(1, Math.round(H));
    var g = bgCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    g.fillStyle = "#060506";
    g.fillRect(0, 0, W, H);

    var lg = g.createRadialGradient(W * 0.15, H * 0.13, 0, W * 0.15, H * 0.13, Math.max(W, H) * 0.75);
    lg.addColorStop(0, "rgba(96,26,20,0.60)");
    lg.addColorStop(0.30, "rgba(60,18,15,0.32)");
    lg.addColorStop(0.70, "rgba(18,8,8,0.10)");
    lg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = lg;
    g.fillRect(0, 0, W, H);

    g.save();
    try { g.filter = "blur(22px)"; } catch (e) {}
    g.fillStyle = "rgba(9,7,8,0.96)";
    g.fillRect(-W * 0.05, -H * 0.05, W * 0.16, H * 0.62);
    g.fillRect(W * 0.83, -H * 0.05, W * 0.24, H * 0.42);
    g.fillStyle = "rgba(13,10,11,0.92)";
    for (var i = 0; i < 4; i++) {
      var px = W * (0.34 + i * 0.17), py = -H * (0.02 + (i % 2) * 0.035);
      g.fillRect(px, py, W * 0.115, H * 0.135);
    }
    g.fillStyle = "rgba(22,13,12,0.80)";
    g.beginPath();
    g.moveTo(W * 0.05, H * 0.30);
    g.lineTo(W * 0.19, H * 0.27);
    g.lineTo(W * 0.25, H * 0.34);
    g.lineTo(W * 0.11, H * 0.38);
    g.closePath(); g.fill();
    g.restore();

    g.save();
    try { g.filter = "blur(26px)"; } catch (e) {}
    for (var b = 0; b < 14; b++) {
      var bx = (b * 0.173 + 0.07) % 1 * W;
      var byy = (b * 0.117 + 0.06) % 0.34 * H;
      var rr = (4 + (b * 13) % 9) * (W / 1440 + 0.6);
      var gg = g.createRadialGradient(bx, byy, 0, bx, byy, rr);
      gg.addColorStop(0, "rgba(255,110,72,0.16)");
      gg.addColorStop(1, "rgba(255,90,60,0)");
      g.fillStyle = gg;
      g.beginPath(); g.arc(bx, byy, rr, 0, 6.2832); g.fill();
    }
    g.restore();

    g.save();
    try { g.filter = "blur(34px)"; } catch (e) {}
    g.fillStyle = "rgba(38,20,16,0.55)";
    g.fillRect(0, H * 0.205, W, H * 0.012);
    g.restore();

    g.fillStyle = "rgba(0,0,0,0.30)";
    g.fillRect(0, H * 0.78, W, H * 0.22);
  }

  function buildForeground() {
    fgCv.width = Math.max(1, Math.round(W));
    fgCv.height = Math.max(1, Math.round(H));
    var g = fgCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    g.save();
    try { g.filter = "blur(16px)"; } catch (e) {}
    g.fillStyle = "rgba(4,3,4,0.99)";
    g.beginPath();
    g.moveTo(-W * 0.12, H * 1.06);
    g.quadraticCurveTo(W * 0.5, H * 0.88, W * 1.12, H * 1.06);
    g.lineTo(W * 1.12, H * 1.14);
    g.lineTo(-W * 0.12, H * 1.14);
    g.closePath(); g.fill();
    g.restore();

    g.save();
    try { g.filter = "blur(4px)"; } catch (e) {}
    g.strokeStyle = "rgba(255,120,80,0.11)";
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(-W * 0.12, H * 1.012);
    g.quadraticCurveTo(W * 0.5, H * 0.882, W * 1.12, H * 1.012);
    g.stroke();
    g.restore();
  }

  function buildVignette() {
    vigCv.width = Math.max(1, Math.round(W));
    vigCv.height = Math.max(1, Math.round(H));
    var g = vigCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    var r = Math.sqrt(W * W + H * H) * 0.58;
    var rg = g.createRadialGradient(W * 0.5, H * 0.44, r * 0.30, W * 0.5, H * 0.44, r);
    rg.addColorStop(0, "rgba(0,0,0,0)");
    rg.addColorStop(0.62, "rgba(3,2,3,0.42)");
    rg.addColorStop(1, "rgba(2,1,2,0.86)");
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
    var tg = g.createLinearGradient(0, 0, 0, H);
    tg.addColorStop(0, "rgba(0,0,0,0.30)");
    tg.addColorStop(0.22, "rgba(0,0,0,0)");
    tg.addColorStop(0.86, "rgba(0,0,0,0)");
    tg.addColorStop(1, "rgba(0,0,0,0.34)");
    g.fillStyle = tg;
    g.fillRect(0, 0, W, H);
  }

  /* ================= 6. 噪声（显影的不规则前沿） ================= */
  var L1 = null, L2 = null;
  function genLattice(w, h, seed) {
    var a = new Float32Array(w * h), s = seed || 1;
    for (var i = 0; i < a.length; i++) {
      s = (s * 1664525 + 1013904223) >>> 0;
      a[i] = s / 4294967296;
    }
    return a;
  }
  function sampLat(L, w, h, u, v) {
    var x0 = Math.floor(u), y0 = Math.floor(v);
    var fx = u - x0, fy = v - y0;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var x1 = (x0 + 1) % w, y1 = (y0 + 1) % h;
    x0 = ((x0 % w) + w) % w; y0 = ((y0 % h) + h) % h;
    var a = L[y0 * w + x0], b = L[y0 * w + x1], c = L[y1 * w + x0], d = L[y1 * w + x1];
    var top = a + (b - a) * fx, bot = c + (d - c) * fx;
    return top + (bot - top) * fy;
  }
  function fieldAt(u, v) {
    return sampLat(L1, 48, 28, u, v) * 0.62 + sampLat(L2, 96, 56, u * 2.03 + 5.1, v * 2.03 + 2.3) * 0.38;
  }
  function initNoise() {
    L1 = genLattice(48, 28, 20264117);
    L2 = genLattice(96, 56, 771023);
  }

  /* ================= 7. 相纸与显影文字 ================= */
  function ensureCanvas(c, w, h) {
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return true; }
    return false;
  }
  var printDims = { w: 0, h: 0 };

  function ensurePrintCanvases(bw, bh) {
    var gw = Math.ceil(bw * DPR), gh = Math.ceil(bh * DPR);
    if (printDims.w === gw && printDims.h === gh) return;
    printDims.w = gw; printDims.h = gh;
    glyphCv.width = gw; glyphCv.height = gh;
    tmpCv.width = gw; tmpCv.height = gh;
    maskCv.width = Math.max(24, Math.round(bw / 5));
    maskCv.height = Math.max(16, Math.round(bh / 5));
    bloomCv.width = Math.max(12, Math.round(bw / 9));
    bloomCv.height = Math.max(8, Math.round(bh / 9));
  }

  function drawGlyphs(lay, alpha) {
    var g = glyphCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, glyphCv.width, glyphCv.height);
    if (alpha <= 0.002) return;
    g.setTransform(DPR, 0, 0, DPR, -lay.bx * DPR, -lay.by * DPR);
    g.font = "600 " + lay.fs + "px " + FONT;
    g.textBaseline = "middle";
    g.textAlign = "left";
    g.fillStyle = "rgba(248,238,222,1)";
    var gl = lay.glyphs;
    for (var i = 0; i < gl.length; i++) {
      var gi = gl[i];
      var a = smoothstep(gi.t - 0.05, gi.t + 0.55, S.t);
      if (a <= 0.004) continue;
      var dev = smoothstep(gi.t + 0.20, gi.t + 1.35, S.t);
      g.globalAlpha = a * (0.66 + 0.34 * dev) * alpha;
      g.fillText(gi.ch, gi.x, gi.y);
    }
    g.globalAlpha = 1;
  }

  function updateMask(prog) {
    var mw = maskCv.width, mh = maskCv.height;
    if (!maskImg || maskImg.width !== mw || maskImg.height !== mh) {
      maskImg = maskCtx.createImageData(mw, mh);
    }
    var data = maskImg.data;
    var thr = 1.10 - 1.32 * clamp(prog, 0, 1.04);
    var drift = simT * 0.30;
    var k = 0;
    for (var y = 0; y < mh; y++) {
      for (var x = 0; x < mw; x++) {
        var n = fieldAt(x * 0.155 + drift, y * 0.155 - drift * 0.55);
        var a = 0.16 + 0.84 * smoothstep(thr - 0.085, thr + 0.085, n);
        data[k] = 255; data[k + 1] = 255; data[k + 2] = 255; data[k + 3] = a * 255;
        k += 4;
      }
    }
    maskCtx.putImageData(maskImg, 0, 0);
  }

  function sheetPath(g, x, y, w, h, wob) {
    g.beginPath();
    g.moveTo(x + 7, y + wob);
    g.quadraticCurveTo(x + w * 0.5, y - 2.5 + wob * 0.5, x + w - 7, y + wob * 0.7);
    g.quadraticCurveTo(x + w + 2.5, y + h * 0.42, x + w - 3, y + h - 5 - wob * 0.5);
    g.quadraticCurveTo(x + w * 0.5, y + h + 3.5, x + 5, y + h - 2 + wob * 0.5);
    g.quadraticCurveTo(x - 2.5, y + h * 0.5, x + 7, y + wob);
    g.closePath();
  }

  function drawSheet(lay, alpha, rot, bob, simScale) {
    var g = ctx;
    var wob = Math.sin(simT * 0.8) * 0.7 + kick * Math.sin(simT * 9) * 2.2;
    g.save();
    g.globalAlpha = alpha;
    var cxp = lay.cx, cyp = lay.cy + bob;
    g.translate(cxp, cyp);
    g.rotate(rot);
    g.scale(simScale, simScale);
    g.translate(-cxp, -cyp);

    g.save();
    g.shadowColor = "rgba(255,84,50,0.22)";
    g.shadowBlur = 34;
    g.fillStyle = "#050406";
    sheetPath(g, lay.bx, lay.by + bob, lay.bw, lay.bh, wob);
    g.fill();
    g.restore();

    var grd = g.createLinearGradient(lay.bx, lay.by, lay.bx + lay.bw * 0.3, lay.by + lay.bh);
    grd.addColorStop(0, "#0d0c10");
    grd.addColorStop(0.35, "#08070a");
    grd.addColorStop(0.72, "#0b090b");
    grd.addColorStop(1, "#050406");
    g.fillStyle = grd;
    sheetPath(g, lay.bx, lay.by + bob, lay.bw, lay.bh, wob);
    g.fill();

    g.save();
    sheetPath(g, lay.bx, lay.by + bob, lay.bw, lay.bh, wob);
    g.clip();
    var sheen = g.createLinearGradient(lay.bx, lay.by, lay.bx + lay.bw, lay.by + lay.bh * 1.2);
    sheen.addColorStop(0, "rgba(255,180,140,0.075)");
    sheen.addColorStop(0.30, "rgba(255,140,100,0.012)");
    sheen.addColorStop(0.62, "rgba(0,0,0,0)");
    sheen.addColorStop(1, "rgba(20,28,44,0.055)");
    g.fillStyle = sheen;
    g.fillRect(lay.bx, lay.by, lay.bw, lay.bh);

    if (grainPat) {
      g.globalAlpha = alpha * 0.30;
      g.globalCompositeOperation = "overlay";
      g.fillStyle = grainPat;
      g.fillRect(lay.bx, lay.by, lay.bw, lay.bh);
      g.globalCompositeOperation = "source-over";
      g.globalAlpha = alpha;
    }

    var rim = g.createLinearGradient(0, lay.by + bob, 0, lay.by + bob + 3);
    rim.addColorStop(0, "rgba(255,168,128,0.22)");
    rim.addColorStop(1, "rgba(255,168,128,0)");
    g.fillStyle = rim;
    g.fillRect(lay.bx, lay.by + bob, lay.bw, 3);
    g.restore();

    g.strokeStyle = "rgba(255,150,110,0.15)";
    g.lineWidth = 1;
    sheetPath(g, lay.bx, lay.by + bob, lay.bw, lay.bh, wob);
    g.stroke();
    g.restore();
  }

  function drawPrintText(lay, alpha, lineAlpha) {
    if (alpha <= 0.002) return;
    ensurePrintCanvases(lay.bw, lay.bh);
    drawGlyphs(lay, 1);

    var t = tmpCtx;
    t.setTransform(1, 0, 0, 1, 0, 0);
    t.globalCompositeOperation = "source-over";
    t.clearRect(0, 0, tmpCv.width, tmpCv.height);
    t.drawImage(glyphCv, 0, 0);
    t.globalCompositeOperation = "destination-in";
    t.drawImage(maskCv, 0, 0, maskCv.width, maskCv.height, 0, 0, tmpCv.width, tmpCv.height);
    t.globalCompositeOperation = "source-over";

    var b = bloomCtx;
    b.setTransform(1, 0, 0, 1, 0, 0);
    b.clearRect(0, 0, bloomCv.width, bloomCv.height);
    b.drawImage(tmpCv, 0, 0, tmpCv.width, tmpCv.height, 0, 0, bloomCv.width, bloomCv.height);
    b.globalCompositeOperation = "source-atop";
    b.fillStyle = "rgba(" + accent[0] + "," + accent[1] + "," + accent[2] + ",0.45)";
    b.fillRect(0, 0, bloomCv.width, bloomCv.height);
    b.globalCompositeOperation = "source-over";

    ctx.globalAlpha = alpha * lineAlpha;
    ctx.drawImage(tmpCv, lay.bx, lay.by, lay.bw, lay.bh);
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.34 * alpha * lineAlpha * (1 + beatPulse * 0.8);
    ctx.drawImage(bloomCv, lay.bx - lay.bw * 0.02, lay.by - lay.bh * 0.02, lay.bw * 1.04, lay.bh * 1.04);
    ctx.restore();
  }

  function drawReflection(lay, alpha, sheetBottom) {
    if (!printDims.w || alpha <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = 1;
    for (var i = 0; i < 8; i++) {
      var sh = lay.bh / 8;
      var sY = lay.by + lay.bh - sh * (i + 1);
      var dY = sheetBottom + 5 + i * lay.bh * 0.058;
      var off = Math.sin(simT * 1.15 + i * 0.62) * (2.2 + live.bass * 3.2) * motionK();
      ctx.globalAlpha = alpha * (0.085 - i * 0.008);
      try {
        ctx.drawImage(tmpCv, 0, sY * DPR, tmpCv.width, sh * DPR, lay.bx + off, dY, lay.bw, lay.bh * 0.058);
      } catch (e) { break; }
    }
    ctx.restore();
  }

  /* ================= 8. 水、灯、尘 ================= */
  function drawWater(time, camX, camY) {
    var g = ctx;
    g.save();
    g.translate(camX * 0.55, camY * 0.55);
    var ar = 0.30 + live.bass * 0.12;
    for (var s = 0; s < 3; s++) {
      g.beginPath();
      var yy = H * (0.30 + s * 0.22) + Math.sin(time * 0.35 + s) * 7;
      g.moveTo(-W * 0.05, yy);
      for (var x = 0; x <= W + 40; x += 40) {
        var y2 = yy + Math.sin(x * 0.006 + time * (0.5 + s * 0.17)) * (6 + s * 3) * motionK();
        g.lineTo(x, y2);
      }
      g.strokeStyle = "rgba(255,138,98," + (0.028 + s * 0.008) + ")";
      g.lineWidth = 1.2;
      g.stroke();
    }

    for (var i = 0; i < ripples.length; i++) {
      var rp = ripples[i];
      var life = 1 - rp.age / rp.max;
      if (life <= 0) continue;
      var rr = rp.r0 + rp.age * rp.sp;
      g.save();
      g.translate(rp.x + camX * 0.55, rp.y + camY * 0.55);
      g.scale(1, ar);
      g.beginPath();
      g.arc(0, 0, rr, 0, 6.2832);
      g.strokeStyle = "rgba(255,150,110," + (0.13 * life * rp.str) + ")";
      g.lineWidth = 1.4;
      g.stroke();
      g.beginPath();
      g.arc(0, 0, rr * 0.72, 0, 6.2832);
      g.strokeStyle = "rgba(255,190,150," + (0.055 * life * rp.str) + ")";
      g.lineWidth = 1;
      g.stroke();
      g.restore();
    }
    g.restore();
  }

  function drawLamp(time, beat, camX, camY) {
    var g = ctx;
    var breathe = 0.78 + 0.10 * Math.sin(time * 1.15) + live.level * 0.28 + beat * 0.45;
    var lx = W * 0.155 + camX * 0.25;
    var ly = H * 0.145 + Math.sin(time * 0.5) * 3 + camY * 0.25;
    var R = Math.max(W, H) * 0.62;
    var a = clamp(breathe, 0.2, 1.5) * motionK();
    g.save();
    g.globalCompositeOperation = "screen";
    var rg = g.createRadialGradient(lx, ly, 0, lx, ly, R);
    rg.addColorStop(0, "rgba(255,178,132," + (0.24 * a) + ")");
    rg.addColorStop(0.10, "rgba(255,116,76," + (0.19 * a) + ")");
    rg.addColorStop(0.30, "rgba(214,58,36," + (0.085 * a) + ")");
    rg.addColorStop(0.62, "rgba(90,20,16," + (0.035 * a) + ")");
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    var core = g.createRadialGradient(lx, ly, 0, lx, ly, Math.max(18, W * 0.045));
    core.addColorStop(0, "rgba(255,222,190," + (0.32 * a) + ")");
    core.addColorStop(0.35, "rgba(255,150,100," + (0.16 * a) + ")");
    core.addColorStop(1, "rgba(255,90,60,0)");
    g.fillStyle = core;
    g.beginPath(); g.arc(lx, ly, Math.max(18, W * 0.045), 0, 6.2832); g.fill();
    g.restore();

    var halo = g.createRadialGradient(lx, ly, Math.max(12, W * 0.018), lx, ly, Math.max(30, W * 0.07));
    halo.addColorStop(0, "rgba(255,60,40,0)");
    halo.addColorStop(0.55, "rgba(255,72,44," + (0.05 * a) + ")");
    halo.addColorStop(1, "rgba(255,72,44,0)");
    g.fillStyle = halo;
    g.beginPath(); g.arc(lx, ly, Math.max(30, W * 0.07), 0, 6.2832); g.fill();
  }

  function drawDust(time, camX, camY) {
    var g = ctx;
    g.save();
    g.globalCompositeOperation = "screen";
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      var yy = (d.y * H - time * d.sp * H * 10) % (H + 80);
      if (yy < -40) yy += H + 80;
      var xx = d.x * W + Math.sin(time * 0.4 + d.ph) * W * 0.012 + camX * 0.75;
      var a = d.a * (0.55 + live.treble * 0.8);
      var r = d.r * (0.7 + d.r * 0.5) * (1 + live.level * 0.4);
      g.globalAlpha = a;
      g.drawImage(dustCv, xx + camY * 0.02, yy, r * 5, r * 5);
    }
    g.restore();
    g.globalAlpha = 1;
  }

  function drawCoverGhost() {
    if (!coverReady) return;
    var s = Math.min(W, H) * 0.30;
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.globalCompositeOperation = "screen";
    ctx.translate(W * 0.80, H * 0.135);
    ctx.rotate(-0.055);
    ctx.drawImage(coverCv, -s / 2, -s / 2, s, s * 1.12);
    ctx.restore();
  }

  function bakeCover(im) {
    coverCv.width = 96; coverCv.height = 96;
    var g = coverCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 96, 96);
    var iw = im.naturalWidth || im.width || 1;
    var ih = im.naturalHeight || im.height || 1;
    var s = Math.min(iw, ih);
    try { g.filter = "grayscale(1) sepia(0.5) contrast(1.12)"; } catch (e) {}
    try { g.drawImage(im, (iw - s) / 2, (ih - s) / 2, s, s, 0, 0, 96, 96); } catch (e) { coverReady = false; return; }
    try { g.filter = "none"; } catch (e) {}
    g.globalCompositeOperation = "source-atop";
    g.fillStyle = "rgba(30,14,12,0.52)";
    g.fillRect(0, 0, 96, 96);
    g.globalCompositeOperation = "source-over";
  }

  function tryCover(url) {
    coverReady = false;
    coverUrl = url || "";
    if (!url || typeof url !== "string") return;
    if (url === coverUrl && coverReady) return;
    var im = new Image();
    try { im.crossOrigin = "anonymous"; } catch (e) {}
    im.onload = function () { try { bakeCover(im); coverReady = true; } catch (e) { coverReady = false; logErr(e); } };
    im.onerror = function () { coverReady = false; };
    im.src = url;
  }

  /* ================= 9. 渲染一帧 ================= */
  function renderScene() {
    var time = simT;
    var camX = Math.sin(time * 0.11) * W * 0.006 * motionK();
    var camY = Math.cos(time * 0.09) * H * 0.004 * motionK();
    var scale = 1 + Math.sin(time * 0.07) * 0.010 * motionK();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#050405";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    var bs = 1.015;
    ctx.translate(W / 2, H / 2);
    ctx.scale(bs, bs);
    ctx.translate((-W / 2) + camX * 0.30, (-H / 2) + camY * 0.30);
    ctx.drawImage(bgCv, 0, 0, W, H);
    drawCoverGhost();
    ctx.restore();

    drawLamp(time, beatPulse, camX, camY);
    drawWater(time, camX, camY);

    var L = (S.idx >= 0) ? S.lines[S.idx] : null;
    var lay = layout;
    if (L && lay) {
      var dur = (isFinite(L.dur) && L.dur > 0) ? L.dur : 3.4;
      var lineIn = smoothstep(L.t - 0.55, L.t + 0.12, S.t);
      var lineOut = 1 - smoothstep(L.t + dur + 1.10, L.t + dur + 2.40, S.t);
      var la = lineIn * lineOut;
      if (la > 0.002) {
        ensurePrintCanvases(lay.bw, lay.bh);
        var devEnd = L.t + Math.min(3.4, Math.max(1.35, dur * 0.55));
        var prog = smoothstep(L.t - 0.20, devEnd, S.t) + beatPulse * 0.055;
        updateMask(prog);

        var rot = Math.sin(time * 0.55) * 0.0045 * motionK() + kick * Math.sin(time * 12.5) * 0.013 * motionK();
        var bob = Math.sin(time * 0.85) * 2.0 * motionK() + kick * 4.5 * motionK();
        var simScale = 1 + Math.sin(time * 0.40) * 0.002;

        ctx.save();
        ctx.translate(W / 2 + camX, H / 2 + camY);
        ctx.scale(scale, scale);
        ctx.translate(-W / 2, -H / 2);

        ctx.save();
        ctx.translate(lay.cx, lay.cy + bob);
        ctx.rotate(rot);
        ctx.scale(simScale, simScale);
        ctx.translate(-lay.cx, -lay.cy);
        drawSheet(lay, la, 0, 0, 1);
        drawPrintText(lay, 1, la);
        drawReflection(lay, la, lay.by + lay.bh);
        ctx.restore();

        ctx.restore();
      }
    }

    drawDust(time, camX, camY);

    ctx.save();
    ctx.translate(-camX * 0.85, -camY * 0.85);
    ctx.drawImage(fgCv, 0, 0, W, H);
    ctx.restore();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(vigCv, 0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = "soft-light";
    var grade = ctx.createLinearGradient(0, 0, W, H);
    grade.addColorStop(0, "rgba(255,124,72,0.34)");
    grade.addColorStop(0.48, "rgba(120,40,30,0.05)");
    grade.addColorStop(1, "rgba(28,48,78,0.24)");
    ctx.fillStyle = grade;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    if (grainPat) {
      ctx.save();
      ctx.globalCompositeOperation = "overlay";
      ctx.globalAlpha = 0.055;
      var ox = Math.floor(simT * 41) % 256;
      var oy = Math.floor(simT * 29) % 256;
      ctx.translate(-ox, -oy);
      ctx.fillStyle = grainPat;
      ctx.fillRect(0, 0, W + 256, H + 256);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function addRipple(strength) {
    ripples.push({
      x: W * (0.16 + Math.random() * 0.68),
      y: H * (0.55 + Math.random() * 0.23),
      r0: 3 + Math.random() * 8,
      sp: 46 + Math.random() * 92 * (0.5 + strength),
      age: 0,
      max: 1.5 + Math.random() * 1.7,
      str: (0.55 + strength * 0.7) * motionK()
    });
    if (ripples.length > 18) ripples.shift();
  }

  function onBeat(p) {
    var lv = Number(p.level);
    if (!isFinite(lv)) lv = 0.5;
    lv = clamp(lv, 0, 1);
    beatPulse = Math.max(beatPulse, 0.35 + lv * 0.65);
    kick = Math.max(kick, 0.22 + lv * 0.60);
    var idx = Number(p.index);
    var n = (idx === 0) ? 2 : 1;
    for (var i = 0; i < n; i++) addRipple(lv);
  }

  /* ================= 10. 生命周期 ================= */
  function boot() {
    try {
      initNoise();
      buildGrain();
      buildDust();
      resize();
    } catch (e) { logErr(e); }
    lastNow = 0;
    raf = requestAnimationFrame(frame);
  }

  function frame(now) {
    if (stopped) return;
    raf = requestAnimationFrame(frame);
    var dtms = lastNow ? (now - lastNow) : 16.7;
    lastNow = now;
    if (!isFinite(dtms) || dtms <= 0 || dtms > 250) dtms = 16.7;
    var dt = Math.min(0.06, dtms / 1000);
    S.frames++;
    S.js = S.js ? (S.js * 0.9 + dtms * 0.1) : dtms;

    var advancing = S.playing && (now - lastAdvanceAt < 520);
    if (advancing) {
      simT += dt;
      for (var i = ripples.length - 1; i >= 0; i--) {
        ripples[i].age += dt;
        if (ripples[i].age > ripples[i].max) ripples.splice(i, 1);
      }
    }
    kick *= Math.exp(-dt * 2.6);
    beatPulse *= Math.exp(-dt * 3.4);

    var ni = idxAt(S.t);
    if (ni !== S.idx) {
      S.idx = ni;
      layout = null;
      kick = Math.max(kick, 0.5);
      beatPulse = Math.max(beatPulse, 0.35);
    }
    if (layout === null && S.idx >= 0) {
      try { layout = layoutText(S.lines[S.idx]); } catch (e) { logErr(e); layout = null; }
    }

    try { renderScene(); } catch (e) { logErr(e); }
  }

  var sawTick = false;
  function seekReset() {
    S.idx = -1;
    layout = null;
    ripples.length = 0;
    kick = 0;
    beatPulse = 0;
    printDims.w = 0; printDims.h = 0;
  }

  function applyInit(p) {
    song = (p && p.song) || {};
    accent = normAccent(p && p.accent);
    S.lines = buildLines(p && p.lines);
    duration = Number(p && p.duration);
    if (!isFinite(duration) || duration < 0) duration = 0;
    S.idx = -1;
    S.t = 0;
    sawTick = false;
    layout = null;
    ripples.length = 0;
    kick = 0;
    beatPulse = 0;
    printDims.w = 0; printDims.h = 0;
    if (p && p.song && p.song.cover) tryCover(p.song.cover);
    else { coverReady = false; }
  }

  addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    try {
      if (d.type === "init") applyInit(p);
      else if (d.type === "tick") {
        var nt = Number(p.time);
        if (isFinite(nt)) {
          if (sawTick && Math.abs(nt - S.t) > 0.5) seekReset();
          if (!sawTick || Math.abs(nt - S.t) > 1e-6) lastAdvanceAt = performance.now();
          S.t = nt;
          sawTick = true;
        }
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") onBeat(p);
      else if (d.type === "live") {
        var lv = Number(p.level);
        if (isFinite(lv)) live.level = clamp(lv, 0, 1);
        var bb = Number(p.bass); if (isFinite(bb)) live.bass = clamp(bb, 0, 1);
        var mm = Number(p.mid); if (isFinite(mm)) live.mid = clamp(mm, 0, 1);
        var tt = Number(p.treble); if (isFinite(tt)) live.treble = clamp(tt, 0, 1);
        var bp = Number(p.bpm); if (isFinite(bp)) live.bpm = bp;
        if (typeof p.playing === "boolean") S.playing = p.playing;
      }
    } catch (e) { logErr(e); }
  });

  function resize() {
    var sz = safeSize();
    W = sz.w; H = sz.h;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    try { buildBackdrop(); buildForeground(); buildVignette(); } catch (e) { logErr(e); }
    buildDust();
    printDims.w = 0; printDims.h = 0;
    layout = null;
    x0 = W >> 1;
  }

  addEventListener("resize", function () {
    clearTimeout(x0);
    x0 = setTimeout(resize, 120);
  });

  addEventListener("pagehide", function () {
    stopped = true;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  });
})();
</script>
</body>
</html>
