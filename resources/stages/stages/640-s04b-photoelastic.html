<!-- 640 / S04B —— 正交偏振片下的亚克力歌词：内应力彩虹条纹随鼓点与贝斯流动（光弹法）。 -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>640 · 光弹歌词</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#05060a;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 42%,rgba(0,0,0,.22) 72%,rgba(0,0,0,.55) 100%)}
  #fb{position:fixed;inset:0;display:none}
  #fb.on{display:block}
  #fb canvas{position:absolute;inset:0;width:100%;height:100%}
  #fblyr{position:absolute;left:7vw;right:7vw;bottom:15vh;text-align:center;
    font:700 clamp(22px,3.2vw,54px)/1.3 "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    letter-spacing:.04em;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.9)}
  #fblyr span{opacity:.25;transition:opacity .1s linear}
  #fblyr span.on{opacity:1;color:#dbe4ff}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="fb"><canvas id="fbgl"></canvas><div id="fblyr"></div></div>
<script>
(function () {
"use strict";

/* ---------- 0. 状态 ---------- */
var GL_OK = false, RM = false;
try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}
var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };

window.__stage = function () {
  var i = S.idx, L = S.lines, tx = "";
  if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
  return {
    lines: L.length, idx: i, t: S.t, playing: !!S.playing,
    frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
    text: tx, gl: GL_OK, rm: RM
  };
};

var lastErrAt = 0;
function logErr(e) {
  try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
  var now = (window.performance && performance.now()) || Date.now();
  if (now - lastErrAt > 1000) { lastErrAt = now; try { console.error(e); } catch (_) {} }
}

/* ---------- 1. ready：首帧无条件 + 800ms 兜底 ---------- */
var readySent = false;
function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
}
requestAnimationFrame(function () { sendReady(); });
setTimeout(sendReady, 800);
setTimeout(boot, 0);

/* ---------- 2. 工具 ---------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function damp(cur, target, lambda, dt) { return cur + (target - cur) * (1 - Math.exp(-lambda * dt)); }
function safeSize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (!isFinite(w) || w <= 0) w = 1440;
  if (!isFinite(h) || h <= 0) h = 900;
  return { w: w, h: h };
}
function normAccent(a) {
  if (!Array.isArray(a) || a.length < 3) return [150, 176, 255];
  var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
  if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return [150, 176, 255];
  r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
  if (r + g + b < 36) return [150, 176, 255];
  return [r, g, b];
}
var accent = [150, 176, 255];

/* ---------- 3. 歌词数据 ---------- */
function charTimes(line) {
  var chars = Array.from(line.text || ""), n = chars.length, out = new Array(n);
  var cs = line.chars, i, j, rec, ct;
  if (cs && cs.length) {
    var rel = cs[0] && isFinite(cs[0].t) && cs[0].t < line.t - 0.08;
    for (i = 0; i < n; i++) {
      j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
      rec = cs[j]; ct = rec && rec.t;
      out[i] = isFinite(ct) ? (rel ? line.t + ct : ct) : null;
    }

  }

  for (i = 0; i < n; i++) out[i] = line.t + d * 0.88 * i / Math.max(1, n);
  return out;
}
function buildLines(raw) {
  var out = [];
  if (!Array.isArray(raw)) return out;
  for (var i = 0; i < raw.length; i++) {
    var l = raw[i];
    if (!l || typeof l !== "object") continue;
    var text = (l.text == null) ? "" : String(l.text);
    if (!text.trim()) continue;
    var t = Number(l.t); if (!isFinite(t) || t < 0) t = 0;
    var dur = Number(l.dur); if (!isFinite(dur) || dur < 0) dur = 0;
    var line = { t: t, dur: dur, text: text, chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null };
    line.times = charTimes(line);
    out.push(line);
  }
  out.sort(function (a, b) { return a.t - b.t; });
  return out;
}
function idxAt(t) {
  var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
  while (lo <= hi) {
    var m = (lo + hi) >> 1;
    if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
  }
  return best;
}

/* ---------- 4. 文本排版（逐字 with tracking） ---------- */
var FONT_STACK = '"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif';
function fontStr(fs) { return "700 " + fs.toFixed(1) + "px " + FONT_STACK; }
function tokenize(text) {
  var arr = Array.from(text), out = [], buf = "", bi = [];
  function flush() { if (buf) { out.push({ text: buf, idx: bi, sp: false }); buf = ""; bi = []; } }
  for (var i = 0; i < arr.length; i++) {
    var ch = arr[i];
    if (/\s/.test(ch)) { flush(); out.push({ text: " ", idx: [i], sp: true }); }
    else if (/[A-Za-z0-9'’\-–—_.&/+]/.test(ch)) { buf += ch; bi.push(i); }
    else { flush(); out.push({ text: ch, idx: [i], sp: false }); }
  }
  flush();
  return out;
}
function measureTokens(toks, fs, ctx) {
  var track = fs * 0.035;
  ctx.font = fontStr(fs);
  for (var i = 0; i < toks.length; i++) {
    var tk = toks[i];
    if (!tk.cps) tk.cps = Array.from(tk.text);
    tk.chars = [];
    tk.w = 0;
    for (var j = 0; j < tk.cps.length; j++) {
      var w = ctx.measureText(tk.cps[j]).width + track;
      tk.chars.push({ ch: tk.cps[j], ci: tk.idx[j], w: w });
      tk.w += w;
    }
  }
}
function wrapTokens(toks, maxW) {
  var rows = [], row = [], w = 0, i;
  for (i = 0; i < toks.length; i++) {
    var tk = toks[i];
    if (tk.sp) { if (row.length) { row.push(tk); w += tk.w; } continue; }
    if (w + tk.w > maxW && row.length) {
      while (row.length && row[row.length - 1].sp) w -= row.pop().w;
      rows.push(row); row = []; w = 0;
    }
    row.push(tk); w += tk.w;
  }
  while (row.length && row[row.length - 1].sp) row.pop();
  if (row.length) rows.push(row);
  return rows;
}
function layoutLine(text, CW, CH, ctx) {
  var sheetW = CW * 0.91, sheetH = CH * 0.67;
  var maxW = sheetW * 0.84, maxH = sheetH * 0.58;
  var cx = CW * 0.5, cyC = CH * 0.535;
  var maxRows = (CW < CH) ? 3 : 2;
  var toks = tokenize(text), fs = Math.min(CH * 0.125, CW * 0.072), rows = null, lh, iter;
  for (iter = 0; iter < 16; iter++) {
    measureTokens(toks, fs, ctx);
    rows = wrapTokens(toks, maxW);
    lh = fs * 1.38;
    if (rows.length <= maxRows && rows.length * lh <= maxH) break;
    fs *= 0.9;
    if (fs < CH * 0.022) break;
  }
  measureTokens(toks, fs, ctx);
  rows = wrapTokens(toks, maxW);
  lh = fs * 1.38;
  var totalH = rows.length * lh;
  var y0 = cyC - totalH / 2 + lh * 0.5;
  var items = [], r, i, j, rowW, x;
  for (r = 0; r < rows.length; r++) {
    rowW = 0;
    for (i = 0; i < rows[r].length; i++) rowW += rows[r][i].w;
    x = cx - rowW / 2;
    for (i = 0; i < rows[r].length; i++) {
      var tk = rows[r][i];
      for (j = 0; j < tk.chars.length; j++) {
        var c = tk.chars[j];
        items.push({ ch: c.ch, ci: c.ci, x: x, y: y0 + r * lh, w: c.w });
        x += c.w;
      }
    }

  return { items: items, fs: fs };

/* ---------- 5. 遮罩画布 ---------- */
var maskW = 0, maskH = 0, baseCv = null, litCv = null, baseCtx = null, litCtx = null;
var lineItems = [], lineFs = 40, drawnK = -1, curIdx = -99, headX = -1, headY = -1, seed = 0, fadeStart = 0;

function makeMaskCanvas() {
  var sz = safeSize(), w = sz.w, h = sz.h;
  if (w >= h) { maskW = 2048; maskH = Math.round(2048 * h / w); }
  else { maskH = 2048; maskW = Math.round(2048 * w / h); }
  maskW = Math.max(2, Math.min(2048, maskW));
  maskH = Math.max(2, Math.min(2048, maskH));
  baseCv = document.createElement("canvas"); baseCv.width = maskW; baseCv.height = maskH;
  litCv = document.createElement("canvas"); litCv.width = maskW; litCv.height = maskH;
  baseCtx = baseCv.getContext("2d");
  litCtx = litCv.getContext("2d");
  if (gl) { uploadTex(texBase, baseCv); uploadTex(texLit, litCv); }
}

function paintBase() {
  if (!baseCtx) return;
  baseCtx.clearRect(0, 0, maskW, maskH);
  if (!lineItems.length) return;
  baseCtx.font = fontStr(lineFs);
  baseCtx.fillStyle = "#fff";
  baseCtx.textAlign = "left";
  baseCtx.textBaseline = "middle";
  for (var i = 0; i < lineItems.length; i++) {
    var it = lineItems[i];
    if (it.ch && it.ch.trim()) baseCtx.fillText(it.ch, it.x, it.y);
  }
}
function paintLit(k) {
  if (!litCtx) return;
  litCtx.clearRect(0, 0, maskW, maskH);
  litCtx.font = fontStr(lineFs);
  litCtx.fillStyle = "#fff";
  litCtx.textAlign = "left";
  litCtx.textBaseline = "middle";
  var last = null;
  for (var i = 0; i < lineItems.length; i++) {
    var it = lineItems[i];
    if (it.ci < k && it.ch && it.ch.trim()) {
      litCtx.fillText(it.ch, it.x, it.y);
      last = it;
    }
  }
  if (last) { headX = (last.x + last.w * 0.5) / maskW; headY = last.y / maskH; }
  else { headX = -1; headY = -1; }
}
function rebuildLine(idx) {
  lineItems = []; lineFs = 40; drawnK = -1; headX = -1; headY = -1;
  var L = S.lines[idx];
  if (L && baseCtx) {
    var lay = layoutLine(L.text, maskW, maskH, baseCtx);
    lineItems = lay.items; lineFs = lay.fs;
    paintBase();
    paintLit(0);
    seed = (idx * 0.53) % 7.0;
    fadeStart = (window.performance && performance.now()) || Date.now();
  } else {
    if (baseCtx) { baseCtx.clearRect(0, 0, maskW, maskH); litCtx.clearRect(0, 0, maskW, maskH); }
  }
  if (gl) { uploadTex(texBase, baseCv); uploadTex(texLit, litCv); }
}

function updateLyrics(t) {
  var idx = idxAt(t);
  if (idx !== curIdx) {
    curIdx = idx; S.idx = idx;
    rebuildLine(idx);
  }
  if (idx < 0) return;
  var L = S.lines[idx], times = L.times, k = 0, i;
  for (i = 0; i < times.length; i++) {
    if (times[i] != null && times[i] <= t + 0.0001) k++;
  }
  if (k !== drawnK) { drawnK = k; paintLit(k); if (gl) uploadTex(texLit, litCv); }
}

/* ---------- 6. WebGL ---------- */
var cv = document.getElementById("gl");
var gl = null, prog = null, U = {}, texBase = null, texLit = null, quad = null;
var VERT = [
  "attribute vec2 aPos;",
  "void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }"
].join("\n");

var FRAG = [
"precision highp float;",
"uniform vec2 uRes;",
"uniform vec2 uHead;",
"uniform vec3 uAccent;",
"uniform float uTime, uBeat, uBass, uMid, uTreble, uFade, uSeed, uRM, uHasText;",
"uniform sampler2D uMask;",
"uniform sampler2D uLit;",
"const float PI = 3.14159265;",
"float hash21(vec2 p){",
"  vec3 p3 = fract(vec3(p.xyx) * 0.1031);",
"  p3 += dot(p3, p3.yzx + 33.33);",
"  return fract((p3.x + p3.y) * p3.z);",
"}",
"float vnoise(vec2 p){",
"  vec2 i = floor(p), f = fract(p);",
"  vec2 u = f * f * (3.0 - 2.0 * f);",
"  float a = hash21(i);",
"  float b = hash21(i + vec2(1.0, 0.0));",
"  float c = hash21(i + vec2(0.0, 1.0));",
"  float d = hash21(i + vec2(1.0, 1.0));",
"  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);",
"}",
"float fbm(vec2 p){",
"  float s = 0.0, a = 0.5;",
"  for (int i = 0; i < 4; i++) {",
"    s += a * vnoise(p);",
"    p = p * 2.02 + vec2(17.3, 9.1);",
"    a *= 0.5;",
"  }",
"  return s;",
"}",
"float sdRoundBox(vec2 p, vec2 b, float r){",
"  vec2 d = abs(p) - b + r;",
"  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - r;",
"}",
"float darkFringe(float n, float lam){",
"  float s = sin(PI * n / lam);",
"  return s * s;",
"}",
"void main(){",
"  vec2 uv = gl_FragCoord.xy / uRes;",
"  float aspect = uRes.x / uRes.y;",
"  vec2 q = (uv - 0.5) * vec2(aspect, 1.0);",
"  float t = uTime;",
"  float amp = mix(1.0, 0.38, uRM);",
"  float bass = uBass, treb = uTreble, beat = uBeat;",
"  float load = (0.30 + 0.70 * bass) * amp + 0.30 * beat;",
"",
"  vec2 p = q;",
"  vec2 wv = vec2(",
"    fbm(p * 2.1 + vec2(t * 0.13, -t * 0.09) + uSeed * 3.1),",
"    fbm(p * 2.1 + vec2(-t * 0.11, t * 0.12) + 7.7 + uSeed * 1.7)",
"  ) - 0.5;",
"  p += wv * (0.16 + 0.16 * bass) * amp;",
"",
"  float d1 = length(p - vec2(-0.34 * aspect,  0.26));",
"  float d2 = length(p - vec2( 0.34 * aspect, -0.26));",
"  float d3 = length(p - vec2( 0.30 * aspect,  0.24));",
"  float d4 = length(p - vec2(-0.30 * aspect, -0.24));",
"  float f = 1.0 / (0.11 + d1) + 1.0 / (0.11 + d2) - 0.60 / (0.11 + d3) - 0.60 / (0.11 + d4);",
"  f += (p.x * 0.85 + p.y * 0.45) * 0.55;",
"  f += 0.30 * sin(p.x * 6.5 - t * 0.55 + p.y * 2.7);",
"",
"  float rr = length(p);",
"  f += sin(rr * 21.0 - t * 3.1) * beat * 1.15 * exp(-rr * 1.5);",
"",
"  vec2 hp = (vec2(uHead.x, 1.0 - uHead.y) - 0.5) * vec2(aspect, 1.0);",
"  float hd = length(p - hp);",
"  f += step(0.0, uHead.x) * 0.18 / (0.055 + hd);",
"",
"  f += (vnoise(p * 34.0 + t * 1.7) - 0.5) * 0.10 * treb;",
"",
"  float n = f * (215.0 + 640.0 * load);",
"  vec3 fr;",
"  fr.r = darkFringe(n, 660.0);",
"  fr.g = darkFringe(n, 545.0);",
"  fr.b = darkFringe(n, 455.0);",
"  fr = pow(fr, vec3(0.86));",
"  float vis = 0.74 + 0.26 * cos(t * 0.33 + uSeed * 0.7);",
"  fr *= vis;",
"",
"  float mBase = smoothstep(0.22, 0.72, texture2D(uMask, uv).a);",
"  float mLit  = smoothstep(0.22, 0.72, texture2D(uLit, uv).a);",
"",
"  vec3 bg = vec3(0.008, 0.009, 0.013);",
"  bg += uAccent * 0.020 * exp(-length(q - vec2(0.0, 0.04)) * 2.7);",
"  bg += vec3(0.010, 0.012, 0.018) * smoothstep(-0.3, 1.0, uv.y);",
"",
"  vec2 sc = (uv - vec2(0.5, 0.465)) * vec2(aspect, 1.0);",
"  float sd = sdRoundBox(sc, vec2(0.455 * aspect, 0.335), 0.035);",
"  float sheet = 1.0 - smoothstep(-0.005, 0.005, sd);",
"",
"  vec3 sheetCol = vec3(0.019, 0.022, 0.030);",
"  sheetCol += vec3(0.055, 0.060, 0.075) * smoothstep(-0.30, 0.32, sc.y) * 0.45;",
"  sheetCol += fr * (0.040 + 0.085 * (1.0 - uHasText));",
"  float edge = exp(-abs(sd) * 820.0);",
"  sheetCol += mix(vec3(1.0), uAccent, 0.40) * edge * (0.085 + 0.075 * beat);",
"  float sw = (sc.y - 0.27 - 0.09 * sin(t * 0.21)) * 24.0;",
"  sheetCol += vec3(0.05) * exp(-sw * sw);",
"  sheetCol += vec3(0.9) * pow(hash21(floor(uv * uRes * 0.5) + 3.0), 38.0) * 0.30;",
"",
"  vec3 col = mix(bg, sheetCol, sheet);",
"",
"  float sh = texture2D(uMask, uv + vec2(0.0016, -0.0028)).a;",
"  sh = smoothstep(0.25, 0.85, sh);",
"  col *= 1.0 - 0.34 * sh;",
"",
"  vec3 etch = vec3(0.085, 0.092, 0.110) + fr * 0.26;",
"  etch = mix(etch, uAccent * 0.42, 0.16);",
"  col = mix(col, etch, mBase * 0.88);",
"",
"  vec3 vivid = vec3(0.135) + fr * (1.06 + 0.34 * beat);",
"  vivid = mix(vivid, vec3(1.0), 0.055);",
"  float fade = 0.72 + 0.28 * uFade;",
"  col = mix(col, vivid * fade, mLit);",
"",
"  float halo = 0.0;",
"  halo += texture2D(uLit, uv + vec2( 0.006, 0.0)).a;",
"  halo += texture2D(uLit, uv + vec2(-0.006, 0.0)).a;",
"  halo += texture2D(uLit, uv + vec2(0.0,  0.007)).a;",
"  halo += texture2D(uLit, uv + vec2(0.0, -0.007)).a;",
"  halo *= 0.25;",
"  col += fr * halo * 0.55 + uAccent * halo * 0.07;",
"",
"  col = 1.0 - exp(-col * 1.30);",
"  col *= mix(1.0, 1.0 - smoothstep(0.24, 1.28, length(q * vec2(0.92, 1.16))), 0.62);",
"  float g = hash21(gl_FragCoord.xy + fract(t) * 137.0) - 0.5;",
"  col += g * 0.020;",

"}"

function compile(type, src) {

    for (var i = 0; i < names.length; i++) U[names[i]] = gl.getUniformLocation(prog, names[i]);
    texBase = makeTex(); texLit = makeTex();
    gl.uniform1i(U.uMask, 0);
    gl.uniform1i(U.uLit, 1);
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    return true;
  } catch (e) { logErr(e); return false; }
}

/* ---------- 7. 生命周期 ---------- */
var W = 1440, H = 900, animT = 0, lastNow = 0, lastTickAt = 0, raf = 0;
var hasInit = false, beatPulse = 0, bassS = 0, midS = 0, trebS = 0;
var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, playing: true };
var pointer = { x: 0, y: 0 };

function resize() {
  var sz = safeSize(); W = sz.w; H = sz.h;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(2, Math.round(W * dpr));
  cv.height = Math.max(2, Math.round(H * dpr));
  if (gl) gl.viewport(0, 0, cv.width, cv.height);
  makeMaskCanvas();
  curIdx = -99; drawnK = -1;
  if (S.lines.length) updateLyrics(S.t);
  if (fbMode) resizeFB();
}

function draw(now) {
  var f = hasInit && S.lines.length ? clamp(((window.performance && performance.now()) - fadeStart) / 260, 0, 1) : 1;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texBase);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texLit);
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform2f(U.uHead, headX, headY);
  gl.uniform3f(U.uAccent, accent[0] / 255, accent[1] / 255, accent[2] / 255);
  gl.uniform1f(U.uTime, animT);
  gl.uniform1f(U.uBeat, beatPulse);
  gl.uniform1f(U.uBass, bassS);
  gl.uniform1f(U.uMid, midS);
  gl.uniform1f(U.uTreble, trebS);
  gl.uniform1f(U.uFade, f);
  gl.uniform1f(U.uSeed, seed);
  gl.uniform1f(U.uRM, RM ? 1 : 0);
  gl.uniform1f(U.uHasText, S.lines.length ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

function frame(now) {
  raf = requestAnimationFrame(frame);
  var dt = lastNow ? Math.min(0.06, (now - lastNow) / 1000) : 0.016;
  lastNow = now;
  S.frames++;
  S.js = S.js ? (S.js * 0.9 + dt * 1000 * 0.1) : dt * 1000;

  var fresh = (now - lastTickAt) < 420;
  var moving = hasInit ? (S.playing && fresh) : true;
  if (moving) animT += dt * (RM ? 0.34 : 1.0);
  beatPulse *= Math.exp(-5.6 * dt);

  bassS = damp(bassS, live.bass, 7, dt);
  midS = damp(midS, live.mid, 7, dt);
  trebS = damp(trebS, live.treble, 9, dt);

  try {
    updateLyrics(S.t);
    if (GL_OK) draw(now); else drawFB(now, dt);
  } catch (e) { logErr(e); }
}

/* ---------- 8. 2D 兜底 ---------- */
var fbMode = false, fbCv = null, fbg = null, fbLyr = null, fbSpans = [], fbIdx = -9, fbK = -1;
function buildFallback() {
  fbMode = true;
  var box = document.getElementById("fb");
  if (!box) return;
  box.classList.add("on");
  fbCv = document.getElementById("fbgl");
  fbg = fbCv ? fbCv.getContext("2d") : null;
  fbLyr = document.getElementById("fblyr");
  resizeFB();
  addEventListener("resize", resizeFB);
}
function resizeFB() {
  if (!fbCv) return;
  var sz = safeSize();
  fbCv.width = Math.round(sz.w); fbCv.height = Math.round(sz.h);
}
function updateFBText() {
  if (!fbLyr) return;
  if (S.idx === fbIdx) return;
  fbIdx = S.idx; fbK = -1; fbSpans = [];
  fbLyr.textContent = "";
  var L = S.lines[S.idx];
  if (!L) return;
  var arr = Array.from(L.text);
  for (var i = 0; i < arr.length; i++) {
    var sp = document.createElement("span");
    sp.textContent = arr[i] === " " ? " " : arr[i];
    fbLyr.appendChild(sp);
    fbSpans.push(sp);
  }
}
function drawFB(now, dt) {
  if (!fbg) return;
  var w = fbCv.width, h = fbCv.height;
  updateFBText();
  fbg.fillStyle = "#06070b"; fbg.fillRect(0, 0, w, h);
  var g = fbg.createRadialGradient(w * 0.5, h * 0.54, 0, w * 0.5, h * 0.54, Math.max(w, h) * 0.62);
  g.addColorStop(0, "rgba(90,116,255,0.11)");
  g.addColorStop(0.55, "rgba(40,54,120,0.05)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  fbg.fillStyle = g; fbg.fillRect(0, 0, w, h);
  fbg.save();
  fbg.translate(w * 0.5, h * 0.52);
  for (var i = 0; i < 26; i++) {
    var rad = (i * 34 + (animT * 26 + i * 13) % 34) % (Math.max(w, h) * 0.55);
    var a = 0.05 + 0.05 * Math.sin(i * 0.7 + animT * 0.6);
    fbg.strokeStyle = "rgba(" + accent[0] + "," + accent[1] + "," + accent[2] + "," + a.toFixed(3) + ")";
    fbg.lineWidth = 1;
    fbg.beginPath(); fbg.ellipse(0, 0, rad * 1.25, rad * 0.72, 0, 0, Math.PI * 2); fbg.stroke();
  }
  fbg.restore();
  if (S.idx >= 0 && S.lines[S.idx]) {
    var L = S.lines[S.idx], k = 0;
    for (var j = 0; j < L.times.length; j++) if (L.times[j] != null && L.times[j] <= S.t + 0.0001) k++;
    if (k !== fbK) {
      fbK = k;
      for (var m = 0; m < fbSpans.length; m++) fbSpans[m].className = (m < k) ? "on" : "";
    }
  }
}

/* ---------- 9. 消息 ---------- */
function applyInit(p) {
  var lines = buildLines(p.lines);
  var same = lines.length === S.lines.length;
  if (same) {
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].text !== S.lines[i].text || lines[i].t !== S.lines[i].t) { same = false; break; }
    }
  }
  S.lines = lines;
  hasInit = true;
  if (typeof p.playing === "boolean") S.playing = p.playing;
  if (Array.isArray(p.accent)) accent = normAccent(p.accent);
  if (!same) { curIdx = -99; S.idx = -1; drawnK = -1; fbIdx = -9; }
  updateLyrics(S.t);
}

function onBeat(p) {
  var lv = Number(p.level);
  var v = isFinite(lv) ? clamp(lv, 0, 1) : 0.5;
  beatPulse = Math.min(1.25, Math.max(beatPulse, 0.42 + 0.62 * v));
}

function onTick(t, playing) {
  if (typeof playing === "boolean") S.playing = playing;
  if (isFinite(t)) {
    if (Math.abs(t - S.t) > 0.5) { beatPulse = 0; drawnK = -1; curIdx = -99; }
    S.t = t;
    lastTickAt = (window.performance && performance.now()) || Date.now();
  }
}

addEventListener("message", function (ev) {
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  var p = d.payload || {};
  try {
    if (d.type === "init") applyInit(p);
    else if (d.type === "tick") onTick(Number(p.time), p.playing);
    else if (d.type === "beat") onBeat(p);
    else if (d.type === "live") {
      var lv = Number(p.level), b = Number(p.bass), m = Number(p.mid), tr = Number(p.treble);
      if (isFinite(lv)) live.level = clamp(lv, 0, 1);
      if (isFinite(b)) live.bass = clamp(b, 0, 1);
      if (isFinite(m)) live.mid = clamp(m, 0, 1);
      if (isFinite(tr)) live.treble = clamp(tr, 0, 1);
      if (typeof p.playing === "boolean") S.playing = p.playing;
    }
  } catch (e) { logErr(e); }
});

addEventListener("pointermove", function (e) {
  var w = window.innerWidth || 1, h = window.innerHeight || 1;
  pointer.x = clamp((e.clientX / w) * 2 - 1, -1, 1);
  pointer.y = clamp((e.clientY / h) * 2 - 1, -1, 1);
}, { passive: true });

addEventListener("pagehide", function () {
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
});
addEventListener("resize", resize);

/* ---------- 10. 启动 ---------- */
function boot() {
  GL_OK = initGL();
  resize();
  if (!GL_OK) buildFallback();
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
