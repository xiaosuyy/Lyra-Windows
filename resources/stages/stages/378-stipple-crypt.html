<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨窟残卷</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a08; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  /* ---------- self-check hook: outermost, unconditional ---------- */
  var state = {
    lines: [], idx: -1, time: 0, playing: true, frames: 0, jsMs: 0,
    err: '', text: '', gl: false, reduced: false, readySent: false,
    accent: [214, 170, 96], W: 1440, H: 900, dpr: 1,
    song: { name: '', artist: '', cover: '' },
    beat: { index: -1, level: 0, at: -10 },
    live: { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 }
  };

  window.__stage = function () {
    return {
      lines: state.lines.length,
      idx: state.idx,
      t: state.time,
      playing: state.playing,
      frames: state.frames,
      js: state.jsMs,
      err: state.err,
      text: state.text,
      gl: state.gl,
      rm: state.reduced
    };
  };

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) { state.err = 'no 2d ctx'; }

  var page = {
    surface: null, desk: null, layout: null, dirty: true,
    seed: 3781
  };

  var plate = {
    surface: null, dots: null, dotsPainted: 0, dirty: true,
    fog: null, glow: 0
  };

  var SEED_BASE = 378;
  function makeRandom(seed) {
    var t = (seed >>> 0) || 1;
    return function nextRandom() {
      t += 0x6D2B79F5;
      var r = t;
      r = Math.imul(r ^ (r >>> 15), r | 1);
      r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeSurface(width, height) {
    var surface = document.createElement('canvas');
    surface.width = Math.max(1, Math.round(width));
    surface.height = Math.max(1, Math.round(height));
    return surface;
  }

  function isDrawableSurface(surface) {
    return !!(surface && typeof surface.getContext === 'function' && surface.width > 0 && surface.height > 0);
  }

  function canTracePath(target) {
    return !!(target && typeof target.beginPath === 'function' && typeof target.moveTo === 'function');
  }

  function blitSurface(target, surface, x, y, width, height) {
    if (!isDrawableSurface(surface) || !(width > 0) || !(height > 0)) { return; }
    try { target.drawImage(surface, x, y, width, height); }
    catch (error) { reportError('blitSurface', error); }
  }

  function addStopSafely(gradient, offset, color) {
    if (!gradient) { return; }
    try { gradient.addColorStop(clampNumber(offset, 0, 1), color); }
    catch (error) { reportError('addStop', error); }
  }

  function inkColor(alpha) {
    var value = Math.round(clampNumber(alpha, 0, 1) * 1000) / 1000;
    return 'rgba(38,31,22,' + value + ')';
  }

  function blueprint(alpha) {
    var value = Math.round(clampNumber(alpha, 0, 1) * 1000) / 1000;
    return 'rgba(40,50,79,' + value + ')';
  }

  function accentColor(alpha) {
    var rgb = state.accent;
    var r = Math.round(clampNumber(rgb[0], 0, 255));
    var g = Math.round(clampNumber(rgb[1], 0, 255));
    var b = Math.round(clampNumber(rgb[2], 0, 255));
    var value = Math.round(clampNumber(alpha, 0, 1) * 1000) / 1000;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + value + ')';
  }

  function accentInk(alpha) {
    var rgb = state.accent;
    var r = Math.round(clampNumber(rgb[0] * 0.42 + 26 * 0.58, 0, 255));
    var g = Math.round(clampNumber(rgb[1] * 0.42 + 21 * 0.58, 0, 255));
    var b = Math.round(clampNumber(rgb[2] * 0.42 + 15 * 0.58, 0, 255));
    var value = Math.round(clampNumber(alpha, 0, 1) * 1000) / 1000;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + value + ')';
  }

  var lastErrAt = 0;
  function reportError(where, error) {
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (now - lastErrAt < 1000) { return; }
    lastErrAt = now;
    if (window.console && console.error) { console.error('[378 ' + where + ']', error); }
  }

  function clampNumber(value, low, high) {
    var n = Number(value);
    if (!isFinite(n)) { return low; }
    return n < low ? low : (n > high ? high : n);
  }

  var FONT_SERIF = '"Songti SC","SimSun","Noto Serif CJK SC",serif';
  var FONT_LATIN = '"Courier New","Georgia",monospace';

  function computeLayout() {
    var width = state.W, height = state.H;
    var pad = clampNumber(Math.min(width, height) * 0.042, 7, 58);
    var pageHeight = Math.max(160, height - pad * 2);
    var pageWidth = Math.min(width - pad * 2, pageHeight * 1.36);
    if (!(pageWidth > 80)) { pageWidth = Math.max(120, width - 16); }
    var pageX = (width - pageWidth) / 2;
    var pageY = (height - pageHeight) / 2;
    var inset = clampNumber(Math.min(pageWidth, pageHeight) * 0.056, 9, 34);
    var innerX = pageX + inset;
    var innerY = pageY + inset;
    var innerWidth = pageWidth - inset * 2;
    var innerHeight = pageHeight - inset * 2;
    var portrait = pageHeight > pageWidth * 1.1;
    var headerHeight = clampNumber(innerHeight * 0.15, 42, 96);
    var footerHeight = clampNumber(innerHeight * 0.05, 14, 30);
    var bandHeight = (innerHeight - headerHeight - footerHeight) * (portrait ? 0.40 : 0.36);
    var plateTop = innerY + headerHeight + innerHeight * 0.012;
    var plateHeight = innerHeight - headerHeight - footerHeight - bandHeight;
    var plateWidth = innerWidth * 0.975;
    var plateX = innerX + (innerWidth - plateWidth) / 2;
    var captionHeight = clampNumber(plateHeight * 0.1, 15, 28);
    var shadowPad = clampNumber(Math.min(pageWidth, pageHeight) * 0.09, 24, 90);
    return {
      width: width, height: height,
      pageX: pageX, pageY: pageY, pageWidth: pageWidth, pageHeight: pageHeight,
      inset: inset, innerX: innerX, innerY: innerY, innerWidth: innerWidth, innerHeight: innerHeight,
      portrait: portrait, headerHeight: headerHeight, footerHeight: footerHeight,
      bandHeight: bandHeight, bandTop: plateTop + plateHeight,
      plateX: plateX, plateY: plateTop, plateWidth: plateWidth,
      plateImageHeight: plateHeight - captionHeight, plateHeight: plateHeight,
      captionHeight: captionHeight, shadowPad: shadowPad
    };
  }

  function applySize() {
    var width = Math.round(window.innerWidth || 0);
    var height = Math.round(window.innerHeight || 0);
    if (!(width > 0) || !(height > 0)) { width = 1440; height = 900; }
    state.W = width; state.H = height;
    state.dpr = clampNumber(window.devicePixelRatio || 1, 1, 2);
    canvas.width = Math.round(width * state.dpr);
    canvas.height = Math.round(height * state.dpr);
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    page.layout = computeLayout();
    page.dirty = true;
    page.desk = null;
  }

  function buildRoughOutline(width, height, amplitude) {
    var random = makeRandom(SEED_BASE + 41);
    var points = [];
    var steps = 44;
    var side, step, t, point;
    for (side = 0; side < 4; side += 1) {
      for (step = 0; step < steps; step += 1) {
        t = step / steps;
        if (side === 0) { point = [t * width, 0]; }
        else if (side === 1) { point = [width, t * height]; }
        else if (side === 2) { point = [width - t * width, height]; }
        else { point = [0, height - t * height]; }
        var wobble = (random() - 0.5) * amplitude * 2;
        var inward = (random() - 0.5) * amplitude;
        if (side === 0) { point[1] += inward * 0.6; point[0] += wobble * 0.4; }
        else if (side === 1) { point[0] += inward * 0.6; point[1] += wobble * 0.4; }
        else if (side === 2) { point[1] += inward * 0.6; point[0] += wobble * 0.4; }
        else { point[0] += inward * 0.6; point[1] += wobble * 0.4; }
        points.push(point);
      }
    }
    return points;
  }

  function traceOutline(target, points, offsetX, offsetY) {
    if (!canTracePath(target) || !points || points.length < 3) { return false; }
    target.beginPath();
    target.moveTo(points[0][0] + offsetX, points[0][1] + offsetY);
    var limit = Math.min(points.length, 400);
    for (var i = 1; i < limit; i += 1) {
      target.lineTo(points[i][0] + offsetX, points[i][1] + offsetY);
    }
    target.closePath();
    return true;
  }

  function bakeDeskSurface() {
    var width = state.W, height = state.H;
    var surface = makeSurface(width, height);
    var g = surface.getContext('2d');
    if (!g) { return null; }
    var base = g.createLinearGradient(0, 0, width * 0.4, height);
    addStopSafely(base, 0, '#17120c');
    addStopSafely(base, 0.5, '#0d0a07');
    addStopSafely(base, 1, '#070605');
    g.fillStyle = base;
    g.fillRect(0, 0, width, height);
    var random = makeRandom(SEED_BASE + 7);
    for (var i = 0; i < 64; i += 1) {
      var bx = random() * width;
      var by = random() * height;
      var radius = 20 + random() * 140;
      var blot = g.createRadialGradient(bx, by, 0, bx, by, radius);
      addStopSafely(blot, 0, 'rgba(255,236,200,0.03)');
      addStopSafely(blot, 1, 'rgba(255,236,200,0)');
      g.fillStyle = blot;
      g.fillRect(bx - radius, by - radius, radius * 2, radius * 2);
    }
    var vignette = g.createRadialGradient(width / 2, height / 2, Math.min(width, height) * 0.25,
      width / 2, height / 2, Math.max(width, height) * 0.78);
    addStopSafely(vignette, 0, 'rgba(0,0,0,0)');
    addStopSafely(vignette, 1, 'rgba(0,0,0,0.55)');
    g.fillStyle = vignette;
    g.fillRect(0, 0, width, height);
    return surface;
  }

  function bakePageSurface(layout) {
    var width = layout.pageWidth, height = layout.pageHeight;
    var shadowPad = layout.shadowPad;
    var surface = makeSurface(width + shadowPad * 2, height + shadowPad * 2);
    var g = surface.getContext('2d');
    if (!g) { return null; }
    var outline = buildRoughOutline(width, height, 2.2);
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.7)';
    g.shadowBlur = shadowPad * 0.72;
    g.shadowOffsetX = shadowPad * 0.12;
    g.shadowOffsetY = shadowPad * 0.24;
    g.fillStyle = '#d9cba4';
    if (traceOutline(g, outline, shadowPad, shadowPad)) { g.fill(); }
    g.restore();
    g.save();
    g.beginPath();
    g.moveTo(outline[0][0] + shadowPad, outline[0][1] + shadowPad);
    for (var p = 1; p < outline.length; p += 1) {
      g.lineTo(outline[p][0] + shadowPad, outline[p][1] + shadowPad);
    }
    g.closePath();
    g.clip();
    var paper = g.createLinearGradient(shadowPad, shadowPad, shadowPad + width, shadowPad + height);
    addStopSafely(paper, 0, '#f0e7ce');
    addStopSafely(paper, 0.45, '#e8ddc1');
    addStopSafely(paper, 1, '#d9caa7');
    g.fillStyle = paper;
    g.fillRect(shadowPad, shadowPad, width, height);
    var random = makeRandom(page.seed);
    var i, x, y, radius, stain, fiber;
    for (i = 0; i < 22; i += 1) {
      x = shadowPad + random() * width;
      y = shadowPad + random() * height;
      radius = Math.min(width, height) * (0.06 + random() * 0.22);
      stain = g.createRadialGradient(x, y, 0, x, y, radius);
      addStopSafely(stain, 0, 'rgba(120,88,44,' + (0.05 + random() * 0.06).toFixed(3) + ')');
      addStopSafely(stain, 1, 'rgba(120,88,44,0)');
      g.fillStyle = stain;
      g.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }
    for (i = 0; i < 640; i += 1) {
      x = shadowPad + random() * width;
      y = shadowPad + random() * height;
      fiber = 0.6 + random() * 2.4;
      g.strokeStyle = 'rgba(96,72,40,' + (0.025 + random() * 0.06).toFixed(3) + ')';
      g.lineWidth = 0.5 + random() * 0.7;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + (random() - 0.5) * 22, y + (random() - 0.5) * 3.5);
      g.stroke();
    }
    var laidStep = Math.max(9, width / 64);
    for (i = 0; i < 72; i += 1) {
      x = shadowPad + i * laidStep;
      if (x > shadowPad + width) { break; }
      g.strokeStyle = 'rgba(112,86,48,0.05)';
      g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(x, shadowPad);
      g.lineTo(x + (random() - 0.5) * 3, shadowPad + height);
      g.stroke();
    }
    for (i = 0; i < 320; i += 1) {
      x = shadowPad + random() * width;
      y = shadowPad + random() * height;
      radius = 0.4 + random() * 1.7;
      g.fillStyle = 'rgba(84,62,33,' + (0.05 + random() * 0.18).toFixed(3) + ')';
      g.fillRect(x, y, radius, radius);
    }
    var edge = g.createRadialGradient(shadowPad + width / 2, shadowPad + height / 2, Math.min(width, height) * 0.42,
      shadowPad + width / 2, shadowPad + height / 2, Math.max(width, height) * 0.78);
    addStopSafely(edge, 0, 'rgba(110,80,40,0)');
    addStopSafely(edge, 1, 'rgba(96,68,34,0.30)');
    g.fillStyle = edge;
    g.fillRect(shadowPad, shadowPad, width, height);
    g.restore();
    return surface;
  }

  function ensureSurfaces() {
    if (!page.desk || page.desk.width !== state.W || page.desk.height !== state.H) {
      page.desk = bakeDeskSurface();
    }
    if (page.dirty || !isDrawableSurface(page.surface)) {
      page.surface = bakePageSurface(page.layout);
      page.dirty = false;
      plate.dirty = true;
    }
  }

  function drawDesk() {
    blitSurface(ctx, page.desk, 0, 0, state.W, state.H);
    var layout = page.layout;
    var glow = ctx.createRadialGradient(layout.pageX + layout.pageWidth / 2,
      layout.pageY + layout.pageHeight * 0.9, 0,
      layout.pageX + layout.pageWidth / 2, layout.pageY + layout.pageHeight * 0.9,
      Math.max(state.W, state.H) * 0.55);
    addStopSafely(glow, 0, accentColor(0.055 + plate.glow * 0.16));
    addStopSafely(glow, 1, accentColor(0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, state.W, state.H);
  }

  function drawPageSurface() {
    var layout = page.layout;
    if (!isDrawableSurface(page.surface)) { return; }
    blitSurface(ctx, page.surface,
      layout.pageX - layout.shadowPad, layout.pageY - layout.shadowPad,
      layout.pageWidth + layout.shadowPad * 2, layout.pageHeight + layout.shadowPad * 2);
  }

  function drawRules() {
    var layout = page.layout;
    var x = layout.pageX, y = layout.pageY;
    var w = layout.pageWidth, h = layout.pageHeight;
    var outerX = x + layout.inset * 0.42, outerY = y + layout.inset * 0.42;
    var outerW = w - layout.inset * 0.84, outerH = h - layout.inset * 0.84;
    ctx.strokeStyle = blueprint(0.72);
    ctx.lineWidth = 1.8;
    ctx.strokeRect(outerX, outerY, outerW, outerH);
    ctx.strokeStyle = blueprint(0.4);
    ctx.lineWidth = 0.9;
    ctx.strokeRect(x + layout.inset * 0.62, y + layout.inset * 0.62, w - layout.inset * 1.24, h - layout.inset * 1.24);
    ctx.strokeStyle = blueprint(0.3);
    ctx.lineWidth = 0.7;
    var ornament = clampNumber(Math.min(w, h) * 0.022, 5, 15);
    var corners = [[outerX, outerY, 1, 1], [outerX + outerW, outerY, -1, 1], [outerX, outerY + outerH, 1, -1], [outerX + outerW, outerY + outerH, -1, -1]];
    for (var c = 0; c < 4; c += 1) {
      var corner = corners[c];
      var inner = ornament * 0.42;
      ctx.beginPath();
      ctx.moveTo(corner[0] + corner[2] * inner, corner[1] + corner[3] * ornament);
      ctx.lineTo(corner[0] + corner[2] * inner, corner[1] + corner[3] * inner);
      ctx.lineTo(corner[0] + corner[2] * ornament, corner[1] + corner[3] * inner);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(corner[0] + corner[2] * ornament * 0.62, corner[1] + corner[3] * ornament * 0.62, 1.1, 0, Math.PI * 2);
      ctx.stroke();
    }
    var ruleY = layout.innerY + layout.headerHeight;
    ctx.strokeStyle = blueprint(0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(layout.innerX, ruleY);
    ctx.lineTo(layout.innerX + layout.innerWidth, ruleY);
    ctx.stroke();
    ctx.strokeStyle = blueprint(0.28);
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(layout.innerX + layout.innerWidth * 0.18, ruleY + 2.6);
    ctx.lineTo(layout.innerX + layout.innerWidth * 0.82, ruleY + 2.6);
    ctx.stroke();
    var diamondX = layout.innerX + layout.innerWidth / 2;
    var diamondY = ruleY;
    var size = clampNumber(layout.innerWidth * 0.008, 2.5, 5);
    ctx.fillStyle = blueprint(0.6);
    ctx.beginPath();
    ctx.moveTo(diamondX, diamondY - size);
    ctx.lineTo(diamondX + size, diamondY);
    ctx.lineTo(diamondX, diamondY + size);
    ctx.lineTo(diamondX - size, diamondY);
    ctx.closePath();
    ctx.fill();
  }

  function drawMarginNotes() {
    var layout = page.layout;
    var size = clampNumber(layout.innerWidth * 0.0098, 7, 11);
    ctx.save();
    ctx.font = size + 'px ' + FONT_LATIN;
    ctx.fillStyle = blueprint(0.38);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.translate(layout.pageX + layout.pageWidth - layout.inset * 0.76, layout.innerY + layout.innerHeight * 0.5);
    ctx.rotate(Math.PI / 2);
    ctx.fillText(spaced('THE SUNKEN VAULT \u00b7 MODULE III', 1, 40), 0, 0);
    ctx.restore();
    ctx.save();
    ctx.font = size + 'px ' + FONT_SERIF;
    ctx.fillStyle = inkColor(0.3);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.translate(layout.pageX + layout.inset * 0.76, layout.innerY + layout.innerHeight * 0.5);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(spaced('点画成图 \u00b7 手工上墨', 0, 12), 0, 0);
    ctx.restore();
  }

  function setFittedText(text, maxWidth, baseSize, minSize, fontFamily) {
    var size = Math.max(minSize, baseSize);
    ctx.font = size + 'px ' + fontFamily;
    var guard = 0;
    while (ctx.measureText(text).width > maxWidth && size > minSize && guard < 40) {
      size -= Math.max(0.5, size * 0.04);
      ctx.font = size + 'px ' + fontFamily;
      guard += 1;
    }
    return size;
  }

  function drawHeader() {
    var layout = page.layout;
    var centerX = layout.innerX + layout.innerWidth / 2;
    var labelSize = clampNumber(layout.innerWidth * 0.011, 8, 12);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = blueprint(0.55);
    ctx.font = labelSize + 'px ' + FONT_LATIN;
    var labelY = layout.innerY + layout.headerHeight * 0.26;
    ctx.fillText(spaced('DUNGEON  MODULE  \u00b7  \u5377  \u4e09', 1.6, 34), centerX, labelY);
    ctx.fillStyle = inkColor(0.9);
    var title = state.song.name ? String(state.song.name) : '墨窟残卷';
    var titleSize = setFittedText(title, layout.innerWidth * 0.9,
      clampNumber(layout.innerWidth * 0.048, 20, 44), 14, FONT_SERIF);
    var titleRows = wrapRows(title, titleSize + 'px ' + FONT_SERIF, layout.innerWidth * 0.9, 2);
    ctx.font = titleSize + 'px ' + FONT_SERIF;
    if (titleRows.length > 1) {
      var smallTitle = Math.max(11, titleSize * 0.72);
      ctx.font = smallTitle + 'px ' + FONT_SERIF;
      ctx.fillText(titleRows[0], centerX, layout.innerY + layout.headerHeight * 0.62);
      ctx.fillText(titleRows[1], centerX, layout.innerY + layout.headerHeight * 0.82);
    } else {
      ctx.fillText(titleRows[0], centerX, layout.innerY + layout.headerHeight * 0.73);
    }
    var artist = state.song.artist || '';
    if (artist) {
      ctx.fillStyle = inkColor(0.5);
      var artistSize = setFittedText(spaced(artist, 1, 30), layout.innerWidth * 0.8,
        clampNumber(layout.innerWidth * 0.012, 9, 13), 7, FONT_SERIF);
      ctx.font = artistSize + 'px ' + FONT_SERIF;
      ctx.fillText(spaced(artist, 1, 30), centerX, layout.innerY + layout.headerHeight * 0.92);
    }
  }

  function spaced(text, tracking, limit) {
    var out = '';
    var count = Math.min(String(text).length, limit);
    for (var i = 0; i < count; i += 1) {
      out += String(text).charAt(i) + (i < count - 1 ? '\u2009' : '');
      if (tracking > 0) { out += '\u2009'; }
    }
    return out;
  }

  function wrapRows(text, font, maxWidth, maxRows) {
    var rows = [];
    var current = '';
    var source = String(text === null || text === undefined ? '' : text).slice(0, 180);
    var guard = 0;
    ctx.font = font;
    for (var i = 0; i < source.length; i += 1) {
      var ch = source.charAt(i);
      if (ch === '\n') {
        if (current) { rows.push(current); }
        current = '';
        if (rows.length >= maxRows) { break; }
        continue;
      }
      var candidate = current + ch;
      if (current && ctx.measureText(candidate).width > maxWidth) {
        if (rows.length < maxRows - 1) { rows.push(current); current = ch; }
        else {
          var cut = current;
          while (cut.length > 1 && ctx.measureText(cut + '…').width > maxWidth && guard < 120) {
            cut = cut.slice(0, -1);
            guard += 1;
          }
          rows.push(cut + '…');
          current = '';
          break;
        }
      } else {
        current = candidate;
      }
    }
    if (current) { rows.push(current); }
    return rows.length ? rows : [''];
  }

  function fitLyricSize(text, maxWidth, startSize, maxRows, floorSize) {
    var flat = String(text === null || text === undefined ? '' : text).slice(0, 180);
    var startFont = startSize + 'px ' + FONT_SERIF;
    ctx.font = startFont;
    var fullWidth = ctx.measureText(flat).width;
    var size = startSize;
    if (fullWidth > maxWidth && fullWidth > 0) {
      size = Math.max(floorSize, Math.floor(startSize * (maxWidth / fullWidth) * 10) / 10);
    }
    var font = size + 'px ' + FONT_SERIF;
    return { size: size, rows: wrapRows(flat, font, maxWidth, maxRows), font: font };
  }

  var ridgeTables = {};

  function ridgeTable(kind) {
    if (ridgeTables[kind]) { return ridgeTables[kind]; }
    var random = makeRandom(SEED_BASE + 500 + kind * 37);
    var values = [];
    for (var i = 0; i < 25; i += 1) { values.push(random()); }
    ridgeTables[kind] = values;
    return values;

  function ridgeNoise(u, kind) {

    var position = clampNumber(u, 0, 1) * 24;
    var lowIndex = Math.min(24, Math.floor(position));
    var highIndex = Math.min(24, lowIndex + 1);
    var mix = position - lowIndex;
    var low = table[lowIndex] * (1 - mix);
    var high = table[highIndex] * mix;
    return (low + high) * 2 - 1;

  function ridgeProfile(u, kind) {
    if (kind === 0) {
      return 0.50 + 0.075 * ridgeNoise(u, 0) + 0.018 * Math.sin(u * 31.4 + 1.1);

    if (kind === 1) {
      return 0.615 + 0.06 * ridgeNoise(u, 1) + 0.014 * Math.sin(u * 27.3 + 3.4);

    if (kind === 2) {
      return 0.72 + 0.048 * ridgeNoise(u, 2) + 0.01 * Math.sin(u * 22.2 + 1.7);

    return 0.87 + 0.03 * ridgeNoise(u, 3);

  function buildPlateDensity(surfaceWidth, surfaceHeight) {
    var densityWidth = Math.round(clampNumber(surfaceWidth * 0.26, 120, 300));

    var surface = makeSurface(densityWidth, densityHeight);
    var g = surface.getContext('2d');
    if (!g) { return null; }
    var w = densityWidth, h = densityHeight;
    g.fillStyle = '#050505';
    g.fillRect(0, 0, w, h);
    var sky = g.createLinearGradient(0, 0, 0, h);
    addStopSafely(sky, 0, 'rgb(9,9,9)');
    addStopSafely(sky, 0.42, 'rgb(26,26,26)');
    addStopSafely(sky, 0.68, 'rgb(44,44,44)');
    addStopSafely(sky, 1, 'rgb(30,30,30)');

    g.fillStyle = 'rgb(252,252,252)';
    g.beginPath();
    g.moveTo(doorCenterX - doorHalf, doorBase);
    g.lineTo(doorCenterX - doorHalf, doorSpringY);
    g.arc(doorCenterX, doorSpringY, doorHalf, Math.PI, Math.PI * 2, false);
    g.lineTo(doorCenterX + doorHalf, doorBase);

    g.lineTo(0.16 * w, 0.875 * h);
    g.lineTo(0.24 * w, h);

    g.lineTo(0.84 * w, 0.87 * h);
    g.lineTo(0.76 * w, h);

  function buildPlateDots(surfaceWidth, surfaceHeight) {
    var field = buildPlateDensity(surfaceWidth, surfaceHeight);
    var dots = [];
    if (!field) { return dots; }
    var pixels = null;
    try { pixels = field.surface.getContext('2d').getImageData(0, 0, field.width, field.height); }
    catch (error) { reportError('density-read', error); }
    if (!pixels) { return dots; }
    var data = pixels.data;
    var random = makeRandom(SEED_BASE + 131);
    var step = clampNumber(Math.sqrt(surfaceWidth * surfaceHeight) / 360, 2.1, 3.6);
    var cols = Math.min(780, Math.ceil(surfaceWidth / step));
    var rows = Math.min(780, Math.ceil(surfaceHeight / step));
    var baseRadius = clampNumber(surfaceWidth / 1100, 0.55, 1.35);
    var i, j, x, y, dx, dy, probability;
    var maxDots = 260000;
    for (j = 0; j < rows && dots.length < maxDots; j += 1) {
      for (i = 0; i < cols && dots.length < maxDots; i += 1) {
        x = (i + random()) * step;
        y = (j + random()) * step;
        dx = Math.min(field.width - 1, Math.floor((x / surfaceWidth) * field.width));
        dy = Math.min(field.height - 1, Math.floor((y / surfaceHeight) * field.height));
        probability = data[(dy * field.width + dx) * 4] / 255;
        if (random() * 1.04 < probability) {
          var radius = baseRadius * (0.55 + random() * 0.95);
          var alpha = 0.42 + random() * 0.5;
          dots.push(x, y, radius, alpha);
        }
      }
    }
    var stars = 64;
    for (i = 0; i < stars; i += 1) {
      var starX = random() * surfaceWidth;
      var starY = random() * surfaceHeight * 0.45;
      dots.push(starX, starY, 0.5 + random() * 1.1, 0.28 + random() * 0.45);
    }
    var pathSteps = 110;
    for (i = 0; i < pathSteps; i += 1) {
      var p = i / pathSteps;
      var roadX = surfaceWidth * (0.5 + 0.085 * Math.sin(p * 3.4 + 0.6) * (1 - p) + 0.04 * Math.sin(p * 9.1) * (1 - p));
      var roadY = surfaceHeight * (0.80 + p * 0.2);
      dots.push(roadX + (random() - 0.5) * step * 2.4, roadY, baseRadius * (0.7 + random() * 0.7), 0.55 + random() * 0.4);
      if (random() > 0.55) {
        dots.push(roadX - surfaceWidth * 0.035 + (random() - 0.5) * 6, roadY, baseRadius * 0.8, 0.4);
        dots.push(roadX + surfaceWidth * 0.035 + (random() - 0.5) * 6, roadY, baseRadius * 0.8, 0.4);
      }
    }
    return dots;
  }

  function bakePlateFog(surfaceWidth, surfaceHeight) {
    var fogWidth = Math.max(32, Math.round(surfaceWidth * 0.55));
    var fogHeight = Math.max(24, Math.round(surfaceHeight * 0.55));
    var surface = makeSurface(fogWidth, fogHeight);
    var g = surface.getContext('2d');
    if (!g) { return null; }
    var random = makeRandom(SEED_BASE + 33);
    for (var i = 0; i < 30; i += 1) {
      var cx = random() * fogWidth;
      var cy = (0.5 + random() * 0.4) * fogHeight;
      var rx = fogWidth * (0.1 + random() * 0.26);
      var ry = fogHeight * (0.012 + random() * 0.045);
      g.save();
      g.translate(cx, cy);
      g.scale(1, ry / rx);
      var blob = g.createRadialGradient(0, 0, 0, 0, 0, rx);
      addStopSafely(blob, 0, 'rgba(240,231,210,0.16)');
      addStopSafely(blob, 0.65, 'rgba(240,231,210,0.07)');
      addStopSafely(blob, 1, 'rgba(240,231,210,0)');
      g.fillStyle = blob;
      g.beginPath();
      g.arc(0, 0, rx, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
    return surface;
  }

  function preparePlate() {
    var layout = page.layout;
    if (!layout || !(layout.plateWidth > 8) || !(layout.plateImageHeight > 8)) { return; }
    var scale = clampNumber(state.dpr, 1, 1.5);
    var surfaceWidth = Math.min(1500, Math.round(layout.plateWidth * scale));
    var surfaceHeight = Math.min(1100, Math.round(layout.plateImageHeight * scale));
    if (!(surfaceWidth > 0) || !(surfaceHeight > 0)) { return; }
    var surface = makeSurface(surfaceWidth, surfaceHeight);
    if (!surface.getContext('2d')) { return; }
    plate.surface = surface;
    plate.dots = buildPlateDots(surfaceWidth, surfaceHeight);
    plate.dotsPainted = 0;
    plate.finished = false;
    plate.fog = null;
    plate.surfaceWidth = surfaceWidth;
    plate.surfaceHeight = surfaceHeight;
    plate.dirty = false;
  }

    state.live.bpm = clampNumber(payload.bpm, 0, 300);
    state.live.level = clampNumber(payload.level, 0, 1);
    state.live.bass = clampNumber(payload.bass, 0, 1);
    state.live.mid = clampNumber(payload.mid, 0, 1);
    state.live.treble = clampNumber(payload.treble, 0, 1);
    if (typeof payload.playing === 'boolean') { state.playing = payload.playing; }
  }

  window.addEventListener('message', function (event) {
    var data = event && event.data;
    if (!data || data.__c100 !== 1) { return; }
    try {
      if (data.type === 'init') { handleInit(data.payload); }
      else if (data.type === 'tick') { handleTick(data.payload); }
      else if (data.type === 'beat') { handleBeat(data.payload); }
      else if (data.type === 'live') { handleLive(data.payload); }
    } catch (error) { reportError('message', error); }
  });

  function pickIndex() {
    var lines = state.lines, time = state.time, idx = -1;
    for (var i = 0; i < lines.length; i += 1) {
      if (lines[i].t <= time + 0.02) { idx = i; } else { break; }
    }
    return idx;
  }

  function frame(now) {
    var clock = (window.performance && performance.now) ? performance.now() : Date.now();
    try {
      state.frames += 1;
      if (!state.readySent) { sendReady(); }
      if (state.frames % 20 === 0) {
        var cssWidth = Math.round(canvas.clientWidth || 0);
        var cssHeight = Math.round(canvas.clientHeight || 0);
        if (cssWidth > 0 && cssHeight > 0 && (cssWidth !== state.W || cssHeight !== state.H)) { applySize(); }
      }
      state.idx = pickIndex();
      state.text = state.idx >= 0 && state.idx < state.lines.length ? state.lines[state.idx].text : '';
      if (state.frames > 1) {
        var decay = state.reduced ? 0.82 : 0.9;
        var ambientGlow = state.reduced ? 0.11 : 0.1 + 0.045 * Math.sin(state.time * 0.9);
        if (!state.playing) { ambientGlow *= 0.55; }
        plate.glow = Math.max(plate.glow * decay, ambientGlow + state.live.bass * 0.45 + state.live.level * 0.1);
        if (!page.layout) { applySize(); }
        ensureSurfaces();
        drawDesk();
        drawPageSurface();
        drawRules();
        drawMarginNotes();
        drawHeader();
        drawPlate(now);
        updateAndDrawEmbers();
        drawSeal();
        drawLyrics(now);
        drawFooter();
      }
      if (!state.readySent) { sendReady(); }
    } catch (error) {
      reportError('frame', error);
    }
    var done = (window.performance && performance.now) ? performance.now() : Date.now();
    state.jsMs = Math.max(0, done - clock);
    requestAnimationFrame(frame);
  }

  try { applySize(); } catch (error) { reportError('boot', error); }
  window.addEventListener('resize', function () {
    try { applySize(); } catch (error) { reportError('resize', error); }
  });
  readyTimer = setTimeout(sendReady, 900);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
