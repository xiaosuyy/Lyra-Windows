<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>352 · Cyber Ballroom</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  canvas#c{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha: false });
var W = 1440, H = 900, DPR = 1;

var ACC = [206, 224, 255];
var LINES = [], IDX = -1, CUR = '';
var T = 0, LAST_TICK = 0, PLAYING = true;
var FRAMES = 0, JSMS = 0, ERR = '';
var REDUCED = false;

function num(v, d) { v = +v; return isFinite(v) ? v : d; }
function cl(v, a, b) { return v < a ? a : (v > b ? b : v); }
function by(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
function rgb3(c) {
  var r = (c && c.length >= 3) ? c : [0, 0, 0];
  return Math.round(cl(+r[0] || 0, 0, 255)) + ',' + Math.round(cl(+r[1] || 0, 0, 255)) + ',' + Math.round(cl(+r[2] || 0, 0, 255));
}
function rgba(c, a) {
  var al = +a;
  if (!isFinite(al)) al = 1;
  return 'rgba(' + rgb3(c) + ',' + cl(al, 0, 1) + ')';
}
function gstop(g, o, c) {
  try {
    var off = +o;
    if (!isFinite(off)) off = 0;
    g.addColorStop(cl(off, 0, 1), c);
  } catch (e) {}
}

var readySent = false;
function ready() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {}
}

var L = {};
function layout() {
  W = cv.clientWidth || window.innerWidth || 1440;
  H = cv.clientHeight || window.innerHeight || 900;
  if (!(W > 0)) W = 1440;
  if (!(H > 0)) H = 900;
  DPR = cl(window.devicePixelRatio || 1, 1, (W * H > 820000 ? 1.5 : 2));
  var cw = Math.round(W * DPR), chh = Math.round(H * DPR);
  if (cv.width !== cw || cv.height !== chh) { cv.width = cw; cv.height = chh; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var port = H > W * 1.05;
  L.port = port;
  L.floorY = H * (port ? 0.66 : 0.68);
  L.vpX = W * 0.5;
  L.vpY = L.floorY;
  L.groundY = H * (port ? 0.79 : 0.815);
  L.monS = cl(Math.min(H * 0.0072, W * 0.0078), 1.9, 7.0);
  L.monX = W * (port ? 0.50 : 0.545);
  L.ballX = W * (port ? 0.74 : 0.775);
  L.ballY = H * (port ? 0.155 : 0.185);
  L.ballR = cl(Math.min(W, H) * (port ? 0.105 : 0.082), 26, 132);
  L.lyrY = H * 0.905;
  L.lyrMax = W * (port ? 0.88 : 0.78);

  L.vign = ctx.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.18, W * 0.5, H * 0.46, Math.max(W, H) * 0.78);
  gstop(L.vign, 0, 'rgba(0,0,0,0)');
  gstop(L.vign, 0.55, 'rgba(0,0,0,0.35)');
  gstop(L.vign, 1, 'rgba(0,0,0,0.94)');

  L.halo = ctx.createRadialGradient(L.monX, H * 0.34, 0, L.monX, H * 0.34, Math.max(W, H) * 0.55);
  gstop(L.halo, 0, rgba(ACC, 0.16));
  gstop(L.halo, 0.45, 'rgba(24,32,54,0.14)');
  gstop(L.halo, 1, 'rgba(0,0,0,0)');

  L.floorG = ctx.createLinearGradient(0, L.floorY, 0, H);
  gstop(L.floorG, 0, 'rgba(9,12,20,0.0)');
  gstop(L.floorG, 0.22, 'rgba(7,9,16,0.85)');
  gstop(L.floorG, 1, 'rgba(2,3,6,1)');
}

/* ---------- procedural tiles ---------- */
var TILE_DAMASK = null, TILE_GRAIN = null;

function buildDamask() {
  var s = 224;
  var c = document.createElement('canvas');
  c.width = s; c.height = s;
  var x = c.getContext('2d');
  if (!x) return null;
  var m = s / 2;
  x.strokeStyle = 'rgba(198,214,240,0.5)';
  x.fillStyle = 'rgba(198,214,240,0.34)';
  x.lineWidth = 1.5;
  x.beginPath();
  x.moveTo(m, s * 0.08);
  x.bezierCurveTo(m + s * 0.19, s * 0.20, m + s * 0.19, s * 0.40, m, s * 0.50);
  x.bezierCurveTo(m - s * 0.19, s * 0.40, m - s * 0.19, s * 0.20, m, s * 0.08);
  x.fill();
  for (var k = -1; k <= 1; k += 2) {
    x.beginPath();
    x.moveTo(m, s * 0.50);
    x.bezierCurveTo(m + k * s * 0.25, s * 0.57, m + k * s * 0.31, s * 0.73, m + k * s * 0.10, s * 0.85);
    x.bezierCurveTo(m + k * s * 0.02, s * 0.91, m, s * 0.88, m, s * 0.79);
    x.stroke();
    x.beginPath(); x.arc(m + k * s * 0.34, s * 0.48, 2.1, 0, 6.2832); x.fill();
    x.beginPath(); x.arc(m + k * s * 0.10, s * 0.18, 1.7, 0, 6.2832); x.fill();
    x.beginPath();
    x.moveTo(m + k * s * 0.36, s * 0.62);
    x.bezierCurveTo(m + k * s * 0.46, s * 0.68, m + k * s * 0.44, s * 0.80, m + k * s * 0.33, s * 0.84);
    x.stroke();
  }
  return c;
}

function buildGrain() {
  var s = 128;
  var c = document.createElement('canvas');
  c.width = s; c.height = s;
  var x = c.getContext('2d');
  if (!x) return null;
  var img = x.createImageData(s, s);
  var d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var v = 110 + Math.random() * 145;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = Math.random() * 46;
  }
  try { x.putImageData(img, 0, 0); } catch (e) { return null; }
  return c;
}

var PAT_DAMASK = null, PAT_GRAIN = null;
function buildPatterns() {
  if (!TILE_DAMASK) TILE_DAMASK = buildDamask();
  if (!TILE_GRAIN) TILE_GRAIN = buildGrain();
  try { if (TILE_DAMASK) PAT_DAMASK = ctx.createPattern(TILE_DAMASK, 'repeat'); } catch (e) { PAT_DAMASK = null; }
  try { if (TILE_GRAIN) PAT_GRAIN = ctx.createPattern(TILE_GRAIN, 'repeat'); } catch (e) { PAT_GRAIN = null; }
}

/* ---------- scene state ---------- */
var PULSE = 0, BASS = 0, MID = 0, TREB = 0, SPIN = 0, TT = 0, LASTFR = 0, HIT = 0, GROOVE = 0;
var HAS_INIT = false;
var BEAMS = [], CAUST = [], SEED = 20260352;
function rnd() { SEED = (SEED * 1664525 + 1013904223) % 4294967296; return SEED / 4294967296; }

function buildScene() {
  SEED = 20260352;
  BEAMS.length = 0;
  var n = 7;
  for (var i = 0; i < n; i++) {
    var u = i / (n - 1);
    BEAMS.push({ a: (-0.75 + 1.5 * u), w: 0.05 + rnd() * 0.06, ph: rnd() * 6.28, sp: 0.25 + rnd() * 0.5 });
  }
  CAUST.length = 0;
  for (var k = 0; k < 46; k++) {
    var t = rnd();
    CAUST.push({
      x: L.vpX + (rnd() - 0.5) * 2 * W * 0.46,
      y: L.floorY + (L.groundY - L.floorY) * (0.05 + t * 1.02) + rnd() * H * 0.05,
      r: 1 + rnd() * 2.6, ph: rnd() * 6.28, sp: 1.4 + rnd() * 2.4, c: rnd() < 0.45 ? 1 : 0
    });
  }
}

function relayout() { layout(); buildPatterns(); buildScene(); BG_CACHE = buildBgCache(); LYR_D = true; }

/* ---------- background ---------- */
var BG_CACHE = null;
function buildBgCache() {
  try {
    var c = document.createElement('canvas');
    var bw = Math.max(2, Math.round(W)), bh = Math.max(2, Math.round(H));
    c.width = bw; c.height = bh;
    var x = c.getContext('2d');
    if (!x) return null;
    x.fillStyle = '#000';
    x.fillRect(0, 0, bw, bh);
    x.fillStyle = L.halo;
    x.fillRect(0, 0, bw, bh);
    if (PAT_DAMASK) {
      x.save();
      x.globalAlpha = 0.09;
      x.fillStyle = PAT_DAMASK;
      x.fillRect(0, 0, bw, L.floorY);
      x.restore();
      var g = x.createLinearGradient(0, 0, 0, L.floorY);
      g.addColorStop(0, 'rgba(0,0,0,0.62)');
      g.addColorStop(0.55, 'rgba(0,0,0,0.15)');
      g.addColorStop(1, 'rgba(0,0,0,0.9)');
      x.fillStyle = g;
      x.fillRect(0, 0, bw, L.floorY);
    }
    return c;
  } catch (e) { return null; }
}

function drawVoid() {
  if (BG_CACHE) {
    ctx.drawImage(BG_CACHE, 0, 0, W, H);
    return;
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = L.halo;
  ctx.fillRect(0, 0, W, H);
  if (PAT_DAMASK) {
    ctx.save();
    ctx.globalAlpha = 0.09;
    ctx.fillStyle = PAT_DAMASK;
    ctx.fillRect(0, 0, W, L.floorY);
    ctx.restore();
    var g2 = ctx.createLinearGradient(0, 0, 0, L.floorY);
    gstop(g2, 0, 'rgba(0,0,0,0.62)');
    gstop(g2, 0.55, 'rgba(0,0,0,0.15)');
    gstop(g2, 1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, L.floorY);
  }
}

function drawFrame() {
  var cx = L.monX, cy = H * 0.44;
  var rx = Math.min(W * 0.315, H * 0.47), ry = Math.min(H * 0.40, W * 0.55);
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(212,180,124,0.20)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
  ctx.stroke();
  ctx.strokeStyle = rgba(ACC, 0.13);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx - 7, ry - 7, 0, 0, 6.2832);
  ctx.stroke();
  for (var i = 0; i < 56; i++) {
    var a = i / 56 * 6.2832;
    var px = cx + Math.cos(a) * (rx + 1.5), py = cy + Math.sin(a) * (ry + 1.5);
    var r = 2.4 + 1.1 * Math.sin(a * 4 + TT * 0.6);
    var gold = i % 4 === 0;
    ctx.fillStyle = (gold ? 'rgba(220,188,132,' : 'rgba(212,224,244,') + (0.05 + 0.06 * (0.5 + 0.5 * Math.sin(a * 3 - TT * 0.5))) + ')';
    ctx.beginPath();
    ctx.arc(px, py, r, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function drawBeams() {
  var ax = L.ballX, ay = L.ballY;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < BEAMS.length; i++) {
    var b = BEAMS[i];
    var sway = Math.sin(TT * b.sp + b.ph) * 0.10 + Math.sin(TT * 0.13 + i) * 0.05;
    var ang = b.a + sway;
    var spread = b.w * (0.55 + BASS * 0.9 + PULSE * 0.25);
    var ex = ax + Math.sin(ang) * H * 1.15;
    var ey = ay + Math.cos(ang) * H * 1.15;
    var wig = H * 0.16;
    var g = ctx.createLinearGradient(ax, ay, ex, ey);
    gstop(g, 0, rgba(ACC, 0.16 + PULSE * 0.10));
    gstop(g, 0.55, rgba(ACC, 0.05));
    gstop(g, 1, rgba(ACC, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ex - Math.cos(ang) * wig * spread, ey + Math.sin(ang) * wig * spread);
    ctx.lineTo(ex + Math.cos(ang) * wig * spread, ey - Math.sin(ang) * wig * spread);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawMedallion() {
  var cx = L.monX, cy = L.floorY + (H - L.floorY) * 0.52;
  var rx = Math.min(W * 0.46, H * 0.62), ry = rx * 0.30;
  ctx.save();
  var rings = [1.0, 0.80, 0.62, 0.44, 0.24, 0.10];
  for (var i = 0; i < rings.length; i++) {
    var q = rings[i];
    var al = i === 0 ? 0.15 : (i === 1 ? 0.10 : 0.065);
    ctx.strokeStyle = i === 0 ? 'rgba(214,182,126,0.15)' : 'rgba(196,214,238,' + al + ')';
    ctx.lineWidth = i === 0 ? 1.6 : 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx * q, ry * q, 0, 0, 6.2832);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(196,214,238,0.055)';
  ctx.lineWidth = 1;
  for (var s = 0; s < 36; s++) {
    var a = s / 36 * 6.2832 + SPIN * 0.05;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * rx * 0.44, cy + Math.sin(a) * ry * 0.44);
    ctx.lineTo(cx + Math.cos(a) * rx * 0.995, cy + Math.sin(a) * ry * 0.995);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(ACC, 0.05 + PULSE * 0.05);
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx * 0.10, ry * 0.10, 0, 0, 6.2832);
  ctx.fill();
  for (var b = 0; b < 36; b++) {
    var ba = b / 36 * 6.2832 - SPIN * 0.05;
    var tw = 0.35 + 0.65 * Math.abs(Math.sin(TT * 0.8 + b * 0.7));
    ctx.fillStyle = 'rgba(226,238,252,' + (0.05 + tw * 0.10) + ')';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(ba) * rx * 0.80, cy + Math.sin(ba) * ry * 0.80, 1.5, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function drawFloor() {
  ctx.fillStyle = L.floorG;
  ctx.fillRect(0, L.floorY - 1, W, H - L.floorY + 1);

  ctx.save();
  ctx.lineWidth = 1;
  var n = 9;
  for (var i = -n; i <= n; i++) {
    var u = i / n;
    ctx.strokeStyle = 'rgba(150,176,220,' + (0.035 + 0.03 * Math.abs(u)) + ')';
    ctx.beginPath();
    ctx.moveTo(L.vpX + u * W * 0.045, L.floorY);
    ctx.lineTo(L.vpX + u * W * 0.62, H);
    ctx.stroke();
  }
  for (var k = 1; k <= 7; k++) {
    var q = k / 7;
    var y = L.floorY + (H - L.floorY) * Math.pow(q, 1.85);
    ctx.strokeStyle = 'rgba(150,176,220,' + (0.05 * (1 - q) + 0.012) + ')';
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();

  drawMedallion();

  var hz = ctx.createLinearGradient(0, L.floorY - H * 0.045, 0, L.floorY + H * 0.01);
  gstop(hz, 0, rgba(ACC, 0));
  gstop(hz, 0.72, rgba(ACC, 0.16 + PULSE * 0.10));
  gstop(hz, 1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(0, L.floorY - H * 0.045, W, H * 0.055);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var pool = ctx.createRadialGradient(L.monX, L.groundY, 0, L.monX, L.groundY, Math.min(W, H) * (0.30 + PULSE * 0.05 + BASS * 0.10));
  gstop(pool, 0, rgba(ACC, 0.18));
  gstop(pool, 0.5, rgba(ACC, 0.05));
  gstop(pool, 1, rgba(ACC, 0));
  ctx.fillStyle = pool;
  ctx.save();
  ctx.translate(L.monX, L.groundY);
  ctx.scale(1.9, 0.55);
  ctx.translate(-L.monX, -L.groundY);
  ctx.fillRect(L.monX - Math.min(W, H) * 0.6, L.groundY - Math.min(W, H) * 0.6, Math.min(W, H) * 1.2, Math.min(W, H) * 1.2);
  ctx.restore();

  for (var c = 0; c < CAUST.length; c++) {
    var d = CAUST[c];
    var tw = 0.4 + 0.6 * Math.abs(Math.sin(TT * d.sp + d.ph));
    var al = (0.05 + 0.30 * tw) * (0.5 + 0.9 * TREB + PULSE * 0.5);
    ctx.fillStyle = d.c ? 'rgba(255,255,255,' + al.toFixed(3) + ')' : rgba(ACC, al.toFixed(3));
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r * 2.2, d.r * 0.85, 0, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();

  var fg = ctx.createLinearGradient(0, H * 0.86, 0, H);
  gstop(fg, 0, 'rgba(0,0,0,0)');
  gstop(fg, 1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, H * 0.86, W, H * 0.14);
}

/* ---------- 3D disco ball ---------- */
var LAT = 10, LON = 18;
function drawBall() {
  var cx = L.ballX, cy = L.ballY, R = L.ballR;
  var spin = SPIN * 0.55;
  var nyaw = Math.cos(spin), syaw = Math.sin(spin);
  var tilt = 0.40 + Math.sin(TT * 0.11) * 0.05;
  var ct = Math.cos(tilt), st = Math.sin(tilt);

  function proj(x, y, z) {
    var x1 = x * nyaw + z * syaw;
    var z1 = -x * syaw + z * nyaw;
    var y2 = y * ct - z1 * st;
    var z2 = y * st + z1 * ct;
    var k = 1 / (1.62 - z2 * 0.62);
    return [cx + x1 * R * k * 1.6, cy + y2 * R * k * 1.6, z2];
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var bloom = ctx.createRadialGradient(cx, cy, R * 0.3, cx, cy, R * (2.6 + PULSE * 0.7));
  gstop(bloom, 0, rgba(ACC, 0.16 + PULSE * 0.14));
  gstop(bloom, 0.45, rgba(ACC, 0.05));
  gstop(bloom, 1, rgba(ACC, 0));
  ctx.fillStyle = bloom;
  ctx.fillRect(cx - R * 4, cy - R * 4, R * 8, R * 8);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(170,186,208,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, cy - R * 0.96);
  ctx.stroke();
  ctx.fillStyle = 'rgba(190,204,224,0.5)';
  ctx.fillRect(cx - R * 0.05, cy - R * 1.06, R * 0.10, R * 0.10);
  ctx.restore();

  var pi = Math.PI;
  var LX = -0.42, LY = -0.62, LZ = 0.66;
  for (var a = 0; a < LAT; a++) {
    var pa0 = pi * a / LAT, pa1 = pi * (a + 1) / LAT;
    for (var b = 0; b < LON; b++) {
      var t0 = 2 * pi * b / LON, t1 = 2 * pi * (b + 1) / LON;
      var cmx = Math.sin((pa0 + pa1) / 2) * Math.cos((t0 + t1) / 2);
      var cmy = Math.cos((pa0 + pa1) / 2);
      var cmz = Math.sin((pa0 + pa1) / 2) * Math.sin((t0 + t1) / 2);
      var q1 = proj(cmx, cmy, cmz);
      if (q1[2] <= 0.05) continue;
      var A = proj(Math.sin(pa0) * Math.cos(t0), Math.cos(pa0), Math.sin(pa0) * Math.sin(t0));
      var B = proj(Math.sin(pa0) * Math.cos(t1), Math.cos(pa0), Math.sin(pa0) * Math.sin(t1));
      var C = proj(Math.sin(pa1) * Math.cos(t1), Math.cos(pa1), Math.sin(pa1) * Math.sin(t1));
      var D = proj(Math.sin(pa1) * Math.cos(t0), Math.cos(pa1), Math.sin(pa1) * Math.sin(t0));

      var nx = cmx * nyaw + cmz * syaw;
      var nz1 = -cmx * syaw + cmz * nyaw;
      var ny2 = cmy * ct - nz1 * st;
      var nz2 = cmy * st + nz1 * ct;

      var diff = Math.max(0, nx * LX + ny2 * LY + nz2 * LZ);
      var spec = Math.pow(diff, 18);
      var fres = Math.pow(1 - nz2, 2.4);
      var chk = ((a + b) & 1) ? 1 : 0.62;
      var base = (58 + diff * 132) * chk;
      var rr = Math.round(cl(base + fres * 40 + spec * 120, 0, 255));
      var gg = Math.round(cl(base + fres * 46 + spec * 120 + ACC[1] * 0.04, 0, 255));
      var bb = Math.round(cl(base + fres * 62 + spec * 130 + ACC[2] * 0.05, 0, 255));
      ctx.fillStyle = 'rgb(' + rr + ',' + gg + ',' + bb + ')';
      ctx.beginPath();
      ctx.moveTo(A[0], A[1]);
      ctx.lineTo(B[0], B[1]);
      ctx.lineTo(C[0], C[1]);
      ctx.lineTo(D[0], D[1]);
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var rg = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.45, 0, cx - R * 0.2, cy - R * 0.3, R * 1.1);
  gstop(rg, 0, 'rgba(255,255,255,' + (0.20 + PULSE * 0.12).toFixed(3) + ')');
  gstop(rg, 1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.02, 0, 6.2832);
  ctx.fill();
  for (var s = 0; s < 7; s++) {
    var an = s / 7 * 6.2832 + TT * 0.12;
    var len = R * (2.2 + (s % 3) * 1.1) * (0.7 + TREB * 0.7 + PULSE * 0.4);
    var gr = ctx.createLinearGradient(cx, cy, cx + Math.cos(an) * len, cy + Math.sin(an) * len);

/* ---------- monument geometry ---------- */
function crPath(pts, closed) {
  var n = pts.length, p = new Path2D();
  if (n < 2) return p;
  function g(i) { return pts[((i % n) + n) % n]; }
  p.moveTo(pts[0][0], pts[0][1]);
  var lim = closed ? n : n - 1;
  for (var i = 0; i < lim; i++) {
    var p0 = closed ? g(i - 1) : (i > 0 ? pts[i - 1] : pts[i]);
    var p1 = closed ? g(i) : pts[i];
    var p2 = closed ? g(i + 1) : pts[i + 1];
    var p3 = closed ? g(i + 2) : (i + 2 < n ? pts[i + 2] : pts[n - 1]);
    p.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
      p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6,
      p2[0], p2[1]
    );
  }
  if (closed) p.closePath();
  return p;
}

var TAU = 6.283185307179586;

/* tapered limb: polyline + start/end width -> closed outline added to Path2D */
function limbPath(p, pts, w0, w1) {
  var n = pts.length, i, L = [], R = [];
  for (i = 0; i < n; i++) {
    var a = pts[i - 1] || pts[i];
    var b = pts[i + 1] || pts[i];
    var tx = b[0] - a[0], ty = b[1] - a[1];
    var tl = Math.sqrt(tx * tx + ty * ty) || 1;
    tx /= tl; ty /= tl;
    var hw = (w0 + (w1 - w0) * (n > 1 ? i / (n - 1) : 0)) / 2;
    L.push([pts[i][0] - ty * hw, pts[i][1] + tx * hw]);
    R.push([pts[i][0] + ty * hw, pts[i][1] - tx * hw]);
  }
  p.addPath(crPath(L.concat(R.reverse()), true));
}

var SONG = { n: '', a: '' };
var LYR = { line: null, fs: 0, rows: [], tot: 0, w: 0, bits: [] };
var LYR_D = true;
var LYI = 'italic ';

function fontOf(fs) {
  return LYI + '600 ' + fs + 'px Georgia, "Times New Roman", "Songti SC", "SimSun", serif';
}

function tokenize(t) {
  var out = [], i = 0, n = t.length, re = /[A-Za-z0-9'\u00C0-\u024F\-]/;
  while (i < n) {
    var c = t.charAt(i);
    if (re.test(c)) {
      var j = i;
      while (j < n && re.test(t.charAt(j))) j++;
      out.push(t.slice(i, j));
      i = j;
    } else if (c === ' ') {
      out.push(' ');
      i++;
    } else {
      out.push(c);
      i++;
    }
  }
  return out;
}

function wrapRows(text, font, maxW) {
  ctx.font = font;
  var toks = tokenize(text);
  var rows = [], cur = [], curW = 0, i;
  for (i = 0; i < toks.length; i++) {
    var tk = toks[i];
    if (tk === ' ' && !cur.length) continue;
    var wid = ctx.measureText(tk).width;
    if (curW + wid > maxW && cur.length) {
      rows.push(cur.join(''));
      cur = [];
      curW = 0;
      if (tk === ' ') continue;
    }
    cur.push(tk);
    curW += wid;
  }
  if (cur.length) rows.push(cur.join(''));
  if (!rows.length) rows.push('');
  return rows;
}

function buildLyric() {
  var line = (IDX >= 0 && LINES[IDX]) ? LINES[IDX] : null;
  LYR.line = line;
  LYR.rows = [];
  LYR.tot = 0;
  LYR.w = 0;
  if (!line) return;

  var maxW = L.lyrMax;
  LYI = /[\u3400-\u9FFF\uF900-\uFAFF]/.test(line.text) ? '' : 'italic ';
  var fs = Math.round(cl(Math.min(W * 0.056, H * 0.080), 16, 66));
  var maxRows = L.port ? 3 : 2;
  var rows = [], font = '', a;
  for (a = 0; a < 7; a++) {
    font = fontOf(fs);
    rows = wrapRows(line.text, font, maxW);
    if (rows.length <= maxRows || fs <= 14 || a === 6) break;
    fs = Math.max(14, Math.round(fs * 0.88));
  }
  if (rows.length > maxRows + 2) rows = rows.slice(0, maxRows + 2);
  var CAP = L.port ? 4 : 3;
  if (rows.length > CAP) {
    rows = rows.slice(0, CAP);
    var lastR = rows[CAP - 1];
    rows[CAP - 1] = (lastR.length > 1 ? lastR.slice(0, lastR.length - 1) : lastR) + '…';
  }
  ctx.font = font;

  var txt = line.text, n = txt.length;
  var ts = new Array(n), i;
  var ch = line.chars;
  if (ch && ch.length >= 2) {
    var m = ch.length;
    for (i = 0; i < n; i++) {
      var idx = (m === n) ? i : Math.round(i * (m - 1) / Math.max(1, n - 1));
      var ct = +((ch[idx] && ch[idx].t));

    for (i = 0; i < n; i++) ts[i] = line.t + line.dur * (i / Math.max(1, n));
  }

  LYR.fs = fs;
  LYR.rows = [];
  var p = 0;
  for (var r = 0; r < rows.length; r++) {
    var rt = rows[r];

    p += rt.length;

    ctx.fillStyle = '#9fb2cc';
    var rt = '';
    for (k = 0; k < chs.length; k++) rt += chs[k].c;
    ctx.fillText(rt, x0, y);
    ctx.restore();

    if (r === nr - 1) { glowX = x0; glowW = row.w; glowY = y; }

    var grd = ctx.createLinearGradient(x0, y - fs * 0.85, x0 + row.w, y + fs * 0.12);
    gstop(grd, 0, '#ffffff');
    gstop(grd, 0.34, '#e9f2ff');
    gstop(grd, 0.56, 'rgb(' + Math.round(cl(ACC[0] * 0.55 + 140, 0, 255)) + ',' + Math.round(cl(ACC[1] * 0.55 + 150, 0, 255)) + ',' + Math.round(cl(ACC[2] * 0.55 + 160, 0, 255)) + ')');
    gstop(grd, 0.78, '#f4f9ff');
    gstop(grd, 1, '#c6d6ea');

    ctx.fillStyle = grd;
    for (k = 0; k < chs.length; k++) {
      if (row.start + k < bc) ctx.fillText(chs[k].c, x0 + chs[k].x, y);
    }
  }

  if (glowW > 0 && bc > 0) {
    var lastRow = rows[nr - 1];
    var pre = lastRow.txt.slice(0, cl(bc - lastRow.start, 0, lastRow.txt.length));
    if (pre) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = rgba(ACC, 0.9);
      ctx.shadowBlur = fs * 0.42;
      ctx.fillStyle = rgba(ACC, 0.30);
      ctx.fillText(pre, glowX, glowY);
      ctx.restore();
    }
  }
  ctx.restore();

  var rw = Math.min(glowW, W * 0.9);
  if (rw > 0) {
    ctx.save();
    var lgd = ctx.createLinearGradient(W / 2 - rw / 2, 0, W / 2 + rw / 2, 0);
    gstop(lgd, 0, rgba(ACC, 0));
    gstop(lgd, 0.5, rgba(ACC, 0.42));
    gstop(lgd, 1, rgba(ACC, 0));
    ctx.fillStyle = lgd;
    ctx.fillRect(W / 2 - rw / 2, glowY + fs * 0.30, rw, 1.2);
    ctx.restore();
  }

  var nx = LINES[IDX + 1];
  if (nx && nx.text) {
    var s2 = Math.max(10, fs * 0.26);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = LYI + '400 ' + Math.round(s2) + 'px Georgia, "Times New Roman", "Songti SC", "SimSun", serif';
    var nt = nx.text;
    var lim = Math.min(W * 0.78, W - 40);
    while (nt.length > 2 && ctx.measureText(nt + '…').width > lim) nt = nt.slice(0, -1);
    if (nt !== nx.text) nt += '…';
    ctx.fillStyle = 'rgba(176,192,214,0.26)';
    ctx.fillText(nt, W / 2, Math.min(H - 9, baseY + fs * 0.92));
    ctx.restore();
  }
}

function setLines(raw) {
  var out = [];
  if (Object.prototype.toString.call(raw) === '[object Array]') {
    for (var i = 0; i < raw.length; i++) {
      var o = raw[i] || {};
      var txt = (o.text === null || o.text === undefined) ? '' : String(o.text);
      if (!txt) continue;
      var ch = null;
      if (Object.prototype.toString.call(o.chars) === '[object Array]' && o.chars.length) ch = o.chars;
      out.push({ t: num(o.t, 0), dur: Math.max(0.2, num(o.dur, 3)), text: txt, chars: ch });
    }
  }
  out.sort(function (a, b) { return a.t - b.t; });
  LINES = out;
  IDX = -1;
  CUR = '';
  LYR_D = true;
}

function onInit(p) {
  p = p || {};
  var a = p.accent;
  try {
    if (Object.prototype.toString.call(a) === '[object Array]' && a.length >= 3) {
      var r = +a[0], g = +a[1], b = +a[2];
      if (isFinite(r) && isFinite(g) && isFinite(b)) ACC = [cl(Math.round(r), 0, 255), cl(Math.round(g), 0, 255), cl(Math.round(b), 0, 255)];
    }
  } catch (e1) { ERR = 'accent: ' + String((e1 && e1.message) || e1); }

  try {
    var so = p.song || {};
    SONG.n = so.name ? String(so.name) : '';
    var ar = so.artists;
    if (Object.prototype.toString.call(ar) === '[object Array]') {
      var tmp = [];
      for (var q = 0; q < ar.length; q++) if (ar[q]) tmp.push(String(ar[q]));
      SONG.a = tmp.join(' / ');
    } else {
      SONG.a = ar ? String(ar) : '';
    }
  } catch (e2) { ERR = 'song: ' + String((e2 && e2.message) || e2); }

  try {
    setLines(p.lines);
    HAS_INIT = true;
  } catch (e3) {
    LINES = []; IDX = -1; CUR = ''; LYR_D = true; HAS_INIT = true;
    ERR = 'lines: ' + String((e3 && e3.message) || e3);
  }

  try {
    relayout();
  } catch (e4) { ERR = 'layout: ' + String((e4 && e4.message) || e4); }
}

function onTick(p) {
  p = p || {};
  T = num(p.time, T);
  LAST_TICK = T;
  if (typeof p.playing === 'boolean') PLAYING = p.playing;
  pickLine();
}

function pickLine() {
  var i = -1;
  for (var k = 0; k < LINES.length; k++) { if (LINES[k].t <= T + 0.02) i = k; else break; }
  if (i !== IDX) {
    IDX = i;
    CUR = i >= 0 ? LINES[i].text : '';
    LYR_D = true;
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawVoid();
  drawFrame();
  drawBall();
  drawBeams();
  drawFloor();
  drawMonument();
  drawLyrics();
  drawGrainAndVignette();
}

function drawGrainAndVignette() {
  if (PAT_GRAIN) {
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.translate((FRAMES * 3) % 256, (FRAMES * 5) % 256);
    ctx.fillStyle = PAT_GRAIN;
    ctx.fillRect(-240, -240, W + 480, H + 480);
    ctx.restore();
  }
  ctx.fillStyle = L.vign;
  ctx.fillRect(0, 0, W, H);
}

function frame() {
  requestAnimationFrame(frame);
  var now = (window.performance && performance.now) ? performance.now() : Date.now();
  var t0 = now;
  var dt = LASTFR ? Math.min(0.06, (now - LASTFR) / 1000) : 0.016;
  LASTFR = now;
  FRAMES++;

  TT += REDUCED ? dt * 0.35 : dt;
  SPIN += dt * (REDUCED ? 0.14 : (0.30 + BASS * 0.55 + PULSE * 0.22));
  PULSE *= Math.pow(0.02, dt);
  HIT *= Math.pow(0.001, dt);
  GROOVE += (BASS - GROOVE) * 0.12;
  if (PLAYING) T += dt;
  if (T < 0) T = 0;

  pickLine();
  ERR = '';
  if (LYR_D) {
    LYR_D = false;
    try { buildLyric(); } catch (e) { ERR = 'lyric: ' + String((e && e.message) || e); }
  }
  try { draw(); } catch (e) { ERR = 'draw: ' + String((e && e.message) || e); }

  JSMS = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
  ready();
}

function onBeat(p) {
  var lv = by(p.level, 0.7);
  PULSE = Math.max(PULSE, cl(lv, 0, 1));
  HIT = Math.min(1, HIT + 0.75);
}

function onLive(p) {
  BASS += (by(p.bass, 0) - BASS) * 0.35;
  MID += (by(p.mid, 0) - MID) * 0.35;
  TREB += (by(p.treble, 0) - TREB) * 0.35;
  if (typeof p.playing === 'boolean') PLAYING = p.playing;
}

window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  ERR = '';
  try {
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') onBeat(d.payload || {});
    else if (d.type === 'live') onLive(d.payload || {});
  } catch (e) { ERR = d.type + ': ' + String((e && e.message) || e); }
});

window.__stage = function () {
  return {
    lines: LINES.length, idx: IDX, t: T, playing: PLAYING == true,
    frames: FRAMES, js: JSMS, err: ERR, text: CUR, gl: false,
    rm: REDUCED == true
  };
};

try {
  REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
} catch (e) { REDUCED = false; }

layout();
buildPatterns();
buildScene();
buildMonument();
BG_CACHE = buildBgCache();
window.addEventListener('resize', function(){ relayout(); });
requestAnimationFrame(frame);
setTimeout(ready, 240);
})();
</script>
</body>
</html>
