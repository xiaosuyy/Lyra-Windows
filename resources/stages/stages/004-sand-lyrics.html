<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沙粒歌词</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(235,205,150,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   004 · 沙粒歌词 —— 把字堆出来，再让它塌掉
   有重力、有沉积，也有**出场动画**：一句唱完不是凭空消失，
   而是整堆失去支撑、沙粒飞散着淡出，下一句的沙同时从上方落下接上。
   ========================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ---- 沙粒 ---- */
const N = 11000;
const sx = new Float32Array(N), sy = new Float32Array(N);
const svx = new Float32Array(N), svy = new Float32Array(N);
const tx = new Float32Array(N), ty = new Float32Array(N);
/* 0 自由下落 / 1 有落点、正在落 / 2 已沉积 / 3 塌落淡出中 */
const st = new Uint8Array(N);
const sz = new Float32Array(N);
const fd = new Float32Array(N);        // 塌落淡出计时
/* 每一颗沙属于哪一句（gen）。塌落时只塌上一句的沙 ——
   不区分的话，新句的词刚放出去还在半空就被塌落扫掉，
   表现就是"每句最后一个词不显示"（它落下时正好撞上换句）。 */
const gn = new Uint16Array(N);
let gen = 0;
for (let i = 0; i < N; i++) {
  sx[i] = Math.random() * W; sy[i] = Math.random() * H;
  sz[i] = 2.6 + Math.random() * 1.0;
}

const GRAV = 1350;

/* ---- 字形采样 ---- */
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });
const FONT = (fs) => `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;

function measureTxt(text, fs) {
  octx.font = FONT(fs);
  return octx.measureText(text).width;
}

/* 采样一个**词团**，返回相对 (0,0)=左缘/垂直中线 的点对数组。
   字号由整行决定（见 layoutLine），这里绝不能各自缩放 ——
   否则同一行里每个团的字会大小不一。 */
function samplePts(text, fs) {
  const PAD = 6;
  const w = Math.ceil(measureTxt(text, fs)) + PAD * 2;
  const h = Math.ceil(fs * 1.38);
  off.width = w; off.height = h;
  octx.clearRect(0, 0, w, h);
  octx.font = FONT(fs);
  octx.textAlign = 'left'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(text, PAD, h / 2);
  const d = octx.getImageData(0, 0, w, h).data;
  const pts = [];
  // 步长必须 ≤ 颗粒直径，否则笔画是点阵不是实心
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      if (d[(y * w + x) * 4 + 3] > 128) pts.push(x - PAD, y - h / 2);
    }
  }
  return pts;
}

/* ============================================================================
   分词：决定"哪几个字一起落"
   · 词典 = public/segdict.bin —— 33 万个 2~4 字词的 32 位哈希（1.26 MB）。
     只做二分查找、不存词原文，所以内存就是这 1.26 MB。
   · 拿不到词典（例如直接 file:// 打开）自动退回"按标点 + 字数"硬切，形态不崩。
   ========================================================================== */
let DICT = null;
fetch('/segdict.bin')
  .then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); })
  .catch(() => {});

const fnv = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

function isWord(s, i, L) {
  const h = fnv(s.substr(i, L));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1, v = DICT[m];
    if (v === h) return true;
    if (v < h) lo = m + 1; else hi = m - 1;
  }
  return false;
}

/* 正/反向最大匹配，取词数少的那个 —— 只用正向会偏爱长词（"一个人" vs "一个/人"） */
function segWords(text) {
  const fwd = [];
  for (let i = 0; i < text.length;) {
    let hit = 0;
    for (let L = Math.min(4, text.length - i); L >= 2; L--) if (isWord(text, i, L)) { hit = L; break; }
    if (hit) { fwd.push(text.substr(i, hit)); i += hit; } else { fwd.push(text[i]); i++; }
  }
  const bwd = [];
  for (let j = text.length; j > 0;) {
    let hit = 0;
    for (let L = Math.min(4, j); L >= 2; L--) if (isWord(text, j - L, L)) { hit = L; break; }
    if (hit) { bwd.unshift(text.substr(j - hit, hit)); j -= hit; } else { bwd.unshift(text[j - 1]); j--; }
  }
  return fwd.length <= bwd.length ? fwd : bwd;
}

const MAXG = 3;      // 中文一团最多几个字。2~3 字落一次，节奏才不像机关枪

/* 标点表**不含**撇号、连字符、空格：
   "don't" / "well-known" 里的符号是词的一部分，当成标点会把词切碎、还会让撇号消失。 */
const PUNCT = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】"]/;
const SPACE = /\s/;

/* 这行是中文还是拉丁文？拉丁按"整词"成团，中文才按 2~3 字合并 */
function isLatin(text) {
  let la = 0, cjk = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++;
    else if (c >= '\u4e00' && c <= '\u9fff') cjk++;
  }
  return la > cjk;
}

/* 拉丁：一个词一团。词内标点原样保留，白空格不占位（本来就没笔画） */
function latinSpans(text) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    if (SPACE.test(text[i])) { i++; continue; }
    let j = i;
    while (j < text.length && !SPACE.test(text[j])) j++;
    out.push({ i0: i, i1: j });
    i = j;
  }
  return out;
}

/* 虚词的方向决定了"还健在"还是"目前还"：
   的/了/着/过 挂**前面**的词（磨平+了），但/还/就/才 留给**后面**的词（还+健在）。 */
const SUFFIX = /^[的了着过地得吗呢吧啊嘛]$/;
const PREFIX = /^[但还就才又也都把被在从向对和与而却很不没最更将已曾让给]$/;

function countChars(s) {
  let n = 0;
  for (let i = 0; i < s.length; i++) if (!PUNCT.test(s[i]) && !SPACE.test(s[i])) n++;
  return n;
}

/* 中文：词 → 团。贪心填到 MAXG 个汉字，标点并进本团并收尾（这样标点不会被吞掉） */
function groupByWords(text) {
  const words = segWords(text);
  const out = [];
  let cur = '', start = 0, chars = 0, pos = 0;
  const flush = (end) => { if (cur) { out.push({ i0: start, i1: end }); cur = ''; chars = 0; } };
  for (const w of words) {
    const at = pos;
    pos += w.length;
    const isP = PUNCT.test(w);
    if (!cur) { cur = w; start = at; chars = isP ? 0 : w.length; continue; }
    if (isP) { cur += w; if (chars >= 2) flush(pos); continue; }

    const single = w.length === 1;
    if (single && SUFFIX.test(w)) {                  // 的/了/着：跟前面的词一起走
      cur += w; chars++;
      if (chars >= MAXG) flush(pos);
      continue;
    }
    if (single && PREFIX.test(w) && chars >= 2) {     // 但/还/就：留给后面的词
      flush(at); cur = w; start = at; chars = 1;
      continue;
    }
    if (chars + w.length <= MAXG) { cur += w; chars += w.length; }
    else { flush(at); cur = w; start = at; chars = w.length; }
  }
  flush(text.length);
  /* 只有 1 个汉字的孤儿（"我""却"）并到邻居，别让它自己落一团 */
  for (let k = 0; k < out.length; k++) {
    const g = out[k];
    if (countChars(text.slice(g.i0, g.i1)) > 1) continue;
    const prev = out[k - 1], next = out[k + 1];
    if (prev && prev.i1 === g.i0 && countChars(text.slice(prev.i0, prev.i1)) < MAXG) { prev.i1 = g.i1; out.splice(k, 1); k--; }
    else if (next && next.i0 === g.i1 && countChars(text.slice(next.i0, next.i1)) < MAXG) { next.i0 = g.i0; out.splice(k, 1); k--; }
  }
  return out;
}

/* 没词典时的兜底：不管词，按标点收尾 + MAXG 个汉字硬切（标点同样保留） */
function groupByRule(text) {
  const out = [];
  let start = 0, chars = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const sep = PUNCT.test(c) || SPACE.test(c);
    if (!sep) chars++;
    if (sep && chars >= 2) { out.push({ i0: start, i1: i + 1 }); start = i + 1; chars = 0; continue; }
    if (!sep && chars > MAXG) { out.push({ i0: start, i1: i }); start = i; chars = 1; }
  }
  if (start < text.length) out.push({ i0: start, i1: text.length });
  return out;
}

/* 统一入口：拉丁按词、中文按分词 */
function spansForLine(text) {
  if (isLatin(text)) return latinSpans(text);
  return DICT ? groupByWords(text) : groupByRule(text);
}

let lines = [];
let active = -1;
let accent = [235, 205, 150];

let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ============================================================================
   布局 + 逐团派活
   原来是一整句 4600 颗沙一起落下；现在按"词团"落 —— 一句 3~5 次，
   每次落下 2~3 个字，落点正好压在它那个词的时间上。
   ========================================================================== */
const FALL_LEAD = 0.95;      // 提前多久开始落：粒子的飞行时间就定在这里，落点才压在词的时间上
const FLIGHT_MIN = 0.72;     // 最短飞行时间。沙从多高落由它反解，见 releaseGroup
const GRAINS_PER_LINE = 4600; // 一整句的沙粒预算，按各团的采样点数分摊

/* 换句时序（秒）—— 上一句必须先走干净，下一句才能落进来，否则两句叠在同一个
   字行上，看着就是"字糊成一团"，也就是"上一句和下一句重复了一小段时间"。
     · 换句发生在 endT - LEAD（LEAD = 1.1s，要提前把新句的采样算好）
     · SWITCH_HOLD 秒后旧句整堆塌落：旧句末团最晚 endT-0.9 落地，所以这里
       一定还留着 0.35s 让人看清最后那个词（不至于像以前那样刚落地就被扫掉）
     · 塌落开始后 CLEAR 秒，字带里就只剩往下淌的沙 —— 新句的沙在这之后才进字带 */
const SWITCH_HOLD = 0.68;
const CLEAR = 0.28;

let lineLay = null;
let collapsePending = false;   // 新句布局好了但还没塌旧的（等旧句站住再塌）
let collapseAt = 0;            // 旧句塌落的绝对时刻

/* 对照用：?seg=line 回到"整句一起落"，方便和逐团版比 */
let mode = new URLSearchParams(location.search).get('seg') === 'line' ? 'line' : 'group';

function layoutLine(line, endT, minLand) {
  const text = line.text || '';
  if (!text) return null;
  const F = 84;
  const maxW = Math.min(W * 0.66, 1180);
  let fs = F;
  const w0 = measureTxt(text, F);
  if (w0 > maxW) fs = F * (maxW / w0);

  const totalW = measureTxt(text, fs);
  const left = (W - totalW) / 2;
  const cy = H / 2;

  /* YRC 的 chars 是逐字绝对秒；只有和正文逐字对齐时才敢用 */
  const chars = line.chars && line.chars.length === text.length ? line.chars : null;

  const spans = mode === 'line'
    ? [{ i0: 0, i1: text.length }]
    : spansForLine(text);
  if (!spans.length) return null;

  /* 每个字的起点用**前缀宽度**量，不能让各团自己量 —— 会累积误差、整行越走越偏 */
  const xs = new Array(text.length + 1);
  for (let i = 0; i <= text.length; i++) xs[i] = left + measureTxt(text.substr(0, i), fs);

  const groups = [];
  let ptsTotal = 0;
  for (const s of spans) {
    const str = text.slice(s.i0, s.i1);
    if (!str) continue;
    const pts = samplePts(str, fs);
    if (!pts.length) continue;
    ptsTotal += pts.length / 2;
    let t;
    if (chars && chars[s.i0] && typeof chars[s.i0].t === 'number') t = chars[s.i0].t;
    else t = line.t + (line.dur || 4) * (s.i0 / Math.max(1, text.length));
    groups.push({ t, x: xs[s.i0], w: xs[s.i1] - xs[s.i0], str, pts, done: false });
  }
  if (!groups.length) return null;
  /* 时间必须单调，否则 seek 回来会出现"后面的团先落" */
  for (let k = 1; k < groups.length; k++) if (groups[k].t < groups[k - 1].t) groups[k].t = groups[k - 1].t;

  /* 最后一团不能拖到换句之后才落 —— 那正是"每句最后一个词不显示"的根因。
     给它留出"落下来 + 站住一会儿"的时间：最多提前到 endT - 0.9 秒落地。
     落完站到换句后 SWITCH_HOLD（≈ endT - 0.42）才塌，末团还看得见近半秒。 */
  const tMax = endT - 0.9;
  if (tMax > line.t) {
    for (const g of groups) if (g.t > tMax) g.t = tMax;
    for (let k = 1; k < groups.length; k++) if (groups[k].t < groups[k - 1].t) groups[k].t = groups[k - 1].t;
  }
  /* 每团什么时候派活 = 它的时间 - 提前量。
     整句模式只有一团、体积大，落得更久，前置量给足才不显晚。 */
  const lead = mode === 'line' ? 1.65 : FALL_LEAD;
  for (const g of groups) g.rel = g.t - lead;
  /* 换句时整句一起往后顺延：旧句塌出字带（minLand）之前，一颗沙也不许落进来，
     否则新字就在旧字上长出来 —— 那就是两个字叠成一个字行。
     必须整句平移，只推头一团的话后面的词会追上来、节奏就乱了。 */
  if (minLand > 0) {
    const push = Math.min(0.4, minLand - FLIGHT_MIN - groups[0].rel);
    if (push > 0) for (const g of groups) g.rel += push;
  }
  return { cy, groups, ptsTotal, next: 0 };
}

/** 派一团：挑离这一团最近的自由沙，搬到它上方等着落 */
function releaseGroup(lay, g) {
  const pc = g.pts.length / 2;
  if (!pc) { g.done = true; return; }
  /* 每团分多少颗沙：按采样点数分摊整句预算，但不能超过"每个采样点 0.78 颗"——
     颗粒直径 2.6~3.6px、采样步长 2px，超过 1 颗/点就糊成实心字，不是沙了。
     拉丁字母笔画细、点少，纯按比例分会立刻过饱和；中文行本身就在 0.8 附近，几乎不受影响。 */
  const K = Math.max(70, Math.min(
    GRAINS_PER_LINE,
    Math.round(GRAINS_PER_LINE * pc / Math.max(1, lay.ptsTotal)),
    Math.round(pc * 0.78),
  ));
  const gx = g.x + g.w / 2, gy = lay.cy;

  /* 只征用自由沙（st===0）：已沉积的是正在显示的字，塌落中的是上一句。
     抢它们就会出现"只有离落点远的那部分才落"的怪象。 */
  const free = [];
  for (let i = 0; i < N; i++) if (st[i] === 0) free.push(i);
  if (!free.length) { g.done = true; return; }
  const d2 = (i) => { const dx = sx[i] - gx, dy = sy[i] - gy; return dx * dx + dy * dy; };
  free.sort((a, b) => d2(a) - d2(b));

  const n = Math.min(K, free.length);
  for (let k = 0; k < n; k++) {
    const i = free[k];
    const p = (Math.floor(k * pc / n) % pc) * 2;
    tx[i] = g.x + g.pts[p] + (Math.random() - 0.5) * 1.6;
    ty[i] = lay.cy + g.pts[p + 1] + (Math.random() - 0.5) * 1.6;
    sx[i] = tx[i] + (Math.random() - 0.5) * 20;
    svx[i] = (Math.random() - 0.5) * 26;
    svy[i] = 110 + Math.random() * 140;
    /* 出生高度由**飞行时间**反解，不是随便撒一个高度 ——
       以前只给 ty - 110~530，最浅的那批 0.4 秒就落进去了，
       于是整句在"词的时间"之前大半秒就落完，还正好压在上一句还亮着的字上。
       现在每颗沙的飞行时间都落在 [FLIGHT_MIN, FALL_LEAD]，
       到点起落 = 到点落地，新句的沙最早也要 FALL_LEAD 之后才进字带。 */
    const f = FLIGHT_MIN + Math.random() * (FALL_LEAD - FLIGHT_MIN);
    sy[i] = ty[i] - (svy[i] * f + 675 * f * f);   // 675 = GRAV/2
    st[i] = 1;
    gn[i] = gen;                 // 标记属于哪一句，塌落时按这个区分
  }
  g.done = true;
}

/** 塌落：不是凭空消失，是整堆飞散着淡出。
    只塌**上一句**的沙（gn !== gen）—— 新句的词可能还在半空，不能跟着一起被扫掉。 */
function collapse() {
  for (let i = 0; i < N; i++) {
    if (st[i] !== 2 && st[i] !== 1) continue;
    if (gn[i] === gen) continue;
    st[i] = 3;
    fd[i] = 0;
    /* 沙堆失去支撑：**主要是往下垮**，横向只有很小的散开。
       原来横向用的是"从屏幕中心指向外"的径向分量（(sx-W/2)/l * s），
       于是左边的往左飞、右边的往右飞 —— 看着像爆炸，不像塌方。
       现在横向只剩一点点随机抖动，重力负责把整堆拉下去。 */
    svx[i] = (Math.random() - 0.5) * 55;
    svy[i] = 20 + Math.random() * 80;
  }
}

const hint = document.getElementById('hint');
let last = performance.now();
let t0 = 0;
let lastT = -1;

function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();

  /* ================= 节奏 =================
     换句只提前 LEAD 秒：够把新句的布局算好（采样 + 量字宽），
     又不至于把上一句最后那几个词掐掉。
     沙粒按每个词团自己的时间点、提前 FALL_LEAD 秒开始落。 */
  const LEAD = 1.1;
  if (lines.length) {
    if (T < lastT - 0.6) {
      active = -1; lineLay = null; collapsePending = false; collapseAt = 0; gen++;
      for (let i = 0; i < N; i++) if (st[i] !== 3) st[i] = 0;
    }
    lastT = T;
    let idx = -1;
    for (let i = 0; i < lines.length; i++) if (lines[i].t - LEAD <= T) idx = i; else break;
    if (active >= 0 && idx < active) idx = active;
    if (idx !== active) {
      /* 上一句还没放完的团先全放出去（要在 gen++ **之前**，这样它们仍算旧句的沙）。
         短句、seek 都会走到这里 —— 绝不能丢字。 */
      let forced = false;
      if (lineLay) {
        while (lineLay.next < lineLay.groups.length) {
          releaseGroup(lineLay, lineLay.groups[lineLay.next]);
          lineLay.next++;
          forced = true;
        }
      }
      const had = active >= 0;
      active = idx;
      gen++;
      const cur = idx >= 0 ? lines[idx] : null;
      const endT = cur
        ? (idx + 1 < lines.length ? lines[idx + 1].t : cur.t + (cur.dur || 4))
        : 0;
      /* 旧句什么时候塌：换句后再站 SWITCH_HOLD 秒。换句在 endT-1.1，
         于是塌落在 endT-0.42，而旧句末团最晚 endT-0.9 落地 —— 还看得见近半秒。 */
      if (had) {
        collapseAt = T + SWITCH_HOLD;
        /* 强行补放的沙要 0.9 秒才落地，别让它们还在半空时就把旧句扫掉 */
        if (forced) collapseAt = Math.max(collapseAt, T + 0.9);
      }
      /* 新句第一团最早什么时候可以落进字带：旧句塌落 + 让字带空出来的时间 */
      const minLand = had ? collapseAt + CLEAR + 0.06 : 0;
      lineLay = cur ? layoutLine(cur, endT, minLand) : null;
      collapsePending = had && !!lineLay;
      if (had && !lineLay) collapse();        // 新句是空行，直接塌
    }
    /* 旧句的塌落：此时它早已落定、也站够了，塌下来正好给新句让出字带。
       以前是挨到新句 line.t - 0.15 才塌，新句的沙早就在字行里落了一半，
       两个字行的字叠在一起 = 用户说的"跟上一句重复了一小段时间"。 */
    if (collapsePending && active >= 0 && T >= collapseAt) {
      collapse();
      collapsePending = false;
    }
    /* 逐团放下：到自己的派活时刻才落（rel 已经算好，含换句时的等待）。
       一团没放出（或者 seek 跳过了一整段）时，这里会连续补上，不会漏字。 */
    if (lineLay) {
      while (lineLay.next < lineLay.groups.length &&
             T >= lineLay.groups[lineLay.next].rel) {
        releaseGroup(lineLay, lineLay.groups[lineLay.next]);
        lineLay.next++;
      }
    }
    hint.style.opacity = lines.length ? (active >= 0 ? '0' : '1') : '0.5';
  }

  /* ---- 物理 ---- */
  for (let i = 0; i < N; i++) {
    if (st[i] === 2) continue;               // 已沉积
    if (st[i] === 3) {
      // 塌落淡出：0.75 秒内飞散并淡掉，然后归为自由沙
      fd[i] += dt;
      svy[i] += GRAV * 1.15 * dt;   // 塌落时重力给足，才像垮下去
      sx[i] += svx[i] * dt; sy[i] += svy[i] * dt;
      if (fd[i] > 0.95) st[i] = 0;
      continue;
    }
    svy[i] += GRAV * dt;
    svx[i] *= 0.995;
    sx[i] += svx[i] * dt; sy[i] += svy[i] * dt;

    if (st[i] === 1 && sy[i] >= ty[i]) {
      /* 沉积：x 也必须拉回目标点。
         出生时为了"撒开"给过 ±15px 横向偏移，只对齐 y 的话字会被横向抹平 ——
         纵向还是整齐的行，看着就是横向条纹。 */
      sy[i] = ty[i];
      sx[i] = tx[i] + (Math.random() - 0.5) * 0.8;
      st[i] = 2;
      svx[i] = 0; svy[i] = 0;
    }
    if (sy[i] > H + 40) {
      if (st[i] === 0) { sx[i] = Math.random() * W; sy[i] = -30 - Math.random() * 240; svy[i] = 60; }
      else { sy[i] = ty[i]; sx[i] = tx[i]; st[i] = 2; }
    }
  }

  /* ---- 绘制：按状态合批，逐粒改 fillStyle 是 4400 次状态切换 ---- */
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const [ar, ag, ab] = accent;

  ctx.fillStyle = `rgba(${ar},${ag},${ab},0.09)`;                 // 自由沙
  for (let i = 0; i < N; i++) {
    if (st[i] !== 0) continue;
    ctx.fillRect(sx[i] - sz[i] / 2, sy[i] - sz[i] / 2, sz[i], sz[i]);
  }
  ctx.fillStyle = `rgba(${Math.min(255, ar + 22)},${Math.min(255, ag + 18)},${Math.min(255, ab + 10)},0.68)`;  // 下落中
  for (let i = 0; i < N; i++) {
    if (st[i] !== 1) continue;
    ctx.fillRect(sx[i] - sz[i] / 2, sy[i] - sz[i] / 2, sz[i], sz[i]);
  }
  ctx.fillStyle = `rgba(${Math.min(255, ar + 18)},${Math.min(255, ag + 16)},${Math.min(255, ab + 12)},1)`;   // 已沉积：全不透明，字才跳得出来
  for (let i = 0; i < N; i++) {
    if (st[i] !== 2) continue;
    ctx.fillRect(sx[i] - sz[i] / 2, sy[i] - sz[i] / 2, sz[i], sz[i]);
  }
  // 塌落中：随 fd 淡出（分 4 档，避免逐粒改 fillStyle）
  // 塌落中：前 0.25 秒保持全亮（让人看清"整堆垮下来"），之后 0.7 秒淡出
  for (let b = 0; b < 5; b++) {
    const al = b === 0 ? 0.9 : 0.9 * (1 - b / 5);
    ctx.fillStyle = `rgba(${ar},${ag},${ab},${al.toFixed(2)})`;
    for (let i = 0; i < N; i++) {
      if (st[i] !== 3) continue;
      const t = Math.max(0, Math.min(1, (fd[i] - 0.25) / 0.7));
      if (Math.min(4, (t * 5) | 0) !== b) continue;
      ctx.fillRect(sx[i] - sz[i] / 2, sy[i] - sz[i] / 2, sz[i], sz[i]);
    }
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);


/* 空格暂停/播放。焦点在 iframe 里时父页面收不到键盘事件，
   所以要主动转发过去（和 F5 是同一个道理）。 */
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    active = -1; lastT = -1; lineLay = null; collapsePending = false; collapseAt = 0;
    gen = 0; gn.fill(0);
    for (let i = 0; i < N; i++) { st[i] = 0; fd[i] = 0; }
    if (p.accent) {
      const [r, g, b] = p.accent;
      accent = [Math.round((r + 235 * 1.6) / 2.6), Math.round((g + 205 * 1.6) / 2.6), Math.round((b + 150 * 1.6) / 2.6)];
    }
    clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    const k = 70 * (0.5 + (d.payload.level || 0));
    for (let i = 0; i < N; i++) if (st[i] === 0 || st[i] === 1) svx[i] += (Math.random() - 0.5) * k;
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
window.__stage = () => {
  let a = 0, b = 0, c = 0;
  for (let i = 0; i < N; i++) { if (st[i] === 2) a++; else if (st[i] === 1) b++; else if (st[i] === 3) c++; }
  return {
    lines: lines.length, active,
    mode, dict: !!DICT,
    groups: lineLay ? lineLay.groups.length : 0,
    released: lineLay ? lineLay.next : 0,
    pending: lineLay ? lineLay.groups.length - lineLay.next : 0,
    gtext: lineLay ? lineLay.groups.map((g) => g.str + '@' + g.t.toFixed(2)) : null,
    settled: a, falling: b, collapsing: c, t: +now().toFixed(2),
  };
};

/* 对照用：切"整句一起落 / 逐团落"。会重排当前句，只适合截图对比时手动调。 */
window.__004 = {
  mode: () => mode,
  set(m) {
    mode = m;
    if (active < 0 || !lines[active]) return;
    const endT = active + 1 < lines.length ? lines[active + 1].t : lines[active].t + (lines[active].dur || 4);
    lineLay = layoutLine(lines[active], endT);
  },
};
</script>
</body>
</html>
