<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>划痕</title>
<!--
  机制：一整块钢板上全是同一个方向磨出来的细密划痕。只有字那几笔，磨痕被转开了将近 60°。
        灯压得极低、贴着板面慢慢扫 —— 划痕是各向异性的：光横过沟纹时才把光反进眼睛。
        方位一转到字那块的角度，整片字就「现」出来，别的部位还是哑的。
  用了：WebGL2 实例化（10 万颗磨屑/悬浮铁粉/板面亮点）＋ 真三维相机 ＋ 背景着色器全分辨率画字。
        背景对每像素做 **射线→z=0 板面求交**，取世界坐标采样字形纹理的三个通道：
        R = 字那一块（磨痕转了角度），G = 笔画边沿崩出来的毛刺，B = 转角那一圈软边；
        划痕场按「顺着沟纹 / 横过沟纹」两个频率取样，方向角由 R 通道在世界里逐像素插值。
  镜头：贴着板面推 —— 14° 从左边斜着推近（磨痕压成一片密线）／24° 挪到右边再推近，
        灯从字上扫过去／35° 退开，整排字连着板面躺在灯底下。
-->
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
       background:radial-gradient(128% 96% at 50% 46%,rgba(0,0,0,0) 28%,rgba(0,0,0,.76) 100%)}
  #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);pointer-events:none;z-index:3;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(178,232,236,.30);transition:opacity .8s;white-space:nowrap}
  #type{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0}
  html.fb #c{display:none}
  html.fb #type{opacity:1;display:flex;align-items:center;justify-content:center}
  html.fb #type .in{font-weight:900;font-size:clamp(30px,6vh,80px);letter-spacing:.10em;
       color:#d8fbf8;text-align:center;text-shadow:0 0 40px rgba(120,240,255,.45)}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="type"><div class="in"></div></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   270 · 划痕 —— 钢板 · 全板一个方向的磨痕，只有字转了角度 · 贴着板面推
   ══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const typeBox = document.getElementById('type');
const typeIn = typeBox.querySelector('.in');
const hint = document.getElementById('hint');
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';

const N = 100000;
let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, beatN = 0, bass = 0, treb = 0;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false;
let inAmt = 0, act = 0, uCut = 0.35, uProgG = 0;

const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;

let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) { RM = !!mq.matches; const onMQ = (e) => { RM = !!e.matches; }; if (mq.addEventListener) mq.addEventListener('change', onMQ); else if (mq.addListener) mq.addListener(onMQ); }
} catch (_) {}

/* ══════════════════════════ 字形纹理（fillText → GPU，不回读） ══════════════════════════ */
const gcv = document.createElement('canvas');
const gctx = gcv.getContext('2d');
const GT = { w: 0, h: 0, box: [-0.7, -0.1, 1.4, 0.35], chars: [], ready: false };
const RAMP_N = 64;
const ramp = new Uint8Array(RAMP_N * 4);
const BOX_W = 1.40;

function bakeText(text) {
  const t = (text || '').trim();
  if (!t) { GT.ready = false; return; }
  const fsPx = 190;
  const font = '900 ' + fsPx + 'px ' + FAMILY;
  gctx.font = font;
  const mt = gctx.measureText(t);
  const pad = Math.round(fsPx * 0.34);
  const w = Math.max(32, Math.ceil(mt.width + pad * 6));
  const h = Math.max(32, Math.ceil(fsPx * 2.45));
  gcv.width = w; gcv.height = h;
  gctx.font = font;
  gctx.textBaseline = 'middle';
  gctx.textAlign = 'left';
  gctx.fillStyle = '#000';
  gctx.fillRect(0, 0, w, h);
  /* 三个通道各管一件事，全用 lighter 往上叠，互不覆盖：
     R = 字那一块 —— 这几笔的磨痕被转开了将近 60°，灯扫到那个方位就整片亮起来。
     G = 字边崩出来的毛刺、几道刻得更深的痕（细亮点，扎在轮廓上）。
     B = 转角的那一圈：划痕方向是慢慢拐过去的，边界不齐也不锐。 */
  gctx.globalCompositeOperation = 'lighter';
  gctx.globalAlpha = 1;
  gctx.filter = 'none';
  gctx.lineJoin = 'round';
  gctx.lineCap = 'round';
  const by = Math.round(h * 0.30);
  const x0 = pad;
  const inkBot = by + Math.min(fsPx * 0.47, (mt.actualBoundingBoxDescent || fsPx * 0.44));

  /* 1) 转角带：字外那一窄圈，划痕的方向在这儿慢慢拐过去 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.105) + 'px)';
  gctx.strokeStyle = 'rgba(0,0,255,0.30)';
  gctx.lineWidth = fsPx * 0.36;
  gctx.strokeText(t, x0, by);

  /* 2) 字：实心一块，边略软 —— 这一块里的磨痕全部转了角度，是整块板上唯一会反光的方位 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.013) + 'px)';
  gctx.fillStyle = 'rgba(255,0,0,0.92)';
  gctx.fillText(t, x0, by);
  gctx.strokeStyle = 'rgba(255,0,0,0.60)';
  gctx.lineWidth = fsPx * 0.055;
  gctx.strokeText(t, x0, by);

  /* 3) 毛刺：磨痕在笔画边沿崩出来的碎口，一道一道短的，方向随机 */
  const nT = Math.max(24, Math.round(mt.width / (fsPx * 0.058)));
  let sd2 = 2166136261;
  for (let k = 0; k < t.length; k++) sd2 = ((sd2 ^ t.charCodeAt(k)) * 16777619) >>> 0;
  const rnd2 = () => { sd2 = (sd2 * 1103515245 + 12345) >>> 0; return sd2 / 4294967296; };
  gctx.filter = 'blur(' + Math.round(fsPx * 0.008) + 'px)';
  for (let i = 0; i < nT; i++) {
    const px = x0 + (0.01 + 0.98 * rnd2()) * mt.width;
    const py = by + (rnd2() - 0.5) * fsPx * 0.96;
    const a = 0.6 + 0.9 * rnd2();
    const ln = fsPx * (0.012 + 0.040 * rnd2());
    gctx.strokeStyle = 'rgba(0,255,0,' + (0.20 + 0.46 * rnd2()).toFixed(2) + ')';
    gctx.lineWidth = fsPx * (0.004 + 0.007 * rnd2());
    gctx.beginPath();
    gctx.moveTo(px, py);
    gctx.lineTo(px + Math.cos(a) * ln, py + Math.sin(a) * ln);
    gctx.stroke();
  }
  /* 几道刻得比周围深的痕：光斜到那个角度才跳出来 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.006) + 'px)';
  for (let i = 0; i < 9; i++) {
    const px = x0 + (0.03 + 0.94 * rnd2()) * mt.width;
    const py = inkBot - fsPx * (0.08 + 0.54 * rnd2());
    const ln = fsPx * (0.03 + 0.10 * rnd2());
    const a = 1.115 + (rnd2() - 0.5) * 0.30;
    gctx.strokeStyle = 'rgba(0,255,0,' + (0.30 + 0.34 * rnd2()).toFixed(2) + ')';
    gctx.lineWidth = fsPx * (0.005 + 0.008 * rnd2());
    gctx.beginPath();
    gctx.moveTo(px, py);
    gctx.lineTo(px + Math.cos(a) * ln, py + Math.sin(a) * ln);
    gctx.stroke();
  }
  gctx.filter = 'none';
  gctx.globalCompositeOperation = 'source-over';

  const arr = Array.from(t);
  const chars = [];
  let acc = 0;
  for (const ch of arr) {
    const cw = gctx.measureText(ch).width;
    chars.push({ c: ch, x0: (pad + acc) / w, x1: (pad + acc + cw) / w });
    acc += cw;
  }
  GT.chars = chars;
  GT.w = w; GT.h = h;
  const boxH = BOX_W * (h / w);
  GT.box = [-BOX_W / 2, -boxH / 2, BOX_W, boxH];
  GT.ready = true;
  if (glOk) uploadGlyph();
}

function uploadGlyph() {
  gl.bindTexture(gl.TEXTURE_2D, glyphTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gcv);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

let charProg = [];
function buildRamp() {
  if (!GT.chars.length) { ramp.fill(0); if (glOk) pushRamp(); return; }
  for (let i = 0; i < RAMP_N; i++) {
    const u = (i + 0.5) / RAMP_N;
    let v = 0;
    for (let k = 0; k < GT.chars.length; k++) {
      const c = GT.chars[k];
      if (u >= c.x0 - 0.004 && u <= c.x1 + 0.004) { v = charProg[k] || 0; break; }
      if (u < c.x0) { v = charProg[k] || 0; break; }
    }
    const b = Math.round(clamp01(v) * 255);
    ramp[i * 4] = b; ramp[i * 4 + 1] = b; ramp[i * 4 + 2] = b; ramp[i * 4 + 3] = 255;
  }
  pushRamp();
}
function pushRamp() {
  if (!glOk) return;
  gl.bindTexture(gl.TEXTURE_2D, rampTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RAMP_N, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, ramp);
}

/* ══════════════════════════ 线性代数 ══════════════════════════ */
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function cameraBasis(eye, at, roll) {
  let fx = at[0] - eye[0], fy = at[1] - eye[1], fz = at[2] - eye[2];
  let fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, ry = 0, rz = fx;
  let rl = Math.hypot(rx, ry, rz) || 1;
  if (rl < 1e-4) { rx = 1; ry = 0; rz = 0; rl = 1; }
  rx /= rl; ry /= rl; rz /= rl;
  let ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
  const c = Math.cos(roll), s = Math.sin(roll);
  const RX = rx * c + ux * s, RY = ry * c + uy * s, RZ = rz * c + uz * s;
  const UX = ux * c - rx * s, UY = uy * c - ry * s, UZ = uz * c - rz * s;
  const dt = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const view = new Float32Array([
    RX, UX, -fx, 0,
    RY, UY, -fy, 0,
    RZ, UZ, -fz, 0,
    -dt([RX, RY, RZ], eye), -dt([UX, UY, UZ], eye), dt([fx, fy, fz], eye), 1
  ]);
  return { view, right: [RX, RY, RZ], up: [UX, UY, UZ], fwd: [fx, fy, fz] };
}

/* ══════════════════════════ GLSL ══════════════════════════ */
const BG_VS = `#version 300 es
in vec2 aQ; out vec2 vUV;
void main(){ vUV = aQ; gl_Position = vec4(aQ * 2.0 - 1.0, 0.0, 1.0); }`;

/* 背景：一块冷轧钢板，全板一个方向的细密磨痕。每像素一条射线打到 z=0 的板面上，
   用世界坐标采样字形纹理的三个通道 —— 字就是磨痕被转开了角度的那一块：
   R 决定这一点的划痕方向（0 → 板面的角度，1 → 转过 60° 的角度），G 是边沿毛刺，B 是转角软边。
   光压得极低，方位随时间转；各向异性的反光只认「光横过沟纹」的那个方位，所以灯一扫字就现。 */
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform vec3 uEye, uRight, uUp, uFwd;
uniform float uTan, uAsp, uT, uBass, uAct, uCut;
uniform sampler2D uGlyph, uRamp;
uniform vec4 uBox;

float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = h21(i), b = h21(i + vec2(1.0, 0.0)), c = h21(i + vec2(0.0, 1.0)), d = h21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

/* 灯：一把带罩的冷白工作灯，从左后压得极低，贴着板面扫过来 —— 色带亮起来就是它扫过 */
const vec3 LG = vec3(-0.72, 0.48, 0.50);

vec4 gtex(vec2 w){
  vec2 uv = (w - uBox.xy) / uBox.zw;
  if (uv.x < -0.06 || uv.x > 1.06 || uv.y < -0.06 || uv.y > 1.06) return vec4(0.0);
  return texture(uGlyph, uv);
}

/* 轧制纹：轧辊沿一个方向压出来的细纹，钢板上最藏不住的痕迹 */
float mill(vec2 w){
  return 0.58 * vnoise(vec2(w.x * 2.4, w.y * 210.0))
       + 0.42 * vnoise(vec2(w.x * 6.8, w.y * 560.0));
}
/* 砂轮蹭过去的那几道长划痕 */
float scratch(vec2 w){
  float a = vnoise(vec2(w.x * 1.15, w.y * 30.0));
  return smoothstep(0.845, 0.995, a);
}
float surf(vec2 w){
  return 0.0012 * vnoise(w * 4.4) + 0.00045 * vnoise(w * 18.0);
}

/* 回火色：冷钢 → 氧化灰 → 青铜 → 稻草黄 → 金白。
   紫那一段刻意压成不饱和的灰褐 —— 一屏里不许挤出四五种色相来。 */
vec3 temper(float q){
  vec3 c = vec3(0.340, 0.352, 0.380);
  c = mix(c, vec3(0.402, 0.372, 0.330), smoothstep(0.05, 0.28, q));
  c = mix(c, vec3(0.640, 0.436, 0.216), smoothstep(0.28, 0.47, q));
  c = mix(c, vec3(0.980, 0.706, 0.286), smoothstep(0.47, 0.68, q));
  c = mix(c, vec3(1.000, 0.930, 0.792), smoothstep(0.70, 0.94, q));
  return c;
}

void main(){
  vec2 nd = vUV * 2.0 - 1.0;
  vec3 dir = normalize(uRight * (nd.x * uTan * uAsp) + uUp * (nd.y * uTan) + uFwd);
  vec3 Vv = -dir;

  /* 车间暗处：一盏罩着的工作灯，只压着板面那一小块 */
  vec3 col = vec3(0.0120, 0.0130, 0.0155);
  col *= 0.60 + 0.55 * pow(max(0.0, 1.0 - length(nd * vec2(0.82, 1.0))), 2.4);

  if (dir.z < -0.004) {
    float t = -uEye.z / dir.z;
    if (t > 0.02 && t < 18.0) {
      vec2 w = uEye.xy + dir.xy * t;
      vec2 uv = (w - uBox.xy) / uBox.zw;
      vec4 g4 = gtex(w);
      float mk   = g4.r;    /* 字：这一块里的磨痕被转开了角度 */
      float burr = g4.g;    /* 笔画边沿崩出来的毛刺 */
      float halo = g4.b;    /* 转角那一圈，方向是慢慢拐过去的 */
      float rp   = texture(uRamp, vec2(clamp(uv.x, 0.0, 1.0), 0.5)).r;

      /* 划痕的方向：整块板一个角度，字那几笔被硬转开了将近 60° */
      float mkS = smoothstep(0.16, 0.80, mk);
      float ang = mix(0.050, 1.115, mkS);
      vec2 ca = vec2(cos(ang), sin(ang));
      vec2 cp = vec2(-ca.y, ca.x);
      float al = dot(w, ca);        /* 顺着划痕 */
      float pe = dot(w, cp);        /* 横过划痕 */

      /* 磨床走过去的一道道细纹：横向极密、顺着几乎不变 —— 全板一个方向，只有字那块转了。
         用带弯的锯齿做沟纹，每一道深浅不一：近看是平行的细线，不是一团噪声 */
      float wob = 0.62 * vnoise(vec2(al * 1.7, pe * 19.0)) + 0.16 * sin(al * 11.0 + pe * 3.0);
      float q1 = pe * 262.0 + wob * 3.4;
      float q2 = pe * 764.0 + wob * 7.1;
      float a1 = 0.42 + 0.58 * h21(vec2(floor(q1), 3.7));
      float a2 = 0.35 + 0.65 * h21(vec2(floor(q2), 9.1));
      float grooves = smoothstep(0.62, 0.97, fract(q1 + 0.31)) * a1 * 0.58
                    + smoothstep(0.70, 0.99, fract(q2 + 0.67)) * a2 * 0.42;
      float pit = smoothstep(0.90, 1.00, vnoise(w * 74.0));

      /* 灯：压得极低、几乎贴着板面，方位随时间的推移慢慢转 */
      float laz = 2.10 + uT * 0.44;
      float lel = 0.235 + 0.105 * sin(uT * 0.23 + 1.0);
      vec3 L = normalize(vec3(cos(laz) * 0.955, sin(laz) * 0.955, lel));
      vec2 lp = normalize(L.xy + vec2(1e-5, 1e-5));
      float an = abs(dot(lp, cp));      /* 光横过划痕，沟壁才把它反进眼睛 */
      float flash = 0.40 + 0.60 * pow(an, 2.4);

      /* 板：冷轧钢板，中等灰。轧制纹和砂眼都压得浅 —— 背景一花，就被审计算成墨了 */
      float mt = mill(w);
      vec3 alb = vec3(0.1600, 0.1700, 0.1950) * (0.90 + 0.21 * mt);
      alb *= 1.0 - 0.20 * pit;
      float ndl = clamp(L.z, 0.0, 1.0);
      vec3 c = alb * (1.18 + 2.42 * ndl);

      /* 字：磨痕转开的那一块把灯反成一片白 —— 灯扫到那个方位，字才真正现出来。
         白是沟脊上的白，沟底还是暗的：所以字里看得见一道道划痕的走向 */
      float blot = smoothstep(0.10, 0.86, mk) * flash * (0.60 + 0.40 * rp) * (0.86 + 0.14 * vnoise(w * 3.1));
      float ridge = 0.74 + 0.44 * grooves;
      c += vec3(1.260, 1.285, 1.330) * blot * ridge;
      c -= vec3(0.300, 0.320, 0.370) * blot * (1.0 - grooves) * 0.26;

      /* 划痕自己的反光：板面上一直有，方位不对的时候弱；字的方位对上了才亮 */
      float sheen = grooves * (0.052 + 0.150 * pow(an, 2.0));
      c += vec3(0.62, 0.66, 0.74) * sheen * (1.0 + 0.55 * mkS);

      /* 毛刺：笔画边沿上扎出来的那几点亮 */
      c += vec3(0.96, 0.94, 0.88) * burr * (0.28 + 0.72 * an) * 0.55;
      /* 转角那一圈是糊的：方向拐过去的地方，光散得开一点 */
      c += vec3(0.30, 0.33, 0.40) * halo * (0.18 + 0.40 * flash) * 0.36;
      /* 字根压暗一圈：光是进去容易出来难的，笔画像陷进板里 */
      c *= 1.0 - 0.50 * clamp(halo, 0.0, 1.0) * (1.0 - 0.62 * mk);

    idx = -1; lastT = -1e9; curText = '';
    vT = 0; uCut = 0.35; beatPulse = 0; bass = 0; treb = 0; beatN = 0;
    clockT = 0; clockAt = performance.now(); playing = true;
    inAmt = 0;
    GT.ready = false; GT.chars = []; charProg = [];
    hint.style.opacity = lines.length ? '0.9' : '0.4';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    dirty = true;
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    playing = !!d.payload.playing; dirty = true;
  } else if (d.type === 'beat') {
    beatPulse = Math.min(1, beatPulse + 0.32 + (d.payload.level || 0) * 0.5);
    beatN++; dirty = true;
  } else if (d.type === 'live') {
    const l = d.payload || {};
    if (typeof l.bass === 'number') bass = Math.max(bass, clamp01(l.bass));
    if (typeof l.treble === 'number') treb = Math.max(treb, clamp01(l.treble));
    if (typeof l.level === 'number') beatPulse = Math.max(beatPulse, Math.min(0.9, l.level * 0.8));
  }
});
addEventListener('pagehide', () => cancelAnimationFrame(raf));

/* ══════════════════════════ 自查 ══════════════════════════ */
window.__stage = () => ({
  lines: lines.length, idx: idx, t: +now().toFixed(2), playing: playing, frames: frames,
  js: +jsMs.toFixed(2), err: errMsg, text: (idx >= 0 && lines[idx]) ? lines[idx].text : '',
  gl: glOk, rm: RM, vT: +vT.toFixed(2),
  cut: +uCut.toFixed(3), prog: +uProgG.toFixed(3), lit: +uCut.toFixed(3), chars: GT.chars.length
});

/* ══════════════════════════ 启动 ══════════════════════════ */
resize();
try { initGL(); } catch (e) { errMsg = 'gl: ' + (e && e.message ? e.message : e); document.documentElement.classList.add('fb'); }
raf = requestAnimationFrame(frame);
</script>
