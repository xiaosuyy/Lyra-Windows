<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泡沫痕</title>
<!--
  机制：一池泡沫退下去。退到哪儿，哪儿就干出一圈一圈的水碱；字是最后还没干的那片水。
        泡沫被笔画挡住，全堵在字缘上，破了以后一圈圈干在那里 —— 字的边就是泡沫破掉的环。
        先有退水、有水碱、有破掉的泡，字只是它们的结果。
  用了：WebGL2 实例化（10 万枚泡沫/水汽/沫渣）＋ 真三维相机 ＋ 背景着色器全分辨率画字。
        背景对每像素做 **射线→z=0 台面求交**，取世界坐标采样字形纹理的三个通道：
        G = 还没干的那片水，R = 泡沫堵在字缘、破掉留下的环，B = 沫渣；
        法线由屏幕导数反解世界梯度得到，水膜映的那扇窗按 Fresnel 算 —— 视角越平越亮，
        所以镜头在台面上滑的时候，那片湿痕是一亮一灭的。
  镜头：贴着台面横着滑 —— 三个机位都在滑，只有左右和高度不同：
        16°（亮带刚扫到字上）／21°（亮带退开，只剩水边那圈亮边）／13°（一压低，整片又亮起来）。
-->
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
       background:radial-gradient(128% 96% at 50% 46%,rgba(0,0,0,0) 28%,rgba(0,0,0,.76) 100%)}
  #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);pointer-events:none;z-index:3;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(178,232,236,.30);transition:opacity .8s;white-space:nowrap}
  #type{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0}
  html.fb #c{display:none}
  html.fb #type{opacity:1;display:flex;align-items:center;justify-content:center}
  html.fb #type .in{font-weight:900;font-size:clamp(30px,6vh,80px);letter-spacing:.10em;
       color:#d8fbf8;text-align:center;text-shadow:0 0 40px rgba(120,240,255,.45)}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="type"><div class="in"></div></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   266 · 蜡泪 —— 蜡烛 · 蜡液顺斜面淌下来停在字上 · 贴坡低角度侧推
   ══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const typeBox = document.getElementById('type');
const typeIn = typeBox.querySelector('.in');
const hint = document.getElementById('hint');
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';

const N = 100000;
let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, beatN = 0, bass = 0, treb = 0;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false;
let inAmt = 0, act = 0, uCut = 0.35, uProgG = 0;

const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;

let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) { RM = !!mq.matches; const onMQ = (e) => { RM = !!e.matches; }; if (mq.addEventListener) mq.addEventListener('change', onMQ); else if (mq.addListener) mq.addListener(onMQ); }
} catch (_) {}

/* ══════════════════════════ 字形纹理（fillText → GPU，不回读） ══════════════════════════ */
const gcv = document.createElement('canvas');
const gctx = gcv.getContext('2d');
const GT = { w: 0, h: 0, box: [-0.7, -0.1, 1.4, 0.35], chars: [], ready: false };
const RAMP_N = 64;
const ramp = new Uint8Array(RAMP_N * 4);
const BOX_W = 1.40;

function bakeText(text) {
  const t = (text || '').trim();
  if (!t) { GT.ready = false; return; }
  const fsPx = 190;
  const font = '900 ' + fsPx + 'px ' + FAMILY;
  gctx.font = font;
  const mt = gctx.measureText(t);
  const pad = Math.round(fsPx * 0.34);
  const w = Math.max(32, Math.ceil(mt.width + pad * 6));
  const h = Math.max(32, Math.ceil(fsPx * 2.45));
  gcv.width = w; gcv.height = h;
  gctx.font = font;
  gctx.textBaseline = 'middle';
  gctx.textAlign = 'left';
  gctx.fillStyle = '#000';
  gctx.fillRect(0, 0, w, h);
  /* 三个通道各管一件事，全用 lighter 往上叠，互不覆盖：
     G = 最后还没干的那片水（亮 = 湿）—— 字就是这片水。
     R = 泡沫堵在字缘上、破掉以后留下的一圈圈干环。
     B = 边上没化开的沫渣。 */
  gctx.globalCompositeOperation = 'lighter';
  gctx.globalAlpha = 1;
  gctx.filter = 'none';
  gctx.lineJoin = 'round';
  gctx.lineCap = 'round';
  const by = Math.round(h * 0.30);
  const x0 = pad;
  const inkBot = by + Math.min(fsPx * 0.47, (mt.actualBoundingBoxDescent || fsPx * 0.44));

  /* 1) 那片水：就是字的轮廓，只是水边糊一点、水在字脚积得厚一点 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.012) + 'px)';
  gctx.fillStyle = 'rgba(0,255,0,0.52)';
  for (let k = 0; k < 3; k++) gctx.fillText(t, x0, by);
  /* 水都往低处走：字脚再积一层，薄薄糊开 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.022) + 'px)';
  gctx.strokeStyle = 'rgba(0,255,0,0.13)';
  gctx.lineWidth = fsPx * 0.060;
  gctx.strokeText(t, x0, by + fsPx * 0.034);

  /* 2) 泡沫：沫子被字挡住，全堵在轮廓上；破了以后只剩一圈干掉的环 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.030) + 'px)';
  gctx.strokeStyle = 'rgba(255,0,0,0.22)';
  gctx.lineWidth = fsPx * 0.34;
  gctx.strokeText(t, x0, by);
  gctx.strokeStyle = 'rgba(255,0,0,0.18)';
  gctx.lineWidth = fsPx * 0.16;
  gctx.strokeText(t, x0, by);

  /* 一个一个泡泡：大的小的散在字上、字边上，破到一半的就只剩半边弧 */
  const nB = Math.max(26, Math.round(mt.width / (fsPx * 0.030)));
  let sd2 = 2166136261;
  for (let k = 0; k < t.length; k++) sd2 = ((sd2 ^ t.charCodeAt(k)) * 16777619) >>> 0;
  const rnd2 = () => { sd2 = (sd2 * 1103515245 + 12345) >>> 0; return sd2 / 4294967296; };
  gctx.filter = 'blur(1.4px)';
  gctx.strokeStyle = 'rgba(255,0,0,0.30)';
  gctx.lineWidth = Math.max(1.2, fsPx * 0.010);
  for (let i = 0; i < nB; i++) {
    const bx2 = x0 + (0.02 + 0.96 * rnd2()) * mt.width;
    const by2 = by + (rnd2() - 0.5) * fsPx * 1.02;
    const rr = fsPx * (0.012 + 0.040 * Math.pow(rnd2(), 1.6));
    const a0 = rnd2() * 6.2832;
    const sweep = 0.9 + 4.6 * rnd2();
    gctx.beginPath(); gctx.arc(bx2, by2, rr, a0, a0 + sweep); gctx.stroke();
  }

  /* 3) 沫渣：水退到哪儿，哪儿就留下一小片没化开的沫 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.014) + 'px)';
  gctx.fillStyle = 'rgba(0,0,255,0.26)';
  for (let i = 0; i < 22; i++) {
    const bx3 = x0 + (0.02 + 0.96 * rnd2()) * mt.width;
    const by3 = by + (rnd2() - 0.5) * fsPx * 1.10;
    const rr = fsPx * (0.006 + 0.020 * Math.pow(rnd2(), 2.0));
    gctx.beginPath(); gctx.ellipse(bx3, by3, rr * 1.4, rr * 0.85, rnd2() * 3.1, 0, 6.2832); gctx.fill();
  }
  /* 水退到字脚下面停住：沫子全堵在这条线上，干成一道白 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.030) + 'px)';
  gctx.fillStyle = 'rgba(255,0,0,0.130)';
  gctx.fillRect(x0 - fsPx * 0.20, inkBot + fsPx * 0.020, mt.width + fsPx * 0.40, fsPx * 0.045);
  gctx.filter = 'none';
  gctx.globalCompositeOperation = 'source-over';

  const arr = Array.from(t);
  const chars = [];
  let acc = 0;
  for (const ch of arr) {
    const cw = gctx.measureText(ch).width;
    chars.push({ c: ch, x0: (pad + acc) / w, x1: (pad + acc + cw) / w });
    acc += cw;
  }
  GT.chars = chars;
  GT.w = w; GT.h = h;
  const boxH = BOX_W * (h / w);
  GT.box = [-BOX_W / 2, -boxH / 2, BOX_W, boxH];
  GT.ready = true;
  if (glOk) uploadGlyph();
}

function uploadGlyph() {
  gl.bindTexture(gl.TEXTURE_2D, glyphTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gcv);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

let charProg = [];
function buildRamp() {
  if (!GT.chars.length) { ramp.fill(0); if (glOk) pushRamp(); return; }
  for (let i = 0; i < RAMP_N; i++) {
    const u = (i + 0.5) / RAMP_N;
    let v = 0;
    for (let k = 0; k < GT.chars.length; k++) {
      const c = GT.chars[k];
      if (u >= c.x0 - 0.004 && u <= c.x1 + 0.004) { v = charProg[k] || 0; break; }
      if (u < c.x0) { v = charProg[k] || 0; break; }
    }
    const b = Math.round(clamp01(v) * 255);
    ramp[i * 4] = b; ramp[i * 4 + 1] = b; ramp[i * 4 + 2] = b; ramp[i * 4 + 3] = 255;
  }
  pushRamp();
}
function pushRamp() {
  if (!glOk) return;
  gl.bindTexture(gl.TEXTURE_2D, rampTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RAMP_N, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, ramp);
}

/* ══════════════════════════ 线性代数 ══════════════════════════ */
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function cameraBasis(eye, at, roll) {
  let fx = at[0] - eye[0], fy = at[1] - eye[1], fz = at[2] - eye[2];
  let fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, ry = 0, rz = fx;
  let rl = Math.hypot(rx, ry, rz) || 1;
  if (rl < 1e-4) { rx = 1; ry = 0; rz = 0; rl = 1; }
  rx /= rl; ry /= rl; rz /= rl;
  let ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
  const c = Math.cos(roll), s = Math.sin(roll);
  const RX = rx * c + ux * s, RY = ry * c + uy * s, RZ = rz * c + uz * s;
  const UX = ux * c - rx * s, UY = uy * c - ry * s, UZ = uz * c - rz * s;
  const dt = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const view = new Float32Array([
    RX, UX, -fx, 0,
    RY, UY, -fy, 0,
    RZ, UZ, -fz, 0,
    -dt([RX, RY, RZ], eye), -dt([UX, UY, UZ], eye), dt([fx, fy, fz], eye), 1
  ]);
  return { view, right: [RX, RY, RZ], up: [UX, UY, UZ], fwd: [fx, fy, fz] };
}

/* ══════════════════════════ GLSL ══════════════════════════ */
const BG_VS = `#version 300 es
in vec2 aQ; out vec2 vUV;
void main(){ vUV = aQ; gl_Position = vec4(aQ * 2.0 - 1.0, 0.0, 1.0); }`;

/* 背景：一片正在冷的蜡。射线打到 z=0 的斜面上，用世界坐标采样字形纹理的高度场 ——
   蜡埂把低灯拦住，影子往右下拖成一条；泪痕是埂里溢出来的那几道。 */
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform vec3 uEye, uRight, uUp, uFwd;
uniform float uTan, uAsp, uT, uBass, uAct, uCut;
uniform sampler2D uGlyph, uRamp;
uniform vec4 uBox;

float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = h21(i), b = h21(i + vec2(1.0, 0.0)), c = h21(i + vec2(0.0, 1.0)), d = h21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

/* 灯是一扇窗，在偏左偏上的地方；水膜几乎是平的，只留一层浅浅的波纹 */
const vec3 LG  = vec3(-0.46, 0.34, 0.82);
const float CH = 0.00052;

vec4 gtex(vec2 w){
  vec2 uv = (w - uBox.xy) / uBox.zw;
  if (uv.x < -0.02 || uv.x > 1.02 || uv.y < -0.02 || uv.y > 1.02) return vec4(0.0);
  return texture(uGlyph, uv);
}
/* 泡沫破掉以后，在台面上干成的一圈圈水碱 —— 台面自己的痕迹 */
float rings(vec2 p, float sc){
  vec2 q = p * sc;
  vec2 i = floor(q), f = fract(q);
  float best = 9.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(float(x), float(y));
      vec2 hh = vec2(h21(i + g + 3.1), h21(i + g + 9.7));
      float r = 0.10 + 0.55 * hh.y;
      float d = abs(length(f - g - (0.17 + 0.66 * hh)) - r);
      best = min(best, mix(9.0, d, step(0.34, hh.x)));
    }
  }
  return exp(-pow(best / 0.075, 2.0));
}
/* 两层：大的那层是气泡，小的那层是沫子破了以后碎下来的小圈 */
float ringFar(vec2 w){ return rings(w, 88.0) * 0.60 + rings(w, 240.0) * 0.34; }
/* 石板磨过的那点起伏，很浅 */
float surf(vec2 w){ return 0.00100 * vnoise(w * 4.2) + 0.00036 * vnoise(w * 13.0); }
float gh(vec2 w){ return surf(w); }

void main(){
  vec2 nd = vUV * 2.0 - 1.0;
  vec3 dir = normalize(uRight * (nd.x * uTan * uAsp) + uUp * (nd.y * uTan) + uFwd);
  vec3 Vv = -dir;

  /* 一块暗台面；边上再暗下去，别让它死平到一眼看不出是台面 */
  vec3 col = vec3(0.0442, 0.0450, 0.0466);
  col *= 0.60 + 0.55 * pow(max(0.0, 1.0 - length(nd * vec2(0.82, 1.0))), 2.2);

  float tq = -uEye.z / min(dir.z, -0.010);
  vec2 wq = uEye.xy + dir.xy * tq;
  float H = gh(wq);

  /* 屏幕导数反解世界梯度：水面/台面都连续，这条链是干净的 */
  vec2 dxw = dFdx(wq), dyw = dFdy(wq);
  float hx = dFdx(H), hy = dFdy(H);
  float det = dxw.x * dyw.y - dxw.y * dyw.x;
  vec2 g = (abs(det) > 1e-13) ? vec2((hx * dyw.y - hy * dxw.y) / det, (hy * dxw.x - hx * dyw.x) / det) : vec2(0.0);
  g = clamp(g, vec2(-5.0), vec2(5.0));
  vec3 N = normalize(vec3(-g, 1.0));

  if (dir.z < -0.010) {
    float t = -uEye.z / dir.z;
    if (t > 0.02 && t < 16.0) {
      vec2 w = uEye.xy + dir.xy * t;
      vec2 uv = (w - uBox.xy) / uBox.zw;
      vec4 g4 = gtex(w);
      float wetT  = g4.g;    /* 最后还没干的那片 */
      float ringT = g4.r;    /* 泡沫堵在字缘上、破掉的那一圈 */
      float dregs = g4.b;    /* 边上没化开的沫渣 */

      float pr = 1.0;
      if (uv.x > -0.08 && uv.x < 1.08 && uv.y > -0.08 && uv.y < 1.08) {
        pr = texture(uRamp, vec2(clamp(uv.x, 0.002, 0.998), 0.5)).r;
      }
      /* 唱到哪儿，那片水才还在那儿 —— 没唱的已经退干净了 */
      float lit = smoothstep(0.03, 0.55, pr);
      float wetAmt = clamp(wetT * (0.28 + 0.72 * lit), 0.0, 1.0);

      /* 台面上干出来的那圈圈水碱：字外面更密，泡沫最后全堵在字缘上 */
      float ringDry = ringFar(w) * exp(-t * 0.30) * (0.55 + 0.80 * vnoise(w * 2.6));
      float ringAll = ringDry * (0.50 + 0.95 * ringT) + ringT * 0.55;


      float grit = vnoise(w * vec2(150.0, 168.0));
      float vein = vnoise(vec2(dot(w, vec2(0.94, 0.34)) * 6.0, dot(w, vec2(-0.34, 0.94)) * 26.0));
      wetAmt *= 0.84 + 0.30 * grit;      /* 水膜有厚有薄，不是一块塑料片 */

      /* 干台面：暗石板，磨过，面上留着一层水碱的白 */
      vec3 albDry = vec3(0.125, 0.125, 0.128) * (0.70 + 0.55 * grit) * (0.66 + 0.62 * vein);
      /* 水膜底下那块石板：更深，颜色被水吸掉一层 */
      vec3 albWet = albDry * 0.44 + vec3(0.005, 0.006, 0.007);
      vec3 alb = mix(albDry, albWet, wetAmt);
      alb += vec3(0.105, 0.107, 0.110) * ringAll * 0.50;   /* 干掉的水碱 */

      vec3 Ldn = normalize(LG);
      float ndl = clamp(dot(N, Ldn), 0.0, 1.0);
      vec3 c = alb * (0.085 + 1.00 * ndl);

      /* 水膜：映着上面那扇窗。视角越平越亮 —— 机位一滑，整片就亮灭一次。
         窗不是一整块：水面上映出来的是一块块暗的、一条条亮的 */
      float ndv = clamp(dot(N, Vv), 0.001, 1.0);
      float fres = pow(1.0 - ndv, 4.0);
      float film = 0.80 + 0.40 * vnoise(w * 24.0);
      float envl = 0.34 + 1.15 * smoothstep(0.28, 0.78,
                     vnoise(vec2(dot(w, vec2(0.62, 0.78)) * 3.4, dot(w, vec2(-0.78, 0.62)) * 1.1)));
      c += vec3(0.720, 0.740, 0.780) * wetAmt * (0.42 + 1.30 * fres) * film * envl;
      /* 水面上还有细纹：水膜的镜面被它切成一条条，机位一动就闪 */
      vec2 rip = vec2(vnoise(w * 33.0 + 7.0), vnoise(w * 39.0 + 21.0)) - 0.5;
      N = normalize(N + vec3(rip * 0.075 * wetAmt * (0.35 + 0.65 * fres), 0.0));
      /* 窗那条亮带：水膜上最亮的一道，跟着机位扫过字面 */
      vec3 Hv = normalize(Ldn + Vv);
      float spec = pow(clamp(dot(N, Hv), 0.0, 1.0), 20.0);
      c += vec3(1.0, 0.995, 0.985) * spec * (0.12 + 2.10 * wetAmt);
      /* 干台面也有一点粗反光，别让它死平 */
      c += vec3(0.26, 0.265, 0.28) * pow(clamp(dot(N, normalize(Ldn + Vv)), 0.0, 1.0), 20.0) * 0.35;

    beatPulse = Math.min(1, beatPulse + 0.32 + (d.payload.level || 0) * 0.5);
    beatN++; dirty = true;
  } else if (d.type === 'live') {
    const l = d.payload || {};
    if (typeof l.bass === 'number') bass = Math.max(bass, clamp01(l.bass));
    if (typeof l.treble === 'number') treb = Math.max(treb, clamp01(l.treble));
    if (typeof l.level === 'number') beatPulse = Math.max(beatPulse, Math.min(0.9, l.level * 0.8));
  }
});
addEventListener('pagehide', () => cancelAnimationFrame(raf));

/* ══════════════════════════ 自查 ══════════════════════════ */
window.__stage = () => ({
  lines: lines.length, idx: idx, t: +now().toFixed(2), playing: playing, frames: frames,
  js: +jsMs.toFixed(2), err: errMsg, text: (idx >= 0 && lines[idx]) ? lines[idx].text : '',
  gl: glOk, rm: RM, vT: +vT.toFixed(2),
  cut: +uCut.toFixed(3), prog: +uProgG.toFixed(3), lit: +uCut.toFixed(3), chars: GT.chars.length
});

/* ══════════════════════════ 启动 ══════════════════════════ */
resize();
try { initGL(); } catch (e) { errMsg = 'gl: ' + (e && e.message ? e.message : e); document.documentElement.classList.add('fb'); }
raf = requestAnimationFrame(frame);
</script>
</body>
