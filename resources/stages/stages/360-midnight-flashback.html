<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>午夜闪回 · MIDNIGHT FLASHBACK</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#08030c}
  body{font-family:"Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC",sans-serif;
       -webkit-font-smoothing:antialiased;color:#fff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #lyr{position:fixed;left:0;right:0;bottom:0;padding:0 6vw 9vh;pointer-events:none;z-index:10}
  #scrim{position:fixed;left:0;right:0;bottom:0;height:36vh;pointer-events:none;z-index:5;
         background:linear-gradient(to top,rgba(5,0,10,.74),rgba(5,0,10,.30) 44%,rgba(5,0,10,0))}
  #cur{font-weight:900;font-style:italic;font-size:clamp(22px,3.4vw,46px);line-height:1.3;
       letter-spacing:.005em;max-width:min(62vw,900px);
       transform:skewX(-6deg);transform-origin:left bottom;
       text-shadow:0 0 26px rgba(255,60,170,.5),0 2px 0 rgba(0,0,0,.6);
       transition:opacity .35s ease}
  #cur.dim{opacity:.42}
  #cur .ch{color:#f7eeff;opacity:.40;transition:opacity .14s linear,color .14s linear;
           text-shadow:0 2px 18px rgba(0,0,0,.8),-1px 0 rgba(255,40,120,.30),1px 0 rgba(60,230,255,.26)}
  #cur .ch.on{opacity:1;color:#fff;
           text-shadow:0 0 20px var(--acc,rgba(255,80,170,.9)),0 0 46px var(--acc2,rgba(255,80,170,.45)),
                      0 2px 18px rgba(0,0,0,.75),-1.2px 0 rgba(255,40,120,.55),1.2px 0 rgba(60,230,255,.5)}
  #nxt{margin-top:.45em;font-weight:800;font-style:italic;font-size:clamp(13px,1.45vw,18px);
       opacity:.5;letter-spacing:.03em;transform:skewX(-6deg);transform-origin:left top;
       max-width:min(56vw,760px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #empty{display:none;font:600 clamp(12px,1.2vw,15px)/1.7 "Courier New",monospace;
         letter-spacing:.34em;color:rgba(255,210,244,.55);text-transform:uppercase;
         text-shadow:0 0 18px rgba(255,60,170,.4)}
  /* --- VHS / 海报层 --- */
  #poster{position:fixed;right:-4vw;top:38%;transform:rotate(-7deg);transform-origin:right center;
          font:900 italic clamp(54px,12.5vw,240px)/0.82 "Arial Black",Impact,"Arial Narrow",sans-serif;
          letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1.5px rgba(255,196,240,.20);
          text-align:right;pointer-events:none;z-index:2;user-select:none;
          opacity:.9;mix-blend-mode:screen}
  #brand{position:fixed;top:4.4vh;right:4vw;text-align:right;pointer-events:none;z-index:11;
         font:900 italic clamp(10px,1.0vw,14px)/1.5 "Arial Black",Impact,sans-serif;
         letter-spacing:.44em;color:#ffe2f6;text-shadow:0 0 14px rgba(255,60,170,.6)}
  #brand span{display:block;font:700 italic clamp(8px,.72vw,10px)/1.9 "Courier New",monospace;
         letter-spacing:.5em;color:rgba(120,240,255,.85);opacity:.9}
  #stamp{position:fixed;bottom:3.4vh;right:4vw;pointer-events:none;z-index:11;
         font:700 clamp(9px,.92vw,12px)/1 "Courier New",Consolas,monospace;
         letter-spacing:.16em;color:rgba(255,232,248,.8);text-shadow:0 0 10px rgba(255,40,140,.55)}
  #stamp b{color:#ff5f9e;font-weight:700}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:8;
        background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px);
        opacity:.55;mix-blend-mode:multiply}
  #track{position:fixed;left:0;right:0;height:9vh;pointer-events:none;z-index:9;
         background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,210,245,.055) 45%,rgba(255,255,255,0));
         animation:trk 8.5s linear infinite;opacity:.85;mix-blend-mode:screen}
  @keyframes trk{0%{transform:translateY(-14vh)}100%{transform:translateY(104vh)}}
  #chroma{position:fixed;inset:0;pointer-events:none;z-index:8;mix-blend-mode:screen;
          background:radial-gradient(120% 90% at 8% 50%,rgba(255,30,120,.14),transparent 42%),
                     radial-gradient(110% 90% at 96% 55%,rgba(40,220,255,.11),transparent 45%)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:8;
       background:radial-gradient(120% 100% at 50% 46%,transparent 52%,rgba(6,0,10,.62) 100%)}
  @media (prefers-reduced-motion: reduce){ #track{animation:none;opacity:.25} }
  @media (max-aspect-ratio: 1/1){
    #poster{display:none}
    #brand{top:3vh;right:6vw}
    #stamp{bottom:2.4vh;right:6vw}
    #lyr{padding:0 6vw 8vh}
    #cur{max-width:88vw}
    #nxt{max-width:88vw}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="poster">MIDNIGHT<br>FLASHBACK</div>
<div id="chroma"></div>
<div id="vig"></div>
<div id="brand">NEON DISCO<span>TOKYO · 1987</span></div>
<div id="stamp"><b>▶</b> PLAY <span id="tc">00:00:00</span> · SP</div>
<div id="scrim"></div>
<div id="lyr"><div id="cur"></div><div id="nxt"></div></div>
<div id="scan"></div>
<div id="track"></div>
<script>
window.__stage = function(){
  return { lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing,
           frames:S.frames, js:S.js, err:S.err, text:S.text, gl:false, rm:S.rm };
};

var S = { lines:[], idx:-1, t:0, playing:true, frames:0, js:0,
          err:'', text:'', rm:false };
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var curEl = document.getElementById('cur');
var nxtEl = document.getElementById('nxt');
var W = 1440, H = 900, DPR = 1, accent = [255, 74, 160];
var readySent = false;
var bgC = null, bgX = null, fgC = null, fgX = null, grC = null, grPat = null;
var LAY = { wx:0, wy:0, ww:10, wh:10,
            fx:0, fy:0, fw:10, fh:10, fs:1,
            ball:{x:0,y:0,r:10}, eqX:0, eqY:0, eqW:10, eqH:10, wide:true };
var ballA = 0, beamA = 0, grainTick = 0;
/* 首帧就要能画：PAL 必须一开始就有值（prerender 只覆盖它） */
var PAL = { accent:[255,74,160], hot:[255,146,202], pink:[255,58,148],
            cyan:[64,232,255], violet:[150,62,255] };

/* ---------- 颜色 / 绘制工具 ---------- */
function rgba(c, a){
  var al = (a == null) ? (c.length > 3 ? c[3] : 1) : a;
  var r = Math.round(clampNum(c[0],0,255)), g = Math.round(clampNum(c[1],0,255)),
      b = Math.round(clampNum(c[2],0,255));
  return 'rgba(' + r + ',' + g + ',' + b + ',' + (Math.round(clampNum(al,0,1)*1000)/1000) + ')';
}
function hex(c){ return rgba(c, 1); }
function grad(c, x0,y0,x1,y1, stops){
  var g = null;
  try { g = c.createLinearGradient(x0,y0,x1,y1); } catch(e){ console.error(e); return '#000'; }
  for (var i = 0; i < stops.length; i++){
    var s = stops[i], p = clampNum(s[0],0,1);
    try { g.addColorStop(p, (typeof s[1] === 'string') ? s[1] : rgba(s[1], s[2] == null ? 1 : s[2])); }
    catch(e){ console.error('stop', p, e); }
  }
  return g;
}
function rgrad(c, x, y, r0, r1, stops){
  var g = null;
  try { g = c.createRadialGradient(x,y,r0,x,y,r1); } catch(e){ console.error(e); return '#000'; }
  for (var i = 0; i < stops.length; i++){
    var s = stops[i];
    try { g.addColorStop(clampNum(s[0],0,1), (typeof s[1] === 'string') ? s[1] : rgba(s[1], s[2] == null ? 1 : s[2])); }
    catch(e){ console.error('rstop', e); }
  }
  return g;
}
function mkC(w,h){ var c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w)); c.height = Math.max(1,Math.round(h)); return c; }
function poly(c, pts, fill){
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill) { c.fillStyle = fill; c.fill(); }
}
/* 二次曲线串联：p = [[x,y],...] */
function curveTo(c, pts, close, moveFirst){
  var n = pts.length;
  if (!pts || n < 2) return;
  if (moveFirst !== false) c.moveTo(pts[0][0], pts[0][1]);
  var end = close ? n : n - 1;
  for (var i = 1; i < end; i++){
    var p = pts[i], q = pts[(i + 1) % n];
    c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  if (!close){
    var last = pts[n-1];
    c.lineTo(last[0], last[1]);
  }
}

/* ---------- 布局 ---------- */
function layout(){
  LAY.wide = (W / Math.max(1,H)) > 1.05;
  if (LAY.wide){
    LAY.eqX = W*0.015; LAY.eqY = H*0.055; LAY.eqW = W*0.575; LAY.eqH = H*0.775;
    LAY.fs = Math.min(H*1.28, W*0.76) / 1000;
    LAY.fw = 1000*LAY.fs; LAY.fh = 1000*LAY.fs;
    LAY.fx = W*0.655 - 520*LAY.fs;
    LAY.fy = H - LAY.fh + H*0.02;
    LAY.ball = { x: W*0.145, y: H*0.205, r: Math.min(W,H)*0.098 };
  } else {
    LAY.eqX = W*0.02; LAY.eqY = H*0.05; LAY.eqW = W*0.96; LAY.eqH = H*0.50;
    LAY.fs = Math.min(W*2.35, H*1.00) / 1000;
    LAY.fw = 1000*LAY.fs; LAY.fh = 1000*LAY.fs;
    LAY.fx = W*0.52 - 520*LAY.fs;
    LAY.fy = H*0.145;
    LAY.ball = { x: W*0.30, y: H*0.145, r: Math.min(W,H)*0.112 };
  }
  var br = LAY.ball.r; if (!isFinite(br) || br < 4) LAY.ball.r = 12;
  LAY.pad = Math.max(12, Math.round(0.03 * Math.min(W, H)));
}

function buildGrain(){
  grC = mkC(112,112);
  var g = grC.getContext('2d');
  var img = g.createImageData(112,112);
  var d = img.data;
  for (var i = 0; i < d.length; i += 4){
    var v = 90 + Math.random()*120;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 26;
  }
  g.putImageData(img, 0, 0);
  try { grPat = ctx.createPattern(grC, 'repeat'); } catch(e){ console.error(e); }
}

function prerender(){
  layout();
  PAL = {
    accent: accent,
    hot: mix(accent, [255,255,255], 0.42),
    pink: [255, 58, 148],
    cyan: [64, 232, 255],
    violet: [150, 62, 255]
  };
  bgC = mkC(W*DPR, H*DPR); bgX = bgC.getContext('2d'); bgX.setTransform(DPR,0,0,DPR,0,0);
  paintBackdrop(bgX);
  var pad = LAY.pad;
  fgC = mkC((LAY.fw+pad*2)*DPR, (LAY.fh+pad*2)*DPR);
  fgX = fgC.getContext('2d');
  fgX.setTransform(DPR,0,0,DPR,DPR*pad,DPR*pad);
  fgX.scale(LAY.fs, LAY.fs);
  paintFigure(fgX, LAY.fs);
}

try { S.rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ console.error(e); }

function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){ console.error(e); }
}

/* ---------- 歌词引擎 ---------- */
var charSpans = [];      // 当前句的 span 列表
var charTimes = [];      // 每个字的起始秒
var curLine = -1;
var emptyEl = null;

function clampNum(v, a, b){ v = +v; if (!isFinite(v)) return a; return v < a ? a : (v > b ? b : v); }
function rgbStr(c, a){
  var r = clampNum(Math.round(c[0]), 0, 255);
  var g = clampNum(Math.round(c[1]), 0, 255);
  var b = clampNum(Math.round(c[2]), 0, 255);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + clampNum(a, 0, 1) + ')';
}
function mix(a, b, k){
  k = clampNum(k, 0, 1);
  return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
}

function normLines(arr){
  var out = [];
  if (!arr || !arr.length) return out;
  var n = Math.min(arr.length, 4000);
  for (var i = 0; i < n; i++){
    var L = arr[i] || {};
    var txt = (typeof L.text === 'string') ? L.text : (L.text == null ? '' : String(L.text));
    var tt = +L.t; if (!isFinite(tt)) tt = 0;
    var dd = +L.dur; if (!isFinite(dd) || dd <= 0) dd = 3.2;
    var ch = null;
    if (L.chars && L.chars.length){
      ch = [];
      var cn = Math.min(L.chars.length, 600);
      for (var j = 0; j < cn; j++){
        var c = L.chars[j] || {};
        var ct = +c.t; if (!isFinite(ct)) ct = tt;
        ch.push({ c: (c.c == null ? '' : String(c.c)), t: ct });
      }
    }
    out.push({ t: tt, dur: dd, text: txt, chars: ch });
  }
  out.sort(function(a, b){ return a.t - b.t; });
  return out;
}

function setEmpty(on){
  if (!emptyEl){
    emptyEl = document.createElement('div');
    emptyEl.id = 'empty';
    document.getElementById('lyr').appendChild(emptyEl);
  }
  emptyEl.style.display = on ? 'block' : 'none';
}

function buildLine(i){
  curLine = i;
  charSpans = []; charTimes = [];
  curEl.textContent = '';
  nxtEl.textContent = '';
  if (i < 0 || i >= S.lines.length){
    setEmpty(S.lines.length === 0);
    if (emptyEl && S.lines.length === 0){
      emptyEl.textContent = '♪ instrumental · 无歌词';
    } else if (S.lines.length > 0){
      nxtEl.textContent = S.lines[0].text;   /* 前奏：先预告第一句 */
    }
    return;
  }
  setEmpty(false);
  var L = S.lines[i];
  var txt = L.text || '';
  var chars = Array.from(txt);
  if (chars.length > 180){ chars = chars.slice(0, 180); chars.push('…'); txt = chars.join(''); }
  var n = chars.length;
  var need = Math.min(n, 240);
  var c0 = L.t, span = Math.max(0.12, L.dur);
  for (var k = 0; k < n; k++){
    var sp = document.createElement('span');
    sp.className = 'ch';
    sp.textContent = chars[k];
    curEl.appendChild(sp);
    charSpans.push(sp);
    if (k < need){
      if (L.chars && L.chars.length){
        var src = L.chars[Math.min(k, L.chars.length - 1)];
        charTimes.push(src ? src.t : c0);
      } else {
        charTimes.push(c0 + span * (k / Math.max(1, n)));
      }
    } else {
      charTimes.push(c0);
    }
  }
  S.text = txt;
  var nx = S.lines[i + 1];
  nxtEl.textContent = nx ? nx.text : '';
  fitLine();
}

function fitLine(){
  /* 按字数粗调一次，再按实测高度最多缩 3 次（固定次数，不收敛迭代） */
  var n = charSpans.length;
  var base = clampNum(W * (LAY.wide ? 0.034 : 0.062), 20, 48);
  if (n > 14) base *= Math.max(0.55, 14 / n);
  curEl.style.fontSize = base.toFixed(1) + 'px';
  var avail = H * 0.32;
  for (var pass = 0; pass < 3; pass++){
    if (curEl.offsetHeight <= avail) break;
    base = Math.max(12, base * 0.86);
    curEl.style.fontSize = base.toFixed(1) + 'px';
  }
}

function paintKaraoke(){
  if (curLine < 0 || !charSpans.length) return;
  var t = S.t;
  var L = S.lines[curLine];
  var end = L ? (L.t + L.dur) : 0;
  for (var i = 0; i < charSpans.length; i++){
    var lit = t >= charTimes[i] - 0.02;
    var sp = charSpans[i];
    var want = lit ? 1 : 0;
    if (sp.__on !== want){ sp.__on = want; sp.className = lit ? 'ch on' : 'ch'; }
  }
  if (curEl.__dim !== (t > end + 1.2)){
    curEl.__dim = (t > end + 1.2);
    curEl.classList.toggle('dim', curEl.__dim);
  }
}

function updateLyric(){
  var t = S.t, idx = -1;
  var lines = S.lines, n = lines.length;
  if (n){
    /* 二分找最后一句 t <= 当前时间（固定 14 次上限，不靠收敛） */
    var lo = 0, hi = n - 1, res = -1;
    for (var it = 0; it < 14 && lo <= hi; it++){
      var mid = (lo + hi) >> 1;
      if (lines[mid].t <= t + 0.001){ res = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    idx = res;
  }
  S.idx = idx;
  if (idx !== curLine) buildLine(idx);
  paintKaraoke();
}

function applyInit(p){
  try {
    p = p || {};
    if (Array.isArray(p.accent) && p.accent.length >= 3){
      accent = [clampNum(p.accent[0],0,255), clampNum(p.accent[1],0,255), clampNum(p.accent[2],0,255)];
    }
    S.lines = normLines(p.lines);
    S.duration = +p.duration || 0;
    S.songName = p.song && p.song.name ? String(p.song.name) : '';
    S.artists = p.song && p.song.artists ? [].concat(p.song.artists).join(' / ') : '';
    try {
      var rs = document.documentElement.style;
      rs.setProperty('--acc', rgba(mix(accent, [255,255,255], 0.36), 0.95));
      rs.setProperty('--acc2', rgba(accent, 0.5));
    } catch(e){ console.error(e); }
    curLine = -2;   // 强制重建
    S.text = '';
    buildLine(-1);
    updateLyric();
    if (typeof onInitVisual === 'function') onInitVisual(p);
  } catch(e){ console.error('init failed', e); S.err = String(e && e.message || e); }
}

window.addEventListener('message', function(ev){
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') applyInit(d.payload);
    else if (d.type === 'tick'){
      var q = d.payload || {};
      var tt = +q.time;
      if (isFinite(tt)) S.t = tt;              // 无条件采纳，跳变也认
      if (typeof q.playing === 'boolean') S.playing = q.playing;
    } else if (d.type === 'beat'){
      var b = d.payload || {};
      S.beat = { index: b.index | 0, level: clampNum(b.level, 0, 1), at: performance.now() * 0.001 };
    } else if (d.type === 'live'){
      var v = d.payload || {};
      S.live = { bpm: clampNum(v.bpm, 40, 240), level: clampNum(v.level, 0, 1),
                 bass: clampNum(v.bass, 0, 1), mid: clampNum(v.mid, 0, 1),
                 treble: clampNum(v.treble, 0, 1),
                 playing: typeof v.playing === 'boolean' ? v.playing : S.playing };
      if (typeof v.playing === 'boolean') S.playing = v.playing;
    }
  } catch(e){ console.error('msg failed', e); S.err = String(e && e.message || e); }
}, false);

/* ---------- 背景：昭和东京夜景落地窗 ---------- */
var seed = 987654321;
function rnd(){
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return ((seed >>> 7) & 0xfffff) / 0x100000;
}

function paintBackdrop(c){
  seed = 20261102;
  var win = { x: LAY.eqX, y: LAY.eqY, w: LAY.eqW, h: LAY.eqH };
  var horizon = win.y + win.h * 0.66;

  c.fillStyle = grad(c, 0, 0, 0, H, [[0,[9,4,18]],[0.5,[24,7,32]],[1,[10,4,16]]]);
  c.fillRect(0, 0, W, H);

  c.save();
  c.beginPath(); c.rect(win.x, win.y, win.w, win.h); c.clip();

  /* 夜空 */
  c.fillStyle = grad(c, 0, win.y, 0, horizon, [
    [0,[10,6,30]],[0.38,[34,11,54]],[0.68,[88,20,84]],[0.9,[162,38,110]],[1,[214,64,124]]
  ]);
  c.fillRect(win.x, win.y, win.w, horizon - win.y);

  /* 都市雾光 */
  try {
    c.fillStyle = rgrad(c, win.x + win.w*0.62, horizon, 0, win.w*0.62, [
      [0,[255,120,150,0.42]],[0.45,[255,70,150,0.16]],[1,[255,70,150,0]]
    ]);
    c.fillRect(win.x, win.y, win.w, win.h);
  } catch(e){ console.error(e); }

  /* 印刷网点：赛璐璐胶片 / 海报的印刷质感（小图平铺，一次填充） */
  try {
    var step = Math.max(8, Math.round(Math.min(W, H) * 0.016));
    var tile = mkC(step, step);
    var tg = tile.getContext('2d');
    tg.fillStyle = 'rgba(255,120,190,0.16)';
    tg.beginPath(); tg.arc(step/2, step/2, Math.max(0.9, step*0.15), 0, 6.283); tg.fill();
    var pat = c.createPattern(tile, 'repeat');
    if (pat){
      c.fillStyle = pat;
      c.fillRect(win.x, win.y, win.w, horizon - win.y);
    }
  } catch(e){ console.error(e); }

  /* 远景天际线 */
  var i, n, bx, bw, bh, bh2;
  var x0 = win.x, ww = win.w, base = win.y + win.h;
  n = 26;
  for (i = 0; i < n; i++){
    bw = ww / n * (0.65 + rnd() * 0.9);
    bx = x0 + (i / n) * ww + rnd() * 6;
    bh = win.h * (0.14 + rnd() * 0.24);
    c.fillStyle = 'rgba(52,20,64,0.92)';
    c.fillRect(bx, base - bh, bw, bh);
  }
  /* 中景楼群 + 亮窗 */
  n = 18;
  for (i = 0; i < n; i++){
    bw = ww / n * (0.85 + rnd() * 1.1);
    bx = x0 + (i / n) * ww - rnd() * 8;
    bh = win.h * (0.10 + rnd() * 0.30);
    c.fillStyle = grad(c, 0, base - bh, 0, base, [[0,[26,9,36]],[1,[14,5,22]]]);
    c.fillRect(bx, base - bh, bw, bh);
    if (rnd() > 0.45){
      c.fillStyle = 'rgba(255,206,150,0.55)';
      var rows = Math.min(14, Math.floor(bh / 9));
      for (var r = 0; r < rows; r++){
        var cols = Math.min(4, Math.floor(bw / 7));
        for (var q = 0; q < cols; q++){
          if (rnd() > 0.55) continue;
          c.fillRect(bx + 3 + q * 7, base - bh + 5 + r * 9, 3, 4);
        }
      }
    }
    /* 楼顶天线 + 红灯 */
    if (rnd() > 0.55){
      c.strokeStyle = 'rgba(40,18,50,0.9)'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(bx + bw*0.5, base - bh); c.lineTo(bx + bw*0.5, base - bh - 18 - rnd()*22); c.stroke();
      c.fillStyle = 'rgba(255,84,110,0.95)';
      c.beginPath(); c.arc(bx + bw*0.5, base - bh - 20 - rnd()*20, 2.2, 0, 6.283); c.fill();
    }
  }
  /* 近景剪影 */
  n = 9;
  for (i = 0; i < n; i++){
    bw = ww / n * (1.0 + rnd() * 0.7);
    bx = x0 + (i / n) * ww - rnd() * 10;
    bh = win.h * (0.06 + rnd() * 0.14);
    c.fillStyle = '#0d0413';
    c.fillRect(bx, base - bh, bw, bh);
  }

  /* 霓虹招牌：竖向灯箱（假字形块，远处读作文字） */
  for (i = 0; i < 12; i++){
    var sx = x0 + 12 + rnd() * (ww - 40);
    var sy = horizon - 40 - rnd() * win.h * 0.42;
    var sw = 8 + rnd() * 9, shh = 34 + rnd() * 62;
    var hue = [ [255,64,150], [70,235,255], [255,196,80], [180,90,255] ][i % 4];
    var gl = 0.55 + rnd() * 0.45;
    try {
      c.save();
      c.shadowColor = rgba(hue, 0.85); c.shadowBlur = 16;
      c.fillStyle = rgba(hue, 0.22);
      c.fillRect(sx, sy, sw, shh);
      c.restore();
    } catch(e){ console.error(e); }
    c.strokeStyle = rgba(hue, gl); c.lineWidth = 1.4;
    c.strokeRect(sx + 1, sy + 1, sw - 2, shh - 2);
    var gN = Math.min(5, Math.floor(shh / 12));
    for (var gi = 0; gi < gN; gi++){
      var gy = sy + 6 + gi * 12;
      c.fillStyle = rgba(hue, gl * 0.9);
      c.fillRect(sx + 2.5, gy, sw - 5, 2.4);
      c.fillRect(sx + 2.5, gy + 3.4, sw - 5, 1.6);
      if (rnd() > 0.6) c.fillRect(sx + 2.5, gy + 6, (sw - 5) * 0.6, 1.6);
    }
  }
  /* 横向霓虹条 */
  for (i = 0; i < 5; i++){
    var nx = x0 + rnd() * ww * 0.8, ny = horizon - 20 - rnd() * win.h * 0.3;
    var nw = 40 + rnd() * 90;
    var nc = [ [255,80,170], [90,240,255], [255,214,120] ][i % 3];
    try { c.save(); c.shadowColor = rgba(nc, 0.9); c.shadowBlur = 18;
          c.fillStyle = rgba(nc, 0.75); c.fillRect(nx, ny, nw, 2.6); c.restore(); }
    catch(e){ console.error(e); }
  }

  /* 玻璃反光 */
  c.fillStyle = grad(c, win.x, win.y, win.x + win.w*0.55, win.y + win.h, [
    [0,[255,220,255,0.09]],[0.35,[255,180,240,0.02]],[1,[255,255,255,0]]
  ]);
  c.fillRect(win.x, win.y, win.w, win.h);
  c.fillStyle = 'rgba(255,240,255,0.045)';
  c.beginPath();
  c.moveTo(win.x + win.w*0.10, win.y + win.h);
  c.lineTo(win.x + win.w*0.26, win.y + win.h);
  c.lineTo(win.x + win.w*0.62, win.y);
  c.lineTo(win.x + win.w*0.46, win.y);
  c.closePath(); c.fill();

  c.restore();

  /* 窗框 */
  var mw = Math.max(7, Math.min(W, H) * 0.012);
  c.fillStyle = 'rgba(8,3,12,0.94)';
  c.fillRect(win.x + win.w*0.345 - mw/2, win.y, mw, win.h);
  c.fillRect(win.x + win.w*0.685 - mw/2, win.y, mw, win.h);
  c.fillRect(win.x, win.y + win.h*0.44 - mw/2, win.w, mw);
  c.strokeStyle = 'rgba(8,3,12,0.96)'; c.lineWidth = mw*1.5;
  c.strokeRect(win.x - mw*0.75, win.y - mw*0.75, win.w + mw*1.5, win.h + mw*1.5);

  /* 窗台高光 */
  c.fillStyle = grad(c, 0, win.y + win.h, 0, win.y + win.h + 10, [
    [0, rgba([255,180,220], 0.5)],[1, rgba([255,180,220], 0)]
  ]);
  c.fillRect(win.x, win.y + win.h, win.w, 10);

  /* 室内暗部 + 暗角 */
  c.fillStyle = rgrad(c, W*0.5, H*0.52, Math.min(W,H)*0.30, Math.max(W,H)*0.86, [
    [0,[0,0,0,0]],[0.62,[0,0,0,0.30]],[1,[0,0,0,0.82]]
  ]);
  c.fillRect(0, 0, W, H);
}

  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw || 2; c.stroke(); }

}

/* ---------- 频谱柱（窗内） ---------- */
var EQ_N = 34, eqPh = [], eqVal = [];
function initEQ(){
  eqPh = []; eqVal = [];
  for (var i = 0; i < EQ_N; i++){
    eqPh.push(Math.random() * 6.283);
    eqVal.push(0.25 + Math.random() * 0.2);
  }
}
function liveGet(){
  var l = S.live || {};
  return {
    level: clampNum(l.level == null ? 0.45 : l.level, 0, 1),
    bass:  clampNum(l.bass == null ? 0.4 : l.bass, 0, 1),
    mid:   clampNum(l.mid == null ? 0.35 : l.mid, 0, 1),
    treble:clampNum(l.treble == null ? 0.3 : l.treble, 0, 1)
  };
}
function drawEQ(){
  if (!eqPh.length) initEQ();
  var L = liveGet();
  var now = performance.now() * 0.001;
  var beatP = S.beat && (now - (S.beat.at || 0) < 0.18) ? (S.beat.level || 0.6) : 0;
  var x0 = LAY.eqX, y0 = LAY.eqY + LAY.eqH, ww = LAY.eqW, hh = LAY.eqH * 0.86;
  var bandW = ww / EQ_N;
  var bw = Math.max(1.5, bandW * 0.58);
  var motion = S.rm ? 0.25 : 1;
  var barG = grad(ctx, 0, y0 - hh, 0, y0, [
    [0, rgba([255,255,255], 0.88)], [0.32, rgba(PAL.hot, 0.66)], [1, rgba(PAL.violet, 0.16)]
  ]);
  for (var i = 0; i < EQ_N; i++){
    var k = i / (EQ_N - 1);
    var shape = 0.34 + 0.66 * Math.pow(Math.sin(Math.PI * Math.min(1, k * 0.96 + 0.02)), 1.6);
    var bassW = 1 - Math.min(1, Math.abs(k - 0.18) * 2.4);
    var midW  = 1 - Math.min(1, Math.abs(k - 0.5) * 2.6);
    var treW  = 1 - Math.min(1, Math.abs(k - 0.85) * 2.4);
    var amp = (L.bass * bassW + L.mid * midW + L.treble * treW) * 0.8 + L.level * 0.35;
    if (!S.playing) amp *= 0.55;
    amp += 0.18 * Math.sin(now * (1.1 + k * 2.6) * motion + eqPh[i]) + beatP * 0.22;
    var target = clampNum(shape * (0.34 + amp * 0.85), 0.03, 0.95);
    eqVal[i] += (target - eqVal[i]) * (0.22 * (0.5 + motion));
    var h = clampNum(eqVal[i] * hh, 2, hh);
    var x = x0 + i * bandW + (bandW - bw) * 0.5;
    var y = y0 - h;
    ctx.fillStyle = (typeof barG === 'string') ? rgba(PAL.hot, 0.4) : barG;
    ctx.fillRect(x, y, bw, h);
    ctx.fillStyle = 'rgba(255,248,255,0.85)';
    ctx.fillRect(x, y, bw, Math.min(2.2, h));
  }
}

/* ---------- 迪斯科球：手写球面投影 ---------- */
function ballProj(phi, th, R){
  var cp = Math.cos(phi), sp = Math.sin(phi);
  var x = cp * Math.sin(th), y = sp, z = cp * Math.cos(th);
  var tl = 0.42, ct = Math.cos(tl), st = Math.sin(tl);
  var y2 = y * ct - z * st, z2 = y * st + z * ct;
  return { x: x * R, y: y2 * R, z: z2, n: [x, y2, z2] };
}
function drawBall(){
  var b = LAY.ball; if (!b || !b.r) return;
  var R = b.r, cx = b.x, cy = b.y;
  var now = performance.now() * 0.001;
  var rot = now * 0.34 * (S.rm ? 0.3 : 1) + S.t * 0.22;
  try {
    ctx.fillStyle = rgrad(ctx, cx, cy, R * 0.15, R * 2.7, [
      [0, rgba(PAL.hot, 0.20)], [0.42, rgba(PAL.violet, 0.11)], [1, [255,255,255,0]]
    ]);
    ctx.fillRect(cx - R * 2.7, cy - R * 2.7, R * 5.4, R * 5.4);
  } catch(e){ console.error(e); }

  var LON = 16, LAT = 7, PHI = 1.14;
  var lx = -0.52, ly = -0.62, lz = 0.72;
  var q = [];
  for (var lo = 0; lo < LON; lo++){
    var th0 = rot + Math.PI * 2 * lo / LON;
    var th1 = rot + Math.PI * 2 * (lo + 1) / LON;
    for (var la = 0; la < LAT; la++){
      var p0 = -PHI + 2 * PHI * la / LAT, p1 = -PHI + 2 * PHI * (la + 1) / LAT;
      var a = ballProj(p0, th0, R), bb = ballProj(p1, th0, R);
      var cc = ballProj(p1, th1, R), dd = ballProj(p0, th1, R);
      var zc = (a.z + cc.z) * 0.5;
      if (zc <= 0.02) continue;
      var nx = (a.n[0] + cc.n[0]) * 0.5, ny = (a.n[1] + cc.n[1]) * 0.5, nz = (a.n[2] + cc.n[2]) * 0.5;
      var dot = Math.max(0, nx * lx + ny * ly + nz * lz);
      var v = 0.16 + 0.84 * Math.pow(dot, 0.85);
      q.push([a, bb, cc, dd, v, zc]);
    }
  }
  q.sort(function(m, n){ return m[5] - n[5]; });
  var n = Math.min(q.length, 130);
  for (var i = 0; i < n; i++){
    var f = q[i], vv = f[4];
    var cr = Math.round(30 + vv * 225), cg = Math.round(20 + vv * 205), cb = Math.round(44 + vv * 211);
    ctx.beginPath();
    ctx.moveTo(cx + f[0].x, cy + f[0].y);
    ctx.lineTo(cx + f[1].x, cy + f[1].y);
    ctx.lineTo(cx + f[2].x, cy + f[2].y);
    ctx.lineTo(cx + f[3].x, cy + f[3].y);
    ctx.closePath();
    ctx.fillStyle = rgba([cr, cg, cb], 0.55 + vv * 0.45);
    ctx.fill();
    if (vv > 0.92){
      ctx.fillStyle = rgba(PAL.hot, 0.65);
      ctx.fill();
    }
  }
  /* 高光火花 */
  var sx = cx - R * 0.45, sy = cy - R * 0.55, sl = R * 0.85;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,235,255,0.55)';
  ctx.beginPath();
  ctx.moveTo(sx, sy - sl); ctx.lineTo(sx + sl * 0.10, sy - sl * 0.10);
  ctx.lineTo(sx + sl, sy); ctx.lineTo(sx + sl * 0.10, sy + sl * 0.10);
  ctx.lineTo(sx, sy + sl); ctx.lineTo(sx - sl * 0.10, sy + sl * 0.10);
  ctx.lineTo(sx - sl, sy); ctx.lineTo(sx - sl * 0.10, sy - sl * 0.10);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 球灯切面光束 ---------- */
function drawBeams(){
  var b = LAY.ball; if (!b || !b.r) return;
  var now = performance.now() * 0.001;
  var rot = now * 0.12 * (S.rm ? 0.2 : 1);
  var lvl = S.live && isFinite(S.live.level) ? S.live.level : 0.4;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < 7; i++){
    var a = rot + i * 0.897;
    var len = Math.max(W, H) * (0.62 + 0.30 * Math.sin(a * 1.7 + now * 0.4));
    var spread = 0.20 + 0.06 * Math.sin(a * 2.3);
    var g = null;
    try {
      g = ctx.createLinearGradient(b.x, b.y, b.x + Math.cos(a) * len, b.y + Math.sin(a) * len);
      g.addColorStop(0, rgba(i % 2 ? PAL.cyan : PAL.hot, 0.16 + lvl * 0.10));
      g.addColorStop(1, rgba(i % 2 ? PAL.cyan : PAL.hot, 0));
    } catch(e){ console.error(e); continue; }
    ctx.fillStyle = (typeof g === 'string') ? 'rgba(255,255,255,0)' : g;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x + Math.cos(a - spread) * len, b.y + Math.sin(a - spread) * len);
    ctx.lineTo(b.x + Math.cos(a + spread) * len, b.y + Math.sin(a + spread) * len);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- VHS 颗粒 ---------- */
function drawGrain(){
  if (!grC || !grPat) return;
  grainTick++;
  if (grainTick % 2) return;
  try {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    var ox = (Math.random() * 112) | 0, oy = (Math.random() * 112) | 0;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = grPat;
    ctx.translate(-ox, -oy);
    ctx.fillRect(0, 0, cv.width + 112, cv.height + 112);
    ctx.restore();
  } catch(e){ console.error(e); }
}

function onInitVisual(p){
  var changed = false;
  if (Array.isArray(p.accent) && p.accent.length >= 3){
    changed = Math.abs(accent[0] - PAL.accent[0]) + Math.abs(accent[1] - PAL.accent[1]) +
              Math.abs(accent[2] - PAL.accent[2]) > 26;
  }
  if (changed) schedulePrerender();
}
var preTimer = 0;
function schedulePrerender(){
  if (preTimer) return;
  preTimer = setTimeout(function(){
    preTimer = 0;
    try { prerender(); } catch(e){ console.error(e); }
  }, 260);
}

function size(){
  var w = cv.clientWidth, h = cv.clientHeight;
  if (!isFinite(w) || w <= 0) w = 1440;
  if (!isFinite(h) || h <= 0) h = 900;
  W = w; H = h;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(w * DPR));
  cv.height = Math.max(1, Math.round(h * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  if (curLine >= 0) { try { fitLine(); } catch(e){ console.error(e); } }
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (bgC) ctx.drawImage(bgC, 0, 0, W, H);
  else { ctx.fillStyle = '#0a0410'; ctx.fillRect(0,0,W,H); }
  drawEQ();
  if (fgC) ctx.drawImage(fgC, LAY.fx - LAY.pad, LAY.fy - LAY.pad, LAY.fw + LAY.pad*2, LAY.fh + LAY.pad*2);
  drawBall();
  drawBeams();
  drawGrain();
}

var tcEl = document.getElementById('tc');
var lastTC = -1;
function updateStamp(){
  var q = Math.floor(S.t * 4);
  if (q === lastTC) return;
  lastTC = q;
  var t = S.t > 0 ? S.t : 0;
  var h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = Math.floor(t) % 60;
  tcEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function frame(){
  var t0 = performance.now();
  if (ctx) { try { draw(); } catch(e){ console.error(e); S.err = String(e && e.message || e); } }
  try { updateLyric(); } catch(e){ console.error(e); S.err = String(e && e.message || e); }
  try { updateStamp(); } catch(e){ console.error(e); }
  S.frames++;
  S.js = performance.now() - t0;
  requestAnimationFrame(frame);
}

size();
initEQ();
buildGrain();
window.addEventListener('resize', function(){
  try { size(); schedulePrerender(); } catch(e){ console.error(e); }
});
requestAnimationFrame(function(){
  sendReady();
  frame();
  requestAnimationFrame(function(){
    try { prerender(); } catch(e){ console.error('prerender', e); }
  });
});
setTimeout(sendReady, 900);
setTimeout(sendReady, 1600);
</script>
