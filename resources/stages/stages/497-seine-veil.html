<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>塞纳维</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  :root{ --y:#e9c25c; }
  #stage{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;
         align-items:center;justify-content:center;padding:2.2vh 2vw}
  #plate{width:min(94vw,126vh);display:flex;flex-direction:column}
  #slate{display:flex;justify-content:space-between;align-items:baseline;
         color:#7f7b70;font:500 clamp(7px,.74vw,10px)/1.7 ui-monospace,Consolas,monospace;
         letter-spacing:.30em;text-transform:uppercase;padding:0 .25em 1.0vh;opacity:.8}
  #slate b{color:var(--y);font-weight:600;letter-spacing:.24em}
  #pic{position:relative;width:100%;aspect-ratio:239/100;overflow:hidden;background:#060605;
       box-shadow:0 0 0 1px #141412, 0 18px 44px -26px #000}
  #film{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 50%}
  #grain{position:absolute;inset:-8%;pointer-events:none;opacity:.26;mix-blend-mode:screen;
         background-repeat:repeat;background-size:186px 186px;will-change:background-position,opacity}
  #edge{position:absolute;inset:0;pointer-events:none;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), inset 0 0 70px 18px rgba(0,0,0,.55)}
  #subwrap{width:100%;padding-top:2.7vh;min-height:clamp(50px,11vh,140px);
           display:flex;align-items:flex-start;justify-content:center}
  #sub{max-width:100%;color:var(--y);text-align:center;
       font-family:Georgia,"Times New Roman","Songti SC","Noto Serif CJK SC",SimSun,serif;
       font-weight:500;letter-spacing:.055em;line-height:1.42;
       font-size:clamp(17px,2vw,31px);text-wrap:balance}
  #sub .ch{display:inline-block;opacity:0;transform:translateY(.30em);
           transition:opacity .30s ease, transform .34s cubic-bezier(.18,.78,.28,1)}
  #sub .w{display:inline}
  #sub.empty{color:#8e8878;letter-spacing:.42em;font-size:clamp(10px,1.15vw,15px);
             font-family:ui-monospace,Consolas,monospace;text-shadow:none}
  @media (prefers-reduced-motion: reduce){
    #sub .ch{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="plate">
    <div id="slate"><span><b>◼</b>&nbsp; RIVE GAUCHE · N°7</span><span id="slateR">24 I/S · SÉQ. 3</span></div>
    <div id="pic">
      <canvas id="film"></canvas>
      <div id="grain"></div>
      <div id="edge"></div>
    </div>
    <div id="subwrap"><div id="sub"></div></div>
  </div>
</div>
<script>
(function(){
  'use strict';

  var cv = document.getElementById('film');
  var ctx = cv.getContext('2d');
  var pic = document.getElementById('pic');
  var subEl = document.getElementById('sub');
  var grainEl = document.getElementById('grain');
  var slateR = document.getElementById('slateR');

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, text: '', err: '',
    gl: false, acc: [233, 194, 92], dur: 0,
    rm: !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
  };

  /* __stage 必须无条件在最外层赋值 */
  window.__stage = function(){
    return { lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
             frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm };
  };

  var PW = 1440, PH = 602, sc = 1, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var PADX = 0.055, PADY = 0.075;
  var plate = null, grainURL = '';
  var SEED = 497;

  /* ---------------- 工具 ---------------- */
  function rngMake(a){
    var s = a | 0;
    return function(){
      s = (s * 1664525 + 1013904223) | 0;
      return ((s >>> 8) & 0xffffff) / 16777216;
    };
  }
  function grey(v, a){
    var c = Math.round(Math.max(0, Math.min(1, v)) * 255);
    return 'rgba(' + c + ',' + c + ',' + c + ',' + (a === undefined ? 1 : a) + ')';
  }
  function clampf(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

  /* 把封面主色揉进影院鹅黄，但锁住亮度不让字幕变暗 */
  function accentYellow(a){
    if (!Array.isArray(a) || a.length < 3) return '#e9c25c';
    var r = 233, g = 194, b = 92, w = 0.17;
    r = r * (1 - w) + clampf(Number(a[0]) || 0, 0, 255) * w;
    g = g * (1 - w) + clampf(Number(a[1]) || 0, 0, 255) * w;
    b = b * (1 - w) + clampf(Number(a[2]) || 0, 0, 255) * w;
    var lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    if (lum < 168){ var k = 168 / Math.max(lum, 1); r *= k; g *= k; b *= k; }
    r = clampf(r, 0, 255); g = clampf(g, 0, 255); b = clampf(b, 0, 255);
    return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
  }

  /* ---------------- 场景：天空 ---------------- */
  function sky(g, w, h, rnd){
    var hz = h * 0.548;
    var s1 = g.createLinearGradient(0, 0, 0, hz);
    s1.addColorStop(0, '#c8c8c2');
    s1.addColorStop(0.40, '#e2e1da');
    s1.addColorStop(0.78, '#f4f3ec');
    s1.addColorStop(1, '#fbfaf3');
    g.fillStyle = s1; g.fillRect(0, -h * 0.10, w, hz + h * 0.11);

    for (var i = 0; i < 10; i++){
      var cx = rnd() * w, cy = hz * (0.07 + rnd() * 0.66);
      var rx = w * (0.10 + rnd() * 0.28), ry = h * (0.010 + rnd() * 0.042);
      var rg = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, 1));
      var a = 0.09 + rnd() * 0.17;
      rg.addColorStop(0, 'rgba(255,255,252,' + a.toFixed(3) + ')');
      rg.addColorStop(0.62, 'rgba(255,255,252,' + (a * 0.32).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(255,255,252,0)');
      g.fillStyle = rg;
      g.save(); g.translate(cx, cy); g.scale(1, Math.max(ry, 1) / Math.max(rx, 1));
      g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill(); g.restore();
    }
    var sg = g.createRadialGradient(w * 0.618, hz * 0.95, 0, w * 0.618, hz * 0.95, h * 0.44);
    sg.addColorStop(0, 'rgba(255,255,250,0.88)');
    sg.addColorStop(0.34, 'rgba(255,255,250,0.38)');
    sg.addColorStop(1, 'rgba(255,255,250,0)');
    g.fillStyle = sg; g.fillRect(0, 0, w, hz + 2);
  }

  /* ---------------- 场景：屋顶线 ---------------- */
  function skyline(g, w, h, rnd){
    var hz = h * 0.548;
    var x = -w * 0.03, n = 0;
    while (x < w * 1.03 && n < 70){
      n++;
      var bw = w * (0.017 + rnd() * 0.050);
      var bh = h * (0.012 + rnd() * 0.044);
      g.fillStyle = grey(0.50 + rnd() * 0.16);
      g.fillRect(x, hz - bh, bw, bh + 2);
      if (rnd() > 0.34){
        g.beginPath();
        g.moveTo(x - bw * 0.04, hz - bh);
        g.lineTo(x + bw * 0.5, hz - bh - bh * (0.28 + rnd() * 0.24));
        g.lineTo(x + bw * 1.04, hz - bh);
        g.closePath(); g.fill();
      }
      var chim = rnd() > 0.52 ? 2 : 1;
      for (var c = 0; c < chim; c++){
        g.fillRect(x + bw * (0.13 + 0.52 * c), hz - bh - h * 0.019,
                   Math.max(1, w * 0.0031), h * 0.019);
      }
      x += bw + w * (0.0012 + rnd() * 0.006);
    }
    var dx = w * 0.672, dy = hz - h * 0.046, dr = w * 0.019;
    g.fillStyle = grey(0.44);
    g.fillRect(dx - dr * 1.6, hz - h * 0.046, dr * 3.2, h * 0.050);
    g.beginPath(); g.ellipse(dx, dy, dr, dr * 0.94, 0, Math.PI, 0); g.fill();
    g.fillRect(dx - dr * 0.09, dy - dr * 1.6, Math.max(1.2, w * 0.0033), dr * 1.0);
    g.fillStyle = grey(0.60);
    g.fillRect(0, hz, w, h * 0.010);
    var hzG = g.createLinearGradient(0, hz - h * 0.16, 0, hz + h * 0.006);
    hzG.addColorStop(0, 'rgba(248,247,240,0)');
    hzG.addColorStop(0.70, 'rgba(248,247,240,0.36)');
    hzG.addColorStop(1, 'rgba(248,247,242,0.64)');
    g.fillStyle = hzG; g.fillRect(0, hz - h * 0.16, w, h * 0.17);
  }

  /* ---------------- 场景：河面（静态底） ---------------- */
  function river(g, w, h, rnd){
    var hz = h * 0.548, y0 = hz + h * 0.003, y1 = h * 1.02;
    var wg = g.createLinearGradient(0, y0, 0, y1);
    wg.addColorStop(0, '#d2d1c9');
    wg.addColorStop(0.14, '#b4b3a9');
    wg.addColorStop(0.52, '#84837a');
    wg.addColorStop(1, '#4e4d47');
    g.fillStyle = wg; g.fillRect(0, y0, w, y1 - y0);

    for (var i = 0; i < 120; i++){
      var p = Math.pow(rnd(), 0.55);
      var y = y0 + (y1 - y0) * p;
      var s = (y - y0) / Math.max(y1 - y0, 1);
      var len = w * (0.008 + rnd() * 0.085) * (0.35 + s);
      var xx = rnd() * w - len * 0.5;
      g.fillStyle = rnd() > 0.42 ? 'rgba(255,255,248,' + (0.03 + rnd() * 0.15).toFixed(3) + ')'
                                 : 'rgba(30,30,27,'   + (0.03 + rnd() * 0.10).toFixed(3) + ')';
      g.fillRect(xx, y, len, Math.max(0.7, h * (0.0015 + rnd() * 0.0034)));
    }
    var sx = w * 0.615;
    for (var k = 0; k < 34; k++){
      var sq = Math.pow(rnd(), 0.7);
      var yy = y0 + (y1 - y0) * sq * 0.66;
      var ww = w * (0.012 + rnd() * 0.05) * (0.4 + sq);
      var x2 = sx + (rnd() - 0.5) * w * 0.19 * (0.3 + sq);
      g.fillStyle = 'rgba(255,255,250,' + (0.05 + rnd() * 0.18).toFixed(3) + ')';
      g.fillRect(x2 - ww * 0.5, yy, ww, Math.max(0.8, h * 0.0021));
    }
  }

  /* ---------------- 场景：石桥 ---------------- */
  function bridge(g, w, h, rnd){
    var deckY = h * 0.640, deckH = h * 0.029;
    var x0 = -w * 0.02, x1 = w * 0.858;
    var ink = '#111110';

    g.fillStyle = ink;
    var piers = [0.150, 0.412, 0.672];
    for (var i = 0; i < piers.length; i++){
      var px = w * piers[i];
      g.fillRect(px, deckY + deckH * 0.9, w * 0.019, h * 0.19);
      g.beginPath();
      g.moveTo(px - w * 0.011, deckY + deckH);
      g.lineTo(px + w * 0.030, deckY + deckH);
      g.lineTo(px + w * 0.019, deckY + h * 0.205);
      g.lineTo(px, deckY + h * 0.205);
      g.closePath(); g.fill();
    }
    var railY = deckY - h * 0.080;
    g.strokeStyle = ink; g.lineWidth = Math.max(1, h * 0.0044);
    g.beginPath(); g.moveTo(x0, railY); g.lineTo(x1, railY); g.stroke();
    g.lineWidth = Math.max(0.8, h * 0.0026);
    var posts = 44;
    for (var p = 0; p < posts; p++){
      var bx = x0 + (x1 - x0) * (p / (posts - 1));
      g.beginPath(); g.moveTo(bx, railY); g.lineTo(bx, deckY - h * 0.006); g.stroke();
    }
    g.fillStyle = ink;
    g.fillRect(x0, deckY - h * 0.006, x1 - x0, deckH);
    g.fillStyle = 'rgba(246,245,237,0.50)';
    g.fillRect(x0, deckY - h * 0.0090, x1 - x0, Math.max(1, h * 0.0024));
    for (var L = 0; L < 2; L++){
      var lx = w * (0.243 + L * 0.333);
      g.fillStyle = ink;
      g.fillRect(lx, railY - h * 0.072, Math.max(1.5, w * 0.0034), h * 0.075);
    }
  }

  /* ---------------- 场景：前景遮挡 + 暗角 ---------------- */
  function foreground(g, w, h, rnd){
    function blob(cx, cy, rx, ry, a){
      var rg = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, 1));
      rg.addColorStop(0, 'rgba(7,7,6,' + a.toFixed(3) + ')');
      rg.addColorStop(0.55, 'rgba(7,7,6,' + (a * 0.70).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(7,7,6,0)');
      g.fillStyle = rg;
      g.save(); g.translate(cx, cy); g.scale(1, Math.max(ry, 1) / Math.max(rx, 1));
      g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill(); g.restore();
    }
    blob(-w * 0.01, h * 1.03, w * 0.30, h * 0.40, 0.88);
    blob(w * 0.105, h * 1.07, w * 0.15, h * 0.25, 0.60);
    blob(w * 1.01, h * 1.01, w * 0.19, h * 0.30, 0.58);
    var vg = g.createRadialGradient(w * 0.5, h * 0.44, h * 0.19, w * 0.5, h * 0.5, h * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.60, 'rgba(0,0,0,0.15)');
    vg.addColorStop(1, 'rgba(0,0,0,0.74)');
    g.fillStyle = vg; g.fillRect(0, 0, w, h);
  }

  function florets(g, w, h, rnd){
    for (var i = 0; i < 14; i++){
      var x = rnd() * w, y0 = rnd() * h, len = h * (0.01 + rnd() * 0.055);
      g.strokeStyle = 'rgba(255,255,246,' + (0.04 + rnd() * 0.12).toFixed(3) + ')';
      g.lineWidth = Math.max(0.6, w * (0.0004 + rnd() * 0.0010));
      g.beginPath(); g.moveTo(x, y0); g.lineTo(x + (rnd() - 0.5) * w * 0.004, y0 + len); g.stroke();
    }
    for (var d = 0; d < 22; d++){
      g.fillStyle = 'rgba(22,22,20,' + (0.08 + rnd() * 0.20).toFixed(3) + ')';
      g.beginPath();
      g.arc(rnd() * w, rnd() * h, w * (0.0008 + rnd() * 0.0020), 0, 6.2832);
      g.fill();
    }
  }

  /* ---------------- 颗粒贴图（一次性，CSS 层滚动） ---------------- */
  function buildGrain(){
    var n = 170;
    var c = document.createElement('canvas'); c.width = n; c.height = n;
    var g2 = c.getContext('2d');
    var img = g2.createImageData(n, n), d = img.data, r = rngMake(9173);
    for (var i = 0; i < d.length; i += 4){
      var v = 128 + (r() - 0.5) * 235;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 24;
    }
    g2.putImageData(img, 0, 0);
    try { grainURL = c.toDataURL('image/png'); } catch (e){ console.error('[497] grain', e); }
    if (grainURL) grainEl.style.backgroundImage = 'url(' + grainURL + ')';
  }

  /* ---------------- 烘焙 ---------------- */
  var bakeScale = 1;
  function buildPlate(){
    var w = Math.max(160, PW), h = Math.max(60, PH);
    bakeScale = clampf(sc, 0.6, 1.5);
    var bw = Math.max(64, Math.round(w * (1 + 2 * PADX) * bakeScale));
    var bh = Math.max(48, Math.round(h * (1 + 2 * PADY) * bakeScale));
    if (!plate) plate = document.createElement('canvas');
    plate.width = bw; plate.height = bh;
    var g = plate.getContext('2d');
    var rnd = rngMake(SEED);
    g.setTransform(bakeScale, 0, 0, bakeScale, 0, 0);
    g.clearRect(0, 0, w * (1 + 2 * PADX), h * (1 + 2 * PADY));
    g.translate(w * PADX, h * PADY);
    g.fillStyle = '#0a0a09'; g.fillRect(-w * PADX, -h * PADY, w * (1 + 2 * PADX), h * (1 + 2 * PADY));
    sky(g, w, h, rnd);
    skyline(g, w, h, rnd);
    river(g, w, h, rnd);
    bridge(g, w, h, rnd);
    foreground(g, w, h, rnd);
    florets(g, w, h, rnd);
  }

  /* ---------------- 尺寸 ---------------- */
  function size(){
    var r = pic.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height);
    if (!(w > 0) || !isFinite(w)) w = 1440;
    if (!(h > 0) || !isFinite(h)) h = 602;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    // 控制回读像素量，保证 165Hz 下 JS + 合成有余量
    var budget = 1900000;
    var s = Math.min(dpr, 1.6, Math.sqrt(budget / Math.max(w * h, 1)));
    sc = clampf(s, 0.55, 1.6);
    PW = w; PH = h;
    cv.width = Math.max(2, Math.round(w * sc));
    cv.height = Math.max(2, Math.round(h * sc));
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    buildPlate();
    fitText();
  }

  /* ---------------- 场景动态元素 ---------------- */
  function drawWater(t, amp, kickA){
    var w = PW, h = PH;
    var hz = h * 0.556, bottom = h * 1.02;
    var band = bottom - hz;
    var r = rngMake(2411 + (S.frames >> 1) * 131);
    ctx.save();
    var n = 30;
    for (var i = 0; i < n; i++){
      var s = Math.pow(r(), 0.62);
      var y = hz + band * s;
      var ph = t * (0.45 + 1.35 * s) + s * 41.7 + i * 2.13;
      var x = (Math.sin(ph) * 0.5 + 0.5) * w * 1.16 - w * 0.08;
      var len = w * (0.020 + 0.085 * s) * (0.7 + 0.3 * Math.sin(ph * 1.7));
      var tw = 0.45 + 0.55 * Math.sin(ph * 2.3 + 1.1);
      var a = (0.045 + 0.155 * s) * tw * (0.75 + amp * 0.55);
      ctx.fillStyle = a > 0 ? 'rgba(255,253,242,' + a.toFixed(3) + ')'
                           : 'rgba(24,24,21,' + (-a * 0.5).toFixed(3) + ')';
      ctx.fillRect(x, y, Math.max(2, len), Math.max(0.9, h * (0.0016 + 0.0032 * s)));
    }
    // 鼓点：水面被一道亮痕扫过
    if (kickA > 0.02){
      var gy = hz + band * 0.24;
      var gg = ctx.createLinearGradient(0, gy - h * 0.05, 0, gy + h * 0.10);
      gg.addColorStop(0, 'rgba(255,253,242,0)');
      gg.addColorStop(0.45, 'rgba(255,253,242,' + (kickA * 0.16).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(255,253,242,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(0, gy - h * 0.05, w, h * 0.15);
    }
    ctx.restore();
  }

  function person(cx, footY, hgt, ph, dir, alpha){
    ctx.save();
    ctx.globalAlpha = clampf(alpha === undefined ? 1 : alpha, 0, 1);
    ctx.fillStyle = '#0b0b09';
    ctx.strokeStyle = '#0b0b09';
    ctx.lineCap = 'round';
    var sw = Math.sin(ph), sw2 = Math.sin(ph + Math.PI * 0.94);
    ctx.lineWidth = hgt * 0.050;
    ctx.beginPath();
    ctx.moveTo(cx, footY - hgt * 0.46);
    ctx.quadraticCurveTo(cx + dir * sw * hgt * 0.05, footY - hgt * 0.22,
                         cx + dir * sw * hgt * 0.135, footY - hgt * 0.010);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, footY - hgt * 0.46);
    ctx.quadraticCurveTo(cx + dir * sw2 * hgt * 0.05, footY - hgt * 0.22,
                         cx + dir * sw2 * hgt * 0.120, footY - hgt * 0.006);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - hgt * 0.070, footY - hgt * 0.778);
    ctx.lineTo(cx + hgt * 0.068, footY - hgt * 0.778);
    ctx.quadraticCurveTo(cx + hgt * 0.096, footY - hgt * 0.53, cx + hgt * 0.058, footY - hgt * 0.40);
    ctx.lineTo(cx - hgt * 0.054, footY - hgt * 0.40);
    ctx.quadraticCurveTo(cx - hgt * 0.092, footY - hgt * 0.56, cx - hgt * 0.070, footY - hgt * 0.778);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = hgt * 0.038;
    ctx.beginPath();
    ctx.moveTo(cx - dir * hgt * 0.028, footY - hgt * 0.748);
    ctx.quadraticCurveTo(cx - dir * hgt * 0.074, footY - hgt * 0.62,
                         cx - dir * hgt * 0.038 + dir * sw2 * hgt * 0.034, footY - hgt * 0.50);
    ctx.stroke();
    ctx.fillRect(cx - hgt * 0.017, footY - hgt * 0.822, hgt * 0.034, hgt * 0.06);
    ctx.beginPath();
    ctx.ellipse(cx + dir * hgt * 0.004, footY - hgt * 0.886, hgt * 0.046, hgt * 0.054, 0, 0, 6.2832);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + dir * hgt * 0.001, footY - hgt * 0.906, hgt * 0.049, hgt * 0.039,
                0, Math.PI * 0.98, Math.PI * 2.02);
    ctx.fill();
    ctx.restore();
  }

  function drawFigures(t){
    var h = PH, w = PW;
    var walk = t * 2.35;
    var drift = Math.sin(t * 0.17) * 0.006;
    var baseX = w * (0.332 + drift);
    // 双重曝光：留两道残影
    person(baseX - w * 0.006, h * 0.629, h * 0.317, walk - 0.55, 1, 0.10);
    person(baseX + w * 0.005, h * 0.629, h * 0.315, walk - 0.28, 1, 0.14);
    person(baseX, h * 0.629, h * 0.317, walk, 1, 1);
    // 靠着栏杆望水的人
    person(w * 0.588, h * 0.623, h * 0.236, 1.2 + Math.sin(t * 0.5) * 0.05, -1, 1);
    // 远处小剪影
    person(w * 0.742, h * 0.621, h * 0.148, walk * 0.8 + 1.9, 1, 0.82);
  }

  /* ---------------- 歌词 ---------------- */
  var spans = [], revealAt = [], shown = 0, lineT = 0, tickSeen = false;

  function setLine(i){
    var L = (i >= 0 && S.lines[i]) ? S.lines[i] : null;
    S.idx = i;
    var txt = L && typeof L.text === 'string' ? L.text : '';
    S.text = txt;
    spans = []; revealAt = []; shown = 0;
    lineT = L ? L.t : 0;
    subEl.className = '';
    subEl.innerHTML = '';
    if (!txt){
      if (!S.lines.length){
        subEl.className = 'empty';
        subEl.textContent = '— 本场无字幕 —';
      }
      return;
    }
    var n = Math.min(txt.length, 200);
    var truncated = txt.length > n;
    var frag = document.createDocumentFragment();
    for (var k = 0; k < n; k++){
      var c = txt.charAt(k);
      if (c === ' ' || c === '\u3000'){
        var sp = document.createElement('span'); sp.className = 'w';
        sp.appendChild(document.createTextNode('\u00a0'));
        frag.appendChild(sp); continue;
      }
      var el = document.createElement('span');
      el.className = 'ch';
      el.textContent = c;
      frag.appendChild(el);
      spans.push(el);
    }
    if (truncated){
      var dl = document.createElement('span'); dl.className = 'ch'; dl.textContent = '…';
      frag.appendChild(dl); spans.push(dl);
    }
    subEl.appendChild(frag);

    // 按字符视觉宽度排时间：中文 1，拉丁 0.56
    var total = Math.min(spans.length, 200);
    var st = L.t, en = st + ((L.dur > 0.05) ? L.dur : Math.max(1.1, total * 0.16));
    var chars = L.chars;
    var wts = [], sum = 0;
    for (var q = 0; q < total; q++){
      var cc = spans[q] ? spans[q].textContent : '';
      var wv = /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef]/.test(cc) ? 1 : 0.56;
      wts.push(wv); sum += wv;
    }
    if (!(sum > 0)) sum = 1;
    var acc = 0;
    for (var j = 0; j < total; j++){
      var when = -1;
      if (chars && chars.length){
        var ci = Math.min(j, chars.length - 1);
        var ct = chars[ci] ? Number(chars[ci].t) : NaN;
        if (isFinite(ct) && ct > 0) when = ct;
      }
      if (when < 0) when = st + (en - st) * (acc / sum);
      acc += wts[j];
      revealAt.push(Math.min(when, st + 30));
    }
    fitText();
  }

  function fitText(){
    subEl.style.fontSize = '';
    var maxH = Math.max(46, window.innerHeight * 0.215);
    var base = parseFloat(window.getComputedStyle(subEl).fontSize) || 22;
    var cur = base, guard = 0;
    while (subEl.scrollHeight > maxH && cur > 11 && guard < 18){
      cur -= 1.4; guard++;
      subEl.style.fontSize = cur.toFixed(1) + 'px';
    }
  }

  function findIdx(t){
    var lo = 0, hi = S.lines.length - 1, best = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (S.lines[mid].t <= t + 0.001){ best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  function onTick(tm){
    var t = (typeof tm === 'number' && isFinite(tm)) ? tm : 0;
    tickSeen = true;
    S.t = t;
    var i = findIdx(t);
    if (i !== S.idx) cut(i);
  }

  /* ---------------- 动效状态 ---------------- */
  var kick = 0, flash = 0, camJump = 0, grainTick = 0, lastNow = 0, wallT = 0, jumpUntil = -1;
  var cutN = 0;

  function cut(i){
    var changed = i !== S.idx;
    if (changed){
      cutN++;
      camJump = ((cutN * 7919) % 13) / 13 - 0.5;
      if (!S.rm) flash = Math.min(1, flash + 0.30);
      setLine(i);
    }
  }

  function beat(level){
    var lv = (typeof level === 'number' && isFinite(level)) ? clampf(level, 0, 1) : 0.6;
    if (S.rm) return;
    kick = Math.min(1, kick + 0.30 + lv * 0.55);
    if (lv > 0.6) flash = Math.min(1, flash + 0.32);
  }

  /* ---------------- 主循环 ---------------- */
  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({__c100: 1, type: 'ready'}, '*'); }
    catch (e){ console.error('[497] ready', e); }
  }

  function paintSub(){
    var n = spans.length;
    if (!n) return;
    // 还没收到任何 tick：把当前句整句亮出，保证首帧就认得出字
    if (!tickSeen){
      while (shown < n){
        var ea = spans[shown];
        if (ea){ ea.style.opacity = '1'; ea.style.transform = 'translateY(0)'; }
        shown++;
      }
      return;
    }
    var t = S.t;
    if (revealAt.length === n){
      while (shown < n && revealAt[shown] <= t + 0.001){
        var el = spans[shown];
        if (el){ el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }
        shown++;
      }
    }
  }

  function frame(now){
    var t0 = performance.now();
    S.frames++;
    if (S.frames === 1) sendReady();
    try {
      var step = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
      lastNow = now;
      wallT += isFinite(step) ? step : 0;
      // 没有 tick 时用墙上时间推动镜头，画面不会死
      var t = tickSeen ? S.t : wallT;
      var live = S.rm ? 0.35 : 1;

      if (kick > 0.002) kick *= 0.895; else kick = 0;
      if (flash > 0.004) flash *= 0.87; else flash = 0;

      // 摄影机：极慢的推轨 + 门线晃动 + 鼓点冲击
      var zoom = 1.004
        + (Math.sin(t * 0.077) * 0.5 + 0.5) * 0.014 * live
        + kick * 0.017;
      var weaveX = (Math.sin(t * 1.7) * 0.0009 + Math.sin(t * 0.31 + 2.1) * 0.0016) * live;
      var weaveY = (Math.cos(t * 1.35) * 0.0007 + Math.sin(t * 0.23) * 0.0013) * live;
      var dx = (weaveX + camJump * 0.009) * PW;
      var dy = weaveY * PH;

      ctx.setTransform(sc, 0, 0, sc, 0, 0);
      ctx.fillStyle = '#060605';
      ctx.fillRect(0, 0, PW, PH);
      ctx.translate(PW * 0.5 + dx, PH * 0.5 + dy);
      ctx.scale(zoom, zoom);
      ctx.translate(-PW * 0.5, -PH * 0.5);

      if (plate){
        ctx.drawImage(plate,
          -PW * PADX, -PH * PADY,
          PW * (1 + 2 * PADX), PH * (1 + 2 * PADY));
      }
      drawWater(t, kick, kick);
      drawFigures(t);

      // 曝光：鼓点闪白 / 片门轻微压暗
      if (flash > 0.004){
        ctx.fillStyle = 'rgba(255,252,238,' + (flash * 0.13).toFixed(3) + ')';
        ctx.fillRect(-PW * PADX, -PH * PADY, PW * (1 + 2 * PADX), PH * (1 + 2 * PADY));
      }
      var dip = (Math.sin(t * 5.3) * 0.5 + 0.5) * 0.05 * live;
      if (dip > 0.004){
        ctx.fillStyle = 'rgba(0,0,0,' + dip.toFixed(3) + ')';
        ctx.fillRect(-PW * PADX, -PH * PADY, PW * (1 + 2 * PADX), PH * (1 + 2 * PADY));
      }
      ctx.setTransform(sc, 0, 0, sc, 0, 0);

      paintSub();

      // 颗粒层只改样式，不进画布
      if (S.frames - grainTick >= 3){
        grainTick = S.frames;
        var gx = (Math.sin(S.frames * 12.9898) * 43758.5453) % 1;
        var gy = (Math.sin(S.frames * 78.233) * 12345.6789) % 1;
        grainEl.style.backgroundPosition = ((gx * 186) | 0) + 'px ' + ((gy * 186) | 0) + 'px';
        grainEl.style.opacity = (0.20 + (0.09 * (0.5 + 0.5 * Math.sin(t * 2.2)))).toFixed(3);
        // 每 ~0.9s 一次机械跳帧，模仿放映机
        if (!S.rm && S.frames % 54 === 0){
          var jx = ((S.frames * 37) % 5 - 2) * 0.9;
          var jy = ((S.frames * 11) % 3 - 1) * 1.1;
          cv.style.transform = 'translate(' + jx.toFixed(1) + 'px,' + jy.toFixed(1) + 'px)';
          jumpUntil = S.frames + 2;
        } else if (S.frames >= jumpUntil && cv.style.transform){
          cv.style.transform = '';
        }
      }
    } catch (e){
      S.err = String((e && e.message) || e);
      console.error('[497] frame', e);
    }
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  /* ---------------- 消息 ---------------- */
  function onMsg(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init'){
        var p = d.payload || {};
        var raw = Array.isArray(p.lines) ? p.lines : [];
        var arr = [];
        for (var i = 0; i < Math.min(raw.length, 3000); i++){
          var l = raw[i];
          if (!l || typeof l !== 'object') continue;
          var lt = Number(l.t);
          var ld = Number(l.dur);
          arr.push({
            t: isFinite(lt) ? Math.max(0, lt) : 0,
            dur: (isFinite(ld) && ld > 0) ? ld : 0,
            text: typeof l.text === 'string' ? l.text : '',
            chars: Array.isArray(l.chars) ? l.chars : null
          });
        }
        arr.sort(function(a, b){ return a.t - b.t; });
        // 拿相邻句推出真实句长，避免一句挂太久导致逐字不推进
        for (var q = 0; q < arr.length; q++){
          if (!(arr[q].dur > 0)){
            var nx = arr[q + 1];
            if (nx && nx.t > arr[q].t) arr[q].dur = Math.min(9, nx.t - arr[q].t);
            else arr[q].dur = 3.2;
          }
        }
        S.lines = arr;
        var dur = Number(p.duration);
        S.dur = (isFinite(dur) && dur > 0) ? dur : 0;

        var songName = p.song && typeof p.song.name === 'string' ? p.song.name : '';
        var artists = p.song ? p.song.artists : '';
        if (Array.isArray(artists)) artists = artists.join(' / ');
        if (typeof artists !== 'string') artists = '';
        var label = [];
        if (songName) label.push(songName);
        if (artists.trim()) label.push(artists.trim());
        slateR.textContent = label.length
          ? label.join('  ·  ').slice(0, 34).toUpperCase()
          : '24 I/S · SÉQ. 3';

        var cs = accentYellow(p.accent);
        document.documentElement.style.setProperty('--y', cs);

        S.acc = Array.isArray(p.accent) ? p.accent : S.acc;
        cutN = 0; camJump = 0;
        S.idx = -2;
        cut(findIdx(S.t));
      } else if (d.type === 'tick'){
        if (d.payload){
          if (d.payload.playing !== undefined) S.playing = !!d.payload.playing;
          onTick(d.payload.time);
        }
      } else if (d.type === 'beat'){
        beat(d.payload ? d.payload.level : 0.6);
      }
    } catch (e){
      S.err = String((e && e.message) || e);
      console.error('[497] msg', e);
    }
  }

  /* ---------------- 启动 ---------------- */
  window.addEventListener('message', onMsg);
  var rzT = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rzT);
    rzT = setTimeout(function(){
      try { size(); } catch (e){ S.err = String((e && e.message) || e); console.error('[497] resize', e); }
    }, 90);
  });

  try { buildGrain(); } catch (e){ console.error('[497] grain init', e); }
  try { size(); } catch (e){ S.err = String((e && e.message) || e); console.error('[497] size', e); }
  requestAnimationFrame(frame);
  setTimeout(sendReady, 650);
})();
</script>
</body>
