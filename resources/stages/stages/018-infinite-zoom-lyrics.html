<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无限缩放</title>
<style>
  html,body{margin:0;height:100%;background:#05070b;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(118% 96% at 50% 46%,transparent 34%,rgba(3,5,10,.52) 74%,rgba(1,2,5,.95))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(198,210,235,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   Lyra 通用骨架（构建期拼进每个 stage 的自包含 HTML，不是外部依赖）
   ----------------------------------------------------------------------------
   机制文件需要实现（名字固定）：
     mechResize()                   resize 之后调用一次（此时 W/H 有效）
     mechAssign(use)                换句时调用；use = {g, spans, at, cc, lineT, lineDur}
     mechUpdate(dt, T)              每帧物理（dt 已经扣掉顿帧）
     mechDraw(T, z, pjX, pjY)       每帧绘制（背景已画好，直接在 ctx 上画）
   可选钩子：
     mechInit()                     模块初始化（W/H 还是 0，别在这里用 W/H 撒点）
     mechEvent(k, first)            词团命中后调用（默认的顿帧/白闪/变焦/震动已经做了）
   可直接用：
     W H DPR ctx cv hint
     cam {x,y,ox,oy,z,tz,vz,rot,vrot,sh,shx,shy}   ox/oy 是镜头平移偏移（甩镜/环绕用）
     AE {freeze,flash}
     lines curIdx L spans charChars charGlow blockGx blockGy lineT lineDur accent
     rnd(a,b) clamp01(v) hitStop(s) flash(v) camShake(dx,dy,amp)
   ========================================================================== */

/* ============================ 0 · 画布 ============================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
let bgCv = null;
let L = null, curIdx = -1;

/* ============================ 1 · 时钟 ============================ */
let lines = [];
let accent = [186, 206, 255];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ============================ 2 · 分词 ============================ */
let DICT = null;
fetch('/segdict.bin').then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); }).catch(() => {});
const fnv = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function isWord(s, i, Ln) {
  if (!DICT) return false;
  const h = fnv(s.substr(i, Ln));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = DICT[m]; if (v === h) return true; if (v < h) lo = m + 1; else hi = m - 1; }
  return false;
}
function segWords(text) {
  const fwd = [];
  for (let i = 0; i < text.length;) {
    let hit = 0;
    for (let Ln = Math.min(4, text.length - i); Ln >= 2; Ln--) if (isWord(text, i, Ln)) { hit = Ln; break; }
    if (hit) { fwd.push(text.substr(i, hit)); i += hit; } else { fwd.push(text[i]); i++; }
  }
  const bwd = [];
  for (let j = text.length; j > 0;) {
    let hit = 0;
    for (let Ln = Math.min(4, j); Ln >= 2; Ln--) if (isWord(text, j - Ln, Ln)) { hit = Ln; break; }
    if (hit) { bwd.unshift(text.substr(j - hit, hit)); j -= hit; } else { bwd.unshift(text[j - 1]); j--; }
  }
  return fwd.length <= bwd.length ? fwd : bwd;
}
const MAXG = 3;
const PUNCT = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】"]/;
const SPACE = /\s/;
function isLatin(text) { let la = 0, cjk = 0; for (let i = 0; i < text.length; i++) { const c = text[i]; if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++; else if (c >= '\u4e00' && c <= '\u9fff') cjk++; } return la > cjk; }
function latinSpans(text) {
  const out = []; let i = 0;
  while (i < text.length) {
    if (SPACE.test(text[i])) { i++; continue; }
    let j = i; while (j < text.length && !SPACE.test(text[j])) j++;
    out.push({ i0: i, i1: j }); i = j;
  }
  return out;
}
const SUFFIX = /^[的了着过地得吗呢吧啊嘛]$/;
const PREFIX = /^[但还就才又也都把被在从向对和与而却很不没最更将已曾让给]$/;
const countChars = (s) => { let n = 0; for (let i = 0; i < s.length; i++) if (!PUNCT.test(s[i]) && !SPACE.test(s[i])) n++; return n; };
function groupByWords(text) {
  const words = segWords(text), out = [];
  let cur = '', start = 0, chars = 0, pos = 0;
  const flush = (end) => { if (cur) { out.push({ i0: start, i1: end }); cur = ''; chars = 0; } };
  for (const w of words) {
    const at = pos; pos += w.length;
    const isP = PUNCT.test(w);
    if (!cur) { cur = w; start = at; chars = isP ? 0 : w.length; continue; }
    if (isP) { cur += w; if (chars >= 2) flush(pos); continue; }
    const single = w.length === 1;
    if (single && SUFFIX.test(w)) { cur += w; chars++; if (chars >= MAXG) flush(pos); continue; }
    if (single && PREFIX.test(w) && chars >= 2) { flush(at); cur = w; start = at; chars = 1; continue; }
    if (chars + w.length <= MAXG) { cur += w; chars += w.length; } else { flush(at); cur = w; start = at; chars = w.length; }
  }
  flush(text.length);
  for (let k = 0; k < out.length; k++) {
    const g = out[k];
    if (countChars(text.slice(g.i0, g.i1)) > 1) continue;
    const prev = out[k - 1], next = out[k + 1];
    if (prev && prev.i1 === g.i0 && countChars(text.slice(prev.i0, prev.i1)) < MAXG) { prev.i1 = g.i1; out.splice(k, 1); k--; }
    else if (next && next.i0 === g.i1 && countChars(text.slice(next.i0, next.i1)) < MAXG) { next.i0 = g.i0; out.splice(k, 1); k--; }
  }
  return out;
}
function groupByRule(text) {
  const out = []; let start = 0, chars = 0;
  for (let i = 0; i < text.length; i++) {
    const s = PUNCT.test(text[i]) || SPACE.test(text[i]);
    if (!s) chars++;
    if (s && chars >= 2) { out.push({ i0: start, i1: i + 1 }); start = i + 1; chars = 0; continue; }
    if (!s && chars > MAXG) { out.push({ i0: start, i1: i }); start = i; chars = 1; }
  }
  if (start < text.length) out.push({ i0: start, i1: text.length });
  return out;
}
const spansForLine = (t) => (isLatin(t) ? latinSpans(t) : (DICT ? groupByWords(t) : groupByRule(t)));

/* ============================ 3 · 字形采样 ============================ */
const offCv = document.createElement('canvas');
const octx = offCv.getContext('2d', { willReadFrequently: true });
const FONT = (px, wt) => `${wt || 800} ${px}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
function wrapText(text, fs, maxW, wt) {
  octx.font = FONT(fs, wt);
  const latin = isLatin(text);
  const rows = []; let start = 0, w = 0;
  for (let i = 0; i < text.length; i++) {
    const cw = octx.measureText(text[i]).width;
    if (!cw) continue;
    if (w + cw > maxW && i > start) {
      let brk = i;
      if (latin) { let j = i; while (j > start && !SPACE.test(text[j])) j--; if (j > start) brk = j; }
      rows.push({ i0: start, i1: brk, w: octx.measureText(text.slice(start, brk)).width });
      start = brk; w = 0;
      while (start < text.length && SPACE.test(text[start])) start++;
      if (start >= text.length) break;
      i = start - 1; continue;
    }
    w += cw;
  }
  if (start < text.length) rows.push({ i0: start, i1: text.length, w: octx.measureText(text.slice(start)).width });
  for (const r of rows) while (r.i1 - r.i0 > 1 && SPACE.test(text[r.i0])) r.i0++;
  return rows.length ? rows : [{ i0: 0, i1: text.length, w: octx.measureText(text).width }];
}
function sampleGlyph(text, opt) {
  opt = opt || {};
  const wt = opt.weight || 800;
  let fs = opt.fs || 92;
  const maxW = opt.maxW || Math.min(W * 0.78, 1180);
  const maxH = opt.maxH || H * 0.52;
  let rows = wrapText(text, fs, maxW, wt);
  let lh = fs * 1.16;
  if (rows.length * lh > maxH) { fs *= maxH / (rows.length * lh); rows = wrapText(text, fs, maxW, wt); lh = fs * 1.16; }
  octx.font = FONT(fs, wt);
  const widest = Math.max(1, ...rows.map((r) => octx.measureText(text.slice(r.i0, r.i1)).width));
  const padW = Math.ceil(widest) + 24, padH = Math.ceil(lh * rows.length) + 12;
  offCv.width = padW; offCv.height = padH;
  octx.font = FONT(fs, wt);
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.clearRect(0, 0, padW, padH);
  const n = text.length;
  const charCx = new Float32Array(n), charCy = new Float32Array(n);
  const rowMaps = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], str = text.slice(row.i0, row.i1);
    const cy = padH / 2 + (r - (rows.length - 1) / 2) * lh;
    octx.fillText(str, padW / 2, cy);
    const x0 = (padW - row.w) / 2, map = new Int16Array(padW).fill(-1);
    let acc = 0;
    for (let i = row.i0; i < row.i1; i++) {
      const cw = octx.measureText(text[i]).width;
      charCx[i] = x0 + acc + cw / 2 - padW / 2; charCy[i] = cy - padH / 2;
      for (let x = Math.max(0, Math.floor(x0 + acc)); x < Math.min(padW, Math.ceil(x0 + acc + cw)); x++) map[x] = i;
      acc += cw;
    }
    rowMaps.push({ y0: cy - lh / 2, y1: cy + lh / 2, map });
  }
  const d = octx.getImageData(0, 0, padW, padH).data;
  const pxA = [], pyA = [], ownA = [];
  const step = opt.step || 2;
  for (let y = 0; y < padH; y += step) {
    let rm = null;
    for (let r = 0; r < rowMaps.length; r++) { const m = rowMaps[r]; if (y >= m.y0 && y < m.y1) { rm = m; break; } }
    if (!rm) continue;
    const map = rm.map, base = y * padW;
    for (let x = 0; x < padW; x += step) {
      if (d[(base + x) * 4 + 3] <= 128) continue;
      const c = map[x]; if (c < 0) continue;
      pxA.push(x - padW / 2); pyA.push(y - padH / 2); ownA.push(c);
    }
  }
  return { px: Float32Array.from(pxA), py: Float32Array.from(pyA), own: Int16Array.from(ownA),
           pc: pxA.length, n, charCx, charCy, fs, w: widest, h: lh * rows.length, rows: rows.length, padW, padH };
}

/* ============================ 4 · 句索引 / 预取 ============================ */
let brewIdx = -1, lastT = -1;
let prep = null, spans = [], charChars = null, charGlow = new Float32Array(0);
let blockGx = 0, blockGy = 0, lineT = 0, lineDur = 4;
const hintShow = (s, o) => { hint.textContent = s; hint.style.opacity = o; };

function prepLine(idx) {
  const line = lines[idx];
  if (!line || !line.text) return null;
  const text = line.text;
  const latin = isLatin(text);
  const lab = typeof mechFs === 'function' ? mechFs(text, latin) : (latin ? 92 : (text.length <= 10 ? 112 : text.length <= 16 ? 96 : 82));
  const g = sampleGlyph(text, { fs: lab, step: typeof mechStep === 'function' ? mechStep(text) : 2,
    maxW: Math.min(W * 0.78, 1180), maxH: H * 0.52 });
  if (!g.pc) return null;
  g.text = text;
  const cc = line.chars && line.chars.length === text.length ? line.chars : null;
  const dur = line.dur || 4;
  const at = new Float32Array(g.n);
  const cap = line.t + dur * 0.86;   /* YRC 溢出句长时压缩进句内，保证整句都能唱完 */
  for (let c = 0; c < g.n; c++) {
    const raw = cc && cc[c] && typeof cc[c].t === 'number' ? cc[c].t : line.t + dur * (c / Math.max(1, g.n));
    at[c] = Math.min(raw, cap);
  }
  const raw = spansForLine(text);
  const spanOf = new Int16Array(g.n).fill(-1);
  const spList = [];
  for (let k = 0; k < raw.length; k++) {
    const s = raw[k];
    if (!s || s.i1 <= s.i0) continue;
    spList.push({ i0: s.i0, i1: s.i1, t: at[Math.min(g.n - 1, s.i0)], hit: 0 });
    for (let c = s.i0; c < s.i1; c++) spanOf[c] = spList.length - 1;
  }
  if (!spList.length) return null;
  for (let k = 1; k < spList.length; k++) if (spList[k].t < spList[k - 1].t) spList[k].t = spList[k - 1].t;
  return { idx, g, spans: spList, spanOf, cc, at, text, lineT: line.t, lineDur: dur };
}

function assignLine(idx) {
  const use = (prep && prep.idx === idx) ? prep : prepLine(idx);
  if (!use) { L = null; return; }
  L = use.g; spans = use.spans; charChars = use.cc;
  charGlow = new Float32Array(L.n);
  blockGx = W / 2; blockGy = H * 0.46;
  lineT = use.lineT; lineDur = use.lineDur;
  cam.tz = 1.0; cam.ox = 0; cam.oy = 0;
  if (typeof mechAssign === 'function') mechAssign(use);
}

/* ============================ 5 · 相机 / 事件 ============================ */
const cam = { x: 0, y: 0, ox: 0, oy: 0, z: 1, tz: 1, vz: 0, sh: 0, dirx: 0, diry: 0, shx: 0, shy: 0, rot: 0, vrot: 0 };
const AE = { freeze: 0, flash: 0 };
const hitStop = (s) => { AE.freeze = Math.max(AE.freeze, s); };
const flash = (v) => { AE.flash = Math.max(AE.flash, v); };
function camShake(dx, dy, amp) {
  const l = Math.hypot(dx, dy) || 1;
  cam.dirx = dx / l; cam.diry = dy / l;
  cam.sh = Math.min(26, Math.max(cam.sh, amp));
}
function camUpdate(dt, T) {
  const ke = 1 - Math.pow(0.0016, dt);
  cam.tx = W / 2 + cam.ox;
  cam.ty = H * 0.48 + cam.oy;
  cam.x += (cam.tx - cam.x) * ke;
  cam.y += (cam.ty - cam.y) * ke;
  cam.vz += ((cam.tz - cam.z) * 185 - cam.vz * 22) * dt;
  cam.z += cam.vz * dt;
  cam.vrot += (-cam.rot * 240 - cam.vrot * 21) * dt;
  cam.rot += cam.vrot * dt;
  cam.sh *= Math.pow(0.00004, dt);
  const wob = Math.sin(T * 59.3) * 0.62 + Math.sin(T * 40.1 + 1.2) * 0.38;
  cam.shx = cam.dirx * cam.sh * wob;
  cam.shy = cam.diry * cam.sh * wob;
}

/* ============================ 6 · 背景 ============================ */
function buildBg() {
  if (!bgCv) bgCv = document.createElement('canvas');
  const bw = Math.max(2, Math.round(W / 2)), bh = Math.max(2, Math.round(H / 2));
  bgCv.width = bw; bgCv.height = bh;
  const g = bgCv.getContext('2d');
  const grd = g.createRadialGradient(bw * 0.5, bh * 0.44, 0, bw * 0.5, bh * 0.5, Math.max(bw, bh) * 0.8);
  grd.addColorStop(0, '#11161f');
  grd.addColorStop(0.55, '#0a0e16');
  grd.addColorStop(1, '#030509');
  g.fillStyle = grd; g.fillRect(0, 0, bw, bh);
}

/* ============================ 7 · 主循环 ============================ */
let last = performance.now();
let T0 = 0;

function frame(nowMs) {
  const dtReal = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; T0 += dtReal;
  if (AE.freeze > 0) AE.freeze -= dtReal;
  const dt = AE.freeze > 0 ? 0 : dtReal;

  const T = now();
  timing(T);

  if (L) {
    if (charChars) for (let c = 0; c < L.n; c++) charGlow[c] = charChars[c] ? clamp01((T - charChars[c].t) / 0.22) : 0;
    else for (let c = 0; c < L.n; c++) charGlow[c] = clamp01((T - lineT - lineDur * 0.85 * c / L.n) / 0.3);
  }

  if (L && spans.length) {
    for (let k = 0; k < spans.length; k++) {
      const s = spans[k];
      if (s.hit || T < s.t || T > s.t + 0.4) continue;
      s.hit = 1;
      const first = k === 0;
      hitStop(first ? 0.05 : 0.024);
      flash(first ? 0.36 : 0.15);
      cam.tz = first ? 1.06 : 1.03;
      camShake(1, 0.18, first ? 11 : 5.5);
      cam.vrot += (k % 2 ? 1 : -1) * (first ? 0.55 : 0.28);
      if (typeof mechEvent === 'function') mechEvent(k, first);
    }
    cam.tz += (1.0 - cam.tz) * Math.min(1, dtReal * 2.4);
  }

  camUpdate(dtReal, T0);
  const z = cam.z;
  const cosR = Math.cos(cam.rot), sinR = Math.sin(cam.rot);
  const pjX = (x, y) => { const dx = (x - cam.x) * z, dy = (y - cam.y) * z; return W / 2 + cam.shx + dx * cosR - dy * sinR; };
  const pjY = (x, y) => { const dx = (x - cam.x) * z, dy = (y - cam.y) * z; return H / 2 + cam.shy + dx * sinR + dy * cosR; };

  if (typeof mechUpdate === 'function') mechUpdate(dt, T);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#05070b';
  ctx.fillRect(0, 0, W, H);
  if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);
  if (typeof mechDraw === 'function') mechDraw(T, z, pjX, pjY);

  ctx.globalCompositeOperation = 'source-over';
  if (AE.flash > 0.012) {
    ctx.fillStyle = `rgba(232,240,250,${(AE.flash * 0.05).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    AE.flash *= Math.pow(0.000004, dtReal);
  }

  requestAnimationFrame(frame);
}

/* ============================ 8 · 节奏 ============================ */
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) { curIdx = -1; brewIdx = -1; L = null; prep = null; }
  lastT = T;
  let c = curIdx;
  while (c + 1 < lines.length && T >= lines[c + 1].t) c++;
  if (c !== curIdx) {
    curIdx = c; brewIdx = -1; prep = null;
    if (curIdx >= 0) { assignLine(curIdx); hintShow('', 0); }
    else hintShow(lines.length ? '等待第一句…' : '这首没有歌词', 0.5);
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    if (T >= lines[nx].t - Math.min(1.5, Math.max(0.55, gap * 0.5))) { brewIdx = nx; prep = prepLine(nx); }
  }
}

/* ============================ 9 · 通信协议 ============================ */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent && p.accent.length >= 3) accent = p.accent;
    curIdx = -1; brewIdx = -1; lastT = -1; L = null; prep = null; spans = [];
    clockT = 0; clockAt = performance.now();
    if (typeof mechInitLine === 'function') mechInitLine();
    hintShow(lines.length ? '等待第一句…' : '这首没有歌词', lines.length ? 1 : 0.5);
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    const lv = (d.payload && d.payload.level) || 0.6;
    camShake(1, 0.2, 1.4 + lv * 2.2);
    cam.tz = Math.max(cam.tz, 1.02 + lv * 0.02);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => ({
  curIdx, n: lines.length, pc: L ? L.pc : 0, spans: spans.length,
  z: +cam.z.toFixed(3), t: +now().toFixed(2),
});

/* ============================ 10 · 启动 ============================ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.max(2, Math.round(W * DPR));
  cv.height = Math.max(2, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg();
  cam.x = W / 2; cam.y = H * 0.48; cam.tx = cam.x; cam.ty = cam.y;
  if (typeof mechResize === 'function') mechResize();
  if (L && curIdx >= 0) {
    const p2 = prepLine(curIdx);
    if (p2) { prep = p2; assignLine(curIdx); }
  }
}
addEventListener('resize', resize);




/* ===== MECH · 无限缩放 ===== */
/* ============================================================================
   018 · 无限缩放 · 粒子版（v4）

   上一版是"花字 + 隧道"，被否了。这一版回到粒子：
   · 字形被采样成 1500~5600 颗粒子，每颗粒子知道自己的字（own），
     整句以涡心为中心，沿对数螺线**拧出来**（内圈先到、外圈后到，像从洞里长出来）。
   · YRC 逐字点亮：charGlow 驱动亮度/尺寸/该字的一团光晕；没唱到的字也有 0.55 亮度
     （骨架要求：不许只亮半句）。词团命中时爆一圈火花 + 顿帧 + 推进 + 震。
   · 无限缩放：每句结尾（lineDur-0.3）粒子被反拧回涡心；下一句再从涡心长出来，
     透视环一直在往镜头流，镜头持续漂移 + 呼吸变焦。
   · 背景质感：星云（按封面色现烤）+ 两层视差星点 + 透视隧道环 + 胶片颗粒（DOM 叠层）。
   ========================================================================== */

const VN = 5600;
const SPK = 480;

const vTx = new Float32Array(VN), vTy = new Float32Array(VN);
const vOwn = new Int16Array(VN), vPh = new Float32Array(VN);
const vTw = new Float32Array(VN), vDel = new Float32Array(VN), vSz = new Float32Array(VN);
const vAng = new Float32Array(VN), vRad = new Float32Array(VN);
const vSX = new Float32Array(VN), vSY = new Float32Array(VN);
const vSL = new Float32Array(VN), vSS = new Float32Array(VN);
let vn = 0, vLineT = 0, vLineDur = 4, vLineIdx = -1;
let vcX = null, vcY = null;
let vMaxRad = 1;

let C_CORE = '#fff', C_MID = '#ddd', C_DIM = '#999', C_TUN = '#bbb', C_GLOW = '#fff';
let nebCv = null, glowCv = null, grainEl = null;
let palKey = '';
const STARS = 170;
const starX = new Float32Array(STARS), starY = new Float32Array(STARS);
const starD = new Float32Array(STARS), starS = new Float32Array(STARS);
const starA = new Float32Array(STARS);

const spX = new Float32Array(SPK), spY = new Float32Array(SPK);
const spVX = new Float32Array(SPK), spVY = new Float32Array(SPK);
const spL = new Float32Array(SPK), spM = new Float32Array(SPK);
let spIx = 0;
let lastDt = 0.016;

/* 换句残影：上一句的粒子往涡心缩一小段，别让字“啪”地消失 */
const RN = 2600;
const rX = new Float32Array(RN), rY = new Float32Array(RN);
let rN = 0, rT0 = -99;

/* 入场蜂群：从涡心拧到各自的目标点，压到字上（字本身一直在位，所以任何一帧都读得出整句） */
const SWN = 1200;
const swTx = new Float32Array(SWN), swTy = new Float32Array(SWN);
const swAng = new Float32Array(SWN), swRad = new Float32Array(SWN);
const swDel = new Float32Array(SWN), swTw = new Float32Array(SWN);
let swN = 0;

/* ---------- 颜色（跟着封面 accent 走） ---------- */
function hsl(h, s, l, a) {
  h = ((h % 360) + 360) % 360;
  return 'hsla(' + h.toFixed(1) + ',' + (Math.max(0, Math.min(1, s)) * 100).toFixed(1) + '%,' +
    (Math.max(0, Math.min(1, l)) * 100).toFixed(1) + '%,' + a + ')';
}
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d > 1e-6) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s];
}
function buildPalette() {
  const q = rgb2hsl(accent[0], accent[1], accent[2]);
  const h = q[0], s = Math.max(0.38, Math.min(0.92, q[1] * 0.85 + 0.24));
  C_CORE = hsl(h + 3, s * 0.90, 0.80, 1);
  C_MID = hsl(h + 8, s * 1.00, 0.68, 1);
  C_DIM = hsl(h + 16, s * 1.00, 0.60, 1);
  C_TUN = hsl(h + 20, s * 0.95, 0.56, 1);
  C_GLOW = hsl(h + 6, s * 0.75, 0.78, 1);
  palKey = accent.join(',');
}

/* ---------- 星云（1/3 分辨率，现烤一次） ---------- */
function buildNebula() {
  const bw = Math.max(2, Math.round(W / 3)), bh = Math.max(2, Math.round(H / 3));
  if (!nebCv) nebCv = document.createElement('canvas');
  nebCv.width = bw; nebCv.height = bh;
  const g = nebCv.getContext('2d');
  const q = rgb2hsl(accent[0], accent[1], accent[2]);
  const h = q[0], s = Math.max(0.35, Math.min(0.9, q[1] * 0.9 + 0.2));
  const base = g.createRadialGradient(bw * 0.5, bh * 0.5, 0, bw * 0.5, bh * 0.5, Math.max(bw, bh) * 0.75);
  base.addColorStop(0, hsl(h, s * 0.55, 0.075, 1));
  base.addColorStop(0.5, hsl(h, s * 0.55, 0.040, 1));
  base.addColorStop(1, hsl(h, s * 0.60, 0.016, 1));
  g.fillStyle = base; g.fillRect(0, 0, bw, bh);
  /* 银河带：一条斜向的柔光，给背景一点方向感 */
  g.save();
  g.translate(bw * 0.5, bh * 0.5);
  g.rotate(-0.42);
  const band = g.createLinearGradient(0, -bh * 0.30, 0, bh * 0.30);
  band.addColorStop(0, hsl(h + 6, s * 0.8, 0.45, 0));
  band.addColorStop(0.5, hsl(h + 6, s * 0.8, 0.52, 0.06));
  band.addColorStop(1, hsl(h + 6, s * 0.8, 0.45, 0));
  g.fillStyle = band;
  g.fillRect(-bw, -bh * 0.30, bw * 2, bh * 0.60);
  g.restore();
  /* 云团：同一色系的明暗呼吸，给背景“料” */
  for (let i = 0; i < 22; i++) {
    const bx = bw * (0.10 + 0.80 * ((i * 37) % 89) / 89);
    const by = bh * (0.08 + 0.84 * ((i * 53) % 83) / 83);
    const br = Math.max(bw, bh) * (0.10 + 0.20 * ((i * 29) % 71) / 71);
    const gr = g.createRadialGradient(bx, by, 0, bx, by, br);
    const dh = i % 3 === 0 ? 14 : i % 3 === 1 ? -10 : 4;
    gr.addColorStop(0, hsl(h + dh, s * 0.85, 0.46, 0.07 + 0.04 * (i % 3)));
    gr.addColorStop(1, hsl(h + dh, s * 0.85, 0.35, 0));
    g.fillStyle = gr;
    g.beginPath(); g.arc(bx, by, br, 0, 6.28318); g.fill();
  }
  /* 细碎星尘 */
  for (let i = 0; i < 420; i++) {
    const x = (Math.random() * bw) | 0, y = (Math.random() * bh) | 0;
    g.fillStyle = hsl(h + 10, s * 0.5, 0.72, 0.05 + Math.random() * 0.20);
    g.fillRect(x, y, 1, 1);
  }
}

/* ---------- 星点（两层视差） ---------- */
function buildStars() {
  for (let i = 0; i < STARS; i++) {
    starX[i] = Math.random() * W;
    starY[i] = Math.random() * H;
    starD[i] = 0.25 + Math.random() * 0.75;     /* 视差深度 */
    starS[i] = starD[i] > 0.75 ? 1.7 : 1.0;
    starA[i] = 0.10 + starD[i] * 0.34;
  }
}

/* ---------- 光晕贴图（带主色，不要纯白） ---------- */
function buildGlow() {
  const S = 128;
  if (!glowCv) glowCv = document.createElement('canvas');
  glowCv.width = S; glowCv.height = S;
  const g = glowCv.getContext('2d');
  const q = rgb2hsl(accent[0], accent[1], accent[2]);
  const h = q[0], s = Math.max(0.38, Math.min(0.92, q[1] * 0.85 + 0.24));
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, hsl(h + 4, s * 0.85, 0.80, 0.95));
  gr.addColorStop(0.35, hsl(h + 8, s * 0.95, 0.64, 0.38));
  gr.addColorStop(1, hsl(h + 8, s * 1.00, 0.55, 0));
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
}

/* ---------- 胶片颗粒（DOM 叠层，合成器做，不进 canvas 帧耗） ---------- */
function buildGrain() {
  if (grainEl) return;
  const S = 128;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  const im = g.createImageData(S, S);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    im.data[i] = v; im.data[i + 1] = v; im.data[i + 2] = v; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  grainEl = document.createElement('div');
  grainEl.style.cssText = 'position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.09;' +
    'mix-blend-mode:overlay;background-repeat:repeat;background-image:url(' + c.toDataURL() + ')';
  document.body.appendChild(grainEl);
}

function spawnSparks(cx, cy, n, spread) {
  for (let k = 0; k < n; k++) {
    const i = spIx++ % SPK;
    const a = Math.random() * 6.28318;
    const r = Math.random() * spread;
    spX[i] = cx + Math.cos(a) * r;
    spY[i] = cy + Math.sin(a) * r;
    const v = 40 + Math.random() * 160;
    spVX[i] = Math.cos(a) * v;
    spVY[i] = Math.sin(a) * v;
    spL[i] = 0.35 + Math.random() * 0.35;
    spM[i] = 0.35 + Math.random() * 0.65;
  }
}

/* ---------- 钩子 ---------- */
function mechResize() {
  buildPalette();
  buildNebula();
  buildStars();
  buildGlow();
  buildGrain();
  spIx = 0;
  for (let i = 0; i < SPK; i++) spL[i] = 0;
}

function mechInitLine() {
  vn = 0;
  vLineIdx = -1;
  rN = 0;
  for (let i = 0; i < SPK; i++) spL[i] = 0;
}

function mechAssign(use) {
  const g = use.g;
  /* 只有换句才留残影；resize / 同一句重排时不能把同一句再叠一层 */
  const sameLine = (use.idx === vLineIdx);
  rT0 = use.lineT;
  rN = 0;
  if (!sameLine && vn > 0) {
    const stride = Math.max(1, Math.ceil(vn / RN));
    for (let i = 0, k = 0; i < vn && k < RN; i += stride, k++) { rX[k] = vTx[i]; rY[k] = vTy[i]; rN = k + 1; }
  }
  vLineIdx = use.idx;
  vLineT = use.lineT;
  vLineDur = use.lineDur;
  /* 字块放在中下（字幕位），宽 ~56% 屏宽 */
  blockGx = W / 2;
  blockGy = H * 0.52;
  let K = Math.min((W * 0.56) / Math.max(1, g.w), (H * 0.40) / Math.max(1, g.h), 1.3);
  if (K < 0.34) K = 0.34;

  vn = Math.min(VN, Math.max(800, Math.round(g.pc * 0.42)));
  const pc = g.pc;
  vMaxRad = 1;
  for (let i = 0; i < vn; i++) {
    const pi = ((i * pc / vn) | 0) % pc;
    /* 采样网格是规则的，加一点抖动，才像"粒子"而不是点阵 */
    const x = g.px[pi] * K + (Math.random() - 0.5) * 1.6;
    const y = g.py[pi] * K + (Math.random() - 0.5) * 1.6;
    vTx[i] = x; vTy[i] = y;
    vOwn[i] = g.own[pi];
    vPh[i] = Math.random() * 6.28318;
    vTw[i] = (0.9 + Math.random() * 1.5) * (i % 2 ? 1 : -1);
    vSz[i] = 0.85 + Math.random() * 0.4;
    const r = Math.hypot(x, y);
    vAng[i] = Math.atan2(y, x);
    vRad[i] = r;
    if (r > vMaxRad) vMaxRad = r;
  }
  /* 内圈先到、外圈后到：从涡心“长”出来 */
  for (let i = 0; i < vn; i++) vDel[i] = 0.04 + Math.random() * 0.05 + 0.20 * (vRad[i] / vMaxRad);

  /* 入场蜂群（1200 颗）：位置从涡心螺旋飞到目标，落地即"压"进字里 */
  swN = Math.min(SWN, Math.max(600, Math.round(vn * 0.28)));
  for (let k = 0; k < swN; k++) {
    const pi = (Math.random() * pc) | 0;
    const x = g.px[pi] * K, y = g.py[pi] * K;
    swTx[k] = x; swTy[k] = y;
    swAng[k] = Math.atan2(y, x);
    swRad[k] = Math.hypot(x, y);
    swTw[k] = (0.8 + Math.random() * 1.6) * (k % 2 ? 1 : -1);
    swDel[k] = 0.02 + Math.random() * 0.08 + 0.16 * (swRad[k] / Math.max(1, vMaxRad));
  }

  vcX = new Float32Array(g.n); vcY = new Float32Array(g.n);
  for (let c = 0; c < g.n; c++) { vcX[c] = g.charCx[c] * K; vcY[c] = g.charCy[c] * K; }

  if (palKey !== accent.join(',')) { buildPalette(); buildNebula(); }
  spawnSparks(0, 0, 26, 22);
}

function mechEvent(k, first) {
  /* 词团命中：在该团中心炸一小圈火花（用字心近似） */
  if (!L || !vcX) return;
  const sp = spans[k];
  if (!sp) return;
  const c = Math.min(L.n - 1, Math.floor((sp.i0 + sp.i1 - 1) / 2));
  spawnSparks(vcX[c], vcY[c], first ? 34 : 18, first ? 26 : 16);
}

function mechUpdate(dt, T) {
  lastDt = Math.min(0.05, dt || 0.016);
  if (palKey !== accent.join(',')) { buildPalette(); buildNebula(); buildStars(); buildGlow(); }
  /* 镜头：一直在动 —— 横移 + 升降 + 慢滚转（词团命中另有推进/震动叠加） */
  cam.ox = Math.sin(T * 0.19) * W * 0.045 + Math.sin(T * 0.41 + 1.1) * W * 0.014;
  cam.oy = Math.sin(T * 0.15 + 0.7) * H * 0.032 + Math.cos(T * 0.29) * H * 0.010;
}

/* ---------- 绘制 ---------- */
function mechDraw(T, z, pjX, pjY) {
  const cx = pjX(blockGx, blockGy), cy = pjY(blockGx, blockGy);
  /* 慢滚转只加在绘制侧：不和基座的震动/回弹抢 cam.rot */
  const rotT = cam.rot + Math.sin(T * 0.23) * 0.020;
  const cosR = Math.cos(rotT), sinR = Math.sin(rotT);
  const br = 1 + 0.035 * Math.sin(T * 0.27);
  const zz = z * br;
  const base = Math.min(W, H);

  ctx.globalCompositeOperation = 'source-over';

  /* --- 星云：轻微视差，铺满 --- */
  if (nebCv) {
    const ox = -cam.ox * 0.06, oy = -cam.oy * 0.06;
    ctx.globalAlpha = 1;
    ctx.drawImage(nebCv, ox - W * 0.03, oy - H * 0.03, W * 1.06, H * 1.06);
  }

  /* --- 星点：两层视差 --- */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < STARS; i++) {
    const sx = starX[i] + (cam.x - W / 2) * starD[i] * 0.55 + cam.shx * starD[i];
    const sy = starY[i] + (cam.y - H * 0.48) * starD[i] * 0.55 + cam.shy * starD[i];
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
    ctx.globalAlpha = starA[i];
    ctx.fillStyle = i % 5 === 0 ? C_GLOW : C_MID;
    const s = starS[i];
    ctx.fillRect(sx, sy, s, s);
  }

  /* --- 透视隧道环：从涡心往镜头流 --- */
  const tunN = 16;
  ctx.setLineDash([]);
  for (let i = 0; i < tunN; i++) {
    const ph = ((T * 0.42 + i / tunN) % 1);
    const zr = 1 + ph * 7.2;
    const r = base * 0.62 / zr;
    if (r < 5) continue;
    const near = Math.min(1, ph / 0.18);
    const far = Math.min(1, (1 - ph) / 0.35);
    const a = 0.19 * near * far;
    if (a < 0.012) continue;
    ctx.globalAlpha = a;
    ctx.strokeStyle = C_TUN;
    ctx.lineWidth = Math.max(0.7, 2.2 - zr * 0.16);
    const rr = r * zz;
    const st = T * 0.5 + i * 1.7;
    /* 两段弧分开 stroke：同一 path 里连画会拉出弦，成了波浪线 */
    ctx.beginPath(); ctx.arc(cx, cy, rr, st, st + 2.15); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, rr, st + 3.1416, st + 3.1416 + 2.15); ctx.stroke();
  }

  /* --- 涡心光：小一点、弱一点，别把字压暗 --- */
  if (glowCv) {
    const gr = base * (0.24 + 0.03 * Math.sin(T * 0.8));
    ctx.globalAlpha = 0.07;
    ctx.drawImage(glowCv, cx - gr, cy - gr, gr * 2, gr * 2);
  }

  /* --- 粒子文字（正片叠底：保持颗粒感，不让叠加糊成一片白） --- */
  if (vn && L) {
    ctx.globalCompositeOperation = 'source-over';
    const lo0 = 0.86, lo1 = 0.64;
    /* 位置/亮度先算一遍，再分三档批量画 */
    for (let i = 0; i < vn; i++) {
      const gl = charGlow[vOwn[i]] || 0;
      const lum = (0.74 + 0.26 * gl) * (0.86 + 0.26 * ((i & 7) / 7));
      const ox = vTx[i] * zz, oy = vTy[i] * zz;
      vSX[i] = cx + ox * cosR - oy * sinR;
      vSY[i] = cy + ox * sinR + oy * cosR;
      vSL[i] = lum;
      vSS[i] = (0.92 + 0.34 * lum) * vSz[i] * zz * (0.88 + 0.20 * gl);
    }
    for (let b = 0; b < 3; b++) {
      ctx.fillStyle = b === 0 ? C_CORE : b === 1 ? C_MID : C_DIM;
      ctx.globalAlpha = b === 0 ? 1 : b === 1 ? 0.95 : 0.88;
      ctx.beginPath();
      let any = 0;
      for (let i = 0; i < vn; i++) {
        const lum = vSL[i];
        const tier = lum >= lo0 ? 0 : lum >= lo1 ? 1 : 2;
        if (tier !== b) continue;
        const s = vSS[i];
        ctx.rect(vSX[i] - s, vSY[i] - s, s * 2, s * 2);
        any++;
      }
      if (any) ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* --- 入场蜂群：从涡心沿螺线拧到字上，落地即消失 --- */
    const age0 = T - vLineT;
    if (swN && age0 >= 0 && age0 < 0.95) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = C_CORE;
      for (let b = 0; b < 3; b++) {
        ctx.globalAlpha = b === 0 ? 0.95 : b === 1 ? 0.60 : 0.32;
        ctx.beginPath();
        let any = 0;
        for (let k = 0; k < swN; k++) {
          const e = clamp01((age0 - swDel[k]) / 0.42);
          if (e >= 1) continue;
          const bk = e < 0.34 ? 0 : e < 0.67 ? 1 : 2;
          if (bk !== b) continue;
          const a = swAng[k] + (1 - e) * swTw[k];
          const r = swRad[k] * e;
          const ox = Math.cos(a) * r * zz, oy = Math.sin(a) * r * zz;
          const sx = cx + ox * cosR - oy * sinR;
          const sy = cy + ox * sinR + oy * cosR;
          const s = 1.0 + 1.3 * (1 - e);
          ctx.rect(sx - s, sy - s, s * 2, s * 2);
          any++;
        }
        if (any) ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    /* --- 逐字（YRC）光晕：唱到的字亮一团 --- */
    ctx.globalCompositeOperation = 'lighter';
    if (vcX && glowCv) {
      for (let c = 0; c < L.n; c++) {
        const gl = charGlow[c];
        if (!gl || gl < 0.04) continue;
        const ox = vcX[c] * zz, oy = vcY[c] * zz;
        const sx = cx + ox * cosR - oy * sinR;
        const sy = cy + ox * sinR + oy * cosR;
        const gr = 38 * zz * (0.8 + 0.5 * gl);
        ctx.globalAlpha = 0.13 * gl;
        ctx.drawImage(glowCv, sx - gr, sy - gr, gr * 2, gr * 2);
      }
      /* 正在唱的那个字：再压一团亮光，像镜头/光斑跟着走 */
      let curC = -1;
      for (let c = 0; c < L.n; c++) if (charGlow[c] > 0.02) curC = c;
      if (curC >= 0) {
        const ox = vcX[curC] * zz, oy = vcY[curC] * zz;
        const sx = cx + ox * cosR - oy * sinR;
        const sy = cy + ox * sinR + oy * cosR;
        const gr = 54 * zz;
        ctx.globalAlpha = 0.24;
        ctx.drawImage(glowCv, sx - gr, sy - gr, gr * 2, gr * 2);
      }
      ctx.globalAlpha = 1;
    }
  }

  /* --- 换句残影：上一句缩回涡心（0.4s，不挡住新句的“整句可读”） --- */
  if (rN) {
    const rAge = T - rT0;
    if (rAge >= 0 && rAge < 0.40) {
      const k = 1 - rAge / 0.40;
      ctx.fillStyle = C_MID;
      ctx.globalAlpha = 0.30 * k * k;
      ctx.beginPath();
      for (let i = 0; i < rN; i++) {
        const ox = rX[i] * k * zz, oy = rY[i] * k * zz;
        const sx = cx + ox * cosR - oy * sinR;
        const sy = cy + ox * sinR + oy * cosR;
        ctx.rect(sx - 1.6, sy - 1.6, 3.2, 3.2);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  /* --- 火花（词团命中） --- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = C_CORE;
  for (let i = 0; i < SPK; i++) {
    if (spL[i] <= 0) continue;
    spL[i] -= lastDt;
    spX[i] += spVX[i] * lastDt;
    spY[i] += spVY[i] * lastDt;
    const damp = Math.pow(0.02, lastDt);
    spVX[i] *= damp; spVY[i] *= damp;
    const ox = spX[i] * zz, oy = spY[i] * zz;
    const sx = cx + ox * cosR - oy * sinR;
    const sy = cy + ox * sinR + oy * cosR;
    const lf = Math.max(0, spL[i]) / 0.7;
    ctx.globalAlpha = Math.min(1, lf) * 0.9 * spM[i];
    const s = 1.2 + spM[i] * 1.6;
    ctx.fillRect(sx - s, sy - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* 启动必须在机制片段之后：机制里的 const/let 在此之前还处于暂时性死区 */
resize();
requestAnimationFrame(frame);
</script>
