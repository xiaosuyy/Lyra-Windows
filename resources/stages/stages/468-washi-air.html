<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>石与水纹</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e3d6}
  body{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,"Hiragino Mincho ProN",serif;color:#2f2c27;-webkit-font-smoothing:antialiased}
  #paper,#amb{position:fixed;inset:0;width:100%;height:100%;display:block}
  #amb{pointer-events:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;padding:clamp(20px,4.4vh,50px) clamp(22px,7vw,108px);z-index:3}
  #head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex:0 0 auto}
  #meta{font-family:"Helvetica Neue",Arial,"Hiragino Sans",sans-serif;font-size:clamp(9px,.8vw,11px);letter-spacing:.24em;color:#7d7567;line-height:2}
  #meta b{font-weight:400;color:#5a5347}
  #sym{display:flex;align-items:center;flex:0 0 auto;padding-top:2px}
  #sym .ring{width:clamp(6px,.62vw,9px);height:clamp(6px,.62vw,9px);border-radius:50%;border:1px solid var(--water,#8fb3c4);flex:0 0 auto}
  #sym .rule{width:clamp(64px,10vw,148px);height:1px;background:var(--water,#8fb3c4);opacity:.8}
  #lyr{flex:1 1 auto;position:relative;overflow:hidden;margin-top:clamp(14px,3.6vh,44px);min-height:0}
  #track{position:absolute;left:0;top:0;right:0;max-width:min(780px,64vw);transform:translate3d(0,0,0);transition:transform .9s cubic-bezier(.22,.61,.36,1);will-change:transform}
  .l{font-size:clamp(17px,1.85vw,25px);line-height:1.78;margin:0 0 clamp(9px,1.7vh,19px);color:#756c5d;letter-spacing:.02em;overflow-wrap:anywhere;word-break:break-word;text-rendering:optimizeLegibility}
  .l.on{font-size:clamp(21px,2.9vw,39px);line-height:1.5;letter-spacing:.045em;color:#2b2823;margin-bottom:clamp(12px,2.1vh,23px)}
  .l.past{color:#93897a}
  .ch{color:#756c5d}
  .ch.on{color:#26231f}
  #foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding-top:clamp(12px,2.2vh,26px)}
  #rule{position:relative;flex:1 1 auto;height:1px;background:rgba(93,86,74,.16);align-self:center}
  #rule i{position:absolute;inset:0;background:var(--water,#8fb3c4);transform-origin:0 50%;transform:scaleX(0);opacity:.9}
  #time{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.16em;color:#8b8272;font-variant-numeric:tabular-nums;flex:0 0 auto}
  #empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:4;pointer-events:none}
  #empty.show{display:flex}
  #empty p{margin:0;font-size:clamp(14px,1.5vw,19px);letter-spacing:.34em;color:#8b8272}
  #empty .dot{width:5px;height:5px;border-radius:50%;background:var(--water,#8fb3c4);opacity:.85}
  @media (max-width:640px){
    #track{max-width:none}
    #lyr{margin-top:clamp(10px,2vh,22px)}
    .l{line-height:1.85}
  }
</style>
</head>
<body>
<canvas id="paper"></canvas>
<canvas id="amb"></canvas>
<div id="wrap">
  <div id="head">
    <div id="meta"><b id="sname"></b><br><span id="sart"></span></div>
    <div id="sym"><span class="ring"></span><span class="rule"></span></div>
  </div>
  <div id="lyr"><div id="track"></div></div>
  <div id="foot"><span id="rule"><i id="prog"></i></span><span id="time">00:00 / 00:00</span></div>
</div>
<div id="empty"><span class="dot"></span><p>无 词</p></div>
<script>
var S = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '',
  duration: 0, accent: [150, 176, 190], name: '', artists: '', cover: '',
  beat: 0, live: { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 },
  rm: false, revealed: -1, activeEl: null
};
var V = {
  w: 1440, h: 900, dpr: 1, t0: 0, phase: 0, water: [143, 179, 196],
  stone: { cx: 1050, cy: 450, rx: 210, ry: 150, rot: -0.22 }, glow: null, grain: null
};
var els = {};
var pctx = null, actx = null, readySent = false;

window.__stage = function () {
  return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: S.err, text: S.text, gl: false, rm: S.rm
  };
};

function num(v, d) { v = +v; return isFinite(v) ? v : d; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function $(id) { return document.getElementById(id); }

function normColor(c) {
  if (Object.prototype.toString.call(c) === '[object Array]' && c.length >= 3) {
    return [clamp(Math.round(num(c[0], 150)), 0, 255),
            clamp(Math.round(num(c[1], 176)), 0, 255),
            clamp(Math.round(num(c[2], 190)), 0, 255)];
  }
  return [150, 176, 190];
}

function normLine(raw) {
  raw = raw || {};
  var text = typeof raw.text === 'string' ? raw.text : (raw.text == null ? '' : String(raw.text));
  var t = num(raw.t, 0); if (t < 0) t = 0;
  var dur = num(raw.dur, 0); if (dur < 0) dur = 0;
  var cs = null;
  if (Object.prototype.toString.call(raw.chars) === '[object Array]' && raw.chars.length) {
    cs = [];
    var n = Math.min(raw.chars.length, 4096);
    for (var k = 0; k < n; k++) {
      var ch = raw.chars[k] || {};
      cs.push({ c: typeof ch.c === 'string' ? ch.c : '', t: num(ch.t, t) });
    }
  }
  return { t: t, dur: dur, text: text, chars: cs, el: null, spans: null, times: null };
}

function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error('[468] ready failed', e); }
}

function onInit(p) {
  p = p || {};
  var song = p.song || {};
  S.name = typeof song.name === 'string' ? song.name : '';
  var a = song.artists;
  if (Object.prototype.toString.call(a) === '[object Array]') {
    var names = [];
    for (var i = 0; i < a.length && i < 12; i++) if (typeof a[i] === 'string' && a[i]) names.push(a[i]);
    S.artists = names.join(' / ');
  } else if (typeof a === 'string') { S.artists = a; } else { S.artists = ''; }
  S.cover = typeof song.cover === 'string' ? song.cover : '';
  S.accent = normColor(p.accent);
  S.duration = Math.max(0, num(p.duration, 0));
  var raw = Object.prototype.toString.call(p.lines) === '[object Array]' ? p.lines : [];
  var lines = [], n = Math.min(raw.length, 4000);
  for (var j = 0; j < n; j++) lines.push(normLine(raw[j]));
  lines.sort(function (x, y) { return x.t - y.t; });
  S.lines = lines;
  S.idx = -1; S.text = ''; S.activeEl = null; S.revealed = -1;
  buildTrack();
  applyPalette();
  updateIdx();
  layoutTrack();
}

function applyPalette() {
  var r = S.accent[0], g = S.accent[1], b = S.accent[2];
  var mix = 0.58;
  var wr = Math.round(r * (1 - mix) + 139 * mix);
  var wg = Math.round(g * (1 - mix) + 177 * mix);
  var wb = Math.round(b * (1 - mix) + 197 * mix);
  V.water = [wr, wg, wb];
  document.documentElement.style.setProperty('--water', 'rgb(' + wr + ',' + wg + ',' + wb + ')');
  paintPaper();
}

function buildTrack() {
  var track = els.track;
  if (!track) return;
  var frag = document.createDocumentFragment();
  for (var i = 0; i < S.lines.length; i++) {
    var el = document.createElement('p');
    el.className = 'l';
    el.textContent = S.lines[i].text;
    S.lines[i].el = el;
    frag.appendChild(el);
  }
  track.textContent = '';
  track.appendChild(frag);
  if (els.sname) els.sname.textContent = S.name || '—';
  if (els.sart) els.sart.textContent = S.artists || '';
  var empty = els.empty;
  if (empty) {
    if (S.lines.length) empty.className = '';
    else empty.className = 'show';
  }
}

function buildChars(line) {
  var el = line.el;
  if (!el) return;
  var txt = line.text || '';
  var n = Math.min(txt.length, 400);
  el.textContent = '';
  var frag = document.createDocumentFragment();
  var spans = [];
  for (var i = 0; i < n; i++) {
    var c = txt.charAt(i);
    if (c === ' ') {
      var sp = document.createElement('span');
      sp.className = 'ch on';
      sp.textContent = '\u00a0';
      frag.appendChild(sp);
      spans.push(sp);
      continue;
    }
    var s = document.createElement('span');
    s.className = 'ch';
    s.textContent = c;
    frag.appendChild(s);
    spans.push(s);
  }
  el.appendChild(frag);
  line.spans = spans;
  line.times = charTimes(line);
}

function charTimes(line) {
  var n = line.spans ? line.spans.length : 0;
  var out = new Array(n), i;
  if (!n) return out;
  var cs = line.chars;
  var start = line.t;
  var end = line.t + (line.dur > 0 ? line.dur : Math.min(6, Math.max(1.2, n * 0.3)));
  if (cs && cs.length) {
    if (cs.length === n) {
      for (i = 0; i < n; i++) out[i] = num(cs[i] && cs[i].t, start);
      return out;
    }
    for (i = 0; i < n; i++) {
      var u = n > 1 ? i / (n - 1) : 0;
      var pos = u * (cs.length - 1);
      var a = Math.floor(pos), b = Math.min(cs.length - 1, a + 1), f = pos - a;
      var ta = num(cs[a] && cs[a].t, start), tb = num(cs[b] && cs[b].t, ta);
      out[i] = ta + (tb - ta) * f;
    }
    return out;
  }
  for (i = 0; i < n; i++) out[i] = start + (end - start) * (n > 1 ? i / (n - 1) : 0);
  return out;
}

function clearSpans(line) {
  if (line && line.el && line.spans) {
    line.el.textContent = line.text;
    line.el.className = 'l';
    line.spans = null;
    line.times = null;
  }
}

function syncLines() {
  var n = S.lines.length, i;
  for (i = 0; i < n; i++) {
    var el = S.lines[i].el;
    if (el) el.className = 'l' + (i === S.idx ? ' on' : (i < S.idx ? ' past' : ''));
  }
  for (i = 0; i < n; i++) {
    if (i !== S.idx && S.lines[i].spans) clearSpans(S.lines[i]);
  }
  var cur = S.idx >= 0 ? S.lines[S.idx] : null;
  clearSpans(cur);
  if (cur && cur.el) {
    buildChars(cur);
    cur.el.className = 'l on';
  }
  S.revealed = -1;
  layoutTrack();
}

function updateIdx() {
  var lines = S.lines, idx = -1, i;
  for (i = 0; i < lines.length; i++) {
    if (lines[i].t <= S.t + 0.02) idx = i; else break;
  }
  if (idx !== S.idx) { S.idx = idx; syncLines(); }
  S.text = idx >= 0 && lines[idx] ? lines[idx].text : '';
  if (els.time) els.time.textContent = fmt(S.t) + ' / ' + fmt(S.duration);
  if (els.prog) {
    var pr = S.duration > 0 ? clamp(S.t / S.duration, 0, 1) : 0;
    els.prog.style.transform = 'scaleX(' + pr.toFixed(4) + ')';
  }
}

function fmt(s) {
  s = Math.max(0, num(s, 0));
  var m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
}

function layoutTrack() {
  var track = els.track, lyr = els.lyr;
  if (!track || !lyr) return;
  var lh = lyr.clientHeight || V.h || 900;
  var cur = S.idx >= 0 ? S.lines[S.idx] : null;
  var ty = 0;
  if (cur && cur.el) ty = cur.el.offsetTop + cur.el.offsetHeight / 2 - lh * 0.42;
  var min = -Math.max(0, track.scrollHeight - lh);
  ty = clamp(ty, min, 0);
  track.style.transform = 'translate3d(0,' + (isFinite(ty) ? ty.toFixed(1) : 0) + 'px,0)';
}

function reveal() {
  var line = S.idx >= 0 ? S.lines[S.idx] : null;
  if (!line || !line.spans) return;
  var sp = line.spans, tm = line.times, n = 0, i;
  for (i = 0; i < sp.length; i++) { if (tm[i] <= S.t + 0.001) n++; else break; }
  if (n === S.revealed) return;
  var prev = S.revealed;
  S.revealed = n;
  if (n >= prev && prev >= 0) {
    for (i = prev; i < n; i++) sp[i].className = 'ch on';
  } else {
    for (i = 0; i < sp.length; i++) sp[i].className = i < n ? 'ch on' : 'ch';
  }
}

function onTick(p) {
  p = p || {};
  var t = num(p.time, S.t);
  if (t < 0) t = 0;
  S.t = t;
  if (typeof p.playing === 'boolean') S.playing = p.playing;
  updateIdx();
}

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (!isFinite(w) || w < 1) w = 1440;
  if (!isFinite(h) || h < 1) h = 900;
  V.w = w; V.h = h;
  var dpr = clamp(num(window.devicePixelRatio, 1), 1, 2);
  V.dpr = dpr;
  var pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  els.paper.width = pw; els.paper.height = ph;
  els.amb.width = pw; els.amb.height = ph;
  var portrait = w / h < 0.92;
  if (portrait) {
    V.stone = { cx: w * 0.67, cy: h * 0.205, rx: w * 0.25, ry: Math.min(w * 0.155, h * 0.1), rot: -0.24, veil: 0 };
  } else {
    V.stone = { cx: w * 0.75, cy: h * 0.44, rx: Math.min(w * 0.148, h * 0.235), ry: Math.min(w * 0.108, h * 0.17), rot: -0.22, veil: 0 };
  }
  paintPaper();
  layoutTrack();
}

function grainTile(size) {
  var cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  var g = cv.getContext('2d');
  if (!g) return null;
  var img = g.createImageData(size, size);
  var d = img.data, n = size * size, i = 0, x = 0, y = 0;
  for (var k = 0; k < n; k++) {
    i = k * 4;
    x = k % size; y = (k / size) | 0;
    var v = 128 + (Math.random() - 0.5) * 74;
    if (Math.random() < 0.04) v -= 26;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return cv;
}

function stonePath(g, st, dx, dy, sx, sy) {
  g.beginPath();
  if (g.ellipse) g.ellipse(st.cx + dx, st.cy + dy, st.rx + sx, st.ry + sy, st.rot, 0, Math.PI * 2);
  else g.arc(st.cx + dx, st.cy + dy, Math.min(st.rx + sx, st.ry + sy), 0, Math.PI * 2);
}

function paintPaper() {
  var c = els.paper, g = pctx;
  if (!c || !g) return;
  var W = c.width, H = c.height;
  if (!W || !H) return;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);

  var base = g.createLinearGradient(0, 0, W * 0.65, H);
  base.addColorStop(0, '#f1ebdd');
  base.addColorStop(0.55, '#e9e2d3');
  base.addColorStop(1, '#ded6c4');
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);

  /* 纸浆杂点：固定数量，不随尺寸放大 */
  var dots = Math.min(2600, Math.round(W * H / 9000));
  for (var i = 0; i < dots; i++) {
    var x = Math.random() * W, y = Math.random() * H, a = 0.018 + Math.random() * 0.05;
    g.fillStyle = Math.random() < 0.55 ? 'rgba(150,138,116,' + a.toFixed(3) + ')' : 'rgba(255,252,244,' + (a * 1.5).toFixed(3) + ')';
    var r = 0.6 + Math.random() * 2.6;
    g.fillRect(x, y, r, r * (0.6 + Math.random() * 0.9));
  }

  /* 长纤维：固定上限 */
  var fib = Math.min(320, Math.round(W / 7));
  g.lineWidth = 1;
  for (var f = 0; f < fib; f++) {
    var fx = Math.random() * W, fy = Math.random() * H;
    var len = 6 + Math.random() * 42, ang = Math.random() * Math.PI * 2;
    g.strokeStyle = Math.random() < 0.5 ? 'rgba(146,133,112,0.05)' : 'rgba(255,253,247,0.09)';
    g.beginPath();
    g.moveTo(fx, fy);
    g.quadraticCurveTo(fx + Math.cos(ang + 0.4) * len * 0.5, fy + Math.sin(ang + 0.4) * len * 0.5,
                       fx + Math.cos(ang) * len, fy + Math.sin(ang) * len);
    g.stroke();
  }

  /* 纸的柔和受光：左上偏亮，右下略沉 */
  var lg = g.createRadialGradient(W * 0.28, H * 0.16, 0, W * 0.28, H * 0.16, Math.max(W, H) * 0.92);
  lg.addColorStop(0, 'rgba(255,252,243,0.34)');
  lg.addColorStop(0.5, 'rgba(255,252,243,0.06)');
  lg.addColorStop(1, 'rgba(120,108,90,0.13)');
  g.fillStyle = lg;
  g.fillRect(0, 0, W, H);

  /* —— 鹅卵石：俯拍，冷灰带暖，影在右下。以下按 CSS px 绘制 —— */
  var st = V.stone, s = V.dpr;
  g.save();
  g.setTransform(s, 0, 0, s, 0, 0);

  g.save();
  g.shadowColor = 'rgba(94,82,64,0.34)';
  g.shadowBlur = 44;
  g.shadowOffsetX = 13;
  g.shadowOffsetY = 20;
  stonePath(g, st, 0, 0, 0, 0);
  g.fillStyle = 'rgba(122,112,94,0.16)';
  g.fill();
  g.restore();

  var pg = g.createLinearGradient(st.cx - st.rx, st.cy - st.ry, st.cx + st.rx, st.cy + st.ry);
  pg.addColorStop(0, '#d6d2c9');
  pg.addColorStop(0.34, '#aca79c');
  pg.addColorStop(0.68, '#78746c');
  pg.addColorStop(1, '#585550');
  stonePath(g, st, 0, 0, 0, 0);
  g.fillStyle = pg;
  g.fill();

  /* 石面斑驳：固定 26 团，裁剪在石内 */
  g.save();
  stonePath(g, st, 0, 0, 0, 0);
  g.clip();
  for (var m = 0; m < 26; m++) {
    var mx = st.cx - st.rx + Math.random() * st.rx * 2;
    var my = st.cy - st.ry + Math.random() * st.ry * 2;
    var mr = 7 + Math.random() * 44;
    var mg = g.createRadialGradient(mx, my, 0, mx, my, mr);
    var light = Math.random() < 0.5;
    mg.addColorStop(0, light ? 'rgba(234,230,220,0.20)' : 'rgba(62,59,54,0.17)');
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mg;
    g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
  }
  var hg = g.createRadialGradient(st.cx - st.rx * 0.34, st.cy - st.ry * 0.48, 0, st.cx - st.rx * 0.34, st.cy - st.ry * 0.48, st.rx * 1.02);
  hg.addColorStop(0, 'rgba(255,255,250,0.32)');
  hg.addColorStop(1, 'rgba(255,255,250,0)');
  g.fillStyle = hg;
  g.fillRect(st.cx - st.rx * 1.6, st.cy - st.ry * 1.6, st.rx * 3.2, st.ry * 3.2);
  /* 底缘一道极淡的接触暗部 */
  var dg = g.createLinearGradient(0, st.cy + st.ry * 0.1, 0, st.cy + st.ry);
  dg.addColorStop(0, 'rgba(0,0,0,0)');
  dg.addColorStop(1, 'rgba(40,37,33,0.20)');
  g.fillStyle = dg;
  g.fillRect(st.cx - st.rx * 1.2, st.cy - st.ry, st.rx * 2.4, st.ry * 2);
  g.restore();

  g.lineWidth = 1.1;
  g.strokeStyle = 'rgba(248,244,235,0.5)';
  stonePath(g, st, 0, 0, -1.1, -1.1);
  g.stroke();
  g.restore();

  /* 细颗粒：预生成图块平铺 */
  if (!V.grain) V.grain = grainTile(180);
  if (V.grain && g.createPattern) {
    var pat = g.createPattern(V.grain, 'repeat');
    if (pat) {
      g.save();
      g.globalAlpha = 0.16;
      g.globalCompositeOperation = 'multiply';
      g.setTransform(s, 0, 0, s, 0, 0);
      g.fillStyle = pat;
      g.fillRect(0, 0, V.w, V.h);
      g.restore();
    }
  }

  /* 四角轻微压暗，像一张摊开的纸 */
  g.setTransform(1, 0, 0, 1, 0, 0);
  var vg = g.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.28, W * 0.5, H * 0.48, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(96,84,64,0.17)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);
}

var RIP = { n: 5, seg: 7 };

function drawAmb(ts) {
  var g = actx, c = els.amb;
  if (!g || !c) return;
  var W = c.width, H = c.height, s = V.dpr;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  if (!S.lines.length) { /* 空状态也保留水纹，只做更轻的呼吸 */ }

  var st = V.stone, wt = V.water;
  var bass = S.playing ? S.live.bass : S.live.bass * 0.4;
  var tre = S.playing ? S.live.treble : 0;
  var ph = V.phase;
  var rm = S.rm;
  var amp = (rm ? 1.4 : 3.0 + bass * 13) * s;
  var speed = rm ? 0.22 : 0.55 + bass * 1.5;
  var gap = st.ry * (rm ? 0.58 : 0.56 + bass * 0.1);

  g.save();
  try {
    g.beginPath();
    g.rect(0, 0, W, H);
    if (g.ellipse) g.ellipse(st.cx * s, st.cy * s, (st.rx + 2) * s, (st.ry + 2) * s, st.rot, 0, Math.PI * 2);
    g.clip('evenodd');
  } catch (e) { /* clip 不支持就不裁，最多让线压过石头一次 */ }

  g.lineCap = 'round';
  var baseCol = 'rgba(' + wt[0] + ',' + wt[1] + ',' + wt[2] + ',';
  for (var k = 0; k < RIP.n; k++) {
    var y0 = (st.cy + (k - (RIP.n - 1) / 2) * gap) * s;
    var ak = amp * (0.55 + 0.45 * Math.sin(k * 1.3 + 0.7));
    var sp = speed * (0.8 + k * 0.09);
    var alpha = 0.20 + (k === 2 ? 0.16 : 0) + tre * 0.12;
    g.strokeStyle = baseCol + alpha.toFixed(3) + ')';
    g.lineWidth = (k === 2 ? 1.5 : 1) * s;
    g.beginPath();
    for (var i = 0; i <= RIP.seg; i++) {
      var u = i / RIP.seg;
      var x = (u * (V.w + 80) - 40) * s;
      var wave = Math.sin(u * 6.1 + ph * sp + k * 0.9) * ak
               + Math.sin(u * 11.7 - ph * sp * 1.37 + k * 1.9) * ak * 0.34;
      var y = y0 + wave;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }

  /* 一道更亮的细流，缓慢横移，像水面反光 */
  if (!rm) {
    var px = ((ph * 0.09) % 1) * (V.w + 320) - 160;
    var py = (st.cy + gap * 0.5) * s;
    var pg = g.createLinearGradient((px - 150) * s, 0, (px + 150) * s, 0);
    pg.addColorStop(0, baseCol + '0)');
    pg.addColorStop(0.5, baseCol + (0.55 + tre * 0.3).toFixed(3) + ')');
    pg.addColorStop(1, baseCol + '0)');
    g.strokeStyle = pg;
    g.lineWidth = 1.6 * s;
    g.beginPath();
    g.moveTo((px - 170) * s, py + Math.sin(ph * 0.9) * 4 * s);
    g.quadraticCurveTo(px * s, py + Math.sin(ph * 0.9 + 0.8) * 9 * s, (px + 170) * s, py + Math.sin(ph * 0.9 + 1.6) * 4 * s);
    g.stroke();
  }
  g.restore();
}

function frame(ts) {
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  S.frames++;
  if (!V.t0) V.t0 = ts;
  var dt = (ts - V.t0) / 1000;
  dt = isFinite(dt) ? clamp(dt, 0, 600) : 0;
  V.phase = dt;
  try {
    reveal();
    drawAmb(ts);
  } catch (e) {
    console.error('[468] frame', e);
  }
  S.js = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
  requestAnimationFrame(frame);
}

function start() {
  els = {
    paper: $('paper'), amb: $('amb'), wrap: $('wrap'), lyr: $('lyr'),
    track: $('track'), meta: $('meta'), sname: $('sname'), sart: $('sart'),
    empty: $('empty'), time: $('time'), prog: $('prog'), rule: $('rule')
  };
  pctx = els.paper.getContext('2d');
  actx = els.amb.getContext('2d');
  S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  try { resize(); } catch (e) { console.error('[468] resize', e); }
  window.addEventListener('resize', function () {
    try { resize(); } catch (e) { console.error('[468] resize', e); }
  });
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload || {});
      else if (d.type === 'tick') onTick(d.payload || {});
      else if (d.type === 'beat') S.beat = clamp(num(d.payload && d.payload.level, 0), 0, 1);
      else if (d.type === 'live') {
        var lp = d.payload || {};
        S.live.bpm = num(lp.bpm, 0);
        S.live.level = clamp(num(lp.level, 0), 0, 1);
        S.live.bass = clamp(num(lp.bass, 0), 0, 1);
        S.live.mid = clamp(num(lp.mid, 0), 0, 1);
        S.live.treble = clamp(num(lp.treble, 0), 0, 1);
        if (typeof lp.playing === 'boolean') S.playing = lp.playing;
      }
    } catch (err) { console.error('[468] message', err); }
  });
  requestAnimationFrame(function first(ts) {
    sendReady();
    frame(ts);
    if (!S.lines.length) { /* 空状态：等一帧后再量一次布局 */ }
    setTimeout(function () {
      try { layoutTrack(); } catch (e) { console.error('[468] relayout', e); }
    }, 260);
  });
  setTimeout(sendReady, 900);
}

try { start(); }
catch (e) { console.error('[468] start', e); }
</script>
</body>
