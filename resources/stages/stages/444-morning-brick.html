<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>晨光走廊</title>
<style>
  :root{
    --ink:#1c1209;
    --ink2:#6b4629;
    --paper:#f8ecd4;
    --red:#7c2d1e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#f2e2c2;}
  body{
    font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC","SimSun",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.30;mix-blend-mode:multiply}
  #vign{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 62% 18%,rgba(255,246,220,0) 38%,rgba(96,58,26,.10) 78%,rgba(74,40,16,.24) 100%)}
  #meta{position:fixed;top:7vh;right:5vw;display:flex;flex-direction:row;
    gap:1.0em;align-items:flex-start;pointer-events:none}
  #mTitle{writing-mode:vertical-rl;font-size:clamp(17px,1.55vw,26px);letter-spacing:.34em;
    color:var(--red);opacity:.94;text-shadow:0 1px 0 rgba(255,250,235,.45)}
  #mArtist{writing-mode:vertical-rl;font-size:clamp(11px,1.02vw,15px);letter-spacing:.26em;
    color:#6a4a2c;opacity:.8;margin-top:1.9em}
  #seal{width:1.85em;height:1.85em;background:#b13a24;color:#fdf3e3;border-radius:2px;
    display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.1vw,16px);
    letter-spacing:0;opacity:.9;margin-top:1.5em;box-shadow:0 1px 0 rgba(255,255,255,.25) inset}
  #lyr{position:fixed;left:7.5vw;top:46%;width:min(44vw,660px);transform:translateY(-50%);
    pointer-events:none}
  .line{line-height:1.42;transition:opacity .5s ease}
  #cur{font-size:clamp(26px,3.3vw,56px);letter-spacing:.03em;font-weight:600;color:var(--ink);
    line-height:1.40;word-break:break-word;overflow-wrap:break-word}
  #cur.long{font-size:clamp(21px,2.45vw,40px)}
  #cur.xlong{font-size:clamp(17px,1.9vw,30px);line-height:1.5}
  #prev,#next{font-size:clamp(14px,1.35vw,22px);color:var(--ink2);opacity:.66;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #prev{margin-bottom:.55em}
  #next{margin-top:.55em;opacity:.5}
  .ch{color:#5a3d24;transition:color .20s linear}
  .ch.on{color:#1a1008}
  #empty{display:none;font-size:clamp(15px,1.5vw,22px);letter-spacing:.22em;color:#7a5a3a;opacity:.85}
  #bar{position:fixed;left:8vw;bottom:8vh;width:min(300px,26vw);height:2px;
    background:rgba(90,58,30,.18);pointer-events:none}
  #barFill{height:100%;width:0%;background:linear-gradient(90deg,#c08a3e,#e7b978);}
  @keyframes riseIn{from{opacity:0;transform:translateY(.3em)}to{opacity:1;transform:none}}
  #cur.in{animation:riseIn .52s cubic-bezier(.2,.7,.3,1) both}
  @media (prefers-reduced-motion: reduce){#cur.in{animation-duration:.01s}}
  @media (max-aspect-ratio:3/4){
    #lyr{left:7vw;top:60%;width:86vw}
    #cur{font-size:clamp(23px,6.4vw,40px)}
    #prev,#next{font-size:clamp(12px,3.4vw,16px)}
    #meta{top:5.5vh;right:5vw;transform:scale(.92);transform-origin:top right}
    #bar{left:7vw;bottom:6vh;width:44vw}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="grain"></div>
<div id="vign"></div>
<div id="meta">
  <div id="mTitle"></div>
  <div id="mArtist"></div>
  <div id="seal">晨</div>
</div>
<div id="lyr">
  <div class="line" id="prev"></div>
  <div class="line" id="cur"></div>
  <div class="line" id="next"></div>
  <div id="empty">无词 · 器乐</div>
</div>
<div id="bar"><div id="barFill"></div></div>

<script>
var ST = {lines:[], idx:-1, t:0, playing:true, frames:0, js:0, err:'', text:'', gl:false, rm:false};

try{
  ST.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}catch(e){ console.error('[444] rm', e); }

window.__stage = function(){
  return {
    lines: ST.lines.length, idx: ST.idx, t: ST.t, playing: ST.playing,
    frames: ST.frames, js: ST.js, err: ST.err, text: ST.text,
    gl: ST.gl, rm: ST.rm
  };
};

var ACC = [196, 104, 62];
var W = 1440, H = 900, DPR = 1;
var DUR = 0;
var shLvl = 0;      /* 晨光强度（频谱/鼓点驱动） */
var beatPulse = 0;  /* 鼓点脉冲，衰减 */
var liveLvl = 0;
var bassLvl = 0;
var grainMade = false;
var songTitle = '', songArtist = '';
var cvs = document.getElementById('scene');
var ctx = cvs.getContext('2d');
var elCur = document.getElementById('cur');
var elPrev = document.getElementById('prev');
var elNext = document.getElementById('next');
var elEmpty = document.getElementById('empty');
var elBarFill = document.getElementById('barFill');
var elGrain = document.getElementById('grain');
var elTitle = document.getElementById('mTitle');
var elArtist = document.getElementById('mArtist');

var chars = [];            /* 当前句的 span 节点 */
var charTimes = null;      /* 当前句逐字时间 */
var lineNodes = null;      /* 当前句拆解缓存 */
var dirtyChars = true;
var lastLit = -99, jsAcc = 0, jsN = 0;

var readySent = false;
function sendReady(){
  if(readySent) return;
  readySent = true;
  try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }
  catch(e){ console.error('[444] ready', e); }
}

function setSong(song){
  if(!song) return;
  songTitle = String(song.name == null ? '' : song.name).trim();
  var a = song.artists;
  if(Object.prototype.toString.call(a) === '[object Array]') a = a.join(' / ');
  songArtist = String(a == null ? '' : a).trim();
  elTitle.textContent = songTitle || '无题';
  elArtist.textContent = songArtist;
}

function normalize(lines){
  var out = [];
  if(!lines || typeof lines.length !== 'number') return out;
  var n = Math.min(lines.length, 2000);
  for(var i=0;i<n;i++){
    var L = lines[i]; if(!L) continue;
    var txt = L.text == null ? '' : String(L.text);
    if(!txt.replace(/\s+/g,'')) continue;
    var t = Number(L.t); if(!isFinite(t) || t < 0) t = 0;
    var d = Number(L.dur); if(!isFinite(d) || d <= 0) d = 0;
    out.push({t:t, dur:d, text:txt, chars:(L.chars && typeof L.chars.length === 'number') ? L.chars : null});
  }
  out.sort(function(a,b){ return a.t - b.t; });
  return out;
}

function clearLines(){
  ST.lines = []; ST.idx = -1; ST.text = '';
  chars = []; charTimes = null; lineNodes = null;
  elCur.innerHTML = ''; elPrev.textContent = ''; elNext.textContent = '';
  elEmpty.style.display = 'block';
  elBarFill.style.width = '0%';
}

/* 每句只建一次 DOM，逐字 span */
function renderLine(i){
  var L = ST.lines[i];
  if(!L){ return; }
  var txt = L.text;
  var frag = document.createDocumentFragment();
  var nodes = [], times = [];
  var cs = L.chars;
  var hasChars = !!(cs && cs.length);
  for(var k=0;k<txt.length;k++){
    var sp = document.createElement('span');
    sp.className = 'ch';
    sp.textContent = txt.charAt(k);
    frag.appendChild(sp);
    nodes.push(sp);
    if(hasChars){
      var c = cs[k];
      var ct = (c && typeof c === 'object') ? Number(c.t) : NaN;
      times.push(isFinite(ct) ? ct : (L.t + (L.dur || 2) * (k / Math.max(1, txt.length))));
    }else{
      times.push(NaN);
    }
  }
  elCur.innerHTML = '';
  elCur.className = 'line' + (txt.length > 26 ? ' xlong' : (txt.length > 15 ? ' long' : ''));
  if(!ST.rm){ elCur.classList.remove('in'); void elCur.offsetWidth; elCur.classList.add('in'); }
  elCur.appendChild(frag);
  chars = nodes;
  lastLit = -99;
  ST.text = txt;
  /* LRC 情况下按句长均分 */
  if(!hasChars){
    var dur = L.dur > 0 ? L.dur : 3.2;
    var m = times.length;
    for(var j=0;j<m;j++) times[j] = L.t + dur * (j / Math.max(1,m));
  }
  charTimes = times;
  dirtyChars = true;
  var p = ST.lines[i-1], q = ST.lines[i+1];
  elPrev.textContent = p ? p.text : '';
  elNext.textContent = q ? q.text : '';
  elEmpty.style.display = 'none';
}

function findIdx(t){
  var arr = ST.lines, lo = 0, hi = arr.length - 1, r = -1;
  while(lo <= hi){
    var mid = (lo + hi) >> 1;
    if(arr[mid].t <= t + 0.001){ r = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return r;
}

function onInit(p){
  if(!p) p = {};
  var acc = p.accent;
  if(acc && typeof acc.length === 'number' && acc.length >= 3){
    var r = Number(acc[0]), g = Number(acc[1]), b = Number(acc[2]);
    if(isFinite(r) && isFinite(g) && isFinite(b)) ACC = [r|0, g|0, b|0];
  }
  setSong(p.song);
  DUR = Number(p.duration); if(!isFinite(DUR) || DUR < 0) DUR = 0;
  ST.playing = (p.playing === false) ? false : true;
  clearLines();
  ST.lines = normalize(p.lines);
  if(!ST.lines.length){ clearLines(); return; }
  elEmpty.style.display = 'none';
  ST.idx = findIdx(ST.t);
  if(ST.idx >= 0) renderLine(ST.idx);
  else {
    elCur.innerHTML = '';
    elCur.className = 'line';
    elPrev.textContent = '';
    elNext.textContent = ST.lines[0] ? ST.lines[0].text : '';
  }
}

function onTick(p){
  if(!p) return;
  var t = Number(p.time);
  ST.t = (isFinite(t) && t >= 0) ? t : 0;
  if(typeof p.playing === 'boolean') ST.playing = p.playing;
  if(!ST.lines.length) return;
  var i = findIdx(ST.t);
  if(i !== ST.idx){
    ST.idx = i;
    if(i >= 0) renderLine(i);
    else {
      elCur.innerHTML = '';
      elCur.className = 'line';
      chars = []; charTimes = null; lastLit = -99;
      elPrev.textContent = '';
      elNext.textContent = ST.lines[0] ? ST.lines[0].text : '';
    }
  }
  ST.text = i >= 0 ? ST.lines[i].text : '';
  if(DUR > 0) elBarFill.style.width = Math.max(0, Math.min(1, ST.t / DUR)) * 100 + '%';
}

window.addEventListener('message', function(ev){
  var d = ev.data;
  if(!d || d.__c100 !== 1) return;
  try{
    if(d.type === 'init') onInit(d.payload);
    else if(d.type === 'tick') onTick(d.payload);
    else if(d.type === 'beat'){
      var b = d.payload || {};
      var lv = Number(b.level); if(!isFinite(lv)) lv = .5;
      beatPulse = Math.max(beatPulse, Math.max(0, Math.min(1, lv)));
    }
    else if(d.type === 'live'){
      var v = d.payload || {};
      var l2 = Number(v.level); if(isFinite(l2)) liveLvl = Math.max(0, Math.min(1, l2));
      var bs = Number(v.bass); if(isFinite(bs)) bassLvl = Math.max(0, Math.min(1, bs));
    }
  }catch(e){
    ST.err = String((e && e.message) || e);
    console.error('[444] msg ' + d.type, e);
  }
});

function resize(){
  var w = Math.round(window.innerWidth || 0);
  var h = Math.round(window.innerHeight || 0);
  if(!w || !isFinite(w) || w <= 0) w = 1440;
  if(!h || !isFinite(h) || h <= 0) h = 900;
  W = w; H = h;
  DPR = Math.min(1.3, Math.max(1, window.devicePixelRatio || 1));
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildScene();
  buildShafts();
  buildMotes();
  makeGrain();
  paint();
}

/* 一次性胶片颗粒纹理（生成成 data URL，交给 CSS 平铺，零帧开销） */
function makeGrain(){
  if(grainMade) return;
  grainMade = true;
  try{
    var n = 128, c = mkCanvas(n, n), g = c.getContext('2d');
    var img = g.createImageData(n, n), d = img.data, i, v;
    for(i = 0; i < d.length; i += 4){
      v = 138 + ((Math.random() * 74) | 0);
      d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 34 + ((Math.random() * 58) | 0);
    }
    g.putImageData(img, 0, 0);
    elGrain.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
    elGrain.style.backgroundSize = '128px 128px';
  }catch(e){ console.error('[444] grain', e); }
}

/* ---------- 场景：红砖拱廊 · 晨光 ---------- */
var bgCv = null, shCv = null;
var VPX = .63, VPY = .43;
var KL = [.30, .46, .62, .80, 1.00];
var KO = [.46, .62, .80, 1.00, 1.34];
var CL = ['#f7e2c2', '#f1d2a4', '#eabf8e', '#e0a97c', '#d2956a'];
var motes = [], moteN = 0;

function mkCanvas(w, h){
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

function archShape(g, k, L, R, T, F){
  var l = VPX + (L - VPX) * k, r = VPX + (R - VPX) * k;
  var top = VPY + (T - VPY) * k, fl = VPY + (F - VPY) * k;
  var rad = (r - l) / 2, cx = (l + r) / 2, yc = top + rad;
  g.moveTo(l, fl);
  g.lineTo(l, yc);
  g.arc(cx, yc, rad, Math.PI, Math.PI * 2, false);
  g.lineTo(r, fl);
  g.closePath();
}

function buildScene(){
  bgCv = mkCanvas(W * DPR, H * DPR);
  var g = bgCv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  var sx = W, sy = H;
  var L1 = -sx * .04, R1 = sx * .96, T1 = -sy * .34, F1 = sy * 1.10;

  /* 底：晨光空气 */
  var sky = g.createLinearGradient(0, 0, 0, sy);
  sky.addColorStop(0, '#fdf4e3');
  sky.addColorStop(.5, '#f8e7c8');
  sky.addColorStop(1, '#eed3ab');
  g.fillStyle = sky;
  g.fillRect(0, 0, sx, sy);

  /* 远处出口的光 */
  var vx = VPX, vy = VPY;
  var far = g.createRadialGradient(vx, vy, 2, vx, vy, sy * .62);
  far.addColorStop(0, 'rgba(255,253,240,1)');
  far.addColorStop(.35, 'rgba(255,247,222,.85)');
  far.addColorStop(1, 'rgba(255,247,222,0)');
  g.fillStyle = far;
  g.fillRect(0, 0, sx, sy);

  /* 地面 */
  var fl0 = VPY + (F1 - VPY) * KO[4], fl1 = VPY + (F1 - VPY) * KL[0];
  g.beginPath();
  g.moveTo(VPX + (L1 - VPX) * KO[4], fl0);
  g.lineTo(VPX + (R1 - VPX) * KO[4], fl0);
  g.lineTo(vx, vy);
  g.closePath();
  var fg = g.createLinearGradient(0, sy * .95, 0, vy);
  fg.addColorStop(0, '#d8a87c');
  fg.addColorStop(.5, '#e8c79c');
  fg.addColorStop(1, '#fbf0d6');
  g.fillStyle = fg;
  g.fill();

  /* 地上跳动的光带 */
  var j, ka, kb, stripA;
  for(j = 0; j < 9; j++){
    ka = 1.30 - j * .115;
    kb = ka - .062;
    if(kb < .34) break;
    stripA = .34 + .34 * (1 - (ka - .34) / 1.0);
    g.beginPath();
    g.moveTo(VPX + (L1 - VPX) * ka, VPY + (F1 - VPY) * ka);
    g.lineTo(VPX + (R1 - VPX) * ka, VPY + (F1 - VPY) * ka);
    g.lineTo(VPX + (R1 - VPX) * kb, VPY + (F1 - VPY) * kb);
    g.lineTo(VPX + (L1 - VPX) * kb, VPY + (F1 - VPY) * kb);
    g.closePath();
    g.fillStyle = 'rgba(255,246,220,' + Math.max(0, Math.min(.72, stripA)).toFixed(3) + ')';
    g.fill();
  }

  /* 拱券：由远及近 */
  var i, path;
  for(i = 0; i < 5; i++){
    path = new Path2D();
    archShape(path, KO[i], L1, R1, T1, F1);
    archShape(path, KL[i], L1, R1, T1, F1);
    g.fillStyle = CL[i];
    g.fill(path, 'evenodd');

    /* 砖缝 */
    g.save();
    g.clip(path, 'evenodd');
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(150,92,56,.16)';
    var row, yy, xx;
    for(row = 0; row < 26; row++){
      yy = -sy * .3 + row * (sy * .062);
      g.beginPath(); g.moveTo(0, yy); g.lineTo(sx, yy); g.stroke();
    }
    for(row = 0; row < 26; row++){
      yy = -sy * .3 + row * (sy * .062);
      var bw = sx * .072;
      for(xx = -sx * .1; xx < sx * 1.1; xx += bw){
        var off = (row % 2) * bw * .5;
        g.beginPath();
        g.moveTo(xx + off, yy); g.lineTo(xx + off, yy + sy * .062);
        g.stroke();
      }
    }
    g.restore();

    /* 边缘受光 */
    g.beginPath();
    archShape(g, KL[i], L1, R1, T1, F1);
    g.lineWidth = Math.max(1, 2.2 * KL[i]);
    g.strokeStyle = 'rgba(255,250,232,.55)';
    g.stroke();
    g.beginPath();
    archShape(g, KO[i], L1, R1, T1, F1);
    g.lineWidth = Math.max(1, 1.6 * KO[i]);
    g.strokeStyle = 'rgba(140,84,50,.18)';
    g.stroke();
  }

  /* 拱心透出的光斑 */
  var glow = g.createRadialGradient(vx, vy, 1, vx, vy, sy * .30);
  glow.addColorStop(0, 'rgba(255,254,244,.95)');
  glow.addColorStop(.5, 'rgba(255,248,226,.45)');
  glow.addColorStop(1, 'rgba(255,248,226,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, sx, sy);

  /* 靠墙的木吉他（逆光剪影） */
  var gs = Math.min(sy * .082, sx * .058);
  var gx = sx * .805, gy = sy * .845;
  g.save();
  g.translate(gx, gy);
  var shadow = g.createRadialGradient(0, gs * .1, gs * .1, 0, gs * .1, gs * 1.7);
  shadow.addColorStop(0, 'rgba(88,50,26,.30)');
  shadow.addColorStop(1, 'rgba(88,50,26,0)');
  g.fillStyle = shadow;
  g.beginPath();
  g.ellipse(0, gs * .1, gs * 1.9, gs * .55, 0, 0, Math.PI * 2);
  g.fill();
  g.rotate(-.22);
  g.fillStyle = '#5d3a25';
  g.beginPath(); g.ellipse(0, -gs * .12, gs * 1.02, gs * .90, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(0, -gs * 1.12, gs * .76, gs * .66, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(0, -gs * .62, gs * .74, gs * .34, 0, 0, Math.PI * 2); g.fill();
  g.fillRect(-gs * .13, -gs * 3.55, gs * .26, gs * 2.1);
  g.fillRect(-gs * .21, -gs * 4.02, gs * .42, gs * .52);
  g.beginPath(); g.ellipse(0, -gs * .30, gs * .27, gs * .25, 0, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,243,216,.42)'; g.fill();
  g.fillStyle = '#5d3a25';
  g.fillRect(-gs * .42, -gs * .18, gs * .84, gs * .07);
  g.restore();

  /* 近处墙面一点点暖影，收边 */
  var edge = g.createLinearGradient(0, 0, sx * .34, 0);
  edge.addColorStop(0, 'rgba(126,74,40,.22)');
  edge.addColorStop(1, 'rgba(126,74,40,0)');
  g.fillStyle = edge;
  g.fillRect(0, 0, sx * .34, sy);
}

function buildShafts(){
  shCv = mkCanvas(W * .5, H * .5);
  var g = shCv.getContext('2d');
  g.setTransform(.5, 0, 0, .5, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save();
  g.translate(W * 1.04, -H * .08);
  g.rotate(.50);
  for(var i = 0; i < 4; i++){
    var ox = i * W * .128;
    var wd = W * (.048 + (i % 2) * .036);
    var lg = g.createLinearGradient(ox, 0, ox + wd, 0);
    lg.addColorStop(0, 'rgba(255,240,204,0)');
    lg.addColorStop(.5, 'rgba(255,246,216,.52)');
    lg.addColorStop(1, 'rgba(255,240,204,0)');
    g.fillStyle = lg;
    g.fillRect(ox, -H * .5, wd, H * 2.6);
  }
  g.restore();
}

function buildMotes(){
  motes = [];
  moteN = 36;
  var i;
  for(i = 0; i < moteN; i++){
    motes.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: .7 + Math.random() * 1.9,
      vx: -.16 - Math.random() * .34,
      vy: .12 + Math.random() * .30,
      a: .18 + Math.random() * .38
    });
  }
}

function drawDust(dt){
  if(!motes.length) return;
  var spd = ST.rm ? .22 : 1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < motes.length; i++){
    var p = motes[i];
    p.x += p.vx * dt * .26 * spd;
    p.y += p.vy * dt * .26 * spd;
    if(p.x < -24) p.x = W + 24;
    if(p.y > H + 24){ p.y = -24; p.x = Math.random() * W; }
    var a = p.a * (0.55 + 0.45 * Math.sin((ST.t * .9 + i) * 1.3));
    a = Math.max(0, Math.min(.55, a));
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1 + shLvl * 1.2), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,250,226,' + a.toFixed(3) + ')';
    ctx.fill();
  }
  ctx.restore();
}

function paint(){
  if(!bgCv) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCv, 0, 0, W, H);
  drawShafts();
  drawDust(16);
}

function drawShafts(){
  if(!shCv) return;
  var a = .26 + shLvl * .34;
  if(ST.rm) a *= .6;
  var ox = Math.sin(ST.t * .16) * W * .014;
  var oy = Math.cos(ST.t * .21) * H * .010;
  ctx.globalAlpha = Math.max(0, Math.min(.80, a));
  ctx.drawImage(shCv, ox, oy, W, H);
  ctx.globalAlpha = Math.max(0, Math.min(.54, a * .62));
  ctx.drawImage(shCv, -W * .10 - ox * 1.6, -H * .04 + oy * 2.0, W, H);
  ctx.globalAlpha = 1;
}

function frame(now){
  var t0 = performance.now();
  ST.frames++;

  /* 光强：频谱 + 鼓点脉冲，平滑跟随 */
  var tgt = liveLvl * .55 + bassLvl * .35 + beatPulse * .70;
  if(tgt > 1) tgt = 1;
  shLvl += (tgt - shLvl) * (ST.rm ? .25 : .16);
  beatPulse *= 0.90;

  var t = ST.t;
  if(chars.length && charTimes){
    var lo = 0, hi = chars.length - 1, pos = -1;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(charTimes[mid] <= t){ pos = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    if(pos !== lastLit){
      var k, el;
      if(pos > lastLit){
        for(k = lastLit + 1; k <= pos; k++){
          el = chars[k];
          if(el && el.__on !== 1){ el.__on = 1; el.className = 'ch on'; }
        }
      }else{
        for(k = pos + 1; k <= lastLit; k++){
          el = chars[k];
          if(el && el.__on !== 0){ el.__on = 0; el.className = 'ch'; }
        }
      }
      lastLit = pos;
    }
  }

  paint();

  var ms = performance.now() - t0;
  jsAcc += ms;
  if(++jsN >= 30){ ST.js = Math.round((jsAcc / jsN) * 100) / 100; jsAcc = 0; jsN = 0; }

  requestAnimationFrame(frame);
}

window.addEventListener('resize', function(){
  try{ resize(); }catch(e){ ST.err = String(e && e.message || e); console.error('[444] resize', e); }
});

requestAnimationFrame(function(){
  sendReady();
  try{ resize(); }catch(e){ ST.err = String(e && e.message || e); console.error('[444] first', e); }
  requestAnimationFrame(frame);
});
setTimeout(sendReady, 1200);
</script>
