<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>458 · 果冻写真</title>
<style>
  :root{
    --ink:#2b1240;
    --ink2:#4d2170;
    --dim:#6a5b8c;
    --paper:#f8f4ff;
    --hot:#ff3d92;
    --sun:#ff8a2b;
    --mint:#3fd8c0;
    --sky:#6ea8ff;
    --lvl:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#f8f4ff; color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* ---------- 高调影棚柔光底 ---------- */
  #bg{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -18%, #ffffff 0%, #fdf8ff 38%, #f2eaff 72%, #e8e0fb 100%);
  }
  .blob{position:absolute;border-radius:50%;opacity:.68;will-change:transform}
  .b1{width:62vw;height:62vw;left:-16vw;top:-20vw;
      background:radial-gradient(circle at 38% 34%, #ffd9ec 0%, #ffb2d8 42%, rgba(255,143,200,0) 70%);}
  .b2{width:54vw;height:54vw;right:-14vw;top:6vh;
      background:radial-gradient(circle at 40% 40%, #ffe6c2 0%, #ffc281 46%, rgba(255,168,90,0) 72%);}
  .b3{width:56vw;height:56vw;left:16vw;bottom:-30vw;
      background:radial-gradient(circle at 45% 40%, #d3fff4 0%, #9df0dd 44%, rgba(126,235,212,0) 72%);}
  .b4{width:34vw;height:34vw;right:20vw;bottom:-8vw;
      background:radial-gradient(circle at 44% 40%, #dce9ff 0%, #a8c8ff 48%, rgba(150,190,255,0) 74%);}
  @keyframes drift1{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3vw,2vh,0) scale(1.06)}100%{transform:translate3d(0,0,0) scale(1)}}
  @keyframes drift2{0%{transform:translate3d(0,0,0) scale(1.04)}50%{transform:translate3d(-3.4vw,-2vh,0) scale(.98)}100%{transform:translate3d(0,0,0) scale(1.04)}}
  .b1{animation:drift1 17s ease-in-out infinite}
  .b2{animation:drift2 21s ease-in-out infinite}
  .b3{animation:drift1 25s ease-in-out infinite}
  .b4{animation:drift2 19s ease-in-out infinite}
  /* 扫描柔光：整块渐变位移，不做 blur */
  #sheen{position:absolute;inset:-30% -40%;
    background:linear-gradient(104deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.86) 47%, rgba(255,255,255,.2) 55%, rgba(255,255,255,0) 66%);
    will-change:transform;opacity:.75;animation:sweep 9.5s cubic-bezier(.4,0,.5,1) infinite}
  @keyframes sweep{0%{transform:translate3d(-34%,0,0)}55%{transform:translate3d(34%,0,0)}100%{transform:translate3d(34%,0,0)}}
  /* 金属银箔条 */
  #foil{position:absolute;left:-8vw;top:0;bottom:0;width:24vw;
    background:linear-gradient(96deg,
      rgba(255,255,255,0) 0%, rgba(214,219,232,.55) 22%, rgba(255,255,255,.95) 38%,
      rgba(168,176,198,.45) 52%, rgba(255,255,255,.9) 68%, rgba(255,255,255,0) 100%);
    transform:rotate(11deg) translateX(-6vw);opacity:.72}
  #grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:multiply;
    background-image:repeating-linear-gradient(0deg, rgba(120,90,160,.16) 0 1px, rgba(0,0,0,0) 1px 3px);
    }
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  /* ---------- 版式 ---------- */
  #frame{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(12px,2.4vh,26px) clamp(14px,3.2vw,46px);pointer-events:none}
  #hud{display:flex;align-items:flex-start;justify-content:space-between;gap:2vw}
  .tag{font-size:clamp(8px,.86vw,11px);letter-spacing:.34em;text-transform:uppercase;color:#4a3a6a;font-weight:700}
  .tag b{display:block;font-size:clamp(18px,2.6vw,34px);letter-spacing:.02em;color:#2b1240;
    font-weight:900;line-height:1;margin-top:.32em}
  #songBox{text-align:right;max-width:46vw}
  #songName{display:block;font-size:clamp(11px,1.28vw,16px);font-weight:900;color:#33194a;
    letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #songArt{display:block;font-size:clamp(8px,.82vw,11px);letter-spacing:.2em;color:#7b6c9c;
    margin-top:.34em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 数位条形码 */
  #barcode{display:flex;align-items:flex-end;gap:2px;height:clamp(26px,4.4vh,46px);
    margin-top:clamp(6px,1.2vh,12px);justify-content:flex-end}
  #barcode i{display:block;width:2px;background:#33204d;opacity:.82;height:100%}
  #barcode i.w{width:4px}
  /* ---------- 歌词 ---------- */
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(6px,1.6vh,16px);padding:2vh 0;min-height:0;
    transform:scale(1);transform-origin:50% 55%;transition:transform .3s cubic-bezier(.2,.9,.2,1)}
  .ghost{font-size:clamp(12px,1.7vw,22px);font-weight:700;letter-spacing:.06em;text-align:center;
    max-width:86vw;color:#6a5b8c;opacity:.72;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #line{
    font-size:var(--ls,clamp(28px,6vw,84px));
    font-weight:900;line-height:1.16;letter-spacing:.015em;text-align:center;
    max-width:90vw;padding:.1em .04em;max-height:62vh;overflow:hidden;
    /* 果冻字：硬白描边 + 硬投影（不用柔光，保证亮底对比度） */
    color:#2b1240;
    -webkit-text-stroke:.045em rgba(255,255,255,.96);
    paint-order:stroke fill;
    text-shadow:0 .045em 0 rgba(255,61,146,.5), 0 .1em .16em rgba(90,40,130,.22);
    word-break:break-word;overflow-wrap:anywhere;
  }
  #line .c{display:inline-block;white-space:pre;will-change:transform,opacity;
    color:#6b5b93;text-shadow:0 .045em 0 rgba(150,140,185,.4);transition:color .16s linear}
  #line .c.on{color:#2b1240;text-shadow:0 .045em 0 rgba(255,61,146,.5), 0 .1em .16em rgba(90,40,130,.2)}
  #line .c.pop{transform:translateY(-.1em) scale(1.06)}
  #line.empty{font-size:clamp(18px,2.4vw,30px);font-weight:800;color:#5a4b7d;
    -webkit-text-stroke:0;text-shadow:none}
  /* ---------- 底栏 ---------- */
  #foot{display:flex;align-items:center;gap:clamp(8px,1.6vw,18px)}
  #clock{font-size:clamp(9px,.9vw,12px);font-weight:800;letter-spacing:.14em;color:#4a3a6a;
    font-variant-numeric:tabular-nums;min-width:4.6em}
  #bar{flex:1;height:clamp(5px,1vh,9px);border-radius:99px;overflow:hidden;
    background:linear-gradient(#e3d8f6,#f6f1ff);
    box-shadow:inset 0 1px 2px rgba(90,60,130,.28), 0 1px 0 rgba(255,255,255,.9)}
  #fill{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#ff8a2b,#ff3d92 55%,#7d6bff);
    box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}
  #liveDot{font-size:clamp(9px,.9vw,12px);color:#ff3d92;opacity:.35;transition:opacity .2s}
  #liveDot.on{opacity:1}
  @media (prefers-reduced-motion: reduce){
    .blob,#sheen{animation:none !important}
    #sheen{opacity:.3;transform:translate3d(0,0,0)}
    #line .c{transition:none}
    #stage{transition:none}
    #liveDot{transition:none}
  }
  @media (max-aspect-ratio:3/4){
    #barcode{display:none}
    #songBox{max-width:52vw}
    #line{font-size:var(--ls,clamp(26px,8.4vw,54px));line-height:1.28;max-height:56vh}
    #foil{width:34vw;opacity:.5}
    #hud .tag b{font-size:clamp(15px,4.6vw,24px)}
    #stage{gap:clamp(5px,1.2vh,12px)}
    .ghost{font-size:clamp(11px,3.4vw,16px)}
  }
  @media (max-height:430px){
    #line{font-size:var(--ls,clamp(22px,5.4vw,46px))}
    #barcode{display:none}
  }
</style>
</head>
<body>
<div id="bg">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
  <div id="foil"></div>
  <div id="sheen"></div>
  <div id="grain"></div>
</div>
<canvas id="fx"></canvas>
<div id="frame">
  <header id="hud">
    <div class="tag">glossy photobook<b>458<br>Y2K</b></div>
    <div id="songBox">
      <span id="songName">—</span>
      <span id="songArt">now playing</span>
      <div id="barcode"></div>
    </div>
  </header>
  <main id="stage">
    <div id="prev" class="ghost"></div>
    <div id="line">♪</div>
    <div id="next" class="ghost"></div>
  </main>
  <footer id="foot">
    <span id="clock">00:00</span>
    <div id="bar"><i id="fill"></i></div>
    <span id="liveDot">●</span>
  </footer>
</div>
<script>
var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', gl: false, rm: false, duration: 0 };

window.__stage = function () {
  return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm
  };
};

(function () {
  'use strict';
  var lineEl = document.getElementById('line');
  var prevEl = document.getElementById('prev');
  var nextEl = document.getElementById('next');
  var nameEl = document.getElementById('songName');
  var artEl = document.getElementById('songArt');
  var clockEl = document.getElementById('clock');
  var fillEl = document.getElementById('fill');
  var dotEl = document.getElementById('liveDot');
  var barEl = document.getElementById('barcode');
  var sheenEl = document.getElementById('sheen');
  var stageEl = document.getElementById('stage');
  var rootEl = document.documentElement;

  // 必须在使用前建立：resize() 会往里写属性
  var view = { w: 1440, h: 900, dpr: 1 };
  var readySent = false;
  S.rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  window.onerror = function (m, u, l) { S.err = String(m); console.error('[458]', m, u, l); };

  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) { console.error('[458] ready', e); }
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------- 数据 ---------- */
  function parseLines(p) {
    var out = [], src = (p && p.lines) || [], i, k;
    if (!src || typeof src.length !== 'number') return out;
    for (i = 0; i < src.length && i < 2000; i++) {
      var ln = src[i] || {};
      var text = (ln.text == null) ? '' : String(ln.text);
      var ch = [], raw = ln.chars;
      if (raw && typeof raw.length === 'number' && raw.length) {
        for (k = 0; k < raw.length && k < 1600; k++) {
          var c = raw[k] || {};
          ch.push({ c: (c.c == null ? '' : String(c.c)), t: isFinite(c.t) ? +c.t : null });
        }
      }
      out.push({
        t: isFinite(ln.t) ? +ln.t : 0,
        dur: isFinite(ln.dur) && +ln.dur > 0 ? +ln.dur : 0,
        text: text,
        chars: ch.length ? ch : null
      });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function idxAt(t) {
    var lo = 0, hi = S.lines.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (S.lines[mid].t <= t + 0.02) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  /* ---------- 歌词渲染 ---------- */
  var spans = [], charTs = [], cur = 0;

  function fitLine() {
    lineEl.style.fontSize = '';
    var fs = parseFloat(getComputedStyle(lineEl).fontSize) || 32;
    var guard = 0, over = false;
    while (guard < 10) {
      over = (lineEl.scrollWidth > lineEl.clientWidth + 3) || (lineEl.scrollHeight > lineEl.clientHeight + 3);
      if (!over || fs <= 12) break;
      fs *= 0.9;
      lineEl.style.fontSize = fs.toFixed(1) + 'px';
      guard++;
    }
  }

  function renderLine() {
    spans = []; charTs = []; cur = 0;
    var ln = S.lines[S.idx];
    if (!ln) {
      lineEl.className = 'empty';
      lineEl.style.fontSize = '';
      lineEl.textContent = S.lines.length ? '♪' : '这一首没有歌词 · 只剩下音乐';
      prevEl.textContent = '';
      nextEl.textContent = S.lines.length ? (S.lines[0].text || '') : '';
      S.text = '';
      return;
    }
    S.text = ln.text || '';
    lineEl.className = '';
    lineEl.style.fontSize = '';
    var txt = S.text, n = txt.length, i;
    if (!n) {
      lineEl.className = 'empty';
      lineEl.textContent = '· · ·';
      prevEl.textContent = S.idx > 0 ? (S.lines[S.idx - 1].text || '') : '';
      nextEl.textContent = (S.idx < S.lines.length - 1) ? (S.lines[S.idx + 1].text || '') : '';
      return;
    }
    var chars = ln.chars;
    // LRC：没有逐字时间 → 按句长均分；YRC：用真实时间但长度可能对不上，以正文为准截断/补齐
    if (!chars && n && n <= 160) {
      var d = ln.dur || clamp(n * 0.16, 1.1, 9);
      chars = [];
      for (i = 0; i < n; i++) chars.push({ c: txt.charAt(i), t: ln.t + d * (i / n) });
    }
    if (chars && chars.length && n && n <= 160 && chars.length >= n * 0.6 && chars.length <= n * 1.6) {
      var frag = document.createDocumentFragment(), m = Math.min(chars.length, n);
      for (i = 0; i < m; i++) {
        var sp = document.createElement('span');
        sp.className = 'c';
        var cc = chars[i].c || txt.charAt(i) || '';
        sp.textContent = (cc === ' ') ? '\u00a0' : cc;
        frag.appendChild(sp);
        spans.push(sp);
        var ct = chars[i].t;
        charTs.push(isFinite(ct) ? +ct : ln.t + (ln.dur || 2) * (i / m));
      }
      lineEl.textContent = '';
      lineEl.appendChild(frag);
    } else {
      lineEl.textContent = txt || '♪';
    }
    prevEl.textContent = S.idx > 0 ? (S.lines[S.idx - 1].text || '') : '';
    nextEl.textContent = (S.idx < S.lines.length - 1) ? (S.lines[S.idx + 1].text || '') : '';
    fitLine();
  }

  /* ---------- 界面杂项 ---------- */
  function paintMeta() {
    var sec = Math.max(0, S.t);
    var d = S.duration > 0 ? S.duration : 0;
    var mm = Math.floor(sec / 60), ss = Math.floor(sec % 60);
    var s = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
    if (d > 0) {
      var dm = Math.floor(d / 60), ds = Math.floor(d % 60);
      s += ' / ' + (dm < 10 ? '0' : '') + dm + ':' + (ds < 10 ? '0' : '') + ds;
    }
    clockEl.textContent = s;
    fillEl.style.width = (d > 0 ? clamp(sec / d, 0, 1) * 100 : 0).toFixed(2) + '%';
  }

  function buildBarcode(seed) {
    var h = 2166136261 >>> 0, i;
    var str = String(seed || '');
    for (i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    var html = [], n = 34;
    for (i = 0; i < n; i++) {
      h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0;
      var tall = 46 + (h % 54);
      html.push('<i class="' + ((i % 7 === 0) ? 'w' : '') + '" style="height:' + tall + '%"></i>');
    }
    barEl.innerHTML = html.join('');
  }

  /* ---------- 光晕（离屏预渲染，不逐帧重算） ---------- */
  var cv = document.getElementById('fx'), ctx = cv ? cv.getContext('2d') : null;
  var orb = document.createElement('canvas');
  orb.width = orb.height = 200;
  (function () {
    var g = orb.getContext('2d');
    if (!g) return;
    var rg = g.createRadialGradient(100, 100, 0, 100, 100, 100);
    rg.addColorStop(0, 'rgba(255,61,146,.62)');
    rg.addColorStop(0.45, 'rgba(255,120,190,.30)');
    rg.addColorStop(1, 'rgba(255,140,200,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 200, 200);
  })();
  var accentGlow = { r: 255, g: 61, b: 146 };
  var orb2 = document.createElement('canvas');
  orb2.width = orb2.height = 200;

  function retint() {
    var g = orb2.getContext('2d');
    if (!g) return;
    g.clearRect(0, 0, 200, 200);
    var rg = g.createRadialGradient(100, 100, 0, 100, 100, 100);
    rg.addColorStop(0, 'rgba(' + accentGlow.r + ',' + accentGlow.g + ',' + accentGlow.b + ',.5)');
    rg.addColorStop(0.5, 'rgba(' + accentGlow.r + ',' + accentGlow.g + ',' + accentGlow.b + ',.2)');
    rg.addColorStop(1, 'rgba(' + accentGlow.r + ',' + accentGlow.g + ',' + accentGlow.b + ',0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 200, 200);
  }

  var pulse = 0, bass = 0, lvl = 0, settle = 0, lineAt = 0;

  /* 果冻泡泡：预渲染 128px 精灵，逐帧只做 drawImage */
  var bubble = document.createElement('canvas');
  bubble.width = bubble.height = 128;
  (function () {
    var g = bubble.getContext('2d');
    if (!g) return;
    var rg = g.createRadialGradient(64, 64, 10, 64, 64, 62);
    rg.addColorStop(0, 'rgba(255,255,255,0)');
    rg.addColorStop(0.68, 'rgba(255,255,255,.10)');
    rg.addColorStop(0.86, 'rgba(255,255,255,.62)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(64, 64, 62, 0, 6.2832); g.fill();
    // 内圈彩色边
    g.lineWidth = 3;
    g.strokeStyle = 'rgba(255,140,200,.42)';
    g.beginPath(); g.arc(64, 64, 55, 0, 6.2832); g.stroke();
    // 高光
    var hg = g.createRadialGradient(46, 42, 2, 46, 42, 26);
    hg.addColorStop(0, 'rgba(255,255,255,.95)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg;
    g.beginPath(); g.arc(46, 42, 26, 0, 6.2832); g.fill();
    var hg2 = g.createRadialGradient(84, 84, 1, 84, 84, 14);
    hg2.addColorStop(0, 'rgba(255,255,255,.6)');
    hg2.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg2;
    g.beginPath(); g.arc(84, 84, 14, 0, 6.2832); g.fill();
  })();

  var BUB = [], bi;
  for (bi = 0; bi < 9; bi++) {
    BUB.push({
      x: ((bi * 0.37 + 0.11) % 1),
      y: ((bi * 0.53 + 0.2) % 1),
      r: 0.055 + ((bi * 37) % 11) / 100,
      sp: 0.006 + ((bi * 13) % 7) / 900,
      ph: bi * 0.9
    });
  }

  function drawBubbles(w, h) {
    var i, b, base = Math.min(w, h), sz, amp;
    for (i = 0; i < BUB.length; i++) {
      b = BUB[i];
      sz = base * b.r * (1 + pulse * 0.05);
      amp = Math.sin(S.t * 0.6 + b.ph) * h * 0.012;
      ctx.globalAlpha = 0.5 + bass * 0.2;
      ctx.drawImage(bubble,
        b.x * w - sz * 0.5 + amp,
        b.y * h - sz * 0.5 + Math.cos(S.t * 0.45 + b.ph) * h * 0.01,
        sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawGlow() {
    if (!ctx) return;
    var w = view.w, h = view.h;
    ctx.clearRect(0, 0, w, h);
    var cx = w * 0.5, cy = h * 0.52;
    var rad = Math.min(w, h) * (0.52 + bass * 0.12 + pulse * 0.05);
    ctx.globalAlpha = 0.5 + pulse * 0.26;
    ctx.drawImage(orb2, cx - rad, cy - rad, rad * 2, rad * 2);
    var r2 = Math.min(w, h) * 0.2;
    ctx.globalAlpha = 0.34;
    ctx.drawImage(orb, cx + rad * 0.72, cy - rad * 0.55, r2, r2);
    ctx.globalAlpha = 1;
    drawBubbles(w, h);
  }

  /* ---------- 主循环 ---------- */
  var anchorT = 0, anchorAt = 0;

  function frame() {
    var t0 = performance.now();
    S.frames++;
    var t = anchorT;
    if (S.playing) t = anchorT + clamp((t0 - anchorAt) / 1000, 0, 0.14);
    S.t = t;
    var ni = idxAt(t);
    if (ni !== S.idx) { S.idx = ni; renderLine(); lineAt = t0; }
    var g = 0;
    while (g < 400 && cur < spans.length && charTs[cur] <= t + 0.005) {
      spans[cur].classList.add('on');
      cur++; g++;
    }
    // "啪"一下的写真贴纸感：换句时轻微落定
    if (!S.rm) {
      var dt = t0 - lineAt;
      if (dt < 320) { settle = 1 - dt / 320; stageEl.style.transform = 'scale(' + (1.028 - 0.028 * (1 - settle * settle)).toFixed(4) + ')'; }
      else if (settle !== 0) { settle = 0; stageEl.style.transform = 'scale(1)'; }
    }
    drawGlow();
    if (S.frames % 5 === 0) paintMeta();
    pulse *= 0.92; bass *= 0.94;
    S.js = Math.round((performance.now() - t0) * 100) / 100;
    requestAnimationFrame(frame);
  }

  /* ---------- 消息 ---------- */
  function onInit(p) {
    p = p || {};
    S.lines = parseLines(p);
    S.idx = -2; cur = 0;
    S.duration = isFinite(p.duration) && +p.duration > 0 ? +p.duration : 0;
    S.playing = (typeof p.playing === 'boolean') ? p.playing : true;
    anchorT = 0; anchorAt = performance.now();
    var song = p.song || {};
    var nm = (song.name == null ? '' : String(song.name)).trim();
    nameEl.textContent = nm || '未命名';
    var ar = song.artists;
    if (ar && typeof ar.length === 'number' && typeof ar !== 'string') ar = ar.filter(Boolean).join(' / ');
    ar = ar == null ? '' : String(ar);
    artEl.textContent = ar ? ar : 'now playing';
    if (p.accent && p.accent.length >= 3) {
      accentGlow.r = clamp(p.accent[0] | 0, 0, 255);
      accentGlow.g = clamp(p.accent[1] | 0, 0, 255);
      accentGlow.b = clamp(p.accent[2] | 0, 0, 255);
      rootEl.style.setProperty('--hot', 'rgb(' + accentGlow.r + ',' + accentGlow.g + ',' + accentGlow.b + ')');
      retint();
    }
    buildBarcode(song.id || nm || '458');
    S.idx = (S.lines.length && S.lines[0].t <= 0.05) ? 0 : -1;
    renderLine();
    paintMeta();
    dotEl.className = S.playing ? 'on' : '';
  }

  function onTick(p) {
    if (!p) return;
    if (typeof p.time === 'number' && isFinite(p.time)) { anchorT = +p.time; anchorAt = performance.now(); }
    if (typeof p.playing === 'boolean') {
      S.playing = p.playing;
      dotEl.className = S.playing ? 'on' : '';
    }
  }

  function onBeat(p) {
    if (!p) return;
    var lv = isFinite(p.level) ? clamp(+p.level, 0, 1) : 0.5;
    pulse = Math.max(pulse, lv);
  }

  function onLive(p) {
    if (!p) return;
    bass = isFinite(p.bass) ? clamp(+p.bass, 0, 1) : 0;
    if (isFinite(p.level)) rootEl.style.setProperty('--lvl', clamp(+p.level, 0, 1).toFixed(3));
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch (e) { S.err = String(e && e.message || e); console.error('[458] msg', e); }
  });

  function resize() {
    var w = Math.round(window.innerWidth || 0), h = Math.round(window.innerHeight || 0);
    if (!isFinite(w) || w < 1) w = 1440;
    if (!isFinite(h) || h < 1) h = 900;
    view.w = w; view.h = h;
    view.dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    if (cv) {
      cv.width = Math.round(w * view.dpr);
      cv.height = Math.round(h * view.dpr);
      cv.style.width = w + 'px';
      cv.style.height = h + 'px';
      if (ctx) ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    }
    fitLine();
  }

  window.addEventListener('resize', function () {
    try { resize(); } catch (e) { S.err = String(e && e.message || e); console.error('[458] resize', e); }
  });

  // 先建立 view，再调用 resize（顺序不能反）。
  // ready 的 rAF 先注册：即使下面同步初始化抛错，ready 仍会发出。
  requestAnimationFrame(function () { sendReady(); requestAnimationFrame(frame); });
  setTimeout(sendReady, 900);
  try {
    resize();
  } catch (e) { S.err = String(e && e.message || e); console.error('[458] boot', e); }
})();
</script>
</body>
</html>
