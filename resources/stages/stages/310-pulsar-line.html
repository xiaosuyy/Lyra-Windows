<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>310 · 脉冲星线</title>
<style>
  :root{
    --bg:#050506; --ink:#eeece7; --dim:#8c8a86;
    --acc:158,178,190;
    --pad: clamp(18px, 3.4vw, 56px);
    --sans: "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
    --serif: "Songti SC", "STSong", "SimSun", "Times New Roman", serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  /* —— 底子：程序化织物纹理 + 暗角 —— */
  #bg{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0}
  #grain{
    position:fixed; inset:-12%; z-index:3; pointer-events:none;
    opacity:.045; background-repeat:repeat; background-size:150px 150px;
    will-change:background-position;
  }
  #stage{
    position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(22px,5vh,62px);
    padding:var(--pad);
  }
  #inst{width:min(70vw,960px); display:flex; flex-direction:column; gap:10px}
  #hdr{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    font-family:var(--mono); font-size:clamp(8px,0.78vw,11px);
    letter-spacing:.22em; text-transform:uppercase; color:var(--dim);
  }
  #code{display:flex; align-items:baseline; gap:.85em; min-width:0; max-width:74%; white-space:nowrap}
  #nm{font-weight:500; color:rgba(238,236,231,.58); overflow:hidden; text-overflow:ellipsis; min-width:0}
  #ar{font-style:normal; font-weight:400; color:rgba(238,236,231,.30); overflow:hidden; text-overflow:ellipsis; min-width:0}
  #tc{font-variant-numeric:tabular-nums; opacity:.62; white-space:nowrap; letter-spacing:.16em}
  #cvwrap{position:relative; width:100%; height:clamp(164px,31vh,318px)}
  #cv{display:block; width:100%; height:100%; position:relative; z-index:1}
  #lyr{width:min(70vw,960px); text-align:center; display:flex; flex-direction:column; gap:clamp(8px,1.4vh,16px)}
  #prev{
    font-family:var(--serif); font-size:clamp(11px,1.05vw,15px);
    letter-spacing:.06em; color:rgba(238,236,231,.14); line-height:1.55;
    min-height:1.55em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:opacity .5s linear;
  }
  #cur{
    font-family:var(--serif); font-size:clamp(19px,2.2vw,37px);
    letter-spacing:.1em; line-height:1.42; color:rgba(238,236,231,.20);
    white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word;
    min-height:1.42em;
  }
  #cur .lit{color:rgba(243,241,235,.96); transition:color .16s linear}
  #cur .lit.hot{
    color:#fff;
    text-shadow:0 0 13px rgba(255,252,244,.55), 0 0 34px rgba(var(--acc),.32);
    transition:none;
  }
  #cur .car{
    display:inline-block; width:1.5px; height:.86em; margin:0 2px;
    background:rgba(243,241,235,.9); vertical-align:-.02em;
    animation:blink 1.15s steps(1,end) infinite;
  }
  @keyframes blink{0%,55%{opacity:.9}56%,100%{opacity:.05}}
  #empty{
    font-family:var(--mono); font-size:clamp(8.5px,0.82vw,11px);
    letter-spacing:.42em; text-transform:uppercase; color:rgba(238,236,231,.20);
    display:none; flex-direction:column; align-items:center; gap:12px;
  }
  #empty.on{display:flex}
  #empty .rule{width:min(150px,34%); height:1px; background:rgba(238,236,231,.16)}
  @media (prefers-reduced-motion: reduce){
    #cur .car{animation:none; opacity:.7}
    #cur .lit{transition:none}
  }
  /* 竖屏 / 窄屏：仪器收窄、留白改纵向 */
  @media (max-aspect-ratio: 4/5){
    #inst, #lyr{width:88vw}
    #cvwrap{height:clamp(140px,25vh,250px)}
    #lyr{gap:10px}
    #prev{font-size:clamp(10px,2.9vw,13px)}
    #cur{font-size:clamp(18px,6.1vw,26px); letter-spacing:.06em; line-height:1.5}
    #stage{gap:clamp(18px,3.4vh,34px)}
  }
  @media (max-aspect-ratio: 4/5) and (max-height: 700px){
    #cvwrap{height:clamp(120px,22vh,200px)}
    #cur{font-size:clamp(17px,5.4vw,23px)}
  }
  /* 超矮的横屏（如嵌在窄条里） */
  @media (max-height: 520px){
    #cvwrap{height:clamp(104px,27vh,190px)}
    #cur{font-size:clamp(15px,2.9vw,24px); letter-spacing:.06em}
    #prev{display:none}
    #stage{gap:14px}
    #hdr{font-size:8px; letter-spacing:.16em}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="grain"></div>
<div id="stage">
  <div id="inst">
    <div id="hdr">
      <span id="code"><b id="nm">PSR — —</b><i id="ar"></i></span>
      <span id="tc">T+00:00.0</span>
    </div>
    <div id="cvwrap"><canvas id="cv"></canvas></div>
  </div>
  <div id="lyr">
    <div id="prev"></div>
    <div id="cur"></div>
    <div id="empty"><div class="rule"></div><div>no signal</div></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d');
  var elCode = $('code'), elNm = $('nm'), elAr = $('ar'), elTc = $('tc'), elPrev = $('prev'), elCur = $('cur'), elEmpty = $('empty');

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
    duration: 0, song: null, accent: [158,178,190],
    bpm: 0, bass: 0, mid: 0, treble: 0, level: 0,
    beat: -1, beatLevel: 0, beatAt: -1e9, tickAt: 0,
    reduced: false, rmQuery: null
  };

  // ---- 协议：ready 只报一次（成功后绝不因 init 重发；仅在彻底没收到 init 时补投）----
  var readySent = false, readyTries = 0, gotInit = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    readyTries++;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
    if (readyTries < 3){
      setTimeout(function(){
        if (gotInit) return;
        readySent = false;
        sendReady();
      }, 2200);
    }
  }

  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload || {});
      else if (d.type === 'tick') onTick(d.payload || {});
      else if (d.type === 'beat') {
        var bp = d.payload || {};
        S.beat = bp.index | 0;
        S.beatLevel = num(bp.level, .5);
        S.beatAt = nowMs();
        P.beatP = Math.min(1.4, 0.42 + 0.75 * S.beatLevel);   // 这一拍打进波形里
      }
      else if (d.type === 'live') onLive(d.payload || {});
    } catch (e){ S.err = String((e && e.message) || e); }
  });
  window.addEventListener('error', function(e){
    if (!S.err) S.err = String((e && e.message) || 'error');
  });

  function num(v, d){ v = +v; return isFinite(v) ? v : d; }

  // 封面色往冷灰白里压一档，别让高饱和色破坏冷峻
  function muteAccent(a){
    var N = [156, 176, 188], out = [0, 0, 0], i;
    for (i = 0; i < 3; i++) out[i] = Math.round(a[i] * 0.55 + N[i] * 0.45);
    var lum = 0.299 * out[0] + 0.587 * out[1] + 0.114 * out[2];
    if (lum < 96){
      var k = ((96 - lum) / 96) * 0.8;
      for (i = 0; i < 3; i++) out[i] = Math.round(out[i] + (176 - out[i]) * k);
    }
    return out;
  }

  function onInit(p){
    gotInit = true;
    S.song = p.song || {};
    var acc = p.accent;
    if (Array.isArray(acc) && acc.length >= 3) S.accent = muteAccent([+acc[0]||0, +acc[1]||0, +acc[2]||0]);
    try {
      document.documentElement.style.setProperty('--acc', S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2]);
    } catch(e){}
    S.duration = Math.max(0, num(p.duration, 0));
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    else S.playing = true;         // init 不带 playing → 当作正在播放
    var raw = Array.isArray(p.lines) ? p.lines : [];
    S.lines = raw.map(function(l){
      l = l || {};
      var text = (typeof l.text === 'string') ? l.text : (l.text == null ? '' : String(l.text));
      return { t: Math.max(0, num(l.t, 0)), dur: Math.max(0, num(l.dur, 0)), text: text, chars: Array.isArray(l.chars) ? l.chars : null };
    });
    S.idx = -2;                    // 强制重算当前句
    S.tickAt = nowMs();
    LY.key = -99;                  // 强制重建台词层
    LY.spans = []; LY.times = []; LY.litN = -2; LY.car = null; LY.hot = null;
    var blank = !S.lines.length;
    elEmpty.classList.toggle('on', blank);
    if (blank){ elCur.textContent = ''; elPrev.textContent = ''; elPrev._t = ''; }
    renderCode();
    seek(S.t);
  }

  function onTick(p){
    if (typeof p.time === 'number' && isFinite(p.time)) S.t = Math.max(0, p.time);
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    S.tickAt = nowMs();
  }
  function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function onLive(p){
    S.bpm = num(p.bpm, 0);
    S.level = clamp01(num(p.level, 0));
    S.bass = clamp01(num(p.bass, 0));
    S.mid = clamp01(num(p.mid, 0));
    S.treble = clamp01(num(p.treble, 0));
    if (typeof p.playing === 'boolean') S.playing = p.playing;
  }
  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

  function renderCode(){
    var s = S.song || {};
    var ar = s.artists;
    var name = (typeof s.name === 'string') ? s.name.trim() : '';
    var artists = Array.isArray(ar) ? ar.filter(function(v){ return v != null && String(v).trim(); }).join(' / ')
                : (typeof ar === 'string' ? ar.trim() : '');
    elNm.textContent = name || 'PSR — —';
    elAr.textContent = artists;
    elAr.style.display = artists ? '' : 'none';
  }

  function fmtTc(t){
    t = Math.max(0, t || 0);
    var m = Math.floor(t / 60), s = t - m * 60;
    return 'T+' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }

  function seek(t){
    var idx = findLine(t);
    if (idx !== LY.key){
      if (idx >= 0 && LY.key !== -99) P.beatP = Math.max(P.beatP, 0.30);  // 换句时波形多跳一下
      buildLine(idx);
    }
    S.idx = idx;
    if (idx >= 0) paintLit(t);
    else paintLit(-1);
    var pv = idx > 0 ? S.lines[idx - 1] : null;
    var pvText = (pv && pv.text) ? pv.text : '';
    if (elPrev._t !== pvText){
      elPrev._t = pvText;
      elPrev.textContent = pvText;
      elPrev.style.opacity = pvText ? '1' : '0';
    }
  }

  var LY = { key: -1, spans: [], times: [], litN: -2, car: null, hot: null };

  function findLine(t){
    var L = S.lines, n = L.length;
    if (!n) return -1;
    if (t < L[0].t) return -1;
    var lo = 0, hi = n - 1, ans = 0;
    while (lo <= hi){
      var m = (lo + hi) >> 1;
      if (L[m].t <= t){ ans = m; lo = m + 1; } else hi = m - 1;
    }
    return ans;
  }

  function fillTimes(l, len){
    var out = new Array(len), i;
    var ch = l.chars;
    if (ch && ch.length){
      for (i = 0; i < len; i++){
        var c = ch[i];
        var tt = (c && typeof c.t === 'number' && isFinite(c.t)) ? c.t : NaN;
        out[i] = tt;
      }
      // 脏数据兜底：缺失的字用前后已知时间线性插值
      var prev = -1;
      for (i = 0; i < len; i++){
        if (isFinite(out[i])) prev = i;
        else if (prev >= 0){
          var nxt = -1;
          for (var j = i + 1; j < len; j++){ if (isFinite(out[j])){ nxt = j; break; } }
          var a = out[prev], b = (nxt >= 0) ? out[nxt] : a + 0.12 * (len - prev);
          out[i] = a + (b - a) * ((i - prev) / ((nxt >= 0 ? nxt : len) - prev));
        }
      }
      // 开头缺失的字：从第一个已知点往前回填
      var firstKnown = -1;
      for (i = 0; i < len; i++){ if (isFinite(out[i])){ firstKnown = i; break; } }
      if (firstKnown > 0){
        for (i = firstKnown - 1; i >= 0; i--) out[i] = out[i + 1] - 0.12;
      }
      for (i = 0; i < len; i++) if (!isFinite(out[i])) out[i] = l.t + i * 0.12;
    } else {
      var dur = l.dur > 0 ? l.dur : Math.max(1.2, len * 0.17);
      if (dur > 14) dur = 14;
      for (i = 0; i < len; i++) out[i] = l.t + dur * (i / Math.max(1, len));
    }
    return out;
  }

  function buildLine(idx){
    LY.key = idx;
    LY.spans = []; LY.times = []; LY.litN = -2; LY.car = null; LY.hot = null;
    elCur.textContent = '';
    var l = (idx >= 0) ? S.lines[idx] : null;
    if (!l || !l.text){ return; }
    var text = l.text;
    var len = text.length;
    LY.times = fillTimes(l, len);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < len; i++){
      var sp = document.createElement('span');
      sp.textContent = text.charAt(i);
      sp._on = false;
      frag.appendChild(sp);
      LY.spans.push(sp);
    }
    elCur.appendChild(frag);
    fitLine();
  }

  function paintLit(t){
    var sp = LY.spans, n = sp.length, k, count = 0;
    if (!n){ LY.litN = 0; return; }
    for (k = 0; k < n; k++){ if (LY.times[k] <= t + 0.001) count = k + 1; else break; }
    if (count === LY.litN) return;
    for (k = 0; k < n; k++){
      var on = k < count;
      if (sp[k]._on !== on){ sp[k]._on = on; sp[k].className = on ? 'lit' : ''; }
    }
    // 刚点亮的那一个字带一点短暂曝光的余晖
    var hot = count > 0 ? sp[count - 1] : null;
    if (LY.hot && LY.hot !== hot) LY.hot.className = LY.hot._on ? 'lit' : '';
    if (hot){ hot.className = 'lit hot'; LY.hot = hot; } else LY.hot = null;
    if (LY.car && LY.car.parentNode) LY.car.parentNode.removeChild(LY.car);
    LY.car = null;
    if (count > 0 && count < n){
      var car = document.createElement('i');
      car.className = 'car';
      var anchor = sp[count];
      anchor.parentNode.insertBefore(car, anchor);
      LY.car = car;
    }
    LY.litN = count;
  }

  function fitLine(){
    elCur.style.fontSize = '';
    var base = parseFloat(getComputedStyle(elCur).fontSize) || 24;
    var maxH = base * 1.42 * 2.12;
    var fs = base;
    for (var i = 0; i < 11; i++){
      elCur.style.fontSize = fs.toFixed(2) + 'px';
      if (elCur.scrollHeight <= maxH + 1) break;
      fs *= 0.935;
      if (fs < base * 0.52) break;
    }
  }

  function resize(){
    var r = cv.parentNode.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cssW = Math.max(2, r.width); cssH = Math.max(2, r.height); dprNow = dpr;
    cv.width = Math.max(2, Math.round(r.width * dpr));
    cv.height = Math.max(2, Math.round(r.height * dpr));
    paintBg();
    draw();
    fitLine();          // 换尺寸后重算字号
  }

  // ---------- 底子：织物纹理 ----------
  var bgc = $('bg'), bgx = bgc.getContext('2d');
  var linenTile = null, grainTile = null;

  function hash1(n){
    var x = Math.sin(n * 127.1) * 43758.5453;
    return x - Math.floor(x);
  }

  function makeLinen(size){
    var c = document.createElement('canvas');
    c.width = c.height = size;              // 132 = 3px 线距的整数倍，平铺无缝
    var x = c.getContext('2d');
    var img = x.createImageData(size, size);
    var d = img.data;
    for (var y = 0; y < size; y++){
      var rowTh = (y / 3) | 0;
      var hj = 0.68 + 0.34 * hash1(rowTh * 2.3 + 11);       // 每根纬线粗细不同
      var slub = hash1(rowTh * 3.1 + 5) > 0.90 ? 1.9 : 0;   // 偶发的纬向粗节
      var weft = (0.5 + 0.5 * Math.sin(y * 2.0943951)) * hj * (1 + slub * 0.5);
      for (var px = 0; px < size; px++){
        var i = (y * size + px) * 4;
        var colTh = (px / 3) | 0;
        var wj = 0.68 + 0.34 * hash1(colTh * 1.7 + 3);      // 每根经线也不同
        var warp = (0.5 + 0.5 * Math.sin(px * 2.0943951)) * wj;
        var grain = Math.random() - 0.5;
        var v = 2.9 + 5.8 * (warp * 0.55 + weft * 0.45) + grain * 2.6;
        if (warp > 0.62 && weft > 0.62) v += 2.6;           // 交织点微亮
        if (Math.random() < 0.0016) v += 6.5;               // 纤维杂点
        if (v < 0) v = 0;
        d[i] = v; d[i+1] = v * 0.985; d[i+2] = v * 0.955; d[i+3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  function makeGrain(size){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var x = c.getContext('2d');
    var img = x.createImageData(size, size);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4){
      var v = 120 + (Math.random() - 0.5) * 190;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  function paintBg(){
    var w = window.innerWidth, h = window.innerHeight;
    var dpr = Math.min(1.5, window.devicePixelRatio || 1);
    bgc.width = Math.max(2, Math.round(w * dpr));
    bgc.height = Math.max(2, Math.round(h * dpr));
    bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!linenTile) linenTile = makeLinen(132);
    var pat = bgx.createPattern(linenTile, 'repeat');
    bgx.fillStyle = '#050506';
    bgx.fillRect(0, 0, w, h);
    bgx.fillStyle = pat;
    bgx.fillRect(0, 0, w, h);
    // 仪器背光：中心极弱的一点亮
    var cx = w / 2, cy = h * 0.42, R = Math.max(w, h) * 0.52;
    var g0 = bgx.createRadialGradient(cx, cy, 0, cx, cy, R);
    g0.addColorStop(0, 'rgba(255,252,245,.030)');
    g0.addColorStop(.55, 'rgba(255,252,245,.008)');
    g0.addColorStop(1, 'rgba(0,0,0,0)');
    bgx.fillStyle = g0;
    bgx.fillRect(0, 0, w, h);
    // 暗角
    var g1 = bgx.createRadialGradient(cx, cy, Math.min(w, h) * 0.16, cx, cy, Math.max(w, h) * 0.78);
    g1.addColorStop(0, 'rgba(0,0,0,0)');
    g1.addColorStop(.62, 'rgba(0,0,0,.34)');
    g1.addColorStop(1, 'rgba(0,0,0,.82)');
    bgx.fillStyle = g1;
    bgx.fillRect(0, 0, w, h);
  }

  var grainEl = $('grain');
  function initGrain(){
    if (!grainTile) grainTile = makeGrain(150);
    try { grainEl.style.backgroundImage = 'url(' + grainTile.toDataURL('image/png') + ')'; } catch(e){}
  }

  // ---------- 主视觉：脉冲星连续波形图（堆叠剖面 / waterfall） ----------
  var P = {
    rows: 38, cols: 128, step: 0.082,
    buf: [], acc: 0, vt: 0, on: false,
    bassS: 0, levelS: 0, trebS: 0, beatP: 0
  };
  var cssW = 2, cssH = 2, dprNow = 1;

  function ringDist(d){
    d = Math.abs(d) % 1;
    return d > 0.5 ? 1 - d : d;
  }

  function pushRow(tRow){
    var a = new Float32Array(P.cols);
    var bass = P.bassS, level = P.levelS, treb = P.trebS, beat = P.beatP;
    var amp = 0.34 + 0.62 * bass + 0.40 * level + 0.42 * beat;
    if (amp > 1.46) amp = 1.46;
    var sigma = 0.0145 + 0.0135 * (1 - treb * 0.75);
    var ph = 0.455
      + 0.031 * Math.sin(tRow * 0.37)
      + 0.013 * Math.sin(tRow * 1.13 + 2.1)
      + 0.022 * beat * Math.sin(tRow * 0.9 + 0.4);
    var br = 0.40 + 0.60 * (0.5 + 0.5 * Math.sin(tRow * 0.51 + 1.2)) * (0.62 + 0.38 * Math.sin(tRow * 0.187));
    var iph = (ph + 0.295) % 1;
    var peak = 0, peakA = 0, c;
    for (c = 0; c < P.cols; c++){
      var f = c / (P.cols - 1);
      var d = ringDist(f - ph);
      var main = Math.exp(-(d * d) / (2 * sigma * sigma));
      var ds = f - ph - 0.05; if (ds < 0) ds = 0;
      var sh = 0.22 * Math.exp(-(ds * ds) / (2 * 0.055 * 0.055));
      var di = ringDist(f - iph);
      var ip = 0.19 * Math.exp(-(di * di) / (2 * 0.030 * 0.030));
      var v = (main + sh + ip) * amp * br + 0.016 + (Math.random() - 0.5) * 0.055;
      a[c] = v;
      if (v > peakA){ peakA = v; peak = f; }
    }
    P.buf.unshift({ a: a, bright: Math.min(1, amp * br * 1.05), peak: peak });
    if (P.buf.length > P.rows) P.buf.pop();
  }

  function seedPlot(){
    P.buf.length = 0;
    for (var i = 0; i < P.rows; i++) pushRow(P.vt - i * P.step);
    P.on = true;
  }

  function update(dt){
    var k = 1 - Math.pow(0.001, dt / 1000);
    P.bassS += (S.bass - P.bassS) * k * 0.8;
    P.levelS += (S.level - P.levelS) * k * 0.8;
    P.trebS += (S.treble - P.trebS) * k * 0.8;
    P.beatP *= Math.exp(-dt / 150);
    if (S.playing) P.vt += dt / 1000;
    if (Math.abs(S.t - P.vt) > 0.6) P.vt = S.t;
    if (!P.on) seedPlot();
    if (S.playing){
      var stepNow = S.reduced ? P.step * 3 : P.step;
      P.acc += dt / 1000;
      var guard = 0;
      while (P.acc >= stepNow && guard++ < 3){
        P.acc -= stepNow;
        pushRow(P.vt);
      }
      if (P.acc > stepNow) P.acc = 0;
    }
  }

  function draw(){
    var W = cssW, H = cssH;
    ctx.setTransform(dprNow, 0, 0, dprNow, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var u = Math.max(0.62, Math.min(1.7, W / 900));
    var x0 = W * 0.035, x1 = W * 0.965;
    var yBot = H * 0.885, yTop = H * 0.055;
    var rowH = (yBot - yTop) / (P.rows - 1 + 2.6);   // 顶部留出峰高余量
    var ampPx = rowH * 1.7;
    var accRgb = S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2];

    // 坐标网格（极弱）
    ctx.lineWidth = Math.max(0.6, u * 0.6);
    ctx.strokeStyle = 'rgba(238,236,231,.045)';
    ctx.beginPath();
    for (var gi = 0; gi <= 4; gi++){
      var gx = x0 + (x1 - x0) * gi / 4;
      ctx.moveTo(gx, yTop - rowH); ctx.lineTo(gx, yBot + rowH * 0.55);
    }
    for (var gj = 1; gj <= 3; gj++){
      var gy = yTop + (yBot - yTop) * gj / 4;
      ctx.moveTo(x0, gy); ctx.lineTo(x1, gy);
    }
    ctx.stroke();

    // 角标（科学制图的对位十字）
    ctx.strokeStyle = 'rgba(238,236,231,.20)';
    ctx.lineWidth = Math.max(0.7, u * 0.8);
    var arm = 5.5 * u, corners = [[x0, yTop], [x1, yTop], [x0, yBot], [x1, yBot]];
    ctx.beginPath();
    for (var ci = 0; ci < 4; ci++){
      var cx0 = corners[ci][0], cy0 = corners[ci][1];
      ctx.moveTo(cx0 - arm, cy0); ctx.lineTo(cx0 + arm, cy0);
      ctx.moveTo(cx0, cy0 - arm); ctx.lineTo(cx0, cy0 + arm);
    }
    ctx.stroke();

    // 相位轴 + 刻度
    ctx.strokeStyle = 'rgba(238,236,231,.16)';
    ctx.beginPath();
    ctx.moveTo(x0, yBot + rowH * 0.55); ctx.lineTo(x1, yBot + rowH * 0.55);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(238,236,231,.26)';
    ctx.beginPath();
    for (var ti = 0; ti <= 8; ti++){
      var tx = x0 + (x1 - x0) * ti / 8;
      var th = (ti % 2 === 0) ? 3.4 * u : 1.8 * u;
      ctx.moveTo(tx, yBot + rowH * 0.55);
      ctx.lineTo(tx, yBot + rowH * 0.55 + th);
    }
    ctx.stroke();

    // 比例尺：只有一段横线与两个端帽，不带数字
    var sby = H - 7 * u, sbw = Math.min(46 * u, (x1 - x0) * 0.12);
    ctx.strokeStyle = 'rgba(238,236,231,.20)';
    ctx.lineWidth = Math.max(0.6, u * 0.7);
    ctx.beginPath();
    ctx.moveTo(x0, sby); ctx.lineTo(x0 + sbw, sby);
    ctx.moveTo(x0, sby - 2.6 * u); ctx.lineTo(x0, sby + 2.6 * u);
    ctx.moveTo(x0 + sbw, sby - 2.6 * u); ctx.lineTo(x0 + sbw, sby + 2.6 * u);
    ctx.moveTo(x0 + sbw * 0.5, sby - 1.6 * u); ctx.lineTo(x0 + sbw * 0.5, sby + 1.6 * u);
    ctx.stroke();

    if (!P.buf.length) return;
    var off = P.acc / (S.reduced ? P.step * 3 : P.step);
    if (off > 1) off = 1;
    var n = P.buf.length, i, c, row, yb;

    // 剖面线：老 → 新
    for (i = n - 1; i >= 0; i--){
      row = P.buf[i];
      var ageN = 1 - i / (P.rows - 1);              // 1 = 最新
      yb = yBot - (i + off) * rowH;
      var alpha = 0.055 + 0.30 * Math.pow(ageN, 2.4) + 0.13 * row.bright * ageN;
      if (alpha > 0.62) alpha = 0.62;
      ctx.strokeStyle = 'rgba(238,236,231,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.62, u * (0.62 + 0.45 * ageN));
      ctx.beginPath();
      for (c = 0; c < P.cols; c++){
        var px = x0 + (x1 - x0) * (c / (P.cols - 1));
        var py = yb - row.a[c] * ampPx;
        if (c === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      // 峰值处一点微光，串成脉冲脊线
      var pkx = x0 + (x1 - x0) * row.peak;
      var pka = 0.10 + 0.55 * row.bright * ageN;
      ctx.fillStyle = 'rgba(' + accRgb + ',' + Math.min(0.72, pka).toFixed(3) + ')';
      var pr = Math.max(0.7, u * (0.55 + 0.75 * ageN));
      ctx.beginPath();
      ctx.arc(pkx, yb - row.a[Math.round(row.peak * (P.cols - 1))] * ampPx, pr, 0, 6.2832);
      ctx.fill();
    }

    // 最新一条：实心亮线（当下这一次脉冲）
    if (P.buf[0]){
      // 拍点：相位轴闪一下
      if (P.beatP > 0.03){
        ctx.strokeStyle = 'rgba(248,246,240,' + Math.min(0.20, 0.19 * P.beatP).toFixed(3) + ')';
        ctx.lineWidth = Math.max(0.7, u * 0.85);
        ctx.beginPath();
        ctx.moveTo(x0, yBot + rowH * 0.55); ctx.lineTo(x1, yBot + rowH * 0.55);
        ctx.stroke();
      }
      row = P.buf[0];
      yb = yBot - off * rowH;
      ctx.save();
      ctx.shadowColor = 'rgba(238,236,231,.45)';
      ctx.shadowBlur = S.reduced ? 0 : 9 * u;
      ctx.strokeStyle = 'rgba(248,246,240,.92)';
      ctx.lineWidth = Math.max(0.9, u * 1.05);
      ctx.beginPath();
      for (c = 0; c < P.cols; c++){
        var qx = x0 + (x1 - x0) * (c / (P.cols - 1));
        var qy = yb - row.a[c] * ampPx;
        if (c === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
      }
      ctx.stroke();
      ctx.restore();

      // 此刻的相位读数：一条极细的竖线
      var curX = x0 + (x1 - x0) * row.peak;
      ctx.save();
      ctx.setLineDash([2.5 * u, 4.5 * u]);
      ctx.strokeStyle = 'rgba(' + accRgb + ',.16)';
      ctx.lineWidth = Math.max(0.6, u * 0.65);
      ctx.beginPath();
      ctx.moveTo(curX, yTop - rowH * 0.6);
      ctx.lineTo(curX, yBot + rowH * 0.5);
      ctx.stroke();
      ctx.restore();

      // 左缘：脉冲强度的小竖标尺
      var lv = Math.max(0, Math.min(1, row.bright));
      var bx = x0 - 3.0 * u;
      ctx.strokeStyle = 'rgba(238,236,231,.13)';
      ctx.lineWidth = Math.max(0.6, u * 0.7);
      ctx.beginPath();
      ctx.moveTo(bx, yBot); ctx.lineTo(bx, yTop); ctx.stroke();
      ctx.strokeStyle = 'rgba(' + accRgb + ',.55)';
      ctx.lineWidth = Math.max(0.9, u * 1.2);
      ctx.beginPath();
      ctx.moveTo(bx, yBot);
      ctx.lineTo(bx, yBot - (yBot - yTop) * lv);
      ctx.stroke();
    }
  }

  // ---- 主循环 ----
  var last = performance.now(), grainAt = 0, tcLast = '';
  function frame(now){
    var a = performance.now();
    S.frames++;
    var dt = Math.min(64, now - last); last = now;
    var tc = fmtTc(S.t);
    if (tc !== tcLast){ tcLast = tc; elTc.textContent = tc; }
    if (!S.reduced && now - grainAt > 130){          // 颗粒微抖，不做每帧重排
      grainAt = now;
      grainEl.style.backgroundPosition = (Math.random() * 150).toFixed(1) + 'px ' + (Math.random() * 150).toFixed(1) + 'px';
    }
    if (S.playing && (now - S.tickAt) > 1200){
      // 父页面没来 tick 时自己走钟，别让画面冻在第一句
      S.t += dt / 1000;
    }
    update(dt);
    draw();
    seek(S.t);
    S.js = performance.now() - a;
    requestAnimationFrame(frame);
  }

  // reduced-motion
  try {
    S.rmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    S.reduced = !!S.rmQuery.matches;
    var onRm = function(e){ S.reduced = e.matches; };
    if (S.rmQuery.addEventListener) S.rmQuery.addEventListener('change', onRm);
    else if (S.rmQuery.addListener) S.rmQuery.addListener(onRm);
  } catch(e){}

  window.addEventListener('resize', resize);
  initGrain();
  resize();
  requestAnimationFrame(frame);
  // ready 在首帧就发（不等 init），此后不再重发
  requestAnimationFrame(function(){ sendReady(); });
  setTimeout(sendReady, 350);

  window.__stage = function(){
    var l = S.lines[S.idx] || null;
    return {
      lines: S.lines.length,
      idx: (S.idx >= 0 && S.lines[S.idx]) ? S.idx : -1,
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: S.js,
      err: S.err || '',
      text: l ? l.text : '',
      gl: false,
      rm: !!S.reduced
    };
  };
})();
</script>
</body>
</html>
