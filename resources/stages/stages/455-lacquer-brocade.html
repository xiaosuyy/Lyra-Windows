<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>455 · 银褶</title>
<style>
  :root{
    --paper:#F1E5CD; --paper2:#E6D3B2; --ink:#1B1714;
    --red:#A8321F; --ochre:#C6892A; --indigo:#233A5B; --cream:#F7E8CA;
    --accent:194,138,43;
    --ly: clamp(19px, 2.9vw, 46px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
  body{
    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #field{position:fixed;inset:0;width:100%;height:100%;display:block}
  #frame{position:fixed;inset:0;pointer-events:none}
  #frame:before{
    content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 0 1px rgba(40,28,18,.16), inset 0 0 0 10px rgba(255,252,242,.22);
  }
  /* —— 顶部登记条 —— */
  #cred{
    position:fixed;left:9.5vw;top:3.4vh;display:flex;flex-direction:column;gap:.42em;
    font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:clamp(8px,1vw,11px);
    letter-spacing:.30em;color:rgba(40,28,18,.66);text-transform:uppercase;
  }
  #cred .bar{width:clamp(40px,6vw,86px);height:3px;background:var(--red);opacity:.9}
  #cred .bar2{width:clamp(24px,3.4vw,52px);height:3px;background:var(--indigo);opacity:.85}
  #cover{
    position:fixed;left:auto;right:4.4vw;top:3.6vh;width:clamp(50px,6.2vw,96px);height:clamp(50px,6.2vw,96px);
    object-fit:cover;filter:saturate(1.05) contrast(1.04);transform:rotate(2.2deg);
    box-shadow:0 0 0 5px rgba(247,232,202,.88), 0 0 0 6px rgba(27,23,20,.42), 0 12px 22px -14px rgba(0,0,0,.75);
    opacity:.96;display:none;
  }
  /* —— 歌词 —— */
  #lyrwin{
    position:fixed;left:9.5vw;top:13vh;height:min(64vh,580px);
    width:min(50vw,760px);overflow:hidden;
    mask-image:linear-gradient(180deg,transparent 0,#000 11%,#000 76%,transparent 99%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 11%,#000 76%,transparent 99%);
  }
  #lyrics{
    position:absolute;left:0;right:0;top:12%;
    display:flex;flex-direction:column;gap:.10em;
    transition:transform .6s cubic-bezier(.22,.8,.2,1);
    will-change:transform;
  }
  .ln{flex:0 0 auto}
  .ln{
    position:relative;font-size:var(--ly);line-height:1.34;letter-spacing:.02em;
    color:rgba(27,23,20,.34);padding:.10em .55em .10em .55em;
    border-radius:1px;transition:color .3s linear, background-color .3s linear;
    text-wrap:balance;word-break:break-word;
  }
  .ln .ch{color:inherit;transition:color .30s linear}
  .ln[data-past="1"]{color:rgba(27,23,20,.22)}
  .ln[data-near="1"]{color:rgba(27,23,20,.50)}
  .ln[data-cur="1"]{
    background:#211A14;color:var(--cream);
    box-shadow:inset 6px 0 0 var(--red), 0 14px 26px -18px rgba(30,20,12,.85);
  }
  .ln[data-cur="1"] .ch{color:rgba(247,232,202,.56)}
  .ln[data-cur="1"] .ch.on{color:#F2B44E}
  /* 漆器标签：句前一枚手撕漆片 + 齿纹边 */
  .ln:before{
    content:"";position:absolute;left:-.34em;top:-.22em;bottom:-.22em;width:.24em;
    background-image:linear-gradient(180deg,var(--red) 0 34%,#C6892A 34% 66%,var(--indigo) 66% 100%);
    background-size:100% 6px;opacity:0;transform:scaleY(.2);transform-origin:50% 50%;
    transition:opacity .28s linear, transform .34s cubic-bezier(.2,.9,.2,1);
  }
  .ln[data-cur="1"]:before{opacity:1;transform:scaleY(1)}
  /* 大银环句读：只给当前句左侧 */
  .ln:after{
    content:"";position:absolute;left:-1.15em;top:50%;width:.62em;height:.62em;
    margin-top:-.31em;border:.09em solid rgba(168,50,31,.62);border-radius:50%;
  }
  #empty{
    position:fixed;left:9.5vw;top:44%;transform:translateY(-50%);
    display:none;font-size:clamp(17px,2.1vw,30px);letter-spacing:.24em;
    color:rgba(27,23,20,.55);
  }
  #empty b{display:block;font-size:1.5em;letter-spacing:.06em;color:rgba(27,23,20,.82);margin-bottom:.5em}
  /* 印章 */
  #stamp{
    position:fixed;right:5vw;bottom:4.6vh;transform:rotate(-7deg);
    font-family:"Songti SC","STSong",serif;font-size:clamp(11px,1.25vw,16px);
    color:rgba(247,232,202,.90);background:rgba(168,50,31,.90);
    letter-spacing:.30em;padding:.85em .55em .95em .55em;
    writing-mode:vertical-rl;line-height:1.02;
    box-shadow:0 10px 20px -14px rgba(60,20,10,.9);
  }
  /* —— 底部署名 —— */
  #song{
    position:fixed;left:9.5vw;bottom:4.2vh;max-width:min(46vw,600px);
    font-family:"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:clamp(9px,1.05vw,12px);letter-spacing:.20em;color:rgba(40,28,18,.62);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;
  }
  @media (max-aspect-ratio: 11/10){
    :root{--ly:clamp(17px,4.6vw,30px)}
    #lyrwin{left:7vw;right:24vw;width:auto;top:22vh;height:52vh}
    #cover{display:none!important}
    #empty{left:7vw;width:62vw;top:40%}
    #song{left:7vw;max-width:64vw;bottom:11vh}
    #cred{left:7vw;top:6vh}
    #stamp{right:4.5vw;bottom:4.4vh;font-size:clamp(10px,2.6vw,14px);letter-spacing:.22em}
    .ln[data-cur="1"]:after{display:none}
    .ln:before{left:-.28em;width:.18em}
  }
  @media (max-width:520px){
    #lyrwin{right:26vw}
    #empty{width:54vw}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="frame"></div>
<div id="cred"><span id="credline">SW · FIELD REC 0455</span><span class="bar"></span><span class="bar2"></span></div>
<img id="cover" alt="">
<div id="lyrwin"><div id="lyrics"></div></div>
<div id="empty"><b>纯器乐</b>没有歌词 · 只听声场</div>
<div id="stamp">西南采风</div>
<div id="song"></div>

<script>
"use strict";
/* ---------- 状态 ---------- */
var view = { w: 1440, h: 900, dpr: 1 };
var S = {
  lines: [], t: 0, playing: true, idx: -1, frames: 0, js: 0,
  rm: false, gl: false, dur: 0, accent: [194, 138, 43],
  bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, beat: 0, beatAt: -9999, rmNow: 0
};
var errText = "";
var reBake = 0;

/* ---------- 自检口（最外层，无条件） ---------- */
window.__stage = function () {
  return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: errText,
    text: (S.idx >= 0 && S.lines[S.idx]) ? S.lines[S.idx].text : "",
    gl: S.gl, rm: S.rm
  };
};

/* ---------- DOM ---------- */
var cvs = document.getElementById("field");
var cx = cvs.getContext("2d", { alpha: false });
var lyricBox = document.getElementById("lyrics");
var emptyBox = document.getElementById("empty");
var coverImg = document.getElementById("cover");
var songBox = document.getElementById("song");
var credLine = document.getElementById("credline");

/* ---------- 工具 ---------- */
function clamp(v, a, b) { v = +v; return (v < a ? a : (v > b ? b : (isFinite(v) ? v : a))); }
function chChars(txt) {
  var out = [], i, c;
  for (i = 0; i < txt.length; i++) {
    c = txt.charAt(i);
    if (c >= "\uD800" && c <= "\uDBFF" && i + 1 < txt.length) { c += txt.charAt(i + 1); i++; }
    out.push(c);
  }
  return out;
}

/* ---------- 尺寸 ---------- */
function resize() {
  var w = window.innerWidth || 1440, h = window.innerHeight || 900;
  if (!isFinite(w) || w < 2) w = 1440;
  if (!isFinite(h) || h < 2) h = 900;
  view.w = w; view.h = h;
  view.dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  cvs.width = Math.round(w * view.dpr);
  cvs.height = Math.round(h * view.dpr);
  cx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  /* 立刻铺一层纸色，避免烘焙完成前出现透明帧（alpha:false 会拖影） */
  if (!bg.width || bg.width < 2) { bg.width = 1; bg.height = 1; }
  bgx.setTransform(1, 0, 0, 1, 0, 0);
  bgx.fillStyle = PAL.paper;
  bgx.fillRect(0, 0, bg.width, bg.height);
  clearTimeout(reBake);
  reBake = setTimeout(function () {
    try { paintBackground(); } catch (e) { errText = String(e && e.message || e); console.error("[455] bake", e); }
  }, 130);
}

/* 雾精灵：离屏烘焙，运行时不重算模糊 */
function buildMist() {
  var mw = 760, mh = 300, c = document.createElement("canvas"), g, gr;
  c.width = mw; c.height = mh;
  g = c.getContext("2d");
  gr = g.createRadialGradient(mw * 0.5, mh * 0.5, 10, mw * 0.5, mh * 0.5, mw * 0.5);
  gr.addColorStop(0, "rgba(255,253,246,.85)");
  gr.addColorStop(0.45, "rgba(247,240,226,.42)");
  gr.addColorStop(1, "rgba(247,240,226,0)");
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(mw * 0.5, mh * 0.5, mw * 0.5, mh * 0.5, 0, 0, Math.PI * 2); g.fill();
  return c;
}

/* ---------- 歌词数据 ---------- */
function initLines(raw, duration) {
  var out = [], i, ln, txt, arr, j, n, dur, times;
  raw = (raw && raw.length) ? raw : [];
  for (i = 0; i < raw.length && i < 800; i++) {
    ln = raw[i] || {};
    txt = (ln.text == null) ? "" : String(ln.text);
    if (!txt) continue;
    n = chChars(txt).length;
    dur = isFinite(ln.dur) && ln.dur > 0 ? +ln.dur : 0;
    if (!dur && i + 1 < raw.length && isFinite(raw[i + 1].t) && isFinite(ln.t)) {
      dur = Math.max(0.2, Math.min(12, raw[i + 1].t - ln.t));
    }
    if (!dur) dur = 3.6;
    times = new Float64Array(n);
    arr = ln.chars;
    if (arr && arr.length === n && isFinite(arr[0] && arr[0].t)) {
      for (j = 0; j < n; j++) times[j] = isFinite(arr[j] && arr[j].t) ? +arr[j].t : (+ln.t + dur * j / n);
    } else {
      for (j = 0; j < n; j++) times[j] = (+ln.t || 0) + dur * j / n;
    }
    out.push({ t: isFinite(ln.t) ? +ln.t : 0, dur: dur, text: txt, chars: chChars(txt), times: times, lit: 0 });
  }
  return out;
}

/* ---------- 歌词 DOM ---------- */
function buildLyricDom() {
  var i, ln, el, j, sp, frag;
  lyricBox.textContent = "";
  lyricBox.style.transform = "translateY(0px)";
  if (!S.lines.length) { emptyBox.style.display = "block"; return; }
  emptyBox.style.display = "none";
  frag = document.createDocumentFragment();
  for (i = 0; i < S.lines.length; i++) {
    ln = S.lines[i];
    el = document.createElement("div");
    el.className = "ln";
    el.dataset.i = String(i);
    for (j = 0; j < ln.chars.length; j++) {
      sp = document.createElement("span");
      sp.className = "ch";
      sp.textContent = ln.chars[j];
      el.appendChild(sp);
    }
    ln.el = el;
    ln.spans = el.childNodes;
    frag.appendChild(el);
  }
  lyricBox.appendChild(frag);
}

/* 根据当前时间推进歌词高亮 */
function renderLyric() {
  var i, ln, n = S.lines.length, cur = -1, k, lit, spans;
  if (!n) return;
  for (i = 0; i < n; i++) { if (S.t + 0.02 >= S.lines[i].t) cur = i; }
  if (cur !== S.idx) {
    S.idx = cur;
    for (i = 0; i < n; i++) {
      ln = S.lines[i];
      ln.el.dataset.cur = (i === cur) ? "1" : "0";
      ln.el.dataset.near = (i === cur + 1 || i === cur - 1) ? "1" : "0";
      ln.el.dataset.past = (i < cur) ? "1" : "0";
      ln.el.style.opacity = (i >= cur - 2 && i <= cur + 3) || cur < 0 ? "1" : "0.13";
    }
  }
  if (cur < 0) return;
  ln = S.lines[cur];
  lit = 0;
  while (lit < ln.times.length && S.t >= ln.times[lit] - 0.04) lit++;
  if (lit !== ln.lit) {
    spans = ln.spans;
    for (k = Math.min(ln.lit, lit); k < Math.max(ln.lit, lit); k++) {
      if (spans[k]) spans[k].className = (k < lit) ? "ch on" : "ch";
    }
    ln.lit = lit;
    /* 高亮跟随时，把当前句送进视口中间（只在换句/首字时写一次样式） */
    if (lit > 0 && lit < 3) centerCurrent(ln.el);
  }
}
function centerCurrent(el) {
  if (!el || !lyricBox) return;
  var target = 8 - el.offsetTop;
  if (target > 0) target = 0;
  lyricBox.style.transform = "translateY(" + Math.round(target) + "px)";
}

/* ================= 视觉：漆器黑红黄 × 苗银 × 织锦拼贴 ================= */
var PAL = {
  paper: "#F1E5CD", paper2: "#E7D5B6", ink: "#1B1714",
  red: "#A8321F", red2: "#7E2417", ochre: "#C6892A",
  indigo: "#233A5B", cream: "#F7E8CA", silver: "#94A0AA", black: "#17120F"
};
var bg = document.createElement("canvas");
var bgx = bg.getContext("2d");
var mistSpr = [];
var rosette = null;
var P = { main: null, strip: null, seamY: 0, silver: { x: 0, y: 0 } };

function mkRng(seed) {
  var s = (seed >>> 0) || 1;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* 双层菱形织锦 */
function mosaic(g, x, y, w, h, cell, seed, cols) {
  var r = mkRng(seed), rows = Math.min(40, Math.ceil(h / cell));
  cols = Math.min(28, cols || Math.ceil(w / cell));
  var i, j, cxp, cyp, d, n;
  for (j = 0; j < rows; j++) {
    for (i = 0; i < cols; i++) {
      cxp = x + cell * (i + 0.5) + (j % 2 ? cell * 0.0 : 0);
      cyp = y + cell * (j + 0.5);
      if (cxp > x + w + cell || cyp > y + h + cell) continue;
      n = r();
      if (n > 0.86) continue;
      d = cell * (0.22 + n * 0.26);
      g.beginPath();
      g.moveTo(cxp, cyp - d); g.lineTo(cxp + d, cyp);
      g.lineTo(cxp, cyp + d); g.lineTo(cxp - d, cyp);
      g.closePath();
      if (n > 0.55) { g.strokeStyle = "rgba(242,232,208,.34)"; g.lineWidth = 1; g.stroke(); }
      else if (n > 0.24) { g.fillStyle = "rgba(150,162,172,.36)"; g.fill(); }
      else { g.fillStyle = "rgba(168,50,31,.42)"; g.fill(); }
    }
  }
}

/* 漆器涡纹（步长固定） */
function spiral(g, x, y, rad, col, lw, turns) {
  var steps = 44, i, th, rr;
  g.beginPath();
  for (i = 0; i <= steps; i++) {
    th = (i / steps) * Math.PI * 2 * turns;
    rr = rad * (0.14 + 0.86 * (i / steps));
    if (i === 0) g.moveTo(x + Math.cos(th) * rr, y + Math.sin(th) * rr);
    else g.lineTo(x + Math.cos(th) * rr, y + Math.sin(th) * rr);
  }
  g.strokeStyle = col; g.lineWidth = lw; g.stroke();
}

/* 阶梯齿纹 */
function teeth(g, x, y, w, h, n, col, up) {
  var step = w / Math.max(1, Math.min(60, n)), i;
  g.fillStyle = col;
  g.beginPath();
  if (up) {
    g.moveTo(x, y + h);
    for (i = 0; i < Math.min(60, n); i++) {
      g.lineTo(x + i * step, y + h);
      g.lineTo(x + i * step, y);
      g.lineTo(x + (i + 0.5) * step, y);
      g.lineTo(x + (i + 0.5) * step, y + h);
    }
    g.lineTo(x + w, y + h);
  } else {
    g.moveTo(x, y);
    for (i = 0; i < Math.min(60, n); i++) {
      g.lineTo(x + i * step, y);
      g.lineTo(x + i * step, y + h);
      g.lineTo(x + (i + 0.5) * step, y + h);
      g.lineTo(x + (i + 0.5) * step, y);
    }
    g.lineTo(x + w, y);
  }
  g.closePath(); g.fill();
}

/* 拟东巴象形（程序生成的原始符号） */
function picto(g, x, y, s, col, seed) {
  var r = mkRng(seed), i, n = 3 + Math.floor(r() * 3);
  g.save();
  g.translate(x, y);
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = Math.max(1, s * 0.085);
  g.lineCap = "round";
  for (i = 0; i < n; i++) {
    var k = Math.floor(r() * 4), a = r() * s * 0.6 - s * 0.3;
    g.beginPath();
    if (k === 0) {
      g.moveTo(a - s * 0.26, r() * s * 0.5 - s * 0.25);
      g.lineTo(a + s * 0.26, r() * s * 0.5 - s * 0.25);
    } else if (k === 1) {
      g.arc(a, r() * s * 0.4 - s * 0.2, s * (0.12 + r() * 0.14), 0, Math.PI * 2);
    } else if (k === 2) {
      g.moveTo(a, -s * 0.3); g.lineTo(a, s * 0.3);
      g.lineTo(a + s * 0.18 * (r() > 0.5 ? 1 : -1), s * 0.3);
    } else {
      g.moveTo(a - s * 0.16, s * 0.2); g.lineTo(a, -s * 0.22); g.lineTo(a + s * 0.16, s * 0.2);
    }
    g.stroke();
  }
  g.restore();
}

/* 银饰：同心弧 + 银铃 */
function silverField(g, x, y, w, h, seed, count) {
  var r = mkRng(seed), i, j, rad, cx0, cy0;
  count = Math.min(26, count || 9);
  for (i = 0; i < count; i++) {
    cx0 = x + w * (0.5 + (r() - 0.5) * 0.9);
    cy0 = y + h * (0.5 + (r() - 0.5) * 0.9);
    rad = Math.min(w, h) * (0.10 + r() * 0.42);
    for (j = 0; j < 3; j++) {
      g.beginPath();
      g.arc(cx0, cy0, rad * (1 - j * 0.16), -0.6 + r() * 0.4, 1.6 + r() * 0.5);
      g.strokeStyle = "rgba(226,232,236," + (0.20 + 0.16 * j) + ")";
      g.lineWidth = 1 + j * 0.6;
      g.stroke();
    }
  }
  for (i = 0; i < 14; i++) {
    g.beginPath();
    g.arc(x + w * r(), y + h * r(), 1.6 + r() * 2.4, 0, Math.PI * 2);
    g.fillStyle = "rgba(238,242,244,.55)"; g.fill();
  }
}

/* 面板：右侧一整片拼贴织锦 */
function brocadePanel(g, x, y, w, h) {
  var zA = h * 0.40, zB = h * 0.63;
  /* A：靛蓝苗银区 */
  g.fillStyle = PAL.indigo; g.fillRect(x, y, w, zA);
  g.save(); g.beginPath(); g.rect(x, y, w, zA); g.clip();
  mosaic(g, x, y, w, zA, Math.max(16, w * 0.085), 771, 12);
  silverField(g, x, y + h * 0.02, w, zA * 0.78, 33, 7);
  pictoColumn(g, x + w * 0.10, y + h * 0.05, h * 0.035, "rgba(247,232,202,.5)");
  g.restore();

  /* B：黑底红黄漆器带 */
  g.fillStyle = PAL.black; g.fillRect(x, y + zA, w, zB - zA);
  teeth(g, x, y + zA, w, h * 0.014, 26, PAL.red, false);
  teeth(g, x, y + zB, w, h * 0.014, 26, PAL.ochre, true);
  var i, n = 4;
  for (i = 0; i < n; i++) {
    spiral(g, x + w * (0.20 + i * 0.21), y + (zA + zB) / 2, h * 0.048, "rgba(198,137,42,.85)", 1.6, 2.4);
    spiral(g, x + w * (0.20 + i * 0.21), y + (zA + zB) / 2, h * 0.020, "rgba(168,50,31,.9)", 1.2, 2);
  }
  g.fillStyle = "rgba(247,232,202,.34)";
  for (i = 0; i < 5; i++) g.fillRect(x, y + zA + (zB - zA) * (i / 5), w, 1);

  /* C：赭红织锦底 + 银弧 */
  g.fillStyle = PAL.red; g.fillRect(x, y + zB, w, h - zB);
  g.save(); g.beginPath(); g.rect(x, y + zB, w, h - zB); g.clip();
  mosaic(g, x, y + zB, w, h - zB, Math.max(14, w * 0.10), 9917, 10);
  silverField(g, x, y + zB, w, h - zB, 512, 8);
  g.restore();
  /* 面板左缘：手撕拼贴边 */
  g.fillStyle = "rgba(27,23,20,.14)";
  for (i = 0; i < 30; i++) {
    var yy = h * (i / 30);
    g.fillRect(x, yy, 2 + ((i * 37) % 5), h / 30 + 1);
  }
  g.strokeStyle = "rgba(247,232,202,.65)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke();
}

function pictoColumn(g, x, y, s, col) {
  var i;
  for (i = 0; i < 6; i++) picto(g, x, y + i * (s * 2.05), s, col, 4400 + i * 37);
}

/* 万花筒玫瑰：一次性烘焙，每帧只做一次 drawImage */
function buildRosette() {
  var size = 640, c = document.createElement("canvas"), g, i, wed = 12, a0, a1, hue;
  c.width = size; c.height = size;
  g = c.getContext("2d");
  g.translate(size / 2, size / 2);
  for (i = 0; i < wed; i++) {
    a0 = (i / wed) * Math.PI * 2;
    a1 = ((i + 1) / wed) * Math.PI * 2;
    hue = Math.round((i * 360) / wed);
    var gr = g.createRadialGradient(0, 0, size * 0.04, 0, 0, size * 0.5);
    gr.addColorStop(0, "hsla(" + hue + ",72%,58%,.85)");
    gr.addColorStop(0.55, "hsla(" + hue + ",66%,52%,.42)");
    gr.addColorStop(1, "hsla(" + hue + ",60%,48%,0)");
    g.beginPath();
    g.moveTo(0, 0);
    g.arc(0, 0, size * 0.5, a0, a1);
    g.closePath();
    g.fillStyle = gr; g.fill();
  }
  g.globalCompositeOperation = "destination-out";
  for (i = 0; i < 9; i++) {
    g.beginPath();
    g.arc(0, 0, size * (0.10 + i * 0.048), 0, Math.PI * 2);
    g.strokeStyle = "rgba(0,0,0," + (0.30 + (i % 3) * 0.16) + ")";
    g.lineWidth = 2 + (i % 4) * 1.6;
    g.stroke();
  }
  return c;
}

/* 纸面：纤维 + 水汽 + 大银环水印 */
function paintBackground() {
  var w = view.w, h = view.h, d = view.dpr;
  bg.width = Math.max(2, Math.round(w * d));
  bg.height = Math.max(2, Math.round(h * d));
  bgx.setTransform(1, 0, 0, 1, 0, 0);
  bgx.clearRect(0, 0, bg.width, bg.height);
  bgx.setTransform(d, 0, 0, d, 0, 0);
  bgx.fillStyle = PAL.paper; bgx.fillRect(0, 0, w, h);

  var r = mkRng(20455), i, x0, y0, l0;
  for (i = 0; i < 300; i++) {
    x0 = r() * w; y0 = r() * h; l0 = 5 + r() * 42;
    bgx.strokeStyle = r() > 0.5 ? "rgba(150,118,74,.10)" : "rgba(255,252,240,.55)";
    bgx.lineWidth = 0.6 + r() * 0.9;
    bgx.beginPath(); bgx.moveTo(x0, y0); bgx.lineTo(x0 + l0, y0 + (r() - 0.5) * 4); bgx.stroke();
  }
  /* 水汽（大范围极低透明度，静态预烘焙） */
  function wash(cxx, cyy, rr, col) {
    var gr = bgx.createRadialGradient(cxx, cyy, rr * 0.1, cxx, cyy, rr);
    gr.addColorStop(0, col); gr.addColorStop(1, "rgba(255,255,255,0)");
    bgx.fillStyle = gr; bgx.fillRect(cxx - rr, cyy - rr, rr * 2, rr * 2);
  }
  wash(w * 0.30, h * 0.10, Math.min(w, h) * 0.55, "rgba(255,253,244,.60)");
  wash(w * 0.10, h * 0.92, Math.min(w, h) * 0.50, "rgba(198,137,42,.10)");

  /* 大银环水印 */
  bgx.save();
  bgx.strokeStyle = "rgba(35,58,91,.16)"; bgx.lineWidth = 1.2;
  for (i = 0; i < 7; i++) {
    bgx.beginPath();
    bgx.arc(w * 0.22, h * 0.56, Math.min(w, h) * (0.10 + i * 0.055), 0, Math.PI * 2);
    bgx.stroke();
  }
  bgx.restore();
  pictoColumn(bgx, w * 0.043, h * 0.30, Math.min(w, h) * 0.028, "rgba(27,23,20,.22)");

  /* 版面分配：宽屏——右侧竖条织锦，文字落在左侧纸面；竖屏——右侧窄带 + 底部横带 */
  var narrow = (w / h) < 0.95;
  if (narrow) {
    P.main = { x: w * 0.80, y: 0, w: w * 0.20, h: h * 0.90 };
    P.strip = { x: 0, y: h * 0.905, w: w, h: h * 0.095 };
    P.seamY = P.main.h * 0.40;
  } else {
    var pw = clamp(w * 0.30, Math.min(w * 0.22, h * 0.20), h * 0.40);
    P.main = { x: w - pw, y: 0, w: pw, h: h };
    P.strip = null;
    P.seamY = h * 0.40;
  }
  brocadePanel(bgx, P.main.x, P.main.y, P.main.w, P.main.h);
  /* 纸面上的一道朱砂细线，给左侧一点结构 */
  bgx.strokeStyle = "rgba(168,50,31,.30)"; bgx.lineWidth = 3;
  bgx.beginPath(); bgx.moveTo(w * 0.052, h * 0.20); bgx.lineTo(w * 0.052, h * 0.82); bgx.stroke();
  bgx.strokeStyle = "rgba(27,23,20,.16)"; bgx.lineWidth = 1;
  bgx.beginPath(); bgx.moveTo(w * 0.052 + 7, h * 0.20); bgx.lineTo(w * 0.052 + 7, h * 0.82); bgx.stroke();
  if (P.strip) {
    bgx.fillStyle = PAL.black; bgx.fillRect(P.strip.x, P.strip.y, P.strip.w, P.strip.h);
    teeth(bgx, P.strip.x, P.strip.y, P.strip.w, P.strip.h * 0.30, 30, PAL.red, true);
    bgx.fillStyle = "rgba(247,232,202,.5)";
    for (i = 0; i < 8; i++) bgx.fillRect(0, P.strip.y + P.strip.h * (1 - (i + 1) / 9), w, 1);
  }
  P.silver.x = P.main.x + P.main.w * 0.5;
  P.silver.y = P.main.y + P.main.h * 0.82;
}

/* ---------- 绘制（每帧） ---------- */
function draw() {
  var w = view.w, h = view.h, i;
  cx.globalAlpha = 1;
  cx.globalCompositeOperation = "source-over";
  if (bg.width > 1) cx.drawImage(bg, 0, 0, w, h);
  else { cx.fillStyle = PAL.paper; cx.fillRect(0, 0, w, h); }
}

/* 每帧只有这几样东西在动：雾、光谱缝、银环、鼓点 */
function drawLive(now) {
  var w = view.w, h = view.h, i, k;
  if (!P.main) return;
  /* 雾 */
  for (i = 0; i < 2 && i < mistSpr.length; i++) {
    var m = mistSpr[i];
    if (!m) continue;
    var span = w * 1.30, dw = Math.max(w * 0.62, 520), dh = dw * (300 / 760);
    var mx = ((now * 0.0035 * (i ? -1 : 1) + i * 520) % span + span) % span - w * 0.20;
    cx.globalAlpha = 0.40;
    cx.drawImage(m, mx, h * (i ? 0.58 : -0.04), dw, dh);
  }
  cx.globalAlpha = 1;

  /* 光谱缝：面板上沿 */
  var sx = P.main.x, sy = P.seamY, sw = P.main.w, bars = 54;
  var bw = sw / bars;
  for (i = 0; i < bars; i++) {
    var ph = (i / bars) + now * 0.00006;
    var hue = (ph * 360 + 190) % 360;
    cx.fillStyle = "hsl(" + hue.toFixed(0) + ",62%," + (44 + 12 * Math.sin(ph * 9.4)).toFixed(0) + "%)";
    cx.fillRect(sx + i * bw, sy - h * 0.006, bw + 0.7, h * 0.006);
  }

  /* 万花筒玫瑰：整张预烘焙，只做一次 drawImage，乘色极低免压字 */
  if (rosette) {
    var rs = Math.min(w, h) * 0.46;
    cx.globalCompositeOperation = "multiply";
    cx.globalAlpha = 0.20 + 0.10 * Math.max(0.15, S.level);
    cx.save();
    cx.translate(w * 0.215, h * 0.50);
    cx.rotate(now * 0.000032);
    cx.drawImage(rosette, -rs / 2, -rs / 2, rs, rs);
    cx.restore();
    cx.globalAlpha = 1;
    cx.globalCompositeOperation = "source-over";
  }

  /* 银环脉冲 */
  var lvl = S.playing ? Math.max(0.12, S.level) : 0.10;
  var phase = (now * 0.00016) % 1;
  for (i = 0; i < 3; i++) {
    k = (phase + i / 3) % 1;
    cx.beginPath();
    cx.arc(P.silver.x, P.silver.y, (0.06 + k * 0.42) * Math.min(w, h), 0, Math.PI * 2);
    cx.strokeStyle = "rgba(238,243,246," + (0.30 * (1 - k) * lvl + 0.04).toFixed(3) + ")";
    cx.lineWidth = 1.4;
    cx.stroke();
  }

  /* 鼓点：边框一道漆红脉冲 */
  var bt = now - S.beatAt;
  if (S.beat > 0.05 && bt < 900) {
    var a = S.beat * Math.exp(-bt / 230) * 0.55;
    cx.strokeStyle = "rgba(168,50,31," + a.toFixed(3) + ")";
    cx.lineWidth = 6;
    cx.strokeRect(3, 3, w - 6, h - 6);
  }
}

/* ---------- 帧循环 ---------- */
var rafId = 0, lastT = 0;
function loop(now) {
  rafId = requestAnimationFrame(loop);
  var t0 = performance.now();
  lastT = now;
  draw();
  if (!S.rm) drawLive(now); else drawLive(S.rmNow);
  if (S.rm) S.rmNow += 260;
  renderLyric();
  S.frames++;
  S.js = Math.round((performance.now() - t0) * 100) / 100;
}

/* ---------- ready ---------- */
var sentReady = false;
function sendReady() {
  if (sentReady) return;
  sentReady = true;
  try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { console.error(e); }
}

/* ---------- 收消息 ---------- */
function onInit(p) {
  p = p || {};
  var song = p.song || {};
  S.accent = (p.accent && p.accent.length >= 3) ? p.accent : [194, 138, 43];
  document.documentElement.style.setProperty("--accent", S.accent.join(","));
  S.dur = isFinite(p.duration) ? +p.duration : 0;
  S.playing = (p.playing === false) ? false : true;
  S.lines = initLines(p.lines, S.dur);
  S.idx = -99;
  buildLyricDom();
  renderLyric();
  var nm = (song.name == null ? "" : String(song.name));
  var ar = song.artists;
  if (ar && ar.length && typeof ar !== "string") ar = ar.join(" / ");
  ar = ar ? String(ar) : "";
  songBox.textContent = (nm + (ar ? "  ·  " + ar : "")) || "UNKNOWN SIDE";
  if (song.cover) { coverImg.src = song.cover; coverImg.style.display = "block"; }
  else { coverImg.removeAttribute("src"); coverImg.style.display = "none"; }
  credLine.textContent = "SW · FIELD REC " + (song.id && isFinite(song.id) ? String(song.id).slice(-4) : "0455");
}
coverImg.onerror = function () { coverImg.style.display = "none"; };

function onTick(p) {
  p = p || {};
  if (isFinite(p.time)) S.t = +p.time;
  S.playing = (p.playing === false) ? false : true;
}
function onLive(p) {
  p = p || {};
  S.bpm = isFinite(p.bpm) ? +p.bpm : S.bpm;
  S.level = isFinite(p.level) ? +p.level : 0;
  S.bass = isFinite(p.bass) ? +p.bass : 0;
  S.mid = isFinite(p.mid) ? +p.mid : 0;
  S.treble = isFinite(p.treble) ? +p.treble : 0;
  S.playing = (p.playing === false) ? false : true;
  if (!S.dur && S.bpm > 0) S.dur = 0;
}
function onBeat(p) { p = p || {}; S.beat = isFinite(p.level) ? clamp(p.level, 0, 1) : 0.6; S.beatAt = performance.now(); }

window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === "init") onInit(d.payload);
    else if (d.type === "tick") onTick(d.payload);
    else if (d.type === "live") onLive(d.payload);
    else if (d.type === "beat") onBeat(d.payload);
  } catch (err) { errText = String(err && err.message || err); console.error("[455]", err); }
}, false);

songBox.textContent = "WAITING FOR SIGNAL";

/* ---------- 启动 ---------- */
resize();
try { mistSpr = [buildMist(), buildMist()]; } catch (e) { console.error("[455] mist", e); }
try { rosette = buildRosette(); } catch (e) { console.error("[455] rosette", e); }
window.addEventListener("resize", resize, { passive: true });
try { S.rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { S.rm = false; }
requestAnimationFrame(function first() { sendReady(); loop(performance.now()); });
setTimeout(sendReady, 700);
</script>
