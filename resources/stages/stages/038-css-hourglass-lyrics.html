<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS 沙漏</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(190,170,140,.32);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
  body{background:radial-gradient(120% 90% at 50% 38%,#0d111b,#05060a 62%)}
  #amb{position:fixed;left:24%;top:46%;width:820px;height:820px;margin:-410px 0 0 -410px;
       pointer-events:none;border-radius:50%;
       background:radial-gradient(circle,rgba(255,196,116,.15),rgba(120,150,255,.05) 42%,transparent 68%);
       animation:breathe 9s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  /* ---------- 沙漏本体：参考文件的木框 + 玻璃 + 沙 ---------- */
  #hg{position:fixed;left:clamp(10px,7vw,140px);top:50%;width:280px;height:430px;
      margin-top:-215px;z-index:4}
  .plate{position:absolute;left:0;width:280px;height:17px;border-radius:9px;
    background:linear-gradient(180deg,#5b4638,#32231c 42%,#160f0c 78%,#0a0706);
    box-shadow:0 5px 18px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,230,190,.24),
               inset 0 -2px 3px rgba(0,0,0,.6);z-index:6}
  .plate::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,222,170,.35),transparent)}
  .plate.t{top:0}
  .plate.b{bottom:0}
  .pil{position:absolute;top:16px;bottom:16px;width:3px;border-radius:2px;z-index:7;
    background:linear-gradient(180deg,#6d5743,#2c2018 45%,#6d5743);opacity:.75}
  .pil.l{left:13px}
  .pil.r{right:13px}
  .bulb{position:absolute;left:25px;width:230px;height:168px;overflow:hidden;z-index:3;
    background:linear-gradient(148deg,rgba(200,235,255,.13),rgba(150,200,240,.035) 42%,rgba(210,240,255,.08));
    filter:drop-shadow(0 0 10px rgba(150,210,255,.12))}
  .bulb.t{top:26px;border-radius:3px 3px 0 0;
    clip-path:polygon(0 0,100% 0,64% 84%,56% 100%,44% 100%,36% 84%)}
  .bulb.b{top:218px;border-radius:0 0 4px 4px;
    clip-path:polygon(44% 0,56% 0,64% 16%,100% 100%,0 100%,36% 16%)}
  .bulb::after{content:"";position:absolute;left:15%;top:7%;width:13%;height:66%;
    border-radius:50%;transform:rotate(9deg);z-index:5;
    background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.02));
    filter:blur(5px);pointer-events:none}
  .sand{position:absolute;left:5%;right:5%;bottom:0;height:100%;
    background:linear-gradient(180deg,#f6dca4,#c99a55 26%,#9a6a38 64%,#7a5128)}
  .sand::before{content:"";position:absolute;left:0;right:0;top:-3px;height:11px;
    border-radius:50%;background:linear-gradient(180deg,rgba(255,244,214,.95),rgba(226,190,126,.55));
    box-shadow:0 2px 10px rgba(255,214,150,.28)}
  .sand.t{transform-origin:50% 100%}
  .sand.b{transform-origin:50% 100%;
    background:linear-gradient(0deg,#7a5128,#b98445 58%,#c99a55 88%,#f6dca4)}
  .neck{position:absolute;left:50%;top:188px;width:30px;height:36px;margin-left:-15px;z-index:5;
    background:linear-gradient(90deg,rgba(220,240,255,.10),rgba(220,245,255,.30) 50%,rgba(220,240,255,.10));
    box-shadow:inset 0 0 8px rgba(180,225,255,.18)}
  .neck::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;
    margin:-3.5px 0 0 -3.5px;border-radius:50%;
    background:#ffe6b0;box-shadow:0 0 14px 4px rgba(255,212,140,.55)}
  .stream{position:absolute;left:50%;top:204px;width:2px;height:128px;margin-left:-1px;z-index:4;
    background:linear-gradient(180deg,rgba(255,240,200,.95),rgba(255,206,132,.55) 60%,rgba(255,200,120,.05));
    box-shadow:0 0 9px rgba(255,214,150,.65)}
  .stream::after{content:"";position:absolute;inset:0;opacity:.6;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.65) 0 2px,transparent 2px 11px);
    animation:smove .55s linear infinite}
  @keyframes smove{to{background-position:0 11px}}
  #grains{position:absolute;left:50%;top:190px;width:46px;height:196px;margin-left:-23px;
    overflow:hidden;z-index:4;pointer-events:none}
  .grain{position:absolute;left:50%;top:0;width:var(--s);height:calc(var(--s)*1.5);
    margin-left:var(--x);border-radius:50%;
    background:linear-gradient(180deg,#ffedc4,#d09b52);
    box-shadow:0 0 6px rgba(255,210,140,.85);opacity:0}
  .shadow{position:fixed;left:clamp(10px,7vw,140px);top:50%;width:380px;height:80px;
    margin:200px 0 0 -50px;border-radius:50%;filter:blur(12px);pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.72),transparent 70%)}
  /* ---------- 词：竖排多列（从右往左读），逐字点亮 ----------
     每个字是双层结构：.b 是暗底、.g 是金色字（accent 渐变填充）。
     开唱前 0.25s 底色先亮一档（预备），chars[k].t 那一刻 .g 盖上来 —— 逐字点亮。
     长句按每列 ≤12 字折成多列，字号按列数/列长自适应，整句必落在安全区内。 */
  #lyr{position:fixed;inset:0;z-index:3;display:flex;align-items:center;
       padding-left:clamp(300px,40vw,640px);padding-right:4vw;pointer-events:none}
  .lybox{position:relative;display:flex;flex-direction:row-reverse;justify-content:flex-start;
    align-items:center;gap:.38em;font-weight:800;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .col{display:flex;flex-direction:column;align-items:center}
  .ch{position:relative;display:block;line-height:1.16;text-align:center}
  .ch .b{color:#3a4152;text-shadow:0 0 26px rgba(255,190,110,.08);transition:color .22s ease}
  .ch.pre .b{color:#878da4}
  .ch .g{position:absolute;inset:0;color:transparent;opacity:0;
    background:linear-gradient(180deg,#fff3d2,var(--gmid) 34%,var(--gdeep) 74%,var(--gdark));
    -webkit-background-clip:text;background-clip:text;text-shadow:none;
    filter:drop-shadow(0 0 16px rgba(var(--acr),.42));
    transform:translateY(24%) scale(.94);
    transition:opacity .18s ease,transform .26s cubic-bezier(.2,.9,.3,1.18),filter .18s ease}
  .ch.lit .b{color:transparent}
  .ch.lit .g{opacity:1;transform:none}
  /* beat：所有已点亮的字同相地亮一下（整句相干，不逐字随机） */
  .lybox.bp .ch.lit .g{filter:drop-shadow(0 0 26px rgba(var(--acr),.9)) brightness(1.22)}
  /* 拉丁句：横排自动换行，整词不拆断 */
  .lybox.hz{flex-direction:row;flex-wrap:wrap;row-gap:.22em;max-width:100%}
  .lybox.hz .wd{display:inline-block;white-space:nowrap}
  .lybox.hz .ch{display:inline-block}
  .lybox.hz .sp{display:inline-block;width:.34em}
  #hud{position:fixed;top:20px;right:22px;z-index:20;text-align:right;
    font:500 10px/1.7 ui-monospace,Consolas,monospace;letter-spacing:.16em;
    color:rgba(200,208,230,.45);pointer-events:none}
  #hud b{display:block;font-weight:600;letter-spacing:.2em;color:rgba(238,240,250,.9)}
  #hud .dot{display:inline-block;width:5px;height:5px;margin-right:6px;border-radius:50%;
    background:#f2c37a;box-shadow:0 0 8px #f2c37a;vertical-align:1px}
  @media (max-width:820px){
    #hg{left:50%;margin-left:-140px;top:auto;bottom:8vh;margin-top:0;transform:scale(.72);transform-origin:50% 100%}
    .shadow{left:50%;margin-left:-190px;top:auto;bottom:8vh;margin-top:0}
    #lyr{padding:0 6vw;align-items:flex-start;padding-top:10vh}
    .lybox{max-width:88vw}
  }
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="amb"></div>
<div class="shadow"></div>
<div id="hg">
  <div class="plate t"></div>
  <div class="pil l"></div><div class="pil r"></div>
  <div class="bulb t"><div class="sand t" id="sTop"></div></div>
  <div class="neck"></div>
  <div class="bulb b"><div class="sand b" id="sBot"></div></div>
  <div id="grains"></div>
  <div class="stream"></div>
  <div class="plate b"></div>
</div>
<div id="lyr"><div class="lybox" id="lybox"></div></div>
<div id="hud"><span class="dot"></span><b id="state">SAND · FLOW</b><span id="cnt">HOURGLASS / 038</span></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ===========================================================================
   038 · CSS 沙漏 —— 沙漏走沙显示句进度，词按 YRC 逐字点亮成金色
   ---------------------------------------------------------------------------
   核心机制：**多列竖排 + 逐字金色点亮**。
   参考文件里沙漏的两只玻璃球各有一层沙：上球 scaleY 从 1 缩到 0，
   下球从 0 涨到 1，中间一股沙流，沙粒是一串独立的掉落动画。
   这里沙漏仍然按"这一句唱了多少"走沙（快歌流得急，踩拍整股沙流相干地顿一下）；
   词不再是"沙位掩码"扫描显影，而是**从右往左的多列竖排**，每字双层：
   暗底 + 金色（accent 渐变）面。开唱前 0.25s 底色先浮起一档（预备），
   chars[k].t 那一刻金色面盖上来 —— 点亮时刻严格压在逐字时间上；
   无 chars 时按 t + dur*i/n 均分。踩拍时所有已点亮的字同相亮一下。

   精修记录：长句从"单列竖排（41 字溢出屏幕，只能看到 6~7 个字）"改为
   **多列竖排（从右往左，每列 ≤12 字，字号按列数/可用宽高自适应）**，
   任何字数完整落在安全区内；拉丁句自动转横排整词换行；
   掩码显影改为逐字点亮接 YRC（__stage 增加 yrc 字段）；沙漏沙面仍按句进度走；
   beat 相干脉冲（沙流速顶高 + 全部已亮字同相增辉）；accent 染金色渐变。
   分词：不使用。竖排列切分只看列容量，逐字时间已精确到字，分词没有收益。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
const sTop = document.getElementById('sTop');
const sBot = document.getElementById('sBot');
const lybox = document.getElementById('lybox');
const grains = document.getElementById('grains');
const stateEl = document.getElementById('state');
const cntEl = document.getElementById('cnt');

let W = 0, H = 0;
let accent = [255, 196, 116];
let lines = [];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

function fit() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W); cv.height = Math.round(H);
}

/* ---- 沙粒池（复刻参考文件 26 颗掉落沙粒，但只建一次，永不重建） ---- */
const GN = 34;
const grainEls = [];
for (let i = 0; i < GN; i++) {
  const g = document.createElement('i');
  g.className = 'grain';
  const s = 1 + Math.random() * 2.1;
  const dur = 0.65 + Math.random() * 0.85;
  g.style.setProperty('--s', s.toFixed(2) + 'px');
  g.style.setProperty('--x', ((Math.random() - 0.5) * 17).toFixed(1) + 'px');
  grains.appendChild(g);
  grainEls.push({ el: g, dur: dur, t: Math.random() * dur, fall: 168 + Math.random() * 24 });
}
let grainSpeed = 1;

function stepGrains(dt) {
  for (let i = 0; i < GN; i++) {
    const g = grainEls[i];
    g.t += dt * grainSpeed;
    if (g.t > g.dur) g.t -= g.dur;
    const u = g.t / g.dur;
    const el = g.el;
    el.style.transform = 'translateY(' + (4 + u * g.fall).toFixed(1) + 'px) scale(' +
      (u < 0.88 ? 1 - u * 0.1 : 1 - (u - 0.88) * 3.5).toFixed(2) + ')';
    el.style.opacity = u < 0.07 ? (u / 0.07).toFixed(2)
      : u > 0.88 ? (0.95 * (1 - (u - 0.88) / 0.12)).toFixed(2) : '0.95';
  }
}

/* ---- 沙面：句进度（沙漏本身的刻度，不再驱动歌词掩码） ---- */
function setLevel(v) {
  sBot.style.transform = 'scaleY(' + Math.max(0.018, v).toFixed(4) + ')';
  sTop.style.transform = 'scaleY(' + Math.max(0.018, 1 - v).toFixed(4) + ')';
}

/* ---- 歌词：竖排多列 + 逐字点亮 ---- */
const chEls = [];          // 每个字的外层 .ch
const ctArr = [];          // 每个字的成立时刻（秒）
const chState = [];        // 0 暗 / 1 预备 / 2 点亮
let firstUndone = 0, litCount = 0, curYrc = false;
let curLineObj = null, curCols = 0, curFs = 0, preview = true;
let bpTimer = 0;
const PREP = 0.25;

function isLatin(text) {
  let la = 0, cjk = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++;
    else if (c >= '\u4e00' && c <= '\u9fff') cjk++;
  }
  return la > cjk;
}

/* 字号与列数：竖排每列 ≤12 字、列数不限到安全宽；拉丁横排按面积估字号 */
function layoutMetrics(n, latin) {
  const padL = Math.min(Math.max(W * 0.40, 300), 640);
  const availW = Math.max(220, W - padL - W * 0.05);
  const availH = H * (W > 820 ? 0.74 : 0.52);
  if (latin) {
    const fs = Math.sqrt(availW * availH / (Math.max(4, n) * 0.68));
    return { fs: Math.min(56, Math.max(14, fs)), cols: 0 };
  }
  const colCount = n <= 12 ? 1 : Math.ceil(n / 12);
  const perCol = Math.ceil(n / colCount);
  const fsH = availH / (perCol * 1.18);
  const fsW = availW / (colCount * 1.2);
  return { fs: Math.min(64, Math.max(15, Math.min(fsH, fsW))), cols: colCount };
}

function makeCh(c, k) {
  const s = document.createElement('span');
  s.className = 'ch';
  const b = document.createElement('span'); b.className = 'b'; b.textContent = c;
  const g = document.createElement('span'); g.className = 'g'; g.textContent = c;
  s.appendChild(b); s.appendChild(g);
  chEls[k] = s; chState[k] = 0;
  return s;
}

/* 逐字成立时刻：chars 可信（长度一致且 t 有效）用它，否则均分；单调化 */
function charTimes(L, n) {
  const ct = new Array(n);
  let ok = !preview && L && L.chars && L.chars.length === n && n > 0;
  if (ok) {
    for (let k = 0; k < n; k++) {
      const v = +L.chars[k].t;
      if (!isFinite(v)) { ok = false; break; }
      ct[k] = v;
    }
  }
  if (!ok) {
    const base = L ? L.t : 0, dur = L && L.dur > 0 ? L.dur : 4;
    for (let k = 0; k < n; k++) ct[k] = base + dur * k / Math.max(1, n);
  }
  for (let k = 1; k < n; k++) if (ct[k] < ct[k - 1]) ct[k] = ct[k - 1];
  return { ct: ct, yrc: ok };
}

/* 建一行的 DOM（换句 / resize 时调用；预览行永远不亮） */
function buildLine(L) {
  lybox.textContent = '';
  chEls.length = 0; ctArr.length = 0; litCount = 0; firstUndone = 0;
  curLineObj = L || null;
  const txt = L ? (L.text || '') : '等待第一句…';
  const n = txt.length;
  preview = !L;
  if (!n) { curCols = 0; curFs = 0; curYrc = false; return; }
  const tm = charTimes(L, n);
  curYrc = tm.yrc;
  for (let k = 0; k < n; k++) ctArr[k] = preview ? Infinity : tm.ct[k];
  const old = chState.length;
  if (old !== n) { chState.length = n; chState.fill(0); }
  else chState.fill(0);  const latin = isLatin(txt);
  const m = layoutMetrics(n, latin);
  curCols = latin ? 1 : m.cols; curFs = m.fs;
  lybox.style.fontSize = m.fs.toFixed(1) + 'px';
  lybox.classList.toggle('hz', latin);
  if (latin) {
    let i = 0;
    while (i < n) {
      if (/\s/.test(txt[i])) {
        const sp = document.createElement('span'); sp.className = 'sp';
        lybox.appendChild(sp); i++; continue;
      }
      let j = i;
      while (j < n && !/\s/.test(txt[j])) j++;
      const wd = document.createElement('span'); wd.className = 'wd';
      for (let k = i; k < j; k++) wd.appendChild(makeCh(txt[k], k));
      lybox.appendChild(wd); i = j;
    }
  } else {
    const perCol = Math.ceil(n / m.cols);
    for (let c = 0; c < m.cols; c++) {
      const col = document.createElement('span'); col.className = 'col';
      const i0 = c * perCol, i1 = Math.min(n, i0 + perCol);
      for (let k = i0; k < i1; k++) col.appendChild(makeCh(txt[k], k));
      lybox.appendChild(col);
    }
  }
}

/* 逐字状态机：只在状态变化时碰 DOM；ct 单调所以可以从 firstUndone 续扫 */
function updateChars(T) {
  const n = ctArr.length;
  if (!n || preview) return;
  while (firstUndone < n && chState[firstUndone] === 2) firstUndone++;
  for (let i = firstUndone; i < n; i++) {
    const dT = T - ctArr[i];
    if (dT >= 0) {
      if (chState[i] !== 2) { chState[i] = 2; chEls[i].classList.add('lit'); chEls[i].classList.remove('pre'); litCount++; }
    } else if (dT >= -PREP) {
      if (chState[i] !== 1) { chState[i] = 1; chEls[i].classList.add('pre'); }
      break;
    } else break;
  }
}

function applyAccent() {
  const r = document.documentElement.style;
  r.setProperty('--acr', accent[0] + ',' + accent[1] + ',' + accent[2]);
  const mix = (a, b, u) => Math.round(a + (b - a) * u);
  const gmid = mix(accent[0], 255, 0.45) + ',' + mix(accent[1], 255, 0.45) + ',' + mix(accent[2], 255, 0.45);
  const gdeep = Math.round(accent[0] * 0.92) + ',' + Math.round(accent[1] * 0.78) + ',' + Math.round(accent[2] * 0.5);
  const gdark = Math.round(accent[0] * 0.62) + ',' + Math.round(accent[1] * 0.48) + ',' + Math.round(accent[2] * 0.3);
  r.setProperty('--gmid', 'rgb(' + gmid + ')');
  r.setProperty('--gdeep', 'rgb(' + gdeep + ')');
  r.setProperty('--gdark', 'rgb(' + gdark + ')');
}

/* ---- 节奏 ---- */
let curIdx = -1, brewIdx = -1, lastT = -1;
const LEAD = 1.3;
let level = 0, target = 0;

function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1; level = 0; target = 0;
    buildLine(null);
  }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    if (ci >= 0) {
      buildLine(lines[ci]);
      const d = lines[ci].dur > 0 ? lines[ci].dur : 4;
      grainSpeed = Math.min(2.4, Math.max(0.55, 4 / d));   // 快歌沙流更急
      level = 0;
    } else {
      buildLine(null);
      level = 0;
    }
    hint.style.opacity = lines.length ? (ci >= 0 ? '0' : '1') : '0.5';
  }
  /* 目标沙位 = 这句已经唱了多少 */
  if (curIdx >= 0) {
    const L = lines[curIdx];
    const d = L.dur > 0 ? L.dur : 4;
    target = Math.min(0.97, Math.max(0.09, (T - L.t) / d));
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) brewIdx = nx;
  }
}

let last = performance.now();
let t0 = 0;
let lastCnt = '';
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();
  timing(T);

  /* 沙面一阶跟随：换句瞬间像真的沙一样流过去 */
  level += (target - level) * (1 - Math.exp(-dt * 3.4));
  setLevel(level);
  stepGrains(dt);
  updateChars(T);

  const cnt = 'HOURGLASS / 038 · ' + (lines.length ? (curIdx + 1) + '/' + lines.length : '--');
  if (cnt !== lastCnt) { cntEl.textContent = cnt; lastCnt = cnt; }
  const st = curIdx < 0 ? 'SAND · IDLE' : target < 0.12 ? 'SAND · FILLING' : 'SAND · FLOW';
  if (stateEl.textContent !== st) stateEl.textContent = st;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1; level = 0; target = 0;
    if (p.accent && p.accent.length === 3) { accent = [p.accent[0] | 0, p.accent[1] | 0, p.accent[2] | 0]; applyAccent(); }
    buildLine(null);
    clockT = 0; clockAt = performance.now(); playing = false;
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 相干：整股沙流一起"顿"一下；所有已点亮的字同相增辉 */
    const lv = d.payload && d.payload.level ? d.payload.level : 0.5;
    grainSpeed = Math.min(3.4, grainSpeed + 0.9 + lv * 1.4);
    lybox.classList.add('bp');
    clearTimeout(bpTimer);
    bpTimer = setTimeout(() => lybox.classList.remove('bp'), 190);
  }
});
applyAccent();
buildLine(null);
fit();
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

addEventListener('resize', () => { fit(); buildLine(curLineObj); });

window.__stage = () => ({
  lines: lines.length, cur: curIdx, brew: brewIdx, t: +now().toFixed(2),
  yrc: curYrc, cols: curCols, fs: +curFs.toFixed(1), lit: litCount,
  level: +level.toFixed(3), target: +target.toFixed(3), grainSpeed: +grainSpeed.toFixed(2)
});
</script>
