<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弹幕编队</title>
<style>
  html,body{margin:0;height:100%;background:#03060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(112% 90% at 50% 47%,transparent 26%,rgba(3,7,12,.40) 66%,rgba(0,0,0,.96) 100%)}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(170,220,240,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   lyra03 · 弹幕编队 —— 字不是长出来的，是**飞进来编队收拢的**
   ---------------------------------------------------------------------------
   一支支"机群"从画面上方俯冲进场：每颗粒子是一个带尾迹的飞行体，先按 V 字编队
   在空中飞（翼展随团大小自适应），队形随航向侧倾（bank）。到该团的起手时刻，机群
   整体切向自己的字形落点 —— 每颗粒子像被弹射出去一样冲向自己的采样点，过冲一下
   再被弹簧拉稳，落定后就烘进"已成形"图层，不再逐帧计算。

   · 尾迹 = 1/3 分辨率残影缓冲：每帧 destination-out 褪一点，再 batch 画入当前帧
     的飞行体，最后加色 blit 回来 —— 一整个"带尾迹的飞行体"只花 1 次 blit
   · 落定即烘焙（§I）：飞行/收拢的粒子每帧几十~两千颗，落定的进 plate 只留一次
   · 冷白机体 + 青色尾迹；背景是深海军蓝的航行栅格，不是 lyra01 的墨团/ lyra02 的钢板

   与 lyra01（画外砸上墙 + 墨累积）、lyra02（板上电弧烧槽）的区别：**整句的字先在
   空中作为编队存在**，然后被"收拢"成字；运镜是追踪飞行体的跟拍 + 甩镜，不是固定机位。

   AE 手法：镜头锁定追踪（look 目标 = 在飞机群质心，带阻尼）/ 甩镜 Whip Pan（换团时
   朝下一团急甩再弹簧回位）/ 缓急变速 Speed Ramping（航线 easeInOutCubic：慢起、
   中段冲、到点前急刹）/ 顿帧 Hit-Stop / 冲击白闪 / 弹簧变焦 + 落点 punch /
   定向镜头震动 / 追踪括号（reticle）/ 次级动作（旧句落定沙粒炸成飞屑、尾迹残影）
   粒子手法：挂点拖尾 Ribbon-Trail（残影缓冲）+ 速度拉伸飞行体 + 向心聚拢
   ========================================================================== */

/* ============================ 0 · 画布（变量必须在 resize() 之前） ============================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
let bgCv = null;
let trCv = null, trG = null, TW = 1, TH = 1, TS = 0.34;     // 尾迹残影缓冲（1/3 分辨率）
let plate = null, pctx = null, plateX = 0, plateY = 0, PW = 1, PH = 1;   // 已落定图层
let L = null, curIdx = -1, prepCache = null;
let lines = [], accent = [170, 210, 255];
const offCv = document.createElement('canvas');
const octx = offCv.getContext('2d', { willReadFrequently: true });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg();
  /* 尾迹缓冲：1/3 分辨率。全屏加色 blit 只有 0.13M 像素，放大插值天然柔边 */
  TW = Math.max(2, Math.round(W / 3)); TH = Math.max(2, Math.round(H / 3));
  if (!trCv) trCv = document.createElement('canvas');
  trCv.width = TW; trCv.height = TH;
  trG = trCv.getContext('2d');
  TS = TW / W;
  /* 落定层：世界坐标 W×H（不乘 DPR，最后整体缩放 blit） */
  if (!plate) plate = document.createElement('canvas');
  PW = Math.max(2, Math.ceil(W)); PH = Math.max(2, Math.ceil(H));
  plate.width = PW; plate.height = PH;
  pctx = plate.getContext('2d');
  plateX = 0; plateY = 0;
  prepCache = null;                       // 布局里含 W/H，换尺寸就作废
  if (curIdx >= 0 && lines.length) { const G = buildLayout(curIdx); if (G) applyLayout(G); }
}
addEventListener('resize', resize);

/* ============================ 1 · 时钟 ============================ */
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ============================ 2 · 分词（词典法 + 双向最大匹配） ============================ */
let DICT = null;
fetch('/segdict.bin').then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); }).catch(() => {});
const fnv = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function isWord(s, i, Ln) {
  if (!DICT) return false;
  const h = fnv(s.substr(i, Ln));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = DICT[m]; if (v === h) return true; if (v < h) lo = m + 1; else hi = m - 1; }
  return false;
}
function segWords(text) {
  const fwd = [];
  for (let i = 0; i < text.length;) {
    let hit = 0;
    for (let Ln = Math.min(4, text.length - i); Ln >= 2; Ln--) if (isWord(text, i, Ln)) { hit = Ln; break; }
    if (hit) { fwd.push(text.substr(i, hit)); i += hit; } else { fwd.push(text[i]); i++; }
  }
  const bwd = [];
  for (let j = text.length; j > 0;) {
    let hit = 0;
    for (let Ln = Math.min(4, j); Ln >= 2; Ln--) if (isWord(text, j - Ln, Ln)) { hit = Ln; break; }
    if (hit) { bwd.unshift(text.substr(j - hit, hit)); j -= hit; } else { bwd.unshift(text[j - 1]); j--; }
  }
  return fwd.length <= bwd.length ? fwd : bwd;
}
const MAXG = 3;
const PUNCT = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】"]/;
const SPACE = /\s/;
function isLatin(text) { let la = 0, cjk = 0; for (let i = 0; i < text.length; i++) { const c = text[i]; if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++; else if (c >= '\u4e00' && c <= '\u9fff') cjk++; } return la > cjk; }
function latinSpans(text) {
  const out = []; let i = 0;
  while (i < text.length) {
    if (SPACE.test(text[i])) { i++; continue; }
    let j = i; while (j < text.length && !SPACE.test(text[j])) j++;
    out.push({ i0: i, i1: j }); i = j;
  }
  return out;
}
const SUFFIX = /^[的了着过地得吗呢吧啊嘛]$/;
const PREFIX = /^[但还就才又也都把被在从向对和与而却很不没最更将已曾让给]$/;
const countChars = (s) => { let n = 0; for (let i = 0; i < s.length; i++) if (!PUNCT.test(s[i]) && !SPACE.test(s[i])) n++; return n; };
function groupByWords(text) {
  const words = segWords(text), out = [];
  let cur = '', start = 0, chars = 0, pos = 0;
  const flush = (end) => { if (cur) { out.push({ i0: start, i1: end }); cur = ''; chars = 0; } };
  for (const w of words) {
    const at = pos; pos += w.length;
    const isP = PUNCT.test(w);
    if (!cur) { cur = w; start = at; chars = isP ? 0 : w.length; continue; }
    if (isP) { cur += w; if (chars >= 2) flush(pos); continue; }
    const single = w.length === 1;
    if (single && SUFFIX.test(w)) { cur += w; chars++; if (chars >= MAXG) flush(pos); continue; }
    if (single && PREFIX.test(w) && chars >= 2) { flush(at); cur = w; start = at; chars = 1; continue; }
    if (chars + w.length <= MAXG) { cur += w; chars += w.length; } else { flush(at); cur = w; start = at; chars = w.length; }
  }
  flush(text.length);
  for (let k = 0; k < out.length; k++) {
    const g = out[k];
    if (countChars(text.slice(g.i0, g.i1)) > 1) continue;
    const prev = out[k - 1], next = out[k + 1];
    if (prev && prev.i1 === g.i0 && countChars(text.slice(prev.i0, prev.i1)) < MAXG) { prev.i1 = g.i1; out.splice(k, 1); k--; }
    else if (next && next.i0 === g.i1 && countChars(text.slice(next.i0, next.i1)) < MAXG) { next.i0 = g.i0; out.splice(k, 1); k--; }
  }
  return out;
}
function groupByRule(text) {
  const out = []; let start = 0, chars = 0;
  for (let i = 0; i < text.length; i++) {
    const s = PUNCT.test(text[i]) || SPACE.test(text[i]);
    if (!s) chars++;
    if (s && chars >= 2) { out.push({ i0: start, i1: i + 1 }); start = i + 1; chars = 0; continue; }
    if (!s && chars > MAXG) { out.push({ i0: start, i1: i }); start = i; chars = 1; }
  }
  if (start < text.length) out.push({ i0: start, i1: text.length });
  return out;
}
const spansForLine = (t) => (isLatin(t) ? latinSpans(t) : (DICT ? groupByWords(t) : groupByRule(t)));

/* ============================ 3 · 字形采样（自动折行 + 逐字归属） ============================ */
const FONT = (px, wt) => `${wt || 800} ${px}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
function wrapText(text, fs, maxW, wt) {
  octx.font = FONT(fs, wt);
  const rows = [];
  let start = 0, w = 0;
  for (let i = 0; i < text.length; i++) {
    const cw = octx.measureText(text[i]).width;
    if (!cw) continue;
    if (w + cw > maxW && i > start) { rows.push({ i0: start, i1: i, w }); start = i; w = 0; }
    w += cw;
  }
  rows.push({ i0: start, i1: text.length, w });
  for (const r of rows) while (r.i1 - r.i0 > 1 && SPACE.test(text[r.i0])) r.i0++;
  return rows;
}
function sampleGlyph(text, opt) {
  opt = opt || {};
  const wt = opt.weight || 800;
  let fs = opt.fs || 88;
  const maxW = opt.maxW || Math.min(W * 0.74, 1180);
  const maxH = opt.maxH || H * 0.50;
  let rows = wrapText(text, fs, maxW, wt);
  let lh = fs * 1.14;
  if (rows.length * lh > maxH) {
    fs *= maxH / (rows.length * lh);
    rows = wrapText(text, fs, maxW, wt);
    lh = fs * 1.14;
  }
  octx.font = FONT(fs, wt);
  const widest = Math.max(1, ...rows.map((r) => octx.measureText(text.slice(r.i0, r.i1)).width));
  const padW = Math.ceil(widest) + 20, padH = Math.ceil(lh * rows.length) + 10;
  offCv.width = padW; offCv.height = padH;
  octx.font = FONT(fs, wt);
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.clearRect(0, 0, padW, padH);

  const n = text.length;
  const charCx = new Float32Array(n), charCy = new Float32Array(n);
  const rowMaps = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const str = text.slice(row.i0, row.i1);
    const cy = padH / 2 + (r - (rows.length - 1) / 2) * lh;
    octx.fillText(str, padW / 2, cy);
    const x0 = (padW - row.w) / 2;
    const map = new Int16Array(padW).fill(-1);
    let acc = 0;
    for (let i = row.i0; i < row.i1; i++) {
      const cw = octx.measureText(text[i]).width;
      charCx[i] = x0 + acc + cw / 2 - padW / 2;
      charCy[i] = cy - padH / 2;
      const a0 = Math.max(0, Math.floor(x0 + acc)), a1 = Math.min(padW, Math.ceil(x0 + acc + cw));
      for (let x = a0; x < a1; x++) map[x] = i;
      acc += cw;
    }
    rowMaps.push({ y0: cy - lh / 2, y1: cy + lh / 2, map });
  }
  const d = octx.getImageData(0, 0, padW, padH).data;
  const pxA = [], pyA = [], ownA = [];
  const step = opt.step || 2;
  for (let y = 0; y < padH; y += step) {
    let rm = null;
    for (let r = 0; r < rowMaps.length; r++) { const m = rowMaps[r]; if (y >= m.y0 && y < m.y1) { rm = m; break; } }
    if (!rm) continue;
    for (let x = 0; x < padW; x += step) {
      if (d[(y * padW + x) * 4 + 3] <= 128) continue;
      const c = rm.map[x];
      if (c < 0) continue;
      pxA.push(x - padW / 2); pyA.push(y - padH / 2); ownA.push(c);
    }
  }
  return {
    px: Float32Array.from(pxA), py: Float32Array.from(pyA), own: Int16Array.from(ownA),
    pc: pxA.length, n, charCx, charCy, fs, w: widest, h: lh * rows.length, rows: rows.length,
    padW, padH,
  };
}

/* ============================ 4 · 句索引 / 小工具 ============================ */
let brewIdx = -1, lastT = -1, lastLayoutMs = 0;
const LEAD = 1.6;
const FLY = 0.95;                          // 编队飞行时长（秒）
const hintShow = (s, o) => { hint.textContent = s; hint.style.opacity = o; };
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ============================ 5 · 镜头 ============================ */
const cam = { x: 0, y: 0, z: 1, tz: 1, vz: 0, tx: 0, ty: 0, sh: 0, dirx: 0, diry: 0, shx: 0, shy: 0, punch: 0, wx: 0, wy: 0, wvx: 0, wvy: 0 };
let lookX = 0, lookY = 0;
function camShake(dx, dy, amp) {
  const l = Math.sqrt(dx * dx + dy * dy) || 1;
  cam.dirx = dx / l; cam.diry = dy / l;
  cam.sh = Math.min(30, Math.max(cam.sh, amp));
}
function whip(dx, dy, amp) {
  const l = Math.sqrt(dx * dx + dy * dy) || 1;
  cam.wvx += (dx / l) * amp; cam.wvy += (dy / l) * amp;
}
function camUpdate(dt, T) {
  const ke = 1 - Math.pow(0.0016, dt);
  cam.x += (cam.tx - cam.x) * ke * 0.92;
  cam.y += (cam.ty - cam.y) * ke * 0.92;
  cam.vz += ((cam.tz - cam.z) * 205 - cam.vz * 23) * dt;      // 弹簧：会过冲再回弹，才像镜头
  cam.z += cam.vz * dt;
  cam.wvx += (-cam.wx * 150 - cam.wvx * 14) * dt;
  cam.wvy += (-cam.wy * 150 - cam.wvy * 14) * dt;
  cam.wx += cam.wvx * dt; cam.wy += cam.wvy * dt;
  cam.sh *= Math.pow(0.000016, dt);
  const wob = Math.sin(T * 61.3) * 0.62 + Math.sin(T * 39.7 + 1.7) * 0.38;
  cam.shx = cam.dirx * cam.sh * wob;
  cam.shy = cam.diry * cam.sh * wob;
}
/* 不旋转：软件渲染下 CTM 带 rotation 会让整帧慢 16ms（lyra02 实测），所以动感靠甩镜 */
function worldTM(g) {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.translate(W / 2 + cam.shx + cam.wx, H / 2 + cam.shy + cam.wy);
  g.scale(cam.z, cam.z);
  g.translate(-cam.x, -cam.y);
}

/* ============================ 6 · 顿帧 / 白闪 ============================ */
const AE = { freeze: 0, flash: 0 };
const hitStop = (s) => { AE.freeze = Math.max(AE.freeze, s); };
const flash = (v) => { AE.flash = Math.max(AE.flash, v); };

/* ============================ 7 · 粒子池 ============================ */
const N = 8600;
const PX = new Float32Array(N), PY = new Float32Array(N);
const VX = new Float32Array(N), VY = new Float32Array(N);
const GX = new Float32Array(N), GY = new Float32Array(N);      // 字形落点
const OX = new Float32Array(N), OY = new Float32Array(N);      // 编队槽位（机身系：x 前 / y 侧）
const SZ = new Float32Array(N), KS = new Float32Array(N);      // 机体大小 / 弹簧刚度（每颗略不同→散开）
const CHp = new Int16Array(N).fill(-1);                        // 所属字
const SQp = new Int16Array(N).fill(-1);                        // 所属机群
const ACT = new Uint8Array(N);                                 // 0 待命 1 编队飞行 2 收拢入位 3 已落定(烘进 plate)
for (let i = 0; i < N; i++) { SZ[i] = 1.45 + Math.random() * 1.55; KS[i] = 122 + Math.random() * 44; }

/* 批次缓冲：一次 beginPath + N 个 rect + 一次 fill（性能铁律 A） */
const BUFN = 5200;
const bandBuf = [], bandN = [];
for (let b = 0; b < 7; b++) { bandBuf.push(new Float32Array(BUFN * 4)); bandN.push(0); }
function pushR(b, x, y, w, h) {
  const arr = bandBuf[b], n = bandN[b];
  if (n >= BUFN * 4 - 8) return;
  arr[n] = x; arr[n + 1] = y; arr[n + 2] = w; arr[n + 3] = h; bandN[b] = n + 4;
}
function flushBand(g, b, color, op) {
  const n = bandN[b]; if (!n) return;
  const arr = bandBuf[b];
  g.globalCompositeOperation = op || 'source-over';
  g.fillStyle = color;
  g.beginPath();
  for (let i = 0; i < n; i += 4) g.rect(arr[i], arr[i + 1], arr[i + 2], arr[i + 3]);
  g.fill();
  bandN[b] = 0;
}
/* 尾迹条带缓冲：一次 beginPath + N 条短线 + 一次 stroke。
   这比"按主轴拉长的 rect"好看一个数量级 —— bbox 近似在斜着飞时会变成一堆竖条。 */
const STK = new Float32Array(4200 * 4);
let stkN = 0;
function pushStreak(x0, y0, x1, y1) {
  if (stkN >= 4200 * 4 - 8) return;
  STK[stkN] = x0; STK[stkN + 1] = y0; STK[stkN + 2] = x1; STK[stkN + 3] = y1; stkN += 4;
}
function flushStreaks(g, color, w, op) {
  if (!stkN) return;
  g.globalCompositeOperation = op || 'lighter';
  g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath();
  for (let i = 0; i < stkN; i += 4) { g.moveTo(STK[i], STK[i + 1]); g.lineTo(STK[i + 2], STK[i + 3]); }
  g.stroke();
  stkN = 0;
}

/* 配色：冷白机体 + 尾迹青。封面色只吃 20%，保住"冰蓝飞行体"的身份 */
const CO = {};
function rebuildSprites() {
  const ar = accent[0], ag = accent[1], ab = accent[2];
  const cr = Math.round(150 + (ar - 150) * 0.18);
  const cg = Math.round(224 + (ag - 224) * 0.18);
  const cb = Math.round(255 + (ab - 255) * 0.18);
  CO.hot = 'rgba(250,254,255,0.97)';
  CO.lit = `rgba(${cr},${cg},${cb},0.92)`;
  CO.mid = `rgba(${Math.round(cr * 0.70)},${Math.round(cg * 0.78)},${Math.round(cb * 0.92)},0.80)`;
  CO.dim = `rgba(${Math.round(cr * 0.38)},${Math.round(cg * 0.48)},${Math.round(cb * 0.62)},0.50)`;
  CO.body = `rgba(${cr},${cg},${cb},0.95)`;
  CO.bodyDim = `rgba(${Math.round(cr * 0.52)},${Math.round(cg * 0.62)},${Math.round(cb * 0.76)},0.72)`;
  CO.fly = `rgba(${Math.round(cr * 0.62)},${Math.round(cg * 0.74)},${Math.round(cb * 0.88)},0.62)`;
  CO.trail = `rgba(${Math.round(cr * 0.72)},${Math.round(cg * 0.86)},${Math.round(cb)},0.40)`;
  CO.reticle = 'rgba(176,240,255,0.95)';
  CO.puff = `rgba(${cr},${cg},${cb},0.55)`;
  CO.puff2 = `rgba(${Math.round(cr * 0.5)},${Math.round(cg * 0.6)},${Math.round(cb * 0.7)},0.32)`;
  CO.spark = 'rgba(226,250,255,0.85)';
}

/* 背景：深海军蓝航行栅格 + 地平线光。一次性预烘（大而软的东西只 blit） */
function buildBg() {
  if (!bgCv) bgCv = document.createElement('canvas');
  const w = Math.max(2, Math.round(W / 2)), h = Math.max(2, Math.round(H / 2));
  bgCv.width = w; bgCv.height = h;
  const g = bgCv.getContext('2d');
  const grd = g.createRadialGradient(w * 0.5, h * 0.46, 0, w * 0.5, h * 0.46, Math.max(w, h) * 0.80);
  grd.addColorStop(0, '#0b1826');
  grd.addColorStop(0.40, '#060e18');
  grd.addColorStop(1, '#010306');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  /* 航行栅格（纵向，越靠边越暗） */
  g.lineWidth = 1;
  for (let x = 0; x < w; x += 72) {
    const t = 1 - Math.abs(x / w - 0.5) * 1.35;
    if (t <= 0) continue;
    g.strokeStyle = `rgba(96,190,232,${(0.042 * t).toFixed(3)})`;
    g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke();
  }
  for (let y = 0; y < h; y += 72) {
    const t = 1 - Math.abs(y / h - 0.5) * 1.35;
    if (t <= 0) continue;
    g.strokeStyle = `rgba(96,190,232,${(0.030 * t).toFixed(3)})`;
    g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); g.stroke();
  }
  /* 地平线光带（压在字下方，给"空中"的纵深） */
  const hg = g.createLinearGradient(0, h * 0.62, 0, h * 0.86);
  hg.addColorStop(0, 'rgba(58,148,196,0)');
  hg.addColorStop(0.55, 'rgba(64,158,206,0.10)');
  hg.addColorStop(1, 'rgba(58,148,196,0)');
  g.fillStyle = hg; g.fillRect(0, h * 0.60, w, h * 0.28);
  /* 星空/尘埃：静态微点（背景层，不参与物理） */
  g.fillStyle = 'rgba(180,225,245,0.055)';
  g.beginPath();
  for (let k = 0; k < 2100; k++) g.rect(Math.random() * w | 0, Math.random() * h | 0, 1, 1);
  g.fill();
}

/* ============================ 8 · 飞屑池（换句时旧句炸掉） ============================ */
const puffs = [];
function spawnPuffs(n) {
  let cnt = 0;
  for (let i = 0; i < N && cnt < n; i++) {
    if (ACT[i] !== 3) continue;
    cnt++;
    if (cnt % 5) continue;                    // 只取 1/5，够看又不炸池子
    puffs.push({
      x: PX[i], y: PY[i],
      vx: rnd(-190, 190), vy: rnd(-260, -40),
      t: 0, life: rnd(0.35, 0.85), sz: rnd(1.2, 2.6),
    });
  }
  if (puffs.length > 900) puffs.splice(0, puffs.length - 900);
}

/* ============================ 9 · 布局（一次性重活，提前 1.6s 空闲帧算） ============================ */
function easeIO(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }

function buildLayout(idx) {
  const t0 = performance.now();
  const line = lines[idx];
  if (!line || !line.text) return null;
  const text = line.text;
  const latin = isLatin(text);
  const fs0 = latin ? 84 : (text.length <= 10 ? 96 : text.length <= 16 ? 82 : 72);
  const g = sampleGlyph(text, { fs: fs0, maxW: Math.min(W * 0.70, 1040), maxH: H * 0.48 });
  if (!g.pc) return null;
  const n = g.n;
  const chars = line.chars && line.chars.length === text.length ? line.chars : null;
  const ct = new Float32Array(n);
  for (let c = 0; c < n; c++) {
    const ok = chars && chars[c] && typeof chars[c].t === 'number';
    ct[c] = ok ? chars[c].t : line.t + (line.dur || 4) * (0.88 * c / Math.max(1, n));
  }
  for (let c = 1; c < n; c++) if (ct[c] < ct[c - 1]) ct[c] = ct[c - 1];

  const bx = W / 2, by = H * 0.445;
  const tx = new Float32Array(N), ty = new Float32Array(N);
  const chi = new Int16Array(N).fill(-1);
  /* 每字粒子上限：短句用满 8600 只会在空中堆出几千颗的"星云"，读不出编队；按字数配给 */
  const K = Math.min(N, g.pc, Math.round(n * (n <= 12 ? 360 : 300)));
  /* 等间隔取样：pi = (k*pc/K)|0 —— 绝不能写 k%pc（字会被压成一条带） */
  for (let k = 0; k < K; k++) {
    const pi = Math.floor(k * g.pc / K) | 0;
    tx[k] = g.px[pi] + bx;
    ty[k] = g.py[pi] + by;
    chi[k] = g.own[pi];
  }
  /* 文字包围盒（世界坐标）：plate blit 只贴这一块，别铺满屏 */
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  for (let k = 0; k < K; k++) {
    if (tx[k] < bx0) bx0 = tx[k]; if (tx[k] > bx1) bx1 = tx[k];
    if (ty[k] < by0) by0 = ty[k]; if (ty[k] > by1) by1 = ty[k];
  }
  const tbox = { x0: bx0 - 12, y0: by0 - 12, x1: bx1 + 12, y1: by1 + 12 };
  /* 追踪机群时镜头的最大平移量：必须**按字块宽度算**，否则 30 字的英文行会被推出画面 */
  const panX = Math.min(W * 0.105, Math.max(0, W * 0.5 - Math.max(bx - tbox.x0, tbox.x1 - bx) - 52));
  const panY = Math.min(H * 0.075, Math.max(0, H * 0.5 - Math.max(by - tbox.y0, tbox.y1 - by) - 40));

  /* ---- 机群 = 词团（中文分词），词太大就拆成几支小编队分批进场 ----
     一个七字母英文词有 2000 颗粒子，整团一起飞就是一大坨星云；拆成 480 颗一支，
     每支有自己的入场点和航线，读起来才像"编队进场"。 */
  const CHUNK = 320;
  const spans = spansForLine(text);
  const spanOf = new Int16Array(n).fill(-1);
  for (let s = 0; s < spans.length; s++) for (let c = spans[s].i0; c < spans[s].i1; c++) spanOf[c] = s;
  const chIds = []; for (let c = 0; c < n; c++) chIds.push([]);
  const sqi = new Int16Array(N).fill(-1);
  for (let k = 0; k < K; k++) {
    const c = chi[k]; if (c < 0) continue;
    if (spanOf[c] < 0) continue;
    chIds[c].push(k);
  }
  const sq = [];
  const oxA = new Float32Array(N), oyA = new Float32Array(N);
  for (let s = 0; s < spans.length; s++) {
    let buf = [], tc = -1, first = 1;
    const pushChunk = () => {
      if (!buf.length) return;
      const ids = Int32Array.from(buf);
      const m = ids.length;
      const idx = sq.length;
      for (let j = 0; j < m; j++) sqi[ids[j]] = idx;
      let ax = 0, ay = 0;
      for (let j = 0; j < m; j++) { ax += tx[ids[j]]; ay += ty[ids[j]]; }
      ax /= m; ay /= m;
      /* V 字编队槽位：机身系 x=航向，y=翼展。u∈[-1,1] 是翼展方向，
         x = -|u|*sweep + row*rowGap → 中央的"机鼻"在前、两翼后掠，后排往后码 */
      const cols = Math.max(3, Math.ceil(Math.sqrt(m * 2.4)));
      const rows = Math.ceil(m / cols);
      const halfSpan = clamp(34 + Math.sqrt(m) * 6.4, 60, 190);
      const sweep = halfSpan * 0.55;
      const rowGap = clamp(130 / rows, 4, 9);
      for (let j = 0; j < m; j++) {
        const r = (j / cols) | 0, c2 = j % cols;
        const u = cols > 1 ? ((c2 / (cols - 1)) * 2 - 1) : 0;
        oxA[ids[j]] = -Math.abs(u) * sweep + r * rowGap + rnd(-1.4, 1.4);
        oyA[ids[j]] = u * halfSpan + rnd(-1.4, 1.4);
      }
      /* 航线：从上方侧翼俯冲进场 → 中段冲 → 到点前急刹（缓急变速） */
      const side = (idx & 1) ? 1 : -1;
      const ex = clamp(ax + side * W * 0.46, W * 0.10, W * 0.90);
      const ey = clamp(ay - H * 0.30, H * 0.11, H * 0.86);
      const cx = ex + (ax - ex) * 0.72;
      const cy = ey + (ay - ey) * 0.10;
      sq.push({
        ids, m, sx: ax, sy: ay, ex, ey, cx, cy,
        lx: ex, ly: ey, cs: 1, sn: 0, first,
        t: tc, f0: tc - FLY - (first ? 0 : 0.12), on: 0, fired: 0,
      });
      buf = []; first = 0;
    };
    for (let c = spans[s].i0; c < spans[s].i1; c++) {
      const arr = chIds[c];
      if (!arr.length) continue;
      if (buf.length && buf.length + arr.length > CHUNK) pushChunk();
      if (tc < 0) tc = ct[c];
      for (let j = 0; j < arr.length; j++) buf.push(arr[j]);
    }
    pushChunk();
  }

  /* ---- §G 允许的预烘文字辉光层：垫在粒子**下面**，一帧一次 drawImage ----
     每句一张独立画布（共用一张会把提前预排的下一句覆写上来） */
  const M = 42, gw2 = g.padW + M * 2, gh2 = g.padH + M * 2;
  const gc = document.createElement('canvas');
  gc.width = gw2; gc.height = gh2;
  const gg = gc.getContext('2d');
  const OXo = 9000;
  gg.shadowOffsetX = OXo;
  gg.shadowColor = `rgba(${Math.round(150 + (accent[0] - 150) * 0.2)},225,255,0.85)`;
  gg.shadowBlur = 26;
  gg.drawImage(offCv, M - OXo, M);
  gg.shadowColor = 'rgba(120,210,255,0.5)';
  gg.shadowBlur = 52;
  gg.drawImage(offCv, M - OXo, M);
  gg.shadowBlur = 0; gg.shadowOffsetX = 0;

  return {
    text, n, K, tx, ty, chi, sqi, chIds, sq, ct, tbox, bx, by, panX, panY, oxA, oyA,
    spans, pc: g.pc, rows: g.rows, layMs: performance.now() - t0,
    chFired: new Uint8Array(n),
    glow: { cv: gc, x: bx - gw2 / 2, y: by - gh2 / 2 },
  };
}

function applyLayout(G) {
  L = G;
  GX.set(G.tx); GY.set(G.ty); CHp.set(G.chi); SQp.set(G.sqi); OX.set(G.oxA); OY.set(G.oyA);
  ACT.fill(0);
  puffs.length = 0;
  const T = now();
  /* 已经过了起手时刻的团：静默跳过，不补放顿帧（seek 不炸） */
  for (let s = 0; s < G.sq.length; s++) {
    const q = G.sq[s];
    if (q.m && T >= q.t) q.fired = 1;
    if (q.m && T >= q.f0) {
      q.on = 1;
      const ids = q.ids;
      for (let j = 0; j < ids.length; j++) ACT[ids[j]] = 1;
    }
  }
  clearPlate();
  clearTrail();
  lastLayoutMs = G.layMs;
  cam.tz = 1.0; cam.punch = 0;
  lookX = G.bx; lookY = G.by;
  cam.tx = G.bx; cam.ty = G.by;
}
function clearPlate() {
  if (!pctx) return;
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.clearRect(0, 0, PW, PH);
  plateX = (L ? L.bx : W / 2) - PW / 2;
  plateY = (L ? L.by : H * 0.445) - PH / 2;
  pctx.setTransform(1, 0, 0, 1, -plateX, -plateY);
}
function clearTrail() {
  if (!trG) return;
  trG.setTransform(1, 0, 0, 1, 0, 0);
  trG.clearRect(0, 0, TW, TH);
}

/* ============================ 10 · 节奏 ============================ */
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {                 // 只有拖进度条回来才整体重置
    curIdx = -1; brewIdx = -1; L = null; prepCache = null;
    puffs.length = 0; ACT.fill(0);
  }
  lastT = T;
  let c = curIdx;
  while (c + 1 < lines.length && T >= lines[c + 1].t) c++;      // 索引只前进
  if (c !== curIdx) {
    curIdx = c; brewIdx = -1;
    if (curIdx >= 0) {
      spawnPuffs(700);                    // 旧句落定的沙粒炸成飞屑（次级动作）
      let G = null;
      if (prepCache && prepCache.idx === curIdx) G = prepCache.G;
      if (!G) G = buildLayout(curIdx);
      prepCache = null;
      if (G) applyLayout(G);
      hintShow('', 0);
    } else hintShow(lines.length ? '等待第一句…' : '这首没有歌词', 0.5);
  }
  /* 酝酿下一句：提前在空闲帧算好字形/航线，绝不留到换句那帧（§J） */
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    if (T >= lines[nx].t - Math.min(LEAD, Math.max(0.6, gap * 0.55))) {
      brewIdx = nx;
      if (!prepCache || prepCache.idx !== nx) prepCache = { idx: nx, G: buildLayout(nx) };
    }
  }
}

/* ============================ 11 · 主循环 ============================ */
let last = performance.now(), T0 = 0;
const PF = { gather: 0, draw: 0, all: 0, n: 0 };

function frame(nowMs) {
  const __t0 = performance.now();
  const dtReal = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; T0 += dtReal;
  if (AE.freeze > 0) AE.freeze -= dtReal;
  const dt = AE.freeze > 0 ? 0 : dtReal;          // 顿帧：物理 dt 归零
  const T = now();
  timing(T);

  /* ---- ① 机群航线推进（每团 1 次贝塞尔，纯计算） ---- */
  if (L) {
    for (let s = 0; s < L.sq.length; s++) {
      const q = L.sq[s];
      if (!q.m) continue;
      const raw = (T - q.f0) / FLY;
      const u = raw < 0 ? 0 : raw > 1 ? 1 : raw;
      const e = easeIO(u), ie = 1 - e;
      q.lx = ie * ie * q.ex + 2 * ie * e * q.cx + e * e * q.sx;
      q.ly = ie * ie * q.ey + 2 * ie * e * q.cy + e * e * q.sy;
      const dx = 2 * ie * (q.cx - q.ex) + 2 * e * (q.sx - q.cx);
      const dy = 2 * ie * (q.cy - q.ey) + 2 * e * (q.sy - q.cy);
      const l = Math.sqrt(dx * dx + dy * dy) || 1;
      /* 航向侧倾要**平滑**：直接跟着切线走，整团会在陡降段疯狂打转（像蛾子） */
      const ncs = dx / l, nsn = dy / l;
      if (!q.on) { q.cs = ncs; q.sn = nsn; }
      else { const kb = Math.min(1, dtReal * 6.5); q.cs += (ncs - q.cs) * kb; q.sn += (nsn - q.sn) * kb; }
      /* 进场那一刻：整团从"一点"炸开成编队（不是整团硬弹出来） */
      if (raw >= 0 && !q.on) {
        q.on = 1;
        const ids = q.ids;
        for (let j = 0; j < ids.length; j++) {
          const i = ids[j];
          VX[i] = 0; VY[i] = 0;
          if (L.chFired[CHp[i]]) {          // 该字已经点过了（seek / 拆分后的追尾）→ 直接落位
            ACT[i] = 2; PX[i] = GX[i]; PY[i] = GY[i];
          } else {
            ACT[i] = 1;
            PX[i] = q.lx + rnd(-16, 16);
            PY[i] = q.ly + rnd(-16, 16);
          }
        }
      }
    }
  }

  /* ---- ② 词团起手：顿帧 + 白闪 + 落点 punch + 朝下一团甩镜 ---- */
  if (L) {
    for (let s = 0; s < L.sq.length; s++) {
      const q = L.sq[s];
      if (!q.m || q.fired || T < q.t) continue;
      q.fired = 1;
      if (!q.first) continue;                    // 只有词团的第一支小编队给大动作，否则太吵
      const first = L.sq.findIndex((r) => r.m) === s;
      hitStop(first ? 0.058 : 0.030);
      flash(first ? 0.62 : 0.20);
      cam.punch = Math.max(cam.punch, first ? 0.026 : 0.014);
      /* 甩镜：朝**下一团**的位置急甩一下，弹簧把它拉回 —— "镜头预先知道下一波在哪" */
      let nq = null, bd = 1e9;
      for (let k = 0; k < L.sq.length; k++) {
        const r = L.sq[k];
        if (!r.m || r.fired || r.t < T) continue;
        if (r.t - T < bd) { bd = r.t - T; nq = r; }
      }
      if (nq) whip(nq.lx - q.sx, nq.ly - q.sy, 620);
      else whip(W * 0.2, -H * 0.1, 380);
      camShake(q.sx - q.lx, q.sy - q.ly, first ? 13 : 7);
    }
  }

  /* ---- ③ 逐字收拢（YRC：每个字按自己的 t 单独点亮） ---- */
  if (L) {
    for (let c = 0; c < L.n; c++) {
      if (L.chFired[c] || T < L.ct[c]) continue;
      L.chFired[c] = 1;
      const ids = L.chIds[c];
      let any = 0;
      for (let j = 0; j < ids.length; j++) {
        const i = ids[j];
        if (ACT[i] !== 1) continue;
        ACT[i] = 2; any++;
        /* 速度渐变：先给一个朝落点的初速，再被强弹簧（k=210）收稳 → 过冲一下 */
        const dx = GX[i] - PX[i], dy = GY[i] - PY[i];
        VX[i] = VX[i] * 0.30 + dx * 2.8;
        VY[i] = VY[i] * 0.30 + dy * 2.8;
      }
      if (any > 24) cam.punch = Math.max(cam.punch, 0.006);
    }
  }

  /* ---- ④ 物理 + 采集（只有天上那一两千颗，落定的不再算） ---- */
  const pfT = performance.now();
  const dampFly = Math.pow(0.05, dt), dampLock = Math.pow(0.0006, dt);
  const sqs = L ? L.sq : null;
  if (trG) {
    trG.setTransform(1, 0, 0, 1, 0, 0);
    trG.globalCompositeOperation = 'destination-out';
    trG.fillStyle = `rgba(0,0,0,${(Math.min(0.95, dtReal * 44)).toFixed(3)})`;
    trG.fillRect(0, 0, TW, TH);
    trG.globalCompositeOperation = 'lighter';
    trG.fillStyle = CO.trail;
    trG.beginPath();
  }
  if (sqs) {
    for (let i = 0; i < N; i++) {
      const a = ACT[i];
      if (a === 0 || a === 3) continue;
      let tgx, tgy;
      if (a === 1) {
        const q = sqs[SQp[i]];
        const ox = OX[i], oy = OY[i];
        tgx = q.lx + ox * q.cs - oy * q.sn;
        tgy = q.ly + ox * q.sn + oy * q.cs;
      } else { tgx = GX[i]; tgy = GY[i]; }
      const k = a === 1 ? KS[i] : 210;
      let vx = VX[i] + (tgx - PX[i]) * k * dt;
      let vy = VY[i] + (tgy - PY[i]) * k * dt;
      if (a === 1) { vx *= dampFly; vy *= dampFly; } else { vx *= dampLock; vy *= dampLock; }
      VX[i] = vx; VY[i] = vy;
      const x = PX[i] += vx * dt, y = PY[i] += vy * dt;

      if (a === 2) {
        const dx2 = GX[i] - x, dy2 = GY[i] - y;
        if (dx2 * dx2 + dy2 * dy2 < 2.6 && vx * vx + vy * vy < 80) {
          ACT[i] = 3;                                   // 落定 → 只画一次，永久留在 plate
          const s = SZ[i] * 1.5;
          pushR(5, x - s * 0.5, y - s * 0.5, s, s);
          continue;
        }
      }
      const spd = Math.sqrt(vx * vx + vy * vy);
      const s = SZ[i];
      if (a === 1) {
        /* 机体只画一个方点；"尾迹"全交给残影缓冲（bbox 拉长会变成一堆竖条，试过，难看） */
        pushR(spd < 140 ? 0 : 1, x - s * 0.5, y - s * 0.5, s, s);
        if (spd > 80 && trG) {
          const px2 = ((x - cam.x) * cam.z + W / 2 + cam.shx + cam.wx) * TS;
          const py2 = ((y - cam.y) * cam.z + H / 2 + cam.shy + cam.wy) * TS;
          if (px2 > 1 && px2 < TW - 1 && py2 > 1 && py2 < TH - 1) trG.rect(px2 - 0.6, py2 - 0.6, 1.2, 1.2);
        }
      } else {
        const s2 = s * 1.3;
        pushR(2, x - s2 * 0.5, y - s2 * 0.5, s2, s2);
        /* 收拢阶段不写残影：一波粒子同时斜穿画面，残影会糊成一个大 X（试过） */
      }
    }
  }
  if (trG) trG.fill();
  PF.gather += performance.now() - pfT;

  /* ---- ⑤ 镜头：锁定在飞机群（质心）+ 弹簧变焦 ---- */
  if (L) {
    let wx = L.bx * 1.0, wy = L.by * 1.0, ww = 1.0;
    for (let s = 0; s < L.sq.length; s++) {
      const q = L.sq[s];
      if (q.m && q.on && !q.fired) { wx += q.lx * 1.35; wy += q.ly * 1.35; ww += 1.35; }
    }
    lookX += (wx / ww - lookX) * Math.min(1, dtReal * 2.6);
    lookY += (wy / ww - lookY) * Math.min(1, dtReal * 2.6);
    /* 夹住：字永远不能被甩出画面（构图铁律） */
    const mx = L.panX, my = L.panY;
    cam.tx = L.bx + clamp((lookX - L.bx) * 0.78, -mx, mx);
    cam.ty = L.by + clamp((lookY - L.by) * 0.78, -my, my);
    cam.tz = 1 + 0.014 * Math.sin(T0 * 0.55) + 0.008 * Math.sin(T0 * 0.23 + 1.2) + cam.punch;
    cam.punch *= Math.pow(0.05, dtReal);
  }
  camUpdate(dtReal, T0);

  /* ================= 绘制 ================= */
  const pfD = performance.now();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#04070c';
  ctx.fillRect(0, 0, W, H);
  if (bgCv) {
    const px0 = -(cam.x - (L ? L.bx : W / 2)) * 0.055 * cam.z, py0 = -(cam.y - (L ? L.by : H / 2)) * 0.055 * cam.z;
    const oz = 1.06 + (cam.z - 1) * 0.3;
    ctx.drawImage(bgCv, W / 2 - W * 0.5 * oz + px0, H / 2 - H * 0.5 * oz + py0, W * oz, H * oz);
  }
  /* 尾迹残影：一次加色 blit 回来（0.13M 像素放大插值 → 天然柔边） */
  if (trCv) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.44;
    ctx.drawImage(trCv, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  worldTM(ctx);
  /* ① 落定层（已烘）：只贴字那一块 */
  if (plate && L) {
    const t = L.tbox;
    const sx0 = Math.max(0, Math.floor(t.x0 - plateX)), sy0 = Math.max(0, Math.floor(t.y0 - plateY));
    const sx1 = Math.min(PW, Math.ceil(t.x1 - plateX)), sy1 = Math.min(PH, Math.ceil(t.y1 - plateY));
    if (sx1 > sx0 && sy1 > sy0) {
      ctx.drawImage(plate, sx0, sy0, sx1 - sx0, sy1 - sy0,
        plateX + sx0, plateY + sy0, sx1 - sx0, sy1 - sy0);
    }
  }
  /* ② 文字辉光层（预烘，粒子下面）：亮度跟着"已点亮的字数"走，不提前暴露后面的字 */
  if (L && L.glow) {
    let lit = 0;
    for (let c = 0; c < L.n; c++) lit += L.chFired[c];
    const frac = 0.35 + 0.65 * (lit / Math.max(1, L.n));
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.13 * frac;
    ctx.drawImage(L.glow.cv, L.glow.x, L.glow.y);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  /* ③ 在飞 / 收拢的飞行体（3 档，各一次 fill） */
  flushBand(ctx, 0, CO.dim);
  flushBand(ctx, 1, CO.mid);
  flushBand(ctx, 2, CO.lit, 'lighter');

  /* ④ 追踪括号：锁在下一支要收拢的机群上（纯 rect，不用 arc） */
  if (L) {
    let ret = null, bd = 1e9;
    for (let s = 0; s < L.sq.length; s++) {
      const q = L.sq[s];
      if (!q.m || q.fired) continue;
      const d = q.t - T;
      if (d > -0.12 && d < bd) { bd = d; ret = q; }
    }
    if (ret && ret.on) {
      const sz = 54 + Math.sin(T0 * 3.1) * 2.5;
      const arm = 15, th = 1.5;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.26;
      ctx.fillStyle = CO.reticle;
      ctx.beginPath();
      const x = ret.lx, y = ret.ly;
      ctx.rect(x - sz, y - sz, arm, th); ctx.rect(x - sz, y - sz, th, arm);
      ctx.rect(x + sz - arm, y - sz, arm, th); ctx.rect(x + sz - th, y - sz, th, arm);
      ctx.rect(x - sz, y + sz - th, arm, th); ctx.rect(x - sz, y + sz - arm, th, arm);
      ctx.rect(x + sz - arm, y + sz - th, arm, th); ctx.rect(x + sz - th, y + sz - arm, th, arm);
      ctx.rect(x - 1.2, y - 1.2, 2.4, 2.4);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /* ⑤ 旧句飞屑 */
  if (puffs.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (let b = 0; b < 2; b++) {
      ctx.fillStyle = b ? CO.puff2 : CO.puff;
      ctx.beginPath();
      let any = false;
      for (let k = b; k < puffs.length; k += 2) {
        const p = puffs[k];
        const q = 1 - p.t / p.life;
        const s = p.sz * (0.5 + q * 1.6);
        ctx.rect(p.x - s * 0.5, p.y - s * 0.5, s, s);
        any = true;
      }
      if (any) ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* ⑥ 冲击帧白闪 */
  if (AE.flash > 0.012) {
    ctx.fillStyle = `rgba(238,250,255,${(AE.flash * 0.115).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    AE.flash *= Math.pow(0.0000026, dtReal);
  }

  /* ---- 物理收尾（飞屑） ---- */
  for (let k = puffs.length - 1; k >= 0; k--) {
    const p = puffs[k];
    p.t += dtReal;
    if (p.t > p.life) { puffs.splice(k, 1); continue; }
    p.vy += 240 * dtReal;
    p.vx *= 0.982; p.vy *= 0.986;
    p.x += p.vx * dtReal; p.y += p.vy * dtReal;
  }

  PF.draw += performance.now() - pfD;
  PF.all += performance.now() - __t0; PF.n++;
  if (PF.n > 4000) { PF.n = (PF.n / 2) | 0; PF.gather /= 2; PF.draw /= 2; PF.all /= 2; }

  requestAnimationFrame(frame);
}

/* ============================ 12 · 通信协议 ============================ */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent && p.accent.length >= 3) { accent = p.accent; rebuildSprites(); }
    curIdx = -1; brewIdx = -1; lastT = -1; L = null; prepCache = null;
    puffs.length = 0; ACT.fill(0);
    clearPlate(); clearTrail();
    clockT = 0; clockAt = performance.now();
    hintShow(lines.length ? '等待第一句…' : '这首没有歌词', lines.length ? 1 : 0.5);
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    const lv = (d.payload && d.payload.level) || 0.6;
    /* 踩拍相干：整场一起沿"当前航向"轻震，不逐颗随机 */
    const q = L ? L.sq.find((r) => r.m && r.on && !r.fired) : null;
    if (q) camShake(q.cs, q.sn, 2.2 + lv * 4.0);
    else camShake(1, 0, 1.8 + lv * 2.4);
  } else if (d.type === 'live') {
    /* {bpm,energy,bass,mid,treble} —— 低频让镜头深呼吸，这里留空 */
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => {
  let act = 0, fly = 0;
  for (let i = 0; i < N; i++) { if (ACT[i] === 1) fly++; if (ACT[i] === 2) act++; }
  return {
    curIdx, n: lines.length, pc: L ? L.pc : 0, spans: L ? L.sq.length : 0,
    fly, landing: act, z: +cam.z.toFixed(3), layMs: +lastLayoutMs.toFixed(1),
    t: +now().toFixed(2), puffs: puffs.length,
    pf: PF.n ? { gather: +(PF.gather / PF.n).toFixed(2), draw: +(PF.draw / PF.n).toFixed(2), all: +(PF.all / PF.n).toFixed(2) } : null,
  };
};

/* ============================ 13 · 启动 ============================ */
rebuildSprites();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
