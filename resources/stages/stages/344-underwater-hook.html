<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>344 · 水下钞票</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b4a66;overflow:hidden}
  #c{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 1440, H = 900, DPR = 1;
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', rm: false };
  var SONG = { name: '', artists: '', cover: '' };
  var ACC = [64, 196, 232];
  var readySent = false, layoutDirty = true, lastTs = 0;

  function post(m) { try { parent.postMessage(m, '*'); } catch (e) {} }
  function sendReady() {
    if (readySent) return;
    readySent = true;
    post({ __c100: 1, type: 'ready' });
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function num(v, d) { v = +v; return isFinite(v) ? v : d; }
  function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    var nw = Math.round(w), nh = Math.round(h);
    var nd = clamp(window.devicePixelRatio || 1, 1, 2);
    if (nw === W && nh === H && nd === DPR && HERO) return;
    W = nw; H = nh; DPR = nd;
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layoutDirty = true;
    try { buildLayers(); } catch (e) { S.err = S.err || 'layers'; }
    try { layoutHero(); } catch (e) { HERO = null; }
  }

  function rgba(r, g, b, a) {
    r = clamp(Math.round(num(r, 0)), 0, 255);
    g = clamp(Math.round(num(g, 0)), 0, 255);
    b = clamp(Math.round(num(b, 0)), 0, 255);
    a = a == null ? 1 : clamp(num(a, 1), 0, 1);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function addStop(g, pos, col) {
    if (!g) return;
    try { g.addColorStop(clamp(num(pos, 0), 0, 1), col); } catch (e) { S.err = S.err || 'grad'; }
  }
  var L = {};
  var RND = (function () { var s = 20260344; return function () { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; })();

  function buildLayers() {
    L.bubbles = L.bubbles || [];
    L.snow = L.snow || [];
    // ---- grain tile (procedural, cached) ----
    try {
      var gs = 180, gcv = document.createElement('canvas');
      gcv.width = gs; gcv.height = gs;
      var gcx = gcv.getContext('2d');
      var id = gcx.createImageData(gs, gs);
      for (var i = 0; i < id.data.length; i += 4) {
        var v = 110 + Math.floor(RND() * 130);
        id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = 255;
      }
      gcx.putImageData(id, 0, 0);
      L.grain = gcv;
      L.grainPat = ctx.createPattern(gcv, 'repeat');
    } catch (e) { L.grain = null; L.grainPat = null; }

    // ---- caustic low-res buffer ----
    L.cw = Math.max(96, Math.round(W * 0.30));
    L.ch = Math.max(64, Math.round(H * 0.30));
    L.cv = document.createElement('canvas');
    L.cv.width = L.cw; L.cv.height = L.ch;
    L.cx = L.cv.getContext('2d');

    // ---- vignette ----
    L.vign = null;
    try {
      var vg = ctx.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.22, W * 0.5, H * 0.52, Math.max(W, H) * 0.80);
      addStop(vg, 0, 'rgba(0,26,40,0)');
      addStop(vg, 0.62, 'rgba(0,26,40,0.10)');
      addStop(vg, 1, 'rgba(0,18,30,0.58)');
      L.vign = vg;
    } catch (e) {}

    // ---- particles ----
    L.bubbles = [];
    var bn = S.rm ? 14 : 34;
    for (var b = 0; b < bn; b++) {
      L.bubbles.push({
        x: RND() * W, y: RND() * H, r: 1.2 + RND() * 5.4,
        sp: 14 + RND() * 46, ph: RND() * 6.283, amp: 6 + RND() * 22, fr: 0.4 + RND() * 0.9
      });
    }
    L.snow = [];
    var sn = S.rm ? 30 : 70;
    for (var s2 = 0; s2 < sn; s2++) {
      L.snow.push({ x: RND() * W, y: RND() * H, r: 0.5 + RND() * 1.5, sp: 3 + RND() * 9, ph: RND() * 6.283 });
    }
    L.surface = [];
    for (var k = 0; k < 4; k++) L.surface.push({ ph: RND() * 6.283, sp: 0.5 + RND() * 0.6, fr: 0.008 + RND() * 0.01 });
  }

  function pickLine(t) {
    var A = S.lines;
    if (!A.length) return -1;
    if (t < A[0].t) return -1;
    var lo = 0, hi = A.length - 1, ans = 0;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (A[mid].t <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  function onInit(p) {
    p = p || {};
    var song = p.song || {};
    SONG.name = (song.name == null ? '' : String(song.name)).trim();
    var a = song.artists;
    SONG.artists = (Array.isArray(a) ? a.join(' / ') : (a == null ? '' : String(a))).trim();
    SONG.cover = song.cover ? String(song.cover) : '';
    if (Array.isArray(p.accent) && p.accent.length >= 3) {
      ACC = [
        clamp(Math.round(num(p.accent[0], 64)), 0, 255),
        clamp(Math.round(num(p.accent[1], 196)), 0, 255),
        clamp(Math.round(num(p.accent[2], 232)), 0, 255)
      ];
    }
    var raw = Array.isArray(p.lines) ? p.lines : [], out = [];
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i] || {};
      var txt = l.text == null ? '' : String(l.text);
      if (!txt.trim()) continue;
      out.push({ t: Math.max(0, num(l.t, 0)), dur: Math.max(0, num(l.dur, 0)), text: txt, chars: Array.isArray(l.chars) ? l.chars : null });
    }
    out.sort(function (x, y) { return x.t - y.t; });
    S.lines = out;
    S.duration = Math.max(0, num(p.duration, 0));
    if (p.playing === true || p.playing === false) S.playing = !!p.playing;
    else if (!S.hasTick) S.playing = true;
    LY.key = '';
    LY.rows = null;
    S.inited = true;
    layoutDirty = true;
  }

  function onTick(p) {
    p = p || {};
    S.t = num(p.time, S.t);
    S.playing = !!p.playing;
    S.tickAt = now() / 1000;
    S.hasTick = true;
  }
  function displayTime() {
    if (!S.hasTick) return S.t;
    if (!S.playing) return S.t;
    var d = now() / 1000 - S.tickAt;
    if (d < 0) d = 0;
    return S.t + Math.min(0.12, d);
  }
  function onBeat(p) {
    p = p || {};
    S.beatLevel = clamp(num(p.level, 0.5), 0, 1);
    S.beatT = Math.min(1, 0.55 + S.beatLevel * 0.6);
  }
  function onLive(p) { p = p || {}; S.live = clamp(num(p.level, 0.4), 0, 1); S.bass = clamp(num(p.bass, 0.3), 0, 1); }

  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === 'init') onInit(p);
    else if (d.type === 'tick') onTick(p);
    else if (d.type === 'beat') onBeat(p);
    else if (d.type === 'live') onLive(p);
  });

  function update(ts) {
    var dt = lastTs ? Math.min(0.1, Math.max(0, (ts - lastTs) / 1000)) : 0.016;
    lastTs = ts;
    S.dt = dt;
    S.anim = (S.anim || 0) + dt * (S.rm ? 0.32 : 1);
    S.beatT = Math.max(0, (S.beatT || 0) - dt * 2.6);
    var idx = pickLine(S.t);
    S.idx = idx;
    S.text = idx >= 0 && S.lines[idx] ? S.lines[idx].text : '';
  }

  function drawBackdrop() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    addStop(g, 0, '#bceffb');
    addStop(g, 0.22, '#7ad3ea');
    addStop(g, 0.55, '#3aa6c9');
    addStop(g, 0.82, '#1a7ea3');
    addStop(g, 1, '#0a4d6c');
    ctx.fillStyle = g || '#3aa6c9';
    ctx.fillRect(0, 0, W, H);
    var fg = ctx.createLinearGradient(0, H * 0.55, 0, H);
    addStop(fg, 0, 'rgba(4,52,74,0)');
    addStop(fg, 0.6, 'rgba(5,48,70,0.22)');
    addStop(fg, 1, 'rgba(3,38,58,0.62)');
    ctx.fillStyle = fg || 'rgba(0,0,0,0)';
    ctx.fillRect(0, H * 0.55, W, H * 0.45);
  }

  function drawCaustics(time, level) {
    var c = L.cx, w = L.cw, h = L.ch;
    if (!c) return;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 15; i++) {
      var a = i * 2.399 + time * 0.11;
      var px = (0.5 + 0.46 * Math.sin(a * 1.13 + i * 0.7)) * w;
      var py = (0.5 + 0.46 * Math.cos(a * 0.87 + i * 1.7)) * h;
      var rad = (0.10 + 0.11 * (0.5 + 0.5 * Math.sin(time * 0.7 + i * 1.3))) * Math.min(w, h);
      var g = c.createRadialGradient(px, py, 0, px, py, rad);
      addStop(g, 0, 'rgba(214,250,255,0.24)');
      addStop(g, 0.5, 'rgba(150,238,255,0.10)');
      addStop(g, 1, 'rgba(120,225,255,0)');
      c.fillStyle = g || 'rgba(255,255,255,0.05)';
      c.beginPath();
      c.arc(px, py, rad, 0, 6.2832);
      c.fill();
    }
    c.lineWidth = Math.max(1, w * 0.005);
    c.strokeStyle = 'rgba(200,246,255,0.09)';
    for (var j = 0; j < 9; j++) {
      var y0 = ((j + 0.5) / 9) * h + Math.sin(time * 0.6 + j) * h * 0.05;
      c.beginPath();
      for (var k = 0; k <= 16; k++) {
        var x = (k / 16) * w;
        var yy = y0 + Math.sin(x * 0.02 + time * 0.85 + j * 1.7) * h * 0.05;
        if (k === 0) c.moveTo(x, yy); else c.lineTo(x, yy);
      }
      c.stroke();
    }
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.55 + 0.35 * level;
    ctx.drawImage(L.cv, 0, 0, W, H);
    ctx.globalAlpha = 0.30 + 0.20 * level;
    ctx.drawImage(L.cv, -W * 0.12, -H * 0.05, W * 1.24, H * 1.16);
    ctx.restore();
  }

  function drawRays(time, level) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (var i = 0; i < 6; i++) {
      var x0 = W * (0.03 + i * 0.18) + Math.sin(time * 0.22 + i * 1.6) * W * 0.035;
      var wTop = W * 0.030;
      var wBot = W * (0.085 + 0.045 * Math.sin(i * 1.7 + time * 0.3));
      var x1 = x0 + Math.sin(time * 0.17 + i * 0.9) * W * 0.11;
      var g = ctx.createLinearGradient(x0, 0, x1, H * 0.95);
      addStop(g, 0, 'rgba(230,252,255,' + (0.15 + 0.12 * level).toFixed(3) + ')');
      addStop(g, 0.5, 'rgba(205,246,255,0.05)');
      addStop(g, 1, 'rgba(180,240,255,0)');
      ctx.fillStyle = g || 'rgba(255,255,255,0.03)';
      ctx.beginPath();
      ctx.moveTo(x0 - wTop, 0);
      ctx.lineTo(x0 + wTop, 0);
      ctx.lineTo(x1 + wBot, H * 0.96);
      ctx.lineTo(x1 - wBot, H * 0.96);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSurface(time) {
    var hh = Math.max(24, H * 0.085);
    ctx.save();
    for (var k = 0; k < 3; k++) {
      var ph = time * (0.55 + k * 0.21) + k * 2.1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (var x = 0; x <= W; x += Math.max(10, W / 80)) {
        var y = hh * (0.30 + k * 0.24)
          + Math.sin(x * (0.006 + k * 0.004) + ph) * hh * 0.22
          + Math.sin(x * 0.0145 - ph * 1.7) * hh * 0.09;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, 0);
      ctx.closePath();
      var g = ctx.createLinearGradient(0, 0, 0, hh * 1.4);
      addStop(g, 0, 'rgba(255,255,255,' + (0.30 - k * 0.08).toFixed(3) + ')');
      addStop(g, 1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g || 'rgba(255,255,255,0.08)';
      ctx.fill();
    }
    ctx.restore();
  }

  var HERO = null;

  function rrect(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function offscreen(w, h) {
    var cc = document.createElement('canvas');
    cc.width = Math.max(1, Math.round(w * DPR));
    cc.height = Math.max(1, Math.round(h * DPR));
    var g2 = cc.getContext('2d');
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
    return { cv: cc, cx: g2, w: Math.max(1, w), h: Math.max(1, h) };
  }
  function serif(px, weight) {
    return (weight || '600') + ' ' + px.toFixed(1) + 'px Georgia, "Times New Roman", "Songti SC", "Source Han Serif SC", SimSun, serif';
  }

  // ---------- money ----------
  function buildBill(bw, bh) {
    var o = offscreen(bw, bh), c = o.cx;
    var small = Math.min(bw, bh);
    c.save();
    rrect(c, 0, 0, bw, bh, small * 0.06);
    c.clip();
    var g = c.createLinearGradient(0, 0, bw * 0.9, bh);
    addStop(g, 0, '#eaf0d9');
    addStop(g, 0.38, '#cfdcb9');
    addStop(g, 0.72, '#b4c99f');
    addStop(g, 1, '#96b287');
    c.fillStyle = g || '#cfdcb9';
    c.fillRect(0, 0, bw, bh);

    for (var i = 0; i < Math.round(bw / 4); i++) {
      var x = RND() * bw, y = RND() * bh, l = 5 + RND() * 22;
      c.strokeStyle = 'rgba(52,84,58,' + (0.015 + RND() * 0.05).toFixed(3) + ')';
      c.lineWidth = 0.6 + RND() * 0.8;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + l, y + (RND() - 0.5) * 3);
      c.stroke();
    }

    var m = small * 0.052;
    c.strokeStyle = 'rgba(26,68,50,0.55)';
    c.lineWidth = Math.max(1, bh * 0.013);
    rrect(c, m, m, bw - m * 2, bh - m * 2, small * 0.035);
    c.stroke();
    c.lineWidth = Math.max(0.7, bh * 0.006);
    rrect(c, m * 1.85, m * 1.85, bw - m * 3.7, bh - m * 3.7, small * 0.02);
    c.stroke();

    // oval + guilloche
    var ccx = bw * 0.635, ccy = bh * 0.50, rw = bw * 0.195, rh = bh * 0.335;
    c.save();
    c.beginPath();
    c.ellipse(ccx, ccy, rw, rh, 0, 0, 6.2832);
    c.clip();
    c.strokeStyle = 'rgba(30,76,58,0.26)';
    c.lineWidth = Math.max(0.6, bh * 0.005);
    for (var k = 0; k < 22; k++) {
      var off = k / 21 - 0.5;
      c.beginPath();
      for (var xx = ccx - rw; xx <= ccx + rw; xx += Math.max(2, rw / 40)) {
        var yy = ccy + off * rh * 1.3 + Math.sin((xx - ccx) / rw * 3.2 + off * 4.2) * rh * 0.10;
        if (xx === ccx - rw) c.moveTo(xx, yy); else c.lineTo(xx, yy);
      }
      c.stroke();
    }
    c.restore();
    c.beginPath();
    c.ellipse(ccx, ccy, rw, rh, 0, 0, 6.2832);
    c.strokeStyle = 'rgba(26,68,50,0.65)';
    c.lineWidth = Math.max(1, bh * 0.010);
    c.stroke();

    // dollar
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = serif(bh * 0.60, '700');
    c.fillStyle = 'rgba(238,246,222,0.55)';
    c.fillText('$', ccx + bh * 0.012, ccy + bh * 0.012);
    c.fillStyle = 'rgba(22,62,46,0.86)';
    c.fillText('$', ccx, ccy);

    // corners
    c.font = serif(bh * 0.145, '700');
    c.fillStyle = 'rgba(24,62,46,0.75)';
    var cxo = bw * 0.085, cyo = bh * 0.20;
    c.fillText('100', cxo, cyo);
    c.fillText('100', bw - cxo, cyo);
    c.save();
    c.translate(cxo, bh - cyo);
    c.rotate(Math.PI);
    c.fillText('100', 0, 0);
    c.restore();
    c.save();
    c.translate(bw - cxo, bh - cyo);
    c.rotate(Math.PI);
    c.fillText('100', 0, 0);
    c.restore();

    // serial + motto
    c.font = serif(bh * 0.072, '600');
    c.fillStyle = 'rgba(26,66,50,0.55)';
    c.textAlign = 'left';
    c.fillText('N 0. 0 4 4 3 4 1 9', bw * 0.10, bh * 0.90);
    c.textAlign = 'right';
    c.fillText('ONE HUNDRED', bw * 0.90, bh * 0.90);
    c.textAlign = 'center';
    c.font = serif(bh * 0.062, '600');
    c.fillStyle = 'rgba(26,66,50,0.40)';
    c.fillText('IN WATER WE TRUST', ccx, bh * 0.115);

    // wet cyan wash + edge shadow, isolated on this canvas
    c.globalCompositeOperation = 'source-atop';
    var wash = c.createLinearGradient(0, 0, bw * 0.3, bh);
    addStop(wash, 0, 'rgba(96,196,222,0.30)');
    addStop(wash, 0.55, 'rgba(64,170,205,0.16)');
    addStop(wash, 1, 'rgba(20,120,160,0.20)');
    c.fillStyle = wash || 'rgba(80,180,210,0.2)';
    c.fillRect(0, 0, bw, bh);
    var sh = c.createLinearGradient(0, 0, 0, bh);
    addStop(sh, 0, 'rgba(255,255,255,0.22)');
    addStop(sh, 0.5, 'rgba(255,255,255,0)');
    addStop(sh, 1, 'rgba(4,40,60,0.22)');
    c.fillStyle = sh || 'rgba(255,255,255,0)';
    c.fillRect(0, 0, bw, bh);
    c.globalCompositeOperation = 'source-over';
    c.restore();
    return o;
  }

  // ---------- hook ----------
  function buildHook(hh) {
    var ww = hh * 0.62;
    var o = offscreen(ww, hh), c = o.cx;
    var lw = Math.max(2, hh * 0.030);
    var metal = c.createLinearGradient(0, 0, ww, 0);
    addStop(metal, 0, '#38474f');
    addStop(metal, 0.16, '#d6e3e9');
    addStop(metal, 0.33, '#7d909b');
    addStop(metal, 0.52, '#f4fafc');
    addStop(metal, 0.72, '#8195a0');
    addStop(metal, 0.9, '#2c3a42');
    addStop(metal, 1, '#16232a');

    function shankPath() {
      c.beginPath();
      c.moveTo(ww * 0.66, hh * 0.055);
      c.bezierCurveTo(ww * 0.685, hh * 0.24, ww * 0.665, hh * 0.44, ww * 0.645, hh * 0.58);
      c.bezierCurveTo(ww * 0.615, hh * 0.80, ww * 0.48, hh * 0.945, ww * 0.32, hh * 0.925);
      c.bezierCurveTo(ww * 0.145, hh * 0.905, ww * 0.105, hh * 0.76, ww * 0.205, hh * 0.655);
    }
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(4,26,36,0.35)';
    c.lineWidth = lw * 1.5;
    shankPath();
    c.stroke();
    c.strokeStyle = metal || '#9aa8b0';
    c.lineWidth = lw;
    shankPath();
    c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.55)';
    c.lineWidth = lw * 0.28;
    c.save();
    c.translate(-lw * 0.18, -lw * 0.14);
    shankPath();
    c.stroke();
    c.restore();

    // barb
    c.beginPath();
    c.moveTo(ww * 0.205, hh * 0.655);
    c.lineTo(ww * 0.275, hh * 0.725);
    c.lineTo(ww * 0.185, hh * 0.745);
    c.closePath();
    c.fillStyle = metal || '#9aa8b0';
    c.fill();
    c.strokeStyle = 'rgba(6,28,38,0.4)';
    c.lineWidth = Math.max(0.8, lw * 0.18);
    c.stroke();

    // eye
    c.beginPath();
    c.arc(ww * 0.66, hh * 0.032, Math.max(1.4, lw * 0.62), 0, 6.2832);
    c.strokeStyle = metal || '#9aa8b0';
    c.lineWidth = lw * 0.36;
    c.stroke();
    return o;
  }

  // ---------- infant silhouette ----------
  function buildBaby(s) {
    var w = s * 1.20, h = s * 0.72;
    var o = offscreen(w, h), c = o.cx;
    var A = function (v) { return v * s; };
    c.save();
    c.translate(w * 0.5 - A(0.52), h * 0.5 - A(0.29));

    function blob(cx, cy, rx, ry, rot) {
      c.moveTo(cx + rx * Math.cos(rot), cy + rx * Math.sin(rot));
      c.ellipse(cx, cy, rx, ry, rot, 0, 6.2832);
    }
    function seg(x1, y1, x2, y2, r) {
      var mx = A((x1 + x2) / 2), my = A((y1 + y2) / 2);
      var dx = A(x2 - x1), dy = A(y2 - y1);
      var len = Math.sqrt(dx * dx + dy * dy);
      blob(mx, my, len / 2 + r * 0.55, r, Math.atan2(dy, dx));
    }
    function body() {
      c.beginPath();
      blob(A(0.795), A(0.265), A(0.170), A(0.158), 0);
      blob(A(0.585), A(0.300), A(0.200), A(0.150), -0.06);
      blob(A(0.395), A(0.325), A(0.165), A(0.150), 0.05);
      seg(0.655, 0.255, 1.020, 0.205, A(0.058));
      blob(A(1.045), A(0.200), A(0.052), A(0.045), 0);
      seg(0.590, 0.400, 0.455, 0.475, A(0.050));
      blob(A(0.440), A(0.490), A(0.055), A(0.048), 0);
      seg(0.340, 0.320, 0.150, 0.230, A(0.070));
      blob(A(0.105), A(0.185), A(0.075), A(0.060), -0.5);
      seg(0.350, 0.400, 0.165, 0.445, A(0.066));
      blob(A(0.115), A(0.455), A(0.072), A(0.058), 0.3);
      blob(A(0.800), A(0.120), A(0.055), A(0.040), 0);
    }

    body();
    c.fillStyle = '#cdeef7';
    c.fill();

    c.save();
    c.globalCompositeOperation = 'source-atop';
    c.translate(0, A(0.020));
    body();
    var gb = c.createLinearGradient(0, A(0.05), 0, A(0.60));
    addStop(gb, 0, '#14424f');
    addStop(gb, 0.42, '#092b38');
    addStop(gb, 1, '#04161f');
    c.fillStyle = gb || '#08232e';
    c.fill();
    c.restore();

    // soft body shading
    c.save();
    c.globalCompositeOperation = 'source-atop';
    var gs = c.createLinearGradient(A(0.1), A(0.1), A(0.9), A(0.6));
    addStop(gs, 0, 'rgba(120,210,235,0.22)');
    addStop(gs, 0.45, 'rgba(30,110,140,0.05)');
    addStop(gs, 1, 'rgba(0,20,32,0.35)');
    c.fillStyle = gs || 'rgba(0,0,0,0)';
    c.fillRect(0, 0, w, h);
    c.restore();
    c.restore();
    return { o: o, mouthX: w * 0.5 - A(0.52) + A(0.905), mouthY: h * 0.5 - A(0.29) + A(0.315) };
  }

  function layoutHero() {
    var portrait = H > W * 1.02;
    var G = { portrait: portrait };
    var bw, bh, hh;
    if (!portrait) {
      bw = Math.min(W * 0.30, H * 0.50);
      bh = bw / 2.35;
      G.bill = { w: bw, h: bh, x: W * 0.650, y: H * 0.395, rot: -0.085 };
      hh = Math.min(H * 0.70, bw * 1.34);
      G.babyS = Math.min(W * 0.34, H * 0.44, 1100);
      G.baby = { x: W * 0.250, y: H * 0.440 };
    } else {
      bw = Math.min(W * 0.64, H * 0.26);
      bh = bw / 2.35;
      G.bill = { w: bw, h: bh, x: W * 0.575, y: H * 0.275, rot: -0.10 };
      hh = Math.min(H * 0.52, bw * 1.50);
      G.babyS = Math.min(W * 0.60, H * 0.25);
      G.baby = { x: W * 0.32, y: H * 0.500 };
    }
    G.hookH = hh;
    G.hookW = hh * 0.62;
    var tipX = G.bill.x - bw * 0.34;
    var tipY = G.bill.y + bh * 0.18;
    G.hookX = tipX - G.hookW * 0.205;
    G.hookY = tipY - hh * 0.655;
    G.tip = { x: tipX, y: tipY };
    G.bill.o = buildBill(G.bill.w, G.bill.h);
    G.hook = buildHook(G.hookH);
    G.babyArt = buildBaby(G.babyS);
    HERO = G;
  }

  function drawHero() {
    var G = HERO;
    if (!G) return;
    var t = S.anim || 0;
    var B = G.bill;

    // leader out of frame
    ctx.save();
    ctx.strokeStyle = 'rgba(14,52,70,0.40)';
    ctx.lineWidth = Math.max(1.2, G.hookH * 0.007);
    ctx.beginPath();
    ctx.moveTo(G.hookX + G.hookW * 0.66, G.hookY + G.hookH * 0.03);
    ctx.lineTo(G.hookX + G.hookW * 0.70, -H * 0.08);
    ctx.stroke();
    ctx.restore();

    var rot = B.rot + Math.sin(t * 0.72) * 0.022;
    var sq = 1 + Math.sin(t * 1.35) * 0.010;
    ctx.save();
    ctx.translate(B.x, B.y + Math.sin(t * 0.85 + 1.1) * B.h * 0.045);
    ctx.rotate(rot);
    ctx.scale(sq, 1 / sq);
    ctx.drawImage(B.o.cv, -B.w * 0.5, -B.h * 0.5, B.w, B.h);

    // occlusion shadow under the hook point
    var shg = ctx.createRadialGradient(-B.w * 0.34, B.h * 0.18, 0, -B.w * 0.34, B.h * 0.18, B.h * 0.50);
    addStop(shg, 0, 'rgba(4,22,30,0.50)');
    addStop(shg, 0.55, 'rgba(4,22,30,0.16)');
    addStop(shg, 1, 'rgba(4,22,30,0)');
    ctx.fillStyle = shg || 'rgba(0,0,0,0)';
    ctx.fillRect(-B.w * 0.5, -B.h * 0.5, B.w, B.h);
    // tear at the pierce point
    ctx.strokeStyle = 'rgba(10,34,42,0.55)';
    ctx.lineWidth = Math.max(1, B.h * 0.014);
    ctx.beginPath();
    ctx.moveTo(-B.w * 0.345, B.h * 0.09);
    ctx.lineTo(-B.w * 0.330, B.h * 0.245);
    ctx.lineTo(-B.w * 0.352, B.h * 0.285);
    ctx.stroke();

    // caustic sheen crossing the note
    ctx.save();
    rrect(ctx, -B.w * 0.5, -B.h * 0.5, B.w, B.h, Math.min(B.w, B.h) * 0.06);
    ctx.clip();
    ctx.globalCompositeOperation = 'screen';
    var sx = ((t * 0.16) % 1.6 - 0.3) * B.w;
    var sg = ctx.createLinearGradient(sx - B.w * 0.16, -B.h * 0.5, sx + B.w * 0.22, B.h * 0.5);
    addStop(sg, 0, 'rgba(210,250,255,0)');
    addStop(sg, 0.45, 'rgba(226,252,255,0.30)');
    addStop(sg, 1, 'rgba(210,250,255,0)');
    ctx.fillStyle = sg || 'rgba(255,255,255,0)';
    ctx.fillRect(-B.w * 0.5, -B.h * 0.5, B.w, B.h);
    ctx.restore();
    ctx.restore();

    // hook on top of the money
    ctx.save();
    ctx.translate(G.hookX, G.hookY + Math.sin(t * 0.62) * H * 0.004);
    ctx.rotate(Math.sin(t * 0.44) * 0.008);
    ctx.drawImage(G.hook.cv, 0, 0, G.hook.w, G.hook.h);
    ctx.restore();

    // infant
    var bb = G.babyArt.o;
    ctx.save();
    ctx.translate(G.baby.x, G.baby.y + Math.sin(t * 0.9) * G.babyS * 0.022);
    ctx.rotate(Math.sin(t * 0.7) * 0.018);
    ctx.drawImage(bb.cv, -bb.w * 0.5, -bb.h * 0.5, bb.w, bb.h);
    ctx.restore();

    // breath bubbles
    ctx.save();
    for (var i = 0; i < 5; i++) {
      var life = ((t * 0.28 + i * 0.2) % 1);
      var bx = G.baby.x + (G.babyArt.mouthX - bb.w * 0.5) + Math.sin(life * 8 + i) * G.babyS * 0.02;
      var by = G.baby.y + (G.babyArt.mouthY - bb.h * 0.5) - life * G.babyS * 0.55;
      var rr = Math.max(1.2, G.babyS * (0.010 + life * 0.020));
      ctx.globalAlpha = (1 - life) * 0.55;
      ctx.beginPath();
      ctx.arc(bx, by, rr, 0, 6.2832);
      ctx.strokeStyle = 'rgba(240,254,255,0.9)';
      ctx.lineWidth = Math.max(0.7, rr * 0.30);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(time, dt) {
    var i, b;
    ctx.save();
    for (i = 0; i < L.snow.length; i++) {
      b = L.snow[i];
      b.y -= b.sp * dt;
      if (b.y < -8) { b.y = H + 8; b.x = RND() * W; }
      var sx = b.x + Math.sin(time * 0.5 + b.ph) * 10;
      ctx.fillStyle = 'rgba(226,250,255,0.30)';
      ctx.beginPath();
      ctx.arc(sx, b.y, b.r, 0, 6.2832);
      ctx.fill();
    }
    for (i = 0; i < L.bubbles.length; i++) {
      b = L.bubbles[i];
      b.y -= b.sp * dt * (1 + (S.bass || 0) * 0.35);
      if (b.y < -20) { b.y = H + 20; b.x = RND() * W; }
      var bx = b.x + Math.sin(time * b.fr + b.ph) * b.amp;
      ctx.beginPath();
      ctx.arc(bx, b.y, b.r, 0, 6.2832);
      ctx.strokeStyle = 'rgba(238,253,255,0.55)';
      ctx.lineWidth = Math.max(0.7, b.r * 0.20);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(bx - b.r * 0.34, b.y - b.r * 0.34, Math.max(0.5, b.r * 0.26), 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGrain() {
    if (!L.grainPat) return;
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.055;
    ctx.translate(-Math.floor(Math.random() * 160), -Math.floor(Math.random() * 160));
    ctx.fillStyle = L.grainPat;
    ctx.fillRect(0, 0, W + 200, H + 200);
    ctx.restore();
  }

  function drawVignette() {
    if (!L.vign) return;
    ctx.fillStyle = L.vign;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- lyric engine ----------
  var LY = { key: '', rows: null, fs: 0, lh: 0, pad: 0 };

  function wrapRows(c, text, maxW) {
    var chars = Array.from(text), cw = [], i, j;
    for (i = 0; i < chars.length; i++) cw.push(c.measureText(chars[i]).width);
    var rows = [], cur = [], idxs = [], curW = 0;
    for (i = 0; i < chars.length; i++) {
      var ch = chars[i];
      if (curW + cw[i] > maxW && cur.length) {
        var cut = -1;
        if (/[A-Za-z0-9]/.test(ch)) {
          for (j = cur.length - 1; j >= 0; j--) { if (cur[j] === ' ') { cut = j; break; } }
          if (cut <= 0 || cur.length - cut >= 18) cut = -1;
        }
        if (cut > 0) {
          var carry = cur.slice(cut + 1), carryIdx = idxs.slice(cut + 1);
          var head = cur.slice(0, cut + 1), headIdx = idxs.slice(0, cut + 1);
          while (head.length && /\s/.test(head[head.length - 1])) { head.pop(); headIdx.pop(); }
          if (head.length) rows.push({ s: head.join(''), idxs: headIdx });
          cur = carry; idxs = carryIdx; curW = 0;
          for (var q = 0; q < cur.length; q++) curW += cw[carryIdx[q]];
        } else {
          rows.push({ s: cur.join(''), idxs: idxs.slice() });
          cur = []; idxs = []; curW = 0;
        }
      }
      cur.push(ch); idxs.push(i); curW += cw[i];
    }
    if (cur.length) rows.push({ s: cur.join(''), idxs: idxs.slice() });
    return rows;
  }

  function buildTimes(line) {
    var cps = Array.from(line.text), n = cps.length, out = new Array(n), i;
    for (i = 0; i < n; i++) out[i] = null;
    var ch = line.chars;
    if (ch && ch.length) {
      var p = 0;
      for (var j = 0; j < ch.length; j++) {
        var it = ch[j] || {};
        var cs = it.c == null ? '' : String(it.c);
        var tt = num(it.t, NaN);
        if (!cs) continue;
        var found = -1, lim = Math.min(n, p + 16);
        for (var q = p; q < lim; q++) { if (cps[q] === cs) { found = q; break; } }
        if (found >= 0) { out[found] = isFinite(tt) ? tt : null; p = found + 1; }
      }
    }
    var knownIdx = [], knownT = [];
    for (i = 0; i < n; i++) if (out[i] != null) { knownIdx.push(i); knownT.push(out[i]); }
    var start = line.t;
    var dur = line.dur > 0 ? line.dur : Math.max(1.6, n * 0.16);
    if (!knownIdx.length) {
      for (i = 0; i < n; i++) out[i] = start + dur * (i / Math.max(1, n));
      return out;
    }
    for (i = 0; i < knownIdx.length - 1; i++) {
      var a = knownIdx[i], b = knownIdx[i + 1], ta = knownT[i], tb = knownT[i + 1];
      for (var m = a + 1; m < b; m++) out[m] = ta + (tb - ta) * ((m - a) / (b - a));
    }
    for (i = 0; i < knownIdx[0]; i++) out[i] = start;
    var lk = knownIdx[knownIdx.length - 1], lt = knownT[knownT.length - 1];
    for (i = lk + 1; i < n; i++) out[i] = lt + (i - lk) * 0.06;
    return out;
  }

  function makeRowCanvas(s, w, fs) {
    var pad = fs * 0.62;
    var o = offscreen(w + pad * 2, fs * 1.66 + pad);
    var c = o.cx;
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;
    c.font = serif(fs, '600');
    var cy = o.h * 0.5;
    // pale halo: keeps ink readable on the bright water
    c.shadowColor = 'rgba(216,248,255,0.80)';
    c.shadowBlur = fs * 0.50;
    c.strokeStyle = 'rgba(230,251,255,0.95)';
    c.lineWidth = fs * 0.30;
    c.strokeText(s, pad, cy);
    c.shadowBlur = 0;
    // accent rim
    c.strokeStyle = rgba(ACC[0], ACC[1], ACC[2], 0.96);
    c.lineWidth = fs * 0.105;
    c.strokeText(s, pad, cy);
    // deep ink body
    var g = c.createLinearGradient(0, cy - fs * 0.62, 0, cy + fs * 0.62);
    addStop(g, 0, '#07293a');
    addStop(g, 0.5, '#03141d');
    addStop(g, 1, '#0b3646');
    c.fillStyle = g || '#04161f';
    c.fillText(s, pad, cy);
    return o;
  }

  function buildLyric(line) {
    var portrait = H > W * 1.02;
    var maxW = portrait ? Math.min(W * 0.88, 620) : Math.min(W * 0.84, 1140);
    var fs = clamp(Math.min(W * (portrait ? 0.074 : 0.050), H * (portrait ? 0.044 : 0.082)), 17, 72);
    var rows = null, tries, wide = 0, i, k;
    for (tries = 0; tries < 6; tries++) {
      ctx.font = serif(fs, '600');
      rows = wrapRows(ctx, line.text, maxW);
      wide = 0;
      for (i = 0; i < rows.length; i++) {
        rows[i].w = ctx.measureText(rows[i].s).width;
        if (rows[i].w > wide) wide = rows[i].w;
      }
      if ((rows.length <= 3 && wide <= maxW * 1.02) || fs <= 18) break;
      fs *= 0.86;
    }
    var pad = fs * 0.62;
    for (i = 0; i < rows.length; i++) {
      var row = rows[i];
      var cps = Array.from(row.s);
      row.cum = [0];
      for (k = 0; k < cps.length; k++) row.cum.push(ctx.measureText(cps.slice(0, k + 1).join('')).width);
      row.o = makeRowCanvas(row.s, row.w, fs);
    }
    LY.rows = rows;
    LY.fs = fs;
    LY.lh = fs * 1.42;
    LY.pad = pad;
  }

  function revealX(row, times, t) {
    var n = row.idxs.length, k = -1, i;
    for (i = 0; i < n; i++) {
      var tt = times[row.idxs[i]];
      if (tt != null && t >= tt) k = i;
    }
    if (k < 0) return 0;
    var x0 = row.cum[k], x1 = row.cum[k + 1];
    var t0 = times[row.idxs[k]];
    var t1 = (k + 1 < n) ? times[row.idxs[k + 1]] : null;
    if (t1 == null || t1 <= t0) return x1;
    var p = clamp((t - t0) / (t1 - t0), 0, 1);
    return x0 + (x1 - x0) * p;
  }

  function blitRow(o, dx, dy, dw, dh, clipW, T, amp, alpha, phase) {
    var N = 26;
    var sh = dh / N;
    var srcH = o.cv.height / N;
    var kx = o.cv.width / dw;
    var cw = clamp(clipW, 0, dw);
    ctx.save();
    for (var i = 0; i < N; i++) {
      var fy = (i + 0.5) / N;
      var off = Math.sin(T * 1.45 + fy * 4.4 + phase * 0.8) * amp * (0.55 + 0.75 * fy);
      var sy = i * srcH, yy = dy + i * sh;
      if (cw > 0.6) {
        ctx.globalAlpha = alpha;
        ctx.drawImage(o.cv, 0, sy, cw * kx, srcH + 1, dx + off, yy, cw, sh + 0.7);
      }
      if (cw < dw - 0.6) {
        ctx.globalAlpha = alpha * 0.34;
        ctx.drawImage(o.cv, cw * kx, sy, (dw - cw) * kx, srcH + 1, dx + off + cw, yy, dw - cw, sh + 0.7);
      }
    }
    ctx.restore();
  }

  function drawTitleCard(alpha) {
    var portrait = H > W * 1.02;
    var fs = clamp(Math.min(W * (portrait ? 0.062 : 0.040), H * 0.062), 16, 58);
    var cy = H * (portrait ? 0.66 : 0.755);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    var name = SONG.name || '无题';
    ctx.font = serif(fs, '600');
    ctx.strokeStyle = 'rgba(232,251,255,0.95)';
    ctx.lineWidth = fs * 0.26;
    ctx.strokeText(name, W / 2, cy);
    ctx.strokeStyle = rgba(ACC[0], ACC[1], ACC[2], 0.9);
    ctx.lineWidth = fs * 0.09;
    ctx.strokeText(name, W / 2, cy);
    ctx.fillStyle = '#04161f';
    ctx.fillText(name, W / 2, cy);
    if (SONG.artists) {
      ctx.font = serif(Math.max(11, fs * 0.40), '600');
      ctx.fillStyle = 'rgba(6,44,60,0.72)';
      ctx.fillText(SONG.artists, W / 2, cy + fs * 0.95);
    }
    ctx.strokeStyle = rgba(ACC[0], ACC[1], ACC[2], 0.75);
    ctx.lineWidth = Math.max(1.2, fs * 0.05);
    ctx.beginPath();
    ctx.moveTo(W / 2 - fs * 1.5, cy - fs * 1.05);
    ctx.lineTo(W / 2 + fs * 1.5, cy - fs * 1.05);
    ctx.stroke();
    ctx.restore();
  }

  function drawEmpty() {
    var portrait = H > W * 1.02;
    var fs = clamp(Math.min(W * (portrait ? 0.050 : 0.032), H * 0.048), 14, 42);
    var cy = H * (portrait ? 0.72 : 0.78);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = serif(fs, '600');
    var label = '这一首没有歌词';
    ctx.strokeStyle = 'rgba(232,251,255,0.9)';
    ctx.lineWidth = fs * 0.26;
    ctx.strokeText(label, W / 2, cy);
    ctx.fillStyle = 'rgba(5,36,50,0.92)';
    ctx.fillText(label, W / 2, cy);
    ctx.font = serif(Math.max(10, fs * 0.46), '400');
    ctx.fillStyle = 'rgba(7,48,64,0.62)';
    ctx.fillText('只 听 水 声', W / 2, cy + fs * 1.35);
    ctx.strokeStyle = rgba(ACC[0], ACC[1], ACC[2], 0.6);
    ctx.lineWidth = Math.max(1, fs * 0.05);
    ctx.beginPath();
    ctx.moveTo(W / 2 - fs * 1.7, cy - fs * 1.15);
    ctx.lineTo(W / 2 + fs * 1.7, cy - fs * 1.15);
    ctx.stroke();
    ctx.restore();
  }

  function drawProgress() {
    if (!S.duration || S.duration <= 0) return;
    var p = clamp(S.t / S.duration, 0, 1);
    var y = H - Math.max(9, H * 0.014);
    var w = Math.min(W * 0.86, 1180), x = (W - w) * 0.5;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(226,250,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
    ctx.strokeStyle = rgba(ACC[0], ACC[1], ACC[2], 0.85);
    ctx.lineWidth = Math.max(1.4, H * 0.0022);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * p, y); ctx.stroke();
    ctx.restore();
  }

  function drawLyric() {
    var portrait = H > W * 1.02;
    if (!S.inited) return;
    if (!S.lines.length) { drawEmpty(); drawProgress(); return; }
    var tNow = displayTime();
    if (S.idx < 0) {
      var t0 = S.lines[0].t;
      var a = clamp((t0 - tNow) / 0.7, 0, 1);
      if (tNow < t0) drawTitleCard(a);
      drawProgress();
      return;
    }
    var line = S.lines[S.idx];
    var key = S.idx + '|' + S.lines.length + '|' + W + 'x' + H + '|' + ACC.join(',');
    if (LY.key !== key || !LY.rows) { buildLyric(line); LY.key = key; }
    var times = line._ct || (line._ct = buildTimes(line));
    var lh = LY.lh, fs = LY.fs;
    var blockBottom = portrait ? H * 0.845 : H * 0.858;
    var first = blockBottom - (LY.rows.length - 1) * lh;
    var fade = clamp((tNow - line.t) / 0.28, 0, 1);
    var T = S.anim || 0;
    var amp = (S.rm ? 0.45 : 1) * Math.min(8, fs * 0.13) * (1 + (S.bass || 0) * 0.5);
    for (var i = 0; i < LY.rows.length; i++) {
      var row = LY.rows[i];
      var dx = (W - row.w) * 0.5 - LY.pad;
      var dy = first + i * lh - LY.pad * 0.62;
      var clip = revealX(row, times, tNow) + LY.pad;
      blitRow(row.o, dx, dy, row.o.w, row.o.h, clip, T, amp, fade, i);
    }
    drawProgress();
  }

  function render(ts) {
    if (layoutDirty) { layoutDirty = false; LY.key = ''; }
    var time = S.anim || 0;
    var lvl = clamp((S.live || 0.4) * 0.7 + (S.beatT || 0) * 0.3, 0, 1);
    drawBackdrop();
    drawCaustics(time, lvl);
    drawRays(time, lvl);
    drawSurface(time);
    drawHero();
    drawParticles(time, S.dt || 0.016);
    drawVignette();
    drawLyric();
    drawGrain();
    if (S.beatT > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = 'rgba(210,250,255,' + (S.beatT * 0.07).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!readySent) sendReady();
    var t0 = now();
    try {
      update(ts);
      render(ts);
    } catch (e) {
      if (!S.err) S.err = String((e && e.message) || e);
    }
    S.js = Math.max(0, now() - t0);
    S.frames++;
  }

  window.__stage = function () {
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err, text: S.text, gl: false, rm: S.rm
    };
  };

  try { S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();
  requestAnimationFrame(frame);
  setTimeout(sendReady, 700);
})();
</script>
</body>
</html>
