<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>346 · 掩面明黄</title>
<style>
  :root{
    --yellow:#FFD200;
    --ink:#141208;
    --cream:#F7EBD5;
    --tone:#E3CCA4;
    --accent:#141208;
    --u:1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--yellow)}
  body{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--yellow)}
  .vp-fallback #stage{position:absolute;left:0;top:0;width:1440px;height:900px}
  #figure{position:absolute;right:-1vw;top:-9vh;height:110vh;aspect-ratio:600/760;
          transform-origin:62% 100%;will-change:transform}
  #figure svg{display:block;width:100%;height:100%;overflow:visible}
  #figure .eye{transform-box:fill-box;transform-origin:50% 50%}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.06;
         mix-blend-mode:multiply;background-repeat:repeat;background-size:190px 190px}
  #meta{position:absolute;left:6vw;top:5.6vh;z-index:5;color:var(--ink)}
  #meta .r1{display:flex;align-items:center;gap:.62em;font-size:clamp(9px,1.02vw,12px);
            letter-spacing:.26em;font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;
            text-transform:uppercase;opacity:.82}
  #meta .tick{width:.55em;height:.55em;background:var(--accent);border-radius:50%;
              display:inline-block;flex:0 0 auto}
  #meta .r2{margin-top:.75em;font-size:clamp(11px,1.35vw,17px);letter-spacing:.06em;
            display:flex;align-items:baseline;gap:.7em;max-width:40vw}
  #meta .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #meta .ar{font-size:.8em;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lyric{position:absolute;left:6vw;bottom:8.6vh;width:min(38vw,600px);z-index:6;
         --fsbase:clamp(23px,4.05vw,58px);color:var(--ink)}
  #lyric .rule{height:1px;background:var(--ink);opacity:.26;margin-bottom:1.05em;
               width:100%;transform-origin:left}
  #lyric .ln{font-weight:700;line-height:1.32;letter-spacing:.012em;
             font-size:calc(var(--fsbase) * 1);word-break:break-word;overflow-wrap:anywhere}
  #lyric .ch{display:inline-block;white-space:pre;vertical-align:baseline}
  #lyric .ch .ci{display:inline-block;color:var(--cream);
                 -webkit-text-stroke:1.3px var(--ink)}
  #lyric .ch.on .ci{color:var(--ink);-webkit-text-stroke-width:0}
  @supports not ((-webkit-text-stroke:1px #000)){
    #lyric .ch .ci{color:var(--ink);opacity:.3}
    #lyric .ch.on .ci{opacity:1}
  }
  #lyric .w{display:inline-block;white-space:nowrap}
  #lyric .ln.empty{font-weight:400}
  #lyric .ln.empty em{display:block;font-style:normal;font-weight:700;
                      font-size:calc(var(--fsbase) * .58);letter-spacing:.34em;opacity:.9}
  #lyric .ln.empty i{display:block;font-style:normal;margin-top:.9em;opacity:.55;
                     font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;
                     font-size:clamp(9px,1.05vw,12px);letter-spacing:.34em}
  @media (max-aspect-ratio:4/3){
    #figure{top:-5vh;height:72vh;right:-6vw}
    #meta{top:4.4vh;left:7vw;max-width:86vw}
    #lyric{left:7vw;bottom:6vh;width:80vw;--fsbase:clamp(22px,4.7vw,46px)}
  }
  @media (max-aspect-ratio:3/4){
    #figure{top:-2vh;height:auto;width:112vw;max-height:78vh;left:-6vw;right:auto}
    #meta{top:4vh}
    #lyric{left:7vw;bottom:8vh;width:86vw;--fsbase:clamp(21px,6.6vw,36px)}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="figure" aria-hidden="true"></div>
  <div id="meta">
    <div class="r1"><i class="tick"></i><span>No.346</span><span>43/50</span></div>
    <div class="r2"><span class="nm" id="mName"></span><span class="ar" id="mArt"></span></div>
  </div>
  <div id="lyric"><div class="rule"></div><div class="ln"></div></div>
</div>
<div id="grain" aria-hidden="true"></div>
<script>
(function(){
  "use strict";
  var S = {lines:[], idx:-1, t:0, playing:true, dur:0, frames:0, js:0, err:"",
           gl:false, rm:false, readySent:false, cur:-2, lastTickAt:0, chars:null,
           pulse:0, bass:0, level:0, times:null, chs:null, lineRef:null, revIdx:0,
           playingLive:true};

  var $fig = document.getElementById("figure");
  var $lyr = document.getElementById("lyric");
  var $ln  = $lyr.querySelector(".ln");
  var $mName = document.getElementById("mName");
  var $mArt  = document.getElementById("mArt");

  var INK = "#141208", CREAM = "#F7EBD5", CREAM2 = "#FBF1DF", TONE = "#E3CCA4", DARK = "#241C12";

  /* ── 人像：两色丝网版画（明黄底 / 米白肤色 / 近黑油墨） ───────────── */
  function buildFigure(){
    var face = "M170 330C170 200 236 128 320 128C404 128 470 200 470 330C470 432 424 502 366 548C352 560 336 568 320 570C304 568 288 560 274 548C216 502 170 432 170 330Z";
    var hairBack  = "M74 604C92 516 96 438 96 330C96 140 200 24 320 24C440 24 544 140 544 330C544 438 548 516 566 604Z";
    var hairFront = "M100 340C100 152 200 30 320 30C440 30 540 152 540 340C540 300 530 266 498 240C460 208 394 180 320 180C246 180 180 208 142 240C110 266 100 300 100 340Z";

    var eye = function(cx, o){
      var m = o ? -1 : 1, hw = 37;
      var top = "M" + (cx - hw) + " 308C" + (cx - hw + 13) + " 292 " + (cx - 13) + " 285 " + cx + " 285C" +
                (cx + 13) + " 285 " + (cx + hw - 13) + " 292 " + (cx + hw) + " 308";
      var bot = "C" + (cx + hw - 13) + " 323 " + (cx + 13) + " 329 " + cx + " 329C" +
                (cx - 13) + " 329 " + (cx - hw + 13) + " 323 " + (cx - hw) + " 308Z";
      return "<g class='eye'>" +
        "<path d='" + top + bot + "' fill='#FDF6E6'/>" +
        "<circle cx='" + cx + "' cy='305' r='14' fill='#2B2114'/>" +
        "<circle cx='" + cx + "' cy='305' r='6' fill='#0F0C07'/>" +
        "<circle cx='" + (cx - 5 * m) + "' cy='300' r='3.2' fill='#FFFDF5' opacity='.72'/>" +
        "<path d='" + top + "L" + (cx + hw) + " 292L" + (cx - hw) + " 292Z' fill='" + CREAM + "'/>" +
        "<path d='" + top + "' fill='none' stroke='" + INK + "' stroke-width='6.5' stroke-linecap='round'/>" +
        "<path d='M" + (cx + hw) + " 308" + bot.replace("Z", "") + "' fill='none' stroke='" + INK +
          "' stroke-width='1.8' opacity='.4' stroke-linecap='round'/>" +
        "<path d='M" + (cx - m * (hw - 2)) + " 309L" + (cx - m * (hw + 11)) + " 300' stroke='" + INK +
          "' stroke-width='3.2' stroke-linecap='round'/>" +
        "</g>";
    };

    var hand = function(){
      var f = [128, 158, 168, 150], s = "";
      s += "<path d='M-50 186L50 186L62 372L-62 372Z' fill='" + CREAM + "' stroke='" + INK + "' stroke-width='2.6'/>";
      for(var i = 0; i < 4; i++){
        var x = -56 + i * 29, len = f[i];
        s += "<rect x='" + x + "' y='" + (30 - len) + "' width='23' height='" + (len + 16) + "' rx='11.5' fill='" + CREAM2 + "' stroke='" + INK + "' stroke-width='2.6'/>";
        s += "<path d='M" + (x + 4) + " " + (30 - len * 0.5) + "Q" + (x + 11.5) + " " + (30 - len * 0.5 - 6) + " " + (x + 19) + " " + (30 - len * 0.5) + "' fill='none' stroke='" + INK + "' stroke-width='1.5' opacity='.3'/>";
        s += "<path d='M" + (x + 5) + " " + (22 - len) + "Q" + (x + 11.5) + " " + (14 - len) + " " + (x + 18) + " " + (22 - len) + "' fill='none' stroke='" + INK + "' stroke-width='1.5' opacity='.34'/>";
      }
      s += "<path d='M-62 10L62 10L62 190Q62 228 24 228L-24 228Q-62 228 -62 190Z' fill='" + CREAM2 + "'/>";
      s += "<path d='M-62 14L-62 190Q-62 228 -24 228L24 228Q62 228 62 190L62 14' fill='none' stroke='" + INK + "' stroke-width='2.6' stroke-linecap='round'/>";
      s += "<path d='M-40 74Q0 88 40 74' fill='none' stroke='" + INK + "' stroke-width='1.6' opacity='.2'/>";
      return s;
    };

    return "<svg viewBox='0 0 600 760' preserveAspectRatio='xMidYMax meet'>" +
      "<defs>" +
        "<clipPath id='fc'><path d='" + face + "'/></clipPath>" +
        "<linearGradient id='nsh' x1='0' y1='0' x2='0' y2='1'>" +
          "<stop offset='0' stop-color='" + TONE + "' stop-opacity='0'/>" +
          "<stop offset='1' stop-color='" + TONE + "' stop-opacity='.85'/>" +
        "</linearGradient>" +
        "<filter id='hs' x='-40%' y='-30%' width='180%' height='170%'>" +
          "<feDropShadow dx='3' dy='9' stdDeviation='7' flood-color='#B98F3E' flood-opacity='.5'/>" +
        "</filter>" +
        "<filter id='hs2' x='-40%' y='-30%' width='180%' height='170%'>" +
          "<feDropShadow dx='2' dy='6' stdDeviation='10' flood-color='#C9A961' flood-opacity='.45'/>" +
        "</filter>" +
      "</defs>" +
      "<g id='figroot'>" +
        "<path d='M268 500L268 700L372 700L372 500Z' fill='#EFDDBD'/>" +
        "<path d='" + hairBack + "' fill='" + INK + "'/>" +
        "<path d='" + face + "' fill='" + CREAM + "'/>" +
        "<g clip-path='url(#fc)'>" +
          "<ellipse cx='446' cy='392' rx='132' ry='168' fill='" + TONE + "' opacity='.34'/>" +
          "<ellipse cx='196' cy='404' rx='92' ry='150' fill='" + TONE + "' opacity='.18'/>" +
          "<ellipse cx='320' cy='196' rx='150' ry='58' fill='" + TONE + "' opacity='.2'/>" +
        "</g>" +
        "<path d='" + hairFront + "' fill='" + INK + "'/>" +
        "<path d='M312 300C304 330 306 350 320 364C334 350 336 330 328 300Z' fill='url(#nsh)' opacity='.55'/>" +
        "<path d='M206 256C224 244 262 238 296 242L294 256C262 252 228 256 208 266Z' fill='" + INK + "'/>" +
        "<path d='M434 256C416 244 378 238 344 242L346 256C378 252 412 256 432 266Z' fill='" + INK + "'/>" +
        eye(254, false) + eye(386, true) +
        "<g filter='url(#hs2)' transform='translate(262,524) rotate(4)'>" + hand() + "</g>" +
        "<g filter='url(#hs)' transform='translate(378,524) scale(-1,1) rotate(4)'>" + hand() + "</g>" +
      "</g>" +
    "</svg>";
  }
  $fig.innerHTML = buildFigure();

  /* 纸张颗粒：一次性生成，运行时零外部请求 */
  function makeGrain(){
    try{
      var c = document.createElement("canvas");
      c.width = 190; c.height = 190;
      var ctx = c.getContext("2d");
      var img = ctx.createImageData(190, 190), d = img.data;
      for(var i = 0; i < d.length; i += 4){
        var v = Math.max(0, Math.min(255, Math.round(204 + Math.random() * 51)));
        d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      document.getElementById("grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
    }catch(e){}
  }
  makeGrain();

  function guardViewport(){
    var w = window.innerWidth, h = window.innerHeight;
    if(!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0){
      document.documentElement.classList.add("vp-fallback");
      var st = document.getElementById("stage");
      st.style.width = "1440px"; st.style.height = "900px";
    }
  }
  guardViewport();
  window.addEventListener("resize", guardViewport, {passive:true});


  try{ S.rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  function post(m){ try{ parent.postMessage(m, "*"); }catch(e){} }
  function sendReady(){
    if(S.readySent) return;
    S.readySent = true;
    post({__c100:1, type:"ready"});
  }

  function normLines(raw){
    if(!raw || !raw.length) return [];
    var out = [];
    for(var i=0;i<raw.length;i++){
      var l = raw[i] || {};
      var text = (l.text==null) ? "" : String(l.text);
      var ch = null;
      if(l.chars && l.chars.length){
        ch = [];
        for(var j=0;j<l.chars.length;j++){
          var c = l.chars[j] || {};
          ch.push({c:(c.c==null?"":String(c.c)), t:(typeof c.t==="number"&&isFinite(c.t)?c.t:null)});
        }
      }
      out.push({t:(typeof l.t==="number"&&isFinite(l.t)?l.t:0),
                dur:(typeof l.dur==="number"&&isFinite(l.dur)&&l.dur>0?l.dur:0),
                text:text, chars:ch});
    }
    out.sort(function(a,b){return a.t-b.t;});
    return out;
  }

  function setMeta(song){
    song = song || {};
    var nm = (song.name == null) ? "" : String(song.name);
    var ar = "";
    if(song.artists != null){
      ar = Array.isArray(song.artists) ? song.artists.filter(Boolean).join(" / ") : String(song.artists);
    }
    $mName.textContent = nm || "未知曲目";
    $mArt.textContent = ar;
    $mArt.style.display = ar ? "" : "none";
    try{ document.title = "346 · " + (nm || "掩面明黄"); }catch(e){}
  }

  function setAccent(ac){
    var col = INK;
    if(ac && ac.length >= 3){
      var r = Math.max(0, Math.min(255, Math.round(+ac[0] || 0)));
      var g = Math.max(0, Math.min(255, Math.round(+ac[1] || 0)));
      var b = Math.max(0, Math.min(255, Math.round(+ac[2] || 0)));
      var dist = Math.abs(r - 255) + Math.abs(g - 210) + Math.abs(b - 0);
      var lum  = 0.299 * r + 0.587 * g + 0.114 * b;
      if(dist > 150 && lum < 210) col = "rgb(" + r + "," + g + "," + b + ")";
    }
    document.documentElement.style.setProperty("--accent", col);
  }

  function onInit(p){
    p = p || {};
    S.lines = normLines(p.lines);
    S.dur = (typeof p.duration === "number" && isFinite(p.duration)) ? p.duration : 0;
    S.playing = (typeof p.playing === "boolean") ? p.playing : true;
    S.lineRef = null; S.revIdx = 0; S.idx = -1; S.cur = -2; S.gotInit = true;
    setMeta(p.song);
    setAccent(p.accent);
  }

  function findIdx(t){
    var lo=0, hi=S.lines.length-1, r=-1;
    while(lo<=hi){ var m=(lo+hi)>>1; if(S.lines[m].t <= t+0.02){ r=m; lo=m+1; } else hi=m-1; }
    return r;
  }

  /* ── 歌词：逐字"上墨"，未唱到的字只留墨线，不压灰 ─────────────── */
  function mkCh(ch){
    var s = document.createElement("span"); s.className = "ch";
    var i = document.createElement("span"); i.className = "ci";
    i.textContent = (ch === " ") ? "\u00a0" : ch;
    s.appendChild(i);
    return s;
  }
  var LAT = /[A-Za-z0-9'’\-\.\,\:\!\?]/;

  function charTimes(L){
    var n = L.text.length, out = new Array(n), i;
    var dur = L.dur > 0 ? L.dur : (n > 0 ? Math.max(1.6, n * 0.28) : 2);
    if(L.chars && L.chars.length){
      var m = L.chars.length, extra = (dur * 0.9) / Math.max(1, n);
      for(i = 0; i < n; i++){
        var c = L.chars[Math.min(i, m - 1)];
        var tt = (c && c.t != null) ? c.t : null;
        if(tt == null) tt = L.t + (i / Math.max(1, n)) * dur * 0.9;
        out[i] = tt;
      }
      for(i = 1; i < n; i++){ if(out[i] < out[i-1]) out[i] = out[i-1] + extra; }
    } else {
      for(i = 0; i < n; i++) out[i] = L.t + (i / Math.max(1, n)) * dur * 0.88;
    }
    return out;
  }

  function renderLine(L){
    var frag = document.createDocumentFragment();
    var t = L.text, i = 0, n = t.length;
    while(i < n){
      if(LAT.test(t[i])){
        var j = i; while(j < n && LAT.test(t[j])) j++;
        var w = document.createElement("span"); w.className = "w";
        for(var k = i; k < j; k++) w.appendChild(mkCh(t[k]));
        frag.appendChild(w); i = j;
      } else {
        frag.appendChild(mkCh(t[i])); i++;
      }
    }
    $ln.className = "ln";
    $ln.textContent = "";
    $ln.appendChild(frag);
    var f = n <= 10 ? 1.06 : n <= 16 ? 0.94 : n <= 24 ? 0.8 : n <= 36 ? 0.66 : 0.56;
    $ln.style.fontSize = "calc(var(--fsbase) * " + f + ")";
    S.times = charTimes(L);
    S.chs = $ln.getElementsByClassName("ch");
    S.lineRef = L; S.revIdx = 0;
  }

  function reveal(upto){
    var chs = S.chs, times = S.times, k = S.revIdx, n = chs ? chs.length : 0;
    while(k < n && times[k] <= upto){ chs[k].className = "ch on"; k++; }
    S.revIdx = k;
  }

  function showEmpty(){
    $ln.className = "ln empty";
    $ln.innerHTML = "<em>无歌词</em><i>INSTRUMENTAL</i>";
    $ln.style.fontSize = "";
    S.chs = null; S.lineRef = false;
  }

  window.addEventListener("message", function(ev){
    var d = ev.data;
    if(!d || d.__c100 !== 1) return;
    if(d.type === "init"){ onInit(d.payload); }
    else if(d.type === "tick"){
      var p = d.payload || {};
      if(typeof p.time === "number" && isFinite(p.time)) S.t = p.time;  /* 无条件采纳 */
      if(typeof p.playing === "boolean") S.playing = p.playing;
      S.lastTickAt = performance.now();
    }
    else if(d.type === "beat"){
      var b = d.payload || {};
      var lv = (typeof b.level === "number" && isFinite(b.level)) ? b.level : 0.6;
      lv = Math.max(0, Math.min(1, lv));
      if(lv > S.pulse) S.pulse = lv;
      S.beatT = performance.now();
    }
    else if(d.type === "live"){
      var v = d.payload || {};
      if(typeof v.bass === "number" && isFinite(v.bass)) S.bass = Math.max(0, Math.min(1, v.bass));
      if(typeof v.level === "number" && isFinite(v.level)) S.level = Math.max(0, Math.min(1, v.level));
      if(typeof v.playing === "boolean") S.playingLive = v.playing;
    }
  });

  var eyes = [], nextBlink = 0;
  var last = performance.now();

  function frame(now){
    var js0 = performance.now();
    var dt = Math.min(0.3, (now - last) / 1000); last = now;
    try{
      if(S.playing) S.t += dt;
      var i = findIdx(S.t);
      if(i !== S.idx){ S.idx = i; }
      if(S.lines.length){
        if(S.idx < 0){ if(S.lineRef !== false){ $ln.className = "ln"; $ln.textContent = ""; S.chs = null; S.lineRef = false; } }
        else {
          var L = S.lines[S.idx];
          if(S.lineRef !== L){ renderLine(L); }
          reveal(S.t);
        }
      } else if(S.gotInit && S.lineRef !== false){ showEmpty(); }

      /* 节拍呼吸：整幅人像极轻微起伏 */
      S.pulse *= Math.max(0, 1 - dt * 5.2);
      if(!S.rm){
        var sc = 1 + S.pulse * 0.011 + S.bass * 0.004;
        $fig.style.transform = "scale(" + sc.toFixed(4) + ")";
        if(now > nextBlink){
          var bp = (now - nextBlink) / 170;
          if(bp < 1){
            var k = 1 - 0.94 * Math.sin(Math.PI * bp);
            for(var e = 0; e < eyes.length; e++) eyes[e].style.transform = "scaleY(" + k.toFixed(3) + ")";
          } else {
            for(var e2 = 0; e2 < eyes.length; e2++) eyes[e2].style.transform = "";
            nextBlink = now + 4200 + Math.random() * 5200;
          }
        }
      }
    }catch(err){ S.err = String(err && err.message ? err.message : err); }

    S.frames++;
    S.js = performance.now() - js0;
    if(!S.readySent) sendReady();
    requestAnimationFrame(frame);
  }

  eyes = $fig.querySelectorAll(".eye");
  nextBlink = performance.now() + 3200;
  requestAnimationFrame(frame);
  setTimeout(sendReady, 300);

  window.__stage = function(){
    return { lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing,
             frames:S.frames, js:S.js, err:S.err, text:(S.idx>=0?S.lines[S.idx].text:""),
             gl:S.gl, rm:S.rm };
  };
})();
</script>
</body>
</html>
