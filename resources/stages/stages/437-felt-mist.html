<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>437 · 毡锤与晨雾</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#eeeae1}
  body{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Noto Serif",Georgia,serif;color:#36332c;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.045;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");background-size:200px 200px}
  #scrim{position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none;
         background:linear-gradient(to top,rgba(245,242,234,.62) 0%,rgba(245,242,234,.34) 38%,rgba(245,242,234,.10) 72%,rgba(245,242,234,0) 100%)}
  #cap{position:fixed;top:clamp(16px,3.2vh,38px);left:clamp(18px,3.4vw,52px);right:clamp(18px,3.4vw,52px);
       font-size:clamp(9px,.92vw,12px);letter-spacing:.30em;color:rgba(74,69,60,.42);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  #lyr{position:fixed;left:0;right:0;bottom:clamp(64px,20vh,190px);display:flex;flex-direction:column;
       align-items:center;justify-content:flex-end;gap:clamp(10px,1.5vh,20px);
       padding:0 min(9vw,160px);pointer-events:none;text-align:center}
  #next{font-size:clamp(11px,1.28vw,17px);line-height:1.6;letter-spacing:.20em;
        color:rgba(58,53,45,.46);opacity:0;transition:opacity .7s ease;white-space:pre-wrap;
        text-shadow:0 1px 3px rgba(255,252,246,.9);
        word-break:break-word;max-width:min(74vw,900px)}
  #next.on{opacity:1}
  #lyr::before{content:'';position:absolute;inset:-7vh -10vw;z-index:-1;pointer-events:none;
       background:radial-gradient(62% 74% at 50% 56%,rgba(247,244,236,.60) 0%,rgba(247,244,236,.34) 46%,rgba(247,244,236,0) 78%)}
  #line{font-size:clamp(21px,3.15vw,48px);line-height:1.52;letter-spacing:.055em;font-weight:400;
        color:#33302a;white-space:pre-wrap;word-break:break-word;max-width:min(82vw,1120px);
        opacity:0;transform:translateY(7px);transition:opacity .62s ease,transform .7s cubic-bezier(.22,.72,.24,1),filter .8s ease}
  #line.on{opacity:1;transform:translateY(0)}
  #line.dim{opacity:.42;filter:blur(.35px)}
  #line.long{font-size:clamp(16px,2.32vw,34px);letter-spacing:.02em;line-height:1.62}
  #line.xl{font-size:clamp(13px,1.82vw,26px);letter-spacing:.01em;line-height:1.7}
  #line .ch{color:rgba(51,48,42,.42);transition:color .42s ease}
  #line .ch.lit{color:#2f2c26}
  #rule{height:1px;background:linear-gradient(90deg,rgba(168,128,80,0),rgba(168,128,80,.75),rgba(168,128,80,0));
        width:0;flex:0 0 auto}
  #empty{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
         gap:16px;pointer-events:none}
  #empty.show{display:flex}
  #empty .e1{font-size:clamp(13px,1.4vw,18px);letter-spacing:.42em;text-indent:.42em;color:rgba(74,69,60,.46)}
  #empty .e2{width:clamp(40px,6vw,86px);height:1px;background:rgba(150,124,88,.35)}
  @media (max-aspect-ratio:3/4){
    #lyr{padding:0 7vw}
    #line{font-size:clamp(20px,5.6vw,34px)}
    #next{font-size:clamp(11px,2.6vw,15px)}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scrim"></div>
<div id="grain"></div>
<div id="cap"></div>
<div id="lyr"><div id="next"></div><div id="line"></div><div id="rule"></div></div>
<div id="empty"><div class="e1">此曲无词</div><div class="e2"></div></div>

<script>
/* 自检口：必须最外层、无条件赋值 */
var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', gl: false, rm: false };
window.__stage = function () {
  return { lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing, frames: S.frames,
           js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm };
};
</script>

<script>
(function () {
  'use strict';

  var view = { w: 1440, h: 900, dpr: 1, accent: [190, 160, 122] };
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var elLine = document.getElementById('line');
  var elNext = document.getElementById('next');
  var elRule = document.getElementById('rule');
  var elEmpty = document.getElementById('empty');
  var elCap = document.getElementById('cap');

  var readySent = false;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  S.rm = !!(mq && mq.matches);
  var RED = S.rm;

  function num(v, d) { v = +v; return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[437] ready post failed', e); }
  }

  /* ---------- 图层缓存 ---------- */
  var bg = null, bx = null, fgH = null, fxH = null, shaft = null, shx = null;
  var SPR = null;
  var LV = { level: 0, bass: 0, mid: 0, treble: 0, bpm: 92 };
  var LVT = { level: 0, bass: 0, mid: 0, treble: 0, bpm: 92 };
  var KB = { hit: 0, at: -1e9 };
  var lineW = 0;
  var motes = null;

  var CAN_FILTER = (function () {
    try { var c = document.createElement('canvas').getContext('2d'); c.filter = 'blur(2px)'; return c.filter !== 'none'; }
    catch (e) { return false; }
  })();

  function mkC(w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  /* 柔和光斑贴图 */
  function blob(rgbStr, peak) {
    var c = mkC(128, 128), g = c.getContext('2d');
    var rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(' + rgbStr + ',' + peak + ')');
    rg.addColorStop(0.42, 'rgba(' + rgbStr + ',' + (peak * 0.40).toFixed(3) + ')');
    rg.addColorStop(0.72, 'rgba(' + rgbStr + ',' + (peak * 0.10).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(' + rgbStr + ',0)');
    g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
    return c;
  }

  function ridge(g, w, h, baseY, amp, seed, color) {
    var step = Math.max(3, w / 160);
    g.beginPath();
    g.moveTo(-3, h);
    for (var x = -3; x <= w + step; x += step) {
      var u = x / w;
      var y = baseY + amp * (0.58 * Math.sin(u * 5.4 + seed) +
                             0.29 * Math.sin(u * 12.3 + seed * 2.1) +
                             0.13 * Math.sin(u * 24.7 + seed * 3.7));
      g.lineTo(x, y);
    }
    g.lineTo(w + 3, h); g.closePath();
    g.fillStyle = color; g.fill();
  }

  function buildBG(w, h) {
    bg = mkC(w * view.dpr, h * view.dpr); bx = bg.getContext('2d');
    bx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

    var g = bx.createLinearGradient(0, 0, w * 0.30, h);
    g.addColorStop(0, '#f7f5ef');
    g.addColorStop(0.30, '#efece4');
    g.addColorStop(0.56, '#e5e0d5');
    g.addColorStop(0.78, '#d7d1c3');
    g.addColorStop(1, '#c7c0b1');
    bx.fillStyle = g; bx.fillRect(0, 0, w, h);

    /* 窗面雾带 */
    var fog = bx.createLinearGradient(0, 0, 0, h * 0.62);
    fog.addColorStop(0, 'rgba(252,250,245,.62)');
    fog.addColorStop(0.62, 'rgba(247,244,237,.34)');
    fog.addColorStop(1, 'rgba(247,244,237,0)');
    bx.fillStyle = fog; bx.fillRect(0, 0, w, h * 0.62);

    /* 远山，极低对比 */
    bx.save();
    if (CAN_FILTER) bx.filter = 'blur(3px)';
    ridge(bx, w, h, h * 0.305, h * 0.052, 1.17, 'rgba(118,124,124,.20)');
    ridge(bx, w, h, h * 0.372, h * 0.041, 3.94, 'rgba(104,110,110,.16)');
    ridge(bx, w, h, h * 0.430, h * 0.030, 7.31, 'rgba(96,102,102,.11)');
    bx.restore();

    /* 山脚残雾 */
    var fh = bx.createLinearGradient(0, h * 0.34, 0, h * 0.60);
    fh.addColorStop(0, 'rgba(246,243,236,0)');
    fh.addColorStop(0.55, 'rgba(246,243,236,.55)');
    fh.addColorStop(1, 'rgba(246,243,236,.16)');
    bx.fillStyle = fh; bx.fillRect(0, h * 0.30, w, h * 0.34);

    /* 玻璃擦拭的横向柔光 */
    for (var i = 0; i < 3; i++) {
      var cy = h * (0.24 + i * 0.135);
      var hh = h * (0.055 + i * 0.012);
      var lg = bx.createLinearGradient(0, cy - hh, 0, cy + hh);
      lg.addColorStop(0, 'rgba(255,253,247,0)');
      lg.addColorStop(0.5, 'rgba(255,253,247,' + (0.20 - i * 0.05).toFixed(3) + ')');
      lg.addColorStop(1, 'rgba(255,253,247,0)');
      bx.fillStyle = lg; bx.fillRect(0, cy - hh, w, hh * 2);
    }

    /* 凝结水雾颗粒 */
    var dn = clamp(Math.round(w * h / 4200), 40, 420);
    for (var d = 0; d < dn; d++) {
      var px = Math.random() * w;
      var py = Math.pow(Math.random(), 0.72) * h * 0.86;
      var pr = 0.7 + Math.random() * 2.4;
      bx.beginPath();
      bx.arc(px, py, pr, 0, 6.2832);
      bx.fillStyle = 'rgba(255,255,252,' + (0.10 + Math.random() * 0.24).toFixed(3) + ')';
      bx.fill();
      bx.beginPath();
      bx.arc(px - pr * 0.22, py - pr * 0.26, pr * 0.44, 0, 6.2832);
      bx.fillStyle = 'rgba(255,255,255,' + (0.24 + Math.random() * 0.34).toFixed(3) + ')';
      bx.fill();
      bx.beginPath();
      bx.arc(px + pr * 0.18, py + pr * 0.24, pr * 0.78, 0, 6.2832);
      bx.strokeStyle = 'rgba(146,146,140,' + (0.05 + Math.random() * 0.07).toFixed(3) + ')';
      bx.lineWidth = 0.7; bx.stroke();
    }

    /* 琴盖木面：横向极淡的接缝与倒影 */
    var seamY = h * 0.775;
    var seam = bx.createLinearGradient(0, seamY - h * 0.05, 0, seamY + h * 0.02);
    seam.addColorStop(0, 'rgba(120,110,94,0)');
    seam.addColorStop(0.72, 'rgba(120,110,94,.10)');
    seam.addColorStop(1, 'rgba(255,252,244,.30)');
    bx.fillStyle = seam; bx.fillRect(0, seamY - h * 0.05, w, h * 0.07);

    var refl = bx.createLinearGradient(0, h * 0.62, 0, h);
    refl.addColorStop(0, 'rgba(252,250,244,0)');
    refl.addColorStop(0.55, 'rgba(250,247,240,.28)');
    refl.addColorStop(1, 'rgba(238,233,222,.10)');
    bx.fillStyle = refl; bx.fillRect(0, h * 0.62, w, h * 0.38);

    /* 暗角 */
    var vg = bx.createRadialGradient(w * 0.52, h * 0.44, Math.min(w, h) * 0.30,
                                    w * 0.52, h * 0.44, Math.max(w, h) * 0.82);
    vg.addColorStop(0, 'rgba(90,84,72,0)');
    vg.addColorStop(1, 'rgba(90,84,72,.17)');
    bx.fillStyle = vg; bx.fillRect(0, 0, w, h);
  }

  function felt(g, x, y, bw, bh) {
    var r = Math.min(bw * 0.34, bh * 0.62);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + bw - r, y);
    g.quadraticCurveTo(x + bw, y, x + bw, y + r);
    g.lineTo(x + bw, y + bh - r * 0.5);
    g.quadraticCurveTo(x + bw, y + bh, x + bw - r * 0.5, y + bh);
    g.lineTo(x + r * 0.5, y + bh);
    g.quadraticCurveTo(x, y + bh, x, y + bh - r * 0.5);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
    var gg = g.createLinearGradient(x, y, x + bw * 0.4, y + bh);
    gg.addColorStop(0, '#e9e1cf');
    gg.addColorStop(0.34, '#dcd2be');
    gg.addColorStop(0.78, '#c6bca7');
    gg.addColorStop(1, '#b0a692');
    g.fillStyle = gg; g.fill();
    g.strokeStyle = 'rgba(122,110,92,.20)';
    g.lineWidth = 1; g.stroke();
  }

  function buildHammer(w, h) {
    fgH = mkC(w * view.dpr, h * view.dpr); fxH = fgH.getContext('2d');
    fxH.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

    var n = clamp(Math.round(w / 176), 5, 10);
    var slot = w / n;
    var top = h * 0.842;

    /* 毡锤上缘的一道柔光，晨光从上方溢下来 */
    if (CAN_FILTER) fxH.filter = 'blur(7px)';
    fxH.fillStyle = 'rgba(255,252,242,.55)';
    fxH.fillRect(0, top - h * 0.012, w, h * 0.030);
    if (CAN_FILTER) fxH.filter = 'none';

    for (var i = 0; i < n; i++) {
      var bw = slot * 1.03;
      var x = i * slot - slot * 0.015;
      var bh = h * (0.150 + 0.020 * ((i % 3) - 1));
      var y = top + (i % 2 ? h * 0.007 : 0);
      felt(fxH, x, y, bw, bh);
      /* 锤头左缘的背光细线 */
      fxH.beginPath();
      fxH.moveTo(x + bw * 0.10, y + bh * 0.22);
      fxH.lineTo(x + bw * 0.10, y + bh * 0.80);
      fxH.strokeStyle = 'rgba(255,253,246,.38)';
      fxH.lineWidth = 1.2;
      fxH.stroke();
    }

    /* 毛毡接缝的阴影，让一排锤头有体积 */
    if (CAN_FILTER) fxH.filter = 'blur(4px)';
    for (var s = 1; s < n; s++) {
      fxH.fillStyle = 'rgba(126,114,96,.14)';
      fxH.fillRect(s * slot - slot * 0.012, top + h * 0.004, slot * 0.024, h * 0.155);
    }
    if (CAN_FILTER) fxH.filter = 'none';
  }

  function buildShaft(w, h) {
    shaft = mkC(w * view.dpr, h * view.dpr); shx = shaft.getContext('2d');
    shx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    shx.save();
    shx.translate(w * 0.34, h * 0.20);
    shx.rotate(0.42);
    var bw = w * 0.42, bh = h * 1.30;
    var lg = shx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    lg.addColorStop(0, 'rgba(255,253,244,0)');
    lg.addColorStop(0.42, 'rgba(255,253,244,.55)');
    lg.addColorStop(0.58, 'rgba(255,253,244,.42)');
    lg.addColorStop(1, 'rgba(255,253,244,0)');
    shx.fillStyle = lg;
    if (CAN_FILTER) shx.filter = 'blur(18px)';
    shx.fillRect(-bw / 2, -bh / 2, bw, bh);
    shx.restore();
    shx.filter = 'none';
  }

  function buildMotes(w, h) {
    var n = clamp(Math.round(w / 110), 8, 20);
    motes = [];
    for (var i = 0; i < n; i++) {
      motes.push({
        x: Math.random() * w, y: h * (0.10 + Math.random() * 0.62),
        r: 0.8 + Math.random() * 2.1,
        ph: Math.random() * 6.283,
        sp: 0.25 + Math.random() * 0.55,
        am: 8 + Math.random() * 26
      });
    }
  }

  function buildSprites() {
    SPR = {
      mist: blob('252,250,243', 0.55),
      mist2: blob('240,236,227', 0.48),
      glow: blob('255,244,214', 0.80),
      mote: blob('255,250,232', 0.95)
    };
  }

  function resize() {
    var w = Math.round(window.innerWidth) || 1440;
    var h = Math.round(window.innerHeight) || 900;
    if (!(w > 0)) w = 1440;
    if (!(h > 0)) h = 900;
    view.w = w; view.h = h;
    view.dpr = clamp(window.devicePixelRatio || 1, 1, 1.8);
    cv.width = Math.round(w * view.dpr);
    cv.height = Math.round(h * view.dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    if (!SPR) buildSprites();
    buildBG(w, h);
    buildHammer(w, h);
    buildShaft(w, h);
    buildMotes(w, h);
    measureLine();
  }

  function measureLine() {
    try { lineW = elLine.getBoundingClientRect().width || 0; } catch (e) { lineW = 0; }
  }

  /* ---------- 歌词 ---------- */
  var charEls = null, charT = null, litCount = 0;

  function splitUnits(text) {
    var out = [];
    var s = String(text == null ? '' : text);
    if (s.length > 400) s = s.slice(0, 400);
    try {
      var arr = Array.from ? Array.from(s) : s.split('');
      for (var i = 0; i < arr.length && i < 260; i++) out.push(arr[i]);
    } catch (e) {
      for (var j = 0; j < s.length && j < 260; j++) out.push(s.charAt(j));
    }
    return out;
  }

  function buildLineDOM(l) {
    elLine.textContent = '';
    charEls = null; charT = null; litCount = 0;
    if (!l) return;
    var units = [], times = [], i;

    if (l.chars && l.chars.length) {
      var n = Math.min(l.chars.length, 260);
      for (i = 0; i < n; i++) {
        units.push(l.chars[i].c == null ? '' : String(l.chars[i].c));
        times.push(num(l.chars[i].t, l.t));
      }
    } else {
      units = splitUnits(l.text);
      var m = Math.max(1, units.length);
      var span = Math.max(0.5, Math.min(14, num(l.dur, 3))) * 0.86;
      var per = span / m;
      for (i = 0; i < m; i++) times.push(l.t + per * i);
    }

    if (!units.length) { elLine.textContent = l.text || ''; return; }
    if (units.length > 52) units = fitUnits(units, 52);
    elLine.textContent = '';
    var frag = document.createDocumentFragment();
    charEls = []; charT = times;
    for (i = 0; i < units.length; i++) {
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = units[i];
      frag.appendChild(sp);
      charEls.push(sp);
    }
    elLine.appendChild(frag);
    var n2 = units.length;
    elLine.classList.toggle('long', n2 > 28 && n2 <= 52);
    elLine.classList.toggle('xl', n2 > 52);
    measureLine();
  }

  function refreshLit() {
    if (!charEls) return;
    var t = S.t, k = litCount, n = charT.length;
    while (k < n && charT[k] <= t + 0.004 && k < 260) k++;
    if (k === litCount) return;
    var from = Math.min(litCount, k), to = Math.max(litCount, k);
    for (var i = from; i < to; i++) {
      charEls[i].classList.toggle('lit', charT[i] <= t + 0.004);
    }
    litCount = k;
  }

  function fitUnits(units, max) {
    /* 固定次数上限，绝不 while 死循环 */
    var out = [], i;
    for (i = 0; i < max - 1 && i < units.length; i++) out.push(units[i]);
    if (units.length > max - 1) out.push('…');
    return out;
  }

  function renderLine(force) {
    var l = (S.idx >= 0 && S.idx < S.lines.length) ? S.lines[S.idx] : null;
    S.text = l ? l.text : '';
    if (!l) {
      elLine.classList.remove('on');
      elLine.classList.remove('dim');
      elNext.classList.remove('on');
      elNext.textContent = '';
      elRule.style.width = '0px';
      return;
    }
    if (force || elLine.getAttribute('data-k') !== String(S.idx)) {
      elLine.classList.remove('on');
      buildLineDOM(l);
      elLine.setAttribute('data-k', String(S.idx));
      var nx = S.lines[S.idx + 1];
      elNext.textContent = nx ? nx.text : '';
      elNext.classList.toggle('on', !!nx && !!nx.text);
      measureLine();
      dimState = false;
      elLine.classList.remove('dim');
      /* 换句时让淡入重新发生，用序号防止连点时错位 */
      var gen = ++lineGen;
      requestAnimationFrame(function () {
        if (gen !== lineGen) return;
        elLine.classList.add('on');
      });
    }
    refreshLit();
    updateProgress();
  }
  var lineGen = 0;

  /* 句尾渐隐：句末 0.45 秒内让当前句轻一点，下一句随即接上 */
  function updateFade() {
    var l = (S.idx >= 0 && S.idx < S.lines.length) ? S.lines[S.idx] : null;
    if (!l) return;
    var remain = (l.t + l.dur) - S.t;
    var want = remain < 0.45 && S.idx < S.lines.length - 1;
    if (want !== dimState) {
      dimState = want;
      elLine.classList.toggle('dim', want);
    }
  }
  var dimState = false;

  function updateProgress() {
    var l = (S.idx >= 0 && S.idx < S.lines.length) ? S.lines[S.idx] : null;
    if (!l) { elRule.style.width = '0px'; return; }
    var p = clamp((S.t - l.t) / Math.max(0.3, l.dur), 0, 1);
    var w = Math.min(lineW || 0, view.w * 0.86);
    elRule.style.width = (w * p).toFixed(1) + 'px';
  }

  function applyEmpty() {
    elEmpty.classList.toggle('show', S.lines.length === 0);
    elLine.classList.toggle('on', S.lines.length > 0 && S.idx >= 0);
  }

  /* accent 只做极轻的偏色，不破坏冷灰米白 */
  function tintScrim() {
    try {
      var a = view.accent;
      var bg2 = document.getElementById('scrim');
      if (!bg2) return;
      var r = Math.round(245 + (a[0] - 245) * 0.10);
      var g2 = Math.round(242 + (a[1] - 242) * 0.10);
      var b2 = Math.round(234 + (a[2] - 234) * 0.10);
      bg2.style.background = 'linear-gradient(to top,rgba(' + r + ',' + g2 + ',' + b2 + ',.62) 0%,' +
        'rgba(' + r + ',' + g2 + ',' + b2 + ',.34) 38%,rgba(' + r + ',' + g2 + ',' + b2 + ',.10) 72%,' +
        'rgba(' + r + ',' + g2 + ',' + b2 + ',0) 100%)';
    } catch (e) { console.error('[437] tint error', e); }
  }

  /* ---------- 消息 ---------- */
  var lastInitAt = 0;

  function onInit(p) {
    p = p || {};
    lastInitAt = Date.now();
    var raw = Array.isArray(p.lines) ? p.lines : [];
    var out = [];
    var i, j;
    for (i = 0; i < raw.length && i < 600; i++) {
      var l = raw[i] || {};
      var txt = (l.text == null) ? '' : String(l.text);
      var ch = null;
      if (Array.isArray(l.chars) && l.chars.length) {
        ch = [];
        var joined = '';
        var lim = Math.min(l.chars.length, 300);
        for (j = 0; j < lim; j++) {
          var c = l.chars[j] || {};
          var cc = (c.c == null) ? '' : String(c.c);
          ch.push({ c: cc, t: num(c.t, num(l.t, 0)) });
          joined += cc;
        }
        if (!txt) txt = joined;
      }
      out.push({ t: num(l.t, 0), dur: Math.max(0.25, num(l.dur, 3)), text: txt, chars: ch });
    }
    /* 脏数据：t 可能全相等/倒序，排序用稳定比较，不依赖 Array.prototype.sort 的稳定性 */
    out.sort(function (a, b) { return a.t - b.t; });
    S.lines = out;
    S.idx = -1; S.text = '';
    litCount = 0;
    charEls = null; charT = null;
    elLine.removeAttribute('data-k');
    if (out.length === 0) S.t = S.t || 0;

    if (Array.isArray(p.accent) && p.accent.length >= 3) {
      view.accent = [clamp(num(p.accent[0], 190), 0, 255), clamp(num(p.accent[1], 160), 0, 255), clamp(num(p.accent[2], 122), 0, 255)];
      tintScrim();
    }
    var song = p.song || {};
    var ar = song.artists;
    if (Array.isArray(ar)) ar = ar.filter(function (v) { return v != null && v !== ''; }).join(' / ');
    ar = (ar == null) ? '' : String(ar);
    var nm = (song.name == null) ? '' : String(song.name);
    var cap = '';
    if (ar && nm) cap = ar + ' · ' + nm;
    else cap = ar || nm;
    elCap.textContent = cap;

    elLine.textContent = '';
    elLine.classList.remove('on');
    elNext.textContent = '';
    elNext.classList.remove('on');
    renderLine(true);
    applyEmpty();
    /* 立刻定位到当前句（防止 tick 到达前空着） */
    if (S.lines.length && S.t > 0) onTick({ time: S.t, playing: S.playing });
  }

  function onTick(p) {
    p = p || {};
    var t = num(p.time, S.t);
    if (t < 0) t = 0;
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    S.t = t;
    var n = S.lines.length, idx = -1, i;
    for (i = 0; i < n; i++) { if (S.lines[i].t <= t + 0.02) idx = i; else break; }
    if (idx !== S.idx) { S.idx = idx; renderLine(false); }
    else { refreshLit(); updateProgress(); updateFade(); }
  }

  /* ---------- 绘制 ---------- */
  function draw(time, kick) {
    var w = view.w, h = view.h;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    if (bg) ctx.drawImage(bg, 0, 0, w, h);
    else { ctx.fillStyle = '#eeeae1'; ctx.fillRect(0, 0, w, h); }

    if (!SPR) return;

    /* 晨光柱（先铺，雾再压上来，层级更像逆光） */
    var drift = RED ? 0.16 : 1;
    if (shaft) {
      var sa = 0.20 + LV.level * 0.30 + kick * 0.10;
      var sxo = Math.sin(time * 0.07 * drift) * w * 0.012;
      ctx.globalAlpha = clamp(sa, 0.10, 0.62);
      ctx.drawImage(shaft, sxo, 0, w, h);
      ctx.globalAlpha = 1;
    }

    /* 晨雾：缓慢漂移 */
    for (var i = 0; i < 3; i++) {
      var bx1 = w * (0.16 + i * 0.31) + Math.sin(time * 0.055 * drift + i * 2.1) * w * 0.075;
      var by1 = h * (0.40 + i * 0.09) + Math.cos(time * 0.041 * drift + i * 1.3) * h * 0.035;
      var sz = Math.max(w, h) * (0.34 + i * 0.07);
      var al = 0.16 + 0.05 * Math.sin(time * 0.3 + i) + LV.level * 0.05;
      ctx.globalAlpha = clamp(al, 0.06, 0.34);
      ctx.drawImage(i % 2 ? SPR.mist2 : SPR.mist, bx1 - sz / 2, by1 - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    /* 铜弦 */
    drawStrings(ctx, w, h, time, kick);

    /* 空气中的细尘 */
    if (motes) {
      var mo = RED ? 0.4 : 1;
      for (var m = 0; m < motes.length; m++) {
        var p = motes[m];
        var mx = p.x + Math.sin(time * 0.32 * mo + p.ph) * p.am;
        var my = p.y - ((time * p.sp * mo) % (h * 0.9));
        if (my < -20) my += h;
        var ms = p.r * 7;
        ctx.globalAlpha = 0.16 + 0.16 * Math.sin(time * 0.6 + p.ph);
        ctx.drawImage(SPR.mote, mx - ms / 2, my - ms / 2, ms, ms);
      }
      ctx.globalAlpha = 1;
    }

    /* 前景毡锤 */
    if (fgH) {
      var fxo = RED ? 0 : Math.sin(time * 0.19) * w * 0.0035;
      var fyo = RED ? 0 : kick * h * 0.0075;
      ctx.drawImage(fgH, fxo, fyo, w, h);
    }

    measureLine();
    if (!RED) {
      /* 左侧窗棂边缘的一线冷光，只占极窄一条，避免整块泛白 */
      ctx.globalAlpha = 0.10 + LV.level * 0.06;
      ctx.fillStyle = '#fffdf6';
      ctx.fillRect(0, 0, Math.max(2, w * 0.012), h);
      ctx.globalAlpha = 1;
    }
  }

  var COPPER = [150, 112, 66];

  function drawStrings(g, w, h, time, kick) {
    var N = clamp(Math.round(w / 68), 12, 26);
    var y0 = h * 0.815, y1 = h * 0.598;
    var dx = w, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var spread = h * 0.105;
    var glint = ((time * 0.052) % 1.4) - 0.2;
    var ac = view.accent;
    var cr = Math.round(COPPER[0] + (ac[0] - COPPER[0]) * 0.22);
    var cg = Math.round(COPPER[1] + (ac[1] - COPPER[1]) * 0.22);
    var cb = Math.round(COPPER[2] + (ac[2] - COPPER[2]) * 0.22);

    g.lineCap = 'butt';
    for (var i = 0; i < N; i++) {
      var u = N > 1 ? i / (N - 1) : 0.5;
      var off = (u - 0.5) * spread;
      var ax = nx * off, ay = y0 + ny * off;
      var ex = w + nx * off, ey = y1 + ny * off;
      var d = Math.abs(u - glint);
      var glow = Math.max(0, 1 - d * 5.0);
      var base = 0.16 + 0.10 * Math.abs(Math.sin(i * 1.7));
      g.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (base + glow * 0.30).toFixed(3) + ')';
      g.lineWidth = (i % 3 === 0) ? 1.7 : 0.9;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(ex, ey); g.stroke();
      if (glow > 0.03) {
        g.strokeStyle = 'rgba(255,248,228,' + (glow * (0.42 + kick * 0.45)).toFixed(3) + ')';
        g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(ax, ay); g.lineTo(ex, ey); g.stroke();
      }
    }

    /* 弦上的一点反光 */
    if (SPR && SPR.glow) {
      var gu = clamp(glint, 0.02, 0.98);
      var gx = w * gu, gy = y0 + (y1 - y0) * gu;
      var gs = h * 0.40;
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = clamp(0.18 + 0.42 * kick + LV.treble * 0.14, 0.10, 0.62);
      g.drawImage(SPR.glow, gx - gs / 2, gy - gs / 2, gs, gs);
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
    }
  }

  /* ---------- 主循环 ---------- */
  var lastNow = 0;
  var started = false;

  function frame(now) {
    var t0 = 0;
    try { t0 = (window.performance || Date).now(); } catch (e) { t0 = now; }
    var tSec = now / 1000;
    var dt = lastNow ? Math.min(0.06, (now - lastNow) / 1000) : 0.016;
    lastNow = now;

    var k = 1 - Math.pow(0.001, dt);          /* 时间无关的平滑系数，避开除零 */
    if (!isFinite(k) || k <= 0) k = 0.12;
    LV.level += (LVT.level - LV.level) * Math.min(0.35, k);
    LV.bass += (LVT.bass - LV.bass) * Math.min(0.35, k);
    LV.mid += (LVT.mid - LV.mid) * Math.min(0.35, k);
    LV.treble += (LVT.treble - LV.treble) * Math.min(0.35, k);

    var age = (now - KB.at) / 1000;
    var kick = age >= 0 && age < 3 ? Math.exp(-age * 3.4) * KB.hit : 0;

    try {
      draw(tSec, kick);
      S.js = Math.round(((window.performance || Date).now() - t0) * 100) / 100;
      S.frames++;
    } catch (e) {
      console.error('[437] draw error', e);
      S.err = String((e && e.message) || e);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 事件 ---------- */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object' || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'live') {
        var p = d.payload || {};
        LVT.level = clamp(num(p.level, LVT.level), 0, 1.6);
        LVT.bass = clamp(num(p.bass, LVT.bass), 0, 1.6);
        LVT.mid = clamp(num(p.mid, LVT.mid), 0, 1.6);
        LVT.treble = clamp(num(p.treble, LVT.treble), 0, 1.6);
        LVT.bpm = num(p.bpm, LVT.bpm);
        if (typeof p.playing === 'boolean') S.playing = p.playing;
      } else if (d.type === 'beat') {
        var b = d.payload || {};
        var lvl = clamp(num(b.level, 0.6), 0, 1.4);
        var at = (window.performance || Date).now();
        if (lvl >= KB.hit * Math.exp(-((at - KB.at) / 1000) * 3.4) - 0.001) {
          KB.hit = lvl; KB.at = at;
        }
      }
    } catch (e) {
      console.error('[437] message handler error', d && d.type, e);
      S.err = String((e && e.message) || e);
    }
  });

  var rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      try { resize(); } catch (e) { console.error('[437] resize error', e); }
    }, 90);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { try { resize(); } catch (e) { console.error(e); } }, 240);
  });

  try {
    resize();
  } catch (e) {
    console.error('[437] bootstrap error', e);
    S.err = String((e && e.message) || e);
  }

  requestAnimationFrame(function (tfirst) {
    sendReady();
    lastNow = tfirst || 0;
    start();
  });
  /* 兜底：若 rAF 被节流（后台标签页），700ms 后仍要报一次 ready */
  setTimeout(function () {
    sendReady();
    start();
  }, 700);

  function start() {
    if (started) return;
    started = true;
    try { requestAnimationFrame(frame); } catch (e) { console.error('[437] frame kick error', e); }
  }
})();
</script>
</body>
</html>
