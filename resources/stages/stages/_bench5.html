<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head><body>
<canvas id="c" width="1440" height="810"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
const W=1440,H=810;
const M=2400;                      // 目标针数
const sx=new Float32Array(M),sy=new Float32Array(M),sh=new Float32Array(M);
for(let i=0;i<M;i++){sx[i]=160+(i*0.3417%1080); sy[i]=240+(i*0.7717%300); sh[i]=6+((i*13)%22);}
// offscreen glyph-field canvas
const fw=1180,fh=400;
const fx=new Float32Array(M),fy=new Float32Array(M);
for(let i=0;i<M;i++){fx[i]=sx[i]-130; fy[i]=sy[i]-220;}
const fc=document.createElement('canvas'); fc.width=fw; fc.height=fh;
const fg=fc.getContext('2d');
// 预烘针场（一次性）
function bakeField(g,ox,oy){
  g.clearRect(0,0,fw,fh);
  for(let b=0;b<3;b++){
    g.fillStyle=['rgba(96,124,164,0.42)','rgba(140,176,214,0.5)','rgba(226,240,255,0.85)'][b];
    g.beginPath();
    for(let i=b;i<M;i+=3){const x=fx[i]|0,y=fy[i]|0;const h=sh[i]|0;
      if(b===2)g.rect(x,y-2,3,3); else g.rect(x,y,1.4,h);}
    g.fill();
  }
}
const t0=performance.now(); bakeField(fg,0,0); fg.getImageData(0,0,1,1);
console.log('预烘针场一次性              '+((performance.now()-t0)).toFixed(1)+' ms');
const flush=()=>ctx.getImageData(0,0,1,1);
const half=document.createElement('canvas'); half.width=720;half.height=405;
{const g=half.getContext('2d');g.fillStyle='#0a0c12';g.fillRect(0,0,720,405);g.fillStyle='#14213a';g.fillRect(0,240,720,165);}
const bgFull=document.createElement('canvas'); bgFull.width=W;bgFull.height=H;
{const g=bgFull.getContext('2d');g.fillStyle='#0a0c12';g.fillRect(0,0,W,H);g.fillStyle='#14213a';g.fillRect(0,480,W,330);}
function bench(name,fn,iters){
  fn();fn();flush();
  const t=[];for(let k=0;k<iters;k++){const a=performance.now();fn();flush();t.push(performance.now()-a);}
  t.sort((x,y)=>x-y);
  console.log(name.padEnd(50)+t[Math.floor(t.length/2)].toFixed(2)+' ms (median of '+iters+')');
}
const BG=()=>{ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);ctx.drawImage(bgFull,0,0);};
bench('BG: 全尺寸 1:1 blit',BG,12);
bench('BG: fill+half blit 平滑关',()=>{ctx.imageSmoothingEnabled=false;ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);ctx.drawImage(half,0,0,W,H);ctx.imageSmoothingEnabled=true;},12);
bench('BG: 只 fill（不贴底图）',()=>{ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);},12);
// 1: blit 预烘针场
bench('1 BG + blit 针场(1180x400)',()=>{BG();ctx.drawImage(fc,130,220);},12);
// 2: BG + 全量 live 针 2400 单趟
bench('2 BG + live 针2400 单趟(int)',()=>{BG();ctx.fillStyle='rgba(226,240,255,.8)';ctx.beginPath();
  for(let i=0;i<M;i++){ctx.rect(sx[i]|0,sy[i]|0,2,sh[i]|0);}ctx.fill();},12);
// 3: BG + live 针 2400 两趟(身暗+尖亮)
bench('3 BG + live 针2400 两趟',()=>{BG();
  ctx.fillStyle='rgba(120,150,190,.42)';ctx.beginPath();
  for(let i=0;i<M;i++){ctx.rect(sx[i]|0,(sy[i]|0)+3,1,sh[i]|0);}ctx.fill();
  ctx.fillStyle='rgba(240,248,255,.9)';ctx.beginPath();
  for(let i=0;i<M;i++){ctx.rect(sx[i]|0,(sy[i]|0)-1,3,3);}ctx.fill();},12);
// 4: BG + blit 针场 + live 600 两趟
bench('4 BG + blit针场 + live600 两趟',()=>{BG();ctx.drawImage(fc,130,220);
  ctx.fillStyle='rgba(255,92,196,.9)';ctx.beginPath();
  for(let i=0;i<600;i++){const j=i*4%M;ctx.rect(sx[j]|0,(sy[j]|0)-2,3,3);}ctx.fill();},12);
// 5: BG + 1536 live 单趟 4px 尖（每尖=字的一个采样点，全靠粒子）
bench('5 BG + live 1536 尖 4x4 单趟',()=>{BG();ctx.fillStyle='rgba(226,240,255,.85)';ctx.beginPath();
  for(let i=0;i<1536;i++){const j=i*3%M;ctx.rect(sx[j]|0,sy[j]|0,4,4);}ctx.fill();},12);
// 6: 2400 针全部画到离屏再 blit（离屏小一半）
bench('6 离屏画2400针 + blit + BG',()=>{BG();bakeField(fg,0,0);ctx.drawImage(fc,130,220);},12);
// 7: BG + live 2400 单趟 但 h 固定 8
bench('7 BG + live 2400 单趟 h=8',()=>{BG();ctx.fillStyle='rgba(226,240,255,.8)';ctx.beginPath();
  for(let i=0;i<M;i++){ctx.rect(sx[i]|0,sy[i]|0,2,8);}ctx.fill();},12);
// 8: BG + live 2400 单趟 3x3 尖 only
bench('8 BG + live 2400 尖 3x3 单趟',()=>{BG();ctx.fillStyle='rgba(226,240,255,.85)';ctx.beginPath();
  for(let i=0;i<M;i++){ctx.rect(sx[i]|0,sy[i]|0,3,3);}ctx.fill();},12);
</script></body></html>
