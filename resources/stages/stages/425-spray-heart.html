<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>喷漆心跳</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#140826}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#140826}

  /* ---------- 天空 ---------- */
  #sky{
    position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(120vw 70vh at 50% 62%, rgba(255,150,80,.55) 0%, rgba(255,90,140,.22) 38%, rgba(0,0,0,0) 66%),
      linear-gradient(to bottom,
        #1B0733 0%, #33094A 16%, #6B1163 33%,
        #C01F72 46%, #FF3D8B 55%, #FF7A3C 62%,
        #FFB13E 68%, #FFD24A 72%, #FF9A3C 78%);
  }
  /* 浮云：横向拉丝 */
  #clouds{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.55}
  .cloud{
    position:absolute;height:2.2vh;border-radius:999px;
    background:linear-gradient(90deg,rgba(255,220,240,0),rgba(255,190,225,.85),rgba(255,220,240,0));
    filter:blur(1px);
  }
  .cloud.c1{width:46vw;left:4vw;top:26%}
  .cloud.c2{width:30vw;right:2vw;top:19%;height:1.5vh;opacity:.7}
  .cloud.c3{width:38vw;left:26vw;top:41%;height:1.2vh;opacity:.45}

  /* ---------- 落日圆盘（复古横向切条） ---------- */
  #sunGlow{
    position:absolute;left:50%;top:60%;width:120vh;height:120vh;z-index:1;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle, rgba(255,120,180,.55) 0%, rgba(255,120,90,.28) 34%, rgba(255,80,150,0) 62%);
    filter:blur(2px);
  }
  #sun{
    position:absolute;left:50%;top:60%;width:min(58vw,72vh);aspect-ratio:1/1;z-index:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:linear-gradient(to bottom,#FFF06B 0%,#FFD044 26%,#FFA63A 48%,#FF6A6A 66%,#FF2D95 100%);
    -webkit-mask-image:linear-gradient(to bottom,
      #000 0 44%, rgba(0,0,0,.96) 44% 50%, rgba(0,0,0,0) 50% 54%,
      rgba(0,0,0,.96) 54% 62%, rgba(0,0,0,0) 62% 67%,
      rgba(0,0,0,.96) 67% 76%, rgba(0,0,0,0) 76% 82%,
      rgba(0,0,0,.96) 82% 92%, rgba(0,0,0,0) 92% 100%);
    mask-image:linear-gradient(to bottom,
      #000 0 44%, rgba(0,0,0,.96) 44% 50%, rgba(0,0,0,0) 50% 54%,
      rgba(0,0,0,.96) 54% 62%, rgba(0,0,0,0) 62% 67%,
      rgba(0,0,0,.96) 67% 76%, rgba(0,0,0,0) 76% 82%,
      rgba(0,0,0,.96) 82% 92%, rgba(0,0,0,0) 92% 100%);
  }
  #sunEdge{
    position:absolute;left:50%;top:60%;width:min(58vw,72vh);aspect-ratio:1/1;z-index:1;
    transform:translate(-50%,-50%);border-radius:50%;
    box-shadow:0 0 0 .35vh rgba(255,235,120,.28), inset 0 0 8vh rgba(255,60,140,.45);
    mix-blend-mode:screen;pointer-events:none;
  }

  /* ---------- 海面 ---------- */
  #sea{
    position:absolute;left:0;right:0;top:60%;bottom:0;z-index:2;
    background:linear-gradient(to bottom,
      #FF8A45 0%, #F0496B 7%, #B32A70 18%, #7A1C6C 32%, #4A1150 52%, #26083A 74%, #180528 100%);
    overflow:hidden;
  }
  #seaGlow{
    position:absolute;left:50%;top:0;width:52vw;height:46%;transform:translateX(-50%);
    background:linear-gradient(to bottom, rgba(255,214,110,.9), rgba(255,120,90,.45) 45%, rgba(255,60,140,0) 100%);
    filter:blur(1.2vh);mix-blend-mode:screen;opacity:.85;
  }
  #seaBands{
    position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,.16) 0 1px, rgba(255,255,255,0) 1px 3.4%);
    opacity:.5;
  }
  #seaSheen{
    position:absolute;inset:0;
    background:repeating-linear-gradient(to right,
      rgba(255,180,80,.18) 0 2px, rgba(0,0,0,0) 2px 7px);
    opacity:.35;
  }
  #horizon{
    position:absolute;left:0;right:0;top:60%;height:1px;z-index:3;
    background:linear-gradient(90deg,rgba(255,230,150,0),rgba(255,240,180,.95) 50%,rgba(255,230,150,0));
    box-shadow:0 0 2.2vh rgba(255,200,120,.9);
  }

  /* ---------- 网点（halftone） ---------- */
  #halftone{
    position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.24;
    mix-blend-mode:overlay;
    background-image:radial-gradient(circle, rgba(20,4,40,.95) 1.1px, rgba(20,4,40,0) 1.7px);
    background-size:9px 9px;
    -webkit-mask-image:radial-gradient(78vw 62vh at 50% 58%, #000 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,0) 78%);
    mask-image:radial-gradient(78vw 62vh at 50% 58%, #000 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,0) 78%);
  }

  /* ---------- 棕榈剪影 ---------- */
  .palm{position:absolute;z-index:5;pointer-events:none;filter:drop-shadow(0 0 1.6vh rgba(255,60,150,.45))}
  .palm svg{display:block;width:100%;height:100%;overflow:visible}
  .palm-l{left:-7vw;top:-9vh;width:36vw;height:74vh;transform-origin:20% 90%}
  .palm-r{right:-9vw;top:-13vh;width:34vw;height:70vh;transform-origin:80% 90%;transform:scaleX(-1)}

  /* ---------- 热带花卉 / 叶子 ---------- */
  #flora{position:absolute;z-index:6;right:7vw;top:5vh;width:min(11vw,15vh);pointer-events:none;
    filter:drop-shadow(0 1vh 2vh rgba(50,0,50,.45))}
  #flora svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 50%}
  #leaf{position:absolute;z-index:5;left:2vw;bottom:1vh;width:min(13vw,20vh);pointer-events:none;opacity:.95;
    filter:drop-shadow(0 1vh 2vh rgba(30,0,40,.5))}
  #leaf svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 96%}

  /* ---------- 吉祥物：喷漆爱心 ---------- */
  #mascot{
    position:absolute;z-index:6;left:6vw;top:14vh;width:min(21vw,20vh);
    transform-origin:50% 70%;pointer-events:none;
    filter:drop-shadow(0 1.4vh 2.4vh rgba(60,0,60,.5));
  }
  #mascot svg{display:block;width:100%;height:auto;overflow:visible}

  /* ---------- 摩托 ---------- */
  #moto{
    position:absolute;z-index:7;right:-4vw;bottom:-2vh;width:min(50vw,78vh);
    pointer-events:none;transform-origin:50% 100%;
    filter:drop-shadow(0 0 2.6vh rgba(255,45,149,.5));
  }
  #moto svg{display:block;width:100%;height:auto;overflow:visible}

  /* ---------- 卡带收音机 ---------- */
  #boombox{
    position:absolute;z-index:7;left:5vw;bottom:3vh;width:min(24vw,34vh);
    pointer-events:none;transform-origin:50% 100%;
    filter:drop-shadow(0 1.2vh 2vh rgba(50,0,50,.55));
  }
  #boombox svg{display:block;width:100%;height:auto;overflow:visible}
  .reel{transform-box:fill-box;transform-origin:center}

  /* ---------- 涂鸦字标 ---------- */
  #tags{position:absolute;inset:0;z-index:8;pointer-events:none}
  .tag{
    position:absolute;
    font-family:"Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
    font-weight:900;letter-spacing:.02em;line-height:.86;
    color:rgba(255,240,255,0);
    -webkit-text-stroke:clamp(1px,.22vh,2.5px) rgba(255,250,240,.92);
    paint-order:stroke fill;
    text-shadow:0 .7vh 0 rgba(27,10,51,.55);
    white-space:nowrap;
  }
  #tagA{left:-1.2vw;top:33vh;font-size:clamp(28px,7.2vw,110px);transform:rotate(-90deg);transform-origin:0 0;opacity:.5}
  #tagB{right:-.5vw;top:30vh;font-size:clamp(26px,6.4vw,96px);transform:rotate(90deg);transform-origin:100% 0;opacity:.42}
  #tagC{left:50%;bottom:2.2vh;font-size:clamp(14px,2.6vw,38px);transform:translateX(-50%) rotate(-1.6deg);opacity:.6}
  .spark{position:absolute;width:clamp(10px,2vh,26px);height:clamp(10px,2vh,26px);opacity:.9}
  .spark svg{width:100%;height:100%;display:block}
  #sp1{left:20vw;top:9vh;transform:rotate(12deg)}
  #sp2{right:16vw;top:12vh;transform:rotate(-18deg)}
  #sp3{right:29vw;bottom:11vh;transform:rotate(24deg);opacity:.75}

  /* ---------- 暗角 / 胶片颗粒 ---------- */
  #vignette{
    position:absolute;inset:0;z-index:9;pointer-events:none;
    background:radial-gradient(120vw 96vh at 50% 56%, rgba(0,0,0,0) 40%, rgba(12,2,24,.42) 78%, rgba(8,1,18,.82) 100%);
  }
  #grain{
    position:absolute;inset:-50%;z-index:10;pointer-events:none;opacity:.04;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.9) 0 1px, rgba(0,0,0,0) 1px 3px),
                     repeating-linear-gradient(-40deg, rgba(255,190,230,.6) 0 1px, rgba(0,0,0,0) 1px 4px);
    background-size:5px 5px, 7px 7px;
    mix-blend-mode:overlay;
  }
  /* 鼓点白闪（每 beat 一次，强度由 JS 控制） */
  #flash{
    position:absolute;inset:0;z-index:11;pointer-events:none;opacity:0;
    background:radial-gradient(120vw 90vh at 50% 60%, rgba(255,240,180,.9), rgba(255,45,149,.35) 45%, rgba(255,45,149,0) 72%);
    mix-blend-mode:screen;
  }

  #lyrics{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;text-align:center;
    padding:clamp(10px,6.5vh,76px) 4vw 0;
    pointer-events:none;
  }
  .lyricsOutline{width:100%;display:flex;flex-direction:column;align-items:center}
  /* 宽屏/横屏：底部给摩托和卡带让位，字不压在轮子上 */
  @media (min-aspect-ratio: 92/100) and (min-height: 520px){
    #lyrics{padding-top:clamp(10px,5.2vh,64px);padding-bottom:clamp(90px,24vh,240px);justify-content:center}
  }
  #card{
    position:relative;
    max-width:min(92vw,1180px);
    padding:clamp(12px,2vh,24px) clamp(18px,3vw,44px) clamp(16px,2.6vh,32px);
    background:linear-gradient(163deg,#FFF8EA 0%,#FFEDD2 58%,#FFE3C0 100%);
    border:clamp(4px,.62vh,7px) solid #1B0A33;
    border-radius:clamp(4px,1vh,10px);
    transform:rotate(-1.15deg);
    box-shadow:
      0 clamp(5px,.85vh,10px) 0 #1B0A33,
      0 clamp(14px,2.6vh,30px) clamp(24px,5vh,58px) rgba(20,2,36,.55);
    opacity:0;visibility:hidden;
    transition:opacity .28s ease,transform .38s cubic-bezier(.2,1.5,.4,1),background .4s ease,visibility .28s;
  }
  #card.show{opacity:1;visibility:visible;animation:pop .34s cubic-bezier(.2,1.5,.42,1) both}
  @keyframes pop{
    0%{opacity:0;transform:rotate(-4.5deg) translateY(1.8vh) scale(.96)}
    60%{opacity:1;transform:rotate(.4deg) translateY(-.3vh) scale(1.012)}
    100%{opacity:1;transform:rotate(-1.15deg) translateY(0) scale(1)}
  }
  @media (prefers-reduced-motion: reduce){
    #card.show{animation:none}
  }
  #card.chorus{
    background:linear-gradient(160deg,#FF2D95 0%,#FF4A6E 52%,#FF8A3C 100%);
  }
  #card.chorus #lyric .c{color:rgba(255,246,228,.62)}
  #card.chorus #lyric .c.on{color:#FFF06B}
  #card.chorus #lyric.solid .c{color:rgba(255,246,228,.86)}
  #card.chorus #lyric.solid .c.on{color:#FFF06B}
  #card.chorus #prev,
  #card.chorus #prevPrev{color:#2A0730}
  #card.chorus #meta{color:#3B0A2A}
  #card.chorus #meta .bar,
  #card.chorus #meta .bar i{background:rgba(43,4,44,.28)}
  #card.chorus #meta .bar i{background:#FFF06B}

  #prev,
  #prevPrev{
    display:block;font-weight:800;color:#57206E;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-shadow:none;
  }
  #prevPrev{font-size:clamp(10px,1.35vh,15px);opacity:.42;margin-bottom:.55em}
  #prev{font-size:clamp(12px,1.85vh,21px);opacity:.72;margin-bottom:.7em}

  #lyricsMain{position:relative;display:block}
  #lyric{
    display:block;
    font-weight:900;
    font-size:calc(clamp(21px,min(3.5vw,4.4vh),58px) * var(--fit,1));
    line-height:1.17;
    letter-spacing:.015em;
    color:#1B0A33;
    word-break:break-word;
    overflow-wrap:anywhere;
    max-height:34vh;
    overflow:hidden;
  }
  #lyric .c{
    display:inline-block;
    color:rgba(27,10,51,.34);
    transition:color .16s ease,transform .16s ease;
    white-space:pre;
  }
  #lyric .c.on{
    color:#E5006F;
    transform:translateY(-.06em);
  }
  /* 无逐字时间：整句先全部可读，再按均分时间扫成洋红 */
  #lyric.solid .c{color:#241038}
  #lyric.solid .c.on{color:#E5006F}

  /* 喷漆下划线 */
  #scribble{
    position:absolute;left:-1.5%;right:-1.5%;bottom:calc(-1 * clamp(10px,1.9vh,22px));
    height:clamp(9px,1.9vh,22px);
    background:linear-gradient(90deg,#FF2D95 0%,#FF7A3C 55%,#FFD044 100%);
    border-radius:46% 54% 38% 62% / 62% 40% 60% 38%;
    transform:rotate(-.7deg) scaleX(var(--ink,0));
    transform-origin:0 50%;
    transition:transform .22s linear;
    filter:blur(.3px);
    opacity:.95;
  }
  #card.chorus #scribble{background:linear-gradient(90deg,#FFF06B,#2ED3E8 70%,#FFF06B)}
  .drip{
    position:absolute;top:calc(100% - 2px);width:clamp(4px,.7vh,8px);
    background:#FF2D95;border-radius:0 0 999px 999px;
  }
  .drip.d1{left:18%;height:clamp(10px,2.4vh,30px)}
  .drip.d2{left:52%;height:clamp(6px,1.5vh,18px)}
  .drip.d3{left:79%;height:clamp(4px,1vh,12px)}

  #meta{
    position:relative;display:flex;align-items:center;gap:.8em;
    margin-top:clamp(10px,2.2vh,26px);
    font-size:clamp(8px,1.15vh,12px);
    font-weight:800;letter-spacing:.22em;
    color:#4B1550;text-transform:uppercase;
    opacity:.85;
  }
  #meta .bar{
    position:relative;width:clamp(46px,11vw,150px);height:clamp(3px,.55vh,6px);
    background:rgba(46,6,40,.22);border-radius:99px;overflow:hidden;
  }
  #meta .bar i{
    position:absolute;inset:0;transform-origin:0 50%;
    background:#E5006F;border-radius:99px;
    transform:scaleX(0);
    transition:transform .25s linear;
  }
  #meta .dots{display:flex;gap:.42em}
  #meta .dot{
    width:clamp(4px,.62vh,7px);height:clamp(4px,.62vh,7px);border-radius:50%;
    background:rgba(46,6,40,.25);
  }
  #meta .dot.on{background:#E5006F}
  #meta .dot.cur{background:#1B0A33;transform:scale(1.35)}

  /* ---------- 空状态 ---------- */
  #empty{
    display:none;flex-direction:column;align-items:center;gap:.5em;
    padding:clamp(6px,1.4vh,16px) 0;
  }
  #card.empty #empty{display:flex}
  #card.empty #lyricsMain,
  #card.empty #meta,
  #card.empty #prev,
  #card.empty #prevPrev{display:none}
  #emptyTop{
    font-family:"Impact","Haettenschweiler","Arial Narrow",sans-serif;
    font-weight:900;letter-spacing:.06em;
    font-size:clamp(20px,3.4vw,44px);color:#E5006F;
    transform:rotate(-2deg);
    -webkit-text-stroke:clamp(1px,.2vh,2px) #1B0A33;
  }
  #emptySub{font-size:clamp(11px,1.7vh,17px);font-weight:800;color:#3A1560;letter-spacing:.08em}
  #emptyHearts{display:flex;gap:.7em;margin-top:.2em}
  #emptyHearts i{
    width:clamp(9px,1.6vh,16px);height:clamp(9px,1.6vh,16px);
    background:#FF2D95;display:block;
    transform:rotate(-45deg);
    clip-path:polygon(50% 100%,0 45%,0 20%,25% 0,50% 18%,75% 0,100% 20%,100% 45%);
  }
  #emptyHearts i:nth-child(2){background:#FFD044}
  #emptyHearts i:nth-child(3){background:#2ED3E8}

  /* ---------- 竖屏 / 窄屏 ---------- */
  @media (max-aspect-ratio: 92/100){
    #lyrics{padding-top:clamp(8px,5vh,52px)}
    #sun{width:min(80vw,54vh);top:50%}
    #sunEdge{width:min(80vw,54vh);top:50%}
    #sunGlow{width:150vw;height:150vw;top:50%}
    #sea,#horizon{top:50%}
    #mascot{width:min(30vw,14vh);left:4vw;top:36vh}
    #moto{width:min(74vw,40vh);right:-6vw;bottom:15vh}
    #boombox{width:min(30vw,16vh);left:4vw;bottom:3vh}
    #flora{right:3vw;top:4vh;width:min(15vw,9vh)}
    #leaf{width:min(20vw,13vh);bottom:0;left:-2vw}
    .palm-l{width:56vw;height:40vh;top:34vh;left:-16vw}
    .palm-r{width:52vw;height:38vh;top:33vh;right:-18vw}
    #tagA,#tagB{display:none}
    #tagC{font-size:clamp(11px,2.4vw,20px);bottom:1vh;opacity:.5}
    #lyric{font-size:calc(clamp(20px,min(6.4vw,3.4vh),40px) * var(--fit,1));max-height:26vh;line-height:1.14}
    #card{padding:clamp(10px,1.6vh,18px) clamp(14px,4vw,26px) clamp(14px,2vh,22px);max-width:94vw}
    #prev{font-size:clamp(11px,1.6vh,16px)}
    #prevPrev{display:none}
    #meta{margin-top:clamp(8px,1.6vh,16px);gap:.5em;font-size:9px;letter-spacing:.14em}
    #meta .bar{width:clamp(34px,16vw,90px)}
    #sp1,#sp2,#sp3{display:none}
    #halftone{background-size:7px 7px;opacity:.18}
  }

  @media (min-aspect-ratio: 19/10){
    #lyrics{padding-top:clamp(10px,6vh,70px)}
    #lyric{font-size:calc(clamp(24px,min(2.7vw,4.6vh),54px) * var(--fit,1))}
    #mascot{left:9vw;top:17vh;width:min(16vw,22vh)}
    #moto{width:min(42vw,74vh)}
    #boombox{width:min(19vw,32vh)}
  }

  /* 极矮的横屏（播放器条带/小窗） */
  @media (max-height: 460px){
    #lyrics{padding-top:4px}
    #prev,#prevPrev{display:none}
    #meta{margin-top:6px}
    #lyric{max-height:40vh;font-size:calc(clamp(16px,min(4vw,5.6vh),34px) * var(--fit,1))}
    #card{padding:8px 14px 12px}
    #mascot{width:min(15vw,20vh);top:10vh}
    .palm-l,.palm-r{opacity:.6}
  }

  @media (prefers-reduced-motion: reduce){
    #card,#lyric .c,#meta .bar i,#scribble{transition-duration:.12s}
    #grain{opacity:.02}
  }

</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="clouds">
    <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
  </div>
  <div id="sunGlow"></div>
  <div id="sun"></div>
  <div id="sunEdge"></div>
  <div id="sea">
    <div id="seaGlow"></div>
    <div id="seaBands"></div>
    <div id="seaSheen"></div>
  </div>
  <div id="horizon"></div>

  <div id="palmL" class="palm palm-l">
    <svg viewBox="0 0 300 640" fill="none" aria-hidden="true">
      <path d="M150 640 C146 520 148 430 156 350 C162 290 170 250 166 205" stroke="#1E0A38" stroke-width="26" stroke-linecap="round"/>
      <path d="M150 640 C146 520 148 430 156 350 C162 290 170 250 166 205" stroke="#2C0F4C" stroke-width="10" stroke-linecap="round" opacity=".9"/>
      <g stroke="#1E0A38" stroke-width="21" stroke-linecap="round" fill="none">
        <path d="M166 208 C120 168 62 158 6 176"/>
        <path d="M166 208 C126 150 74 120 20 112"/>
        <path d="M166 208 C150 148 140 92 138 40"/>
        <path d="M166 208 C196 148 240 118 292 116"/>
        <path d="M166 208 C214 170 262 156 300 164"/>
        <path d="M166 208 C186 246 214 276 252 296"/>
        <path d="M166 208 C138 248 116 282 92 320"/>
      </g>
      <g stroke="#3A1560" stroke-width="6" stroke-linecap="round" fill="none" opacity=".55">
        <path d="M166 208 C120 168 62 158 6 176"/>
        <path d="M166 208 C126 150 74 120 20 112"/>
        <path d="M166 208 C150 148 140 92 138 40"/>
        <path d="M166 208 C196 148 240 118 292 116"/>
      </g>

<script>
'use strict';

var state = { lines:[], idx:-1, t:0, playing:true, frames:0, js:0, err:'', text:'', rm:false };
var W = 1440, H = 900;

/* 自检口：必须在脚本最外层无条件赋值 */
window.__stage = function(){
  return {
    lines: state.lines.length,
    idx: state.idx,
    t: state.t,
    playing: !!state.playing,
    frames: state.frames,
    js: state.js,
    err: state.err,
    text: state.text,
    gl: false,
    rm: state.rm
  };
};

var readySent = false;
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({__c100:1, type:'ready'}, '*'); }
  catch (e) { console.error('[425] ready failed', e); }
}
setTimeout(sendReady, 150);
setTimeout(sendReady, 1500);

try {
  state.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
} catch (e) { console.error('[425] rm probe', e); }

var cardEl = document.getElementById('card');
var lyricEl = document.getElementById('lyric');
var prevEl = document.getElementById('prev');
var prevPrevEl = document.getElementById('prevPrev');
var scribbleEl = document.getElementById('scribble');
var metaFillEl = document.getElementById('metaFill');
var metaDotsEl = document.getElementById('metaDots');

var builtLine = -2;
var charEls = [];        // 当前句的逐字节点
var charTimes = [];      // 每个节点的「亮起时间」
var charOn = [];         // 每个节点当前是否已亮（避免重复写样式）
var litCount = 0;
var dots = [];
var dotEls = [];
var hasEmpty = false;

function normNum(v, d){ v = +v; return isFinite(v) ? v : d; }

function normalizeLines(raw){
  var out = [];
  if (!raw || typeof raw.length !== 'number') return out;
  var n = Math.min(raw.length, 2000);
  for (var i = 0; i < n; i++) {
    var L = raw[i];
    if (!L || typeof L !== 'object') continue;
    var text = (L.text == null) ? '' : String(L.text);
    if (!text.trim()) continue;
    var chars = null;
    if (L.chars && L.chars.length) {
      chars = [];
      var m = Math.min(L.chars.length, 400);
      for (var j = 0; j < m; j++) {
        var c = L.chars[j];
        if (!c) continue;
        chars.push({ c: (c.c == null ? '' : String(c.c)), t: normNum(c.t, 0) });
      }
      if (!chars.length) chars = null;
    }
    var dur = normNum(L.dur, 0);
    if (!(dur > 0)) dur = 0;
    out.push({ t: normNum(L.t, 0), dur: dur, text: text, chars: chars });
  }
  out.sort(function(a, b){ return a.t - b.t; });
  return out;
}

function findIdx(t){
  var a = state.lines;
  if (!a.length) return -1;
  if (!(t >= a[0].t)) return -1;
  var lo = 0, hi = a.length - 1, ans = 0, guard = 0;
  /* 固定上限的二分：绝不用收敛式步长 */
  while (lo <= hi && guard++ < 40) {
    var mid = (lo + hi) >> 1;
    if (a[mid].t <= t) { ans = mid; lo = mid + 1; }
    else { hi = mid - 1; }
  }
  return ans;
}

/* 估算每字亮起时间：优先 YRC 的 chars[].t，否则按句长均分 */
function buildCharTiming(L){
  var chars = L.chars;
  var starts = [];
  var i;
  if (chars && chars.length) {
    for (i = 0; i < chars.length; i++) {
      var ct = chars[i].t;
      if (!isFinite(ct) || ct < L.t - 0.001) ct = L.t;
      if (i > 0 && ct < starts[i - 1]) ct = starts[i - 1];
      starts.push(ct);
    }
    return starts;
  }
  var dur = L.dur > 0 ? L.dur : Math.max(1.6, Math.min(6.5, L.text.length * 0.22 + 1.1));
  var len = L.text.length || 1;
  for (i = 0; i < len; i++) starts.push(L.t + dur * (i / len));
  return starts;
}

function buildLine(){
  var a = state.lines;
  var i = state.idx;
  if (i < 0 || i >= a.length) {
    if (!hasEmpty) {
      lyricEl.textContent = '';
      if (prevEl) prevEl.textContent = '';
      if (prevPrevEl) prevPrevEl.textContent = '';
      dots = []; dotEls = []; metaDotsEl.textContent = '';
      lyricEl.style.setProperty('--fit', '1');
    }
    charEls = []; charTimes = []; charOn = []; litCount = 0;
    state.text = '';
    cardEl.classList.remove('show');
    return;
  }
  var L = a[i];
  state.text = L.text;
  if (prevEl) prevEl.textContent = (i > 0) ? a[i - 1].text : '';
  if (prevPrevEl) prevPrevEl.textContent = (i > 1) ? a[i - 2].text : '';

  /* 拆成逐字节点：只在句 id 变化时重建一次；超长句先截断，长度有固定上限 */
  lyricEl.textContent = '';
  lyricEl.style.setProperty('--fit', '1');
  var frag = document.createDocumentFragment();
  var rawLen = L.text.length;
  var firstCut = Math.min(rawLen, 96);
  var head = L.text.slice(0, firstCut);
  var tail = rawLen > firstCut ? L.text.slice(firstCut, Math.min(rawLen, firstCut + 260)) : '';
  var times = buildCharTiming(L);
  var n = Math.min(times.length, head.length, 96);
  for (var k = 0; k < n; k++) {
    var ch = head.charAt(k);
    var s = document.createElement('span');
    s.className = 'c';
    s.textContent = ch === ' ' ? '\u00a0' : ch;
    frag.appendChild(s);
  }
  if (n < head.length || tail) {
    /* chars 与正文长度不符 / 超长：余下部分作为一个整体节点 */
    var rest = document.createElement('span');
    rest.className = 'c';
    rest.textContent = head.slice(n) + tail;
    frag.appendChild(rest);
    times = times.concat([times.length ? times[times.length - 1] : L.t]);
  }
  lyricEl.appendChild(frag);
  charEls = Array.prototype.slice.call(lyricEl.children);
  charTimes = times.slice(0, charEls.length);
  charOn = new Array(charEls.length);
  litCount = 0;
  lyricEl.classList.toggle('solid', !L.chars);

  /* 小圆点：这一句在第几段（最多 12 个） */
  var total = Math.min(a.length, 12);
  var step = Math.max(1, Math.ceil(a.length / total));
  dots = [];
  for (var d2 = 0; d2 < total; d2++) dots.push(d2 * step);
  if (dotEls.length !== dots.length) {
    metaDotsEl.textContent = '';
    dotEls = [];
    for (var d3 = 0; d3 < dots.length; d3++) {
      var de = document.createElement('i');
      de.className = 'dot';
      metaDotsEl.appendChild(de);
      dotEls.push(de);
    }
  }
  var curDot = -1;
  for (var d4 = 0; d4 < dots.length; d4++) if (dots[d4] <= i) curDot = d4;
  for (var d5 = 0; d5 < dotEls.length; d5++) {
    dotEls[d5].className = 'dot' + (d5 < curDot ? ' on' : '') + (d5 === curDot ? ' cur' : '');
  }

  cardEl.classList.add('show');
  cardEl.classList.toggle('chorus', !!(L.chars && L.chars.length) && (i % 4 === 3));
  cardEl.classList.remove('empty');
  hasEmpty = false;
  nudgeHeight();
  paintChars(true);
}

/* 逐字点亮 + 进度条 */
function paintChars(force){
  var n = charEls.length;
  if (!n) { if (metaFillEl && metaFillEl.style) metaFillEl.style.transform = 'scaleX(0)'; return; }
  var t = state.t;
  if (!isFinite(t)) t = 0;
  var lit = 0;
  for (var i = 0; i < n; i++) {
    if (t >= charTimes[i]) lit = i + 1;
    else break;
  }
  if (!force && lit === litCount) { paintProgress(); return; }
  /* 从上次位置增量改，不重建 */
  for (var j = 0; j < n; j++) {
    var want = j < lit;
    if (charOn[j] !== want) {
      charOn[j] = want;
      if (charEls[j] && charEls[j].classList) charEls[j].classList.toggle('on', want);
    }
  }
  litCount = lit;
  paintProgress();
}

function paintProgress(){
  var a = state.lines;
  var L = a[state.idx];
  if (!L || !metaFillEl || !metaFillEl.style) return;
  var n = charEls.length;
  var p = n ? (litCount / n) : 0;
  if (!isFinite(p) || p < 0) p = 0;
  if (p > 1) p = 1;
  metaFillEl.style.transform = 'scaleX(' + p.toFixed(3) + ')';
  if (scribbleEl && scribbleEl.style) scribbleEl.style.setProperty('--ink', p.toFixed(3));
}

function nudgeHeight(){
  /* 超长句自动缩字号：固定次数，绝不 while */
  if (!lyricEl || !lyricEl.style) return;
  var avail = Math.max(120, (isFinite(H) && H > 0 ? H : 900) * 0.34);
  var fit = 1;
  lyricEl.style.setProperty('--fit', '1');
  for (var i = 0; i < 6; i++) {
    var h = lyricEl.scrollHeight || 0;
    if (!isFinite(h) || h <= avail + 1) break;
    fit = Math.max(0.5, fit * (avail / h) * 0.97);
    if (!isFinite(fit) || fit <= 0.5) { fit = 0.5; lyricEl.style.setProperty('--fit', '0.500'); break; }
    lyricEl.style.setProperty('--fit', fit.toFixed(3));
  }
}

function onInit(p){
  var pl = p || {};
  state.lines = normalizeLines(pl.lines);
  state.t = 0;
  state.playing = (typeof pl.playing === 'boolean') ? pl.playing : true;
  state.idx = findIdx(state.t);
  builtLine = -2;
  cardEl.classList.remove('empty');
  hasEmpty = false;
  if (!state.lines.length) {
    /* lines: [] = 这首歌真的没有歌词：体面空状态，不编造 */
    builtLine = -1;
    state.idx = -1;
    state.text = '';
    charEls = []; charOn = []; litCount = 0;
    lyricEl.textContent = '';
    if (prevEl) prevEl.textContent = '';
    if (prevPrevEl) prevPrevEl.textContent = '';
    metaDotsEl.textContent = '';
    dotEls = [];
    if (metaFillEl) metaFillEl.style.transform = 'scaleX(0)';
    cardEl.classList.add('empty', 'show');
    hasEmpty = true;
    return;
  }
  renderAll();
}

function renderAll(){
  var i = findIdx(state.t);
  if (i !== builtLine || state.idx !== i) {
    state.idx = i;
    buildLine();
    builtLine = i;
  }
  paintChars(false);
}

function onTick(p){
  if (!p) return;
  var t = +p.time;
  if (isFinite(t)) state.t = t;
  if (typeof p.playing === 'boolean') state.playing = p.playing;
  var i = findIdx(state.t);
  if (i !== state.idx) {
    state.idx = i;
    buildLine();
    builtLine = i;
  }
  paintChars(false);
}

window.addEventListener('message', function(ev){
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') onBeat(d.payload && d.payload.level);
    else if (d.type === 'live') onLive(d.payload);
  } catch (e) {
    state.err = String((e && e.message) || e);
    console.error('[425] message', d.type, e);
  }
});

/* ============ 动效引擎：beat / live 驱动 ============ */
var fx = {

var elFlora = document.getElementById('flora');
var elLeaf = document.getElementById('leaf');
var elHorizon = document.getElementById('horizon');
var elCard = document.getElementById('card');
var reels = document.querySelectorAll('.reel');
var REELN = Math.min(reels.length, 8);

var sunY = 0;          // 太阳缓慢下沉的累积量
var motoBob = 0;

function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

/* 低频冲击 → 整个场景的"跳" */
function onBeat(level){
  fx.beat = clamp01(normNum(level, 0));
  fx.beatN++;
  if (state.rm) fx.beat *= 0.35;
}

function onLive(p){
  if (!p) return;
  fx.bpm = normNum(p.bpm, fx.bpm);
  fx.level = clamp01(normNum(p.level, fx.level));
  fx.bass = clamp01(normNum(p.bass, fx.bass));
  fx.mid = clamp01(normNum(p.mid, fx.mid));
  fx.treble = clamp01(normNum(p.treble, fx.treble));
  if (typeof p.playing === 'boolean') state.playing = p.playing;
}

/* 每帧：把能量写进 CSS 变换（只写 transform/opacity，不碰布局） */
function updateFx(dt, now){
  var rm = state.rm;
  var speed = rm ? 0.35 : 1;
  if (!isFinite(dt) || dt < 0) dt = 0.016;

  /* beat 自然衰减（按时间归一，掉帧也不乱） */
  fx.beat *= Math.pow(rm ? 0.35 : 0.12, dt);
  if (!isFinite(fx.beat) || fx.beat < 0.002) fx.beat = 0;

  var playing = state.playing ? 1 : 0;
  fx.groove += dt * (0.55 + fx.bass * 1.6 + fx.beat * 1.2) * speed * playing;
  if (!isFinite(fx.groove)) fx.groove = 0;
  fx.pulse = Math.sin(fx.groove * 2.1);

  var e = fx.beat * 0.6 + fx.bass * 0.4 + fx.level * 0.15;
  if (!isFinite(e)) e = 0;
  /* 隐藏时不做无谓的样式写入 */
  if (document.hidden) return;

  /* 所有写入一律走这里：NaN/Infinity 归零，缺失元素直接跳过 */
  var f2 = function(v){ return (isFinite(v) ? v : 0).toFixed(2); };
  var f3 = function(v){ return (isFinite(v) ? v : 0).toFixed(3); };
  var f4 = function(v){ return (isFinite(v) ? v : 0).toFixed(4); };
  var setT = function(el, v){ if (el && el.style) el.style.transform = v; };
  var setO = function(el, v){ if (el && el.style) el.style.opacity = v; };

  /* 太阳：极缓下沉 + 随低频微涨 */
  sunY = Math.min(sunY + dt * 0.55 * speed * (playing || 1), 26);
  if (!isFinite(sunY)) sunY = 0;
  var sy = -(sunY * 0.12) + fx.pulse * 0.4;

  try {
    setT(elSun, 'translate(-50%,-50%) translateY(' + f2(sy) + 'vh) scale(' + f4(1 + e * 0.035) + ')');
    setO(elSunGlow, f3(0.55 + e * 0.5 + fx.pulse * 0.06));
    setT(elSunGlow, 'translate(-50%,-50%) scale(' + f4(1 + e * 0.06) + ')');
    setO(elSunEdge, f3(0.35 + e * 0.45));
    setO(elSeaGlow, f3(0.62 + e * 0.5));
    if (elSeaBands && elSeaBands.style) elSeaBands.style.backgroundPositionY = (fx.groove * 12).toFixed(1) + 'px';
    setO(elHorizon, f3(0.55 + e * 0.5));

    /* 摩托：Dembow 弹跳 —— 低频上颠，落地压扁 */
    motoBob = Math.sin(fx.groove * 2.4) * (0.8 + fx.bass * 2.2) * speed;
    var squash = 1 - fx.beat * 0.045;
    setT(elMoto,
      'translateY(' + f2(-motoBob) + 'vh) rotate(' + f2(Math.sin(fx.groove * 1.2) * 0.7) + 'deg) scale(' +
      f4(1 + fx.beat * 0.035) + ',' + f4(squash) + ')');

    /* 吉祥物：心跳，鼓点时放大 */
    var hb = 1 + fx.beat * 0.14 + fx.pulse * 0.02;
    setT(elMascot, 'rotate(' + f2(Math.sin(fx.groove * 0.9) * 3.2) + 'deg) scale(' + f4(hb) + ')');

    /* 卡带收音机：左右轻摇，磁带走带 */
    setT(elBoom, 'rotate(' + f2(Math.sin(fx.groove * 1.7) * 1.4) + 'deg) translateY(' + f2(fx.pulse * 0.35) + 'vh)');
    var spd = (fx.treble * 260 + fx.level * 90) * (state.playing ? 1 : 0.12);
    var ang = f2((now * 0.001 * spd) % 360);
    for (var r = 0; r < REELN; r++) {
      if (reels[r] && reels[r].style) reels[r].style.transform = 'rotate(' + ang + 'deg)';
    }

    /* 棕榈：风摆 */
    var sway = Math.sin(fx.groove * 0.62) * (1.1 + fx.mid * 2.2);
    setT(elPalmL, 'rotate(' + f2(sway) + 'deg)');
    setT(elPalmR, 'scaleX(-1) rotate(' + f2(sway * 0.8) + 'deg)');
    setT(elFlora, 'rotate(' + f2(sway * 0.5 + fx.beat * 2.5) + 'deg) scale(' + f3(1 + fx.beat * 0.07) + ')');
    setT(elLeaf, 'rotate(' + f2(sway * -0.9) + 'deg) scale(' + f3(1 + fx.beat * 0.04) + ')');

    /* 鼓点白闪：命中瞬间最亮，迅速回落 */
    setO(elFlash, f3((rm ? 0.05 : 0.11) * fx.beat * (0.6 + fx.treble * 0.8)));

    /* 涂鸦字标：跟着能量抖 */
    var jit = (fx.beat * 1.6 + fx.treble * 1.0) * speed;
    setT(elTagA, 'rotate(-90deg) translateY(' + f2(jit * 0.4) + 'px) scale(' + f3(1 + fx.beat * 0.04) + ')');
    setT(elTagB, 'rotate(90deg) translateY(' + f2(-jit * 0.4) + 'px) scale(' + f3(1 + fx.beat * 0.04) + ')');
    setT(elTagC, 'translateX(-50%) rotate(-1.6deg) translateY(' + f2(jit * 0.3) + 'px)');

    setO(elGrain, f3(0.035 + fx.treble * 0.045));

    /* 卡片随节奏轻微错位，像贴纸被声波顶到 */
    if (elCard && elCard.classList && elCard.classList.contains('show')) {
      setT(elCard,
        'rotate(' + f3(-1.15 + fx.beat * 0.55 + fx.pulse * 0.12) + 'deg) translateY(' + f2(-fx.beat * 0.45) + 'vh)');
    }
  } catch (err) {
    state.err = String((err && err.message) || err);
    console.error('[425] fx', err);
  }
}

/* ============ 自适应 ============ */
var stageEl = document.getElementById('stage');
var elLyrics = document.getElementById('lyrics');

function measure(){
  var w = (stageEl && stageEl.clientWidth) || window.innerWidth || 0;
  var h = (stageEl && stageEl.clientHeight) || window.innerHeight || 0;
  if (!isFinite(w) || w <= 0) w = 1440;
  if (!isFinite(h) || h <= 0) h = 900;
  W = Math.min(Math.max(w, 200), 8000);
  H = Math.min(Math.max(h, 200), 8000);
  var ar = W / H;
  var portrait = ar < 0.92;
  var wide = ar > 1.9;
  document.body.classList.toggle('is-portrait', portrait);
  document.body.classList.toggle('is-wide', wide);
  document.body.classList.toggle('is-phone', W < 560);
  if (state.idx >= 0 && charEls.length) nudgeHeight();
}

var rsz = 0;
function onResize(){
  if (rsz) return;
  rsz = requestAnimationFrame(function(){
    rsz = 0;
    try {
      measure();
      if (state.idx >= 0 && charEls.length) nudgeHeight();
    } catch (e) {
      state.err = String((e && e.message) || e);
      console.error('[425] resize', e);
    }
  });
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
measure();

/* 极少数环境（无 ResizeObserver 兜底 / 首次布局为 0）再测一次，保证 H 不是占位值 */
setTimeout(function(){
  try { measure(); } catch (e) { console.error('[425] late measure', e); }
}, 400);

var lastT = 0;
function frame(now){
  if (!readySent) sendReady();
  state.frames++;
  var t0 = performance.now();
  var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0.016;
  lastT = now;
  if (!isFinite(dt) || dt < 0) dt = 0.016;
  try {
    var rm = state.rm;
    if (fx.bass > 0.55 || fx.level > 0.6) {
      /* 没有 beat 消息时也有底噪律动 */
      fx.beat = Math.max(fx.beat, rm ? 0 : Math.pow(fx.bass, 2.4) * 0.22);
    }
    var i = findIdx(state.t);
    if (i !== state.idx) {
      state.idx = i;
      buildLine();
      builtLine = i;
    } else if (charEls.length) {
      paintChars(false);
    }
    updateFx(dt, now);
  } catch (e) {
    state.err = String((e && e.message) || e);
    console.error('[425] frame', e);
  }
  state.js = performance.now() - t0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
