<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>350 · CYBER-GEISHA</title>
<style>
  :root{
    --accent: 120, 220, 255;
    --ink:#04060b;
    --paper:#f6f1e7;
    --gold:#e3b96b;
    --lh: clamp(20px, 3vw, 42px);
    --sans:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper)}
  body{font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:fixed;inset:0;overflow:hidden}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* ---------- stage wash / grid / CRT ---------- */
  #bgWash{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 78% at 50% 16%, rgba(var(--accent),.20), rgba(var(--accent),0) 60%),
      radial-gradient(95% 42% at 50% 108%, rgba(3,8,16,.92), rgba(3,8,16,0) 70%);}
  #bgGrid{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(0deg, rgba(150,214,255,.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(150,214,255,.075) 1px, transparent 1px);
    background-size:100% 8vh, 8vh 100%;
    -webkit-mask-image:radial-gradient(130% 100% at 50% 46%, #000 22%, transparent 76%);
            mask-image:radial-gradient(130% 100% at 50% 46%, #000 22%, transparent 76%)}
  #scan{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.55;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 46%, rgba(0,0,0,.62) 100%)}

  /* ---------- the goddess ---------- */
  #figure{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);
    height:min(103vh,138vw);aspect-ratio:1000/1400;z-index:3;pointer-events:none}
  #figure svg{width:100%;height:100%;display:block;overflow:visible}
  #figure::before{content:"";position:absolute;inset:-6% -14% 0;pointer-events:none;
    background:radial-gradient(58% 46% at 50% 36%, rgba(4,7,13,.46), rgba(4,7,13,0) 72%)}
  .as{stroke:rgb(var(--accent))}
  .af{fill:rgb(var(--accent))}
  #haloRing1,#haloRing2{transform-box:fill-box;transform-origin:center;
    animation:spin 46s linear infinite}
  #haloRing2{animation-duration:29s;animation-direction:reverse}
  #shards g.sh{animation:drift 7s ease-in-out infinite alternate}
  #shards g.sh:nth-child(2){animation-duration:9s;animation-delay:-2s}
  #shards g.sh:nth-child(3){animation-duration:6s;animation-delay:-4s}
  #shards g.sh:nth-child(4){animation-duration:11s;animation-delay:-1s}
  #shards g.sh:nth-child(5){animation-duration:8s;animation-delay:-5s}
  #shards g.sh:nth-child(6){animation-duration:10s;animation-delay:-3s}
  #shards g.sh:nth-child(7){animation-duration:7.5s;animation-delay:-6s}
  #shards g.sh:nth-child(8){animation-duration:12s;animation-delay:-2.5s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{
    0%{transform:translate(0,0) rotate(0deg)}
    100%{transform:translate(0,-14px) rotate(4deg)}
  }

  /* ---------- digital nameplate ---------- */
  #plate{position:absolute;left:50%;bottom:max(4.2vh,16px);transform:translateX(-50%);
    width:min(92vw,1020px);z-index:6}
  .plate-frame{padding:1px;
    background:linear-gradient(180deg, rgba(227,185,107,.62), rgba(227,185,107,.14) 38%, rgba(var(--accent),.38));
    clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),
      calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
  .plate-inner{position:relative;
    background:linear-gradient(180deg, rgba(7,11,18,.80), rgba(3,5,10,.92));
    clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),
      calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
    padding:clamp(12px,1.9vh,22px) clamp(16px,2.6vw,36px) clamp(10px,1.6vh,18px)}
  .plate-inner::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent 4%,rgba(var(--accent),.85),rgba(227,185,107,.9) 62%,transparent 96%);
    transition:box-shadow .34s ease}
  .plate-inner.flash::before{box-shadow:0 0 26px rgba(var(--accent),.85),0 0 8px rgba(227,185,107,.85)}
  .plate-inner::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 140% at 50% 120%, rgba(var(--accent),.10), transparent 62%)}
  .corner{position:absolute;width:9px;height:9px;border:1px solid rgba(227,185,107,.75);opacity:.9}
  .corner.c1{left:11px;top:11px;border-right:0;border-bottom:0}
  .corner.c2{right:11px;top:11px;border-left:0;border-bottom:0}
  .corner.c3{left:11px;bottom:11px;border-right:0;border-top:0}
  .corner.c4{right:11px;bottom:11px;border-left:0;border-top:0}

  .plate-head,.plate-foot{position:relative;display:flex;justify-content:space-between;
    align-items:center;gap:12px;font-family:var(--sans);font-size:9.5px;line-height:1;
    letter-spacing:.32em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .plate-head{color:rgba(227,185,107,.82);margin-bottom:clamp(6px,1.2vh,14px)}
  .plate-foot{color:rgba(214,230,246,.46);margin-top:clamp(6px,1.1vh,12px);letter-spacing:.2em}
  .plate-head span,.plate-foot span{overflow:hidden;text-overflow:ellipsis}
  .foot-l{display:flex;align-items:center;gap:8px;min-width:0}
  .foot-l em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #cover{display:none;width:20px;height:20px;flex:0 0 auto;object-fit:cover;
    border:1px solid rgba(227,185,107,.45);filter:grayscale(.25) contrast(1.1)}
  .dot{display:inline-block;width:5px;height:5px;margin-right:8px;vertical-align:1px;
    background:rgba(var(--accent),.95);box-shadow:0 0 8px rgba(var(--accent),.9);
    animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  #lineWrap{position:relative;text-align:center;font-size:var(--lh);line-height:1.46;
    letter-spacing:.055em;min-height:1.46em;word-break:break-word;
    color:rgba(214,232,248,.30);transition:min-height .3s ease}
  #lineWrap .ch{display:inline-block;white-space:pre;color:rgba(212,230,248,.42);
    transition:color .24s ease, text-shadow .34s ease, transform .34s ease, opacity .3s ease}
  #lineWrap .ch.on{color:#fffaf0;
    text-shadow:0 0 16px rgba(var(--accent),.5), 0 0 3px rgba(255,255,255,.5);
    transform:translateY(-.02em)}
  #lineWrap .ch.sp{min-width:.34em}
  #lineWrap.empty{font-family:var(--sans);font-size:clamp(13px,1.5vw,18px);
    letter-spacing:.42em;color:rgba(227,185,107,.6);padding:1.1em 0 .7em}
  #lineWrap.rest{font-family:var(--sans);font-size:clamp(12px,1.5vw,17px);
    letter-spacing:.95em;color:rgba(227,185,107,.55);padding:.5em 0 .3em}
  .rail{position:relative;height:2px;margin-top:clamp(8px,1.3vh,14px);
    background:rgba(255,255,255,.08);overflow:hidden}
  .rail i{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg, rgba(var(--accent),.9), rgba(227,185,107,.95));
    box-shadow:0 0 10px rgba(var(--accent),.7);transition:width .2s linear}

  /* ---------- HUD ---------- */
  #hud{position:absolute;z-index:7;pointer-events:none;display:flex;justify-content:space-between;
    align-items:flex-start;gap:18px;
    top:clamp(12px,2.4vh,26px);left:clamp(14px,2.4vw,32px);right:clamp(14px,2.4vw,32px);
    font-family:var(--sans);font-size:10px;line-height:1.6;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(220,234,248,.52)}
  #hud .tag{display:block;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hud .tag b{font-weight:500;color:rgba(227,185,107,.95);letter-spacing:.3em}
  #hud .right{text-align:right;color:rgba(226,238,250,.46)}
  #hud .right .song{display:block;max-width:44vw;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:rgba(246,241,231,.82);letter-spacing:.22em;font-size:11px}
  #hud .right .artists{display:block;max-width:44vw;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;letter-spacing:.26em;font-size:9px;color:rgba(214,230,246,.42)}
  #topGlow{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:2;
    width:min(120vw,1500px);height:40vh;pointer-events:none;
    background:radial-gradient(50% 100% at 50% 0%, rgba(var(--accent),.16), transparent 70%)}

  /* ---------- couture frame ---------- */
  #frame{position:absolute;inset:clamp(10px,1.8vh,24px) clamp(10px,1.6vw,26px);z-index:5;pointer-events:none}
  .fc{position:absolute;width:24px;height:24px;border:1px solid rgba(227,185,107,.45)}
  .f1{left:0;top:0;border-right:0;border-bottom:0}
  .f2{right:0;top:0;border-left:0;border-bottom:0}
  .f3{left:0;bottom:0;border-right:0;border-top:0}
  .f4{right:0;bottom:0;border-left:0;border-top:0}
  .flabel{position:absolute;left:0;top:50%;transform:translate(-50%,-50%) rotate(180deg);
    writing-mode:vertical-rl;font-family:var(--sans);font-size:8.5px;line-height:1;
    letter-spacing:.44em;text-transform:uppercase;color:rgba(227,185,107,.44);white-space:nowrap}

  @media (max-width:620px){
    #figure{height:min(92vh,148vw);bottom:-1vh}
    #plate{bottom:max(3.2vh,12px);width:94vw}
    .plate-head,.plate-foot{font-size:8px;letter-spacing:.24em}
    #hud{font-size:8.5px;letter-spacing:.22em}
    #hud .right .song{font-size:9.5px}
    .flabel{display:none}
    .fc{width:16px;height:16px}
  }
  @media (prefers-reduced-motion:reduce){
    #haloRing1,#haloRing2,#shards g.sh{animation:none}
    .dot{animation:none;opacity:.9}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="bgWash"></div>
  <div id="bgGrid"></div>
  <div id="topGlow"></div>

  <div id="figure">
    <svg viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>
        <linearGradient id="porc" x1="0.22" y1="0" x2="0.8" y2="1">
          <stop offset="0" stop-color="#fffdf8"/>
          <stop offset=".40" stop-color="#f6eee2"/>
          <stop offset=".74" stop-color="#ded2c3"/>
          <stop offset="1" stop-color="#bcad9c"/>
        </linearGradient>
        <linearGradient id="porcSide" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8d7c66" stop-opacity=".55"/>
          <stop offset=".26" stop-color="#b6a692" stop-opacity=".16"/>
          <stop offset=".5" stop-color="#fffaf2" stop-opacity="0"/>
          <stop offset=".76" stop-color="#a08d76" stop-opacity=".20"/>
          <stop offset="1" stop-color="#7d6b56" stop-opacity=".6"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff2ca"/>
          <stop offset=".26" stop-color="#eac476"/>
          <stop offset=".52" stop-color="#a97a30"/>
          <stop offset=".76" stop-color="#f8e0a4"/>
          <stop offset="1" stop-color="#7f5519"/>
        </linearGradient>
        <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffeab4"/>
          <stop offset=".42" stop-color="#d9a94f"/>
          <stop offset=".72" stop-color="#946724"/>
          <stop offset="1" stop-color="#6d4a16"/>
        </linearGradient>
        <linearGradient id="hair" x1=".18" y1="0" x2=".88" y2="1">
          <stop offset="0" stop-color="#2a3346"/>
          <stop offset=".34" stop-color="#101725"/>
          <stop offset="1" stop-color="#04060c"/>
        </linearGradient>
        <linearGradient id="hairSheen" x1="0" y1="0" x2="1" y2=".5">
          <stop offset="0" stop-color="#93a8c8" stop-opacity="0"/>
          <stop offset=".42" stop-color="#b8cbe4" stop-opacity=".26"/>
          <stop offset="1" stop-color="#93a8c8" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f0f7ff"/>
          <stop offset=".34" stop-color="#93a6bd"/>
          <stop offset=".58" stop-color="#4f5d73"/>
          <stop offset=".82" stop-color="#c9d8e8"/>
          <stop offset="1" stop-color="#67768c"/>
        </linearGradient>
        <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e91b45"/>
          <stop offset=".5" stop-color="#b30f31"/>
          <stop offset="1" stop-color="#650517"/>
        </linearGradient>
        <radialGradient id="blush" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#e9455f" stop-opacity=".5"/>
          <stop offset=".55" stop-color="#e9455f" stop-opacity=".18"/>
          <stop offset="1" stop-color="#e9455f" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="haloGlow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#8fe4ff" stop-opacity=".26"/>
          <stop offset=".52" stop-color="#4fb8f0" stop-opacity=".10"/>
          <stop offset="1" stop-color="#0b2f4a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="lensGlow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#eafcff" stop-opacity=".95"/>
          <stop offset=".42" stop-color="#68d6ff" stop-opacity=".7"/>
          <stop offset="1" stop-color="#0b3a58" stop-opacity="0"/>
        </radialGradient>
        <g id="tpl">
          <ellipse id="tplRing" cx="0" cy="0" rx="1" ry="1" fill="none"
            stroke="url(#goldV)" stroke-width="6" stroke-opacity=".9"/>
          <path id="tplArc" d="M0 0" fill="none" stroke="#fff4d2" stroke-width="1.5" stroke-opacity=".3"/>
          <path id="tplStrut" d="M0 0" fill="none" stroke="#e3b96b" stroke-width="2" stroke-opacity=".22"/>
        </g>
      </defs>

      <!-- halo -->
      <g id="halo">
        <circle cx="500" cy="330" r="356" fill="url(#haloGlow)"/>
        <circle id="haloRing1" cx="500" cy="330" r="330" fill="none" stroke="url(#gold)"
          stroke-width="1.2" stroke-dasharray="2 13" stroke-opacity=".6"/>
        <circle id="haloRing2" cx="500" cy="330" r="292" fill="none"
          class="as" stroke-width="1" stroke-dasharray="128 24 5 24" stroke-opacity=".5"/>
        <circle cx="500" cy="330" r="312" fill="none" stroke="url(#gold)" stroke-width="10"
          stroke-opacity=".10"/>
        <path d="M500 8 L512 42 L500 62 L488 42 Z" fill="url(#gold)" fill-opacity=".55"/>
        <path d="M180 470 L206 496 L196 520 L168 500 Z" fill="url(#gold)" fill-opacity=".35"/>
        <path d="M822 470 L796 496 L806 520 L834 500 Z" fill="url(#gold)" fill-opacity=".35"/>
      </g>

      <!-- shoulders / bust -->
      <path d="M120 1400 C150 1178 246 1038 366 978 L634 978 C754 1038 850 1178 880 1400 Z"
        fill="#060a13" stroke="#e3b96b" stroke-opacity=".22" stroke-width="1.4"/>
      <path d="M96 1400 L212 1142 L322 1400 Z" fill="#0b1220"
        stroke="#e3b96b" stroke-opacity=".42" stroke-width="1.6"/>
      <path d="M904 1400 L788 1142 L678 1400 Z" fill="#0b1220"
        stroke="#e3b96b" stroke-opacity=".42" stroke-width="1.6"/>
      <path d="M212 1142 L322 1400" class="as" stroke-opacity=".35" stroke-width="1"/>
      <path d="M788 1142 L678 1400" class="as" stroke-opacity=".35" stroke-width="1"/>

      <!-- hair mass -->
      <path d="M500 44 C 668 44 812 158 842 330 C 870 476 852 660 786 774 L 690 754
               C 636 646 604 522 590 404 L 500 376 L 410 404
               C 396 522 364 646 310 754 L 214 774 C 148 660 130 476 158 330
               C 188 158 332 44 500 44 Z" fill="url(#hair)"/>
      <path d="M500 44 C 668 44 812 158 842 330 C 870 476 852 660 786 774 L 690 754
               C 636 646 604 522 590 404 L 500 376 L 410 404
               C 396 522 364 646 310 754 L 214 774 C 148 660 130 476 158 330
               C 188 158 332 44 500 44 Z" fill="url(#hairSheen)"/>
      <g fill="none" stroke="#9db4d2" stroke-opacity=".13" stroke-width="2.2">
        <path d="M430 200 C 330 300 250 480 212 700"/>
        <path d="M468 182 C 392 300 332 502 302 724"/>
        <path d="M570 200 C 670 300 750 480 788 700"/>
        <path d="M532 182 C 608 300 668 502 698 724"/>
      </g>

      <!-- neck column -->
      <path d="M418 592 L582 592 L606 1400 L394 1400 Z" fill="#080d17"/>
      <path d="M438 596 L562 596 L578 1400 L422 1400 Z" fill="url(#porc)" fill-opacity=".42"/>

      <!-- tribal metal neck rings (built at runtime) -->
      <g id="rings"></g>

      <!-- face -->
      <g id="face">
        <path d="M500 150 C546 150 590 164 626 196 C660 228 674 292 676 352
                 C678 412 664 476 632 528 C600 578 552 608 500 616
                 C448 608 400 578 368 528 C336 476 322 412 324 352
                 C326 292 340 228 374 196 C410 164 454 150 500 150 Z"
          fill="url(#porc)"/>
        <path d="M500 150 C546 150 590 164 626 196 C660 228 674 292 676 352
                 C678 412 664 476 632 528 C600 578 552 608 500 616
                 C448 608 400 578 368 528 C336 476 322 412 324 352
                 C326 292 340 228 374 196 C410 164 454 150 500 150 Z"
          fill="url(#porcSide)"/>
        <ellipse cx="500" cy="292" rx="92" ry="62" fill="#ffffff" fill-opacity=".16"/>

        <!-- hairline (oshiroi edge) -->
        <path d="M326 344 C340 232 400 164 500 152 C600 164 660 232 674 344
                 C640 300 596 274 552 286 C526 294 512 276 500 262
                 C488 276 474 294 448 286 C404 274 360 300 326 344 Z" fill="url(#hair)"/>
        <path d="M326 344 C360 300 404 274 448 286 C474 294 488 276 500 262
                 C512 276 526 294 552 286 C596 274 640 300 674 344"
          fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity=".8"/>

        <!-- brows -->
        <path d="M360 330 Q412 306 464 326" fill="none" stroke="#0a0d16" stroke-width="6" stroke-linecap="round"/>
        <path d="M640 330 Q588 306 536 326" fill="none" stroke="#0a0d16" stroke-width="6" stroke-linecap="round"/>
        <path d="M360 330 Q412 306 464 326" fill="none" class="as"
          stroke-width="1.2" stroke-opacity=".5" stroke-linecap="round"/>
        <path d="M640 330 Q588 306 536 326" fill="none" class="as"
          stroke-width="1.2" stroke-opacity=".5" stroke-linecap="round"/>

        <!-- left eye: human, geisha lined -->
        <path d="M350 384 C374 352 448 348 472 380 C448 406 374 412 350 384 Z" fill="#0a0d15"/>
        <path d="M350 384 C374 352 448 348 472 380" fill="none" stroke="#05070d" stroke-width="7" stroke-linecap="round"/>
        <circle cx="412" cy="382" r="17" fill="#111a2b"/>
        <circle cx="412" cy="382" r="17" fill="none" class="as" stroke-opacity=".8" stroke-width="1.4"/>
        <circle cx="406" cy="377" r="4.4" fill="#eafcff"/>
        <path d="M472 380 L490 390" stroke="#d31a3f" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M350 384 L334 392" stroke="#d31a3f" stroke-width="3" stroke-linecap="round"/>

        <!-- right eye: cyber lens -->
        <g id="lens">
          <circle cx="588" cy="382" r="52" fill="#070c15" stroke="url(#chrome)" stroke-width="5"/>
          <circle cx="588" cy="382" r="44" fill="url(#lensGlow)"/>
          <circle cx="588" cy="382" r="44" fill="none" class="as"
            stroke-width="1.4" stroke-opacity=".85"/>
          <circle cx="588" cy="382" r="27" fill="none" stroke="#eafcff" stroke-opacity=".55" stroke-width="1"/>
          <circle cx="588" cy="382" r="10" fill="#eafcff" fill-opacity=".9"/>
          <path d="M536 382 H640 M588 330 V434" class="as" stroke-opacity=".45" stroke-width="1"/>
          <circle cx="552" cy="352" r="3" fill="#e3b96b"/>
          <circle cx="624" cy="352" r="3" fill="#e3b96b"/>
          <circle cx="624" cy="412" r="3" fill="#e3b96b"/>
        </g>

        <!-- nose -->
        <path d="M500 402 L492 456 Q500 462 508 456" fill="none" stroke="#8a7864"
          stroke-width="2.4" stroke-opacity=".55" stroke-linecap="round"/>
        <path d="M486 452 Q500 460 514 452" fill="none" stroke="#6d5c4a" stroke-width="1.6" stroke-opacity=".5"/>

        <!-- blush -->
        <ellipse cx="392" cy="438" rx="58" ry="34" fill="url(#blush)"/>
        <ellipse cx="608" cy="438" rx="58" ry="34" fill="url(#blush)"/>

        <!-- lips -->
        <path d="M462 508 Q482 494 500 506 Q518 494 538 508 Q520 536 500 540 Q480 536 462 508 Z"
          fill="url(#lip)"/>
        <path d="M462 508 Q482 500 500 506 Q518 500 538 508" fill="none" stroke="#ff5f78" stroke-width="1.6" stroke-opacity=".6"/>
        <path d="M500 506 L500 538" stroke="#4d0411" stroke-width="1.2" stroke-opacity=".6"/>

        <!-- jaw chrome seam + vents -->
        <path d="M432 588 Q500 620 568 588" fill="none" stroke="url(#chrome)" stroke-width="5" stroke-opacity=".85"/>
        <path d="M424 566 L404 548 M446 576 L430 560" stroke="#1a2130" stroke-width="2" stroke-opacity=".5"/>
        <path d="M576 566 L596 548 M554 576 L570 560" stroke="#1a2130" stroke-width="2" stroke-opacity=".5"/>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('gl');
  var wrap = $('lineWrap');

  var S = {
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, err: '', duration: 0,
    song: null, accent: [120,220,255], reduced: false, gl: false,
    spans: [], active: -1, curKey: null
  };
  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
  }

  var W = window.innerWidth || 1440, H = window.innerHeight || 900;
  var dpr = 1;

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = Math.max(240, Math.round(w));
    H = Math.max(240, Math.round(h));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (W < 700) dpr = Math.min(dpr, 1.6);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    if (gl) gl.viewport(0, 0, cv.width, cv.height);
    S.vw = W;
    S.vh = H;
    if (S.curKey) fitLine();
  }
  resize();
  window.addEventListener('resize', resize);

  /* ============================ accent ============================ */
  function applyAccent(){
    var c = S.accent;
    try {
      document.documentElement.style.setProperty('--accent', c[0] + ',' + c[1] + ',' + c[2]);
    } catch(e){}
  }

  /* ====================== tribal neck rings ====================== */
  function buildRings(){
    var g = $('rings');
    var tplE = $('tplRing'), tplA = $('tplArc'), tplS = $('tplStrut');
    if (!g || g.childNodes.length || !tplE || !tplA) return;
    var frag = document.createDocumentFragment(), i, n = 17;
    for (i = 0; i < n; i++){
      var p = i / (n - 1);
      var yy = 624 + p * 680;
      var rx = 146 + p * 116;
      var ry = 16 + p * 11;

      var e = tplE.cloneNode(false);
      e.removeAttribute('id');
      e.setAttribute('cx', '500'); e.setAttribute('cy', yy.toFixed(1));
      e.setAttribute('rx', rx.toFixed(1)); e.setAttribute('ry', ry.toFixed(1));
      e.setAttribute('stroke-width', (6 + p * 4.5).toFixed(1));
      e.setAttribute('stroke-opacity', (0.92 - p * 0.16).toFixed(2));
      frag.appendChild(e);

      var hl = tplA.cloneNode(false);
      hl.removeAttribute('id');
      hl.setAttribute('d', 'M ' + (500 - rx * 0.9).toFixed(1) + ' ' + yy.toFixed(1) +
        ' A ' + (rx * 0.9).toFixed(1) + ' ' + ry.toFixed(1) + ' 0 0 1 ' +
        (500 + rx * 0.9).toFixed(1) + ' ' + yy.toFixed(1));
      hl.setAttribute('stroke-opacity', (0.34 - p * 0.12).toFixed(2));
      frag.appendChild(hl);

      if (i % 2 === 0 && tplS){
        var st = tplS.cloneNode(false);
        st.removeAttribute('id');
        st.setAttribute('d',
          'M ' + (500 - rx * 0.54).toFixed(1) + ' ' + (yy + ry * 0.6).toFixed(1) +
          ' L ' + (500 - rx * 0.5).toFixed(1) + ' ' + (yy + ry * 2.4).toFixed(1) +
          ' M ' + (500 + rx * 0.54).toFixed(1) + ' ' + (yy + ry * 0.6).toFixed(1) +
          ' L ' + (500 + rx * 0.5).toFixed(1) + ' ' + (yy + ry * 2.4).toFixed(1));
        frag.appendChild(st);
      }
    }
    g.appendChild(frag);
  }

  /* ========================= WebGL ice 3D ========================= */
  var gl = null, progA = null, progB = null, ctx2d = null;
  var bufFace = null, bufNrm = null, bufEdge = null;
  var U = {}, U2 = {};

  var ICO = [
    [-1,1.618,0],[1,1.618,0],[-1,-1.618,0],[1,-1.618,0],
    [0,-1,1.618],[0,1,1.618],[0,-1,-1.618],[0,1,-1.618],
    [1.618,0,-1],[1.618,0,1],[-1.618,0,-1],[-1.618,0,1]
  ];
  var FACES = [
    [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
    [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
    [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
    [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
  ];

  function norm3(v){
    var l = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) || 1;
    return [v[0]/l, v[1]/l, v[2]/l];
  }

  function buildGeo(){
    var P = [], N = [], i, j, f, a, b, c, u, v, w, nn;
    var vec = ICO.map(norm3);
    for (i = 0; i < FACES.length; i++){
      f = FACES[i];
      a = vec[f[0]]; b = vec[f[1]]; c = vec[f[2]];
      u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
      v = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
      nn = norm3([u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]]);
      for (j = 0; j < 3; j++){
        var p = vec[f[j]];
        P.push(p[0], p[1], p[2]);
        N.push(nn[0], nn[1], nn[2]);
      }
    }
    var seen = {}, E = [];
    for (i = 0; i < FACES.length; i++){
      f = FACES[i];
      for (j = 0; j < 3; j++){
        var x = f[j], y = f[(j+1)%3];
        var key = x < y ? x + '_' + y : y + '_' + x;
        if (seen[key]) continue;
        seen[key] = 1;
        var pa = vec[x], pb = vec[y];
        E.push(pa[0], pa[1], pa[2], pb[0], pb[1], pb[2]);
      }
    }
    return { P: new Float32Array(P), N: new Float32Array(N), E: new Float32Array(E) };
  }

  function compile(g, src, type){
    var sh = g.createShader(type);
    g.shaderSource(sh, src);
    g.compileShader(sh);
    if (!g.getShaderParameter(sh, g.COMPILE_STATUS)){
      var log = g.getShaderInfoLog(sh);
      g.deleteShader(sh);
      throw new Error('shader:' + log);
    }
    return sh;
  }
  function program(g, vs, fs){
    var p = g.createProgram();
    g.attachShader(p, compile(g, vs, g.VERTEX_SHADER));
    g.attachShader(p, compile(g, fs, g.FRAGMENT_SHADER));
    g.linkProgram(p);
    if (!g.getProgramParameter(p, g.LINK_STATUS)) throw new Error('link:' + g.getProgramInfoLog(p));
    return p;
  }

  var VS_A = [
    'attribute vec3 aPos; attribute vec3 aNrm;',
    'uniform mat4 uMVP; uniform mat4 uModel; uniform vec3 uOff;',
    'varying vec3 vN; varying vec3 vP;',
    'void main(){',
    '  vec4 p = uModel * vec4(aPos,1.0); p.xyz += uOff;',
    '  vP = p.xyz; vN = mat3(uModel) * aNrm;',
    '  gl_Position = uMVP * vec4(p.xyz,1.0);',
    '}'
  ].join('\n');

  var FS_A = [
    'precision mediump float;',
    'varying vec3 vN; varying vec3 vP;',
    'uniform vec3 uEye; uniform vec3 uIce; uniform vec3 uAcc;',
    'uniform float uPulse; uniform float uAlpha;',
    'void main(){',
    '  vec3 N = normalize(vN);',
    '  vec3 V = normalize(uEye - vP);',
    '  float l = abs(dot(N, normalize(vec3(0.42,0.7,0.6))));',
    '  float shade = floor((0.16 + 0.84*l) * 6.0) / 6.0;',
    '  float fres = pow(1.0 - max(dot(N,V),0.0), 2.2);',
    '  vec3 col = mix(uIce*0.30, uIce, shade);',
    '  col = mix(col, uAcc, 0.20 + 0.55*fres);',
    '  col += uAcc * fres * (0.35 + 1.10*uPulse);',
    '  float spec = pow(max(dot(N,V),0.0), 14.0);',
    '  col += vec3(spec) * (0.45 + 0.8*uPulse);',
    '  float d = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);',
    '  col += (d - 0.5) * 0.035;',
    '  gl_FragColor = vec4(col, uAlpha);',
    '}'
  ].join('\n');

  var VS_B = [
    'attribute vec3 aPos;',
    'uniform mat4 uMVP; uniform mat4 uModel; uniform vec3 uOff;',
    'void main(){ vec4 p = uModel*vec4(aPos,1.0); p.xyz += uOff;',
    '  gl_Position = uMVP * vec4(p.xyz,1.0); }'
  ].join('\n');

  var FS_B = [
    'precision mediump float;',
    'uniform vec3 uCol; uniform float uAlpha;',
    'void main(){ gl_FragColor = vec4(uCol, uAlpha); }'
  ].join('\n');

  var CRYSTALS = [
    { x: 0.06, y: 0.55, z: -1.15, s: 2.05, sp: 0.17, tg: 0.34, ph: 0.0 },
    { x: -1.92, y: 0.28, z: -2.55, s: 1.18, sp: -0.30, tg: -0.62, ph: 1.4 },
    { x: 1.94, y: 0.10, z: -2.35, s: 1.32, sp: 0.24, tg: 0.88, ph: 2.6 },
    { x: -1.15, y: -1.30, z: -0.95, s: 0.74, sp: 0.41, tg: 1.52, ph: 3.4 },
    { x: 1.30, y: -1.42, z: -1.25, s: 0.86, sp: -0.36, tg: -1.12, ph: 4.2 }
  ];

  /* --- matrices (column-major) --- */
  function mat4(){ return new Float32Array(16); }
  function mIdent(m){ m[0]=1;m[1]=0;m[2]=0;m[3]=0;m[4]=0;m[5]=1;m[6]=0;m[7]=0;
    m[8]=0;m[9]=0;m[10]=1;m[11]=0;m[12]=0;m[13]=0;m[14]=0;m[15]=1; return m; }
  function mMul(a, b, out){
    var t = matScratch, i, j;
    for (i = 0; i < 4; i++) for (j = 0; j < 4; j++){
      t[i*4+j] = a[0*4+j]*b[i*4+0] + a[1*4+j]*b[i*4+1] + a[2*4+j]*b[i*4+2] + a[3*4+j]*b[i*4+3];
    }
    for (i = 0; i < 16; i++) out[i] = t[i];
    return out;
  }
  function mPersp(fovy, aspect, near, far, m){
    var f = 1 / Math.tan(fovy / 2);
    m[0]=f/aspect;m[1]=0;m[2]=0;m[3]=0;
    m[4]=0;m[5]=f;m[6]=0;m[7]=0;
    m[8]=0;m[9]=0;m[10]=(far+near)/(near-far);m[11]=-1;
    m[12]=0;m[13]=0;m[14]=2*far*near/(near-far);m[15]=0;
    return m;
  }
  function mView(dist, m){
    mIdent(m); m[14] = -dist; return m;
  }
  function mModel(rx, ry, s, m){
    var cx = Math.cos(rx), sx = Math.sin(rx);
    var cy = Math.cos(ry), sy = Math.sin(ry);
    m[0]=cy*s; m[1]=0; m[2]=-sy*s; m[3]=0;
    m[4]=sy*sx*s; m[5]=cx*s; m[6]=cy*sx*s; m[7]=0;
    m[8]=sy*cx*s; m[9]=-sx*s; m[10]=cy*cx*s; m[11]=0;
    m[12]=0;m[13]=0;m[14]=0;m[15]=1;
    return m;
  }

  var matProj = mat4(), matView = mat4(), matModel = mat4(), matMVP = mat4(), matScratch = mat4();

  function initGL(){
    var g = null;
    try {
      var opts = { alpha: true, antialias: true, depth: true, premultipliedAlpha: false, powerPreference: 'low-power' };
      g = cv.getContext('webgl', opts) || cv.getContext('experimental-webgl', opts);
    } catch(e){ g = null; }
    if (!g){ init2D(); return; }
    try {
      progA = program(g, VS_A, FS_A);
      progB = program(g, VS_B, FS_B);
      var geo = buildGeo();
      bufFace = g.createBuffer();
      g.bindBuffer(g.ARRAY_BUFFER, bufFace);
      g.bufferData(g.ARRAY_BUFFER, geo.P, g.STATIC_DRAW);
      bufNrm = g.createBuffer();
      g.bindBuffer(g.ARRAY_BUFFER, bufNrm);
      g.bufferData(g.ARRAY_BUFFER, geo.N, g.STATIC_DRAW);
      bufEdge = g.createBuffer();
      g.bindBuffer(g.ARRAY_BUFFER, bufEdge);
      g.bufferData(g.ARRAY_BUFFER, geo.E, g.STATIC_DRAW);

      U.aPos = g.getAttribLocation(progA, 'aPos');
      U.aNrm = g.getAttribLocation(progA, 'aNrm');
      U.uMVP = g.getUniformLocation(progA, 'uMVP');
      U.uModel = g.getUniformLocation(progA, 'uModel');
      U.uOff = g.getUniformLocation(progA, 'uOff');
      U.uEye = g.getUniformLocation(progA, 'uEye');
      U.uIce = g.getUniformLocation(progA, 'uIce');
      U.uAcc = g.getUniformLocation(progA, 'uAcc');
      U.uPulse = g.getUniformLocation(progA, 'uPulse');
      U.uAlpha = g.getUniformLocation(progA, 'uAlpha');

      U2.aPos = g.getAttribLocation(progB, 'aPos');
      U2.uMVP = g.getUniformLocation(progB, 'uMVP');
      U2.uModel = g.getUniformLocation(progB, 'uModel');
      U2.uOff = g.getUniformLocation(progB, 'uOff');
      U2.uCol = g.getUniformLocation(progB, 'uCol');
      U2.uAlpha = g.getUniformLocation(progB, 'uAlpha');

      g.viewport(0, 0, cv.width, cv.height);
      g.enable(g.DEPTH_TEST);
      g.depthFunc(g.LEQUAL);
      g.enable(g.BLEND);
      g.blendFunc(g.SRC_ALPHA, g.ONE_MINUS_SRC_ALPHA);
      gl = g;
      S.gl = true;
      cv.addEventListener('webglcontextlost', function(ev){ ev.preventDefault(); gl = null; S.gl = false; }, false);
    } catch(e){
      S.err = '';
      gl = null;
      S.gl = false;
      init2D();
    }
  }

  function init2D(){
    try { ctx2d = cv.getContext('2d'); } catch(e){ ctx2d = null; }
    S.gl = false;
  }

  function draw2D(t){
    if (!ctx2d) return;
    var w = cv.width, h = cv.height;
    ctx2d.setTransform(1, 0, 0, 1, 0, 0);
    ctx2d.clearRect(0, 0, w, h);
    var cx = w * 0.5, cy = h * 0.42, R = Math.min(w, h) * 0.30;
    ctx2d.save();
    ctx2d.translate(cx, cy);
    ctx2d.rotate(t * 0.12);
    ctx2d.strokeStyle = 'rgba(' + S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2] + ',0.30)';
    ctx2d.lineWidth = Math.max(1, dpr);
    for (var k = 0; k < 3; k++){
      var rr = R * (0.55 + k * 0.22);
      ctx2d.beginPath();
      for (var i = 0; i <= 6; i++){
        var a = (i / 6) * Math.PI * 2 + k * 0.4;
        var px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.86;
        if (i === 0) ctx2d.moveTo(px, py); else ctx2d.lineTo(px, py);
      }
      ctx2d.stroke();
    }
    ctx2d.restore();
  }

  function drawGL(t){
    if (!gl || !progA || !progB) return;
    var g = gl;
    g.clearColor(0, 0, 0, 0);
    g.clear(g.COLOR_BUFFER_BIT | g.DEPTH_BUFFER_BIT);
    var aspect = (cv.width || 1) / (cv.height || 1);
    if (!isFinite(aspect) || aspect <= 0) aspect = 16 / 9;
    mPersp(0.80, aspect, 0.1, 40, matProj);
    mView(6.0, matView);
    mMul(matProj, matView, matMVP);

    var acc = S.accent;
    var accN = [acc[0] / 255, acc[1] / 255, acc[2] / 255];
    var pulse = S.pulse;
    var rmp = S.reduced ? 0.35 : 1;

    g.useProgram(progA);
    g.uniformMatrix4fv(U.uMVP, false, matMVP);
    g.uniform3f(U.uEye, 0, 0, 6.0);
    g.uniform3f(U.uIce, 0.78, 0.92, 1.0);
    g.uniform3f(U.uAcc, accN[0], accN[1], accN[2]);
    g.uniform1f(U.uPulse, pulse * rmp);

    g.bindBuffer(g.ARRAY_BUFFER, bufFace);
    g.enableVertexAttribArray(U.aPos);
    g.vertexAttribPointer(U.aPos, 3, g.FLOAT, false, 0, 0);
    g.bindBuffer(g.ARRAY_BUFFER, bufNrm);
    g.enableVertexAttribArray(U.aNrm);
    g.vertexAttribPointer(U.aNrm, 3, g.FLOAT, false, 0, 0);
    g.enable(g.POLYGON_OFFSET_FILL);
    g.polygonOffset(1.5, 2.0);

    var i, c;
    for (i = 0; i < CRYSTALS.length; i++){
      c = CRYSTALS[i];
      var sp = c.sp * (1 + pulse * 0.8) * rmp;
      mModel(c.tg + t * sp * 0.6, c.ph + t * sp, c.s * (1 + pulse * 0.04), matModel);
      g.uniformMatrix4fv(U.uModel, false, matModel);
      g.uniform3f(U.uOff, c.x, c.y + Math.sin(t * 0.5 + c.ph) * 0.06, c.z);
      g.uniform1f(U.uAlpha, 0.90);
      g.drawArrays(g.TRIANGLES, 0, 60);
    }

    /* wireframe overlay */
    g.disable(g.POLYGON_OFFSET_FILL);
    g.useProgram(progB);
    g.uniformMatrix4fv(U2.uMVP, false, matMVP);
    g.uniform3f(U2.uCol, Math.min(1, 0.55 + accN[0] * 0.5), Math.min(1, 0.7 + accN[1] * 0.3), 1.0);
    g.uniform1f(U2.uAlpha, 0.16 + 0.18 * pulse * rmp);
    g.bindBuffer(g.ARRAY_BUFFER, bufEdge);
    var al = g.getAttribLocation(progB, 'aPos');
    if (al >= 0){
      g.enableVertexAttribArray(al);
      g.vertexAttribPointer(al, 3, g.FLOAT, false, 0, 0);
    }
    for (i = 0; i < CRYSTALS.length; i++){
      c = CRYSTALS[i];
      var sp2 = c.sp * (1 + pulse * 0.8) * rmp;
      mModel(c.tg + t * sp2 * 0.6, c.ph + t * sp2, c.s * (1 + pulse * 0.04), matModel);
      g.uniformMatrix4fv(U2.uModel, false, matModel);
      g.uniform3f(U2.uOff, c.x, c.y + Math.sin(t * 0.5 + c.ph) * 0.06, c.z);
      g.drawArrays(g.LINES, 0, 60);
    }
  }

  function clampByte(v){
    v = Math.round(Number(v));
    if (!isFinite(v)) return 0;
    return v < 0 ? 0 : (v > 255 ? 255 : v);
  }
  function parseAccent(a){
    if (!a || typeof a.length !== 'number') return S.accent;
    var c = [clampByte(a[0]), clampByte(a[1]), clampByte(a[2])];
    return c;
  }

  /* =========================== plate =========================== */
  var metaCache = { line: '', mode: '', time: '', rail: -1 };

  function pad2(n){
    n = Math.floor(n);
    if (!isFinite(n) || n < 0) n = 0;
    return n < 10 ? '0' + n : '' + n;
  }
  function fmtTime(s){
    if (typeof s !== 'number' || !isFinite(s) || s < 0) return '00:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return pad2(m) + ':' + pad2(sec);
  }
  function cleanText(s, max){
    if (typeof s !== 'string') return '';
    s = s.replace(/\s+/g, ' ').trim();
    if (max && s.length > max) s = s.slice(0, max - 1) + '…';
    return s;
  }
  function artistText(a){
    if (typeof a === 'string') return cleanText(a, 48);
    if (a && typeof a.length === 'number'){
      var out = [], i, t;
      for (i = 0; i < a.length && out.length < 4; i++){
        t = cleanText(String(a[i] == null ? '' : a[i]), 28);
        if (t) out.push(t);
      }
      return out.join(' / ');
    }
    return '';
  }
  function applyCover(url){
    var img = $('cover');
    if (!img) return;
    if (typeof url !== 'string' || !url.length || url.length > 2048){
      img.style.display = 'none';
      img.removeAttribute('src');
      return;
    }
    img.style.display = 'none';
    img.onerror = function(){ img.style.display = 'none'; img.removeAttribute('src'); };
    img.onload = function(){ img.style.display = 'inline-block'; };
    img.src = url;
  }
  function setSongInfo(song){
    var name = cleanText(song && song.name, 44) || 'UNTITLED';
    var art = artistText(song && song.artists);
    $('hSong').textContent = name;
    $('hArtists').textContent = art || '—';
    $('pSong').textContent = art ? (name + ' · ' + art) : name;
    try { applyCover(song && song.cover); } catch(e){}
  }

  function updateMeta(){
    var n = S.lines.length;
    var line = n ? (S.idx < 0 ? ('PRELUDE / ' + pad2(n))
      : ('LINE ' + pad2(S.idx + 1) + ' / ' + pad2(n))) : 'NO LYRIC DATA';
    if (line !== metaCache.line){ metaCache.line = line; $('pLine').textContent = line; }

    var mode = S.hasChars ? 'YRC · SYNC' : 'LRC · AUTO';
    if (mode !== metaCache.mode){ metaCache.mode = mode; $('pMode').textContent = mode; }

    var t = fmtTime(S.t) + ' / ' + (S.duration > 0 ? fmtTime(S.duration) : '--:--');
    if (t !== metaCache.time){ metaCache.time = t; $('pTime').textContent = t; }

    var pct = S.duration > 0 ? (S.t / S.duration) : 0;
    if (!isFinite(pct)) pct = 0;
    pct = pct < 0 ? 0 : (pct > 1 ? 1 : pct);
    var p100 = Math.round(pct * 1000) / 10;
    if (p100 !== metaCache.rail){
      metaCache.rail = p100;
      $('railFill').style.width = p100 + '%';
    }
  }

  function fitLine(){
    if (S.curKey === null || S.curKey === 'empty') return;
    if (wrap.classList.contains('rest')) return;
    var base = W < 620 ? Math.max(17, Math.min(31, W * 0.062))
                       : Math.max(20, Math.min(42, W * 0.031));
    wrap.style.fontSize = base.toFixed(1) + 'px';
    var maxW = wrap.clientWidth;
    if (!maxW || maxW < 40) return;
    var maxH = base * 1.46 * 2.35, k;
    for (k = 0; k < 10; k++){
      var over = wrap.scrollWidth > maxW + 1 || wrap.scrollHeight > maxH + 1;
      if (!over || base <= 14) break;
      base *= 0.88;
      wrap.style.fontSize = base.toFixed(1) + 'px';
      maxH = base * 1.46 * 2.35;
    }
  }

  /* ======================= beat / live ======================= */
  S.pulse = 0; S.pulseLo = 0; S.kick = 0; S.bass = 0.4; S.mid = 0.3; S.treble = 0.2;
  S.hasChars = false; S.vw = W; S.vh = H;

  function num01(v, d){
    var n = Number(v);
    if (!isFinite(n)) return d;
    return n < 0 ? 0 : (n > 1 ? 1 : n);
  }
  function onBeat(p){
    var lv = num01(p && p.level, 0.6);
    S.kick = Math.max(S.kick, 0.25 + lv * 0.85);
  }
  function onLive(p){
    p = p || {};
    S.bass = num01(p.bass, S.bass);
    S.mid = num01(p.mid, S.mid);
    S.treble = num01(p.treble, S.treble);
    S.pulseLo = Math.min(0.85, num01(p.level, 0.3) * 0.5 + S.bass * 0.45);
  }

  // build character spans for a line
  var flashTimer = 0, plateInner = null;
  function flashPlate(){
    if (!plateInner) plateInner = document.querySelector('.plate-inner');
    if (!plateInner) return;
    plateInner.classList.add('flash');
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){
      if (plateInner) plateInner.classList.remove('flash');
    }, 420);
  }

  function setLine(L){
    wrap.textContent = '';
    wrap.classList.remove('rest');
    S.spans = [];
    S.active = -1;
    if (!L){ return; }
    var txt = (typeof L.text === 'string' && L.text.length) ? L.text : '';
    if (!txt.trim().length){
      wrap.style.fontSize = '';
      wrap.classList.add('rest');
      wrap.textContent = '· · ·';
      return;
    }
    var frag = document.createDocumentFragment();
    for (var i = 0; i < txt.length; i++){
      var ch = txt.charAt(i);
      var sp = document.createElement('span');
      sp.className = (ch === ' ' || ch === '\t') ? 'ch sp' : 'ch';
      sp.textContent = ch;
      frag.appendChild(sp);
      S.spans.push(sp);
    }
    wrap.appendChild(frag);
    wrap.scrollTop = 0;
    fitLine();
  }

  function charTimeOf(L, i, n){
    var cs = L && L.chars;
    if (cs && cs.length === n && cs[i] && typeof cs[i].t === 'number' && isFinite(cs[i].t)) return cs[i].t;
    var st = (L && typeof L.t === 'number' && isFinite(L.t)) ? L.t : 0;
    var dur = (L && typeof L.dur === 'number' && isFinite(L.dur) && L.dur > 0.05) ? L.dur : Math.max(1.2, n * 0.28);
    return st + dur * (i / Math.max(1, n));
  }

  function updateLyric(){
    var L = S.idx >= 0 ? S.lines[S.idx] : (S.lines.length ? S.lines[0] : null);
    if (!L){
      if (S.curKey !== 'empty'){
        S.curKey = 'empty';
        setLine(null);
        wrap.classList.add('empty');
        wrap.style.fontSize = '';
        wrap.textContent = S.lines.length ? '' : '◇ NO VOCAL · INSTRUMENTAL';
      }
      return;
    }
    if (S.curKey !== L){
      S.curKey = L;
      wrap.classList.remove('empty');
      setLine(L);
      flashPlate();
    }
    var n = S.spans.length;
    var cnt = 0, i;
    if (S.idx >= 0){
      for (i = 0; i < n; i++){
        if (S.t >= charTimeOf(L, i, n) - 0.001) cnt = i + 1;
      }
    }
    if (cnt !== S.active){
      S.active = cnt;
      for (i = 0; i < n; i++){
        S.spans[i].classList.toggle('on', i < cnt);
      }
    }
  }

  function pickIdx(){
    var t = S.t, best = -1, bestT = -Infinity;
    for (var i = 0; i < S.lines.length; i++){
      var lt = S.lines[i] && typeof S.lines[i].t === 'number' ? S.lines[i].t : 0;
      if (lt <= t + 0.0005 && lt >= bestT){ bestT = lt; best = i; }
    }
    return best;
  }

  function onInit(p){
    p = p || {};
    var song = p.song && typeof p.song === 'object' ? p.song : {};
    S.song = song;
    S.accent = parseAccent(p.accent);
    S.duration = (typeof p.duration === 'number' && isFinite(p.duration) && p.duration > 0) ? p.duration : 0;
    var ls = [];
    if (p.lines && typeof p.lines.length === 'number'){
      for (var i = 0; i < p.lines.length; i++){
        var L = p.lines[i];
        if (!L || typeof L !== 'object') continue;
        var cs = (L.chars && typeof L.chars.length === 'number') ? L.chars : null;
        var txt = (typeof L.text === 'string') ? L.text : '';
        if (!txt.replace(/\s+/g, '').length && cs){
          var buf = '', ci, cc;
          for (ci = 0; ci < cs.length; ci++){
            cc = cs[ci];
            if (cc && typeof cc.c === 'string') buf += cc.c;
          }
          txt = buf;
        }
        ls.push({
          t: (typeof L.t === 'number' && isFinite(L.t)) ? L.t : 0,
          dur: (typeof L.dur === 'number' && isFinite(L.dur) && L.dur > 0) ? L.dur : 3,
          text: txt.trim().length ? txt : '',
          chars: cs
        });
      }
    }
    S.lines = ls;
    S.curKey = null;
    S.active = -1;
    S.hasChars = false;
    for (var k = 0; k < ls.length; k++){
      if (ls[k].chars && ls[k].chars.length){ S.hasChars = true; break; }
    }
    S.idx = pickIdx();
    if (typeof p.playing === 'boolean') S.playing = p.playing; else S.playing = true;

    applyAccent();
    buildRings();
    setSongInfo(song);
    metaCache.line = ''; metaCache.mode = ''; metaCache.time = ''; metaCache.rail = -1;
    updateMeta();
  }

  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick'){
        var p = d.payload || {};
        if (typeof p.time === 'number' && isFinite(p.time)) S.t = p.time;
        if (typeof p.playing === 'boolean') S.playing = p.playing;
      } else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch(e){ S.err = String(e && e.message || e); }
  });

  window.__stage = function(){
    var L = S.idx >= 0 ? S.lines[S.idx] : null;
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: !!S.playing,
      frames: S.frames, js: S.js, err: S.err,
      text: L ? (L.text || '') : '', gl: !!S.gl,
      rm: !!S.reduced
    };
  };

  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  S.reduced = !!(rm && rm.matches);
  if (rm && rm.addEventListener) rm.addEventListener('change', function(e){ S.reduced = !!e.matches; });

  function frame(now){
    var t0 = performance.now();
    S.frames++;
    var ts = (typeof now === 'number' && isFinite(now) ? now : 0) / 1000;

    S.kick *= 0.92;
    var damp = S.reduced ? 0.4 : 1;
    S.pulse = Math.max(S.pulseLo * damp, S.kick * damp);
    if (!isFinite(S.pulse)) S.pulse = 0;

    S.idx = pickIdx();
    updateLyric();
    updateMeta();

    if (gl) drawGL(ts); else if (ctx2d) draw2D(ts);

    S.js = Math.max(0, performance.now() - t0);
    if (!readySent) sendReady();
    requestAnimationFrame(frame);
  }
  buildRings();
  initGL();
  requestAnimationFrame(frame);
  setTimeout(sendReady, 400);
})();
</script>
</body>
</html>
