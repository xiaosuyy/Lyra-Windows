<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>绒线黄昏</title>
<style>
  :root{
    --cream:#f4ead7; --ink:#2a1c14; --faded:#54402f; --thread:#8a6a48;
    --accent:#b45b34; --pulse:0; --bass:0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--cream);overflow:hidden}
  #stage{
    position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(125% 105% at 50% 0%,#fbf2df 0%,#efe3cb 55%,#ddcdb0 100%);
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  /* 亚麻布纹：两道极淡的经纬线叠层 */
  #weave{
    position:absolute;inset:-2px;pointer-events:none;opacity:.5;
    background-image:
      repeating-linear-gradient(0deg,rgba(140,110,74,.07) 0 1px,rgba(255,255,255,0) 1px 3px),
      repeating-linear-gradient(90deg,rgba(140,110,74,.06) 0 1px,rgba(255,255,255,0) 1px 3px);
    mix-blend-mode:multiply;
  }
  #quilt{position:absolute;inset:0;width:100%;height:100%;display:block}
  #lyricbox{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-.5deg);
    width:min(900px,84vw);text-align:center;
    padding:clamp(20px,3.6vh,44px) clamp(18px,3vw,52px);
    background:
      radial-gradient(circle at 20% 18%,rgba(255,255,255,.7),rgba(255,255,255,0) 46%),
      repeating-linear-gradient(0deg,rgba(160,128,90,.055) 0 1px,rgba(0,0,0,0) 1px 4px),
      repeating-linear-gradient(90deg,rgba(160,128,90,.05) 0 1px,rgba(0,0,0,0) 1px 4px),
      radial-gradient(120% 130% at 30% 10%,#fffbf0 0%,#f9f0dc 62%,#f0e3c9 100%);
    border:2px dashed #c9b18e;border-radius:16px;
    box-shadow:0 20px 44px rgba(96,70,42,.22), 0 2px 0 #fffdf5 inset, 0 -10px 26px rgba(150,118,78,.10) inset;
    outline:1px solid rgba(150,120,80,.20);outline-offset:7px;
  }
  #lyricbox .stitch{position:absolute;width:26px;height:26px;border:2px solid #c9b18e;border-radius:50%;opacity:.55}
  #lyricbox .s1{left:-13px;top:-13px}#lyricbox .s2{right:-13px;top:-13px}
  #lyricbox .s3{left:-13px;bottom:-13px}#lyricbox .s4{right:-13px;bottom:-13px}
  #prev,#next{
    color:#6b543c;opacity:.55;font-size:clamp(12px,1.5vw,17px);
    letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin:0 auto;
  }
  #prev{margin-bottom:clamp(6px,1.4vh,14px)}
  #next{margin-top:clamp(6px,1.4vh,14px)}
  #line{
    font-size:clamp(20px,3.6vw,44px);line-height:1.52;letter-spacing:.035em;
    word-break:break-word;
  }
  #line .c{
    color:var(--faded);transition:color .22s linear;
    opacity:.78;
  }
  #line .c.on{color:var(--ink);opacity:1;text-shadow:0 1px 0 rgba(255,255,255,.75)}
  #meta{
    position:absolute;left:0;right:0;bottom:3.4vh;text-align:center;
    font-size:clamp(9px,1.1vw,12px);letter-spacing:.34em;color:#7c6549;opacity:.8;
  }
  #touchline{
    position:absolute;left:50%;transform:translateX(-50%);bottom:6.4vh;
    width:min(560px,62vw);height:3px;border-radius:2px;
    background:repeating-linear-gradient(90deg,rgba(150,118,78,.34) 0 5px,rgba(0,0,0,0) 5px 9px);
    overflow:hidden;
  }
  #touchline i{
    position:absolute;left:0;top:-3px;height:9px;width:0%;
    background:var(--accent);border-radius:3px;
    box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;
    transition:width .18s linear;
  }
  @media (max-aspect-ratio:3/4){
    #lyricbox{width:88vw;border-radius:13px}
    #line{line-height:1.62}
    #prev,#next{font-size:clamp(11px,3.1vw,14px)}
  }
  @media (prefers-reduced-motion:reduce){
    #line .c{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="quilt" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div id="weave"></div>
  <div id="lyricbox">
    <i class="stitch s1"></i><i class="stitch s2"></i><i class="stitch s3"></i><i class="stitch s4"></i>
    <div id="prev"></div>
    <div id="line">等待歌词</div>
    <div id="next"></div>
  </div>
  <div id="meta"></div>
  <div id="touchline"><i></i></div>
</div>
<script>
'use strict';
/* 自检口：脚本最外层无条件赋值 */
var st = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', rm: false };
window.__stage = function(){
  return {
    lines: st.lines.length, idx: st.idx, t: st.t, playing: st.playing,
    frames: st.frames, js: st.js, err: st.err, text: st.text, gl: false, rm: st.rm
  };
};

(function(){
  var SVGNS = 'http://www.w3.org/2000/svg';
  var elQuilt = document.getElementById('quilt');
  var elLine = document.getElementById('line');
  var elTouch = document.querySelector('#touchline i');
  var elPrev = document.getElementById('prev');
  var elNext = document.getElementById('next');
  var elMeta = document.getElementById('meta');
  var root = document.getElementById('stage');

  try { st.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ console.error('[441] mediaquery', e); }

  st.songName = '';

  function normLines(arr){
    var out = [], i, L, text, t, dur, chars, cc, ch, j;
    if(!Array.isArray(arr)) return out;
    var n = Math.min(arr.length, 800);
    for(i=0;i<n;i++){
      L = arr[i]; if(!L || typeof L !== 'object') continue;
      text = (L.text == null) ? '' : String(L.text);
      t = isFinite(L.t) ? Number(L.t) : 0;
      dur = (isFinite(L.dur) && Number(L.dur) > 0) ? Number(L.dur) : 0;
      chars = null;
      if(Array.isArray(L.chars) && L.chars.length){
        cc = [];
        var m = Math.min(L.chars.length, 500);
        for(j=0;j<m;j++){
          ch = L.chars[j];
          if(ch == null){ cc.push({c:'', t:t}); continue; }
          cc.push({ c: String(ch.c == null ? '' : ch.c), t: isFinite(ch.t) ? Number(ch.t) : t });
        }
        chars = cc;
      }
      if(!text.trim() && !(chars && chars.length)) continue;
      out.push({ t:t, dur:dur, text:text, chars:chars });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    return out;
  }

  function calcIdx(time){
    var L = st.lines, i = -1, k;
    for(k=0;k<L.length;k++){ if(L[k].t <= time + 0.05) i = k; else break; }
    return i;
  }

  /* ---------- 织物底子：程序化拼布风景 ---------- */
  var W = 1600, H = 900;
  var rand = (function(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })(4410);
  var qu = { g: {}, patchColors: [] };

  function svgEl(tag, attrs){
    var e = document.createElementNS(SVGNS, tag), k;
    for(k in attrs){ if(attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); }
    return e;
  }
  function hsl(h, s, l){ return 'hsl(' + (h % 360).toFixed(1) + ',' + s.toFixed(1) + '%,' + l.toFixed(1) + '%)'; }
  function rgb2hsl(c){
    var r = c[0]/255, g = c[1]/255, b = c[2]/255;
    var max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2, h = 0, s = 0, d;
    if(max !== min){
      d = max - min;
      s = l > .5 ? d / (2 - max - min) : d / (max + min);
      if(max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if(max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  function wobbly(x, y, w, h, j){
    var p = [], step = Math.max(14, Math.min(w, h) / 3), i, n;
    n = Math.min(40, Math.max(2, Math.round(w / step)));
    for(i=0;i<=n;i++) p.push([x + w * i / n + (rand()-.5)*j, y + (rand()-.5)*j]);
    n = Math.min(40, Math.max(2, Math.round(h / step)));
    for(i=1;i<=n;i++) p.push([x + w + (rand()-.5)*j, y + h * i / n + (rand()-.5)*j]);
    n = Math.min(40, Math.max(2, Math.round(w / step)));
    for(i=1;i<=n;i++) p.push([x + w - w * i / n + (rand()-.5)*j, y + h + (rand()-.5)*j]);
    n = Math.min(40, Math.max(2, Math.round(h / step)));
    for(i=1;i<n;i++) p.push([x + (rand()-.5)*j, y + h - h * i / n + (rand()-.5)*j]);
    return 'M' + p.map(function(pt){ return pt[0].toFixed(1) + ' ' + pt[1].toFixed(1); }).join('L') + 'Z';
  }

  function buildQuilt(accent){
    var rgb = (Array.isArray(accent) && accent.length >= 3) ? accent : [180, 96, 58];
    var A = rgb2hsl(rgb), h0 = A[0], s0 = Math.max(16, Math.min(62, A[1]));
    while(elQuilt.firstChild) elQuilt.removeChild(elQuilt.firstChild);

    var defs = svgEl('defs', {});
    elQuilt.appendChild(defs);

    var gSky = svgEl('g', {});
    var gHill = svgEl('g', {});
    var gStitch = svgEl('g', {});
    var gSunWrap = svgEl('g', {});
    /* 簇绒颗粒滤镜：让矢量面看起来是毛线头堆出来的 */
    var fT = svgEl('filter', { id: 'tuft', x: '-4%', y: '-4%', width: '108%', height: '108%' });
    fT.appendChild(svgEl('feTurbulence', {
      type: 'fractalNoise', baseFrequency: '0.82', numOctaves: '3', seed: '7', result: 'n'
    }));
    fT.appendChild(svgEl('feDisplacementMap', {
      in: 'SourceGraphic', in2: 'n', scale: '3.4', xChannelSelector: 'R', yChannelSelector: 'G'
    }));
    defs.appendChild(fT);
    elQuilt.appendChild(gSky);
    elQuilt.appendChild(gSunWrap);
    elQuilt.appendChild(gHill);
    elQuilt.appendChild(gStitch);
    gSunWrap.setAttribute('filter', 'url(#tuft)');

    /* 天空：6×3 布片拼贴 */
    var cols = 6, rows = 3, cw = W / cols, chh = H * 0.62 / rows, ci, ri;
    qu.patchColors = [];
    for(ri=0;ri<rows;ri++){
      for(ci=0;ci<cols;ci++){
        var hue = h0 + (ci - 2.5) * 5.5 + (rand()-.5) * 9;
        var sat = s0 * (0.42 + rand() * 0.34);
        var lig = 79 - ri * 5.5 - rand() * 5;
        var col = hsl(hue, Math.min(46, sat), lig);
        qu.patchColors.push(col);
        var px = ci * cw - 3, py = ri * chh - 3;
        var d = wobbly(px, py, cw + 6, chh + 6, 7);
        var clipId = 'pc' + ri + '_' + ci;
        var cp = svgEl('clipPath', { id: clipId });
        cp.appendChild(svgEl('path', { d: d }));
        defs.appendChild(cp);
        gSky.appendChild(svgEl('path', {
          d: d, fill: col, 'stroke-linejoin': 'round',
          stroke: hsl(hue, Math.min(20, sat), lig - 12), 'stroke-width': 1.2, opacity: .96
        }));
        /* 绒毛走向：短绒线 */
        var grp = svgEl('g', { 'clip-path': 'url(#' + clipId + ')' });
        var nap = 16, k;
        for(k=0;k<nap;k++){
          var nx = px + rand() * (cw + 6), ny = py + rand() * (chh + 6);
          var len = 9 + rand() * 26, ang = -0.9 + rand() * 1.8;
          grp.appendChild(svgEl('line', {
            x1: nx.toFixed(1), y1: ny.toFixed(1),
            x2: (nx + Math.cos(ang) * len).toFixed(1), y2: (ny + Math.sin(ang) * len).toFixed(1),
            stroke: rand() > .5 ? '#fffdf4' : hsl(hue, sat, lig - 16),
            'stroke-width': (0.8 + rand() * 1.5).toFixed(2),
            'stroke-linecap': 'round', opacity: (0.16 + rand() * 0.3).toFixed(2)
          }));
        }
        gSky.appendChild(grp);
      }
    }

    /* 落日：同心绒线圈 */
    var sunX = W * 0.72, sunY = H * 0.30, sunR = Math.min(W, H) * 0.115;
    var gSun = svgEl('g', {});
    var ring, rr, rings = 9, ang2, sparks = 26;
    for(ring=rings; ring>=1; ring--){
      rr = sunR * ring / rings;
      gSun.appendChild(svgEl('circle', {
        cx: sunX, cy: sunY, r: rr.toFixed(1),
        fill: 'none', stroke: hsl(h0 + 4, Math.min(70, s0 + 14), 58 + (rings - ring) * 2.4),
        'stroke-width': (sunR * 0.16).toFixed(1), opacity: ring === 1 ? .95 : .82
      }));
    }
    gSun.appendChild(svgEl('circle', {
      cx: sunX, cy: sunY, r: (sunR * 0.9).toFixed(1),
      fill: hsl(h0 + 8, Math.min(72, s0 + 18), 70), opacity: .5
    }));    for(ang2=0; ang2<sparks; ang2++){
      var aa = ang2 / sparks * Math.PI * 2 + 0.2;
      var r1 = sunR * 1.12, r2 = sunR * (1.18 + rand() * 0.16);
      gSun.appendChild(svgEl('line', {
        x1: (sunX + Math.cos(aa) * r1).toFixed(1), y1: (sunY + Math.sin(aa) * r1).toFixed(1),
        x2: (sunX + Math.cos(aa) * r2).toFixed(1), y2: (sunY + Math.sin(aa) * r2).toFixed(1),
        stroke: hsl(h0, Math.min(64, s0 + 10), 62), 'stroke-width': 2.4,
        'stroke-linecap': 'round', opacity: .55
      }));
    }
    gSunWrap.appendChild(gSun);

    /* 丘峦：四层拼布，越远越浅 */
    var bands = [
      { y: H * 0.50, amp: 26, hue: h0 + 6,  sat: s0 * .55, lig: 66, n: 2.2 },
      { y: H * 0.60, amp: 34, hue: h0 - 4,  sat: s0 * .62, lig: 55, n: 1.6 },
      { y: H * 0.72, amp: 42, hue: h0 - 12, sat: s0 * .70, lig: 43, n: 1.1 },
      { y: H * 0.85, amp: 30, hue: h0 + 16, sat: s0 * .78, lig: 31, n: .8 }
    ];
    var bi, b;
    for(bi=0;bi<bands.length;bi++){
      b = bands[bi];
      var segs = [], x, ph = rand() * 6.283;
      for(x=0; x<=W+40; x+=40){
        var yy = b.y + Math.sin(x / W * Math.PI * b.n + ph) * b.amp
               + Math.sin(x / W * Math.PI * (b.n * 2.7) + ph * 2) * b.amp * 0.28;
        segs.push([x, yy]);
      }
      var dd = 'M-40 ' + (H + 40) + 'L-40 ' + segs[0][1].toFixed(1);
      var si;
      for(si=0;si<segs.length;si++) dd += 'L' + segs[si][0].toFixed(1) + ' ' + segs[si][1].toFixed(1);
      dd += 'L' + (W + 40) + ' ' + (H + 40) + 'Z';
      var hcol = hsl(b.hue, b.sat, b.lig);
      var clipH = 'hc' + bi;
      var cp2 = svgEl('clipPath', { id: clipH });
      cp2.appendChild(svgEl('path', { d: dd }));
      defs.appendChild(cp2);
      gHill.appendChild(svgEl('path', {
        d: dd, fill: hcol, stroke: hsl(b.hue, b.sat * .9, b.lig - 14),
        'stroke-width': 1.6, 'stroke-linejoin': 'round'
      }));
      /* 抽褶毛衣纹：沿山脊垂下的粗绒线 */
      var gg = svgEl('g', { 'clip-path': 'url(#' + clipH + ')' });
      var count = Math.min(70, Math.round(52 - bi * 6));
      var qi;
      for(qi=0;qi<count;qi++){
        var qx = rand() * (W + 20) - 10;
        var qy0 = segs[Math.min(segs.length - 1, Math.max(0, Math.round(qx / 40)))][1] + 6;
        var qlen = 30 + rand() * 120;
        gg.appendChild(svgEl('line', {
          x1: qx.toFixed(1), y1: qy0.toFixed(1),
          x2: (qx + (rand()-.5) * 14).toFixed(1), y2: (qy0 + qlen).toFixed(1),
          stroke: rand() > .55 ? hsl(b.hue, b.sat, b.lig + 9) : hsl(b.hue, b.sat, b.lig - 11),
          'stroke-width': (2 + rand() * 3.4).toFixed(1), 'stroke-linecap': 'round',
          opacity: (0.20 + rand() * 0.26).toFixed(2)
        }));
      }
      gHill.appendChild(gg);
      /* 山脊跑针：沿边的十字针脚 */
      var dots = svgEl('g', {});
      var di, stepX = 46;
      for(di=1; di*stepX < W; di++){
        var dx = di * stepX, dyy = b.y + Math.sin(dx / W * Math.PI * b.n + ph) * b.amp
                + Math.sin(dx / W * Math.PI * (b.n * 2.7) + ph * 2) * b.amp * 0.28;
        dots.appendChild(svgEl('line', {
          x1: (dx - 7).toFixed(1), y1: (dyy - 5).toFixed(1),
          x2: (dx + 7).toFixed(1), y2: (dyy + 5).toFixed(1),
          stroke: hsl(b.hue, b.sat, Math.min(88, b.lig + 26)), 'stroke-width': 2.2,
          'stroke-linecap': 'round', opacity: .68
        }));
        dots.appendChild(svgEl('line', {
          x1: (dx - 7).toFixed(1), y1: (dyy + 5).toFixed(1),
          x2: (dx + 7).toFixed(1), y2: (dyy - 5).toFixed(1),
          stroke: hsl(b.hue, b.sat, Math.min(88, b.lig + 26)), 'stroke-width': 2.2,
          'stroke-linecap': 'round', opacity: .68
        }));
      }
      gStitch.appendChild(dots);
    }

    /* 天空里几只缝线飞鸟 */
    var bird = svgEl('g', { stroke: hsl(h0 - 20, Math.min(30, s0), 34), 'stroke-width': 3,
      'stroke-linecap': 'round', fill: 'none', opacity: .55 });
    var bcount = 7, bnode, bi2;
    for(bi2=0;bi2<bcount;bi2++){
      var bx = 120 + rand() * (W * 0.55), by = 90 + rand() * (H * 0.32);
      var sc = 0.6 + rand() * 0.9;
      bnode = svgEl('path', {
        d: 'M' + (bx - 16*sc).toFixed(1) + ' ' + by.toFixed(1) +
           'q' + (8*sc).toFixed(1) + ' ' + (-11*sc).toFixed(1) + ' ' + (16*sc).toFixed(1) + ' ' + (2*sc).toFixed(1) +
           'q' + (8*sc).toFixed(1) + ' ' + (-13*sc).toFixed(1) + ' ' + (16*sc).toFixed(1) + ' ' + (2*sc).toFixed(1)
      });
      bird.appendChild(bnode);
    }
    gSky.appendChild(bird);

    qu.g.sky = gSky; qu.g.hill = gHill; qu.g.sun = gSun; qu.g.sunWrap = gSunWrap;
    qu.g.stitch = gStitch; qu.sunX = sunX; qu.sunY = sunY; qu.sunR = sunR;
  }

  /* 首屏先用 CSS 绒布底，拼布风景在 ready 之后分帧补齐 */
  var quiltAccentKey = '', quiltTimer = 0, quiltReady = false;
  function scheduleQuilt(accent){
    var rgb = (Array.isArray(accent) && accent.length >= 3) ? accent : [180, 96, 58];
    var key = rgb.slice(0,3).join(',');
    if(key === quiltAccentKey && quiltReady) return;
    quiltAccentKey = key;
    if(quiltTimer) clearTimeout(quiltTimer);
    quiltTimer = setTimeout(function(){
      quiltTimer = 0;
      try{ buildQuilt(rgb); quiltReady = true; }
      catch(e){ st.err = String(e && e.message || e); console.error('[441] quilt', e); }
    }, 24);
  }

  var lastIdx = -2;
  /* ---------- 音频驱动 ---------- */
  var live = { level: 0, bass: 0, mid: 0, treble: 0 };
  var beatLv = 0, beatFlash = 0, breathe = 0, lastProg = -1;

  function onBeat(level){
    var lv = isFinite(level) ? Math.max(0, Math.min(1, Number(level))) : .5;
    beatLv = lv;
    beatFlash = Math.min(1, beatFlash + .55 + lv * .45);
  }

  function animate(dt){
    breathe += dt;
    beatFlash *= Math.pow(0.02, dt);
    if(st.rm){ beatFlash = 0; }
    var pulse = beatFlash * 0.6 + live.bass * 0.4;
    if(qu.g.sunWrap){
      var s = 1 + (st.rm ? 0 : pulse * 0.06) + Math.sin(breathe * 0.55) * 0.008;
      qu.g.sunWrap.setAttribute('transform',
        'translate(' + qu.sunX + ' ' + qu.sunY + ') scale(' + s.toFixed(4) + ') translate(' +
        (-qu.sunX) + ' ' + (-qu.sunY) + ')');
      qu.g.sunWrap.setAttribute('opacity', (0.72 + pulse * 0.28).toFixed(3));
    }
    if(qu.g.hill){
      var sh = (st.rm ? 0 : Math.sin(breathe * 0.35) * 4 + pulse * 6);
      qu.g.hill.setAttribute('transform', 'translate(0 ' + sh.toFixed(1) + ')');
    }
    if(qu.g.sky){
      qu.g.sky.setAttribute('transform', 'translate(0 ' + (st.rm ? 0 : Math.sin(breathe * 0.22) * 2).toFixed(1) + ')');
    }
    if(qu.g.stitch){
      qu.g.stitch.setAttribute('opacity', (0.72 + live.treble * 0.28).toFixed(3));
    }
    root.style.setProperty('--bass', live.bass.toFixed(2));
    root.style.setProperty('--pulse', pulse.toFixed(3));
    if(st.duration > 0){
      var pr = Math.max(0, Math.min(1, st.t / st.duration));
      if(Math.abs(pr - lastProg) > 0.002){
        lastProg = pr;
        elTouch.style.width = (pr * 100).toFixed(1) + '%';
      }
    }
  }


  function renderLines(){
    var i = st.idx, L = st.lines, cur;
    if(i === lastIdx) return;
    lastIdx = i;
    if(i < 0 || i >= L.length){
      elPrev.textContent = '';
      elNext.textContent = '';
      elLine.textContent = (L.length ? '…' : '纯音乐 · 无歌词');
      elLine.style.fontSize = '';
      st.text = (L.length ? '' : '纯音乐 · 无歌词');
      return;
    }
    cur = L[i];
    elPrev.textContent = (i > 0 && L[i-1]) ? L[i-1].text : '';
    elNext.textContent = (i+1 < L.length && L[i+1]) ? L[i+1].text : '';
    var cells = Array.from(cur.text);
    var n = cells.length;
    var base, max;
    if(n <= 8){ base = 5.4; max = 46; }
    else if(n <= 14){ base = 4.8; max = 42; }
    else if(n <= 22){ base = 3.9; max = 36; }
    else if(n <= 34){ base = 3.1; max = 29; }
    else { base = 2.4; max = 23; }
    elLine.style.fontSize = 'clamp(15px,' + base + 'vw,' + max + 'px)';
    elLine.textContent = '';
    var frag = document.createDocumentFragment(), k, sp;
    for(k=0;k<n;k++){
      sp = document.createElement('span');
      sp.className = 'c';
      sp.textContent = cells[k];
      frag.appendChild(sp);
    }
    elLine.appendChild(frag);
    st.text = cur.text;
  }

  function updateSung(time){
    var L = st.lines, i = st.idx;
    if(i < 0 || i >= L.length) return;
    var cur = L[i];
    var spans = elLine.childNodes, n = spans.length, k;
    if(!n) return;
    var start = cur.t, dur = cur.dur > 0 ? cur.dur : 3.4;
    var chs = cur.chars;
    for(k=0;k<n;k++){
      var tc;
      if(chs && chs.length === n && isFinite(chs[k].t)) tc = chs[k].t;
      else if(chs && chs.length && k < chs.length && isFinite(chs[k].t)) tc = chs[k].t;
      else tc = start + dur * (k / n);
      var on = time >= tc - 0.001;
      if(spans[k].classList.contains('on') !== on) spans[k].classList.toggle('on', on);
    }
  }

  function applyInit(p){
    var song = (p && p.song) || {};
    st.lines = normLines(p && p.lines);
    st.songName = String(song.name == null ? '' : song.name);
    var artists = song.artists;
    if(Array.isArray(artists)) artists = artists.join(' / ');
    artists = String(artists == null ? '' : artists);
    elMeta.textContent = [st.songName, artists].filter(Boolean).join('  ·  ');
    st.idx = -1; lastIdx = -2; st.text = '';
    st.playing = (p && typeof p.playing === 'boolean') ? p.playing : true;
    st.duration = (isFinite(p.duration) && Number(p.duration) > 0) ? Number(p.duration) : 0;
    try{ scheduleQuilt(Array.isArray(p && p.accent) ? p.accent : [180, 96, 58]); }
    catch(e){ st.err = String(e && e.message || e); console.error('[441] rebuild', e); }
    renderLines();
  }

  window.addEventListener('message', function(ev){
    try{
      var d = ev.data;
      if(!d || d.__c100 !== 1) return;
      var p = d.payload || {};
      if(d.type === 'init'){ applyInit(p); }
      else if(d.type === 'tick'){
        if(isFinite(p.time)) st.t = Number(p.time);
        if(typeof p.playing === 'boolean') st.playing = p.playing;
        var i = calcIdx(st.t);
        if(i !== st.idx){ st.idx = i; renderLines(); }
        updateSung(st.t);
      }
      else if(d.type === 'live'){
        if(isFinite(p.level)) live.level = Math.max(0, Math.min(1, Number(p.level) || 0));
        if(isFinite(p.bass)) live.bass = Math.max(0, Math.min(1, Number(p.bass) || 0));
        if(isFinite(p.mid)) live.mid = Math.max(0, Math.min(1, Number(p.mid) || 0));
        if(isFinite(p.treble)) live.treble = Math.max(0, Math.min(1, Number(p.treble) || 0));
        if(typeof p.playing === 'boolean') st.playing = p.playing;
      }
      else if(d.type === 'beat'){ onBeat(p.level); }
    }catch(e){ st.err = String(e && e.message || e); console.error('[441] message', e); }
  });

  var readySent = false;
  function sendReady(){
    if(readySent) return;
    readySent = true;
    try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }
    catch(e){ console.error('[441] ready', e); }
  }

  var lastTs = 0;
  function frame(ts){
    st.frames++;
    if(!readySent) sendReady();
    var t0 = performance.now();
    try{
      if(!lastTs) lastTs = ts;
      var dt = Math.min(0.08, Math.max(0, ((ts || t0) - lastTs) / 1000));
      lastTs = ts || t0;
      animate(dt);
    }catch(e){ st.err = String(e && e.message || e); console.error('[441] frame', e); }
    st.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(sendReady, 700);
  setTimeout(sendReady, 1500);
  /* 兜底底图：即使没有 init 也先铺一层默认色织物 */
  setTimeout(function(){ if(!quiltReady) scheduleQuilt([180, 96, 58]); }, 320);
})();
</script>
