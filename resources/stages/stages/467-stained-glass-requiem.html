<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>彩窗镇魂诗</title>
<style>
  :root{
    --bg0:#070510; --bg1:#120a20;
    --rose1:#3a6fd8; --rose2:#e05a7a; --rose3:#e6b34e; --rose4:#7a5ad6;
    --gold0:#f7e7b4; --gold1:#d9ae55; --gold2:#8a6423;
    --ink:#fff6e2; --ink-dim:rgba(255,246,226,.42);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070510;}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,"Microsoft YaHei",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
  #art{position:fixed;inset:0;pointer-events:none;}
  #rose{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);}
  #rose svg{width:100%;height:100%;display:block}
  .trace{
    position:absolute;top:0;bottom:0;width:clamp(58px,13vw,220px);
    pointer-events:none;opacity:.42;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 18%,#000 72%,rgba(0,0,0,0));
    mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 18%,#000 72%,rgba(0,0,0,0));
  }
  .trace.l{left:0}
  .trace.r{right:0;transform:scaleX(-1)}
  .trace svg{width:100%;height:100%;display:block}
  #frame{
    position:fixed;inset:clamp(8px,1.6vh,20px);pointer-events:none;
    border:1px solid rgba(214,178,102,.22);
    box-shadow:inset 0 0 0 3px rgba(6,4,14,.35);
  }
  #frame i{
    position:absolute;width:clamp(30px,4.4vw,74px);height:clamp(30px,4.4vw,74px);
    border:1.4px solid rgba(230,200,130,.55);
  }
  #frame i.tl{left:-1.4px;top:-1.4px;border-right:0;border-bottom:0}
  #frame i.tr{right:-1.4px;top:-1.4px;border-left:0;border-bottom:0}
  #frame i.bl{left:-1.4px;bottom:-1.4px;border-right:0;border-top:0}
  #frame i.br{right:-1.4px;bottom:-1.4px;border-left:0;border-top:0}
  #clock{
    position:fixed;right:5vw;bottom:4.4vh;pointer-events:none;
    font-size:clamp(10px,1.05vw,14px);letter-spacing:.26em;
    color:rgba(247,231,180,.62);
    text-shadow:0 1px 0 rgba(0,0,0,.9);
  }
  #clock b{color:#f6e3a8;font-weight:400}
  .spin-slow{animation:sp 84s linear infinite;transform-box:view-box;transform-origin:50% 50%}
  .spin-slow2{animation:sp 56s linear infinite reverse;transform-box:view-box;transform-origin:50% 50%}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .spin-slow,.spin-slow2{animation:none} }
  #logo{
    position:fixed;top:4.2vh;left:4vw;pointer-events:none;text-align:left;
    font-size:clamp(10px,1.05vw,15px);letter-spacing:.2em;line-height:1.7;
    color:#f7e7b4;
    text-shadow:0 1px 0 rgba(0,0,0,.9),0 0 14px rgba(217,174,85,.45);
  }
  #logo .nm{font-size:clamp(13px,1.5vw,22px);letter-spacing:.14em;
    background:linear-gradient(180deg,#fff6dd,#e8c473 45%,#9a6f28 70%,#f2dda0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;}
  #logo .ar{opacity:.62;font-size:clamp(9px,.95vw,12px)}
  #logo .rule{width:min(180px,22vw);height:1px;margin:.5em 0 .55em;
    background:linear-gradient(90deg,rgba(247,231,180,.85),rgba(247,231,180,0));}
  #center{
    position:fixed;left:0;right:0;bottom:8.5vh;
    display:flex;flex-direction:column;align-items:center;
    pointer-events:none;
  }
  #lyric{
    max-width:min(76vw,1040px);
    text-align:center;
    font-size:clamp(21px,3.5vw,52px);
    line-height:1.42;
    letter-spacing:.04em;
    white-space:pre-wrap;
    word-break:break-word;
    padding:.16em .5em;
    background:radial-gradient(ellipse at 50% 50%, rgba(6,4,14,.62) 0%, rgba(6,4,14,.34) 58%, rgba(6,4,14,0) 78%);
    border-radius:18px;
  }
  #lyric .ch{
    color:#8a7f9e;
    text-shadow:0 1px 0 rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.75);
    transition:color .1s linear,text-shadow .1s linear;
  }
  #lyric .ch.on{
    color:#ffefc0;
    text-shadow:0 0 2px #fff8e0,0 0 14px rgba(255,206,110,.9),0 0 30px rgba(233,120,150,.6),0 1px 0 #6b3f10;
  }
  #empty{
    display:none;max-width:min(70vw,760px);text-align:center;
    font-size:clamp(14px,1.6vw,22px);letter-spacing:.24em;
    color:#c8b48a;
    padding:.55em 1.1em;border-radius:12px;
    background:rgba(6,4,14,.55);
    border:1px solid rgba(214,178,102,.28);
    text-shadow:0 1px 0 rgba(0,0,0,.8);
  }
  canvas{display:block}
</style>
</head>
<body>
<div id="art"><div class="trace l" id="traceL"></div><div class="trace r" id="traceR"></div></div>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div id="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div id="logo">
  <div class="nm" id="logoName">彩 窗 镇 魂 诗</div>
  <div class="rule"></div>
  <div class="ar" id="logoArt"></div>
</div>
<div id="clock"><b id="clockT">00:00</b> / <span id="clockD">00:00</span></div>
<div id="center">
  <div id="lyric"></div>
  <div id="empty">无 歌 词 · 静 听 彩 窗</div>
</div>

<script>
(function(){
  'use strict';

  /* ---------------- 基础状态 ---------------- */
  var T = {
    time: 0,
    playing: true,
    lines: [],
    idx: -1,
    text: '',
    accent: [224, 90, 122],
    songName: '',
    artists: '',
    cover: '',
    duration: 0,
    frames: 0,
    js: 0,
    err: '',
    rm: false
  };
  var beatLevel = 0, beatIndex = -1;
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 };
  var W = 1440, H = 900;

  try {
    T.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch(e0) { T.rm = false; }

  var elLyric = document.getElementById('lyric');
  var elEmpty = document.getElementById('empty');

  /* ---------------- 自检口：无条件、最外层、直接算 ---------------- */
  window.__stage = function(){
    return {
      lines: T.lines.length,
      idx: T.idx,
      t: T.time,
      playing: !!T.playing,
      frames: T.frames,
      js: T.js,
      err: T.err,
      text: T.text,
      gl: false,
      rm: !!T.rm
    };
  };

  /* ---------------- 玫瑰窗 SVG ---------------- */
  var elArt = document.getElementById('art');
  function hsl(h,s,l,a){ return 'hsla(' + (h|0) + ',' + (s|0) + '%,' + (l|0) + '%,' + a + ')'; }
  function polar(r, ang){ return [200 + Math.cos(ang) * r, 200 + Math.sin(ang) * r]; }
  function hex2(c){ c = Math.max(0, Math.min(255, Math.round(c))); var s = c.toString(16); return s.length < 2 ? '0' + s : s; }
  function rgb2hex(a){ return '#' + hex2(a[0]) + hex2(a[1]) + hex2(a[2]); }

  /* 齿轮齿形 path（固定点数，clamp） */
  function gear(r, teeth, depth){
    teeth = Math.max(6, Math.min(40, teeth | 0 || 8));
    var p = [], i, n = teeth * 2;
    for (i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      var rr = (i % 2 === 0) ? r : r - depth;
      var q = polar2(rr, a);
      p.push((i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1));
    }
    return p.join(' ') + ' Z';
  }
  function polar2(r, ang){ return [200 + Math.cos(ang) * r, 200 + Math.sin(ang) * r]; }

  function roseLobes(N, r1, r2, sw, op, rot, hueA, hueB){
    var i, out = '';
    for (i = 0; i < N; i++) {
      var a0 = (i / N) * Math.PI * 2 + rot;
      var wide = (Math.PI / N) * 0.62;
      var a1 = a0 - wide, a2 = a0 + wide;
      var p0 = polar(r1 * 0.24, a0);
      var p1 = polar(r1, a1), p2 = polar(r2, a0), p3 = polar(r1, a2);
      var hue = hueA + (hueB - hueA) * (i / N);
      out += '<path d="M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) +
             ' C' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' ' +
             p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + ' ' +
             p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) +
             ' C' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + ' ' +
             p3[0].toFixed(1) + ' ' + p3[1].toFixed(1) + ' ' +
             p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) +
             '" fill="' + hsl(hue, 74, 52, op) + '" stroke="#f0dca6" stroke-width="' + sw + '" stroke-opacity=".55"/>';
    }
    return out;
  }

  function buildArt(){
    try {
    var ac = T.accent;
    var hueA = 330, hueB = 205;
    var rgbC = 'rgb(' + ac[0] + ',' + ac[1] + ',' + ac[2] + ')';

    /* 尺寸绑定到画布口径，保证玫瑰窗与弹幕/星芒同圆心 */
    R0 = Math.min(W, H) * .375;
    cx0 = W * .5;
    cy0 = H * .42;
    var sz = Math.max(120, Math.round(R0 * 2 * 1.08));
    var host = document.getElementById('rose');
    if (!host) {
      host = document.createElement('div');
      host.id = 'rose';
      elArt.appendChild(host);
    }
    host.style.width = sz + 'px';
    host.style.height = sz + 'px';
    if (host.__accent === rgbC + '|' + sz + '|' + T.songName) return;
    host.__accent = rgbC + '|' + sz + '|' + T.songName;

    var s = '<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
    s += '<defs>';
    s += '<radialGradient id="glass" cx="50%" cy="46%" r="52%">';
    s += '<stop offset="0%" stop-color="#fff4cf" stop-opacity=".92"/>';
    s += '<stop offset="34%" stop-color="' + hsl(hueA, 86, 74, .95) + '"/>';
    s += '<stop offset="58%" stop-color="' + rgbC + '"/>';
    s += '<stop offset="78%" stop-color="#3a3fa8"/>';
    s += '<stop offset="100%" stop-color="#120a26"/>';
    s += '</radialGradient>';
    s += '<radialGradient id="core" cx="50%" cy="50%" r="50%">';
    s += '<stop offset="0%" stop-color="#fffbe8"/>';
    s += '<stop offset="55%" stop-color="#ffe9a8" stop-opacity=".75"/>';
    s += '<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>';
    s += '</radialGradient>';
    s += '<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">';
    s += '<feGaussianBlur stdDeviation="2.6"/></filter>';
    s += '<clipPath id="disc"><circle cx="200" cy="200" r="182"/></clipPath>';
    s += '</defs>';

    /* 背面柔光 */
    s += '<circle cx="200" cy="200" r="196" fill="url(#glass)" opacity=".38" filter="url(#soft)"/>';

    /* 外圈齿轮 */
    s += '<g opacity=".34" fill="none" stroke="#c9a860" stroke-width="1.1">';
    s += '<path d="' + gear(190, 36, 9) + '"/>';
    s += '<path d="' + gear(172, 24, 7) + '"/>';
    s += '</g>';

    /* 主体：玻璃盘面 */
    s += '<g clip-path="url(#disc)">';
    s += '<circle cx="200" cy="200" r="182" fill="url(#glass)"/>';

    /* 玻璃铅条格纹：放射 24 + 同心 7，只算一次 */
    s += '<g stroke="#0a0614" stroke-opacity=".55" stroke-width="1.05" fill="none">';
    var i;
    for (i = 0; i < 24; i++) {
      var a = (i / 24) * Math.PI * 2;
      var pA = polar(20, a), pB = polar(184, a);
      s += '<line x1="' + pA[0].toFixed(1) + '" y1="' + pA[1].toFixed(1) + '" x2="' + pB[0].toFixed(1) + '" y2="' + pB[1].toFixed(1) + '"/>';
    }
    var rr = [34, 58, 84, 112, 140, 164, 180];
    for (i = 0; i < rr.length; i++) s += '<circle cx="200" cy="200" r="' + rr[i] + '"/>';
    s += '</g>';

    /* 花瓣层 */
    s += '<g class="spin-slow">' + roseLobes(12, 96, 176, 1.1, .5, 0, 335, 265) + '</g>';
    s += '<g class="spin-slow2">' + roseLobes(8, 52, 108, 1.2, .58, 0.39, 45, 15) + '</g>';
    s += '<g class="spin-slow" style="animation-duration:41s">' + roseLobes(16, 30, 64, 1, .5, 0.19, 190, 300) + '</g>';

    /* 中心徽章 */
    s += '<circle cx="200" cy="200" r="34" fill="url(#core)"/>';
    s += '<circle cx="200" cy="200" r="26" fill="none" stroke="#f6e3a8" stroke-width="1.4" stroke-opacity=".85"/>';
    s += '<circle cx="200" cy="200" r="19" fill="none" stroke="#f6e3a8" stroke-width=".7" stroke-opacity=".5"/>';

    s += '</g>'; /* clip */

    /* 外铅条 + 金属外框 */
    s += '<circle cx="200" cy="200" r="182" fill="none" stroke="#0a0614" stroke-width="5" stroke-opacity=".8"/>';
    s += '<circle cx="200" cy="200" r="185" fill="none" stroke="#e6c882" stroke-width="1.6" stroke-opacity=".7"/>';
    s += '<circle cx="200" cy="200" r="192" fill="none" stroke="#8a6423" stroke-width=".8" stroke-opacity=".55"/>';

    /* 悬浮尘光（静态点，微小） */
    s += '</svg>';
    host.innerHTML = s;
    } catch (eArt) {
      T.err = String(eArt && eArt.message || eArt);
      console.error('[467] buildArt', eArt);
    }
  }

  /* ---------------- 侧廊花窗（哥特尖拱，静态一次） ---------------- */
  function buildTrace(){
    try {
      var host = document.getElementById('traceL');
      if (!host) return;
      var H2 = 560, Wd = 200, i, j;
      var s = '<svg viewBox="0 0 ' + Wd + ' ' + H2 + '" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
      var ac = T.accent;
      var hue = 268;
      for (i = 0; i < 5; i++) {
        var y0 = 26 + i * 106, hgt = 96, x0 = 34, wid = 132;
        /* 尖拱轮廓 */
        s += '<path d="M' + x0 + ' ' + (y0 + hgt) + ' L' + x0 + ' ' + (y0 + hgt * .45) +
             ' Q' + (x0 + wid * .5) + ' ' + (y0 - hgt * .55) + ' ' + (x0 + wid) + ' ' + (y0 + hgt * .45) +
             ' L' + (x0 + wid) + ' ' + (y0 + hgt) + ' Z" fill="' +
             hsl(hue + i * 14, 62, 46, .26) + '" stroke="rgba(230,200,130,.55)" stroke-width="1.1"/>';
        /* 竖棂 */
        for (j = 1; j < 4; j++) {
          s += '<line x1="' + (x0 + wid * j / 4).toFixed(1) + '" y1="' + (y0 + 12) +
               '" x2="' + (x0 + wid * j / 4).toFixed(1) + '" y2="' + (y0 + hgt - 4) +
               '" stroke="rgba(10,6,20,.55)" stroke-width=".9"/>';
        }
        /* 拱内小圆花 */
        s += '<circle cx="' + (x0 + wid * .5) + '" cy="' + (y0 + hgt * .34) + '" r="15" fill="none" stroke="rgba(230,200,130,.7)" stroke-width="1.1"/>';
        s += '<circle cx="' + (x0 + wid * .5) + '" cy="' + (y0 + hgt * .34) + '" r="6" fill="' + hsl(340, 70, 56, .35) + '" stroke="rgba(230,200,130,.55)" stroke-width=".8"/>';
      }
      s += '<line x1="8" y1="0" x2="8" y2="' + H2 + '" stroke="rgba(214,178,102,.3)" stroke-width="1"/>';
      s += '</svg>';
      host.innerHTML = s;
      var r = document.getElementById('traceR');
      if (r) r.innerHTML = s;
    } catch (e) {
      T.err = String(e && e.message || e);
      console.error('[467] trace', e);
    }
  }

  function measure(){
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = Math.max(320, Math.round(w));
    H = Math.max(320, Math.round(h));
  }
  measure();

  var bgStatic = null, cxs = null;

  var cvBg = document.getElementById('bg');
  var cvFx = document.getElementById('fx');
  var cxBg = cvBg.getContext('2d');
  var cxFx = cvFx.getContext('2d');
  var dpr = 1;

  function buildStaticBg(){
    bgStatic = document.createElement('canvas');
    bgStatic.width = Math.round(W * dpr);
    bgStatic.height = Math.round(H * dpr);
    cxs = bgStatic.getContext('2d');
    cxs.setTransform(dpr, 0, 0, dpr, 0, 0);
    var g = cxs.createRadialGradient(W * .5, H * .45, 0, W * .5, H * .45, Math.max(W, H) * .8);
    g.addColorStop(0, '#221338');
    g.addColorStop(.40, '#0f0919');
    g.addColorStop(1, '#040309');
    cxs.fillStyle = g;
    cxs.fillRect(0, 0, W, H);
    var n = Math.min(150, Math.round(W * H / 13000));
    var i, x, y, r;
    for (i = 0; i < n; i++) {
      x = Math.random() * W; y = Math.random() * H;
      r = Math.random() * 1.05 + .22;
      cxs.globalAlpha = .12 + Math.random() * .42;
      cxs.fillStyle = (i % 5 === 0) ? '#f7e7b4' : '#ffffff';
      cxs.beginPath(); cxs.arc(x, y, r, 0, 6.2832); cxs.fill();
    }
    cxs.globalAlpha = 1;
  }

  function sizeCanvas(){
    measure();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var i;
    for (i = 0; i < 2; i++) {
      var c = i ? cvFx : cvBg;
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
      c.style.width = W + 'px';
      c.style.height = H + 'px';
      (i ? cxFx : cxBg).setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    buildStaticBg();
  }
  sizeCanvas();

  /* ---------------- 歌词：LRC 均分时间 ---------------- */
  function charTimes(ln){
    var txt = (typeof ln.text === 'string') ? ln.text : '';
    var n = Math.min(txt.length, 600);
    if (!n) return null;
    var t0 = (typeof ln.t === 'number' && isFinite(ln.t)) ? ln.t : 0;
    var d = (typeof ln.dur === 'number' && isFinite(ln.dur) && ln.dur > 0) ? ln.dur : 0;
    var cs = ln.chars;
    if (cs && cs.length) {
      var out = [], k, m = Math.min(n, cs.length);
      for (k = 0; k < m; k++) {
        var ct = (cs[k] && typeof cs[k].t === 'number' && isFinite(cs[k].t)) ? cs[k].t : t0;
        out.push(ct);
      }
      while (out.length < n) out.push(t0 + d);
      return out;
    }
    if (!d) d = Math.max(0.35, n * 0.22);
    var arr = [], i;
    for (i = 0; i < n; i++) arr.push(t0 + d * (i / n));
    return arr;
  }

  /* ---------------- 长句自适应字号 ---------------- */
  var fitLevel = 0, fitKey = '';
  function fitLyric(){
    var L = T.lines;
    var txt = (T.idx >= 0 && T.idx < L.length) ? L[T.idx].text : '';
    var key = T.idx + '|' + txt.length + '|' + W + 'x' + H;
    if (key === fitKey) return;
    fitKey = key;
    if (!txt) { elLyric.style.fontSize = ''; fitLevel = 0; return; }
    var len = txt.length;
    var base = Math.max(19, Math.min(52, Math.min(W * .035, H * .088)));
    var size = base;
    /* 视觉宽：全角按 1，半角按 .55 */
    if (len > 9) size = base * (9 / len) + base * .42;
    if (len > 30) size = Math.max(16, Math.min(size, base * .62));
    if (len > 60) size = Math.max(14, Math.min(size, base * .45));
    /* 手机竖屏再压 */
    if (W < 560) size = Math.min(size, W * .062);
    size = Math.max(13, Math.min(base, size));
    fitLevel = size;
    elLyric.style.fontSize = size.toFixed(1) + 'px';
  }

  function normLines(src){
    var out = [], i, n = 0;
    if (!src || !src.length) return out;
    var lim = Math.min(src.length, 4000);
    for (i = 0; i < lim; i++) {
      var ln = src[i];
      if (!ln) continue;
      var txt = (typeof ln.text === 'string') ? ln.text : (ln.text == null ? '' : String(ln.text));
      var t = (typeof ln.t === 'number' && isFinite(ln.t)) ? ln.t : 0;
      var d = (typeof ln.dur === 'number' && isFinite(ln.dur) && ln.dur > 0) ? ln.dur : 0;
      out.push({ t: t, dur: d, text: txt, ct: charTimes(ln) });
      n++;
    }
    return out;
  }

  function pickIdx(t){
    var L = T.lines;
    if (!L.length) return -1;
    if (t < L[0].t) return -1;
    var lo = 0, hi = L.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (L[mid].t <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  /* ---------------- 光斑贴图（预渲染，避免每帧建渐变） ---------------- */
  var sprGold = null, sprRose = null, sprIce = null, sprPetalRose = null, sprPetalGold = null, sprVig = null;
  function makeSprite(cr, cg, cb){
    var s = document.createElement('canvas');
    s.width = 64; s.height = 64;
    var c = s.getContext('2d');
    var g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,.95)');
    g.addColorStop(.22, 'rgba(' + cr + ',' + cg + ',' + cb + ',.85)');
    g.addColorStop(.55, 'rgba(' + cr + ',' + cg + ',' + cb + ',.22)');
    g.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(32, 32, 32, 0, 6.2832); c.fill();
    return s;
  }
  function makeSprites(){
    sprGold = makeSprite(255, 226, 150);
    sprRose = makeSprite(255, 150, 190);
    sprIce  = makeSprite(170, 210, 255);
    sprPetalRose = makePetal(255, 176, 205);
    sprPetalGold = makePetal(255, 214, 150);
    sprVig = makeVignette();
  }

  function makePetal(cr, cg, cb){
    var s = document.createElement('canvas');
    s.width = 32; s.height = 32;
    var c = s.getContext('2d');
    c.translate(16, 16);
    c.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',.95)';
    c.beginPath();
    c.ellipse(0, 0, 14, 7.5, 0, 0, 6.2832);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,.5)';
    c.beginPath();
    c.ellipse(-2, -2, 6, 3, 0, 0, 6.2832);
    c.fill();
    return s;
  }

  var sprGold = null, sprRose = null, sprIce = null, sprPetalRose = null, sprPetalGold = null, sprVig = null;

  function makeVignette(){
    var s = document.createElement('canvas');
    var w = 512, h = 512;
    s.width = w; s.height = h;
    var c = s.getContext('2d');
    var g = c.createRadialGradient(w * .5, h * .45, h * .18, w * .5, h * .45, h * .78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(.62, 'rgba(0,0,0,.16)');
    g.addColorStop(1, 'rgba(0,0,0,.66)');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    return s;
  }

  makeSprites();

  /* ---------------- 碎玻璃 / 樱花 / 弹幕 ---------------- */
  var petals = [], bullets = [], sparks = [];
  function rnd(a, b){ return a + Math.random() * (b - a); }

  function seedParticles(){
    petals.length = 0; bullets.length = 0; sparks.length = 0;
    var np = Math.max(14, Math.min(44, Math.round(W * H / 24000)));
    var i;
    for (i = 0; i < np; i++) {
      petals.push({
        x: Math.random() * W, y: Math.random() * H,
        r: rnd(2.2, 7.5), vy: rnd(14, 46), vx: rnd(-16, 16),
        rot: rnd(0, 6.28), vr: rnd(-1.4, 1.4), ph: rnd(0, 6.28),
        sw: rnd(.5, 1.6), hue: Math.random() < .35 ? 330 : 38
      });
    }
    var nb = Math.max(16, Math.min(46, Math.round(W * H / 22000)));
    for (i = 0; i < nb; i++) {
      var ang = rnd(0, 6.28), rad = rnd(.18, .52);
      bullets.push({ ang: ang, rad: rad, sp: rnd(.06, .34) * (Math.random() < .5 ? 1 : -1),
        size: rnd(4, 13), k: i % 3, ph: rnd(0, 6.28), wob: rnd(.4, 1.8) });
    }
    var njs = Math.max(30, Math.min(90, Math.round(W * H / 15000)));
    for (i = 0; i < njs; i++) {
      sparks.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(.6, 2.1),
        vy: rnd(-14, -3), vx: rnd(-6, 6), a: rnd(.15, .7), ph: rnd(0, 6.28) });
    }
  }
  seedParticles();

  /* ---------------- 歌词渲染 ---------------- */
  var curLineKey = '';
  function renderLyric(){
    var L = T.lines;
    if (!L.length) {
      elEmpty.style.display = 'block';
      elLyric.innerHTML = '';
      elLyric.style.display = 'none';
      T.text = '';
      curLineKey = 'empty';
      return;
    }
    elEmpty.style.display = 'none';
    elLyric.style.display = 'block';
    var i = T.idx;
    var txt = (i >= 0 && i < L.length) ? L[i].text : '';
    T.text = txt;
    var key = i + '|' + txt;
    if (key === curLineKey) return;
    curLineKey = key;
    litN = -1;
    elLyric.innerHTML = '';
    if (!txt) return;
    var frag = document.createDocumentFragment();
    var len = txt.length;
    /* 超长句不做逐字 span，避免 DOM 爆炸 */
    if (len > 220) {
      var whole = document.createElement('span');
      whole.className = 'ch on';
      whole.textContent = txt;
      whole.__on = true;
      elLyric.appendChild(whole);
      fitLyric();
      return;
    }
    var n = Math.min(len, 220), k, ch, sp;
    for (k = 0; k < n; k++) {
      ch = txt.charAt(k);
      sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = ch;
      frag.appendChild(sp);
    }
    elLyric.appendChild(frag);
    fitLyric();
  }

  /* ---------------- 逐字点亮（只改变了的字） ---------------- */
  var litN = -1;
  function paintChars(force){
    var L = T.lines;
    if (!L.length) return;
    var i = T.idx;
    if (i < 0 || i >= L.length) { litN = -1; return; }
    var ln = L[i];
    var ct = ln.ct;
    var n = elLyric.children.length;
    if (!n) return;
    var t = T.time, j, lit = 0;
    if (ct) {
      var lim = Math.min(n, ct.length);
      for (j = 0; j < lim; j++) if (ct[j] <= t) lit++;
    }
    if (!force && lit === litN) return;
    litN = lit;
    for (j = 0; j < n; j++) {
      var c = elLyric.children[j];
      var on = j < lit;
      if (c.__on === on) continue;
      c.__on = on;
      c.className = on ? 'ch on' : 'ch';
    }
  }

  /* ---------------- 消息 ---------------- */
  var elLogoName = document.getElementById('logoName');
  var elLogoArt = document.getElementById('logoArt');
  function applyLogo(){
    try {
      if (elLogoName && T.songName) elLogoName.textContent = T.songName;
      else if (elLogoName) elLogoName.textContent = '彩 窗 镇 魂 诗';
      if (elLogoArt) elLogoArt.textContent = T.artists || '';
    } catch (e) { console.error('[467] logo', e); }
  }

  function applyInit(p){
    p = p || {};
    var song = p.song || {};
    T.songName = (song && typeof song.name === 'string') ? song.name : '';
    var ar = song ? song.artists : '';
    if (Object.prototype.toString.call(ar) === '[object Array]') {
      var parts = [], ai, alim = Math.min(ar.length, 8);
      for (ai = 0; ai < alim; ai++) if (ar[ai] != null) parts.push(String(ar[ai]));
      T.artists = parts.join(' / ');
    } else if (typeof ar === 'string') T.artists = ar;
    else T.artists = '';
    T.cover = (typeof song.cover === 'string') ? song.cover : '';
    var ac = p.accent;
    if (ac && ac.length >= 3) {
      var r = Math.max(0, Math.min(255, +ac[0] || 0));
      var g = Math.max(0, Math.min(255, +ac[1] || 0));
      var b = Math.max(0, Math.min(255, +ac[2] || 0));
      T.accent = [r, g, b];
    }
    T.duration = (typeof p.duration === 'number' && isFinite(p.duration) && p.duration > 0) ? p.duration : 0;
    T.lines = normLines(p.lines);
    curLineKey = '';
    litN = -1;
    T.idx = pickIdx(T.time);
    applyLogo();
    buildTrace();
    buildArt();
    renderLyric();
    paintChars(true);
  }

  window.addEventListener('message', function(ev){
    try {
      var d = ev.data;
      if (!d || d.__c100 !== 1) return;
      var p = d.payload || {};
      if (d.type === 'init') { applyInit(p); }
      else if (d.type === 'tick') {
        if (typeof p.time === 'number' && isFinite(p.time)) T.time = p.time;
        if (typeof p.playing === 'boolean') T.playing = p.playing;
        T.idx = pickIdx(T.time);
        renderLyric();
      } else if (d.type === 'beat') {
        beatLevel = (typeof p.level === 'number' && isFinite(p.level)) ? Math.max(0, Math.min(1, p.level)) : 0;
        beatIndex = (typeof p.index === 'number') ? p.index : beatIndex;
        beatFlash = Math.max(beatFlash, beatLevel);
      } else if (d.type === 'live') {
        live.bpm = +p.bpm || 0;
        live.level = +p.level || 0;
        live.bass = +p.bass || 0;
        live.mid = +p.mid || 0;
        live.treble = +p.treble || 0;
        if (typeof p.playing === 'boolean') T.playing = p.playing;
      }
    } catch (e) {
      T.err = String(e && e.message || e);
      console.error('[467] message', e);
    }
  }, false);

  /* ---------------- 时钟读数 ---------------- */
  var elClockT = document.getElementById('clockT');
  var elClockD = document.getElementById('clockD');
  var clockKey = '';
  function fmt(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), q = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (q < 10 ? '0' : '') + q;
  }
  function paintClock(){
    var key = fmt(T.time) + '|' + fmt(T.duration);
    if (key === clockKey) return;
    clockKey = key;
    if (elClockT) elClockT.textContent = fmt(T.time);
    if (elClockD) elClockD.textContent = fmt(T.duration);
  }

  /* ---------------- 帧循环 ---------------- */
  var cx0 = 0, cy0 = 0, R0 = 100, pulse = 0, ang0 = 0;
  var lastNow = 0, dtSec = 0.016;
  var beatFlash = 0;
  var glowEl = document.getElementById('art');

  function drawScene(now){
    var dt = dtSec;
    var spd = T.rm ? .25 : 1;
    var breath = T.playing ? 1 : .35;
    pulse += (beatLevel * .9 + live.bass * .55 + live.level * .25 - pulse) * Math.min(1, dt * 7);
    beatFlash *= Math.pow(.12, dt);
    ang0 += dt * .09 * spd * breath;

    R0 = Math.min(W, H) * .375;
    cx0 = W * .5;
    cy0 = H * .42;

    /* 底：只做整块贴图 + 一次居中光晕贴图，不再每帧建渐变 */
    cxBg.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (bgStatic) cxBg.drawImage(bgStatic, 0, 0, W, H);
    var gsz = Math.max(W, H) * .92;
    cxBg.globalCompositeOperation = 'lighter';
    cxBg.globalAlpha = .18 + pulse * .30;
    cxBg.drawImage(sprGold, cx0 - gsz * .5, cy0 - gsz * .5, gsz, gsz);
    cxBg.globalAlpha = 1;
    cxBg.globalCompositeOperation = 'source-over';
    /* 钟摆式摆光：极淡扇面 */
    var sAng = Math.sin(ang0 * 2.2) * 1.15;
    cxBg.globalAlpha = .045 + pulse * .05;
    cxBg.fillStyle = '#ffeec2';
    cxBg.beginPath();
    cxBg.moveTo(cx0, cy0 - R0 * 1.05);
    cxBg.arc(cx0, cy0 - R0 * 1.05, R0 * 2.2, Math.PI * .5 + sAng - .16, Math.PI * .5 + sAng + .16);
    cxBg.closePath(); cxBg.fill();
    cxBg.globalAlpha = 1;

    /* 前景特效层 */
    cxFx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cxFx.clearRect(0, 0, W, H);
    cxFx.globalCompositeOperation = 'lighter';

    /* 弹幕环 */
    var i, b, spiralA = ang0 * 1.6;
    for (i = 0; i < bullets.length; i++) {
      b = bullets[i];
      b.ang += b.sp * dt * spd;
      var rr2 = b.rad * R0 * (1 + Math.sin(b.ph + now * .0007) * .04);
      var px = cx0 + Math.cos(b.ang) * rr2;
      var py = cy0 + Math.sin(b.ang) * rr2 * .98;
      var sz = b.size * (1 + pulse * .5);
      cxFx.globalAlpha = .30 + pulse * .35 + Math.sin(b.ph + now * .002) * .10;
      var spr = b.k === 0 ? sprGold : (b.k === 1 ? sprRose : sprIce);
      cxFx.drawImage(spr, px - sz, py - sz, sz * 2, sz * 2);
    }
    cxFx.globalAlpha = 1;

    /* 漂浮金尘 */
    for (i = 0; i < sparks.length; i++) {
      var s = sparks[i];
      s.y += s.vy * dt * spd;
      s.x += s.vx * dt * spd;
      if (s.y < -8) { s.y = H + 8; s.x = Math.random() * W; }
      if (s.x < -8) s.x = W + 8; else if (s.x > W + 8) s.x = -8;
      cxFx.globalAlpha = s.a * (.45 + .55 * Math.sin(s.ph + now * .0016));
      cxFx.fillStyle = '#ffe9b0';
      cxFx.beginPath(); cxFx.arc(s.x, s.y, s.r, 0, 6.2832); cxFx.fill();
    }
    cxFx.globalAlpha = 1;

    /* 樱瓣：用预渲染贴图，避免每瓣 save/rotate/ellipse 的路径开销 */
    cxFx.globalCompositeOperation = 'source-over';
    for (i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy * dt * breath * spd;
      p.x += (p.vx + Math.sin(p.ph + now * .0009) * 26) * dt * spd;
      p.rot += p.vr * dt * spd;
      if (p.y > H + 14) { p.y = -14; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      var pw = p.r * (1.35 + .35 * Math.abs(Math.cos(p.rot)));
      var ph2 = p.r * 1.1;
      cxFx.globalAlpha = .78;
      cxFx.drawImage(p.hue === 330 ? sprPetalRose : sprPetalGold, p.x - pw, p.y - ph2, pw * 2, ph2 * 2);
    }
    cxFx.globalAlpha = 1;

    /* 中心星芒 */
    cxFx.globalCompositeOperation = 'lighter';
    var cg = 46 * (1 + pulse * .35);
    cxFx.globalAlpha = .55 + pulse * .4;
    cxFx.drawImage(sprGold, cx0 - cg, cy0 - cg, cg * 2, cg * 2);
    cxFx.globalAlpha = 1;
    cxFx.globalCompositeOperation = 'source-over';

    /* 暗角：静态预渲染贴图 */
    if (sprVig) cxFx.drawImage(sprVig, 0, 0, W, H);

    /* 律动统一驱动 CSS */
    if (glowEl) glowEl.style.opacity = (0.72 + pulse * 0.28).toFixed(3);
  }

  function loop(now){
    var ms = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    try {
      T.frames++;
      var a = (typeof now === 'number') ? now : ms;
      if (lastNow) {
        var d = (a - lastNow) / 1000;
        dtSec = (d > 0 && d < .25) ? d : .016;
      }
      lastNow = a;
      drawScene(a);
      paintChars(false);
      paintClock();
    } catch (e) {
      T.err = String(e && e.message || e);
      console.error('[467] frame', e);
    }
    T.js = Math.round((((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - ms) * 100) / 100;
    requestAnimationFrame(loop);
  }

  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try {
      parent.postMessage({ __c100: 1, type: 'ready' }, '*');
    } catch (e) {
      console.error('[467] ready', e);
    }
  }

  window.addEventListener('resize', function(){
    try { sizeCanvas(); } catch (e) { console.error('[467] resize', e); }
  }, false);

  requestAnimationFrame(function(ts){
    sendReady();
    T.frames++;
    requestAnimationFrame(loop);
  });

  /* 静态主视觉在第一帧之后异步构建，不阻塞 ready */
  setTimeout(function(){
    try {
      buildTrace();
      buildArt();
      applyLogo();
      renderLyric();
      paintChars(true);
    } catch (e) {
      console.error('[467] build', e);
      T.err = String(e && e.message || e);
    }
  }, 0);

  setTimeout(sendReady, 1200);
})();
</script>
</body>
</html>
