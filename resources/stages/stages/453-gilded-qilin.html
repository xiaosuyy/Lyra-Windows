<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九尾鎏金</title>
<style>
  :root{
    --gold:#f6cf6a; --gold-hi:#ffeab0; --jade:#3fd6a8;
    --ink:#05070a;
    --accent:246,207,106;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070a;}
  body{
    font-family:"Noto Serif SC","Songti SC","Source Han Serif SC",serif;
    color:#f0e2c0;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;}
  #bg{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 50% 112%, rgba(31,120,96,.30), transparent 60%),
      radial-gradient(80% 60% at 50% 18%, rgba(120,86,26,.22), transparent 70%),
      linear-gradient(180deg,#04060a 0%, #070a10 46%, #030507 100%);
  }
  #glow{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(closest-side at 50% 52%, rgba(var(--accent),.16), transparent 72%);
    opacity:.9;
  }
  #veil{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(3,5,8,.55) 0%,rgba(3,5,8,0) 26%,rgba(3,5,8,0) 52%,rgba(3,5,8,.82) 100%);
  }
  canvas#totem,canvas#dust{position:absolute;inset:0;width:100%;height:100%;display:block;}
  canvas#dust{pointer-events:none;}

  #lyrics{
    position:absolute;left:0;right:0;bottom:0;
    padding:0 5vw 5.6vh;
    display:flex;flex-direction:column;align-items:center;
    gap:.34em;text-align:center;
    pointer-events:none;
    contain:layout style;
    min-height:min(34vh,320px);
    justify-content:flex-end;
  }
  .line{
    max-width:min(94vw,1240px);
    font-size:clamp(19px,3.05vw,44px);
    line-height:1.48;
    letter-spacing:.055em;
    opacity:0;
    transform:translateY(16px);
    transition:opacity .45s ease,transform .55s cubic-bezier(.22,.7,.25,1);
    will-change:opacity,transform;
    text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 40px rgba(0,0,0,.6);
  }
  .line.on{opacity:1;transform:translateY(0);}
  .line.dim{opacity:.38;transform:translateY(-4px) scale(.90);filter:saturate(.55);}
  .ch{display:inline-block;white-space:pre;color:#8d8266;transition:color .18s linear;}
  .ch.sung{
    color:#ffe6a3;
    text-shadow:0 0 12px rgba(255,196,84,.45),0 2px 16px rgba(0,0,0,.85);
  }
  .line.on .ch.sung{color:#fff2cb;}
  .empty{
    font-size:clamp(14px,1.6vw,20px);
    letter-spacing:.4em;
    color:#b8a679;opacity:.55;
    padding-bottom:.4em;
  }
  #meta{
    position:absolute;left:0;right:0;top:0;
    padding:3.0vh 6vw 0;
    display:flex;flex-direction:column;gap:.36em;
    align-items:center;text-align:center;pointer-events:none;
  }
  #meta .nm{
    font-size:clamp(11px,1.05vw,15px);
    letter-spacing:.4em;text-transform:uppercase;
    color:#c8a86a;opacity:.7;
    max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-shadow:0 1px 10px rgba(0,0,0,.9);
  }
  #meta .rule{
    width:clamp(70px,9vw,130px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(230,192,110,.8),transparent);
  }
  @media (max-aspect-ratio: 3/4){
    #lyrics{padding-bottom:8vh;}
    .line{font-size:clamp(18px,5.6vw,30px);}
    #meta{padding-top:2.2vh;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <canvas id="totem"></canvas>
  <canvas id="dust"></canvas>
  <div id="glow"></div>
  <div id="veil"></div>
  <div id="meta"><div class="nm" id="songName"></div><div class="rule"></div></div>
  <div id="lyrics"></div>
</div>
<script>
(function(){
  'use strict';

  var RM = false;
  try { RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e) { console.error('[453] rm', e); }

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', text: '', gl: false, rm: RM,
    dur: 0, accent: [246,207,106], song: { name: '', artists: '', cover: '' },
    inited: false
  };

  // ---- 协议自检口：最外层无条件赋值 ----
  window.__stage = function(){
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: S.t,
      playing: S.playing,
      frames: S.frames,
      js: S.js,
      err: S.err,
      text: S.text,
      gl: S.gl,
      rm: S.rm
    };
  };

  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e) { console.error('[453] ready', e); }
  }

  // ---- DOM ----
  var $ = function(id){ return document.getElementById(id); };
  var elLyrics = $('lyrics'), elName = $('songName');

  function toTime(v){ v = Number(v); return isFinite(v) && v > 0 ? v : 0; }

  function normLines(raw){
    var out = [], i, L, n;
    if (!raw || typeof raw.length !== 'number') return out;
    n = Math.min(raw.length, 4000);
    for (i = 0; i < n; i++){
      L = raw[i];
      if (!L || typeof L !== 'object') continue;
      var txt = (L.text == null) ? '' : String(L.text);
      if (!txt) continue;
      var chars = null, c, cs = L.chars;
      if (cs && typeof cs.length === 'number' && cs.length){
        chars = [];
        var m = Math.min(cs.length, 600);
        for (c = 0; c < m; c++){
          var cc = cs[c];
          chars.push({ c: (cc && cc.c != null) ? String(cc.c) : '', t: toTime(cc && cc.t) });
        }
      }
      out.push({ t: toTime(L.t), dur: toTime(L.dur), text: txt, chars: chars });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    return out;
  }

  function ensureEl(i){
    var L = S.lines[i];
    if (!L) return null;
    if (L.el) return L.el;
    var d = document.createElement('div');
    d.className = 'line';
    var txt = L.text, k, n = Math.min(txt.length, 800);
    var spans = [];
    for (k = 0; k < n; k++){
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = txt.charAt(k);
      d.appendChild(s);
      spans.push(s);
    }
    d._spans = spans;
    L.el = d;
    return d;
  }

  function csFont(el, fallback){
    var fs = 0;
    try {
      if (window.getComputedStyle){
        fs = parseFloat(window.getComputedStyle(el).fontSize);
      }
    } catch(e){ fs = 0; }
    if (!isFinite(fs) || fs <= 0) fs = fallback;
    return fs;
  }

  function fitEl(el){
    if (!el) return;
    try {
      el.style.fontSize = '';
      var avail = elLyrics.clientWidth || Math.max(240, view.w * 0.88);
      var fs = csFont(el, Math.min(44, Math.max(19, view.w * 0.0305)));
      var lh = fs * 1.48;
      var h = el.getBoundingClientRect().height || 0;
      var maxH = lh * 2.35;
      if (h > maxH && h > 0){
        el.style.fontSize = Math.max(12, Math.floor(fs * maxH / h)) + 'px';
      }
      el.style.whiteSpace = 'nowrap';
      var w = el.scrollWidth || 0;
      el.style.whiteSpace = '';
      if (w > avail * 0.98 && w > 0){
        var fs2 = csFont(el, fs);
        el.style.fontSize = Math.max(12, Math.floor(fs2 * avail * 0.96 / w)) + 'px';
      }
    } catch(e){
      console.error('[453] fit', e);
    }
  }

  function rebuild(){
    var i, old = elLyrics.querySelectorAll('.line');
    for (i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    var em = elLyrics.querySelector('.empty');
    if (em) em.parentNode.removeChild(em);

    for (i = 0; i < S.lines.length; i++){
      var L = S.lines[i];
      L.el = null; L._on = false; L._dim = false;
    }
    S.idx = -1;
    S._lastK = -99;

    if (!S.lines.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '· 此 曲 无 词 ·';
      elLyrics.appendChild(e);
      S.text = '';
      return;
    }
    setActive(findByTime(S.t), true);
  }

  function findByTime(t){
    var lo = 0, hi = S.lines.length - 1, ans = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (S.lines[mid].t <= t + 1e-4){ ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function setActive(idx, force){
    if (!force && idx === S.idx) return;
    var prev = S.idx;
    S.idx = idx;
    S._lastK = -99;

    var i, j;
    if (prev >= 0 && S.lines[prev] && S.lines[prev].el && prev !== idx){
      var pe = S.lines[prev].el;
      pe.className = 'line';
      pe.style.display = 'none';
    }
    // 仅保留「当前 + 上一句」在 DOM 内的可见窗口
    for (i = 0; i < S.lines.length; i++){
      var L = S.lines[i];
      if (!L.el) continue;
      if (i !== idx && i !== idx - 1){
        if (L.el.style.display !== 'none') L.el.style.display = 'none';
      }
    }

    if (idx >= 0 && S.lines[idx]){
      var cur = ensureEl(idx);
      if (cur && cur.parentNode !== elLyrics) elLyrics.appendChild(cur);
      cur.style.display = '';
      cur.className = 'line';
      void cur.offsetWidth;          // 强制一次回流，让入场过渡有起点
      cur.className = 'line on';
      fitEl(cur);
      S.text = S.lines[idx].text;
    } else {
      S.text = '';
    }

    if (idx - 1 >= 0 && S.lines[idx - 1]){
      var pv = ensureEl(idx - 1);
      if (pv){
        if (pv.parentNode !== elLyrics) elLyrics.appendChild(pv);
        pv.style.display = '';
        fitEl(pv);
        pv.className = 'line dim';
      }
    }
    updateChars(true);
  }

  function updateChars(force){
    if (S.idx < 0) return;
    var L = S.lines[S.idx];
    if (!L || !L.el || !L.el._spans) return;
    var spans = L.el._spans, t = S.t, i, k = -1, n = spans.length;
    if (!n) return;
    if (L.chars && L.chars.length){
      var cn = Math.min(L.chars.length, n);
      for (i = 0; i < cn; i++){
        if (L.chars[i].t <= t + 0.001) k = i; else break;
      }
    } else {
      var d = L.dur > 0 ? L.dur : Math.max(1.4, n * 0.26);
      var p = (t - L.t) / d;
      if (p < 0) p = 0;
      k = Math.floor(p * n) - 1;
      if (k > n - 1) k = n - 1;
    }
    if (!force && k === S._lastK) return;
    for (i = 0; i < n; i++){
      var want = i <= k;
      if (spans[i]._s !== want){ spans[i]._s = want; spans[i].className = want ? 'ch sung' : 'ch'; }
    }
    S._lastK = k;
  }

  function applyInit(p){
    p = p || {};
    var song = p.song || {};
    var artists = song.artists;
    if (Array.isArray(artists)) artists = artists.join(' / ');
    else if (artists == null) artists = '';
    else artists = String(artists);

    S.song = { name: song.name == null ? '' : String(song.name), artists: artists, cover: song.cover || '' };
    S.dur = toTime(p.duration);

    var a = p.accent;
    if (a && typeof a.length === 'number' && a.length >= 3){
      var r = Math.max(0, Math.min(255, Number(a[0]) || 0));
      var g = Math.max(0, Math.min(255, Number(a[1]) || 0));
      var b = Math.max(0, Math.min(255, Number(a[2]) || 0));
      S.accent = [r,g,b];
      document.documentElement.style.setProperty('--accent', r + ',' + g + ',' + b);
    }

    S.lines = normLines(p.lines);
    elName.textContent = (S.song.name || '无题') + (S.song.artists ? ' — ' + S.song.artists : '');
    S.inited = true;
    rebuild();
    document.body.classList.toggle('idle', !S.lines.length);
  }

  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init'){
        applyInit(d.payload);
      } else if (d.type === 'tick'){
        var p = d.payload || {};
        S.t = toTime(p.time);
        if (typeof p.playing === 'boolean') S.playing = p.playing;
        if (S.inited){
          setActive(findByTime(S.t), false);
          updateChars(false);
        }
      } else if (d.type === 'beat'){
        var bp = d.payload || {};
        S.beatLevel = Math.max(0, Math.min(1, Number(bp.level) || 0));
        S.beatIndex = Number(bp.index) || 0;
      } else if (d.type === 'live'){
        var lp = d.payload || {};
        if (typeof lp.playing === 'boolean') S.playing = lp.playing;
        S.live = {
          bpm: Number(lp.bpm) || 0,
          level: Number(lp.level) || 0,
          bass: Number(lp.bass) || 0,
          mid: Number(lp.mid) || 0,
          treble: Number(lp.treble) || 0
        };
      }
    } catch(e){ S.err = String(e && e.message || e); console.error('[453] msg', e); }
  });

  // ================= 画布与视口 =================
  var cv = $('totem'), ctx = cv.getContext('2d');
  var cv2 = $('dust'), dctx = cv2.getContext('2d');
  var view = { w: 1440, h: 900, cx: 720, cy: 450, f: 620, dpr: 1 };

  // ================= 几何：墨麒麟（程序化生成，零外部资源） =================
  var V = [], E = [];
  var MASS = [];   // 有体积的主体：中心线 + 半径，绘制成实心暗金躯干
  function addV(x, y, z){ V.push({ x: x, y: y, z: z }); return V.length - 1; }
  function addE(a, b, k){ if (a >= 0 && b >= 0 && a !== b) E.push(a, b, k); }
  function addMass(path, radii){
    var pts = [], rs = [], i;
    for (i = 0; i < path.length; i++){
      pts.push({ x: path[i].x, y: path[i].y, z: path[i].z });
      rs.push(radii[i] || 0.01);
    }
    MASS.push({ pts: pts, r: rs });
  }

  // 沿路径生成管状线框
  function tube(path, radii, seg, k){
    var rings = [], i, j, seg2 = Math.max(5, seg | 0), n = path.length;
    for (i = 0; i < n; i++){
      var p = path[i], r = radii[i] || 0.001;
      var pp = path[Math.max(0, i - 1)], pn = path[Math.min(n - 1, i + 1)];
      var tx = pn.x - pp.x, ty = pn.y - pp.y, tz = pn.z - pp.z;
      var tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1; tx /= tl; ty /= tl; tz /= tl;
      var ux = 0, uy = 1, uz = 0;
      if (Math.abs(ty) > 0.94){ ux = 1; uy = 0; uz = 0; }
      var b1x = ty * uz - tz * uy, b1y = tz * ux - tx * uz, b1z = tx * uy - ty * ux;
      var l1 = Math.sqrt(b1x * b1x + b1y * b1y + b1z * b1z) || 1;
      b1x /= l1; b1y /= l1; b1z /= l1;
      var b2x = ty * b1z - tz * b1y, b2y = tz * b1x - tx * b1z, b2z = tx * b1y - ty * b1x;
      var ring = [];
      for (j = 0; j < seg2; j++){
        var a = j / seg2 * 6.2831853, ca = Math.cos(a), sa = Math.sin(a);
        ring.push(addV(
          p.x + (b1x * ca + b2x * sa) * r,
          p.y + (b1y * ca + b2y * sa) * r,
          p.z + (b1z * ca + b2z * sa) * r
        ));
      }
      rings.push(ring);
    }
    for (i = 0; i < rings.length; i++){
      for (j = 0; j < seg2; j++){
        addE(rings[i][j], rings[i][(j + 1) % seg2], k);
        if (i < rings.length - 1) addE(rings[i][j], rings[i + 1][j], k);
      }
    }
    return rings;
  }

  function buildBeast(){
    V.length = 0; E.length = 0; MASS.length = 0;
    var i, s, u, k;

    // 躯干
    var bodyPath = [], bodyR = [];
    for (i = 0; i <= 14; i++){
      u = i / 14;
      bodyPath.push({ x: -0.66 + 1.10 * u, y: 0.02 + 0.055 * Math.sin(u * 3.14159), z: 0 });
      bodyR.push(0.062 + 0.175 * Math.sin(3.14159 * Math.pow(u, 0.80)));
    }
    tube(bodyPath, bodyR, 10, 0);
    addMass(bodyPath, bodyR);

    // 颈
    var neck = [{x:0.44,y:0.05,z:0},{x:0.56,y:0.24,z:0.01},{x:0.63,y:0.42,z:0.01}];
    tube(neck, [0.115,0.098,0.092], 8, 0);
    addMass(neck, [0.125,0.100,0.094]);

    // 头 + 吻
    var head = [{x:0.63,y:0.43,z:0.01},{x:0.80,y:0.47,z:0.03},{x:0.94,y:0.43,z:0.03}];
    tube(head, [0.098,0.093,0.045], 8, 0);
    addMass(head, [0.100,0.086,0.040]);

    // 四肢
    var legX = [-0.50, -0.26, 0.16, 0.36];
    for (k = 0; k < 4; k++){
      var lx = legX[k], zz = (k % 2 === 0) ? 0.10 : -0.10;
      var leg = [{x:lx,y:-0.02,z:zz},{x:lx-0.03,y:-0.26,z:zz},{x:lx+0.02,y:-0.46,z:zz},{x:lx+0.05,y:-0.53,z:zz}];
      tube(leg, [0.070,0.050,0.032,0.026], 6, 0);
      addMass(leg, [0.074,0.048,0.030,0.024]);
    }

    // 双角（向后上方）
    for (k = 0; k < 2; k++){
      var hz = k ? 0.055 : -0.055;
      tube([{x:0.70,y:0.50,z:hz},{x:0.66,y:0.64,z:hz*1.5},{x:0.54,y:0.74,z:hz*1.9},{x:0.42,y:0.78,z:hz*2.1}],
           [0.028,0.021,0.014,0.007], 5, 1);
    }

    // 鬃（颈部短刺）
    for (k = 0; k < 7; k++){
      u = k / 6;
      var bx = 0.44 + 0.20 * u, by = 0.10 + 0.32 * u;
      var a0 = addV(bx, by, 0.02);
      var a1 = addV(bx - 0.075 - 0.03 * u, by + 0.055, 0.02);
      addE(a0, a1, 1);
    }

    // 九尾
    for (k = 0; k < 9; k++){
      var off = (k - 4);
      var ang0 = 2.02 + off * 0.125;
      var L = 0.60 + Math.abs(off) * 0.022;
      var bx0 = -0.62, by0 = 0.09, bz0 = off * 0.012;
      var prev = addV(bx0, by0, bz0);
      for (s = 1; s <= 4; s++){
        u = s / 4;
        var ang = ang0 - 0.85 * u * u;
        var px = bx0 + Math.cos(ang) * L * u;
        var py = by0 + Math.sin(ang) * L * u + 0.05 * u * u;
        var cur = addV(px, py, bz0 + off * 0.03 * u);
        addE(prev, cur, 1);
        prev = cur;
      }
    }

    // 环绕的鎏金碎晶
    for (k = 0; k < 9; k++){
      var ra = k / 9 * 6.2831853;
      var rr = 1.04 + (k % 3) * 0.13;
      var cx0 = Math.cos(ra) * rr, cy0 = 0.30 + Math.sin(ra * 1.7) * 0.80, cz0 = Math.sin(ra) * rr * 0.55;
      var sz = 0.035 + (k % 2) * 0.02;
      var top = addV(cx0, cy0 + sz, cz0), bot = addV(cx0, cy0 - sz, cz0);
      var q0 = addV(cx0 + sz, cy0, cz0), q1 = addV(cx0, cy0, cz0 + sz);
      var q2 = addV(cx0 - sz, cy0, cz0), q3 = addV(cx0, cy0, cz0 - sz);
      addE(top, q0, 2); addE(top, q1, 2); addE(top, q2, 2); addE(top, q3, 2);
      addE(bot, q0, 2); addE(bot, q1, 2); addE(bot, q2, 2); addE(bot, q3, 2);
    }

    // 归一化：居中 + 统一缩放（线框与实体同一变换）
    var mnx = 1e9, mny = 1e9, mnz = 1e9, mxx = -1e9, mxy = -1e9, mxz = -1e9;
    for (i = 0; i < V.length; i++){
      var v = V[i];
      if (v.x < mnx) mnx = v.x; if (v.x > mxx) mxx = v.x;
      if (v.y < mny) mny = v.y; if (v.y > mxy) mxy = v.y;
      if (v.z < mnz) mnz = v.z; if (v.z > mxz) mxz = v.z;
    }
    var ox = (mnx + mxx) / 2, oy = (mny + mxy) / 2, oz = (mnz + mxz) / 2;
    var span = Math.max(mxx - mnx, mxy - mny) || 1;
    var sc = 1.95 / span;
    for (i = 0; i < V.length; i++){
      var p = V[i];
      p.x = (p.x - ox) * sc; p.y = (p.y - oy) * sc; p.z = (p.z - oz) * sc;
    }
    for (i = 0; i < MASS.length; i++){
      var M = MASS[i];
      for (var q = 0; q < M.pts.length; q++){
        M.pts[q].x = (M.pts[q].x - ox) * sc;
        M.pts[q].y = (M.pts[q].y - oy) * sc;
        M.pts[q].z = (M.pts[q].z - oz) * sc;
      }
      for (q = 0; q < M.r.length; q++) M.r[q] = M.r[q] * sc;
    }
  }
  buildBeast();

  var PX = new Float32Array(V.length), PY = new Float32Array(V.length), PD = new Float32Array(V.length);
  var EN = E.length / 3;

  // ================= 星尘（离屏精灵 + 少量粒子） =================
  var sprite = null, dust = [];
  function makeSprite(){
    var c = document.createElement('canvas');
    c.width = c.height = 32;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    rg.addColorStop(0, 'rgba(255,232,176,1)');
    rg.addColorStop(0.35, 'rgba(240,188,96,0.55)');
    rg.addColorStop(1, 'rgba(200,140,50,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(16, 16, 16, 0, 6.2832); g.fill();
    return c;
  }
  sprite = makeSprite();

  function initDust(){
    dust.length = 0;
    var n = RM ? 18 : 42;
    for (var i = 0; i < n; i++){
      dust.push({
        x: Math.random(), y: Math.random(),
        r: 0.018 + Math.random() * 0.055,
        sp: 0.004 + Math.random() * 0.012,
        ph: Math.random() * 6.2832,
        a: 0.10 + Math.random() * 0.34
      });
    }
  }

  // ================= 尺寸 =================
  function resize(){
    var w = Math.round(window.innerWidth || 0), h = Math.round(window.innerHeight || 0);
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (!isFinite(dpr) || dpr <= 0) dpr = 1;
    view.w = w; view.h = h; view.dpr = dpr;
    var portrait = (h > w * 1.12);
    view.cx = w / 2;
    view.cy = h * (portrait ? 0.345 : 0.445);
    view.f = Math.min(w * 1.25, h * 0.95);
    [cv, cv2].forEach(function(c){
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
    });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initDust();
    try { buildBackdrop(); } catch(e){ console.error('[453] backdrop', e); }
  }

  var yaw = 0, pitch = -0.055, haloSpin = 0, dustT = 0, pulse = 0;
  var rings = [];

  function project(v, cY, sY, cP, sP, cx, cy, f, D){
    var x1 = v.x * cY - v.z * sY;
    var z1 = v.x * sY + v.z * cY;
    var y2 = v.y * cP - z1 * sP;
    var z2 = v.y * sP + z1 * cP;
    var zz = z2 + D;
    if (zz < 0.25) zz = 0.25;
    var s = f / zz;
    return { x: cx + x1 * s, y: cy - y2 * s, z: z2, s: s };
  }

  // 实体：把中心线 + 半径投影成「粗胶囊」，做出暗金/黑曜石的体积
  function drawMass(cY, sY, cP, sP, cx, cy, f, D, lvl){
    var i, j, M, p, a, b;
    var A = ctx;
    A.lineCap = 'round';
    // 1) 暗金实体底
    A.strokeStyle = 'rgba(26,20,12,0.94)';
    for (i = 0; i < MASS.length; i++){
      M = MASS[i];
      for (j = 0; j < M.pts.length - 1; j++){
        a = project(M.pts[j], cY, sY, cP, sP, cx, cy, f, D);
        b = project(M.pts[j + 1], cY, sY, cP, sP, cx, cy, f, D);
        var rr = ((M.r[j] + M.r[j + 1]) * 0.5) * (f / (a.z + D));
        A.lineWidth = Math.max(1, rr * 1.9);
        A.beginPath(); A.moveTo(a.x, a.y); A.lineTo(b.x, b.y); A.stroke();
      }
    }
    // 2) 鎏金侧光：沿主体上缘描一道细亮边
    A.strokeStyle = 'rgba(196,142,58,' + (0.42 + lvl * 0.22) + ')';
    for (i = 0; i < MASS.length; i++){
      M = MASS[i];
      A.beginPath();
      for (j = 0; j < M.pts.length; j++){
        p = project(M.pts[j], cY, sY, cP, sP, cx, cy, f, D);
        var shift = (M.r[j] * (f / (p.z + D))) * 0.55;
        if (j === 0) A.moveTo(p.x, p.y - shift);
        else A.lineTo(p.x, p.y - shift);
      }
      A.lineWidth = 1.6;
      A.stroke();
    }
    // 3) 黑曜石高光点
    A.strokeStyle = 'rgba(255,224,158,' + (0.30 + lvl * 0.25) + ')';
    A.lineWidth = 1;
    for (i = 0; i < MASS.length; i++){
      M = MASS[i];
      for (j = 1; j < M.pts.length - 1; j += 2){
        p = project(M.pts[j], cY, sY, cP, sP, cx, cy, f, D);
        var sh = (M.r[j] * (f / (p.z + D))) * 0.42;
        A.beginPath();
        A.arc(p.x - sh * 0.4, p.y - sh, Math.max(0.7, sh * 0.16), 0, 6.2832);
        A.stroke();
      }
    }
    A.lineCap = 'butt';
  }

  // ================= 背景：青铜神树（离屏预渲染，每帧只贴图） =================
  var bgCv = null, bgCtx = null;

  function buildBackdrop(){
    var w = view.w, h = view.h, dpr = view.dpr;
    if (!bgCv){ bgCv = document.createElement('canvas'); }
    bgCv.width = Math.max(2, Math.round(w * dpr));
    bgCv.height = Math.max(2, Math.round(h * dpr));
    bgCtx = bgCv.getContext('2d');
    var g = bgCtx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    var cx = w * 0.5, baseY = h * 1.02;
    var topY = h * 0.10;
    var treeH = baseY - topY;

    // 玉色地气
    var gr = g.createRadialGradient(cx, h * 0.98, 0, cx, h * 0.98, Math.max(w, h) * 0.55);
    gr.addColorStop(0, 'rgba(38,150,116,0.20)');
    gr.addColorStop(0.5, 'rgba(24,96,80,0.07)');
    gr.addColorStop(1, 'rgba(10,40,34,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, w, h);

    // 主树干
    g.strokeStyle = 'rgba(176,132,64,0.20)';
    g.lineWidth = Math.max(1, Math.min(w, h) * 0.006);
    g.beginPath();
    g.moveTo(cx, baseY);
    g.bezierCurveTo(cx - w * 0.015, h * 0.66, cx + w * 0.012, h * 0.36, cx, topY);
    g.stroke();

    // 三层枝，每层左右对生
    var tiers = [0.72, 0.52, 0.33, 0.17];
    var ti, bi, sgn;
    g.lineWidth = Math.max(1, Math.min(w, h) * 0.0026);
    for (ti = 0; ti < tiers.length; ti++){
      var ty = h * tiers[ti];
      var spread = (1 - tiers[ti]) * Math.min(w, h) * 0.62 + Math.min(w, h) * 0.06;
      for (bi = 0; bi < 3; bi++){
        sgn = (bi === 1) ? -1 : 1;
        var k = (bi === 2) ? -1 : 1;
        var ex = cx + sgn * spread * (0.72 + 0.28 * ti * 0.4) * k;
        var ey = ty - Math.min(w, h) * (0.055 + 0.012 * bi);
        g.strokeStyle = 'rgba(176,132,64,' + (0.20 - ti * 0.028) + ')';
        g.beginPath();
        g.moveTo(cx, ty);
        g.quadraticCurveTo(cx + (ex - cx) * 0.45, ty - Math.min(w, h) * 0.05, ex, ey);
        g.stroke();
        // 枝头的金乌/果实
        var fr = Math.min(w, h) * 0.0085;
        var fg = g.createRadialGradient(ex, ey, 0, ex, ey, fr * 4);
        fg.addColorStop(0, 'rgba(255,218,140,0.55)');
        fg.addColorStop(0.4, 'rgba(232,170,70,0.22)');
        fg.addColorStop(1, 'rgba(200,130,40,0)');
        g.fillStyle = fg;
        g.beginPath(); g.arc(ex, ey, fr * 4, 0, 6.2832); g.fill();
      }
    }

    // 神树周围的往返光带（静态弧线）
    g.strokeStyle = 'rgba(246,206,116,0.10)';
    g.lineWidth = 1;
    for (var r = 0; r < 3; r++){
      var rr = Math.min(w, h) * (0.30 + r * 0.13);
      g.beginPath();
      g.ellipse(cx, h * 0.60, rr, rr * 0.34, 0, Math.PI * 1.06, Math.PI * 1.94);
      g.stroke();
    }
  }

  function drawBackdrop(){
    if (!bgCv) return;
    ctx.drawImage(bgCv, 0, 0, view.w, view.h);
  }


  function drawHalo(){
    var R = Math.min(view.w, view.h) * (view.h > view.w * 1.12 ? 0.42 : 0.335);
    var cy = view.cy;
    ctx.save();
    ctx.translate(view.cx, cy);
    // 外环
    ctx.strokeStyle = 'rgba(226,176,86,0.13)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, R * 1.16, 0, 6.2832);
    ctx.stroke();
    // 旋转刻度环
    ctx.rotate(haloSpin);
    ctx.strokeStyle = 'rgba(246,206,116,0.32)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var k = 0; k < 48; k++){
      var a = k / 48 * 6.2832;
      var r0 = R * (k % 4 === 0 ? 1.00 : 1.058);
      var r1 = R * 1.10;
      var ca = Math.cos(a), sa = Math.sin(a);
      ctx.moveTo(ca * r0, sa * r0);
      ctx.lineTo(ca * r1, sa * r1);
    }
    ctx.stroke();
    // 内弧（玉色）
    ctx.strokeStyle = 'rgba(63,214,168,0.18)';
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.70, 0.35, 4.10);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.70, Math.PI + 0.35, Math.PI + 4.10);
    ctx.stroke();
    // 方形玉璧（微旋转，三星堆神树环的暗示）
    ctx.rotate(-haloSpin * 2.1);
    ctx.strokeStyle = 'rgba(246,206,116,0.12)';
    ctx.lineWidth = 1;
    var q = R * 0.50;
    ctx.strokeRect(-q, -q, q * 2, q * 2);
    ctx.restore();
  }

  function drawTotem(){
    var w = view.w, h = view.h, cx = view.cx, cy = view.cy, f = view.f, D = 3.05;
    ctx.clearRect(0, 0, w, h);
    drawBackdrop();
    drawHalo();

    var cY = Math.cos(yaw), sY = Math.sin(yaw), cP = Math.cos(pitch), sP = Math.sin(pitch);
    var n = V.length, i;
    for (i = 0; i < n; i++){
      var v = V[i];
      var x1 = v.x * cY - v.z * sY;
      var z1 = v.x * sY + v.z * cY;
      var y2 = v.y * cP - z1 * sP;
      var z2 = v.y * sP + z1 * cP;
      var zz = z2 + D;
      if (zz < 0.25) zz = 0.25;
      var s = f / zz;
      PX[i] = cx + x1 * s;
      PY[i] = cy - y2 * s;
      PD[i] = z2;
    }

    var A = ctx;
    var lvl = Math.min(1, (S.beatLevel || 0) * 0.85 + ((S.live && S.live.level) || 0) * 0.4);

    // 先画实体体积，再在上面压鎏金线框
    drawMass(cY, sY, cP, sP, cx, cy, f, D, lvl);

    // 按相机 Z 分三档批绘制，避免逐线设置样式
    var styles = [
      ['rgba(255,232,164,0.95)', 1.4, 0],
      ['rgba(226,176,86,0.60)', 1.05, 1],
      ['rgba(146,110,50,0.32)', 0.9, 2]
    ];
    var k, e, a, b;
    for (var pass = 0; pass < 3; pass++){
      var st = styles[pass];
      A.strokeStyle = st[0];
      A.lineWidth = st[1] * (pass === 0 ? (1 + lvl * 0.35) : 1);
      A.beginPath();
      for (e = 0; e < EN; e++){
        var o = e * 3;
        if (E[o + 2] === 2 && pass === 2) continue;
        a = E[o]; b = E[o + 1];
        var dz = (PD[a] + PD[b]) * 0.5;
        var bucket = dz > 0.24 ? 0 : (dz > -0.34 ? 1 : 2);
        if (bucket !== pass) continue;
        A.moveTo(PX[a], PY[a]);
        A.lineTo(PX[b], PY[b]);
      }
      A.stroke();
    }

    // 胸前鎏金核心
    var core = Math.min(w, h) * (0.048 + lvl * 0.016);
    A.save();
    A.translate(cx, cy + Math.min(w, h) * 0.055);
    A.rotate(haloSpin * 0.6);
    var rg = A.createRadialGradient(0, 0, 0, 0, 0, core * 2.4);
    rg.addColorStop(0, 'rgba(255,246,214,' + (0.85 + lvl * 0.15) + ')');
    rg.addColorStop(0.28, 'rgba(255,198,86,' + (0.5 + lvl * 0.3) + ')');
    rg.addColorStop(1, 'rgba(220,140,40,0)');
    A.fillStyle = rg;
    A.beginPath(); A.arc(0, 0, core * 2.4, 0, 6.2832); A.fill();
    A.strokeStyle = 'rgba(255,236,180,0.9)';
    A.lineWidth = 1.4;
    A.beginPath();
    A.moveTo(0, -core * 0.62); A.lineTo(core * 0.30, 0);
    A.lineTo(0, core * 0.62); A.lineTo(-core * 0.30, 0); A.closePath();
    A.stroke();
    A.restore();
  }

  function drawDust(dt){
    var w = view.w, h = view.h;
    dctx.clearRect(0, 0, w, h);
    if (!sprite) return;
    var spd = S.playing ? 1 : 0.22;
    for (var i = 0; i < dust.length; i++){
      var p = dust[i];
      p.y -= p.sp * dt * spd * 0.06;
      if (p.y < -0.05){ p.y = 1.05; p.x = Math.random(); }
      var x = p.x * w + Math.sin(dustT * 0.5 + p.ph) * 16;
      var y = p.y * h;
      var r = p.r * Math.min(w, h) * 2.2;
      dctx.globalAlpha = p.a * (0.7 + 0.3 * Math.sin(dustT * 1.4 + p.ph));
      dctx.drawImage(sprite, x - r / 2, y - r / 2, r, r);
    }
    dctx.globalAlpha = 1;
  }

  // ================= 主循环 =================
  var t0 = performance.now(), last = t0;
  function frame(now){
    var js0 = performance.now();
    S.frames++;
    if (!readySent) sendReady();

    var dt = Math.min(64, Math.max(0, now - last)); last = now;
    var dts = dt / 1000;
    dustT += dts;
    var spd2 = S.playing ? 1 : 0.3;
    var calm = RM ? 0.25 : 1;
    // 鼓点脉冲自然衰减，tick 不参与伪造
    pulse *= Math.pow(0.0025, dts);
    var bl = S.beatLevel || 0;
    if (bl > pulse) pulse = bl * 0.9;
    yaw += dts * (0.14 + pulse * 0.5) * spd2 * calm;
    haloSpin += dts * (0.075 + pulse * 0.25) * spd2 * calm;

    try {
      drawTotem();
      drawDust(dt);
    } catch(e){
      S.err = String(e && e.message || e);
      console.error('[453] draw', e);
    }

    S.js = Math.max(0, performance.now() - js0);
    requestAnimationFrame(frame);
  }

  // 首帧：无条件发 ready
  requestAnimationFrame(function(){ sendReady(); });
  requestAnimationFrame(frame);
  setTimeout(sendReady, 600);

  resize();
  window.addEventListener('resize', resize, { passive: true });
})();
</script>
