<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>绯色圣咏</title>
<style>
  html,body{margin:0;height:100%;background:#07040a;overflow:hidden;
    font-family:"Songti SC","STSong","Noto Serif SC","Times New Roman",serif;}
  #wrap{position:fixed;inset:0;overflow:hidden;}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #lyric{position:absolute;left:0;right:0;bottom:12vh;text-align:center;
    padding:0 8vw;pointer-events:none;z-index:3;}
  #crest{display:block;margin:0 auto clamp(10px,1.6vh,20px);width:clamp(46px,5.2vw,76px);height:auto;
    opacity:.66;filter:drop-shadow(0 0 10px rgba(150,30,60,.55));}
  #line{font-size:clamp(19px,2.35vw,33px);line-height:1.62;letter-spacing:.055em;
    color:#efe0cd;max-width:100%;word-break:break-word;}
  #line .ch{opacity:.58;color:#cbb9ae;transition:color .22s linear,opacity .22s linear;
    text-shadow:0 1px 2px rgba(0,0,0,.9);}
  #line .ch.on{opacity:1;color:#f7e2b4;
    text-shadow:0 0 10px rgba(255,198,120,.55),0 0 22px rgba(178,38,72,.7),0 1px 2px rgba(0,0,0,.8);}
  #line .ch.on::after{content:'';}
  #empty{color:#d9bfae;font-size:clamp(13px,1.15vw,17px);letter-spacing:.42em;opacity:.9;
    text-shadow:0 1px 3px rgba(0,0,0,.9);}
  #empty .mk{display:block;margin:0 auto 14px;width:clamp(30px,3vw,44px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(226,178,120,.85),transparent);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="lyric">
    <svg id="crest" viewBox="0 0 100 132" aria-hidden="true">
      <g fill="none" stroke="#e0b87a" stroke-width="2.1" stroke-linecap="round">
        <path d="M50 4 V112"/>
        <path d="M22 34 H78"/>
      </g>
      <g fill="#e8c78c" opacity=".92">
        <circle cx="50" cy="34" r="5.4"/>
      </g>
      <g fill="none" stroke="#b8763e" stroke-width="1.5" opacity=".85">
        <circle cx="50" cy="24" r="6.5"/>
        <path d="M56 34 q10 6 4 12"/>
        <path d="M44 34 q-10 6 -4 12"/>
      </g>
      <g fill="none" stroke="#8e2a48" stroke-width="1.2" opacity=".8">
        <path d="M50 122 q-14 -8 -18 -20 q12 2 18 12 q6 -10 18 -12 q-4 12 -18 20z"/>
      </g>
    </svg>
    <div id="line"></div>
    <div id="empty" hidden><span class="mk"></span>静 默</div>
  </div>
</div>
<script>
/* self-check port: assigned at true top level, unconditionally, before anything else */
var __stg = { lines: 0, idx: -1, t: 0, playing: true, frames: 0, js: 0, gl: false, rm: false, text: '' };
/* syncStage 定义在下面 IIFE 内部，这里看不到它；由 IIFE 挂一个外部可达的同步钩子 */
window.__stgSync = null;
window.__stage = function () {
  if (typeof window.__stgSync === 'function') { try { window.__stgSync(); } catch (e) {} }
  return __stg;
};

(function () {
  'use strict';
  var cv = document.getElementById('stage');
  var ctx = cv.getContext('2d');
  var lineEl = document.getElementById('line');
  var emptyEl = document.getElementById('empty');
  var crestEl = document.getElementById('crest');
  var view = { w: 1440, h: 900, dpr: 1 };
  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    gl: false, rm: false, dur: 0, inited: false, ready: false
  };
  var charsOn = 0, curKey = '';
  try { S.rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { console.error(e); }
  __stg.rm = S.rm;

  function syncStage() {
    __stg.lines = S.lines.length; __stg.idx = S.idx; __stg.t = S.t;
    __stg.playing = S.playing; __stg.frames = S.frames; __stg.js = S.js;
    __stg.gl = false; __stg.rm = S.rm;
    __stg.text = (S.idx >= 0 && S.lines[S.idx]) ? String(S.lines[S.idx].text || '') : '';
  }
  /* 让外层 window.__stage 能实时同步（applyTime 每帧也会调，这里再挂一次确保随时可读） */
  window.__stgSync = syncStage;

  /* ---------------- palette & sprites ---------------- */
  var ACC = [150, 20, 42];
  var U = { glass: [], candles: [], cross: null };
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var flameSpr = null, petalSpr = null;

  function mixc(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)];
  }
  function rgb(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a == null ? 1 : a) + ')'; }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // gothic pointed arch: springline (cx,sy), full width aw, equilateral apex
  function ogive(g, cx, sy, aw, down) {
    var r = aw / 2, hh = 0.866 * aw;
    g.beginPath();
    g.moveTo(cx - r, sy + down);
    g.lineTo(cx - r, sy);
    g.arc(cx + r, sy, aw, Math.PI, Math.PI * 4 / 3);
    g.arc(cx - r, sy, aw, -Math.PI / 3, 0);
    g.lineTo(cx + r, sy + down);
    g.closePath();
    return { apex: sy - hh };
  }

  function makeFlame() {
    return makeSprite(64, function (g, s) {
      var gr = g.createRadialGradient(s / 2, s * 0.62, 1, s / 2, s * 0.55, s * 0.5);
      gr.addColorStop(0, 'rgba(255,248,214,1)');
      gr.addColorStop(0.28, 'rgba(255,206,120,0.85)');
      gr.addColorStop(0.6, 'rgba(226,120,48,0.32)');
      gr.addColorStop(1, 'rgba(180,50,20,0)');
      g.fillStyle = gr;
      g.beginPath();
      g.moveTo(s / 2, s * 0.06);
      g.bezierCurveTo(s * 0.72, s * 0.42, s * 0.7, s * 0.82, s / 2, s * 0.94);
      g.bezierCurveTo(s * 0.3, s * 0.82, s * 0.28, s * 0.42, s / 2, s * 0.06);
      g.fill();
      var core = g.createRadialGradient(s / 2, s * 0.7, 0, s / 2, s * 0.7, s * 0.18);
      core.addColorStop(0, 'rgba(255,255,255,0.95)');
      core.addColorStop(1, 'rgba(255,220,150,0)');
      g.fillStyle = core;
      g.fillRect(0, 0, s, s);
    });
  }

  function makePetal() {
    return makeSprite(48, function (g, s) {
      g.translate(s / 2, s / 2);
      g.rotate(-0.5);
      var gr = g.createLinearGradient(-s * 0.3, -s * 0.28, s * 0.3, s * 0.3);
      gr.addColorStop(0, '#d8455f');
      gr.addColorStop(0.55, '#8e1226');
      gr.addColorStop(1, '#40060f');
      g.fillStyle = gr;
      g.beginPath();
      g.moveTo(0, -s * 0.36);
      g.bezierCurveTo(s * 0.34, -s * 0.2, s * 0.26, s * 0.26, 0, s * 0.36);
      g.bezierCurveTo(-s * 0.26, s * 0.26, -s * 0.34, -s * 0.2, 0, -s * 0.36);
      g.fill();
      g.strokeStyle = 'rgba(255,190,190,0.18)';
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, -s * 0.3); g.lineTo(0, s * 0.3); g.stroke();
    });
  }

  function makeSprite(size, paint) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    paint(g, size);
    return c;
  }

  function buildSprites() {
    if (!flameSpr) flameSpr = makeFlame();
    if (!petalSpr) petalSpr = makePetal();
    if (!crossSpr) crossSpr = makeCross();
    if (!candSpr) candSpr = makeCandelabra();
    if (!washSpr) washSpr = makeWash();
  }

  // candelabra baked once; flames re-drawn each frame at the returned anchors
  var candSpr = null, candAnchor = [];
  function makeCandelabra() {
    var cw = 200, ch = 420, c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    var g = c.getContext('2d');
    var goldG = g.createLinearGradient(cw * 0.34, 0, cw * 0.66, 0);
    goldG.addColorStop(0, 'rgba(56,38,16,1)');
    goldG.addColorStop(0.34, 'rgba(150,112,58,1)');
    goldG.addColorStop(0.52, 'rgba(232,200,140,1)');
    goldG.addColorStop(0.72, 'rgba(120,86,40,1)');
    goldG.addColorStop(1, 'rgba(40,26,12,1)');
    g.fillStyle = goldG;
    // foot
    g.beginPath(); g.ellipse(cw / 2, ch - 16, 52, 15, 0, 0, 6.2832); g.fill();
    g.beginPath(); g.ellipse(cw / 2, ch - 26, 34, 10, 0, 0, 6.2832); g.fill();
    // stem with knops
    g.beginPath();
    g.moveTo(cw / 2 - 5, ch - 26);
    g.quadraticCurveTo(cw / 2 - 7, ch * 0.55, cw / 2 - 3, ch * 0.22);
    g.lineTo(cw / 2 + 3, ch * 0.22);
    g.quadraticCurveTo(cw / 2 + 7, ch * 0.55, cw / 2 + 5, ch - 26);
    g.closePath(); g.fill();
    for (var q = 0; q < 3; q++) {
      g.beginPath(); g.ellipse(cw / 2, ch - 60 - q * 74, 11 - q * 1.6, 7 - q, 0, 0, 6.2832); g.fill();
    }
    // arms
    g.strokeStyle = goldG; g.lineCap = 'round';
    g.lineWidth = 9;
    g.beginPath(); g.moveTo(cw / 2, ch * 0.20);
    g.bezierCurveTo(cw / 2 - 40, ch * 0.20, cw / 2 - 74, ch * 0.24, cw / 2 - 78, ch * 0.30);
    g.stroke();
    g.beginPath(); g.moveTo(cw / 2, ch * 0.20);
    g.bezierCurveTo(cw / 2 + 40, ch * 0.20, cw / 2 + 74, ch * 0.24, cw / 2 + 78, ch * 0.30);
    g.stroke();
    g.lineWidth = 6;
    g.beginPath(); g.moveTo(cw / 2, ch * 0.16); g.lineTo(cw / 2, ch * 0.05); g.stroke();
    // cups + wax
    var spots = [[cw / 2 - 78, ch * 0.30], [cw / 2, ch * 0.05], [cw / 2 + 78, ch * 0.30]];
    candAnchor = [];
    for (var i = 0; i < spots.length; i++) {
      var dx = spots[i][0], dy = spots[i][1];
      g.fillStyle = 'rgba(196,162,98,0.95)';
      g.beginPath(); g.ellipse(dx, dy, 17, 7, 0, 0, 6.2832); g.fill();
      var wh = 30 + (i === 1 ? 16 : 0);
      var wg = g.createLinearGradient(dx - 8, 0, dx + 8, 0);
      wg.addColorStop(0, 'rgba(176,158,132,1)');
      wg.addColorStop(0.46, 'rgba(248,240,222,1)');
      wg.addColorStop(1, 'rgba(142,122,98,1)');
      g.fillStyle = wg;
      g.fillRect(dx - 7, dy - wh, 14, wh);
      candAnchor.push({ x: dx / cw, y: (dy - wh) / ch });
    }
    return c;
  }

  var washSpr = null;
  function makeWash() {
    var s = 320, c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ',0.85)');
    gr.addColorStop(0.55, 'rgba(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ',0.20)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    return c;
  }

  /* ---------------- live layer ---------------- */
  var P = { beat: 0, pulse: 0, bass: 0, level: 0, petals: [], t0: performance.now() };
  var crossSpr = null;

  function makeCross() {
    var c = document.createElement('canvas');
    c.width = 160; c.height = 260;
    var g = c.getContext('2d');
    var glow = g.createRadialGradient(80, 120, 4, 80, 120, 120);
    glow.addColorStop(0, 'rgba(255,226,190,0.55)');
    glow.addColorStop(0.45, 'rgba(196,120,150,0.16)');
    glow.addColorStop(1, 'rgba(120,30,70,0)');
    g.fillStyle = glow; g.fillRect(0, 0, 160, 260);
    var met = g.createLinearGradient(60, 0, 100, 0);
    met.addColorStop(0, 'rgba(118,96,74,1)');
    met.addColorStop(0.42, 'rgba(238,226,204,1)');
    met.addColorStop(0.62, 'rgba(196,178,150,1)');
    met.addColorStop(1, 'rgba(74,58,44,1)');
    g.fillStyle = met;
    g.fillRect(72, 26, 16, 208);
    g.fillRect(36, 82, 88, 15);
    g.fillStyle = 'rgba(255,240,214,0.85)';
    g.fillRect(74, 28, 4, 204);
    g.fillRect(38, 84, 84, 3);
    return c;
  }

  function seedPetals() {
    P.petals = [];
    var n = S.rm ? 9 : Math.max(10, Math.min(26, Math.round(view.w / 62)));
    for (var i = 0; i < n; i++) {
      P.petals.push({
        x: rnd(i * 5 + 1) * view.w,
        y: rnd(i * 9 + 4) * view.h,
        vx: (rnd(i * 13 + 2) - 0.5) * 26,
        vy: 18 + rnd(i * 17 + 5) * 44,
        r: 5 + rnd(i * 23 + 7) * 9,
        rot: rnd(i * 29 + 3) * 6.28,
        vr: (rnd(i * 31 + 6) - 0.5) * 1.6,
        sw: 0.5 + rnd(i * 37 + 8) * 1.6
      });
    }
  }

  function drawLive(dt, now) {
    var W = view.w, H = view.h, k = 1;
    // cross: floats behind the lyrics, breathes with the bass
    if (crossSpr) {
      var cw = Math.min(W * 0.16, H * 0.30) * (1 + P.pulse * 0.035);
      var chh = cw * 260 / 160;
      var cxx = W * 0.5, cyy = H * 0.335 + Math.sin(now * 0.0006) * (S.rm ? 0 : 4);
      ctx.globalAlpha = 0.32 + P.pulse * 0.22;
      ctx.drawImage(crossSpr, cxx - cw / 2, cyy - chh / 2, cw, chh);
      ctx.globalAlpha = 1;
    }
    // candle flames
    for (var i = 0; i < U.candles.length; i++) {
      var c = U.candles[i];
      var f = 0.82 + 0.18 * Math.sin(now * 0.011 + c.ph) + 0.10 * Math.sin(now * 0.031 + c.ph * 2.1);
      var fs = Math.max(10, Math.min(W, H) * 0.030) * c.s * f * (1 + P.pulse * 0.12);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(flameSpr, c.x - fs * 0.5, c.y - fs * 0.62, fs, fs);
      ctx.globalAlpha = 1;
    }
    // petals
    for (var j = 0; j < P.petals.length; j++) {
      var p = P.petals[j];
      if (!S.rm) {
        p.x += (p.vx + Math.sin(now * 0.001 * p.sw + j) * 16) * (dt || 0.016);
        p.y += p.vy * (dt || 0.016);
        p.rot += p.vr * (dt || 0.016);
        if (p.y > H + 40) { p.y = -30; p.x = (rnd(j * 71 + now * 0.0001)) * W; }
        if (p.x < -40) p.x = W + 30; else if (p.x > W + 40) p.x = -30;
      }
      var sz = p.r * 2;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(now * 0.002 + j);
      ctx.drawImage(petalSpr, -p.r, -p.r, sz, sz);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function draw(dt, now) {
    var W = view.w, H = view.h;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (bg.width && bg.height) ctx.drawImage(bg, 0, 0, W, H);
    // warm pulse wash from the beat (pre-baked radial, no per-frame gradient)
    if (P.pulse > 0.01 && washSpr) {
      var ws = Math.max(W, H) * 1.4;
      ctx.globalAlpha = 0.20 * P.pulse;
      ctx.drawImage(washSpr, W * 0.5 - ws / 2, H * 0.30 - ws / 2, ws, ws);
      ctx.globalAlpha = 1;
    }
    drawLive(dt, now);
  }

  function resize() {
    var w = window.innerWidth || 1440, h = window.innerHeight || 900;
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    view.w = w; view.h = h;
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * view.dpr);
    cv.height = Math.round(h * view.dpr);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    try { buildSprites(); buildBG(); seedPetals(); } catch (e) { console.error('[stage] bg', e); }
  }

  /* ---------------- baked backdrop ---------------- */
  function buildBG() {
    bg.width = Math.max(2, Math.round(view.w));
    bg.height = Math.max(2, Math.round(view.h));
    var g = bgx, W = bg.width, H = bg.height;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);

    var base = g.createRadialGradient(W * 0.5, H * 0.34, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    base.addColorStop(0, '#200a14');
    base.addColorStop(0.42, '#150610');
    base.addColorStop(1, '#060207');
    g.fillStyle = base; g.fillRect(0, 0, W, H);

    // --- stained glass: tall lancet + rose, behind everything ---
    var cx = W * 0.5, glTop = -H * 0.06, glBot = H * 0.52;
    var aw = Math.min(W * 0.30, H * 0.40);
    var sy = glTop + 0.866 * aw;            // springline so apex ~ glTop
    g.save();
    ogive(g, cx, sy, aw, glBot - sy);
    g.clip();
    var warm = [58, 96, 132], warm2 = [128, 34, 62], gold = [176, 132, 62];
    for (var r = 0; r < 13; r++) {
      for (var cc = -8; cc <= 8; cc++) {
        var px = cx + cc * aw * 0.145, py = sy - 0.866 * aw * 0.9 + r * aw * 0.108;
        var k = rnd(r * 31 + cc * 7);
        var col = k < 0.34 ? warm : (k < 0.68 ? warm2 : gold);
        var a = 0.30 + 0.20 * rnd(r * 3 + cc * 11);
        g.fillStyle = rgb(mixc(col, [10, 6, 16], 0.35), a);
        g.beginPath();
        g.ellipse(px, py, aw * 0.062, aw * 0.086, 0, 0, 6.2832);
        g.fill();
        if (k < 0.16) {
          g.fillStyle = 'rgba(255,224,170,0.16)';
          g.beginPath(); g.ellipse(px, py, aw * 0.02, aw * 0.03, 0, 0, 6.2832); g.fill();
        }
      }
    }
    // rose at apex
    var ry = sy - 0.866 * aw * 0.30, rr = aw * 0.30;
    g.strokeStyle = 'rgba(196,150,92,0.42)'; g.lineWidth = Math.max(1, W * 0.0012);
    for (var q = 0; q < 12; q++) {
      var ang = q * Math.PI / 6;
      g.beginPath(); g.moveTo(cx + Math.cos(ang) * rr * 0.16, ry + Math.sin(ang) * rr * 0.16);
      g.lineTo(cx + Math.cos(ang) * rr, ry + Math.sin(ang) * rr); g.stroke();
    }
    for (var q2 = 0; q2 < 5; q2++) {
      g.beginPath(); g.arc(cx, ry, rr * (0.26 + q2 * 0.185), 0, 6.2832); g.stroke();
    }
    var rg = g.createRadialGradient(cx, ry, 0, cx, ry, rr);
    rg.addColorStop(0, 'rgba(255,208,158,0.34)');
    rg.addColorStop(0.5, 'rgba(170,44,84,0.10)');
    rg.addColorStop(1, 'rgba(40,10,30,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(cx, ry, rr, 0, 6.2832); g.fill();
    // light spill from the window onto the stone floor
    var spill = g.createLinearGradient(0, glBot - H * 0.10, 0, glBot + H * 0.16);
    spill.addColorStop(0, 'rgba(150,110,160,0.20)');
    spill.addColorStop(1, 'rgba(60,20,60,0)');
    g.fillStyle = spill; g.fillRect(0, glBot - H * 0.10, W, H * 0.30);
    g.restore();

    // lancet mullions / lead cames
    g.save();
    g.strokeStyle = 'rgba(22,10,20,0.92)'; g.lineWidth = Math.max(2, W * 0.0045);
    ogive(g, cx, sy, aw, glBot - sy); g.stroke();
    g.lineWidth = Math.max(1, W * 0.0022);
    g.strokeStyle = 'rgba(14,6,14,0.75)';
    for (var v = -2; v <= 2; v++) {
      var vx = cx + v * aw * 0.24;
      g.beginPath(); g.moveTo(vx, sy - Math.sqrt(Math.max(0, aw * aw - Math.pow(vx - cx, 2))) * 0.96);
      g.lineTo(vx, glBot); g.stroke();
    }
    // stone ribs of the vault
    g.strokeStyle = 'rgba(70,44,58,0.30)'; g.lineWidth = Math.max(1.5, W * 0.003);
    for (var s2 = -1; s2 <= 1; s2 += 2) {
      g.beginPath();
      g.moveTo(cx + s2 * aw * 0.52, glBot);
      g.quadraticCurveTo(cx + s2 * aw * 1.5, H * 0.26, cx + s2 * W * 0.62, H * 0.02);
      g.stroke();
    }
    g.restore();

    // --- velvet curtains left & right, with folds ---
    function drape(side) {
      var cw = W * (0.20 + 0.06 * rnd(side + 3));
      g.save();
      for (var f = 0; f < 9; f++) {
        var t = f / 8;
        var x = side < 0 ? t * cw : W - t * cw;
        var wide = cw / 8;
        var bulge = Math.sin(t * Math.PI) * cw * 0.34;
        var grd = g.createLinearGradient(x - wide, 0, x + wide, 0);
        var dark = 0.55 + 0.45 * Math.abs(Math.sin(f * 2.1 + side));
        grd.addColorStop(0, 'rgba(' + (24 * dark | 0) + ',' + (4 * dark | 0) + ',' + (12 * dark | 0) + ',0.96)');
        grd.addColorStop(0.45, 'rgba(' + (92 * dark | 0) + ',' + (12 * dark | 0) + ',' + (34 * dark | 0) + ',0.94)');
        grd.addColorStop(0.72, 'rgba(' + (54 * dark | 0) + ',' + (6 * dark | 0) + ',' + (22 * dark | 0) + ',0.95)');
        grd.addColorStop(1, 'rgba(' + (18 * dark | 0) + ',' + (3 * dark | 0) + ',' + (9 * dark | 0) + ',0.97)');
        g.fillStyle = grd;
        g.beginPath();
        var x0 = side < 0 ? x - wide + bulge * 0.25 : x - wide - bulge * 0.25;
        g.moveTo(x0, -H * 0.02);
        g.quadraticCurveTo(x0 + side * -bulge * 0.6, H * 0.5, x0 + side * -bulge * 0.2, H * 1.02);
        g.lineTo(x0 + side * -bulge * 0.2 + wide * 2, H * 1.02);
        g.quadraticCurveTo(x0 + side * -bulge * 0.6 + wide * 2, H * 0.5, x0 + wide * 2, -H * 0.02);
        g.closePath();
        g.fill();
      }
      g.restore();
    }
    drape(-1); drape(1);
    // valance across the top
    var vg = g.createLinearGradient(0, 0, 0, H * 0.13);
    vg.addColorStop(0, 'rgba(96,12,34,0.96)');
    vg.addColorStop(1, 'rgba(30,4,14,0.98)');
    g.fillStyle = vg;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, H * 0.055);
    for (var b = 10; b >= 0; b--) {
      var bx = (b / 10) * W;
      g.quadraticCurveTo(bx - W * 0.05, H * 0.125, bx - W * 0.1, H * 0.055);
    }
    g.closePath(); g.fill();

    // --- candelabras: baked sprite, flames drawn live at the anchors ---
    U.candles = [];
    var winHalf = aw;                       // lancet half width, from the glass block above
    var fz = Math.max(46, W * 0.5 - winHalf); // free margin on each side of the window
    for (var sd = -1; sd <= 1; sd += 2) {
      var chei = Math.max(110, Math.min(H * 0.52, W * 0.62));
      var cwid = chei * 200 / 420;
      if (cwid > W * 0.34) { cwid = W * 0.34; chei = cwid * 420 / 200; }
      var cxL = (cwid <= fz * 1.9) ? fz * 0.5 : Math.max(cwid * 0.42, fz - cwid * 0.12);
      var bx2 = sd < 0 ? cxL : W - cxL;
      var ctop = H * 0.63 - chei;
      if (candSpr) g.drawImage(candSpr, bx2 - cwid / 2, ctop, cwid, chei);
      for (var ai = 0; ai < candAnchor.length; ai++) {
        U.candles.push({ x: bx2 - cwid / 2 + candAnchor[ai].x * cwid, y: ctop + candAnchor[ai].y * chei, s: Math.max(0.6, chei / 480), ph: rnd(ai * 3 + sd * 7) * 6.28 });
      }
    }

    // --- light shafts from the lancet ---
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (var sh = -1; sh <= 1; sh++) {
      var sx0 = cx + sh * aw * 0.30, sx1 = cx + sh * aw * 1.7 + W * 0.10 * sh;
      var sg = g.createLinearGradient(sx0, glTop, sx1, H * 0.92);
      sg.addColorStop(0, 'rgba(210,178,190,0.10)');
      sg.addColorStop(0.45, 'rgba(170,120,150,0.045)');
      sg.addColorStop(1, 'rgba(90,40,80,0)');
      g.fillStyle = sg;
      g.beginPath();
      g.moveTo(sx0 - aw * 0.10, glTop + H * 0.10);
      g.lineTo(sx0 + aw * 0.10, glTop + H * 0.10);
      g.lineTo(sx1 + aw * 0.46, H * 0.95);
      g.lineTo(sx1 - aw * 0.30, H * 0.95);
      g.closePath(); g.fill();
    }
    g.restore();

    // --- gold filigree in the corners ---
    function flourish(px, py, sc, fx, fy) {
      g.save();
      g.translate(px, py);
      g.scale(sc * fx, sc * fy);
      g.lineCap = 'round';
      for (var p = 0; p < 3; p++) {
        var gr2 = g.createLinearGradient(0, 0, 260, 260);
        gr2.addColorStop(0, 'rgba(226,196,142,' + (0.55 - p * 0.13) + ')');
        gr2.addColorStop(0.6, 'rgba(170,124,72,' + (0.40 - p * 0.09) + ')');
        gr2.addColorStop(1, 'rgba(120,70,40,0)');
        g.strokeStyle = gr2;
        g.lineWidth = Math.max(1, 3.4 - p * 1.0);
        g.beginPath();
        var o = p * 26;
        g.moveTo(o, 0);
        g.bezierCurveTo(120 + o, 10 - o * 0.2, 150 + o, 90 + o, 60 + o, 132 + o);
        g.bezierCurveTo(16 + o, 156 + o, 0 + o, 120 + o, 12 + o, 92 + o);
        g.stroke();
      }
      // small volute buds
      g.fillStyle = 'rgba(232,204,152,0.42)';
      for (var b2 = 0; b2 < 3; b2++) {
        g.beginPath();
        g.arc(150 + b2 * 16, 34 + b2 * 30, Math.max(1.4, 4.4 - b2 * 1.1), 0, 6.2832);
        g.fill();
      }
      g.restore();
    }
    var fsc = Math.max(0.55, Math.min(W, H) / 1100);
    flourish(W * 0.012, H * 0.045, fsc, 1, 1);
    flourish(W * 0.988, H * 0.045, fsc, -1, 1);
    flourish(W * 0.012, H * 0.955, fsc * 0.8, 1, -1);
    flourish(W * 0.988, H * 0.955, fsc * 0.8, -1, -1);

    // --- thorn vines with roses climbing the frame edges ---
    function vine(side) {
      g.save();
      var x0 = side < 0 ? W * 0.055 : W * 0.945;
      g.strokeStyle = 'rgba(58,30,34,0.92)';
      g.lineWidth = Math.max(1.6, W * 0.0034);
      g.beginPath();
      g.moveTo(x0, H * 1.02);
      g.bezierCurveTo(x0 + side * W * 0.10, H * 0.80, x0 - side * W * 0.05, H * 0.62, x0 + side * W * 0.06, H * 0.44);
      g.stroke();
      // thorns
      g.lineWidth = Math.max(1, W * 0.0018);
      g.strokeStyle = 'rgba(84,44,48,0.85)';
      for (var th = 0; th < 9; th++) {
        var ty = H * (0.98 - th * 0.062);
        var tx = x0 + Math.sin(th * 1.7) * W * 0.045 + side * W * 0.02;
        g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + side * W * 0.016, ty - H * 0.022); g.stroke();
      }
      // roses
      for (var ro = 0; ro < 4; ro++) {
        var ry2 = H * (0.92 - ro * 0.135);
        var rx2 = x0 + Math.sin(ro * 2.2 + side) * W * 0.052 + side * W * 0.012;
        var rad = Math.max(9, Math.min(W, H) * (0.022 + 0.008 * rnd(ro + side * 3)));
        var rg2 = g.createRadialGradient(rx2 - rad * 0.3, ry2 - rad * 0.35, 0, rx2, ry2, rad);
        rg2.addColorStop(0, 'rgba(196,52,74,0.95)');
        rg2.addColorStop(0.5, 'rgba(132,18,40,0.95)');
        rg2.addColorStop(1, 'rgba(58,6,18,0.95)');
        g.fillStyle = rg2;
        g.beginPath(); g.arc(rx2, ry2, rad, 0, 6.2832); g.fill();
        g.strokeStyle = 'rgba(232,170,168,0.28)'; g.lineWidth = 1;
        for (var pt = 1; pt <= 3; pt++) {
          g.beginPath();
          g.arc(rx2, ry2, rad * (0.24 + pt * 0.20), pt * 0.9, pt * 0.9 + 4.4);
          g.stroke();
        }
      }
      g.restore();
    }
    vine(-1); vine(1);

    // floor haze + heavy lower vignette: the lyric sits here, so keep it dark
    var fl = g.createLinearGradient(0, H * 0.62, 0, H);
    fl.addColorStop(0, 'rgba(0,0,0,0)');
    fl.addColorStop(0.55, 'rgba(6,1,8,0.72)');
    fl.addColorStop(1, 'rgba(3,0,5,0.97)');
    g.fillStyle = fl; g.fillRect(0, H * 0.62, W, H * 0.38);
    var vg2 = g.createRadialGradient(W * 0.5, H * 0.42, Math.min(W, H) * 0.16, W * 0.5, H * 0.48, Math.max(W, H) * 0.74);
    vg2.addColorStop(0, 'rgba(0,0,0,0)');
    vg2.addColorStop(0.62, 'rgba(2,0,4,0.18)');
    vg2.addColorStop(1, 'rgba(2,0,4,0.90)');
    g.fillStyle = vg2; g.fillRect(0, 0, W, H);

    // --- baked film grain (no per-frame cost) ---
    try {
      var gs = 128, gc = document.createElement('canvas');
      gc.width = gc.height = gs;
      var gg = gc.getContext('2d');
      var id = gg.createImageData(gs, gs), dd = id.data;
      for (var gp = 0; gp < dd.length; gp += 4) {
        var val = 128 + (rnd(gp) - 0.5) * 150;
        dd[gp] = dd[gp + 1] = dd[gp + 2] = val; dd[gp + 3] = 26;
      }
      gg.putImageData(id, 0, 0);
      g.save();
      g.globalCompositeOperation = 'overlay';
      var pat = g.createPattern(gc, 'repeat');
      if (pat) { g.fillStyle = pat; g.fillRect(0, 0, W, H); }
      g.restore();
    } catch (gr) { console.error('[stage] grain', gr); }
  }

  function buildLine(i) {
    var L = S.lines[i]; curKey = i + '|';
    lineEl.textContent = '';
    if (!L || L.text == null) return;
    var txt = String(L.text);
    var frag = document.createDocumentFragment();
    for (var k = 0; k < Math.min(txt.length, 240); k++) {
      var s = document.createElement('span');
      s.className = 'ch'; s.textContent = txt.charAt(k);
      frag.appendChild(s);
    }
    lineEl.appendChild(frag);
    // long lines shrink instead of overflowing
    var n = lineEl.children.length;
    var base = Math.min(view.w * 0.0235, 33);
    var fit = n > 0 ? (view.w * 0.86) / (n * base * 0.62) : 1;
    var px = Math.max(13, Math.min(base, base * fit));
    lineEl.style.fontSize = px.toFixed(1) + 'px';
    charsOn = 0;
  }

  function setIdx(i) {
    S.idx = i;
    if (i < 0) { lineEl.textContent = ''; curKey = ''; crestEl.style.opacity = '.4'; return; }
    crestEl.style.opacity = '.66';
    buildLine(i);
  }

  function findIdx(t) {
    var lo = 0, hi = S.lines.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (S.lines[mid].t <= t + 1e-4) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  function applyTime(t) {
    S.t = t;
    var i = findIdx(t);
    if (i !== S.idx) setIdx(i);
    if (i < 0) return;
    var L = S.lines[i], n = lineEl.children.length;
    var chars = L.chars, want = 0;
    if (chars && chars.length) {
      var m = Math.min(chars.length, n);
      want = 0;
      for (var k = 0; k < m; k++) if (chars[k] && chars[k].t <= t + 0.02) want = k + 1;
    } else {
      var d = (L.dur && isFinite(L.dur) && L.dur > 0.05) ? L.dur : 4;
      var p = Math.max(0, Math.min(1, (t - L.t) / d));
      want = Math.round(p * n);
    }
    if (want !== charsOn) {
      for (var j = 0; j < n; j++) {
        var el = lineEl.children[j];
        var on = j < want;
        if (el.classList.contains('on') !== on) el.classList.toggle('on', on);
      }
      charsOn = want;
    }
  }

  function onInit(p) {
    p = p || {};
    S.dur = isFinite(p.duration) ? p.duration : 0;
    // accent from the cover, mixed back toward the baroque palette so it never muddies the lyric
    if (Array.isArray(p.accent) && p.accent.length >= 3) {
      var an = [Number(p.accent[0]), Number(p.accent[1]), Number(p.accent[2])];
      if (isFinite(an[0]) && isFinite(an[1]) && isFinite(an[2])) {
        ACC = mixc([120, 16, 38], [Math.max(0, Math.min(255, an[0])), Math.max(0, Math.min(255, an[1])), Math.max(0, Math.min(255, an[2]))], 0.45);
        washSpr = null;
        try { washSpr = makeWash(); } catch (e) { console.error('[stage] wash', e); }
      }
    }
    var raw = Array.isArray(p.lines) ? p.lines : [];
    var out = [];
    for (var i = 0; i < Math.min(raw.length, 800); i++) {
      var L = raw[i]; if (!L) continue;
      var t = Number(L.t);
      if (!isFinite(t) || t < 0) t = 0;
      out.push({ t: t, dur: isFinite(Number(L.dur)) ? Number(L.dur) : 0, text: L.text == null ? '' : String(L.text), chars: Array.isArray(L.chars) ? L.chars : null });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    S.lines = out; S.inited = true;
    S.idx = -2; charsOn = -1;
    emptyEl.hidden = out.length !== 0;
    if (out.length === 0) { lineEl.textContent = ''; crestEl.style.opacity = '.34'; }
    applyTime(S.t);
  }

  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('error', function (e) { console.error('[stage]', e && e.message); });

  window.addEventListener('message', function (ev) {
    var d = ev.data; if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') {
        var p = d.payload || {};
        if (typeof p.playing === 'boolean') S.playing = p.playing;
        if (isFinite(p.time)) applyTime(Number(p.time));
      } else if (d.type === 'beat') {
        var bp = d.payload || {};
        var bl = isFinite(bp.level) ? Math.max(0, Math.min(1, Number(bp.level))) : 0.6;
        P.pulse = Math.min(1, P.pulse + 0.30 + bl * 0.55);
        if (!S.rm) P.beat = (P.beat + 1) % 8;
      } else if (d.type === 'live') {
        var lp = d.payload || {};
        if (isFinite(lp.bass)) P.bass = Math.max(0, Math.min(1, Number(lp.bass)));
        if (isFinite(lp.level)) P.level = Math.max(0, Math.min(1, Number(lp.level)));
        if (typeof lp.playing === 'boolean') S.playing = lp.playing;
        if (isFinite(lp.bpm) && lp.bpm > 0) P.bpm = Number(lp.bpm);
      }
    } catch (err) { console.error('[stage] msg', err); }
  });

  resize();
  applyTime(0);
  syncStage();

  var lastT = performance.now();
  function sendReady() {
    if (S.ready) return;
    S.ready = true;
    try { window.parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[stage] ready', e); }
  }
  function frame(now) {
    sendReady();
    var t0 = performance.now();
    S.frames++;
    var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
    lastT = now;
    try {
      // beat envelope decay (frame-rate independent)
      var decay = S.rm ? 6.0 : 3.4;
      P.pulse = Math.max(0, P.pulse - P.pulse * Math.min(1, decay * dt) - 0.002);
      draw(dt, now);
    } catch (e) { console.error('[stage] frame', e); }
    try { S.js = +(performance.now() - t0).toFixed(2); } catch (e3) { S.js = 0; }
    syncStage();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(sendReady, 700);
})();
</script>
</body>
</html>
