<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电子束扫描</title>
<style>
  html,body{margin:0;height:100%;background:#03060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* 显像管：曲面暗角 + 扫描线 + 极淡的横向条纹，全部放在 CSS 层，不占 canvas */
  #crt{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.34;
       background:repeating-linear-gradient(180deg,rgba(0,0,0,.30) 0 1px,rgba(0,0,0,0) 1px 4px)}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(112% 92% at 50% 50%,transparent 30%,rgba(2,4,8,.55) 76%,rgba(0,0,0,.96))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(150,240,220,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="crt"></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   lyra10 · 电子束扫描 —— 字不是"生成"的，是被一支电子束**按光栅顺序写上去**的
   ---------------------------------------------------------------------------
   机制：**余辉 + 光栅写入**（和 025 字符相机 用字符画字、027 代码雨 都不同）
     · 屏幕是一台显像管。荧光点被电子束打中就亮，然后按余辉曲线慢慢暗下去
     · 一支实际的"写入头"沿着字形的采样点**按光栅顺序**（先上后下、先左后右）
       一个一个点过去 —— 这就是 CRT 写字的真实方式，所以字是"长出来"的
     · 写入头经过时顺手在离屏"荧光层"上打一个亮点；荧光层每帧只褪一点点，
       于是刚写完的部分最亮、先写的已经开始暗 —— 余辉本身就成了层次
     · 换句 = 一次**场同步丢失**：整屏猛地向上滚一下再拉回来（CRT 换行时的经典故障）

   AE 手法：
     · 光栅写入 Raster Write-on（逐点、有时序，不是一次性出现）
     · 余辉衰减 Phosphor Persistence（亮度按时间分层）
     · 失同步滚屏 Vertical Roll（换句）+ 顿帧
     · 扫描线 Scanlines（CSS 层）+ 屏幕暗角 + 极淡的辉光溢出
     · 定向镜头震动 + 极缓慢的推镜
     · 束流拖尾：写入头身后留一小段亮痕

   配色：青绿荧光 + 冷白（显像管 P31 荧光粉的经典色）
   ========================================================================== */

/* ============================ 0 · 画布 ============================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
let bgCv = null, phos = null, pctx = null;      // 荧光层
let PW = 0, PH = 0;
const PK = 1;   // 荧光层**不**降采样：半分辨率再放大时，细笔画会被插值拉出纵向重影，字读不清
let L = null, curIdx = -1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  PW = Math.max(2, Math.round(W / PK)); PH = Math.max(2, Math.round(H / PK));
  if (!phos) phos = document.createElement('canvas');
  phos.width = PW; phos.height = PH;
  pctx = phos.getContext('2d');
  buildBg();
  if (L && curIdx >= 0) assignLine(curIdx);
}
addEventListener('resize', resize);

/* ============================ 1 · 时钟 ============================ */
let lines = [];
let accent = [120, 255, 214];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ============================ 2 · 分词（词典法 + 双向最大匹配） ============================ */
let DICT = null;
fetch('/segdict.bin').then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); }).catch(() => {});
const fnv = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function isWord(s, i, Ln) {
  if (!DICT) return false;
  const h = fnv(s.substr(i, Ln));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = DICT[m]; if (v === h) return true; if (v < h) lo = m + 1; else hi = m - 1; }
  return false;
}
function segWords(text) {
  const fwd = [];
  for (let i = 0; i < text.length;) {
    let hit = 0;
    for (let Ln = Math.min(4, text.length - i); Ln >= 2; Ln--) if (isWord(text, i, Ln)) { hit = Ln; break; }
    if (hit) { fwd.push(text.substr(i, hit)); i += hit; } else { fwd.push(text[i]); i++; }
  }
  const bwd = [];
  for (let j = text.length; j > 0;) {
    let hit = 0;
    for (let Ln = Math.min(4, j); Ln >= 2; Ln--) if (isWord(text, j - Ln, Ln)) { hit = Ln; break; }
    if (hit) { bwd.unshift(text.substr(j - hit, hit)); j -= hit; } else { bwd.unshift(text[j - 1]); j--; }
  }
  return fwd.length <= bwd.length ? fwd : bwd;
}
const MAXG = 3;
const PUNCT = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】"]/;
const SPACE = /\s/;
function isLatin(text) { let la = 0, cjk = 0; for (let i = 0; i < text.length; i++) { const c = text[i]; if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++; else if (c >= '\u4e00' && c <= '\u9fff') cjk++; } return la > cjk; }
function latinSpans(text) {
  const out = []; let i = 0;
  while (i < text.length) {
    if (SPACE.test(text[i])) { i++; continue; }
    let j = i; while (j < text.length && !SPACE.test(text[j])) j++;
    out.push({ i0: i, i1: j }); i = j;
  }
  return out;
}
const SUFFIX = /^[的了着过地得吗呢吧啊嘛]$/;
const PREFIX = /^[但还就才又也都把被在从向对和与而却很不没最更将已曾让给]$/;
const countChars = (s) => { let n = 0; for (let i = 0; i < s.length; i++) if (!PUNCT.test(s[i]) && !SPACE.test(s[i])) n++; return n; };
function groupByWords(text) {
  const words = segWords(text), out = [];
  let cur = '', start = 0, chars = 0, pos = 0;
  const flush = (end) => { if (cur) { out.push({ i0: start, i1: end }); cur = ''; chars = 0; } };
  for (const w of words) {
    const at = pos; pos += w.length;
    const isP = PUNCT.test(w);
    if (!cur) { cur = w; start = at; chars = isP ? 0 : w.length; continue; }
    if (isP) { cur += w; if (chars >= 2) flush(pos); continue; }
    const single = w.length === 1;
    if (single && SUFFIX.test(w)) { cur += w; chars++; if (chars >= MAXG) flush(pos); continue; }
    if (single && PREFIX.test(w) && chars >= 2) { flush(at); cur = w; start = at; chars = 1; continue; }
    if (chars + w.length <= MAXG) { cur += w; chars += w.length; } else { flush(at); cur = w; start = at; chars = w.length; }
  }
  flush(text.length);
  for (let k = 0; k < out.length; k++) {
    const g = out[k];
    if (countChars(text.slice(g.i0, g.i1)) > 1) continue;
    const prev = out[k - 1], next = out[k + 1];
    if (prev && prev.i1 === g.i0 && countChars(text.slice(prev.i0, prev.i1)) < MAXG) { prev.i1 = g.i1; out.splice(k, 1); k--; }
    else if (next && next.i0 === g.i1 && countChars(text.slice(next.i0, next.i1)) < MAXG) { next.i0 = g.i0; out.splice(k, 1); k--; }
  }
  return out;
}
function groupByRule(text) {
  const out = []; let start = 0, chars = 0;
  for (let i = 0; i < text.length; i++) {
    const s = PUNCT.test(text[i]) || SPACE.test(text[i]);
    if (!s) chars++;
    if (s && chars >= 2) { out.push({ i0: start, i1: i + 1 }); start = i + 1; chars = 0; continue; }
    if (!s && chars > MAXG) { out.push({ i0: start, i1: i }); start = i; chars = 1; }
  }
  if (start < text.length) out.push({ i0: start, i1: text.length });
  return out;
}
const spansForLine = (t) => (isLatin(t) ? latinSpans(t) : (DICT ? groupByWords(t) : groupByRule(t)));

/* ============================ 3 · 字形采样 ============================ */
const offCv = document.createElement('canvas');
const octx = offCv.getContext('2d', { willReadFrequently: true });
const FONT = (px, wt) => `${wt || 800} ${px}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
function wrapText(text, fs, maxW, wt) {
  octx.font = FONT(fs, wt);
  const latin = isLatin(text);
  const rows = []; let start = 0, w = 0;
  for (let i = 0; i < text.length; i++) {
    const cw = octx.measureText(text[i]).width;
    if (!cw) continue;
    if (w + cw > maxW && i > start) {
      let brk = i;
      if (latin) { let j = i; while (j > start && !SPACE.test(text[j])) j--; if (j > start) brk = j; }
      rows.push({ i0: start, i1: brk, w: octx.measureText(text.slice(start, brk)).width });
      start = brk; w = 0;
      while (start < text.length && SPACE.test(text[start])) start++;
      if (start >= text.length) break;
      i = start - 1; continue;
    }
    w += cw;
  }
  if (start < text.length) rows.push({ i0: start, i1: text.length, w: octx.measureText(text.slice(start)).width });
  for (const r of rows) while (r.i1 - r.i0 > 1 && SPACE.test(text[r.i0])) r.i0++;
  return rows.length ? rows : [{ i0: 0, i1: text.length, w: octx.measureText(text).width }];
}
function sampleGlyph(text, opt) {
  opt = opt || {};
  const wt = opt.weight || 800;
  let fs = opt.fs || 92;
  const maxW = opt.maxW || Math.min(W * 0.70, 1120);
  const maxH = opt.maxH || H * 0.46;
  let rows = wrapText(text, fs, maxW, wt);
  let lh = fs * 1.16;
  if (rows.length * lh > maxH) { fs *= maxH / (rows.length * lh); rows = wrapText(text, fs, maxW, wt); lh = fs * 1.16; }
  octx.font = FONT(fs, wt);
  const widest = Math.max(1, ...rows.map((r) => octx.measureText(text.slice(r.i0, r.i1)).width));
  const padW = Math.ceil(widest) + 24, padH = Math.ceil(lh * rows.length) + 12;
  offCv.width = padW; offCv.height = padH;
  octx.font = FONT(fs, wt);           // 改尺寸会重置上下文 → font 必须重设
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.clearRect(0, 0, padW, padH);
  const n = text.length;
  const charCx = new Float32Array(n), charCy = new Float32Array(n);
  const rowMaps = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], str = text.slice(row.i0, row.i1);
    const cy = padH / 2 + (r - (rows.length - 1) / 2) * lh;
    octx.fillText(str, padW / 2, cy);
    const x0 = (padW - row.w) / 2, map = new Int16Array(padW).fill(-1);
    let acc = 0;
    for (let i = row.i0; i < row.i1; i++) {
      const cw = octx.measureText(text[i]).width;
      charCx[i] = x0 + acc + cw / 2 - padW / 2; charCy[i] = cy - padH / 2;
      for (let x = Math.max(0, Math.floor(x0 + acc)); x < Math.min(padW, Math.ceil(x0 + acc + cw)); x++) map[x] = i;
      acc += cw;
    }
    rowMaps.push({ y0: cy - lh / 2, y1: cy + lh / 2, map });
  }
  const d = octx.getImageData(0, 0, padW, padH).data;
  const pxA = [], pyA = [], ownA = [];
  const step = opt.step || 3;
  /* 光栅顺序：先按 y 再按 x（天然就是扫描顺序，因为循环本来就是这么走的） */
  for (let y = 0; y < padH; y += step) {
    let rm = null;
    for (let r = 0; r < rowMaps.length; r++) { const m = rowMaps[r]; if (y >= m.y0 && y < m.y1) { rm = m; break; } }
    if (!rm) continue;
    const map = rm.map, base = y * padW;
    for (let x = 0; x < padW; x += step) {
      if (d[(base + x) * 4 + 3] <= 128) continue;
      const c = map[x]; if (c < 0) continue;
      pxA.push(x - padW / 2); pyA.push(y - padH / 2); ownA.push(c);
    }
  }
  return { px: Float32Array.from(pxA), py: Float32Array.from(pyA), own: Int16Array.from(ownA),
           pc: pxA.length, n, charCx, charCy, fs, w: widest, h: lh * rows.length, rows: rows.length };
}

/* ============================ 4 · 句索引 ============================ */
let brewIdx = -1, lastT = -1;
const hintShow = (s, o) => { hint.textContent = s; hint.style.opacity = o; };

/* ============================ 5 · 相机 ============================ */
const cam = { x: 0, y: 0, z: 1, tz: 1, vz: 0, tx: 0, ty: 0, rot: 0, vrot: 0, sh: 0, dirx: 0, diry: 0, shx: 0, shy: 0 };
function camShake(dx, dy, amp) { const l = Math.hypot(dx, dy) || 1; cam.dirx = dx / l; cam.diry = dy / l; cam.sh = Math.min(22, Math.max(cam.sh, amp)); }
function camUpdate(dt, T) {
  const ke = 1 - Math.pow(0.002, dt);
  cam.x += (cam.tx - cam.x) * ke * 0.9;
  cam.y += (cam.ty - cam.y) * ke * 0.9;
  cam.vz += ((cam.tz - cam.z) * 150 - cam.vz * 22) * dt;
  cam.z += cam.vz * dt;
  cam.vrot += (-cam.rot * 230 - cam.vrot * 21) * dt;
  cam.rot += cam.vrot * dt;
  cam.sh *= Math.pow(0.00004, dt);
  const wob = Math.sin(T * 61.3) * 0.6 + Math.sin(T * 42.7 + 1.2) * 0.4;
  cam.shx = cam.dirx * cam.sh * wob;
  cam.shy = cam.diry * cam.sh * wob;
}

/* ============================ 6 · 顿帧 / 闪白 ============================ */
const AE = { freeze: 0, flash: 0 };
const hitStop = (s) => { AE.freeze = Math.max(AE.freeze, s); };
const flash = (v) => { AE.flash = Math.max(AE.flash, v); };

/* ============================ 7 · 束流状态 ============================ */
let spanFired = new Uint8Array(0);
let charChars = null;
let charGlow = new Float32Array(0);
let spans = [];
let blockGx = 0, blockGy = 0;

/* 写入头：沿采样点顺序前进的指针（浮点，好做变速） */
let ptr = 0, ptrSpd = 0;
/* 滚屏（场同步丢失） */
let roll = 0, rollV = 0;
/* 束流当前屏幕位置（画拖着的那一小段亮痕用） */
let beamX = 0, beamY = 0, beamOn = 0;

/* 预烘扫描线纹理（canvas 层再来一层更细的） */
let scanCv = null;
function buildScan() {
  if (!scanCv) scanCv = document.createElement('canvas');
  scanCv.width = 4; scanCv.height = 4;
  const g = scanCv.getContext('2d');
  g.clearRect(0, 0, 4, 4);
  g.fillStyle = 'rgba(0,0,0,0.30)';
  g.fillRect(0, 0, 4, 1);
}

let bgGrad = null;
function buildBg() {
  if (!bgCv) bgCv = document.createElement('canvas');
  const bw = Math.round(W / 2), bh = Math.round(H / 2);
  bgCv.width = bw; bgCv.height = bh;
  const g = bgCv.getContext('2d');
  const grd = g.createRadialGradient(bw / 2, bh * 0.48, 0, bw / 2, bh * 0.48, Math.max(bw, bh) * 0.72);
  grd.addColorStop(0, '#08131a');
  grd.addColorStop(0.5, '#050b10');
  grd.addColorStop(1, '#010306');
  g.fillStyle = grd; g.fillRect(0, 0, bw, bh);
}

/* ============================ 8 · 布局（预取） ============================ */
let prep = null;
function prepLine(idx) {
  const line = lines[idx];
  if (!line || !line.text) return null;
  const text = line.text;
  const latin = isLatin(text);
  const fs0 = latin ? 76 : (text.length <= 10 ? 100 : text.length <= 16 ? 86 : 72);
  const g = sampleGlyph(text, { fs: fs0, maxW: Math.min(W * 0.70, 1120), maxH: H * 0.44 });
  if (!g.pc) return null;
  g.text = text;
  charChars = line.chars && line.chars.length === text.length ? line.chars : null;
  const raw = spansForLine(text);
  const spanOf = new Int16Array(g.n).fill(-1);
  const spList = [];
  for (let k = 0; k < raw.length; k++) {
    const s = raw[k];
    if (!s || s.i1 <= s.i0) continue;
    let t;
    if (charChars && charChars[s.i0] && typeof charChars[s.i0].t === 'number') t = charChars[s.i0].t;
    else t = line.t + (line.dur || 4) * (s.i0 / Math.max(1, text.length));
    spList.push({ i0: s.i0, i1: s.i1, t });
    for (let c = s.i0; c < s.i1; c++) spanOf[c] = spList.length - 1;
  }
  if (!spList.length) return null;
  for (let k = 1; k < spList.length; k++) if (spList[k].t < spList[k - 1].t) spList[k].t = spList[k - 1].t;
  return { idx, g, spans: spList, spanOf, cc: charChars };
}

function assignLine(idx) {
  const use = (prep && prep.idx === idx) ? prep : prepLine(idx);
  if (!use) { L = null; return; }
  const g = use.g;
  L = g; spans = use.spans; charChars = use.cc;
  charGlow = new Float32Array(g.n);
  spanFired = new Uint8Array(spans.length);
  blockGx = W / 2;
  blockGy = H * 0.455;
  ptr = 0;
  /* 写入速度：整行的点数在一个 dur 内扫完（留 22% 余量给它"停住"给人读） */
  const dur = Math.max(0.8, (lines[idx].dur || 4) * 0.78);
  ptrSpd = g.pc / dur;
  /* 换句：场同步丢失 —— 整屏向上滚一下 */
  rollV = rnd(700, 1100);
  if (pctx) pctx.clearRect(0, 0, PW, PH);
  cam.tz = 1.0;
}

/* ============================ 9 · 主循环 ============================ */
let last = performance.now();
let T0 = 0;
let lookX = 0, lookY = 0;

function frame(nowMs) {
  const dtReal = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; T0 += dtReal;
  if (AE.freeze > 0) AE.freeze -= dtReal;
  const dt = AE.freeze > 0 ? 0 : dtReal;

  const T = now();
  timing(T);

  /* ---- 镜头：缓慢推镜 + 跟随正在唱的字 ---- */
  if (L && curIdx >= 0 && L.n > 0) {
    let c = 0;
    if (charChars) { for (let k = 0; k < charChars.length; k++) if (charChars[k].t <= T) c = k; }
    else c = Math.min(L.n - 1, Math.floor(clamp01((T - lines[curIdx].t) / Math.max(0.3, lines[curIdx].dur || 4)) * L.n));
    lookX += (blockGx + L.charCx[c] - lookX) * Math.min(1, dtReal * 2.2);
    lookY += (blockGy + L.charCy[c] - lookY) * Math.min(1, dtReal * 2.2);
  }
  cam.tx = W / 2 + (lookX - W / 2) * 0.3;
  cam.ty = H / 2 + (lookY - H / 2) * 0.3;
  cam.tz = 1.02 + Math.sin(T0 * 0.13) * 0.02;      // 极缓慢的呼吸推镜
  camUpdate(dtReal, T0);

  /* ---- 逐字亮度（YRC） ---- */
  if (L) {
    if (charChars) for (let c = 0; c < L.n; c++) charGlow[c] = charChars[c] ? clamp01((T - charChars[c].t) / 0.22) : 0;
    else {
      const lt = lines[curIdx] ? lines[curIdx].t : 0, ld = lines[curIdx] ? (lines[curIdx].dur || 4) : 4;
      for (let c = 0; c < L.n; c++) charGlow[c] = clamp01((T - lt - ld * 0.85 * c / L.n) / 0.3);
    }
  }

  /* ---- 每团到点：顿帧 + 闪白 + 震动 ---- */
  if (L && curIdx >= 0) {
    for (let k = 0; k < spans.length; k++) {
      if (spanFired[k] || T < spans[k].t) continue;
      spanFired[k] = 1;
      const first = k === 0;
      hitStop(first ? 0.042 : 0.02);
      flash(first ? 0.5 : 0.26);
      camShake(Math.cos(k * 2.3), Math.sin(k * 2.3), first ? 8 : 4.5);
      cam.vrot += (Math.random() < 0.5 ? -1 : 1) * (first ? 0.7 : 0.35);
    }
  }
  /* 滚屏回稳 */
  roll += rollV * dtReal;
  rollV += (-roll * 150 - rollV * 13) * dtReal;
  if (Math.abs(roll) < 0.5 && Math.abs(rollV) < 8) { roll = 0; rollV = 0; }

  /* ================= 束流写入 ================= */
  if (L && dt > 0 && pctx) {
    const target = Math.min(L.pc, ptr + ptrSpd * dt);
    /* 每帧打一批点（限量，别一帧写几千个） */
    const cap = 220;
    let done = 0;
    const gz = cam.z;
    const ex = W / 2 + cam.shx, ey = H / 2 + cam.shy;
    while (ptr < target && done < cap) {
      const k = Math.floor(ptr);
      const wx = blockGx + L.px[k], wy = blockGy + L.py[k];
      const sx = ex + (wx - cam.x) * gz, sy = ey + (wy - cam.y) * gz;
      const c = L.own[k];
      const lit = charGlow[c] > 0.5;
      pctx.globalCompositeOperation = 'lighter';
      pctx.fillStyle = lit
        ? `rgba(${Math.min(255, accent[0] + 40)},${Math.min(255, accent[1] + 10)},${Math.min(255, accent[2] + 20)},1)`
        : `rgba(${Math.min(255, accent[0] - 42)},${Math.min(255, accent[1] - 30)},${Math.min(255, accent[2] - 46)},0.55)`;
      const s = lit ? 3.0 : 2.3;
      pctx.fillRect(sx / PK - s * 0.5, sy / PK - s * 0.5, s, s);
      beamX = sx; beamY = sy; beamOn = 1;
      ptr += 1;
      done++;
    }
    if (done >= cap) ptr = Math.min(ptr, target);   // 限量时别把指针跑飞
  }
  /* 余辉：荧光层整体褪色，最后在屏幕上 blit 一次 */
  if (pctx) {
    pctx.globalCompositeOperation = 'destination-out';
    pctx.fillStyle = 'rgba(0,0,0,0.010)';   // 余辉要够久，否则写完就看不见了
    pctx.fillRect(0, 0, PW, PH);
    pctx.globalCompositeOperation = 'source-over';
  }
  beamOn *= Math.pow(0.02, dtReal);

  /* ================= 绘制 ================= */
  const [ar, ag, ab] = accent;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#03060a';
  ctx.fillRect(0, 0, W, H);
  if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);

  /* 荧光层：整层按滚屏偏移 blit（超出部分在上下各贴一次，形成"滚动"）
     位置只在 blit 时偏移，粒子坐标不动 —— 这样滚屏不会破坏字形数据 */
  if (phos) {
    ctx.globalCompositeOperation = 'lighter';
    const rr = ((roll % H) + H) % H;
    ctx.drawImage(phos, 0, 0, PW, PH, 0, rr, W, H);
    if (rr > 0.5) ctx.drawImage(phos, 0, 0, PW, PH, 0, rr - H, W, H);
  }

  /* 束流：亮点 + 身后一小段横痕（像真实的扫描线） */
  if (beamOn > 0.02) {
    ctx.fillStyle = `rgba(220,255,246,${(beamOn * 0.16).toFixed(3)})`;
    ctx.fillRect(beamX - 90, beamY - 1.2, 180, 2.4);
    ctx.fillStyle = `rgba(255,255,255,${(beamOn * 0.75).toFixed(3)})`;
    ctx.fillRect(beamX - 3.5, beamY - 3.5, 7, 7);
  }

  /* 细扫描线（canvas 这一层再叠一道，配合 CSS 那层） */
  if (scanCv) {
    ctx.globalAlpha = 0.5;
    const pat = ctx.createPattern(scanCv, 'repeat');
    if (pat) { ctx.fillStyle = pat; ctx.fillRect(0, 0, W, H); }
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';

  if (AE.flash > 0.012) {
    ctx.fillStyle = `rgba(200,255,240,${(AE.flash * 0.05).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    AE.flash *= Math.pow(0.0000045, dtReal);
  }

  requestAnimationFrame(frame);
}

/* ============================ 10 · 节奏 ============================ */
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1; L = null; prep = null; ptr = 0;
    if (pctx) pctx.clearRect(0, 0, PW, PH);
  }
  lastT = T;
  let c = curIdx;
  while (c + 1 < lines.length && T >= lines[c + 1].t) c++;
  if (c !== curIdx) {
    curIdx = c; brewIdx = -1; prep = null;
    if (curIdx >= 0) { lookX = W / 2; lookY = H * 0.455; assignLine(curIdx); hintShow('', 0); }
    else hintShow(lines.length ? '等待第一句…' : '这首没有歌词', 0.5);
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    if (T >= lines[nx].t - Math.min(1.5, Math.max(0.55, gap * 0.5))) { brewIdx = nx; prep = prepLine(nx); }
  }
}

/* ============================ 11 · 通信协议 ============================ */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent && p.accent.length >= 3) {
      /* 显像管不能真的变紫：把主色往青绿荧光上压一点，保留一点封面色相 */
      accent = [Math.round(p.accent[0] * 0.35 + 90), Math.round(p.accent[1] * 0.55 + 140), Math.round(p.accent[2] * 0.45 + 120)];
    }
    curIdx = -1; brewIdx = -1; lastT = -1; L = null; prep = null; ptr = 0;
    if (pctx) pctx.clearRect(0, 0, PW, PH);
    clockT = 0; clockAt = performance.now();
    hintShow(lines.length ? '等待第一句…' : '这首没有歌词', lines.length ? 1 : 0.5);
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    const lv = (d.payload && d.payload.level) || 0.6;
    /* 踩拍：整屏一起抖一下（相干） */
    camShake(Math.cos(T0 * 1.3), Math.sin(T0 * 1.3), 1.8 + lv * 3);
    rollV += lv * 26;
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => ({
  curIdx, n: lines.length, pc: L ? L.pc : 0, ptr: Math.round(ptr),
  spans: spans.length, roll: Math.round(roll), z: +cam.z.toFixed(3), t: +now().toFixed(2),
});

/* ============================ 12 · 启动 ============================ */
buildScan();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
