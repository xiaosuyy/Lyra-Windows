<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>葬夜圣咏 · 421</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#040405;overflow:hidden;color-scheme:dark;}
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;}
  #grain{
    position:fixed;inset:-10%;pointer-events:none;opacity:.30;
    background-repeat:repeat;background-size:200px 200px;
    animation:grainShift 1.05s steps(1) infinite;
    will-change:background-position;
  }
  @keyframes grainShift{
    0%{background-position:0 0}
    14%{background-position:-42px 18px}
    28%{background-position:26px -34px}
    42%{background-position:-18px -12px}
    56%{background-position:38px 26px}
    70%{background-position:-30px 40px}
    84%{background-position:12px -22px}
    100%{background-position:-8px 6px}
  }
  #empty{
    position:fixed;left:50%;bottom:16%;transform:translateX(-50%);
    width:min(80vw,640px);text-align:center;pointer-events:none;
    color:#cfc8c0;opacity:0;transition:opacity 900ms ease;
    font-family:"Times New Roman","Songti SC","SimSun",serif;
    font-size:clamp(13px,1.55vw,19px);line-height:2;
    letter-spacing:.38em;text-indent:.38em;
    text-shadow:0 0 24px rgba(0,0,0,.9);
  }
  #empty .sub{
    display:block;margin-top:.9em;font-size:.62em;letter-spacing:.52em;
    text-indent:.52em;opacity:.62;
  }
  #empty.show{opacity:.72;}
  @media (prefers-reduced-motion: reduce){
    #grain{animation:none;}
    #empty{transition:none;}
  }
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="empty">此曲无词 · 唯余钟声<span class="sub">NOCTURNE WITHOUT WORDS</span></div>
<script>
(function () {
  'use strict';

  /* ============================================================
     0. 自检口：脚本最外层无条件赋值（第一段）
     ============================================================ */
  var report = { lines: 0, idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', gl: false, rm: false };
  window.__stage = function () { return report; };

  /* ============================================================
     1. 基础环境（在任何 boot / 烘焙之前）
     ============================================================ */
  var reducedMotion = false;
  try {
    reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (err) { console.error('[421] matchMedia', err); }
  report.rm = reducedMotion;

  var lastErrorTime = -1e9;
  function reportError(where, err) {
    var now = (window.performance && window.performance.now) ? window.performance.now() : Date.now();
    if (now - lastErrorTime < 1000) return;
    lastErrorTime = now;
    try { console.error('[421] ' + where, err); } catch (ignore) {}
  }

  /* ============================================================
     2. ready：第一个 rAF 里无条件发出 + 定时兜底，只发一次
        （排 rAF 与兜底都必须早于所有 boot / GL / 烘焙）
     ============================================================ */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (err) { reportError('ready', err); }
  }

  var bootStarted = false;
  function firstFrame() {
    sendReady();
    if (bootStarted) return;
    bootStarted = true;
    try { boot(); } catch (err) { reportError('boot', err); }
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(function () {
      try { firstFrame(); } catch (err) { reportError('firstFrame', err); sendReady(); }
    });
  } else {
    window.setTimeout(firstFrame, 16);
  }
  window.setTimeout(sendReady, 900);

  /* ============================================================
     3. 舞台状态（消息先到、boot 后到都要吃得下）
     ============================================================ */
  var stage = {
    lines: [],
    idx: -1,
    time: 0,
    playing: true,
    duration: 0,
    songName: '',
    artists: '',
    accent: null,
    fontFamily: '"Times New Roman","Songti SC","STSong","SimSun",Georgia,serif'
  };

  var view = { width: 1440, height: 900, dpr: 1, ready: false };
  var canvas = document.getElementById('stage');
  var ctx = canvas ? canvas.getContext('2d') : null;
  var emptyNode = document.getElementById('empty');

  function clampNumber(value, low, high, fallback) {
    var numeric = Number(value);
    if (!isFinite(numeric)) numeric = fallback;
    if (numeric < low) numeric = low;
    if (numeric > high) numeric = high;
    return numeric;
  }

  function resizeStage() {
    var rawWidth = window.innerWidth;
    var rawHeight = window.innerHeight;
    if (!isFinite(rawWidth) || rawWidth <= 0) rawWidth = 1440;
    if (!isFinite(rawHeight) || rawHeight <= 0) rawHeight = 900;
    view.width = clampNumber(rawWidth, 320, 4096, 1440);
    view.height = clampNumber(rawHeight, 240, 4096, 900);
    /* 大面积画布压到 1.5 倍，省下四层全屏渐变的填充量 */
    var dprCap = (view.width * view.height > 700000) ? 1.5 : 2;
    view.dpr = clampNumber(window.devicePixelRatio, 1, dprCap, 1);
    if (canvas) {
      canvas.width = Math.max(1, Math.round(view.width * view.dpr));
      canvas.height = Math.max(1, Math.round(view.height * view.dpr));
    }
    if (ctx) {
      try { ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); }
      catch (err) { reportError('setTransform', err); }
    }
    view.ready = true;
    onResize();
  }

  /* ============================================================
     4. 歌词数据：归一化 / 定位当前句
     ============================================================ */
  function normalizeLines(rawLines) {
    var list = [];
    if (!Array.isArray(rawLines)) return list;
    var limit = Math.min(rawLines.length, 4000);
    for (var lineIndex = 0; lineIndex < limit; lineIndex++) {
      var item = rawLines[lineIndex];
      if (!item || typeof item !== 'object') continue;
      var text = (item.text === null || typeof item.text === 'undefined') ? '' : String(item.text);
      text = text.replace(/\s+/g, ' ').trim();
      var start = Number(item.t);
      if (!isFinite(start)) start = 0;
      var durationValue = Number(item.dur);
      if (!isFinite(durationValue) || durationValue < 0) durationValue = 0;
      var chars = null;
      if (Array.isArray(item.chars) && item.chars.length) {
        chars = [];
        var charLimit = Math.min(item.chars.length, 2000);
        for (var charIndex = 0; charIndex < charLimit; charIndex++) {
          var charItem = item.chars[charIndex];
          if (!charItem || typeof charItem !== 'object') continue;
          var charTime = Number(charItem.t);
          if (!isFinite(charTime)) charTime = start;
          chars.push({ c: String(charItem.c === null || typeof charItem.c === 'undefined' ? '' : charItem.c), t: charTime });
        }
        if (!chars.length) chars = null;
      }
      if (!text && !chars) continue;
      if (!text && chars) {
        var joined = '';
        for (var joinIndex = 0; joinIndex < chars.length; joinIndex++) joined += chars[joinIndex].c;
        text = joined;
      }
      list.push({ t: start, dur: durationValue, text: text, chars: chars });
    }
    list.sort(function (left, right) { return left.t - right.t; });
    return list;
  }

  function findLineIndex(list, time) {
    if (!list.length) return -1;
    if (time < list[0].t) return -1;
    var low = 0;
    var high = list.length - 1;
    var found = 0;
    while (low <= high) {
      var mid = (low + high) >> 1;
      if (list[mid].t <= time) { found = mid; low = mid + 1; } else { high = mid - 1; }
    }
    return found;
  }

  function applyInit(payload) {
    var safePayload = payload && typeof payload === 'object' ? payload : {};
    var song = safePayload.song && typeof safePayload.song === 'object' ? safePayload.song : {};
    stage.songName = song.name ? String(song.name) : '';
    var rawArtists = song.artists;
    if (Array.isArray(rawArtists)) {
      var names = [];
      var artistLimit = Math.min(rawArtists.length, 12);
      for (var artistIndex = 0; artistIndex < artistLimit; artistIndex++) {
        if (rawArtists[artistIndex]) names.push(String(rawArtists[artistIndex]));
      }
      stage.artists = names.join(' / ');
    } else if (rawArtists) {
      stage.artists = String(rawArtists);
    } else {
      stage.artists = '';
    }
    var accent = safePayload.accent;
    if (Array.isArray(accent) && accent.length >= 3) {
      stage.accent = [
        Math.round(clampNumber(accent[0], 0, 255, 206)),
        Math.round(clampNumber(accent[1], 0, 255, 198)),
        Math.round(clampNumber(accent[2], 0, 255, 190))
      ];
    } else {
      stage.accent = [206, 198, 190];
    }
    stage.duration = clampNumber(safePayload.duration, 0, 20000, 0);
    stage.lines = normalizeLines(safePayload.lines);
    stage.idx = -1;
    resetClock();
    report.lines = stage.lines.length;
    invalidateLyricLayout();
    invalidateSlate();
    if (emptyNode) {
      if (stage.lines.length === 0) emptyNode.classList.add('show');
      else emptyNode.classList.remove('show');
    }
    refreshLine(true);
  }

  function applyTick(payload) {
    var safePayload = payload && typeof payload === 'object' ? payload : {};
    var time = Number(safePayload.time);
    if (isFinite(time)) stage.time = time; // 无条件采纳，大跨度跳变照收
    if (typeof safePayload.playing === 'boolean') stage.playing = safePayload.playing;
    refreshLine(false);
  }

  function refreshLine(force) {
    var nextIndex = findLineIndex(stage.lines, stage.time);
    if (nextIndex !== stage.idx || force) {
      stage.idx = nextIndex;
      report.idx = nextIndex;
      lyric.transitionAt = (window.performance && window.performance.now ? window.performance.now() : Date.now());
      invalidateLyricLayout();
    }
    report.t = stage.time;
    report.playing = stage.playing;
    report.text = stage.idx >= 0 && stage.idx < stage.lines.length ? stage.lines[stage.idx].text : '';
  }

  function applyBeat(payload) {
    var safePayload = payload && typeof payload === 'object' ? payload : {};
    var level = clampNumber(safePayload.level, 0, 2, 0.45);
    scene.beatPunch = Math.min(1.8, scene.beatPunch * 0.55 + level);
  }

  function applyLive(payload) {
    var safePayload = payload && typeof payload === 'object' ? payload : {};
    scene.liveLevel = clampNumber(safePayload.level, 0, 1, scene.liveLevel);
    scene.liveBass = clampNumber(safePayload.bass, 0, 1, scene.liveBass);
    scene.liveTreble = clampNumber(safePayload.treble, 0, 1, scene.liveTreble);
    if (typeof safePayload.playing === 'boolean') stage.playing = safePayload.playing;
    report.playing = stage.playing;
  }

  window.addEventListener('message', function (event) {
    var data = event ? event.data : null;
    if (!data || typeof data !== 'object' || data.__c100 !== 1) return;
    try {
      if (data.type === 'init') applyInit(data.payload);
      else if (data.type === 'tick') applyTick(data.payload);
      else if (data.type === 'beat') applyBeat(data.payload);
      else if (data.type === 'live') applyLive(data.payload);
    } catch (err) { reportError('message:' + String(data.type), err); }
  }, false);

  /* ============================================================
     5. 绘制护栏 + 程序化素材（全部本地生成，零外部请求）
     ============================================================ */
  function clamp01(value) {
    var numeric = Number(value);
    if (!isFinite(numeric)) numeric = 0;
    if (numeric < 0) return 0;
    if (numeric > 1) return 1;
    return numeric;
  }

  function colorText(red, green, blue, alphaValue) {
    var safeRed = Math.round(clampNumber(red, 0, 255, 0));
    var safeGreen = Math.round(clampNumber(green, 0, 255, 0));
    var safeBlue = Math.round(clampNumber(blue, 0, 255, 0));
    return 'rgba(' + safeRed + ',' + safeGreen + ',' + safeBlue + ',' + clamp01(alphaValue).toFixed(3) + ')';
  }

  function safeBeginPath(target) {
    if (target && typeof target.beginPath === 'function') { target.beginPath(); return true; }
    return false;
  }

  function addStop(gradient, offset, color) {
    if (!gradient || typeof gradient.addColorStop !== 'function') return false;
    try { gradient.addColorStop(clamp01(offset), color); return true; }
    catch (err) { reportError('addColorStop', err); return false; }
  }

  function canDrawImage(source) {
    if (!source) return false;
    var isCanvas = false;
    try {
      isCanvas = (typeof HTMLCanvasElement !== 'undefined' && source instanceof HTMLCanvasElement) ||
                 (typeof OffscreenCanvas !== 'undefined' && source instanceof OffscreenCanvas);
    } catch (err) { isCanvas = false; }
    if (!isCanvas) return false;
    return source.width > 0 && source.height > 0;
  }

  function makeCanvas(width, height) {
    var node = document.createElement('canvas');
    node.width = Math.max(1, Math.round(width));
    node.height = Math.max(1, Math.round(height));
    return node;
  }

  var accentFallback = [206, 198, 190];
  function accentColor(alphaValue, lift) {
    var base = (Array.isArray(stage.accent) && stage.accent.length >= 3) ? stage.accent : accentFallback;
    var mix = clamp01(lift);
    return colorText(
      base[0] * (1 - mix) + 242 * mix,
      base[1] * (1 - mix) + 238 * mix,
      base[2] * (1 - mix) + 230 * mix,
      alphaValue
    );
  }

  /* ---------- 5.1 烘焙：颗粒 / 雾 / 暗角 ---------- */
  var baked = { grain: null, fogSprites: [], vignette: null, vignetteKey: '' };

  function bakeGrainTile() {
    var tileSize = 200;
    var tile = makeCanvas(tileSize, tileSize);
    var tileCtx = tile.getContext('2d');
    if (!tileCtx) return null;
    var image = null;
    try { image = tileCtx.createImageData(tileSize, tileSize); }
    catch (err) { reportError('bakeGrain', err); return null; }
    var data = image.data;
    for (var pixel = 0; pixel < data.length; pixel += 4) {
      var value = Math.round(118 + (Math.random() - 0.5) * 190);
      data[pixel] = value;
      data[pixel + 1] = value;
      data[pixel + 2] = value;
      data[pixel + 3] = Math.random() < 0.62 ? 52 : 20;
    }
    tileCtx.putImageData(image, 0, 0);
    return tile;
  }

  function bakeFogSprite(seed) {
    var spriteWidth = 640;
    var spriteHeight = 220;
    var sprite = makeCanvas(spriteWidth, spriteHeight);
    var spriteCtx = sprite.getContext('2d');
    if (!spriteCtx) return null;
    var random = seed;
    function nextRandom() {
      random = (random * 16807) % 2147483647;
      return random / 2147483647;
    }
    for (var blob = 0; blob < 24; blob++) {
      var blobX = nextRandom() * spriteWidth;
      var blobY = spriteHeight * (0.25 + nextRandom() * 0.55);
      var blobRadius = 45 + nextRandom() * 130;
      var blobGradient = spriteCtx.createRadialGradient(blobX, blobY, 0, blobX, blobY, blobRadius);
      addStop(blobGradient, 0, 'rgba(224,220,212,0.20)');
      addStop(blobGradient, 0.55, 'rgba(216,212,204,0.07)');
      addStop(blobGradient, 1, 'rgba(210,206,198,0)');
      spriteCtx.fillStyle = blobGradient;
      spriteCtx.fillRect(blobX - blobRadius, blobY - blobRadius, blobRadius * 2, blobRadius * 2);
    }
    try {
      spriteCtx.globalCompositeOperation = 'destination-in';
      var edgeFade = spriteCtx.createLinearGradient(0, 0, spriteWidth, 0);
      addStop(edgeFade, 0, 'rgba(255,255,255,0)');
      addStop(edgeFade, 0.22, 'rgba(255,255,255,1)');
      addStop(edgeFade, 0.78, 'rgba(255,255,255,1)');
      addStop(edgeFade, 1, 'rgba(255,255,255,0)');
      spriteCtx.fillStyle = edgeFade;
      spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);
      var verticalFade = spriteCtx.createLinearGradient(0, 0, 0, spriteHeight);
      addStop(verticalFade, 0, 'rgba(255,255,255,0)');
      addStop(verticalFade, 0.32, 'rgba(255,255,255,1)');
      addStop(verticalFade, 0.68, 'rgba(255,255,255,1)');
      addStop(verticalFade, 1, 'rgba(255,255,255,0)');
      spriteCtx.fillStyle = verticalFade;
      spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);
      spriteCtx.globalCompositeOperation = 'source-over';
    } catch (err) { reportError('bakeFog', err); }
    return sprite;
  }

  function bakeAssets() {
    baked.grain = bakeGrainTile();
    applyGrainOverlay();
    baked.fogSprites = [];
    var fogFirst = bakeFogSprite(97);
    var fogSecond = bakeFogSprite(5171);
    if (canDrawImage(fogFirst)) baked.fogSprites.push(fogFirst);
    if (canDrawImage(fogSecond)) baked.fogSprites.push(fogSecond);
  }

  var grainNode = document.getElementById('grain');
  function applyGrainOverlay() {
    if (!grainNode || !canDrawImage(baked.grain)) return;
    try {
      grainNode.style.backgroundImage = 'url(' + baked.grain.toDataURL('image/png') + ')';
    } catch (err) { reportError('grainOverlay', err); }
  }

  /* ---------- 5.2 相机 / 投影（真 3D 坐标 → 屏幕） ---------- */
  var camera = { x: 0, y: 1.05, z: 0, focal: 900, shakeX: 0, shakeY: 0, driftPhase: 0 };
  var nave = { halfWidth: 5.6, floorY: -3.3, springY: 1.5, apexY: 7.0, nearZ: 3.0, farZ: 27.0, bays: 12 };

  function projectTo(worldX, worldY, worldZ) {
    var depth = worldZ - camera.z;
    if (!(depth > 0.9)) depth = 0.9;
    var scale = camera.focal / depth;
    return {
      x: view.width * 0.5 + camera.shakeX + (worldX - camera.x) * scale,
      y: view.height * 0.5 + camera.shakeY - (worldY - camera.y) * scale,
      scale: scale,
      depth: depth
    };
  }

  function depthFade(worldZ) {
    var span = Math.max(0.001, nave.farZ - nave.nearZ);
    var ratio = clamp01((worldZ - nave.nearZ) / span);
    return Math.pow(1 - ratio, 1.35);
  }

  function strokeWorldLine(fromX, fromY, fromZ, toX, toY, toZ, alphaValue, widthValue) {
    if (!ctx) return;
    var start = projectTo(fromX, fromY, fromZ);
    var end = projectTo(toX, toY, toZ);
    if (!safeBeginPath(ctx)) return;
    ctx.strokeStyle = colorText(226, 221, 212, alphaValue);
    ctx.lineWidth = Math.max(0.4, widthValue);
    ctx.moveTo(start.x, start.y);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
  }

  /* 每一跨的手工歪斜：1920 年代表现主义布景本来就是歪的，但必须逐帧稳定 */
  function bayJitter(indexValue, salt) {
    var seedValue = Math.sin(indexValue * 12.9898 + salt * 78.233) * 43758.5453;
    return (seedValue - Math.floor(seedValue)) * 2 - 1;
  }

  function stationWobble(station) {
    return {
      apexX: bayJitter(station, 11) * 0.40,
      apexY: bayJitter(station, 23) * 0.22,
      leftY: bayJitter(station, 37) * 0.13,
      rightY: bayJitter(station, 53) * 0.13
    };
  }

  function strokePointedArch(worldZ, alphaValue, widthValue, wobble) {
    if (!ctx) return;
    var springY = nave.springY;
    var apexY = nave.apexY;
    var leftSpring = springY + wobble.leftY;
    var rightSpring = springY + wobble.rightY;
    var apex = apexY + wobble.apexY;
    var left = projectTo(-nave.halfWidth, leftSpring, worldZ);
    var right = projectTo(nave.halfWidth, rightSpring, worldZ);
    var apexPoint = projectTo(wobble.apexX, apex, worldZ);
    var leftControl = projectTo(-nave.halfWidth * 0.52, leftSpring + (apex - leftSpring) * 0.94, worldZ);
    var rightControl = projectTo(nave.halfWidth * 0.52, rightSpring + (apex - rightSpring) * 0.94, worldZ);
    if (!safeBeginPath(ctx)) return;
    ctx.strokeStyle = colorText(228, 223, 214, alphaValue);
    ctx.lineWidth = Math.max(0.4, widthValue);
    ctx.moveTo(left.x, left.y);
    ctx.quadraticCurveTo(leftControl.x, leftControl.y, apexPoint.x, apexPoint.y);
    ctx.quadraticCurveTo(rightControl.x, rightControl.y, right.x, right.y);
    ctx.stroke();
  }

  function drawWallWindow(sideValue, nearZ, farZ, bottomY, topY) {
    if (!ctx) return;
    var wallX = sideValue * nave.halfWidth;
    var midZ = (nearZ + farZ) * 0.5;
    var bottomNear = projectTo(wallX, bottomY, nearZ);
    var topNear = projectTo(wallX, topY, nearZ);
    var peak = projectTo(wallX, topY + (topY - bottomY) * 0.16, midZ);
    var topFar = projectTo(wallX, topY, farZ);
    var bottomFar = projectTo(wallX, bottomY, farZ);
    var fade = depthFade(midZ);
    var glow = 0.015 + 0.09 * Math.pow(fade, 1.6);
    if (!safeBeginPath(ctx)) return;
    ctx.moveTo(bottomNear.x, bottomNear.y);
    ctx.lineTo(topNear.x, topNear.y);
    ctx.lineTo(peak.x, peak.y);
    ctx.lineTo(topFar.x, topFar.y);
    ctx.lineTo(bottomFar.x, bottomFar.y);
    ctx.closePath();
    ctx.fillStyle = colorText(240, 234, 222, glow);
    ctx.fill();
  }

  function drawBackdrop() {
    if (!ctx) return;
    var backdrop = ctx.createLinearGradient(0, 0, 0, view.height);
    var painted = addStop(backdrop, 0, 'rgba(9,9,12,1)');
    addStop(backdrop, 0.42, 'rgba(7,7,10,1)');
    addStop(backdrop, 0.74, 'rgba(4,4,6,1)');
    addStop(backdrop, 1, 'rgba(2,2,3,1)');
    ctx.fillStyle = painted ? backdrop : '#08080b';
    ctx.fillRect(0, 0, view.width, view.height);
  }

  function drawNave() {
    if (!ctx) return;
    var bayCount = scene.quality >= 2 ? nave.bays : (scene.quality === 1 ? 9 : 7);
    var baySpan = (nave.farZ - nave.nearZ) / bayCount;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';
    for (var bayIndex = bayCount; bayIndex >= 1; bayIndex--) {
      if (bayIndex % 2 !== 0) continue;
      var nearEdge = nave.nearZ + (bayIndex - 1) * baySpan;
      var farEdge = nave.nearZ + bayIndex * baySpan;
      drawWallWindow(-1, nearEdge, farEdge, nave.floorY + 1.15, nave.springY + (nave.apexY - nave.springY) * 0.58);
      drawWallWindow(1, nearEdge, farEdge, nave.floorY + 1.15, nave.springY + (nave.apexY - nave.springY) * 0.58);
    }
    for (var station = bayCount; station >= 0; station--) {
      var worldZ = nave.nearZ + station * baySpan;
      var fade = depthFade(worldZ);
      if (fade <= 0.008) continue;
      var lineAlpha = 0.05 + 0.46 * Math.pow(fade, 1.7);
      var lineWidth = 0.65 + 2.0 * Math.pow(fade, 1.15);
      var wobble = stationWobble(station);
      strokePointedArch(worldZ, lineAlpha, lineWidth, wobble);
      strokeWorldLine(-nave.halfWidth, nave.floorY, worldZ, -nave.halfWidth, nave.springY + wobble.leftY, worldZ, lineAlpha * 0.85, lineWidth * 0.85);
      strokeWorldLine(nave.halfWidth, nave.floorY, worldZ, nave.halfWidth, nave.springY + wobble.rightY, worldZ, lineAlpha * 0.85, lineWidth * 0.85);
    }
    for (var ribIndex = 0; ribIndex < bayCount; ribIndex++) {
      var ribNearZ = nave.nearZ + ribIndex * baySpan;
      var ribFarZ = ribNearZ + baySpan;
      var ribFade = depthFade((ribNearZ + ribFarZ) * 0.5);
      var ribAlpha = 0.035 + 0.33 * Math.pow(ribFade, 1.5);
      var ribWidth = 0.55 + 1.5 * ribFade;
      var nearWobble = stationWobble(ribIndex);
      var farWobble = stationWobble(ribIndex + 1);
      strokeWorldLine(-nave.halfWidth, nave.springY + nearWobble.leftY, ribNearZ, -nave.halfWidth, nave.springY + farWobble.leftY, ribFarZ, ribAlpha, ribWidth);
      strokeWorldLine(nave.halfWidth, nave.springY + nearWobble.rightY, ribNearZ, nave.halfWidth, nave.springY + farWobble.rightY, ribFarZ, ribAlpha, ribWidth);
      strokeWorldLine(nearWobble.apexX, nave.apexY + nearWobble.apexY, ribNearZ, farWobble.apexX, nave.apexY + farWobble.apexY, ribFarZ, ribAlpha * 1.2, ribWidth);
      strokeWorldLine(-nave.halfWidth, nave.floorY, ribNearZ, -nave.halfWidth, nave.floorY, ribFarZ, ribAlpha * 0.65, ribWidth * 0.8);
      strokeWorldLine(nave.halfWidth, nave.floorY, ribNearZ, nave.halfWidth, nave.floorY, ribFarZ, ribAlpha * 0.65, ribWidth * 0.8);
    }
  }

  function drawFarWindow(energy) {
    if (!ctx) return;
    var windowCenter = projectTo(0, (nave.springY + nave.apexY) * 0.6, nave.farZ);
    var bloomRadius = Math.max(70, view.height * (0.52 + 0.1 * energy));
    var bloom = ctx.createRadialGradient(windowCenter.x, windowCenter.y, 0, windowCenter.x, windowCenter.y, bloomRadius);
    addStop(bloom, 0, colorText(246, 241, 232, 0.20 + 0.10 * energy));
    addStop(bloom, 0.34, colorText(228, 222, 212, 0.075));
    addStop(bloom, 1, colorText(206, 202, 196, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, view.width, view.height);
    var leftSpring = projectTo(-nave.halfWidth * 0.92, nave.springY, nave.farZ);
    var rightSpring = projectTo(nave.halfWidth * 0.92, nave.springY, nave.farZ);
    var windowApex = projectTo(0, nave.apexY - 0.3, nave.farZ);
    var leftControl = projectTo(-nave.halfWidth * 0.48, nave.springY + (nave.apexY - nave.springY) * 0.95, nave.farZ);
    var rightControl = projectTo(nave.halfWidth * 0.48, nave.springY + (nave.apexY - nave.springY) * 0.95, nave.farZ);
    var floorNear = projectTo(0, nave.floorY + 1.6, nave.farZ);
    if (safeBeginPath(ctx)) {
      ctx.moveTo(leftSpring.x, leftSpring.y);
      ctx.quadraticCurveTo(leftControl.x, leftControl.y, windowApex.x, windowApex.y);
      ctx.quadraticCurveTo(rightControl.x, rightControl.y, rightSpring.x, rightSpring.y);
      ctx.lineTo(rightSpring.x, floorNear.y);
      ctx.lineTo(leftSpring.x, floorNear.y);
      ctx.closePath();
      var paneFill = ctx.createLinearGradient(0, windowApex.y, 0, floorNear.y);
      addStop(paneFill, 0, colorText(250, 247, 240, 0.52 + 0.16 * energy));
      addStop(paneFill, 0.5, colorText(238, 233, 224, 0.26));
      addStop(paneFill, 1, colorText(214, 210, 202, 0.06));
      ctx.fillStyle = paneFill;
      ctx.fill();
      ctx.strokeStyle = colorText(255, 252, 246, 0.7);
      ctx.lineWidth = 2.2;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    /* 石制窗棂：把“教堂”钉死，而不是一团光 */
    var mullionRatios = [-0.62, -0.31, 0, 0.31, 0.62];
    var paneHeight = nave.apexY - nave.springY;
    for (var mullionIndex = 0; mullionIndex < mullionRatios.length; mullionIndex++) {
      var ratio = mullionRatios[mullionIndex];
      var topWorldY = Math.min(nave.springY + paneHeight * (1 - Math.pow(Math.abs(ratio), 1.7)) - 0.15, nave.apexY - 0.4);
      var mullionTop = projectTo(ratio * nave.halfWidth * 0.9, topWorldY, nave.farZ);
      var mullionBottom = projectTo(ratio * nave.halfWidth * 0.9, nave.floorY + 1.6, nave.farZ);
      if (!safeBeginPath(ctx)) break;
      ctx.strokeStyle = 'rgba(4,4,5,0.78)';
      ctx.lineWidth = Math.max(1.4, 2.6 - Math.abs(ratio) * 1.2);
      ctx.moveTo(mullionTop.x, mullionTop.y);
      ctx.lineTo(mullionBottom.x, mullionBottom.y);
      ctx.stroke();
    }
    var transomY = nave.springY + paneHeight * 0.38;
    var transomLeft = projectTo(-nave.halfWidth * 0.9, transomY, nave.farZ);
    var transomRight = projectTo(nave.halfWidth * 0.9, transomY, nave.farZ);
    if (safeBeginPath(ctx)) {
      ctx.strokeStyle = 'rgba(4,4,5,0.72)';
      ctx.lineWidth = 2.2;
      ctx.moveTo(transomLeft.x, transomLeft.y);
      ctx.lineTo(transomRight.x, transomRight.y);
      ctx.stroke();
    }

    /* 湿石地板上的窗影 */
    var floorGlow = ctx.createRadialGradient(windowCenter.x, floorNear.y, 0, windowCenter.x, floorNear.y, view.height * 0.22);
    addStop(floorGlow, 0, colorText(240, 236, 228, 0.10 + 0.05 * energy));
    addStop(floorGlow, 0.5, colorText(228, 224, 216, 0.035));
    addStop(floorGlow, 1, colorText(220, 216, 208, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.save();
    ctx.translate(windowCenter.x, floorNear.y);
    ctx.scale(1, 0.34);
    ctx.translate(-windowCenter.x, -floorNear.y);
    ctx.fillStyle = floorGlow;
    ctx.fillRect(windowCenter.x - view.width * 0.4, floorNear.y - view.height * 0.22, view.width * 0.8, view.height * 0.44);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 5.5 前景石柱：给画面一个门框 ---------- */
  function drawForegroundPier(sideValue, nearZ, farZ) {
    if (!ctx) return;
    var innerX = sideValue * 4.25;
    var outerX = sideValue * 12.0;
    var frontInnerBottom = projectTo(innerX, nave.floorY, nearZ);
    var frontOuterBottom = projectTo(outerX, nave.floorY, nearZ);
    var frontInnerTop = projectTo(innerX, nave.springY + 0.4, nearZ);
    var frontOuterTop = projectTo(outerX, nave.springY + 0.4, nearZ);
    var backInnerBottom = projectTo(innerX, nave.floorY, farZ);
    var backInnerTop = projectTo(innerX, nave.springY + 0.4, farZ);
    var backOuterBottom = projectTo(outerX, nave.floorY, farZ);
    var backOuterTop = projectTo(outerX, nave.springY + 0.4, farZ);

    if (safeBeginPath(ctx)) {
      ctx.moveTo(frontInnerBottom.x, frontInnerBottom.y);
      ctx.lineTo(frontOuterBottom.x, frontOuterBottom.y);
      ctx.lineTo(frontOuterTop.x, frontOuterTop.y);
      ctx.lineTo(frontInnerTop.x, frontInnerTop.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(3,3,4,0.985)';
      ctx.fill();
    }
    if (safeBeginPath(ctx)) {
      ctx.moveTo(frontInnerBottom.x, frontInnerBottom.y);
      ctx.lineTo(frontInnerTop.x, frontInnerTop.y);
      ctx.lineTo(backInnerTop.x, backInnerTop.y);
      ctx.lineTo(backInnerBottom.x, backInnerBottom.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(13,13,16,0.96)';
      ctx.fill();
    }
    if (safeBeginPath(ctx)) {
      ctx.moveTo(frontOuterBottom.x, frontOuterBottom.y);
      ctx.lineTo(frontOuterTop.x, frontOuterTop.y);
      ctx.lineTo(backOuterTop.x, backOuterTop.y);
      ctx.lineTo(backOuterBottom.x, backOuterBottom.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(6,6,8,0.9)';
      ctx.fill();
    }
    var edgeLight = ctx.createLinearGradient(0, frontInnerTop.y, 0, frontInnerBottom.y);
    addStop(edgeLight, 0, colorText(246, 242, 234, 0.44));
    addStop(edgeLight, 0.55, colorText(230, 226, 218, 0.15));
    addStop(edgeLight, 1, colorText(220, 216, 208, 0.02));
    if (!safeBeginPath(ctx)) return;
    ctx.strokeStyle = edgeLight;
    ctx.lineWidth = Math.max(1, view.width * 0.0016);
    ctx.moveTo(frontInnerTop.x, frontInnerTop.y);
    ctx.lineTo(frontInnerBottom.x, frontInnerBottom.y);
    ctx.stroke();
  }

  function drawLightShafts(energy) {
    if (!ctx || scene.quality < 1) return;
    ctx.globalCompositeOperation = 'lighter';
    var shaftCount = 5;
    for (var shaftIndex = 0; shaftIndex < shaftCount; shaftIndex++) {
      var ratio = shaftIndex / (shaftCount - 1);
      var baseWorldX = (ratio - 0.5) * nave.halfWidth * 1.5;
      var baseWorldY = nave.springY + (nave.apexY - nave.springY) * (0.45 + 0.45 * ratio);
      var basePoint = projectTo(baseWorldX, baseWorldY, nave.farZ - 0.2);
      var spread = (ratio - 0.5) * 3.4;
      var endLeft = projectTo(baseWorldX * 1.6 - 1.7 + spread, nave.floorY + 0.4, 9.0);
      var endRight = projectTo(baseWorldX * 1.6 + 1.7 + spread, nave.floorY + 0.4, 9.0);
      var topLeft = projectTo(baseWorldX - 0.25, baseWorldY - 0.35, nave.farZ - 0.2);
      var topRight = projectTo(baseWorldX + 0.25, baseWorldY - 0.35, nave.farZ - 0.2);
      if (!safeBeginPath(ctx)) break;
      ctx.moveTo(topLeft.x, topLeft.y);
      ctx.lineTo(topRight.x, topRight.y);
      ctx.lineTo(endRight.x, endRight.y);
      ctx.lineTo(endLeft.x, endLeft.y);
      ctx.closePath();
      var shaftAlpha = (0.030 + 0.055 * energy) * (1 - Math.abs(ratio - 0.5) * 0.6);
      var shaftFill = ctx.createLinearGradient(basePoint.x, basePoint.y, endLeft.x, endLeft.y);
      addStop(shaftFill, 0, colorText(250, 246, 238, shaftAlpha));
      addStop(shaftFill, 0.55, colorText(240, 236, 228, shaftAlpha * 0.4));
      addStop(shaftFill, 1, colorText(236, 232, 224, 0));
      ctx.fillStyle = shaftFill;
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============================================================
     5.6 动态状态
     ============================================================ */
  var scene = {
    energy: 0,
    beatPunch: 0,
    haze: 0.5,
    roll: -0.021,
    liveLevel: 0,
    liveBass: 0,
    liveTreble: 0,
    frameCost: 12,
    quality: 2
  };

  /* tick 只有 15Hz，视觉时钟轻轻追上去，逐字点亮才不会一跳一跳；大跨度跳变直接采纳 */
  var clock = { value: 0, started: false };

  function updateClock(deltaMs) {
    if (!isFinite(stage.time)) return;
    if (!clock.started) {
      clock.value = stage.time;
      clock.started = true;
      return;
    }
    var difference = stage.time - clock.value;
    if (Math.abs(difference) > 0.34) {
      clock.value = stage.time;
      return;
    }
    clock.value += difference * Math.min(1, (deltaMs / 1000) * 9);
  }

  function resetClock() {
    clock.started = false;
    clock.value = 0;
  }

  function updateScene(deltaMs, nowMs) {
    var deltaSeconds = Math.min(0.08, Math.max(0.001, deltaMs / 1000));
    updateClock(deltaMs);
    scene.beatPunch *= Math.exp(-deltaSeconds * 3.2);
    var targetEnergy = clamp01(scene.beatPunch * 0.55 + scene.liveLevel * 0.4 + scene.liveBass * 0.25);
    scene.energy += (targetEnergy - scene.energy) * Math.min(1, deltaSeconds * 5.5);
    var hazeTarget = 0.34 + scene.liveBass * 0.4 + scene.beatPunch * 0.12;
    scene.haze += (clamp01(hazeTarget) - scene.haze) * Math.min(1, deltaSeconds * 2.2);
    var sway = reducedMotion ? 0 : Math.sin(nowMs * 0.00021) * 0.0045 + Math.sin(nowMs * 0.00007) * 0.0032;
    scene.roll = -0.021 + sway;
    var shakeScale = reducedMotion ? 0.15 : 1;
    camera.shakeX = Math.sin(nowMs * 0.019) * scene.beatPunch * 3.0 * shakeScale;
    camera.shakeY = Math.cos(nowMs * 0.023) * scene.beatPunch * 2.1 * shakeScale;
    camera.driftPhase += deltaSeconds;
    updateAsh(deltaSeconds);
  }

  function onResize() {
    camera.focal = clampNumber(view.height * 0.98, 420, 1100, 900);
    baked.vignette = null;
    baked.vignetteKey = '';
    invalidateLyricLayout();
  }

  /* ---------- 5.7 前景人物：背光黑色剪影 ---------- */
  function figureX(localValue, originX, unit) { return originX + localValue * unit; }
  function figureY(localValue, groundY, unit) { return groundY - localValue * unit; }

  function drawFigure(energy) {
    if (!ctx) return;
    var figureDepth = view.width < view.height ? 12.5 : 8.8;
    var scale = camera.focal / Math.max(0.9, figureDepth - camera.z);
    var targetFractionX = view.width < view.height ? 0.5 : 0.34;
    var targetScreenX = view.width * targetFractionX;
    var worldX = (targetScreenX - view.width * 0.5 - camera.shakeX) / scale + camera.x;
    var feet = projectTo(worldX, nave.floorY, figureDepth);
    var unit = 1.86 * feet.scale;
    if (!isFinite(unit) || unit < 8) return;
    var originX = feet.x;
    var groundY = feet.y;
    if (groundY < -unit || groundY > view.height + unit) return;

    /* 背光晕：让剪影从雾里“切”出来 */
    var haloCenterY = groundY - unit * 0.64;
    var halo = ctx.createRadialGradient(originX, haloCenterY, 0, originX, haloCenterY, unit * 1.05);
    addStop(halo, 0, colorText(236, 232, 224, 0.13 + 0.06 * energy));
    addStop(halo, 0.42, colorText(224, 220, 212, 0.055));
    addStop(halo, 1, colorText(210, 206, 198, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = halo;
    ctx.fillRect(originX - unit * 1.1, haloCenterY - unit * 1.1, unit * 2.2, unit * 2.2);
    ctx.globalCompositeOperation = 'source-over';

    if (!safeBeginPath(ctx)) return;
    /* 风衣主体（被风掀起的下摆） */
    ctx.moveTo(figureX(-0.085, originX, unit), figureY(0.848, groundY, unit));
    ctx.bezierCurveTo(
      figureX(-0.135, originX, unit), figureY(0.740, groundY, unit),
      figureX(-0.150, originX, unit), figureY(0.600, groundY, unit),
      figureX(-0.168, originX, unit), figureY(0.470, groundY, unit)
    );
    ctx.bezierCurveTo(
      figureX(-0.192, originX, unit), figureY(0.355, groundY, unit),
      figureX(-0.230, originX, unit), figureY(0.275, groundY, unit),
      figureX(-0.248, originX, unit), figureY(0.212, groundY, unit)
    );
    ctx.lineTo(figureX(0.085, originX, unit), figureY(0.182, groundY, unit));
    ctx.bezierCurveTo(
      figureX(0.220, originX, unit), figureY(0.168, groundY, unit),
      figureX(0.315, originX, unit), figureY(0.098, groundY, unit),
      figureX(0.402, originX, unit), figureY(0.028, groundY, unit)
    );
    ctx.lineTo(figureX(0.318, originX, unit), figureY(0.198, groundY, unit));
    ctx.bezierCurveTo(
      figureX(0.246, originX, unit), figureY(0.292, groundY, unit),
      figureX(0.186, originX, unit), figureY(0.400, groundY, unit),
      figureX(0.158, originX, unit), figureY(0.520, groundY, unit)
    );
    ctx.bezierCurveTo(
      figureX(0.142, originX, unit), figureY(0.650, groundY, unit),
      figureX(0.134, originX, unit), figureY(0.760, groundY, unit),
      figureX(0.090, originX, unit), figureY(0.848, groundY, unit)
    );
    ctx.closePath();
    /* 双腿 */
    ctx.moveTo(figureX(-0.082, originX, unit), figureY(0.225, groundY, unit));
    ctx.lineTo(figureX(-0.014, originX, unit), figureY(0.225, groundY, unit));
    ctx.lineTo(figureX(-0.026, originX, unit), figureY(0.022, groundY, unit));
    ctx.lineTo(figureX(-0.086, originX, unit), figureY(0.022, groundY, unit));
    ctx.closePath();
    ctx.moveTo(figureX(0.020, originX, unit), figureY(0.222, groundY, unit));
    ctx.lineTo(figureX(0.088, originX, unit), figureY(0.212, groundY, unit));
    ctx.lineTo(figureX(0.092, originX, unit), figureY(0.020, groundY, unit));
    ctx.lineTo(figureX(0.030, originX, unit), figureY(0.020, groundY, unit));
    ctx.closePath();
    /* 高竖领 */
    ctx.moveTo(figureX(-0.104, originX, unit), figureY(0.842, groundY, unit));
    ctx.lineTo(figureX(-0.086, originX, unit), figureY(0.932, groundY, unit));
    ctx.lineTo(figureX(-0.030, originX, unit), figureY(0.862, groundY, unit));
    ctx.closePath();
    ctx.moveTo(figureX(0.104, originX, unit), figureY(0.842, groundY, unit));
    ctx.lineTo(figureX(0.088, originX, unit), figureY(0.932, groundY, unit));
    ctx.lineTo(figureX(0.032, originX, unit), figureY(0.862, groundY, unit));
    ctx.closePath();
    /* 头与颈 */
    var headX = figureX(0.004, originX, unit);
    var headY = figureY(0.940, groundY, unit);
    ctx.moveTo(headX + unit * 0.044, headY);
    if (typeof ctx.ellipse === 'function') {
      ctx.ellipse(headX, headY, unit * 0.044, unit * 0.062, -0.05, 0, Math.PI * 2);
    } else {
      ctx.arc(headX, headY, unit * 0.050, 0, Math.PI * 2);
    }
    ctx.moveTo(figureX(-0.024, originX, unit), figureY(0.900, groundY, unit));
    ctx.lineTo(figureX(0.030, originX, unit), figureY(0.900, groundY, unit));
    ctx.lineTo(figureX(0.030, originX, unit), figureY(0.852, groundY, unit));
    ctx.lineTo(figureX(-0.024, originX, unit), figureY(0.852, groundY, unit));
    ctx.closePath();
    ctx.fillStyle = 'rgba(3,3,4,0.975)';
    ctx.fill();

    /* 倒十字银饰 */
    var pendantX = figureX(0.062, originX, unit);
    var pendantTop = figureY(0.792, groundY, unit);
    var pendantBase = figureY(0.716, groundY, unit);
    var pendantBar = figureY(0.741, groundY, unit);
    var pendantSpan = unit * 0.021;
    var chainAlpha = 0.42 + 0.3 * energy;
    ctx.strokeStyle = colorText(246, 242, 234, chainAlpha);
    ctx.lineWidth = Math.max(1, unit * 0.0055);
    if (safeBeginPath(ctx)) {
      ctx.moveTo(pendantX, pendantTop);
      ctx.lineTo(pendantX, pendantBase);
      ctx.moveTo(pendantX - pendantSpan, pendantBar);
      ctx.lineTo(pendantX + pendantSpan, pendantBar);
      ctx.stroke();
    }

    /* 右侧轮廓光 */
    var rimLight = ctx.createLinearGradient(0, groundY - unit, 0, groundY - unit * 0.05);
    addStop(rimLight, 0, colorText(252, 249, 242, 0.82));
    addStop(rimLight, 0.42, colorText(238, 234, 226, 0.40));
    addStop(rimLight, 1, colorText(228, 224, 216, 0));
    ctx.strokeStyle = rimLight;
    ctx.lineWidth = Math.max(1, unit * 0.0075);
    ctx.lineJoin = 'round';
    if (safeBeginPath(ctx)) {
      ctx.moveTo(figureX(0.010, originX, unit), figureY(0.988, groundY, unit));
      ctx.bezierCurveTo(
        figureX(0.040, originX, unit), figureY(0.986, groundY, unit),
        figureX(0.046, originX, unit), figureY(0.938, groundY, unit),
        figureX(0.040, originX, unit), figureY(0.896, groundY, unit)
      );
      ctx.bezierCurveTo(
        figureX(0.078, originX, unit), figureY(0.872, groundY, unit),
        figureX(0.118, originX, unit), figureY(0.848, groundY, unit),
        figureX(0.128, originX, unit), figureY(0.780, groundY, unit)
      );
      ctx.bezierCurveTo(
        figureX(0.146, originX, unit), figureY(0.660, groundY, unit),
        figureX(0.156, originX, unit), figureY(0.530, groundY, unit),
        figureX(0.190, originX, unit), figureY(0.405, groundY, unit)
      );
      ctx.bezierCurveTo(
        figureX(0.248, originX, unit), figureY(0.288, groundY, unit),
        figureX(0.330, originX, unit), figureY(0.176, groundY, unit),
        figureX(0.400, originX, unit), figureY(0.032, groundY, unit)
      );
      ctx.stroke();
    }
  }

  /* ---------- 5.8 雾 / 颗粒 / 划痕 / 暗角 ---------- */
  function drawFogBands(nowMs) {
    if (!ctx || !baked.fogSprites.length) return;
    ctx.globalCompositeOperation = 'lighter';
    for (var bandIndex = 0; bandIndex < baked.fogSprites.length; bandIndex++) {
      var sprite = baked.fogSprites[bandIndex];
      if (!canDrawImage(sprite)) continue;
      var drift = Math.sin(nowMs * 0.00011 + bandIndex * 1.9) * view.width * 0.07;
      var bandWidth = view.width * (1.35 + bandIndex * 0.2);
      var bandHeight = view.height * (0.26 + bandIndex * 0.08);
      var bandTop = view.height * (0.58 + bandIndex * 0.13) - bandHeight * 0.5;
      ctx.globalAlpha = clamp01(0.15 + 0.12 * scene.haze + bandIndex * 0.04);
      ctx.drawImage(sprite, view.width * 0.5 - bandWidth * 0.5 + drift, bandTop, bandWidth, bandHeight);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawVignette() {
    if (!ctx) return;
    var key = view.width + 'x' + view.height;
    if (!baked.vignette || baked.vignetteKey !== key) {
      var radius = Math.sqrt(view.width * view.width + view.height * view.height) * 0.62;
      var vignette = ctx.createRadialGradient(
        view.width * 0.5, view.height * 0.46, radius * 0.2,
        view.width * 0.5, view.height * 0.46, radius
      );
      addStop(vignette, 0, 'rgba(0,0,0,0)');
      addStop(vignette, 0.58, 'rgba(0,0,0,0.30)');
      addStop(vignette, 1, 'rgba(0,0,0,0.93)');
      baked.vignette = vignette;
      baked.vignetteKey = key;
    }
    ctx.fillStyle = baked.vignette;
    ctx.fillRect(0, 0, view.width, view.height);
  }

  function drawFilmScratches(nowMs) {
    if (!ctx) return;
    var scratchCount = reducedMotion ? 2 : 3;
    ctx.globalCompositeOperation = 'lighter';
    for (var scratchIndex = 0; scratchIndex < scratchCount; scratchIndex++) {
      var scratchSpeed = 0.00007 + scratchIndex * 0.000031;
      var position = (Math.sin(nowMs * scratchSpeed + scratchIndex * 2.4) * 0.5 + 0.5) * view.width;
      var alpha = 0.035 + 0.03 * Math.abs(Math.sin(nowMs * 0.0013 + scratchIndex));
      ctx.fillStyle = colorText(238, 234, 226, alpha);
      ctx.fillRect(position, 0, 1, view.height);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 5.9 灰烬：让静止的画面有呼吸 ---------- */
  var ash = [];

  function initAsh() {
    ash = [];
    for (var ashIndex = 0; ashIndex < 38; ashIndex++) {
      ash.push({
        x: Math.random(),
        y: Math.random(),
        speed: 0.008 + Math.random() * 0.024,
        phase: Math.random() * Math.PI * 2,
        size: 0.5 + Math.random() * 1.7,
        alpha: 0.05 + Math.random() * 0.17
      });
    }
  }

  function updateAsh(deltaSeconds) {
    for (var ashIndex = 0; ashIndex < ash.length; ashIndex++) {
      var mote = ash[ashIndex];
      mote.y -= mote.speed * deltaSeconds * 0.055;
      mote.phase += deltaSeconds * 0.7;
      if (mote.y < -0.08) {
        mote.y = 1.08;
        mote.x = Math.random();
      }
    }
  }

  function drawBeatFlash() {
    if (!ctx || reducedMotion) return;
    var strength = clamp01((scene.beatPunch - 0.62) * 0.6);
    if (strength <= 0.002) return;
    ctx.fillStyle = colorText(248, 245, 238, strength * 0.085);
    ctx.fillRect(0, 0, view.width, view.height);
  }

  function drawAsh() {
    if (!ctx || !ash.length) return;
    var visibleCount = scene.quality >= 1 ? ash.length : 18;
    ctx.globalCompositeOperation = 'lighter';
    for (var ashIndex = 0; ashIndex < visibleCount; ashIndex++) {
      var mote = ash[ashIndex];
      var ashScreenX = mote.x * view.width + Math.sin(mote.phase) * view.width * 0.012;
      var ashScreenY = mote.y * view.height;
      var ashAlpha = mote.alpha * (0.55 + 0.45 * scene.energy);
      ctx.fillStyle = colorText(240, 236, 228, ashAlpha);
      ctx.fillRect(ashScreenX, ashScreenY, mote.size, mote.size * 1.6);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============================================================
     6. 绘制
     ============================================================ */
  var lastFrameAt = 0;

  /* ============================================================
     6. 歌词：排版 / 逐字点亮 / 空状态
     ============================================================ */
  var lyric = { key: '', built: false, layout: null, prevLayout: null, nextLayout: null, transitionAt: 0 };
  var lyricSizeSteps = [1, 0.87, 0.76, 0.66, 0.57, 0.49, 0.42];

  function invalidateLyricLayout() {
    lyric.key = '';
    lyric.built = false;
    lyric.layout = null;
    lyric.prevLayout = null;
    lyric.nextLayout = null;
  }

  function splitChars(text) {
    var safeText = (text === null || typeof text === 'undefined') ? '' : String(text);
    if (typeof Array.from === 'function') {
      try { return Array.from(safeText); } catch (err) { reportError('splitChars', err); }
    }
    return safeText.split('');
  }

  function fontOf(sizeValue, weightValue) {
    return weightValue + ' ' + Math.max(8, sizeValue).toFixed(1) + 'px ' + stage.fontFamily;
  }

  function lineCharTimes(line, charCount) {
    var times = [];
    var count = Math.max(1, charCount);
    var guessDuration = line.dur > 0.15 ? line.dur : Math.max(0.85, count * 0.26);
    var hasYrc = Array.isArray(line.chars) && line.chars.length === charCount;
    for (var charIndex = 0; charIndex < count; charIndex++) {
      if (hasYrc) {
        var yrcTime = Number(line.chars[charIndex].t);
        times.push(isFinite(yrcTime) ? yrcTime : line.t);
      } else {
        times.push(line.t + guessDuration * (charIndex / count));
      }
    }
    return times;
  }

  function wrapRows(charList, times, maxWidth, font, tracking, maxRows) {
    if (!ctx) return { rows: [], overflow: true };
    ctx.font = font;
    var rows = [];
    var items = [];
    var rowWidth = 0;
    var charLimit = Math.min(charList.length, 320);
    var overflow = false;
    for (var charIndex = 0; charIndex < charLimit; charIndex++) {
      var glyph = charList[charIndex];
      var glyphWidth = ctx.measureText(glyph).width;
      var advance = glyphWidth + tracking;
      var wouldBe = items.length ? rowWidth + advance - tracking : advance - tracking;
      if (items.length && wouldBe > maxWidth && rows.length < maxRows - 1) {
        rows.push({ items: items, width: Math.max(0, rowWidth - tracking) });
        items = [];
        rowWidth = 0;
      }
      items.push({ c: glyph, t: times[charIndex] || 0, width: glyphWidth });
      rowWidth += advance;
    }
    if (items.length) {
      var finalWidth = Math.max(0, rowWidth - tracking);
      if (finalWidth > maxWidth + 0.5) overflow = true;
      rows.push({ items: items, width: finalWidth });
    }
    if (rows.length > maxRows) overflow = true;
    return { rows: rows, overflow: overflow };
  }

  function positionRows(rows, tracking, centerX) {
    var positioned = [];
    for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
      var row = rows[rowIndex];
      var cursor = centerX - row.width * 0.5;
      var placed = [];
      for (var itemIndex = 0; itemIndex < row.items.length; itemIndex++) {
        var item = row.items[itemIndex];
        placed.push({ c: item.c, t: item.t, x: cursor, width: item.width });
        cursor += item.width + tracking;
      }
      positioned.push({ items: placed, width: row.width });
    }
    return positioned;
  }

  function layoutLine(line, maxWidth, baseSize, maxRows, weightValue) {
    if (!ctx || !line) return null;
    var charList = splitChars(line.text);
    if (!charList.length) return null;
    var times = lineCharTimes(line, charList.length);
    var centerX = view.width * 0.5;
    var chosen = null;
    for (var stepIndex = 0; stepIndex < lyricSizeSteps.length; stepIndex++) {
      var sizeValue = Math.max(12, baseSize * lyricSizeSteps[stepIndex]);
      var tracking = sizeValue * 0.055;
      var font = fontOf(sizeValue, weightValue);
      var attempt = wrapRows(charList, times, maxWidth, font, tracking, maxRows);
      if (attempt.rows.length && !attempt.overflow) {
        chosen = { size: sizeValue, tracking: tracking, font: font, rows: attempt.rows };
        break;
      }
      chosen = { size: sizeValue, tracking: tracking, font: font, rows: attempt.rows };
    }
    if (!chosen || !chosen.rows.length) return null;
    /* 极端长句：按最宽一行再压一次，保证不出画 */
    var widestRow = 0;
    for (var rowIndex = 0; rowIndex < chosen.rows.length; rowIndex++) {
      widestRow = Math.max(widestRow, chosen.rows[rowIndex].width);
    }
    if (widestRow > maxWidth) {
      var squeeze = clampNumber(maxWidth / widestRow, 0.35, 1, 1);
      var squeezedSize = Math.max(11, chosen.size * squeeze);
      var squeezedTracking = squeezedSize * 0.05;
      var squeezedFont = fontOf(squeezedSize, weightValue);
      var squeezedAttempt = wrapRows(charList, times, maxWidth, squeezedFont, squeezedTracking, maxRows + 1);
      if (squeezedAttempt.rows.length && !squeezedAttempt.overflow) {
        chosen = { size: squeezedSize, tracking: squeezedTracking, font: squeezedFont, rows: squeezedAttempt.rows };
      }
    }
    chosen.rows = positionRows(chosen.rows, chosen.tracking, centerX);
    chosen.line = line;
    chosen.times = times;
    return chosen;
  }

  function lyricBaseSize() {
    var widthFactor = view.width < view.height ? 0.084 : 0.082;
    return clampNumber(Math.min(view.width * widthFactor, view.height * 0.098), 16, 108, 42);
  }

  function lyricMaxWidth() {
    var factor = view.width < view.height ? 0.86 : 0.74;
    return Math.max(160, view.width * factor);
  }

  function ensureLyricLayout() {
    var key = stage.idx + '@' + Math.round(view.width) + 'x' + Math.round(view.height) + '#' + stage.lines.length;
    if (lyric.key === key && lyric.built) return lyric.layout;
    lyric.key = key;
    var baseSize = lyricBaseSize();
    var maxWidth = lyricMaxWidth();
    var maxRows = view.width < view.height ? 3 : 2;
    var currentIndex = stage.idx >= 0 ? stage.idx : 0;
    var currentLine = stage.lines[currentIndex] || null;
    lyric.layout = layoutLine(currentLine, maxWidth, baseSize, maxRows, '600');
    if (stage.idx >= 0) {
      lyric.prevLayout = stage.idx - 1 >= 0
        ? layoutLine(stage.lines[stage.idx - 1], maxWidth * 0.9, baseSize * 0.46, 2, '400')
        : null;
      lyric.nextLayout = stage.idx + 1 < stage.lines.length
        ? layoutLine(stage.lines[stage.idx + 1], maxWidth * 0.9, baseSize * 0.46, 2, '400')
        : null;
    } else {
      lyric.prevLayout = null;
      lyric.nextLayout = null;
    }
    lyric.built = true;
    return lyric.layout;
  }

  function drawScrim() {
    if (!ctx) return;
    var topEdge = view.height * 0.46;
    var scrim = ctx.createLinearGradient(0, topEdge, 0, view.height);
    var painted = addStop(scrim, 0, 'rgba(3,3,5,0)');
    addStop(scrim, 0.40, 'rgba(3,3,5,0.50)');
    addStop(scrim, 0.72, 'rgba(3,3,5,0.80)');
    addStop(scrim, 1, 'rgba(2,2,3,0.93)');
    ctx.fillStyle = painted ? scrim : 'rgba(3,3,5,0.62)';
    ctx.fillRect(0, topEdge, view.width, view.height - topEdge);
  }

  var slateCache = { key: '', canvas: null, width: 0, height: 0, baseline: 0 };

  function invalidateSlate() {
    slateCache.key = '';
    slateCache.canvas = null;
  }

  function buildSlate() {
    var key = stage.songName + '|' + stage.artists + '|' + Math.round(view.width) + 'x' + Math.round(view.height);
    if (slateCache.key === key && canDrawImage(slateCache.canvas)) return slateCache.canvas;
    slateCache.key = key;
    slateCache.canvas = null;
    var primary = stage.songName;
    var secondary = stage.artists;
    if (!primary && !secondary) return null;
    var label = (secondary ? secondary + '  ·  ' : '') + primary;
    var sizeValue = clampNumber(view.width * 0.0104, 9, 15, 12);
    var letterGap = sizeValue * 0.16;
    var probeNode = makeCanvas(4, 4);
    var probe = probeNode.getContext('2d');
    if (!probe) return null;
    probe.font = fontOf(sizeValue, '400');
    var chars = splitChars(label);
    var limit = Math.min(chars.length, 48);
    var totalWidth = 0;
    var widths = [];
    for (var charIndex = 0; charIndex < limit; charIndex++) {
      var glyphWidth = probe.measureText(chars[charIndex]).width;
      widths.push(glyphWidth);
      totalWidth += glyphWidth + letterGap;
    }
    totalWidth = Math.max(24, totalWidth + sizeValue * 0.4);
    var canvasHeight = sizeValue * 3.4;
    var ratio = 2;
    var node = makeCanvas(totalWidth * ratio, canvasHeight * ratio);
    var nodeCtx = node.getContext('2d');
    if (!nodeCtx) return null;
    nodeCtx.scale(ratio, ratio);
    nodeCtx.font = fontOf(sizeValue, '400');
    nodeCtx.textAlign = 'left';
    nodeCtx.textBaseline = 'alphabetic';
    nodeCtx.fillStyle = colorText(226, 220, 210, 0.34);
    var cursor = 0;
    for (var drawIndex = 0; drawIndex < limit; drawIndex++) {
      nodeCtx.fillText(chars[drawIndex], cursor, sizeValue);
      cursor += widths[drawIndex] + letterGap;
    }
    nodeCtx.fillStyle = colorText(232, 226, 216, 0.2);
    nodeCtx.fillRect(0, sizeValue * 1.72, Math.min(totalWidth * 0.45, 130), 1);
    slateCache.width = totalWidth;
    slateCache.height = canvasHeight;
    slateCache.baseline = sizeValue;
    slateCache.canvas = node;
    return node;
  }

  function drawSlate() {
    if (!ctx) return;
    var cache = buildSlate();
    if (!canDrawImage(cache)) return;
    ctx.drawImage(
      cache,
      view.width * 0.055,
      view.height * 0.075 - slateCache.baseline,
      slateCache.width,
      slateCache.height
    );
  }

  function lyricBlockMetrics(layout) {
    var lineHeight = layout.size * 1.30;
    var totalHeight = lineHeight * layout.rows.length;
    var bottomLimit = view.height * (view.width < view.height ? 0.885 : 0.905);
    var blockTop = bottomLimit - totalHeight;
    var topLimit = view.height * 0.48;
    if (blockTop < topLimit) blockTop = topLimit;
    return { lineHeight: lineHeight, height: totalHeight, top: blockTop, bottom: blockTop + totalHeight };
  }

  function drawLayoutRows(layout, topY, lineHeight, alphaValue, revealTime, allowFlash) {
    if (!ctx || !layout) return;
    ctx.font = layout.font;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var flashUsed = 0;
    for (var rowIndex = 0; rowIndex < layout.rows.length; rowIndex++) {
      var row = layout.rows[rowIndex];
      var baseline = topY + lineHeight * (rowIndex + 0.78);
      for (var itemIndex = 0; itemIndex < row.items.length; itemIndex++) {
        var item = row.items[itemIndex];
        var characterAlpha = alphaValue;
        var rise = 0;
        if (revealTime !== null) {
          var age = revealTime - item.t;
          if (age < 0) {
            characterAlpha = alphaValue * 0.085;
          } else if (age < 0.17) {
            var progress = age / 0.17;
            characterAlpha = alphaValue * (0.085 + 0.915 * progress);
            rise = (1 - progress) * layout.size * 0.10;
          }
        }
        if (characterAlpha <= 0.004) continue;
        var isFlashing = allowFlash && revealTime !== null && revealTime - item.t >= 0 && revealTime - item.t < 0.40 && flashUsed < 1;
        if (isFlashing) {
          flashUsed += 1;
          ctx.shadowColor = accentColor(0.85, 0.35);
          ctx.shadowBlur = layout.size * 0.26;
        } else if (flashUsed) {
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = colorText(247, 244, 237, characterAlpha);
        ctx.fillText(item.c, item.x, baseline - rise);
      }
    }
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'rgba(0,0,0,0)';
  }

  function drawLyrics() {
    if (!ctx) return;
    if (!stage.lines.length) return;
    var layout = ensureLyricLayout();
    if (!layout) return;
    var metrics = lyricBlockMetrics(layout);
    var elapsedSinceChange = (window.performance && window.performance.now ? window.performance.now() : Date.now()) - lyric.transitionAt;
    var fadeIn = clamp01(elapsedSinceChange / 520);

    /* 光从雾里透出来 */
    var bloomHeight = metrics.height * 1.6;
    var bloomTop = metrics.top - bloomHeight * 0.34;
    var bloom = ctx.createLinearGradient(0, bloomTop, 0, bloomTop + bloomHeight);
    addStop(bloom, 0, accentColor(0, 0.6));
    addStop(bloom, 0.48, accentColor(0.07 * fadeIn, 0.55));
    addStop(bloom, 1, accentColor(0, 0.5));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = bloom;
    ctx.fillRect(0, bloomTop, view.width, bloomHeight);
    ctx.globalCompositeOperation = 'source-over';

    if (lyric.prevLayout) {
      var prevLineHeight = lyric.prevLayout.size * 1.30;
      var prevHeight = prevLineHeight * lyric.prevLayout.rows.length;
      var prevTop = metrics.top - prevHeight - layout.size * 0.58;
      if (prevTop < view.height * 0.06) prevTop = view.height * 0.06;
      drawLayoutRows(lyric.prevLayout, prevTop, prevLineHeight, 0.30, null, false);
    }
    if (lyric.nextLayout) {
      var nextLineHeight = lyric.nextLayout.size * 1.30;
      var nextTop = metrics.bottom + layout.size * 0.22;
      if (nextTop + nextLineHeight * lyric.nextLayout.rows.length < view.height * 0.985) {
        drawLayoutRows(lyric.nextLayout, nextTop, nextLineHeight, 0.17, null, false);
      }
    }

    var currentLine = stage.idx >= 0 ? stage.lines[stage.idx] : null;
    var lineActive = true;
    if (currentLine && currentLine.dur > 0.5) {
      lineActive = clock.value < currentLine.t + currentLine.dur + 0.7;
    }
    var revealTime = stage.idx >= 0 ? clock.value : null;
    var currentAlpha = stage.idx >= 0 ? (lineActive ? 0.97 * fadeIn + 0.03 : 0.16) : 0.13;
    drawLayoutRows(layout, metrics.top, metrics.lineHeight, currentAlpha, revealTime, true);
  }

  function trackCost(cost) {
    scene.frameCost = scene.frameCost * 0.9 + cost * 0.1;
    if (report.frames % 90 !== 0) return;
    if (scene.frameCost > 9.5 && scene.quality > 0) scene.quality -= 1;
    else if (scene.frameCost < 5.5 && scene.quality < 2) scene.quality += 1;
  }

  function renderFrame(now) {
    var frameStart = (window.performance && window.performance.now) ? window.performance.now() : Date.now();
    report.frames += 1;
    if (!ctx) return;
    var deltaMs = lastFrameAt ? Math.max(1, now - lastFrameAt) : 16;
    updateScene(deltaMs, now);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#040405';
    ctx.fillRect(0, 0, view.width, view.height);
    ctx.save();
    var centerX = view.width * 0.5;
    var centerY = view.height * 0.5;
    ctx.translate(centerX, centerY);
    ctx.rotate(scene.roll);
    ctx.translate(-centerX, -centerY);
    drawBackdrop();
    drawNave();
    drawFarWindow(scene.energy);
    drawLightShafts(scene.energy);
    drawFigure(scene.energy);
    drawForegroundPier(-1, 9.6, 11.4);
    drawForegroundPier(1, 8.1, 9.6);
    drawFogBands(now);
    drawAsh();
    ctx.restore();
    drawScrim();
    drawVignette();
    drawSlate();
    drawLyrics();
    drawFilmScratches(now);
    drawBeatFlash();
    var frameEnd = (window.performance && window.performance.now) ? window.performance.now() : Date.now();
    report.js = Math.round((frameEnd - frameStart) * 100) / 100;
    trackCost(report.js);
    lastFrameAt = now;
  }

  function loop(now) {
    try {
      if (!view.ready) resizeStage();
      renderFrame(now || 0);
    } catch (err) {
      reportError('frame', err);
    }
    window.requestAnimationFrame(loop);
  }

  function boot() {
    resizeStage();
    try { bakeAssets(); } catch (err) { reportError('bakeAssets', err); }
    try { initAsh(); } catch (err) { reportError('initAsh', err); }
    window.addEventListener('resize', function () {
      try { resizeStage(); } catch (err) { reportError('resize', err); }
    }, false);
    window.requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
