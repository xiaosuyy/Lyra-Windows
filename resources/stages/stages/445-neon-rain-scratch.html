<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旺角夜雨</title>
<style>
  :root{
    --accent:#3fdcb4; --accent2:#c8203c; --cream:#f7ecd6;
  }
  html,body{margin:0;height:100%;background:#06100d;overflow:hidden}
  #stage{position:fixed;inset:0;isolation:isolate;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* 胶片颗粒：静态躺在画布上，不参与动画合成 */
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.34;mix-blend-mode:soft-light;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,0) 1px 3px),
      repeating-linear-gradient(90deg,rgba(255,0,60,.05) 0 1px,rgba(0,0,0,0) 1px 4px)}
  /* 曝光抖动：只动 opacity，走合成器，不重绘 */
  #flicker{position:absolute;inset:0;pointer-events:none;background:#0b1a15;opacity:.10;
    animation:flick 2.7s steps(5,end) infinite}
  @keyframes flick{0%{opacity:.10}20%{opacity:.03}40%{opacity:.13}60%{opacity:.05}80%{opacity:.11}100%{opacity:.10}}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(125% 95% at 64% 44%,rgba(0,0,0,0) 40%,rgba(3,9,7,.45) 80%,rgba(2,6,5,.88) 100%),
               linear-gradient(180deg,rgba(2,8,6,.55) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 62%,rgba(2,7,5,.72) 100%)}
  /* 胶片划痕：一条竖线偶尔掠过，纯 CSS 关键帧，不占 JS */
  .scratch{position:absolute;top:-10%;bottom:-10%;width:2px;left:18%;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,transparent,rgba(247,236,214,.55) 22%,rgba(247,236,214,.9) 50%,rgba(247,236,214,.5) 78%,transparent);
    mix-blend-mode:screen;animation:sc 7.3s linear infinite}
  .scratch.b{left:73%;width:1px;animation-duration:5.1s;animation-delay:2.4s;opacity:.5}
  @keyframes sc{
    0%,88%{opacity:0;transform:translateX(0)}
    89%{opacity:.55;transform:translateX(9vw)}
    90.5%{opacity:.18;transform:translateX(13vw)}
    92%{opacity:.5;transform:translateX(-4vw)}
    93%,100%{opacity:0;transform:translateX(0)}
  }
  /* 换句瞬间的曝光闪 */
  #flash{position:absolute;inset:0;pointer-events:none;background:rgba(247,236,214,0);}
  #flash.on{animation:fl .30s steps(3,end) both}
  @keyframes fl{0%{background:rgba(247,236,214,.13)}60%{background:rgba(247,236,214,.04)}100%{background:rgba(247,236,214,0)}}

  #lyr{position:absolute;left:0;right:0;bottom:14vh;padding:0 7vw;display:flex;flex-direction:column;
    justify-content:flex-end;gap:.18em;pointer-events:none;z-index:3}
  /* 歌词背后的暗带：只压到 4 成不透明度，保字不糊也不形成乳白衬底 */
  #lyrg{position:absolute;left:0;right:0;bottom:0;height:62vh;pointer-events:none;z-index:2;
    background:linear-gradient(180deg,rgba(3,10,8,0) 0%,rgba(3,10,8,.34) 38%,rgba(2,7,5,.72) 100%)}
  .l{font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;font-weight:600;
    font-size:clamp(21px,3.6vw,54px);line-height:1.42;letter-spacing:.03em;color:var(--cream);
    text-align:left;text-wrap:balance;max-width:80vw;
    text-shadow:0 0 26px rgba(6,16,13,.9),0 2px 14px rgba(6,16,13,.85)}
  #prev,#next{font-size:clamp(14px,1.7vw,24px);opacity:.55;color:#b6d4c8;letter-spacing:.06em;
    max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:none;
    transform-origin:left center}
  /* 当前句：抽帧式"咔"一下的入场，不做匀速淡入 */
  #cur{min-height:1.42em;will-change:transform;animation:stepIn .28s steps(4,end) both}
  @keyframes stepIn{
    0%{opacity:.25;transform:translate3d(-1.4%,0,0) skewX(-1.2deg)}
    50%{opacity:.7;transform:translate3d(.5%,0,0) skewX(.4deg)}
    100%{opacity:1;transform:none}
  }
  #cur .c{color:rgba(247,236,214,.46);text-shadow:0 2px 8px rgba(3,10,8,.85);display:inline-block;white-space:pre;
    transition:color .18s steps(3,end),text-shadow .18s steps(3,end)}
  #cur .c.on{color:var(--cream);
    text-shadow:0 0 9px color-mix(in srgb,var(--accent) 62%,transparent),
                0 0 26px color-mix(in srgb,var(--accent) 38%,transparent),
                0 2px 3px rgba(0,0,0,.65)}
  /* 正在唱的那个字：再亮一档，像霓虹管刚好点到它 */
  #cur .c.hot{color:#fffaf0;
    text-shadow:0 0 6px #fff,0 0 22px color-mix(in srgb,var(--accent) 85%,transparent),
                0 0 54px color-mix(in srgb,var(--accent) 45%,transparent)}

  #meta{position:absolute;left:7vw;top:6.5vh;max-width:52vw;pointer-events:none;
    font-family:"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;color:#cfe6dd}
  #meta .t{font-size:clamp(12px,1.15vw,16px);letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);opacity:.9;text-shadow:0 0 14px color-mix(in srgb,var(--accent) 60%,transparent)}
  #meta .s{margin-top:.55em;font-size:clamp(11px,1vw,14px);letter-spacing:.2em;color:rgba(214,230,223,.62)}
  #clock{position:absolute;right:6.5vw;top:6.5vh;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:clamp(10px,.9vw,13px);letter-spacing:.3em;color:rgba(200,220,212,.5);pointer-events:none;
    font-variant-numeric:tabular-nums}
  #empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:.6em;color:#b9d4c9;font-family:"Songti SC","SimSun",serif;
    font-size:clamp(15px,1.8vw,24px);letter-spacing:.14em;pointer-events:none}
  #empty .big{font-size:2.1em;letter-spacing:.3em;color:#e8d7b6;opacity:.85}
  #empty.show{display:flex}
  #empty .sub{font-size:.62em;letter-spacing:.32em;opacity:.55;font-family:"Helvetica Neue",Arial,sans-serif}
  @media (prefers-reduced-motion: reduce){
    #flicker,.scratch{animation:none;opacity:.06}
    #cur{animation:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="grain"></div>
  <div id="flicker"></div>
  <div id="vig"></div>
  <div id="lyrg"></div>
  <div class="scratch"></div>
  <div class="scratch b"></div>
  <div id="flash"></div>
  <div id="meta"><div class="t" id="metaT">旺角 · 雨夜</div><div class="s" id="metaS"></div></div>
  <div id="clock">00:00</div>
  <div id="lyr"><div class="l" id="prev"></div><div class="l" id="cur"></div><div class="l" id="next"></div></div>
  <div id="empty"><div class="big">雨還在下</div><div class="sub">THIS TRACK HAS NO LYRICS</div></div>
</div>
<script>
(function(){
  'use strict';

  /* ───────── 状态 ───────── */
  var D = {lines:[], idx:-1, t:0, playing:true, frames:0, js:0, duration:0};
  var ERR = '';
  var sent = false;
  var rm = false;
  var accent = [63,220,180];
  var accent2 = [200,32,60];
  var live = {bpm:0, level:0, bass:0, mid:0, treble:0};
  var beatLevel = 0;
  var els = {};

  try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ console.error('[445] rm', e); }

  /* ───────── 自检口：脚本最外层、无条件 ───────── */
  window.__stage = function(){
    var ln = D.lines[D.idx];
    return { lines: D.lines.length, idx: D.idx, t: D.t, playing: !!D.playing,
             frames: D.frames, js: D.js, err: ERR,
             text: (ln && ln.text) || '', gl: false, rm: rm };
  };

  function sendReady(){
    if (sent) return;
    sent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){ console.error('[445] ready', e); }
  }

  /* ready 的调度写在最外层、与 boot 解耦：即使后面初始化炸了也照发 */
  try { requestAnimationFrame(function(){ sendReady(); }); } catch(e){ console.error('[445] raf', e); }
  try { setTimeout(sendReady, 900); } catch(e){ console.error('[445] timer', e); }

  /* ───────── 画布 ───────── */
  var cv, ctx, W = 1440, H = 900, DPR = 1;
  var grainCv;              /* 静态颗粒瓦片 */

  function clampInt(v, lo, hi, fb){ v = +v; if (!isFinite(v)) v = fb; return Math.min(hi, Math.max(lo, Math.round(v))); }

  function resize(){
    try {
      var w = clampInt(window.innerWidth, 320, 4096, 1440);
      var h = clampInt(window.innerHeight, 320, 4096, 900);
      DPR = Math.min(1.5, Math.max(1, window.devicePixelRatio || 1));
      W = w; H = h;
      cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildAcc();
      buildPlate();
    } catch(e){ ERR = String(e && e.message || e); console.error('[445] resize', e); }
  }

  /* ───────── 程序化底片：霓虹竖牌 + 雨痕（离屏预渲染） ───────── */
  var plate;
  function buildPlate(){
    plate = document.createElement('canvas');
    var pw = Math.round(W * 0.5), ph = Math.round(H * 0.5);
    plate.width = Math.max(2, pw); plate.height = Math.max(2, ph);
    var c = plate.getContext('2d');
    if (!c) return;
    var g, i, x, y;

    /* 潮湿街面的祖母绿底 */
    g = c.createLinearGradient(0, 0, 0, ph);
    g.addColorStop(0, '#04110e');
    g.addColorStop(.42, '#07201a');
    g.addColorStop(.62, '#0a2a22');
    g.addColorStop(1, '#030c0a');
    c.fillStyle = g; c.fillRect(0, 0, pw, ph);

    /* 远处霓虹雾团：祖母绿 / 深红 / 钨丝黄 */
    var blobs = [
      [.18, .30, .40, 'rgba(20,140,110,.34)'],
      [.52, .22, .34, 'rgba(150,20,48,.30)'],
      [.80, .34, .30, 'rgba(190,130,30,.22)'],
      [.36, .44, .46, 'rgba(10,90,80,.26)']
    ];
    for (i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var bg = c.createRadialGradient(b[0]*pw, b[1]*ph, 0, b[0]*pw, b[1]*ph, b[2]*Math.max(pw, ph));
      bg.addColorStop(0, b[3]); bg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = bg; c.fillRect(0, 0, pw, ph);
    }

    /* 竖排霓虹招牌：只有框和几道亮条，不写具体字，避免廉价 */
    var signs = [
      [.60, .10, .075, .30, 'rgba(230,60,80,.55)'],
      [.70, .16, .050, .20, 'rgba(60,230,190,.50)'],
      [.83, .08, .062, .26, 'rgba(240,190,70,.34)'],
      [.48, .18, .040, .16, 'rgba(200,40,70,.30)']
    ];
    for (i = 0; i < signs.length; i++) {
      var s = signs[i];
      var sx = s[0]*pw, sy = s[1]*ph, sw = s[2]*pw, sh = s[3]*ph;
      c.strokeStyle = s[4]; c.lineWidth = Math.max(1, pw * .0016);
      c.strokeRect(sx, sy, sw, sh);
      c.fillStyle = s[4];
      var n = 5, k;
      for (k = 0; k < n; k++) {
        c.globalAlpha = .35 + .5 * Math.abs(Math.sin(i * 2.1 + k * 1.7));
        c.fillRect(sx + sw * .18, sy + sh * (.12 + k * .17), sw * .64, sh * .055);
      }
      c.globalAlpha = 1;
    }

    /* 街面积水：横向拉长的反光条 */
    for (i = 0; i < 26; i++) {
      x = Math.random() * pw;
      y = ph * (0.58 + Math.random() * 0.42);
      var rw = pw * (0.04 + Math.random() * 0.22);
      var rh = Math.max(1, ph * (0.004 + Math.random() * 0.012));
      var hue = Math.random();
      c.fillStyle = hue < .45 ? 'rgba(40,200,168,.16)' : hue < .8 ? 'rgba(220,60,80,.13)' : 'rgba(240,200,110,.12)';
      c.beginPath();
      c.ellipse(x, y, rw, rh, 0, 0, 6.2832);
      c.fill();
    }

    /* 雨丝：预渲染到 plate，每帧只平移，不重算 */
    c.lineCap = 'butt';
    for (i = 0; i < 260; i++) {
      x = Math.random() * pw; y = Math.random() * ph;
      var len = ph * (0.02 + Math.random() * 0.05);
      c.strokeStyle = 'rgba(180,230,220,' + (0.03 + Math.random() * 0.09).toFixed(3) + ')';
      c.lineWidth = Math.max(0.6, pw * (0.0005 + Math.random() * 0.0012));
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + len * 0.10, y + len); c.stroke();
    }
    /* 颗粒 */
    c.globalAlpha = .5;
    for (i = 0; i < 900; i++) {
      c.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.14)';
      c.fillRect(Math.random() * pw, Math.random() * ph, 1.2, 1.2);
    }
    c.globalAlpha = 1;
  }

  /* ───────── 霓虹散景精灵（离屏，一次生成，每帧只 drawImage） ───────── */
  var sprites = [];
  function makeSprite(col, a){
    var c = document.createElement('canvas');
    c.width = c.height = 128;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (a * 1.0).toFixed(3) + ')');
    g.addColorStop(.42, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (a * 0.3).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return c;
  }
  function buildSprites(){
    /* 调色板始终是：祖母绿 / 深红 / 钨丝黄 + 封面主色 */
    sprites = [
      makeSprite([70, 225, 180], 0.55),
      makeSprite([212, 46, 74], 0.50),
      makeSprite([246, 192, 82], 0.40),
      makeSprite(mix(accent, [255, 255, 255], 0.18), 0.52)
    ];
  }

  /* ───────── 人影剪影：程序化侧脸+肩线，预渲染一次 ───────── */
  var figA, figB;
  function makeFigure(flip, rim){
    var cw = 300, ch = 520;
    var c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    var x = c.getContext('2d');
    if (!x || typeof x.translate !== 'function' || typeof x.beginPath !== 'function') return null;
    x.translate(flip ? cw : 0, 0);
    if (flip) x.scale(-1, 1);

    /* 身体：头—颈—肩—胸，一个侧身倚靠的姿态 */
    x.beginPath();
    x.moveTo(150, 60);
    x.bezierCurveTo(100, 62, 74, 108, 80, 152);      /* 后脑到颈 */
    x.bezierCurveTo(84, 186, 104, 202, 112, 214);
    x.bezierCurveTo(70, 232, 46, 286, 44, 352);      /* 肩线滑下 */
    x.bezierCurveTo(42, 430, 52, 486, 60, 520);
    x.lineTo(268, 520);
    x.bezierCurveTo(274, 452, 272, 372, 258, 318);
    x.bezierCurveTo(246, 272, 216, 236, 184, 212);   /* 前胸 */
    x.bezierCurveTo(206, 190, 214, 156, 210, 124);
    x.bezierCurveTo(206, 86, 182, 58, 150, 60);
    x.closePath();
    var grd = x.createLinearGradient(60, 60, 260, 520);
    grd.addColorStop(0, 'rgba(4,10,9,.97)');
    grd.addColorStop(.55, 'rgba(3,8,7,.99)');
    grd.addColorStop(1, 'rgba(2,6,5,1)');
    x.fillStyle = grd;
    x.fill();

    /* 轮廓边缘：只有一道细霓虹勾边，像被街灯掠到 */
    x.save();
    x.clip();
    x.lineWidth = 7;
    x.strokeStyle = rim;
    x.beginPath();
    x.moveTo(150, 60);
    x.bezierCurveTo(100, 62, 74, 108, 80, 152);
    x.bezierCurveTo(84, 186, 104, 202, 112, 214);
    x.bezierCurveTo(70, 232, 46, 286, 44, 352);
    x.bezierCurveTo(42, 430, 52, 486, 60, 520);
    x.stroke();
    x.beginPath();
    x.moveTo(184, 212);
    x.bezierCurveTo(206, 190, 214, 156, 210, 124);
    x.bezierCurveTo(206, 86, 182, 58, 150, 60);
    x.stroke();
    x.restore();

    /* 发丝被雨打湿的高光 */
    x.save();
    x.clip();
    var hg = x.createRadialGradient(120, 104, 4, 130, 118, 90);
    hg.addColorStop(0, rim);
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    x.globalAlpha = .30;
    x.fillStyle = hg;
    x.fillRect(0, 0, cw, 260);
    x.restore();
    return c;
  }
  /* ───────── 雨幕瓦片：一次生成，每帧两次 drawImage 偏移下落 ───────── */
  var rainTile;
  function buildRain(){
    rainTile = document.createElement('canvas');
    rainTile.width = 320; rainTile.height = 640;
    var c = rainTile.getContext('2d');
    if (!c) return;
    c.clearRect(0, 0, 320, 640);
    c.lineCap = 'butt';
    for (var i = 0; i < 90; i++) {
      var x = Math.random() * 320, y = Math.random() * 640;
      var len = 18 + Math.random() * 46;
      c.strokeStyle = 'rgba(190,235,225,' + (0.05 + Math.random() * 0.16).toFixed(3) + ')';
      c.lineWidth = 0.7 + Math.random() * 1.2;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + len * 0.12, y + len); c.stroke();
    }
  }

  /* ───────── 抽帧残影：只让霓虹高光拖影，不抬高黑场 ───────── */
  var stepMs = 129;                 /* ≈7.7fps 的抽帧节奏 */
  var acc, actx, accW = 2, accH = 2, lastStep = -1;

  function buildAcc(){
    acc = document.createElement('canvas');
    accW = Math.max(2, Math.round(W * 0.42));
    accH = Math.max(2, Math.round(H * 0.42));
    acc.width = accW; acc.height = accH;
    actx = acc.getContext('2d');
    if (!actx) return;
    lastStep = -1;
  }

  /* 霓虹光源位置：时间量化到抽帧格，产生"一格一格"的跳 */
  function neonPos(tq){
    var pts = [], i, ns = Math.max(1, sprites.length);
    for (i = 0; i < 7; i++) {
      var ph1 = i * 2.31 + tq * 0.00006;
      var ph2 = i * 1.77 + tq * 0.00009;
      pts.push({
        x: 0.14 + ((i * 0.137) % 0.82) + Math.sin(ph1) * 0.05,
        y: 0.12 + ((i * 0.219) % 0.66) + Math.cos(ph2) * 0.05,
        s: i % ns
      });
    }
    return pts;
  }

  function paint(now){
    if (!ctx) return;
    var lv = live.level || 0;
    var g = ctx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    /* 时间量化：整个霓虹层按 7.7fps 跳格，这是抽帧的核心手感 */
    var stepIdx = Math.floor(now / stepMs);
    var tq = stepIdx * stepMs;
    if (rm) tq = now;
    var i, s, bx, by, br, pts = neonPos(tq);

    /* 清屏：深祖母绿 */
    g.fillStyle = '#040e0b';
    g.fillRect(0, 0, W, H);

    /* 底片：轻微漂移，模拟手持；quantize 后雨丝也一格一格走 */
    var drift = rm ? 0 : Math.sin(tq * 0.00013) * W * 0.006;
    var driftY = rm ? 0 : Math.cos(tq * 0.00017) * H * 0.004;
    if (plate) {
      g.globalAlpha = 0.92;
      g.drawImage(plate, -W * 0.02 + drift, -H * 0.02 + driftY, W * 1.04, H * 1.04);
      g.globalAlpha = 1;
    }

    /* 散景光斑：按抽帧格位置画，跳着走 */
    g.globalCompositeOperation = 'lighter';
    for (i = 0; i < pts.length; i++) {
      s = sprites[pts[i].s];
      bx = W * pts[i].x; by = H * pts[i].y;
      br = Math.min(W, H) * (0.11 + (i % 3) * 0.05) * (1 + lv * 0.5 + beatLevel * 0.45);
      g.globalAlpha = (rm ? 0.18 : 0.30) + lv * 0.22;
      g.drawImage(s, bx - br, by - br, br * 2, br * 2);
    }
    g.globalAlpha = 1;

    /* 残影缓冲：每格把"霓虹高光"抄一份进累积层，再缩放叠出两重拖影 */
    if (stepIdx !== lastStep && acc) {
      lastStep = stepIdx;
      actx.setTransform(1, 0, 0, 1, 0, 0);
      actx.globalCompositeOperation = 'source-over';
      actx.fillStyle = 'rgba(4,14,11,.34)';
      actx.fillRect(0, 0, accW, accH);
      var k;
      for (k = 0; k < pts.length; k++) {
        var ss = sprites[pts[k].s];
        var ak = accW * (0.13 + (k % 3) * 0.06) * (1 + lv * 0.4);
        actx.globalAlpha = 0.75;
        actx.drawImage(ss, accW * pts[k].x - ak, accH * pts[k].y - ak, ak * 2, ak * 2);
      }
      actx.globalAlpha = 1;
    }
    if (acc) {
      var amp = rm ? 0.004 : 0.02;
      var dx = rm ? 0 : Math.sin(now * 0.0011) * W * amp;
      var dy = rm ? 0 : Math.cos(now * 0.0007) * H * amp;
      g.globalAlpha = rm ? 0.16 : 0.34;
      g.drawImage(acc, -W * 0.05 + dx * 2.4, -H * 0.05 + dy * 2.0, W * 1.14, H * 1.14);
      g.globalAlpha = rm ? 0.10 : 0.22;
      g.drawImage(acc, dx * 4.5, dy * 3.6, W * 1.02, H * 1.02);
      g.globalAlpha = 1;
    }
    g.globalCompositeOperation = 'source-over';

    /* 人影：右侧一个倚靠的剪影，抽帧格上做极小的位移，像呼吸 */
    if (figA) {
      var fh = H * 1.18;
      var fw = fh * (300 / 520);
      var breathe = rm ? 0 : (Math.sin(tq * 0.00042) * H * 0.004);
      var lean = rm ? 0 : (Math.sin(tq * 0.00019) * W * 0.004);
      g.globalAlpha = 0.93;
      g.drawImage(figA, W * 0.60 + lean, H - fh + fh * 0.06 + breathe, fw, fh);
      g.globalAlpha = 1;
    }

    /* 雨幕：两片瓦片按不同速度下落 */
    if (rainTile) {
      var rr = Math.min(2.2, Math.max(0.6, H / 640 * 1.15));
      var off1 = ((now * 0.00042) % 1) * 640 * rr;
      var off2 = ((now * 0.00071 + 0.4) % 1) * 640 * rr;
      g.globalAlpha = 0.5;
      var rows = Math.min(6, Math.ceil(H / (640 * rr)) + 1);
      for (i = -1; i < rows; i++) {
        g.drawImage(rainTile, -20, i * 640 * rr + off1 - 640 * rr, 320 * rr * 1.6, 640 * rr);
      }
      g.globalAlpha = 0.3;
      g.drawImage(rainTile, W * 0.45, off2 - 640 * rr, 320 * rr * 2.1, 640 * rr * 2.4);
      g.globalAlpha = 1;
    }
  }

  /* ───────── 歌词 ───────── */
  function findIdx(t){
    var n = D.lines.length, k = -1, i;
    /* 用上一帧索引做提示，避免每帧从 0 线性扫到 2000 */
    var from = Math.max(0, Math.min(n - 1, D.idx - 2));
    for (i = from; i < n; i++) { if (t + 0.06 >= D.lines[i].t) k = i; else break; }
    if (k < 0) { for (i = 0; i < from; i++) { if (t + 0.06 >= D.lines[i].t) k = i; else break; } }
    return k;
  }

  var curKey = '', curSpans = [];
  var lastIdx = -99, flashEl = null, cachePrev = '\u0000', cacheNext = '\u0000';
  function pulse(){
    if (!flashEl || rm) return;
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
  }
  function paintCurrent(L, t){
    var key = L.i + '|' + L.text + '|' + (L.chars ? L.chars.length : 0);
    if (key !== curKey) {
      curKey = key;
      curSpans = [];
      lastHot = -1;
      els.cur.textContent = '';
      els.cur.style.animation = 'none';
      /* 强制重排后再挂上，让入场抽帧重放 */
      void els.cur.offsetWidth;
      els.cur.style.animation = '';
      var src = (L.chars && L.chars.length) ? L.chars : null;
      var n = src ? src.length : L.text.length;
      var i, sp;
      if (src) {
        for (i = 0; i < n; i++) {
          sp = document.createElement('span');
          sp.className = 'c';
          sp.textContent = src[i].c || '';
          els.cur.appendChild(sp); curSpans.push(sp);
        }
      } else {
        /* LRC：按句长均分 */
        var chars = L.text.split('');
        for (i = 0; i < chars.length; i++) {
          sp = document.createElement('span');
          sp.className = 'c';
          sp.textContent = chars[i];
          els.cur.appendChild(sp); curSpans.push(sp);
        }
      }
    }
    /* 逐字点亮 + 当前字高亮 */
    var chars = L.chars && L.chars.length ? L.chars : null;
    var start = L.t, span = Math.max(0.4, L.dur);
    var i2, n2 = curSpans.length, on, hot = -1, j;
    for (i2 = 0; i2 < n2; i2++) {
      var ct = chars ? (isFinite(chars[i2] && chars[i2].t) ? +chars[i2].t : start + span * (i2 / Math.max(1, n2)))
                     : start + span * (i2 / Math.max(1, n2));
      on = t + 0.05 >= ct;
      if (on) hot = i2;
      var cl = on ? 'c on' : 'c';
      if (curSpans[i2].className !== cl) curSpans[i2].className = cl;
    }
    /* 把"正在唱"的字加一档亮度；短暂滑窗，避免每帧改 20 个节点 */
    if (hot !== lastHot) {
      if (lastHot >= 0 && curSpans[lastHot] && curSpans[lastHot].className.indexOf('hot') >= 0)
        curSpans[lastHot].className = 'c on';
      if (hot >= 0 && curSpans[hot]) curSpans[hot].className = 'c on hot';
      lastHot = hot;
    } else if (hot >= 0 && curSpans[hot] && curSpans[hot].className === 'c on') {
      curSpans[hot].className = 'c on hot';
    }
    fitCurrent();
  }
  var lastHot = -1;

  /* 超长句自适应：量一次高度，超了就缩字号（固定次数上限，绝不 while 收敛） */
  var lastFitKey = '';
  function fitCurrent(){
    if (!els.cur) return;
    if (lastFitKey === curKey) return;
    lastFitKey = curKey;
    try {
      var maxH = Math.max(60, window.innerHeight * 0.30);
      var fs = 0, i;
      els.cur.style.fontSize = '';
      for (i = 0; i < 8; i++) {
        if (els.cur.offsetHeight <= maxH) break;
        fs = parseFloat(window.getComputedStyle(els.cur).fontSize) || 24;
        els.cur.style.fontSize = Math.max(13, fs * 0.86) + 'px';
      }
    } catch(e){ console.error('[445] fit', e); }
  }

  function paintLyrics(t){
    var i = findIdx(t);
    D.idx = i;
    if (!D.lines.length) {
      if (els.lyr) els.lyr.style.display = 'none';
      if (els.empty) els.empty.className = 'show';
      if (els.lyrg) els.lyrg.style.opacity = '.5';
      lastIdx = -99; curKey = ''; lastHot = -1;
      return;
    }
    if (els.lyr) els.lyr.style.display = '';
    if (els.empty) els.empty.className = '';
    if (els.lyrg) els.lyrg.style.opacity = '1';

    var prev = i > 0 ? D.lines[i-1] : null;
    var next = (i + 1 < D.lines.length) ? D.lines[i+1] : null;
    var cur = i >= 0 ? D.lines[i] : null;

    var pt = prev ? prev.text : '', nt = next ? next.text : '';
    if (pt !== cachePrev) { cachePrev = pt; if (els.prev) els.prev.textContent = pt; }
    if (nt !== cacheNext) { cacheNext = nt; if (els.next) els.next.textContent = nt; }

    if (cur) {
      cur.i = i;
      paintCurrent(cur, t);
      if (i !== lastIdx) { lastIdx = i; pulse(); }
    } else {
      /* 第一句之前：显示待唱 */
      curKey = ''; curSpans = [];
      if (els.cur) els.cur.textContent = '';
    }
  }

  /* ───────── init ───────── */
  function toColor(a, fb){
    if (!a || a.length < 3) return fb;
    return [clampInt(a[0],0,255,fb[0]), clampInt(a[1],0,255,fb[1]), clampInt(a[2],0,255,fb[2])];
  }
  function mix(a, b, k){
    return [Math.round(a[0]+(b[0]-a[0])*k), Math.round(a[1]+(b[1]-a[1])*k), Math.round(a[2]+(b[2]-a[2])*k)];
  }
  function applyAccent(){
    var st = document.documentElement.style;
    var lum = (accent[0]*0.299 + accent[1]*0.587 + accent[2]*0.114) / 255;
    /* 深底：封面主色太暗就提亮，保证霓虹真的在发光 */
    var neon = lum < 0.30 ? mix(accent, [255,255,255], 0.42) : mix(accent, [255,255,255], 0.08);
    st.setProperty('--accent', 'rgb(' + neon[0] + ',' + neon[1] + ',' + neon[2] + ')');
    var warm = (accent[0] > accent[2]) ? [205, 92, 44] : [44, 122, 200];
    st.setProperty('--accent2', 'rgb(' + warm[0] + ',' + warm[1] + ',' + warm[2] + ')');
  }
  function fmt(s){
    s = Math.max(0, Math.floor(+s || 0));
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function init(p){
    p = p || {};
    try {
      var song = p.song || {};
      accent = toColor(p.accent, [63,220,180]);
      accent2 = [180, 30, 60];
      applyAccent();
      buildSprites();

      var artists = song.artists;
      if (Array.isArray(artists)) artists = artists.filter(function(x){ return x; }).join(' / ');
      if (typeof artists !== 'string') artists = '';
      var nm = (typeof song.name === 'string' && song.name) ? song.name : '未知曲目';
      if (els.metaT) els.metaT.textContent = nm.toUpperCase();
      if (els.metaS) els.metaS.textContent = artists ? artists + ' · 尖沙咀 · 雨' : '尖沙咀 · 雨';

      var raw = p.lines, out = [], i;
      if (raw && raw.length) {
        var lim = Math.min(raw.length, 4000);
        for (i = 0; i < lim; i++) {
          var L = raw[i] || {};
          var tx = (typeof L.text === 'string') ? L.text : (L.text == null ? '' : String(L.text));
          var tt = isFinite(L.t) ? +L.t : 0;
          var dd = isFinite(L.dur) && L.dur > 0 ? +L.dur : 4;
          var ch = null;
          if (L.chars && L.chars.length) {
            ch = [];
            var cl = Math.min(L.chars.length, 400);
            for (var k = 0; k < cl; k++) {
              var c0 = L.chars[k] || {};
              ch.push({ c: (c0.c == null ? '' : String(c0.c)), t: isFinite(c0.t) ? +c0.t : tt });
            }
          }
          if (!tx && !ch) continue;
          out.push({ t: Math.max(0, tt), dur: dd, text: tx || ch.map(function(z){ return z.c; }).join(''), chars: ch });
        }
        out.sort(function(a, b){ return a.t - b.t; });
        if (out.length > 2000) out = out.slice(0, 2000);
      }
      D.lines = out;
      D.t = 0; D.idx = -1; curKey = '';
      D.duration = isFinite(p.duration) && p.duration > 0 ? +p.duration : 0;
      if (els.cur) els.cur.textContent = '';
      if (els.prev) els.prev.textContent = '';
      if (els.next) els.next.textContent = '';
      cachePrev = cacheNext = '\u0000';
      lastFitKey = ''; lastHot = -1; lastIdx = -99;
      if (els.clock) els.clock.textContent = fmt(0) + ' / ' + fmt(p.duration);
      paintLyrics(0);
    } catch(e){ ERR = String(e && e.message || e); console.error('[445] init', e); }
  }

  /* ───────── 主循环 ───────── */
  var lastClock = '';
  function render(){
    var t = D.t;
    paintLyrics(t);
    var ck = fmt(t) + ' / ' + fmt(D.duration);
    if (ck !== lastClock) { lastClock = ck; if (els.clock) els.clock.textContent = ck; }
  }

  var lastTs = 0;
  function frame(ts){
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    D.frames++;
    try {
      paint(ts || 0);
      render();
      /* 拍点时整屏微闪 */
      if (beatLevel > 0.5 && !rm) {
        ctx.fillStyle = 'rgba(120,240,205,' + (0.03 * beatLevel).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    } catch(e){ ERR = String(e && e.message || e); console.error('[445] frame', e); }
    beatLevel *= 0.90;
    D.js = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;

    /* 自适应降级：连续吃力就砍 DPR，保证 165Hz 下不卡（只降不升，避免抖动） */
    jsAcc += D.js;
    if (++jsN >= 45) {
      var avg = jsAcc / jsN;
      jsAcc = 0; jsN = 0;
      if (avg > 6.5 && DPR > 1) { DPR = 1; try { resize(); } catch(e){ console.error('[445] degrade', e); } }
    }
    requestAnimationFrame(frame);
  }
  var jsAcc = 0, jsN = 0;

  /* ───────── 消息 ───────── */
  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') { init(d.payload); }
      else if (d.type === 'tick') {
        var p = d.payload || {};
        if (isFinite(p.time)) D.t = +p.time;
        if (typeof p.playing === 'boolean') D.playing = p.playing;
      } else if (d.type === 'live') {
        var l = d.payload || {};
        if (isFinite(l.level)) live.level = +l.level;
        if (isFinite(l.bass)) live.bass = +l.bass;
        if (isFinite(l.bpm)) live.bpm = +l.bpm;
        if (typeof l.playing === 'boolean') D.playing = l.playing;
      } else if (d.type === 'beat') {
        var b = d.payload || {};
        if (isFinite(b.level)) { beatLevel = Math.min(1, +b.level); live.level = Math.max(live.level, beatLevel * 0.8); }
      }
    } catch(e){ ERR = String(e && e.message || e); console.error('[445] msg', e); }
  }, false);

  /* ───────── 启动 ───────── */
  function boot(){
    try {
      els.prev = document.getElementById('prev');
      els.cur = document.getElementById('cur');
      els.next = document.getElementById('next');
      els.lyr = document.getElementById('lyr');
      els.metaT = document.getElementById('metaT');
      els.metaS = document.getElementById('metaS');
      els.clock = document.getElementById('clock');
      els.empty = document.getElementById('empty');
      els.lyrg = document.getElementById('lyrg');
      flashEl = document.getElementById('flash');

      cv = document.getElementById('cv');
      ctx = cv.getContext('2d', {alpha: false});

      buildSprites();
      buildRain();
      figA = makeFigure(false, 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',.75)');
      resize();
      applyAccent();
      window.addEventListener('resize', function(){ try { resize(); } catch(e){ console.error('[445] resize ev', e); } }, false);

      requestAnimationFrame(frame);
    } catch(e){
      ERR = String(e && e.message || e);
      console.error('[445] boot', e);
      setTimeout(sendReady, 0);     /* 即便 boot 挂了也要报 ready */
      /* 画布挂了也要保持出帧，帧计数与 __stage 才可信 */
      try { requestAnimationFrame(frame); } catch(e2){ console.error('[445] boot raf', e2); }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, false);
  else boot();
})();
</script>
</body>
</html>
