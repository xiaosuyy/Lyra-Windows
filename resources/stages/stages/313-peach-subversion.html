<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>313 · 蜜桃反色</title>
<style>
  :root{
    --salmon:#ff8e72; --peach:#ffb98a; --gold:#ffd79a;
    --ink:#6b2617; --ink-soft:rgba(107,38,23,.62); --cream:#fff4de;
    --fs:64px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    overflow:hidden; color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% 42%, #ffe0b6 0%, #ffc79b 38%, #ffa987 68%, #e8745b 100%);
    font-family:system-ui,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; isolation:isolate; }
  #bg{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }

  /* 细横线：把整张画压成一张印刷样张 */
  #grid{
    position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.6;
    background:repeating-linear-gradient(180deg,rgba(107,38,23,.075) 0 1px,rgba(0,0,0,0) 1px 4.2vh);
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.2),#000 30%,#000 72%,rgba(0,0,0,.25));
    mask-image:linear-gradient(180deg,rgba(0,0,0,.2),#000 30%,#000 72%,rgba(0,0,0,.25));
  }

  /* ---------- 几何画框：细线与小方块，纯装饰 ---------- */
  #frame{
    position:absolute; inset:clamp(9px,1.9vw,26px); z-index:1; pointer-events:none;
    border:1px solid rgba(107,38,23,.11);
  }
  #frame::before,#frame::after{
    content:""; position:absolute; width:clamp(4px,.5vw,7px); height:clamp(4px,.5vw,7px);
    background:rgba(107,38,23,.55);
  }
  #frame::before{ left:-1px; top:-1px; }
  #frame::after{ right:-1px; bottom:-1px; }

  /* ---------- 眉批 ---------- */
  header,footer,#stage{ position:relative; z-index:2; }
  #head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:14px; padding:clamp(15px,2.9vh,32px) clamp(20px,4.6vw,62px) 0;
  }
  #meta{ min-width:0; }
  #title{
    display:block; font-size:clamp(9px,.95vw,12px); font-weight:600;
    letter-spacing:.3em; text-transform:uppercase; color:rgba(107,38,23,.74);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:min(56vw,560px);
  }
  #sub{
    display:block; margin-top:.55em; font-size:clamp(8.5px,.78vw,10.5px);
    letter-spacing:.26em; text-transform:uppercase; color:rgba(107,38,23,.42);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:min(50vw,480px);
  }
  #tag{ display:flex; align-items:baseline; gap:.42em; flex:none;
        font-size:clamp(8.5px,.78vw,10.5px); letter-spacing:.24em; color:rgba(107,38,23,.44); }
  #tag b{ font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.1em;
          color:rgba(107,38,23,.72); font-size:1.25em; }
  #tag i{ font-style:normal; }
  #tag.hide{ opacity:0; }

  /* ---------- 歌舞台 ---------- */
  #stage{
    display:grid; justify-items:center; align-content:center;
    gap:clamp(7px,1.5vh,20px);
    padding:0 clamp(18px,6vw,120px);
    text-align:center;
  }
  #halo{
    position:absolute; left:50%; top:50%; width:min(120vw,1100px); aspect-ratio:1;
    transform:translate(-50%,-50%) scale(1); border-radius:50%; z-index:0;
    background:radial-gradient(circle at 50% 50%, rgba(255,246,224,.42) 0%, rgba(255,226,180,.20) 34%, rgba(255,214,170,0) 68%);
    opacity:.75; pointer-events:none;
  }
  #prev,#next{ position:relative; z-index:2; }
  .ghost{
    font-size:clamp(11px,1.5vw,19px); line-height:1.4; letter-spacing:.22em;
    color:rgba(107,38,23,.30);
    max-width:88vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:opacity .45s ease;
  }
  .ghost:empty{ opacity:0; }

  /* 主歌词：细长矩形拼合的镂空几何字体 */
  #cur{
    position:relative; z-index:2; font-size:var(--fs); font-weight:600;
    line-height:1.1; letter-spacing:.045em; text-align:center;
    max-width:100%; min-width:0; color:transparent;
    text-wrap:balance;
  }
  /* 竖细缝遮罩：字被切成一条条细长矩形。只在字够大时才切，小字直接保持完整 */
  #cur.slit{
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 max(2.9px,.034em),rgba(0,0,0,0) max(2.9px,.034em) max(3.9px,.045em));
    mask-image:repeating-linear-gradient(90deg,#000 0 max(2.9px,.034em),rgba(0,0,0,0) max(2.9px,.034em) max(3.9px,.045em));
  }
  /* 字后的暖褐暗带：给歌词一个稳定的可读底，横竖都化在渐变里，看不出色块 */
  #wash{
    position:absolute; left:50%; top:50%; z-index:1; pointer-events:none;
    width:60vw; height:34vh; transform:translate(-50%,-50%);
    background:linear-gradient(90deg,
      rgba(88,26,10,0) 0%,
      rgba(88,26,10,.172) 8%,
      rgba(88,26,10,.195) 50%,
      rgba(88,26,10,.172) 92%,
      rgba(88,26,10,0) 100%);
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 3%,#000 32%,#000 68%,rgba(0,0,0,0) 97%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,0) 3%,#000 32%,#000 68%,rgba(0,0,0,0) 97%);
    filter:blur(clamp(8px,1.4vw,20px));
    transition:opacity .45s ease;
  }
  #wash.off{ opacity:0; }
  /* 上下留出字面伸部，避免镂空遮罩把 g/y 的下缘切掉 */
  .ch{ display:inline-block; position:relative; vertical-align:top; padding:.11em 0; }
  /* 未唱：更细、更透的细线空心 */
  .ch .h{
    display:block; color:transparent;
    -webkit-text-stroke:clamp(.6px,.012em,2.2px) rgba(96,30,14,.46);
    transition:-webkit-text-stroke-color .18s ease;
  }
  .ch .f{
    position:absolute; inset:0; padding:.11em 0; color:transparent; opacity:0;
    background-image:linear-gradient(180deg,#fffdf6 2%,#fff2d2 44%,#ffd9a4 98%);
    -webkit-background-clip:text; background-clip:text;
    transition:opacity .14s cubic-bezier(.2,.85,.25,1);
  }
  /* 已唱：实心奶油金 + 细而实的深描边，进度靠"有没有实体"来读 */
  .ch.lit .h{ -webkit-text-stroke:clamp(1.2px,.028em,4.4px) rgba(70,20,8,.93); }
  .ch.lit .f{ opacity:1; }
  .ch.sp{ width:.32em; }
  .ch.sp .h,.ch.sp .f{ opacity:0; }

  /* 逐字灯条 */
  #bars{
    position:relative; z-index:2; display:flex; align-items:flex-end;
    gap:clamp(1.5px,.3vw,4px); height:clamp(11px,2vh,26px);
    margin-top:clamp(2px,.8vh,10px); opacity:.8;
  }
  #bars i{
    display:block; width:clamp(2px,.28vw,4px); height:100%;
    background:linear-gradient(to top,rgba(107,38,23,.62),rgba(107,38,23,.20));
    transform:scaleY(.16); transform-origin:50% 100%;
    transition:transform .22s ease-out, opacity .3s ease;
  }
  #bars i.on{ background:linear-gradient(to top,rgba(96,30,14,.95),rgba(255,236,200,.85)); }
  #bars:empty{ display:none; }

  /* 无歌词空态 */
  #cur.empty{
    -webkit-mask-image:none !important; mask-image:none !important;
    font-size:clamp(13px,1.5vw,20px); font-weight:400; letter-spacing:.45em;
    line-height:1.7; color:rgba(107,38,23,.46);
  }
  #cur.empty b{ display:block; font-size:2.4em; line-height:1; letter-spacing:0;
                margin-bottom:.42em; font-weight:400; color:rgba(107,38,23,.32); }
  #cur.empty em{ font-style:normal; text-indent:.45em; }
  #cur:empty::before{
    content:"\25c7"; display:block; width:100%; line-height:1; letter-spacing:0;
    font-size:clamp(18px,2.1vw,30px); font-weight:400; color:rgba(107,38,23,.22);
  }
  /* 换句时的轻推入（只动透明度，避免文字被重新采样糊掉） */
  #cur.in{ animation:lineIn .5s cubic-bezier(.16,.8,.24,1) both; }
  @keyframes lineIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  /* ---------- 进度 ---------- */
  #foot{
    padding:0 clamp(20px,4.6vw,62px) clamp(14px,2.6vh,30px);
    display:flex; align-items:center; gap:clamp(10px,2vw,26px);
  }
  #prog{ position:relative; flex:1; height:12px; }
  #prog .rail,#prog .fill{ position:absolute; left:0; right:0; top:3px; height:1px; }
  #prog .rail{ background:rgba(107,38,23,.18); }
  #prog .fill{
    background:rgba(96,30,14,.66); transform:scaleX(0); transform-origin:0 50%;
  }
  #prog .tick{
    position:absolute; left:0; right:0; top:3px; height:5px; opacity:.5;
    background:repeating-linear-gradient(90deg,rgba(107,38,23,.5) 0 1px,rgba(0,0,0,0) 1px 12px);
  }
  #clock,#clock2{ font-size:clamp(8px,.72vw,10px); letter-spacing:.22em; flex:none;
                  font-variant-numeric:tabular-nums; color:rgba(107,38,23,.5); }

  @media (max-width:640px){
    #cur{ letter-spacing:.02em; }
    #head{ padding-top:18px; }
    .ghost{ letter-spacing:.12em; }
  }
  @media (prefers-reduced-motion:reduce){
    .ch .f,.ghost,.ghost{ transition-duration:.01ms; }
    #halo{ opacity:.5; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="grid" aria-hidden="true"></div>
  <div id="frame" aria-hidden="true"></div>
  <header id="head">
    <div id="meta">
      <span id="title"></span>
      <span id="sub"></span>
    </div>
    <div id="tag" class="hide"><b id="bpm">—</b><i>BPM</i></div>
  </header>
  <main id="stage">
    <div id="halo" aria-hidden="true"></div>
    <div id="wash" class="off" aria-hidden="true"></div>
    <div id="prev" class="ghost" aria-hidden="true"></div>
    <div id="cur" role="status" aria-live="polite"></div>
    <div id="bars" aria-hidden="true"></div>
    <div id="next" class="ghost" aria-hidden="true"></div>
  </main>
  <footer id="foot">
    <div id="clock">--:--</div>
    <div id="prog">
      <div class="rail"></div><div class="fill" id="fill"></div><div class="tick"></div>
    </div>
    <div id="clock2">--:--</div>
  </footer>
</div>
<script>
(function(){
'use strict';

var elCur = document.getElementById('cur'),
    elPrev = document.getElementById('prev'),
    elNext = document.getElementById('next'),
    elTitle = document.getElementById('title'),
    elSub = document.getElementById('sub'),
    elBars = document.getElementById('bars'),
    elFill = document.getElementById('fill'),
    elClock = document.getElementById('clock'),
    elClock2 = document.getElementById('clock2'),
    elTag = document.getElementById('tag'),
    elBpm = document.getElementById('bpm'),
    elHalo = document.getElementById('halo'),
    elWash = document.getElementById('wash'),
    elStage = document.getElementById('stage');

var S = { lines:[], idx:-1, t:0, playing:true, frames:0, js:0, err:'', text:'', gl:false, rm:false,
          duration:0, songKey:null, spans:[], barEls:null, curChars:null, litN:-1 };
var readySent = false, songTime = 0, tickTime = 0, tickWall = 0, gotTick = false;
var playing = true, beatLevel = 0, beatPulse = 0, lastBpm = -1, smBass = .35;
var accent = [.98, .46, .34], elapsed = 0;
var live = { bpm:0, level:.4, bass:.4, mid:.3, treble:.2 };

var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
S.rm = !!(mq && mq.matches);
if (mq && mq.addEventListener) mq.addEventListener('change', function(e){ S.rm = e.matches; });

function send(m){ try{ parent.postMessage(m, '*'); }catch(e){} }
function reportReady(){ if (readySent) return; readySent = true; send({ __c100:1, type:'ready' }); }
function num(v,d){ v = +v; return isFinite(v) ? v : d; }
function str(v){ return typeof v === 'string' ? v : (v == null ? '' : String(v)); }

function buildTimes(L){
  var n = L.ch.length, res = new Array(n), t0 = L.t;
  var dur = L.dur > 0 ? L.dur : Math.max(1.0, n * 0.24);
  /* LRC 只有整句起点：把整句的逐字压到 dur 的前 82%，让句尾能整句亮满地停一下 */
  var span = dur * 0.82;
  var cs = L.chars, useIt = !!(cs && cs.length);
  if (useIt && Math.abs(cs.length - n) > Math.max(2, Math.round(n * 0.34))) useIt = false;
  var prev = t0;
  for (var i = 0; i < n; i++){
    var v = t0 + span * ((i + 1) / n);
    if (useIt){
      var c = cs[i], ct = c ? num(c.t, NaN) : NaN;
      if (isFinite(ct) && ct > 0) v = ct;
    }
    if (v < prev) v = prev;
    res[i] = prev = v;
  }
  return res;
}

function normalize(payload){
  var src = payload && payload.lines ? payload.lines : [], out = [];
  for (var i = 0; i < src.length; i++){
    var L = src[i];
    if (!L) continue;
    var txt = str(L.text);
    if (!txt) continue;
    var t = num(L.t, NaN);
    if (!isFinite(t)) continue;
    var dur = num(L.dur, 0);
    var item = { t:t, dur: dur > 0 ? dur : 0, text:txt,
                 chars: Array.isArray(L.chars) ? L.chars : null, ch: Array.from(txt), times:null };
    item.times = buildTimes(item);
    out.push(item);
  }
  out.sort(function(a,b){ return a.t - b.t; });
  return out;
}

function setMeta(song){
  song = song || {};
  var artists = song.artists;
  if (Array.isArray(artists)) artists = artists.filter(function(x){ return !!x; }).join(' / ');
  artists = str(artists).trim();
  var name = str(song.name).trim();
  elTitle.textContent = name || '未知曲目';
  elTitle.title = name;
  elSub.textContent = artists;
  elSub.style.display = artists ? '' : 'none';
}

var CJK = /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]/;

function measureUnits(chars){
  var u = 0;
  for (var i = 0; i < chars.length; i++){
    var c = chars[i];
    if (c === ' ' || c === '\u00a0') u += .3;
    else if (c === '\u3000') u += 1;
    else if (CJK.test(c)) u += 1;
    else if (/[ilI1.,'!|:;]/.test(c)) u += .28;
    else u += .55;
    u += .045; /* letter-spacing */
  }
  return Math.max(.6, u);
}

/* 把暖褐暗晕钉在当前句后面：比字宽一圈、比字高一截，靠渐变+模糊化开边界 */
function sizeWash(){
  var cb = elCur.getBoundingClientRect(), sb = elStage.getBoundingClientRect();
  if (!cb || !sb || !cb.width || !sb.width) return;
  var w = Math.min(sb.width * 1.04, cb.width * 1.16 + 150);
  var h = Math.min(sb.height * .92, cb.height * 2.4 + 110);
  elWash.style.width = Math.round(w) + 'px';
  elWash.style.height = Math.round(h) + 'px';
  elWash.style.left = Math.round(cb.left - sb.left + cb.width / 2) + 'px';
  elWash.style.top = Math.round(cb.top - sb.top + cb.height / 2) + 'px';
  elWash.classList.remove('off');
}

function fitLine(){
  var chars = S.curChars;
  if (!chars || !chars.length) return;
  var vw = window.innerWidth, vh = window.innerHeight;
  var narrow = vw < 660;
  var maxW = vw * (narrow ? .86 : .78);
  var maxH = vh * (narrow ? .34 : .40);
  var units = measureUnits(chars);
  var base = Math.min(vw * (narrow ? .145 : .105), vh * .155, 132);
  var fs = Math.min(base, maxW / units);
  if (!isFinite(fs) || fs < 8) fs = 8;
  var minFs = narrow ? 15 : 18;
  elCur.style.fontSize = fs.toFixed(2) + 'px';
  /* 量一次真实盒模型，必要时再压两档，保证不出屏 */
  for (var k = 0; k < 6; k++){
    var w = elCur.scrollWidth, h = elCur.offsetHeight;
    if (w <= maxW + 2 && h <= maxH + 2) break;
    if (fs <= minFs) break;
    fs = Math.max(minFs, fs * .88);
    elCur.style.fontSize = fs.toFixed(2) + 'px';
  }
  if (elCur.classList) elCur.classList.toggle('slit', fs >= 42);
  sizeWash();
}

function buildCur(L){
  elCur.textContent = '';
  elCur.classList.remove('empty');
  S.spans = [];
  if (!L){ S.curChars = null; return; }
  var chars = L.ch, frag = document.createDocumentFragment();
  var run = 0;
  for (var i = 0; i < chars.length; i++){
    var c = chars[i];
    if (c === ' ' || c === '\u3000' || c === '\u00a0'){
      var sp = document.createElement('span');
      sp.className = 'ch sp';
      var sh = document.createElement('span');
      sh.className = 'h'; sh.textContent = c;
      sp.appendChild(sh);
      frag.appendChild(sp);
      frag.appendChild(document.createElement('wbr'));
      run = 0;
      continue;
    }
    var w = document.createElement('span');
    w.className = 'ch';
    var h = document.createElement('span');
    h.className = 'h'; h.textContent = c;
    var f = document.createElement('span');
    f.className = 'f'; f.setAttribute('aria-hidden', 'true'); f.textContent = c;
    w.appendChild(h); w.appendChild(f);
    frag.appendChild(w);
    S.spans.push({ el: w, t: L.times[i] });
    if (++run >= 14){ frag.appendChild(document.createElement('wbr')); run = 0; }
  }
  elCur.appendChild(frag);
  elCur.setAttribute('aria-label', L.text);
  S.curChars = chars;
  S.litN = -1;
}

function buildBars(n){
  elBars.textContent = '';
  S.barEls = null;
  if (!n) return;
  var count = Math.min(n, 44);
  var frag = document.createDocumentFragment();
  for (var i = 0; i < count; i++) frag.appendChild(document.createElement('i'));
  elBars.appendChild(frag);
  S.barEls = elBars.children;
}

function updateBarLit(n){
  var b = S.barEls;
  if (!b) return;
  var ratio = b.length / Math.max(1, S.spans.length);
  for (var i = 0; i < b.length; i++) b[i].classList.toggle('on', i < Math.ceil(n * ratio));
}

function updateLit(t){
  var spans = S.spans;
  if (!spans || !spans.length) return;
  var n = 0, len = spans.length;
  while (n < len && spans[n].t <= t) n++;
  if (n === S.litN) return;
  if (n > S.litN){
    for (var i = Math.max(0, S.litN); i < n; i++) spans[i].el.classList.add('lit');
  } else {
    for (var j = n; j < S.litN; j++) spans[j].el.classList.remove('lit');
  }
  S.litN = n;
  updateBarLit(n);
}

function setLine(i){
  var L = S.lines[i];
  elPrev.textContent = i > 0 ? S.lines[i-1].text : '';
  elNext.textContent = i >= 0 && i + 1 < S.lines.length ? S.lines[i+1].text : '';
  if (!S.lines.length){
    elCur.textContent = '';
    elCur.style.fontSize = '';
    elCur.style.opacity = '';
    elCur.classList.remove('in');
    elCur.classList.remove('slit');
    elCur.classList.add('empty');
    var mk = document.createElement('b'); mk.textContent = '\u25c7';
    var em = document.createElement('em'); em.textContent = '\u65e0 \u6b4c \u8bcd';
    elCur.appendChild(mk); elCur.appendChild(em);
    elCur.setAttribute('aria-label', '\u65e0\u6b4c\u8bcd');
    elPrev.textContent = ''; elNext.textContent = '';
    buildBars(0);
    S.text = ''; S.curChars = null; S.spans = []; S.litN = 0;
    sizeWash();
    return;
  }
  if (!L){
    /* 还没到第一句：先把首句以镂空待点亮的形态摆在台上 */
    if (S.lines[0]){
      buildCur(S.lines[0]);
      fitLine();
      buildBars(0);
      elNext.textContent = '';
      elCur.classList.remove('in');
      elCur.style.opacity = '.42';
      S.text = ''; S.litN = 0;
    }
    return;
  }
  elCur.style.opacity = '';
  buildCur(L);
  fitLine();
  buildBars(S.spans.length);
  S.text = L.text;
  S.litN = -1;
  updateLit(songTime);
  elCur.classList.remove('in');
  if (!S.rm){
    void elCur.offsetWidth;
    elCur.classList.add('in');
  }
}

function updateIndex(t){
  var L = S.lines, i = S.idx;
  if (i < 0) for (var k = 0; k < L.length; k++){ if (L[k].t <= t) i = k; else break; }
  else {
    while (i + 1 < L.length && L[i+1].t <= t) i++;
    while (i >= 0 && L[i].t > t) i--;
  }
  if (i !== S.idx){ S.idx = i; setLine(i); }
}

function onInit(p){
  var song = p.song || {};
  var id = song && song.id != null ? String(song.id) : null;
  var nameKey = str(song && song.name).trim();
  var key = id !== null ? ('id:' + id) : (nameKey ? 'nm:' + nameKey : null);
  var sameSong = key !== null && key === S.songKey;
  var firstInit = S.songKey === null;

  var acc = Array.isArray(p.accent) && p.accent.length >= 3 ? p.accent : null;
  if (acc){
    accent[0] = Math.min(1, Math.max(0, num(acc[0], 200) / 255));
    accent[1] = Math.min(1, Math.max(0, num(acc[1], 120) / 255));
    accent[2] = Math.min(1, Math.max(0, num(acc[2], 90) / 255));
  }
  S.duration = num(p.duration, 0);
  S.lines = normalize(p);
  S.songKey = key;
  setMeta(song);

  if (!sameSong || firstInit){
    songTime = tickTime = num(p.time, 0);
    tickWall = performance.now();
    gotTick = true;
    playing = p.playing === undefined ? true : !!p.playing;
    S.playing = playing;
  }
  /* 每次都重挂歌词：换歌、歌词晚到、取色重发 init 都要生效 */
  S.idx = -1;
  setLine(-1);
  updateIndex(songTime);
  updateProgress(songTime);
}

function onTick(p){
  var t = num(p.time, NaN);
  if (!isFinite(t)) return;
  songTime = tickTime = t; tickWall = performance.now(); gotTick = true;
  if (p.playing !== undefined){ playing = !!p.playing; S.playing = playing; }
  updateProgress(t);
}
function onBeat(p){
  var lv = num(p.level, .5);
  beatLevel = Math.min(1, Math.max(0, lv));
  beatPulse = Math.max(beatPulse, .3 + beatLevel * .7);
}
function onLive(p){
  live.bpm = num(p.bpm, 0); live.level = num(p.level, .4);
  live.bass = num(p.bass, .4); live.mid = num(p.mid, .3); live.treble = num(p.treble, .2);
  if (p.playing !== undefined){ playing = !!p.playing; S.playing = playing; }
  if (live.bpm > 0 && Math.abs(live.bpm - lastBpm) >= 1){
    lastBpm = live.bpm;
    elBpm.textContent = String(Math.round(live.bpm));
    elTag.classList.remove('hide');
  }
}

window.addEventListener('message', function(ev){
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') onInit(d.payload || {});
  else if (d.type === 'tick') onTick(d.payload || {});
  else if (d.type === 'beat') onBeat(d.payload || {});
  else if (d.type === 'live') onLive(d.payload || {});
});

/* ---------- 进度 / 时钟 ---------- */
var clockSec = -1, lastFill = -1;
function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  var m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function updateProgress(t){
  var dur = S.duration, p = 0;
  if (dur > 0){
    p = t / dur;
    p = !isFinite(p) ? 0 : (p < 0 ? 0 : (p > 1 ? 1 : p));
  }
  var q = Math.round(p * 1000) / 1000;
  if (q !== lastFill){
    lastFill = q;
    elFill.style.transform = 'scaleX(' + q.toFixed(3) + ')';
  }
  var sec = Math.floor(t);
  if (sec !== clockSec){
    clockSec = sec;
    elClock.textContent = fmtTime(t);
    elClock2.textContent = dur > 0 ? fmtTime(dur) : '--:--';
  }
}

/* ---------- 灯条 / 光晕 ---------- */
var barsClock = -999;
function updateBars(){
  var b = S.barEls;
  if (!b || !b.length) return;
  var n = b.length, ph = S.rm ? elapsed * .22 : elapsed;
  var lvl = Math.min(1, live.level), bassv = Math.min(1, live.bass), midv = Math.min(1, live.mid);
  for (var i = 0; i < n; i++){
    var x = i / Math.max(1, n - 1);
    var w1 = .5 + .5 * Math.sin(x * 4.6 + ph * 1.05);
    var w2 = .5 + .5 * Math.sin(x * 12.7 - ph * 1.9);
    var h = .15 + .36 * lvl * w1 + .26 * bassv * w2 + .16 * beatPulse + .10 * midv * w2 * w1;
    b[i].style.transform = 'scaleY(' + (h > 1 ? 1 : h).toFixed(3) + ')';
  }
}
function updateHalo(){
  var s = 1 + beatPulse * .05 + Math.min(1, live.bass) * .03;
  elHalo.style.transform = 'translate(-50%,-50%) scale(' + s.toFixed(3) + ')';
  elHalo.style.opacity = (.34 + .30 * beatPulse + .16 * Math.min(1, live.level)).toFixed(3);
}

/* ---------- 背景：整屏暖色眼睑光（WebGL 单三角形） ---------- */
var gl = null, glU = {}, glLast = -999, t0 = performance.now();

var GL_VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';

var GL_FS = [
'precision mediump float;',
'uniform vec2 u_res; uniform float u_time; uniform float u_bass;',
'uniform float u_level; uniform float u_beat; uniform float u_rm; uniform vec3 u_acc;',
'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
'float vnoise(vec2 p){',
'  vec2 i = floor(p); vec2 f = fract(p);',
'  f = f * f * (3.0 - 2.0 * f);',
'  float a = hash(i); float b = hash(i + vec2(1.0, 0.0));',
'  float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0));',
'  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
'}',
'float fbm(vec2 p){',
'  float s = 0.0; float a = 0.5;',
'  for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }',
'  return s;',
'}',
'void main(){',
'  vec2 uv = gl_FragCoord.xy / u_res;',
'  vec2 p = uv - 0.5; p.x *= u_res.x / u_res.y;',
'  float t = u_time * mix(1.0, 0.10, u_rm);',
'  float d = length(p * vec2(1.0, 1.26));',
'  vec3 salmon = vec3(1.00, 0.57, 0.46);',
'  vec3 peach  = vec3(1.00, 0.74, 0.54);',
'  vec3 gold   = vec3(1.00, 0.87, 0.65);',
'  vec3 rose   = vec3(0.52, 0.15, 0.11);',
'  vec3 col = mix(rose, salmon, smoothstep(1.20, 0.12, d));',
'  col = mix(col, peach, smoothstep(0.88, 0.0, d) * 0.9);',
'  float sun = pow(max(0.0, 1.0 - d * 1.22), 3.0);',
'  col = mix(col, gold, sun * 0.68);',
'  vec2 q = p * 2.75 + vec2(0.0, -0.09);',
'  q += 0.16 * vec2(sin(t * 0.07), cos(t * 0.052));',
'  float r1 = 1.0 - abs(2.0 * fbm(q) - 1.0);',
'  float r2 = 1.0 - abs(2.0 * fbm(q * 1.87 + vec2(3.3, t * 0.021)) - 1.0);',
'  float veins = pow(clamp(r1, 0.0, 1.0), 9.0) * 0.90 + pow(clamp(r2, 0.0, 1.0), 13.0) * 0.55;',
'  float ring = smoothstep(0.10, 0.48, d) * (1.0 - smoothstep(0.62, 1.25, d));',
'  col += veins * vec3(1.0, 0.70, 0.52) * (0.22 + 0.55 * u_bass) * (0.35 + 0.9 * ring);',
'  float crease = exp(-pow((p.y - 0.27 - 0.05 * sin(p.x * 1.9 + t * 0.06)) * 10.0, 2.0));',
'  col = mix(col, rose * 1.25, crease * 0.15);',
'  col += vec3(1.0, 0.95, 0.84) * pow(max(0.0, 1.0 - d * 2.0), 6.0) * (0.26 + 0.20 * u_level);',
'  col += vec3(1.0, 0.84, 0.68) * u_beat * 0.09;',
'  col = mix(col, u_acc * 0.92 + 0.06, 0.09);',
'  float vig = smoothstep(1.45, 0.30, d);',
'  col *= 0.58 + 0.42 * vig;',
'  float grain = hash(uv * u_res * 0.62 + fract(t * 2.7));',
'  col += (grain - 0.5) * 0.028;',
'  col = clamp(col, 0.0, 1.0);',
'  gl_FragColor = vec4(pow(col, vec3(0.95)), 1.0);',
'}'
].join('\n');

function glCompile(type, src){
  var s = gl.createShader(type);
  if (!s) return null;
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    if (window.console && console.warn) console.warn('[313] shader', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function glResize(){
  if (!gl) return;
  var cv = gl.canvas;
  var vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  var k = (vw * vh > 820000) ? .60 : .74;
  var w = Math.max(2, Math.round(vw * k)), h = Math.max(2, Math.round(vh * k));
  if (cv.width !== w || cv.height !== h){
    cv.width = w; cv.height = h;
    gl.viewport(0, 0, w, h);
  }
}
function glSetup(){
  var cv = document.getElementById('bg');
  var opt = { alpha:false, antialias:false, depth:false, stencil:false, powerPreference:'low-power' };
  try { gl = cv.getContext('webgl', opt) || cv.getContext('experimental-webgl', opt); }
  catch (e){ gl = null; }
  if (!gl) return;
  var vs = glCompile(gl.VERTEX_SHADER, GL_VS);
  var fs = glCompile(gl.FRAGMENT_SHADER, GL_FS);
  if (!vs || !fs){ gl = null; return; }
  var pr = gl.createProgram();
  gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)){
    if (window.console && console.warn) console.warn('[313] link', gl.getProgramInfoLog(pr));
    gl = null; return;
  }
  gl.useProgram(pr);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var names = ['u_res', 'u_time', 'u_bass', 'u_level', 'u_beat', 'u_rm', 'u_acc'];
  for (var i = 0; i < names.length; i++) glU[names[i]] = gl.getUniformLocation(pr, names[i]);
  S.gl = true;
  glResize();
}
function glFrame(now){
  if (!gl) return;
  if (now - glLast < 26) return;
  glLast = now;
  gl.uniform2f(glU.u_res, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.uniform1f(glU.u_time, elapsed);
  gl.uniform1f(glU.u_bass, smBass);
  gl.uniform1f(glU.u_level, Math.min(1, live.level));
  gl.uniform1f(glU.u_beat, beatPulse);
  gl.uniform1f(glU.u_rm, S.rm ? 1 : 0);
  gl.uniform3f(glU.u_acc, accent[0], accent[1], accent[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

window.__stage = function(){
  return { lines:S.lines.length, idx:S.idx, t:+songTime.toFixed(3), playing:!!playing,
           frames:S.frames, js:+S.js.toFixed(2), err:S.err, text:S.text, gl:!!S.gl, rm:!!S.rm };
};

function loop(now){
  requestAnimationFrame(loop);
  if (!readySent) reportReady();
  var js0 = performance.now();
  if (gotTick && playing) songTime = tickTime + Math.min(.4, Math.max(0, (now - tickWall) / 1000));
  elapsed = (now - t0) / 1000;

  updateIndex(songTime);
  updateLit(songTime);
  updateProgress(songTime);

  beatPulse *= S.rm ? .95 : .89;
  if (beatPulse < .002) beatPulse = 0;
  smBass += (Math.min(1, live.bass) - smBass) * .16;

  if (now - barsClock > 54){ barsClock = now; updateBars(); }
  updateHalo();
  glFrame(now);

  S.t = songTime; S.playing = playing;
  S.frames++;
  S.js = performance.now() - js0;
}

var rtId = 0;
window.addEventListener('resize', function(){
  glResize();
  clearTimeout(rtId);
  rtId = setTimeout(function(){ if (S.curChars) fitLine(); }, 150);
});
window.addEventListener('error', function(e){ if (!S.err) S.err = String((e && e.message) || 'error').slice(0, 160); });

glSetup();
requestAnimationFrame(loop);
setTimeout(reportReady, 160);
})();
</script>
</body>
