<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>临床圣像 · CLINICAL RELIC</title>
<style>
  :root{
    --paper:#f1f2f3;
    --ink:#141719;
    --mute:#9aa1a7;
    --hair:rgba(20,23,25,.14);
    --accent-ink:#2b3238;
    --accent-soft:#c9d0d6;
    --font-sans:"Helvetica Neue","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;
      background:radial-gradient(120% 90% at 50% 28%,#fcfcfd 0%,#eef0f1 62%,#e4e6e7 100%)}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:2}

  /* ——— frame: hairline clinical raster ——— */
  .frame-line{position:absolute;background:var(--hair)}
  .frame-line.v{top:0;bottom:0;width:1px}
  .frame-line.h{left:0;right:0;height:1px}
  .edge-l{left:clamp(34px,4.2vw,74px)}
  .edge-r{right:clamp(34px,4.2vw,74px)}
  .horizon{top:69%}
  .crosshair{position:absolute;width:9px;height:9px}
  .crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--ink);opacity:.42}
  .crosshair::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-.5px)}
  .crosshair::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-.5px)}
  .ch-tl{left:calc(clamp(34px,4.2vw,74px) - 4px);top:calc(10.5% - 4px)}
  .ch-br{right:calc(clamp(34px,4.2vw,74px) - 4px);bottom:calc(9.5% - 4px)}

  /* ——— small type ——— */
  .mono{font-family:var(--font-mono);font-size:clamp(8.5px,.72vw,11px);letter-spacing:.2em;
        text-transform:uppercase;color:var(--mute);font-weight:400;line-height:1.9}
  .mono b{font-weight:500;color:#5f666c;letter-spacing:.16em}

  .specimen{position:absolute;left:calc(clamp(34px,4.2vw,74px) + 14px);top:clamp(20px,4.4vh,52px);max-width:min(46vw,420px)}
  .specimen .id{color:#6d747a}
  .specimen .id em{font-style:normal;color:var(--ink);letter-spacing:.12em}
  .specimen .song{font-size:clamp(11px,1vw,14px);letter-spacing:.22em;color:#3d4449;font-weight:400;
        text-transform:uppercase;margin-top:.7em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .specimen .artist{font-family:var(--font-mono);font-size:clamp(8.5px,.7vw,10.5px);letter-spacing:.24em;
        color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .telemetry{position:absolute;right:calc(clamp(34px,4.2vw,74px) + 14px);top:clamp(20px,4.4vh,52px);text-align:right}
  .telemetry .clock{font-family:var(--font-mono);font-size:clamp(10px,.9vw,13px);letter-spacing:.18em;color:#40474c}
  .telemetry .clock span{color:#b3b9be}

  /* ——— vertical rails ——— */
  .rail{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
        font-family:var(--font-mono);font-size:clamp(8px,.65vw,10px);letter-spacing:.34em;
        text-transform:uppercase;color:#a8aeb4;white-space:nowrap}
  .rail.west{left:clamp(12px,1.5vw,28px);transform:translateY(-50%) rotate(180deg);color:#b0b6bb}
  .rail.east{right:clamp(12px,1.5vw,28px);color:#c0c5ca}

  /* ——— measurement bracket around the specimen ——— */
  .measure{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);
           width:min(31vw,430px);height:min(43vh,420px);opacity:.72}
  .measure i{position:absolute;background:var(--hair)}
  .measure .m-t{left:0;right:0;top:0;height:1px}
  .measure .m-b{left:0;right:0;bottom:0;height:1px}
  .measure .m-l{top:0;bottom:0;left:0;width:1px}
  .measure .m-r{top:0;bottom:0;right:0;width:1px}
  .measure .m-c{left:50%;top:-4px;width:1px;height:8px;opacity:.7}
  .measure span{position:absolute;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.24em;
                color:#a9b0b6;text-transform:uppercase;padding:0 .45em}
  .measure .m-cap-t{top:-.7em;left:50%;transform:translateX(-50%)}
  .measure .m-cap-r{right:0;top:50%;transform:translate(50%,-50%) rotate(90deg)}
  .measure .m-cap-l{left:0;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}

  /* ——— lyrics ——— */
  .lyric{position:absolute;left:clamp(28px,6.4vw,116px);bottom:clamp(34px,9.5vh,112px);
         width:min(70vw,1000px)}
  .lyric-head{display:flex;align-items:center;gap:.9em;margin-bottom:clamp(10px,1.9vh,22px)}
  .lyric-head .rule{width:clamp(22px,3.4vw,52px);height:1px;background:var(--accent-ink);opacity:.75}
  .lyric-head .tag{font-family:var(--font-mono);font-size:clamp(8px,.62vw,10px);letter-spacing:.28em;
        text-transform:uppercase;color:#8d949a}
  .lyric-head .tag b{color:var(--accent-ink);font-weight:500}

  .line{font-weight:300;line-height:1.22;letter-spacing:.015em;word-break:break-word;
        color:#171a1d;--line-scale:1;transition:opacity .45s ease, filter .45s ease, transform .45s ease}
  .line .ch{color:#a6adb3;transition:color .28s ease}
  .line .ch.on{color:#171a1d}
  .line .ch.sp{white-space:pre}
  .line.cur{font-size:calc(clamp(21px,3.55vw,54px) * var(--line-scale))}
  .line.cur:empty{display:none}
  .line.next{margin-top:clamp(8px,1.5vh,18px);font-size:calc(clamp(13px,1.45vw,21px) * var(--line-scale));
             opacity:.42;color:#202428}
  .line.next .ch{color:#8f969c}
  .line.next .ch.on{color:#202428}

  .cursor{display:inline-block;width:.42em;height:.06em;background:var(--accent-ink);
          vertical-align:baseline;margin-left:.34em;opacity:.55;transform:translateY(-.12em)}

  .empty{display:none}
  .empty .glyph{width:clamp(38px,4vw,58px);height:clamp(38px,4vw,58px);border:1px solid var(--hair);
        border-radius:50%;position:relative;margin-bottom:clamp(12px,2vh,20px)}
  .empty .glyph::before,.empty .glyph::after{content:"";position:absolute;background:var(--hair)}
  .empty .glyph::before{left:50%;top:18%;bottom:18%;width:1px}
  .empty .glyph::after{top:50%;left:18%;right:18%;height:1px}
  .empty .t1{font-size:clamp(15px,1.5vw,21px);font-weight:300;letter-spacing:.32em;color:#5b6268}
  .empty .t2{font-family:var(--font-mono);font-size:clamp(8.5px,.66vw,10.5px);letter-spacing:.26em;
        text-transform:uppercase;color:#b0b6bb;margin-top:.9em;line-height:1.9}

  /* ——— bottom-right register line ——— */
  .register{position:absolute;right:calc(clamp(34px,4.2vw,74px) + 14px);bottom:clamp(30px,6.4vh,74px);
            text-align:right;font-family:var(--font-mono);font-size:clamp(8px,.6vw,9.5px);
            letter-spacing:.26em;color:#bcc1c6;text-transform:uppercase;line-height:2.1}
  .register b{font-weight:500;color:#7f868c}
  .register .bar{width:clamp(54px,7vw,104px);height:1px;background:rgba(20,23,25,.12);
            margin:6px 0 0 auto;position:relative;overflow:hidden}
  .register .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-ink);opacity:.55}

  @media (max-aspect-ratio: 4/5){
    .measure{width:min(64vw,340px);height:min(34vh,360px);top:33%}
    .lyric{left:8vw;right:8vw;width:auto;bottom:clamp(30px,7vh,80px)}
    .line.cur{font-size:calc(clamp(20px,7vw,38px) * var(--line-scale))}
    .line.next{font-size:calc(clamp(12px,4vw,17px) * var(--line-scale))}
    .specimen{max-width:60vw}
    .register{display:none}
    .rail{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    .line,.line .ch{transition:none}
  }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="hud">
  <div class="frame-line v edge-l"></div>
  <div class="frame-line v edge-r"></div>
  <div class="crosshair ch-tl"></div>
  <div class="crosshair ch-br"></div>

  <div class="specimen">
    <div class="id mono">Specimen <em id="serial">No. 363</em> · Cranial Unit</div>
    <div class="song" id="songName">Untitled</div>
    <div class="artist" id="songArtist">Unknown Artist</div>
  </div>

  <div class="telemetry">
    <div class="clock"><span id="clockA">00:00.0</span> / <span id="clockB">--:--</span></div>
    <div class="mono" id="bpmRead">Tempo ---</div>
    <div class="mono" id="stateRead">Field active</div>
  </div>

  <div class="rail west">Sterile field · class 100 · iso 14644-1</div>
  <div class="rail east">Neural interface · silicone 0.6 mm</div>

  <div class="measure">
    <i class="m-t"></i><i class="m-b"></i><i class="m-l"></i><i class="m-r"></i><i class="m-c"></i>
    <span class="m-cap-t">Ø 0.42 cranial</span>
    <span class="m-cap-r">layer 02</span>
    <span class="m-cap-l">sagittal</span>
  </div>

  <div class="lyric">
    <div class="lyric-head"><div class="rule"></div><div class="tag">Lyric <b id="lineNo">—</b></div></div>
    <div class="line cur" id="lineText">—</div>
    <div class="line next" id="nextText"></div>
    <div class="empty" id="emptyState">
      <div class="glyph"></div>
      <div class="t1" id="emptyTitle">样本装载中</div>
      <div class="t2" id="emptyNote">Awaiting specimen data</div>
    </div>
  </div>

  <div class="register">
    <div><b>Archive</b> 363 / A</div>
    <div><b>Status</b> not for resale</div>
    <div class="bar"><i id="progFill"></i></div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    reduced: false, glOk: false, lyricEl: null, textEl: null, emptyEl: null,
    duration: 0, accent: [140, 150, 160], song: { name: '', artists: '' }
  };

  window.__stage = function () {
    var cur = S.lines[S.idx];
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: S.t,
      playing: S.playing,
      frames: S.frames,
      js: S.js,
      err: '',
      text: cur && cur.text ? cur.text : '',
      gl: !!S.glOk,
      rm: !!S.reduced
    };
  };

  function currentIndex(time) {
    var found = -1;
    var limit = Math.min(S.lines.length, 900);
    for (var i = 0; i < limit; i++) {
      if (S.lines[i].t <= time + 0.06) found = i; else break;
    }
    return found;
  }

  function charTimes(line, count) {
    var times = [];
    var chars = line.chars;
    var matches = !!(chars && chars.length === count);
    if (matches) {
      for (var i = 0; i < count; i++) {
        var at = Number(chars[i] && chars[i].t);
        times.push(isFinite(at) ? at : line.t);
      }
      return times;
    }
    var spread = line.dur > 0 ? line.dur : Math.max(1.2, count * 0.15);
    for (var j = 0; j < count; j++) {
      times.push(line.t + spread * (j / Math.max(1, count)));
    }
    return times;
  }

  function buildLine(element, line) {
    var spans = [];
    if (!element) return spans;
    element.textContent = '';
    var text = line && typeof line.text === 'string' ? line.text : '';
    if (!text) return spans;
    var letters = Array.from(text);
    if (!letters.length) return spans;
    var limit = Math.min(letters.length, 220);
    var times = charTimes(line, letters.length);
    for (var i = 0; i < limit; i++) {
      var span = document.createElement('span');
      var glyph = letters[i];
      span.className = glyph === ' ' ? 'ch sp' : 'ch';
      span.textContent = glyph;
      element.appendChild(span);
      spans.push({ el: span, at: times[i], on: false });
    }
    return spans;
  }

  function paintChars(spans, time) {
    for (var i = 0; i < spans.length; i++) {
      var shouldLight = time >= spans[i].at - 0.02;
      if (shouldLight !== spans[i].on) {
        spans[i].on = shouldLight;
        if (shouldLight) spans[i].el.classList.add('on');
        else spans[i].el.classList.remove('on');
      }
    }
  }

  function lineScale(text) {
    var length = Array.from(text || '').length;
    if (length <= 16) return 1;
    return clampNumber(16 / length + 0.26, 0.5, 1);
  }

  function paintLyric(allowRebuild) {
    var total = S.lines.length;
    var hasText = false;
    for (var probe = 0; probe < total; probe++) {
      if (S.lines[probe].text) { hasText = true; break; }
    }
    if (!total || !hasText) {
      if (S.textEl) S.textEl.style.display = 'none';
      if (S.nextEl) S.nextEl.style.display = 'none';
      if (S.emptyEl) S.emptyEl.style.display = 'block';
      if (S.lineNoEl) S.lineNoEl.textContent = '—';
      S.paintedKey = 'empty';
      return;
    }
    if (S.emptyEl) S.emptyEl.style.display = 'none';
    if (S.textEl) S.textEl.style.display = '';
    if (S.nextEl) S.nextEl.style.display = '';

    var key = S.idx + ':' + total + ':' + (S.epoch || 0);
    if (allowRebuild && key !== S.paintedKey) {
      S.paintedKey = key;
      var current = S.idx >= 0 ? S.lines[S.idx] : null;
      var upcoming = S.lines[S.idx + 1] || (S.idx < 0 ? S.lines[0] : null);
      S.spans = current ? buildLine(S.textEl, current) : [];
      if (S.textEl) {
        if (!current) S.textEl.textContent = '';
        S.textEl.style.setProperty('--line-scale', String(lineScale(current ? current.text : '')));
      }
      if (S.nextEl) {
        if (upcoming && upcoming.text) {
          S.nextEl.textContent = upcoming.text;
          S.nextEl.style.display = '';
          S.nextEl.style.setProperty('--line-scale', String(lineScale(upcoming.text)));
        } else {
          S.nextEl.textContent = '';
          S.nextEl.style.display = 'none';
        }
      }
      if (S.lineNoEl) {
        var currentNo = S.idx >= 0 ? String(S.idx + 1).padStart(2, '0') : '--';
        S.lineNoEl.textContent = currentNo + ' / ' + String(total).padStart(2, '0');
      }
    }
    if (S.spans && S.spans.length) paintChars(S.spans, S.t);
  }

  function applyAccent(rgb) {
    var source = Array.isArray(rgb) && rgb.length >= 3 ? rgb : [140, 150, 160];
    var inkParts = [];
    var softParts = [];
    for (var i = 0; i < 3; i++) {
      var value = clampNumber(source[i], 0, 255);
      inkParts.push(Math.round(clampNumber(value * 0.34 + 20 * 0.66, 0, 255)));
      softParts.push(Math.round(clampNumber(value * 0.42 + 255 * 0.58, 0, 255)));
    }
    var root = document.documentElement;
    root.style.setProperty('--accent-ink', 'rgb(' + inkParts.join(',') + ')');
    root.style.setProperty('--accent-soft', 'rgb(' + softParts.join(',') + ')');
  }

  function applySongMeta() {
    if (S.songNameEl) S.songNameEl.textContent = S.song.name || 'Untitled specimen';
    if (S.songArtistEl) S.songArtistEl.textContent = S.song.artists || 'Unattributed';
    if (S.serialEl) S.serialEl.textContent = 'No. 363';
  }

  function applyInit(payload) {
    var data = payload || {};
    var song = data.song || {};
    var artists = song.artists;
    if (Array.isArray(artists)) artists = artists.filter(function (item) { return !!item; }).join(' / ');
    S.song = { name: song.name || '', artists: typeof artists === 'string' ? artists : '' };
    S.accent = Array.isArray(data.accent) ? data.accent : [140, 150, 160];
    S.duration = Number(data.duration) > 0 ? Number(data.duration) : 0;
    S.playing = typeof data.playing === 'boolean' ? data.playing : true;
    S.bpm = Number(data.bpm) > 0 ? Number(data.bpm) : 0;

    var raw = Array.isArray(data.lines) ? data.lines.slice(0, 600) : [];
    var clean = [];
    for (var i = 0; i < raw.length; i++) {
      var item = raw[i] || {};
      var start = Number(item.t);
      var length = Number(item.dur);
      if (!isFinite(start)) continue;
      clean.push({
        t: Math.max(0, start),
        dur: isFinite(length) && length > 0 ? length : 0,
        text: typeof item.text === 'string' ? item.text : '',
        chars: Array.isArray(item.chars) ? item.chars : null
      });
    }
    S.lines = clean;
    S.epoch = (S.epoch || 0) + 1;
    S.paintedKey = '';
    S.spans = [];
    if (!clean.length) {
      if (S.emptyTitleEl) S.emptyTitleEl.textContent = '无歌词样本';
      if (S.emptyNoteEl) S.emptyNoteEl.textContent = 'No lyric data supplied';
    }
    applyAccent(S.accent);
    applySongMeta();
    S.idx = currentIndex(S.t);
    paintLyric(true);
  }

  function onMessage(ev) {
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') {
        applyInit(d.payload);
      } else if (d.type === 'tick') {
        var tick = d.payload || {};
        if (typeof tick.time === 'number' && isFinite(tick.time)) S.t = tick.time;
        if (typeof tick.playing === 'boolean') S.playing = tick.playing;
        S.idx = currentIndex(S.t);
        paintLyric(true);
      } else if (d.type === 'beat') {
        var beat = d.payload || {};
        S.beatLevel = clampNumber(beat.level, 0, 1);
        S.pulse = Math.max(S.pulse || 0, 0.32 + 0.68 * S.beatLevel);
      } else if (d.type === 'live') {
        var live = d.payload || {};
        S.live = live;
        var bpm = Number(live.bpm);
        if (isFinite(bpm) && bpm > 0) S.bpm = bpm;
      }
    } catch (err) {
      console.error('[363] message handler failed', err);
    }
  }

  /* ————————————————————————————————————————————————
     WebGL studio: one porcelain cranial unit, raymarched.
     Height/width fall back to 1440x900 whenever the window lies.
     ———————————————————————————————————————————————— */
  var VERTEX_SRC =
    'attribute vec2 aPos;' +
    'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';

  var FRAGMENT_SRC = [
    'precision highp float;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform float uLevel;',
    'uniform float uBass;',
    'uniform float uPulse;',
    'uniform float uMotion;',
    'uniform vec3 uAccent;',
    'uniform vec3 uBead;',
    'float gMat;',
    'float smin(float a, float b, float k){',
    '  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);',
    '  return mix(b, a, h) - k * h * (1.0 - h);',
    '}',
    'float sdEllipsoid(vec3 p, vec3 r){',
    '  float k0 = length(p / r);',
    '  float k1 = length(p / (r * r));',
    '  return k0 * (k0 - 1.0) / max(k1, 1e-4);',
    '}',
    'float sdCapsule(vec3 p, vec3 a, vec3 b, float r){',
    '  vec3 pa = p - a;',
    '  vec3 ba = b - a;',
    '  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);',
    '  return length(pa - ba * h) - r;',
    '}',
    'float sdTorus(vec3 p, vec2 t){',
    '  vec2 q = vec2(length(p.xz) - t.x, p.y);',
    '  return length(q) - t.y;',
    '}',
    'float sdCylinder(vec3 p, float r, float h){',
    '  vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h);',
    '  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));',
    '}',
    'float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }',
    'float mapHead(vec3 p){',
    '  vec3 q = p - vec3(0.0, 0.62, 0.0);',
    '  float cranium = sdEllipsoid(q - vec3(0.0, 0.03, -0.02), vec3(0.372, 0.462, 0.408));',
    '  float face = sdEllipsoid(q - vec3(0.0, -0.15, 0.05), vec3(0.288, 0.322, 0.330));',
    '  float jaw = sdEllipsoid(q - vec3(0.0, -0.375, 0.065), vec3(0.172, 0.150, 0.215));',
    '  float head = smin(cranium, face, 0.11);',
    '  head = smin(head, jaw, 0.08);',
    '  head = smin(head, sdEllipsoid(q - vec3(0.0, 0.005, 0.250), vec3(0.232, 0.052, 0.150)), 0.075);',
    '  head = smin(head, sdCapsule(q, vec3(0.0, -0.03, 0.335), vec3(0.0, -0.165, 0.362), 0.030), 0.05);',
    '  head = smin(head, sdEllipsoid(q - vec3(0.150, -0.115, 0.208), vec3(0.070, 0.062, 0.082)), 0.06);',
    '  head = smin(head, sdEllipsoid(q - vec3(-0.150, -0.115, 0.208), vec3(0.070, 0.062, 0.082)), 0.06);',
    '  head = max(head, -(sdEllipsoid(q - vec3(0.104, -0.040, 0.292), vec3(0.076, 0.052, 0.072))));',
    '  head = max(head, -(sdEllipsoid(q - vec3(-0.104, -0.040, 0.292), vec3(0.076, 0.052, 0.072))));',
    '  head = max(head, -(abs(q.y - 0.100) - 0.006));',
    '  float neck = sdCapsule(p, vec3(0.0, -0.200, -0.005), vec3(0.0, 0.220, 0.005), 0.142);',
    '  head = smin(head, neck, 0.09);',
    '  return head;',
    '}',
    'float mapRing(vec3 p){',
    '  vec3 q = p - vec3(0.0, 0.58, 0.0);',
    '  float cx = cos(0.34); float sx = sin(0.34);',
    '  vec3 r1 = vec3(q.x, q.y * cx - q.z * sx, q.y * sx + q.z * cx);',
    '  float cz = cos(0.22); float sz = sin(0.22);',
    '  vec3 r2 = vec3(r1.x * cz - r1.y * sz, r1.x * sz + r1.y * cz, r1.z);',
    '  return sdTorus(r2, vec2(0.62 + 0.006 * uPulse, 0.0072));',
    '}',
    'float mapScene(vec3 p){',
    '  float dHead = mapHead(p);',
    '  float dRing = mapRing(p);',
    '  float dBead = length(p - uBead) - 0.017;',
    '  float result = dHead; gMat = 1.0;',
    '  if (dRing < result) { result = dRing; gMat = 2.0; }',
    '  if (dBead < result) { result = dBead; gMat = 3.0; }',
    '  return result;',
    '}',
    'vec3 calcNormal(vec3 p){',
    '  vec2 e = vec2(0.0016, 0.0);',
    '  return normalize(vec3(',
    '    mapScene(p + e.xyy) - mapScene(p - e.xyy),',
    '    mapScene(p + e.yxy) - mapScene(p - e.yxy),',
    '    mapScene(p + e.yyx) - mapScene(p - e.yyx)));',
    '}',
    'float softOcclusion(vec3 p, vec3 n){',
    '  float occ = 0.0;',
    '  float weight = 1.0;',
    '  for (int i = 0; i < 3; i++){',
    '    float h = 0.03 + 0.09 * float(i);',
    '    occ += (h - mapScene(p + n * h)) * weight;',
    '    weight *= 0.62;',
    '  }',
    '  return clamp(1.0 - 1.9 * occ, 0.0, 1.0);',
    '}',
    'vec3 studio(vec3 ro, vec3 rd){',
    '  vec3 topColor = vec3(0.955, 0.960, 0.965);',
    '  vec3 lowColor = vec3(0.852, 0.862, 0.870);',
    '  float k = clamp(0.58 - rd.y * 1.75, 0.0, 1.0);',
    '  vec3 col = mix(topColor, lowColor, k * k);',
    '  float halo = clamp(1.0 - length(rd.xy * vec2(1.5, 2.1) + vec2(0.0, 0.12)), 0.0, 1.0);',
    '  col += vec3(0.038) * pow(halo, 2.2);',
    '  float poolX = rd.x * 2.35;',
    '  float pool = exp(-poolX * poolX) * smoothstep(0.02, 0.40, -rd.y);',
    '  col -= vec3((0.085 + 0.045 * uBass) * pool);',
    '  return col;',
    '}',
    'vec3 shade(vec3 p, vec3 n, vec3 rd, float mat){',
    '  float key = clamp(dot(n, normalize(vec3(-0.46, 0.80, 0.60))), 0.0, 1.0);',
    '  float fill = clamp(dot(n, normalize(vec3(0.72, 0.18, 0.42))), 0.0, 1.0);',
    '  float wrap = clamp(key * 0.5 + 0.5, 0.0, 1.0);',
    '  float spec = pow(clamp(dot(n, normalize(vec3(-0.46, 0.80, 0.60) - rd)), 0.0, 1.0), 52.0);',
    '  float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.2);',
    '  float occ = softOcclusion(p, n);',
    '  vec3 tint = mix(vec3(1.0), uAccent, 0.10);',
    '  vec3 albedo = vec3(0.958, 0.962, 0.966);',
    '  float gloss = 0.50;',
    '  if (mat > 1.5 && mat < 2.5) { albedo = vec3(0.705, 0.730, 0.755); gloss = 1.55; }',
    '  if (mat > 2.5) { albedo = uAccent * 1.2; gloss = 0.15; }',
    '  vec3 col = albedo * tint * (0.66 + 0.34 * wrap) * (0.64 + 0.36 * occ);',
    '  col += vec3(0.07) * albedo * fill * occ;',
    '  col += vec3(1.0) * spec * gloss;',
    '  col += uAccent * fres * 0.16 * (0.5 + 0.5 * uLevel);',
    '  if (mat > 2.5) col += uAccent * (0.30 + 0.85 * uPulse);',
    '  return col;',
    '}',
    'void main(){',
    '  vec2 frag = gl_FragCoord.xy;',
    '  vec2 uv = (frag - 0.5 * uRes) / max(uRes.y, 1.0);',
    '  float aspect = uRes.x / max(uRes.y, 1.0);',
    '  float focal = clamp(min(1.38, 1.95 * aspect), 0.86, 1.38);',
    '  float ang = 0.13 * sin(uTime * 0.09) * uMotion;',
    '  vec3 ro = vec3(sin(ang) * 2.80, 0.95 + 0.02 * sin(uTime * 0.31) * uMotion, cos(ang) * 2.80);',
    '  vec3 target = vec3(0.0, 0.36, 0.0);',
    '  vec3 ww = normalize(target - ro);',
    '  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));',
    '  vec3 vv = cross(ww, uu);',
    '  vec3 rd = normalize(uv.x * uu + uv.y * vv + focal * ww);',
    '  float tMarch = 0.0;',
    '  float hit = 0.0;',
    '  vec3 oc = ro - vec3(0.0, 0.45, 0.0);',
    '  float b = dot(oc, rd);',
    '  float c = dot(oc, oc) - 1.44;',
    '  float disc = b * b - c;',
    '  if (disc > 0.0) {',
    '    float tFar = -b + sqrt(disc);',
    '    float tNear = max(0.02, -b - sqrt(disc));',
    '    if (tFar > 0.0) {',
    '      float walk = tNear;',
    '      for (int i = 0; i < 88; i++){',
    '        vec3 pos = ro + rd * walk;',
    '        float dist = mapScene(pos);',
    '        if (dist < 0.0013) { hit = 1.0; tMarch = walk; break; }',
    '        walk += dist * 0.95;',
    '        if (walk > tFar) { break; }',
    '      }',
    '    }',
    '  }',
    '  vec3 color;',
    '  if (hit > 0.5) {',
    '    float hitMat = gMat;',
    '    vec3 pos = ro + rd * tMarch;',
    '    vec3 nor = calcNormal(pos);',
    '    color = shade(pos, nor, rd, hitMat);',
    '    float sweepSpeed = 0.15 + 0.85 * uMotion;',
    '    float sweepY = -0.30 + 1.50 * fract(uTime * 0.065 * sweepSpeed);',
    '    float sweepDelta = (pos.y - sweepY) * 105.0;',
    '    color += uAccent * exp(-sweepDelta * sweepDelta) * 0.42;',
    '    float fog = 1.0 - exp(-max(tMarch - 1.6, 0.0) * 0.16);',
    '    color = mix(color, studio(ro, rd), clamp(fog, 0.0, 0.55));',
    '  } else {',
    '    color = studio(ro, rd);',
    '  }',
    '  color = pow(clamp(color, 0.0, 1.0), vec3(0.94));',
    '  float grain = (hash(frag) - 0.5) * 0.006;',
    '  color += vec3(grain);',
    '  gl_FragColor = vec4(color, 1.0);',
    '}'
  ].join('\n');

  function compileShader(gl, type, source) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error('[363] shader compile failed:', gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function createRenderer(canvas) {
    var renderer = {
      ok: false, gl: null, uniforms: null, canvas: canvas,
      width: 1440, height: 900, lastDraw: 0, hasBead: true
    };
    var gl = null;
    try {
      gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' })
        || canvas.getContext('experimental-webgl');
    } catch (err) {
      console.error('[363] webgl context failed', err);
      return renderer;
    }
    if (!gl) {
      console.warn('[363] no webgl, falling back to 2d');
      return renderer;
    }
    var vertex = compileShader(gl, gl.VERTEX_SHADER, VERTEX_SRC);
    var fragment = compileShader(gl, gl.FRAGMENT_SHADER, FRAGMENT_SRC);
    if (!vertex || !fragment) return renderer;
    var program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error('[363] program link failed:', gl.getProgramInfoLog(program));
      return renderer;
    }
    gl.useProgram(program);
    var buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var location = gl.getAttribLocation(program, 'aPos');
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);
    renderer.uniforms = {
      res: gl.getUniformLocation(program, 'uRes'),
      time: gl.getUniformLocation(program, 'uTime'),
      level: gl.getUniformLocation(program, 'uLevel'),
      bass: gl.getUniformLocation(program, 'uBass'),
      pulse: gl.getUniformLocation(program, 'uPulse'),
      motion: gl.getUniformLocation(program, 'uMotion'),
      accent: gl.getUniformLocation(program, 'uAccent'),
      bead: gl.getUniformLocation(program, 'uBead')
    };
    renderer.gl = gl;
    renderer.ok = true;
    canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      renderer.ok = false;
      S.glOk = false;
      console.error('[363] webgl context lost');
    }, false);
    return renderer;
  }

  function resizeRenderer(renderer) {
    var cssWidth = Number(window.innerWidth);
    var cssHeight = Number(window.innerHeight);
    if (!isFinite(cssWidth) || cssWidth <= 0) cssWidth = 1440;
    if (!isFinite(cssHeight) || cssHeight <= 0) cssHeight = 900;
    var budget = 430000;
    var scale = Math.sqrt(budget / Math.max(cssWidth * cssHeight, 1));
    scale = Math.min(1, Math.max(0.28, scale));
    var width = Math.max(2, Math.round(cssWidth * scale));
    var height = Math.max(2, Math.round(cssHeight * scale));
    renderer.width = width;
    renderer.height = height;
    if (renderer.canvas) {
      renderer.canvas.width = width;
      renderer.canvas.height = height;
    }
    if (renderer.gl) renderer.gl.viewport(0, 0, width, height);
  }

  function beadPosition(angle) {
    var radius = 0.62;
    var lx = Math.cos(angle) * radius;
    var lz = Math.sin(angle) * radius;
    var cx = Math.cos(0.34), sx = Math.sin(0.34);
    var cz = Math.cos(0.22), sz = Math.sin(0.22);
    var r1x = lx * cz + 0.0 * sz;
    var r1y = -lx * sz + 0.0 * cz;
    var r1z = lz;
    var qx = r1x;
    var qy = r1y * cx + r1z * sx;
    var qz = -r1y * sx + r1z * cx;
    return [qx, qy + 0.58, qz];
  }

  function drawThree(renderer, timeSeconds, nowMs) {
    var gl = renderer.gl;
    if (!gl || !renderer.ok) return;
    if (nowMs - renderer.lastDraw < 26) return;
    renderer.lastDraw = nowMs;
    var accent = S.accent || [140, 150, 160];
    var accentR = Math.min(1, Math.max(0, (Number(accent[0]) || 0) / 255));
    var accentG = Math.min(1, Math.max(0, (Number(accent[1]) || 0) / 255));
    var accentB = Math.min(1, Math.max(0, (Number(accent[2]) || 0) / 255));
    var angle = timeSeconds * (S.playing ? 0.34 : 0.1) * (S.reduced ? 0.25 : 0.6);
    var bead = beadPosition(angle);
    var uniforms = renderer.uniforms;
    gl.uniform2f(uniforms.res, renderer.width, renderer.height);
    gl.uniform1f(uniforms.time, timeSeconds);
    gl.uniform1f(uniforms.level, S.smoothLevel);
    gl.uniform1f(uniforms.bass, S.smoothBass);
    gl.uniform1f(uniforms.pulse, S.pulse);
    gl.uniform1f(uniforms.motion, S.reduced ? 0 : 1);
    gl.uniform3f(uniforms.accent, accentR, accentG, accentB);
    gl.uniform3f(uniforms.bead, bead[0], bead[1], bead[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function clampNumber(value, min, max) {
    var num = Number(value);
    if (!isFinite(num)) return min;
    return Math.min(max, Math.max(min, num));
  }

  function formatClock(seconds) {
    var total = Number(seconds);
    if (!isFinite(total) || total < 0) total = 0;
    var minutes = Math.floor(total / 60);
    var rest = total - minutes * 60;
    var whole = Math.floor(rest);
    var tenth = Math.floor((rest - whole) * 10);
    var minuteText = minutes < 10 ? '0' + minutes : String(minutes);
    var secondText = whole < 10 ? '0' + whole : String(whole);
    return minuteText + ':' + secondText + '.' + tenth;
  }

  function updateTelemetry(now) {
    if (now - (S.lastTelemetry || 0) < 90) return;
    S.lastTelemetry = now;
    if (S.clockAEl) S.clockAEl.textContent = formatClock(S.t);
    if (S.clockBEl) S.clockBEl.textContent = S.duration > 0 ? formatClock(S.duration) : '--:--';
    if (S.progressEl && S.duration > 0) {
      var ratio = clampNumber(S.t / S.duration, 0, 1);
      S.progressEl.style.width = (ratio * 100).toFixed(1) + '%';
    }
    if (S.bpmEl) {
      var bpm = Number(S.bpm);
      var bpmText = isFinite(bpm) && bpm > 0 ? String(Math.round(bpm)).padStart(3, '0') : '---';
      S.bpmEl.textContent = 'Tempo ' + bpmText;
    }
    if (S.stateEl) S.stateEl.textContent = S.playing ? 'Field active' : 'Field held';
  }

  function addStopSafely(gradient, offset, color) {
    try {
      gradient.addColorStop(clampNumber(offset, 0, 1), color);
    } catch (err) {
      console.error('[363] addColorStop failed', err);
    }
  }

  function accentCss(alpha) {
    var accent = S.accent || [140, 150, 160];
    var red = Math.round(clampNumber(accent[0], 0, 255));
    var green = Math.round(clampNumber(accent[1], 0, 255));
    var blue = Math.round(clampNumber(accent[2], 0, 255));
    return 'rgba(' + red + ',' + green + ',' + blue + ',' + clampNumber(alpha, 0, 1).toFixed(3) + ')';
  }

  function drawFallback2D(timeSeconds) {
    var ctx = S.ctx2d;
    var canvas = S.canvas;
    if (!ctx || !canvas) return;
    var nowMs = performance.now();
    if (nowMs - (S.lastFallback || 0) < 33) return;
    S.lastFallback = nowMs;
    if (!canvas.width || !canvas.height) {
      canvas.width = 1440;
      canvas.height = 900;
    }
    var width = canvas.width;
    var height = canvas.height;
    try {
      var paper = ctx.createLinearGradient(0, 0, 0, height);
      addStopSafely(paper, 0, '#fbfbfc');
      addStopSafely(paper, 0.6, '#eef0f1');
      addStopSafely(paper, 1, '#e0e3e4');
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, width, height);

      var centerX = width * 0.5;
      var centerY = height * 0.43;
      var radiusX = Math.min(width * 0.155, height * 0.2);
      var radiusY = radiusX * 1.16;

      var shadow = ctx.createRadialGradient(centerX, centerY + radiusY * 1.55, radiusX * 0.2, centerX, centerY + radiusY * 1.55, radiusX * 1.5);
      addStopSafely(shadow, 0, 'rgba(70,78,86,0.20)');
      addStopSafely(shadow, 1, 'rgba(70,78,86,0)');
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.ellipse(centerX, centerY + radiusY * 1.55, radiusX * 1.6, radiusX * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      var porcelain = ctx.createRadialGradient(centerX - radiusX * 0.45, centerY - radiusY * 0.55, radiusX * 0.08, centerX, centerY, radiusX * 1.35);
      addStopSafely(porcelain, 0, '#ffffff');
      addStopSafely(porcelain, 0.5, '#eef1f2');
      addStopSafely(porcelain, 0.86, '#cfd4d8');
      addStopSafely(porcelain, 1, '#b7bfc5');
      ctx.fillStyle = porcelain;
      ctx.beginPath();
      ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(120,130,138,0.35)';
      ctx.lineWidth = Math.max(1, width * 0.0007);
      ctx.beginPath();
      ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, Math.PI * 0.06, Math.PI * 0.94);
      ctx.stroke();

      ctx.fillStyle = 'rgba(240,243,244,0.9)';
      ctx.beginPath();
      ctx.ellipse(centerX, centerY + radiusY * 1.22, radiusX * 0.34, radiusY * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();

      var ringAlpha = 0.28 + 0.18 * Math.sin(timeSeconds * 0.8);
      ctx.strokeStyle = accentCss(ringAlpha);
      ctx.lineWidth = Math.max(1, width * 0.0008);
      ctx.beginPath();
      ctx.ellipse(centerX, centerY, radiusX * 1.55, radiusX * 0.52, -0.24, 0, Math.PI * 2);
      ctx.stroke();
    } catch (err) {
      console.error('[363] 2d fallback draw failed', err);
    }
  }

  function frame(now) {
    var start = performance.now();
    S.frames++;
    try {
      var delta = S.lastFrameMs > 0 ? Math.min(0.06, (now - S.lastFrameMs) / 1000) : 0;
      S.lastFrameMs = now;
      S.elapsed = (S.elapsed || 0) + delta;

      S.pulse *= 0.90;
      if (S.pulse < 0.002) S.pulse = 0;

      var live = S.live || {};
      var levelTarget = clampNumber(live.level, 0, 1);
      var bassTarget = clampNumber(live.bass, 0, 1);
      if (live.playing === false) {
        levelTarget = 0.10 + 0.05 * Math.sin(S.elapsed * 1.1);
        bassTarget = 0.08;
      }
      var ease = S.reduced ? 0.05 : 0.12;
      S.smoothLevel += (levelTarget - S.smoothLevel) * ease;
      S.smoothBass += (bassTarget - S.smoothBass) * ease;

      if (S.glOk) drawThree(S.renderer, S.elapsed, now);
      else drawFallback2D(S.elapsed);

      updateTelemetry(now);
      paintLyric(true);
    } catch (err) {
      console.error('[363] frame failed', err);
    }
    S.js = performance.now() - start;
    requestAnimationFrame(frame);
  }

  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try {
      parent.postMessage({ __c100: 1, type: 'ready' }, '*');
    } catch (err) {
      console.error('[363] ready post failed', err);
    }
  }

  function onResize() {
    if (S.resizeTimer) clearTimeout(S.resizeTimer);
    S.resizeTimer = setTimeout(function () {
      try {
        if (S.glOk) resizeRenderer(S.renderer);
        else if (S.ctx2d) {
          var width = Number(window.innerWidth) > 0 ? Math.round(window.innerWidth) : 1440;
          var height = Number(window.innerHeight) > 0 ? Math.round(window.innerHeight) : 900;
          S.canvas.width = width;
          S.canvas.height = height;
        }
      } catch (err) {
        console.error('[363] resize failed', err);
      }
    }, 140);
  }

  function onMotionPreference(event) {
    S.reduced = !!event.matches;
  }

  function boot() {
    try {
      S.textEl = document.getElementById('lineText');
      S.nextEl = document.getElementById('nextText');
      S.emptyEl = document.getElementById('emptyState');
      S.emptyTitleEl = document.getElementById('emptyTitle');
      S.emptyNoteEl = document.getElementById('emptyNote');
      S.clockAEl = document.getElementById('clockA');
      S.clockBEl = document.getElementById('clockB');
      S.bpmEl = document.getElementById('bpmRead');
      S.stateEl = document.getElementById('stateRead');
      S.progressEl = document.getElementById('progFill');
      S.lineNoEl = document.getElementById('lineNo');
      S.songNameEl = document.getElementById('songName');
      S.songArtistEl = document.getElementById('songArtist');
      S.serialEl = document.getElementById('serial');
      S.smoothLevel = 0;
      S.smoothBass = 0;
      S.pulse = 0;
      S.beatLevel = 0;
      S.elapsed = 0;
      S.lastFrameMs = 0;
      S.lastTelemetry = 0;
      S.bpm = 0;
      S.epoch = 0;
      S.paintedKey = '';
      S.spans = [];
      S.live = { level: 0, bass: 0, playing: true };
      S.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      window.addEventListener('message', onMessage, false);
      requestAnimationFrame(function () { sendReady(); });
      setTimeout(sendReady, 900);

      S.canvas = document.getElementById('gl');
      S.renderer = createRenderer(S.canvas);
      if (S.renderer && S.renderer.ok) {
        S.glOk = true;
        resizeRenderer(S.renderer);
      } else {
        S.glOk = false;
        var replacement = S.canvas.cloneNode(false);
        if (S.canvas.parentNode) S.canvas.parentNode.replaceChild(replacement, S.canvas);
        S.canvas = replacement;
        S.ctx2d = replacement.getContext('2d');
        if (S.ctx2d) {
          S.canvas.width = Number(window.innerWidth) > 0 ? Math.round(window.innerWidth) : 1440;
          S.canvas.height = Number(window.innerHeight) > 0 ? Math.round(window.innerHeight) : 900;
        }
      }
      window.addEventListener('resize', onResize, false);
      if (window.matchMedia) {
        var query = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (query.addEventListener) query.addEventListener('change', onMotionPreference);
      }
      paintLyric(true);
      requestAnimationFrame(frame);
    } catch (err) {
      console.error('[363] boot failed', err);
    }
  }

  boot();
})();
</script>
</body>
</html>
