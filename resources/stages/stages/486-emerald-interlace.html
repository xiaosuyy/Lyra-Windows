<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雾结翡翠</title>
<style>
  :root{
    --gold:#d2a961;
    --cream:#f4ecd6;
    --moss:#5e9b73;
    --fog:1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#06120c;overflow:hidden}
  body{
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","Songti SC","STSong",
      "Noto Serif SC","Source Han Serif SC","Microsoft YaHei",Georgia,serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #stage{
    position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(130% 96% at 58% 4%, #3a6a4c 0%, #245039 20%, #143A28 42%, #0a2117 68%, #050f0a 100%);
  }
  #stage > *{position:absolute}

  /* ---------- 底光 ---------- */
  #glow{
    inset:-18%;pointer-events:none;z-index:0;
    background:
      radial-gradient(46% 30% at 32% 20%, rgba(198,236,214,.24), rgba(198,236,214,0) 72%),
      radial-gradient(40% 26% at 74% 62%, rgba(112,196,158,.15), rgba(112,196,158,0) 74%),
      radial-gradient(70% 46% at 50% 112%, rgba(3,12,8,.92), rgba(3,12,8,0) 70%);
    mix-blend-mode:screen;
  }
  /* ---------- 结环 ---------- */
  #band{
    left:50%;top:50%;width:100%;height:100%;
    transform:translate(-50%,-50%);
    z-index:1;opacity:0;
    transform-origin:50% 50%;
    transition:opacity 1.3s ease-out;
    will-change:transform,opacity;
  }
  #band.on{opacity:1}
  #core{
    left:50%;top:50%;width:min(96vmin,980px);height:min(96vmin,980px);
    transform:translate(-50%,-50%);z-index:1;
    opacity:0;transition:opacity 1.6s ease-out;
    will-change:transform;
  }
  #core.on{opacity:1}

  /* ---------- 海雾 ---------- */
  #fog{
    inset:-16%;pointer-events:none;z-index:2;
    background:
      radial-gradient(34% 24% at 16% 30%, rgba(230,242,230,.30), rgba(230,242,230,0) 71%),
      radial-gradient(30% 20% at 62% 14%, rgba(212,238,226,.24), rgba(212,238,226,0) 73%),
      radial-gradient(42% 26% at 54% 88%, rgba(176,222,202,.22), rgba(176,222,202,0) 75%),
      radial-gradient(26% 18% at 86% 42%, rgba(226,240,222,.18), rgba(226,240,222,0) 76%);
    mix-blend-mode:screen;
    will-change:transform,opacity;
  }
  /* ---------- 斜射微光（扫过金线） ---------- */
  #sheen{
    left:-60%;top:-60%;width:220%;height:220%;pointer-events:none;z-index:2;
    background:linear-gradient(104deg,
      rgba(255,240,204,0) 34%,
      rgba(255,240,204,.055) 44%,
      rgba(255,244,214,.13) 50%,
      rgba(255,240,204,.055) 56%,
      rgba(255,240,204,0) 66%);
    mix-blend-mode:overlay;
    will-change:transform;
  }
  /* ---------- 字下的暗影池（保证可读，不是乳白柔光） ---------- */
  #pool{
    left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(104vw,1240px);height:min(46vh,520px);
    pointer-events:none;z-index:3;
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(2,12,8,.72) 0%, rgba(2,12,8,.58) 38%, rgba(2,12,8,.26) 66%, rgba(2,12,8,0) 82%);
  }

  /* ---------- 歌词 ---------- */
  #lyr{
    left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(88vw,1160px);z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;
  }
  .slot{width:100%;display:block}
  #lprev,#lnext{
    font-size:clamp(12px,1.48vw,19px);
    letter-spacing:.20em;text-indent:.20em;
    color:rgba(206,228,202,.56);
    height:1.9em;line-height:1.9em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:opacity .5s ease;
    text-shadow:0 1px 8px rgba(0,10,7,.95);
  }
  #lnow{
    font-size:clamp(25px,4.3vw,58px);
    line-height:1.30;letter-spacing:.035em;
    color:#f7f0dc;font-weight:500;
    min-height:1.30em;
    margin:clamp(2px,.7vh,9px) 0;
    white-space:pre-wrap;word-break:break-word;
    text-shadow:
      0 2px 16px rgba(0,0,0,.95),
      0 0 46px rgba(3,18,12,.98),
      0 0 3px rgba(0,0,0,.75);
    will-change:transform,opacity;
  }
  #lnow.s1{font-size:clamp(21px,3.5vw,47px)}
  #lnow.s2{font-size:clamp(17px,2.75vw,36px);line-height:1.36}
  #lnow.s3{font-size:clamp(14px,2.1vw,27px);line-height:1.44;letter-spacing:.01em}
  /* 未唱到的字：偏亮的灰蓝，对深底仍有 4:1 以上，不玩"暗底配近黑字" */
  #lnow .ch{
    display:inline-block;white-space:pre;
    color:rgba(198,216,196,.52);
    transition:color .14s linear;
    text-shadow:0 2px 16px rgba(0,0,0,.95);
  }
  #lnow .ch.lit{
    color:#f8f2dd;
    text-shadow:0 2px 16px rgba(0,0,0,.95), 0 0 22px rgba(224,186,112,.42);
  }
  #lnow .ch.nowc{
    color:#fffaf0;
    text-shadow:0 2px 16px rgba(0,0,0,.95), 0 0 30px rgba(248,212,138,.72);
  }
  /* 句首小饰 */
  #mark{
    width:clamp(26px,3.2vw,46px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(210,169,97,.85),transparent);
    opacity:.55;margin-bottom:clamp(6px,1.4vh,16px);
    transition:opacity .6s ease;
  }

  /* ---------- 空状态 ---------- */
  #empty{
    left:0;right:0;top:50%;transform:translateY(-50%);
    z-index:6;pointer-events:none;display:none;flex-direction:column;
    align-items:center;gap:.55em;text-align:center;padding:0 10vw;
  }
  #empty.p{display:flex}
  #empty .g{font-size:clamp(30px,5.4vw,58px);color:rgba(214,234,206,.56);
            letter-spacing:.24em;text-indent:.24em;
            text-shadow:0 0 26px rgba(120,196,158,.30)}
  #empty .s{font-size:clamp(11px,1.35vw,15px);letter-spacing:.42em;text-indent:.42em;
            color:rgba(206,226,196,.44)}

  /* ---------- 顶饰 ---------- */
  #rule{
    left:50%;top:clamp(14px,3.2vh,38px);transform:translateX(-50%);
    width:min(44vw,520px);height:1px;opacity:.55;z-index:5;
    background:linear-gradient(90deg,transparent,rgba(210,169,97,.75),transparent);
  }
  #rule::after{
    content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;
    transform:translateX(-50%) rotate(45deg);
    background:rgba(210,169,97,.9);
    box-shadow:0 0 12px rgba(210,169,97,.6);
  }
  #song{
    left:0;right:0;top:calc(clamp(14px,3.2vh,38px) + 13px);z-index:5;
    text-align:center;font-size:clamp(10px,1.02vw,13px);
    letter-spacing:.36em;text-indent:.36em;
    color:rgba(224,238,212,.52);
    opacity:0;transition:opacity 1.1s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:0 6vw;
  }
  #song.on{opacity:1}

  #motes{inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
  #vign{
    inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(124% 98% at 50% 46%,rgba(0,0,0,0) 40%,rgba(2,10,7,.60) 100%);
  }
  #grain{inset:0;width:100%;height:100%;z-index:8;pointer-events:none;
         opacity:.20;mix-blend-mode:overlay}

  @media (prefers-reduced-motion: reduce){
    #band,#core,#sheen{will-change:auto}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <canvas id="band" width="1440" height="900"></canvas>
  <canvas id="core" width="512" height="512"></canvas>
  <div id="sheen"></div>
  <div id="fog"></div>
  <div id="pool"></div>
  <canvas id="motes"></canvas>
  <div id="lyr">
    <div class="slot" id="lprev"></div>
    <div id="mark"></div>
    <div class="slot" id="lnow"></div>
    <div class="slot" id="lnext"></div>
  </div>
  <div id="empty"><div class="g">✦</div><div class="s">无 词 之 歌</div></div>
  <div id="rule"></div>
  <div id="song"></div>
  <div id="vign"></div>
  <canvas id="grain"></canvas>
</div>

<script>
(function () {
'use strict';

/* =========================================================
   0. 状态
   ========================================================= */
var W = 1440, H = 900, DPR = 1;
var reduce = false;
try {
  reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
} catch (e0) { console.error('[486] mq', e0); }

var state = {
  lines: [],
  idx: -1,
  t: 0,
  playing: true,
  frames: 0,
  js: 0,
  err: '',
  text: ''
};

var readySent = false;
var accent = [210, 169, 97];
var energy = 0;
var pulse = 0;
var liveL = 0.5;
var clock = 0;        // 自建秒表，仅用于视觉呼吸（不替代 tick）

/* =========================================================
   1. window.__stage —— 全文件唯一定义
   ========================================================= */
window.__stage = function () {
  return {
    lines: state.lines.length,
    idx: state.idx,
    t: state.t,
    playing: state.playing === undefined ? true : !!state.playing,
    frames: state.frames,
    js: state.js,
    err: state.err,
    text: state.text,
    gl: false,
    rm: !!reduce
  };
};

/* =========================================================
   2. 小工具
   ========================================================= */
function el(id) { return document.getElementById(id); }
function clamp(v, a, b) {
  v = +v;
  if (!isFinite(v)) return a;
  return v < a ? a : (v > b ? b : v);
}
function nowMs() {
  return (window.performance && performance.now) ? performance.now() : Date.now();
}

/* =========================================================
   3. 三叶结（trefoil）—— 凯尔特"无始无终"结的数学原型
   ---------------------------------------------------------
   x = sin t + 2 sin 2t
   y = cos t - 2 cos 2t
   z = sin 3t
   闭合曲线，投影在二维上恰好三处自交；用 z 判定上下，
   在交点处重绘"跨上"的一股，就得到真正编织的绳结。
   ========================================================= */
function trefoil(n, rot) {
  var pts = [], i, c = Math.cos(rot), s = Math.sin(rot);
  n = Math.max(48, Math.min(1400, n | 0));
  for (i = 0; i < n; i++) {
    var t = i / n * Math.PI * 2;
    var x = Math.sin(t) + 2 * Math.sin(2 * t);
    var y = Math.cos(t) - 2 * Math.cos(2 * t);
    pts.push({ x: x * c - y * s, y: x * s + y * c, z: Math.sin(3 * t) });
  }
  return pts;
}

function normalize(pts) {
  var m = 1e-6, i;
  for (i = 0; i < pts.length; i++) {
    var d = Math.abs(pts[i].x);
    if (d > m) m = d;
    d = Math.abs(pts[i].y);
    if (d > m) m = d;
  }
  for (i = 0; i < pts.length; i++) { pts[i].x /= m; pts[i].y /= m; }
  return pts;
}

function place(pts, cx, cy, R, squashY) {
  var i, out = [], sy = (typeof squashY === 'number') ? squashY : 1;
  for (i = 0; i < pts.length; i++) {
    out.push({ x: cx + pts[i].x * R, y: cy + pts[i].y * R * sy, z: pts[i].z });
  }
  return out;
}

/* 自交检测（建一次，不每帧跑；相同 n/rot 的历史结果会缓存） */
var CROSS_CACHE = {};
function crossingsKey(n, rot) { return n + '|' + rot.toFixed(4); }

function crossings(pts, key) {
  if (key && CROSS_CACHE[key]) return CROSS_CACHE[key];
  var n = pts.length, out = [], gap = 18;
  function hit(a, b, c, d) {
    var r1x = b.x - a.x, r1y = b.y - a.y;
    var r2x = d.x - c.x, r2y = d.y - c.y;
    var den = r1x * r2y - r1y * r2x;
    if (Math.abs(den) < 1e-9) return -1;
    var t = ((c.x - a.x) * r2y - (c.y - a.y) * r2x) / den;
    if (t < 0 || t > 1) return -1;
    var u = ((c.x - a.x) * r1y - (c.y - a.y) * r1x) / den;
    if (u < 0 || u > 1) return -1;
    return t;
  }
  var i, j;
  for (i = 0; i < n - 1; i++) {
    var ax = pts[i].x, ay = pts[i].y, bx = pts[i + 1].x, by = pts[i + 1].y;
    var minx = ax < bx ? ax : bx, maxx = ax < bx ? bx : ax;
    var miny = ay < by ? ay : by, maxy = ay < by ? by : ay;
    for (j = i + gap; j < n - 1; j++) {
      if (n - 1 - (j - i) < gap) break;
      var cx = pts[j].x, cy = pts[j].y, dx = pts[j + 1].x, dy = pts[j + 1].y;
      if (cx > maxx && dx > maxx) continue;
      if (cx < minx && dx < minx) continue;
      if (cy > maxy && dy > maxy) continue;
      if (cy < miny && dy < miny) continue;
      if (hit(pts[i], pts[i + 1], pts[j], pts[j + 1]) >= 0) {
        out.push({
          i: i, j: j,
          ox: (pts[i].x + pts[j].x) / 2,
          oy: (pts[i].y + pts[j].y) / 2,
          z: (pts[i].z + pts[i + 1].z + pts[j].z + pts[j + 1].z) / 4
        });
        if (out.length > 24) { if (key) CROSS_CACHE[key] = out; return out; }
      }
    }
  }
  if (key) CROSS_CACHE[key] = out;
  return out;
}

function pathOf(pts, from, to, closeIt) {
  var p = new Path2D();
  var a = Math.max(0, from | 0), b = Math.min(pts.length - 1, to | 0), i;
  p.moveTo(pts[a].x, pts[a].y);
  for (i = a + 1; i <= b; i++) p.lineTo(pts[i].x, pts[i].y);
  if (closeIt) p.closePath();
  return p;
}

/* 一股绳：暗影 → 深边 → 体色 → 内亮 → 高光 */
function strand(ctx, pts, from, to, lw, col, alpha, closeIt) {
  var p = pathOf(pts, from, to, closeIt);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.strokeStyle = 'rgba(3,14,9,' + (alpha * 0.75).toFixed(3) + ')';
  ctx.lineWidth = lw * 1.70;
  ctx.stroke(p);

  ctx.strokeStyle = 'rgba(5,20,13,' + (alpha * 0.95).toFixed(3) + ')';
  ctx.lineWidth = lw * 1.34;
  ctx.stroke(p);

  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col.body;
  ctx.lineWidth = lw;
  ctx.stroke(p);

  ctx.strokeStyle = col.mid;
  ctx.lineWidth = lw * 0.52;
  ctx.stroke(p);

  ctx.save();
  ctx.translate(-lw * 0.20, -lw * 0.20);
  ctx.strokeStyle = col.hi;
  ctx.lineWidth = Math.max(0.55, lw * 0.15);
  ctx.stroke(p);
  ctx.restore();

  ctx.globalAlpha = 1;
}

/* 一团结环 = 三股同心三叶结，交错旋转，带金粉 */
function weave(ctx, cx, cy, R, squashY, layers, nPts) {
  var i, k;
  for (k = 0; k < layers.length; k++) {
    var L = layers[k];
    var pts = place(normalize(trefoil(nPts, L.rot)), cx, cy, R * L.scale, squashY);
    var lw = R * L.lw;
    /* 整股（先画，交点处稍后补"跨上"） */
    strand(ctx, pts, 0, pts.length - 1, lw, L.col, L.alpha, true);

    /* 交点：z 大者在上，局部重绘 */
    var xs = crossings(pts, crossingsKey(nPts, L.rot));
    var over = [];
    for (i = 0; i < xs.length; i++) {
      var o = xs[i];
      var zi = (pts[o.i].z + pts[o.i + 1].z) / 2;
      var zj = (pts[o.j].z + pts[o.j + 1].z) / 2;
      var at = zi >= zj ? o.i : o.j;
      over.push({ at: at, z: Math.max(zi, zj) });
    }
    over.sort(function (a, b) { return a.z - b.z; });
    for (i = 0; i < over.length; i++) {
      var lo = over[i].at - 7, hi = over[i].at + 7;
      if (lo < 0) { lo = 0; hi = 14; }
      if (hi > pts.length - 1) { hi = pts.length - 1; lo = hi - 14; }
      strand(ctx, pts, lo, hi, lw, L.col, L.alpha, false);
    }
  }
}

/* =========================================================
   3c. 沿任意闭合折线编织（手抄本地毯页的矩形边框）
   ========================================================= */
function rectLoop(x0, y0, x1, y1, r, step) {
  var pts = [];
  function line(ax, ay, bx, by) {
    var len = Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
    var n = Math.max(1, Math.round(len / step)), i;
    for (i = 0; i < n; i++) {
      var t = i / n;
      pts.push({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t });
    }
  }
  function arc(cx, cy, a0, a1) {
    var len = Math.abs(a1 - a0) * r;
    var n = Math.max(1, Math.round(len / step)), i;
    for (i = 0; i < n; i++) {
      var a = a0 + (a1 - a0) * i / n;
      pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
    }
  }
  line(x0 + r, y0, x1 - r, y0);
  arc(x1 - r, y0 + r, -Math.PI / 2, 0);
  line(x1, y0 + r, x1, y1 - r);
  arc(x1 - r, y1 - r, 0, Math.PI / 2);
  line(x1 - r, y1, x0 + r, y1);
  arc(x0 + r, y1 - r, Math.PI / 2, Math.PI);
  line(x0, y1 - r, x0, y0 + r);
  arc(x0 + r, y0 + r, Math.PI, Math.PI * 1.5);
  return pts;
}

/* 给闭合折线补上法线（外法线） */
function withNormals(pts) {
  var n = pts.length, out = [], i;
  for (i = 0; i < n; i++) {
    var a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    var tx = b.x - a.x, ty = b.y - a.y;
    var L = Math.sqrt(tx * tx + ty * ty) || 1;
    /* 逆时针行走时，外法线为 (ty, -tx) */
    out.push({ x: pts[i].x, y: pts[i].y, nx: ty / L, ny: -tx / L });
  }
  return out;
}

/* 沿闭合基线做 n 股编织 */
function braidClosed(base, n, amp, lw, col, alpha, rounds) {
  var total = base.length;
  if (total < 12) return;
  var R = rounds || n;
  var k, i;
  var paths = [];
  for (k = 0; k < n; k++) {
    var ph = k * Math.PI * 2 / n;
    var pts = [];
    for (i = 0; i < total; i++) {
      var z = Math.sin(R * (i / total) * Math.PI * 2 + ph);
      pts.push({
        x: base[i].x + base[i].nx * amp * z,
        y: base[i].y + base[i].ny * amp * z,
        z: z
      });
    }
    paths.push(pts);
  }
  for (k = 0; k < n; k++) {
    var cl = paths[k].slice();
    cl.push(paths[k][0]);
    strand(ctxRef, cl, 0, cl.length - 1, lw, col, alpha, true);
  }
  /* 相邻两股的上穿点 → 补一段"跨上" */
  var half = 7;
  for (k = 0; k < n; k++) {
    var nb = (k + 1) % n;
    for (i = 0; i < total; i++) {
      var i2 = (i + 1) % total;
      var d0 = paths[k][i].z - paths[nb][i].z;
      var d1 = paths[k][i2].z - paths[nb][i2].z;
      if (!(d0 < 0 && d1 >= 0)) continue;
      var seg = [], m;
      for (m = -half; m <= half; m++) {
        seg.push(paths[k][(i + m + total * 2) % total]);
      }
      strand(ctxRef, seg, 0, seg.length - 1, lw, col, alpha, false);
    }
  }
}
var ctxRef = null;

/* =========================================================
   3b. 环形编织（凯尔特边框 / 圆章外环）
   ---------------------------------------------------------
   n 股绳沿圆周做正弦上下，相邻两股相位差 2π/n：
   每股"上去"的地方，邻居正好"下来"，于是每股交替跨过/被
   压过邻居 —— 这就是真正的凯尔特圆形编织，而非放射线装饰。
   ========================================================= */
function ringBraided(ctx, cx, cy, rad, n, amp, lw, col, alpha) {
  var i, k;
  var total = clamp(Math.round(Math.PI * 2 * rad / 5), 60, 280);
  var paths = [];
  for (k = 0; k < n; k++) {
    var pts = [];
    for (i = 0; i <= total; i++) {
      var th = i / total * Math.PI * 2;
      var z = Math.sin(n * th + k * Math.PI * 2 / n);
      var r = rad + z * amp;
      pts.push({ x: cx + Math.cos(th) * r, y: cy + Math.sin(th) * r, z: z });
    }
    paths.push(pts);
  }
  /* 先画全部股 */
  for (k = 0; k < n; k++) {
    strand(ctx, paths[k], 0, paths[k].length - 1, lw, col, alpha, true);
  }
  /* 只在"相邻两股换位"的瞬间补一块跨上段落，数量 O(n²) 有限 */
  var half = 6;
  for (k = 0; k < n; k++) {
    var nb = (k + 1) % n;
    for (i = 0; i < total; i++) {
      var d0 = paths[k][i].z - paths[nb][i].z;
      var d1 = paths[k][i + 1].z - paths[nb][i + 1].z;
      if (!(d0 < 0 && d1 >= 0)) continue;      /* 只在上穿发生处补一次 */
      var seg = [], m;
      for (m = -half; m <= half; m++) {
        var ix = i + m;
        if (ix < 0) ix += total;
        if (ix > total) ix -= total;
        seg.push(paths[k][ix]);
      }
      strand(ctx, seg, 0, seg.length - 1, lw, col, alpha, false);
    }
  }
}


/* =========================================================
   4. 离屏预渲染（只做一次，或窗口变化时）
   ========================================================= */
var bandCv = el('band'), bandCtx = bandCv.getContext('2d');
var coreCv = el('core'), coreCtx = coreCv.getContext('2d');
var bandBuilt = false, coreBuilt = false;
var bandW = 0, bandH = 0;

var GOLD = { body: '#c9a25e', mid: '#e6c884', hi: '#fbf0cf' };
var MOSS = { body: '#4e8a63', mid: '#7dbd93', hi: '#dff0d4' };
var JADE = { body: '#2e6448', mid: '#4d8f68', hi: '#a9d7b6' };

/* 用 accent 调主股金：保持明度，取封面色相 → 暗金变为"封面色调的金属" */
function tuneGold(a) {
  if (!a) return GOLD;
  var m = (a[0] + a[1] + a[2]) / 3;
  var k = 0.42;                       /* 往金色靠，但不丢封面调 */
  var mix = function (c, g) { return Math.round(c * k + g * (1 - k)); };
  var r = mix(a[0], 201), g = mix(a[1], 162), b = mix(a[2], 94);
  /* 提亮做主色 */
  var up = function (v, add) { return Math.max(0, Math.min(255, Math.round(v + add))); };
  return {
    body: 'rgb(' + r + ',' + g + ',' + b + ')',
    mid: 'rgb(' + up(r, 38) + ',' + up(g, 34) + ',' + up(b, 30) + ')',
    hi: 'rgb(' + up(r, 78) + ',' + up(g, 72) + ',' + up(b, 58) + ')'
  };
}
var GOLD_LIVE = GOLD;

/* =========================================================
   4a. 荒原：远山脊线 + 海雾 + 雾中石十字
   ========================================================= */
function paintMoor(ctx, w, h, minS) {
  var i, k;
  var horizon = h * 0.685;

  /* 三层山脊，由远及近变暗，营造北大西洋海雾里的层叠感 */
  var ridges = [
    { base: horizon - h * 0.030, amp: h * 0.030, f1: 1.7, f2: 4.3, col0: 'rgba(58,104,78,.62)', col1: 'rgba(34,72,52,.70)' },
    { base: horizon + h * 0.014, amp: h * 0.038, f1: 1.2, f2: 3.1, col0: 'rgba(28,62,45,.86)', col1: 'rgba(16,42,30,.92)' },
    { base: horizon + h * 0.090, amp: h * 0.046, f1: 0.9, f2: 2.4, col0: 'rgba(12,34,24,.96)', col1: 'rgba(5,18,13,1)' }
  ];
  for (k = 0; k < ridges.length; k++) {
    var rg = ridges[k];
    var g = ctx.createLinearGradient(0, rg.base - rg.amp, 0, h);
    g.addColorStop(0, rg.col0);
    g.addColorStop(1, rg.col1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-2, h + 2);
    var steps = 96;
    for (i = 0; i <= steps; i++) {
      var x = i / steps * (w + 4) - 2;
      var u = i / steps;
      var y = rg.base
        - Math.sin(u * Math.PI * rg.f1 + k * 2.1) * rg.amp
        - Math.sin(u * Math.PI * rg.f2 + k * 4.7) * rg.amp * 0.42
        - Math.sin(u * Math.PI * (rg.f2 * 2.3) + k) * rg.amp * 0.14;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w + 2, h + 2);
    ctx.closePath();
    ctx.fill();
  }

  /* 雾带：压在山脊之间，把远景洗淡 */
  var fog = ctx.createLinearGradient(0, horizon - h * 0.10, 0, horizon + h * 0.16);
  fog.addColorStop(0, 'rgba(214,236,220,0)');
  fog.addColorStop(0.38, 'rgba(214,236,220,.20)');
  fog.addColorStop(0.62, 'rgba(196,226,208,.13)');
  fog.addColorStop(1, 'rgba(196,226,208,0)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, horizon - h * 0.10, w, h * 0.26);

  /* 雾中石十字：两根细长的暗影，顶端带环 */
  function cross(cx2, baseY, ch2, wd) {
    var shaftW = wd, armW = wd * 0.86;
    var topY = baseY - ch2;
    var armY = topY + ch2 * 0.26;
    ctx.fillStyle = 'rgba(5,18,13,.88)';
    ctx.fillRect(cx2 - shaftW / 2, armY, shaftW, ch2 * 0.74);
    ctx.fillRect(cx2 - ch2 * 0.17, armY - armW / 2, ch2 * 0.34, armW);
    /* 环头 */
    ctx.beginPath();
    ctx.arc(cx2, armY, ch2 * 0.155, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1.2, wd * 0.85);
    ctx.strokeStyle = 'rgba(5,18,13,.88)';
    ctx.stroke();
    /* 雾中的一点点边光 */
    ctx.strokeStyle = 'rgba(190,220,196,.16)';
    ctx.lineWidth = Math.max(0.6, wd * 0.28);
    ctx.beginPath();
    ctx.moveTo(cx2 - shaftW / 2, armY);
    ctx.lineTo(cx2 - shaftW / 2, baseY);
    ctx.stroke();
  }
  var cw2 = Math.max(2, minS * 0.0055);
  cross(w * 0.175, horizon + h * 0.135, h * 0.135, cw2);
  cross(w * 0.803, horizon + h * 0.100, h * 0.108, cw2 * 0.86);

  /* 近景泥炭地面：底部一层几乎全黑的暖绿 */
  var ground = ctx.createLinearGradient(0, h * 0.80, 0, h);
  ground.addColorStop(0, 'rgba(4,16,11,0)');
  ground.addColorStop(1, 'rgba(3,12,8,.96)');
  ctx.fillStyle = ground;
  ctx.fillRect(0, h * 0.80, w, h * 0.20);
}

/* =========================================================
   4b. 角饰：braided triquetra 圆章
   ========================================================= */
function medallion(ctx, cx, cy, R, lw, colMain, alpha) {
  var i;
  /* 双细环 */
  for (i = 0; i < 2; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, R * (1.06 - i * 0.11), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(6,22,16,.85)';
    ctx.lineWidth = Math.max(1.4, lw * 2.4);
    ctx.stroke();
    ctx.strokeStyle = colMain.body;
    ctx.globalAlpha = alpha * (0.9 - i * 0.25);
    ctx.lineWidth = lw * (0.9 - i * 0.3);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* 中央三叶结（带真实压叠） */
  weave(ctx, cx, cy, R * 0.72, 1, [
    { rot: Math.PI / 2, scale: 1, lw: lw * 0.42 / (R * 0.72), alpha: alpha, col: colMain }
  ], 260);
}

/* ---------------------------------------------------------
   分帧建构：把六道工序摊到连续若干帧里，每帧只做一步。
   165Hz 下也绝不会出现一次卡死的长帧。
   --------------------------------------------------------- */
var BAND_STEPS = null;
var bandStepIdx = 0;
var bandGeom = null;

function bandPlan() {
  var minS = Math.min(W, H);
  bandPlan.minS = minS;
  bandPlan.R = minS * 0.365;
  bandPlan.cx = W * 0.5;
  bandPlan.cy = H * 0.455;
  return [
    paintBloom, paintMoorStep, paintRectOuter, paintRectInner,
    paintKnotFar, paintKnotMid, paintKnotMain,
    paintMedallions, paintGoldDust, paintPeatCore
  ];
}

function bandBegin() {
  var px = clamp(Math.round(W * DPR), 320, 2600);
  var py = clamp(Math.round(H * DPR), 320, 2600);
  bandW = px; bandH = py;
  try {
    bandCv.width = px; bandCv.height = py;
  } catch (eG) { console.error('[486] bandSize', eG); }
  bandCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bandCtx.clearRect(0, 0, W, H);
  BAND_STEPS = bandPlan();
  bandStepIdx = 0;
  bandBuilt = false;
}

/* 1) 金色雾晕：filter 只在这里用一次 */
function paintBloom() {
  var minS = bandPlan.minS, R = bandPlan.R;
  var cx = bandPlan.cx, cy = bandPlan.cy;
  try {
    if (typeof bandCtx.filter === 'string') {
      bandCtx.filter = 'blur(' + (minS * 0.030).toFixed(1) + 'px)';
      bandCtx.strokeStyle = 'rgba(196,158,96,.30)';
      bandCtx.lineWidth = R * 0.13;
      var bp = place(normalize(trefoil(320, 0)), cx, cy, R, 1);
      bandCtx.stroke(pathOf(bp, 0, bp.length - 1, true));
      bandCtx.filter = 'none';
    }
  } catch (eF) { console.error('[486] bloom', eF); }
}

/* 2) 荒原 */
function paintMoorStep() {
  paintMoor(bandCtx, W, H, bandPlan.minS);
}

/* 3) 矩形编织边框：内外两道分开做，避免单帧过长 */
function paintRectOuter() {
  var minS = bandPlan.minS;
  ctxRef = bandCtx;
  try {
    var inset = Math.max(13, minS * 0.028);
    var baseRect = withNormals(rectLoop(inset, inset, W - inset, H - inset,
      Math.min(inset * 1.4, minS * 0.05), Math.max(6, minS * 0.016)));
    braidClosed(baseRect, 3, minS * 0.0072, minS * 0.0026, JADE, 0.40, 34);
  } catch (eR) { console.error('[486] rectBraid', eR); }
}

function paintRectInner() {
  var minS = bandPlan.minS;
  ctxRef = bandCtx;
  try {
    var inset2 = Math.max(13, minS * 0.028) + minS * 0.020;
    var baseRect2 = withNormals(rectLoop(inset2, inset2, W - inset2, H - inset2,
      Math.min(inset2 * 1.3, minS * 0.05), Math.max(6, minS * 0.016)));
    braidClosed(baseRect2, 2, minS * 0.0040, minS * 0.0017, GOLD_LIVE, 0.26, 30);
  } catch (eR) { console.error('[486] rectBraid2', eR); }
}

/* 4~6) 三圈三叶结，一圈一步 */
function paintKnotFar() {
  weave(bandCtx, bandPlan.cx, bandPlan.cy, bandPlan.R, 1, [
    { rot: -0.62, scale: 1.46, lw: 0.0062, alpha: 0.15, col: JADE }
  ], 300);
}
function paintKnotMid() {
  weave(bandCtx, bandPlan.cx, bandPlan.cy, bandPlan.R, 1, [
    { rot: 0.92, scale: 0.900, lw: 0.0090, alpha: 0.26, col: MOSS }
  ], 380);
}
function paintKnotMain() {
  weave(bandCtx, bandPlan.cx, bandPlan.cy, bandPlan.R, 1, [
    { rot: 0.00, scale: 1.240, lw: 0.0190, alpha: 0.74, col: GOLD_LIVE }
  ], 460);
}

/* 7) 四角圆章 */
function paintMedallions() {
  var minS = bandPlan.minS;
  try {
    var mr = Math.max(22, minS * 0.062);
    var mx = Math.max(20, minS * 0.055) + mr;
    var lw = Math.max(1.6, minS * 0.0055);
    medallion(bandCtx, mx, mx, mr, lw, GOLD_LIVE, 0.70);
    medallion(bandCtx, W - mx, mx, mr, lw, GOLD_LIVE, 0.70);
    medallion(bandCtx, mx, H - mx, mr, lw, GOLD_LIVE, 0.62);
    medallion(bandCtx, W - mx, H - mx, mr, lw, GOLD_LIVE, 0.62);
  } catch (eM2) { console.error('[486] medallions', eM2); }
}

/* 8) 金粉 */
function paintGoldDust() {
  var minS = bandPlan.minS, R = bandPlan.R;
  var cx = bandPlan.cx, cy = bandPlan.cy;
  var seed = 48613, i, rnd = function () {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  };
  bandCtx.globalCompositeOperation = 'lighter';
  for (i = 0; i < 240; i++) {
    var ang = rnd() * Math.PI * 2;
    var rr = R * (0.62 + rnd() * 0.86);
    var pxx = cx + Math.cos(ang) * rr;
    var pyy = cy + Math.sin(ang) * rr * 0.98;
    if (pxx < -20 || pxx > W + 20 || pyy < -20 || pyy > H + 20) continue;
    var sz = 0.3 + rnd() * 1.5;
    bandCtx.fillStyle = 'rgba(244,212,142,' + (rnd() * 0.32).toFixed(3) + ')';
    bandCtx.beginPath();
    bandCtx.arc(pxx, pyy, sz, 0, Math.PI * 2);
    bandCtx.fill();
  }
  bandCtx.globalCompositeOperation = 'source-over';
  if (minS <= 0) { /* 防零尺寸 */ }
}

/* 9) 中央泥炭色：把字区压暗（暗绿，不是乳白柔光） */
function paintPeatCore() {
  var cx = bandPlan.cx, cy = bandPlan.cy;
  var holeR = Math.min(W * 0.330, H * 0.370);
  var hole = bandCtx.createRadialGradient(cx, cy, holeR * 0.12, cx, cy, holeR);
  hole.addColorStop(0, 'rgba(3,16,10,.90)');
  hole.addColorStop(0.46, 'rgba(3,16,10,.875)');
  hole.addColorStop(0.68, 'rgba(3,16,10,.62)');
  hole.addColorStop(0.86, 'rgba(3,16,10,.22)');
  hole.addColorStop(1, 'rgba(3,16,10,0)');
  bandCtx.fillStyle = hole;
  bandCtx.beginPath();
  bandCtx.arc(cx, cy, holeR, 0, Math.PI * 2);
  bandCtx.fill();
}

/* 每帧推进一步；全部完成才点亮画布 */
function buildBand() {
  try {
    if (!BAND_STEPS) bandBegin();
    if (bandStepIdx < BAND_STEPS.length) {
      /* 建构中画布保持半透明，避免露出"半成品" */
      bandCv.classList.remove('on');
      BAND_STEPS[bandStepIdx]();
      bandStepIdx++;
      if (bandStepIdx >= BAND_STEPS.length) {
        bandBuilt = true;
        bandCv.classList.add('on');
      }
    } else {
      bandBuilt = true;
      bandCv.classList.add('on');
    }
  } catch (e) {
    state.err = 'band:' + (e && e.message ? e.message : e);
    console.error('[486] buildBand', e);
    bandBuilt = true;          /* 出错也别卡在建构态 */
    BAND_STEPS = null;
    bandCv.classList.add('on');
  }
}

/* 窗口/配色变化后重置，下一帧重新分步建构 */
function buildBandAll() {
  BAND_STEPS = null;
  bandStepIdx = 0;
  bandBuilt = false;
  bandCv.classList.remove('on');
}

function buildCore() {
  try {
    var S = 512;
    coreCv.width = S; coreCv.height = S;
    var c = coreCtx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, S, S);
    c.translate(S / 2, S / 2);
    var k = S / 512;

    /* 圆章外环：细双线 + 刻度点，像福音书页边的边框 */
    var rings = [
      [244, 1.1, 0.44],
      [236, 0.7, 0.26],
      [206, 0.8, 0.30]
    ], i;
    for (i = 0; i < rings.length; i++) {
      c.beginPath();
      c.arc(0, 0, rings[i][0] * k, 0, Math.PI * 2);
      c.strokeStyle = 'rgba(' + accent.join(',') + ',' + rings[i][2] + ')';
      c.lineWidth = rings[i][1] * k;
      c.stroke();
    }
    for (i = 0; i < 96; i++) {
      var a = i * Math.PI * 2 / 96;
      var big = (i % 8 === 0) ? 1 : 0;
      var r1 = (big ? 226 : 232) * k;
      var r2 = (big ? 244 : 238) * k;
      c.beginPath();
      c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      c.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      c.strokeStyle = 'rgba(' + accent.join(',') + ',' + (big ? .46 : .17) + ')';
      c.lineWidth = (big ? 1.2 : 0.6) * k;
      c.stroke();
    }
    /* 中带：环形编织（真正的三股交替压叠） */
    ringBraided(c, 0, 0, 214 * k, 5, 11 * k, 4.2 * k, GOLD_LIVE, 0.50);
    ringBraided(c, 0, 0, 189 * k, 3, 8 * k, 2.4 * k, MOSS, 0.34);

    /* 内芯：一枚小三叶结 */
    var tp = place(normalize(trefoil(300, Math.PI / 2)), 0, 0, 74 * k, 1);
    var lw = 4.2 * k;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(6,22,15,.85)';
    c.lineWidth = lw * 1.9;
    c.stroke(pathOf(tp, 0, tp.length - 1, true));
    c.strokeStyle = GOLD_LIVE.body;
    c.lineWidth = lw;
    c.stroke(pathOf(tp, 0, tp.length - 1, true));
    c.strokeStyle = GOLD_LIVE.hi;
    c.lineWidth = Math.max(0.6, lw * 0.24);
    c.stroke(pathOf(tp, 0, tp.length - 1, true));

    coreBuilt = true;
    coreCv.classList.add('on');
  } catch (e) {
    state.err = 'core:' + (e && e.message ? e.message : e);
    console.error('[486] buildCore', e);
  }
}

/* 颗粒：一次性静态噪点 */
function buildGrain() {
  try {
    var gv = el('grain');
    var gw = 180, gh = 180;
    gv.width = gw; gv.height = gh;
    var gx = gv.getContext('2d');
    var img = gx.createImageData(gw, gh);
    var data = img.data, seed = 97, i;
    for (i = 0; i < data.length; i += 4) {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      var v = (seed / 0x7fffffff) * 255;
      data[i] = v; data[i + 1] = v; data[i + 2] = v * 0.88; data[i + 3] = 255;
    }
    gx.putImageData(img, 0, 0);
  } catch (e) {
    console.error('[486] grain', e);
  }
}

/* =========================================================
   5. 金尘（每帧小幅重绘，量很小）
   ========================================================= */
var moteCv = el('motes'), moteCtx = moteCv.getContext('2d');
var MOTES = [], sprite = null, moteW = 1, moteH = 1;

function makeSprite() {
  var s = 64;
  var c = document.createElement('canvas');
  c.width = s; c.height = s;
  var g = c.getContext('2d');
  var rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0, 'rgba(255,242,206,1)');
  rg.addColorStop(0.32, 'rgba(255,222,152,.52)');
  rg.addColorStop(1, 'rgba(255,206,128,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, s, s);
  return c;
}

function buildMotes() {
  try {
    if (!sprite) sprite = makeSprite();
    moteW = Math.max(120, Math.round(W / 2));
    moteH = Math.max(80, Math.round(H / 2));
    moteCv.width = moteW;
    moteCv.height = moteH;
    MOTES = [];
    var seed = 2026486, i, rnd = function () {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    };
    var n = Math.min(38, Math.max(14, Math.round(moteW * moteH / 9000)));
    for (i = 0; i < n; i++) {
      MOTES.push({
        x: rnd(), y: rnd(),
        sp: 0.006 + rnd() * 0.020,
        amp: 0.004 + rnd() * 0.020,
        w: 0.35 + rnd() * 0.85,
        ph: rnd() * 6.2832,
        a: 0.16 + rnd() * 0.52,
        r: 0.7 + rnd() * 2.4
      });
    }
  } catch (e) {
    console.error('[486] motes', e);
  }
}

function drawMotes() {
  if (!moteCtx || !sprite || !MOTES.length) return;
  moteCtx.clearRect(0, 0, moteW, moteH);
  var i, m;
  for (i = 0; i < MOTES.length; i++) {
    m = MOTES[i];
    var y = ((m.y - clock * m.sp) % 1 + 1) % 1;
    var x = m.x + Math.sin(clock * m.w + m.ph) * m.amp;
    var px = x * moteW;
    var py = y * moteH;
    if (px < -6 || px > moteW + 6) continue;
    var tw = 0.55 + 0.45 * Math.sin(clock * 0.9 + m.ph * 2.3);
    moteCtx.globalAlpha = Math.max(0, m.a * tw);
    var r = m.r * 3.2;
    moteCtx.drawImage(sprite, px - r, py - r, r * 2, r * 2);
  }
  moteCtx.globalAlpha = 1;
}

/* =========================================================
   6. 歌词模型
   ========================================================= */
var lPrev = el('lprev'), lNow = el('lnow'), lNext = el('lnext'), lMark = el('mark');
var charEls = [];
var curIdx = -2;
var lineT0 = 0;
var lineDur = 3.2;
var curChars = null;      // [{t}] 或 null
var curLen = 0;
var litNow = -1;

function cpsOf(s) {
  var out = [], i;
  if (typeof Array.from === 'function') {
    var a = Array.from(s);
    for (i = 0; i < a.length; i++) out.push(a[i]);
    return out;
  }
  for (i = 0; i < s.length; i++) out.push(s.charAt(i));
  return out;
}

function sizeClass(n) {
  if (n <= 16) return '';
  if (n <= 26) return 's1';
  if (n <= 44) return 's2';
  return 's3';
}

/* 找到 idx 之前 / 之后第一条有字面的行 */
function prevText(idx) {
  var ls = state.lines, i;
  for (i = idx - 1; i >= 0; i--) {
    if (ls[i] && hasInk(ls[i].text)) return ls[i].text;
  }
  return '';
}
function nextText(idx) {
  var ls = state.lines, i;
  for (i = idx + 1; i < ls.length; i++) {
    if (ls[i] && hasInk(ls[i].text)) return ls[i].text;
  }
  return '';
}

function renderIdx(idx) {
  var ls = state.lines;
  var cur = (idx >= 0 && ls[idx]) ? ls[idx] : null;

  /* 上下句：跳过空行 */
  var pv = idx > 0 ? prevText(idx) : '';
  lPrev.textContent = pv || '';
  lPrev.style.opacity = pv ? '1' : '0';

  var nx = nextText(idx);
  lNext.textContent = nx || '';
  lNext.style.opacity = nx ? '1' : '0';

  /* 当前句 */
  lNow.textContent = '';
  lNow.className = 'slot';
  charEls = [];
  curChars = null;
  curLen = 0;
  litNow = -1;

  if (!cur || !cur.text) {
    lMark.style.opacity = '0.25';
    lineT0 = 0; lineDur = 3.2;
    return;
  }
  lMark.style.opacity = '0.55';
  lineT0 = cur.t;
  lineDur = cur.dur > 0 ? cur.dur : 3.2;

  var cps = cpsOf(cur.text);
  curLen = cps.length;
  lNow.className = 'slot ' + sizeClass(curLen);

  /* 逐字时间表 */
  var d = cur.dur > 0 ? cur.dur : lineDur;
  var i;
  if (cur.chars && cur.chars.length === curLen) {
    var arr = [], ok = true;
    for (i = 0; i < curLen; i++) {
      var ct = cur.chars[i] && cur.chars[i].t;
      if (typeof ct !== 'number' || !isFinite(ct)) { ok = false; break; }
      if (i && ct < arr[i - 1] - 0.0001) { ok = false; break; }
      arr.push(ct);
    }
    if (ok) curChars = arr;
  }
  if (!curChars) {
    var eq = [];
    for (i = 0; i < curLen; i++) eq.push(cur.t + d * (i / Math.max(1, curLen)));
    curChars = eq;
  }

  /* 建 span（限长，避免超长句炸性能） */
  var frag = document.createDocumentFragment();
  var limit = Math.min(curLen, 160);
  for (i = 0; i < limit; i++) {
    var ch = cps[i];
    if (ch === '\n') { frag.appendChild(document.createElement('br')); continue; }
    var sp = document.createElement('span');
    sp.className = 'ch';
    sp.textContent = ch;
    if (ch === ' ') sp.style.width = '0.34em';
    frag.appendChild(sp);
    charEls.push(sp);
  }
  if (curLen > limit) frag.appendChild(document.createTextNode(cur.text.slice(limit)));
  lNow.appendChild(frag);
}

function paintLine(t) {
  if (!charEls.length || !curChars) return;
  var k = -1, i;
  for (i = 0; i < charEls.length; i++) {
    if (t >= curChars[i] - 0.001) k = i; else break;
  }
  if (k === litNow) return;
  /* 增量更新：只动变化的那几个 */
  var from = Math.min(litNow < 0 ? 0 : litNow, k < 0 ? 0 : k);
  if (k > litNow) {
    if (litNow >= 0 && charEls[litNow]) charEls[litNow].className = 'ch lit';
    for (i = litNow + 1; i <= k; i++) {
      if (charEls[i]) charEls[i].className = (i === k ? 'ch nowc' : 'ch lit');
    }
  } else if (k < litNow) {
    for (i = Math.max(0, k); i <= litNow; i++) {
      if (charEls[i]) charEls[i].className = (i === k ? 'ch nowc' : 'ch');
    }
  }
  if (k < 0 && litNow >= 0 && charEls[litNow]) charEls[litNow].className = 'ch';
  litNow = k;
  /* 未用变量规避抖动的占位 */
  if (from < -1) from = -1;
}

/* 有可见字面的行才参与"当前句" */function hasInk(txt) {
  if (txt == null) return false;
  var s = String(txt);
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c > 32) return true;
  }
  return false;
}

function idxAt(t) {
  var ls = state.lines, lo = -1, i;
  for (i = 0; i < ls.length; i++) {
    if (ls[i].t > t + 0.0005) break;
    if (hasInk(ls[i].text)) lo = i;
  }
  return lo;
}

/* =========================================================
   7. 尺寸
   ========================================================= */
var CROWD = 1;
var portrait = false;

function resize() {
  var w = window.innerWidth || 0;
  var h = window.innerHeight || 0;
  if (!isFinite(w) || w < 1) w = 1440;
  if (!isFinite(h) || h < 1) h = 900;
  W = Math.max(280, Math.round(w));
  H = Math.max(240, Math.round(h));
  DPR = clamp(Math.min(2, window.devicePixelRatio || 1), 1, 2);
  portrait = H > W * 1.12;
  bandBuilt = false;
  BAND_STEPS = null;          /* 尺寸变了 → 下一帧重新分步建构 */
  bandStepIdx = 0;
  curIdx = -2;
  buildMotes();
}

/* =========================================================
   8. 主循环
   ========================================================= */
var fogEl = el('fog'), glowEl = el('glow'), sheenEl = el('sheen');
var bandEl = el('band'), coreEl = el('core');
var lastTs = 0;

function frame(ts) {
  var t0 = nowMs();
  state.frames++;

  /* ready：第一个 rAF 无条件发出 */
  if (!readySent) {
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (eR) { console.error('[486] ready', eR); }
  }

  var dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016;
  lastTs = ts;
  clock += dt;

  /* 重活拆帧：先把 ready 甩出去，再建构 */
  if (!bandBuilt) buildBand();
  if (!coreBuilt) buildCore();

  try {
    var idx = idxAt(state.t);
    if (idx !== curIdx) {
      curIdx = idx;
      state.idx = idx;
      renderIdx(idx);
      paintLine(state.t);
    } else if (idx !== state.idx) {
      state.idx = idx;
    }

    var ls = state.lines;
    var row = (idx >= 0) ? ls[idx] : null;
    state.text = (row && row.text != null) ? String(row.text) : '';

    if (row) {
      var end = (row.dur > 0) ? row.t + row.dur
              : (ls[idx + 1] ? ls[idx + 1].t : row.t + 3.2);
      energy = clamp((state.t - row.t) / Math.max(0.25, end - row.t), 0, 1);
    } else {
      energy = 0;
    }

    if (idx >= 0) paintLine(state.t);

    pulse *= Math.pow(0.12, dt);
    var breathe = 0.5 + 0.5 * Math.sin(clock * 0.62);
    var amp = reduce
      ? (0.30 + 0.06 * breathe)
      : (0.26 + 0.22 * breathe + 0.26 * pulse + 0.14 * liveL);

    /* 雾 */
    if (fogEl) {
      var fx = Math.sin(clock * 0.071) * 2.4 + Math.sin(clock * 0.019) * 1.7;
      var fy = Math.cos(clock * 0.053) * 1.7;
      var fs = 1.02 + 0.030 * breathe + 0.040 * pulse;
      fogEl.style.transform = 'translate3d(' + fx.toFixed(2) + '%,' + fy.toFixed(2) + '%,0) scale(' + fs.toFixed(3) + ')';
      fogEl.style.opacity = (0.50 + 0.18 * breathe + 0.10 * energy).toFixed(3);
    }
    if (glowEl) glowEl.style.opacity = (0.62 + 0.22 * energy + 0.10 * pulse).toFixed(3);

    /* 扫光：缓慢横移，让静态截图之间也看得出差异 */
    if (sheenEl && !reduce) {
      var sx = Math.sin(clock * 0.175) * 16;
      var sr = -16 + Math.sin(clock * 0.093) * 4;
      sheenEl.style.transform = 'translate3d(' + sx.toFixed(2) + '%,0,0) rotate(' + sr.toFixed(2) + 'deg)';
    }

    /* 结环：只做正向缩放（<1 会露出画布边缘），旋转交给中心圆章 */
    if (bandEl && bandBuilt) {
      var bsc = 1 + amp * 0.018;
      bandEl.style.transform = 'translate(-50%,-50%) scale(' + bsc.toFixed(4) + ')';
      bandEl.style.opacity = (0.56 + 0.34 * energy + 0.10 * pulse).toFixed(3);
    }
    if (coreEl && coreBuilt) {
      var crot = reduce ? 0 : clock * 1.6;
      coreEl.style.transform =
        'translate(-50%,-50%) rotate(' + crot.toFixed(2) + 'deg) scale(' + (1 + amp * 0.045).toFixed(3) + ')';
      /* 圆章压到很淡：它是"背景里的手抄本圆章"，字必须永远最亮 */
      coreEl.style.opacity = (0.13 + 0.13 * energy + 0.06 * pulse).toFixed(3);
    }

    /* 当前句入场：按"句子已播时长"推进，暂停/拖动都不会闪回 */
    if (idx >= 0 && lNow && row) {
      var since = Math.max(0, state.t - row.t);
      var fadeSpan = Math.min(0.30, Math.max(0.12, (row.dur || 3) * 0.18));
      var p = clamp(since / fadeSpan, 0, 1);
      var ease = 1 - Math.pow(1 - p, 3);
      /* 一旦整句播过 40%，视为已完全入场（即使 tick 抖动也不会回退） */
      if (since > (row.dur || 3) * 0.4) ease = 1;
      lNow.style.opacity = (0.92 + 0.08 * ease).toFixed(3);
      lNow.style.transform = 'translateY(' + ((1 - ease) * 9).toFixed(2) + 'px)';
      lNow.style.filter = (reduce || ease >= 1) ? 'none'
        : 'blur(' + ((1 - ease) * 2.4).toFixed(2) + 'px)';
    } else if (lNow) {
      lNow.style.opacity = '0';
      lNow.style.transform = 'translateY(8px)';
      lNow.style.filter = 'none';
    }

    drawMotes();
  } catch (e) {
    state.err = 'frame:' + (e && e.message ? e.message : e);
    console.error('[486] frame', e);
  }

  state.js = clamp(nowMs() - t0, 0, 999);
  requestAnimationFrame(frame);
}

/* =========================================================
   9. 协议
   ========================================================= */
function setAccent(rgb) {
  if (!rgb || typeof rgb.length !== 'number' || rgb.length < 3) return;
  var r = Math.round(clamp(rgb[0], 0, 255));
  var g = Math.round(clamp(rgb[1], 0, 255));
  var b = Math.round(clamp(rgb[2], 0, 255));
  accent = [r, g, b];
  try {
    document.documentElement.style.setProperty('--gold', 'rgb(' + r + ',' + g + ',' + b + ')');
    GOLD_LIVE = tuneGold(accent);
    /* 主股变为封面调 → 结环必须重建（分帧，不阻塞） */
    BAND_STEPS = null;
    bandStepIdx = 0;
    bandBuilt = false;
  } catch (eA) { console.error('[486] accent', eA); }
}

function applyInit(p) {
  try {
    p = p || {};
    setAccent(p.accent);

    var song = p.song || {};
    var nm = (song.name == null ? '' : String(song.name)).replace(/\s+/g, ' ').trim();
    var ar = '';
    if (Array.isArray(song.artists)) {
      var tmp = [];
      for (var a = 0; a < song.artists.length && tmp.length < 6; a++) {
        if (song.artists[a]) tmp.push(String(song.artists[a]));
      }
      ar = tmp.join(' / ');
    } else if (song.artists != null) {
      ar = String(song.artists);
    }
    ar = ar.replace(/\s+/g, ' ').trim();
    var title = (nm && ar) ? (nm + '   ·   ' + ar) : (nm || ar);
    var sEl = el('song');
    if (sEl) {
      sEl.textContent = title;
      sEl.title = title;
      sEl.classList.toggle('on', !!title);
    }

    /* 行模型 */
    var src = Array.isArray(p.lines) ? p.lines : [];
    var n = Math.min(src.length, 500);
    var model = [], i;
    for (i = 0; i < n; i++) {
      var raw = src[i] || {};
      var txt = (raw.text == null) ? '' : String(raw.text);
      var t = (typeof raw.t === 'number' && isFinite(raw.t)) ? raw.t : 0;
      model.push({
        t: t,
        dur: (typeof raw.dur === 'number' && isFinite(raw.dur) && raw.dur > 0) ? raw.dur : 0,
        text: txt,
        chars: Array.isArray(raw.chars) ? raw.chars : null
      });
    }
    model.sort(function (x, y) { return x.t - y.t; });

    /* 补齐缺失 dur：用下一句起点推算 */
    for (i = 0; i < model.length; i++) {
      if (model[i].dur > 0) continue;
      var nx = model[i + 1] ? model[i + 1].t : 0;
      var guess = nx > model[i].t ? (nx - model[i].t) : 0;
      model[i].dur = guess > 0.2 ? Math.min(guess, 12) : 3.4;
    }

    state.lines = model;
    state.idx = -2;
    state.err = '';
    curIdx = -2;
    renderIdx(-2);

    var hasText = false;
    for (i = 0; i < model.length; i++) {
      if (model[i].text && model[i].text.trim()) { hasText = true; break; }
    }
    var em = el('empty');
    if (em) em.classList.toggle('p', !hasText);
    var ly = el('lyr');
    if (ly) ly.style.display = hasText ? 'flex' : 'none';

    curIdx = -2;
    state.idx = idxAt(state.t);
    renderIdx(state.idx);
    paintLine(state.t);
  } catch (e) {
    state.err = 'init:' + (e && e.message ? e.message : e);
    console.error('[486] init', e);
  }
}

window.addEventListener('message', function (ev) {
  var d = ev && ev.data;
  if (!d || typeof d !== 'object' || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') {
      applyInit(d.payload);
    } else if (d.type === 'tick') {
      var p = d.payload || {};
      if (typeof p.time === 'number' && isFinite(p.time)) {
        state.t = Math.max(0, p.time);
      }
      if (typeof p.playing === 'boolean') state.playing = p.playing;
    } else if (d.type === 'beat') {
      var q = d.payload || {};
      var lv = (typeof q.level === 'number' && isFinite(q.level)) ? clamp(q.level, 0, 1) : 0.6;
      pulse = Math.min(1.25, pulse + 0.24 + lv * 0.52);
    } else if (d.type === 'live') {
      var v = d.payload || {};
      if (typeof v.level === 'number' && isFinite(v.level)) liveL = clamp(v.level, 0, 1);
      if (v.playing === false) liveL *= 0.65;
    }
  } catch (eM) {
    state.err = 'msg:' + (eM && eM.message ? eM.message : eM);
    console.error('[486] message', eM);
  }
}, false);

window.addEventListener('resize', function () {
  try { resize(); } catch (e) { console.error('[486] onresize', e); }
}, { passive: true });

/* =========================================================
   10. 启动
   ========================================================= */
try {
  resize();              /* 此时 bandBuilt / MOTES / 各 DOM 引用均已建立 */
  buildGrain();
  requestAnimationFrame(frame);

  /* ready 兜底：只发一次 */
  setTimeout(function () {
    if (!readySent) {
      readySent = true;
      try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
      catch (eF) { console.error('[486] ready-fallback', eF); }
    }
  }, 900);
} catch (eB) {
  state.err = 'boot:' + (eB && eB.message ? eB.message : eB);
  console.error('[486] boot', eB);
}

})();
</script>
