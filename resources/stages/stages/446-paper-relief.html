<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>纸下群山</title>
<style>
  :root{
    --paper:#e7e1d2;
    --ink:#2e2a22;
    --ink-soft:rgba(46,42,34,.52);
    --ink-faint:rgba(46,42,34,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;color:var(--ink)}
  #reliefWrap{position:absolute;inset:0;overflow:hidden}
  #relief{position:absolute;left:-3%;top:-3%;display:block;width:106%;height:106%;will-change:transform}
  #glow{position:absolute;left:0;top:0;width:130vmax;height:130vmax;margin-left:-65vmax;margin-top:-65vmax;
    pointer-events:none;will-change:transform;
    background:radial-gradient(circle closest-side,rgba(255,252,240,.22),rgba(255,252,240,0) 58%);
    opacity:.5}
  #veil{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%,rgba(255,252,244,0) 40%,rgba(80,68,48,.10) 100%)}
  #stage{position:absolute;inset:0;display:flex;flex-direction:column;
    padding:clamp(20px,4.2vw,58px) clamp(22px,5vw,74px)}
  #top{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  #song{font-size:clamp(10px,1.05vw,14px);letter-spacing:.34em;line-height:1.9;color:var(--ink-soft);
    text-shadow:0 1px 0 rgba(255,253,246,.7);text-transform:uppercase}
  #seal{width:clamp(38px,3.4vw,52px);aspect-ratio:1;border-radius:50%;flex:0 0 auto;
    border:1px solid rgba(46,42,34,.20);box-shadow:inset 0 1px 2px rgba(96,80,54,.20),0 1px 0 rgba(255,253,246,.85)}
  #ly{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(7px,1.4vh,20px);
    max-width:min(88vw,1180px);padding-bottom:clamp(8px,2.2vh,26px);padding-left:clamp(0px,.4vw,3vw)}
  .ln{margin:0;line-height:1.5;font-weight:400;word-break:break-word;white-space:pre-wrap;
    text-shadow:0 1px 0 rgba(255,253,246,.75),0 -1px 0 rgba(78,64,42,.22)}
  .prev,.next{font-size:clamp(12px,1.6vw,22px);color:rgba(48,42,32,.52);letter-spacing:.04em}
  .cur{font-size:clamp(24px,4.2vw,60px);letter-spacing:.05em;line-height:1.46}
  .cur .c{color:rgba(60,52,38,.66);transition:none}
  .cur .c.on{color:#1d1a14}
  .cur{animation:press .62s cubic-bezier(.22,.7,.24,1) both}
  @keyframes press{
    0%{opacity:0;transform:translateY(8px);letter-spacing:.14em}
    60%{opacity:1}
    100%{opacity:1;transform:translateY(0)}
  }
  @media (prefers-reduced-motion:reduce){ .cur{animation:none} }
  @media (max-width:600px){
    #ly{max-width:96vw;padding-left:0}
    .prev,.next{font-size:clamp(11px,3.4vw,15px)}
    .cur{font-size:clamp(20px,7.2vw,34px);letter-spacing:.02em}
    #song{letter-spacing:.22em}
    #dots{display:none}
  }
  @media (max-height:520px){ #dots{display:none} .cur{font-size:clamp(18px,3.4vh,32px)} }
  #empty{display:none;padding:clamp(4px,1vh,10px) 0 clamp(2px,1vh,12px)}
  #empty.on{display:block}
  .empty-t{font-size:clamp(18px,2.1vw,30px);letter-spacing:.30em;color:rgba(88,76,56,.62)}
  .cur.hidden{display:none}
  #dots{display:flex;gap:clamp(5px,.7vw,10px);align-items:center;flex-wrap:wrap;padding-top:clamp(4px,1.2vh,14px)}
  .dot{width:clamp(4px,.5vw,6px);height:clamp(4px,.5vw,6px);border-radius:50%;
    background:rgba(46,42,34,.16);box-shadow:inset 0 1px 1px rgba(96,80,54,.25)}
  .dot.on{background:rgba(46,42,34,.62);box-shadow:0 1px 0 rgba(255,253,246,.7)}
</style>
</head>
<body>
<div id="reliefWrap"><canvas id="relief" aria-hidden="true"></canvas><div id="glow" aria-hidden="true"></div></div>
<div id="veil"></div>
<div id="stage">
  <div id="top">
    <div id="song"></div>
    <div id="seal"></div>
  </div>
  <div id="ly">
    <p class="ln prev" id="prev"></p>
    <p class="ln cur" id="cur"></p>
    <p class="ln next" id="next"></p>
    <div id="empty"><p class="ln empty-t" id="emptyText">纯器乐</p></div>
  </div>
  <div id="dots" aria-hidden="true"></div>
</div>
<script>
'use strict';

var S = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
  text: '', dur: 0, rm: false, level: 0, bass: 0, beat: 0,
  song: { name: '', artists: '', cover: '' }
};

window.__stage = function () {
  return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: '', text: S.text, gl: false, rm: S.rm
  };
};

if (window.matchMedia) {
  try { S.rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { console.error(e); }
}

var readySent = false;
function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error('[446] ready fail', e); }
}

var $ = function (id) { return document.getElementById(id); };
var el = { prev: $('prev'), cur: $('cur'), next: $('next'), song: $('song'), dots: $('dots'), empty: $('empty'), emptyText: $('emptyText') };

function normLines(raw) {
  if (!raw || typeof raw.length !== 'number') return [];
  var out = [];
  var n = Math.min(raw.length, 4000);
  for (var i = 0; i < n; i++) {
    var L = raw[i] || {};
    var txt = (L.text === null || L.text === undefined) ? '' : String(L.text);
    txt = txt.replace(/\s+$/, '');
    var chars = null;
    if (L.chars && typeof L.chars.length === 'number' && L.chars.length) {
      chars = [];
      var m = Math.min(L.chars.length, 600);
      for (var j = 0; j < m; j++) {
        var c = L.chars[j] || {};
        chars.push({ c: (c.c === null || c.c === undefined) ? '' : String(c.c), t: (typeof c.t === 'number' && isFinite(c.t)) ? c.t : 0 });
      }
    }
    out.push({ t: (typeof L.t === 'number' && isFinite(L.t)) ? L.t : 0, dur: (typeof L.dur === 'number' && isFinite(L.dur)) ? L.dur : 0, text: txt, chars: chars });
  }
  return out;
}

function artistText(a) {
  if (Array.isArray(a)) {
    var s = [];
    for (var i = 0; i < Math.min(a.length, 12); i++) if (a[i]) s.push(String(a[i]));
    return s.join(' / ');
  }
  return a ? String(a) : '';
}

/* ---------------- 歌词 ---------------- */
var LY = { idx: -1, spans: [], on: -1, starts: [], total: 0 };

function findIdx(t) {
  var lo = 0, hi = S.lines.length - 1, ans = -1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (S.lines[mid].t <= t + 0.015) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function lineSpan(l, i) {
  var n = l.text.length;
  var out = new Array(n);
  var base = l.t;
  var dur = l.dur > 0.2 ? l.dur : 3.2;
  var j;
  if (l.chars && l.chars.length) {
    var m = l.chars.length;
    for (j = 0; j < n; j++) {
      var c = l.chars[j < m ? j : m - 1];
      var tt = (c && typeof c.t === 'number' && isFinite(c.t)) ? c.t : base + j * 0.11;
      out[j] = tt < base ? base : tt;
    }
  } else {
    for (j = 0; j < n; j++) out[j] = base + dur * (j / Math.max(1, n)) * 0.94;
  }
  return out;
}

function buildLine(l, i, mode) {
  var p = document.createElement('p');
  p.className = 'ln ' + mode;
  var n = Math.min(l.text.length, 300);
  if (n === 0) { p.textContent = '\u00a0'; LY.spans = []; LY.starts = []; return p; }
  LY.starts = lineSpan(l, i);
  LY.spans = [];
  for (var j = 0; j < n; j++) {
    var s = document.createElement('span');
    s.className = 'c';
    s.textContent = l.text.charAt(j);
    p.appendChild(s);
    LY.spans.push(s);
  }
  return p;
}

function paintChars() {
  var n = LY.spans.length;
  if (!n) return;
  var t = S.t, k = 0;
  while (k < n && LY.starts[k] <= t + 0.02) k++;
  if (k === LY.on) return;
  var i;
  if (k < LY.on) {
    for (i = k; i < LY.on; i++) LY.spans[i].classList.remove('on');
  } else {
    for (i = LY.on < 0 ? 0 : LY.on; i < k; i++) LY.spans[i].classList.add('on');
  }
  LY.on = k;
}

function setLyricDom(i) {
  var prevT = i > 0 ? S.lines[i - 1].text : '';
  var nextT = '';
  if (i >= 0) nextT = (i + 1 < S.lines.length) ? S.lines[i + 1].text : '';
  else if (S.lines.length > 1) nextT = S.lines[1].text;
  if (el.prev.textContent !== prevT) el.prev.textContent = prevT;
  if (el.next.textContent !== nextT) el.next.textContent = nextT;
  var showIdx = i >= 0 ? i : 0;
  var key = i >= 0 ? i : -3;
  if (i < 0 && !S.lines.length) return;
  if (LY.idx !== key || !el.cur || !el.cur.parentNode) {
    var l = S.lines[showIdx];
    var p = buildLine(l, showIdx, 'cur');
    p.id = 'cur';
    if (el.cur && el.cur.parentNode) el.cur.parentNode.replaceChild(p, el.cur);
    else if (el.next && el.next.parentNode) el.next.parentNode.insertBefore(p, el.next);
    else $('ly').appendChild(p);
    el.cur = p;
    LY.on = -1;
    LY.idx = key;
    if (l.text.length > 22) {
      var fs = Math.max(0.50, 22 / Math.max(23, l.text.length));
      p.style.fontSize = 'clamp(14px,' + (4.3 * fs).toFixed(2) + 'vw,' + (62 * fs).toFixed(1) + 'px)';
    }
  }
  paintChars();
}

function updateLyrics() {
  if (!S.lines.length) { S.idx = -1; S.text = ''; return; }
  var i = findIdx(S.t);
  if (i !== S.idx) {
    S.idx = i;
    S.text = i >= 0 ? S.lines[i].text : '';
    markDots(i);
  }
  setLyricDom(i);
  paintChars();
}

function markDots(i) {
  var d = el.dots.children, n = d.length, k;
  for (k = 0; k < n; k++) {
    var on = k <= i;
    if (d[k].classList.contains('on') !== on) d[k].classList.toggle('on', on);
  }
}

function buildDots() {
  el.dots.textContent = '';
  var n = Math.min(S.lines.length, 64);
  if (n === 0) return;
  var frag = document.createDocumentFragment();
  for (var k = 0; k < n; k++) {
    var s = document.createElement('i');
    s.className = 'dot';
    frag.appendChild(s);
  }
  el.dots.appendChild(frag);
}

function onInit(p) {
  p = p || {};
  var song = p.song || {};
  S.song = { name: song.name ? String(song.name) : '', artists: artistText(song.artists), cover: song.cover ? String(song.cover) : '' };
  S.dur = (typeof p.duration === 'number' && isFinite(p.duration)) ? p.duration : 0;
  var acc = p.accent;
  if (acc && typeof acc.length === 'number' && acc.length >= 3) {
    S.accent = [Math.round(+acc[0]) || 0, Math.round(+acc[1]) || 0, Math.round(+acc[2]) || 0];
  }
  S.lines = normLines(p.lines);
  S.lines.sort(function (a, b) { return a.t - b.t; });
  S.idx = -1; S.text = '';
  LY.idx = -2; LY.spans = []; LY.on = -1;
  el.song.textContent = S.song.name || S.song.artists || '';
  el.prev.textContent = ''; el.next.textContent = ''; el.cur.textContent = '';
  el.empty.classList.toggle('on', S.lines.length === 0);
  if (el.cur) el.cur.classList.toggle('hidden', S.lines.length === 0);
  el.emptyText.textContent = S.song.name ? '人声尚未入纸' : '纯器乐';
  buildDots();
  try { applyAccent(); } catch (e) { console.error('[446] accent', e); }
  try { refreshTitle(); } catch (e) { console.error('[446] title', e); }
  if (S.lines.length) { LY.idx = -2; updateLyrics(); }
  else { S.idx = -1; S.text = ''; }
}

function applyAccent() {
  var a = S.accent || PAPER;
  var seal = $('seal');
  seal.style.background = 'radial-gradient(circle at 38% 32%,rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',0.30),rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',0.10))';
}

var needTitle = false;
function refreshTitle() { needTitle = true; }

function onTick(p) {
  if (!p) return;
  if (typeof p.time === 'number' && isFinite(p.time)) S.t = p.time;
  if (typeof p.playing === 'boolean') S.playing = p.playing;
}

window.addEventListener('message', function (ev) {
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') {
      var bp = d.payload || {};
      S.beat = Math.max(S.beat, Math.min(1, Math.max(0, +(bp.level) || 0)));
      S.beatOn = (typeof bp.index === 'number') ? bp.index : S.beatOn;
    } else if (d.type === 'live') {
      var lp = d.payload || {};
      S.liveW = Math.min(1, Math.max(0, +(lp.level) || 0));
      S.liveB = Math.min(1, Math.max(0, +(lp.bass) || 0));
      ptr.live = Math.max(ptr.live, S.liveB * 0.9);
      if (typeof lp.playing === 'boolean') S.playing = lp.playing;
    }
  } catch (e) { console.error('[446] msg', e); }
});

/* ================= 纸张盲凸印：等高线浮雕 ================= */
var cv = $('relief'), ctx = cv.getContext('2d');
var W = 1440, H = 900, DPR = 1;
var PAPER = [231, 225, 210];

var grid = { sw: 0, sh: 0, h: null, nx: null, ny: null };
var base = document.createElement('canvas'), bctx = base.getContext('2d');
var smC = document.createElement('canvas'), smX = smC.getContext('2d');
var outC = document.createElement('canvas'), outX = outC.getContext('2d');
var srcData = null, outData = null, outImg = null;
var ptr = { x: 0.5, y: 0.45, tx: 0.5, ty: 0.45, live: 0 };

var CENTS = [{ x: 0.52, y: 0.42, s: 1.00 }, { x: 0.24, y: 0.64, s: 0.74 }, { x: 0.80, y: 0.28, s: 0.60 }];

function wobble(th, k) {
  return Math.sin(th * 3 + k * 0.83) * 0.14 + Math.sin(th * 5 - k * 1.31) * 0.072 + Math.sin(th * 2 + k * 2.1) * 0.048;
}

function heightAt(u, v, asp) {
  var h = 0, c, k, C, dx, dy, r, th, R, d, e;
  for (c = 0; c < CENTS.length; c++) {
    C = CENTS[c];
    dx = (u - C.x) * asp; dy = (v - C.y);
    r = Math.sqrt(dx * dx + dy * dy);
    if (r > 0.46 * C.s + 0.03) continue;
    th = Math.atan2(dy, dx);
    for (k = 0; k < 5; k++) {
      R = (0.048 + k * 0.062) * C.s;
      d = (r - R * (1 + wobble(th, k + c * 1.7))) / (0.0045 + C.s * 0.0022);
      e = Math.exp(-d * d);
      if (e > 0.003) h += e * (0.55 + (4 - k) * 0.12);
    }
  }
  return h;
}

function buildGrid(sw, sh) {
  grid.sw = sw; grid.sh = sh;
  var n = sw * sh;
  var h = new Float32Array(n), nx = new Float32Array(n), ny = new Float32Array(n);
  var asp = W / Math.max(1, H), a = Math.min(1, 1 / asp);
  var x, y, i;
  for (y = 0; y < sh; y++) {
    for (x = 0; x < sw; x++) h[y * sw + x] = heightAt(x / (sw - 1), y / (sh - 1), asp);
  }
  var bump = 2.15;
  for (y = 0; y < sh; y++) {
    for (x = 0; x < sw; x++) {
      i = y * sw + x;
      var xl = x > 0 ? i - 1 : i, xr = x < sw - 1 ? i + 1 : i;
      var yu = y > 0 ? i - sw : i, yd = y < sh - 1 ? i + sw : i;
      var gx = (h[xr] - h[xl]) * bump, gy = (h[yd] - h[yu]) * bump;
      var len = Math.sqrt(gx * gx + gy * gy + 1);
      nx[i] = -gx / len; ny[i] = -gy / len;
    }
  }
  grid.h = h; grid.nx = nx; grid.ny = ny;
}

function buildBase() {
  base.width = Math.max(1, Math.round(W * DPR));
  base.height = Math.max(1, Math.round(H * DPR));
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.clearRect(0, 0, W, H);

  var sw = Math.max(120, Math.min(560, Math.round(W * 0.34)));
  var sh = Math.max(80, Math.min(360, Math.round(sw * H / Math.max(1, W))));
  if (!grid.nx || grid.sw !== sw || grid.sh !== sh || grid.asp !== W / Math.max(1, H)) buildGrid(sw, sh);
  grid.asp = W / Math.max(1, H);

  var lx = -0.42, ly = -0.56, lz = 0.72;
  var ll = Math.sqrt(lx * lx + ly * ly + lz * lz); lx /= ll; ly /= ll; lz /= ll;
  var img = bctx.createImageData(sw, sh), d = img.data;
  var i, j, k;
  for (i = 0, j = 0; i < grid.nx.length; i++, j += 4) {
    var nxv = grid.nx[i], nyv = grid.ny[i];
    var nzv = Math.sqrt(Math.max(0, 1 - nxv * nxv - nyv * nyv));
    var diff = nxv * lx + nyv * ly + nzv * lz;
    var spec = nxv * lx + nyv * ly + nzv * lz;
    spec = spec > 0.9 ? (spec - 0.9) : 0; spec = spec * spec * spec * 1.6;
    var sh2 = 0.80 + diff * 0.30 + spec;
    if (sh2 < 0.62) sh2 = 0.62; if (sh2 > 1.16) sh2 = 1.16;
    d[j] = Math.min(255, PAPER[0] * sh2);
    d[j + 1] = Math.min(255, PAPER[1] * sh2);
    d[j + 2] = Math.min(255, PAPER[2] * sh2);
    d[j + 3] = 255;
  }
  smC.width = sw; smC.height = sh;
  smX.putImageData(img, 0, 0);

  bctx.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
  bctx.fillRect(0, 0, W, H);
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';
  bctx.globalAlpha = 0.95; bctx.drawImage(smC, 0, 0, W, H); bctx.globalAlpha = 1;

  /* 纸纹颗粒 */
  bctx.globalCompositeOperation = 'overlay'; bctx.globalAlpha = 0.20;
  bctx.drawImage(grain, 0, 0, W, H);
  bctx.globalCompositeOperation = 'source-over'; bctx.globalAlpha = 1;

  /* 压凹的竖排标题 */
  drawEmbossedTitle();

  /* 边缘暗角（纸边微卷） */
  var vg = bctx.createRadialGradient(W * 0.5, H * 0.42, Math.min(W, H) * 0.30, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(255,252,242,0)');
  vg.addColorStop(1, 'rgba(72,60,40,0.16)');
  bctx.fillStyle = vg; bctx.fillRect(0, 0, W, H);

  /* 折射源 */
  var rw = Math.max(120, Math.min(300, Math.round(W * 0.21)));
  var rh = Math.max(70, Math.min(180, Math.round(rw * H / Math.max(1, W))));
  var rc = document.createElement('canvas');
  rc.width = rw; rc.height = rh;
  var rx = rc.getContext('2d');
  rx.imageSmoothingEnabled = true; rx.imageSmoothingQuality = 'high';
  rx.drawImage(base, 0, 0, rw, rh);
  srcData = rx.getImageData(0, 0, rw, rh);
  outC.width = rw; outC.height = rh;
  outData = outX.createImageData(rw, rh);
  outImg = outData;
  refr.w = rw; refr.h = rh;
}

var refr = { w: 0, h: 0 };

function drawEmbossedTitle() {
  var name = (S.song && S.song.name) ? String(S.song.name).slice(0, 12) : '';
  if (!name) return;
  var size = Math.min(W, H) * 0.082;
  bctx.font = '400 ' + size.toFixed(1) + 'px "Songti SC","SimSun",serif';
  bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
  var x = W - size * 1.05;
  var stepY = size * 1.20;
  var y0 = Math.max(H * 0.20, H * 0.5 - name.length * stepY * 0.42);
  for (var c = 0; c < name.length; c++) {
    var ch = name.charAt(c);
    var y = y0 + c * stepY;
    if (y > H * 0.93) break;
    if (!ch.trim()) continue;
    /* 盲凸：上/左一道浅高光，下/右一道压暗，字身只比纸暗一点点 */
    bctx.fillStyle = 'rgba(255,254,248,0.55)';
    bctx.fillText(ch, x - size * 0.028, y + size * 0.030);
    bctx.fillStyle = 'rgba(92,78,54,0.16)';
    bctx.fillText(ch, x, y);
  }
}

/* 纸纹颗粒图 */
var grain = (function () {
  var g = document.createElement('canvas');
  g.width = 180; g.height = 180;
  var gx = g.getContext('2d');
  var im = gx.createImageData(180, 180), d = im.data;
  var seed = 20261103;
  for (var i = 0; i < d.length; i += 4) {
    seed = (seed * 1664525 + 1013904223) & 0x7fffffff;
    var r0 = seed / 0x7fffffff;
    seed = (seed * 1664525 + 1013904223) & 0x7fffffff;
    var r1 = seed / 0x7fffffff;
    var v = 116 + r0 * 40 + (r1 > 0.86 ? -26 : 0);
    if (v < 0) v = 0; if (v > 255) v = 255;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gx.putImageData(im, 0, 0);
  return g;
})();

/* ---------- 每帧：折射 + 光斑 ---------- */
function drawPaper(dt) {
  var rw = refr.w, rh = refr.h;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(base, 0, 0, W, H);
  if (!srcData || !outData || !grid.nx) return;

  var amp = 0.55 + ptr.live * 1.1 + (S.beat || 0) * 0.9;
  if (S.rm) amp *= 0.6;
  var sd = srcData.data, od = outData.data;
  var sw = grid.sw, sh = grid.sh;
  var gxStep = sw / rw, gyStep = sh / rh;
  for (var y = 0; y < rh; y++) {
    var gy = Math.min(sh - 1, (y * gyStep) | 0) * sw;
    for (var x = 0; x < rw; x++) {
      var gi = gy + Math.min(sw - 1, (x * gxStep) | 0);
      var nxv = grid.nx[gi], nyv = grid.ny[gi];
      var mag = (nxv < 0 ? -nxv : nxv) + (nyv < 0 ? -nyv : nyv);
      var o = (y * rw + x) * 4;
      if (mag < 0.02) { od[o + 3] = 0; continue; }
      var dx = nxv * amp * 2.2, dy = nyv * amp * 2.2;      var sx0 = x + dx, sy0 = y + dy;
      var sx1 = x + dx * 1.55, sy1 = y + dy * 1.55;
      var sx2 = x + dx * 0.45, sy2 = y + dy * 0.45;
      var i1 = ((sy1 < 0 ? 0 : sy1 > rh - 1 ? rh - 1 : sy1 | 0) * rw + (sx1 < 0 ? 0 : sx1 > rw - 1 ? rw - 1 : sx1 | 0)) * 4;
      var i0 = ((sy0 < 0 ? 0 : sy0 > rh - 1 ? rh - 1 : sy0 | 0) * rw + (sx0 < 0 ? 0 : sx0 > rw - 1 ? rw - 1 : sx0 | 0)) * 4;
      var i2 = ((sy2 < 0 ? 0 : sy2 > rh - 1 ? rh - 1 : sy2 | 0) * rw + (sx2 < 0 ? 0 : sx2 > rw - 1 ? rw - 1 : sx2 | 0)) * 4;
      od[o] = sd[i1]; od[o + 1] = sd[i0 + 1]; od[o + 2] = sd[i2 + 2];
      var a = mag * 260; if (a > 224) a = 224;
      od[o + 3] = a;
    }
  }
  outX.putImageData(outData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(outC, 0, 0, W, H);

  /* 移动的高光（纸面受光） */
  var hx = ptr.x * W, hy = ptr.y * H;
  glowEl.style.transform = 'translate(' + hx.toFixed(0) + 'px,' + hy.toFixed(0) + 'px) translateZ(0)';
  glowEl.style.opacity = (0.62 + ptr.live * 0.22).toFixed(2);
}

var glowEl = $('glow');

var resizeTimer = 0;
function requestResize() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { resizeTimer = 0; try { resize(); } catch (e) { console.error('[446] resize', e); } }, 150);
}

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (!w || !h || !isFinite(w) || !isFinite(h)) { w = 1440; h = 900; }
  W = Math.max(320, Math.round(w)); H = Math.max(320, Math.round(h));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = '106%'; cv.style.height = '106%';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBase();
}

window.addEventListener('resize', requestResize);
window.addEventListener('orientationchange', requestResize);

/* 指针移动 → 高光跟随 */
function pointerMove(x, y) {
  if (!isFinite(x) || !isFinite(y)) return;
  ptr.tx = Math.max(0, Math.min(1, x / W)); ptr.ty = Math.max(0, Math.min(1, y / H));
  ptr.live = 1;
}
window.addEventListener('pointermove', function (e) { pointerMove(e.clientX, e.clientY); }, { passive: true });

var last = 0;
function frame(ts) {
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  S.frames++;
  sendReady();
  if (typeof last !== 'number' || !isFinite(last)) last = ts;
  var dt = Math.min(64, Math.max(0, ts - last));
  last = ts;

  ptr.x += (ptr.tx - ptr.x) * Math.min(1, dt * 0.004);
  ptr.y += (ptr.ty - ptr.y) * Math.min(1, dt * 0.004);
  ptr.live *= 0.985;
  S.bass += ((S.liveB || 0) - (S.bass || 0)) * Math.min(1, dt * 0.006);
  S.beat *= 0.90;

  if (!didSize) {
    didSize = true;
    try { resize(); } catch (e) { console.error('[446] first resize', e); }
  }

  if (needTitle) {
    needTitle = false;
    try { if (base.width) buildBase(); } catch (e) { console.error('[446] base', e); }
  }

  try {
    updateLyrics(dt);
    drawPaper(dt);
    setVeil(S.bass * 0.5 + S.beat * 0.10);
  } catch (e) {
    if (!errLogged) { errLogged = true; console.error('[446] frame', e); }
  }

  S.js = (window.performance && performance.now) ? (performance.now() - t0) : 0;
  requestAnimationFrame(frame);
}
var errLogged = false, didSize = false;

var veilEl = $('veil'), veilV = -1;
function setVeil(v) {
  if (v < 0) v = 0; if (v > 1) v = 1;
  if (Math.abs(v - veilV) < 0.02) return;
  veilV = v;
  veilEl.style.opacity = v.toFixed(2);
}

requestAnimationFrame(frame);
setTimeout(sendReady, 380);
setTimeout(sendReady, 1200);
</script>
