<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>留案存照</title>
<style>
  :root{
    --ink:#141010; --paper:#d9cdb4; --paper2:#c3b393; --accent:#c8452f;
    --mono:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;
    --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0b0908;overflow:hidden}
  #stage{
    position:fixed;inset:0;display:flex;overflow:hidden;
    background:#0b0908;color:#0e0b0a;
  }

  /* ---------- left: booking photograph ---------- */
  #photoPane{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;background:#171210}
  canvas#photo,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
  canvas#fx{pointer-events:none}
  #scrim{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,rgba(10,7,6,0) 82%,rgba(10,7,6,.42) 100%),
      linear-gradient(180deg,rgba(10,7,6,0) 52%,rgba(10,7,6,.06) 64%,rgba(8,5,4,.55) 86%,rgba(6,4,4,.82) 100%);
  }
  #tag{
    position:absolute;left:clamp(10px,2.2vw,30px);top:clamp(10px,2.2vw,26px);
    font:700 clamp(8px,1.05vw,11px)/1.5 var(--mono);
    letter-spacing:.26em;color:#3a2b1e;text-transform:uppercase;
    pointer-events:none;
  }
  #tag b{display:block;color:#16100c;letter-spacing:.34em;font-weight:800}
  #tag i{font-style:normal;color:#7d1f14}
  #tagNo{color:#5a4634}
  #stampWrap{
    position:absolute;right:clamp(8px,2vw,26px);top:clamp(30px,8vh,90px);pointer-events:none;
    transform:rotate(-13deg);opacity:.72;
  }
  #stampWrap span{
    display:block;font:800 clamp(9px,1.25vw,14px)/1.22 var(--mono);letter-spacing:.2em;
    color:#7d1f14;border:2.5px solid rgba(125,31,20,.62);padding:.42em .6em;
    text-align:center;border-radius:2px;
  }

  /* ---------- lyrics: the subject's statement, transcribed ---------- */
  #saying{
    position:absolute;left:0;right:0;bottom:0;
    padding:clamp(12px,2.2vw,26px) clamp(14px,3vw,44px) clamp(15px,3.2vh,38px);
    background:linear-gradient(180deg,rgba(8,6,5,0) 0%,rgba(8,6,5,.52) 24%,rgba(8,6,5,.88) 66%,rgba(6,4,4,.96) 100%);
    pointer-events:none;
  }
  #said{
    font:700 clamp(7px,.85vw,10px)/1 var(--mono);letter-spacing:.3em;
    color:#c8b89a;opacity:.72;text-transform:uppercase;
    margin-bottom:clamp(5px,1vh,11px);
    display:flex;align-items:center;gap:.7em;
  }
  #said:after{content:"";flex:1 1 auto;height:1px;background:rgba(200,184,154,.26)}
  #lyric{
    color:#f7f0e2;font-family:var(--cjk);
    font-weight:900;letter-spacing:.01em;
    font-size:var(--fs,clamp(21px,3.5vw,52px));line-height:1.22;
    text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.72),0 0 1px rgba(0,0,0,.9);
    max-height:38vh;overflow:hidden;
  }
  #lyric .ln{display:block;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
  #lyric .ln[hidden]{display:none}
  #lyric .ln + .ln{
    margin-top:.34em;font-size:.42em;font-weight:600;color:#8e8471;
    letter-spacing:.03em;text-shadow:none;
  }
  #lyric .ln + .ln .c,#lyric .ln + .ln .c.on{color:#8e8471}
  #lyric .c{color:#8a8172;transition:none}
  #lyric .c.on{color:#fff9ec}
  #lyric .c.cen{color:transparent;position:relative}
  #lyric .mark{
    display:inline-block;width:.72em;height:.82em;margin:0 .06em;
    background:linear-gradient(180deg,#0a0708,#1a1211);
    vertical-align:-.10em;
    box-shadow:0 0 0 1px rgba(247,240,226,.16),0 .1em .3em rgba(0,0,0,.5);
  }
  #empty{
    position:absolute;left:clamp(14px,3vw,44px);bottom:clamp(16px,3.4vh,40px);
    color:#a89b86;font:600 clamp(9px,1.1vw,12px)/1.7 var(--mono);letter-spacing:.22em;
    max-width:70%;
  }
  #empty b{display:block;color:#efe0c4;font-size:1.65em;letter-spacing:.14em;margin-bottom:.55em;font-weight:800}
  #empty:after{
    content:"";display:block;width:min(38vw,220px);height:9px;margin-top:1em;
    background:repeating-linear-gradient(90deg,#100c0a 0 3px,transparent 3px 6px);
    opacity:.8;
  }

  /* ---------- right: paper booking rail ---------- */
  #rail{
    flex:0 0 clamp(154px,21vw,286px);position:relative;
    background:
      repeating-linear-gradient(90deg,rgba(58,42,28,.05) 0 1px,transparent 1px 4px),
      linear-gradient(178deg,var(--paper),var(--paper2));
    border-left:2px solid #100c0a;
    box-shadow:-14px 0 34px rgba(0,0,0,.6),inset 10px 0 20px rgba(120,96,66,.16);
    padding:clamp(9px,1.5vw,22px) clamp(8px,1.3vw,20px);
    display:flex;flex-direction:column;gap:clamp(5px,.9vh,11px);
    color:#1b1512;overflow:hidden;
  }
  #rail:before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 100% 0%,rgba(255,250,236,.5),transparent 60%),
               radial-gradient(90% 70% at 0% 100%,rgba(96,72,44,.3),transparent 62%);
  }
  .rh{
    position:relative;padding:0 clamp(2px,.3vw,5px) clamp(2px,.5vh,6px);
    border-bottom:2.5px solid #14100d;
  }
  .rh .t{font:800 clamp(9px,1.15vw,13px)/1.15 var(--mono);letter-spacing:.13em;color:#14100d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rh .s{font:600 clamp(7px,.82vw,9.5px)/1.3 var(--mono);letter-spacing:.24em;color:#5c4a37;margin-top:.35em}
  .f{position:relative;border-bottom:1px solid rgba(35,25,18,.42);padding:0 2px clamp(2px,.55vh,7px)}
  .f .k{font:600 clamp(6.5px,.75vw,8.6px)/1.2 var(--mono);letter-spacing:.22em;color:#6a5641;text-transform:uppercase}
  .f .v{
    font:800 clamp(10px,1.28vw,17px)/1.16 var(--mono);letter-spacing:.01em;color:#171210;
    margin-top:.28em;word-break:break-word;overflow-wrap:anywhere;
  }
  .f .v.cjk{font-family:var(--cjk);letter-spacing:.02em;font-weight:900}
  .f .v.big{font-size:clamp(12px,1.7vw,23px);line-height:1.1}
  .f .v.hot{color:#7d1f14}
  #charges .v{
    font:700 clamp(8px,1vw,12px)/1.4 var(--mono);letter-spacing:.06em;
    display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #finger{
    position:relative;margin-top:auto;align-self:stretch;
    height:clamp(56px,11vh,120px);border:1.5px solid rgba(30,21,14,.6);
    border-radius:2px;overflow:hidden;background:rgba(255,250,238,.34);
  }
  #finger canvas{display:block;width:100%;height:100%}
  .bar{
    position:relative;height:clamp(16px,3vh,28px);margin-top:2px;
    background:repeating-linear-gradient(90deg,#14100d 0 2px,transparent 2px 4px,#14100d 4px 7px,transparent 7px 11px);
    opacity:.82;
  }
  .barcodeTxt{font:600 clamp(6px,.72vw,8px)/1 var(--mono);letter-spacing:.35em;color:#3c2e22;text-align:center;margin-top:3px}

  @media (max-width:720px){
    #stage{flex-direction:column}
    #rail{
      flex:0 0 auto;flex-direction:row;align-items:stretch;gap:8px;
      border-left:0;border-top:2px solid #100c0a;
      padding:6px 9px 7px;max-height:31vh;overflow:hidden;
    }
    #rail .f{padding-bottom:2px}
    #rail .rh,#rail #finger,#rail .bar,.barcodeTxt,#rail #charges{display:none}
    #rail .f{padding-bottom:1px}
    #rail .f#fNameW{flex:1 1 auto;min-width:0}
    #rail .f .v{font-size:11px}
    #rail .f .k{font-size:7px;letter-spacing:.16em}
    #tag{font-size:8.5px;letter-spacing:.14em}
    #stampWrap{display:none}
    #saying{padding-bottom:clamp(10px,2vh,20px)}
    #lyric{font-size:clamp(19px,5.8vw,32px);max-height:30vh}
    #lyric .ln + .ln{font-size:.5em}
  }
  @media (max-height:520px){
    #saying{padding-bottom:10px}
    #lyric{font-size:clamp(16px,3.2vw,30px);max-height:34vh}
    #rail #finger,#rail .bar,.barcodeTxt{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="photoPane">
    <canvas id="photo"></canvas>
    <canvas id="fx"></canvas>
    <div id="scrim"></div>
    <div id="tag"><b>MPD&nbsp;·&nbsp;CENTRAL&nbsp;BOOKING</b><span id="tagNo">NO. 000000</span> &nbsp;|&nbsp; <i id="tagState">FRONT / PROFILE</i></div>
    <div id="stampWrap"><span id="stamp">PARENTAL<br>ADVISORY</span></div>
    <div id="saying">
      <div id="said">Statement of the accused</div>
      <div id="lyric"></div>
    </div>
    <div id="empty" hidden><b>NO STATEMENT ON FILE</b>SUBJECT DECLINED TO SPEAK</div>
  </div>

  <aside id="rail">
    <div class="rh">
      <div class="t">BOOKING&nbsp;RECORD</div>
      <div class="s">DETAINEE CUSTODY FORM</div>
    </div>
    <div class="f" id="fNameW"><div class="k">Subject</div><div class="v cjk" id="fName">—</div></div>
    <div class="f"><div class="k">Alias / Artist</div><div class="v" id="fArtist">—</div></div>
    <div class="f"><div class="k">Booking No.</div><div class="v big" id="fNo">000000</div></div>
    <div class="f"><div class="k">DOB</div><div class="v" id="fDob">—</div></div>
    <div class="f"><div class="k">Height</div><div class="v" id="fHt">— — —</div></div>
    <div class="f" id="charges"><div class="k">Charges</div><div class="v" id="fChg">—</div></div>
    <div id="finger"><canvas id="fp" width="120" height="120"></canvas></div>
    <div class="bar"></div>
    <div class="barcodeTxt" id="fCode">0000 0000 0000</div>
  </aside>
</div>
<script>
/* ---------- top-level state + self-check hook (unconditional) ---------- */
var ST = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, text: '',
  rm: false, gl: false, accent: [200, 70, 50], dur: 0, name: '', artist: ''
};
window.__stage = function () {
  return {
    lines: ST.lines.length,
    idx: ST.idx,
    t: ST.t,
    playing: !!ST.playing,
    frames: ST.frames,
    js: ST.js,
    err: '',
    text: ST.text,
    gl: ST.gl,
    rm: ST.rm
  };
};

(function () {
  'use strict';

  var doc = document;
  var $pane = doc.getElementById('photoPane');
  var $photo = doc.getElementById('photo');
  var $fx = doc.getElementById('fx');
  var $lyric = doc.getElementById('lyric');
  var $empty = doc.getElementById('empty');
  var pctx = $photo.getContext('2d');
  var fctx = $fx.getContext('2d');

  var W = 1440, H = 900, DPR = 1;
  var readySent = false;
  var vis = { level: 0, bass: 0, mid: 0, treble: 0, bpm: 0 };
  var beat = { level: 0, index: -1, hit: 0 };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function ease(cur, tgt, k) { return cur + (tgt - cur) * k; }

  /* ---------- protocol ---------- */
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[ready] postMessage failed', e); }
  }

  function str(v) { return v == null ? '' : String(v); }
  function artistsOf(song) {
    var a = song && song.artists;
    if (Array.isArray(a)) { try { return a.map(str).filter(Boolean).join(' / '); } catch (e) { return ''; } }
    return str(a);
  }

  function onInit(p) {
    p = p || {};
    var song = p.song || {};
    ST.name = str(song.name);
    ST.artist = artistsOf(song);
    ST.dur = Math.max(0, Number(p.duration) || 0);
    var acc = p.accent;
    if (Array.isArray(acc) && acc.length >= 3) {
      ST.accent = [clamp(Number(acc[0]) || 0, 0, 255), clamp(Number(acc[1]) || 0, 0, 255), clamp(Number(acc[2]) || 0, 0, 255)];
    }
    var src = Array.isArray(p.lines) ? p.lines : [];
    ST.lines = [];
    for (var i = 0; i < src.length; i++) {
      var ln = src[i] || {};
      var tx = str(ln.text);
      ST.lines.push({
        t: Number(ln.t) || 0,
        dur: Math.max(0, Number(ln.dur) || 0),
        text: tx,
        chars: Array.isArray(ln.chars) ? ln.chars : null
      });
    }
    ST.lines.sort(function (a, b) { return a.t - b.t; });
    if (typeof p.playing === 'boolean') ST.playing = p.playing; else ST.playing = true;
    ST.idx = -1; ST.t = 0; ST.text = '';
    ST.seed = hashStr(ST.name || 'x') ^ (ST.lines.length * 2654435761);
    ST.no = String(100000 + (Math.abs(ST.seed) % 899999));
    ST.chg = chargeList(ST.seed, ST.lines.length);
    fillCard();
    $empty.hidden = ST.lines.length > 0;
    if ($saying) $saying.style.display = ST.lines.length > 0 ? '' : 'none';
    ST.rebuild = true;
    render();
  }

  function onTick(p) {
    p = p || {};
    var t = Number(p.time);
    if (!isFinite(t)) t = 0;
    ST.t = t;
    if (typeof p.playing === 'boolean') ST.playing = p.playing;
  }

  function onBeat(p) {
    p = p || {};
    var lv = Number(p.level);
    beat.level = isFinite(lv) ? clamp(lv, 0, 1) : 0.6;
    beat.index = Number(p.index) || 0;
    beat.hit = 1;
    beat.flash = Math.min(1, 0.45 + beat.level * 0.7);
  }

  function onLive(p) {
    p = p || {};
    function n(v) { var x = Number(v); return isFinite(x) ? clamp(x, 0, 1) : 0; }
    vis.level = n(p.level); vis.bass = n(p.bass); vis.mid = n(p.mid); vis.treble = n(p.treble);
    vis.bpm = Number(p.bpm) || 0;
    if (typeof p.playing === 'boolean' && p.playing !== ST.playing) ST.playing = p.playing;
  }

  /* ---------- derived card text (deterministic per song) ---------- */
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h | 0;
  }

  var BOOKING = [
    'RESISTING ARREST', 'DISORDERLY CONDUCT', 'RECKLESS ENDANGERMENT',
    'UNLAWFUL ASSEMBLY', 'POSSESSION OF RHYME', 'INCITING A CROWD',
    'LOITERING W/ INTENT', 'ASSAULT ON THE BEAT', 'OBSTRUCTION',
    'CARRYING A CONCEALED VERSE'
  ];

  function chargeList(seed, n) {
    var out = [], s = Math.abs(seed || 1);
    var count = 3, used = {};
    for (var i = 0; i < count; i++) {
      var k = (s + i * 977) % BOOKING.length, guard = 0;
      while (used[k] && guard < 12) { k = (k + 1) % BOOKING.length; guard++; }
      used[k] = 1;
      out.push({ code: 'P.C. ' + (200 + ((s >> (i + 1)) % 799)), txt: BOOKING[k] });
    }
    return out;
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fillCard() {
    var s = Math.abs(ST.seed || 1);
    var name = ST.name || 'UNIDENTIFIED SUBJECT';
    var el;
    el = doc.getElementById('fName'); el.textContent = name;
    el = doc.getElementById('fArtist'); el.textContent = ST.artist || 'NO ALIAS ON RECORD';
    el = doc.getElementById('fNo'); el.textContent = ST.no;
    el = doc.getElementById('fDob');
    el.textContent = pad2(1 + (s % 12)) + ' / ' + pad2(1 + ((s >> 3) % 28)) + ' / ' + (1968 + (s % 40));
    el = doc.getElementById('fHt');
    el.innerHTML = '5 FT ' + (4 + (s % 11)) + ' IN';
    var chg = doc.getElementById('fChg');
    chg.innerHTML = '';
    for (var i = 0; i < ST.chg.length; i++) {
      var d = doc.createElement('div');
      d.textContent = ST.chg[i].code + '  ' + ST.chg[i].txt;
      chg.appendChild(d);
    }
    doc.getElementById('tagNo').textContent = 'NO. ' + ST.no;
    doc.getElementById('fCode').textContent = (ST.no + ' ' + String(s % 10000)).replace(/(\d{4})(?=\d)/g, '$1 ');
    drawFinger(s);
    ST.paintedLens = -1;
  }

  /* deterministic fingerprint scribble */
  function drawFinger(seed) {
    var cv = doc.getElementById('fp');
    if (!cv) return;
    var c = cv.getContext('2d');
    var w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h);
    c.strokeStyle = '#2a1d14';
    c.lineWidth = 1.4;
    c.lineCap = 'round';
    var s = Math.abs(seed || 7);
    for (var r = 0; r < 13; r++) {
      c.beginPath();
      for (var i = 0; i <= 30; i++) {
        var a = -Math.PI * 0.5 + (i / 30) * Math.PI * 2;
        var rad = (14 + r * 3.6) * (0.86 + 0.2 * Math.sin(a * 3 + s % 17 + r * 0.6));
        var x = w * 0.5 + Math.cos(a) * rad * 0.92;
        var y = h * 0.56 + Math.sin(a) * rad * 1.18;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
    }
    c.beginPath(); c.moveTo(w * 0.5, h * 0.94); c.lineTo(w * 0.5, h * 0.46); c.stroke();
  }

  function onMsg(e) {
    var d = e && e.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch (err) { console.error('[msg:' + (d && d.type) + ']', err); }
  }

  /* ---------- index tracking ---------- */
  function indexAt(t) {
    var L = ST.lines, lo = 0, hi = L.length - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (L[mid].t <= t + 0.12) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  /* ---------- lyric DOM: one node per char, rebuilt only on line change ---------- */
  var $cur = null, $next = null, charSpans = [], charTimes = [], lineAt = -1;
  var $lyricEl = $lyric;
  var $saying = doc.getElementById('saying');

  function cls() {
    $lyricEl.innerHTML = '';
    $cur = doc.createElement('span'); $cur.className = 'ln';
    $next = doc.createElement('span'); $next.className = 'ln';
    $lyricEl.appendChild($cur);
    $lyricEl.appendChild($next);
    charSpans = []; charTimes = [];
  }

  function setLineDom(ln, nextLn) {
    if (!$cur) cls();
    $cur.innerHTML = '';
    charSpans = []; charTimes = [];
    var txt = ln.text || '';
    var cs = ln.chars;
    var n = txt.length;
    var hasT = Array.isArray(cs) && cs.length > 0;
    var span = Math.max(0.001, ln.dur || 0);
    /* hard cap on nodes, no unbounded growth */
    var cap = Math.min(n, 420);
    for (var i = 0; i < cap; i++) {
      var span_ = doc.createElement('span');
      span_.className = 'c';
      span_.textContent = txt.charAt(i) || '';
      if (!span_.textContent) span_.textContent = '\u00a0';
      $cur.appendChild(span_);
      charSpans.push(span_);
      var ct = ln.t;
      if (hasT) {
        var it = cs[Math.min(i, cs.length - 1)];
        var tv = it ? Number(it.t) : NaN;
        ct = isFinite(tv) ? tv : ln.t;
      } else {
        ct = ln.t + span * (i / Math.max(1, cap));
      }
      charTimes.push(isFinite(ct) ? ct : ln.t);
    }
    /* censorship: one black bar swallowing a character */
    if (cap >= 4) {
      var a = Math.min(cap - 1, Math.max(1, Math.floor(cap * 0.42)));
      var bar = doc.createElement('span');
      bar.className = 'mark';
      charSpans[a].parentNode.insertBefore(bar, charSpans[a]);
      charSpans[a].classList.add('cen');
    }
    if (nextLn) {
      var nt = nextLn.text || '';
      if (nt.length > 60) nt = nt.slice(0, 60);
      $next.textContent = nt;
      $next.hidden = !nt;
    } else {
      $next.textContent = '';
      $next.hidden = true;
    }
    lineAt = ln.__i;
  }

  function paintChars() {
    if (!charSpans.length) return;
    var t = ST.t, on = ST.playing;
    for (var i = 0; i < charSpans.length; i++) {
      var lit = charTimes[i] <= t + 0.02;
      var s = charSpans[i];
      var want = lit ? 'c on' : 'c off';
      if (s.className !== want) s.className = want;
    }
  }

  function render() {
    if (!ST.lines.length) {
      $lyricEl.innerHTML = '';
      charSpans = []; charTimes = [];
      lineAt = -1;
      ST.text = '';
      return;
    }
    var idx = ST.idx;
    var ln = ST.lines[idx];
    if (!ln) {
      if (lineAt !== -99) {
        cls();
        $cur.textContent = '· · ·';
        $next.textContent = ST.lines[0].text ? ST.lines[0].text.slice(0, 60) : '';
        $next.hidden = !$next.textContent;
        charSpans = []; charTimes = [];
        lineAt = -99;
      }
      ST.text = '';
      return;
    }
    ln.__i = idx;
    if (lineAt !== idx) {
      setLineDom(ln, ST.lines[idx + 1] || null);
      ST.text = ln.text;
      fitLine();
    }
    paintChars();
  }

  /* shrink the line until it fits its box — hard cap on iterations */
  function fitLine() {
    var el = $lyricEl;
    if (!el) return;
    el.style.setProperty('--fs', '');
    var base = parseFloat(getComputedStyle(el).fontSize) || 34;
    var box = el.clientHeight || 0;
    var limit = base;
    for (var i = 0; i < 9 && box > 0; i++) {
      if (el.scrollHeight <= box + 2) break;
      limit = limit * 0.86;
      el.style.setProperty('--fs', limit.toFixed(1) + 'px');
    }
  }

  /* =====================================================================
     THE BOOKING PHOTOGRAPH — drawn once into an offscreen plate.
     ===================================================================== */
  var por = doc.createElement('canvas');
  var seeded = 1;
  function rnd() { seeded = (seeded * 1664525 + 1013904223) >>> 0; return seeded / 4294967296; }

  function mix(a, b, k) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
      Math.round(a[1] + (b[1] - a[1]) * k) + ',' + Math.round(a[2] + (b[2] - a[2]) * k) + ')';
  }

  /* Catmull-Rom -> bezier, for smooth silhouettes */
  function spline(c, pts, close) {
    if (!pts || pts.length < 2) return;
    c.moveTo(pts[0][0], pts[0][1]);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var k = 0.5 / 3;
      c.bezierCurveTo(
        p1[0] + (p2[0] - p0[0]) * k, p1[1] + (p2[1] - p0[1]) * k,
        p2[0] - (p3[0] - p1[0]) * k, p2[1] - (p3[1] - p1[1]) * k,
        p2[0], p2[1]
      );
    }
    if (close) c.closePath();
  }

  /* ---------- one detainee, front view ---------- */
  function drawFront(c, cx, topY, hf, tone, m) {
    var hh = hf * 0.168, hw = hh * 0.78;
    var hy = topY + hh * 0.5;             /* head centre */
    var neckY = topY + hh * 0.94;
    var shY = topY + hh * 1.32;
    var baseY = topY + hf;

    /* torso */
    c.fillStyle = tone;
    c.beginPath();
    c.moveTo(cx - hw * 2.25, baseY);
    c.bezierCurveTo(cx - hw * 2.15, shY + (baseY - shY) * 0.22, cx - hw * 1.24, shY + hh * 0.02, cx - hw * 0.52, shY - hh * 0.04);
    c.lineTo(cx - hw * 0.3, shY - hh * 0.14);
    c.quadraticCurveTo(cx, shY + hh * 0.1, cx + hw * 0.3, shY - hh * 0.14);
    c.lineTo(cx + hw * 0.52, shY - hh * 0.04);
    c.bezierCurveTo(cx + hw * 1.24, shY + hh * 0.02, cx + hw * 2.15, shY + (baseY - shY) * 0.22, cx + hw * 2.25, baseY);
    c.closePath();
    c.fill();

    /* neck */
    c.beginPath();
    c.moveTo(cx - hw * 0.34, neckY - hh * 0.06);
    c.lineTo(cx - hw * 0.3, shY - hh * 0.06);
    c.lineTo(cx + hw * 0.3, shY - hh * 0.06);
    c.lineTo(cx + hw * 0.34, neckY - hh * 0.06);
    c.closePath();
    c.fill();

    /* ears */
    c.beginPath();
    c.ellipse(cx - hw * 0.53, hy + hh * 0.06, hw * 0.09, hh * 0.14, 0, 0, 6.3);
    c.ellipse(cx + hw * 0.53, hy + hh * 0.06, hw * 0.09, hh * 0.14, 0, 0, 6.3);
    c.fill();

    /* skull */
    c.beginPath();
    c.moveTo(cx - hw * 0.5, hy - hh * 0.16);
    c.bezierCurveTo(cx - hw * 0.5, hy - hh * 0.62, cx - hw * 0.2, hy - hh * 0.68, cx, hy - hh * 0.68);
    c.bezierCurveTo(cx + hw * 0.2, hy - hh * 0.68, cx + hw * 0.5, hy - hh * 0.62, cx + hw * 0.5, hy - hh * 0.16);
    c.bezierCurveTo(cx + hw * 0.5, hy + hh * 0.26, cx + hw * 0.31, hy + hh * 0.52, cx, hy + hh * 0.54);
    c.bezierCurveTo(cx - hw * 0.31, hy + hh * 0.52, cx - hw * 0.5, hy + hh * 0.26, cx - hw * 0.5, hy - hh * 0.16);
    c.closePath();
    c.fill();

    /* hair mass — high top */
    c.fillStyle = m.hair;
    c.beginPath();
    c.moveTo(cx - hw * 0.53, hy - hh * 0.06);
    c.bezierCurveTo(cx - hw * 0.6, hy - hh * 0.5, cx - hw * 0.46, hy - hh * 0.9, cx - hw * 0.14, hy - hh * 0.92);
    c.bezierCurveTo(cx + hw * 0.22, hy - hh * 0.94, cx + hw * 0.52, hy - hh * 0.78, cx + hw * 0.53, hy - hh * 0.34);
    c.bezierCurveTo(cx + hw * 0.5, hy - hh * 0.6, cx + hw * 0.13, hy - hh * 0.64, cx - hw * 0.16, hy - hh * 0.6);
    c.bezierCurveTo(cx - hw * 0.4, hy - hh * 0.57, cx - hw * 0.46, hy - hh * 0.4, cx - hw * 0.47, hy - hh * 0.06);
    c.closePath();
    c.fill();

    /* shade the right side of the face */
    var g = c.createLinearGradient(cx - hw * 0.5, 0, cx + hw * 0.5, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.45, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.34)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(cx, hy, hw * 0.5, hh * 0.56, 0, 0, 6.3);
    c.fill();

    /* brow shadow */
    c.fillStyle = 'rgba(0,0,0,0.30)';
    c.beginPath();
    c.ellipse(cx - hw * 0.21, hy - hh * 0.05, hw * 0.155, hh * 0.075, -0.06, 0, 6.3);
    c.ellipse(cx + hw * 0.21, hy - hh * 0.05, hw * 0.155, hh * 0.075, 0.06, 0, 6.3);
    c.fill();

    /* eye sockets */
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.beginPath();
    c.ellipse(cx - hw * 0.21, hy + hh * 0.035, hw * 0.115, hh * 0.045, 0, 0, 6.3);
    c.ellipse(cx + hw * 0.21, hy + hh * 0.035, hw * 0.115, hh * 0.045, 0, 0, 6.3);
    c.fill();

    /* nose shadow + mouth */
    c.fillStyle = 'rgba(0,0,0,0.20)';
    c.beginPath();
    c.moveTo(cx - hw * 0.05, hy + hh * 0.05);
    c.lineTo(cx + hw * 0.07, hy + hh * 0.26);
    c.lineTo(cx - hw * 0.12, hy + hh * 0.27);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.42)';
    c.lineWidth = Math.max(1, hh * 0.014);
    c.beginPath();
    c.moveTo(cx - hw * 0.16, hy + hh * 0.36);
    c.quadraticCurveTo(cx, hy + hh * 0.40, cx + hw * 0.16, hy + hh * 0.35);
    c.stroke();

    /* jaw shadow onto neck */
    c.fillStyle = 'rgba(0,0,0,0.34)';
    c.beginPath();
    c.ellipse(cx, neckY + hh * 0.02, hw * 0.34, hh * 0.1, 0, 0, Math.PI);
    c.fill();

    return { cx: cx, hy: hy, hw: hw, hh: hh, shY: shY, baseY: baseY, neckY: neckY };
  }

  /* ---------- profile view ---------- */
  function drawProfile(c, cx, topY, hf, tone, m) {
    var hh = hf * 0.152, hw = hh * 0.8;
    var hy = topY + hh * 0.62;
    var shY = topY + hh * 1.34;
    var baseY = topY + hf;

    c.fillStyle = tone;
    c.beginPath();
    c.moveTo(cx - hw * 2.0, baseY);
    c.bezierCurveTo(cx - hw * 1.95, shY + (baseY - shY) * 0.22, cx - hw * 1.15, shY + hh * 0.04, cx - hw * 0.3, shY - hh * 0.06);
    c.lineTo(cx + hw * 0.34, shY - hh * 0.06);
    c.bezierCurveTo(cx + hw * 1.0, shY + hh * 0.04, cx + hw * 1.15, shY + (baseY - shY) * 0.22, cx + hw * 1.2, baseY);
    c.closePath();
    c.fill();

    /* head: back over the crown, brow, nose, lips, chin */
    var P = [
      [cx - hw * 0.52, hy + hh * 0.34],
      [cx - hw * 0.62, hy - hh * 0.02],
      [cx - hw * 0.5, hy - hh * 0.36],
      [cx - hw * 0.18, hy - hh * 0.56],
      [cx + hw * 0.2, hy - hh * 0.5],
      [cx + hw * 0.42, hy - hh * 0.25],
      [cx + hw * 0.46, hy - hh * 0.02],
      [cx + hw * 0.40, hy + hh * 0.05],
      [cx + hw * 0.60, hy + hh * 0.19],
      [cx + hw * 0.42, hy + hh * 0.25],
      [cx + hw * 0.52, hy + hh * 0.32],
      [cx + hw * 0.43, hy + hh * 0.38],
      [cx + hw * 0.36, hy + hh * 0.5],
      [cx + hw * 0.12, hy + hh * 0.62],
      [cx - hw * 0.18, hy + hh * 0.66],
      [cx - hw * 0.24, hy + hh * 1.0],
      [cx - hw * 0.7, hy + hh * 1.02]
    ];
    c.beginPath();
    spline(c, P, true);
    c.fill();

    /* ear */
    c.fillStyle = 'rgba(0,0,0,0.22)';
    c.beginPath();
    c.ellipse(cx - hw * 0.14, hy + hh * 0.13, hw * 0.1, hh * 0.13, -0.2, 0, 6.3);
    c.fill();

    /* hair — tilted cap with hard edge */
    c.fillStyle = m.hair;
    c.beginPath();
    c.moveTo(cx - hw * 0.66, hy - hh * 0.08);
    c.bezierCurveTo(cx - hw * 0.72, hy - hh * 0.5, cx - hw * 0.36, hy - hh * 0.78, cx + hw * 0.06, hy - hh * 0.72);
    c.bezierCurveTo(cx + hw * 0.34, hy - hh * 0.68, cx + hw * 0.46, hy - hh * 0.5, cx + hw * 0.44, hy - hh * 0.3);
    c.bezierCurveTo(cx + hw * 0.2, hy - hh * 0.46, cx - hw * 0.14, hy - hh * 0.44, cx - hw * 0.3, hy - hh * 0.26);
    c.bezierCurveTo(cx - hw * 0.42, hy - hh * 0.14, cx - hw * 0.5, hy - hh * 0.04, cx - hw * 0.52, hy + hh * 0.06);
    c.closePath();
    c.fill();

    /* brow / cheek shadow */
    c.fillStyle = 'rgba(0,0,0,0.30)';
    c.beginPath();
    c.ellipse(cx + hw * 0.24, hy - hh * 0.06, hw * 0.16, hh * 0.07, 0, 0, 6.3);
    c.fill();

    /* neck shadow */
    c.fillStyle = 'rgba(0,0,0,0.34)';
    c.beginPath();
    c.ellipse(cx - hw * 0.2, hy + hh * 0.68, hw * 0.34, hh * 0.12, 0, 0, Math.PI);
    c.fill();

    return { cx: cx, hy: hy, hw: hw, hh: hh, topY: topY };
  }

  /* ---------- height chart behind the line-up ---------- */
  function drawChart(c, x, topY, baseY, m) {
    c.save();
    c.strokeStyle = m.rule;
    c.fillStyle = m.rule;
    c.lineWidth = Math.max(1, (baseY - topY) * 0.0022);
    c.beginPath();
    c.moveTo(x, topY); c.lineTo(x, baseY); c.stroke();
    var steps = 6;
    var startIn = 2;
    for (var i = 0; i <= steps; i++) {
      var y = baseY - (baseY - topY) * (i / steps);
      c.beginPath();
      c.moveTo(x - 10, y); c.lineTo(x + 16, y); c.stroke();
      c.font = '600 ' + Math.round((baseY - topY) * 0.023) + 'px ui-monospace,Consolas,monospace';
      c.textAlign = 'right';
      c.fillText((startIn + i) + "'", x - 16, y + (baseY - topY) * 0.008);
      for (var j = 1; j < 6; j++) {
        var yy = y - (baseY - topY) * (j / (steps * 6));
        c.beginPath();
        c.moveTo(x, yy);
        c.lineTo(x + (j === 3 ? 12 : 7), yy);
        c.stroke();
      }
    }
    c.restore();
  }

  /* ---------- the black censorship bar ---------- */
  function drawCensorBar(c, x, y, w, h, accent) {
    c.save();
    c.fillStyle = '#0b0708';
    c.fillRect(x, y, w, h);
    c.strokeStyle = 'rgba(240,230,210,0.22)';
    c.lineWidth = 1;
    c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    var fs = Math.max(6, h * 0.4);
    c.font = '700 ' + fs + 'px ui-monospace,Consolas,monospace';
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(236,226,206,0.5)';
    var txt = 'PARENTAL ADVISORY  /  ';
    var tw = c.measureText(txt).width;
    var n = Math.min(24, Math.ceil(w / Math.max(1, tw)));
    for (var i = 0; i < n; i++) c.fillText(txt, x + i * tw, y + h * 0.52);
    c.fillStyle = accent;
    c.globalAlpha = 0.9;
    c.fillRect(x, y + h - Math.max(1, h * 0.06), w, Math.max(1, h * 0.06));
    c.restore();
  }

  /* ---------- the slate held at chest height ---------- */
  function drawSlate(c, cx, y, w, h, no, dateStr, m) {
    c.save();
    c.translate(cx, y);
    c.rotate(-0.028);
    c.fillStyle = '#100c0a';
    c.fillRect(-w / 2, -h / 2, w, h);
    c.strokeStyle = 'rgba(238,228,208,0.5)';
    c.lineWidth = Math.max(1, h * 0.02);
    c.strokeRect(-w / 2 + h * 0.05, -h / 2 + h * 0.05, w - h * 0.1, h - h * 0.1);
    c.fillStyle = 'rgba(240,232,214,0.9)';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = '700 ' + Math.round(h * 0.2) + 'px ui-monospace,Consolas,monospace';
    c.fillText('BKG ' + no, 0, -h * 0.24);
    c.font = '600 ' + Math.round(h * 0.135) + 'px ui-monospace,Consolas,monospace';
    c.fillStyle = 'rgba(240,232,214,0.62)';
    c.fillText(dateStr, 0, h * 0.02);
    c.fillStyle = m.hot;
    c.fillRect(-w * 0.3, h * 0.22, w * 0.6, h * 0.03);
    c.restore();
  }

  function dateStr(seed) {
    var s = Math.abs(seed || 3);
    return pad2(1 + (s % 12)) + '.' + pad2(1 + ((s >> 4) % 28)) + '.' + (1988 + (s % 30));
  }

  function buildPortrait() {
    var w = W, h = H;
    if (!(w > 8) || !(h > 8)) { w = W = 1440; h = H = 900; }
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    por.width = Math.round(w * DPR);
    por.height = Math.round(h * DPR);
    var c = por.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);

    seeded = (Math.abs(ST.seed || 11) % 99991) + 7;

    var acc = ST.accent;
    var pap = [Math.min(255, 226 * 0.55 + acc[0] * 0.16 + 74),
               Math.min(255, 214 * 0.55 + acc[1] * 0.16 + 74),
               Math.min(255, 194 * 0.55 + acc[2] * 0.16 + 74)];
    var m = {
      paper: mix(pap, [255, 250, 238], 0.18),
      paperDk: mix(pap, [60, 44, 30], 0.35),
      skin: mix(pap, [86, 60, 44], 0.62),
      hair: mix([20, 14, 12], pap, 0.06),
      rule: mix(pap, [30, 22, 16], 0.72),
      hot: 'rgba(' + acc[0] + ',' + acc[1] + ',' + acc[2] + ',0.9)'
    };

    /* paper base */
    var g0 = c.createLinearGradient(0, 0, w * 0.5, h);
    g0.addColorStop(0, m.paper);
    g0.addColorStop(0.55, m.paper);
    g0.addColorStop(1, m.paperDk);
    c.fillStyle = g0;
    c.fillRect(0, 0, w, h);

    /* two figures stand on one floor line */
    var baseY = h * 0.985;
    var hf1 = Math.min(h * 0.98, w * 1.5);
    var topY1 = baseY - hf1;
    var narrow = w < h * 0.78;

    var fx1 = narrow ? w * 0.40 : w * 0.335;
    var fx2 = narrow ? w * 0.885 : w * 0.735;

    /* height chart */
    drawChart(c, narrow ? w * 0.16 : w * 0.055, topY1 + hf1 * 0.02, baseY, m);

    /* profile first (behind), then front */
    var p2 = drawProfile(c, fx2, topY1 + hf1 * 0.10, hf1 * 0.82, mix(m.skin, m.paper, 0.42), m);
    var p1 = drawFront(c, fx1, topY1 + hf1 * 0.04, hf1 * 0.92, m.skin, m);

    /* halftone / xerox dots over the whole plate */
    c.save();
    c.globalAlpha = 0.10;
    c.fillStyle = '#1a1008';
    var step = 4;
    for (var yy = 0; yy < h; yy += step) {
      for (var xx = ((yy / step) % 2) * (step / 2); xx < w; xx += step) {
        c.fillRect(xx, yy, 1.1, 1.1);
      }
    }
    c.restore();

    /* a horizontal head-height rule — the mugshot's signature line */
    c.save();
    c.strokeStyle = m.rule;
    c.globalAlpha = 0.5;
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(w * 0.02, p1.hy - p1.hh * 0.72);
    c.lineTo(w * 0.98, p1.hy - p1.hh * 0.72);
    c.stroke();
    c.restore();

    /* eyes of the front subject: the censorship bar is drawn live, on the fx layer */
    var barY = p1.hy + p1.hh * 0.005, barH = p1.hh * 0.115;
    var barW = p1.hw * 1.24;
    ST.bar = { x: p1.cx - barW * 0.5, y: barY - barH * 0.5, w: barW, h: barH };

    /* profile: keep the eyes, they read as the second booking angle */
    c.save();
    c.strokeStyle = 'rgba(10,7,6,0.75)';
    c.lineWidth = Math.max(1.4, p2.hh * 0.03);
    c.beginPath();
    c.moveTo(p2.cx + p2.hw * 0.3, p2.hy - p2.hh * 0.05);
    c.lineTo(p2.cx + p2.hw * 0.45, p2.hy - p2.hh * 0.05);
    c.stroke();
    c.restore();

    /* booking slate in front of the chest */
    drawSlate(c, p1.cx, p1.shY + (p1.baseY - p1.shY) * 0.42, p1.hw * 1.35, p1.hh * 0.62, ST.no || '000000', dateStr(ST.seed), m);

    /* fold crease + bottom shadow */
    var g2 = c.createLinearGradient(0, h * 0.55, 0, h);
    g2.addColorStop(0, 'rgba(40,26,16,0)');
    g2.addColorStop(1, 'rgba(40,26,16,0.42)');
    c.fillStyle = g2;
    c.fillRect(0, h * 0.55, w, h * 0.45);

    c.strokeStyle = 'rgba(255,250,236,0.22)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(0, h * 0.53); c.lineTo(w, h * 0.53 + h * 0.01);
    c.stroke();

    /* corner registration marks */
    c.save();
    c.strokeStyle = 'rgba(28,20,14,0.55)';
    c.lineWidth = 1.4;
    var k = Math.min(w, h) * 0.042;
    [[w * 0.045, h * 0.05, 1, 1], [w * 0.955, h * 0.05, -1, 1],
     [w * 0.045, h * 0.95, 1, -1], [w * 0.955, h * 0.95, -1, -1]].forEach(function (q) {
      c.beginPath();
      c.moveTo(q[0] + k * q[2], q[1]);
      c.lineTo(q[0], q[1]);
      c.lineTo(q[0], q[1] + k * q[3]);
      c.stroke();
    });
    c.restore();

    /* vignette */
    var vg = c.createRadialGradient(w * 0.5, h * 0.44, Math.min(w, h) * 0.22, w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(8,5,4,0.72)');
    c.fillStyle = vg;
    c.fillRect(0, 0, w, h);
  }

  /* ---------- per-frame film layer ---------- */
  function drawFilm(time, dt) {
    var w = W, h = H;
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.clearRect(0, 0, w, h);

    /* grain */
    var gn = ST.rm ? 40 : 130;
    for (var i = 0; i < gn; i++) {
      var x = rnd() * w, y = rnd() * h;
      fctx.fillStyle = 'rgba(' + (rnd() > 0.5 ? '255,248,232' : '10,6,4') + ',' + (0.03 + rnd() * 0.06).toFixed(3) + ')';
      fctx.fillRect(x, y, 1.4, 1.4);
    }

    /* slow scan band */
    if (!ST.rm) {
      var period = 7200;
      var p = (time % period) / period;
      var by = (p * 1.35 - 0.2) * h;
      var bh = h * 0.075;
      var bg = fctx.createLinearGradient(0, by - bh, 0, by + bh);
      bg.addColorStop(0, 'rgba(255,246,226,0)');
      bg.addColorStop(0.5, 'rgba(255,246,226,0.055)');
      bg.addColorStop(1, 'rgba(255,246,226,0)');
      fctx.fillStyle = bg;
      fctx.fillRect(0, by - bh, w, bh * 2);
    }

    /* the censorship bar lives here: it flickers wider with the bass */
    var B = ST.bar;
    if (B) {
      var grow = ST.rm ? 0 : vis.bass * 0.05 + beat.level * 0.035;
      drawCensorBar(fctx, B.x - B.w * grow * 0.5, B.y, B.w * (1 + grow), B.h,
        'rgba(' + ST.accent[0] + ',' + ST.accent[1] + ',' + ST.accent[2] + ',0.85)');
    }

    /* exposure flash on the beat */
    if (beat.flash > 0.001) {
      fctx.fillStyle = 'rgba(255,246,230,' + (beat.flash * 0.16).toFixed(3) + ')';
      fctx.fillRect(0, 0, w, h);
    }
  }

  /* ---------- loop ---------- */
  function relayout() {
    var w = $pane.clientWidth || 0, h = $pane.clientHeight || 0;
    if (!(w > 8) || !(h > 8)) { w = 1440; h = 900; }
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = w; H = h;
    $photo.width = Math.round(w * DPR);
    $photo.height = Math.round(h * DPR);
    $fx.width = Math.round(w * DPR);
    $fx.height = Math.round(h * DPR);
    pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pctx.imageSmoothingEnabled = true;
    buildPortrait();
    paintPlate(1);
    try { if (ST.lines.length) fitLine(); } catch (e) { console.error('[fit]', e); }
  }

  function paintPlate(scale) {
    if (!por.width || !por.height) return;
    pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pctx.clearRect(0, 0, W, H);
    var s = scale || 1;
    pctx.save();
    pctx.translate(W * 0.5, H * 0.5);
    pctx.scale(s, s);
    pctx.drawImage(por, -W * 0.5, -H * 0.5, W, H);
    pctx.restore();
  }

  var lastTs = 0;
  function frame(ts) {
    var t0 = performance.now();
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;

    /* continuous state */
    beat.level = ease(beat.level, 0, ST.rm ? 0.2 : 0.14);
    beat.flash = Math.max(0, (beat.flash || 0) - dt * (ST.rm ? 4 : 2.6));
    vis.bass = ease(vis.bass, vis.bass * 0.94, 0.1);

    if (ST.rebuild) {
      ST.rebuild = false;
      try { buildPortrait(); paintPlate(1); } catch (e) { console.error('[rebuild]', e); }
    }

    var idx = indexAt(ST.t);
    if (idx !== ST.idx) {
      ST.idx = idx;
      render();
      ST.lens = 1;
    } else if (ST.lines.length) {
      render();
    }
    ST.lens = ease(ST.lens || 1, 1, 0.14);
    if (ST.lens < 1.004) ST.lens = 1;
    if (ST.lens !== ST.paintedLens) {
      paintPlate(ST.lens);
      ST.paintedLens = ST.lens;
    }

    drawFilm(ts / 1000, dt);
    ST.frames++;
    ST.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('message', onMsg);
  var rzT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () {
      try { relayout(); } catch (e) { console.error('[resize]', e); }
    }, 140);
  });
  window.addEventListener('error', function (e) { console.error('[window error]', e && e.message); });

  try {
    ST.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { ST.rm = false; }

  /* ready goes out in the very first rAF, unconditionally, before any heavy work */
  requestAnimationFrame(function () {
    sendReady();
    requestAnimationFrame(function (ts) {
      try { relayout(); } catch (e) { console.error('[first paint]', e); }
      try { frame(ts); } catch (e) { console.error('[loop]', e); }
    });
  });
  setTimeout(sendReady, 700);
  /* if the first paint never happened (0-size pane at mount), catch up */
  setTimeout(function () {
    try { if (!W || !por.width) relayout(); } catch (e) { console.error('[late paint]', e); }
  }, 420);
})();
</script>
</body>
</html>
