<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漂浮画廊</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(150,158,190,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
  body{background:
    radial-gradient(120% 80% at 50% 0%,rgba(90,110,220,.10),rgba(0,0,0,0) 60%),
    #05060a}
  #wall{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
        overscroll-behavior:contain}
  #wall::-webkit-scrollbar{width:0;height:0}
  /* 画框用 mask 从两端淡出 —— 复刻参考文件每行的渐变遮罩 */
  #grid{display:grid;gap:clamp(14px,2vw,30px);width:min(95vw,1180px);margin:0 auto;
        padding:26vh 0 30vh}
  .frame{position:relative;border-radius:4px;padding:5px 5px 0;
         border:1px solid rgba(255,255,255,.10);
         background:linear-gradient(170deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
         box-shadow:0 18px 34px -20px #000;
         will-change:transform;
         transition:border-color .45s ease,box-shadow .45s ease,opacity .45s ease}
  .frame::after{content:"";position:absolute;inset:5px 5px 30px;pointer-events:none;
         box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .art{position:relative;aspect-ratio:4/5;overflow:hidden;background:#0d0f16;
       border-radius:2px}
  /* 画：参考文件的八种构图，这里每一种都只用一层渐变 + 一个几何体 */
  .art .sun{position:absolute;left:52%;top:16%;width:34%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 40% 38%,#fff6d8,rgba(var(--ac),.9) 48%,rgba(var(--ac),.35) 78%);
    box-shadow:0 0 28px rgba(var(--ac),.55)}
  .art .hill{position:absolute;left:-18%;bottom:-9%;width:132%;height:36%;border-radius:50% 50% 0 0/100% 100% 0 0;
    background:rgba(255,255,255,.05)}
  .art .hill.b{left:-52%;bottom:-11%;width:128%;height:30%;background:rgba(0,0,0,.4)}
  .art .arch{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);
    border-radius:50% 50% 0 0;border:1px solid rgba(var(--ac),.45);
    background:linear-gradient(180deg,transparent 60%,rgba(var(--ac),.07))}
  .art .arch.a{width:84%;height:80%;opacity:.32}
  .art .arch.b{width:60%;height:61%;opacity:.55}
  .art .arch.c{width:36%;height:41%;opacity:.9;border-width:2px}
  .art .disc{position:absolute;left:22%;top:18%;width:54%;aspect-ratio:1;border-radius:50%;
    background:rgba(255,255,255,.82);mix-blend-mode:screen}
  .art .bar2{position:absolute;left:62%;bottom:0;width:9%;height:48%;background:rgba(0,0,0,.55)}
  .art .core{position:absolute;left:28%;top:27%;width:44%;aspect-ratio:1;border-radius:50%;
    background:#05060a;box-shadow:inset -8px 0 20px rgba(255,255,255,.06)}
  .art .ring{position:absolute;left:24%;top:23%;width:52%;aspect-ratio:1;border-radius:50%;
    box-shadow:0 0 2px 1px rgba(var(--ac),.9),0 0 38px 4px rgba(var(--ac),.38)}
  .art .beam{position:absolute;inset:-20%;
    background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);
    mix-blend-mode:screen}
  .art .tri{position:absolute;left:20%;top:26%;width:62%;height:52%;clip-path:polygon(50% 0,100% 100%,0 100%);
    background:linear-gradient(180deg,rgba(9,11,18,.92),rgba(9,11,18,.35))}
  .art .grid2{position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 14%),
               repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 14%)}
  .art .blk{position:absolute;background:rgba(var(--ac),.75);box-shadow:0 0 16px rgba(var(--ac),.35)}
  .art .blk.a{left:15%;top:18%;width:22%;height:22%}
  .art .blk.b{left:52%;top:31%;width:13%;height:13%;opacity:.35}
  .art .blk.c{left:66%;top:64%;width:24%;height:13%;opacity:.55}
  .art .orb{position:absolute;left:41.5%;top:40%;width:17%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 38% 35%,#fff,rgba(var(--ac),.85) 45%,transparent 72%);
    box-shadow:0 0 30px rgba(var(--ac),.6)}
  .art.w1{background:linear-gradient(180deg,#101a2e,rgba(var(--ac),.42) 54%,#0b1220)}
  .art.w2{background:radial-gradient(130% 110% at 50% 112%,rgba(var(--ac),.35),#0a0d16)}
  .art.w3{background:linear-gradient(180deg,#0d1224,#070a12)}
  .art.w4{background:linear-gradient(90deg,rgba(var(--ac),.55) 0 51%,rgba(var(--ac),.22) 51% 100%)}
  .art.w5{background:radial-gradient(120% 120% at 50% 45%,rgba(var(--ac),.20),#06070b 72%)}
  .art.w6{background:conic-gradient(from 210deg at 60% 42%,rgba(var(--ac),.30),rgba(var(--ac),.7),rgba(var(--ac),.18),rgba(var(--ac),.26))}
  .art.w7{background:linear-gradient(150deg,rgba(var(--ac),.22),#080b12)}
  .art.w8{background:repeating-radial-gradient(circle at 50% 48%,rgba(var(--ac),.22) 0 1px,transparent 1px 7.5%),
                   radial-gradient(90% 90% at 50% 48%,rgba(var(--ac),.35),#070a10 70%)}
  .cap{display:flex;align-items:baseline;justify-content:space-between;gap:6px;
       padding:7px 3px 8px;font:500 9px/1.2 ui-monospace,Consolas,monospace;
       letter-spacing:.07em;color:rgba(228,232,248,.40);white-space:nowrap;overflow:hidden}
  .cap b{font-weight:600;font-size:10px;letter-spacing:.05em;color:rgba(240,242,252,.72);
         overflow:hidden;text-overflow:ellipsis}
  /* 正在唱的那张：抬起来 + 暖色描边 + 外发光（参考文件的 :hover） */
  .frame.live{border-color:rgba(var(--ac),.75);
    box-shadow:0 34px 58px -22px #000,0 0 46px -8px rgba(var(--ac),.75);z-index:9}
  .frame.live .cap b{color:#fff}
  .frame.dim{opacity:.42}
  /* 画框标题：两行截断（原单行 nowrap 对 41 字会溢出画框） */
  .cap{white-space:normal;display:block}
  .cap b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;text-overflow:ellipsis;white-space:normal;max-height:2.4em}
  .cap span{float:right}
  /* ---- 聚焦句牌：当前句整句在这里完整展示（镜头下方居中） ---- */
  #plate{position:fixed;left:50%;bottom:4.2vh;transform:translateX(-50%);
    z-index:30;max-width:min(78vw,980px);padding:14px 30px 16px;text-align:center;
    border-radius:14px;pointer-events:none;
    background:linear-gradient(165deg,rgba(16,19,32,.92),rgba(8,10,18,.86));
    border:1px solid rgba(var(--ac),.28);
    box-shadow:0 24px 54px -20px #000,inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0;transition:opacity .38s ease,box-shadow .3s ease}
  #plate.show{opacity:1}
  #plate.pulse{box-shadow:0 24px 54px -20px #000,0 0 44px -6px rgba(var(--ac),.65),
    inset 0 1px 0 rgba(255,255,255,.05)}
  #plate .t{display:block;font-weight:800;line-height:1.4;letter-spacing:.02em;
    color:#f2f5ff;margin:0}
  /* 未唱的字：暗底常显（整句任何时刻都完整可读），唱到即点亮增辉 */
  #plate .t .ch{display:inline-block;opacity:.16;
    transition:opacity .16s ease,transform .22s cubic-bezier(.2,.9,.3,1.15);
    transform:translateY(20%)}
  #plate .t .ch.on{opacity:1;transform:none;color:#fff;
    text-shadow:0 0 18px rgba(var(--ac),.75)}
  #plate .m{display:block;margin-top:6px;font:600 9px/1 ui-monospace,Consolas,monospace;
    letter-spacing:.3em;color:rgba(200,208,235,.38)}
  /* 落点视差：每张卡按自己的深度上下浮，鼠标横向移动时整墙相干地偏转 */
  #grid{transform-style:preserve-3d}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="wall"><div id="grid"></div></div>
<div id="plate"><span class="t" id="plateT"></span><span class="m" id="plateM">NOW SINGING</span></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ===========================================================================
   037 · 漂浮画廊 —— 一句词是一幅挂在墙上的画，画框自己在缓缓漂
   ---------------------------------------------------------------------------
   核心机制：**按深度分层的漂浮 + 落点视差**。
   参考文件是一面画廊墙：每幅画是一小块构图（渐变 + 一个几何体），
   整行以不同速度横向流动，悬停时那一幅抬起来、亮起来。
   这里把"画廊"整面立起来，画不再横向跑，而是**各自在原地慢慢漂**：
     · 每幅画分到一个**深度 d**（按列 0→1），深度同时决定三件事：
       漂浮幅度、漂浮速度、以及鼠标横向移动时它偏转多少（视差）；
       于是鼠标一动，近的画走得远、远的画几乎不动，整面墙有厚度；
     · 正在唱的那句被"点亮"：抬起来、暖色描边、外发光，其余压暗 ——
       这就是参考文件 :hover 的那一下，只不过由**歌词进度**触发，不由鼠标；
     · 踩拍时所有画**同相**地一起往下沉一下（相干），不是各自乱漂。

   和已有 10 个的区别：001-010 都在动粒子，这里没有一粒粒子；
   和 036 的区别：036 动的是**朝向**（翻面），这里动的是**位置**（漂浮），
   而且 036 的信息藏在背面，这里的信息一直正面朝你，只是亮的先后不同。

   性能：每帧只写 N 个 translate3d（GPU 合成层），不触发重排；
   字形不采样，词是真的文字；视差只写一个 CSS 变量。

   精修记录：当前句从"画框小标题（长句溢出画框被裁，41 字只见一行）"升级为
   **镜头下方聚焦句牌**（当前句整句完整展示：自动折行 2~3 行、字号自适应、
   逐字 YRC 点亮 chars[k].t，无 chars 均分；画框标题改两行省略防溢出）；
   镜头跟随：当前句被 scrollIntoView 拉到中心外，句牌随 live 位置轻微偏移聚焦；
   beat 时全墙同相下沉 + 句牌辉光脉冲（相干）；accent 染句牌点亮色。
   分词：不使用。句牌整句折行展示、逐字时间已精确到字，分词没有收益。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
const wall = document.getElementById('wall');
const grid = document.getElementById('grid');
const plate = document.getElementById('plate');
const plateT = document.getElementById('plateT');
const plateM = document.getElementById('plateM');

let W = 0, H = 0, DPR = 1;
let accent = [255, 200, 130];
let lines = [];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ---- 画布背景层：慢漂星尘（accent 染色，beat 相干增亮；平时被墙盖住，四周透出） ---- */
let dust = null, dustSpr = null, beatGlow = 0;
function bakeDust() {
  let seed = 77701;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  dust = [];
  for (let i = 0; i < 80; i++) {
    dust.push({
      x: rnd() * W, y: rnd() * H, s: 1 + rnd() * 2.2,
      vy: 3 + rnd() * 8, vx: (rnd() - 0.5) * 6, a: 0.25 + rnd() * 0.55,
      ph: rnd() * 6.283, tw: 0.5 + rnd() * 1.1
    });
  }
  dustSpr = document.createElement('canvas');
  dustSpr.width = 64; dustSpr.height = 64;
  const g = dustSpr.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,0.95)');
  gr.addColorStop(0.35, 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',0.4)');
  gr.addColorStop(1, 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
}
function drawDust(dt, t0) {
  /* 深底 + 顶部 accent 冷光（复刻 body 原背景的 radial 氛围），星尘在其上漂 */
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
  const wg = ctx.createLinearGradient(0, 0, 0, H * 0.9);
  wg.addColorStop(0, 'rgba(' + Math.round(accent[0] * 0.28) + ',' + Math.round(accent[1] * 0.30) + ',' + Math.round(60 + accent[2] * 0.22) + ',0.55)');
  wg.addColorStop(0.55, 'rgba(' + Math.round(accent[0] * 0.10) + ',' + Math.round(accent[1] * 0.11) + ',28,0.22)');
  wg.addColorStop(1, 'rgba(4,5,10,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, W, H);
  if (!dust) return;
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < dust.length; i++) {
    const d = dust[i];
    d.y -= d.vy * dt; d.x += d.vx * dt;
    if (d.y < -8) { d.y = H + 6; d.x = Math.random() * W; }
    if (d.x < -8) d.x = W + 6; else if (d.x > W + 8) d.x = -6;
    const tw = 0.55 + 0.45 * Math.sin(t0 * d.tw + d.ph);
    const r = d.s * (1.6 + beatGlow * 1.2) * (0.5 + px * 0 + 1);
    ctx.globalAlpha = d.a * tw * (0.55 + beatGlow * 0.45);
    ctx.drawImage(dustSpr, d.x - r * 4, d.y - r * 4, r * 8, r * 8);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- 句牌：整句完整展示 + YRC 逐字点亮（chars[k].t；无 chars 均分） ---- */
const plateChs = [];
let plateCt = [];
let plateLit = -1, curYrc = false;
let pulseTimer = 0;

/* 折行：≤12 字单行，≤26 两行，否则三行；标点/空格优先断；字号随最长行与高度自适应 */
function plateWrap(txt) {
  const n = txt.length;
  const maxRows = n <= 12 ? 1 : n <= 26 ? 2 : 3;
  const rows = [];
  if (maxRows === 1) rows.push(txt);
  else {
    let start = 0;
    for (let r = 1; r <= maxRows; r++) {
      const ideal = Math.round((n * r) / maxRows);
      let b = ideal, bd = 1e9;
      for (let i = Math.max(start + 2, ideal - 6); i <= Math.min(n - 2, ideal + 6); i++) {
        const c = txt[i - 1];
        if (c === ' ' || /[，。！？、；：…—,.!?;:]/.test(c)) {
          const d = Math.abs(i - ideal);
          if (d < bd) { bd = d; b = i; }
        }
      }
      b = Math.min(n - (maxRows - r), Math.max(start + 1, b));
      rows.push(txt.slice(start, b));
      start = b;
      if (start >= n) break;
    }
    if (start < n) rows.push(txt.slice(start));
  }
  return rows;
}

function plateBuild(L) {
  plateT.textContent = '';
  plateChs.length = 0; plateCt = [];
  plateLit = -1;
  const txt = L ? (L.text || '') : '';
  if (!txt) { plate.classList.remove('show'); return; }
  const rows = plateWrap(txt);
  const n = txt.length;
  let ok = !!(L.chars && L.chars.length === n);
  const ct = new Array(n);
  if (ok) {
    for (let k = 0; k < n; k++) {
      const v = +L.chars[k].t;
      if (!isFinite(v)) { ok = false; break; }
      ct[k] = v;
    }
  }
  if (!ok) {
    const dur = L.dur > 0 ? L.dur : 4;
    for (let k = 0; k < n; k++) ct[k] = L.t + dur * k / Math.max(1, n);
  }
  for (let k = 1; k < n; k++) if (ct[k] < ct[k - 1]) ct[k] = ct[k - 1];
  plateCt = ct;
  curYrc = ok;
  /* 字号：按行数与最长行自适应，保证整牌落在 max-width 内、高度 ≤ 34vh */
  const probe = document.createElement('canvas').getContext('2d');
  let F = 44;
  probe.font = '800 ' + F + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  let wMax = 0;
  for (const r of rows) wMax = Math.max(wMax, probe.measureText(r).width);
  const availW = Math.min(W * 0.78, 980) - 60;
  if (wMax > availW) F = F * (availW / wMax);
  F = Math.min(F, (H * 0.30) / (rows.length * 1.4));
  plateT.style.fontSize = Math.max(16, Math.min(46, F)).toFixed(1) + 'px';
  let gi = 0;
  for (let r = 0; r < rows.length; r++) {
    if (r > 0) plateT.appendChild(document.createElement('br'));
    for (let k = 0; k < rows[r].length; k++) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = rows[r][k];
      plateT.appendChild(s);
      plateChs.push(s);
      gi++;
    }
  }
  plate.classList.add('show');
}

function plateUpdate(T) {
  if (!plateChs.length) return;
  let nl = -1;
  while (nl + 1 < plateCt.length && plateCt[nl + 1] <= T) nl++;
  if (nl === plateLit) return;
  if (nl < plateLit) {
    for (let i = nl + 1; i < plateChs.length; i++) plateChs[i].classList.remove('on');
  } else {
    for (let i = plateLit + 1; i <= nl; i++) plateChs[i].classList.add('on');
  }
  plateLit = nl;
}

const frames = [];
let live = -1;
let sink = 0;

/* 参考文件的八种构图；每种都只有"一层底 + 一个几何体" */
const ART = [
  function (a) { return '<i class="sun"></i><i class="hill"></i><i class="hill b"></i>'; },
  function (a) { return '<i class="arch a"></i><i class="arch b"></i><i class="arch c"></i>'; },
  function (a) { return '<i class="ring"></i><i class="core"></i>'; },
  function (a) { return '<i class="disc"></i><i class="bar2"></i>'; },
  function (a) { return '<i class="beam"></i><i class="tri"></i>'; },
  function (a) { return '<i class="grid2"></i><i class="blk a"></i><i class="blk b"></i><i class="blk c"></i>'; },
  function (a) { return '<i class="orb"></i>'; },
  function (a) { return '<i class="sun"></i><i class="beam"></i>'; }
];

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* 列宽固定 → 列数随宽度变；每列一个深度 */
function colWidth() { return clamp(Math.min(W, H) * 0.20, 132, 226); }
function cols() {
  const cw = colWidth();
  return clamp(Math.round((Math.min(W * 0.95, 1180) + 26) / (cw + 26)), 2, 6);
}

function build() {
  fit();
  bakeDust();
  const cw = colWidth();
  const nc = cols();
  grid.textContent = '';
  frames.length = 0;
  live = -1;
  grid.style.gridTemplateColumns = 'repeat(' + nc + ',1fr)';
  grid.style.gridAutoRows = (cw * 1.25 + 34).toFixed(0) + 'px';
  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i].text || '';
    const col = i % nc;
    const d = nc > 1 ? col / (nc - 1) : 0.5;      // 深度 0（远）→ 1（近）
    const fr = document.createElement('div');
    fr.className = 'frame';
    fr.style.setProperty('--ac', accent[0] + ',' + accent[1] + ',' + accent[2]);
    fr.style.opacity = (0.44 + d * 0.30).toFixed(2);
    const art = document.createElement('div');
    art.className = 'art w' + (1 + ((i * 3 + col) % 8));
    art.innerHTML = ART[(i * 5 + col * 3) % 8]();
    const cap = document.createElement('div');
    cap.className = 'cap';
    const b = document.createElement('b');
    b.textContent = txt;
    const sp = document.createElement('span');
    sp.textContent = ('0' + (i + 1)).slice(-2);
    cap.appendChild(b); cap.appendChild(sp);
    fr.appendChild(art); fr.appendChild(cap);
    grid.appendChild(fr);
    frames.push({
      el: fr, t: lines[i].t, dur: lines[i].dur || 0,
      d: d, ph: (i * 2.399963) % 6.283185,
      amp: 4 + d * 13, spd: 0.17 + d * 0.30
    });
  }
}

/* 鼠标 → 整面墙的相干偏转（参考文件的逐张 hover，升级成整墙视差） */
let mx = 0, my = 0, tx = 0, ty = 0, px = 0, py = 0;
addEventListener('pointermove', (e) => {
  mx = e.clientX; my = e.clientY;
  tx = (mx / Math.max(1, W) - 0.5) * 2;
  ty = (my / Math.max(1, H) - 0.5) * 2;
}, { passive: true });

/* ---- 节奏 ---- */
let curIdx = -1, brewIdx = -1, lastT = -1;
const LEAD = 1.3;
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1;
    for (let i = 0; i < frames.length; i++) frames[i].el.classList.remove('live', 'dim');
    live = -1;
  }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    for (let i = 0; i < frames.length; i++) frames[i].el.classList.remove('live');
    live = ci;
    if (ci >= 0 && frames[ci]) {
      frames[ci].el.classList.add('live');
      for (let i = 0; i < frames.length; i++) {
        if (i !== ci) frames[i].el.classList.add('dim');
      }
      /* 句牌换句：先亮下一句的牌（提前 LEAD 进场不与上一句重叠——上一句画面已退） */
      plateBuild(lines[ci]);
      try { frames[ci].el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
    } else {
      plateBuild(null);
      for (let i = 0; i < frames.length; i++) frames[i].el.classList.remove('dim');
    }
    hint.style.opacity = lines.length ? (ci >= 0 ? '0' : '1') : '0.5';
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) brewIdx = nx;
  }
}

let last = performance.now();
let t0 = 0;
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();
  timing(T);
  plateUpdate(T);

  const k = 1 - Math.exp(-dt * 4.2);
  px += (tx - px) * k; py += (ty - py) * k;
  sink *= Math.pow(0.02, dt);
  beatGlow *= Math.pow(0.03, dt);
  drawDust(dt, t0);

  for (let i = 0; i < frames.length; i++) {
    const f = frames[i];
    /* 画框的"绝对"位置：视差随深度放大，近的画被鼠标带得更远 */
    const tX = -px * (6 + f.d * 30);
    const tY = -py * (4 + f.d * 16) + Math.sin(t0 * f.spd + f.ph) * f.amp + sink;
    const rY = px * (1.4 + f.d * 5.2);
    const rX = -py * (0.8 + f.d * 2.4);
    f.el.style.transform =
      'translate3d(' + tX.toFixed(2) + 'px,' + tY.toFixed(2) + 'px,0)' +
      ' rotateY(' + rY.toFixed(2) + 'deg) rotateX(' + rX.toFixed(2) + 'deg)' +
      (i === live ? ' translateZ(46px) scale(1.045)' : '');
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1;
    if (p.accent && p.accent.length === 3) {
      accent = [p.accent[0] | 0, p.accent[1] | 0, p.accent[2] | 0];
      document.documentElement.style.setProperty('--ac', accent.join(','));
    }
    live = -1; sink = 0; beatGlow = 0;
    plateBuild(null);
    build();
    clockT = 0; clockAt = performance.now(); playing = false;
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 相干：所有画同相地一起沉一下，再弹回来；句牌与星尘同相脉冲 */
    const lv = d.payload && d.payload.level ? d.payload.level : 0.5;
    sink = 9 + 15 * lv;
    beatGlow = Math.min(1.2, beatGlow + 0.5 + lv * 0.6);
    plate.classList.add('pulse');
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(() => plate.classList.remove('pulse'), 190);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

addEventListener('resize', () => { fit(); build(); if (curIdx >= 0 && lines[curIdx]) plateBuild(lines[curIdx]); });

window.__stage = () => ({
  lines: lines.length, cur: curIdx, brew: brewIdx, live: live,
  yrc: curYrc, plateLit: plateLit + 1, plateN: plateChs.length,
  t: +now().toFixed(2), frames: frames.length, cols: cols(),
  par: [+px.toFixed(3), +py.toFixed(3)], sink: +sink.toFixed(2)
});
</script>
</body>
</html>
