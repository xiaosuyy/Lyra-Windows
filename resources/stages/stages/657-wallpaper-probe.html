<!-- 657 —— 壁纸背景接入实验：WE 探测 / 屏幕捕获 / 本地媒体 / 降级背景 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>657 — 壁纸背景接入实验</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff}
  #bg,#fg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:0}
  #fg{z-index:2;pointer-events:none}
  #scrim{position:fixed;inset:0;z-index:1;pointer-events:none}
  #capVideo,#localVideo{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

  #hud{
    position:fixed;left:18px;top:18px;z-index:5;width:min(370px,45vw);
    padding:10px 12px 9px;border:1px solid rgba(255,255,255,.15);border-radius:10px;
    background:rgba(7,10,17,.76);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 10px 34px rgba(0,0,0,.38);
    font-family:ui-monospace,Consolas,"SFMono-Regular",Menlo,monospace;
    font-size:clamp(10px,0.82vmin + 5.2px,12.5px);line-height:1.55;color:#dbe4f5;
    pointer-events:none;transition:opacity .22s ease;user-select:none
  }
  #hud.hidden{opacity:0}
  .hud__head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .hud__title{font-size:1.04em;letter-spacing:.02em;color:#f0f4ff;font-weight:600}
  .badge{
    flex:0 0 auto;padding:1px 7px;border-radius:999px;font-size:.86em;font-weight:700;letter-spacing:.05em;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#dfe7f7
  }
  .badge--we{color:#d7c2ff;border-color:rgba(178,136,255,.55);background:rgba(112,68,200,.2)}
  .badge--capture{color:#a9ffd6;border-color:rgba(72,232,160,.55);background:rgba(20,140,90,.22)}
  .badge--local{color:#bfe3ff;border-color:rgba(92,182,255,.55);background:rgba(30,102,170,.22)}
  .badge--fallback{color:#ffdda8;border-color:rgba(238,180,84,.55);background:rgba(150,96,20,.22)}
  .row{display:grid;grid-template-columns:74px 1fr;gap:7px;align-items:baseline;margin:1px 0}
  .row .k{color:#8f9bb2;letter-spacing:.04em;white-space:nowrap}
  .row .v{display:flex;align-items:baseline;gap:6px;min-width:0;color:#dbe4f5}
  .row .v b{font-weight:500;overflow-wrap:anywhere}
  .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#5a6478;transform:translateY(-1px)}
  .dot--ok{background:#4ee6a0;box-shadow:0 0 7px rgba(78,230,160,.6)}
  .dot--warn{background:#f2c14e;box-shadow:0 0 7px rgba(242,193,78,.55)}
  .dot--err{background:#ff6f7d;box-shadow:0 0 7px rgba(255,111,125,.55)}
  .hud__reason{
    margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1);
    color:#c8d3e6;overflow-wrap:anywhere
  }
  .hud__reason b{color:#ffb3bb;font-weight:600}
  .hud__meta{margin-top:4px;color:#7f8ba1;font-size:.92em;overflow-wrap:anywhere}
  .hud__meta .ok{color:#7fe0b4}
  .hud__meta .no{color:#ff8f9a}

  #panel{
    position:fixed;right:16px;top:16px;z-index:6;width:min(266px,37vw);
    display:flex;flex-direction:column;gap:6px;padding:10px;
    border:1px solid rgba(255,255,255,.15);border-radius:10px;
    background:rgba(7,10,17,.76);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 10px 34px rgba(0,0,0,.38);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:clamp(10px,0.8vmin + 5px,12px);color:#dbe4f5;user-select:none
  }
  #panel.hidden{display:none}
  .prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .prow + .prow{margin-top:1px}
  .plabel{color:#8f9bb2;font-size:.92em;margin-right:1px}
  button,label.filebtn{
    appearance:none;border:1px solid rgba(255,255,255,.2);border-radius:7px;
    background:rgba(255,255,255,.08);color:#e8eefb;padding:4px 9px;cursor:pointer;
    font:inherit;line-height:1.3;white-space:nowrap;transition:background .15s,border-color .15s
  }
  button:hover,label.filebtn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.34)}
  button:disabled{opacity:.48;cursor:default}
  button.on{border-color:rgba(120,210,255,.65);background:rgba(60,140,210,.28);color:#dff4ff}
  button.danger{border-color:rgba(255,120,130,.5);background:rgba(160,40,55,.22)}
  #file{display:none}
  #dim{width:100%;accent-color:#7fc4ff;margin:2px 0 0;height:16px}
  .dimval{min-width:34px;text-align:right;color:#9fb0c9;font-variant-numeric:tabular-nums}
  .hint{color:#77839a;font-size:.9em;line-height:1.4;margin-top:2px}
  @media (max-width:760px){
    #hud{width:47vw;left:10px;top:10px;padding:8px 9px}
    #panel{width:40vw;right:10px;top:10px;padding:8px}
    .row{grid-template-columns:62px 1fr;gap:5px}
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="scrim"></div>
<canvas id="fg" aria-hidden="true"></canvas>
<video id="capVideo" muted playsinline autoplay></video>
<video id="localVideo" muted playsinline loop></video>

<div id="hud">
  <div class="hud__head">
    <span class="hud__title">657 · 壁纸背景探测</span>
    <span id="srcBadge" class="badge badge--fallback">FALLBACK</span>
  </div>
  <div class="row"><span class="k">1 WE-WEB</span><span class="v"><i id="weDot" class="dot"></i><b id="weVal">检测中…</b></span></div>
  <div class="row"><span class="k">2 CAPTURE</span><span class="v"><i id="capDot" class="dot"></i><b id="capVal">检测中…</b></span></div>
  <div class="row"><span class="k">3 LOCAL</span><span class="v"><i id="locDot" class="dot"></i><b id="locVal">未选择</b></span></div>
  <div class="row"><span class="k">4 FALLBACK</span><span class="v"><i id="fbDot" class="dot"></i><b id="fbVal">封面模糊 + 渐变 + 噪声</b></span></div>
  <div class="hud__reason">reason: <b id="reasonVal">初始化…</b></div>
  <div class="hud__meta" id="policyVal">display-capture 策略检测中…</div>
  <div class="hud__meta" id="statVal">fps — · js —</div>
  <div class="hud__meta">H 隐藏面板 · 1/2/3 遮罩 · B 毛玻璃</div>
</div>

<div id="panel">
  <div class="prow">
    <button id="capBtn" type="button" title="必须由这次点击触发 getDisplayMedia">屏幕捕获</button>
    <button id="stopBtn" type="button" class="danger" disabled>停止</button>
  </div>
  <div class="prow">
    <label class="filebtn" for="file">本地视频/图片</label>
    <input id="file" type="file" accept="video/*,image/*">
    <button id="clearBtn" type="button" disabled>清除本地</button>
  </div>
  <div class="prow">
    <span class="plabel">遮罩</span>
    <button type="button" data-dim="20">轻</button>
    <button type="button" data-dim="44">中</button>
    <button type="button" data-dim="68">重</button>
    <span id="dimVal" class="dimval">44%</span>
  </div>
  <div class="prow"><input id="dim" type="range" min="0" max="85" step="1" value="44" aria-label="遮罩浓度"></div>
  <div class="prow">
    <button id="glassBtn" type="button">毛玻璃：关</button>
    <button id="hudBtn" type="button" class="on">诊断：显示</button>
  </div>
  <div class="hint">捕获会弹出系统/Electron 授权；失败原因原样显示在左侧面板。</div>
</div>

<script>
"use strict";
(function () {

  /* ========== 0. 状态 ========== */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}
  var AC = [150, 165, 255];
  var DUR = 0;
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 };
  var songTitle = "", songArtist = "", coverUrl = "";
  var beatPulse = 0, lvSmooth = 0;
  var LREV = 0;

  var EXP = {
    we: false, weDetail: "检测中…", weProps: null, weAudio: "未注册",
    capture: "idle", captureDetail: "未尝试",
    local: "none", localDetail: "未选择",
    source: "FALLBACK"
  };

  /* ========== 1. 自检接口（__stage 恰好 10 字段） ========== */
  window.__stage = function () {
    var i = S.idx, L = S.lines, tx = "";
    if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
    return {
      lines: L.length, idx: i, t: S.t, playing: !!S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
      text: tx, gl: false, rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var n = (window.performance && performance.now()) || Date.now();
    if (n - lastErrAt > 1000) { lastErrAt = n; try { console.error(e); } catch (_) {} }
  }

  /* ========== 2. 画布 ========== */
  var bgCanvas = document.getElementById("bg");
  var fgCanvas = document.getElementById("fg");
  var bgCtx = bgCanvas.getContext("2d", { alpha: false });
  var fgCtx = fgCanvas.getContext("2d", { alpha: true });
  var measureCv = document.createElement("canvas");
  var measureCtx = measureCv.getContext("2d");
  var W = 1, H = 1, dpr = 1;

  var SERIF = '"Songti SC","Source Han Serif SC","Noto Serif SC","STSong","SimSun",Georgia,serif';
  var MONO = 'ui-monospace,Consolas,"SFMono-Regular",Menlo,monospace';
  var SANS = 'system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif';

  /* ========== 3. 工具 ========== */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rgba(a, al) { return "rgba(" + a[0] + "," + a[1] + "," + a[2] + "," + al + ")"; }
  function fmtTime(t) {
    t = Math.max(0, t || 0);
    var m = Math.floor(t / 60), s = t - m * 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
  }
  function normAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return AC;
    var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return AC;
    r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
    if (r + g + b < 45) return AC;
    return [r, g, b];
  }
  function fontFor(fs) { return "400 " + fs.toFixed(1) + "px " + SERIF; }
  function mix(a, b, p) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * p),
      Math.round(a[1] + (b[1] - a[1]) * p),
      Math.round(a[2] + (b[2] - a[2]) * p)
    ];
  }

  /* ========== 4. WE-WEB：只探测，不伪造接入 ========== */
  function probeWE() {
    var regAudio = false, prop = false;
    try { regAudio = (typeof window.wallpaperRegisterAudioListener === "function"); } catch (e) {}
    try { prop = !!window.wallpaperPropertyListener; } catch (e) {}
    EXP.we = !!(regAudio || prop);
    if (!EXP.we) {
      EXP.weDetail = "无接口（wallpaperPropertyListener / wallpaperRegisterAudioListener 均不存在）";
      rechooseSource();
      return;
    }
    var which = [];
    if (prop) which.push("wallpaperPropertyListener");
    if (regAudio) which.push("wallpaperRegisterAudioListener");
    EXP.weDetail = "存在 · " + which.join(" + ");

    /* WE 宿主里页面自己定义 propertyListener 对象来接收 userProperties */
    if (regAudio || prop) {
      try {
        var prev = window.wallpaperPropertyListener;
        var obj = (prev && typeof prev === "object") ? prev : {};
        obj.applyUserProperties = function (props) {
          try {
            EXP.weProps = props || {};
            var keys = Object.keys(EXP.weProps);
            EXP.weDetail = "存在 · userProperties " + keys.length + " 项";
            var sc = EXP.weProps.schemecolor;
            if (typeof sc === "string") {
              var p = sc.trim().split(/\s+/).map(Number);
              if (p.length >= 3 && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2])) {
                AC = [clamp(Math.round(p[0] * 255), 0, 255), clamp(Math.round(p[1] * 255), 0, 255), clamp(Math.round(p[2] * 255), 0, 255)];
              }
            }
            updateHud();
          } catch (err) { logErr(err); }
        };
        window.wallpaperPropertyListener = obj;
      } catch (err) { logErr(err); }

      try {
        window.wallpaperRegisterAudioListener(function (arr) {
          try {
            if (!arr || !arr.length) return;
            var sum = 0;
            for (var i = 0; i < arr.length; i++) sum += Math.abs(Number(arr[i]) || 0);
            live.level = clamp(sum / arr.length * 1.7, 0, 1);
            EXP.weAudio = "已注册（" + arr.length + " bins）";
          } catch (err) { logErr(err); }
        });
        EXP.weAudio = "已注册";
      } catch (err) {
        EXP.weAudio = "注册失败：" + ((err && err.name) || "Error");
      }
    }
    rechooseSource();
  }

  /* ========== 5. 媒体层：屏幕捕获 ========== */
  var capVideo = document.getElementById("capVideo");
  var localVideo = document.getElementById("localVideo");
  var capState = { stream: null, res: "", req: 0 };
  var localState = { url: "", kind: "", name: "", img: null };
  var hasGDM = !!(navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === "function");

  function setSrcBadge() {
    var el = document.getElementById("srcBadge");
    if (!el) return;
    el.textContent = EXP.source;
    el.className = "badge badge--" + EXP.source.toLowerCase();
  }

  function rechooseSource() {
    if (EXP.capture === "live") EXP.source = "CAPTURE";
    else if (EXP.local.indexOf("ready") === 0) EXP.source = "LOCAL";
    else if (EXP.we) EXP.source = "WE";
    else EXP.source = "FALLBACK";
    setSrcBadge();
    updateHud();
  }

  function buildReason() {
    if (EXP.source === "CAPTURE") return "用户手动屏幕共享" + (capState.res ? " · " + capState.res : " · 等待首帧");
    if (EXP.source === "LOCAL") return "用户本地媒体 · " + (localState.name || EXP.localDetail);
    if (EXP.source === "WE") return "WE 宿主接口存在，但页面没有取壁纸帧的 API；画面仍用降级层绘制";
    var parts = [];
    parts.push("WE " + (EXP.we ? "有接口" : "无接口"));
    if (EXP.capture.indexOf("failed") === 0) parts.push("屏幕捕获 " + EXP.capture.slice(7));
    else if (EXP.capture === "idle") parts.push("屏幕捕获未尝试");
    else if (EXP.capture === "requesting") parts.push("屏幕捕获请求中");
    parts.push(EXP.local.indexOf("ready") === 0 ? "本地媒体已选" : "本地媒体未选");
    return parts.join("；") + "；背景 = 封面模糊 + accent 渐变 + 噪声";
  }

  function updateHud() {
    setSrcBadge();
    var weDot = document.getElementById("weDot"), weVal = document.getElementById("weVal");
    var capDot = document.getElementById("capDot"), capVal = document.getElementById("capVal");
    var locDot = document.getElementById("locDot"), locVal = document.getElementById("locVal");
    var fbDot = document.getElementById("fbDot"), fbVal = document.getElementById("fbVal");
    var reasonVal = document.getElementById("reasonVal");
    var policyVal = document.getElementById("policyVal");
    if (!weDot || !reasonVal) return;

    weDot.className = "dot " + (EXP.we ? "dot--ok" : "dot--err");
    weVal.textContent = EXP.weDetail;

    var capCls = EXP.capture.indexOf("failed") === 0 ? "dot--err" : (EXP.capture === "live" ? "dot--ok" : (EXP.capture === "requesting" ? "dot--warn" : ""));
    capDot.className = "dot " + capCls;
    if (EXP.capture === "live") capVal.textContent = "LIVE" + (capState.res ? " · " + capState.res : "") + " · 请求 30fps";
    else capVal.textContent = EXP.captureDetail;

    var locOk = EXP.local.indexOf("ready") === 0, locBad = EXP.local.indexOf("failed") === 0;
    locDot.className = "dot " + (locOk ? "dot--ok" : (locBad ? "dot--err" : ""));
    locVal.textContent = EXP.localDetail;

    fbDot.className = "dot " + (blurCv ? "dot--ok" : (coverReady ? "dot--err" : "dot--warn"));
    if (blurCv) fbVal.textContent = "封面已载入 · 重模糊 + accent 渐变 + 噪声";
    else if (coverReady) fbVal.textContent = "封面载入但无法绘制（" + (coverErr || "未知") + "）· accent 渐变 + 噪声";
    else if (coverUrl && !coverErr) fbVal.textContent = "封面加载中… · accent 渐变 + 噪声";
    else if (coverUrl) fbVal.textContent = "封面不可用（" + coverErr + "）· accent 渐变 + 噪声";
    else fbVal.textContent = "无封面 · accent 渐变 + 噪声";

    reasonVal.textContent = buildReason();

    var pol;
    try {
      if (document.permissionsPolicy && typeof document.permissionsPolicy.allowsFeature === "function") {
        pol = document.permissionsPolicy.allowsFeature("display-capture") ? "allowed" : "blocked";
      } else if (document.featurePolicy && typeof document.featurePolicy.allowsFeature === "function") {
        pol = document.featurePolicy.allowsFeature("display-capture") ? "allowed" : "blocked";
      } else {
        pol = "不可读";
      }
    } catch (err) { pol = "不可读"; }
    policyVal.innerHTML = "";
    var a = document.createElement("span");
    a.textContent = "display-capture: ";
    var b = document.createElement("span");
    b.className = (pol === "allowed") ? "ok" : (pol === "blocked" ? "no" : "");
    b.textContent = pol;
    var c = document.createElement("span");
    c.textContent = " · getDisplayMedia: " + (hasGDM ? "有" : "缺失");
    policyVal.appendChild(a); policyVal.appendChild(b); policyVal.appendChild(c);
  }

  /* ---- 屏幕捕获：只能由点击触发 ---- */
  function stopCapture(reason) {
    capState.req++;
    var had = !!capState.stream;
    if (capState.stream) {
      try {
        capState.stream.getTracks().forEach(function (tr) { try { tr.stop(); } catch (e) {} });
      } catch (e) {}
      capState.stream = null;
    }
    try { capVideo.srcObject = null; } catch (e) {}
    capState.res = "";
    if (had) {
      EXP.capture = "idle";
      EXP.captureDetail = "已停止" + (reason ? "（" + reason + "）" : "");
    } else if (EXP.capture === "requesting") {
      EXP.capture = "idle";
      EXP.captureDetail = "请求已取消" + (reason ? "（" + reason + "）" : "");
    }
    var btn = document.getElementById("capBtn");
    var stopBtn = document.getElementById("stopBtn");
    if (btn) { btn.disabled = false; btn.textContent = "屏幕捕获"; btn.className = ""; }
    if (stopBtn) stopBtn.disabled = true;
    rechooseSource();
  }

  function capFail(e) {
    var name = (e && e.name) || "Error";
    var msg = (e && e.message) || String(e || "未知错误");
    EXP.capture = "failed:" + name;
    EXP.captureDetail = "失败 · " + name + " — " + msg;
    var btn = document.getElementById("capBtn");
    var stopBtn = document.getElementById("stopBtn");
    if (btn) { btn.disabled = false; btn.textContent = "重试屏幕捕获"; btn.className = ""; }
    if (stopBtn) stopBtn.disabled = true;
    try { console.warn("[657] getDisplayMedia failed:", name, msg); } catch (_) {}
    rechooseSource();
  }

  function startCapture() {
    if (EXP.capture === "live") { stopCapture("手动停止"); return; }
    if (!hasGDM) {
      EXP.capture = "failed:NotSupported";
      EXP.captureDetail = "失败 · NotSupported — navigator.mediaDevices.getDisplayMedia 不存在";
      rechooseSource();
      return;
    }
    var btn = document.getElementById("capBtn");
    var stopBtn = document.getElementById("stopBtn");
    var myReq = ++capState.req;
    EXP.capture = "requesting";
    EXP.captureDetail = "请求中…（等待授权）";
    if (btn) { btn.disabled = true; btn.textContent = "请求中…"; }
    updateHud();

    var p;
    try {
      p = navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
    } catch (e) {
      capFail(e);
      return;
    }
    Promise.resolve(p).then(function (stream) {
      if (stopped || myReq !== capState.req) {
        try { stream.getTracks().forEach(function (tr) { try { tr.stop(); } catch (e) {} }); } catch (e) {}
        return;
      }
      try {
        capState.stream = stream;
        capVideo.srcObject = stream;
        var vt = stream.getVideoTracks()[0];
        if (vt) {
          vt.addEventListener("ended", function () { stopCapture("共享被系统/用户结束"); });
          var st = vt.getSettings ? vt.getSettings() : {};
          if (st.width && st.height) capState.res = st.width + "×" + st.height;
        }
        try { stream.addEventListener("inactive", function () { stopCapture("流已 inactive"); }); } catch (e) {}
        capVideo.onloadedmetadata = function () {
          if (capVideo.videoWidth) capState.res = capVideo.videoWidth + "×" + capVideo.videoHeight;
          updateHud();
        };
        var pr = capVideo.play();
        if (pr && pr.catch) pr.catch(function (e) { try { console.warn("[657] capture video.play:", e && e.name); } catch (_) {} });
        EXP.capture = "live";
        EXP.captureDetail = "LIVE" + (capState.res ? " · " + capState.res : "");
        if (btn) { btn.disabled = false; btn.textContent = "停止捕获"; btn.className = "danger"; }
        if (stopBtn) stopBtn.disabled = false;
        rechooseSource();
      } catch (e) {
        capFail(e);
      }
    }).catch(function (e) {
      if (stopped || myReq !== capState.req) return;
      capFail(e);
    });
  }


  /* ========== 6. 本地媒体（保底层） ========== */
  function revokeLocal() {
    if (localState.url) {
      try { URL.revokeObjectURL(localState.url); } catch (e) {}
      localState.url = "";
    }
    try { localVideo.pause(); } catch (e) {}
    try { localVideo.removeAttribute("src"); localVideo.load(); } catch (e) {}
    localState.img = null;
    localState.kind = "";
    localState.name = "";
  }

  function clearLocal(notify) {
    revokeLocal();
    EXP.local = "none";
    EXP.localDetail = "未选择";
    var btn = document.getElementById("clearBtn");
    if (btn) btn.disabled = true;
    if (notify) rechooseSource(); else updateHud();
  }

  function pickFile(file) {
    if (!file) return;
    var name = file.name || "local";
    var type = file.type || "";
    if (EXP.capture === "live" || EXP.capture === "requesting") stopCapture("切到本地媒体");
    revokeLocal();

    var url = "";
    try { url = URL.createObjectURL(file); } catch (e) {
      EXP.local = "failed:" + ((e && e.name) || "Error");
      EXP.localDetail = "无法创建对象 URL · " + ((e && e.name) || "Error");
      rechooseSource();
      return;
    }

    if (/^video\//i.test(type) || /\.(mp4|webm|mov|m4v|ogv|mkv)$/i.test(name)) {
      localState.url = url;
      localState.kind = "video";
      localState.name = name;
      EXP.local = "ready:video";
      EXP.localDetail = "video · " + name + "（加载中）";
      localVideo.loop = true;
      localVideo.muted = true;
      localVideo.onloadeddata = function () {
        if (localState.url !== url) return;
        EXP.localDetail = "video · " + name + (localVideo.videoWidth ? " · " + localVideo.videoWidth + "×" + localVideo.videoHeight : "");
        rechooseSource();
      };
      localVideo.onerror = function () {
        if (localState.url !== url) return;
        EXP.local = "failed:MediaError";
        EXP.localDetail = "video 解码失败 · " + name;
        rechooseSource();
      };
      localVideo.src = url;
      var pr = localVideo.play();
      if (pr && pr.catch) pr.catch(function () { /* 静音自动播放失败时仍会出首帧 */ });
      document.getElementById("clearBtn").disabled = false;
      rechooseSource();
      return;
    }

    if (/^image\//i.test(type) || /\.(png|jpe?g|webp|gif|avif|bmp)$/i.test(name)) {
      localState.url = url;
      localState.kind = "image";
      localState.name = name;
      EXP.local = "ready:image";
      EXP.localDetail = "image · " + name + "（加载中）";
      var im = new Image();
      im.onload = function () {
        if (localState.url !== url) return;
        localState.img = im;
        EXP.localDetail = "image · " + name + " · " + im.naturalWidth + "×" + im.naturalHeight;
        rechooseSource();
      };
      im.onerror = function () {
        if (localState.url !== url) return;
        EXP.local = "failed:DecodeError";
        EXP.localDetail = "image 解码失败 · " + name;
        rechooseSource();
      };
      im.src = url;
      document.getElementById("clearBtn").disabled = false;
      rechooseSource();
      return;
    }

    try { URL.revokeObjectURL(url); } catch (e) {}
    EXP.local = "failed:UnsupportedType";
    EXP.localDetail = "不支持的类型 · " + (type || name);
    rechooseSource();
  }

  /* ========== 7. 封面降级层：重模糊 + 渐变 + 噪声 ========== */
  var coverImg = null, coverReady = false, coverErr = "", coverTriedUrl = "";
  var blurCv = null;
  var noiseCv = null, noisePattern = null;

  function coverSrc(u) {
    if (!u) return "";
    u = String(u);
    if (u.charAt(0) === "/") return u;
    if (/^(data:|blob:)/i.test(u)) return u;
    if (/^https?:\/\//i.test(u)) {
      if (u.indexOf(location.origin) === 0) return u;
      return "/api/img?url=" + encodeURIComponent(u.indexOf("?") >= 0 ? u : u + "?param=640y640");
    }
    return "";
  }

  function buildBlurCache() {
    if (!coverImg || W < 2 || H < 2) return;
    var cw = 320;
    var ch = Math.max(120, Math.round(cw * H / W));
    if (ch > 520) ch = 520;
    var cv = blurCv || document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    var b = cv.getContext("2d");
    try {
      b.filter = "blur(9px)";
      b.fillStyle = "#000";
      b.fillRect(0, 0, cw, ch);
      var iw = coverImg.naturalWidth || coverImg.width || cw;
      var ih = coverImg.naturalHeight || coverImg.height || ch;
      var s = Math.max(cw / iw, ch / ih);
      var dw = iw * s, dh = ih * s;
      b.drawImage(coverImg, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      b.filter = "none";
      blurCv = cv;
    } catch (e) {
      coverErr = "画布污染（" + ((e && e.name) || "SecurityError") + "）";
      blurCv = null;
      logErr(e);
    }
    updateHud();
  }

  function loadCover(u) {
    var url = u ? String(u) : "";
    if (url === coverTriedUrl && (coverReady || !url)) return;
    coverTriedUrl = url;
    coverUrl = url;
    coverImg = null;
    coverReady = false;
    coverErr = "";
    blurCv = null;
    if (!url) { updateHud(); return; }
    var src = coverSrc(url);
    if (!src) { coverErr = "不可用地址"; updateHud(); return; }
    var im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = function () {
      if (coverTriedUrl !== url) return;
      coverImg = im;
      coverReady = true;
      coverErr = "";
      buildBlurCache();
    };
    im.onerror = function () {
      if (coverTriedUrl !== url) return;
      coverReady = false;
      coverErr = "加载失败";
      updateHud();
    };
    im.src = src;
  }

  function buildNoise() {
    if (!noiseCv) {
      noiseCv = document.createElement("canvas");
      noiseCv.width = 160;
      noiseCv.height = 160;
      var nc = noiseCv.getContext("2d");
      var id = nc.createImageData(160, 160);
      for (var i = 0; i < id.data.length; i += 4) {
        var v = (Math.random() * 255) | 0;
        id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = 255;
      }
      nc.putImageData(id, 0, 0);
    }
    try { noisePattern = bgCtx.createPattern(noiseCv, "repeat"); } catch (e) { noisePattern = null; }
  }

  function drawFallback(g) {
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
    g.fillStyle = "#05070d";
    g.fillRect(0, 0, W, H);

    if (blurCv) {
      g.globalAlpha = 0.70;
      g.drawImage(blurCv, 0, 0, W, H);
      g.globalAlpha = 1;
    }

    var phase = RM ? 0 : S.t;
    var x1 = W * (0.72 + Math.sin(phase * 0.10) * 0.035);
    var y1 = H * (0.30 + Math.cos(phase * 0.075) * 0.045);
    var rr = Math.max(W, H) * 0.72;
    var rg = g.createRadialGradient(x1, y1, 0, x1, y1, rr);
    rg.addColorStop(0, rgba(AC, 0.36));
    rg.addColorStop(0.42, rgba(AC, 0.13));
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    var AC2 = [AC[2], AC[0], AC[1]];
    var x2 = W * (0.20 + Math.cos(phase * 0.06) * 0.03);
    var y2 = H * (0.80 + Math.sin(phase * 0.05) * 0.03);
    var rg2 = g.createRadialGradient(x2, y2, 0, x2, y2, rr * 0.8);
    rg2.addColorStop(0, rgba(AC2, 0.20));
    rg2.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg2;
    g.fillRect(0, 0, W, H);

    if (!RM && beatPulse > 0.01) {
      var pg = g.createRadialGradient(W * 0.5, H * 0.56, 0, W * 0.5, H * 0.56, Math.min(W, H) * 0.5);
      pg.addColorStop(0, rgba(AC, 0.10 * beatPulse));
      pg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = pg;
      g.fillRect(0, 0, W, H);
    }

    var vg = g.createRadialGradient(W * 0.5, H * 0.54, Math.min(W, H) * 0.18, W * 0.5, H * 0.54, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.66)");
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);

    if (noisePattern) {
      g.save();
      g.globalAlpha = 0.055;
      g.globalCompositeOperation = "overlay";
      if (!RM) g.translate((S.t * 11) % 160, (S.t * 7) % 160);
      g.fillStyle = noisePattern;
      g.fillRect(-160, -160, W + 320, H + 320);
      g.restore();
      g.globalCompositeOperation = "source-over";
      g.globalAlpha = 1;
    }
  }

  function drawMediaCover(g, v) {
    try {
      if (!v || v.readyState < 2 || !v.videoWidth || !v.videoHeight) return false;
      var s = Math.max(W / v.videoWidth, H / v.videoHeight);
      var dw = v.videoWidth * s, dh = v.videoHeight * s;
      g.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
      return true;
    } catch (e) { logErr(e); return false; }
  }

  function drawImageCover(g, im) {
    try {
      if (!im || !im.naturalWidth) return false;
      var s = Math.max(W / im.naturalWidth, H / im.naturalHeight);
      var dw = im.naturalWidth * s, dh = im.naturalHeight * s;
      g.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
      return true;
    } catch (e) { logErr(e); return false; }
  }

  function drawBackground() {
    var g = bgCtx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
    g.imageSmoothingEnabled = true;
    var ok = false;
    if (EXP.source === "CAPTURE") {
      ok = drawMediaCover(g, capVideo);
    } else if (EXP.source === "LOCAL") {
      if (localState.kind === "video") ok = drawMediaCover(g, localVideo);
      else if (localState.kind === "image" && localState.img) ok = drawImageCover(g, localState.img);
    }
    if (!ok) drawFallback(g);
  }

  function resize() {
    var w = Math.max(1, window.innerWidth || 1);
    var h = Math.max(1, window.innerHeight || 1);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = w; H = h;
    var bw = Math.max(1, Math.round(W * dpr));
    var bh = Math.max(1, Math.round(H * dpr));
    if (bgCanvas.width !== bw) bgCanvas.width = bw;
    if (bgCanvas.height !== bh) bgCanvas.height = bh;
    if (fgCanvas.width !== bw) fgCanvas.width = bw;
    if (fgCanvas.height !== bh) fgCanvas.height = bh;
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (lyt) lyt.key = "";
    if (coverReady) buildBlurCache();
    buildNoise();
  }

  /* ========== 8. 歌词数据 ========== */
  function charTimes(line) {
    var chars = Array.from(line.text || "");
    var n = chars.length;
    var out = new Array(n);
    if (!n) return out;
    var cs = line.chars;
    var i, j, rec, ct, fallbackDur = line.dur > 0 ? line.dur : 3.4;
    if (cs && cs.length) {
      var rel = cs[0] && isFinite(Number(cs[0].t)) && Number(cs[0].t) < line.t - 0.08;
      for (i = 0; i < n; i++) {
        j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        rec = cs[j] || {};
        ct = Number(rec.t);
        if (isFinite(ct)) out[i] = rel ? line.t + ct : ct;
        else out[i] = line.t + fallbackDur * 0.88 * i / Math.max(1, n);
      }
      return out;
    }
    for (i = 0; i < n; i++) out[i] = line.t + fallbackDur * 0.88 * i / Math.max(1, n);
    return out;
  }

  function buildLines(raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      if (!l || typeof l !== "object") continue;
      var text = (l.text == null) ? "" : String(l.text);
      if (!text.trim()) continue;
      var t = Number(l.t); if (!isFinite(t) || t < 0) t = 0;
      var dur = Number(l.dur); if (!isFinite(dur) || dur < 0) dur = 0;
      var line = {
        t: t, dur: dur, text: text,
        chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null
      };
      line.times = charTimes(line);
      out.push(line);
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  /* ========== 9. 排版：自动缩字号 + 断行，不截断 ========== */
  var lyt = { key: "", cur: null, prev: null, next: null, line: null, upcoming: false };

  function isWordChar(ch) { return /[A-Za-z0-9'’\-–—_.&/+]/.test(ch); }

  function tokenize(line) {
    var chars = Array.from(line.text || "");
    var times = line.times || [];
    var toks = [], buf = null;
    function flush() { if (buf) { toks.push(buf); buf = null; } }
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i];
      var rec = { ch: ch, time: times[i] };
      if (/\s/.test(ch)) {
        flush();
        toks.push({ space: true, chars: [rec] });
      } else if (isWordChar(ch)) {
        if (!buf) buf = { space: false, chars: [] };
        buf.chars.push(rec);
      } else {
        flush();
        toks.push({ space: false, chars: [rec] });
      }
    }
    flush();
    return toks;
  }

  function wrapAt(tokens, fs, maxW) {
    var mctx = measureCtx;
    mctx.font = fontFor(fs);
    var rows = [], row = { chars: [], width: 0 }, x = 0;

    function add(ch, time, w) {
      row.chars.push({ ch: ch, time: time, x: x, w: w });
      x += w;
      row.width = x;
    }
    function nextRow() {
      while (row.chars.length && row.chars[row.chars.length - 1].ch === " ") {
        row.width -= row.chars[row.chars.length - 1].w;
        row.chars.pop();
      }
      if (row.chars.length) rows.push(row);
      row = { chars: [], width: 0 };
      x = 0;
    }

    for (var ti = 0; ti < tokens.length; ti++) {
      var tok = tokens[ti];
      if (tok.space) {
        if (x > 0 && x + tok.w <= maxW) add(" ", tok.chars[0].time, tok.w);
        continue;
      }
      if (x + tok.w > maxW && row.chars.length) nextRow();
      if (tok.w <= maxW) {
        for (var i = 0; i < tok.chars.length; i++) {
          var c = tok.chars[i];
          var cw = mctx.measureText(c.ch).width;
          add(c.ch, c.time, cw);
        }
      } else {
        for (var j = 0; j < tok.chars.length; j++) {
          var cc = tok.chars[j];
          var ccw = mctx.measureText(cc.ch).width;
          if (x + ccw > maxW && row.chars.length) nextRow();
          add(cc.ch, cc.time, ccw);
        }
      }
    }
    nextRow();
    return rows;
  }

  function buildLayout(line, baseFs, maxW, maxRows, maxH, minFs) {
    var toks = tokenize(line);
    var fs = clamp(baseFs, minFs, 200);
    var rows = [];
    for (var k = 0; k < 22; k++) {
      measureCtx.font = fontFor(fs);
      for (var i = 0; i < toks.length; i++) {
        var tk = toks[i], w = 0;
        if (tk.space) w = fs * 0.30;
        else for (var j = 0; j < tk.chars.length; j++) w += measureCtx.measureText(tk.chars[j].ch).width;
        tk.w = w;
      }
      rows = wrapAt(toks, fs, maxW);
      if ((rows.length <= maxRows && rows.length * fs * 1.26 <= maxH) || fs <= minFs) break;
      fs = Math.max(minFs, fs * 0.90);
    }
    var rowH = fs * 1.26, width = 0;
    for (var r = 0; r < rows.length; r++) if (rows[r].width > width) width = rows[r].width;
    return { rows: rows, fs: fs, rowH: rowH, totalH: rows.length * rowH, width: width };
  }

  function ensureLayout(idx) {
    var key = LREV + "|" + idx + "|" + Math.round(W) + "x" + Math.round(H);
    if (lyt.key === key) return;
    var base = clamp(H * 0.088, 24, 86);
    var curLine = null, cur = null, prev = null, next = null, upcoming = false;

    if (idx < 0) {
      if (S.lines.length) {
        curLine = S.lines[0];
        cur = buildLayout(curLine, base * 0.74, W * 0.80, 3, H * 0.30, 18);
        upcoming = true;
      }
    } else if (S.lines[idx]) {
      curLine = S.lines[idx];
      cur = buildLayout(curLine, base, W * 0.84, 3, H * 0.34, 18);
      var nb = Math.min(base * 0.42, H * 0.042);
      if (S.lines[idx - 1]) prev = buildLayout(S.lines[idx - 1], nb, W * 0.72, 2, H * 0.15, 9);
      if (S.lines[idx + 1]) next = buildLayout(S.lines[idx + 1], nb, W * 0.72, 2, H * 0.15, 9);
    }

    lyt.key = key;
    lyt.line = curLine;
    lyt.cur = cur;
    lyt.prev = prev;
    lyt.next = next;
    lyt.upcoming = upcoming;
  }

  /* ========== 10. 前景绘制 ========== */
  function drawRowsBlock(lay, top, color, alpha) {
    if (!lay || !lay.rows.length) return;
    var g = fgCtx;
    g.save();
    g.textAlign = "left";
    g.textBaseline = "middle";
    g.font = fontFor(lay.fs);
    g.shadowColor = "rgba(0,0,0,0.85)";
    g.shadowBlur = Math.min(22, lay.fs * 0.22);
    g.shadowOffsetY = 2;
    g.strokeStyle = "rgba(0,0,0,0.45)";
    g.lineWidth = Math.max(1.4, lay.fs * 0.04);
    g.lineJoin = "round";
    g.globalAlpha = alpha;
    g.fillStyle = color;
    for (var r = 0; r < lay.rows.length; r++) {
      var row = lay.rows[r];
      var sx = (W - row.width) / 2;
      var y = top + lay.rowH * (r + 0.5);
      for (var i = 0; i < row.chars.length; i++) {
        var c = row.chars[i];
        if (c.ch === " ") continue;
        g.strokeText(c.ch, sx + c.x, y);
        g.fillText(c.ch, sx + c.x, y);
      }
    }
    g.restore();
  }

  function drawCurrentLine(lay, line, top, upcoming) {
    if (!lay) return;
    var g = fgCtx;
    var fs = lay.fs;
    var appear = upcoming ? 1 : (RM ? 1 : clamp((S.t - line.t) / 0.35, 0, 1));
    var baseAlpha = upcoming ? 0.80 : (0.94 + 0.06 * appear);
    g.save();
    g.textAlign = "left";
    g.textBaseline = "middle";
    g.font = fontFor(fs);
    g.lineJoin = "round";
    g.lineWidth = Math.max(1.8, fs * 0.05);
    g.strokeStyle = "rgba(0,0,0,0.55)";

    for (var r = 0; r < lay.rows.length; r++) {
      var row = lay.rows[r];
      var sx = (W - row.width) / 2;
      var y = top + lay.rowH * (r + 0.5);
      for (var i = 0; i < row.chars.length; i++) {
        var c = row.chars[i];
        if (c.ch === " ") continue;
        var t0 = (c.time != null) ? c.time : line.t;
        var p = (S.t <= t0) ? 0 : clamp((S.t - t0) / 0.24, 0, 1);
        if (upcoming) p = 0;
        var active = (!RM && !upcoming && S.t >= t0 && S.t < t0 + 0.30) ? 1 : 0;
        var col = p <= 0 ? [236, 242, 255] : mix([236, 242, 255], AC, 0.16 + 0.14 * p);
        g.globalAlpha = baseAlpha * (0.48 + 0.52 * p);
        g.shadowColor = active ? rgba(AC, 0.95) : "rgba(0,0,0,0.90)";
        g.shadowBlur = active ? fs * 0.55 : Math.min(26, fs * 0.20);
        g.shadowOffsetY = active ? 0 : 2;
        g.strokeText(c.ch, sx + c.x, y);
        g.fillStyle = "rgb(" + col[0] + "," + col[1] + "," + col[2] + ")";
        g.fillText(c.ch, sx + c.x, y);
      }
    }
    g.restore();
  }

  function drawProgressRule(lay, line, top, alpha) {
    if (!lay || line.dur <= 0) return;
    var prog = clamp((S.t - line.t) / Math.max(0.3, line.dur), 0, 1);
    var rw = Math.min(lay.width * 0.55, W * 0.36);
    if (rw < 40) return;
    var x = (W - rw) / 2;
    var y = top + lay.totalH + 12;
    var g = fgCtx;
    g.save();
    g.globalAlpha = alpha * 0.22;
    g.fillStyle = "#ffffff";
    g.fillRect(x, y, rw, 2);
    g.globalAlpha = alpha * 0.92;
    g.fillStyle = rgba(AC, 1);
    g.fillRect(x, y, rw * prog, 2);
    if (!RM && prog > 0.001) {
      g.globalAlpha = alpha;
      g.fillStyle = rgba(AC, 1);
      g.shadowColor = rgba(AC, 1);
      g.shadowBlur = 10;
      g.beginPath();
      g.arc(x + rw * prog, y + 1, 2.2, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
  }

  function drawLyrics() {
    if (!S.lines.length) { drawInstrumental(); return; }
    ensureLayout(S.idx);
    var lay = lyt.cur, line = lyt.line;
    if (!lay || !line) { drawInstrumental(); return; }

    var appear = (lyt.upcoming || RM) ? 1 : clamp((S.t - line.t) / 0.35, 0, 1);
    var offset = RM ? 0 : (1 - appear) * 9;
    var gap = clamp(H * 0.045, 18, 56);
    var top = H * 0.575 - lay.totalH / 2 + offset;

    if (lyt.prev) drawRowsBlock(lyt.prev, top - gap - lyt.prev.totalH, "rgb(232,238,250)", 0.30);
    if (lyt.next) drawRowsBlock(lyt.next, top + lay.totalH + gap * 0.9, "rgb(232,238,250)", 0.22);
    drawCurrentLine(lay, line, top, lyt.upcoming);
    drawProgressRule(lay, line, top, lyt.upcoming ? 0.35 : 1);
  }

  function drawInstrumental() {
    var g = fgCtx;
    var cx = W / 2, cy = H * 0.55;
    g.save();
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.shadowColor = "rgba(0,0,0,0.9)";
    g.shadowBlur = 18;
    if (songTitle) {
      g.font = "400 " + Math.round(clamp(H * 0.05, 26, 58)) + "px " + SERIF;
      g.fillStyle = "rgba(248,251,255,0.94)";
      g.fillText(songTitle, cx, cy - 18);
      g.font = "500 " + Math.round(clamp(H * 0.014, 10, 14)) + "px " + MONO;
      g.fillStyle = rgba(AC, 0.9);
      g.fillText("INSTRUMENTAL · 无逐字歌词", cx, cy + 24);
    } else {
      g.font = "500 14px " + MONO;
      g.fillStyle = "rgba(220,230,245,0.62)";
      g.fillText("等待 init…", cx, cy);
    }
    g.restore();

    var lv = [live.bass, lvSmooth, live.mid, live.level, live.treble, lvSmooth * 0.7, live.bass * 0.8];
    var bw = clamp(W * 0.006, 4, 9), gapw = bw * 1.5;
    var total = lv.length * bw + (lv.length - 1) * gapw;
    var bx = cx - total / 2, by = cy + 66;
    g.save();
    g.fillStyle = rgba(AC, 0.78);
    g.shadowColor = rgba(AC, 0.8);
    g.shadowBlur = 10;
    for (var i = 0; i < lv.length; i++) {
      var v = clamp(Number(lv[i]) || 0, 0, 1);
      var hh = 6 + v * clamp(H * 0.075, 24, 70) * (i % 2 ? 0.72 : 1);
      g.globalAlpha = 0.45 + 0.55 * v;
      g.fillRect(bx + i * (bw + gapw), by - hh / 2, bw, hh);
    }
    g.restore();
  }

  function drawCaption() {
    var g = fgCtx;
    g.save();
    g.textAlign = "left";
    g.textBaseline = "alphabetic";
    g.shadowColor = "rgba(0,0,0,0.85)";
    g.shadowBlur = 8;
    g.font = "500 " + Math.round(clamp(H * 0.0135, 10, 13)) + "px " + SANS;
    g.fillStyle = "rgba(235,242,255,0.55)";
    var cap = songTitle + (songArtist ? "  —  " + songArtist : "");
    if (cap) g.fillText(cap, Math.max(18, W * 0.015), H - Math.max(18, H * 0.028));
    g.textAlign = "right";
    g.font = "500 " + Math.round(clamp(H * 0.0125, 9, 12)) + "px " + MONO;
    g.fillStyle = "rgba(235,242,255,0.42)";
    g.fillText(fmtTime(S.t) + (DUR > 0 ? " / " + fmtTime(DUR) : ""), W - Math.max(18, W * 0.015), H - Math.max(18, H * 0.028));
    g.restore();
  }

  function drawForeground() {
    var g = fgCtx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
    drawLyrics();
    drawCaption();
  }

  /* ========== 11. 实验状态接口（恰好 5 字段） ========== */
  window.__wp = function () {
    return {
      we: EXP.we ? "present" : "none",
      capture: EXP.capture,
      local: EXP.local,
      source: EXP.source,
      reason: buildReason()
    };
  };

  /* ========== 12. 遮罩 / 面板 ========== */
  var scrim = document.getElementById("scrim");
  var glassOn = false;

  function applyDim(v) {
    v = clamp(Number(v) || 0, 0, 85);
    var a = v / 100;
    scrim.style.background = "radial-gradient(ellipse at 50% 57%, rgba(3,5,10," + (a * 1.15).toFixed(3) +
      ") 0%, rgba(3,5,10," + (a * 0.80).toFixed(3) + ") 46%, rgba(3,5,10," + (a * 0.35).toFixed(3) + ") 100%)";
    var dv = document.getElementById("dimVal");
    if (dv) dv.textContent = Math.round(v) + "%";
    var sl = document.getElementById("dim");
    if (sl && Number(sl.value) !== Math.round(v)) sl.value = Math.round(v);
  }

  function applyGlass(on) {
    glassOn = !!on;
    scrim.style.backdropFilter = glassOn ? "blur(9px) saturate(0.92)" : "none";
    scrim.style.webkitBackdropFilter = glassOn ? "blur(9px) saturate(0.92)" : "none";
    var b = document.getElementById("glassBtn");
    if (b) {
      b.textContent = "毛玻璃：" + (glassOn ? "开" : "关");
      b.className = glassOn ? "on" : "";
    }
  }

  function setHud(on) {
    var hud = document.getElementById("hud");
    var btn = document.getElementById("hudBtn");
    if (!hud) return;
    hud.classList.toggle("hidden", !on);
    if (btn) {
      btn.textContent = "诊断：" + (on ? "显示" : "隐藏");
      btn.classList.toggle("on", on);
    }
  }

  /* ========== 13. ready：首帧 + 800ms 兜底，同一守卫 ========== */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }

  /* ========== 14. 主循环 ========== */
  var rafId = 0, stopped = false, started = false, lastTs = 0;
  var frameCount = 0, fps = 0, fpsT = 0;

  function updateStats() {
    var el = document.getElementById("statVal");
    if (el) el.textContent = "fps " + fps + " · js " + S.js.toFixed(2) + "ms · t " + fmtTime(S.t);
  }

  function frame(ts) {
    if (stopped) return;
    rafId = requestAnimationFrame(frame);
    var dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
    lastTs = ts;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0.016;

    var t0 = (window.performance && performance.now()) || Date.now();
    try {
      S.idx = idxAt(S.t);
      drawBackground();
      drawForeground();
    } catch (e) { logErr(e); }
    var t1 = (window.performance && performance.now()) || Date.now();
    S.js = S.js * 0.9 + (t1 - t0) * 0.1;
    S.frames++;
    frameCount++;

    if (ts - fpsT > 500) {
      fps = Math.round(frameCount * 1000 / Math.max(1, ts - fpsT));
      frameCount = 0;
      fpsT = ts;
      updateStats();
    }

    if (S.playing) {
      beatPulse = Math.max(0, beatPulse - dt * 2.4);
      lvSmooth += (clamp(live.level, 0, 1) - lvSmooth) * (1 - Math.exp(-6 * dt));
    }
  }

  function start() {
    if (started || stopped) return;
    started = true;
    lastTs = 0;
    fpsT = 0;
    rafId = requestAnimationFrame(frame);
  }

  /* ========== 15. 宿主消息 ========== */
  function applyInit(p) {
    p = p || {};
    S.lines = buildLines(p.lines);
    S.idx = -1;
    LREV++;
    lyt.key = "";

    DUR = Number(p.duration);
    if (!isFinite(DUR) || DUR < 0) DUR = 0;

    if (Array.isArray(p.accent)) AC = normAccent(p.accent);

    var song = (p.song && typeof p.song === "object") ? p.song : null;
    songTitle = "";
    songArtist = "";
    if (song) {
      songTitle = String(song.name || song.title || song.song || "");
      if (Array.isArray(song.artists)) songArtist = song.artists.join(" / ");
      else if (song.artists != null) songArtist = String(song.artists);
      else songArtist = String(song.artist || song.author || "");
      loadCover(song.cover || "");
    } else {
      loadCover("");
    }

    if (typeof p.playing === "boolean") S.playing = p.playing;
    updateHud();
  }

  function onMessage(ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || d;
    try {
      if (d.type === "init") {
        applyInit(p);
      } else if (d.type === "tick") {
        var t = Number(p.time);
        if (isFinite(t)) {
          if (Math.abs(t - S.t) > 0.5) {
            beatPulse = 0;
            lvSmooth = 0;
            lyt.key = "";
          }
          S.t = t;
        }
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") {
        var lv = Number(p.level);
        if (!isFinite(lv)) lv = 0.5;
        lv = clamp(lv, 0, 1);
        var bi = Number(p.index);
        beatPulse = Math.max(beatPulse, (bi === 0 ? 0.72 : 0.30) + lv * 0.42);
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "live") {
        var a = Number(p.level), b = Number(p.bass), c = Number(p.mid);
        var e2 = Number(p.treble), f = Number(p.bpm);
        if (isFinite(a)) live.level = clamp(a, 0, 1);
        if (isFinite(b)) live.bass = clamp(b, 0, 1);
        if (isFinite(c)) live.mid = clamp(c, 0, 1);
        if (isFinite(e2)) live.treble = clamp(e2, 0, 1);
        if (isFinite(f)) live.bpm = clamp(f, 0, 400);
        if (typeof p.playing === "boolean") S.playing = p.playing;
      }
    } catch (err) { logErr(err); }
  }

  /* ========== 16. 交互 ========== */
  function bindUI() {
    document.getElementById("capBtn").addEventListener("click", startCapture);
    document.getElementById("stopBtn").addEventListener("click", function () { stopCapture("手动停止"); });
    document.getElementById("clearBtn").addEventListener("click", function () { clearLocal(true); });

    document.getElementById("file").addEventListener("change", function (ev) {
      var f = ev.target.files && ev.target.files[0];
      pickFile(f);
      try { ev.target.value = ""; } catch (e) {}
    });

    var sl = document.getElementById("dim");
    sl.addEventListener("input", function () { applyDim(sl.value); });

    var dbtns = document.querySelectorAll("[data-dim]");
    for (var i = 0; i < dbtns.length; i++) {
      dbtns[i].addEventListener("click", function (ev) {
        applyDim(Number(ev.currentTarget.getAttribute("data-dim")) || 0);
      });
    }

    document.getElementById("glassBtn").addEventListener("click", function () { applyGlass(!glassOn); });
    document.getElementById("hudBtn").addEventListener("click", function () {
      var hud = document.getElementById("hud");
      setHud(hud.classList.contains("hidden"));
    });

    addEventListener("keydown", function (ev) {
      var tag = (ev.target && ev.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      var k = ev.key;
      if (k === "1") applyDim(20);
      else if (k === "2") applyDim(44);
      else if (k === "3") applyDim(68);
      else if (k === "b" || k === "B") applyGlass(!glassOn);
      else if (k === "h" || k === "H") {
        var hud = document.getElementById("hud");
        setHud(hud.classList.contains("hidden"));
      }
    });
  }

  /* ========== 17. 生命周期 ========== */
  addEventListener("resize", function () { try { resize(); } catch (e) { logErr(e); } });
  addEventListener("pagehide", function () {
    stopped = true;
    if (rafId) { try { cancelAnimationFrame(rafId); } catch (e) {} rafId = 0; }
    stopCapture("pagehide");
    try { localVideo.pause(); } catch (e) {}
    try { localVideo.removeAttribute("src"); localVideo.load(); } catch (e) {}
    if (localState.url) {
      try { URL.revokeObjectURL(localState.url); } catch (e) {}
      localState.url = "";
    }
    localState.img = null;
    try { capVideo.srcObject = null; } catch (e) {}
  });

  /* ========== 18. boot ========== */
  addEventListener("message", onMessage);
  bindUI();
  applyDim(44);
  applyGlass(false);
  try { resize(); } catch (e) { logErr(e); }
  EXP.captureDetail = hasGDM ? "未尝试 · API 就绪" : "未尝试 · API 缺失（getDisplayMedia 不存在）";
  probeWE();
  updateHud();

  requestAnimationFrame(function () { sendReady(); start(); });
  setTimeout(function () { sendReady(); start(); }, 800);

})();
</script>
</body>
</html>
