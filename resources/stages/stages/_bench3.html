<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head><body>
<canvas id="c" width="1440" height="810"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1440,H=810;
const N=5200;
const sx=new Float32Array(N),sy=new Float32Array(N),sh=new Float32Array(N),sw=new Float32Array(N);
const band=new Uint8Array(N);
for(let i=0;i<N;i++){
  sx[i]=150+ (i*0.2117%1130) ; sy[i]=235+ (i*0.3771%320);
  sh[i]=8+((i*13)%34); sw[i]=1.3+((i*3)%9)/10;
  band[i]= (i%11===0)?4:((i%7===0)?3:((i%3===0)?2:((i%5===0)?1:0)));
}
const hcv=document.createElement('canvas'); hcv.width=1200; hcv.height=380;
{const g=hcv.getContext('2d'); g.fillStyle='rgba(150,190,230,0.5)';
 for(let i=0;i<40;i++){g.fillRect(20+i*29,40+((i*37)%260),24,90);}}
const bgc=document.createElement('canvas'); bgc.width=720; bgc.height=405;
{const g=bgc.getContext('2d'); g.fillStyle='#0a0c12';g.fillRect(0,0,720,405);}
function bg(){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);ctx.drawImage(bgc,0,0,W,H);}
function halo(){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.16;
  ctx.drawImage(hcv,120,215,1200,380);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
const flush=()=>ctx.getImageData(0,0,1,1);
function bench(name,fn,iters){
  fn();fn();flush();
  const t0=performance.now();
  for(let k=0;k<iters;k++){fn();flush();}
  const t=(performance.now()-t0)/iters;
  console.log(name.padEnd(52)+t.toFixed(2)+' ms');
  return t;
}
const B=(f)=>bench(f,()=>{bg();halo();});
// 0 baseline
bench('0 只有 bg+halo',()=>{bg();halo();},10);
bench('0b 只有 bg',()=>{bg();},10);
bench('0c 只有 flush',()=>{ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);},10);
// 1 full-screen fill only
bench('1 全屏 fillRect 1440x810',()=>{bg();halo();ctx.fillStyle='#123';ctx.fillRect(0,0,W,H);},10);
// 2 5200 int rects tips
bench('2 尖5200 整数坐标 3x3',()=>{bg();halo();ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]|0,sy[i]|0,3,3);}ctx.fill();},10);
// 3 5200 float rects tips
bench('3 尖5200 浮点 3.2x3.2',()=>{bg();halo();ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]-1.6,sy[i]-1.6,3.2,3.2);}ctx.fill();},10);
// 4 2600 tips
bench('4 尖2600 浮点 3.2',()=>{bg();halo();ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
  for(let i=0;i<N;i+=2){ctx.rect(sx[i]-1.6,sy[i]-1.6,3.2,3.2);}ctx.fill();},10);
// 5 5200 tips, 5 separate paths of 1040
bench('5 尖5200 分5趟(每趟1040)',()=>{bg();halo();
  for(let b=0;b<5;b++){ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
    for(let i=b;i<N;i+=5){ctx.rect(sx[i]-1.6,sy[i]-1.6,3.2,3.2);}ctx.fill();}},10);
// 6 5200 shafts only int
bench('6 针身5200 整数 1x18',()=>{bg();halo();ctx.fillStyle='rgba(120,150,190,.4)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]|0,sy[i]|0,1,18);}ctx.fill();},10);
// 7 5200 shafts only float
bench('7 针身5200 浮点 1.3x18',()=>{bg();halo();ctx.fillStyle='rgba(120,150,190,.4)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]-.65,sy[i],1.3,18);}ctx.fill();},10);
// 8 5200 shafts int but width 2
bench('8 针身5200 整数 2x18',()=>{bg();halo();ctx.fillStyle='rgba(120,150,190,.4)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]|0,sy[i]|0,2,18);}ctx.fill();},10);
// 9 without halo, tips float
bench('9 无halo 尖5200 浮点',()=>{bg();ctx.fillStyle='rgba(238,247,255,.94)';ctx.beginPath();
  for(let i=0;i<N;i++){ctx.rect(sx[i]-1.6,sy[i]-1.6,3.2,3.2);}ctx.fill();},10);
</script></body></html>
