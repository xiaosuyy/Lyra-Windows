<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>巨兽焚城 · KAIJU INFERNO</title>
<style>
  :root{
    --cream:#f6e3c0;
    --cream-dim:rgba(246,227,192,.30);
    --ink:#0c0806;
    --red:#e03127;
    --deepred:#7d120d;
    --ochre:#e8a13c;
    --acc:230,49,39;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0605;overflow:hidden}
  body{
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Source Han Sans SC","Microsoft YaHei",sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeSpeed;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#0a0605}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  #vig{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 42%,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 100%),
      linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 58%,rgba(0,0,0,.72) 100%);
  }
  .ui{position:absolute;z-index:3;pointer-events:none}
  /* narrow / portrait windows: drop the decorative flanks, keep the story */
  @media (max-aspect-ratio:3/4){
    #kakiL,#kakiR{display:none}
  }
  @media (max-aspect-ratio:1/1){
    #kakiR{display:none}
    #title{max-width:74vw}
    #lyrText{font-size:clamp(22px,5.6vw,44px)}
  }
  /* ---- top band ---- */
  #band{top:0;left:0;right:0;height:clamp(26px,3.4vh,44px);display:flex;align-items:center;
        gap:clamp(8px,1.4vw,22px);padding:0 clamp(10px,2vw,34px);
        background:linear-gradient(180deg,rgba(10,5,4,.86),rgba(10,5,4,.18));
        border-bottom:1px solid rgba(var(--acc),.55)}
  #band .tag{font-size:clamp(7px,.82vw,11px);letter-spacing:.34em;color:rgba(246,227,192,.72);
        text-transform:uppercase;white-space:nowrap}
  #band .dot{width:5px;height:5px;border-radius:50%;background:rgb(var(--acc));
        box-shadow:0 0 8px rgb(var(--acc));flex:none}
  #band .sp{flex:1}
  #band .jp{font-size:clamp(9px,1.15vw,16px);letter-spacing:.5em;color:var(--cream);
        font-weight:800;opacity:.9}
  /* ---- title block ---- */
  #title{left:clamp(12px,2.6vw,52px);top:clamp(52px,7.2vh,96px);max-width:46vw}
  #titleK{font-weight:900;line-height:.92;letter-spacing:.02em;
    font-size:clamp(22px,4.1vw,64px);
    color:var(--cream);
    text-shadow:0 0 1px rgba(0,0,0,.9), 0 .055em 0 var(--deepred), 0 .11em 0 rgba(0,0,0,.55);
    word-break:break-word;
  }
  #titleE{margin-top:.55em;font-size:clamp(7px,.86vw,12px);letter-spacing:.42em;
    color:rgba(var(--acc),.95);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stamp{margin-top:clamp(8px,1.4vh,18px);display:inline-flex;align-items:center;gap:.6em;
    border:2px solid rgb(var(--acc));padding:.32em .72em;transform:rotate(-1.6deg);
    color:rgb(var(--acc));font-weight:900;font-size:clamp(9px,1.05vw,15px);letter-spacing:.2em;
    box-shadow:0 0 0 1px rgba(0,0,0,.5) inset}
  /* ---- red kaki column left ---- */
  #kakiL{left:clamp(4px,.7vw,12px);top:clamp(96px,14vh,180px);bottom:clamp(90px,16vh,160px);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    writing-mode:vertical-rl;font-weight:900;letter-spacing:.30em;
    font-size:clamp(10px,1.25vw,19px);color:rgba(var(--acc),.9);
    text-shadow:0 .05em 0 rgba(0,0,0,.65),0 0 1px rgba(0,0,0,.8)}
  #kakiL span{opacity:.9}
  #kakiL i{writing-mode:horizontal-tb;font-style:normal;font-size:.52em;opacity:.6;
    letter-spacing:.2em;transform:rotate(0deg)}

  /* ---- red explosion burst behind the lyric ---- */
  #burst{left:0;right:0;bottom:0;height:min(46vh,520px);opacity:0;
    transition:opacity .35s ease-out,transform .35s ease-out;
    background:
      repeating-conic-gradient(from 0deg at 22% 92%,
        rgba(var(--acc),.42) 0deg 3deg, rgba(var(--acc),0) 3deg 15deg);
    -webkit-mask-image:radial-gradient(70% 100% at 22% 92%,#000 8%,rgba(0,0,0,.5) 46%,transparent 76%);
    mask-image:radial-gradient(70% 100% at 22% 92%,#000 8%,rgba(0,0,0,.5) 46%,transparent 76%);
    will-change:opacity;transform-origin:22% 92%}

  #kakiR{right:clamp(4px,.8vw,14px);top:clamp(150px,26vh,300px);
    display:flex;flex-direction:column;align-items:flex-end;gap:clamp(2px,.7vh,10px);
    font-weight:900;line-height:.94;color:rgba(var(--acc),.92);
    text-shadow:0 .045em 0 #2a0806,0 0 1px #000}
  #kakiR b{font-size:clamp(15px,2.3vw,38px);letter-spacing:.02em}
  #kakiR b:nth-child(2n){color:var(--cream);text-shadow:0 .045em 0 var(--deepred),0 0 1px #000}
  #kakiR u{text-decoration:none;font-size:clamp(9px,1.1vw,15px);letter-spacing:.3em;
    color:rgba(246,227,192,.55);margin-top:.5em}

  /* ---- lyric hero ---- */
  #lyrWrap{left:0;right:0;bottom:0;padding:0 clamp(14px,3vw,64px) clamp(30px,5.2vh,64px);
    display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(6px,1vh,14px)}
  #lyrRule{height:3px;background:rgba(246,227,192,.16);position:relative;overflow:hidden;margin-bottom:clamp(4px,.8vh,10px)}
  #lyrRule i{position:absolute;inset:0;background:linear-gradient(90deg,var(--ochre),rgb(var(--acc)));
    transform-origin:0 50%;transform:scaleX(0)}
  #lyrText{font-weight:900;line-height:1.06;letter-spacing:.02em;
    font-size:clamp(26px,4.6vw,74px);
    color:var(--cream);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Arial Black",
      "Source Han Sans SC","Microsoft YaHei",sans-serif;
    -webkit-text-stroke:clamp(.9px,.14vw,1.8px) #170807;
    paint-order:stroke fill;
    text-shadow:
      0 .030em 0 #c22b1e, 0 .058em 0 #8d1710, 0 .085em 0 #4a0a06, 0 .112em 0 rgba(0,0,0,.72),
      0 0 .24em rgba(0,0,0,.9),
      0 0 .55em rgba(255,150,70,.20);
    word-break:break-word;overflow-wrap:anywhere;
  }
  #lyrText .g{display:inline-block;white-space:pre;color:rgba(214,176,132,.60);
    -webkit-text-stroke:clamp(.6px,.11vw,1.5px) rgba(26,10,7,.88);
    text-shadow:0 .03em 0 rgba(0,0,0,.5),0 0 .26em rgba(0,0,0,.66);
    transition:color .10s linear,text-shadow .10s linear}
  #lyrText .g.on{color:var(--cream);
    -webkit-text-stroke:clamp(.6px,.11vw,1.5px) #170807;
    text-shadow:
      0 .035em 0 #c22b1e, 0 .07em 0 #7d120d, 0 .10em 0 rgba(0,0,0,.72),
      0 0 1px rgba(0,0,0,.9),
      0 0 .5em rgba(255,160,80,.28)}
  #lyrSub{display:flex;align-items:baseline;gap:.8em;font-size:clamp(8px,.95vw,13px);
    letter-spacing:.3em;color:rgba(246,227,192,.5);text-transform:uppercase}
  #lyrSub b{color:rgb(var(--acc));font-weight:900;letter-spacing:.16em}
  /* ---- corner stamp ---- */
  #corner{right:clamp(10px,2vw,34px);top:clamp(50px,6.6vh,88px);text-align:right;
    writing-mode:vertical-rl;font-weight:900;letter-spacing:.36em;
    font-size:clamp(9px,1.05vw,14px);color:rgba(246,227,192,.62)}
  #corner em{font-style:normal;color:rgb(var(--acc))}
  /* ---- footer ---- */
  #foot{left:0;right:0;bottom:0;height:clamp(18px,2.3vh,28px);display:flex;align-items:center;
    gap:clamp(8px,1.2vw,20px);padding:0 clamp(10px,2vw,34px);
    font-size:clamp(6px,.72vw,10px);letter-spacing:.3em;color:rgba(246,227,192,.42);
    background:linear-gradient(0deg,rgba(6,3,2,.9),rgba(6,3,2,0));text-transform:uppercase}
  #foot .sp{flex:1}
  #empty{display:none;text-align:left}
  #empty b{display:block;font-size:clamp(18px,2.6vw,38px);letter-spacing:.24em;color:rgba(246,227,192,.8)}
  #empty span{display:block;margin-top:.7em;font-size:clamp(8px,.95vw,12px);letter-spacing:.34em;color:rgba(var(--acc),.8)}
  @media (max-aspect-ratio:4/5){
    #title{max-width:70vw;top:clamp(46px,8vh,80px)}
    #corner{display:none}
    #kakiL{display:none}
    #band .jp{letter-spacing:.24em}
    #lyrWrap{padding-bottom:clamp(26px,4vh,44px)}
    #burst{height:min(38vh,340px)}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="vig"></div>
  <div class="ui" id="burst"></div>

  <div class="ui" id="kakiL">
    <span>怪獣</span><i>KAIJU</i><span>大進撃</span><i>1961</i><span>特撮</span>
  </div>

  <div class="ui" id="kakiR">
    <b>死光</b><b>怒濤</b><b>猛火</b><u>DEATH RAY</u>
  </div>

  <div class="ui" id="band">
    <span class="dot"></span>
    <span class="tag" id="bandT">Showa Kaiju Eiga</span>
    <span class="sp"></span>
    <span class="jp">大怪獣・総進撃</span>
  </div>

  <div class="ui" id="title">
    <div id="titleK">巨兽焚城</div>
    <div id="titleE">Kaiju Inferno</div>
    <div id="stamp"><span id="stampY">第参號</span><span id="stampT">00:00</span></div>
  </div>

  <div class="ui" id="corner">特撮 <em>交響</em> 絵巻</div>

  <div class="ui" id="lyrWrap">
    <div id="lyrRule"><i id="lyrBar"></i></div>
    <div id="lyrText"></div>
    <div id="empty"><b>無歌詞</b><span>Instrumental · 器楽曲</span></div>
    <div id="lyrSub"><b id="lnNo">—</b><span id="lnMeta">Standby</span></div>
  </div>

  <div class="ui" id="foot">
    <span id="footL">Toho Scope</span><span class="sp"></span>
    <span id="footTime">00:00 / 00:00</span>
  </div>
</div>

<script>
"use strict";
/* ============ state (single source of truth) ============ */
var S = {
  lines: [], idx: -1, t: 0, time: 0, dur: 0,
  playing: true, frames: 0, js: 0, err: "", text: "",
  rm: false, accent: [224, 49, 39], readySent: false, gl: false
};

/* ============ self-check hook: defined once, top level ============ */
window.__stage = function () {
  return {
    lines: S.lines.length,
    idx: S.idx,
    t: S.t,
    playing: !!S.playing,
    frames: S.frames,
    js: S.js,
    err: S.err,
    text: S.text,
    gl: false,
    rm: S.rm
  };
};

/* ============ tiny helpers ============ */
var $ = function (id) { return document.getElementById(id); };
function num(v, d) { var n = Number(v); return (isFinite(n) ? n : d); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;";
  });
}
function pad2(n) { n = Math.max(0, Math.floor(n)); return (n < 10 ? "0" : "") + n; }
function mmss(s) { s = Math.max(0, num(s, 0)); return pad2(s / 60) + ":" + pad2(s % 60); }

try {
  S.rm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
} catch (e) { console.error("[499] rm detect", e); }

var elT = $("lyrText"), elBar = $("lyrBar"), elNo = $("lnNo"), elMeta = $("lnMeta"),
    elEmpty = $("empty"), elTitleK = $("titleK"), elTitleE = $("titleE"),
    elStampT = $("stampT"), elFootT = $("footTime"), elBandT = $("bandT"),
    elBurst = $("burst");

/* ============ protocol ============ */
function post(msg) {
  try { parent.postMessage(msg, "*"); } catch (e) { console.error("[499] post", e); }
}

function normalizeLines(raw) {
  var out = [], i, L, txt, chars, cc, j, t;
  if (!Array.isArray(raw)) return out;
  var n = Math.min(raw.length, 4000);
  for (i = 0; i < n; i++) {
    L = raw[i];
    if (!L || typeof L !== "object") continue;
    txt = (typeof L.text === "string") ? L.text : (L.text == null ? "" : String(L.text));
    if (!txt.trim()) continue;
    t = num(L.t, 0);
    chars = null;
    if (Array.isArray(L.chars) && L.chars.length) {
      chars = []; cc = Math.min(L.chars.length, 600);
      for (j = 0; j < cc; j++) {
        var c = L.chars[j];
        if (!c || typeof c.c !== "string") continue;
        chars.push({ c: c.c, t: num(c.t, t) });
      }
      if (!chars.length) chars = null;
    }
    var dur = num(L.dur, 0);
    out.push({ t: t, dur: dur > 0 ? dur : 0, text: txt, chars: chars });
  }
  out.sort(function (a, b) { return a.t - b.t; });
  /* fill missing durations from gap to next line */
  for (i = 0; i < out.length; i++) {
    if (!out[i].dur) {
      var nxt = out[i + 1] ? out[i + 1].t : (S.dur || out[i].t + 4);
      out[i].dur = clamp(nxt - out[i].t, 0.4, 14);
    }
  }
  return out;
}

function renderLine(i) {
  var L = S.lines[i];
  if (!L) { elT.textContent = ""; S.text = ""; return; }
  S.text = L.text;
  var s = "", k, n;
  if (L.chars) {
    n = Math.min(L.chars.length, 400);
    for (k = 0; k < n; k++) s += '<span class="g">' + esc(L.chars[k].c) + "</span>";
  } else {
    n = Math.min(L.text.length, 400);
    for (k = 0; k < n; k++) s += '<span class="g">' + esc(L.text.charAt(k)) + "</span>";
  }
  elT.innerHTML = s;
  buildSpans();
  fitText();
  charTimes = null; spanLit = -1;
  if (L.chars && L.chars.length) {
    charTimes = [];
    n = Math.min(L.chars.length, 400);
    for (k = 0; k < n; k++) charTimes.push(num(L.chars[k].t, L.t));
  } else {
    spanT0 = L.t; spanDur = Math.max(0.3, L.dur);
  }
  elNo.textContent = "No." + pad2(i + 1);
  elMeta.textContent = L.chars ? "YRC · 逐字" : "LRC · 逐句";
}

/* ============ init ============ */
function onInit(p) {
  try {
    p = p || {};
    S.dur = Math.max(0, num(p.duration, 0));
    var song = p.song || {};
    var nm = (typeof song.name === "string" && song.name.trim()) ? song.name.trim() : "";
    var ar = Array.isArray(song.artists) ? song.artists.filter(function (x) {
      return typeof x === "string" && x;
    }).join(" / ") : (typeof song.artists === "string" ? song.artists : "");
    if (nm) elTitleK.textContent = nm; else elTitleK.textContent = "巨兽焚城";
    elTitleE.textContent = ar ? ar : "Kaiju Inferno";
    elBandT.textContent = ar ? ar : "Showa Kaiju Eiga";

    var a = p.accent;
    if (Array.isArray(a) && a.length >= 3) {
      var r = clamp(num(a[0], 224), 0, 255) | 0,
          g = clamp(num(a[1], 49), 0, 255) | 0,
          b = clamp(num(a[2], 39), 0, 255) | 0;
      S.accent = [r, g, b];
      document.documentElement.style.setProperty("--acc", r + "," + g + "," + b);
    }

    S.lines = normalizeLines(p.lines);
    S.idx = -1;
    elEmpty.style.display = S.lines.length ? "none" : "block";
    elT.style.display = S.lines.length ? "" : "none";
    elNo.textContent = S.lines.length ? "No.01" : "—";
    elMeta.textContent = S.lines.length ? "Standby" : "Instrumental";
    elT.textContent = S.lines.length ? "" : "";
    if (!S.lines.length) S.text = "";
    elFootT.textContent = "00:00 / " + mmss(S.dur);
    if (typeof paintSoon === "function") paintSoon();
  } catch (e) {
    S.err = String(e && e.message || e);
    console.error("[499] init", e);
  }
}

function onTick(p) {
  try {
    p = p || {};
    var t = num(p.time, S.t);
    S.t = t; S.time = t;
    if (typeof p.playing === "boolean") S.playing = p.playing;
    var i = -1, n = S.lines.length, k;
    for (k = 0; k < n; k++) { if (S.lines[k].t <= t + 0.04) i = k; else break; }
    if (i !== S.idx) { S.idx = i; renderLine(i); }
    updateProgress(t);
  } catch (e) {
    S.err = String(e && e.message || e);
    console.error("[499] tick", e);
  }
}

var lastBar = -1, lastBurst = -1;
function updateProgress(t) {
  var L = S.lines[S.idx];
  var p = 0;
  if (L) p = clamp((t - L.t) / Math.max(0.2, L.dur), 0, 1);
  else if (S.dur > 0) p = clamp(t / S.dur, 0, 1);
  if (Math.abs(p - lastBar) > 0.004) {
    lastBar = p;
    elBar.style.transform = "scaleX(" + p.toFixed(4) + ")";
  }
  /* lyric char progress + the red burst behind the hero line */
  if (L) {
    litUpdate(t);
    var live = (t >= L.t - 0.05 && t <= L.t + L.dur + 0.9) ? 1 : 0;
    if (live !== lastBurst) {
      lastBurst = live;
      elBurst.style.opacity = live ? "1" : "0";
      elBurst.style.transform = live ? "scale(1)" : "scale(0.86)";
    }
  }
  elStampT.textContent = mmss(t);
  elFootT.textContent = mmss(t) + " / " + mmss(S.dur);
}

window.addEventListener("message", function (ev) {
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === "init") onInit(d.payload);
    else if (d.type === "tick") onTick(d.payload);
    else if (d.type === "beat") {
      var b = d.payload || {};
      FX.beatA = clamp(num(b.level, 0.6), 0, 1.4);
      FX.flash = Math.max(FX.flash, FX.beatA);
      var bi = num(b.index, 0);
      if (bi > 0 && bi % 8 === 0) {
        FX.beamOn = 1;
        setTimeout(function () { FX.beamOn = 0; }, 420);
      }
    }
    else if (d.type === "live") {
      var v = d.payload || {};
      FX.level = clamp(num(v.level, 0.5), 0, 1);
      FX.bass = clamp(num(v.bass, 0), 0, 1);
      FX.treble = clamp(num(v.treble, 0), 0, 1);
      if (typeof v.playing === "boolean") S.playing = v.playing;
    }
  } catch (e) {
    S.err = String(e && e.message || e);
    console.error("[499] msg " + d.type, e);
  }
}, false);

/* ================= PAINT ENGINE (2D gouache poster) ================= */
var CV = $("bg"), CX = null;
var G = { W: 1440, H: 900, res: 1, hy: 540 };
var IMG = { base: null, fire: [], fire2: [], tower: null, kaiju: null, saucer: null, jet: null, star: null };
var FX = { embers: [], beam: 0, flash: 0, shake: 0, pulse: 0, level: 0.5, bass: 0, treble: 0, beatA: 0, phase: 0, zoom: 1, beamOn: 0 };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mkCanvas(w, h) {
  var c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  return c;
}
function rgba(a, al) { return "rgba(" + a[0] + "," + a[1] + "," + a[2] + "," + al + ")"; }
function rgbStr(a) { return "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")"; }

/* ---- painted cloud / smoke smear ---- */
function smear(c, x, y, rx, ry, col, al, rot) {
  c.save(); c.globalAlpha = al; c.fillStyle = col;
  c.translate(x, y); if (rot) c.rotate(rot);
  c.beginPath(); c.ellipse(0, 0, Math.max(1, rx), Math.max(1, ry), 0, 0, 6.2832); c.fill();
  c.restore();
}

/* ============ STATIC BASE PLATE ============ */
function paintBase() {
  var w = G.W, h = G.H, hy = G.hy, i, rnd = mulberry32(90210);
  var cv = mkCanvas(w * G.res, h * G.res);
  var c = cv.getContext("2d");
  c.scale(G.res, G.res);

  /* --- sky: ash plumb -> blood -> furnace --- */
  var g = c.createLinearGradient(0, 0, 0, hy);
  g.addColorStop(0, "#0b0710");
  g.addColorStop(0.24, "#1c0b14");
  g.addColorStop(0.46, "#44101a");
  g.addColorStop(0.66, "#8c1f16");
  g.addColorStop(0.84, "#cc4a1b");
  g.addColorStop(0.96, "#f0983c");
  g.addColorStop(1, "#ffc25e");
  c.fillStyle = g; c.fillRect(0, 0, w, hy + 2);

  /* --- ash cloud smears --- */
  for (i = 0; i < 60; i++) {
    var cy = hy * (0.02 + rnd() * 0.72);
    var t = cy / hy;
    var col = t > 0.62 ? "rgba(255,138,58,1)" : (t > 0.4 ? "rgba(150,44,34,1)" : "rgba(52,20,32,1)");
    smear(c, rnd() * w, cy, (0.06 + rnd() * 0.22) * w, (2 + rnd() * 7) * (h / 900 + 0.6), col,
      0.055 + rnd() * 0.13, (rnd() - 0.5) * 0.14);
  }
  /* glowing underside of cloud bank */
  for (i = 0; i < 26; i++) {
    var gy = hy * (0.5 + rnd() * 0.42);
    smear(c, rnd() * w, gy, (0.05 + rnd() * 0.16) * w, (2 + rnd() * 5), "rgba(255,190,110,1)",
      0.05 + rnd() * 0.12, (rnd() - 0.5) * 0.1);
  }

  /* --- searchlight cones (static, faint) --- */
  for (i = 0; i < 3; i++) {
    var bx = w * (0.18 + i * 0.3), tx = bx + (i - 1) * w * 0.16;
    var lg = c.createLinearGradient(0, hy, 0, hy * 0.18);
    lg.addColorStop(0, "rgba(255,226,170,0.26)");
    lg.addColorStop(0.55, "rgba(255,226,170,0.07)");
    lg.addColorStop(1, "rgba(255,226,170,0)");
    c.fillStyle = lg;
    c.beginPath();
    c.moveTo(bx - w * 0.012, hy); c.lineTo(tx - w * 0.075, hy * 0.16);
    c.lineTo(tx + w * 0.075, hy * 0.16); c.lineTo(bx + w * 0.012, hy);
    c.closePath(); c.fill();
  }

  /* --- distant burning skyline --- */
  var n = 22;
  for (i = 0; i < n; i++) {
    var bw = w * (0.035 + rnd() * 0.045);
    var bx2 = (i / n) * w * 1.04 - w * 0.02 + rnd() * w * 0.012;
    var bh = h * (0.025 + rnd() * 0.075);
    c.fillStyle = "#1a0a0c";
    c.fillRect(bx2, hy - bh, bw, bh + 4);
    /* hot rim on roof */
    c.fillStyle = "rgba(255,132,52,0.5)";
    c.fillRect(bx2, hy - bh, bw, Math.max(1, h * 0.0022));
    /* windows */
    var wcount = 2 + ((rnd() * 5) | 0);
    for (var k = 0; k < wcount; k++) {
      if (rnd() > 0.62) {
        c.fillStyle = "rgba(255,196,110," + (0.25 + rnd() * 0.5) + ")";
        c.fillRect(bx2 + rnd() * (bw - w * 0.006), hy - bh + rnd() * bh * 0.7,
          Math.max(1, w * 0.005), Math.max(1, h * 0.004));
      }
    }
    /* smoke from roof */
    if (rnd() > 0.66) {
      for (k = 0; k < 5; k++) {
        smear(c, bx2 + bw * 0.5 + (rnd() - 0.5) * bw, hy - bh - k * h * 0.02,
          bw * (0.3 + k * 0.12), h * 0.016, "rgba(30,16,20,1)", 0.2 - k * 0.03, 0);
      }
    }
  }

  /* --- fire sea --- */
  var fg = c.createLinearGradient(0, hy, 0, h);
  fg.addColorStop(0, "#ffd486");
  fg.addColorStop(0.14, "#ffb04a");
  fg.addColorStop(0.38, "#f2651f");
  fg.addColorStop(0.62, "#c02a12");
  fg.addColorStop(0.84, "#7a1009");
  fg.addColorStop(1, "#380705");
  c.fillStyle = fg; c.fillRect(0, hy, w, h - hy + 1);

  /* flame bands: thick horizontal dabs, brighter near horizon */
  for (i = 0; i < 170; i++) {
    var yy = hy + Math.pow(rnd(), 0.72) * (h - hy);
    var dep = (yy - hy) / Math.max(1, (h - hy));
    var amp = w * (0.04 + rnd() * 0.2);
    var warm = dep < 0.35 ? "rgba(255,226,150,1)" : (dep < 0.62 ? "rgba(255,176,84,1)" : "rgba(255,110,40,1)");
    smear(c, rnd() * w, yy, amp, (1.2 + rnd() * 4.2) * (1.1 - dep * 0.5), warm,
      (0.05 + rnd() * 0.16) * (1.25 - dep * 0.55), (rnd() - 0.5) * 0.05);
  }
  /* dark smoke columns between flames */
  for (i = 0; i < 26; i++) {
    smear(c, rnd() * w, hy + rnd() * (h - hy) * 0.7, w * (0.02 + rnd() * 0.09),
      (3 + rnd() * 9), "rgba(38,12,10,1)", 0.10 + rnd() * 0.14, (rnd() - 0.5) * 0.06);
  }

  /* --- bottom scrim so the cream type stays readable --- */
  var sg = c.createLinearGradient(0, h * 0.52, 0, h);
  sg.addColorStop(0, "rgba(7,4,4,0)");
  sg.addColorStop(0.42, "rgba(7,4,4,0.52)");
  sg.addColorStop(0.72, "rgba(6,3,3,0.82)");
  sg.addColorStop(1, "rgba(5,2,2,0.93)");
  c.fillStyle = sg; c.fillRect(0, h * 0.52, w, h * 0.48);

  /* --- painted edge vignette --- */
  var vg = c.createRadialGradient(w * 0.5, h * 0.44, Math.min(w, h) * 0.28, w * 0.5, h * 0.46, Math.max(w, h) * 0.78);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(0.7, "rgba(0,0,0,0.24)");
  vg.addColorStop(1, "rgba(0,0,0,0.78)");
  c.fillStyle = vg; c.fillRect(0, 0, w, h);

  /* --- gouache grain --- */
  var gcv = mkCanvas(96, 96), gc = gcv.getContext("2d");
  var id = gc.createImageData(96, 96), d = id.data;
  for (i = 0; i < d.length; i += 4) {
    var v = 96 + ((rnd() * 74) | 0);
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 26;
  }
  gc.putImageData(id, 0, 0);
  var pat = c.createPattern(gcv, "repeat");
  if (pat) { c.globalAlpha = 0.85; c.globalCompositeOperation = "overlay"; c.fillStyle = pat; c.fillRect(0, 0, w, h); c.globalCompositeOperation = "source-over"; c.globalAlpha = 1; }

  /* --- paper margin: uneven dark border, like a printed sheet --- */
  c.globalAlpha = 0.5;
  c.strokeStyle = "#0a0505"; c.lineWidth = Math.max(6, w * 0.012);
  c.strokeRect(0, 0, w, h);
  c.globalAlpha = 1;

  IMG.base = cv;
}

/* built lazily; heavy layers are rebuilt only on resize / accent change */
function buildScene() {
  try {
    paintBase();
    paintSprites();
  } catch (e) {
    S.err = String(e && e.message || e);
    console.error("[499] buildScene", e);
  }
}

var rebuildTimer = null;
function paintSoon() {
  if (!BOOT.built) return;
  if (rebuildTimer) clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(function () { rebuildTimer = null; try { buildScene(); } catch (e) { console.error("[499] paintSoon", e); } }, 60);
}

/* ============ LAYOUT (single source for scene anchors) ============ */
var LAY = { tx: 0, ty: 0, th: 0, tw: 0, kx: 0, ky: 0, ku: 0, px: 0, py: 0, bx: 0, by: 0, narrow: false };
function computeLayout() {
  var w = G.W, h = G.H;
  var narrow = w / h < 0.95;
  LAY.narrow = narrow;
  if (narrow) {
    LAY.tx = w * 0.255; LAY.ty = h * 0.600; LAY.th = h * 0.300; LAY.tw = w * 0.175;
    LAY.kx = w * 0.680; LAY.ky = h * 0.632; LAY.ku = h * 0.355;
    LAY.px = w * 0.505; LAY.py = h * 0.170;
  } else {
    LAY.tx = w * 0.280; LAY.ty = h * 0.655; LAY.th = h * 0.360; LAY.tw = w * 0.108;
    LAY.kx = w * 0.680; LAY.ky = h * 0.700; LAY.ku = h * 0.500;
    LAY.px = w * 0.545; LAY.py = h * 0.190;
  }
  LAY.bx = LAY.tx + (narrow ? w * 0.01 : w * 0.02);
  LAY.by = LAY.ty - LAY.th * 0.42;
}

/* ============ SPRITES: tower + kaiju + saucer + jets ============ */
var KAIJU = null;
function kaijuShapes() {
  if (KAIJU) return KAIJU;
  var s = [], i, t;
  /* tail: two sweeps of ellipses */
  for (i = 0; i <= 14; i++) {
    t = i / 14;
    var tx = 0.16 + t * 0.56, ty = -0.40 + Math.sin(t * 2.1) * -0.02 + t * t * 0.20;
    s.push([tx, ty, 0.085 * (1 - t * 0.82) + 0.012, 0.075 * (1 - t * 0.8) + 0.01, 0.5 * t]);
  }
  /* legs + feet */
  s.push([-0.13, -0.03, 0.105, 0.045, 0]);
  s.push([-0.12, -0.22, 0.075, 0.155, 0.05]);
  s.push([0.12, -0.03, 0.10, 0.043, 0]);
  s.push([0.115, -0.21, 0.072, 0.15, -0.05]);
  /* hips, torso, chest */
  s.push([0.03, -0.38, 0.185, 0.135, 0]);
  s.push([0.045, -0.53, 0.20, 0.165, -0.06]);
  s.push([0.005, -0.665, 0.165, 0.125, -0.12]);
  /* neck sweep to head */
  for (i = 0; i <= 6; i++) {
    t = i / 6;
    var nx = 0.00 - t * 0.20, ny = -0.70 - t * 0.175 - Math.sin(t * 3.14) * 0.02;
    s.push([nx, ny, 0.115 - t * 0.045, 0.10 - t * 0.03, -0.3]);
  }
  /* head + snout + jaw */
  s.push([-0.235, -0.895, 0.095, 0.062, -0.18]);
  s.push([-0.30, -0.905, 0.052, 0.036, -0.08]);
  s.push([-0.305, -0.862, 0.06, 0.026, 0.22]);
  /* arms */
  s.push([-0.145, -0.605, 0.045, 0.038, 0.3]);
  s.push([-0.185, -0.645, 0.036, 0.030, 0.1]);
  s.push([-0.215, -0.668, 0.028, 0.024, 0.1]);
  KAIJU = s;
  return s;
}
function kaijuPaint(c, ox, oy, fill, u, glow) {
  var S2 = kaijuShapes(), i;
  c.fillStyle = fill;
  if (glow) { c.shadowColor = "rgba(255,120,40,.55)"; c.shadowBlur = u * 0.05; }
  for (i = 0; i < S2.length; i++) {
    var o = S2[i];
    c.beginPath();
    c.ellipse(ox + o[0] * u, oy + (o[1] + 0.012) * u, Math.max(1, o[2] * u), Math.max(1, o[3] * u), o[4], 0, 6.2832);
    c.fill();
  }
  c.shadowBlur = 0;
}
function paintSprites() {
  var w = G.W, h = G.H, i, t;
  var mid = mkCanvas(w * G.res, h * G.res);
  var c = mid.getContext("2d");
  c.scale(G.res, G.res);

  /* ---------------- TOKYO TOWER, burning & buckling ---------------- */
  var tx = LAY.tx, ty = LAY.ty, th = LAY.th, tw = LAY.tw;
  c.save();
  c.translate(tx, ty);
  c.rotate(-0.075);

  /* halo behind tower */
  var hg = c.createRadialGradient(0, -th * 0.5, th * 0.05, 0, -th * 0.5, th * 0.62);
  hg.addColorStop(0, "rgba(255,150,60,.34)");
  hg.addColorStop(1, "rgba(255,120,40,0)");
  c.fillStyle = hg; c.fillRect(-th * 0.7, -th * 1.05, th * 1.4, th * 1.2);

  var legW = tw * 0.5;
  /* silhouette mass of the lattice */
  c.fillStyle = "rgba(46,14,12,.92)";
  c.beginPath();
  c.moveTo(-legW, 0); c.lineTo(-legW * 0.42, -th * 0.46); c.lineTo(-legW * 0.20, -th * 0.72);
  c.lineTo(-legW * 0.15, -th * 0.90); c.lineTo(legW * 0.12, -th * 0.955);
  c.lineTo(legW * 0.16, -th * 0.72); c.lineTo(legW * 0.44, -th * 0.46); c.lineTo(legW, 0);
  c.closePath(); c.fill();

  /* lattice lines in hot orange */
  c.strokeStyle = "rgba(226,84,38,.85)";
  c.lineWidth = Math.max(1, th * 0.006);
  var lv = 9;
  for (i = 1; i <= lv; i++) {
    t = i / lv;
    var yy = -th * Math.pow(t, 0.92) * 0.955;
    var halfw = legW * (1 - Math.pow(t, 0.85) * 0.86);
    c.beginPath(); c.moveTo(-halfw, yy); c.lineTo(halfw, yy); c.stroke();
    /* X braces */
    c.beginPath();
    c.moveTo(-halfw, yy); c.lineTo(halfw * 0.92, yy + th * 0.955 / lv);
    c.moveTo(halfw, yy); c.lineTo(-halfw * 0.92, yy + th * 0.955 / lv);
    c.stroke();
  }
  /* legs */
  c.strokeStyle = "rgba(255,110,44,.9)";
  c.lineWidth = Math.max(1.5, th * 0.009);
  c.beginPath(); c.moveTo(-legW, 0); c.lineTo(-legW * 0.15, -th * 0.90); c.stroke();
  c.beginPath(); c.moveTo(legW, 0); c.lineTo(legW * 0.15, -th * 0.90); c.stroke();
  /* antenna mast, snapped */
  c.strokeStyle = "rgba(255,180,90,.92)";
  c.lineWidth = Math.max(1, th * 0.005);
  c.beginPath(); c.moveTo(0, -th * 0.95); c.lineTo(-th * 0.005, -th * 1.05);
  c.lineTo(th * 0.035, -th * 1.115); c.stroke();
  c.beginPath(); c.moveTo(th * 0.035, -th * 1.115); c.lineTo(th * 0.075, -th * 1.10); c.stroke();
  /* hot blast scorch on the tower */
  var sg2 = c.createLinearGradient(-legW * 0.3, -th * 0.62, legW * 0.5, -th * 0.34);
  sg2.addColorStop(0, "rgba(255,220,140,0)");
  sg2.addColorStop(0.55, "rgba(255,190,90,.5)");
  sg2.addColorStop(1, "rgba(255,120,40,0)");
  c.fillStyle = sg2; c.fillRect(-legW, -th * 0.72, legW * 2, th * 0.5);
  c.restore();

  /* ---------------- KAIJU ---------------- */
  var ku = LAY.ku, kx = LAY.kx, ky = LAY.ky;
  /* backlit warm halo */
  var kg = c.createRadialGradient(kx - ku * 0.12, ky - ku * 0.52, ku * 0.05, kx - ku * 0.12, ky - ku * 0.52, ku * 0.62);
  kg.addColorStop(0, "rgba(255,138,50,.42)");
  kg.addColorStop(0.6, "rgba(230,70,26,.17)");
  kg.addColorStop(1, "rgba(180,40,16,0)");
  c.fillStyle = kg; c.fillRect(kx - ku * 0.8, ky - ku * 1.3, ku * 1.6, ku * 1.4);

  /* dorsal plates */
  var ds = [[0.14, -0.455], [0.20, -0.52], [0.24, -0.60], [0.225, -0.675], [0.17, -0.735], [0.10, -0.775]];
  c.fillStyle = "rgba(34,10,10,.95)";
  for (i = 0; i < ds.length; i++) {
    var dp = ds[i], ph = 0.055 - i * 0.004;
    c.beginPath();
    c.moveTo(kx + (dp[0] - 0.045) * ku, ky + dp[1] * ku);
    c.lineTo(kx + (dp[0] + 0.035) * ku, ky + (dp[1] - ph * 1.5) * ku);
    c.lineTo(kx + (dp[0] + 0.085) * ku, ky + (dp[1] + 0.02) * ku);
    c.closePath(); c.fill();
    /* hot rim on the plate */
    c.strokeStyle = "rgba(255,150,60,.55)"; c.lineWidth = Math.max(1, ku * 0.004); c.stroke();
  }

  /* rim pass (glow behind, offset up so it bleeds at the underside) */
  kaijuPaint(c, kx, ky, "rgba(255,132,48,.85)", ku, true);
  /* dark body */
  kaijuPaint(c, kx, ky, "#150a0c", ku, false);
  kaijuPaint(c, kx, ky, "rgba(20,10,12,1)", ku, false);

  /* body shading: warm underside / cool top */
  c.save();
  c.globalCompositeOperation = "source-atop";
  var bg2 = c.createLinearGradient(kx, ky - ku, kx, ky);
  bg2.addColorStop(0, "rgba(60,10,18,.55)");
  bg2.addColorStop(0.62, "rgba(40,8,12,.18)");
  bg2.addColorStop(1, "rgba(255,120,44,.34)");
  c.fillStyle = bg2; c.fillRect(kx - ku * 0.6, ky - ku * 1.1, ku * 1.2, ku * 1.2);
  c.restore();

  /* eye */
  c.fillStyle = "rgba(255,230,150,.95)";
  c.beginPath(); c.ellipse(kx - 0.268 * ku, ky - 0.905 * ku, Math.max(1, ku * 0.008), Math.max(1, ku * 0.006), 0, 0, 6.2832); c.fill();
  /* open jaw glow */
  var jg = c.createRadialGradient(kx - 0.30 * ku, ky - 0.868 * ku, 0, kx - 0.30 * ku, ky - 0.868 * ku, ku * 0.05);
  jg.addColorStop(0, "rgba(255,228,150,.75)");
  jg.addColorStop(1, "rgba(255,120,40,0)");
  c.fillStyle = jg;
  c.beginPath(); c.ellipse(kx - 0.30 * ku, ky - 0.868 * ku, ku * 0.055, ku * 0.028, 0.2, 0, 6.2832); c.fill();

  /* claw strokes */
  c.strokeStyle = "rgba(255,190,120,.5)"; c.lineWidth = Math.max(1, ku * 0.0035);
  for (i = 0; i < 3; i++) {
    var cx0 = kx + (-0.185 + i * 0.045) * ku;
    c.beginPath(); c.moveTo(cx0, ky - 0.02 * ku); c.lineTo(cx0 - ku * 0.012, ky + ku * 0.012); c.stroke();
  }

  IMG.mid = mid;
  buildFire();
  buildSaucer();
  buildJets();
  buildGlow();
  seedEmbers();
  /* flatten tower+kaiju into the base plate: one full-screen blit per frame */
  try {
    if (IMG.base) {
      var bc = IMG.base.getContext("2d");
      if (bc) {
        bc.setTransform(1, 0, 0, 1, 0, 0);
        bc.drawImage(mid, 0, 0);
      }
      IMG.mid = null;
    }
  } catch (e) { console.error("[499] flatten", e); }
}

/* ---- fire strips (additive, tiled horizontally) ---- */
function buildFire() {
  var w = G.W, h = G.H, i, k, rnd = mulberry32(4242);
  var sw = Math.max(64, Math.round(w * 0.42 * G.res));
  var sh = Math.max(64, Math.round(h * 0.30 * G.res));
  var layers = [];
  for (var L = 0; L < 3; L++) {
    var cv = mkCanvas(sw, sh), c = cv.getContext("2d");
    var tongues = 120;
    for (i = 0; i < tongues; i++) {
      var x = rnd() * sw, bw2 = sw * (0.008 + rnd() * 0.026);
      var hh = sh * (0.28 + rnd() * 0.72);
      var gr = c.createLinearGradient(0, sh, 0, sh - hh);
      var bright = 0.45 + rnd() * 0.55;
      gr.addColorStop(0, "rgba(255,246,214," + (0.5 * bright) + ")");
      gr.addColorStop(0.24, "rgba(255,206,110," + (0.46 * bright) + ")");
      gr.addColorStop(0.58, "rgba(255,120,36," + (0.3 * bright) + ")");
      gr.addColorStop(1, "rgba(180,30,10,0)");
      c.fillStyle = gr;
      c.beginPath();
      c.moveTo(x - bw2, sh);
      c.quadraticCurveTo(x - bw2 * 0.7, sh - hh * 0.55, x + (rnd() - 0.5) * bw2 * 1.6, sh - hh);
      c.quadraticCurveTo(x + bw2 * 0.7, sh - hh * 0.55, x + bw2, sh);
      c.closePath(); c.fill();
    }
    /* soft bottom glow bar */
    var bg3 = c.createLinearGradient(0, sh, 0, sh * 0.45);
    bg3.addColorStop(0, "rgba(255,214,140,.34)");
    bg3.addColorStop(1, "rgba(255,120,40,0)");
    c.fillStyle = bg3; c.fillRect(0, 0, sw, sh);
    layers.push(cv);
  }
  IMG.fire = layers;
}

/* ---- saucer sprite ---- */
function buildSaucer() {
  var sz = Math.max(48, Math.round(G.W * 0.15 * G.res));
  var cv = mkCanvas(sz, sz * 0.55), c = cv.getContext("2d");
  var w = sz, h = sz * 0.55, cxx = w / 2, cyy = h * 0.52;
  /* hull: layered lens */

  g.addColorStop(0, "#cfe3ef");
  g.addColorStop(0.34, "#8fb3c8");
  g.addColorStop(0.62, "#4a6577");
  g.addColorStop(1, "#121c24");
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(cxx, cyy, w * 0.46, h * 0.30, 0, Math.PI, Math.PI * 2);
  c.ellipse(cxx, cyy, w * 0.46, h * 0.26, 0, 0, Math.PI);
  c.closePath(); c.fill();
  /* upper dome */
  var g2 = c.createLinearGradient(0, h * 0.16, 0, cyy);
  g2.addColorStop(0, "#f0f7fb");
  g2.addColorStop(1, "rgba(150,186,204,.2)");
  c.fillStyle = g2;
  c.beginPath(); c.ellipse(cxx, cyy, w * 0.19, h * 0.34, 0, Math.PI, Math.PI * 2); c.fill();
  /* fin crests */
  c.fillStyle = "rgba(20,32,42,.9)";
  c.beginPath(); c.moveTo(cxx - w * 0.30, cyy - h * 0.06); c.lineTo(cxx - w * 0.44, cyy - h * 0.30);
  c.lineTo(cxx - w * 0.26, cyy - h * 0.16); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cxx + w * 0.30, cyy - h * 0.06); c.lineTo(cxx + w * 0.44, cyy - h * 0.30);
  c.lineTo(cxx + w * 0.26, cyy - h * 0.16); c.closePath(); c.fill();
  /* portholes */
  for (var i = 0; i < 5; i++) {
    var px = cxx + (i - 2) * w * 0.13, py = cyy + h * 0.055;
    var pg = c.createRadialGradient(px, py, 0, px, py, w * 0.038);
    pg.addColorStop(0, "rgba(255,252,220,1)");
    pg.addColorStop(0.4, "rgba(255,206,110,.95)");
    pg.addColorStop(1, "rgba(255,120,30,0)");
    c.fillStyle = pg; c.beginPath(); c.arc(px, py, w * 0.038, 0, 6.2832); c.fill();
  }
  /* silver rim highlight */
  c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = Math.max(1, w * 0.008);
  c.beginPath(); c.ellipse(cxx, cyy, w * 0.46, h * 0.30, 0, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
  IMG.saucer = cv;
}

/* ---- jet sprite (delta wing, drawn small then rotated) ---- */
function buildJets() {
  var sz = Math.max(18, Math.round(G.W * 0.045 * G.res));
  var cv = mkCanvas(sz * 2, sz), c = cv.getContext("2d");
  var w = sz * 2, h = sz, cy = h / 2;
  c.fillStyle = "rgba(18,12,14,.95)";
  c.beginPath();
  c.moveTo(w * 0.04, cy);
  c.lineTo(w * 0.42, cy - h * 0.10);
  c.lineTo(w * 0.66, cy - h * 0.44);
  c.lineTo(w * 0.72, cy - h * 0.10);
  c.lineTo(w * 0.96, cy - h * 0.02);
  c.lineTo(w * 0.72, cy + h * 0.14);
  c.lineTo(w * 0.62, cy + h * 0.44);
  c.lineTo(w * 0.40, cy + h * 0.12);
  c.closePath(); c.fill();
  c.strokeStyle = "rgba(255,170,90,.55)"; c.lineWidth = Math.max(1, w * 0.01); c.stroke();
  IMG.jet = cv;
}

function buildGlow() {
  var s = 32, cv = mkCanvas(s, s), c = cv.getContext("2d");
  var g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, "rgba(255,246,214,1)");
  g.addColorStop(0.28, "rgba(255,190,96,.85)");
  g.addColorStop(0.62, "rgba(255,110,36,.30)");
  g.addColorStop(1, "rgba(255,80,20,0)");
  c.fillStyle = g; c.fillRect(0, 0, s, s);
  IMG.glow = cv;
}

function seedEmbers() {
  var i, rnd = mulberry32(777), n = 150;
  FX.embers = [];
  for (i = 0; i < n; i++) {
    FX.embers.push({
      x: rnd(), y: rnd(), sp: 0.02 + rnd() * 0.10, dr: (rnd() - 0.5) * 0.03,
      sz: 0.35 + rnd() * 1.5, a: 0.25 + rnd() * 0.7, ph: rnd() * 6.28
    });
  }
}


/* ============ CHAR-LEVEL LIGHT-UP ============ */
var SPANS = [], spanN = 0, charTimes = null, spanT0 = 0, spanDur = 1, spanLit = -1;

function buildSpans() {
  SPANS = elT.getElementsByClassName("g");
  spanN = SPANS.length;
  spanLit = -1;
}

function fitText() {
  if (!elT || !elT.parentNode || !elT.parentNode.clientWidth) return;
  var avail = elT.parentNode.clientWidth - 2;
  elT.style.fontSize = "";
  var base = parseFloat(window.getComputedStyle(elT).fontSize) || 48;
  var guard = 0;
  while (elT.scrollWidth > avail && guard < 18 && base > 17) {
    base *= 0.90;
    elT.style.fontSize = base.toFixed(2) + "px";
    guard++;
  }
}

function litUpdate(t) {
  if (!spanN) return;
  var L = S.lines[S.idx];
  if (!L) return;
  var lit = 0, k;
  if (charTimes && charTimes.length) {
    for (k = 0; k < spanN; k++) {
      if (k < charTimes.length && t >= charTimes[k]) lit = k + 1;
    }
  } else {
    var p = clamp((t - spanT0) / Math.max(0.25, spanDur), 0, 1);
    lit = Math.round(p * spanN);
  }
  if (lit === spanLit) return;
  var from = spanLit < 0 ? 0 : spanLit;
  spanLit = lit;
  if (lit > from) {
    for (k = from; k < lit && k < spanN; k++) SPANS[k].classList.add("on");
  } else {
    for (k = lit; k < from && k < spanN; k++) SPANS[k].classList.remove("on");
  }
}

var lastTs = 0;
function loop(ts) {
  var t0 = performance.now();
  try {
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    S.frames++;
    if (!S.playing) dt *= 0.35;
    paintFrame(ts, dt);
  } catch (e) {
    S.err = String(e && e.message || e);
    console.error("[499] frame", e);
  }
  S.js = Math.round((performance.now() - t0) * 100) / 100;
  if (S.frames === 1) {
    sendReady();
    deferBuild();
  }
  requestAnimationFrame(loop);
}

/* ============ LIVE COMPOSITION ============ */
var JETS = [];
function seedJets() {
  var i, rnd = mulberry32(1234), n = G.W / G.H < 0.95 ? 4 : 6;
  JETS = [];
  for (i = 0; i < n; i++) {
    JETS.push({
      x: rnd(), y: 0.06 + rnd() * 0.26, sp: 0.022 + rnd() * 0.03,
      sc: 0.5 + rnd() * 0.5, vy: (rnd() - 0.5) * 0.008, ph: rnd() * 6.28
    });
  }
}

function paintFrame(ts, dt) {
  if (!CX || !IMG.base) return;
  var w = G.W, h = G.H, r = G.res, i;
  var tsec = ts / 1000;

  FX.beatA *= Math.pow(0.02, dt);
  FX.flash *= Math.pow(0.003, dt);
  FX.beam = FX.beamOn ? 1 : Math.max(0, FX.beam - dt * 1.6);
  FX.pulse = clamp(FX.level * 0.55 + FX.bass * 0.45 + FX.beatA * 0.8, 0, 1.6);

  var shake = S.rm ? 0 : (FX.beatA * 5.5 + FX.level * 1.6);
  var shx = shake ? Math.sin(tsec * 61.3) * shake : 0;
  var shy = shake ? Math.cos(tsec * 47.7) * shake * 0.7 : 0;

  /* --- base plate --- */
  CX.setTransform(r, 0, 0, r, 0, 0);
  CX.globalAlpha = 1;
  CX.globalCompositeOperation = "source-over";
  CX.fillStyle = "#0a0605";
  CX.fillRect(0, 0, w, h);
  var zoom = 1 + FX.pulse * 0.012 + Math.sin(tsec * 0.21) * 0.004;
  CX.save();
  CX.translate(shx, shy);
  CX.translate(w / 2, h / 2);
  CX.scale(zoom, zoom);
  CX.translate(-w / 2, -h / 2);
  CX.drawImage(IMG.base, 0, 0, w, h);
  if (IMG.mid) CX.drawImage(IMG.mid, 0, 0, w, h);
  CX.restore();

  /* --- rolling fire strips, additive, along the horizon --- */
  if (IMG.fire && IMG.fire.length) {
    var fy = G.hy - h * 0.055;
    var fh = h - fy + h * 0.02;
    CX.save();
    CX.globalCompositeOperation = "lighter";
    for (i = 0; i < IMG.fire.length; i++) {
      var strip = IMG.fire[i];
      if (!strip) continue;
      var spd = (0.012 + i * 0.010) * (1 + FX.pulse * 0.9);
      var off = (tsec * spd + i * 0.37) % 1;
      var dw = w * (1.02 + i * 0.05);
      var dx = -off * dw;
      CX.globalAlpha = (0.30 - i * 0.055) * (0.65 + FX.pulse * 0.55);
      CX.drawImage(strip, dx, fy, dw, fh);
      CX.drawImage(strip, dx + dw, fy, dw, fh);
    }
    CX.globalAlpha = 1;
    CX.restore();
  }

  /* --- jets crossing the burning sky --- */
  if (!JETS.length) seedJets();
  if (IMG.jet) {
    var jw = IMG.jet.width / r, jh = IMG.jet.height / r;
    for (i = 0; i < JETS.length; i++) {
      var J = JETS[i];
      var jx = ((J.x + tsec * J.sp * (S.playing ? 1 : 0.25)) % 1.34) - 0.17;
      var jy = J.y + Math.sin(tsec * 0.7 + J.ph) * 0.012 + J.vy * tsec * 0.4;
      var js = 0.42 + J.sc * 0.42;
      var sw2 = jw * js, sh2 = jh * js;
      CX.save();
      CX.globalAlpha = 0.88;
      CX.translate(jx * w, jy * h);
      CX.drawImage(IMG.jet, -sw2 / 2, -sh2 / 2, sw2, sh2);
      CX.restore();
      if (IMG.glow) {
        CX.save();
        CX.globalCompositeOperation = "lighter";
        CX.globalAlpha = 0.40 + 0.22 * Math.sin(tsec * 9 + J.ph);
        var gs = w * 0.013 * (0.7 + J.sc * 0.5);
        CX.drawImage(IMG.glow, jx * w - sw2 * 0.52 - gs / 2, jy * h - gs / 2, gs, gs);
        CX.restore();
      }
    }
  }

  /* --- saucer + death beam --- */
  drawSaucer(tsec, dt);

  /* --- embers --- */
  var n = Math.min(FX.embers.length, 200);
  CX.save();
  CX.globalCompositeOperation = "lighter";
  for (i = 0; i < n; i++) {
    var e = FX.embers[i];
    e.y -= e.sp * dt * (0.6 + FX.level) * (S.rm ? 0.4 : 1);
    if (e.y < -0.05) { e.y = 1.05; e.x = Math.random(); }
    var ex = (e.x * w + Math.sin(tsec * 0.8 + e.ph) * w * 0.018 + shx * 2) % w;
    if (ex < 0) ex += w;
    var ey = e.y * h;
    var es = e.sz * (1 + FX.pulse * 0.5);
    CX.globalAlpha = e.a * (0.5 + 0.5 * Math.sin(tsec * 2.2 + e.ph)) * (0.7 + FX.level * 0.5);
    CX.fillStyle = (i % 5 === 0) ? "rgba(255,244,210,1)" : "rgba(255,158,64,1)";
    CX.fillRect(ex, ey, es, es * 1.6);
  }
  CX.globalAlpha = 1;
  CX.restore();

  /* --- heat flash --- */
  if (FX.flash > 0.01) {
    CX.save();
    CX.globalCompositeOperation = "lighter";
    CX.globalAlpha = clamp(FX.flash * 0.22, 0, 0.30);
    CX.fillStyle = "rgba(255,160,70,1)";
    CX.fillRect(0, 0, w, h);
    CX.restore();
  }

  barrier();
}

function drawSaucer(tsec, dt) {
  if (!IMG.saucer) return;
  var w = G.W, h = G.H, r = G.res;
  var narrow = G.W / G.H < 0.95;
  var k = narrow ? 0.66 : 1;
  var sw = (IMG.saucer.width / r) * k;
  var sh = (IMG.saucer.height / r) * k;
  var px = LAY.px + Math.sin(tsec * 0.31) * w * 0.020;
  var py = LAY.py + Math.cos(tsec * 0.37) * h * 0.012;

  var beamA = FX.beam;
  if (beamA > 0.02) {
    var tx = LAY.bx, ty = LAY.by;
    CX.save();
    CX.globalCompositeOperation = "lighter";
    var lg = CX.createLinearGradient(px, py, tx, ty);
    lg.addColorStop(0, "rgba(255,178,120," + (0.50 * beamA) + ")");
    lg.addColorStop(0.5, "rgba(255,110,170," + (0.26 * beamA) + ")");
    lg.addColorStop(1, "rgba(180,90,255," + (0.14 * beamA) + ")");
    CX.fillStyle = lg;
    CX.beginPath();
    CX.moveTo(px - w * 0.012, py + sh * 0.12);
    CX.lineTo(tx - w * 0.055 - Math.sin(tsec * 30) * w * 0.004, ty);
    CX.lineTo(tx + w * 0.055 + Math.sin(tsec * 27) * w * 0.004, ty);
    CX.lineTo(px + w * 0.012, py + sh * 0.12);
    CX.closePath(); CX.fill();
    CX.strokeStyle = "rgba(255,240,220," + (0.60 * beamA) + ")";
    CX.lineWidth = Math.max(1.4, w * 0.0035 * (1 + FX.pulse * 0.5));
    CX.beginPath(); CX.moveTo(px, py + sh * 0.1); CX.lineTo(tx, ty); CX.stroke();
    var ig = CX.createRadialGradient(tx, ty, 0, tx, ty, w * 0.10 * (1 + FX.pulse * 0.4));
    ig.addColorStop(0, "rgba(255,250,235," + (0.55 * beamA) + ")");
    ig.addColorStop(0.3, "rgba(255,190,120," + (0.30 * beamA) + ")");
    ig.addColorStop(1, "rgba(255,90,40,0)");
    CX.fillStyle = ig;
    CX.beginPath(); CX.arc(tx, ty, w * 0.10, 0, 6.2832); CX.fill();
    CX.restore();
  }

  CX.save();
  CX.globalAlpha = 0.97;
  CX.translate(px, py);
  CX.rotate(Math.sin(tsec * 0.29) * 0.06);
  CX.drawImage(IMG.saucer, -sw / 2, -sh / 2, sw, sh);
  CX.restore();

  if (IMG.glow) {
    CX.save();
    CX.globalCompositeOperation = "lighter";
    CX.globalAlpha = 0.30 + beamA * 0.4;
    var gs2 = sw * 0.9;
    CX.drawImage(IMG.glow, px - gs2 / 2, py + sh * 0.12 - gs2 / 2, gs2, gs2);
    CX.restore();
  }
}

/* halftone band at the very bottom edge — poster printing texture */
var HALF = null, HALF_PAT = null;
function barrier() {
  var w = G.W, h = G.H;
  if (!HALF) {
    var s = 8, cv = mkCanvas(s, s), c = cv.getContext("2d");
    c.fillStyle = "rgba(246,227,192,0.20)";
    c.beginPath(); c.arc(s / 2, s / 2, 1.4, 0, 6.2832); c.fill();
    HALF = cv; HALF_PAT = null;
  }
  if (!HALF_PAT) { try { HALF_PAT = CX.createPattern(HALF, "repeat"); } catch (e) { HALF_PAT = null; } }
  if (!HALF_PAT) return;
  CX.save();
  CX.globalAlpha = 0.35;
  CX.fillStyle = HALF_PAT;
  CX.fillRect(0, h - h * 0.05, w, h * 0.05);
  CX.restore();
}

/* ============ boot ============ */
var BOOT = { built: false, firstAt: 0, shown: false };

function resize() {
  var w = num(window.innerWidth, 1440), h = num(window.innerHeight, 900);
  if (!(w > 2)) w = 1440;
  if (!(h > 2)) h = 900;
  G.W = Math.round(w); G.H = Math.round(h);
  var dpr = num(window.devicePixelRatio, 1) || 1;
  var px = G.W * G.H * dpr * dpr;
  var budget = 2.9e6;
  var r = px > budget ? Math.sqrt(budget / (G.W * G.H)) : dpr;
  G.res = clamp(r, 0.7, 1.75);
  CV.width = Math.round(G.W * G.res);
  CV.height = Math.round(G.H * G.res);
  CV.style.width = G.W + "px"; CV.style.height = G.H + "px";
  G.hy = G.H * (G.W / G.H > 1.05 ? 0.615 : 0.56);
  computeLayout();
  CX = CV.getContext("2d", { alpha: false });
  if (CX) CX.imageSmoothingQuality = "high";
  HALF_PAT = null;
  HALF = null;
  JETS = [];
  BOOT.built = false;
  bootFill();
  if (typeof fitText === "function") fitText();
}

/* heavy poster build, split into exactly two frames after ready */
function deferBuild() {
  if (BOOT.built) return;
  BOOT.built = true;
  requestAnimationFrame(function () {
    try { buildScene(); } catch (e) {
      S.err = String(e && e.message || e);
      console.error("[499] buildScene", e);
    }
  });
}

var rzT = null;
window.addEventListener("resize", function () {
  if (rzT) return;
  rzT = setTimeout(function () { rzT = null; try { resize(); } catch (e) { console.error("[499] resize", e); } }, 140);
}, false);

/* small painted "dust" plate so frame 1 is never a blank candle */
function bootFill() {
  if (!CX) return;
  CX.setTransform(G.res, 0, 0, G.res, 0, 0);
  CX.fillStyle = "#12080a";
  CX.fillRect(0, 0, G.W, G.H);
  var g = CX.createLinearGradient(0, 0, 0, G.H);
  g.addColorStop(0, "#1a0b13");
  g.addColorStop(0.6, "#5c1414");
  g.addColorStop(1, "#c8451b");
  CX.fillStyle = g;
  CX.fillRect(0, 0, G.W, G.H);
}

try {
  resize();
} catch (e) {
  S.err = String(e && e.message || e);
  console.error("[499] boot resize", e);
}

var readyTimer = null;
function sendReady() {
  if (S.readySent) return;
  S.readySent = true;
  post({ __c100: 1, type: "ready" });
  if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
}

readyTimer = setTimeout(sendReady, 900);
requestAnimationFrame(loop);
</script>
</body>
</html>
