<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>450</title>
<style>
  :root{
    --paper:#e8dcc6; --ink:#14100c; --indigo:#2f4f78; --cin:#b23a2b;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);}
  #bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #fx{pointer-events:none;z-index:2;}
  #stage{position:fixed;inset:0;z-index:3;display:flex;align-items:flex-end;justify-content:flex-start;
         padding:0 clamp(18px,5vw,118px) clamp(30px,8.5vh,104px);box-sizing:border-box;pointer-events:none;}
  #lyric{width:100%;max-width:min(92vw,1120px);position:relative;transform-origin:12% 88%;}
  #line{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
        font-weight:800;color:var(--ink);line-height:1.16;letter-spacing:.005em;
        font-size:clamp(25px,4.5vw,72px);text-wrap:balance;word-break:break-word;}
  #line .c{color:#6a5a44;transition:color .22s linear;}
  #line .c.on{color:var(--ink);}
  #prev,#next{font-family:"KaiTi","Kaiti SC","STKaiti","SimSun",serif;color:rgba(28,52,86,.52);
        font-size:clamp(12px,1.3vw,19px);margin:0 0 .55em;letter-spacing:.14em;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;}
  #next{margin:.75em 0 0;color:rgba(28,52,86,.40);}
  #bar{position:fixed;left:0;bottom:0;height:3px;width:100%;z-index:4;background:rgba(35,26,18,.10);}
  #bar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:0 50%;
        background:linear-gradient(90deg,rgba(178,58,43,.25),var(--cin));}
  #seal{position:absolute;right:0;top:-3.4em;width:3em;height:3em;flex:none;
        display:none;align-items:center;justify-content:center;transform:rotate(-5deg);
        background:var(--cin);color:#f7f0e1;font-size:clamp(18px,1.7vw,26px);
        font-family:"KaiTi","STKaiti","SimSun",serif;line-height:1;
        box-shadow:0 0 0 2px rgba(178,58,43,.55),0 6px 14px rgba(80,40,20,.14);}
  #seal.on{display:flex;}
  #meta{position:fixed;right:clamp(10px,2.2vw,40px);top:clamp(18px,6vh,72px);z-index:3;
        writing-mode:vertical-rl;display:flex;gap:.9em;align-items:flex-start;
        font-family:"KaiTi","STKaiti","SimSun",serif;color:rgba(30,26,20,.50);
        font-size:clamp(10px,1.05vw,15px);letter-spacing:.34em;max-height:64vh;overflow:hidden;}
  #meta b{font-weight:400;color:rgba(28,52,86,.62);}
  #empty{position:fixed;inset:0;display:none;z-index:3;align-items:center;justify-content:center;
        flex-direction:column;gap:1.4em;padding:8vw;box-sizing:border-box;}
  #empty .v{writing-mode:vertical-rl;font-family:"KaiTi","STKaiti","SimSun",serif;
        color:var(--indigo);font-size:clamp(20px,2.4vw,36px);letter-spacing:.55em;
        border-left:1px solid rgba(47,79,120,.35);border-right:1px solid rgba(47,79,120,.35);
        padding:.9em .5em;}
  #empty .s{width:2.6em;height:2.6em;background:var(--cin);color:#f7f0e1;display:flex;
        align-items:center;justify-content:center;font-family:"KaiTi","SimSun",serif;
        font-size:clamp(12px,1.2vw,17px);transform:rotate(-4deg);}
  @media (prefers-reduced-motion: reduce){
    #line .c{transition:none;}
  }
  @media (max-width: 620px){
    #stage{padding:0 20px 16vh;align-items:center;}
    #lyric{max-width:100%;}
    #meta{top:14px;right:12px;font-size:11px;letter-spacing:.2em;max-height:40vh;}
    #seal{width:2.4em;height:2.4em;top:-2.8em;font-size:11px;}
    #prev,#next{white-space:normal;}
  }
  @media (max-aspect-ratio: 3/4){
    #stage{align-items:center;padding-bottom:0;}
    #lyric{max-width:94vw;}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div id="stage"><div id="lyric">
  <div id="seal"></div>
  <div id="prev"></div>
  <div id="line"></div>
  <div id="next"></div>
</div></div>
<div id="meta"><b id="mName"></b><span id="mArt"></span></div>
<div id="bar"><i id="barIn"></i></div>
<div id="empty"><div class="v">此曲无词</div><div class="s">静</div></div>
<script>
(function(){
'use strict';
var S = { lines:[], idx:-1, t:0, playing:true, frames:0, js:0, err:'', gl:false, rm:false,
          dur:0, accent:[196,64,44], text:'', lv:0, bass:0, bpm:0 };
var V = { w:1440, h:900, dpr:1, u:1 };
var el = {};
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ v = (typeof v === 'number' && isFinite(v)) ? v : a; return v < a ? a : (v > b ? b : v); }
try { S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e) { S.rm = false; }

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  if (!(w > 0) || !(h > 0)) { w = 1440; h = 900; }
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var fdpr = Math.min(1.5, dpr);
  V.w = w; V.h = h; V.dpr = dpr; V.fd = fdpr; V.u = Math.min(w, h) / 900;
  var a = el.bg, b = el.fx;
  if (a) { a.width = Math.round(w * dpr); a.height = Math.round(h * dpr); }
  if (b) { b.width = Math.round(w * fdpr); b.height = Math.round(h * fdpr); }
  tideKey = -1;
  buildBase();
  seedDust();
}

/* ---- 种子随机：每次 resize 同构图 ---- */
function rnd(seed){
  var s = seed | 0 || 1;
  return function(){ s = (s * 1664525 + 1013904223) & 0x7fffffff; return s / 0x7fffffff; };
}
var noiseTile = null;
function getNoise(){
  if (noiseTile) return noiseTile;
  var n = document.createElement('canvas'); n.width = 128; n.height = 128;
  var g = n.getContext('2d'), im = g.createImageData(128, 128), d = im.data, i;
  for (i = 0; i < d.length; i += 4) {
    var v = 90 + Math.random() * 120;
    d[i] = v * 1.02; d[i+1] = v * 0.96; d[i+2] = v * 0.82; d[i+3] = Math.random() * 46;
  }
  g.putImageData(im, 0, 0);
  noiseTile = n; return n;
}

/* ---- 静态底：宣纸 + 水墨龙 + 窗棂 + 青花冰裂 + 半调 + 条码 ---- */
function buildBase(){
  var c = el.bg; if (!c) return;
  var g = c.getContext('2d'); if (!g) return;
  var W = V.w, H = V.h, U = V.u, R = rnd(45097);
  g.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  var base = g.createLinearGradient(0, 0, W * 0.85, H);
  base.addColorStop(0, '#f0e7d4');
  base.addColorStop(0.48, '#e7dac2');
  base.addColorStop(1, '#d9c9ab');
  g.fillStyle = base; g.fillRect(0, 0, W, H);

  // 暖色渗染
  var rg = g.createRadialGradient(W * 0.78, H * 0.16, 0, W * 0.78, H * 0.16, Math.max(W, H) * 0.75);
  rg.addColorStop(0, 'rgba(255,247,228,.55)'); rg.addColorStop(1, 'rgba(255,247,228,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  var rg2 = g.createRadialGradient(W * 0.1, H * 1.02, 0, W * 0.1, H * 1.02, Math.max(W, H) * 0.62);
  rg2.addColorStop(0, 'rgba(63,83,110,.16)'); rg2.addColorStop(1, 'rgba(63,83,110,0)');
  g.fillStyle = rg2; g.fillRect(0, 0, W, H);

  inkDragon(g, W, H, U, R);
  lattice(g, W, H, U);
  iceCrack(g, W, H, U, R);

  // 纸张颗粒
  var pat = g.createPattern(getNoise(), 'repeat');
  if (pat) { g.globalAlpha = 0.30; g.fillStyle = pat; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }

  halftone(g, W, H, U);
  barcode(g, W, H, U, R);
}

function inkDragon(g, W, H, U, R){
  g.save();
  g.globalCompositeOperation = 'multiply';
  var ox = W * 0.30, oy = H * 1.02, i, k;
  // 主笔：由下至上盘旋的龙身
  for (k = 0; k < 3; k++){
    var w = (0.09 - k * 0.024) * H;
    g.beginPath();
    var px = ox + (k - 1) * W * 0.045, py = oy + k * H * 0.02;
    g.moveTo(px, py);
    for (i = 1; i <= 26; i++){
      var u = i / 26;
      var x = ox + Math.sin(u * 2.5 + k * 0.8) * W * (0.10 - k * 0.012) + u * W * 0.045;
      var y = oy - u * H * (0.70 - k * 0.06);
      g.quadraticCurveTo(px, py - H * 0.022, (px + x) / 2, (py + y) / 2);
      px = x; py = y;
    }
    g.lineWidth = w;
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = k === 0 ? 'rgba(24,38,60,.115)' : 'rgba(24,38,60,.055)';
    g.stroke();
  }
  // 龙鳞：沿主弧撒点，形成飞白
  g.globalCompositeOperation = 'source-over';
  for (i = 0; i < 220; i++){
    var t = R(), uu = Math.pow(t, 0.75);
    var bx = ox + Math.sin(uu * 2.5) * W * 0.10 + uu * W * 0.045 + (R() - 0.5) * W * 0.085;
    var by = oy - uu * H * 0.70 + (R() - 0.5) * H * 0.055;
    var rr = (0.6 + R() * 2.4) * U;
    g.beginPath(); g.arc(bx, by, rr, 0, 6.2832);
    g.fillStyle = 'rgba(26,40,62,' + (0.05 + R() * 0.16).toFixed(3) + ')';
    g.fill();
  }
  // 飞溅
  for (i = 0; i < 46; i++){
    var sx = ox + (R() - 0.35) * W * 0.30, sy = oy - R() * H * 0.78;
    g.beginPath(); g.ellipse(sx, sy, (1.6 + R() * 7) * U, (0.7 + R() * 2.4) * U, R() * 3.14, 0, 6.2832);
    g.fillStyle = 'rgba(30,44,66,' + (0.03 + R() * 0.09).toFixed(3) + ')'; g.fill();
  }
  g.restore();
}

function lattice(g, W, H, U){
  g.save();
  var x = W * 0.575, y = -H * 0.06, w = W * 0.46, h = H * 0.60;
  if (w < 160) { x = W * 0.42; w = W * 0.60; }
  var grd = g.createLinearGradient(x, y, x, y + h);
  grd.addColorStop(0, 'rgba(255,250,236,.62)'); grd.addColorStop(1, 'rgba(255,250,236,.10)');
  g.fillStyle = grd; g.fillRect(x, y, w, h);
  g.strokeStyle = 'rgba(47,79,120,.30)';
  g.lineWidth = Math.max(1, 1.6 * U);
  var cols = 4, rows = 5, i;
  for (i = 0; i <= cols; i++){
    var cx = x + (w / cols) * i;
    g.beginPath(); g.moveTo(cx, y); g.lineTo(cx, y + h); g.stroke();
    g.beginPath(); g.moveTo(cx + 2.5 * U, y); g.lineTo(cx + 2.5 * U, y + h);
    g.lineWidth = Math.max(0.6, 0.7 * U); g.stroke(); g.lineWidth = Math.max(1, 1.6 * U);
  }
  for (i = 0; i <= rows; i++){
    var cy = y + (h / rows) * i;
    g.beginPath(); g.moveTo(x, cy); g.lineTo(x + w, cy); g.stroke();
    g.beginPath(); g.moveTo(x, cy + 2.5 * U); g.lineTo(x + w, cy + 2.5 * U);
    g.lineWidth = Math.max(0.6, 0.7 * U); g.stroke(); g.lineWidth = Math.max(1, 1.6 * U);
  }
  g.strokeStyle = 'rgba(47,79,120,.42)';
  g.lineWidth = Math.max(1.4, 2.4 * U);
  g.strokeRect(x, y, w, h);
  g.restore();
}

function iceCrack(g, W, H, U, R){
  g.save();
  g.strokeStyle = 'rgba(44,74,116,.26)';
  g.lineCap = 'round';
  var i, j;
  for (i = 0; i < 5; i++){
    var px = W * (0.04 + R() * 0.86), py = H * (0.05 + R() * 0.86);
    var ang = R() * 6.2832, steps = 5 + ((R() * 5) | 0);
    g.beginPath(); g.moveTo(px, py);
    for (j = 0; j < steps; j++){
      ang += (R() - 0.5) * 1.5;
      var len = (18 + R() * 60) * U;
      px += Math.cos(ang) * len; py += Math.sin(ang) * len;
      g.lineTo(px, py);
    }
    g.lineWidth = Math.max(0.5, (0.7 + R() * 0.9) * U);
    g.stroke();
  }
  g.restore();
}

function halftone(g, W, H, U){
  g.save();
  g.fillStyle = 'rgba(20,16,12,.16)';
  var step = Math.max(9, 13 * U), cx = 0, cy = 0, i, j, n = 0;
  for (j = 0; j < 26; j++){
    for (i = 0; i < 26; i++){
      var px = i * step, py = j * step;
      var d = Math.sqrt(px * px + py * py) / (step * 26);
      var r = (1 - d) * 2.6 * U + 0.2;
      if (r <= 0.35) continue;
      g.globalAlpha = Math.max(0, 0.9 - d * 1.1);
      g.beginPath(); g.arc(px, py, r, 0, 6.2832); g.fill();
      n++;
    }
  }
  g.globalAlpha = 1;
  g.restore();
}

function barcode(g, W, H, U, R){
  g.save();
  var bw = Math.min(W * 0.16, 150), bh = Math.min(H * 0.05, 30);
  var x = W - bw - 22 * U, y = H - bh - 26 * U, i = x;
  g.fillStyle = 'rgba(22,18,13,.55)';
  while (i < x + bw && bh > 0){
    var wdt = (1 + R() * 3) * U;
    if (i + wdt > x + bw) wdt = x + bw - i;
    if (wdt <= 0.4) break;
    g.fillRect(i, y, wdt, bh);
    i += wdt + (1.5 + R() * 4) * U;
  }
  g.fillStyle = 'rgba(22,18,13,.42)';
  g.fillRect(x, y + bh + 3 * U, bw, Math.max(1, 1.2 * U));
  g.restore();
}

/* ---- 动态层：墨点飞白 / 浮尘 ---- */
var dust = [];
var tideKey = -1, tideGrad = null;
function seedDust(){
  dust.length = 0;
  var R = rnd(7703), i, n = S.rm ? 8 : 26;
  for (i = 0; i < n; i++){
    dust.push({ x: R(), y: R(), r: 0.6 + R() * 2.2, s: 0.15 + R() * 0.5,
                p: R() * 6.2832, a: 0.05 + R() * 0.13 });
  }
}
function draw(){
  var c = el.fx; if (!c) return;
  var g = c.getContext('2d'); if (!g) return;
  var W = V.w, H = V.h, U = V.u, t = S.frames / 60;
  g.setTransform(V.fd, 0, 0, V.fd, 0, 0);
  g.clearRect(0, 0, W, H);
  var i, d;
  if (!S.rm){
    for (i = 0; i < dust.length; i++){
      d = dust[i];
      var x = ((d.x + t * d.s * 0.02) % 1) * W;
      var y = ((d.y - t * d.s * 0.012 + Math.sin(t * 0.7 + d.p) * 0.01) % 1 + 1) % 1 * H;
      g.beginPath(); g.arc(x, y, d.r * U, 0, 6.2832);
      g.fillStyle = 'rgba(38,30,20,' + d.a.toFixed(3) + ')'; g.fill();
    }
  }
  // 底部青蓝墨潮：低频驱动，色阶缓变时才重建渐变
  var lvl = S.lv * 0.5 + S.bass * 0.5;
  var hh = Math.max(0, Math.min(H * 0.40, H * (0.09 + lvl * 0.24)));
  var key = (Math.round(lvl * 40) * 1000 + Math.round(hh)) | 0;
  if (key !== tideKey && tideGrad){
    tideKey = key;
    tideGrad = g.createLinearGradient(0, H - hh, 0, H);
    tideGrad.addColorStop(0, 'rgba(41,63,96,0)');
    tideGrad.addColorStop(1, 'rgba(41,63,96,' + (0.10 + lvl * 0.13).toFixed(3) + ')');
  }
  if (tideGrad) { g.fillStyle = tideGrad; g.fillRect(0, H - hh, W, hh); }

  // 鼓点：墨点飞白
  var n = 0;
  for (i = 0; i < burst.length; i++){
    d = burst[i];
    if (d.life <= 0) continue;
    d.life -= d.dec;
    d.x += d.vx * 0.0016; d.y += d.vy * 0.0016; d.vy += 0.0009;
    if (d.life <= 0) continue;
    g.beginPath();
    g.arc(d.x * W, d.y * H, d.r * U * (0.4 + d.life * 0.9), 0, 6.2832);
    g.fillStyle = 'rgba(24,18,12,' + (d.life * 0.30).toFixed(3) + ')';
    g.fill();
    n++;
  }
  if (n > 60) burst.length = Math.min(burst.length, 70);

  // 歌词微呼吸（不重建 DOM）
  if (el.lyric){
    var br = S.rm ? 1 : 1 + (S.lv * 0.012 + S.bass * 0.010);
    el.lyric.style.transform = 'scale(' + br.toFixed(4) + ')';
  }
}


/* ---- 歌词层 ---- */
var SPANS = [], SPAN_T = [], SPAN_ON = -1, DISP = -2;
function num(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }
function textOf(l){ return (l && typeof l.text === 'string') ? l.text : ''; }

function findIdx(t){
  var L = S.lines, lo = 0, hi = L.length - 1, r = -1, m, tt;
  while (lo <= hi){
    m = (lo + hi) >> 1;
    tt = num(L[m] && L[m].t, 1e9);
    if (tt <= t + 0.02) { r = m; lo = m + 1; } else { hi = m - 1; }
  }
  return r;
}

function buildText(){
  SPANS.length = 0; SPAN_T.length = 0; SPAN_ON = -1;
  var L = S.lines;
  if (el.prev) el.prev.textContent = '';
  if (el.next) el.next.textContent = '';
  if (el.line) el.line.textContent = '';
  if (el.seal) el.seal.textContent = '墨';
  if (!L.length) return;
  var i = S.idx, d = i >= 0 ? i : 0;
  DISP = d;
  if (i > 0 && el.prev) el.prev.textContent = textOf(L[i - 1]).slice(0, 40);
  if (i + 1 < L.length && el.next) el.next.textContent = textOf(L[i + 1]).slice(0, 40);
  var ln = L[d], txt = textOf(ln);
  if (!txt) { if (el.line) el.line.textContent = '·'; return; }

  var chars = ln && ln.chars, st = num(ln && ln.t, 0), du = num(ln && ln.dur, 3.4);
  if (!(du > 0.06)) du = 3.4;
  var frag = document.createDocumentFragment(), i2, n = 0;
  if (chars && chars.length && chars.length <= 400){
    n = Math.min(chars.length, txt.length > 0 ? chars.length : 0);
    if (n > 0){
      for (i2 = 0; i2 < n; i2++){
        var ch = chars[i2] && typeof chars[i2].c === 'string' ? chars[i2].c : '';
        if (!ch) ch = txt.charAt(i2) || '';
        if (!ch) continue;
        var sp = document.createElement('span');
        sp.className = 'c';
        sp.textContent = ch;
        frag.appendChild(sp);
        SPANS.push(sp);
        SPAN_T.push(num(chars[i2] && chars[i2].t, st + du * (i2 / n)));
      }
      // chars 比正文短：余下的字以整句比例补齐
      if (n < txt.length){
        var rest = txt.slice(n), sp2 = document.createElement('span');
        sp2.className = 'c'; sp2.textContent = rest;
        frag.appendChild(sp2); SPANS.push(sp2); SPAN_T.push(st + du * 0.92);
      }
    }
  }
  if (!SPANS.length){
    var cl = Math.min(txt.length, 120), per = du / Math.max(1, cl);
    for (i2 = 0; i2 < cl; i2++){
      var s2 = document.createElement('span');
      s2.className = 'c';
      s2.textContent = txt.charAt(i2);
      frag.appendChild(s2);
      SPANS.push(s2);
      SPAN_T.push(st + per * i2);
    }
  }
  if (el.line) el.line.appendChild(frag);
  fitText();
}

function fitText(){
  var e = el.line; if (!e) return;
  e.style.fontSize = '';
  var ch = SPANS.length;
  if (!ch) return;
  var n = Math.max(1, ch), lines = 1;
  var fs = Math.min(V.w * 0.085, V.h * 0.100, 74);
  var inner = Math.max(120, (el.lyric ? el.lyric.clientWidth : V.w) - 8);
  var est = n * fs;
  if (est > inner) {
    fs = inner / n;
    if (fs < 24) { lines = Math.min(4, Math.ceil((n * fs) / inner)); fs = Math.max(14, inner / Math.ceil(n / lines)); }
  }
  if (lines * fs * 1.16 > V.h * 0.52) fs = (V.h * 0.52) / (lines * 1.16);
  fs = Math.max(14, Math.min(fs, 200));
  e.style.fontSize = fs.toFixed(1) + 'px';
}

function syncLyric(){
  var t = S.t, i = findIdx(t);
  if (i !== S.idx) { S.idx = i; buildText(); }
  var L = S.lines;
  S.text = (i >= 0 && L[i]) ? textOf(L[i]) : '';
  var k = 0, m = SPANS.length;
  while (k < m && SPAN_T[k] <= t + 0.012) k++;
  if (k !== SPAN_ON){
    var a = SPAN_ON < 0 ? 0 : SPAN_ON;
    for (; a < k && a < m; a++) SPANS[a].classList.add('on');
    if (k < SPAN_ON){ for (a = k; a < SPAN_ON && a < m; a++) SPANS[a].classList.remove('on'); }
    SPAN_ON = k;
  }
  if (el.barIn && S.dur > 1) el.barIn.style.transform = 'scaleX(' + Math.min(1, t / S.dur).toFixed(4) + ')';
}

function applySong(song){
  var s = song || {};
  var name = (typeof s.name === 'string' && s.name.trim()) ? s.name.trim() : '无题';
  var art = s.artists;
  if (Object.prototype.toString.call(art) === '[object Array]') art = art.filter(function(x){ return typeof x === 'string' && x; }).join(' / ');
  if (typeof art !== 'string') art = '';
  if (el.mName) el.mName.textContent = name.slice(0, 18);
  if (el.mArt) el.mArt.textContent = art.slice(0, 24);
  try { document.title = name + (art ? ' · ' + art : ''); } catch (e) {}
}

/* ---- 鼓点：墨点炸开（对象池，不重建 DOM）---- */
var burst = [];
function onBeat(index, level){
  if (S.rm) return;
  var need = 5 + ((level * 9) | 0), i, d;
  for (i = 0; i < burst.length && need > 0; i++){
    d = burst[i];
    if (d.life > 0) continue;
    d.x = 0.5 + (Math.random() - 0.5) * 0.46; d.y = 0.55 + (Math.random() - 0.5) * 0.5;
    d.vx = (Math.random() - 0.5) * 0.9; d.vy = -0.25 - Math.random() * 0.9;
    d.r = 0.8 + Math.random() * 3.4; d.life = 1; d.dec = 0.008 + Math.random() * 0.012;
    need--;
  }
  while (burst.length < 64 && need-- > 0){
    burst.push({
      x: 0.5 + (Math.random() - 0.5) * 0.46, y: 0.55 + (Math.random() - 0.5) * 0.5,
      vx: (Math.random() - 0.5) * 0.9, vy: -0.25 - Math.random() * 0.9,
      r: 0.8 + Math.random() * 3.4, life: 1, dec: 0.008 + Math.random() * 0.012
    });
  }
  for (i = 0; i < burst.length; i++) burst[i].life = Math.min(1, burst[i].life + 0.12);
}

function setLines(lines){
  S.lines = (lines && lines.length) ? lines : [];
  S.idx = -1; S.text = ''; DISP = -2;
  if (el.empty) el.empty.style.display = S.lines.length ? 'none' : 'flex';
  if (el.line) el.line.textContent = '';
  if (el.prev) el.prev.textContent = '';
  if (el.next) el.next.textContent = '';
  buildText();
}

function onMsg(ev){
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') {
      var p = d.payload || {}, song = p.song || {};
      S.dur = clamp(p.duration, 0, 1e6);
      if (Object.prototype.toString.call(p.accent) === '[object Array]' && p.accent.length >= 3) {
        S.accent = [clamp(p.accent[0],0,255)|0, clamp(p.accent[1],0,255)|0, clamp(p.accent[2],0,255)|0];
      }
      if (typeof p.playing === 'boolean') S.playing = p.playing; else S.playing = true;
      setLines(p.lines);
      if (typeof applySong === 'function') applySong(song);
    } else if (d.type === 'tick') {
      var q = d.payload || {};
      S.t = clamp(q.time, 0, 1e6);
      if (typeof q.playing === 'boolean') S.playing = q.playing;
      updateLyric();
    } else if (d.type === 'beat') {
      var b = d.payload || {};
      if (typeof onBeat === 'function') onBeat(b.index, clamp(b.level, 0, 1));
    } else if (d.type === 'live') {
      var l = d.payload || {};
      S.lv = clamp(l.level, 0, 1); S.bass = clamp(l.bass, 0, 1);
      S.bpm = clamp(l.bpm, 0, 400);
      if (typeof l.playing === 'boolean') S.playing = l.playing;
    }
  } catch (e) { S.err = String(e && e.message || e); console.error('[450] msg', d && d.type, e); }
}

function updateLyric(){
  if (typeof syncLyric === 'function') { syncLyric(); return; }
  var L = S.lines, i = -1, k;
  for (k = 0; k < L.length; k++) { if (L[k].t <= S.t + 0.001) i = k; else break; }
  S.idx = i;
  S.text = i >= 0 ? (L[i].text || '') : '';
  if (el.line) el.line.textContent = S.text;
}

var readySent = false;
function ready(){
  if (readySent) return; readySent = true;
  try { parent.postMessage({ __c100:1, type:'ready' }, '*'); } catch (e) { console.error('[450] ready', e); }
}

function frame(){
  S.frames++;
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  if (typeof draw === 'function') { try { draw(); } catch (e) { S.err = String(e && e.message || e); console.error('[450] draw', e); } }
  S.js = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
  ready();
  requestAnimationFrame(frame);
}

window.__stage = function(){ return { lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing,
  frames:S.frames, js:S.js, err:S.err, text:S.text, gl:S.gl, rm:S.rm }; };

try {
  el.bg = $('bg'); el.fx = $('fx'); el.line = $('line'); el.prev = $('prev'); el.next = $('next');
  el.empty = $('empty'); el.seal = $('seal'); el.lyric = $('lyric'); el.barIn = $('barIn');
  el.mName = $('mName'); el.mArt = $('mArt');
  window.addEventListener('message', onMsg);
  var rzT = 0;
  window.addEventListener('resize', function(){
    if (rzT) clearTimeout(rzT);
    rzT = setTimeout(function(){ rzT = 0; try { resize(); } catch(e){ console.error('[450] resize', e); } }, 140);
  });
  try {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mq && mq.addEventListener) mq.addEventListener('change', function(e){ S.rm = !!e.matches; seedDust(); });
  } catch (e2) { console.error('[450] mq', e2); }
  resize();
  requestAnimationFrame(frame);
  setTimeout(ready, 900);
  setTimeout(function(){ if (el.seal) el.seal.classList.add('on'); }, 1200);
} catch (e) { S.err = String(e && e.message || e); console.error('[450] boot', e); }
})();
</script>
</body>
