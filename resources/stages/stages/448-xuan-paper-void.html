<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>448 · 空山</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#efe9dc;}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#efe9dc;}
  #paper{position:absolute;left:0;top:0;width:100%;height:100%;background-color:#efe9dc;
         background-repeat:repeat;background-size:440px 440px;}
  #blot{position:absolute;right:1.5vw;bottom:2vh;width:33vw;height:36vh;background-repeat:no-repeat;
        background-size:contain;background-position:center;opacity:0;pointer-events:none;
        transform:translateZ(0);will-change:opacity,transform;}
  #lyr{position:absolute;left:6.5vw;bottom:13vh;width:63vw;height:26vh;display:block;}
  #seal{position:absolute;right:11vw;bottom:44vh;width:clamp(24px,3.2vh,38px);height:clamp(24px,3.2vh,38px);
        background-repeat:no-repeat;background-size:contain;opacity:0;transition:opacity 2.6s ease;}
  #seal.on{opacity:.88;}
  #prog{position:absolute;left:6.5vw;bottom:8vh;width:24vw;height:1px;background:rgba(32,26,20,0.10);display:none;}
  #prog i{display:block;height:100%;width:0%;background:rgba(28,22,17,0.42);}
  #meta{position:absolute;left:7vw;top:9vh;max-width:44vw;color:rgba(34,28,22,0.55);
        font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:clamp(11px,1.35vh,15px);
        letter-spacing:.18em;line-height:1.9;opacity:0;transition:opacity 1.6s ease;}
  #meta.on{opacity:1;}
  #empty{position:absolute;left:0;right:0;top:46%;text-align:center;pointer-events:none;
         font-family:"Songti SC","STSong",serif;font-size:clamp(12px,1.6vh,17px);
         letter-spacing:.42em;color:rgba(38,31,24,0.58);opacity:0;transition:opacity 2s ease;}
  #empty.on{opacity:1;}
  #meta b{display:block;font-weight:400;color:rgba(28,22,17,0.80);}
  #meta span{display:block;font-size:.88em;color:rgba(34,28,22,0.42);}
  .drop{position:absolute;width:2px;height:2px;border-radius:50%;pointer-events:none;
        background:radial-gradient(circle,rgba(26,20,15,.55) 0%,rgba(26,20,15,.28) 42%,rgba(26,20,15,0) 72%);
        opacity:0;}
  .drop.go{animation:spread 1900ms cubic-bezier(.16,.7,.28,1) forwards;}
  @keyframes spread{
    0%{opacity:0;transform:scale(1);}
    14%{opacity:.85;transform:scale(3);}
    62%{opacity:.30;transform:scale(26);}
    100%{opacity:0;transform:scale(34);}
  }
  @media (max-width:640px){
    #lyr{left:8vw;bottom:17vh;width:84vw;height:26vh;}
    #meta{left:8vw;top:7vh;max-width:70vw;}
    #prog{left:8vw;bottom:11vh;width:40vw;}
    #blot{right:-6vw;bottom:26vh;width:64vw;height:28vh;}
    #seal{right:9vw;bottom:47vh;width:clamp(22px,2.6vh,32px);height:clamp(22px,2.6vh,32px);}
  }
  @media (prefers-reduced-motion: reduce){
    .drop.go{animation-duration:1ms;}
    #blot,#seal,#meta,#empty{transition-duration:.2s;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="paper"></div>
  <div id="blot"></div>
  <div id="meta"><b id="mName"></b><span id="mArt"></span></div>
  <div id="empty">此曲无声</div>
  <canvas id="lyr"></canvas>
  <div class="drop" id="drop" style="left:20vw;top:64vh"></div>
  <div id="seal"></div>
  <div id="prog"><i></i></div>
</div>
<script>
'use strict';

/* ---- state ---- */
var view = { w: 1440, h: 900, dpr: 1 };
var el = {};
var cctx = null;
var lines = [];
var curIdx = -1;
var t = 0;
var playing = true;
var frames = 0;
var js = 0;
var errText = '';
var curText = '';
var rm = false;
var gl = false;
var readySent = false;
var accent = [168, 51, 42];
var songName = '';
var artistText = '';
var duration = 0;
var lastTickAt = 0;
var lastPct = -1;

/* ---- self-check hook: outermost, unconditional ---- */
window.__stage = function () {
  return {
    lines: lines.length, idx: curIdx, t: t, playing: playing,
    frames: frames, js: js, err: errText, text: curText, gl: gl, rm: rm
  };
};

function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error('[448] ready post failed', e); errText = String(e); }
}

/* ---- deterministic pseudo noise (no deps) ---- */
function rnd(seed) {
  var s = seed | 0;
  return function () {
    s = (s * 1664525 + 1013904223) | 0;
    return ((s >>> 8) & 0xffffff) / 0xffffff;
  };
}

/* ---- 1. xuan paper fibre: prerendered once, seamless-ish tile ---- */
function makePaperTile() {
  var S = 440;
  var c = document.createElement('canvas');
  c.width = S; c.height = S;
  var g = c.getContext('2d');
  if (!g) return '';
  g.fillStyle = 'rgb(239,233,220)';
  g.fillRect(0, 0, S, S);
  var r = rnd(44801);
  /* long bast fibres — pale, slightly warm */
  var i, x, y, len, ang, w;
  for (i = 0; i < 520; i++) {
    x = r() * S; y = r() * S;
    len = 14 + r() * 96;
    ang = (r() - 0.5) * 0.9 + (r() < 0.5 ? 0 : Math.PI / 2) * 0.15;
    w = 0.5 + r() * 1.1;
    g.strokeStyle = 'rgba(150,133,108,' + (0.030 + r() * 0.055).toFixed(3) + ')';
    g.lineWidth = w;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 8,
      y + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 8,
      x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  /* faint mottling */
  for (i = 0; i < 190; i++) {
    x = r() * S; y = r() * S;
    var rad = 6 + r() * 34;
    var gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(196,182,158,' + (0.05 + r() * 0.06).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(196,182,158,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, rad, 0, 6.2832); g.fill();
  }
  /* grain specks */
  for (i = 0; i < 900; i++) {
    x = r() * S; y = r() * S;
    g.fillStyle = 'rgba(120,105,86,' + (0.02 + r() * 0.05).toFixed(3) + ')';
    g.fillRect(x, y, 1, 1);
  }
  try { return c.toDataURL('image/png'); } catch (e) { console.error('[448] paper tile', e); return ''; }
}

/* ---- 2. ink blot: one wet 焦墨 drop, low-centre, 一角半边 ---- */
function makeInkBlot() {
  var W = 760, H = 620;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d');
  if (!g) return '';
  var cx = W * 0.60, cy = H * 0.56;
  var r = rnd(90210);
  /* wet halo — very soft, wide (still cheap: drawn once) */
  var halo = g.createRadialGradient(cx, cy, 0, cx, cy, H * 0.46);
  halo.addColorStop(0, 'rgba(42,36,30,0.30)');
  halo.addColorStop(0.42, 'rgba(52,45,37,0.13)');
  halo.addColorStop(0.74, 'rgba(66,58,48,0.045)');
  halo.addColorStop(1, 'rgba(80,70,58,0)');
  g.fillStyle = halo;
  g.beginPath(); g.ellipse(cx, cy, H * 0.44, H * 0.36, -0.22, 0, 6.2832); g.fill();

  /* irregular bleeding lobes */
  var i, k, px, py, rad, gg;
  for (i = 0; i < 26; i++) {
    var aa = r() * 6.2832, dd = r() * H * 0.17;
    px = cx + Math.cos(aa) * dd * 1.15;
    py = cy + Math.sin(aa) * dd * 0.85;
    rad = H * (0.05 + r() * 0.13);
    gg = g.createRadialGradient(px, py, 0, px, py, rad);
    gg.addColorStop(0, 'rgba(30,25,20,' + (0.16 + r() * 0.20).toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(30,25,20,0)');
    g.fillStyle = gg;
    g.beginPath(); g.arc(px, py, rad, 0, 6.2832); g.fill();
  }
  /* core: dense, dark, uneven edge */
  var pts = [];
  for (k = 0; k < 40; k++) {
    var ang = k / 40 * 6.2832;
    var rr = H * (0.104 + 0.062 * Math.abs(Math.sin(ang * 2.3 + 0.7)) + r() * 0.030);
    pts.push([cx + Math.cos(ang) * rr * 1.24, cy + Math.sin(ang) * rr * 0.92]);
  }
  var coreGrad = g.createRadialGradient(cx - 12, cy - 16, 0, cx, cy, H * 0.20);
  coreGrad.addColorStop(0, 'rgba(16,13,10,0.90)');
  coreGrad.addColorStop(0.7, 'rgba(22,18,14,0.74)');
  coreGrad.addColorStop(1, 'rgba(28,23,18,0.30)');
  g.fillStyle = coreGrad;
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (k = 1; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
  g.closePath(); g.fill();

  /* dry-brush 飞白 streaks dragging to the left, fixed-step only */
  for (i = 0; i < 46; i++) {
    var sy = cy + (r() - 0.5) * H * 0.28;
    var sx = cx - H * (0.06 + r() * 0.13);
    var sLen = H * (0.10 + r() * 0.34);
    var dry = r() < 0.55;
    g.strokeStyle = 'rgba(24,19,15,' + (dry ? 0.05 + r() * 0.12 : 0.16 + r() * 0.30).toFixed(3) + ')';
    g.lineWidth = 0.6 + r() * 2.6;
    g.beginPath();
    g.moveTo(sx, sy);
    for (var seg = 1; seg <= 7; seg++) {
      g.lineTo(sx - sLen * (seg / 7), sy + (r() - 0.5) * 3.2);
    }
    g.stroke();
  }
  try { return c.toDataURL('image/png'); } catch (e) { console.error('[448] ink blot', e); return ''; }
}

/* ---- 3. 朱文 seal: carved vermilion square, programme glyph ---- */
function makeSeal() {
  var S = 128;
  var c = document.createElement('canvas');
  c.width = S; c.height = S;
  var g = c.getContext('2d');
  if (!g) return '';
  var r = rnd(448);
  g.clearRect(0, 0, S, S);
  var pad = 8;
  g.fillStyle = 'rgb(168,44,36)';
  /* square frame, slightly off-square by hand */
  g.beginPath();
  g.moveTo(pad + r() * 2, pad + r() * 2);
  g.lineTo(S - pad - r() * 2, pad + r() * 2);
  g.lineTo(S - pad - r() * 2, S - pad - r() * 2);
  g.lineTo(pad + r() * 2, S - pad - r() * 2);
  g.closePath();
  g.lineWidth = 7; g.strokeStyle = 'rgb(168,44,36)'; g.stroke();
  /* inner "mountain" strokes: three verticals + one base, carved edges roughened */
  g.lineCap = 'butt';
  g.lineWidth = 6.5;
  var i, j;
  for (j = 0; j < 3; j++) {
    var x0 = 38 + j * 26;
    var top = 34 + (j === 1 ? -6 : 0) + r() * 3;
    g.beginPath(); g.moveTo(x0, 96); g.lineTo(x0 + (r() - 0.5) * 3, top); g.stroke();
  }
  g.lineWidth = 6;
  g.beginPath(); g.moveTo(30, 96); g.lineTo(98, 95 + r() * 2); g.stroke();
  /* chip the ink so it reads as a stone carve, not vector */
  g.globalCompositeOperation = 'destination-out';
  for (i = 0; i < 220; i++) {
    g.fillStyle = 'rgba(0,0,0,' + (0.35 + r() * 0.6).toFixed(2) + ')';
    g.fillRect(r() * S, r() * S, 1 + r() * 2.4, 1 + r() * 2.4);
  }
  g.globalCompositeOperation = 'source-over';
  try { return c.toDataURL('image/png'); } catch (e) { console.error('[448] seal', e); return ''; }
}

/* ---- texture bootstrap: after ready, but cheap enough to do in one pass ---- */
function buildTextures() {
  try {
    var paper = makePaperTile();
    if (paper && el.paper) el.paper.style.backgroundImage = 'url(' + paper + ')';
    var ink = makeInkBlot();
    if (ink && el.blot) {
      el.blot.style.backgroundImage = 'url(' + ink + ')';
      el.blot.style.transition = 'opacity 3.2s ease';
      el.blot.style.opacity = '0';
      requestAnimationFrame(function () { el.blot.style.opacity = '0.95'; });
    }
    var seal = makeSeal();
    if (seal && el.seal) el.seal.style.backgroundImage = 'url(' + seal + ')';
  } catch (e) { console.error('[448] buildTextures', e); errText = String(e); }
}

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (!(w > 0)) w = 1440;
  if (!(h > 0)) h = 900;
  view.w = w; view.h = h;
  view.dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  var c = el.lyr;
  if (c) {
    var cw = c.clientWidth || view.w, chh = c.clientHeight || view.h;
    c.width = Math.max(1, Math.round(cw * view.dpr));
    c.height = Math.max(1, Math.round(chh * view.dpr));
    if (!cctx) cctx = c.getContext('2d');
    if (cctx) cctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  }
  /* resizing wipes the bitmap: force a full repaint */
  layout.idx = -2;
  lastFlat = -1;
  drawLyric(true);
}

function ctxFont(px) {
  return '500 ' + Math.round(px) + 'px "Songti SC","STSong","Songti TC","Noto Serif SC",serif';
}

/* layout is cached per line index — never recomputed per frame */
var layout = { idx: -2, text: '', px: 0, rows: [], lh: 0 };
var lastFlat = -1;

function buildLayout(text, w, h) {
  var px = Math.min(h * 0.34, 56);
  var rows = [];
  var guard = 0;
  var truncated = false;
  while (guard++ < 16) {
    cctx.font = ctxFont(px);
    rows = []; truncated = false;
    var row = [], rowW = 0;
    var maxW = w * 0.995;
    var LIM = Math.min(text.length, 600);
    for (var i = 0; i < LIM; i++) {
      var ch = text.charAt(i);
      var cw = cctx.measureText(ch).width;
      if (rowW + cw > maxW && row.length) {
        rows.push(row);
        row = []; rowW = 0;
        if (rows.length >= 3) { truncated = true; break; }
      }
      row.push({ c: ch, w: cw });
      rowW += cw;
    }
    if (row.length && rows.length < 3) rows.push(row);
    if (rows.length <= 3 && (!truncated || px < 16)) break;
    px *= 0.86;
    if (px < 12) break;
  }
  /* vertical fit: never let the stack run out of the canvas */
  var fitRounds = 0;
  while (fitRounds++ < 4 && rows.length) {
    var need = h * 0.30 + (rows.length - 1) * px * 1.36 + px * 0.22;
    if (need <= h) break;
    px *= 0.82;
    if (px < 11) { px = 11; break; }
    cctx.font = ctxFont(px);
  }
  if (truncated && rows.length) {
    var last = rows[rows.length - 1];
    if (last.length) last[last.length - 1] = { c: '…', w: last[last.length - 1].w };
  }
  layout.idx = curIdx;
  layout.text = text;
  layout.px = px;
  layout.rows = rows;
  layout.lh = px * 1.36;
}

function drawLyric(force) {
  if (!cctx) return;
  var w = el.lyr.clientWidth, h = el.lyr.clientHeight;
  if (!curText) {
    if (force || lastFlat !== -2) { cctx.clearRect(0, 0, w, h); lastFlat = -2; }
    return;
  }
  if (layout.idx !== curIdx || layout.text !== curText) {
    buildLayout(curText, w, h);
    force = true;
  }
  var px = layout.px, lh = layout.lh || px * 1.36;
  var rows = layout.rows;
  if (!rows.length) return;

  var L = lines[curIdx] || {};
  var chars = Array.isArray(L.chars) ? L.chars : null;
  var baseT = num(L.t, 0);
  var dur = num(L.dur, 0);
  var flat = 0;
  if (chars && chars.length) {
    var n = Math.min(chars.length, 400);
    for (var q = 0; q < n; q++) {
      if (num(chars[q] && chars[q].t, 1e9) <= t + 0.02) flat = q + 1;
    }
  } else if (dur > 0) {
    flat = Math.min(curText.length, Math.max(0, Math.floor(curText.length * ((t - baseT) / dur))));
  } else if (t >= baseT) flat = curText.length;

  if (!force && flat === lastFlat) return;
  lastFlat = flat;

  cctx.clearRect(0, 0, w, h);
  cctx.font = ctxFont(px);
  cctx.textBaseline = 'alphabetic';
  var top = h * 0.30;
  var cursor = 0;
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    var y = top + r * lh;
    var x = 0;
    for (var i = 0; i < row.length; i++) {
      var g = row[i];
      var sung = (cursor + i) < flat;
      /* wet ink soaks a half-pixel halo; dry ink sits flat and grey */
      if (sung) {
        cctx.fillStyle = 'rgba(34,27,21,0.34)';
        cctx.fillText(g.c, x + 0.7, y + 0.7);
      }
      cctx.fillStyle = sung ? 'rgba(20,15,12,0.95)' : 'rgba(44,36,29,0.62)';
      cctx.fillText(g.c, x, y);
      x += g.w;
    }
    cursor += row.length;
  }
}

function setLineIndex(i) {
  if (i === curIdx) return;
  curIdx = i;
  curText = (i >= 0 && i < lines.length && typeof lines[i].text === 'string') ? lines[i].text : '';
  layout.idx = -2;
  lastFlat = -1;
  drawLyric(true);
  if (el.empty) el.empty.className = (lines.length === 0) ? 'on' : '';
  if (i >= 0) spread(i);
}

/* one wet drop bleeds open at each new line — pure CSS transform, GPU only */
var lastSpread = -1;
function spread(i) {
  if (rm || !el.drop) return;
  if (i === lastSpread) return;
  lastSpread = i;
  var d = el.drop;
  d.classList.remove('go');
  void d.offsetWidth;
  d.classList.add('go');
}

function onMsg(ev) {
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') { onInit(d.payload || {}); return; }
    if (d.type === 'tick') {
      var p = d.payload || {};
      if (typeof p.time === 'number' && isFinite(p.time)) { t = p.time; lastTickAt = performance.now(); }
      if (typeof p.playing === 'boolean') playing = p.playing;
      tickLines();
      return;
    }
    if (d.type === 'beat' || d.type === 'live') { beatBlink(d.payload || {}); return; }
  } catch (e) { console.error('[448] message handler', d && d.type, e); errText = String(e); }
}

function tickLines() {
  var i = -1;
  for (var k = 0; k < lines.length; k++) {
    if (num(lines[k].t, 0) <= t + 0.001) i = k; else break;
  }
  setLineIndex(i);
}

function onInit(p) {
  var song = p.song || {};
  songName = typeof song.name === 'string' ? song.name : '';
  var a = song.artists;
  artistText = Array.isArray(a) ? a.filter(function (x) { return typeof x === 'string'; }).join(' / ')
    : (typeof a === 'string' ? a : '');
  if (Array.isArray(p.accent) && p.accent.length >= 3) {
    var ar = Math.max(0, Math.min(255, Math.round(num(p.accent[0], 168))));
    var ag = Math.max(0, Math.min(255, Math.round(num(p.accent[1], 51))));
    var ab = Math.max(0, Math.min(255, Math.round(num(p.accent[2], 42))));
    accent = [ar, ag, ab];
    /* album colour only ever touches the hairline; paper stays honest */
    if (el.progBar) el.progBar.style.background = 'rgba(' + ar + ',' + ag + ',' + ab + ',0.55)';
  }
  duration = num(p.duration, 0);
  var arr = Array.isArray(p.lines) ? p.lines : [];
  lines = [];
  for (var i = 0; i < arr.length && i < 4000; i++) {
    var L = arr[i] || {};
    var txt = (typeof L.text === 'string') ? L.text : '';
    lines.push({ t: num(L.t, 0), dur: num(L.dur, 0), text: txt, chars: Array.isArray(L.chars) ? L.chars : null });
  }
  playing = (typeof p.playing === 'boolean') ? p.playing : true;
  curIdx = -1; curText = ''; t = 0; lastTickAt = 0; lastSpread = -1;
  layout.idx = -2;
  if (el.mName) el.mName.textContent = songName || '';
  if (el.mArt) el.mArt.textContent = artistText || '';
  if (el.meta) {
    var hasMeta = !!(songName || artistText);
    el.meta.className = hasMeta ? 'on' : '';
  }
  if (el.seal) el.seal.className = 'on';
  if (el.empty) el.empty.className = (lines.length === 0) ? 'on' : '';
  if (el.prog) el.prog.style.display = (duration > 0 && lines.length) ? 'block' : 'none';
  lastPct = -1;
  tickLines();
  layout.idx = -2;
  lastFlat = -1;
  drawLyric(true);
}

function beatBlink(p) {
  var lvl = num(p.level, 0);
  if (!el.blot || rm) return;
  /* ink breathes on the low end: one transform write, no filter/shadow */
  var s = 1 + Math.min(0.055, Math.max(0, lvl) * 0.06);
  el.blot.style.transform = 'translateZ(0) scale(' + s.toFixed(4) + ')';
}

function loop(now) {
  frames++;
  var a = performance.now();
  /* progress hairline: write only when it actually moved */
  if (duration > 0 && el.progBar) {
    var pc = Math.round(Math.max(0, Math.min(1, t / duration)) * 1000) / 10;
    if (pc !== lastPct) { lastPct = pc; el.progBar.style.width = pc + '%'; }
  }
  /* canvas repaints only while a line is still being inked */
  if (curIdx >= 0 && !docHidden) drawLyric(false);
  js = performance.now() - a;
  requestAnimationFrame(loop);
}

el.paper = document.getElementById('paper');
el.blot = document.getElementById('blot');
el.lyr = document.getElementById('lyr');
el.seal = document.getElementById('seal');
el.prog = document.getElementById('prog');
el.meta = document.getElementById('meta');
el.mName = document.getElementById('mName');
el.mArt = document.getElementById('mArt');
el.drop = document.getElementById('drop');
el.empty = document.getElementById('empty');
el.progBar = el.prog ? el.prog.firstElementChild : null;

try { rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
catch (e) { console.error('[448] matchMedia', e); rm = false; }

var docHidden = false;
document.addEventListener('visibilitychange', function () { docHidden = !!document.hidden; });

window.addEventListener('message', onMsg);
window.addEventListener('resize', resize, { passive: true });
resize();

/* first frame: ready unconditionally, before any texture work */
requestAnimationFrame(function () {
  frames++;
  sendReady();
  drawLyric();
});
setTimeout(sendReady, 700);

/* heavy lifting after ready, split across frames */
setTimeout(function () { requestAnimationFrame(buildTextures); }, 60);

requestAnimationFrame(loop);
</script>
</body>
