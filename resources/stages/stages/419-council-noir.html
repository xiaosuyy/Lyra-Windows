<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天台冷线</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#07090b;overflow:hidden;
    font-family:'Arial Narrow','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif}
  #wrap{position:fixed;inset:0;overflow:hidden;background:#07090b}
  #cv{position:absolute;inset:0;display:block;width:100%;height:100%}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(120% 88% at 50% 44%,rgba(0,0,0,0) 34%,rgba(2,4,6,.42) 78%,rgba(2,3,5,.82) 100%),
      linear-gradient(180deg,rgba(3,6,8,.55) 0%,rgba(3,6,8,0) 22%)}
  #scan{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.5;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0px,rgba(0,0,0,.16) 1px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px)}
  #hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;
    justify-content:space-between;padding:3.4vh 4.4vw;pointer-events:none;
    font-size:clamp(9px,1.02vw,12px);letter-spacing:.30em;text-transform:uppercase;
    color:rgba(198,218,224,.46);font-weight:600}
  #hudLeft{display:flex;align-items:center;gap:.9em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #hud .rec{width:6px;height:6px;border-radius:50%;background:#cf5a3e;flex:none;
    box-shadow:0 0 10px rgba(207,90,62,.7);animation:recblink 2.6s steps(1,end) infinite}
  #timecode{font-variant-numeric:tabular-nums;letter-spacing:.22em;color:rgba(198,218,224,.36)}
  @keyframes recblink{0%{opacity:1}45%{opacity:.18}55%{opacity:1}100%{opacity:1}}
  #lyr{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:0 5.4vw 6.4vh 5.4vw;
    pointer-events:none}
  #empty{display:none}
  #empty b{display:block;font-size:clamp(26px,4.6vw,60px);font-weight:800;line-height:1;
    letter-spacing:.10em;color:rgba(226,240,242,.90);text-transform:uppercase;
    text-shadow:0 4px 30px rgba(0,0,0,.85)}
  #empty span{display:block;margin-top:1.5vh;font-size:clamp(12px,1.35vw,17px);
    letter-spacing:.34em;color:rgba(176,198,204,.52)}
  #lineNow{max-width:78vw;font-weight:700;line-height:1.10;letter-spacing:.005em;
    color:#f2f7f8;text-shadow:0 2px 26px rgba(0,0,0,.92),0 0 3px rgba(0,0,0,.6);
    word-break:break-word;font-size:clamp(21px,5.6vw,84px)}
  #lineNow .ch{opacity:.26;transition:opacity .14s linear}
  #lineNow .ch.on{opacity:1;animation:stamp .34s cubic-bezier(.2,.9,.25,1) both}
  @keyframes stamp{
    0%{opacity:.18;color:#fff}
    22%{opacity:1;color:#fff;text-shadow:0 0 26px var(--glow),0 0 8px var(--glow)}
    100%{opacity:1;color:#f2f7f8;text-shadow:0 2px 26px rgba(0,0,0,.92)}}
  #lineBar{position:relative;margin-top:1.7vh;width:min(46vw,560px);height:2px;
    background:rgba(190,214,220,.14)}
  #lineBar i{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);
    box-shadow:0 0 14px var(--glow)}
  #lineNext{margin-top:2.0vh;font-size:clamp(12px,1.45vw,19px);font-weight:600;
    letter-spacing:.06em;color:rgba(184,204,210,.40);max-width:64vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:640px){
    #lyr{padding:0 6vw 5.4vh 6vw}
    #lineBar{width:58vw}
    #lineNow{max-width:86vw}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="scan"></div>
  <div id="hud">
    <div id="hudLeft"><i class="rec"></i><span>Wenlock Court · E3</span></div>
    <div id="hudRight"><span id="timecode">00:00:00</span></div>
  </div>
  <div id="lyr">
    <div id="empty"><b>No Vocals</b><span>混凝土只剩雨声</span></div>
    <div id="lineWrap">
      <div id="lineNow"></div>
      <div id="lineBar"><i></i></div>
    </div>
    <div id="lineNext"></div>
  </div>
</div>
<script>
var state = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, text: '',
  rm: false, accent: [148, 176, 186], accentRaw: [148, 176, 186],
  width: 1440, height: 900, dpr: 1, readySent: false, lastErrorAt: 0
};
window.__stage = function () {
  return {
    lines: state.lines.length, idx: state.idx, t: state.t, playing: state.playing,
    frames: state.frames, js: state.js, err: '', text: state.text,
    gl: false, rm: state.rm
  };
};

function reportError(where, error) {
  var nowMs = Date.now();
  if (nowMs - state.lastErrorAt < 1000) { return; }
  state.lastErrorAt = nowMs;
  console.error('[419 council-noir] ' + where + ':', error);
}

function sendReady() {
  if (state.readySent) { return; }
  state.readySent = true;
  try {
    parent.postMessage({ __c100: 1, type: 'ready' }, '*');
  } catch (error) { reportError('ready', error); }
}
requestAnimationFrame(sendReady);
setTimeout(sendReady, 700);

var dom = {
  canvas: document.getElementById('cv'),
  lineNow: document.getElementById('lineNow'),
  lineNext: document.getElementById('lineNext'),
  lineWrap: document.getElementById('lineWrap'),
  lineBarFill: document.querySelector('#lineBar i'),
  empty: document.getElementById('empty'),
  timecode: document.getElementById('timecode')
};
var paint = dom.canvas.getContext('2d');

function toNumber(value, fallback) {
  var parsed = typeof value === 'number' ? value : parseFloat(value);
  return isFinite(parsed) ? parsed : fallback;
}
function toText(value) {
  if (typeof value === 'string') { return value; }
  if (value === null || value === undefined) { return ''; }
  return String(value);
}
function clampUnit(value) {
  if (!isFinite(value)) { return 0; }
  if (value < 0) { return 0; }
  if (value > 1) { return 1; }
  return value;
}
function resize() {
  var width = (typeof window.innerWidth === 'number' && window.innerWidth > 0) ? window.innerWidth : 1440;
  var height = (typeof window.innerHeight === 'number' && window.innerHeight > 0) ? window.innerHeight : 900;
  if (!isFinite(width) || width <= 0) { width = 1440; }
  if (!isFinite(height) || height <= 0) { height = 900; }
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (width * height * dpr * dpr > 3600000) { dpr = Math.max(1, Math.sqrt(3600000 / (width * height))); }
  if (state.sized && width === state.width && height === state.height && dpr === state.dpr) { return; }
  state.sized = true;
  state.width = width; state.height = height; state.dpr = dpr;
  dom.canvas.width = Math.round(width * dpr);
  dom.canvas.height = Math.round(height * dpr);
  dom.canvas.style.width = width + 'px';
  dom.canvas.style.height = height + 'px';
  if (paint) { paint.setTransform(dpr, 0, 0, dpr, 0, 0); }
  computeSceneLayout();
  bake.needs = true;
}
window.addEventListener('resize', function () {
  try { resize(); } catch (error) { reportError('resize', error); }
});

var lyricView = { lineIndex: -2, spans: [], charTimes: [], litCount: -1 };

var sizeSteps = [
  'clamp(21px,5.6vw,84px)',
  'clamp(18px,4.8vw,70px)',
  'clamp(17px,4.0vw,60px)',
  'clamp(15px,3.2vw,48px)',
  'clamp(14px,2.6vw,38px)',
  'clamp(13px,2.2vw,32px)'
];

function textWidthUnits(text) {
  var characters = Array.from(text);
  var total = 0;
  for (var index = 0; index < characters.length; index += 1) {
    var point = characters[index].codePointAt(0) || 0;
    total += point > 0x2e80 ? 1 : 0.56;
  }
  return total;
}

function pickSizeStep(units) {
  if (units <= 11) { return sizeSteps[0]; }
  if (units <= 16) { return sizeSteps[1]; }
  if (units <= 22) { return sizeSteps[2]; }
  if (units <= 30) { return sizeSteps[3]; }
  if (units <= 42) { return sizeSteps[4]; }
  return sizeSteps[5];
}

function charTimeList(line) {
  var characters = Array.from(line.text);
  var count = characters.length;
  var times = [];
  var index;
  var sourceChars = line.chars;
  if (Array.isArray(sourceChars) && sourceChars.length > 0) {
    for (index = 0; index < count; index += 1) {
      var mapped = count <= 1 ? 0 : Math.round(index * (sourceChars.length - 1) / (count - 1));
      var clampedIndex = Math.min(sourceChars.length - 1, Math.max(0, mapped));
      var entry = sourceChars[clampedIndex];
      var charTime = toNumber(entry ? entry.t : NaN, NaN);
      if (!isFinite(charTime)) { charTime = line.t + index * 0.16; }
      times.push(charTime);
    }
    for (index = 1; index < times.length; index += 1) {
      if (times[index] < times[index - 1]) { times[index] = times[index - 1]; }
    }
    return times;
  }
  var duration = line.dur > 0 ? line.dur : Math.min(9, 1.1 + count * 0.19);
  for (index = 0; index < count; index += 1) {
    times.push(line.t + duration * (index / Math.max(1, count)));
  }
  return times;
}

function buildLineDom(index) {
  lyricView.spans = [];
  lyricView.charTimes = [];
  lyricView.litCount = -1;
  dom.lineNow.textContent = '';
  if (index < 0 || !state.lines[index]) { return; }
  var line = state.lines[index];
  var characters = Array.from(line.text);
  lyricView.charTimes = charTimeList(line);
  dom.lineNow.style.fontSize = pickSizeStep(textWidthUnits(line.text));
  var fragment = document.createDocumentFragment();
  var charIndex;
  for (charIndex = 0; charIndex < characters.length; charIndex += 1) {
    var span = document.createElement('span');
    span.className = 'ch';
    span.textContent = characters[charIndex];
    fragment.appendChild(span);
    lyricView.spans.push(span);
  }
  dom.lineNow.appendChild(fragment);
}

function applyReveal(timeSeconds) {
  var spans = lyricView.spans;
  var times = lyricView.charTimes;
  if (!spans.length) { return; }
  var litCount = 0;
  var index;
  for (index = 0; index < times.length; index += 1) {
    if (times[index] <= timeSeconds + 0.001) { litCount = index + 1; }
  }
  if (litCount === lyricView.litCount) { return; }
  for (index = 0; index < spans.length; index += 1) {
    var shouldLight = index < litCount;
    if (spans[index].classList.contains('on') !== shouldLight) {
      spans[index].classList.toggle('on', shouldLight);
    }
  }
  lyricView.litCount = litCount;
}

function updateLineBar(index) {
  if (!dom.lineBarFill) { return; }
  if (index < 0) {
    dom.lineBarFill.style.width = '0%';
    return;
  }
  var line = state.lines[index];
  if (!line) { return; }
  var span = line.dur > 0 ? line.dur : Math.max(1.6, lyricView.charTimes.length * 0.19);
  var ratio = clampUnit((state.t - line.t) / Math.max(0.35, span));
  dom.lineBarFill.style.width = (ratio * 100).toFixed(2) + '%';
}

function formatTimecode(seconds) {
  var safe = Math.max(0, toNumber(seconds, 0));
  var minutes = Math.floor(safe / 60);
  var wholeSeconds = Math.floor(safe % 60);
  var frames = Math.floor((safe - Math.floor(safe)) * 25);
  var parts = [
    minutes < 10 ? '0' + minutes : String(minutes),
    wholeSeconds < 10 ? '0' + wholeSeconds : String(wholeSeconds),
    frames < 10 ? '0' + frames : String(frames)
  ];
  return parts.join(':');
}

function clampByte(value) {
  return Math.round(Math.min(255, Math.max(0, toNumber(value, 0))));
}

function applyAccent(rawAccent) {
  var red = 148, green = 176, blue = 186;
  if (Array.isArray(rawAccent) && rawAccent.length >= 3) {
    red = clampByte(rawAccent[0]);
    green = clampByte(rawAccent[1]);
    blue = clampByte(rawAccent[2]);
  }
  state.accentRaw = [red, green, blue];
  state.accent = mixColor(state.accentRaw, [204, 228, 236], 0.42);
  state.flashColor = mixColor(state.accent, [222, 240, 245], 0.55);
  try {
    var rootStyle = document.documentElement.style;
    rootStyle.setProperty('--accent', 'rgb(' + state.accent.join(',') + ')');
    rootStyle.setProperty('--glow', 'rgba(' + state.accent.join(',') + ',0.55)');
  } catch (error) { reportError('accentCss', error); }
}

function applySong(payloadSong) {
  if (!payloadSong || typeof payloadSong !== 'object') { return; }
  var name = toText(payloadSong.name);
  var artists = payloadSong.artists;
  var artistText = Array.isArray(artists) ? artists.map(toText).join(' / ') : toText(artists);
  if (name || artistText) { document.title = (name + ' · ' + artistText).replace(/^ · | · $/g, ''); }
}

function clampText(value) {
  var text = toText(value);
  if (text.length <= 220) { return text; }
  return Array.from(text).slice(0, 220).join('');
}

function applyLines(payloadLines) {
  state.lines = [];
  state.idx = -1;
  state.text = '';
  var source = Array.isArray(payloadLines) ? payloadLines : [];
  for (var index = 0; index < source.length; index += 1) {
    var entry = source[index];
    if (!entry || typeof entry !== 'object') { continue; }
    state.lines.push({
      t: toNumber(entry.t, 0),
      dur: Math.max(0, toNumber(entry.dur, 0)),
      text: clampText(entry.text),
      chars: Array.isArray(entry.chars) ? entry.chars.slice(0, 220) : null
    });
  }
  state.lines.sort(function sortByTime(left, right) { return left.t - right.t; });
  lyricView.lineIndex = -2;
  lyricView.spans = [];
  lyricView.charTimes = [];
  dom.lineNow.textContent = '';
  renderLyricState(true);
}

function pickIndex(time) {
  var result = -1;
  for (var index = 0; index < state.lines.length; index += 1) {
    if (state.lines[index].t <= time + 0.02) { result = index; }
  }
  return result;
}

function renderLyricState(force) {
  var index = pickIndex(state.t);
  state.idx = index;
  var current = index >= 0 ? state.lines[index] : null;
  state.text = current ? current.text : '';
  var hasLines = state.lines.length > 0;

  if (dom.empty) { dom.empty.style.display = hasLines ? 'none' : 'block'; }
  if (dom.lineWrap) { dom.lineWrap.style.display = hasLines ? 'block' : 'none'; }
  if (dom.lineNext) { dom.lineNext.style.display = hasLines ? 'block' : 'none'; }

  if (!hasLines) {
    lyricView.lineIndex = -2;
    lyricView.spans = [];
    lyricView.charTimes = [];
    dom.lineNow.textContent = '';
    if (dom.lineNext) { dom.lineNext.textContent = ''; }
    return;
  }

  if (index !== lyricView.lineIndex || force) {
    buildLineDom(index);
    lyricView.lineIndex = index;
    var upcoming = state.lines[index + 1];
    if (dom.lineNext) {
      dom.lineNext.textContent = upcoming ? upcoming.text : '';
      dom.lineNext.style.opacity = upcoming ? '1' : '0';
    }
  }

  applyReveal(state.t);
  updateLineBar(index);
  var stale = false;
  if (current && current.dur > 0 && state.t > current.t + current.dur + 2.2) { stale = true; }
  dom.lineNow.style.opacity = stale ? '0.34' : '1';
  if (dom.timecode) { dom.timecode.textContent = formatTimecode(state.t); }
}

function handleMessage(event) {
  var data = event && event.data;
  if (!data || data.__c100 !== 1) { return; }
  try {
    if (data.type === 'init') {
      var payload = data.payload || {};
      applySong(payload.song);
      applyAccent(payload.accent);
      applyLines(payload.lines);
      if (typeof payload.playing === 'boolean') { state.playing = payload.playing; }
      if (isFinite(toNumber(payload.duration, NaN))) { state.duration = toNumber(payload.duration, 0); }
      resize();
    } else if (data.type === 'tick') {
      var tickPayload = data.payload || {};
      state.t = toNumber(tickPayload.time, state.t);
      if (typeof tickPayload.playing === 'boolean') { state.playing = tickPayload.playing; }
      renderLyricState(false);
    } else if (data.type === 'beat') {
      var beatPayload = data.payload || {};
      var beatLevel = clampUnit(toNumber(beatPayload.level, 0));
      state.beatLevel = beatLevel;
      state.beatPulse = Math.max(state.beatPulse, beatLevel);
      if (beatLevel > 0.40) { state.flash = Math.max(state.flash, beatLevel * 0.92); }
    } else if (data.type === 'live') {
      var livePayload = data.payload || {};
      state.bpm = toNumber(livePayload.bpm, 0);
      state.level = clampUnit(toNumber(livePayload.level, 0));
      state.bass = clampUnit(toNumber(livePayload.bass, state.bass));
      state.mid = clampUnit(toNumber(livePayload.mid, state.mid));
      state.treble = clampUnit(toNumber(livePayload.treble, state.treble));
      if (typeof livePayload.playing === 'boolean') { state.playing = livePayload.playing; }
    }
  } catch (error) {
    reportError('message:' + toText(data.type), error);
  }
}
window.addEventListener('message', handleMessage);

state.beatLevel = 0;
state.level = 0;
state.bpm = 0;
state.flash = 0;
state.beatPulse = 0;
state.bass = 0;
state.mid = 0;
state.treble = 0;

var scene = {
  width: 0, height: 0, horizonY: 0, parapetY: 0,
  slab: { farX: 0, nearX: 0, farTop: 0, nearTop: 0, farBottom: 0, nearBottom: 0 },
  bustX: 0, bustY: 0, bustSize: 0
};
var bake = { canvas: null, ctx: null, ready: false, steps: [], cursor: 0, random: null, needs: true };

function paintColor(red, green, blue, alpha) {
  var outRed = Math.round(Math.min(255, Math.max(0, toNumber(red, 0))));
  var outGreen = Math.round(Math.min(255, Math.max(0, toNumber(green, 0))));
  var outBlue = Math.round(Math.min(255, Math.max(0, toNumber(blue, 0))));
  var outAlpha = alpha === undefined ? 1 : clampUnit(toNumber(alpha, 1));
  return 'rgba(' + outRed + ',' + outGreen + ',' + outBlue + ',' + outAlpha.toFixed(3) + ')';
}

function addStop(gradient, offset, color) {
  if (!gradient || typeof gradient.addColorStop !== 'function') { return; }
  try {
    gradient.addColorStop(clampUnit(toNumber(offset, 0)), color);
  } catch (error) { reportError('addColorStop', error); }
}

function beginPathSafe(target) {
  if (!target || typeof target.beginPath !== 'function') { return false; }
  target.beginPath();
  return true;
}

function makeLinearGradient(target, x0, y0, x1, y1) {
  if (!target || typeof target.createLinearGradient !== 'function') { return null; }
  var ax = isFinite(x0) ? x0 : 0, ay = isFinite(y0) ? y0 : 0;
  var bx = isFinite(x1) ? x1 : 0, by = isFinite(y1) ? y1 : 0;
  try { return target.createLinearGradient(ax, ay, bx, by); }
  catch (error) { reportError('linearGradient', error); return null; }
}

function makeRadialGradient(target, x0, y0, r0, x1, y1, r1) {
  if (!target || typeof target.createRadialGradient !== 'function') { return null; }
  var ax = isFinite(x0) ? x0 : 0, ay = isFinite(y0) ? y0 : 0;
  var bx = isFinite(x1) ? x1 : 0, by = isFinite(y1) ? y1 : 0;
  var inner = isFinite(r0) && r0 > 0 ? r0 : 0.01;
  var outer = isFinite(r1) && r1 > 0 ? r1 : 1;
  try { return target.createRadialGradient(ax, ay, inner, bx, by, outer); }
  catch (error) { reportError('radialGradient', error); return null; }
}

function traceQuad(target, points) {
  if (!beginPathSafe(target) || !points || points.length < 4) { return false; }
  target.moveTo(points[0].x, points[0].y);
  target.lineTo(points[1].x, points[1].y);
  target.lineTo(points[2].x, points[2].y);
  target.lineTo(points[3].x, points[3].y);
  target.closePath();
  return true;
}

function fillQuad(target, points, style) {
  if (!target) { return; }
  if (!traceQuad(target, points)) { return; }
  target.fillStyle = style || '#111a1e';
  target.fill();
}

function blitCanvas(target, source, destX, destY, destWidth, destHeight) {
  if (!target || !source) { return false; }
  if (typeof source.getContext !== 'function') { return false; }
  if (!(source.width > 0) || !(source.height > 0)) { return false; }
  var width = isFinite(destWidth) && destWidth > 0 ? destWidth : source.width;
  var height = isFinite(destHeight) && destHeight > 0 ? destHeight : source.height;
  try {
    target.drawImage(source, isFinite(destX) ? destX : 0, isFinite(destY) ? destY : 0, width, height);
    return true;
  } catch (error) { reportError('drawImage', error); return false; }
}

function makeRandom(seed) {
  var seedValue = seed >>> 0;
  return function nextRandom() {
    seedValue = (seedValue * 1664525 + 1013904223) >>> 0;
    return seedValue / 4294967296;
  };
}

function computeSceneLayout() {
  var width = state.width, height = state.height;
  scene.width = width;
  scene.height = height;
  scene.horizonY = height * 0.655;
  scene.parapetY = height * 0.712;
  scene.slab.farX = width * 0.24;
  scene.slab.nearX = width * 1.04;
  scene.slab.farTop = height * 0.255;
  scene.slab.nearTop = height * 0.028;
  scene.slab.farBottom = height * 0.700;
  scene.slab.nearBottom = height * 0.790;
  scene.bustX = width * 0.872;
  scene.bustY = height * 1.038;
  scene.bustSize = height * 0.470;
  scene.tvWindows = [];
}

var sprites = { standing: null, bust: null, droplet: null, grainPattern: null, needs: false };

function mixColor(fromColor, toColor, amount) {
  var ratio = clampUnit(amount);
  var fromRed = toNumber(fromColor ? fromColor[0] : 0, 0);
  var fromGreen = toNumber(fromColor ? fromColor[1] : 0, 0);
  var fromBlue = toNumber(fromColor ? fromColor[2] : 0, 0);
  var toRed = toNumber(toColor ? toColor[0] : 0, 0);
  var toGreen = toNumber(toColor ? toColor[1] : 0, 0);
  var toBlue = toNumber(toColor ? toColor[2] : 0, 0);
  return [
    Math.round(fromRed + (toRed - fromRed) * ratio),
    Math.round(fromGreen + (toGreen - fromGreen) * ratio),
    Math.round(fromBlue + (toBlue - fromBlue) * ratio)
  ];
}

function traceStandingFigure(target) {
  if (!beginPathSafe(target)) { return false; }
  target.moveTo(0.000, 0.018);
  target.bezierCurveTo(-0.058, 0.016, -0.098, 0.038, -0.100, 0.074);
  target.lineTo(-0.092, 0.140);
  target.lineTo(-0.215, 0.180);
  target.quadraticCurveTo(-0.246, 0.232, -0.243, 0.284);
  target.quadraticCurveTo(-0.240, 0.404, -0.214, 0.502);
  target.lineTo(-0.198, 0.578);
  target.quadraticCurveTo(-0.184, 0.706, -0.168, 0.862);
  target.lineTo(-0.158, 1.000);
  target.lineTo(-0.040, 1.000);
  target.quadraticCurveTo(-0.030, 0.822, -0.018, 0.672);
  target.lineTo(0.048, 1.000);
  target.lineTo(0.164, 1.000);
  target.quadraticCurveTo(0.186, 0.782, 0.198, 0.578);
  target.lineTo(0.214, 0.502);
  target.quadraticCurveTo(0.240, 0.404, 0.243, 0.284);
  target.quadraticCurveTo(0.246, 0.232, 0.215, 0.180);
  target.lineTo(0.092, 0.140);
  target.lineTo(0.100, 0.074);
  target.bezierCurveTo(0.098, 0.038, 0.058, 0.016, 0.000, 0.018);
  target.closePath();
  return true;
}

function traceBustFigure(target) {
  if (!beginPathSafe(target)) { return false; }
  target.moveTo(0.020, 1.000);
  target.bezierCurveTo(0.040, 0.740, 0.130, 0.630, 0.300, 0.585);
  target.quadraticCurveTo(0.400, 0.566, 0.428, 0.542);
  target.bezierCurveTo(0.352, 0.498, 0.328, 0.398, 0.352, 0.280);
  target.bezierCurveTo(0.376, 0.120, 0.500, 0.020, 0.612, 0.036);
  target.bezierCurveTo(0.716, 0.052, 0.760, 0.140, 0.758, 0.262);
  target.bezierCurveTo(0.756, 0.382, 0.730, 0.470, 0.680, 0.542);
  target.quadraticCurveTo(0.766, 0.558, 0.862, 0.590);
  target.bezierCurveTo(1.070, 0.646, 1.300, 0.746, 1.344, 1.000);
  target.closePath();
  return true;
}

function buildStandingSprite(pixelHeight) {
  var height = Math.max(8, Math.round(pixelHeight));
  var width = Math.max(6, Math.round(height * 0.62));
  var canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  var target = canvas.getContext('2d');
  if (!target) { return null; }
  target.setTransform(height, 0, 0, height, width * 0.5, 0);
  target.shadowColor = paintColor(178, 212, 224, 0.55);
  target.shadowBlur = 8;
  target.shadowOffsetX = -5;
  target.shadowOffsetY = -1;
  if (traceStandingFigure(target)) {
    target.fillStyle = paintColor(3, 5, 6, 1);
    target.fill();
  }
  return canvas;
}

function buildBustSprite(pixelHeight) {
  var height = Math.max(16, Math.round(pixelHeight));
  var width = Math.max(16, Math.round(height * 1.38));
  var canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  var target = canvas.getContext('2d');
  if (!target) { return null; }
  target.setTransform(height, 0, 0, height, 0, 0);
  target.shadowColor = paintColor(186, 218, 230, 0.72);
  target.shadowBlur = 18;
  target.shadowOffsetX = -7;
  target.shadowOffsetY = -2;
  if (traceBustFigure(target)) {
    target.fillStyle = paintColor(3, 5, 6, 1);
    target.fill();
  }
  target.shadowColor = 'rgba(0,0,0,0)';
  target.shadowBlur = 0;

  if (beginPathSafe(target)) {
    target.moveTo(0.462, 0.512);
    target.quadraticCurveTo(0.560, 0.545, 0.660, 0.520);
    target.strokeStyle = paintColor(186, 214, 224, 0.16);
    target.lineWidth = 0.010;
    target.stroke();
    target.beginPath();
    target.moveTo(0.470, 0.585);
    target.quadraticCurveTo(0.455, 0.690, 0.432, 0.760);
    target.moveTo(0.585, 0.585);
    target.quadraticCurveTo(0.600, 0.680, 0.622, 0.742);
    target.strokeStyle = paintColor(150, 176, 186, 0.10);
    target.lineWidth = 0.007;
    target.stroke();
  }

  var soft = document.createElement('canvas');
  soft.width = width;
  soft.height = height;
  var softCtx = soft.getContext('2d');
  if (!softCtx) { return canvas; }
  try { softCtx.filter = 'blur(2.2px)'; } catch (error) { reportError('bustFilter', error); }
  blitCanvas(softCtx, canvas, 0, 0, width, height);
  softCtx.filter = 'none';
  softCtx.globalCompositeOperation = 'destination-out';
  var fade = makeLinearGradient(softCtx, 0, 0, width * 0.09, 0);
  addStop(fade, 0, paintColor(0, 0, 0, 0.9));
  addStop(fade, 1, paintColor(0, 0, 0, 0));
  if (fade) { softCtx.fillStyle = fade; softCtx.fillRect(0, 0, width * 0.09, height); }
  softCtx.globalCompositeOperation = 'source-over';
  return soft;
}

function buildDropletSprite() {
  var size = 72;
  var canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  var target = canvas.getContext('2d');
  if (!target) { return null; }
  var body = makeRadialGradient(target, size * 0.38, size * 0.34, 1, size * 0.5, size * 0.5, size * 0.46);
  addStop(body, 0, paintColor(228, 244, 248, 0.32));
  addStop(body, 0.55, paintColor(150, 180, 190, 0.12));
  addStop(body, 0.92, paintColor(120, 150, 160, 0.16));
  addStop(body, 1, paintColor(120, 150, 160, 0));
  target.fillStyle = body || paintColor(200, 220, 226, 0.12);
  target.beginPath();
  target.arc(size * 0.5, size * 0.5, size * 0.46, 0, Math.PI * 2);
  target.fill();
  target.fillStyle = paintColor(240, 252, 255, 0.5);
  target.beginPath();
  target.arc(size * 0.38, size * 0.32, size * 0.075, 0, Math.PI * 2);
  target.fill();
  return canvas;
}

function buildGrainPattern(target) {
  var size = 128;
  var tile = document.createElement('canvas');
  tile.width = size;
  tile.height = size;
  var tileCtx = tile.getContext('2d');
  if (!tileCtx || typeof tileCtx.createImageData !== 'function') { return null; }
  var image = tileCtx.createImageData(size, size);
  var data = image.data;
  var random = makeRandom(9091);
  var index;
  for (index = 0; index < data.length; index += 4) {
    var level = random() < 0.5 ? 0 : 255;
    data[index] = level;
    data[index + 1] = level;
    data[index + 2] = level;
    data[index + 3] = Math.round(14 + random() * 88);
  }
  tileCtx.putImageData(image, 0, 0);
  try { return target.createPattern(tile, 'repeat'); }
  catch (error) { reportError('grainPattern', error); return null; }
}

function buildSprites() {
  sprites.needs = false;
  try {
    sprites.standing = buildStandingSprite(Math.round(state.height * 0.62));
    sprites.bust = buildBustSprite(Math.round(Math.min(state.height * 0.72, state.width * 0.95)));
    sprites.droplet = buildDropletSprite();
    sprites.grainPattern = buildGrainPattern(paint);
    resetRain();
  } catch (error) { reportError('buildSprites', error); }
}

var rain = { drops: [] };
function resetRain() {
  var width = state.width, height = state.height;
  var count = Math.round(Math.min(220, Math.max(50, (width * height) / 9500)));
  var random = makeRandom(229911);
  rain.drops = [];
  var index;
  for (index = 0; index < count; index += 1) {
    rain.drops.push({
      x: random() * width * 1.2 - width * 0.1,
      y: random() * height,
      length: 9 + random() * 30,
      speed: 560 + random() * 980,
      layer: index % 3
    });
  }
}

function slabPoint(uValue, vValue) {
  var unitAlong = clampUnit(uValue), unitDown = clampUnit(vValue);
  var slab = scene.slab;
  var screenX = slab.farX + (slab.nearX - slab.farX) * unitAlong;
  var topY = slab.farTop + (slab.nearTop - slab.farTop) * unitAlong;
  var bottomY = slab.farBottom + (slab.nearBottom - slab.farBottom) * unitAlong;
  return { x: screenX, y: topY + (bottomY - topY) * unitDown, u: unitAlong, v: unitDown };
}

function slabQuad(uStart, vStart, uEnd, vEnd) {
  return [
    slabPoint(uStart, vStart), slabPoint(uEnd, vStart),
    slabPoint(uEnd, vEnd), slabPoint(uStart, vEnd)
  ];
}

function bakeSky(target, random) {
  var width = scene.width, height = scene.height, horizonY = scene.horizonY;
  var sky = makeLinearGradient(target, 0, 0, 0, height);
  addStop(sky, 0, '#080d10');
  addStop(sky, 0.30, '#101a1f');
  addStop(sky, 0.80, '#202c32');
  addStop(sky, 1, '#2c3c43');
  target.fillStyle = sky || '#0d1519';
  target.fillRect(0, 0, width, height);

  var cloudIndex;
  for (cloudIndex = 0; cloudIndex < 4; cloudIndex += 1) {
    var cloudX = width * (0.05 + random() * 0.95);
    var cloudY = horizonY * (0.10 + random() * 0.75);
    var cloudRadius = width * (0.18 + random() * 0.40);
    var cloud = makeRadialGradient(target, cloudX, cloudY, cloudRadius * 0.1, cloudX, cloudY, cloudRadius);
    addStop(cloud, 0, paintColor(126, 150, 160, 0.12 + random() * 0.08));
    addStop(cloud, 0.55, paintColor(96, 120, 130, 0.045));
    addStop(cloud, 1, paintColor(90, 110, 120, 0));
    if (cloud) { target.fillStyle = cloud; target.fillRect(0, 0, width, horizonY * 1.12); }
  }

  var blockIndex;
  for (blockIndex = 0; blockIndex < 12; blockIndex += 1) {
    var blockWidth = width * (0.030 + random() * 0.075);
    var blockX = width * random() * 0.36 - blockWidth * 0.3;
    var tall = random() < 0.28;
    var blockHeight = height * (tall ? 0.20 + random() * 0.16 : 0.05 + random() * 0.15);
    var blockTop = horizonY - blockHeight;
    target.fillStyle = paintColor(10, 15, 18, 0.55 + random() * 0.3);
    target.fillRect(blockX, blockTop, blockWidth, blockHeight + 4);
    target.fillStyle = paintColor(120, 148, 158, 0.05);
    target.fillRect(blockX, blockTop, blockWidth, 1.5);
    var lightIndex;
    for (lightIndex = 0; lightIndex < 4; lightIndex += 1) {
      if (random() < 0.45) {
        target.fillStyle = paintColor(168, 196, 202, 0.10 + random() * 0.20);
        target.fillRect(blockX + blockWidth * (0.1 + random() * 0.7), blockTop + blockHeight * (0.15 + random() * 0.6), blockWidth * 0.08, 2);
      }
    }
  }

  target.strokeStyle = paintColor(140, 165, 172, 0.18);
  target.lineWidth = 1.4;
  var craneX = width * 0.105, craneTop = horizonY - height * 0.30;
  target.beginPath();
  target.moveTo(craneX, horizonY);
  target.lineTo(craneX, craneTop);
  target.moveTo(craneX - width * 0.050, craneTop + height * 0.012);
  target.lineTo(craneX + width * 0.070, craneTop + height * 0.012);
  target.stroke();
}

function bakeSlab(target, random) {
  var slab = scene.slab;
  var face = makeLinearGradient(target, slab.farX, 0, slab.nearX, 0);
  addStop(face, 0, '#41535b');
  addStop(face, 0.35, '#34444b');
  addStop(face, 0.72, '#29363c');
  addStop(face, 1, '#1f282d');
  fillQuad(target, slabQuad(0, 0, 1, 1), face || '#243036');

  var shade = makeLinearGradient(target, 0, slab.nearTop, 0, slab.nearBottom);
  addStop(shade, 0, paintColor(158, 186, 196, 0.12));
  addStop(shade, 0.45, paintColor(10, 16, 20, 0.06));
  addStop(shade, 1, paintColor(0, 0, 0, 0.42));
  if (traceQuad(target, slabQuad(0, 0, 1, 1))) {
    target.fillStyle = shade || paintColor(0, 0, 0, 0.2);
    target.fill();
  }

  var columns = 16, rows = 12;
  var columnStep = 0.955 / columns;
  var rowStep = 0.905 / rows;
  var columnIndex, rowIndex;
  scene.tvWindows = [];

  for (rowIndex = 0; rowIndex < rows; rowIndex += 1) {
    var rowBottom = 0.045 + rowStep * (rowIndex + 1);
    var rowTop = rowBottom - rowStep * 0.60;
    for (columnIndex = 0; columnIndex < columns; columnIndex += 1) {
      var paneLeft = 0.028 + columnStep * columnIndex + columnStep * 0.30;
      var paneRight = paneLeft + columnStep * 0.40;
      var depthFade = 0.32 + 0.68 * paneLeft;
      var pane = slabQuad(paneLeft, rowTop, paneRight, rowBottom);
      target.fillStyle = paintColor(6, 10, 12, 0.5);
      if (traceQuad(target, pane)) { target.fill(); }

      var roll = random();
      var litChance = rowIndex >= rows - 5 ? 0.42 : 0.245;
      if (roll < litChance) {
        var warmth = random() < 0.08;
        var litAlpha = (0.26 + random() * 0.54) * depthFade;
        var innerQuad = slabQuad(paneLeft + columnStep * 0.04, rowTop + rowStep * 0.05,
          paneRight - columnStep * 0.04, rowBottom - rowStep * 0.04);
        target.fillStyle = warmth
          ? paintColor(206, 166, 108, litAlpha * 0.8)
          : paintColor(176, 204, 210, litAlpha);
        if (traceQuad(target, innerQuad)) { target.fill(); }
        if (random() < 0.28) {
          target.fillStyle = paintColor(4, 7, 9, 0.55);
          var curtain = slabQuad(paneLeft + columnStep * 0.20, rowTop, paneRight, rowBottom);
          if (traceQuad(target, curtain)) { target.fill(); }
        }
        if (scene.tvWindows.length < 9 && random() < 0.18 && !warmth) {
          var cornerA = slabPoint(paneLeft, rowTop);
          var cornerB = slabPoint(paneRight, rowBottom);
          scene.tvWindows.push({
            x: cornerA.x, y: cornerA.y,
            w: Math.max(2, cornerB.x - cornerA.x), h: Math.max(2, cornerB.y - cornerA.y),
            phase: random() * 6.283
          });
        }
      } else if (roll < 0.33) {
        target.fillStyle = paintColor(120, 150, 158, 0.05 + random() * 0.05);
        if (traceQuad(target, pane)) { target.fill(); }
      }
    }
  }

  for (rowIndex = 0; rowIndex < rows; rowIndex += 3) {
    var deckV = 0.045 + rowStep * rowIndex;
    var deck = slabQuad(0.01, deckV - 0.004, 0.99, deckV + 0.011);
    target.fillStyle = paintColor(166, 190, 196, 0.11);
    if (traceQuad(target, deck)) { target.fill(); }
    var deckShadow = slabQuad(0.01, deckV + 0.011, 0.99, deckV + 0.019);
    target.fillStyle = paintColor(0, 0, 0, 0.30);
    if (traceQuad(target, deckShadow)) { target.fill(); }
  }

  for (columnIndex = 0; columnIndex <= columns; columnIndex += 1) {
    var pierU = 0.028 + columnStep * columnIndex;
    var pier = slabQuad(pierU, 0.02, pierU + columnStep * 0.07, 0.99);
    target.fillStyle = paintColor(150, 176, 184, 0.055);
    if (traceQuad(target, pier)) { target.fill(); }
  }
}

function bakeGrime(target, random) {
  var streakIndex;
  for (streakIndex = 0; streakIndex < 90; streakIndex += 1) {
    var streakU = random() * 0.99;
    var streakV = random() * 0.9;
    var streakWidth = 0.0016 + random() * 0.005;
    var streakLength = 0.05 + random() * 0.28;
    var streak = slabQuad(streakU, streakV, streakU + streakWidth, Math.min(0.995, streakV + streakLength));
    target.fillStyle = paintColor(0, 0, 0, 0.05 + random() * 0.10);
    if (traceQuad(target, streak)) { target.fill(); }
  }

  var pipeIndex;
  for (pipeIndex = 0; pipeIndex < 3; pipeIndex += 1) {
    var pipeU = 0.215 + pipeIndex * 0.265 + random() * 0.03;
    var pipeTop = slabPoint(pipeU, 0.01);
    var pipeBottom = slabPoint(pipeU, 0.99);
    var pipeWidth = Math.max(2.5, scene.width * 0.0026);
    target.strokeStyle = paintColor(13, 19, 22, 0.85);
    target.lineWidth = pipeWidth;
    if (beginPathSafe(target)) {
      target.moveTo(pipeTop.x, pipeTop.y);
      target.lineTo(pipeBottom.x, pipeBottom.y);
      target.stroke();
    }
    target.strokeStyle = paintColor(172, 200, 210, 0.14);
    target.lineWidth = 1;
    if (beginPathSafe(target)) {
      target.moveTo(pipeTop.x - pipeWidth * 0.5, pipeTop.y);
      target.lineTo(pipeBottom.x - pipeWidth * 0.5, pipeBottom.y);
      target.stroke();
    }
  }

  var roofIndex;
  for (roofIndex = 0; roofIndex < 7; roofIndex += 1) {
    var roofU = 0.06 + random() * 0.9;
    var roofTop = slabPoint(roofU, 0);
    var boxWidth = scene.width * (0.008 + random() * 0.02);
    var boxHeight = scene.height * (0.008 + random() * 0.022);
    target.fillStyle = paintColor(8, 12, 14, 0.85);
    target.fillRect(roofTop.x - boxWidth * 0.5, roofTop.y - boxHeight, boxWidth, boxHeight + 2);
  }

  var mastIndex;
  for (mastIndex = 0; mastIndex < 5; mastIndex += 1) {
    var mastU = 0.20 + random() * 0.7;
    var mastBase = slabPoint(mastU, 0.002);
    var mastHeight = scene.height * (0.025 + random() * 0.05);
    target.strokeStyle = paintColor(10, 14, 16, 0.9);
    target.lineWidth = 1.6;
    if (beginPathSafe(target)) {
      target.moveTo(mastBase.x, mastBase.y);
      target.lineTo(mastBase.x, mastBase.y - mastHeight);
      target.moveTo(mastBase.x - 7, mastBase.y - mastHeight * 0.7);
      target.lineTo(mastBase.x + 7, mastBase.y - mastHeight * 0.7);
      target.moveTo(mastBase.x - 5, mastBase.y - mastHeight * 0.9);
      target.lineTo(mastBase.x + 5, mastBase.y - mastHeight * 0.9);
      target.stroke();
    }
  }

  var signAt = slabPoint(0.62, 0.055);
  target.save();
  target.font = '600 ' + Math.max(9, Math.round(scene.height * 0.013)) + 'px "Arial Narrow", Arial, sans-serif';
  if ('letterSpacing' in target) { target.letterSpacing = '3px'; }
  target.fillStyle = paintColor(206, 224, 228, 0.22);
  target.fillText('WENLOCK COURT', signAt.x, signAt.y);
  target.font = '600 ' + Math.max(7, Math.round(scene.height * 0.009)) + 'px "Arial Narrow", Arial, sans-serif';
  target.fillStyle = paintColor(206, 224, 228, 0.14);
  target.fillText('E3  ·  1968', signAt.x, signAt.y + scene.height * 0.022);
  target.restore();
}

function bakeGroundPlane(target, random) {
  var width = scene.width, height = scene.height;
  var groundY = scene.horizonY;

  var ground = makeLinearGradient(target, 0, groundY, 0, height);
  addStop(ground, 0, '#1a2429');
  addStop(ground, 0.35, '#0e1518');
  addStop(ground, 1, '#050709');
  target.fillStyle = ground || '#0b1114';
  target.fillRect(0, groundY, width, height - groundY);

  var reflectIndex;
  for (reflectIndex = 0; reflectIndex < 16; reflectIndex += 1) {
    var reflectY = groundY + random() * (scene.parapetY - groundY) * 0.9;
    var reflectWidth = width * (0.05 + random() * 0.22);
    var reflectX = width * random() * 0.95;
    target.fillStyle = paintColor(160, 190, 198, 0.03 + random() * 0.05);
    target.fillRect(reflectX, reflectY, reflectWidth, 1 + random() * 2);
  }
}

function bakeParapet(target, random) {
  var width = scene.width, height = scene.height;
  target.fillStyle = paintColor(6, 9, 11, 0.92);
  target.fillRect(0, scene.parapetY, width, height - scene.parapetY);

  var parapet = makeLinearGradient(target, 0, scene.parapetY, 0, height);
  addStop(parapet, 0, paintColor(26, 34, 38, 1));
  addStop(parapet, 0.10, paintColor(12, 17, 20, 1));
  addStop(parapet, 0.55, paintColor(8, 11, 13, 1));
  addStop(parapet, 1, paintColor(4, 5, 6, 1));
  target.fillStyle = parapet || '#0a0e10';
  target.fillRect(0, scene.parapetY, width, height - scene.parapetY);

  target.fillStyle = paintColor(186, 210, 216, 0.20);
  target.fillRect(0, scene.parapetY, width, 1.6);
  target.fillStyle = paintColor(186, 210, 216, 0.06);
  target.fillRect(0, scene.parapetY + 2.4, width, 3);

  var notchIndex;
  for (notchIndex = 0; notchIndex < 26; notchIndex += 1) {
    var notchX = width * random();
    var notchWidth = 4 + random() * 26;
    target.fillStyle = paintColor(0, 0, 0, 0.22 + random() * 0.3);
    target.fillRect(notchX, scene.parapetY - 1, notchWidth, 1.8);
  }

  var sheenIndex;
  for (sheenIndex = 0; sheenIndex < 9; sheenIndex += 1) {
    var sheenY = scene.parapetY + (height - scene.parapetY) * (0.18 + random() * 0.75);
    var sheenWidth = width * (0.18 + random() * 0.55);
    var sheenX = width * (random() * 0.9 - 0.1);
    var sheen = makeLinearGradient(target, sheenX, sheenY, sheenX + sheenWidth, sheenY);
    addStop(sheen, 0, paintColor(120, 150, 160, 0));
    addStop(sheen, 0.5, paintColor(120, 150, 160, 0.035 + random() * 0.04));
    addStop(sheen, 1, paintColor(120, 150, 160, 0));
    if (sheen) {
      target.fillStyle = sheen;
      target.fillRect(sheenX, sheenY, sheenWidth, 1 + random() * 2.4);
    }
  }
}

function bakeFinish(target, random) {
  var width = scene.width, height = scene.height;
  var bloom = makeRadialGradient(target, width * 0.78, height * 0.26, 10, width * 0.78, height * 0.26, width * 0.55);
  addStop(bloom, 0, paintColor(150, 184, 196, 0.10));
  addStop(bloom, 0.5, paintColor(120, 150, 162, 0.04));
  addStop(bloom, 1, paintColor(120, 150, 162, 0));
  if (bloom) { target.fillStyle = bloom; target.fillRect(0, 0, width, height); }

  var fogIndex;
  for (fogIndex = 0; fogIndex < 4; fogIndex += 1) {
    var fogY = scene.horizonY - scene.height * (0.05 + random() * 0.22);
    var fog = makeLinearGradient(target, 0, fogY, 0, fogY + scene.height * 0.16);
    addStop(fog, 0, paintColor(150, 176, 186, 0));
    addStop(fog, 0.45, paintColor(150, 176, 186, 0.035));
    addStop(fog, 1, paintColor(150, 176, 186, 0));
    if (fog) { target.fillStyle = fog; target.fillRect(0, fogY, width, scene.height * 0.16); }
  }
}

function startBake() {
  try {
    var bakeScale = Math.min(state.dpr, 1.4);
    var maxBakePixels = 2400000;
    var wantedPixels = state.width * state.height * bakeScale * bakeScale;
    if (wantedPixels > maxBakePixels) {
      bakeScale = Math.max(1, Math.sqrt(maxBakePixels / Math.max(1, state.width * state.height)));
    }
    bake.canvas = document.createElement('canvas');
    bake.canvas.width = Math.max(1, Math.round(state.width * bakeScale));
    bake.canvas.height = Math.max(1, Math.round(state.height * bakeScale));
    bake.ctx = bake.canvas.getContext('2d');
    if (!bake.ctx) { throw new Error('no 2d context for bake'); }
    bake.ctx.setTransform(bakeScale, 0, 0, bakeScale, 0, 0);
    bake.random = makeRandom(419077);
    bake.steps = [bakeSky, bakeGroundPlane, bakeSlab, bakeGrime, bakeParapet, bakeFinish];
    bake.cursor = 0;
    bake.ready = false;
    bake.needs = false;
    sprites.needs = true;
  } catch (error) {
    bake.ready = false;
    bake.needs = false;
    reportError('startBake', error);
  }
}

function runBakeQueue() {
  if (bake.ready || !bake.ctx || !bake.steps.length) { return; }
  var stepStart = performance.now();
  while (bake.cursor < bake.steps.length) {
    var step = bake.steps[bake.cursor];
    bake.cursor += 1;
    try { step(bake.ctx, bake.random); }
    catch (error) { reportError('bake:' + bake.cursor, error); }
    if (performance.now() - stepStart > 7) { return; }
  }
  bake.ready = true;
}

function drawFallbackScene() {
  var width = state.width, height = state.height;
  var background = makeLinearGradient(paint, 0, 0, 0, height);
  addStop(background, 0, '#0a1013');
  addStop(background, 0.65, '#141d22');
  addStop(background, 1, '#07090b');
  paint.fillStyle = background || '#0a1013';
  paint.fillRect(0, 0, width, height);
}

var figureSlots = [
  { x: 0.248, height: 0.118, phase: 2.6, sway: 0.70, ember: false },
  { x: 0.322, height: 0.150, phase: 0.4, sway: 1.00, ember: false },
  { x: 0.386, height: 0.160, phase: 1.9, sway: 0.80, ember: true },
  { x: 0.441, height: 0.147, phase: 3.4, sway: 1.20, ember: false },
  { x: 0.521, height: 0.126, phase: 4.6, sway: 0.75, ember: false },
  { x: 0.566, height: 0.134, phase: 5.1, sway: 0.90, ember: false }
];

function drawEmber(target, emberX, emberY, timeSeconds) {
  var pulse = 0.55 + 0.45 * Math.sin(timeSeconds * 2.3);
  var glow = makeRadialGradient(target, emberX, emberY, 0.4, emberX, emberY, 9);
  addStop(glow, 0, paintColor(255, 168, 96, 0.55 * pulse));
  addStop(glow, 0.45, paintColor(255, 128, 62, 0.20 * pulse));
  addStop(glow, 1, paintColor(255, 120, 60, 0));
  if (glow) {
    target.fillStyle = glow;
    target.fillRect(emberX - 9, emberY - 9, 18, 18);
  }
  target.fillStyle = paintColor(255, 196, 132, 0.85 * pulse);
  if (beginPathSafe(target)) {
    target.arc(emberX, emberY, 1.3, 0, Math.PI * 2);
    target.fill();
  }
}

function drawSearchlight(target, timeSeconds) {
  var width = state.width, height = state.height;
  var sweep = Math.sin(timeSeconds * 0.105 + 1.3);
  var lightX = width * (0.52 + sweep * 0.36);
  var lightY = height * (0.30 + Math.cos(timeSeconds * 0.068) * 0.10);
  var beamRadius = width * (0.28 + Math.abs(sweep) * 0.06);
  var strength = 0.035 + 0.028 * Math.max(0, Math.sin(timeSeconds * 0.105 + 0.7));
  var beam = makeRadialGradient(target, lightX, lightY, beamRadius * 0.06, lightX, lightY, beamRadius);
  addStop(beam, 0, paintColor(192, 216, 224, strength));
  addStop(beam, 0.45, paintColor(172, 198, 208, strength * 0.32));
  addStop(beam, 1, paintColor(160, 190, 200, 0));
  if (!beam) { return; }
  target.save();
  target.globalCompositeOperation = 'lighter';
  target.fillStyle = beam;
  target.fillRect(0, 0, width, height);
  target.restore();
}

function drawTvWindows(target, timeSeconds) {
  var windows = scene.tvWindows;
  if (!windows || !windows.length) { return; }
  var index;
  for (index = 0; index < windows.length; index += 1) {
    var item = windows[index];
    var flicker = Math.abs(Math.sin(timeSeconds * 3.7 + item.phase) * Math.sin(timeSeconds * 11.3 + item.phase * 1.7));
    target.fillStyle = paintColor(172, 200, 216, 0.05 + flicker * 0.20);
    target.fillRect(item.x, item.y, item.w, item.h);
  }
}

function drawRooftopFigures(target, timeSeconds, motionScale) {
  var sprite = sprites.standing;
  if (!sprite) { return; }
  var height = state.height;
  var baseY = scene.parapetY + height * 0.004;
  var slotIndex;
  for (slotIndex = 0; slotIndex < figureSlots.length; slotIndex += 1) {
    var slot = figureSlots[slotIndex];
    var figureHeight = height * slot.height * (1 + state.bass * 0.020);
    if (figureHeight < 4) { continue; }
    var figureWidth = figureHeight * 0.62;
    var drift = Math.sin(timeSeconds * 0.33 + slot.phase) * height * 0.0018 * motionScale * slot.sway;
    var bob = Math.sin(timeSeconds * 0.88 + slot.phase) * height * 0.0014 * motionScale;
    var lean = Math.sin(timeSeconds * 0.46 + slot.phase * 1.7) * 0.008 * motionScale * slot.sway;
    target.save();
    target.translate(state.width * slot.x + drift, baseY + bob);
    target.rotate(lean + state.flash * 0.012);
    blitCanvas(target, sprite, -figureWidth * 0.5, -figureHeight, figureWidth, figureHeight);
    if (state.beatPulse > 0.03) {
      target.globalCompositeOperation = 'lighter';
      target.globalAlpha = Math.min(0.30, state.beatPulse * 0.26);
      blitCanvas(target, sprite, -figureWidth * 0.5, -figureHeight, figureWidth, figureHeight);
      target.globalAlpha = 1;
      target.globalCompositeOperation = 'source-over';
    }
    if (slot.ember) {
      drawEmber(target, figureWidth * 0.16, -figureHeight * 0.945, timeSeconds);
    }
    target.restore();
  }
}

function drawForegroundBust(target, timeSeconds, motionScale) {
  var sprite = sprites.bust;
  if (!sprite) { return; }
  var width = state.width, height = state.height;
  var bustHeight = Math.min(height * 0.470, width * 0.640) * (1 + state.bass * 0.014);
  var bustWidth = bustHeight * 1.38;
  var sway = Math.sin(timeSeconds * 0.41) * 0.006 * motionScale;
  var bob = Math.sin(timeSeconds * 0.55 + 1.2) * height * 0.0022 * motionScale;
  target.save();
  target.translate(scene.bustX, scene.bustY + bob);
  target.rotate(sway);
  target.globalAlpha = 0.97;
  blitCanvas(target, sprite, -bustWidth * 0.5, -bustHeight, bustWidth, bustHeight);
  if (state.beatPulse > 0.05) {
    target.globalCompositeOperation = 'lighter';
    target.globalAlpha = Math.min(0.22, state.beatPulse * 0.20);
    blitCanvas(target, sprite, -bustWidth * 0.5, -bustHeight, bustWidth, bustHeight);
    target.globalCompositeOperation = 'source-over';
  }
  target.globalAlpha = 1;
  target.restore();
}

function drawRain(target, scaledDelta) {
  var width = state.width, height = state.height;
  var drops = rain.drops;
  var index;
  for (index = 0; index < drops.length; index += 1) {
    var drop = drops[index];
    drop.y += drop.speed * scaledDelta;
    drop.x += drop.speed * 0.085 * scaledDelta;
    if (drop.y - drop.length > height || drop.x - drop.length > width * 1.1) {
      drop.y = -drop.length - Math.random() * height * 0.2;
      drop.x = Math.random() * width * 1.2 - width * 0.15;
    }
  }
  var layerAlpha = [0.055, 0.10, 0.17];
  var layerWidth = [1, 1.15, 1.7];
  var layerIndex;
  for (layerIndex = 0; layerIndex < 3; layerIndex += 1) {
    target.strokeStyle = paintColor(186, 214, 222, layerAlpha[layerIndex]);
    target.lineWidth = layerWidth[layerIndex];
    if (!beginPathSafe(target)) { return; }
    for (index = 0; index < drops.length; index += 1) {
      var current = drops[index];
      if (current.layer !== layerIndex) { continue; }
      target.moveTo(current.x, current.y);
      target.lineTo(current.x - current.length * 0.105, current.y + current.length);
    }
    target.stroke();
  }
}

function drawLensDrops(target, timeSeconds) {
  var sprite = sprites.droplet;
  if (!sprite) { return; }
  var width = state.width, height = state.height;
  var lensSlots = [
    { x: 0.135, y: 0.180, size: 0.085, speed: 0.0042 },
    { x: 0.248, y: 0.470, size: 0.062, speed: 0.0071 },
    { x: 0.520, y: 0.130, size: 0.048, speed: 0.0035 },
    { x: 0.672, y: 0.360, size: 0.072, speed: 0.0090 },
    { x: 0.858, y: 0.230, size: 0.054, speed: 0.0055 },
    { x: 0.330, y: 0.760, size: 0.070, speed: 0.0110 },
    { x: 0.760, y: 0.820, size: 0.095, speed: 0.0068 }
  ];
  var slotIndex;
  for (slotIndex = 0; slotIndex < lensSlots.length; slotIndex += 1) {
    var slot = lensSlots[slotIndex];
    var slide = (slot.y + timeSeconds * slot.speed) % 1.06;
    var dropSize = width * slot.size;
    target.globalAlpha = 0.42;
    blitCanvas(target, sprite, slot.x * width - dropSize * 0.5, slide * height, dropSize, dropSize * 1.18);
  }
  target.globalAlpha = 1;
}

function drawLyricScrim(target) {
  var width = state.width, height = state.height;
  var scrim = makeLinearGradient(target, 0, height * 0.44, 0, height);
  addStop(scrim, 0, paintColor(4, 7, 9, 0));
  addStop(scrim, 0.38, paintColor(4, 7, 9, 0.28));
  addStop(scrim, 0.70, paintColor(3, 5, 7, 0.62));
  addStop(scrim, 1, paintColor(2, 3, 5, 0.88));
  if (scrim) { target.fillStyle = scrim; target.fillRect(0, height * 0.44, width, height * 0.56); }

  var sideScrim = makeLinearGradient(target, 0, 0, width * 0.62, 0);
  addStop(sideScrim, 0, paintColor(3, 6, 8, 0.24));
  addStop(sideScrim, 0.55, paintColor(3, 6, 8, 0.08));
  addStop(sideScrim, 1, paintColor(3, 6, 8, 0));
  if (sideScrim) { target.fillStyle = sideScrim; target.fillRect(0, 0, width * 0.62, height); }
}

function drawFlash(target) {
  if (state.flash <= 0.015) { return; }
  var width = state.width, height = state.height;
  var flashColor = state.flashColor || [206, 230, 238];
  target.fillStyle = paintColor(flashColor[0], flashColor[1], flashColor[2], state.flash * 0.095);
  target.fillRect(0, 0, width, height);
  var band = makeLinearGradient(target, 0, height * 0.34, 0, height * 0.58);
  addStop(band, 0, paintColor(flashColor[0], flashColor[1], flashColor[2], 0));
  addStop(band, 0.5, paintColor(flashColor[0], flashColor[1], flashColor[2], state.flash * 0.12));
  addStop(band, 1, paintColor(flashColor[0], flashColor[1], flashColor[2], 0));
  if (band) { target.fillStyle = band; target.fillRect(0, height * 0.34, width, height * 0.24); }
}

function drawGrain(target, timeSeconds) {
  if (!sprites.grainPattern) { return; }
  var width = state.width, height = state.height;
  var offsetX = Math.random() * 128;
  var offsetY = Math.random() * 128;
  target.save();
  target.setTransform(1, 0, 0, 1, 0, 0);
  target.globalAlpha = state.rm ? 0.028 : 0.055;
  target.translate(-offsetX, -offsetY);
  target.fillStyle = sprites.grainPattern;
  target.fillRect(0, 0, Math.round(width * state.dpr) + 128, Math.round(height * state.dpr) + 128);
  target.restore();
  target.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}

function drawFrame(deltaSeconds) {
  if (!paint) { return; }
  var width = state.width;
  var height = state.height;
  var timeSeconds = (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : Date.now() / 1000;
  var motionScale = state.rm ? 0.32 : 1;
  var clockScale = state.playing ? 1 : 0.22;

  paint.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  if (bake.needs) { startBake(); }
  if (!bake.ready) { runBakeQueue(); }
  if (sprites.needs && bake.ready) { buildSprites(); }

  state.flash = Math.max(0, state.flash - deltaSeconds * 2.8);
  state.beatPulse = Math.max(0, state.beatPulse - deltaSeconds * 2.2);

  var shakeX = (Math.sin(timeSeconds * 0.33) * 1.8 + Math.sin(timeSeconds * 0.83) * 0.8) * motionScale * clockScale;
  var shakeY = (Math.cos(timeSeconds * 0.27) * 1.3) * motionScale * clockScale;
  var jolt = state.flash * 6 * motionScale;

  paint.save();
  paint.translate(width * 0.5 + shakeX - jolt, height * 0.5 + shakeY + jolt * 0.7);
  paint.scale(1.035, 1.035);
  paint.translate(-width * 0.5, -height * 0.5);
  if (!bake.ready || !blitCanvas(paint, bake.canvas, 0, 0, width, height)) {
    drawFallbackScene();
  }
  drawSearchlight(paint, timeSeconds);
  drawTvWindows(paint, timeSeconds);
  drawRooftopFigures(paint, timeSeconds, motionScale);
  drawRain(paint, Math.max(0, Math.min(0.1, deltaSeconds)) * clockScale);
  drawForegroundBust(paint, timeSeconds, motionScale);
  paint.restore();

  drawLyricScrim(paint);
  drawLensDrops(paint, timeSeconds);
  drawFlash(paint);
  drawGrain(paint, timeSeconds);
}

var lastFrameTime = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  var frameStart = performance.now();
  var deltaSeconds = lastFrameTime ? Math.min(0.1, (nowMs - lastFrameTime) / 1000) : 0.016;
  lastFrameTime = nowMs;
  try {
    drawFrame(deltaSeconds);
  } catch (error) {
    reportError('frame', error);
  }
  state.frames += 1;
  state.js = performance.now() - frameStart;
}

try {
  state.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (window.matchMedia) {
    var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (motionQuery && typeof motionQuery.addEventListener === 'function') {
      motionQuery.addEventListener('change', function onMotionChange(motionEvent) {
        state.rm = !!(motionEvent && motionEvent.matches);
      });
    }
  }
  applyAccent(state.accentRaw);
  resize();
  renderLyricState(true);
  if (!paint) { reportError('boot', new Error('2d context unavailable')); }
  requestAnimationFrame(frame);
} catch (error) {
  reportError('boot', error);
}
</script>
</body>
</html>
