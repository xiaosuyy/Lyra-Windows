<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>326 · 白棋阵列</title>
<style>
  html,body{margin:0;height:100%;background:#080406;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;color:#f2e4d6;
    --acc:rgba(214,96,70,1);--acc-soft:rgba(214,96,70,.30);
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    -webkit-font-smoothing:antialiased}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .layer{position:absolute;inset:0;pointer-events:none}

  /* 顶部浮雕字标 */
  #mark{position:absolute;left:0;right:0;top:clamp(10px,3.2vh,38px);text-align:center;
    pointer-events:none;transform-origin:50% 0;
    transform:perspective(900px) rotateX(9deg)}
  #mark .word{display:inline-block;font-size:clamp(14px,2.05vw,27px);line-height:1.1;
    max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    letter-spacing:.36em;text-indent:.36em;font-weight:600;
    background:linear-gradient(180deg,#fff6e8 0%,#f0d3b4 26%,#a85f43 50%,#7a3427 58%,#e9c2a2 74%,#fff2df 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 1px 0 rgba(255,236,214,.35),0 2px 1px rgba(24,6,5,.55),
                0 3px 2px rgba(24,6,5,.45),0 6px 10px rgba(10,2,2,.6);
    filter:drop-shadow(0 0 18px var(--acc-soft))}
  #mark .rule{margin:clamp(6px,1.1vh,12px) auto 0;width:min(42vw,300px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,196,158,.45),transparent)}
  #mark .sub{margin-top:clamp(4px,.8vh,8px);font-size:clamp(8px,.78vw,11px);
    letter-spacing:.52em;text-indent:.52em;color:rgba(255,206,176,.48);
    text-transform:uppercase;max-width:80vw;margin-left:auto;margin-right:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 石碑 */
  #stele{position:absolute;left:50%;bottom:-1.5vh;transform:translateX(-50%);
    width:min(86vw,608px);height:min(51vh,424px);pointer-events:none}
  #stele .shadow{position:absolute;left:-14%;right:-14%;bottom:-3%;height:22%;
    background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,.62),rgba(0,0,0,0) 70%);
    filter:blur(6px)}
  #stele .face{position:absolute;inset:0;overflow:hidden;
    clip-path:polygon(6% 0,94% 0,100% 8%,100% 100%,0 100%,0 8%);
    background:linear-gradient(173deg,#f7ecdc 0%,#ecdbc8 18%,#dcc4ad 42%,#c9ab93 68%,#a98b76 100%);
    box-shadow:none}
  #stele .tex{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.55;
    background-repeat:repeat;background-size:320px 320px}
  #stele .sheen{position:absolute;inset:0;
    background:linear-gradient(112deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.28) 46%,rgba(255,255,255,0) 60%),
               radial-gradient(120% 60% at 50% -10%,rgba(255,170,120,.32),rgba(255,170,120,0) 62%)}
  #stele .edge{position:absolute;inset:0;
    box-shadow:inset 0 1px 0 rgba(255,248,236,.85),inset 0 -30px 46px rgba(60,20,14,.22),
               inset 22px 0 34px rgba(70,26,18,.14),inset -22px 0 34px rgba(70,26,18,.14)}

  /* 顶部凿刻十字 */
  .chisel{position:absolute;left:50%;top:6.2%;transform:translateX(-50%);width:4.2%;height:9%;
    opacity:.5}
  .chisel:before,.chisel:after{content:"";position:absolute;background:rgba(64,30,20,.62);
    box-shadow:0 1px 0 rgba(255,246,232,.72)}
  .chisel:before{left:50%;top:0;width:16%;height:100%;transform:translateX(-50%)}
  .chisel:after{top:38%;left:0;height:15%;width:100%}

  .slot{position:absolute;left:0;right:0;padding:0 9%;text-align:center;
    color:#2a1410;word-break:normal;overflow-wrap:break-word;
    text-shadow:0 1px 0 rgba(255,250,240,.62),0 -1px 0 rgba(58,22,14,.24)}
  #lPrev{top:17.5%;font-size:clamp(11px,1.12vw,16px);opacity:.42;letter-spacing:.06em;
    font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lNext{top:83%;font-size:clamp(11px,1.12vw,16px);opacity:.34;letter-spacing:.06em;
    font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lCur{top:26%;height:52%;padding:0;overflow:hidden;
    font-size:clamp(19px,2.85vw,37px);line-height:1.44;letter-spacing:.045em;font-weight:500}
  #lCur .wrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 9%}
  #lCur .ch{color:rgba(74,44,34,.14);transition:color .16s linear}
  #lCur .ch.on{color:#2a1410}

  #foot{position:absolute;left:0;right:0;bottom:6.5%;text-align:center;padding:0 12%;
    color:rgba(52,24,16,.6);font-size:clamp(7px,.68vw,10px);letter-spacing:.34em;
    text-indent:.34em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  #foot .bar{display:inline-block;width:14px;height:1px;background:rgba(52,24,16,.4);
    vertical-align:middle;margin:0 10px 3px}
  #empty{position:absolute;left:0;right:0;top:44%;text-align:center;opacity:0;
    transition:opacity .5s;font-size:clamp(9px,1vw,13px);letter-spacing:.6em;
    text-indent:.6em;color:rgba(52,24,16,.55)}
  @media (max-width:640px){
    #lPrev,#lNext{font-size:10px}
    #stele{width:min(94vw,560px);height:min(50vh,400px)}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="mark">
    <span class="word" id="markWord">白棋阵列</span>
    <div class="rule"></div>
    <div class="sub" id="markSub">White Array</div>
  </div>
  <div id="stele">
    <div class="shadow"></div>
    <div class="face">
      <div class="tex" id="tex"></div>
      <div class="sheen"></div>
      <div class="chisel"></div>
      <div class="slot" id="lPrev"></div>
      <div class="slot" id="lCur"></div>
      <div class="slot" id="lNext"></div>
      <div id="foot"></div>
      <div id="empty">无 词 · INSTRUMENTAL</div>
      <div class="edge"></div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var elCur = document.getElementById('lCur');
  var elPrev = document.getElementById('lPrev');
  var elNext = document.getElementById('lNext');
  var elFoot = document.getElementById('foot');
  var emptyEl = document.getElementById('empty');
  var markWord = document.getElementById('markWord');
  var markSub = document.getElementById('markSub');
  var steleEl = document.getElementById('stele');
  var texEl = document.getElementById('tex');
  var stageEl = document.getElementById('stage');

  var W = 1440, H = 900, DPR = 1;
  var REDUCED = false;
  try { REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  var MOT = REDUCED ? 0.3 : 1;

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', text: '', accent: [190, 58, 44],
    name: '', artists: ''
  };
  var beat = { level: 0, index: -1 };
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 };

  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch(e){}
  }

  function num(v, d){ v = +v; return isFinite(v) ? v : d; }

  function fit(){
    var w = num(window.innerWidth, 0), h = num(window.innerHeight, 0);
    if (!(w > 0)) w = 1440;
    if (!(h > 0)) h = 900;
    W = Math.round(w); H = Math.round(h);
    var dpr = num(window.devicePixelRatio, 1);
    if (!(dpr > 0)) dpr = 1;
    dpr = Math.min(dpr, 2);
    if (W * H * dpr * dpr > 3.4e6) dpr = Math.max(1, Math.sqrt(3.4e6 / (W * H)));
    DPR = dpr;
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();
  }

  /* ---------- 单点透视场景 ---------- */
  var bg = document.createElement('canvas');
  var bgx = bg.getContext('2d');
  var EYE = 4.2;           // 视高（世界单位）
  var CH  = 2.2;           // 十字架高度
  var ZK  = 1.155;         // 纵深比
  var DX  = 2.0;           // 横向间距
  var SC = { HY: 0, VX: 0, F: 0, sunY: 0, sunR: 0, rows: [], hands: null, Z0: 5 };

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function accMix(k, a){
    var A = S.accent;
    var r = Math.round(255 * (1 - k) + A[0] * k);
    var g = Math.round(140 * (1 - k) + A[1] * k);
    var b = Math.round(90 * (1 - k) + A[2] * k);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function py(z){ return SC.HY + SC.F * EYE / z; }
  function pxf(x, z){ return SC.VX + SC.F * x / z; }

  function buildScene(){
    SC.VX = W * 0.5;
    SC.HY = H * (W < H * 0.9 ? 0.375 : 0.425);
    SC.F = Math.min(H * 0.66, W * 0.95);
    SC.sunY = SC.HY - H * 0.016;
    SC.sunR = Math.max(18, Math.min(W, H) * 0.058);
    // 最近一排尽量压到画面底边：既保证纵深铺满，也不会把整排浪费在画外
    var denom = Math.max(80, H * 0.955 - SC.HY);
    SC.Z0 = clamp((SC.F * EYE) / denom, 4.0, 60);
    bg.width = Math.max(1, Math.round(W * DPR));
    bg.height = Math.max(1, Math.round(H * DPR));
    bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgx.clearRect(0, 0, W, H);
    buildAtmo();
    makeRows();
    drawSky();
    buildHands();
    drawGround();
    buildPieces();
    buildAnchors();
    drawPieces();
    drawHaze();
  }

  function makeRows(){
    SC.rows = [];
    var z = SC.Z0, i = 0;
    while (i < 44){
      var h = SC.F * CH / z;
      if (h < 3.4) break;
      SC.rows.push({ z: z, y: py(z), h: h });
      z *= ZK; i++;
    }
  }

  function drawSky(){
    var g = bgx.createLinearGradient(0, 0, 0, SC.HY + 2);
    g.addColorStop(0.00, '#070407');
    g.addColorStop(0.30, '#1d070c');
    g.addColorStop(0.55, '#4a0f16');
    g.addColorStop(0.76, '#8a1c1b');
    g.addColorStop(0.90, '#c2452a');
    g.addColorStop(1.00, '#e27d48');
    bgx.fillStyle = g;
    bgx.fillRect(0, 0, W, SC.HY + 2);

    // 云带：横向拉长的暗红条
    bgx.save();
    bgx.beginPath(); bgx.rect(0, 0, W, SC.HY); bgx.clip();
    for (var i = 0; i < 9; i++){
      var cy = SC.HY * (0.20 + 0.085 * i);
      var rx = W * (0.30 + 0.16 * ((i * 7) % 5) / 4);
      var ry = Math.max(3, H * (0.010 + 0.006 * (i % 3)));
      bgx.globalAlpha = 0.10 + 0.05 * (i % 3);
      bgx.fillStyle = i % 2 ? '#120509' : '#5a1218';
      bgx.beginPath();
      bgx.ellipse(W * (0.10 + 0.20 * i), cy, rx, ry, 0, 0, Math.PI * 2);
      bgx.fill();
    }
    bgx.restore();
    bgx.globalAlpha = 1;

    // 光柱
    bgx.save();
    bgx.globalCompositeOperation = 'lighter';
    for (var k = 0; k < 7; k++){
      var ang = (-0.85 + k * 0.28);
      var len = H * 1.5;
      bgx.globalAlpha = 0.030 + 0.012 * (k % 3);
      bgx.fillStyle = k % 2 ? '#ff8b5a' : '#ffb27a';
      bgx.beginPath();
      bgx.moveTo(SC.VX, SC.sunY);
      bgx.lineTo(SC.VX + Math.sin(ang - 0.05) * len, SC.sunY - Math.cos(ang - 0.05) * len);
      bgx.lineTo(SC.VX + Math.sin(ang + 0.05) * len, SC.sunY - Math.cos(ang + 0.05) * len);
      bgx.closePath();
      bgx.fill();
    }
    bgx.restore();

    // 日轮
    var sr = SC.sunR;
    var bloom = bgx.createRadialGradient(SC.VX, SC.sunY, 0, SC.VX, SC.sunY, sr * 7);
    bloom.addColorStop(0, accMix(0.16, 0.55));
    bloom.addColorStop(0.35, accMix(0.22, 0.22));
    bloom.addColorStop(1, 'rgba(180,40,30,0)');
    bgx.fillStyle = bloom;
    bgx.fillRect(0, 0, W, SC.HY + 4);

    var disc = bgx.createRadialGradient(SC.VX, SC.sunY, 0, SC.VX, SC.sunY, sr);
    disc.addColorStop(0, 'rgba(255,250,236,0.98)');
    disc.addColorStop(0.55, 'rgba(255,206,158,0.92)');
    disc.addColorStop(1, 'rgba(255,150,96,0.55)');
    bgx.fillStyle = disc;
    bgx.beginPath(); bgx.arc(SC.VX, SC.sunY, sr, 0, Math.PI * 2); bgx.fill();

    // 地平线横向光晕（压扁的一道光）
    bgx.save();
    bgx.globalCompositeOperation = 'lighter';
    var flare = bgx.createRadialGradient(SC.VX, SC.HY, 0, SC.VX, SC.HY, W * 0.46);
    flare.addColorStop(0, 'rgba(255,214,170,0.30)');
    flare.addColorStop(0.45, 'rgba(255,150,100,0.13)');
    flare.addColorStop(1, 'rgba(255,120,80,0)');
    bgx.fillStyle = flare;
    bgx.save();
    bgx.translate(SC.VX, SC.HY);
    bgx.scale(1, 0.055);
    bgx.translate(-SC.VX, -SC.HY);
    bgx.fillRect(SC.VX - W * 0.5, SC.HY - W * 0.5, W, W);
    bgx.restore();
    bgx.restore();

    // 地平线热光
    var hz = bgx.createLinearGradient(0, SC.HY - H * 0.055, 0, SC.HY + H * 0.02);    hz.addColorStop(0, 'rgba(255,120,72,0)');
    hz.addColorStop(0.78, 'rgba(255,140,86,0.30)');
    hz.addColorStop(1, 'rgba(255,180,120,0.42)');
    bgx.fillStyle = hz;
    bgx.fillRect(0, SC.HY - H * 0.055, W, H * 0.075);
  }

  function drawGround(){
    var g = bgx.createLinearGradient(0, SC.HY, 0, H);
    g.addColorStop(0.00, '#6e1a16');
    g.addColorStop(0.10, '#3d0d0f');
    g.addColorStop(0.34, '#1c0809');
    g.addColorStop(0.72, '#0b0405');
    g.addColorStop(1.00, '#050203');
    bgx.fillStyle = g;
    bgx.fillRect(0, SC.HY, W, H - SC.HY);

    // 透视棋格
    var rows = SC.rows;
    bgx.save();
    bgx.beginPath(); bgx.rect(0, SC.HY - 1, W, H - SC.HY + 1); bgx.clip();
    for (var r = 0; r < rows.length; r++){
      var z1 = rows[r].z;
      var zFar = r + 1 < rows.length ? rows[r + 1].z : z1 * ZK;
      var y1 = rows[r].y, y2 = py(zFar);
      if (y2 - y1 < 0.9) continue;
      var unit = SC.F * DX / z1;
      if (unit < 12) continue;
      var jMax = Math.min(90, Math.ceil((W * 0.62) / unit) + 1);
      var off = 0;
      for (var j = -jMax; j <= jMax; j++){
        var xa = j * DX + off, xb = xa + DX;
        var ax = pxf(xa, z1), bx = pxf(xb, z1), cx = pxf(xb, zFar), dx2 = pxf(xa, zFar);
        if (Math.max(ax, bx) < -20 || Math.min(ax, bx) > W + 20) continue;
        var even = ((j + r) % 2 === 0);
        bgx.fillStyle = even ? 'rgba(255,186,150,0.05)' : 'rgba(0,0,0,0.26)';
        bgx.beginPath();
        bgx.moveTo(ax, y1); bgx.lineTo(bx, y1); bgx.lineTo(cx, y2); bgx.lineTo(dx2, y2);
        bgx.closePath(); bgx.fill();
      }
      // 横向网格线
      bgx.strokeStyle = 'rgba(255,168,132,' + (0.055 * clamp(1 - r / 30, 0, 1) + 0.02).toFixed(3) + ')';
      bgx.lineWidth = 1;
      bgx.beginPath(); bgx.moveTo(0, y1); bgx.lineTo(W, y1); bgx.stroke();
    }
    // 纵向汇聚线
    bgx.strokeStyle = 'rgba(255,170,136,0.07)';
    bgx.lineWidth = 1;
    for (var j2 = -26; j2 <= 26; j2++){
      var gxNear = pxf(j2 * DX, SC.Z0);
      var denom = rows.length ? (rows[0].y - SC.HY) : 1;
      if (denom < 0.5) continue;
      var tEnd = (H - SC.HY) / denom;
      var gxEnd = SC.VX + (gxNear - SC.VX) * tEnd;
      bgx.beginPath();
      bgx.moveTo(SC.VX, SC.HY);
      bgx.lineTo(gxEnd, H);
      bgx.stroke();
    }
    bgx.restore();
  }

  function buildPieces(){
    var rows = SC.rows, total = 0;
    for (var r = 0; r < rows.length; r++){
      var row = rows[r], z = row.z;
      var unit = SC.F * DX / z;            // 相邻两列在该深度的屏幕间距
      if (unit < 0.55){ row.marks = null; continue; }
      var j0 = Math.ceil((W * -0.06 - SC.VX) / unit);
      var j1 = Math.floor((W * 1.06 - SC.VX) / unit);
      var count = j1 - j0 + 1;
      var stride = count > 460 ? Math.ceil(count / 460) : 1;
      var marks = [];
      for (var j = j0; j <= j1; j += stride) marks.push(SC.VX + unit * j);
      row.marks = marks;
      total += marks.length;
      if (total > 9000) break;
    }
  }

  function drawPieces(){
    var g = bgx;
    var rows = SC.rows;
    for (var r = rows.length - 1; r >= 0; r--){
      var row = rows[r], m = row.marks;
      if (!m || !m.length) continue;
      var h = row.h, y = row.y;
      if (h < 0.6) continue;
      var nf = clamp((h - 3) / 210, 0, 1);
      var a = 0.30 + 0.68 * Math.pow(nf, 0.5);
      var lw = Math.max(0.7, h * 0.072);
      var arm = h * 0.30;
      var armY = y - h * 0.70;
      var topY = y - h;
      var cr = Math.round(230 + 22 * nf);
      var cg = Math.round(158 + 82 * nf);
      var cb = Math.round(136 + 92 * nf);
      var i, x;

      // 触地阴影（整排一条路径，一次填充）
      if (h > 18){
        g.globalAlpha = 0.26;
        g.fillStyle = '#0a0304';
        g.beginPath();
        for (i = 0; i < m.length; i++){
          g.ellipse(m[i], y, Math.max(1.2, arm * 0.72), Math.max(0.8, lw * 1.05), 0, 0, 6.2832);
        }
        g.fill();
      }
      // 地面倒影
      if (h > 90){
        var rg = g.createLinearGradient(0, y, 0, y + h * 0.40);
        rg.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.14)');
        rg.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
        g.globalAlpha = 1;
        g.fillStyle = rg;
        g.beginPath();
        for (i = 0; i < m.length; i++) g.rect(m[i] - lw * 1.3, y, lw * 2.6, h * 0.40);
        g.fill();
      }

      g.globalAlpha = a;
      g.strokeStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
      g.lineWidth = lw;
      g.lineCap = 'butt';
      var base = h > 22;
      g.beginPath();
      for (i = 0; i < m.length; i++){
        x = m[i];
        g.moveTo(x, y); g.lineTo(x, topY);
        g.moveTo(x - arm, armY); g.lineTo(x + arm, armY);
        if (base){
          g.moveTo(x - arm * 0.55, y - lw * 0.5);
          g.lineTo(x + arm * 0.55, y - lw * 0.5);
        }
      }
      g.stroke();
    }
    bgx.globalAlpha = 1;
  }

  function drawHaze(){
    var g = bgx.createLinearGradient(0, SC.HY - H * 0.075, 0, SC.HY + H * 0.035);
    g.addColorStop(0, 'rgba(255,138,96,0)');
    g.addColorStop(0.62, accMix(0.20, 0.26));
    g.addColorStop(1, 'rgba(200,70,48,0.30)');
    bgx.fillStyle = g;
    bgx.fillRect(0, SC.HY - H * 0.075, W, H * 0.11);

    // 暗角与底边压暗（静态，烘进底图）
    var vg = bgx.createRadialGradient(W * 0.5, SC.HY * 0.95, Math.min(W, H) * 0.18,
                                      W * 0.5, SC.HY * 0.95, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.55, 'rgba(6,2,3,0.12)');
    vg.addColorStop(0.86, 'rgba(5,1,2,0.44)');
    vg.addColorStop(1, 'rgba(4,1,2,0.76)');
    bgx.fillStyle = vg;
    bgx.fillRect(0, 0, W, H);
    var bt = bgx.createLinearGradient(0, H * 0.74, 0, H);
    bt.addColorStop(0, 'rgba(4,1,2,0)');
    bt.addColorStop(1, 'rgba(3,1,1,0.58)');
    bgx.fillStyle = bt;
    bgx.fillRect(0, H * 0.72, W, H * 0.28);
  }

  /* ---------- 氛围层：巨手 / 丝线 / 尘埃 / 颗粒 ---------- */
  var atmo = { built: false }, glowSprite = null, grainPat = null;
  var dust = [];
  var beatEnv = 0, bassSm = 0;
  var anchors = [];

  function makeGlow(size){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    rg.addColorStop(0, 'rgba(255,244,226,1)');
    rg.addColorStop(0.25, 'rgba(255,206,158,0.55)');
    rg.addColorStop(1, 'rgba(255,140,90,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, size, size);
    return c;
  }

  function makeGrain(size){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var img = g.createImageData(size, size);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4){
      var v = 118 + (Math.random() * 2 - 1) * 96;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 26 + Math.random() * 46;
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  function makeMarble(size){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, size, size);
    // 石脉
    for (var i = 0; i < 11; i++){
      var x0 = Math.random() * size, y0 = Math.random() * size;
      g.strokeStyle = 'rgba(96,74,62,' + (0.05 + Math.random() * 0.13).toFixed(3) + ')';
      g.lineWidth = 0.7 + Math.random() * 2.2;
      g.beginPath();
      g.moveTo(x0, y0);
      var px2 = x0, py2 = y0;
      for (var k = 0; k < 5; k++){
        var nx = px2 + (Math.random() - 0.5) * size * 0.55;
        var ny = py2 + (Math.random() - 0.5) * size * 0.55;
        g.quadraticCurveTo(px2 + (Math.random() - 0.5) * 40, py2 + (Math.random() - 0.5) * 40, nx, ny);
        px2 = nx; py2 = ny;
      }
      g.stroke();
    }
    // 石粒
    for (var j = 0; j < 1400; j++){
      g.fillStyle = 'rgba(110,88,74,' + (Math.random() * 0.07).toFixed(3) + ')';
      g.fillRect(Math.random() * size, Math.random() * size, 1.2, 1.2);
    }
    return c.toDataURL('image/png');
  }

  function rotPt(x, y, r, m){
    var cx = x * m, cy = y;
    var c = Math.cos(r), s = Math.sin(r);
    return { x: cx * c - cy * s, y: cx * s + cy * c };
  }

  function makeHand(mirror, rot){
    var OX = 290, OY = 150, SZ = 600;
    var c = document.createElement('canvas');
    c.width = c.height = SZ;
    var g = c.getContext('2d');
    g.translate(OX, OY);
    g.rotate(rot);
    g.scale(mirror, 1);
    g.lineCap = 'round';
    g.lineJoin = 'round';

    var grad = g.createLinearGradient(0, -130, 0, 220);
    grad.addColorStop(0, 'rgba(196,132,110,0.92)');
    grad.addColorStop(0.55, 'rgba(236,196,170,0.96)');
    grad.addColorStop(1, 'rgba(255,226,200,1)');
    g.fillStyle = grad;
    g.strokeStyle = grad;

    // 手腕
    g.lineWidth = 112;
    g.beginPath(); g.moveTo(0, -46); g.lineTo(0, -150); g.stroke();
    // 掌
    g.beginPath(); g.ellipse(0, 0, 66, 74, 0, 0, Math.PI * 2); g.fill();

    var tips = [];
    var F = [
      { x: -44, a: -0.10, L: 128, w: 24 },
      { x: -15, a: -0.03, L: 154, w: 26 },
      { x: 15, a: 0.05, L: 148, w: 25 },
      { x: 44, a: 0.13, L: 116, w: 22 }
    ];
    for (var i = 0; i < F.length; i++){
      var f = F[i];
      var bx = f.x, by = 52;
      var ex = bx + Math.sin(f.a) * f.L, ey = by + Math.cos(f.a) * f.L;
      var mx = bx + Math.sin(f.a) * f.L * 0.55 + (i - 1.5) * 3;
      var my = by + Math.cos(f.a) * f.L * 0.55;
      g.lineWidth = f.w;
      g.beginPath(); g.moveTo(bx, by); g.lineTo(mx, my); g.stroke();
      g.lineWidth = f.w * 0.86;
      g.beginPath(); g.moveTo(mx, my); g.lineTo(ex, ey); g.stroke();
      tips.push({ x: ex, y: ey });
    }
    // 拇指
    g.lineWidth = 32;
    g.beginPath(); g.moveTo(-52, 6); g.lineTo(-104, 74); g.stroke();
    g.lineWidth = 27;
    g.beginPath(); g.moveTo(-104, 74); g.lineTo(-124, 128); g.stroke();
    tips.push({ x: -124, y: 128 });

    for (var t2 = 0; t2 < tips.length; t2++){
      var rp = rotPt(tips[t2].x, tips[t2].y, rot, mirror);
      tips[t2].x = rp.x; tips[t2].y = rp.y;
    }
    return { cv: c, ox: OX, oy: OY, w: SZ, tips: tips };
  }

  function buildAtmo(){
    if (atmo.built) return;
    atmo.built = true;
    glowSprite = makeGlow(128);
    grainPat = ctx.createPattern(makeGrain(180), 'repeat');
    atmo.handL = makeHand(1, -0.34);
    atmo.handR = makeHand(-1, 0.34);
    dust.length = 0;
    for (var i = 0; i < 56; i++){
      dust.push({
        x: Math.random(), y: Math.random(),
        r: 0.5 + Math.random() * 1.8,
        vy: 0.006 + Math.random() * 0.02,
        ph: Math.random() * 6.28
      });
    }
    try { texEl.style.backgroundImage = 'url(' + makeMarble(320) + ')'; } catch(e){}
  }

  function buildHands(){
    if (!atmo.handL) return;
    var s = clamp(Math.min(H * 0.46, W * 0.60) / 355, 0.35, 2.2);
    SC.hands = [
      { x: W * 0.155, y: H * 0.075, s: s, cv: atmo.handL },
      { x: W * 0.845, y: H * 0.095, s: s, cv: atmo.handR }
    ];
    for (var i = 0; i < SC.hands.length; i++){
      var hd = SC.hands[i], hc = hd.cv;
      hd.tips = [];
      for (var k = 0; k < hc.tips.length; k++){
        hd.tips.push({ x: hd.x + hc.tips[k].x * hd.s, y: hd.y + hc.tips[k].y * hd.s });
      }
      bgx.save();
      bgx.globalAlpha = 0.26;
      bgx.drawImage(hc.cv, hd.x - hc.ox * hd.s, hd.y - hc.oy * hd.s, hc.w * hd.s, hc.w * hd.s);
      bgx.restore();
    }
    // 指尖的一点血色反光
    bgx.save();
    bgx.globalCompositeOperation = 'lighter';
    for (var m = 0; m < SC.hands.length; m++){
      for (var n = 0; n < SC.hands[m].tips.length; n++){
        var tp = SC.hands[m].tips[n];
        var rg = bgx.createRadialGradient(tp.x, tp.y, 0, tp.x, tp.y, 26);
        rg.addColorStop(0, 'rgba(255,180,140,0.30)');
        rg.addColorStop(1, 'rgba(255,120,80,0)');
        bgx.fillStyle = rg;
        bgx.fillRect(tp.x - 26, tp.y - 26, 52, 52);
      }
    }
    bgx.restore();
  }

  function buildAnchors(){
    anchors.length = 0;
    var rows = SC.rows;
    for (var r = 0; r < rows.length && anchors.length < 20; r++){
      var row = rows[r];
      if (!row.marks || !row.marks.length) continue;
      if (row.h < 16 || row.h > 78) continue;
      var step = Math.max(1, Math.round(row.marks.length / 5));
      for (var i = 0; i < row.marks.length && anchors.length < 20; i += step){
        var mx = row.marks[i];
        if (Math.abs(mx - SC.VX) > W * 0.42) continue;
        anchors.push({ x: mx, y: row.y - row.h * 0.70, h: row.h, ph: anchors.length * 0.83 });
      }
    }
  }

  function drawAtmo(t, dt){
    var pulse = bassSm;
    // 地平线脉冲
    if (!SC.bloomG || SC.bloomW !== W || SC.bloomH !== H){
      SC.bloomG = ctx.createRadialGradient(SC.VX, SC.sunY, 0, SC.VX, SC.sunY, Math.min(W, H) * 0.42);
      SC.bloomG.addColorStop(0, 'rgba(255,180,130,0.55)');
      SC.bloomG.addColorStop(0.4, accMix(0.25, 0.16));
      SC.bloomG.addColorStop(1, 'rgba(180,40,30,0)');
      SC.bloomW = W; SC.bloomH = H;
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.18 + 0.28 * pulse + 0.10 * beatEnv;
    ctx.fillStyle = SC.bloomG;
    ctx.fillRect(0, 0, W, SC.HY + H * 0.12);
    ctx.restore();

    // 巨手（烘焙在底图上，只让丝线呼吸）
    // 丝线
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = Math.max(0.6, Math.min(W, H) / 1400);
    var hi = 0;
    var hands = SC.hands || [];
    for (var s = 0; s < hands.length; s++){
      var hd = hands[s];
      for (var i = 0; i < hd.tips.length; i++){
        if (!anchors.length) break;
        var ax = anchors[hi % anchors.length];
        hi++;
        drawString(hd.tips[i].x, hd.tips[i].y, ax.x, ax.y, ax.ph + i, t);
      }
    }
    // 顶部垂下的长丝
    for (var k = 0; k < 14; k++){
      var ax2 = anchors[(k * 3 + 1) % Math.max(1, anchors.length)];
      if (!ax2) break;
      var sx = W * (0.03 + 0.94 * (k / 13));
      drawString(sx, -H * 0.04, ax2.x, ax2.y, k * 0.9, t);
    }
    ctx.restore();

    // 近景棋子的亮点
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var n = 0; n < anchors.length; n++){
      var a = anchors[n];
      var gl = 0.16 + 0.5 * beatEnv * (0.5 + 0.5 * Math.sin(t * 2.1 + a.ph));
      var rad = Math.max(6, a.h * 0.24);
      ctx.globalAlpha = Math.min(0.7, gl);
      ctx.drawImage(glowSprite, a.x - rad, a.y - rad, rad * 2, rad * 2);
    }
    ctx.restore();

    // 尘埃
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var d = 0; d < dust.length; d++){
      var pt = dust[d];
      pt.y -= pt.vy * dt / 1000;
      if (pt.y < -0.05){ pt.y = 1.05; pt.x = Math.random(); }
      var dx = pt.x * W + Math.sin(t * 0.6 + pt.ph) * 12;
      var dy = pt.y * H;
      ctx.globalAlpha = 0.10 + 0.16 * (0.5 + 0.5 * Math.sin(t + pt.ph));
      ctx.fillStyle = 'rgba(255,214,180,1)';
      ctx.beginPath(); ctx.arc(dx, dy, pt.r, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawString(x0, y0, x1, y1, ph, t){
    var wob = Math.sin(t * 1.7 + ph) * (2 + 4 * beatEnv) * MOT;
    var mx = (x0 + x1) * 0.5 + wob;
    var my = (y0 + y1) * 0.5 + Math.cos(t * 1.3 + ph) * 3 * MOT;
    ctx.strokeStyle = 'rgba(255,208,176,' + (0.10 + 0.10 * beatEnv).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(mx, my, x1, y1);
    ctx.stroke();
  }

  /* ---------- 歌词：刻在石碑上 ---------- */
  var curWrap = document.createElement('div');
  curWrap.className = 'wrap';
  elCur.appendChild(curWrap);
  var curSpans = [], curTimes = [], litCount = -1;

  function setMark(){
    var nm = String(S.name || '').trim();
    markWord.textContent = nm || '白棋阵列';
    var ar = String(S.artists || '').trim();
    markSub.textContent = ar || 'WHITE ARRAY · 326';
    elFoot.textContent = ar ? (ar + '  ·  WHITE ARRAY 326') : '326  ·  白棋阵列';
    var a = S.accent;
    try {
      stageEl.style.setProperty('--acc', 'rgba(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ',1)');
      stageEl.style.setProperty('--acc-soft', 'rgba(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ',0.30)');
    } catch(e){}
  }

  function fitLine(n){
    var base = Math.min(37, Math.max(18, W * 0.029));
    var fs = base * clamp(1 - Math.max(0, n - 13) * 0.03, 0.5, 1);
    if (W < 560) fs = Math.min(fs, 25);
    elCur.style.fontSize = fs.toFixed(1) + 'px';
    var g = 0;
    while (g++ < 7 && curWrap.offsetHeight > elCur.clientHeight - 2 && fs > 9.5){
      fs *= 0.9;
      elCur.style.fontSize = fs.toFixed(1) + 'px';
    }
  }

  function renderLine(i){
    var L = (i >= 0 && i < S.lines.length) ? S.lines[i] : null;
    S.text = L ? (L.text || '') : '';
    litCount = -1;
    curSpans = []; curTimes = [];
    elPrev.textContent = '';
    elNext.textContent = '';
    while (curWrap.firstChild) curWrap.removeChild(curWrap.firstChild);
    if (!L){
      if (i < 0 && S.lines.length) elNext.textContent = S.lines[0].text || '';
      return;
    }
    if (i > 0) elPrev.textContent = S.lines[i - 1].text || '';
    if (i + 1 < S.lines.length) elNext.textContent = S.lines[i + 1].text || '';

    var chars = Array.isArray(L.chars) ? L.chars : null;
    var items = [], k;
    if (chars && chars.length >= 2){
      var max = Math.min(chars.length, 400);
      for (k = 0; k < max; k++){
        var o = chars[k] || {};
        if (typeof o.c !== 'string' || !o.c) continue;
        items.push({ c: o.c, t: num(o.t, L.t) });
      }
    }
    if (!items.length){
      var txt = L.text || '';
      if (txt){
        var arr;
        try { arr = Array.from(txt); } catch(e){ arr = txt.split(''); }
        if (arr.length > 240) arr = [txt];
        var dur = L.dur > 0.2 ? L.dur : 3;
        for (k = 0; k < arr.length; k++){
          items.push({ c: arr[k], t: L.t + dur * (k / Math.max(1, arr.length)) });
        }
      }
    }
    if (!items.length){ curWrap.textContent = ' '; return; }

    var frag = document.createDocumentFragment();
    for (k = 0; k < items.length; k++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = items[k].c;
      frag.appendChild(sp);
      curSpans.push(sp);
      curTimes.push(items[k].t);
    }
    curWrap.appendChild(frag);
    fitLine(arr ? arr.length : items.length);
  }

  function updateLight(){
    var n = curSpans.length;
    if (!n) return;
    var lit = 0;
    while (lit < n && curTimes[lit] <= S.t + 0.001) lit++;
    if (lit === litCount) return;
    var k;
    if (lit > litCount){
      for (k = Math.max(0, litCount); k < lit; k++) curSpans[k].classList.add('on');
    } else {
      for (k = lit; k < litCount; k++) if (curSpans[k]) curSpans[k].classList.remove('on');
    }
    litCount = lit;
  }

  function seekIdx(t){
    var ls = S.lines, i = -1, best = -Infinity;
    for (var k = 0; k < ls.length; k++){
      var tk = ls[k].t;
      if (tk <= t + 0.02 && tk >= best){ best = tk; i = k; }
    }
    return i;
  }

  function onInit(p){
    var song = p.song || {};
    S.name = typeof song.name === 'string' ? song.name : '';
    var ar = song.artists;
    S.artists = Array.isArray(ar) ? ar.filter(function(x){ return typeof x === 'string'; }).join(' / ')
                                 : (typeof ar === 'string' ? ar : '');
    var ac = p.accent;
    if (Array.isArray(ac) && ac.length >= 3){
      var prevAcc = S.accent.join(',');
      S.accent = [num(ac[0], 190), num(ac[1], 58), num(ac[2], 44)];
      if (S.accent.join(',') !== prevAcc && W > 1 && H > 1){
        try { buildScene(); } catch(e){ S.err = S.err || ''; }
      }
    }
    var raw = Array.isArray(p.lines) ? p.lines : [];
    S.lines = raw.slice(0, 400).map(function(l){
      l = l || {};
      return {
        t: num(l.t, 0), dur: num(l.dur, 0),
        text: typeof l.text === 'string' ? l.text : '',
        chars: Array.isArray(l.chars) ? l.chars : null
      };
    });
    while (S.lines.length && !String(S.lines[S.lines.length - 1].text || '').trim()) S.lines.pop();
    setMark();
    emptyEl.style.opacity = S.lines.length ? '0' : '1';
    if (!S.lines.length){
      renderLine(-1);
      var ar2 = String(S.artists || '').trim();
      elFoot.textContent = ar2 || '326  ·  白棋阵列';
    }
    S.idx = -100;
  }

  window.addEventListener('message', function(ev){
    var m = ev.data;
    if (!m || m.__c100 !== 1) return;
    var p = m.payload || {};
    if (m.type === 'init') onInit(p);
    else if (m.type === 'tick'){ S.t = num(p.time, S.t); S.playing = p.playing !== false; }
    else if (m.type === 'beat'){
      beat.level = num(p.level, 0); beat.index = num(p.index, -1);
      if (beat.level > 0.05) beatEnv = Math.min(1, 0.55 + beat.level * 0.45);
    }
    else if (m.type === 'live'){
      live.level = num(p.level, 0); live.bass = num(p.bass, 0);
      live.mid = num(p.mid, 0); live.treble = num(p.treble, 0); live.bpm = num(p.bpm, 0);
    }
  });

  var lastT = 0, clock = 0;
  function frame(now){
    var t0 = performance.now();
    S.frames++;
    var dt = lastT ? Math.min(72, Math.max(8, t0 - lastT)) : 16.7;
    lastT = t0;
    clock += dt / 1000;
    try {
    var i = seekIdx(S.t);
    if (i !== S.idx){
      S.idx = i;
      renderLine(i);
    }
    updateLight();

    var k = Math.pow(0.90, dt / 16.7);
    beatEnv *= k;
    var target = Math.max(live.bass * 0.75, beat.level * 0.9, live.level * 0.45);
    bassSm += (target - bassSm) * Math.min(1, dt / 90);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0a0406';
    ctx.fillRect(0, 0, W, H);
    if (bg.width > 1){
      var zk = REDUCED ? 1 : (1.014 + 0.010 * Math.sin(clock * 0.22) + 0.010 * beatEnv);
      var zw = W * zk, zh = H * zk;
      var zy = (H - zh) * 0.5 + (REDUCED ? 0 : Math.sin(clock * 0.17) * H * 0.004);
      ctx.drawImage(bg, (W - zw) * 0.5, zy, zw, zh);
    }
    drawAtmo(clock, dt);
    if (grainPat){
      ctx.save();
      ctx.globalAlpha = 0.09;
      ctx.translate(-(Math.random() * 180) | 0, -(Math.random() * 180) | 0);
      ctx.fillStyle = grainPat;
      ctx.fillRect(0, 0, W + 180, H + 180);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    } catch(e){
      if (!S.err) S.err = String((e && e.message) || e);
    }
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  function boot(){
    requestAnimationFrame(function(){
      sendReady();                 // 先报 ready，再做重活
      try { fit(); } catch(e){ if (!S.err) S.err = String((e && e.message) || e); }
      requestAnimationFrame(frame);
    });
    setTimeout(sendReady, 60);     // 兜底：rAF 被节流也一定报一次
  }

  var rzTimer = 0;
  window.addEventListener('resize', function(){
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(function(){
      rzTimer = 0;
      fit();
      if (S.idx >= 0) renderLine(S.idx);
    }, 120);
  });
  window.addEventListener('orientationchange', function(){ fit(); });
  window.__stage = function(){
    return {
      lines: S.lines.length,
      idx: S.idx < 0 ? -1 : S.idx,
      t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err, text: S.text, gl: false, rm: REDUCED
    };
  };
  boot();
})();
</script>
</body>
</html>
