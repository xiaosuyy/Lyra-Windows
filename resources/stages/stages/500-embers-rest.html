<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>余烬存档 · Embers Rest</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#06070b;}
  body{color:#efe6d8;font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;overflow:hidden;}
  canvas#pix{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;}
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse 82% 74% at 50% 44%,rgba(0,0,0,0) 34%,rgba(3,4,8,.30) 70%,rgba(2,3,6,.72) 100%);}
  #scan{position:absolute;inset:0;pointer-events:none;opacity:.05;
        background:repeating-linear-gradient(to bottom,rgba(255,255,255,.9) 0 1px,rgba(0,0,0,0) 1px 3px);mix-blend-mode:overlay;}
  #scr{position:absolute;left:0;right:0;bottom:0;height:58vh;pointer-events:none;
       background:linear-gradient(to top,rgba(4,5,9,.90) 0%,rgba(4,5,9,.66) 20%,rgba(4,5,9,.26) 46%,rgba(4,5,9,.06) 74%,rgba(4,5,9,0) 100%);}
  #scrl{position:absolute;left:0;bottom:0;width:66vw;height:46vh;pointer-events:none;
        background:radial-gradient(ellipse 90% 100% at 0% 100%,rgba(4,5,9,.62) 0%,rgba(4,5,9,.16) 55%,rgba(4,5,9,0) 100%);}
  #hd{position:absolute;left:6vw;top:5.2vh;font:500 11px/1.7 ui-monospace,"SFMono-Regular",monospace;
      letter-spacing:.3em;color:rgba(236,226,210,.52);pointer-events:none;white-space:nowrap;max-width:70vw;
      overflow:hidden;text-overflow:ellipsis;}
  #hd b{display:inline-block;width:.62em;height:.62em;margin-right:.72em;vertical-align:baseline;
        background:#ffd39a;box-shadow:0 0 12px rgba(255,190,110,.9);transform:rotate(45deg);}
  #lyr{position:absolute;left:7vw;bottom:9vh;width:min(62vw,840px);pointer-events:none;
       padding-left:1.15em;border-left:1px solid rgba(255,196,128,.22);}
  #cur{margin:0;font-size:40px;line-height:1.52;letter-spacing:.015em;font-weight:500;
       overflow-wrap:anywhere;word-break:break-word;
       text-shadow:0 1px 2px rgba(4,5,9,.9),0 3px 26px rgba(4,5,9,.75);}
  #cur .c{color:rgba(228,220,206,.24);transition:color .24s linear,text-shadow .3s linear;}
  #cur .c.on{color:#ffeacb;text-shadow:0 0 18px rgba(255,186,110,.52),0 0 46px rgba(255,146,58,.24),0 2px 3px rgba(4,5,9,.85);}
  #cur .c.hot{text-shadow:0 0 7px rgba(255,247,226,.95),0 0 24px rgba(255,182,92,.85),0 0 58px rgba(255,128,36,.45),0 2px 3px rgba(4,5,9,.85);}
  #nxt{margin-top:.66em;font-size:clamp(12px,1.25vw,17px);line-height:1.62;color:rgba(232,222,206,.36);
       text-shadow:0 1px 12px rgba(4,5,9,.95),0 0 30px rgba(4,5,9,.8);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(56vw,760px);}
  #nxt::before{content:"↳ ";opacity:.5;margin-right:.25em;}
  #nxt.hide{display:none;}
  #empty{position:absolute;left:7vw;bottom:10vh;font-size:clamp(13px,1.55vw,19px);letter-spacing:.14em;
         color:rgba(232,222,206,.46);display:none;padding-left:1.15em;border-left:1px solid rgba(120,232,208,.28);}
  #empty s{display:inline-block;width:.5em;height:.5em;margin-right:.7em;background:#7fe8d4;
           box-shadow:0 0 10px rgba(120,232,208,.85);text-decoration:none;animation:bl 1.6s steps(2) infinite;}
  @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:.18}}
  @media (max-width:640px){
    #hd{top:3.4vh;font-size:9.5px;letter-spacing:.2em;max-width:84vw;}
    #lyr{left:7vw;bottom:8.5vh;width:78vw;padding-left:.9em;}
    #nxt{margin-top:.5em;max-width:74vw;}
    #scrl{width:100vw;height:52vh;}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="pix"></canvas>
  <div id="scan"></div>
  <div id="scr"></div>
  <div id="scrl"></div>
  <div id="vig"></div>
  <div id="hd"><b></b><span id="hdTx">存档点 · SAVE</span></div>
  <div id="lyr"><p id="cur"></p><div id="nxt"></div></div>
  <div id="empty"><s></s>此曲无词 —— 只余火光</div>
</div>
<script>
(function(){
  'use strict';

  /* ---------- refs ---------- */
  var cv=document.getElementById('pix');
  var curEl=document.getElementById('cur'),nxtEl=document.getElementById('nxt'),
      emptyEl=document.getElementById('empty'),lyrEl=document.getElementById('lyr'),
      hdTx=document.getElementById('hdTx');
  var ctx=cv.getContext('2d',{alpha:false});

  /* ---------- motion pref ---------- */
  var RM=false;
  try{RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
  catch(e){console.error('[500] rm',e);RM=false;}

  /* ---------- state ---------- */
  var S={lines:[],idx:-1,t:0,playing:true,nLines:0,accent:[236,166,84],text:'',
         bass:0,mid:0,treble:0,level:0,beat:0,beatT:-99};
  var frames=0,jsMs=0,readySent=false,vt=0,lastTs=0,rafId=0;

  /* ---------- metrics ---------- */
  var W=1440,H=900,DPR=1,PR=4,pw=360,ph=225;
  var L={};

  /* ---------- palette ---------- */
  var SKY0=[7,8,14],SKY1=[17,19,30],ROCK_FAR=[34,39,55],ROCK_MID=[20,24,36],ROCK_NEAR=[9,10,16];
  var WARM=[255,176,92],COOL=[120,232,208],WARN=[255,232,196],TRUNK=[10,11,17];
  function P(v){return v<0?0:(v>255?255:v|0);}
  function css(c){return 'rgb('+P(c[0])+','+P(c[1])+','+P(c[2])+')';}
  function rgba(c,a){return 'rgba('+P(c[0])+','+P(c[1])+','+P(c[2])+','+a+')';}
  function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
  function lum(c){return 0.299*c[0]+0.587*c[1]+0.114*c[2];}
  function lift(c,minL){var l=lum(c);if(l>=minL||l<=1)return c;var k=Math.min(3.4,minL/Math.max(6,l));return [P(c[0]*k),P(c[1]*k),P(c[2]*k)];}
  var ACC=[236,166,84];
  var FIRE_C=[255,178,92],FIRE_HOT=[255,240,205],COOL_C=[120,232,208];
  var BARK=[14,15,22],LEAF=[0,0,0],LEAF2=[0,0,0];

  function derivePalette(){
    ACC=S.accent;
    var warmBase=mixc(ACC,[255,186,104],0.62);
    if(lum(warmBase)<120)warmBase=lift(warmBase,150);
    FIRE_C=warmBase;
    var coolBase=mixc(ACC,[112,236,214],0.66);
    if(lum(coolBase)<130)coolBase=lift(coolBase,158);
    COOL_C=coolBase;
    LEAF=mixc(coolBase,[255,255,255],0.12);
    LEAF2=mixc(coolBase,[10,14,24],0.42);
    FIRE_HOT=mixc(warmBase,[255,250,232],0.72);
    TRUNK=mixc([10,11,17],ACC,0.06);
  }

  /* ---------- deterministic rng for art ---------- */
  var sd=20261103;
  function rnd(){sd=(sd*1664525+1013904223)&0x7fffffff;return sd/2147483648;}
  function rs(a,b){return a+rnd()*(b-a);}

  /* ---------- send ready ---------- */
  function sendReady(){
    if(readySent)return;readySent=true;
    try{parent.postMessage({__c100:1,type:'ready'},'*');}catch(e){console.error('[500] ready',e);}
  }

  /* ---------- self check ---------- */
  window.__stage=function(){
    return {
      lines:S.nLines,
      idx:S.idx,
      t:S.t,
      playing:S.playing,
      frames:frames,
      js:jsMs,
      err:'',
      text:S.text,
      gl:false,
      rm:RM
    };
  };

  /* ---------- dimensions ---------- */
  function dims(){
    var w=cv.clientWidth||0,h=cv.clientHeight||0;
    if(!(w>0)||!(h>0)){w=window.innerWidth||1440;h=window.innerHeight||900;}
    if(!(w>0)||!(h>0)){w=1440;h=900;}
    return {w:Math.max(320,Math.min(8000,w|0)),h:Math.max(240,Math.min(8000,h|0))};
  }

  function layout(){
    var portrait=H>W*1.05;
    var floorY=H*(H<620?0.80:0.80);
    L.floorY=floorY;
    L.canopyCx=W*0.5;
    L.canopyCy=H*(portrait?0.285:0.335);
    L.canopyR=Math.min(portrait?W*0.40:W*0.28,H*(portrait?0.20:0.27));
    L.treeBaseX=W*0.5;
    L.treeBaseY=floorY+H*0.012;
    L.fireUnit=Math.max(1.7,Math.min(5.2,H*0.0046));
    L.heroH=Math.max(70,Math.min(190,H*(portrait?0.105:0.155)));
    if(portrait){
      L.fireX=W*0.355; L.fireY=floorY-H*0.006;
      L.heroX=W*0.605; L.heroY=floorY+H*0.004;
    }else{
      L.fireX=W*0.435; L.fireY=floorY+H*0.010;
      L.heroX=W*0.575; L.heroY=floorY+H*0.005;
    }
    L.scale=Math.min(W,H);
    /* resolve lyric block vs hero overlap (non-portrait) */
    var heroTop=L.heroY-L.heroH;
    L.lyricTop=H*0.58;
    if(heroTop<L.lyricTop){
      var shift=Math.min(L.heroH*0.55,L.lyricTop-heroTop);
      L.heroY+=shift;
      if(!portrait)L.fireY+=shift*0.45;
    }
    /* scale the whole sanctuary down a touch when the window is short */
    var safety=Math.max(0,L.lyricTop-(L.heroY-L.heroH));
    if(safety>0&&!portrait){
      var shrink=Math.max(0.72,1-(safety/L.heroH)*0.6);
      L.heroH*=shrink;
      L.heroY=L.lyricTop+L.heroH*0.92;
    }
  }

  /* ---------- lyric model ---------- */
  function normLines(arr){
    var out=[];
    if(!arr||typeof arr.length!=='number'||!arr.length)return out;
    var n=Math.min(arr.length,600);
    for(var i=0;i<n;i++){
      var Ln=arr[i];if(!Ln||typeof Ln!=='object')continue;
      var txt=typeof Ln.text==='string'?Ln.text:(typeof Ln.text==='number'?String(Ln.text):'');
      var tt=typeof Ln.t==='number'&&isFinite(Ln.t)?Ln.t:0;
      var dd=typeof Ln.dur==='number'&&isFinite(Ln.dur)&&Ln.dur>0?Ln.dur:0;
      out.push({t:tt,dur:dd,text:txt,chars:Array.isArray(Ln.chars)?Ln.chars:null});
    }
    out.sort(function(a,b){return a.t-b.t;});
    return out;
  }

  function updateIdx(){
    var arr=S.lines,idx=-1,i;
    for(i=0;i<arr.length;i++){if(arr[i].t<=S.t+0.0005)idx=i;else break;}
    if(idx>=arr.length)idx=arr.length-1;
    S.idx=idx;
    S.text=(idx>=0&&arr[idx])?(arr[idx].text||''):'';
  }

  /* ---------- lyric rendering ---------- */
  var lyr={idx:-2,times:[],spans:[],lit:-1,hot:-1};
  function lineTimes(Ln){
    var txt=Ln.text||'',n=txt.length,T=new Array(n),k,j;
    if(n===0)return T;
    var chars=Ln.chars,ok=false;
    if(Array.isArray(chars)&&chars.length){
      var lim=Math.min(chars.length,n);
      for(k=0;k<lim;k++){
        var cc=chars[k];
        if(cc&&typeof cc.t==='number'&&isFinite(cc.t)){T[k]=cc.t;ok=true;}
      }
    }
    var fallbackEnd=Ln.t+(Ln.dur>0?Ln.dur:Math.max(1.0,n*0.18));
    if(ok){
      for(k=0;k<n;k++){
        if(typeof T[k]==='number')continue;
        var p=-1,q=-1,j2;
        for(j=k-1;j>=0;j--){if(typeof T[j]==='number'){p=j;break;}}
        for(j2=k+1;j2<n;j2++){if(typeof T[j2]==='number'){q=j2;break;}}
        if(p<0&&q<0){T[k]=Ln.t;}
        else if(p<0){T[k]=T[q]-(q-k)*0.055;}
        else if(q<0){T[k]=T[p]+(k-p)*0.16;}
        else {T[k]=T[p]+(T[q]-T[p])*((k-p)/(q-p));}
        if(!isFinite(T[k]))T[k]=Ln.t;
      }
    }else{
      var dur=Ln.dur>0?Ln.dur:Math.max(1.0,n*0.18);
      for(k=0;k<n;k++)T[k]=Ln.t+dur*(k/Math.max(1,n));
    }
    return T;
  }

  function fontUnits(txt){
    var u=0,i,c;
    for(i=0;i<txt.length;i++){
      c=txt.charCodeAt(i);
      if(c>0x2e80)u+=1;else if(c===32)u+=0.34;else u+=0.56;
    }
    return Math.max(1,u);
  }
  function fitFont(txt){
    var avail=Math.min(W*0.60,840);
    var u=fontUnits(txt);
    var size=avail/Math.max(4.2,u);
    size=Math.max(14,Math.min(44,size));
    /* long lines: keep total glyph area in budget so wrapped text stays inside the block */
    var lineLimit=W<640?8:6;
    var perLine=Math.max(1,Math.floor(avail/size));
    var rows=Math.ceil(u/Math.max(1,perLine*0.98));
    if(rows>lineLimit){
      var k=Math.sqrt((lineLimit*perLine)/Math.max(1,rows*perLine/1.0));
      size=Math.max(13,size*Math.max(0.5,Math.min(1,k)));
    }
    size=Math.round(size*0.95);
    curEl.style.fontSize=size+'px';
  }

  function buildLine(){
    var arr=S.lines,i=S.idx;
    lyr.spans.length=0;lyr.lit=-1;lyr.hot=-1;
    if(i<0||!arr[i]){
      curEl.textContent='';
      nxtEl.textContent='';
      lyr.times=[];
      return;
    }
    var Ln=arr[i],txt=Ln.text||'';
    lyr.times=lineTimes(Ln);
    fitFont(txt);
    var frag=document.createDocumentFragment();
    var n=Math.min(txt.length,240);
    for(var k=0;k<n;k++){
      var sp=document.createElement('span');
      sp.className='c';
      sp.textContent=txt.charAt(k);
      frag.appendChild(sp);
      lyr.spans.push(sp);
    }
    curEl.textContent='';
    curEl.appendChild(frag);
    var nx=(i+1<arr.length&&arr[i+1])?arr[i+1].text:'';
    nxtEl.textContent=nx;
    nxtEl.className=nx?'':'hide';
  }

  function updateLyric(){
    if(lyr.idx!==S.idx){lyr.idx=S.idx;buildLine();}
    var T=lyr.times,sp=lyr.spans,n=Math.min(T.length,sp.length),lit=0,k;
    for(k=0;k<n;k++){
      if(typeof T[k]==='number'&&S.t>=T[k])lit=k+1;
    }
    if(lit!==lyr.lit){
      var from=Math.min(lyr.lit,lit),i;
      if(lit>lyr.lit){
        for(i=Math.max(0,lyr.lit);i<lit;i++){if(sp[i])sp[i].className='c on';}
      }else{
        for(i=lit;i<lyr.lit;i++){if(sp[i])sp[i].className='c';}
      }
      lyr.lit=lit;
    }
    var hot=lit-1;
    if(hot!==lyr.hot){
      if(lyr.hot>=0&&sp[lyr.hot])sp[lyr.hot].className=(lyr.hot<lyr.lit)?'c on':'c';
      if(hot>=0&&sp[hot])sp[hot].className='c on hot';
      lyr.hot=hot;
    }
  }

  /* ---------- offscreen art ---------- */
  var bgCv=document.createElement('canvas'),shaftCv=document.createElement('canvas'),
      heroCv=document.createElement('canvas'),warmGlow=null,coolGlow=null,
      FLAMES=[],bgReady=false,paintQueued=false;

  function paintBG(){
    var s=1/PR;
    pw=Math.max(64,Math.ceil(W/PR));ph=Math.max(48,Math.ceil(H/PR));
    if(bgCv.width!==pw||bgCv.height!==ph){bgCv.width=pw;bgCv.height=ph;}
    var g=bgCv.getContext('2d');
    g.setTransform(1,0,0,1,0,0);
    g.clearRect(0,0,pw,ph);
    sd=20261103;
    var fl=L.floorY*s,cx=pw*0.5,x,y,i;

    /* sky */
    var sky=g.createLinearGradient(0,0,0,ph);
    sky.addColorStop(0,css(SKY0));
    sky.addColorStop(0.5,css(mixc(SKY0,SKY1,0.85)));
    sky.addColorStop(0.82,css(SKY1));
    sky.addColorStop(1,css(mixc(SKY1,[4,5,9],0.55)));
    g.fillStyle=sky;g.fillRect(0,0,pw,ph);

    /* distant aura */
    var ar=g.createRadialGradient(cx,ph*0.40,0,cx,ph*0.40,pw*0.44);
    ar.addColorStop(0,rgba(mixc(COOL_C,SKY1,0.42),0.30));
    ar.addColorStop(0.5,rgba(COOL_C,0.07));
    ar.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=ar;g.fillRect(0,0,pw,ph);

    /* ceiling vault */
    var N=pw,edge=[];
    for(x=0;x<=N;x++){
      var u=x/N,bell=Math.exp(-Math.pow((u-0.5)*2.15,2));
      edge.push(ph*(0.315-0.205*bell)+rs(-2,2));
    }
    g.beginPath();g.moveTo(0,-2);
    for(x=0;x<=N;x++)g.lineTo(x,edge[x]);
    g.lineTo(N,-2);g.closePath();
    var cg=g.createLinearGradient(0,0,0,ph*0.36);
    cg.addColorStop(0,'#04050a');
    cg.addColorStop(0.55,css(mixc(ROCK_MID,[4,5,9],0.35)));
    cg.addColorStop(1,css(ROCK_MID));
    g.fillStyle=cg;g.fill();

    /* ceiling rim light */
    g.save();g.beginPath();
    for(x=0;x<=N;x++){if(x===0)g.moveTo(x,edge[x]);else g.lineTo(x,edge[x]);}
    g.strokeStyle=rgba(mixc(COOL_C,[8,10,18],0.55),0.30);g.lineWidth=1;g.stroke();g.restore();

    /* stalactites */
    for(i=0;i<26;i++){
      var sx=rs(0,pw),sy=edge[Math.min(N,Math.max(0,sx|0))]||ph*0.2;
      var sl=rs(0.02,0.14)*ph,sw=rs(0.8,3.4);
      g.beginPath();g.moveTo(sx-sw,sy);g.lineTo(sx+sw,sy);g.lineTo(sx,sy+sl);g.closePath();
      g.fillStyle=css(mixc(ROCK_MID,[6,7,12],rs(0.1,0.5)));g.fill();
    }
    /* hanging vines */
    for(i=0;i<9;i++){
      var vx=rs(0.06,0.94)*pw,vy=edge[Math.min(N,Math.max(0,vx|0))]||ph*0.2;
      var vl=rs(0.05,0.22)*ph;
      g.strokeStyle=rgba([26,32,44],0.7);g.lineWidth=1;
      g.beginPath();g.moveTo(vx,vy);
      for(var k=1;k<=6;k++){g.lineTo(vx+Math.sin(k*1.1+i)*2,vy+vl*(k/6));}
      g.stroke();
    }

    /* side walls */
    for(var side=-1;side<=1;side+=2){
      g.beginPath();
      g.moveTo(side<0?0:pw,0);
      for(y=0;y<=ph;y+=2){
        var base=pw*(0.085+0.045*Math.sin(y*0.031+side*1.7)+(y/ph)*0.085);
        g.lineTo(side<0?base:pw-base,y);
      }
      g.lineTo(side<0?0:pw,ph);
      g.closePath();
      g.fillStyle=css(mixc(ROCK_MID,[5,6,11],0.42));g.fill();
    }

    /* far pillars */
    for(i=0;i<2;i++){
      var pxx=(i===0?0.285:0.715)*pw,pw2=pw*0.022+rs(0,pw*0.01);
      var ptop=ph*rs(0.30,0.36);
      g.fillStyle=css(mixc(ROCK_FAR,SKY1,0.45));
      g.fillRect(pxx-pw2,ptop,pw2*2,fl-ptop);
      g.fillStyle=rgba(COOL_C,0.14);
      g.fillRect(pxx-pw2,ptop,1,fl-ptop);
      g.fillStyle=css(mixc(ROCK_FAR,SKY1,0.62));
      g.fillRect(pxx-pw2*1.5,ptop-2,pw2*3,3);
    }

    /* floor */
    var fg=g.createLinearGradient(0,fl-2,0,ph);
    fg.addColorStop(0,css(mixc(ROCK_MID,[14,17,26],0.4)));
    fg.addColorStop(0.35,css(ROCK_MID));
    fg.addColorStop(1,'#05060a');
    g.fillStyle=fg;g.fillRect(0,fl-2,pw,ph-fl+2);

    /* horizon haze */
    var hz=g.createLinearGradient(0,fl-6,0,fl+10);
    hz.addColorStop(0,'rgba(0,0,0,0)');
    hz.addColorStop(0.5,rgba(COOL_C,0.09));
    hz.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=hz;g.fillRect(0,fl-6,pw,16);

    /* save-point rune circle */
    var rcx=L.fireX*s,rcy=L.fireY*s,rr=Math.min(pw,ph)*0.085;
    g.save();
    g.globalAlpha=0.55;
    for(var ring=0;ring<3;ring++){
      var rad=rr*(0.55+ring*0.30);
      g.strokeStyle=rgba(COOL_C,ring===0?0.55:0.22);
      g.lineWidth=1;
      g.beginPath();g.ellipse(rcx,rcy,rad,rad*0.34,0,0,Math.PI*2);g.stroke();
    }
    for(i=0;i<16;i++){
      var a=i/16*Math.PI*2;
      var gx=rcx+Math.cos(a)*rr*1.10,gy=rcy+Math.sin(a)*rr*0.38;
      g.fillStyle=rgba(COOL_C,0.35);g.fillRect(gx|0,gy|0,1,1);
    }
    g.restore();

    /* floor warm pool */
    var wg=g.createRadialGradient(rcx,rcy,0,rcx,rcy,rr*2.6);
    wg.addColorStop(0,rgba(FIRE_C,0.24));
    wg.addColorStop(0.55,rgba(FIRE_C,0.08));
    wg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=wg;g.fillRect(0,fl-4,pw,ph-fl+4);

    /* fire pit stones */
    for(i=0;i<9;i++){
      var a2=(i/9)*Math.PI*2+0.3;
      var stx=rcx+Math.cos(a2)*rr*0.46,sty=rcy+Math.sin(a2)*rr*0.17;
      var stw=rs(1.2,2.6);
      g.fillStyle=css(mixc(ROCK_MID,[7,8,13],0.45));
      g.fillRect(stx-stw/2,sty-stw*0.35,stw,stw*0.7);
      g.fillStyle=rgba(FIRE_C,0.25);
      g.fillRect(stx-stw/2,sty-stw*0.35,stw,0.8);
    }

    drawTree(g,s,pw,ph,fl);
    dither(g,pw,ph);
    bgCv._ok=true;
  }

  function branch(g,x,y,ang,len,w,depth){
    if(depth<=0||len<1.2||w<0.6)return;
    var x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
    g.strokeStyle=css(mixc(TRUNK,[6,7,12],0.25));
    g.lineWidth=w;g.lineCap='butt';
    g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();
    if(depth>2){
      g.strokeStyle=rgba(COOL_C,0.10);
      g.lineWidth=Math.max(0.6,w*0.22);
      g.beginPath();g.moveTo(x,y-0.6);g.lineTo(x2,y2-0.6);g.stroke();
    }
    branch(g,x2,y2,ang-rs(0.34,0.56),len*rs(0.62,0.76),w*0.64,depth-1);
    branch(g,x2,y2,ang+rs(0.30,0.52),len*rs(0.60,0.74),w*0.64,depth-1);
    if(depth<=3&&rnd()<0.42)branch(g,x2,y2,ang+rs(-0.12,0.12),len*0.5,w*0.5,depth-1);
  }

  function drawTree(g,s,pw,ph,fl){
    var tx=L.treeBaseX*s,ty=L.treeBaseY*s,topY=(L.canopyCy+L.canopyR*0.55)*s;
    var trunkW=Math.max(2.2,Math.min(9,W*0.0068*s));
    /* trunk */
    g.strokeStyle=css(TRUNK);g.lineCap='butt';g.lineWidth=trunkW;
    g.beginPath();
    g.moveTo(tx,ty);
    g.quadraticCurveTo(tx-trunkW*1.2,ty-(ty-topY)*0.45,tx,topY);
    g.stroke();
    /* split forks */
    branch(g,tx,topY+ (ty-topY)*0.10,-Math.PI/2-0.55,(ty-topY)*0.20,trunkW*0.66,4);
    branch(g,tx,topY+ (ty-topY)*0.06,-Math.PI/2+0.50,(ty-topY)*0.19,trunkW*0.66,4);
    branch(g,tx,topY+ (ty-topY)*0.02,-Math.PI/2,(ty-topY)*0.16,trunkW*0.60,4);

    /* roots */
    for(var r=0;r<7;r++){
      var dir=(r%2?1:-1),rx=tx+dir*rs(0,trunkW*2),ry=ty-rs(0,trunkW);
      g.strokeStyle=css(TRUNK);g.lineWidth=Math.max(1,trunkW*0.38);
      g.beginPath();g.moveTo(rx,ry);
      g.quadraticCurveTo(rx+dir*rs(6,26),ry+rs(1,4),rx+dir*rs(14,54),ry+rs(2,5));
      g.stroke();
    }

    /* canopy pixel clusters */
    var ccx=L.canopyCx*s,ccy=L.canopyCy*s,cr=L.canopyR*s;
    for(var i=0;i<150;i++){
      var ang=rnd()*Math.PI*2;
      var rad=Math.pow(rnd(),0.62)*cr;
      var px=ccx+Math.cos(ang)*rad*1.24;
      var py=ccy+Math.sin(ang)*rad*0.82;
      var t=rad/cr;
      var col=mixc(LEAF,LEAF2,Math.min(1,t*1.15+rs(-0.1,0.1)));
      g.fillStyle=rgba(col,rs(0.35,0.85));
      var sz=rnd()<0.22?2:1;
      g.fillRect(px|0,py|0,sz,sz);
    }
    /* bright leaf sparks */
    for(var b=0;b<34;b++){
      var ba=rnd()*Math.PI*2,br=Math.pow(rnd(),0.8)*cr*0.92;
      g.fillStyle=rgba(mixc(COOL_C,[255,255,255],rs(0.15,0.62)),rs(0.55,0.95));
      g.fillRect((ccx+Math.cos(ba)*br*1.2)|0,(ccy+Math.sin(ba)*br*0.8)|0,1,1);
    }
    /* hanging orbs */
    for(var o=0;o<7;o++){
      var oa=rnd()*Math.PI*2,or_=rs(0.18,0.9)*cr;
      var ox=ccx+Math.cos(oa)*or_*1.15,oy=ccy+Math.sin(oa)*or_*0.7+rs(2,10);
      g.fillStyle=rgba(mixc(COOL_C,[255,255,255],0.4),0.9);
      g.fillRect(ox|0,oy|0,1,1);
      g.fillStyle=rgba(COOL_C,0.14);
      g.fillRect((ox-2)|0,(oy-2)|0,5,5);
    }
    /* canopy base rim glow */
    var bg2=g.createRadialGradient(ccx,ccy,cr*0.15,ccx,ccy,cr*1.25);
    bg2.addColorStop(0,rgba(COOL_C,0.10));
    bg2.addColorStop(0.6,rgba(COOL_C,0.03));
    bg2.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=bg2;g.fillRect(0,0,pw,ph);

    /* faint light pooling on ground under canopy */
    g.fillStyle=rgba(COOL_C,0.05);
    g.beginPath();g.ellipse(ccx,fl,cr*1.5,cr*0.16,0,0,Math.PI*2);g.fill();
  }

  function dither(g,pw,ph){
    for(var i=0;i<1200;i++){
      var x=(rnd()*pw)|0,y=(rnd()*ph)|0;
      g.fillStyle=rnd()<0.5?'rgba(255,255,255,0.028)':'rgba(0,0,0,0.10)';
      g.fillRect(x,y,1,1);
    }
    /* foreground rocks, bottom corners */
    g.fillStyle='#04050a';
    g.beginPath();g.moveTo(0,ph);g.lineTo(0,ph*0.86);
    for(var x2=0;x2<pw*0.30;x2+=3){g.lineTo(x2,ph*0.86+Math.sin(x2*0.09)*ph*0.02-rs(0,4));}
    g.lineTo(pw*0.30,ph);g.closePath();g.fill();
    g.beginPath();g.moveTo(pw,ph);g.lineTo(pw,ph*0.88);
    for(var x3=pw;x3>pw*0.74;x3-=3){g.lineTo(x3,ph*0.88+Math.sin(x3*0.08+2)*ph*0.02-rs(0,4));}
    g.lineTo(pw*0.74,ph);g.closePath();g.fill();
  }

  function paintShafts(){
    var sw=Math.max(120,Math.ceil(W/4)),sh=Math.max(120,Math.ceil(H/4));
    shaftCv.width=sw;shaftCv.height=sh;
    var g=shaftCv.getContext('2d');
    g.clearRect(0,0,sw,sh);
    var cx=L.canopyCx/4,cy=L.canopyCy/4;
    for(var i=0;i<5;i++){
      var spread=(i-2)*0.12;
      var topX=cx+spread*40,topY=cy+10;
      var botX=cx+spread*(sh*0.62),botY=sh*1.02;
      var wTop=sw*0.028;
      var gr=g.createLinearGradient(topX,topY,botX,botY);
      gr.addColorStop(0,rgba(COOL_C,0.30));
      gr.addColorStop(0.45,rgba(COOL_C,0.10));
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;
      g.beginPath();
      g.moveTo(topX-wTop,topY);
      g.lineTo(topX+wTop,topY);
      g.lineTo(botX+wTop*7,botY);
      g.lineTo(botX-wTop*7,botY);
      g.closePath();g.fill();
    }
    try{if('filter' in g)g.filter='blur(3px)';}catch(e){}
    g.drawImage(shaftCv,0,0);
    try{g.filter='none';}catch(e){}
  }

  function makeGlow(c,size){
    var c2=document.createElement('canvas');
    c2.width=size;c2.height=size;
    var g=c2.getContext('2d'),r=size/2;
    var gr=g.createRadialGradient(r,r,0,r,r,r);
    gr.addColorStop(0,rgba(mixc(c,[255,255,255],0.35),0.95));
    gr.addColorStop(0.22,rgba(c,0.55));
    gr.addColorStop(0.52,rgba(c,0.16));
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(0,0,size,size);
    return c2;
  }

  function paintFlames(){
    FLAMES.length=0;
    var U=1;/* unit = sprite px */
    for(var f=0;f<9;f++){
      var c=document.createElement('canvas');
      c.width=34;c.height=48;
      var g=c.getContext('2d');
      var phs=f/9*Math.PI*2;
      function tear(cx2,baseY,w0,h,fill,wob){
        for(var k=0;k<11;k++){
          var t=k/11;
          var yy=baseY-h*t;
          var ww=w0*Math.sin(Math.PI*(0.30+t*0.64))*(0.74+0.26*Math.sin(wob+t*4.2+phs));
          if(ww<0.4)ww=0.4;
          var xoff=Math.sin(phs*1.3+t*3.1)*w0*0.18;
          g.fillStyle=fill;
          g.fillRect(cx2+ xoff -ww/2, yy, ww, h/11+1.2);
        }
      }
      tear(17,46,16,40,rgba(FIRE_C,0.55),1.1);
      tear(17,46,11,31,rgba(mixc(FIRE_C,FIRE_HOT,0.45),0.8),1.7);
      tear(17,46,6.5,21,rgba(FIRE_HOT,0.95),2.3);
      tear(17,46,3.2,11,rgba([255,252,238],0.98),1.4);
      /* sparks */
      for(var sp=0;sp<5;sp++){
        var yy2=8+rnd()*26;
        g.fillStyle=rgba(FIRE_HOT,rs(0.25,0.7));
        g.fillRect(17+rs(-9,9),yy2,1,1);
      }
      FLAMES.push(c);
    }
  }

  function paintHero(){
    var w=46,h=50;
    heroCv.width=w;heroCv.height=h;
    var g=heroCv.getContext('2d');
    g.clearRect(0,0,w,h);
    var warmRim=rgba(mixc(FIRE_C,[255,236,200],0.45),0.95);
    var coolRim=rgba(mixc(COOL_C,[10,12,18],0.35),0.55);
    var dark='#07080e';

    function body(fill,dx,dy){
      g.save();g.translate(dx,dy);g.fillStyle=fill;
      /* cloak / back */
      g.beginPath();
      g.moveTo(24,33);
      g.quadraticCurveTo(29,24,25,16.5);
      g.quadraticCurveTo(22,12.5,19,14);
      g.quadraticCurveTo(15,17,14.5,24);
      g.quadraticCurveTo(14,30,16.5,34);
      g.closePath();g.fill();
      /* head (bowed) */
      g.beginPath();g.arc(20.2,11.4,4.5,0,Math.PI*2);g.fill();
      /* hood taper */
      g.beginPath();g.moveTo(16,9.5);g.quadraticCurveTo(19,5.6,24,8.4);
      g.quadraticCurveTo(25.5,12,23.5,14.5);g.lineTo(18,13.5);g.closePath();g.fill();
      /* thigh */
      g.beginPath();g.moveTo(24,32.5);g.lineTo(13.5,27);g.lineTo(12,31);g.lineTo(17,34.5);g.closePath();g.fill();
      /* shin */
      g.beginPath();g.moveTo(13.5,27);g.lineTo(12.4,39.5);g.lineTo(16,39.8);g.lineTo(16.6,30.5);g.closePath();g.fill();
      /* foot */
      g.fillRect(10.6,39,8.4,2.2);
      /* arm */
      g.beginPath();g.moveTo(22,21);g.lineTo(15.6,27.4);g.lineTo(17.4,29.6);g.lineTo(23.4,24);g.closePath();g.fill();
      g.restore();
    }

    /* sword planted to the left, toward the fire */
    g.fillStyle='#0a0c13';
    g.fillRect(6.2,17,2.0,24);
    g.fillStyle=rgba(mixc(FIRE_C,[255,246,224],0.5),0.92);
    g.fillRect(5.7,17,0.9,24);
    g.fillStyle='#0b0d15';g.fillRect(2.2,16.2,9.6,1.7);
    g.fillStyle=rgba(FIRE_C,0.55);g.fillRect(2.2,16.2,9.6,0.7);
    g.fillStyle='#0a0c13';g.fillRect(6.6,11.4,1.4,4.9);
    g.fillStyle=rgba(mixc(FIRE_C,[255,240,210],0.4),0.75);g.fillRect(4.6,10.2,5.4,1.5);

    /* rim stacking: warm on fire side (left), cool on tree side (right) */
    body(coolRim,1.7,0.2);
    body(warmRim,-1.7,-0.2);
    body(dark,0,0);

    /* glossy highlight on shoulder */
    g.fillStyle=rgba(COOL_C,0.22);
    g.fillRect(20,14.4,3.4,1.1);
  }

  function buildScene(){
    paintQueued=false;
    try{
      derivePalette();
      layout();
      paintBG();
      paintShafts();
      paintFlames();
      paintHero();
      warmGlow=makeGlow(FIRE_C,128);
      coolGlow=makeGlow(COOL_C,128);
      bgReady=true;
    }catch(e){console.error('[500] buildScene',e);bgReady=true;}
  }

  /* ---------- particles ---------- */
  var EMB=[],MOTES=[];
  function resetEmber(p,first){
    var fx=isFinite(L.fireX)?L.fireX:W*0.44,fy=isFinite(L.fireY)?L.fireY:H*0.8;
    var fu=isFinite(L.fireUnit)?L.fireUnit:3;
    p.x=fx+rs(-1,1)*fu*7;
    p.y=fy-rs(0,10)-fu*6;
    p.vy=rs(18,54)*(RM?0.5:1);
    p.sw=rs(0,Math.PI*2);
    p.amp=rs(2,11);
    p.life=first?rs(0,2.4):0;
    p.max=Math.max(0.8,rs(1.6,4.2));
    p.unit=rs(1.1,2.6);
    return p;
  }
  function resetMote(p,first){
    var cx=isFinite(L.canopyCx)?L.canopyCx:W*0.5;
    var cy=isFinite(L.canopyCy)?L.canopyCy:H*0.34;
    var cr=isFinite(L.canopyR)?L.canopyR:W*0.2;
    p.x=cx+rs(-1,1)*cr*1.2;
    p.y=cy+rs(-0.4,0.9)*cr;
    p.vy=rs(4,13)*(RM?0.4:1);
    p.sw=rs(0,Math.PI*2);
    p.amp=rs(4,20);
    p.life=first?rs(0,4):0;
    p.max=Math.max(1.2,rs(3.5,8));
    p.unit=rs(0.9,1.9);
    return p;
  }
  function initParticles(){
    EMB.length=0;MOTES.length=0;
    var i,n=RM?26:80,m=RM?12:36;
    n=Math.min(n,120);m=Math.min(m,60);
    for(i=0;i<n;i++){var e=resetEmber({},true);if(e&&isFinite(e.x)&&isFinite(e.y))EMB.push(e);}
    for(i=0;i<m;i++){var t=resetMote({},true);if(t&&isFinite(t.x)&&isFinite(t.y))MOTES.push(t);}
  }

  /* ---------- stars ---------- */
  var STARS=[];
  function initStars(){
    STARS.length=0;
    var n=Math.min(RM?26:58,90);
    for(var i=0;i<n;i++){
      STARS.push({x:rs(0,W||1440),y:rs(0,(H||900)*0.52),ph:rs(0,6.28),sp:rs(0.4,1.6),
                  sz:rnd()<0.2?2:1,c:rnd()<0.55?COOL_C:[255,236,208]});
    }
  }

  /* ---------- scene draw ---------- */
  function drawScene(dt,nowS){
    ctx.save();
    ctx.imageSmoothingEnabled=false;

    if(!bgReady){
      var gg=ctx.createLinearGradient(0,0,0,H);
      gg.addColorStop(0,'#070810');gg.addColorStop(1,'#12141f');
      ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
      ctx.restore();
      return;
    }
    ctx.drawImage(bgCv,0,0,W,H);

    var env=S.beat*Math.max(0,1-(nowS-S.beatT)*2.6);
    if(env<0)env=0;
    var breathe=0.5+0.5*Math.sin(vt*1.05);

    /* twinkles */
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<STARS.length;i++){
      var st=STARS[i];
      var a=0.20+0.55*(0.5+0.5*Math.sin(vt*st.sp+st.ph));
      ctx.globalAlpha=a*0.8;
      ctx.fillStyle=rgba(st.c,1);
      ctx.fillRect(st.x|0,st.y|0,st.sz,st.sz);
    }
    ctx.globalAlpha=1;

    /* canopy glow */
    var gs=L.canopyR*3.6;
    ctx.globalAlpha=Math.min(0.92,0.24+0.10*breathe+env*0.26+S.bass*0.18);
    ctx.drawImage(coolGlow,L.canopyCx-gs/2,L.canopyCy-gs/2,gs,gs);

    /* shafts */
    ctx.globalAlpha=0.20+0.09*Math.sin(vt*0.74)+env*0.10;
    ctx.drawImage(shaftCv,0,0,W,H);
    ctx.globalAlpha=1;

    /* hero */
    ctx.globalCompositeOperation='source-over';
    var bob=RM?0:Math.sin(vt*0.9)*1.3;
    var hh=L.heroH,hw=hh*(46/50);
    ctx.globalAlpha=0.55;
    ctx.fillStyle='#020306';
    ctx.beginPath();
    ctx.ellipse(L.heroX,L.heroY+hh*0.02,hw*0.42,hh*0.055,0,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.drawImage(heroCv,L.heroX-hw/2,L.heroY-hh+bob,hw,hh);

    /* fire glow */
    ctx.globalCompositeOperation='lighter';
    var fs=L.fireUnit,fg2=fs*46;
    ctx.globalAlpha=Math.min(0.95,0.34+0.14*breathe+env*0.34+S.bass*0.16);
    ctx.drawImage(warmGlow,L.fireX-fg2/2,L.fireY-fg2*0.62,fg2,fg2);

    /* flame body */
    var fi=(Math.floor(vt*13+env*3.2))%FLAMES.length;
    if(fi<0)fi=0;
    var flW=fs*34,flH=fs*48;
    var pulse=1+env*0.05+S.bass*0.03;
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    if(FLAMES[fi]){
      ctx.drawImage(FLAMES[fi],L.fireX-flW*pulse/2,L.fireY-flH*pulse+fs*3,flW*pulse,flH*pulse);
    }

    /* embers + motes */
    ctx.globalCompositeOperation='lighter';
    for(i=0;i<EMB.length;i++){
      var e=EMB[i];
      e.life+=dt;
      if(e.life>=e.max){resetEmber(e,false);continue;}
      var tt=e.life/e.max;
      e.y-=e.vy*dt*(1-tt*0.4);
      e.x+=Math.sin(e.life*2.4+e.sw)*e.amp*dt;
      var ea=(1-tt)*(0.55+0.45*Math.sin(vt*9+e.sw));
      if(ea<0)ea=0;
      ctx.globalAlpha=Math.min(0.95,ea);
      ctx.fillStyle=rgba(tt<0.35?mixc(FIRE_HOT,FIRE_C,tt/0.35):mixc(FIRE_C,[90,32,14],Math.min(1,(tt-0.35)/0.65)),1);
      var sz=e.unit*(1-tt*0.35);
      ctx.fillRect(e.x,e.y,sz<1?1:sz,sz<1?1:sz);
    }
    for(i=0;i<MOTES.length;i++){
      var m=MOTES[i];
      m.life+=dt;
      if(m.life>=m.max){resetMote(m,false);continue;}
      var mt=m.life/m.max;
      m.y+=m.vy*dt;
      m.x+=Math.sin(m.life*0.9+m.sw)*m.amp*dt;
      var ma=Math.sin(Math.PI*mt)*(0.30+0.40*(0.5+0.5*Math.sin(vt*2.1+m.sw)));
      ctx.globalAlpha=Math.max(0,ma);
      ctx.fillStyle=rgba(mixc(COOL_C,[220,255,245],0.4),1);
      var ms=m.unit;
      ctx.fillRect(m.x,m.y,ms,ms);
    }
    /* one falling ember crossing the beam in front of the hero — motion the eye can catch */
    var fe=(vt*0.13)%1;
    if(!RM&&fe>0&&fe<1){
      var fex=L.canopyCx+L.canopyR*0.62+Math.sin(vt*0.7)*L.canopyR*0.10;
      var fey=L.canopyCy-L.canopyR*0.30+fe*(L.heroY-L.canopyCy+L.canopyR*0.34);
      ctx.globalAlpha=0.85*(1-Math.max(0,(fe-0.72)/0.28));
      ctx.fillStyle=rgba(FIRE_HOT,1);
      var fw=Math.max(2,H*0.004);
      ctx.fillRect(fex,fey,fw,fw);
      ctx.globalAlpha=0.20;
      ctx.fillRect(fex-fw,fey-fw,fw*3,fw*3);
      ctx.globalAlpha=1;
    }

    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }

  /* ---------- loop ---------- */
  function frame(ts){
    frames++;
    sendReady();
    var t0=0,t1=0;
    try{t0=performance.now();}catch(e){t0=ts||0;}
    var nowS=ts/1000;
    if(!isFinite(nowS))nowS=vt;
    var dt=lastTs?(nowS-lastTs):0.016;
    if(!(dt>0)||dt>0.12)dt=0.016;
    lastTs=nowS;
    vt+=dt*(S.playing?1:0.32);

    if(!bgReady&&!paintQueued){
      paintQueued=true;
      setTimeout(buildScene,0);
    }

    try{drawScene(dt,nowS);}catch(e){console.error('[500] draw',e);}
    try{updateLyric();}catch(e){console.error('[500] lyric',e);}

    try{t1=performance.now();}catch(e){t1=t0;}
    jsMs=Math.round(Math.max(0,Math.min(60,t1-t0))*100)/100;

    rafId=requestAnimationFrame(frame);
  }

  /* ---------- resize ---------- */
  var rT=0;
  function applyResize(){
    var d=dims();
    W=d.w;H=d.h;
    DPR=Math.max(1,Math.min(2,(window.devicePixelRatio||1)));
    PR=Math.max(2,Math.min(5,Math.round(W/400)));
    cv.width=Math.max(1,Math.floor(W*DPR));cv.height=Math.max(1,Math.floor(H*DPR));
    cv.style.width=W+'px';cv.style.height=H+'px';
    var tx=(W||1440)/(cv.clientWidth||W||1440);
    if(!isFinite(tx)||tx<=0||tx>4)tx=1;
    ctx.setTransform(DPR*tx,0,0,DPR*tx,0,0);
    ctx.imageSmoothingEnabled=false;
    layout();
    initStars();
    initParticles();
    bgReady=false;
    if(!paintQueued){paintQueued=true;setTimeout(buildScene,0);}
    lyr.idx=-2;
  }
  window.addEventListener('resize',function(){
    if(rT)cancelAnimationFrame(rT);
    rT=requestAnimationFrame(function(){rT=0;try{applyResize();}catch(e){console.error('[500] resize',e);}});
  },false);
  window.addEventListener('orientationchange',function(){
    try{applyResize();}catch(e){console.error('[500] orient',e);}
  },false);

  /* ---------- messages ---------- */
  function onInit(p){
    p=p||{};
    S.lines=normLines(p.lines);
    S.nLines=S.lines.length;
    var a=p.accent;
    if(a&&typeof a.length==='number'&&a.length>=3&&isFinite(a[0])&&isFinite(a[1])&&isFinite(a[2])){
      S.accent=[Math.max(0,Math.min(255,a[0]|0)),Math.max(0,Math.min(255,a[1]|0)),Math.max(0,Math.min(255,a[2]|0))];
    }
    try{
      derivePalette();
      paintFlames();
      paintHero();
      warmGlow=makeGlow(FIRE_C,128);
      coolGlow=makeGlow(COOL_C,128);
    }catch(e){console.error('[500] repalette',e);}
    bgReady=false;
    if(!paintQueued){paintQueued=true;setTimeout(buildScene,0);}
    initStars();
    initParticles();
    S.playing=p.playing===false?false:true;
    var nm='';
    try{
      var sg=p.song||{};
      if(typeof sg.name==='string')nm=sg.name.trim();
      if(!nm&&sg.artists){
        nm=typeof sg.artists==='string'?sg.artists:(Array.isArray(sg.artists)?(sg.artists[0]||''):'');
        if(typeof nm!=='string')nm='';
      }
    }catch(e){console.error('[500] meta',e);}
    if(hdTx)hdTx.textContent=nm?('存档点 · '+nm.slice(0,26)):'存档点 · SAVE';
    updateIdx();
    lyr.idx=-2;
    if(emptyEl)emptyEl.style.display=S.nLines?'none':'block';
    if(lyrEl)lyrEl.style.display=S.nLines?'block':'none';
    updateLyric();
  }

  window.addEventListener('message',function(ev){
    var m=ev&&ev.data;
    if(!m||m.__c100!==1)return;
    var p=m.payload||{};
    try{
      if(m.type==='init'){
        onInit(p);
      }else if(m.type==='tick'){
        if(typeof p.time==='number'&&isFinite(p.time))S.t=p.time;
        if(typeof p.playing==='boolean')S.playing=p.playing;
        updateIdx();
      }else if(m.type==='beat'){
        S.beat=typeof p.level==='number'&&isFinite(p.level)?Math.max(0,Math.min(1.4,p.level)):0.6;
        try{S.beatT=performance.now()/1000;}catch(e){S.beatT=vt;}
      }else if(m.type==='live'){
        if(typeof p.bass==='number'&&isFinite(p.bass))S.bass=Math.max(0,Math.min(1,p.bass));
        if(typeof p.level==='number'&&isFinite(p.level))S.level=Math.max(0,Math.min(1,p.level));
        if(typeof p.playing==='boolean')S.playing=p.playing;
      }
    }catch(e){console.error('[500] msg',m&&m.type,e);}
  });

  /* ---------- boot ---------- */
  try{
    derivePalette();
    applyResize();
    initStars();
    initParticles();
    updateLyric();
  }catch(e){console.error('[500] boot',e);}
  rafId=requestAnimationFrame(frame);
  setTimeout(sendReady,700);
  setTimeout(sendReady,1600);
})();
</script>
</body>
</html>
