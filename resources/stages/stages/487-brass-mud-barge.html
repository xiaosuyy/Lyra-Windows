<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>铜管泥筏</title>
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#120c08; }
  #stage{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #lyr{ position:absolute; left:0; right:0; bottom:clamp(22px,6.5vh,92px); z-index:6;
        padding:0 clamp(18px,5vw,80px); text-align:center; pointer-events:none;
        font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif; }
  #lyr .rule{ width:clamp(38px,6vw,88px); height:2px; margin:0 auto clamp(10px,1.6vh,20px);
        background:linear-gradient(90deg,transparent,#e8b45f,transparent); opacity:0;
        transform-origin:50% 50%; transform:scaleX(.28); will-change:transform,opacity; }
  #lyr .line{ font-size:clamp(21px,3.05vw,50px); line-height:1.30; letter-spacing:.03em;
        font-weight:600; word-break:break-word; overflow-wrap:anywhere;
        text-shadow:0 2px 4px rgba(28,10,4,.55), 0 3px 20px rgba(22,8,3,.92), 0 0 40px rgba(22,8,3,.7); }
  #lyr .line .ch{ color:rgba(255,238,210,.52); transition:color .16s linear, text-shadow .3s ease; }
  #lyr .line .ch.on{ color:#fff8e8; }
  #lyr .line .ch.hot{ color:#ffe0a4; text-shadow:0 2px 4px rgba(28,10,4,.5), 0 0 22px rgba(255,186,92,.85); }
  #lyr .meta{ margin-top:clamp(8px,1.2vh,16px); font-size:clamp(10px,1.05vw,14px);
        letter-spacing:.34em; color:rgba(248,222,180,.6); text-indent:.34em;
        font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif; }
  #lyr .line.long{ font-size:clamp(17px,2.35vw,38px); }
  #lyr .line.xlong{ font-size:clamp(14px,1.85vw,29px); line-height:1.42; letter-spacing:.01em; }
  #lyr.empty .line{ font-size:clamp(15px,1.5vw,21px); font-weight:400; color:rgba(255,238,208,.72); letter-spacing:.22em; }
  @media (orientation:portrait){
    #lyr{ bottom:clamp(18px,5vh,64px); padding:0 clamp(14px,5vw,40px); }
    #lyr .line{ font-size:clamp(19px,5.6vw,34px); line-height:1.36; }
    #lyr .line.long{ font-size:clamp(16px,4.4vw,26px); }
    #lyr .line.xlong{ font-size:clamp(14px,3.6vw,21px); }
    #lyr .meta{ margin-top:clamp(6px,1vh,12px); letter-spacing:.24em; }
    #title{ top:clamp(20px,5.5vh,70px); }
  }
  #title{ position:absolute; left:0; right:0; top:clamp(28px,8vh,110px); z-index:5; text-align:center;
        pointer-events:none; transition:opacity 1.1s ease; }
  #title .t1{ font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
        font-size:clamp(13px,1.35vw,19px); letter-spacing:.55em; text-indent:.55em;
        color:rgba(255,229,186,.82); text-shadow:0 2px 14px rgba(20,8,3,.9); }
  #title .t2{ margin-top:.5em; font-family:ui-sans-serif,system-ui,sans-serif;
        font-size:clamp(9px,.82vw,11px); letter-spacing:.42em; text-indent:.42em;
        color:rgba(255,206,150,.5); }
  #lyr.swap{ animation:swap .42s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes swap{ from{ opacity:.15; transform:translateY(.22em) scale(.985); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    #lyr.swap{ animation:none; }
    #lyr .line .ch{ transition:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="title"><div class="t1" id="titleLine"></div><div class="t2">铜管 · 泥地 · 白鹅</div></div>
  <div id="lyr">
    <div class="rule" id="rule"></div>
    <div class="line" id="cur"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var RM = false;
  try{ RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ console.error(e); }

  var S = {
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, err: '', text: '', gl: false, ready: false,
    accent: [217,119,47], dur: 0
  };

  // --- the single self-check hook, top level, computed from live state ---
  window.__stage = function(){
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: S.js,
      err: S.err,
      text: S.text,
      gl: S.gl,
      rm: RM
    };
  };

  var W = 1440, H = 900, DPR = 1;
  var bg = document.getElementById('bg');
  var ctx = bg.getContext('2d');
  var curEl = document.getElementById('cur');
  var metaEl = document.getElementById('meta');
  var ruleEl = document.getElementById('rule');
  var lyrEl = document.getElementById('lyr');
  var lyr = { idx: -1, spans: [], n: 0, timer: 0, song: '', empty: false, swapAt: -1 };
  var LY_EMPTY = '\u672c\u66f2\u65e0\u8bcd \u00b7 \u53ea\u542c\u94dc\u7ba1';

  // 按 UTF-16 安全切字：代理对不被劈开
  function splitChars(str){
    var out = [];
    var n = str.length;
    for(var i = 0; i < n && out.length < 500; i++){
      var c = str.charCodeAt(i);
      if(c >= 0xD800 && c <= 0xDBFF && i + 1 < n){
        var d = str.charCodeAt(i + 1);
        if(d >= 0xDC00 && d <= 0xDFFF){ out.push(str.slice(i, i + 2)); i++; continue; }
      }
      out.push(str.charAt(i));
    }
    return out;
  }

  function songTitle(p){
    try{
      var s = p && p.song ? p.song : {};
      var nm = s.name ? String(s.name).trim() : '';
      var ar = s.artists;
      if(Array.isArray(ar)) ar = ar.filter(function(x){ return x; }).join(' / ');
      ar = ar ? String(ar).trim() : '';
      if(!nm && !ar) return '';
      return (ar ? ar + ' \u2014 ' : '') + nm;
    }catch(e){ console.error(e); return ''; }
  }

  function lineDur(ln, i){
    var d = Number(ln && ln.dur);
    if(isFinite(d) && d > 0.4) return Math.min(d, 20);
    var next = S.lines[i + 1];
    if(next && next.t > ln.t + 0.2) return Math.min(20, next.t - ln.t);
    return 3.2;
  }

  function buildLyric(i){
    var ln = S.lines[i];
    var txt = ln && ln.text ? String(ln.text) : '';
    lyr.spans = [];
    lyr.n = 0;
    lyr.idx = i;
    lyrEl.classList.remove('empty');
    if(!txt){ curEl.className = 'line'; curEl.textContent = ''; metaEl.textContent = ''; return; }
    var chars = splitChars(txt);
    var times = null;
    var ch = ln.chars;
    if(Array.isArray(ch) && ch.length){
      times = [];
      for(var k = 0; k < chars.length; k++){
        var it = ch[k];
        var tv = it && typeof it === 'object' ? Number(it.t) : NaN;
        times.push(isFinite(tv) ? tv : (ln.t + lineDur(ln, i) * (k / Math.max(1, chars.length))));
      }
    }
    curEl.className = 'line' + (chars.length > 34 ? ' long' : '') + (chars.length > 54 ? ' xlong' : '');
    var frag = document.createDocumentFragment();
    for(var j = 0; j < chars.length; j++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = chars[j];
      frag.appendChild(sp);
      lyr.spans.push(sp);
    }
    curEl.textContent = '';
    curEl.appendChild(frag);
    lyr.n = chars.length;
    lyr.times = times;
    var d0 = lineDur(ln, i);
    metaEl.textContent = S.lines.length > 1 ? pad(i + 1) + ' / ' + pad(S.lines.length) : '';
    lyr.swapAt = 0;
    paintChars(true);
  }

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function paintChars(force){
    if(!lyr.spans.length) return;
    var ln = S.lines[lyr.idx];
    if(!ln) return;
    var d = lineDur(ln, lyr.idx);
    var base = ln.t;
    var local = S.t - base;
    var times = lyr.times;
    var prev = -1;
    for(var i = 0; i < lyr.n; i++){
      var st;
      if(times) st = times[i];
      else st = base + d * (i / Math.max(1, lyr.n));
      var on = S.t >= st - 0.02;
      var hot = on && (i === lyr.n - 1 ? true : (times ? S.t < (times[i + 1] || st + 0.4) : S.t < st + d / Math.max(1, lyr.n)));
      var cls = on ? (hot ? 'ch hot' : 'ch on') : 'ch';
      var sp = lyr.spans[i];
      if(force || sp._c !== cls){ sp.className = cls; sp._c = cls; }
      if(on) prev = i;
    }
    // 当前字的气口：整句越接近尾声，底部横线越亮
    var prog = clamp(local / Math.max(0.35, d * 0.9), 0, 1);
    if(ruleEl){
      ruleEl.style.transform = 'scaleX(' + (0.30 + prog * 0.70).toFixed(3) + ')';
      ruleEl.style.opacity = (0.55 + prog * 0.35).toFixed(3);
    }
  }

  var titleEl = document.getElementById('title');
  var titleLineEl = document.getElementById('titleLine');
  var titleOn = true;

  function setTitle(p){
    try{
      var s = (p && p.song) || {};
      var nm = s.name ? String(s.name).trim().slice(0, 60) : '';
      titleLineEl.textContent = nm || '\u672a\u547d\u540d\u7684\u5a5a\u793c\u8fdb\u884c\u66f2';
      titleEl.style.opacity = '1';
      titleOn = true;
    }catch(e){ console.error('[title]', e); }
  }

  function fadeTitle(){
    if(!titleOn) return;
    titleOn = false;
    titleEl.style.opacity = '0';
  }

  function setLine(i){
    if(i === lyr.idx) return;
    if(i < 0){
      lyr.idx = i;
      lyr.spans = [];
      lyr.n = 0;
      lyr.times = null;
      curEl.className = 'line';
      curEl.textContent = '';
      metaEl.textContent = '';
      if(ruleEl) ruleEl.style.opacity = '0';
      return;
    }
    buildLyric(i);
    if(i >= 0) fadeTitle();
    lyrEl.classList.remove('swap');
    void lyrEl.offsetWidth;
    lyrEl.classList.add('swap');
  }

  function showEmpty(){
    lyr.idx = -3;
    lyr.spans = [];
    lyr.n = 0;
    lyr.times = null;
    curEl.className = 'line';
    curEl.textContent = LY_EMPTY;
    metaEl.textContent = lyr.song || '';
    lyrEl.classList.add('empty');
    if(ruleEl) ruleEl.style.opacity = '0';
  }

  function findIdx(t){
    var lo = 0, hi = S.lines.length - 1, ans = -1;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(S.lines[mid].t <= t + 0.06){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  function onInit(p){
    try{
      p = p || {};
      var arr = Array.isArray(p.lines) ? p.lines : [];
      var out = [];
      for(var i = 0; i < arr.length && i < 400; i++){
        var it = arr[i] || {};
        var t = Number(it.t);
        if(!isFinite(t) || t < 0) t = 0;
        var tx = (it.text === null || it.text === undefined) ? '' : String(it.text);
        out.push({
          t: t,
          dur: Math.max(0.3, Number(it.dur) || 0),
          text: tx.slice(0, 400),
          chars: Array.isArray(it.chars) ? it.chars : null
        });
      }
      out.sort(function(a,b){ return a.t - b.t; });
      S.lines = out;
      S.dur = Number(p.duration) || 0;
      var a = p.accent;
      if(Array.isArray(a) && a.length >= 3 && isFinite(a[0])){
        S.accent = [clamp(a[0] | 0, 0, 255), clamp(a[1] | 0, 0, 255), clamp(a[2] | 0, 0, 255)];
      }
      lyr.song = songTitle(p);
      setTitle(p);
      S.idx = -1; S.text = '';
      lyr.idx = -2;
      if(!S.lines.length){ showEmpty(); return; }
      var want = findIdx(S.t);
      setLine(want);
      if(want >= 0){
        S.idx = want;
        S.text = String(S.lines[want].text || '');
      }
    }catch(e){ S.err = String(e && e.message || e); console.error('[init]', e); }
  }

  function size(){
    var w = window.innerWidth || 1440;
    var h = window.innerHeight || 900;
    if(!isFinite(w) || w <= 0) w = 1440;
    if(!isFinite(h) || h <= 0) h = 900;
    W = w; H = h;
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    bg.width = Math.floor(W * DPR);
    bg.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();
  }

  // ============================================================
  //  scene: 静态部分全部离屏预渲染，每帧只做贴图 + 少量动效
  // ============================================================
  var _seed = 1;
  function rnd(){ _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }

  var skyCv = document.createElement('canvas'), skyC = skyCv.getContext('2d');
  var foreCv = document.createElement('canvas'), foreC = foreCv.getContext('2d');
  var grimeCv = document.createElement('canvas'), grimeC = grimeCv.getContext('2d');
  var PR = 1, GR = 1;
  var SC = { horizon: 540, deckY: 690, bandH: 300, sunX: 480, sunY: 520, portrait: false, horns: [] };
  var birds = [], motes = [], scraps = [];
  var haloGrad = null, vigGrad = null, waterGrad = null, beatGrad = null, scrimGrad = null;
  var waterT = 0, skyT = 0;

  function canvasSize(c, w, h){ c.width = Math.max(1, Math.round(w) | 0); c.height = Math.max(1, Math.round(h) | 0); }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  function drawSky(c, w, h){
    _seed = 4241;
    var hz = SC.horizon;
    var g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0.00, '#231029');
    g.addColorStop(0.16, '#331827');
    g.addColorStop(0.32, '#5b2a22');
    g.addColorStop(0.46, '#94491f');
    g.addColorStop(0.56, '#bd6b28');
    g.addColorStop(0.66, '#dc9638');
    g.addColorStop(1.00, '#eec267');
    c.fillStyle = g;
    c.fillRect(0, 0, w, hz);
    // 云层块面：一次性画完，不做逐帧 blur
    for(var i = 0; i < 26; i++){
      var bx = -0.25 * w + rnd() * 1.5 * w;
      var by = -0.05 * h + rnd() * 1.05 * hz;
      var br = (0.16 + rnd() * 0.30) * w;
      var dark = rnd() < 0.58;
      c.save();
      c.translate(bx, by);
      c.scale(1, 0.22 + rnd() * 0.16);
      var gg = c.createRadialGradient(0, 0, 0, 0, 0, br);
      if(dark){
        gg.addColorStop(0, 'rgba(24,11,26,0.50)');
        gg.addColorStop(0.55, 'rgba(40,18,30,0.24)');
        gg.addColorStop(1, 'rgba(40,18,30,0)');
      }else{
        gg.addColorStop(0, 'rgba(255,196,116,0.34)');
        gg.addColorStop(0.6, 'rgba(248,160,74,0.12)');
        gg.addColorStop(1, 'rgba(248,160,74,0)');
      }
      c.fillStyle = gg;
      c.beginPath(); c.arc(0, 0, br, 0, 6.2832); c.fill();
      c.restore();
    }
    // 地平线暖光
    var lg = c.createLinearGradient(0, hz - h * 0.16, 0, hz);
    lg.addColorStop(0, 'rgba(255,206,130,0)');
    lg.addColorStop(1, 'rgba(255,232,176,0.55)');
    c.fillStyle = lg;
    c.fillRect(0, hz - h * 0.16, w, h * 0.16);
    // 横跨天空的婚礼彩旗串（两串，一高一低，下垂）
    drawBunting(c, w, h, 0.055, 0.075, 26);
    drawBunting(c, w, h, 0.135, 0.055, 20);
    // 白鹅（吊在彩旗下，像风筝）
    drawGoose(c, w * (SC.portrait ? 0.72 : 0.865), h * 0.215, Math.min(w * 0.055, h * 0.075));
    // 一袭被风鼓起来的婚纱，吊在右侧的旗绳上
    drawVeil(c, w * (SC.portrait ? 0.30 : 0.795), h * 0.205, Math.min(w * 0.085, h * 0.14));
  }

  function drawVeil(c, x, y, s){
    c.save();
    c.translate(x, y);
    c.rotate(0.10);
    // 吊线
    c.strokeStyle = 'rgba(40,20,16,0.5)';
    c.lineWidth = Math.max(1, s * 0.012);
    c.beginPath();
    c.moveTo(0, -s * 0.62); c.lineTo(0, -s * 0.10);
    c.stroke();
    // 裙身：被风扯开的布
    var g = c.createLinearGradient(0, -s * 0.1, 0, s * 1.15);
    g.addColorStop(0, 'rgba(252,243,226,0.92)');
    g.addColorStop(0.55, 'rgba(238,222,196,0.80)');
    g.addColorStop(1, 'rgba(214,190,158,0.30)');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-s * 0.16, -s * 0.10);
    c.quadraticCurveTo(-s * 0.40, s * 0.42, -s * 0.52, s * 1.10);
    c.quadraticCurveTo(-s * 0.16, s * 0.92, s * 0.06, s * 1.16);
    c.quadraticCurveTo(s * 0.34, s * 0.86, s * 0.30, s * 0.38);
    c.quadraticCurveTo(s * 0.22, s * 0.02, s * 0.16, -s * 0.10);
    c.closePath();
    c.fill();
    // 蕾丝褶
    c.strokeStyle = 'rgba(255,252,242,0.55)';
    c.lineWidth = Math.max(1, s * 0.014);
    for(var i = 0; i < 5; i++){
      var f = (i + 1) / 6;
      c.beginPath();
      c.moveTo(-s * 0.16 + f * s * 0.28, -s * 0.02);
      c.quadraticCurveTo(-s * 0.06 + f * s * 0.10, s * 0.52, -s * 0.30 + f * s * 0.52, s * 1.04);
      c.stroke();
    }
    c.restore();
  }

  function drawBunting(c, w, h, topY, sag, count){
    var y0 = h * topY;
    var ropeW = Math.max(1, h * 0.0016);
    c.save();
    c.strokeStyle = 'rgba(38,18,16,0.75)';
    c.lineWidth = ropeW;
    c.beginPath();
    c.moveTo(-w * 0.02, y0);
    c.quadraticCurveTo(w * 0.5, y0 + h * sag * 1.6, w * 1.02, y0 + h * sag * 0.35);
    c.stroke();
    var cols = ['rgba(196,52,44,0.94)', 'rgba(242,208,150,0.92)', 'rgba(52,104,96,0.9)', 'rgba(226,150,52,0.94)'];
    for(var i = 0; i < count; i++){
      var f = (i + 0.5) / count;
      var ft = 1 - f;
      // 二次贝塞尔取点
      var xa = -w * 0.02, ya = y0;
      var xc = w * 0.5, yc = y0 + h * sag * 1.6;
      var xb = w * 1.02, yb = y0 + h * sag * 0.35;
      var px = ft * ft * xa + 2 * ft * f * xc + f * f * xb;
      var py = ft * ft * ya + 2 * ft * f * yc + f * f * yb;
      var fw = w * 0.026, fh = h * 0.050;
      c.fillStyle = cols[i % cols.length];
      c.beginPath();
      c.moveTo(px - fw * 0.5, py);
      c.lineTo(px + fw * 0.5, py);
      c.lineTo(px + Math.sin(i * 1.7) * fw * 0.10, py + fh);
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawSun(c, w, h){
    var sx = SC.sunX, sy = SC.sunY;
    var r = Math.max(w, h) * 0.62;
    var halo = c.createRadialGradient(sx, sy, 0, sx, sy, r);
    var a0 = 'rgba(' + S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2] + ',';
    halo.addColorStop(0.00, 'rgba(255,238,196,0.62)');
    halo.addColorStop(0.18, 'rgba(255,206,120,0.34)');
    halo.addColorStop(0.42, a0 + '0.16)');
    halo.addColorStop(1.00, 'rgba(120,40,20,0)');
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = halo;
    c.fillRect(0, 0, w, h);
    c.restore();
    // 日盘
    var sr = Math.max(10, w * 0.028);
    var dg = c.createRadialGradient(sx, sy, 0, sx, sy, sr);
    dg.addColorStop(0, 'rgba(255,251,232,0.98)');
    dg.addColorStop(0.62, 'rgba(255,232,170,0.85)');
    dg.addColorStop(1, 'rgba(255,196,110,0)');
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = dg;
    c.beginPath(); c.arc(sx, sy, sr, 0, 6.2832); c.fill();
    c.restore();
  }

  // 远岸：杨树列 + 高脚屋 + 婚礼旗串
  function drawFarShore(c, w, h){
    var hz = SC.horizon;
    c.save();
    c.fillStyle = 'rgba(46,25,18,0.92)';
    var base = hz + 1;
    c.beginPath();
    c.moveTo(0, base);
    var x = 0;
    var n = 0;
    while(x < w + 40 && n++ < 90){
      var tw = 6 + rnd() * 16;
      var th = h * (0.012 + rnd() * 0.035);
      c.lineTo(x, base);
      c.lineTo(x + tw * 0.5, base - th);
      c.lineTo(x + tw, base);
      x += tw * (0.35 + rnd() * 0.5);
    }
    c.lineTo(w + 40, base + h * 0.02);
    c.lineTo(0, base + h * 0.02);
    c.closePath();
    c.fill();
    // 高脚屋
    var huts = [0.14, 0.30, 0.47, 0.66, 0.83];
    for(var i = 0; i < huts.length; i++){
      var hx = huts[i] * w, hy = base - h * 0.004;
      var hw = w * 0.045, hh = h * 0.030;
      c.fillStyle = 'rgba(40,21,15,0.95)';
      c.beginPath();
      c.moveTo(hx - hw * 0.5, hy);
      c.lineTo(hx - hw * 0.5, hy - hh * 0.55);
      c.lineTo(hx, hy - hh);
      c.lineTo(hx + hw * 0.5, hy - hh * 0.55);
      c.lineTo(hx + hw * 0.5, hy);
      c.closePath();
      c.fill();
      c.strokeStyle = 'rgba(40,21,15,0.8)';
      c.lineWidth = Math.max(1, w * 0.0016);
      c.beginPath();
      c.moveTo(hx - hw * 0.35, hy); c.lineTo(hx - hw * 0.35, hy + h * 0.022);
      c.moveTo(hx + hw * 0.35, hy); c.lineTo(hx + hw * 0.35, hy + h * 0.022);
      c.stroke();
    }
    c.restore();
  }

  // 一个乐手剪影：2 = 长号，3 = 小号，4 = 苏萨号，5 = 手风琴
  function drawPlayer(c, x, footY, hgt, kind, lean, flip){
    var s = hgt;
    var dir = flip ? -1 : 1;
    c.save();
    c.translate(x, footY);
    c.rotate(lean);
    c.scale(dir, 1);
    var lw = Math.max(2, s * 0.030);
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.strokeStyle = '#1b0d0a';
    c.fillStyle = '#1b0d0a';
    var hipY = -0.40 * s, shY = -0.74 * s, headY = -0.845 * s, headR = 0.052 * s;
    // 腿
    c.lineWidth = lw * 1.05;
    c.beginPath();
    c.moveTo(-0.012 * s, hipY); c.lineTo(-0.075 * s, -0.02 * s);
    c.moveTo(0.012 * s, hipY); c.lineTo(0.055 * s, -0.01 * s);
    c.stroke();
    // 躯干（马甲）
    c.beginPath();
    c.moveTo(-0.068 * s, shY);
    c.lineTo(0.068 * s, shY);
    c.lineTo(0.052 * s, hipY);
    c.lineTo(-0.052 * s, hipY);
    c.closePath();
    c.fill();
    // 头 + 帽子
    c.beginPath(); c.arc(0.004 * s, headY, headR, 0, 6.2832); c.fill();
    c.beginPath();
    c.ellipse(0.004 * s, headY - headR * 0.92, headR * 1.7, headR * 0.34, 0, 0, 6.2832);
    c.fill();
    c.beginPath();
    c.ellipse(0.004 * s, headY - headR * 1.25, headR * 0.85, headR * 0.6, 0, 0, 6.2832);
    c.fill();

    c.lineWidth = lw * 0.85;
    if(kind === 4){ // 苏萨号
      var r = 0.185 * s;
      c.beginPath(); c.ellipse(0.02 * s, -0.60 * s, r, r * 1.02, 0, 0, 6.2832);
      c.lineWidth = Math.max(2, s * 0.045); c.strokeStyle = '#1b0d0a'; c.stroke();
      c.lineWidth = Math.max(1, s * 0.012);
      c.strokeStyle = 'rgba(255,205,130,0.55)';
      c.beginPath(); c.arc(0.02 * s, -0.60 * s, r * 0.88, Math.PI * 0.85, Math.PI * 1.55); c.stroke();
      c.strokeStyle = '#1b0d0a'; c.lineWidth = lw * 1.1;
      c.beginPath();
      c.moveTo(-0.10 * s, shY + 0.02 * s); c.lineTo(0.02 * s, -0.75 * s);
      c.stroke();
      c.beginPath(); // 号口朝上
      c.moveTo(0.02 * s, -0.76 * s);
      c.lineTo(-0.055 * s, -0.98 * s);
      c.lineTo(0.085 * s, -0.98 * s);
      c.closePath();
      c.fill();
    }else if(kind === 2){ // 长号
      c.beginPath();
      c.moveTo(-0.055 * s, shY + 0.05 * s);
      c.quadraticCurveTo(0.16 * s, -0.80 * s, 0.30 * s, -0.90 * s);
      c.stroke();
      c.beginPath();
      c.moveTo(0.30 * s, -0.90 * s);
      c.lineTo(0.63 * s, -1.06 * s);
      c.lineWidth = Math.max(1.5, s * 0.016);
      c.stroke();
      // 喇叭口
      c.beginPath();
      c.moveTo(0.62 * s, -1.08 * s);
      c.lineTo(0.79 * s, -1.14 * s);
      c.lineTo(0.665 * s, -0.99 * s);
      c.closePath();
      c.fill();
      c.strokeStyle = 'rgba(255,206,140,0.6)';
      c.lineWidth = Math.max(1, s * 0.008);
      c.beginPath(); c.moveTo(0.30 * s, -0.90 * s); c.lineTo(0.62 * s, -1.06 * s); c.stroke();
    }else if(kind === 3){ // 小号
      c.beginPath();
      c.moveTo(-0.05 * s, shY + 0.08 * s);
      c.quadraticCurveTo(0.10 * s, -0.79 * s, 0.20 * s, -0.86 * s);
      c.stroke();
      c.beginPath();
      c.moveTo(0.20 * s, -0.90 * s);
      c.lineTo(0.20 * s, -1.02 * s);
      c.lineWidth = Math.max(1.5, s * 0.014);
      c.stroke();
      c.beginPath();
      c.moveTo(0.185 * s, -1.02 * s);
      c.lineTo(0.215 * s, -1.02 * s);
      c.lineTo(0.30 * s, -1.19 * s);
      c.lineTo(0.245 * s, -1.20 * s);
      c.closePath();
      c.fill();
    }else{ // 手风琴
      c.beginPath();
      c.moveTo(-0.06 * s, shY + 0.06 * s);
      c.lineTo(0.10 * s, shY + 0.10 * s);
      c.lineTo(0.10 * s, -0.44 * s);
      c.lineTo(-0.06 * s, -0.46 * s);
      c.closePath();
      c.fill();
      c.strokeStyle = 'rgba(255,196,120,0.45)';
      c.lineWidth = Math.max(1, s * 0.006);
      for(var k = 1; k < 5; k++){
        var yy = shY + 0.10 * s - k * (0.26 * s / 5);
        c.beginPath(); c.moveTo(-0.055 * s, yy); c.lineTo(0.095 * s, yy + 0.004 * s); c.stroke();
      }
      c.strokeStyle = '#1b0d0a';
      c.beginPath();
      c.moveTo(0.02 * s, shY + 0.06 * s); c.lineTo(0.16 * s, -0.95 * s);
      c.stroke();
    }
    c.restore();
  }

  function drawShip(c, w, h){
    var hz = SC.horizon;
    var x0 = w * 0.585, x1 = w * 0.905;
    var yTop = hz + h * 0.012, yBot = hz + h * 0.075;
    c.save();
    c.fillStyle = '#2b1a13';
    c.beginPath();
    c.moveTo(x0, yTop);
    c.lineTo(x1, yTop - h * 0.004);
    c.quadraticCurveTo(x1 + w * 0.012, yBot, x1 - w * 0.05, yBot);
    c.lineTo(x0 + w * 0.04, yBot + h * 0.004);
    c.quadraticCurveTo(x0 - w * 0.014, yBot - h * 0.01, x0, yTop);
    c.closePath();
    c.fill();
    // 篷布拱顶
    var cx = (x0 + x1) / 2, hw = (x1 - x0) * 0.46;
    c.fillStyle = '#3b241a';
    c.beginPath();
    c.moveTo(cx - hw, yTop + h * 0.002);
    c.quadraticCurveTo(cx, yTop - h * 0.085, cx + hw, yTop + h * 0.002);
    c.closePath();
    c.fill();
    // 彩旗串
    var n = 9;
    for(var i = 0; i < n; i++){
      var f = i / (n - 1);
      var fx = x0 + (x1 - x0) * f;
      var fy = yTop - h * 0.085 - Math.sin(f * Math.PI) * h * 0.018;
      c.fillStyle = (i % 2) ? 'rgba(196,58,44,0.95)' : 'rgba(238,204,148,0.9)';
      c.beginPath();
      c.moveTo(fx, fy);
      c.lineTo(fx + w * 0.012, fy);
      c.lineTo(fx + w * 0.006, fy + h * 0.028);
      c.closePath();
      c.fill();
    }
    // 船上两个小人
    c.fillStyle = '#1d0f0b';
    c.fillRect(cx - w * 0.02, yTop - h * 0.045, w * 0.008, h * 0.045);
    c.beginPath(); c.arc(cx - w * 0.016, yTop - h * 0.052, w * 0.006, 0, 6.2832); c.fill();
    c.fillRect(cx + w * 0.012, yTop - h * 0.040, w * 0.008, h * 0.040);
    c.beginPath(); c.arc(cx + w * 0.016, yTop - h * 0.048, w * 0.006, 0, 6.2832); c.fill();
    c.restore();
  }

  function drawFore(c, w, h){
    var deck = SC.deckY;
    c.clearRect(0, 0, w, h);
    // 木筏：倾斜的破甲板
    var p0 = [-0.08 * w, deck + h * 0.075];
    var p1 = [0.46 * w, deck - h * 0.02];
    var p2 = [1.09 * w, deck + h * 0.045];
    var p3 = [1.09 * w, h + h * 0.06];
    var p4 = [-0.08 * w, h + h * 0.06];
    var dg = c.createLinearGradient(0, deck, 0, h);
    dg.addColorStop(0, '#3d2415');
    dg.addColorStop(0.25, '#2a1810');
    dg.addColorStop(1, '#150c08');
    c.fillStyle = dg;
    c.beginPath();
    c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.lineTo(p2[0], p2[1]);
    c.lineTo(p3[0], p3[1]); c.lineTo(p4[0], p4[1]);
    c.closePath();
    c.fill();
    // 甲板板缝
    c.save();
    c.strokeStyle = 'rgba(12,6,4,0.55)';
    for(var i = 1; i < 9; i++){
      var f = i / 9;
      c.lineWidth = 1 + i * 0.5;
      c.globalAlpha = 0.25 + f * 0.35;
      var ya = p0[1] + (p1[1] - p0[1]) * f + i * h * 0.028;
      var yb = p2[1] + i * h * 0.032;
      c.beginPath();
      c.moveTo(-20, ya);
      c.quadraticCurveTo(w * 0.45, ya - h * 0.012, w + 20, yb);
      c.stroke();
    }
    c.restore();
    // 甲板上缘湿光
    c.save();
    c.strokeStyle = 'rgba(255,198,120,0.55)';
    c.lineWidth = Math.max(2, h * 0.004);
    c.beginPath();
    c.moveTo(p0[0], p0[1]);
    c.quadraticCurveTo(w * 0.46, p1[1] - h * 0.004, p2[0], p2[1]);
    c.stroke();
    c.strokeStyle = 'rgba(120,58,26,0.5)';
    c.lineWidth = Math.max(1, h * 0.0025);
    c.beginPath();
    c.moveTo(p0[0], p0[1] + h * 0.006);
    c.quadraticCurveTo(w * 0.46, p1[1] + h * 0.004, p2[0], p2[1] + h * 0.006);
    c.stroke();
    c.restore();

    // 远处船
    drawShip(c, w, h);

    // 铜管乐队
    var bh = SC.bandH;
    var feet = deck + h * 0.012;
    var xs, hs, kinds, leans;
    if(SC.portrait){
      xs = [0.22, 0.40, 0.60, 0.79, 0.94];
      hs = [0.80, 0.96, 1.06, 0.90, 0.72];
      kinds = [4, 4, 2, 3, 5];
      leans = [-0.05, 0.04, -0.03, 0.06, -0.07];
    }else{
      xs = [0.365, 0.455, 0.560, 0.660, 0.760];
      hs = [0.80, 0.94, 1.10, 1.00, 0.86];
      kinds = [4, 4, 2, 3, 5];
      leans = [-0.055, 0.045, -0.028, 0.055, -0.065];
    }
    for(var k = 0; k < xs.length; k++){
      var ph = xs[k] * w, pf = feet + (k % 2 ? h * 0.008 : -h * 0.004), ph2 = SC.bandH * hs[k];
      drawPlayer(c, ph, pf, ph2, kinds[k], leans[k], k === 4);
      if(kinds[k] === 2) SC.horns.push({ x: ph + ph2 * 0.70, y: pf - ph2 * 1.09, r: ph2 * 0.30 });
      else if(kinds[k] === 3) SC.horns.push({ x: ph + ph2 * 0.28, y: pf - ph2 * 1.14, r: ph2 * 0.22 });
      else if(kinds[k] === 4) SC.horns.push({ x: ph + ph2 * 0.02, y: pf - ph2 * 0.98, r: ph2 * 0.34 });
    }
    // 一只大白鹅站在筏子左侧
    drawGoose(c, w * 0.155, deck + h * 0.035, Math.min(h * 0.10, w * 0.075));
  }

  function drawGoose(c, x, y, s){
    c.save();
    c.translate(x, y);
    c.rotate(-0.08);
    c.fillStyle = '#f6ead2';
    c.beginPath(); c.ellipse(0, 0, s * 0.52, s * 0.30, -0.08, 0, 6.2832); c.fill();
    // 脖子
    c.strokeStyle = '#f6ead2';
    c.lineWidth = s * 0.20;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(s * 0.34, -s * 0.10);
    c.quadraticCurveTo(s * 0.62, -s * 0.55, s * 0.42, -s * 0.90);
    c.stroke();
    c.beginPath(); c.ellipse(s * 0.40, -s * 0.93, s * 0.13, s * 0.10, -0.3, 0, 6.2832); c.fill();
    // 喙
    c.fillStyle = '#d4762c';
    c.beginPath();
    c.moveTo(s * 0.50, -s * 0.95); c.lineTo(s * 0.72, -s * 0.90); c.lineTo(s * 0.50, -s * 0.86);
    c.closePath(); c.fill();
    c.fillStyle = '#1d1210';
    c.beginPath(); c.arc(s * 0.44, -s * 0.96, s * 0.028, 0, 6.2832); c.fill();
    // 尾 + 脚
    c.fillStyle = '#e8dcc2';
    c.beginPath();
    c.moveTo(-s * 0.46, -s * 0.06); c.lineTo(-s * 0.76, -s * 0.20); c.lineTo(-s * 0.60, s * 0.04);
    c.closePath(); c.fill();
    c.strokeStyle = '#c96a2a';
    c.lineWidth = Math.max(1.5, s * 0.05);
    c.beginPath();
    c.moveTo(-s * 0.10, s * 0.24); c.lineTo(-s * 0.12, s * 0.36);
    c.moveTo(s * 0.12, s * 0.24); c.lineTo(s * 0.14, s * 0.36);
    c.stroke();
    c.restore();
  }

  // 脏污 / 划痕 / 曝光颗粒（静态烘焙）
  function drawGrime(c, w, h){
    _seed = 991;
    c.clearRect(0, 0, w, h);
    // 颗粒
    c.globalAlpha = 0.5;
    for(var i = 0; i < 900; i++){
      var gx = rnd() * w, gy = rnd() * h;
      var gs = rnd() * 1.8 + 0.4;
      c.fillStyle = rnd() < 0.5 ? 'rgba(255,236,205,0.10)' : 'rgba(20,10,6,0.16)';
      c.fillRect(gx, gy, gs, gs);
    }
    c.globalAlpha = 1;
    // 划痕
    for(var j = 0; j < 26; j++){
      var sx = rnd() * w, sy = rnd() * h * 0.7;
      var len = h * (0.06 + rnd() * 0.22);
      var ang = -1.35 + rnd() * 0.7;
      c.strokeStyle = rnd() < 0.55 ? 'rgba(255,228,190,0.07)' : 'rgba(16,8,5,0.16)';
      c.lineWidth = rnd() < 0.8 ? 1 : 2;
      c.beginPath();
      c.moveTo(sx, sy);
      c.lineTo(sx + Math.cos(ang) * len, sy + Math.sin(ang) * len);
      c.stroke();
    }
    // 暗角
    var vg = c.createRadialGradient(w * 0.5, h * 0.46, Math.min(w, h) * 0.30, w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
    vg.addColorStop(0, 'rgba(10,5,3,0)');
    vg.addColorStop(0.62, 'rgba(10,5,3,0.24)');
    vg.addColorStop(1, 'rgba(8,4,3,0.62)');
    c.fillStyle = vg;
    c.fillRect(0, 0, w, h);
  }

  function buildParticles(w, h){
    _seed = 5150;
    birds = [];
    var n = SC.portrait ? 5 : 8;
    for(var i = 0; i < n; i++){
      birds.push({
        x: rnd(), y: 0.10 + rnd() * 0.30,
        sp: 0.006 + rnd() * 0.010,
        sc: 0.5 + rnd() * 0.85,
        ph: rnd() * 6.28,
        drift: 0.12 + rnd() * 0.2
      });
    }
    motes = [];
    var mn = SC.portrait ? 26 : 46;
    for(var m = 0; m < mn; m++){
      motes.push({
        x: rnd(), y: rnd() * 0.85,
        r: 1 + rnd() * 2.6,
        ph: rnd() * 6.28,
        sp: 0.2 + rnd() * 0.8,
        hue: rnd()
      });
    }
    scraps = [];
    var sn = SC.portrait ? 9 : 14;
    for(var s = 0; s < sn; s++){
      scraps.push({
        x: rnd(), y: 0.08 + rnd() * 0.55,
        len: 0.05 + rnd() * 0.13,
        ph: rnd() * 6.28,
        sp: 0.22 + rnd() * 0.5,
        amp: 0.012 + rnd() * 0.03,
        tilt: -0.4 + rnd() * 0.8,
        c: rnd()
      });
    }
  }

  function buildScene(){
    var w = W, h = H;
    PR = clamp(window.devicePixelRatio || 1, 1, 1.6);
    canvasSize(skyCv, w * PR, h * PR);
    canvasSize(foreCv, w * PR, h * PR);
    // 颗粒/暗角不需要全分辨率，省一大笔每帧合成带宽
    canvasSize(grimeCv, w * Math.min(PR, 1), h * Math.min(PR, 1));
    skyC.setTransform(PR, 0, 0, PR, 0, 0);
    foreC.setTransform(PR, 0, 0, PR, 0, 0);
    grimeC.setTransform(PR, 0, 0, PR, 0, 0);
    GR = Math.min(PR, 1);
    grimeC.setTransform(GR, 0, 0, GR, 0, 0);
    SC.portrait = (w / h) < 0.95;
    SC.horns = [];
    SC.horizon = h * (SC.portrait ? 0.505 : 0.585);
    SC.deckY = h * (SC.portrait ? 0.760 : 0.775);
    SC.bandH = Math.min(h * 0.40, w * (SC.portrait ? 0.52 : 0.46));
    SC.sunX = w * (SC.portrait ? 0.315 : 0.335);
    SC.sunY = SC.horizon - h * 0.010;
    drawSky(skyC, w, h);
    drawSun(skyC, w, h);
    drawFarShore(skyC, w, h);
    // 水面底色（放在天空画布底部，逐帧动画只叠加微光）
    var wg = skyC.createLinearGradient(0, SC.horizon, 0, h);
    wg.addColorStop(0, '#c98a3c');
    wg.addColorStop(0.10, '#8e5722');
    wg.addColorStop(0.34, '#4b2a16');
    wg.addColorStop(0.72, '#24140d');
    wg.addColorStop(1, '#150c08');
    skyC.fillStyle = wg;
    skyC.fillRect(0, SC.horizon, w, h - SC.horizon);
    drawFore(foreC, w, h);
    drawGrime(grimeC, w, h);
    buildParticles(w, h);
    // 每一拍在铜管口亮一次（位置在预渲染时就固定）
    for(var q = 0; q < SC.horns.length; q++){
      var hn = SC.horns[q];
      hn.g = ctx.createRadialGradient(hn.x, hn.y, 0, hn.x, hn.y, hn.r);
      hn.g.addColorStop(0, 'rgba(255,244,206,0.92)');
      hn.g.addColorStop(0.30, 'rgba(255,198,110,0.46)');
      hn.g.addColorStop(1, 'rgba(255,140,50,0)');
    }
    // 缓存渐变对象（每帧不再创建）
    var sx = SC.sunX, sy = SC.sunY;
    waterGrad = ctx.createLinearGradient(0, SC.horizon, 0, h);
    waterGrad.addColorStop(0, 'rgba(226,160,80,0.30)');
    waterGrad.addColorStop(0.25, 'rgba(120,70,32,0.16)');
    waterGrad.addColorStop(0.7, 'rgba(30,17,12,0.20)');
    waterGrad.addColorStop(1, 'rgba(14,8,6,0.30)');
    scrimGrad = ctx.createLinearGradient(0, h * 0.50, 0, h);
    scrimGrad.addColorStop(0, 'rgba(16,9,5,0)');
    scrimGrad.addColorStop(0.55, 'rgba(16,9,5,0.34)');
    scrimGrad.addColorStop(1, 'rgba(12,6,4,0.78)');
    haloGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(w, h) * 0.55);
    haloGrad.addColorStop(0, 'rgba(255,226,168,0.30)');
    haloGrad.addColorStop(0.45, 'rgba(240,150,60,0.10)');
    haloGrad.addColorStop(1, 'rgba(240,120,40,0)');
    beatGrad = ctx.createRadialGradient(w * 0.52, h * 0.62, 0, w * 0.52, h * 0.62, Math.max(w, h) * 0.75);
    beatGrad.addColorStop(0, 'rgba(255,186,96,0.22)');
    beatGrad.addColorStop(1, 'rgba(255,120,40,0)');
  }

  function drawWater(dt){
    var hz = SC.horizon;
    waterT += (RM ? 0.20 : 1) * dt * 0.001;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, hz, W, H - hz);
    ctx.clip();
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, hz, W, H - hz);
    var sx = SC.sunX;
    var depth = Math.min(H - hz, H * 0.30);
    // 阳光碎金
    for(var i = 0; i < 26; i++){
      var f = i / 26;
      var yy = hz + Math.pow(f, 1.35) * depth + 2;
      var ww = (0.02 + f * 0.10) * W * (0.55 + 0.45 * Math.sin(waterT * 0.9 + i * 1.7));
      var ox = Math.sin(waterT * 0.7 + i * 0.85) * (4 + i * 2.2);
      ctx.globalAlpha = 0.5 * (1 - f * 0.72);
      ctx.fillStyle = (i % 3) ? 'rgba(255,208,130,1)' : 'rgba(255,240,200,1)';
      ctx.fillRect(sx + ox - ww * 0.5, yy, ww, Math.max(1, 2.6 - f * 1.6));
    }
    // 暗流
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = 'rgba(20,10,7,1)';
    for(var j = 0; j < 7; j++){
      var fy = hz + (0.08 + j * 0.055) * (H - hz);
      var fw = W * (0.20 + 0.10 * Math.sin(waterT * 0.35 + j));
      var fx = (W * 0.5) + Math.sin(waterT * 0.5 + j * 1.3) * W * 0.25 - fw * 0.5;
      ctx.fillRect(fx, fy, fw, 2 + j * 0.8);
    }
    ctx.restore();
  }

  function drawBirds(dt, tm){
    for(var i = 0; i < birds.length; i++){
      var b = birds[i];
      b.x += b.sp * dt * 0.001;
      if(b.x > 1.15) b.x = -0.15;
      var bx = b.x * W;
      var by = (b.y + Math.sin(tm * 0.0004 + b.ph) * 0.012) * H;
      var s = (8 + b.sc * 12) * Math.min(1, W / 1100 + 0.35);
      var beat = Math.sin(tm * 0.006 * b.drift + b.ph);
      ctx.strokeStyle = 'rgba(28,15,12,0.72)';
      ctx.lineWidth = Math.max(1.2, s * 0.14);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx - s, by + beat * s * 0.34);
      ctx.quadraticCurveTo(bx - s * 0.4, by - s * 0.30 * beat, bx, by);
      ctx.quadraticCurveTo(bx + s * 0.4, by - s * 0.30 * beat, bx + s, by + beat * s * 0.34);
      ctx.stroke();
    }
  }

  function drawMotes(tm){
    for(var i = 0; i < motes.length; i++){
      var m = motes[i];
      var yy = ((m.y + tm * 0.000012 * m.sp) % 1);
      var yy2 = 1 - yy;
      var x = (m.x + Math.sin(tm * 0.0005 * m.sp + m.ph) * 0.03) * W;
      var y = (0.06 + yy2 * 0.72) * H;
      ctx.globalAlpha = 0.16 + 0.30 * Math.abs(Math.sin(tm * 0.0008 + m.ph));
      ctx.fillStyle = m.hue < 0.6 ? 'rgba(255,214,150,1)' : 'rgba(214,180,120,1)';
      ctx.beginPath(); ctx.arc(x, y, m.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawScraps(tm){
    for(var i = 0; i < scraps.length; i++){
      var s = scraps[i];
      var f = (s.x + tm * 0.000010 * s.sp) % 1;
      var x = f * W;
      var y = (s.y + Math.sin(tm * 0.0006 * s.sp + s.ph) * s.amp) * H;
      var len = s.len * Math.min(W, H * 1.4);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(s.tilt + Math.sin(tm * 0.0009 + s.ph) * 0.22);
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = s.c < 0.45 ? 'rgba(198,54,42,0.95)' : (s.c < 0.75 ? 'rgba(238,196,120,0.9)' : 'rgba(246,236,214,0.85)');
      ctx.lineWidth = 2 + s.sp * 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(len * 0.5, -len * 0.22, len, len * 0.10 * Math.sin(tm * 0.001 + s.ph));
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ============================================================
  var beatPulse = 0, bassPulse = 0, midPulse = 0, treblePulse = 0, shock = 0, bpmNow = 0;

  function paint(dt, tm){
    // 脉冲衰减（与帧率无关的近似）
    beatPulse *= 1 - Math.min(0.9, dt * 0.0075);
    shock *= 1 - Math.min(0.9, dt * 0.0022);
    if(beatPulse < 0.001) beatPulse = 0;
    if(shock < 0.001) shock = 0;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    // 轻微的手持镜头漂移 + 浮筏摇摆
    var shake = RM ? 0.35 : 1;
    var sway = RM ? 0.25 : 1;
    var dx = Math.sin(tm * 0.00035) * 2.2 * shake + Math.sin(tm * 0.00019 + 1.1) * 6 * sway;
    var dy = Math.cos(tm * 0.00027) * 1.6 * shake + Math.sin(tm * 0.00023) * 4 * sway;
    var rot = Math.sin(tm * 0.00017 + 0.4) * 0.0042 * sway;
    ctx.save();
    ctx.translate(W * 0.5, H * 0.55);
    ctx.rotate(rot);
    ctx.scale(1.02, 1.02);
    ctx.translate(-W * 0.5, -H * 0.55);
    ctx.translate(dx, dy * 0.5);
    // 整幅随低音轻轻压一下（鼓点呼吸的骨架）
    if(!RM && bassPulse > 0.01){
      var zoom = 1 + bassPulse * 0.008;
      ctx.translate(W * 0.5, H * 0.62);
      ctx.scale(zoom, zoom);
      ctx.translate(-W * 0.5, -H * 0.62);
    }
    ctx.drawImage(skyCv, 0, 0, W, H);
    drawWater(dt);
    drawBirds(dt, tm);
    drawMotes(tm);
    ctx.drawImage(foreCv, 0, 0, W, H);
    drawScraps(tm);
    // 鼓点呼吸
    if(beatPulse > 0.001){
      ctx.globalAlpha = Math.min(0.85, beatPulse);
      ctx.fillStyle = beatGrad;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(grimeCv, 0, 0, W, H);
    ctx.restore();
    // 歌词区的压暗（保证字永远压得住）
    if(scrimGrad){
      ctx.fillStyle = scrimGrad;
      ctx.fillRect(0, H * 0.50, W, H * 0.50);
    }
    // 极轻的整体色温（source-over 暖雾，比 overlay 便宜得多）
    ctx.globalAlpha = 0.06 + bassPulse * 0.10;
    ctx.fillStyle = 'rgba(255,150,60,1)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // 铜管冲击环：每拍扩散一次，只在近景（低像素成本）
    if(shock > 0.01){
      var cx = SC.sunX, cy = SC.horizon;
      var rr2 = (1 - shock) * Math.max(W, H) * 0.62 + Math.min(W, H) * 0.05;
      ctx.strokeStyle = 'rgba(255,206,132,' + (shock * 0.30).toFixed(3) + ')';
      ctx.lineWidth = 2 + shock * 5;
      ctx.beginPath();
      ctx.arc(cx, cy, rr2, 0, 6.2832);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,146,58,' + (shock * 0.18).toFixed(3) + ')';
      ctx.lineWidth = 1 + shock * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, rr2 * 0.72, 0, 6.2832);
      ctx.stroke();
    }
    // 铜管口在鼓点上起火
    if(beatPulse > 0.02 && SC.horns.length){
      ctx.globalCompositeOperation = 'lighter';
      var flare = Math.min(1, beatPulse * 0.95 + midPulse * 0.18);
      for(var q = 0; q < SC.horns.length; q++){
        var hn = SC.horns[q];
        if(!hn.g) continue;
        var rr3 = hn.r * (0.75 + beatPulse * 0.9 + treblePulse * 0.25);
        ctx.globalAlpha = flare;
        ctx.fillStyle = hn.g;
        ctx.beginPath();
        ctx.arc(hn.x, hn.y, rr3, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    // 播放暂停：画面褪成旧照片
    if(!S.playing){
      ctx.globalAlpha = 0.20;
      ctx.fillStyle = 'rgba(14,8,6,1)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function onTick(p){
    try{
      p = p || {};
      var t = Number(p.time);
      if(isFinite(t) && t >= 0) S.t = t;
      if(typeof p.playing === 'boolean') S.playing = p.playing;
      if(!S.lines.length){
        S.idx = -1; S.text = '';
        if(lyr.idx !== -3) showEmpty();
        return;
      }
      var ci = findIdx(S.t);
      S.idx = ci;
      S.text = ci >= 0 && S.lines[ci] ? String(S.lines[ci].text || '') : '';
      if(ci !== lyr.idx) setLine(ci);
      paintChars(false);
    }catch(e){ S.err = String(e && e.message || e); console.error('[tick]', e); }
  }

  function onBeat(p){
    try{
      p = p || {};
      var lv = Number(p.level);
      if(!isFinite(lv)) lv = 0.5;
      lv = clamp(lv, 0, 1);
      beatPulse = Math.max(beatPulse, 0.16 + lv * 0.42);
      // 让乐手"吹一口"：环形冲击
      shock = Math.max(shock, 0.55 + lv * 0.45);
    }catch(e){ S.err = String(e && e.message || e); console.error('[beat]', e); }
  }

  function onLive(p){
    try{
      p = p || {};
      var b = Number(p.bass), m = Number(p.mid), t = Number(p.treble);
      if(isFinite(b)) bassPulse = clamp(b, 0, 1);
      if(isFinite(m)) midPulse = clamp(m, 0, 1);
      if(isFinite(t)) treblePulse = clamp(t, 0, 1);
      var bpm = Number(p.bpm);
      if(isFinite(bpm) && bpm > 20 && bpm < 300) bpmNow = bpm;
      if(typeof p.playing === 'boolean') S.playing = p.playing;
    }catch(e){ S.err = String(e && e.message || e); console.error('[live]', e); }
  }

  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if(!d || d.__c100 !== 1) return;
    try{
      if(d.type === 'init') onInit(d.payload);
      else if(d.type === 'tick') onTick(d.payload);
      else if(d.type === 'beat') onBeat(d.payload);
      else if(d.type === 'live') onLive(d.payload);
    }catch(e){ S.err = String(e && e.message || e); console.error('[msg]', e); }
  }, false);

  // 尺寸变化用 rAF 合并，避免拖拽窗口时反复重建离屏图层
  var resizeQueued = false;
  function onResize(){
    if(resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(function(){
      resizeQueued = false;
      try{ size(); }catch(e){ console.error('[resize]', e); }
    });
  }
  window.addEventListener('resize', onResize, false);
  window.addEventListener('orientationchange', onResize, false);

  size();

  var readySent = false;
  function sendReady(){
    if(readySent) return;
    readySent = true;
    try{ parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch(e){ console.error('[ready]', e); }
  }

  var last = 0;
  function frame(ts){
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    try{
      var dt = last ? Math.min(80, ts - last) : 16;
      last = ts;
      S.frames++;
      paint(dt, ts);
    }catch(e){ S.err = String(e && e.message || e); console.error('[frame]', e); }
    S.js = +(((window.performance && performance.now) ? performance.now() : Date.now()) - t0).toFixed(3);
    if(!readySent) sendReady();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(ts){
    sendReady();
    frame(ts);
  });
  setTimeout(sendReady, 700);
})();
</script>
</body>
</html>
