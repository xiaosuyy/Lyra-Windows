<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>400 · 机械灵歌</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04060e;overflow:hidden}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;overflow:hidden;background:#04060e}
  #field{position:absolute;inset:0;width:100%;height:100%;display:block}
  .veil{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 78% 68% at 50% 46%,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%)}
  .scan{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.55;background:repeating-linear-gradient(180deg,rgba(0,0,0,.24) 0 1px,rgba(0,0,0,0) 1px 3px)}
  .lyrics{position:absolute;left:0;right:0;top:62%;padding:0 6vw 1.4em;text-align:center;pointer-events:none;z-index:5;transition:opacity .45s linear;background:radial-gradient(ellipse 56% 132% at 50% 52%,rgba(2,6,13,.80) 0%,rgba(2,6,13,.60) 40%,rgba(2,6,13,0) 76%)}
  .ln{margin:0 auto;max-width:min(92vw,1180px);overflow-wrap:anywhere;word-break:break-word}
  .ln.prev,.ln.next{font-size:clamp(11px,1.15vw,17px);letter-spacing:.06em;color:rgba(158,206,230,.36);min-height:1.45em}
  .ln.prev{margin-bottom:.5em}
  .ln.next{margin-top:.55em}
  .ln.cur{font-size:clamp(21px,3.05vw,50px);font-weight:800;line-height:1.26;letter-spacing:.03em;color:#fff6e9}
  .ch{transition:color .2s linear,text-shadow .2s linear;color:rgba(182,224,242,.32)}
  .ch.on{color:#fffaf0;text-shadow:-1px 0 rgba(255,72,214,.45),1px 0 rgba(92,236,255,.5),0 0 15px rgba(96,236,255,.42),0 0 32px rgba(255,64,214,.16)}
  .hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:14px;padding:clamp(14px,2.4vh,26px) clamp(16px,3vw,40px);z-index:6;pointer-events:none;font-size:clamp(9px,.78vw,11px);letter-spacing:.28em;color:rgba(150,210,235,.55);text-transform:uppercase}
  .hud span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud span:first-child{max-width:62%}
  .hud b{font-weight:600;color:rgba(210,245,255,.8)}
  .bar{position:relative;margin:1.15em auto 0;width:min(30vw,240px);height:2px;background:rgba(120,200,230,.14);overflow:hidden}
  .bar i{position:absolute;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,rgba(96,236,255,.05),#8ff2ff);box-shadow:0 0 12px rgba(96,236,255,.85)}
  .empty{position:absolute;left:0;right:0;top:59.5%;text-align:center;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s linear;padding:0 8vw 2em;background:radial-gradient(ellipse 46% 120% at 50% 50%,rgba(2,6,13,.74) 0%,rgba(2,6,13,.42) 44%,rgba(2,6,13,0) 76%)}
  .empty-t{font-size:clamp(17px,2.15vw,34px);font-weight:800;letter-spacing:.36em;text-indent:.36em;color:#eefbff;text-shadow:-1px 0 rgba(255,72,214,.5),1px 0 rgba(92,236,255,.55),0 0 26px rgba(92,236,255,.28)}
  .empty-r{width:min(34vw,200px);height:1px;margin:1.5em auto;background:linear-gradient(90deg,transparent,rgba(132,240,255,.45),transparent)}
  .empty-s{font-size:clamp(9px,.82vw,11px);letter-spacing:.42em;text-indent:.42em;color:rgba(150,205,232,.52)}
  @media (max-height:640px){
    .lyrics{top:55%}
    .ln.cur{font-size:clamp(18px,2.5vw,34px)}
    .ln.prev,.ln.next{font-size:clamp(10px,.95vw,14px)}
    .empty{top:50%}
    .hud{letter-spacing:.2em;padding:10px 16px}
  }
  @media (max-width:600px){
    .lyrics{top:58%;padding:0 7vw 1em}
    .ln.cur{font-size:clamp(20px,6.2vw,32px)}
    .ln.prev,.ln.next{font-size:clamp(11px,2.9vw,15px)}
    .empty{top:55%}
    .hud{font-size:9px;letter-spacing:.18em}
    .hud span:first-child{max-width:56%}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>
  <div class="veil"></div>
  <div class="scan"></div>
  <div class="hud"><span id="hudTitle"><b>—</b></span><span>DETROIT · 313</span></div>
  <div class="lyrics" id="lyrics">
    <div class="ln prev" id="lPrev"></div>
    <div class="ln cur" id="lCur"></div>
    <div class="ln next" id="lNext"></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>
  <div class="empty" id="empty">
    <div class="empty-t">纯器乐</div>
    <div class="empty-r"></div>
    <div class="empty-s">INSTRUMENTAL · 无歌词</div>
  </div>
</div>
<script>
(function(){
  'use strict';

  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '', rm: false };

  window.__stage = function(){
    return { lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
             frames: S.frames, js: S.js, err: S.err, text: S.text, gl: false, rm: S.rm };
  };

  var readySent = false;
  function sendReady(){
    if (readySent) { return; }
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[400] ready post failed', e); }
  }
  requestAnimationFrame(onFirstFrame);
  setTimeout(sendReady, 800);

  var booted = false, canvas = null, ctx = null;
  var view = { w: 1440, h: 900, dpr: 1, cx: 720, cy: 450, hy: 504, focal: 1035,
               camX: 0, camY: 1.15, camZ: -3.45, sp: 0, cp: 1, unit: 300,
               prismY: 1.75, armX: 3.0, yaw: 0 };
  var clock = { time: 0, at: 0, playing: true };
  var els = {};
  var bgCanvas = null, bgCtx = null, bgReady = false;
  var cosYaw = 1, sinYaw = 0;

  var PAL = { cyan: '92,236,255', ice: '176,228,255', mag: '255,72,214',
              gold: '255,198,124', deep: '44,124,196' };
  var accent = [255, 198, 124];
  var accentCss = '255,198,124';

  var kick = 0, bassS = 0.4, midS = 0.3, trebS = 0.2, liveLevel = 0.4;

  function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function onFirstFrame(ts){
    sendReady();
    try { boot(); } catch (e) { fail('boot', e); }
    loop(ts);
  }

  function boot(){
    if (booted) { return; }
    booted = true;
    canvas = document.getElementById('field');
    if (!canvas || typeof canvas.getContext !== 'function') { throw new Error('no canvas'); }
    ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) { throw new Error('no 2d context'); }
    els.cur = document.getElementById('lCur');
    els.prev = document.getElementById('lPrev');
    els.next = document.getElementById('lNext');
    els.title = document.getElementById('hudTitle');
    els.lyrics = document.getElementById('lyrics');
    els.empty = document.getElementById('empty');
    els.barFill = document.getElementById('barFill');
    try {
      S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { S.rm = false; }
    resize();
    window.addEventListener('resize', resize, false);
    window.addEventListener('orientationchange', resize, false);
  }

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) { w = 1440; h = 900; }
    view.w = Math.round(w); view.h = Math.round(h);
    view.dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    if (!canvas) { return; }
    canvas.width = Math.max(1, Math.round(view.w * view.dpr));
    canvas.height = Math.max(1, Math.round(view.h * view.dpr));
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    view.w = canvas.width / view.dpr; view.h = canvas.height / view.dpr;
    layout();
    bakeBackground();
    if (S.lines.length) { fitCurrent(); }
  }

  function clampByte(v){
    var n = Math.round(v);
    if (!isFinite(n)) { return 0; }
    return n < 0 ? 0 : (n > 255 ? 255 : n);
  }

  function rgbOf(arr){
    return clampByte(arr[0]) + ',' + clampByte(arr[1]) + ',' + clampByte(arr[2]);
  }

  function layout(){
    var w = view.w, h = view.h;
    var minDim = Math.min(w, h);
    if (!isFinite(minDim) || minDim <= 0) { minDim = 900; }
    view.cx = w * 0.5;
    view.cy = h * 0.5;
    view.hy = h * 0.555;
    view.focal = Math.max(120, minDim * 1.15);
    view.unit = view.focal / (-view.camZ);
    var pitch = Math.atan((view.hy - view.cy) / view.focal);
    view.sp = Math.sin(pitch);
    view.cp = Math.cos(pitch);
    view.prismY = worldYForScreen(0.345 * h, 0);
    view.armX = 0.97 * (w * 0.5) * (1.4 - view.camZ) / view.focal;
    if (!isFinite(view.armX) || view.armX <= 0.4) { view.armX = 2.6; }
  }

  function worldYForScreen(sy, z){
    var dz = z - view.camZ;
    var k = (view.cy - sy) / view.focal;
    var den = view.cp - k * view.sp;
    if (!isFinite(den) || Math.abs(den) < 1e-4) { return view.camY; }
    var yOff = dz * (view.sp + k * view.cp) / den;
    if (!isFinite(yOff)) { return view.camY; }
    return view.camY + yOff;
  }

  var P = { x: 0, y: 0, z: 0, s: 1 };

  function proj(x, y, z){
    var dx = x - view.camX, dy = y - view.camY, dz = z - view.camZ;
    var x1 = dx * cosYaw + dz * sinYaw;
    var z1 = -dx * sinYaw + dz * cosYaw;
    var y2 = dy * view.cp - z1 * view.sp;
    var z2 = dy * view.sp + z1 * view.cp;
    if (!(z2 > 0.25)) { return false; }
    var inv = view.focal / z2;
    if (!isFinite(inv)) { return false; }
    P.x = view.cx + x1 * inv;
    P.y = view.cy - y2 * inv;
    P.z = z2;
    P.s = inv;
    return true;
  }

  var buckets = new Map();

  function seg3(ax, ay, az, bx, by, bz, col, wid, alpha){
    if (!(alpha > 0.014)) { return; }
    if (!proj(ax, ay, az)) { return; }
    var x1 = P.x, y1 = P.y;
    if (!proj(bx, by, bz)) { return; }
    var x2 = P.x, y2 = P.y;
    var W = view.w, H = view.h;
    if (x1 < -80 && x2 < -80) { return; }
    if (x1 > W + 80 && x2 > W + 80) { return; }
    if (y1 < -80 && y2 < -80) { return; }
    if (y1 > H + 80 && y2 > H + 80) { return; }
    var aq = Math.round(alpha * 20) / 20;
    if (aq <= 0) { return; }
    if (aq > 1) { aq = 1; }
    var wq = Math.round(wid * 4) / 4;
    if (wq <= 0) { wq = 0.5; }
    var key = col + '|' + wq + '|' + aq;
    var b = buckets.get(key);
    if (!b) { b = { col: col, wid: wq, a: aq, pts: [] }; buckets.set(key, b); }
    b.pts.push(x1, y1, x2, y2);
  }

  function flushSegs(){
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    buckets.forEach(function(b){
      var p = b.pts;
      ctx.strokeStyle = 'rgb(' + b.col + ')';
      ctx.beginPath();
      for (var i = 0; i < p.length; i += 4) {
        ctx.moveTo(p[i], p[i + 1]);
        ctx.lineTo(p[i + 2], p[i + 3]);
      }
      if (b.a >= 0.3) {
        ctx.globalAlpha = b.a * 0.15;
        ctx.lineWidth = b.wid * 3.8;
        ctx.stroke();
      }
      ctx.globalAlpha = b.a;
      ctx.lineWidth = b.wid;
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
    buckets.clear();
  }

  var lastErrAt = -4000;

  function fail(where, e){
    S.err = where + ': ' + (e && e.message ? e.message : String(e));
    var t = now();
    if (t - lastErrAt < 1000) { return; }
    lastErrAt = t;
    try { console.error('[400] ' + where, e); } catch (ignored) { /* console unavailable */ }
  }

  function onMessage(ev){
    var d = ev && ev.data;
    if (!d || typeof d !== 'object' || d.__c100 !== 1) { return; }
    try {
      if (d.type === 'init') { applyInit(d.payload || {}); }
      else if (d.type === 'tick') { applyTick(d.payload || {}); }
      else if (d.type === 'beat') { applyBeat(d.payload || {}); }
      else if (d.type === 'live') { applyLive(d.payload || {}); }
    } catch (e) { fail('message:' + d.type, e); }
  }
  window.addEventListener('message', onMessage, false);

  function applyInit(p){
    S.err = '';
    if (!booted) { try { boot(); } catch (e) { fail('boot', e); } }
    var list = Array.isArray(p.lines) ? p.lines : [];
    var out = [], i, n = Math.min(list.length, 400);
    for (i = 0; i < n; i += 1) {
      var L = list[i];
      if (!L || typeof L !== 'object') { continue; }
      var txt = (typeof L.text === 'string') ? L.text : (L.text == null ? '' : String(L.text));
      var t0 = Number(L.t), dur = Number(L.dur);
      var chars = null;
      if (Array.isArray(L.chars) && L.chars.length) {
        chars = [];
        var cn = Math.min(L.chars.length, 600), j;
        for (j = 0; j < cn; j += 1) {
          var c = L.chars[j];
          var ct = Number(c && c.t);
          chars.push({ c: c && typeof c.c === 'string' ? c.c : '', t: isFinite(ct) ? ct : NaN });
        }
      }
      out.push({ t: isFinite(t0) ? t0 : 0, dur: isFinite(dur) && dur > 0 ? dur : 0,
                 text: txt, chars: chars });
    }
    S.lines = out;
    S.idx = -2;
    S.text = '';
    if (typeof p.playing === 'boolean') { clock.playing = p.playing; }
    else { clock.playing = true; }
    S.playing = clock.playing;
    clock.at = now();
    accent = normalizeAccent(p.accent);
    accentCss = rgbOf(accent);
    var song = (p && p.song) || {};
    var name = (song.name == null || song.name === '') ? '' : String(song.name);
    var artists = song.artists;
    var artistStr = '';
    if (Array.isArray(artists)) { artistStr = artists.filter(function(x){ return !!x; }).join(' / '); }
    else if (artists != null && artists !== '') { artistStr = String(artists); }
    var label = name || '未知曲目';
    if (artistStr) { label += '  ·  ' + artistStr; }
    if (label.length > 64) { label = label.slice(0, 63) + '…'; }
    if (els.title) { els.title.textContent = label; }
    if (els.prev) { els.prev.textContent = ''; }
    if (els.cur) { els.cur.textContent = ''; }
    if (els.next) { els.next.textContent = ''; }
    if (els.barFill) { els.barFill.style.width = '0%'; }
    lyric.spans = []; lyric.times = []; lyric.on = []; lyric.barW = -1;
    updateEmpty();
    if (bgReady || view.w > 0) { bakeBackground(); }
    try { renderLyrics(currentTime()); } catch (e) { fail('init:render', e); }
  }

  function normalizeAccent(v){
    var out = [255, 198, 124];
    if (!v || typeof v.length !== 'number' || v.length < 3) { return out; }
    var r = Number(v[0]), g = Number(v[1]), b = Number(v[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) { return out; }
    r = clampByte(r); g = clampByte(g); b = clampByte(b);
    var lum = r * 0.299 + g * 0.587 + b * 0.114;
    if (lum < 48) {
      r = clampByte(r * 1.7 + 34); g = clampByte(g * 1.45 + 20); b = clampByte(b * 1.2 + 10);
    } else if (lum > 232) {
      r = clampByte(r * 0.84); g = clampByte(g * 0.84); b = clampByte(b * 0.84);
    }
    return [r, g, b];
  }

  var lyric = { spans: [], times: [], on: [], dur: 3, barW: -1 };

  function buildSpans(el, text){
    var spans = [];
    if (!el) { return spans; }
    el.textContent = '';
    if (!text) { return spans; }
    var chars = Array.from(text);
    var n = Math.min(chars.length, 220);
    var frag = document.createDocumentFragment();
    var i, sp;
    for (i = 0; i < n; i += 1) {
      sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = chars[i];
      frag.appendChild(sp);
      spans.push(sp);
    }
    if (chars.length > n) {
      sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = '…';
      frag.appendChild(sp);
      spans.push(sp);
    }
    el.appendChild(frag);
    return spans;
  }

  function buildTiming(line, next){
    var chars = Array.from(line.text);
    var total = chars.length;
    var dur = line.dur;
    if (!(dur > 0)) {
      var gap = next && next.t > line.t ? next.t - line.t : 0;
      dur = gap > 0.45 ? gap : Math.min(6, Math.max(1.3, total * 0.24));
    }
    var times = [], i, ct;
    if (line.chars && line.chars.length === total && total > 0) {
      for (i = 0; i < total; i += 1) {
        ct = line.chars[i].t;
        times.push(isFinite(ct) ? ct : line.t + dur * (i / total));
      }
    } else {
      for (i = 0; i < total; i += 1) {
        times.push(line.t + dur * (i / Math.max(1, total)));
      }
    }
    return { times: times, dur: dur };
  }

  function findIdx(t){
    var i, last = -1;
    for (i = 0; i < S.lines.length; i += 1) {
      if (S.lines[i].t <= t + 0.001) { last = i; } else { break; }
    }
    return last;
  }

  function setIdx(idx){
    S.idx = idx;
    var L = idx >= 0 ? S.lines[idx] : null;
    var prev = idx > 0 ? S.lines[idx - 1] : null;
    var next = null;
    if (idx + 1 < S.lines.length) { next = S.lines[idx + 1]; }
    else if (idx < 0 && S.lines.length) { next = S.lines[0]; }
    buildSpans(els.prev, prev ? prev.text : '');
    lyric.spans = buildSpans(els.cur, L ? L.text : '');
    buildSpans(els.next, next ? next.text : '');
    var tm = L ? buildTiming(L, next) : { times: [], dur: 3 };
    lyric.times = tm.times;
    lyric.dur = tm.dur;
    lyric.on = [];
    var i;
    for (i = 0; i < lyric.spans.length; i += 1) { lyric.on.push(false); }
    lyric.barW = -1;
    fitCurrent();
  }

  function paintChars(t){
    var spans = lyric.spans, times = lyric.times, on = lyric.on;
    var n = spans.length, i, want;
    for (i = 0; i < n; i += 1) {
      want = t >= times[i] - 0.02;
      if (on[i] !== want) {
        on[i] = want;
        spans[i].className = want ? 'ch on' : 'ch';
      }
    }
  }

  function updateBar(t){
    var L = S.idx >= 0 && S.idx < S.lines.length ? S.lines[S.idx] : null;
    if (!L || !els.barFill) { return; }
    var p = (t - L.t) / Math.max(0.45, lyric.dur);
    if (!isFinite(p)) { p = 0; }
    p = p < 0 ? 0 : (p > 1 ? 1 : p);
    var q = Math.round(p * 90) / 90;
    if (q === lyric.barW) { return; }
    lyric.barW = q;
    els.barFill.style.width = (q * 100).toFixed(2) + '%';
  }

  function fitCurrent(){
    var el = els.cur;
    if (!el) { return; }
    el.style.fontSize = '';
    if (!el.textContent) { return; }
    var cs = window.getComputedStyle(el);
    var base = parseFloat(cs.fontSize);
    if (!isFinite(base) || base <= 0) { return; }
    var limit = base * 1.26 * 2.1;
    var size = base, i;
    for (i = 0; i < 9; i += 1) {
      if (el.offsetHeight <= limit) { break; }
      size *= 0.9;
      el.style.fontSize = size.toFixed(1) + 'px';
      if (size < 11) { break; }
    }
  }

  function updateEmpty(){
    var has = S.lines.length > 0;
    if (els.lyrics) { els.lyrics.style.opacity = has ? '1' : '0'; }
    if (els.empty) { els.empty.style.opacity = has ? '0' : '1'; }
  }

  function renderLyrics(t){
    if (!S.lines.length) {
      S.idx = -1;
      S.text = '';
      return;
    }
    var idx = findIdx(t);
    if (idx !== S.idx) { setIdx(idx); }
    var L = idx >= 0 ? S.lines[idx] : null;
    S.text = L ? L.text : '';
    paintChars(t);
    updateBar(t);
  }

  function applyTick(p){
    var t = Number(p && p.time);
    if (!isFinite(t)) { return; }
    clock.time = t;
    clock.at = now();
    if (p && typeof p.playing === 'boolean') { clock.playing = p.playing; }
    S.playing = clock.playing;
  }

  function currentTime(){
    if (!clock.playing) { return clock.time; }
    var el = (now() - clock.at) / 1000;
    if (!isFinite(el) || el < 0) { el = 0; }
    if (el > 0.14) { el = 0.14; }
    return clock.time + el;
  }

  var lastFrameAt = 0;

  function loop(ts){
    requestAnimationFrame(loop);
    var t0 = now();
    S.frames += 1;
    try {
      if ((S.frames & 31) === 0) {
        if (Math.abs((window.innerWidth || 0) - view.w) > 1 ||
            Math.abs((window.innerHeight || 0) - view.h) > 1) { resize(); }
      }
      var realDt = lastFrameAt ? (t0 - lastFrameAt) / 1000 : 0.016;
      lastFrameAt = t0;

    var w = view.w, h = view.h;
    var n = 32, i;
    var pad = Math.max(18, w * 0.055);
    var totalW = w - pad * 2;
    if (!(totalW > 10)) { return; }
    var cw = totalW / n;
    var y = h - Math.max(15, h * 0.032);
    var stepNow = Math.floor((t * 7.4)) % n;
    if (stepNow < 0) { stepNow += n; }
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < n; i += 1) {
      var x = pad + i * cw;
      var isNow = i === stepNow;
      var isMark = i % 4 === 0;
      var hgt = isMark ? 8 : 5;
      if (isNow) { hgt += 4 + kick * 4; }
      ctx.fillStyle = isNow ? 'rgba(' + accentCss + ',0.72)'
        : (isMark ? 'rgba(' + PAL.cyan + ',0.22)' : 'rgba(' + PAL.cyan + ',0.10)');
      ctx.fillRect(x, y - hgt, Math.max(1, cw - 2.2), hgt);
    }
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = 'rgb(' + PAL.cyan + ')';
    ctx.fillRect(pad, y + 1, totalW, 1);
    ctx.globalAlpha = 1;
  }

  function drawCoreGlow(t){
    if (!proj(0, view.prismY, 0)) { return; }
    var cx = P.x, cy = P.y;
    var rad = Math.max(70, 0.72 * view.unit * (1.55 + kick * 0.5));
    var a = 0.13 + bassS * 0.13 + kick * 0.15;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    addStop(g, 0, 'rgba(' + accentCss + ',' + a.toFixed(3) + ')');
    addStop(g, 0.34, 'rgba(' + accentCss + ',' + (a * 0.36).toFixed(3) + ')');
    addStop(g, 1, 'rgba(' + accentCss + ',0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }

  function draw(){
    if (!ctx || typeof ctx.beginPath !== 'function') { return; }
    var w = view.w, h = view.h;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (bgReady && bgCanvas && typeof bgCanvas.getContext === 'function' &&
        bgCanvas.width > 0 && bgCanvas.height > 0) {
      ctx.drawImage(bgCanvas, 0, 0, bgCanvas.width, bgCanvas.height);
    } else {
      ctx.fillStyle = '#04060e';
      ctx.fillRect(0, 0, w, h);
    }
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    var t = flow;
    drawHalo(t);
    drawWall(t);
    drawFloor(t);
    drawRipples(t);
    drawHorizonLine(t);
    drawPrism(t);
    drawArm(t, -1);
    drawArm(t, 1);
    drawBeam(t);
    flushSegs();
    drawCoreGlow(t);
    drawStrip(t);
  }
})();
</script>
