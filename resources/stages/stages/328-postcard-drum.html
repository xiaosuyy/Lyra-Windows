<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>328 · 明信片鼓</title>
<style>
  :root{
    --ink:#2b1f14; --paper:#efe3c6; --paper2:#f8f0db;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Songti SC","STSong",SimSun,"Noto Serif CJK SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1a1410}
  body{font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
  body{background:
      radial-gradient(120% 90% at 50% 12%, #33261d 0%, #1d1611 55%, #120d0a 100%)}
  .table{position:fixed;inset:0;pointer-events:none;
      background:repeating-linear-gradient(93deg,rgba(255,236,200,.035) 0 2px,transparent 2px 9px),
                 repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 5px)}

  #card{position:fixed;inset:2.2vmin;display:flex;flex-direction:column;padding:2.1vmin 2.1vmin 1.2vmin;
        background:linear-gradient(178deg,#f6eed7 0%,#efe3c6 42%,#e7d9b8 100%);
        box-shadow:0 3vmin 7vmin rgba(0,0,0,.6),0 .5vmin 1.4vmin rgba(0,0,0,.35),
                   0 0 0 1px rgba(43,31,20,.28) inset;
        transform:rotate(-.32deg);overflow:hidden}
  /* 纸纤维 / 旧渍 / 压痕 */
  #card::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
        background-image:url("assets/328-paper.jpg");
        background-size:cover;background-position:center;
        mix-blend-mode:multiply;opacity:.34;filter:grayscale(.55) contrast(1.05)}
  #card::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
        background:
          radial-gradient(38% 30% at 12% 8%,rgba(150,104,52,.30),transparent 70%),
          radial-gradient(30% 24% at 88% 92%,rgba(150,104,52,.26),transparent 70%),
          radial-gradient(22% 18% at 74% 12%,rgba(140,96,48,.18),transparent 72%),
          radial-gradient(130% 110% at 50% 50%,transparent 52%,rgba(90,62,34,.26) 100%);
        mix-blend-mode:multiply}

  /* 明信片印刷双线框（画布内已印，这里只留四角小括线） */
  .rule{display:none}

  #art{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;z-index:2;
       box-shadow:inset 0 0 0 1px rgba(43,31,20,.52),
                  inset 0 0 0 .55vmin #f7efdb,
                  inset 0 0 0 calc(.55vmin + 1px) rgba(43,31,20,.30),
                  inset 0 1.2vmin 2.6vmin rgba(78,52,28,.16)}
  #art::after{content:"";position:absolute;inset:0;pointer-events:none;
       background-image:url("assets/328-paper.jpg");background-size:cover;background-position:center;
       mix-blend-mode:multiply;opacity:.26;filter:grayscale(.75)}
  #cv{display:block;width:100%;height:100%}
  /* 纹理丢失时的程序化兜底：斜纹纸浆感 */
  .no-tex #card::before,.no-tex #art::after{
       background-image:
         repeating-linear-gradient(46deg,rgba(126,92,52,.13) 0 1px,transparent 1px 4px),
         repeating-linear-gradient(-43deg,rgba(126,92,52,.09) 0 1px,transparent 1px 5px);
       background-size:auto;opacity:.7;
       filter:none}

  #cap{position:relative;z-index:2;flex:0 0 auto;display:flex;flex-direction:column;
       padding:1.9vmin .6vmin .2vmin;text-align:center;min-height:0;max-height:42%}
  #head{font-size:clamp(8px,1.06vmin,13px);letter-spacing:.44em;text-transform:uppercase;
        color:rgba(64,46,28,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #head .orn{letter-spacing:0;margin:0 .9em;opacity:.85;color:var(--acc,#6b5133)}
  #headDate{margin-left:.9em;letter-spacing:.24em;opacity:.85}
  #strich{height:1px;margin:1vmin auto 1.5vmin;width:min(58%,40ch);
        background:linear-gradient(90deg,transparent,rgba(64,46,28,.55) 18%,rgba(64,46,28,.55) 82%,transparent);
        box-shadow:0 2px 0 -1px rgba(64,46,28,.22)}

  #lineWrap{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;
       min-height:0;padding:.4vmin 0;overflow:hidden}
  #lineWrap::before{content:"";position:absolute;inset:-1.6vmin -3vmin;pointer-events:none;
       background:radial-gradient(64% 150% at 50% 50%,rgba(253,248,236,.20),rgba(253,248,236,0) 100%);
       mix-blend-mode:normal}
  #line{position:relative;font-size:clamp(15px,3.4vmin,33px);line-height:1.42;letter-spacing:.055em;
        max-width:min(94%,46ch);word-break:break-word;overflow-wrap:anywhere;
        color:#241a10;
        text-shadow:0 0 .9px rgba(24,16,10,.55),0 1px 0 rgba(255,252,242,.9),0 -1px 0 rgba(255,252,242,.6);
        transition:letter-spacing .35s ease}
  #line .ch{opacity:.17;transition:opacity .22s linear}
  #line .ch.on{opacity:1}
  #line .ch.ink{text-shadow:0 0 .9px rgba(24,16,10,.6),0 1px 0 rgba(255,252,242,.95)}
  #line.none{font-size:clamp(12px,2.1vmin,19px);color:rgba(52,38,24,.62);letter-spacing:.24em;
        font-style:italic}
  #meta{margin-top:.6vmin;display:flex;align-items:center;justify-content:center;gap:1.6em;
        font-size:clamp(8px,1.02vmin,12.5px);letter-spacing:.3em;text-transform:uppercase;
        color:rgba(64,46,28,.63);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #meta b{font-weight:400;letter-spacing:.24em;color:rgba(64,46,28,.8)}
  #meta .dot{letter-spacing:0;opacity:.5}
</style>
</head>
<body>
<div class="table"></div>
<div id="card">
  <div id="art"><canvas id="cv"></canvas></div>
  <div id="cap">
    <div id="head">Carte Postale<span class="orn">❦</span><span id="headDate">Anno MCMVIII</span></div>
    <div id="strich"></div>
    <div id="lineWrap"><div id="line"></div></div>
    <div id="meta"><b id="mTitle">—</b><span class="dot">·</span><span id="mArtists">—</span></div>
  </div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var cv=$('cv'), ctx=cv.getContext('2d'), art=$('art'), lineEl=$('line');
  var S={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',text:'',rm:false,
         tAt:0,pulse:0,bass:0,level:0,mid:0,treble:0,bpm:0,duration:0,live:0,
         beats:0,title:'',artists:'',songId:'',covered:false,dirty:false};
  var readySent=false;
  function sendReady(){ if(readySent) return; readySent=true; try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){} }

  /* ============ 画布与版面 ============ */
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var W=1440,H=900,L=null;
  var sceneC=document.createElement('canvas'), sctx=sceneC.getContext('2d');
  var figC=document.createElement('canvas'), fctx=figC.getContext('2d');
  var noiseC=null;

  var INK='#2b1a0c';
  function ink(a){ return 'rgba(43,26,12,'+a+')'; }
  function mulberry32(a){
    return function(){
      a|=0; a=a+0x6D2B79F5|0;
      var t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function ln(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }

  function layout(w,h){
    var narrow = w < h*1.08;
    var fh = narrow ? Math.min(h*0.78, w*1.22) : Math.min(h*0.82, w*0.66);
    if(!isFinite(fh)||fh<=0) fh = Math.min(h,w)*0.7;
    var feetY = h*0.915;
    var topY = feetY-fh;
    var cx = narrow ? w*0.5 : w*0.415;
    var drumR = fh*0.176;
    var stampS = Math.max(26, Math.min(w*0.115, h*0.145));
    var o = {
      w:w,h:h,narrow:narrow,fh:fh,cx:cx,feetY:feetY,topY:topY,
      hz:h*0.55, seaBot:h*0.662,
      sy: topY+fh*0.445, hy: topY+fh*0.625, knee: topY+fh*0.775,
      sw: fh*0.113, ww: fh*0.079, hw: fh*0.094,
      drum:{x:cx, y: topY+drumR*1.07, r: drumR},
      stamp:{x: w-stampS*1.18-w*0.03, y: h*0.05+stampS*0.5, s: stampS},
      fallen: (!narrow && w>h*1.28) ? {x:cx+fh*0.60, y:feetY-fh*0.052, r:fh*0.098} : null
    };
    return o;
  }

  function buildNoise(){
    var n=128, c=document.createElement('canvas'); c.width=n; c.height=n;
    var g=c.getContext('2d'), rnd=mulberry32(20250328);
    g.fillStyle='#fff'; g.fillRect(0,0,n,n);
    for(var i=0;i<900;i++){
      var x=rnd()*n, y=rnd()*n, r=rnd()*0.9+0.25;
      g.fillStyle='rgba(60,44,28,'+(0.06+rnd()*0.30).toFixed(3)+')';
      g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
    }
    noiseC=c;
  }

  /* ---------- 静态背景：天/海/沙 + 蚀刻排线 ---------- */
  function drawScene(){
    var c=sctx, w=W, h=H, rnd=mulberry32(8891), i, j;
    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,w,h);
    var hz=L.hz, seaBot=L.seaBot;

    var g=c.createLinearGradient(0,0,0,hz);
    g.addColorStop(0,'#8d6f45'); g.addColorStop(.30,'#b1936a');
    g.addColorStop(.58,'#d3ba92'); g.addColorStop(.84,'#ecdcba'); g.addColorStop(1,'#f8ecd2');
    c.fillStyle=g; c.fillRect(0,0,w,hz);

    /* 天：少量长而深的蚀刻线（版画的天是线，不是网点） */
    c.save(); c.beginPath(); c.rect(0,0,w,hz); c.clip();
    var rows=Math.min(17,Math.round(hz/(h*0.040)));
    for(i=0;i<rows;i++){
      var t0=i/rows, y=hz*(0.03+0.76*t0);
      c.strokeStyle=ink(0.13+0.17*t0); c.lineWidth=1.05;
      var x=-rnd()*w*0.2;
      for(var k=0;k<6 && x<w;k++){
        var seg=w*(0.20+rnd()*0.36);
        ln(c,x,y,x+seg,y);
        x+=seg+w*(0.02+rnd()*0.07);
      }
    }
    /* 云带：几道横向软排线 */
    for(i=0;i<3;i++){
      var cy0=hz*(0.17+i*0.105), cw0=w*(0.30+rnd()*0.22), cx0=w*(0.06+rnd()*0.42);
      for(var q=0;q<3;q++){
        c.strokeStyle=ink(0.22-0.04*q); c.lineWidth=1.1;
        c.beginPath();
        c.moveTo(cx0,cy0+q*3.4);
        c.bezierCurveTo(cx0+cw0*0.32,cy0-5+q*3.4, cx0+cw0*0.68,cy0+5+q*3.4, cx0+cw0,cy0+q*3.4);
        c.stroke();
      }
    }
    c.restore();

    /* 近地平线的薄雾：横向拉长的浅色带 */
    var mz=c.createLinearGradient(0,hz-h*0.08,0,hz);
    mz.addColorStop(0,'rgba(250,240,216,0)');
    mz.addColorStop(1,'rgba(250,240,216,0.62)');
    c.fillStyle=mz; c.fillRect(0,hz-h*0.08,w,h*0.08);

    /* 天空顶部压深，让浅色的人物浮出来 */
    var tk=c.createLinearGradient(0,0,0,h*0.34);
    tk.addColorStop(0,'rgba(40,26,12,0.34)');
    tk.addColorStop(.55,'rgba(40,26,12,0.12)');
    tk.addColorStop(1,'rgba(40,26,12,0)');
    c.fillStyle=tk; c.fillRect(0,0,w,h*0.34);

    /* 蚀刻太阳 */
    var sx=w*0.775, sy=hz*0.30, sr=Math.min(h,w)*0.062;
    c.save();
    c.beginPath(); c.arc(sx,sy,sr,0,6.2832); c.fillStyle='rgba(248,238,212,.75)'; c.fill();
    c.strokeStyle=ink(0.30); c.lineWidth=1.1; c.beginPath(); c.arc(sx,sy,sr,0,6.2832); c.stroke();
    for(i=0;i<16;i++){
      var a=i*6.2832/16, r1=sr*1.14, r2=sr*(1.30+((i%2)?0.16:0.06));
      ln(c,sx+Math.cos(a)*r1,sy+Math.sin(a)*r1,sx+Math.cos(a)*r2,sy+Math.sin(a)*r2);
    }
    c.strokeStyle=ink(0.22);
    c.beginPath(); c.arc(sx,sy,sr*1.20,Math.PI*1.05,Math.PI*1.95); c.stroke();
    c.restore();

    /* 海：近地平线最深，往岸边提亮 */
    var g2=c.createLinearGradient(0,hz,0,seaBot);
    g2.addColorStop(0,'#8a6f4c'); g2.addColorStop(.14,'#a4885f');
    g2.addColorStop(.52,'#bfa67c'); g2.addColorStop(1,'#b1966c');
    c.fillStyle=g2; c.fillRect(0,hz,w,seaBot-hz);

    /* 近岸浅水 */
    var g4=c.createLinearGradient(0,seaBot,0,seaBot+(h-seaBot)*0.10);
    g4.addColorStop(0,'#dcc79e'); g4.addColorStop(1,'rgba(220,199,158,0)');
    c.fillStyle=g4; c.fillRect(0,seaBot,w,(h-seaBot)*0.12);

    /* 沙：远处亮、近处压深，用来收住画面下沿 */
    var g3=c.createLinearGradient(0,seaBot,0,h);
    g3.addColorStop(0,'#bd9f73'); g3.addColorStop(.10,'#dcc59a');
    g3.addColorStop(.55,'#e6d0a6'); g3.addColorStop(1,'#cdb184');
    c.fillStyle=g3; c.fillRect(0,seaBot,w,h-seaBot);

    /* 海平线：双线 + 下方阴影带 */
    c.strokeStyle=ink(0.62); c.lineWidth=1.4; ln(c,0,hz,w,hz);
    c.strokeStyle=ink(0.22); ln(c,0,hz+1.8,w,hz+1.8);
    var hb=c.createLinearGradient(0,hz,0,hz+h*0.05);
    hb.addColorStop(0,'rgba(58,43,28,0.22)');
    hb.addColorStop(1,'rgba(58,43,28,0)');
    c.fillStyle=hb; c.fillRect(0,hz,w,h*0.05);

    /* 浪线 */
    c.save(); c.beginPath(); c.rect(0,hz,w,seaBot-hz); c.clip();
    for(i=0;i<6;i++){
      var yy=hz+(seaBot-hz)*(0.12+i*0.15), sc=0.7+i*0.13;
      c.strokeStyle=ink(0.26+0.05*i); c.lineWidth=1.05;
      c.beginPath();
      for(j=0;j<=Math.round(w/30);j++){
        var px=j*30, py=yy+Math.sin(j*1.6+i)*1.6;
        if(j===0) c.moveTo(px,py); else c.lineTo(px,py);
      }
      c.stroke();
      c.strokeStyle=ink(0.34); c.lineWidth=1.2;
      for(j=0;j<Math.round(w/64);j++){
        var qx=(j*64+((i%2)*32))%(w+40), qw=22*sc;
        c.beginPath();
        c.moveTo(qx,yy+2); c.quadraticCurveTo(qx+qw*0.5,yy-3.2,qx+qw,yy+2);
        c.stroke();
      }
    }
    /* 阳光倒影 */
    c.strokeStyle=ink(0.20);
    for(i=0;i<10;i++){
      var ry=hz+6+i*(seaBot-hz)*0.09, rw=w*(0.05+0.02*i)+rnd()*w*0.02;
      ln(c,sx-rw/2,ry,sx+rw/2,ry);
    }
    c.restore();

    /* 远处帆船 */
    c.strokeStyle=ink(0.42); c.lineWidth=1;
    var bx=w*0.13, by=hz-2;
    c.beginPath(); c.moveTo(bx,by); c.lineTo(bx+2,by-13); c.lineTo(bx+9,by-6); c.closePath(); c.stroke();
    c.beginPath(); c.moveTo(bx-8,by); c.lineTo(bx+12,by); c.stroke();
    c.strokeStyle=ink(0.25); ln(c,bx-4,by-16,bx+6,by-16);

    /* 沙滩排线 + 点刻 */
    c.save(); c.beginPath(); c.rect(0,seaBot,w,h-seaBot); c.clip();
    c.lineWidth=1;
    for(i=0;i<7;i++){
      var yy2=seaBot+(h-seaBot)*(0.07+i*0.14);
      c.strokeStyle=ink(0.10+0.05*(1-i/7));
      var px2=-rnd()*w*0.2;
      for(j=0;j<40 && px2<w;j++){
        var seg2=w*(0.06+rnd()*0.15), py2=yy2+Math.sin(px2/w*6.0+i)*3.0;
        c.beginPath(); c.moveTo(px2,py2);
        c.quadraticCurveTo(px2+seg2*0.5,py2-2.6,px2+seg2,py2+1.4);
        c.stroke();
        px2+=seg2+w*(0.03+rnd()*0.12);
      }
    }
    c.fillStyle=ink(0.26);
    for(i=0;i<380;i++){
      var ddx=rnd()*w, ddy=seaBot+rnd()*(h-seaBot);
      c.fillRect(ddx,ddy,1+rnd()*0.9,0.8+rnd()*0.7);
    }
    c.restore();

    /* 近景草丛：收住画面两个下角 */
    function tuft(tx,ty,gh){
      for(var b=0;b<9;b++){
        var t2=(b-4)/4;
        var bx=tx+t2*gh*0.42;
        var hh=gh*(0.55+0.45*Math.cos(t2*1.5));
        c.strokeStyle=ink(0.34+0.26*Math.abs(t2));
        c.lineWidth=1.2;
        c.beginPath();
        c.moveTo(bx,ty);
        c.quadraticCurveTo(bx+t2*gh*0.30,ty-hh*0.62,bx+t2*gh*0.68,ty-hh);
        c.stroke();
      }
    }
    tuft(w*0.052,h*0.998,h*0.105);
    tuft(w*0.112,h*0.992,h*0.070);
    tuft(w*0.936,h*0.998,h*0.115);
    tuft(w*0.986,h*0.992,h*0.072);

    /* 画面下沿压实 */
    var fb=c.createLinearGradient(0,h*0.90,0,h);
    fb.addColorStop(0,'rgba(58,43,28,0)');
    fb.addColorStop(1,'rgba(58,43,28,0.26)');
    c.fillStyle=fb; c.fillRect(0,h*0.90,w,h*0.10);

    /* 远处更衣车（海滨浴场） */
    var bmw=Math.min(w*0.055,h*0.09);
    if(bmw>22){
      var bmx=w*0.095-bmw*0.5, bmy=seaBot+(h-seaBot)*0.06;
      c.save();
      c.fillStyle='rgba(238,226,198,0.62)';
      c.fillRect(bmx,bmy,bmw,bmw*0.76);
      c.strokeStyle=ink(0.34); c.lineWidth=1;
      c.strokeRect(bmx,bmy,bmw,bmw*0.76);
      c.beginPath();
      c.moveTo(bmx-bmw*0.07,bmy); c.lineTo(bmx+bmw*0.5,bmy-bmw*0.30); c.lineTo(bmx+bmw*1.07,bmy);
      c.stroke();
      c.strokeRect(bmx+bmw*0.30,bmy+bmw*0.13,bmw*0.40,bmw*0.28);
      c.beginPath(); c.arc(bmx+bmw*0.16,bmy+bmw*0.78,bmw*0.12,0,6.2832); c.stroke();
      c.beginPath(); c.arc(bmx+bmw*0.84,bmy+bmw*0.78,bmw*0.12,0,6.2832); c.stroke();
      ln(c,bmx+bmw*0.5,bmy-bmw*0.30,bmx+bmw*0.5,bmy-bmw*0.54);
      c.beginPath();
      c.moveTo(bmx+bmw*0.5,bmy-bmw*0.54); c.lineTo(bmx+bmw*0.72,bmy-bmw*0.47); c.lineTo(bmx+bmw*0.5,bmy-bmw*0.40);
      c.stroke();
      c.fillStyle='rgba(64,43,23,0.13)';
      c.beginPath(); c.ellipse(bmx+bmw*0.5,bmy+bmw*0.90,bmw*0.62,bmw*0.085,0,0,6.2832); c.fill();
      c.restore();
    }

    /* 海鸥 */
    c.strokeStyle=ink(0.34); c.lineWidth=1;
    for(i=0;i<4;i++){
      var gx=w*(0.18+i*0.13), gy=hz*(0.16+i*0.055), gw=Math.min(9,h*0.014);
      c.beginPath();
      c.moveTo(gx-gw,gy); c.quadraticCurveTo(gx-gw*0.45,gy-gw*0.55,gx,gy-gw*0.06);
      c.quadraticCurveTo(gx+gw*0.45,gy-gw*0.55,gx+gw,gy);
      c.stroke();
    }

    /* 四角污渍 / 边缘旧痕 */
    for(i=0;i<10;i++){
      var fx=rnd()*w, fy=rnd()*h, fr=Math.min(w,h)*(0.03+rnd()*0.12);
      var fg=c.createRadialGradient(fx,fy,0,fx,fy,fr);
      fg.addColorStop(0,'rgba(146,100,48,0.19)'); fg.addColorStop(1,'rgba(146,100,48,0)');
      c.fillStyle=fg; c.beginPath(); c.arc(fx,fy,fr,0,6.2832); c.fill();
    }
    var vg=c.createRadialGradient(w*0.5,h*0.46,Math.min(w,h)*0.26,w*0.5,h*0.5,Math.max(w,h)*0.80);
    vg.addColorStop(0,'rgba(52,34,16,0)'); vg.addColorStop(.62,'rgba(52,34,16,0.14)');
    vg.addColorStop(1,'rgba(52,34,16,0.46)');
    c.fillStyle=vg; c.fillRect(0,0,w,h);
  }

  /* ---------- 鼓（正面对准观者，绳索张力圈） ---------- */
  function drumShape(c,x,y,r,lw){
    var i;
    /* 木壳：只比皮面厚一点点，别画成球 */
    c.beginPath(); c.arc(x,y,r*1.072,0,6.2832);
    c.fillStyle='#b98f5c'; c.fill();
    c.save(); c.clip();
    c.strokeStyle=ink(0.34); c.lineWidth=Math.max(0.6,lw*0.6);
    for(i=-14;i<=14;i++){ var xx=x+i*r*0.092; ln(c,xx-r*0.30,y-r*1.3,xx+r*0.30,y+r*1.3); }
    c.restore();

    /* 绳索 V 形张力圈（少而粗，读得出是锯齿） */
    var n=14, r1=r*1.062, r0=r*0.999;
    c.beginPath();
    for(i=0;i<n;i++){
      var a1=i*6.2832/n, a2=(i+0.5)*6.2832/n, a3=(i+1)*6.2832/n;
      c.moveTo(x+Math.cos(a1)*r1, y+Math.sin(a1)*r1);
      c.lineTo(x+Math.cos(a2)*r0, y+Math.sin(a2)*r0);
      c.lineTo(x+Math.cos(a3)*r1, y+Math.sin(a3)*r1);
    }
    c.strokeStyle='rgba(38,25,13,0.86)'; c.lineWidth=Math.max(0.9,lw*1.05); c.stroke();
    c.beginPath(); c.arc(x,y,r*1.072,0,6.2832);
    c.strokeStyle=ink(0.50); c.lineWidth=Math.max(0.7,lw*0.9); c.stroke();

    /* 鼓皮 */
    c.beginPath(); c.arc(x,y,r*0.995,0,6.2832);
    var hg=c.createLinearGradient(x-r*0.75,y-r*0.75,x+r*0.75,y+r*0.75);
    hg.addColorStop(0,'#fffdf6'); hg.addColorStop(.50,'#f9f1dd'); hg.addColorStop(1,'#ddc9a2');
    c.fillStyle=hg; c.fill();

    /* 皮面：右下整体阴影 + 三道淡横纹 */
    c.save();
    c.beginPath(); c.arc(x,y,r*0.995,0,6.2832); c.clip();
    var sg2=c.createLinearGradient(x-r*0.55,y-r*0.55,x+r*0.85,y+r*0.85);
    sg2.addColorStop(0,'rgba(80,56,30,0)');
    sg2.addColorStop(.55,'rgba(80,56,30,0.08)');
    sg2.addColorStop(1,'rgba(70,48,26,0.34)');
    c.fillStyle=sg2; c.fillRect(x-r,y-r,r*2,r*2);
    c.strokeStyle=ink(0.11); c.lineWidth=Math.max(0.6,lw*0.5);
    for(i=0;i<3;i++){
      var yy=y+r*(0.36+i*0.15), ww2=r*0.62*Math.sqrt(Math.max(0,1-Math.pow((yy-y)/r,2)));
      ln(c,x-ww2,yy,x+ww2,yy);
    }
    /* 皮边内侧的一点点暗（让皮面显得是平的） */
    var eg=c.createRadialGradient(x,y,r*0.80,x,y,r*0.995);
    eg.addColorStop(0,'rgba(70,48,26,0)');
    eg.addColorStop(1,'rgba(70,48,26,0.20)');
    c.fillStyle=eg; c.fillRect(x-r,y-r,r*2,r*2);
    c.restore();

    /* 绷皮箍 */
    c.beginPath(); c.arc(x,y,r*0.995,0,6.2832);
    c.strokeStyle=ink(0.72); c.lineWidth=Math.max(1.1,lw*1.8); c.stroke();
    c.beginPath(); c.arc(x,y,r*0.93,0,6.2832);
    c.strokeStyle='rgba(255,252,240,0.55)'; c.lineWidth=Math.max(0.8,lw*1.0); c.stroke();

    /* 左上高光弧 */
    c.beginPath(); c.arc(x,y,r*0.90,Math.PI*1.08,Math.PI*1.56);
    c.strokeStyle='rgba(255,253,246,0.80)'; c.lineWidth=Math.max(1,lw*1.9); c.stroke();
  }

  /* ---------- 人物：泳装无头人 + 替头的大鼓 ---------- */
  function drawFigure(){
    var c=fctx, i, q;
    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,W,H);
    if(!L) return;
    var u=L.fh, cx=L.cx;
    var lw=Math.max(0.9,u*0.0042);
    c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle=INK; c.lineWidth=lw;

    var sy=L.sy, hy=L.hy, feet=L.feetY;
    var sw=L.sw, ww=L.ww, hw=L.hw;
    var d=L.drum;

    /* 剪贴感：人物背后一层淡淡的纸色，使剪影从海景里浮出来 */
    var wcy=(L.topY+L.feetY)*0.5, wr=u*0.72;
    var wg=c.createRadialGradient(cx,wcy,u*0.08,cx,wcy,wr);
    wg.addColorStop(0,'rgba(247,238,216,0.26)');
    wg.addColorStop(0.60,'rgba(247,238,216,0.14)');
    wg.addColorStop(1,'rgba(247,238,216,0)');
    c.fillStyle=wg;
    c.fillRect(cx-wr,wcy-wr*1.35,wr*2,wr*2.7);

    /* 地面投影 */
    var sg=c.createRadialGradient(cx,feet+u*0.018,0,cx,feet+u*0.018,u*0.34);
    sg.addColorStop(0,'rgba(64,43,23,0.34)');
    sg.addColorStop(0.5,'rgba(64,43,23,0.13)');
    sg.addColorStop(1,'rgba(64,43,23,0)');
    c.fillStyle=sg;
    c.beginPath(); c.ellipse(cx,feet+u*0.018,u*0.32,u*0.062,0,0,6.2832); c.fill();

    function hatchBox(x0,y0,x1,y1,gap,ang,alpha){
      c.save();
      c.beginPath(); c.rect(x0,y0,x1-x0,y1-y0); c.clip();
      c.strokeStyle=ink(alpha); c.lineWidth=Math.max(0.6,lw*0.55);
      var dx=Math.cos(ang), dy=Math.sin(ang);
      var span=Math.hypot(x1-x0,y1-y0)+u*0.01;
      var nn=Math.min(70,Math.round(span/(gap||4)));
      var px=(x0+x1)/2, py=(y0+y1)/2;
      c.beginPath();
      for(var k=-nn;k<=nn;k++){
        var ox=px-dy*k*gap, oy=py+dx*k*gap;
        c.moveTo(ox-dx*span/2,oy-dy*span/2);
        c.lineTo(ox+dx*span/2,oy+dy*span/2);
      }
      c.stroke();
      c.restore();
    }

    /* --- 腿（深色泳袜 + 靴） --- */
    function leg(ox){
      c.beginPath();
      c.moveTo(ox-u*0.044, hy+u*0.055);
      c.quadraticCurveTo(ox-u*0.036,(hy+feet)/2,ox-u*0.029,feet-u*0.020);
      c.lineTo(ox+u*0.029,feet-u*0.020);
      c.quadraticCurveTo(ox+u*0.036,(hy+feet)/2,ox+u*0.044,hy+u*0.055);
      c.closePath();
      c.fillStyle='#6d5335'; c.fill();
      c.save(); c.clip(); hatchBox(ox-u*0.05,hy,ox+u*0.05,feet,u*0.016,-1.0,0.30); c.restore();
      /* 右缘受光 */
      c.beginPath();
      c.moveTo(ox+u*0.040,hy+u*0.06);
      c.quadraticCurveTo(ox+u*0.032,(hy+feet)/2,ox+u*0.026,feet-u*0.022);
      c.strokeStyle='rgba(238,222,190,0.30)'; c.lineWidth=Math.max(1,u*0.006); c.stroke();
      c.beginPath();
      c.moveTo(ox-u*0.044, hy+u*0.055);
      c.quadraticCurveTo(ox-u*0.036,(hy+feet)/2,ox-u*0.029,feet-u*0.020);
      c.lineTo(ox+u*0.029,feet-u*0.020);
      c.quadraticCurveTo(ox+u*0.036,(hy+feet)/2,ox+u*0.044,hy+u*0.055);
      c.strokeStyle=ink(0.62); c.lineWidth=lw; c.stroke();
    }
    leg(cx-u*0.052);
    leg(cx+u*0.050);

    /* 靴 */
    function boot(ox,dir){
      c.beginPath();
      c.ellipse(ox+dir*u*0.014, feet-u*0.012, u*0.042, u*0.020, 0, 0, 6.2832);
      c.fillStyle='#3b2c1d'; c.fill();
      c.strokeStyle=ink(0.7); c.lineWidth=lw; c.stroke();
      c.beginPath(); c.moveTo(ox-dir*u*0.020,feet-u*0.030);
      c.quadraticCurveTo(ox+dir*u*0.010,feet-u*0.038,ox+dir*u*0.032,feet-u*0.030);
      c.strokeStyle=ink(0.35); c.stroke();
    }
    boot(cx-u*0.052,-1);
    boot(cx+u*0.050,1);

    /* --- 泳装裙摆 --- */
    function skirtPath(){
      c.beginPath();
      c.moveTo(cx-hw*1.03, hy);
      c.quadraticCurveTo(cx-hw*1.44, hy+u*0.062, cx-hw*1.52, hy+u*0.112);
      c.quadraticCurveTo(cx, hy+u*0.152, cx+hw*1.52, hy+u*0.112);
      c.quadraticCurveTo(cx+hw*1.44, hy+u*0.062, cx+hw*1.03, hy);
      c.closePath();
    }
    skirtPath();
    c.fillStyle='#f5e9c9'; c.fill();
    c.save(); skirtPath(); c.clip();
    for(i=0;i<7;i++){
      var b0=hy+u*(0.008+i*0.018), b1=b0+u*0.0095;
      c.fillStyle='#c3a87c';
      c.beginPath();
      c.moveTo(cx-hw*1.6,b0); c.lineTo(cx+hw*1.6,b0);
      c.quadraticCurveTo(cx, b0+u*0.012, cx+hw*1.6, b0);
      c.lineTo(cx+hw*1.6,b1); c.lineTo(cx-hw*1.6,b1); c.closePath(); c.fill();
    }
    hatchBox(cx-hw*1.7,hy,cx-hw*0.2,hy+u*0.17,u*0.015,1.25,0.16);
    c.restore();
    skirtPath(); c.strokeStyle=ink(0.62); c.lineWidth=lw; c.stroke();

    /* --- 上身 --- */
    function torsoPath(){
      c.beginPath();
      c.moveTo(cx-sw, sy+u*0.012);
      c.bezierCurveTo(cx-sw*1.06, sy+u*0.112, cx-ww*1.24, hy-u*0.075, cx-hw, hy);
      c.lineTo(cx+hw, hy);
      c.bezierCurveTo(cx+ww*1.24, hy-u*0.075, cx+sw*1.06, sy+u*0.112, cx+sw, sy+u*0.012);
      c.quadraticCurveTo(cx, sy-u*0.018, cx-sw, sy+u*0.012);
      c.closePath();
    }
    torsoPath(); c.fillStyle='#f5e9c9'; c.fill();
    c.save(); torsoPath(); c.clip();
    for(i=0;i<8;i++){
      var t0=sy-u*0.02+i*u*0.0205, t1=t0+u*0.0108;
      c.fillStyle='#c3a87c';
      c.beginPath();
      c.moveTo(cx-sw*1.3,t0); c.lineTo(cx+sw*1.3,t0);
      c.quadraticCurveTo(cx, t0+u*0.010, cx+sw*1.3, t0);
      c.lineTo(cx+sw*1.3,t1); c.lineTo(cx-sw*1.3,t1); c.closePath(); c.fill();
    }
    hatchBox(cx-sw*1.2,sy,cx-sw*0.05,hy,u*0.014,1.35,0.20);
    hatchBox(cx+sw*0.55,sy,cx+sw*1.15,hy,u*0.020,-1.35,0.12);
    c.restore();
    torsoPath(); c.strokeStyle=ink(0.65); c.lineWidth=lw; c.stroke();
    /* 腰线 */
    c.beginPath(); c.moveTo(cx-hw,sy+u*0.15); c.quadraticCurveTo(cx,hy-u*0.055,cx+hw,sy+u*0.15);
    c.strokeStyle=ink(0.35); c.lineWidth=lw*0.9; c.stroke();

    /* --- 手臂 --- */
    function arm(pts, wd, fill){
      var k, kk2, w1, w2, wa, mx, my;
      c.lineCap='round';
      for(k=0;k<pts.length-1;k++){
        kk2=(k===pts.length-2)?0.84:1.10;
        w1=(k===0)?wd:wd*0.94;
        w2=wd*kk2;
        wa=(w1+w2)*0.5;
        mx=(pts[k][0]+pts[k+1][0])/2;
        my=(pts[k][1]+pts[k+1][1])/2;
        c.beginPath();
        c.moveTo(pts[k][0],pts[k][1]);
        c.quadraticCurveTo(pts[k][0]+(mx-pts[k][0])*1.35, pts[k][1]+(my-pts[k][1])*1.35,
                           pts[k+1][0],pts[k+1][1]);
        c.strokeStyle=INK; c.lineWidth=wa+lw*1.7; c.stroke();
        c.strokeStyle=fill; c.lineWidth=wa; c.stroke();
      }
    }
    /* 左臂：叉腰 */
    arm([[cx-sw*0.90,sy+u*0.030],[cx-sw*1.62,sy+u*0.150],[cx-hw*1.02,hy-u*0.010]], u*0.036,'#f0e0bc');
    /* 右臂：举鼓槌 */
    arm([[cx+sw*0.90,sy+u*0.030],[cx+sw*1.52,sy+u*0.085],[cx+sw*1.66,sy-u*0.052]], u*0.034,'#f0e0bc');

    /* 手 */
    function hand(hx,hy2,rr){
      c.beginPath(); c.ellipse(hx,hy2,rr,rr*0.92,0,0,6.2832);
      c.fillStyle='#f0e0bc'; c.fill(); c.strokeStyle=ink(0.65); c.lineWidth=lw; c.stroke();
    }
    hand(cx-hw*1.02, hy-u*0.012, u*0.021);
    var hx2=cx+sw*1.66, hy2=sy-u*0.056;
    hand(hx2, hy2, u*0.020);

    /* --- 鼓槌 --- */
    var tipX=d.x+d.r*0.04, tipY=d.y+d.r*0.62;
    c.beginPath(); c.moveTo(hx2+u*0.008,hy2-u*0.006); c.lineTo(tipX+d.r*0.66, tipY);
    c.strokeStyle=INK; c.lineWidth=lw*3.0; c.stroke();
    c.strokeStyle='#d9c193'; c.lineWidth=lw*1.5; c.stroke();
    c.beginPath(); c.arc(tipX+d.r*0.66,tipY,lw*2.2,0,6.2832); c.fillStyle=INK; c.fill();

    /* --- 颈（被切断处） --- */
    c.beginPath();
    c.moveTo(cx-u*0.040, d.y+d.r*0.86);
    c.lineTo(cx-u*0.044, sy+u*0.016);
    c.lineTo(cx+u*0.044, sy+u*0.016);
    c.lineTo(cx+u*0.040, d.y+d.r*0.86);
    c.closePath();
    c.fillStyle='#e2cfa8'; c.fill();
    c.save(); c.clip();
    c.fillStyle='rgba(58,43,28,0.30)';
    c.beginPath(); c.ellipse(cx,d.y+d.r*0.90,u*0.050,u*0.020,0,0,6.2832); c.fill();
    c.restore();
    c.strokeStyle=ink(0.55); c.lineWidth=lw; c.stroke();

    /* --- 鼓（替头） --- */
    c.beginPath(); c.ellipse(cx+u*0.03, d.y+d.r*1.02, d.r*0.86, d.r*0.15, 0.1, 0, 6.2832);
    c.fillStyle='rgba(64,43,23,0.13)'; c.fill();
    drumShape(c, d.x, d.y, d.r, lw);

    /* 领口布：鼓下一点点衣领 */
    c.beginPath();
    c.moveTo(cx-u*0.052, sy+u*0.012);
    c.quadraticCurveTo(cx, sy-u*0.006, cx+u*0.052, sy+u*0.012);
    c.strokeStyle=ink(0.40); c.lineWidth=lw*1.2; c.stroke();
  }

  /* ---------- 静态道具层（邮票 / 邮戳 / 印刷框 / 落地的小鼓） ---------- */
  var coverImg=null, coverReady=false;
  function drawProps(){
    var c=sctx;
    if(!L) return;
    c.setTransform(dpr,0,0,dpr,0,0);
    var w=W, h=H, m=Math.min(w,h), i, k;

    /* 落地的小鼓（掉下来的"头"） */
    if(L.fallen){
      var f=L.fallen;
      c.save();
      c.beginPath(); c.ellipse(f.x, f.y+f.r*1.02, f.r*1.32, f.r*0.26, 0, 0, 6.2832);
      c.fillStyle='rgba(64,43,23,0.17)'; c.fill();
      c.translate(f.x,f.y); c.rotate(-0.26);
      drumShape(c,0,0,f.r, Math.max(0.75,f.r*0.038));
      c.restore();
    }

    /* 印刷细框 + 顶点刻线 */
    var inset=Math.max(5,m*0.030);
    c.strokeStyle=ink(0.42); c.lineWidth=1;
    c.strokeRect(inset,inset,w-inset*2,h-inset*2);
    c.strokeStyle=ink(0.15);
    c.strokeRect(inset+3.5,inset+3.5,w-inset*2-7,h-inset*2-7);
    c.strokeStyle=ink(0.35);
    var tick=m*0.022;
    for(i=0;i<4;i++){
      var tx = (i%2)? w-inset : inset, ty=(i<2)? inset : h-inset;
      var dx=(i%2)? -1 : 1, dy=(i<2)? 1 : -1;
      c.beginPath(); c.moveTo(tx+dx*tick,ty); c.lineTo(tx+dx*tick*0.25,ty+dy*tick*0.25); c.lineTo(tx,ty+dy*tick); c.stroke();
    }

    /* 印刷小字 */
    var fs=Math.max(7,m*0.0165);
    c.fillStyle=ink(0.45);
    c.font='italic '+fs.toFixed(1)+'px Georgia,"Times New Roman",serif';
    c.textAlign='left';
    c.fillText('Manners & Co., Bath', inset+m*0.020, h-inset-m*0.014);
    c.textAlign='right';
    c.fillText('No. 328', w-inset-m*0.020, h-inset-m*0.014);

    /* 邮票 */
    var s=L.stamp.s, sx=L.stamp.x, sy2=L.stamp.y;
    c.save();
    c.translate(sx,sy2); c.rotate(-0.05);
    var half=s*0.5, ph=Math.max(1.8,s*0.029);
    c.fillStyle='#f7eed6';
    c.fillRect(-half,-half,s,s);
    c.globalCompositeOperation='destination-out';
    var steps=7, stp=s/(steps+1);
    for(k=1;k<=steps;k++){
      var pp=-half+k*stp;
      c.beginPath(); c.arc(pp,-half,ph,0,6.2832); c.fill();
      c.beginPath(); c.arc(pp,half,ph,0,6.2832); c.fill();
      c.beginPath(); c.arc(-half,pp,ph,0,6.2832); c.fill();
      c.beginPath(); c.arc(half,pp,ph,0,6.2832); c.fill();
    }
    c.globalCompositeOperation='source-over';
    c.strokeStyle=ink(0.40); c.lineWidth=1;
    c.strokeRect(-half*0.90,-half*0.90,s*0.90,s*0.90);

    var iw=s*0.72, ih=s*0.44, iy=-half*0.60;
    c.save();
    c.beginPath(); c.rect(-iw/2,iy,iw,ih); c.clip();
    if(coverReady && coverImg && coverImg.naturalWidth){
      var ca=coverImg.naturalWidth/coverImg.naturalHeight;
      var dw2=iw, dh2=iw/ca;
      if(dh2<ih){ dh2=ih; dw2=ih*ca; }
      c.drawImage(coverImg,-dw2/2,iy+(ih-dh2)/2,dw2,dh2);
      c.globalCompositeOperation='multiply';
      c.fillStyle='rgba(199,160,98,0.46)';
      c.fillRect(-iw/2,iy,iw,ih);
      c.globalCompositeOperation='source-over';
      c.fillStyle='rgba(247,238,214,0.22)';
    } else {
      c.fillStyle='#e9d9b6'; c.fillRect(-iw/2,iy,iw,ih);
      drumShape(c,0,iy+ih*0.52,iw*0.19,Math.max(0.6,iw*0.011));
    }
    c.restore();
    c.strokeStyle=ink(0.32); c.lineWidth=1;
    c.strokeRect(-iw/2,iy,iw,ih);

    c.fillStyle=ink(0.58);
    c.textAlign='center';
    c.font='600 '+Math.max(6,s*0.10).toFixed(1)+'px Georgia,"Times New Roman",serif';
    c.fillText('POSTAGE · 3d', 0, half*0.66);
    c.restore();

    /* 邮戳 */
    c.save();
    c.translate(sx-s*0.34, sy2+s*0.50);
    c.rotate(0.07);
    c.strokeStyle='rgba(72,52,33,0.38)';
    c.lineWidth=Math.max(1,s*0.020);
    c.beginPath(); c.arc(0,0,s*0.42,0,6.2832); c.stroke();
    c.lineWidth=Math.max(1,s*0.012);
    c.beginPath(); c.arc(0,0,s*0.32,0,6.2832); c.stroke();
    c.lineWidth=Math.max(1,s*0.014);
    for(k=0;k<3;k++){
      c.beginPath();
      for(i=0;i<=12;i++){
        var px=-s*(1.30+k*0.24)+i*s*0.030, py=-s*0.09+k*s*0.085+Math.sin(i*0.85)*s*0.026;
        if(i===0) c.moveTo(px,py); else c.lineTo(px,py);
      }
      c.stroke();
    }
    c.restore();
  }

  /* ---------- 每帧：人物呼吸 + 鼓膜振动 ---------- */
  function drawLive(tl){
    if(!L) return;
    var d=L.drum, i;
    var bass=S.bass||0, pulse=S.pulse||0, lvl=S.level||0;
    var bob=S.rm?0:Math.sin(tl*1.05)*Math.min(2.4,H*0.0026);
    var tilt=S.rm?0:Math.sin(tl*0.62)*0.0034;

    ctx.save();
    ctx.translate(d.x,L.feetY);
    ctx.rotate(tilt);
    ctx.translate(-d.x,-L.feetY);
    ctx.translate(0,bob);
    if(figC.width) ctx.drawImage(figC,0,0,W,H);

    var r=d.r, push=1+bass*0.035+pulse*0.022;
    ctx.save();
    ctx.beginPath(); ctx.arc(d.x,d.y,r*0.955,0,6.2832); ctx.clip();
    var g=ctx.createRadialGradient(d.x-r*0.22,d.y-r*0.26,r*0.05,d.x,d.y,r);
    g.addColorStop(0,'rgba(255,251,238,'+(0.05+0.24*pulse+0.09*bass).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,251,238,0)');
    ctx.fillStyle=g;
    ctx.fillRect(d.x-r,d.y-r,r*2,r*2);
    for(i=0;i<(S.rm?1:3);i++){
      var phase=((tl*0.85+i/3)%1);
      var rr=r*(0.10+phase*0.86)*push;
      ctx.beginPath(); ctx.arc(d.x,d.y,rr,0,6.2832);
      ctx.strokeStyle='rgba(58,43,28,'+((1-phase)*0.13*(0.30+lvl)).toFixed(3)+')';
      ctx.lineWidth=Math.max(0.6,r*0.013);
      ctx.stroke();
    }
    ctx.restore();

    if(pulse>0.04){
      ctx.save();
      ctx.translate(d.x,d.y);
      ctx.strokeStyle='rgba(58,43,28,'+(pulse*0.55).toFixed(3)+')';
      ctx.lineWidth=Math.max(0.7,r*0.014);
      for(i=0;i<12;i++){
        var a=i*6.2832/12+0.13, rr1=r*(1.16+pulse*0.03), rr2=r*(1.30+pulse*0.17);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*rr1,Math.sin(a)*rr1);
        ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  /* ---------- 尺寸 / 静态层重建 ---------- */
  var noisePat=null;
  function sizeCanvases(){
    var r=art.getBoundingClientRect();
    var w=Math.round(r.width), h=Math.round(r.height);
    if(!isFinite(w)||w<2) w=1440;
    if(!isFinite(h)||h<2) h=900;
    if(w>4000) w=4000;
    if(h>4000) h=4000;
    W=w; H=h;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    sceneC.width=Math.round(w*dpr); sceneC.height=Math.round(h*dpr);
    figC.width=Math.round(w*dpr); figC.height=Math.round(h*dpr);
    L=layout(w,h);
    drawScene();
    drawFigure();
    drawProps();
    if(!noiseC) buildNoise();
    noisePat = noiseC ? ctx.createPattern(noiseC,'repeat') : null;
  }

  /* ---------- 每帧合成 ---------- */
  function paint(tl){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    if(sceneC.width) ctx.drawImage(sceneC,0,0,W,H);
    drawLive(tl);
    /* 人物与背景一起压一层暖调，像同一块版印出来的 */
    ctx.save();
    ctx.globalCompositeOperation='multiply';
    ctx.fillStyle='rgba(208,175,122,0.20)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    drawGrain();
  }

  function drawGrain(){
    if(!noisePat) return;
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.globalCompositeOperation='multiply';
    var fq=S.rm?0:S.frames;
    var ox=(fq*13)%128, oy=(fq*7)%128;
    ctx.translate(-ox,-oy);
    ctx.fillStyle=noisePat;
    ctx.fillRect(0,0,W+130,H+130);
    ctx.restore();
  }

  /* ============ 歌词层 ============ */
  var spans=[], times=[], revealPtr=0, CH_MAX=300;
  var wrapEl=$('lineWrap');

  function roman(n){
    if(!isFinite(n)||n<1) return '—';
    var v=[['X',10],['IX',9],['V',5],['IV',4],['I',1]], out='', i, g;
    if(n>39) n=39;
    for(i=0;i<v.length;i++){
      for(g=0;g<40 && n>=v[i][1];g++){ out+=v[i][0]; n-=v[i][1]; }
    }
    return 'No. '+out;
  }

  function fitLine(){
    lineEl.style.fontSize='';
    var base=parseFloat(getComputedStyle(lineEl).fontSize)||18;
    if(!isFinite(base)||base<=0) base=18;
    var avail=Math.max(100, wrapEl.clientWidth-18);
    var size=base;
    lineEl.style.whiteSpace='nowrap';
    var need=lineEl.scrollWidth;
    for(var k=0;k<12 && need>avail && size>base*0.62;k++){
      var f=Math.min(0.94, avail/Math.max(1,need));
      size=Math.max(base*0.62, size*f);
      lineEl.style.fontSize=size.toFixed(1)+'px';
      need=lineEl.scrollWidth;
    }
    lineEl.style.whiteSpace='';
  }

  function buildLine(i){
    var L2=S.lines[i], txt=(L2&&L2.text)?L2.text:'';
    lineEl.className='';
    lineEl.style.fontSize='';
    lineEl.textContent='';
    spans=[]; times=[];
    revealPtr=0;
    S.text=txt;
    $('headDate').textContent=roman(i+1);
    if(!txt){
      var rest=document.createElement('span');
      rest.className='ch on'; rest.textContent='❦';
      lineEl.appendChild(rest);
      return;
    }
    var k, dur=L2.dur, t0=L2.t, chars=L2.chars;
    var n=chars?chars.length:0;
    var step=dur/Math.max(1,txt.length);
    for(k=0;k<txt.length && k<CH_MAX;k++){
      var ct;
      if(n>0){
        if(k<n && chars[k] && isFinite(chars[k].t)) ct=+chars[k].t;
        else ct=t0+dur*(Math.min(k,n-1)/Math.max(1,n-1));
      } else {
        ct=t0+step*k;
      }
      var sp=document.createElement('span');
      sp.className='ch';
      sp.textContent=txt.charAt(k);
      lineEl.appendChild(sp);
      spans.push(sp);
      times.push(ct);
    }
    if(txt.length>CH_MAX){
      var tail=document.createElement('span');
      tail.className='ch';
      tail.textContent=txt.slice(CH_MAX);
      lineEl.appendChild(tail);
      spans.push(tail);
      times.push(t0+dur*0.92);
    }
    fitLine();
  }

  function showIdle(){
    lineEl.className='none';
    lineEl.style.fontSize='';
    lineEl.textContent='· · ·';
    spans=[]; times=[]; revealPtr=0;
    S.text='';
    $('headDate').textContent='—';
  }

  function showEmpty(){
    lineEl.className='none';
    lineEl.style.fontSize='';
    lineEl.textContent='（此曲无词，明信片背面尚留空白）';
    spans=[]; times=[]; revealPtr=0;
    S.text='';
    $('headDate').textContent='—';
  }

  function revealTo(t){
    if(!spans.length) return;
    var k=0;
    for(k=0;k<spans.length && revealPtr<spans.length && times[revealPtr]<=t+0.002;k++){
      spans[revealPtr].className='ch on';
      revealPtr++;
    }
  }

  function idxAt(t){
    var lo=0,hi=S.lines.length-1,ans=-1,n;
    for(n=0;n<24 && lo<=hi;n++){
      var mid=(lo+hi)>>1;
      if(S.lines[mid].t<=t+0.02){ ans=mid; lo=mid+1; } else hi=mid-1;
    }
    return ans;
  }

  function updateMeta(){
    var tEl=$('mTitle'), aEl=$('mArtists');
    tEl.textContent = S.title ? S.title : '无名之曲';
    aEl.textContent = S.artists ? S.artists : '佚名';
  }

  /* ============ 播放头：tick 的 time 永远直接采纳，插值只做帧间平滑 ============ */
  function playhead(){
    var now=performance.now();
    var tl=S.t;
    if(S.playing && S.tAt>0){
      var dt=(now-S.tAt)/1000;      /* 只补两次 tick 之间的抖动，最多 0.4s */
      if(dt>0) tl=S.t+Math.min(0.40, dt);
    }
    if(!isFinite(tl)||tl<0) tl=0;
    return tl;
  }

  /* 索引同步：rAF、__stage 读取、init 之后都走这里，任何时刻都不留 -2 哨兵 */
  function syncIndex(tl){
    var i=idxAt(tl);
    if(i!==S.idx || S.dirty){
      S.dirty=false;
      S.idx=i;
      if(i<0){
        if(S.lines.length) showIdle(); else showEmpty();
      } else {
        buildLine(i);
      }
    }
    return i;
  }

  /* ============ 主循环 ============ */
  function loop(){
    var t0=performance.now();
    var tl=playhead();
    S.live=tl;

    syncIndex(tl);
    if(S.idx>=0) revealTo(tl);

    S.pulse *= S.rm?0.86:0.90;
    if(S.pulse<0.002) S.pulse=0;

    paint(tl);
    S.frames++;
    S.js=performance.now()-t0;
    requestAnimationFrame(loop);
  }

  /* ============ 消息 ============ */
  function normArtists(a){
    if(a==null) return '';
    if(Array.isArray(a)){
      var out=[], k;
      for(k=0;k<a.length && k<12;k++){ if(a[k]!=null && String(a[k]).length) out.push(String(a[k])); }
      return out.join(' / ');
    }
    return String(a).length ? String(a) : '';
  }

  var lastCoverUrl=null;
  function applyCover(url){
    var u2=(url&&typeof url==='string')?url:'';
    if(u2===lastCoverUrl) return;
    lastCoverUrl=u2;
    if(!u2){ coverImg=null; coverReady=false; redrawStatic(); return; }
    var im=new Image();
    im.onload=function(){ coverImg=im; coverReady=true; redrawStatic(); };
    im.onerror=function(){ coverImg=null; coverReady=false; redrawStatic(); };
    try{ im.decoding='async'; im.src=u2; }catch(e){ coverReady=false; }
  }

  function redrawStatic(){
    drawScene();
    drawProps();
  }

  window.addEventListener('message',function(ev){
    var d=ev.data;
    if(!d||typeof d!=='object') return;
    var p=d.payload&&typeof d.payload==='object'?d.payload:d;
    var type=d.type||p.type;

    if(type==='init'){
      var song=(p.song&&typeof p.song==='object')?p.song:{};
      var newId=(song.id==null?'':String(song.id));
      var prevId=S.songId||'';
      var sameSong=(newId!=='' && newId===prevId);
      if(!sameSong && newId==='' && prevId==='' && S.lines.length &&
         Math.abs((isFinite(p.duration)?+p.duration:0)-S.duration)<0.6){
        sameSong=true;
      }
      S.songId=newId;
      S.title=(song.name==null?'':String(song.name)).slice(0,120);
      S.artists=normArtists(song.artists).slice(0,160);
      updateMeta();

      if(p.accent && p.accent.length>=3){
        var ar=Math.max(0,Math.min(255,+p.accent[0]||0));
        var ag=Math.max(0,Math.min(255,+p.accent[1]||0));
        var ab=Math.max(0,Math.min(255,+p.accent[2]||0));
        var lum=(ar*0.299+ag*0.587+ab*0.114);
        if(lum>202){ var f2=186/lum; ar=Math.round(ar*f2); ag=Math.round(ag*f2); ab=Math.round(ab*f2); }
        document.documentElement.style.setProperty('--acc','rgb('+ar+','+ag+','+ab+')');
      }

      var arr=Array.isArray(p.lines)?p.lines:[];
      var arr2=[], k, prevT=0;
      for(k=0;k<arr.length && k<3000;k++){
        var raw=arr[k];
        if(!raw||typeof raw!=='object') continue;
        var tx=(raw.text==null)?'':String(raw.text).slice(0,2000);
        var tt=isFinite(raw.t)?+raw.t:prevT;
        if(tt<0) tt=0;
        prevT=tt;
        var dd=(isFinite(raw.dur)&&+raw.dur>0)?+raw.dur:0;
        arr2.push({t:tt,dur:dd,text:tx,chars:(raw.chars&&raw.chars.length)?raw.chars:null});
      }
      for(k=0;k<arr2.length;k++){
        if(!arr2[k].dur){
          var nxt=(k+1<arr2.length)?arr2[k+1].t:(arr2[k].t+4);
          arr2[k].dur=Math.max(0.6, Math.min(12, nxt-arr2[k].t));
        }
      }
      S.lines=arr2;
      S.duration=(isFinite(p.duration)&&+p.duration>0)?+p.duration:0;
      applyCover(song.cover);
      if(!sameSong){ S.t=0; S.tAt=0; S.playing=true; }
      S.idx=-1;
      S.dirty=true;
      syncIndex(playhead());

    } else if(type==='tick'){
      /* 直接采纳 tick 的 time：拖进度条 / 切歌 / 从中间开始都要立刻跳过去 */
      if(isFinite(p.time)){
        var nt=+p.time;
        S.t = nt>0 ? nt : 0;
        S.tAt=performance.now();
        /* 立刻落位，不等下一帧：即使 rAF 被节流，歌词也不会落后 */
        var tlT=playhead();
        syncIndex(tlT);
        if(S.idx>=0) revealTo(tlT);
      }
      if(typeof p.playing==='boolean') S.playing=p.playing;

    } else if(type==='beat'){
      var lv=isFinite(p.level)?Math.max(0,Math.min(1,+p.level)):0.7;
      S.pulse=Math.min(1, S.pulse*0.55+lv*(S.rm?0.55:0.85));
      S.beats++;

    } else if(type==='live'){
      if(isFinite(p.bass)) S.bass=Math.max(0,Math.min(1,+p.bass));
      if(isFinite(p.level)) S.level=Math.max(0,Math.min(1,+p.level));
      if(isFinite(p.mid)) S.mid=Math.max(0,Math.min(1,+p.mid));
      if(isFinite(p.treble)) S.treble=Math.max(0,Math.min(1,+p.treble));
      if(isFinite(p.bpm)) S.bpm=+p.bpm;
      if(typeof p.playing==='boolean') S.playing=p.playing;
    }
  });

  var coverLoadCount=0;

  window.__stage=function(){
    /* 出口不依赖上一帧 rAF：现场按播放头重算，idx 只会是 -1 或 >=0 */
    var tl=playhead();
    var i=syncIndex(tl);
    if(i>=0) revealTo(tl);
    return {
      lines:S.lines.length, idx:(i<0?-1:i), t:tl, playing:!!S.playing,
      frames:S.frames, js:S.js, err:S.err, text:S.text, gl:false, rm:!!S.rm
    };
  };

  function onResize(){
    if(rsTimer) clearTimeout(rsTimer);
    rsTimer=setTimeout(function(){ rsTimer=0; sizeCanvases(); }, 140);
  }
  var rsTimer=0;

  if(window.matchMedia){
    try{ S.rm=!!window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ S.rm=false; }
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  sizeCanvases();
  updateMeta();
  showIdle();

  /* 纸纹理兜底：素材缺失也不留白 */
  (function(){
    var probe=new Image();
    probe.onerror=function(){ document.documentElement.classList.add('no-tex'); };
    try{ probe.src='assets/328-paper.jpg'; }catch(e){ document.documentElement.classList.add('no-tex'); }
  })();
  requestAnimationFrame(loop);
  requestAnimationFrame(sendReady);
  setTimeout(sendReady,320);
})();
</script>
</body>
</html>
