<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>324 · scream bleed</title>
<style>
  :root{
    --ink:#0a0407; --bone:#f4e7da; --blood:#c50f2c; --abyss:#0a1230;
    --fs:clamp(23px,4.9vw + 1.6vh,78px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07030a}
  #w{position:fixed;inset:0;overflow:hidden;background:#07030a}
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
  #plate{z-index:1;transform-origin:50% 46%}
  #plate.breathe{animation:breathe 9s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1.015) rotate(-.25deg)}50%{transform:scale(1.045) rotate(.25deg)}}
  #gl{z-index:2;opacity:0;transition:opacity .7s linear}
  #gl.on{opacity:1}
  #drip{z-index:3;pointer-events:none}

  #ly{
    position:absolute;z-index:5;left:0;right:0;bottom:4.4vh;
    padding:0 7vw;display:flex;justify-content:center;align-items:flex-end;
    pointer-events:none;text-align:center;
    transition:opacity .55s ease-out;
  }
  #ly.hide{opacity:0}
  #ly .band{
    position:absolute;left:-2vw;right:-2vw;top:-7vh;bottom:-7vh;transform:rotate(-.55deg) scale(1.03);
    background:radial-gradient(ellipse 72% 88% at 50% 52%,
      rgba(7,2,5,.88) 0%,rgba(7,2,5,.74) 40%,rgba(7,2,5,.32) 66%,rgba(7,2,5,0) 84%);
    filter:blur(10px);
  }
  #ln{
    position:relative;z-index:1;
    font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
    font-weight:900;font-size:var(--fs);line-height:1.14;letter-spacing:.015em;
    color:var(--bone);max-width:86vw;overflow-wrap:anywhere;word-break:break-word;
    text-shadow:
      0 0 1px rgba(9,3,6,.95),
      0 1px 2px rgba(9,3,6,.95),
      0 0 13px rgba(9,3,6,.92),
      0 0 36px rgba(9,3,6,.78),
      -1.7px 0 0 rgba(206,18,44,.40),
       1.7px 0 0 rgba(34,64,190,.34);
    transition:transform .12s ease-out;
  }
  #ln.slam{transform:translateY(-.012em) scale(1.014)}
  #ln::before{
    content:attr(data-t);position:absolute;inset:0;z-index:-1;
    color:rgba(158,10,32,.6);transform:translate(2.2px,1.6px);
    text-shadow:none;pointer-events:none;
  }
  .ch{
    display:inline-block;opacity:0;
    transform:translate3d(0,.14em,0) scale(1.3) rotate(var(--r,0deg));
    filter:blur(2.4px);
    transition:opacity .22s linear,transform .34s cubic-bezier(.2,.85,.25,1),filter .24s linear;
  }
  .ch.on{opacity:1;transform:none;filter:none}
  .ch.inst{transition:none}

  #empty{
    position:absolute;inset:0;z-index:5;display:none;
    flex-direction:column;justify-content:center;align-items:center;gap:1.4vh;
    pointer-events:none;text-align:center;padding:0 8vw;
  }
  #empty.show{display:flex}
  #empty .e1{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-weight:900;
    font-size:clamp(16px,2.3vw,30px);letter-spacing:.10em;color:rgba(242,230,216,.60);
    text-shadow:0 0 20px rgba(6,2,4,.9),0 0 46px rgba(6,2,4,.8);
  }
  #empty .e2{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-weight:500;
    font-size:clamp(10px,1.35vw,16px);letter-spacing:.30em;color:rgba(242,230,216,.30);
  }
  #empty .e3{width:14vw;max-width:180px;height:1px;background:linear-gradient(90deg,transparent,rgba(197,15,44,.75),transparent)}
  .rm .ch{transition:none}
  .rm #plate.breathe{animation:none}
</style>
</head>
<body>
<div id="w">
  <canvas id="plate"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="drip"></canvas>
  <div id="ly">
    <div class="band"></div>
    <div id="ln"></div>
  </div>
  <div id="empty">
    <div class="e3"></div>
    <div class="e1" id="e1"></div>
    <div class="e2" id="e2"></div>
    <div class="e3"></div>
  </div>
</div>
<script>
(function(){
'use strict';
var V={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,text:'',err:'',gl:false,rm:false};
window.__stage=function(){return {lines:V.lines.length,idx:V.idx,t:V.t,playing:V.playing,
  frames:V.frames,js:V.js,err:V.err,text:V.text,gl:V.gl,rm:V.rm};};

var $=function(s){return document.querySelector(s);};
var plate=$('#plate'),glc=$('#gl'),drip=$('#drip'),ln=$('#ln');
var ctx=plate.getContext('2d'),dctx=drip.getContext('2d');

var T={base:0,at:0,playing:true};
var SONG={name:'',artists:'',cover:''};
var ACC=[197,16,44];
var BEAT={index:-1,level:0},LIVE={bpm:0,level:0,bass:0,mid:0,treble:0,playing:true};
var RM=false;
try{RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){RM=false;}
V.rm=RM;

function num(v,d){v=+v;return isFinite(v)?v:d;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}

/* ---------- protocol ---------- */
function artistStr(a){
  if(!a) return '';
  if(typeof a==='string') return a.trim();
  if(Object.prototype.toString.call(a)==='[object Array]') return a.filter(Boolean).join(' / ');
  return '';
}
function normLines(raw){
  var out=[],i,L,x;
  if(!raw||!raw.length) return out;
  for(i=0;i<raw.length;i++){
    x=raw[i]; if(!x) continue;
    var t=num(x.t,-1); if(t<0) continue;
    var txt=(x.text==null?'':String(x.text));
    var ch=null;
    if(x.chars&&x.chars.length){ ch=[]; for(var k=0;k<x.chars.length;k++){ var c=x.chars[k];
      ch.push({c:(c&&c.c!=null?String(c.c):''),t:num(c&&c.t,t)}); } }
    out.push({t:t,dur:num(x.dur,0),text:txt,chars:ch});
  }
  out.sort(function(a,b){return a.t-b.t;});
  for(i=0;i<out.length;i++){
    if(!(out[i].dur>0)){
      out[i].dur = out[i+1] ? Math.max(0.4,out[i+1].t-out[i].t) : 4;
    }
  }
  return out;
}
function onInit(p){
  p=p||{};
  var s=p.song||{};
  SONG={name:(s.name==null?'':String(s.name)).trim(),artists:artistStr(s.artists),cover:typeof s.cover==='string'?s.cover:''};
  if(p.accent&&p.accent.length>=3){
    ACC=[clamp(num(p.accent[0],197),0,255),clamp(num(p.accent[1],16),0,255),clamp(num(p.accent[2],44),0,255)];
  }
  V.lines=normLines(p.lines);
  SONGSEED=hashStr(String(s.id==null?'':s.id)+'|'+SONG.name+'|'+SONG.artists);
  V.t=0;T.base=0;T.at=performance.now();T.playing=p.playing!==false;
  V.playing=T.playing;V.idx=-1;V.text='';
  LYR.key=-2;
  var has=V.lines.length>0;
  if(empEl)empEl.classList.toggle('show',!has);
  if(!has){
    if(e1El)e1El.textContent=SONG.name||'未命名';
    if(e2El)e2El.textContent=SONG.artists||'·';
    setLine(-1);
  }
  if(lyEl)lyEl.classList.add('hide');
  paintSoon();
}
function onTick(p){
  p=p||{};
  if(typeof p.time==='number'&&isFinite(p.time)){T.base=p.time;T.at=performance.now();}
  T.playing=p.playing!==false;V.playing=T.playing;
}
window.addEventListener('message',function(e){
  var d=e.data;if(!d||d.__c100!==1)return;
  try{
    if(d.type==='init')onInit(d.payload);
    else if(d.type==='tick')onTick(d.payload);
    else if(d.type==='beat'){var b=d.payload||{};BEAT.index=num(b.index,BEAT.index);BEAT.level=clamp(num(b.level,0),0,1);
      FX.beat=Math.max(FX.beat,0.35+0.65*BEAT.level);}
    else if(d.type==='live'){var L=d.payload||{};LIVE.bpm=num(L.bpm,0);LIVE.level=clamp(num(L.level,0),0,1);
      LIVE.bass=clamp(num(L.bass,0),0,1);LIVE.mid=clamp(num(L.mid,0),0,1);LIVE.treble=clamp(num(L.treble,0),0,1);
      LIVE.playing=L.playing!==false;}
  }catch(err){V.err=String(err&&err.message||err);}
});
window.addEventListener('error',function(e){V.err=String(e.message||'error');});

/* ---------- time / line ---------- */
function nowT(){
  if(T.playing) return T.base+Math.min(1.5,(performance.now()-T.at)/1000);
  return T.base;
}
function findIdx(t){
  var a=V.lines,lo=0,hi=a.length-1,r=-1;
  while(lo<=hi){var m=(lo+hi)>>1;if(a[m].t<=t+0.06){r=m;lo=m+1;}else hi=m-1;}
  return r;
}

/* ================= paint engine ================= */
var VIEW={w:0,h:0,ppu:1,pw:1,ph:1};
var FACE=null,SONGSEED=0,PAINTKEY='',SLAM=false;
function hashStr(s){var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
var rs=1;
function rnd(){rs=(rs+0x6D2B79F5)|0;var t=Math.imul(rs^(rs>>>15),1|rs);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;}
function rr(a,b){return a+(b-a)*rnd();}
function rint(a,b){return a+((rnd()*(b-a+1))|0);}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a<0?0:a>1?1:a).toFixed(3)+')';}
function mix(c1,c2,t){return [c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t];}

var C={
  ink:[11,4,9], pitch:[4,2,5],
  abyss:[7,11,36], cobalt:[20,34,104], ultra:[40,66,176], steel:[66,100,178], cyan:[96,150,214],
  crimson:[190,13,40], blood:[122,7,21], deepred:[80,4,14], rust:[150,42,26], ember:[228,54,44],
  bone:[242,230,216], ivory:[252,244,232], ochre:[206,158,126], flesh:[190,110,96], mauve:[104,64,92]
};

function brush(x0,y0,x1,y1,w,col,al){
  var dx=x1-x0,dy=y1-y0,L=Math.sqrt(dx*dx+dy*dy);
  if(!(L>0.4)||!(w>0.05))return;
  var nx=-dy/L,ny=dx/L;
  var bend=rr(-0.18,0.18)*L;
  var cx=(x0+x1)/2+nx*bend, cy=(y0+y1)/2+ny*bend;
  ctx.strokeStyle=rgba(col,al);ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(cx,cy,x1,y1);ctx.stroke();
  if(w<2.2)return;
  ctx.strokeStyle=rgba(mix(col,[255,250,240],0.3),al*0.32);
  ctx.lineWidth=Math.max(0.55,w*0.2);
  ctx.beginPath();ctx.moveTo(x0+nx*w*0.13,y0+ny*w*0.13);
  ctx.quadraticCurveTo(cx,cy,x1-nx*w*0.11,y1-ny*w*0.11);ctx.stroke();
  var nb=w>13?2:(w>6?1:0);
  for(var i=0;i<nb;i++){
    var o=(i-(nb-1)/2)*(w*0.52);
    ctx.strokeStyle=rgba(mix(col,C.ink,0.4),al*rr(0.22,0.5));
    ctx.lineWidth=Math.max(0.5,w*0.09);
    ctx.beginPath();ctx.moveTo(x0+nx*o,y0+ny*o);
    ctx.quadraticCurveTo(cx+nx*o,cy+ny*o,x1+nx*o,y1+ny*o);ctx.stroke();
  }
}
function chain(x,y,n,step,wMin,wMax,cols,aMin,aMax,af){
  for(var i=0;i<n;i++){
    var a=af(x,y)+rr(-0.14,0.14);
    var len=step*rr(0.65,1.4);
    var x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len;
    brush(x,y,x2,y2,rr(wMin,wMax),cols[(rnd()*cols.length)|0],rr(aMin,aMax));
    x=x2+rr(-0.16,0.16)*len; y=y2+rr(-0.16,0.16)*len;
  }
}
function smooth(pts,close){
  var n=pts.length,i;
  if(n<2)return;
  ctx.moveTo(pts[0][0],pts[0][1]);
  if(n===2){ctx.lineTo(pts[1][0],pts[1][1]);return;}
  for(i=0;i<n-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,
                      p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);
  }
  if(close)ctx.closePath();
}
function slab(pts,c1,c2,alpha){
  ctx.beginPath();smooth(pts,true);
  var g=ctx.createLinearGradient(pts[0][0],pts[0][1],pts[pts.length-1][0],pts[pts.length-1][1]);
  g.addColorStop(0,rgba(c1,alpha));g.addColorStop(1,rgba(c2,alpha));
  ctx.fillStyle=g;ctx.fill();
  /* 水彩的湿边：颜料在水里停住时积出来的那圈深色 */
  ctx.strokeStyle=rgba(mix(mix(c1,c2,0.5),C.ink,0.55),0.34);
  ctx.lineWidth=Math.max(1.2,Math.min(9,VIEW.w*0.004));
  ctx.stroke();
}

var NOISE=null;
function makeNoise(){
  var n=document.createElement('canvas');n.width=n.height=150;
  var c=n.getContext('2d'),img=c.createImageData(150,150),d=img.data,i;
  for(i=0;i<d.length;i+=4){var v=(rnd()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  c.putImageData(img,0,0);NOISE=n;
}

/* ---------- 底层：满幅互补色场 ---------- */
function paintField(W,H){
  ctx.fillStyle=rgba(C.pitch,1);ctx.fillRect(0,0,W,H);
  var D=Math.max(W,H), u=D*0.001;
  var i,x,y,n;

  /* 深钴蓝大扫笔：斜向贯穿 */
  var blueA=0.62, blueSet=[C.abyss,C.cobalt,C.ultra,C.abyss,C.steel];
  for(n=0;n<46;n++){
    x=rr(-0.1*W,1.05*W);y=rr(-0.1*H,1.05*H);
    chain(x,y,rint(5,9),D*rr(0.035,0.075),u*rr(9,34),u*rr(46,120),blueSet,0.22,blueA,
      function(px,py){return -0.62+0.5*Math.sin(px*0.0022+py*0.0011);});
  }
  /* 蓝的暗部堆积（角落更沉） */
  for(n=0;n<26;n++){
    x=rr(0,W);y=rr(0,H);
    var deep=1-Math.min(1,(Math.abs(x-W*0.5)/W+Math.abs(y-H*0.5)/H));
    chain(x,y,rint(4,7),D*0.03,u*rr(12,40),u*rr(30,90),[C.abyss,C.pitch,C.ink],0.18,0.5/ (0.6+deep),
      function(px,py){return 0.5+0.6*Math.cos(px*0.0015-py*0.0025);});
  }

  /* 猩红巨板：从左侧撕进来，一分为二的对角 */
  var slabA=[];
  for(i=0;i<=6;i++){var tt=i/6;slabA.push([ -0.08*W+tt*0.72*W, H*(0.02+tt*0.44)+rr(-0.05,0.05)*H ]);}
  for(i=6;i>=0;i--){var t2=i/6;slabA.push([ -0.04*W+t2*0.62*W+rr(-0.03,0.03)*W, H*(0.30+t2*0.62) ]);}
  slab(slabA,C.ember,C.deepred,0.86);
  var crSet=[C.crimson,C.blood,C.ember,C.rust,C.crimson];
  for(n=0;n<30;n++){
    x=rr(-0.05*W,0.72*W);y=rr(0.03*H,0.96*H);
    chain(x,y,rint(5,8),D*rr(0.04,0.08),u*rr(10,38),u*rr(40,110),crSet,0.28,0.8,
      function(px,py){return 0.72+0.55*Math.sin(py*0.0018-px*0.0009);});
  }
  /* 上右第二块红：更薄、更亮，压住钴蓝 */
  var slabB=[];
  for(i=0;i<=5;i++){var t3=i/5;slabB.push([ W*(0.52+t3*0.62), H*(0.02+t3*0.20)+rr(-0.03,0.03)*H ]);}
  for(i=5;i>=0;i--){var t4=i/5;slabB.push([ W*(0.54+t4*0.60), H*(0.22+t4*0.16) ]);}
  slab(slabB,C.blood,C.ember,0.72);
  for(n=0;n<14;n++){
    x=rr(0.5*W,1.05*W);y=rr(0,H*0.42);
    chain(x,y,rint(4,7),D*0.045,u*rr(8,30),u*rr(36,90),[C.crimson,C.ember,C.rust],0.25,0.7,
      function(px,py){return -0.25+0.5*Math.sin(px*0.003+py*0.002);});
  }
  /* 中央垂直血色热流（脸的后方在烧） */
  for(n=0;n<16;n++){
    x=W*rr(0.30,0.62);y=rr(0,H);
    chain(x,y,rint(4,8),D*0.05,u*rr(14,46),u*rr(40,120),[C.crimson,C.deepred,C.blood,C.ember],0.2,0.55,
      function(px,py){return 1.52+0.22*Math.sin(py*0.004);});
  }
  /* 钴蓝反扑：从右下方斜切进来，和红正面对撞 */
  var slabC=[];
  for(i=0;i<=6;i++){var t5=i/6;slabC.push([ W*(0.52+t5*0.62), H*(1.02-t5*0.58)+rr(-0.04,0.04)*H ]);}
  for(i=6;i>=0;i--){var t6=i/6;slabC.push([ W*(0.40+t6*0.62), H*(1.04-t6*0.66) ]);}
  slab(slabC,C.ultra,C.abyss,0.80);
  for(n=0;n<26;n++){
    x=rr(0.36*W,1.05*W);y=rr(0.38*H,1.05*H);
    chain(x,y,rint(4,8),D*rr(0.04,0.09),u*rr(10,40),u*rr(44,120),[C.ultra,C.cobalt,C.steel,C.ultra,C.cyan],0.2,0.66,
      function(px,py){return -0.44+0.5*Math.cos(px*0.0022+py*0.0014);});
  }
  /* 蓝的冷亮笔：贴着红的边上走，靠对比而不是靠混色 */
  for(n=0;n<26;n++){
    x=rr(0.42*W,1.0*W);y=rr(0.30*H,1.0*H);
    brush(x,y,x+rr(-0.06,0.06)*W,y+rr(-0.05,0.05)*H,u*rr(3,12),
      mix(C.cyan,C.steel,rnd()),rr(0.14,0.42));
  }
  /* 骨白刮痕：少量、锐利，用来把红蓝分开 */
  for(n=0;n<22;n++){
    x=rr(0,W);y=rr(0,H);
    var a=rr(-0.9,-0.2);
    brush(x,y,x+Math.cos(a)*D*rr(0.05,0.16),y+Math.sin(a)*D*rr(0.05,0.16),
      u*rr(2,9),mix(C.bone,C.ochre,rnd()),rr(0.05,0.2));
  }
  /* 黑的裂缝：不让红蓝直接相融成脏紫 */
  for(n=0;n<40;n++){
    x=rr(0,W);y=rr(0,H);
    var a2=rr(-2.6,-1.4);
    brush(x,y,x+Math.cos(a2)*D*rr(0.02,0.10),y+Math.sin(a2)*D*rr(0.02,0.10),
      u*rr(2,7),C.ink,rr(0.12,0.4));
  }
}

/* ---------- 脸：极度扭曲的呐喊 ---------- */
var HEAD=[[0.00,-1.04],[0.40,-0.97],[0.76,-0.68],[0.91,-0.26],[0.95,0.08],
  [0.88,0.36],[0.72,0.64],[0.46,0.88],[0.17,1.01],[-0.05,1.03],
  [-0.32,0.96],[-0.58,0.78],[-0.79,0.48],[-0.92,0.12],[-0.95,-0.26],
  [-0.84,-0.66],[-0.58,-0.93],[-0.27,-1.03]];

function paintFace(W,H){
  /* 先定"嘴的下缘落在 78.5% 高度"，再反推头心 —— 字永远压在伤口下面 */
  var fh=Math.min(H*0.515,W*0.86), fw=Math.min(fh/1.12,W*0.72);
  var fy=H*0.785-fh*0.9125, fx=W*0.465;
  var tilt=-0.075, co=Math.cos(tilt), si=Math.sin(tilt);
  var U=fw*0.01;                     /* 一个"编织单位" */
  function P(u,v){var x=u*fw,y=v*fh;return [fx+x*co-y*si, fy+x*si+y*co];}
  function PD(u,v,a,d){return P(u+Math.cos(a)*d,v+Math.sin(a)*d);}
  function headMap(){var i,p,out=[];for(i=0;i<HEAD.length;i++){p=P(HEAD[i][0],HEAD[i][1]);out.push(p);}return out;}
  function fleshAngle(u,v){
    var brow=0.10+0.62*u, cheek=1.22+0.55*u-0.35*Math.sin(v*2.2);
    var t=clamp((-v-0.28)/0.58,0,1);
    return brow*t+cheek*(1-t);
  }

  /* 底：肉的暖调，上黄下血 */
  ctx.save();
  ctx.beginPath();smooth(headMap(),true);
  var gp=ctx.createLinearGradient(fx,fy-fh,fx,fy+fh*1.05);
  gp.addColorStop(0,rgba(mix(C.ochre,C.bone,0.35),0.96));
  gp.addColorStop(0.42,rgba(C.flesh,0.94));
  gp.addColorStop(0.78,rgba(mix(C.crimson,C.rust,0.4),0.94));
  gp.addColorStop(1,rgba(C.deepred,0.92));
  ctx.fillStyle=gp;ctx.fill();
  ctx.clip();

  /* 肉笔：顺脸型走，光在右、影在左 */
  var i,u,v,p1,p2,warm,cols,a,len;
  for(i=0;i<470;i++){
    u=rr(-1.02,1.02); v=rr(-1.06,1.06);
    warm=clamp((u+0.34)/1.15,0,1);
    a=fleshAngle(u,v);
    len=rr(0.05,0.19);
    p1=P(u,v); p2=PD(u,v,a,len);
    cols=[mix(C.flesh,C.ochre,warm*0.85),mix(C.rust,C.flesh,0.35+rnd()*0.4),
          mix(C.crimson,C.blood,0.45),mix(C.ochre,C.bone,warm*0.6),mix(C.mauve,C.cobalt,0.5)];
    brush(p1[0],p1[1],p2[0],p2[1],U*rr(3,13),cols[(rnd()*cols.length)|0],rr(0.10,0.42));
  }
  /* 冷影：眼窝、颧下、下颌、左半脸 —— 用 multiply 让阴影变蓝不变灰 */
  ctx.globalCompositeOperation='multiply';
  var sh=[[0.02,-0.30,0.72,0.44,0.55],[0.0,0.16,0.55,0.30,0.42],[-0.05,0.74,0.80,0.34,0.66],
          [-0.72,-0.02,0.55,0.85,0.72],[0.16,-0.62,0.70,0.26,0.55],[0.60,0.30,0.30,0.45,0.60]];
  for(i=0;i<sh.length;i++){
    var q=P(sh[i][0],sh[i][1]);
    var rg=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],Math.max(fw,fh)*sh[i][2]);
    rg.addColorStop(0,rgba([64,84,150],sh[i][3]));
    rg.addColorStop(1,rgba([64,84,150],0));
    ctx.fillStyle=rg;
    ctx.fillRect(q[0]-fw,q[1]-fh,fw*2,fh*2);
  }
  ctx.globalCompositeOperation='source-over';
  /* 右脸的高光笔触：骨白刮上去 */
  for(i=0;i<90;i++){
    u=rr(0.02,0.95); v=rr(-0.92,0.62);
    if(rnd()>0.55)continue;
    a=fleshAngle(u,v);
    p1=P(u,v); p2=PD(u,v,a,rr(0.04,0.13));
    brush(p1[0],p1[1],p2[0],p2[1],U*rr(1.5,6),mix(C.bone,C.ochre,rr(0,0.7)),rr(0.10,0.34));
  }
  /* --features-- */
  var anchors=[];
  function ell(cx,cy,rx,ry,rot,j2){
    var pts=[],i,n=20,a,k,x,y;
    for(i=0;i<n;i++){a=i/n*6.28318;k=1+(j2?rr(-j2,j2):0);
      x=Math.cos(a)*rx*k;y=Math.sin(a)*ry*k;
      pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]);}
    return pts;
  }
  function eye(cu,cv,ru,rv,tilt2,irisDx,irisDy,irisR){
    var c=P(cu,cv), rx=ru*fw, ry=rv*fh, rot=tilt2;
    /* 眼窝：一圈稠密的暗笔 */
    var i2,a2,p,k;
    for(i2=0;i2<52;i2++){
      a2=rr(0,6.283);
      var r0=rr(1.05,1.9);
      var q1=[c[0]+Math.cos(a2)*rx*r0,c[1]+Math.sin(a2)*ry*r0];
      var q2=[c[0]+Math.cos(a2)*rx*rr(1.0,1.45),c[1]+Math.sin(a2)*ry*rr(1.0,1.45)];
      brush(q1[0],q1[1],q2[0],q2[1],U*rr(3,11),
        rnd()>0.35?mix(C.ink,C.cobalt,rr(0,0.6)):mix(C.deepred,C.ink,0.5),rr(0.12,0.5));
    }
    /* 眼白 */
    ctx.beginPath();smooth(ell(c[0],c[1],rx,ry,rot,0.05),true);
    var sg=ctx.createLinearGradient(c[0],c[1]-ry,c[0],c[1]+ry);
    sg.addColorStop(0,rgba(mix(C.ivory,C.bone,0.3),1));
    sg.addColorStop(0.55,rgba(mix(C.bone,C.ochre,0.35),1));
    sg.addColorStop(1,rgba(mix(C.bone,C.crimson,0.30),1));
    ctx.fillStyle=sg;ctx.fill();
    /* 血丝 */
    for(i2=0;i2<10;i2++){
      a2=rr(0,6.283);
      var b1=[c[0]+Math.cos(a2)*rx*0.95,c[1]+Math.sin(a2)*ry*0.95];
      var b2=[c[0]+Math.cos(a2+rr(-0.3,0.3))*rx*rr(0.3,0.55),c[1]+Math.sin(a2+rr(-0.3,0.3))*ry*rr(0.3,0.55)];
      brush(b1[0],b1[1],b2[0],b2[1],U*rr(0.7,2.2),mix(C.crimson,C.blood,rr(0,0.7)),rr(0.2,0.6));
    }
    /* 虹膜 + 瞳孔：偏上偏外，像被掐住 */
    var ix=c[0]+irisDx*rx, iy=c[1]+irisDy*ry, ir=irisR*rx;
    var ig=ctx.createRadialGradient(ix,iy,ir*0.1,ix,iy,ir*1.25);
    ig.addColorStop(0,rgba([36,10,14],1));
    ig.addColorStop(0.45,rgba(mix(C.blood,C.rust,0.5),1));
    ig.addColorStop(1,rgba(mix(C.crimson,C.ink,0.55),1));
    ctx.beginPath();smooth(ell(ix,iy,ir,ir*0.96,0,0.10),true);ctx.fillStyle=ig;ctx.fill();
    ctx.beginPath();smooth(ell(ix,iy,ir*0.34,ir*0.34,0,0.2),true);ctx.fillStyle=rgba(C.pitch,1);ctx.fill();
    ctx.beginPath();smooth(ell(ix-ir*0.28,iy-ir*0.32,ir*0.20,ir*0.17,0,0.3),true);
    ctx.fillStyle=rgba(C.ivory,0.92);ctx.fill();
    /* 上下眼睑：重、湿、外翻 */
    for(i2=0;i2<26;i2++){
      a2=rr(0,6.283);
      var l1=[c[0]+Math.cos(a2)*rx*1.02,c[1]+Math.sin(a2)*ry*1.02];
      var l2=[c[0]+Math.cos(a2)*rx*rr(1.2,1.55),c[1]+Math.sin(a2)*ry*rr(1.2,1.55)];
      brush(l1[0],l1[1],l2[0],l2[1],U*rr(2.5,7),
        Math.sin(a2)<0?mix(C.deepred,C.crimson,0.5):mix(C.blood,C.ink,0.4),rr(0.2,0.6));
    }
    /* 外凸感：上缘一滴湿亮，下缘一条压在肉里的暗 */
    brush(c[0]-rx*0.46,c[1]-ry*0.60,c[0]+rx*0.34,c[1]-ry*0.74,Math.max(1.3,ry*0.11),C.ivory,0.50);
    brush(c[0]-rx*0.26,c[1]+ry*0.94,c[0]+rx*0.42,c[1]+ry*0.84,Math.max(1.4,ry*0.18),mix(C.ink,C.blood,0.45),0.42);
    anchors.push([c[0]+rx*0.05,c[1]+ry*1.05,1.0]);
    return c;
  }
  eye(-0.415,-0.285,0.245,0.160,0.10,-0.16,-0.20,1.30);
  eye( 0.405,-0.320,0.285,0.195,-0.13, 0.22,-0.26,1.05);

  /* 鼻：骨梁 + 两个外扩的鼻孔 */
  var nb1=P(-0.03,-0.20), nb2=P(0.04,0.05);
  brush(nb1[0],nb1[1],nb2[0],nb2[1],U*rr(14,20),mix(C.bone,C.ochre,0.45),0.28);
  for(i=0;i<54;i++){
    var t=i/54, uu=-0.06+0.14*t+rr(-0.05,0.05), vv=-0.16+0.24*t;
    var pp1=P(uu+rr(-0.02,0.02),vv), pp2=P(uu+rr(0.02,0.09),vv+rr(-0.01,0.02));
    brush(pp1[0],pp1[1],pp2[0],pp2[1],U*rr(1.5,6),rnd()>0.5?mix(C.ink,C.cobalt,0.35):mix(C.rust,C.deepred,0.5),rr(0.1,0.42));
  }
  function nostril(cu,cv,ru,rv,sgn){
    var c=P(cu,cv), rx=ru*fw, ry=rv*fh;
    var h1=ctx.createRadialGradient(c[0],c[1],rx*0.05,c[0],c[1],rx*1.5);
    h1.addColorStop(0,rgba([8,2,4],1));h1.addColorStop(0.62,rgba([20,5,9],0.9));h1.addColorStop(1,rgba(C.ink,0));
    ctx.fillStyle=h1;ctx.beginPath();smooth(ell(c[0],c[1],rx,ry,rr(-0.4,0.4),0.14),true);ctx.fill();
    var i2;
    for(i2=0;i2<30;i2++){
      var a2=rr(0,6.283), k=rr(1.0,1.5);
      var p1=[c[0]+Math.cos(a2)*rx*k,c[1]+Math.sin(a2)*ry*k];
      var p2=[c[0]+Math.cos(a2+0.4*sgn)*rx*(k+rr(0.25,0.7)),c[1]+Math.sin(a2)*ry*(k+rr(0.2,0.6))];
      brush(p1[0],p1[1],p2[0],p2[1],U*rr(2,7),mix(C.crimson,C.deepred,rr(0,0.6)),rr(0.16,0.55));
    }
    anchors.push([c[0]+rx*1.1,c[1]+ry*0.6,0.8]);
  }
  nostril(-0.165,0.118,0.098,0.058,-1);
  nostril( 0.195,0.132,0.112,0.066, 1);
  /* 鼻翼的骨白高光 */
  for(i=0;i<26;i++){
    var uu2=rr(-0.30,0.34), vv2=rr(0.00,0.16);
    var q1=P(uu2,vv2),q2=P(uu2+rr(-0.05,0.05),vv2+rr(-0.03,0.03));
    brush(q1[0],q1[1],q2[0],q2[1],U*rr(1,3.5),mix(C.bone,C.ochre,rr(0,0.55)),rr(0.12,0.4));
  }

  /* 嘴：撕裂的黑色呐喊口 */
  var MC=[0.030,0.455], MR=[0.420,0.305];
  var rimU=[],i3,a3;
  for(i3=0;i3<26;i3++){
    a3=i3/26*6.28318;
    var m=1+(rnd()-0.5)*0.13;
    rimU.push([MC[0]+Math.cos(a3)*MR[0]*m, MC[1]+Math.sin(a3)*MR[1]*m]);
  }
  var rimS=[];for(i3=0;i3<rimU.length;i3++)rimS.push(P(rimU[i3][0],rimU[i3][1]));
  /* 口腔 */
  ctx.beginPath();smooth(rimS,true);
  var mg=ctx.createRadialGradient(fx+MC[0]*fw,fy+(MC[1]-0.16)*fh,fw*0.02,fx+MC[0]*fw,fy+MC[1]*fh,fw*0.42);
  mg.addColorStop(0,rgba([26,3,7],1));mg.addColorStop(0.55,rgba([10,2,5],1));mg.addColorStop(1,rgba(C.pitch,1));
  ctx.fillStyle=mg;ctx.fill();
  ctx.save();ctx.clip();
  for(i3=0;i3<70;i3++){
    var uu3=rr(-0.30,0.34), vv3=rr(0.28,0.76);
    var t1=P(uu3,vv3), t2=P(uu3+rr(-0.02,0.02),vv3+rr(0.03,0.14));
    brush(t1[0],t1[1],t2[0],t2[1],U*rr(2,8),
      rnd()>0.5?mix(C.deepred,C.ink,0.5):mix(C.blood,C.ink,0.35),rr(0.14,0.5));
  }
  /* 舌根 */
  var tg=P(0.03,0.700);
  var tg2=ctx.createRadialGradient(tg[0],tg[1],0,tg[0],tg[1],fw*0.22);
  tg2.addColorStop(0,rgba(mix(C.blood,C.rust,0.35),0.85));tg2.addColorStop(1,rgba(C.blood,0));
  ctx.fillStyle=tg2;ctx.beginPath();smooth(ell(tg[0],tg[1],fw*0.22,fh*0.10,0.06,0.1),true);ctx.fill();
  ctx.restore();
  /* 牙：上下两排参差的骨白尖 */
  function teeth(up){
    var n=rnd()>0.5?11:12, i4;
    for(i4=0;i4<n;i4++){
      var aa=up?(Math.PI*(1.03+(i4+0.5)/n*0.94)):(Math.PI*(0.06+(i4+0.5)/n*0.88));
      var cu=MC[0]+Math.cos(aa)*MR[0]*0.97, cv=MC[1]+Math.sin(aa)*MR[1]*0.97;
      var tipV=cv+(up?1:-1)*rr(0.10,0.20);
      var pA=P(cu,cv);
      var wdt=rr(0.030,0.062);
      var q1=P(cu-wdt,cv+(up?0.01:-0.01));
      var q2=P(cu+wdt,cv+(up?0.01:-0.01));
      var q3=P(cu+wdt*0.45,tipV);
      var q4=P(cu-wdt*0.42,tipV);
      ctx.beginPath();ctx.moveTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.lineTo(q3[0],q3[1]);ctx.lineTo(q4[0],q4[1]);ctx.closePath();
      var tgg=ctx.createLinearGradient(pA[0],pA[1],pA[0],pA[1]+(up?fh*0.2:-fh*0.2));
      tgg.addColorStop(0,rgba(mix(C.ivory,C.bone,0.4),0.98));
      tgg.addColorStop(1,rgba(mix(C.bone,C.ochre,0.55),0.92));
      ctx.fillStyle=tgg;ctx.fill();
      brush(q1[0],q1[1],q3[0],q3[1],U*rr(1,2.6),mix(C.ink,C.rust,0.4),rr(0.15,0.4));
    }
  }
  teeth(true);teeth(false);
  /* 唇：围绕口的一圈厚笔，内缘湿亮 */
  for(i3=0;i3<118;i3++){
    a3=rr(0,6.283);
    var kk1=rr(0.97,1.06), kk2=rr(1.34,1.78);
    var pA3=P(MC[0]+Math.cos(a3)*MR[0]*kk1, MC[1]+Math.sin(a3)*MR[1]*kk1);
    var pB3=P(MC[0]+Math.cos(a3)*MR[0]*kk2, MC[1]+Math.sin(a3)*MR[1]*kk2);
    brush(pA3[0],pA3[1],pB3[0],pB3[1],U*rr(3,10),
      Math.sin(a3)<0?mix(C.deepred,C.ink,0.45):mix(C.crimson,C.blood,rr(0,0.7)),rr(0.16,0.55));
  }
  /* 唇角撕裂：向两侧甩出去的碎条 */
  for(i3=0;i3<2;i3++){
    var sgn=i3===0?-1:1;
    var base=P(MC[0]+sgn*MR[0]*1.0, MC[1]+0.02);
    var j,m;
    for(j=0;j<16;j++){
      var aa2=rr(-0.55,0.55)+(sgn<0?Math.PI:0);
      var len2=rr(0.05,0.20)*fw;
      brush(base[0],base[1],base[0]+Math.cos(aa2)*len2,base[1]+Math.sin(aa2)*len2*0.8,
        U*rr(1.4,6),rnd()>0.4?mix(C.crimson,C.blood,rr(0,0.6)):mix(C.ink,C.crimson,0.4),rr(0.2,0.6));
    }
    anchors.push([base[0]+sgn*fw*0.30,base[1]+fh*0.02,1.4]);
  }
  /* 下唇垂血 */
  for(i3=0;i3<7;i3++){
    var bx=fx+MC[0]*fw+rr(-0.16,0.16)*fw, by=fy+MC[1]*fh+fh*0.24;
    var bl=rr(0.04,0.16)*fh;
    brush(bx,by,bx+rr(-4,4),by+bl,U*rr(2,7),mix(C.deepred,C.crimson,rr(0.1,0.6)),rr(0.3,0.7));
  }
  anchors.push([fx+MC[0]*fw,fy+MC[1]*fh+fh*0.26,1.6]);

  ctx.restore();
  /* --edge-erode-- */
  var hm=headMap(),i5;
  for(i5=0;i5<130;i5++){
    var idx=(rnd()*hm.length)|0, nx2=hm[(idx+1)%hm.length];
    var t5=rnd();
    var ex=hm[idx][0]+(nx2[0]-hm[idx][0])*t5, ey=hm[idx][1]+(nx2[1]-hm[idx][1])*t5;
    var dirA=Math.atan2(ey-(fy),ex-(fx))+rr(-0.9,0.9);
    var L5=rr(0.02,0.10)*fw;
    brush(ex,ey,ex+Math.cos(dirA)*L5,ey+Math.sin(dirA)*L5,U*rr(4,18),
      rnd()>0.45?mix(C.crimson,C.ink,rr(0,0.7)):mix(C.cobalt,C.ink,rr(0,0.6)),rr(0.2,0.75));
  }
  return {P:P,PD:PD,fx:fx,fy:fy,fw:fw,fh:fh,U:U,co:co,si:si,mc:MC,mr:MR,anchors:anchors};
}

/* ---------- 收尾：纸纹、颗粒、边角 ---------- */
function paintGrain(W,H){
  var pat=ctx.createPattern(NOISE,'repeat');
  if(pat){
    ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.16;
    ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);
    ctx.scale(2.7,2.7);ctx.globalAlpha=0.10;
    ctx.fillRect(0,0,W/2.7,H/2.7);
    ctx.restore();
  }
  var i,x,y,a;
  for(i=0;i<220;i++){
    x=rr(0,W);y=rr(0,H);
    a=rr(0,6.283);
    brush(x,y,x+Math.cos(a)*rr(2,14),y+Math.sin(a)*rr(2,14),rr(0.4,1.1),
      rnd()>0.5?C.bone:C.ink,rr(0.05,0.14));
  }
  var g=ctx.createRadialGradient(W*0.5,H*0.46,Math.min(W,H)*0.22,W*0.5,H*0.5,Math.max(W,H)*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(3,1,4,0.72)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* ---------- 覆盖层：横贯的劈砍 + 溅洒 + 歌词暗带 ---------- */
function paintOver(W,H){
  var D=Math.max(W,H), U=D*0.001, i;
  /* 三道最狠的红 */
  var slash=[[-0.15,0.12,0.92,0.44,C.ember,0.26],[-0.05,0.60,0.86,0.26,C.crimson,0.24],[0.32,-0.10,0.55,0.99,C.blood,0.28]];
  for(i=0;i<slash.length;i++){
    var s=slash[i];
    brush(W*s[0],H*s[1],W*s[2],H*s[3],U*rr(30,72),s[4],s[5]);
    brush(W*s[0],H*s[1]+U*13,W*s[2],H*s[3]+U*13,U*rr(8,18),C.ink,0.22);
  }
  /* 两道黑，切开红蓝 */
  for(i=0;i<2;i++){
    var y0=H*(0.18+i*0.42);
    brush(W*-0.06,y0,W*1.05,y0+H*rr(-0.12,0.12),U*rr(22,55),C.ink,rr(0.18,0.30));
  }
  /* 一道骨白：最亮的一刀 */
  brush(W*0.08,H*0.86,W*0.92,H*0.20,U*rr(6,14),mix(C.ivory,C.bone,0.4),0.30);
  /* 溅洒 */
  for(i=0;i<130;i++){
    var x=rr(0,W),y=rr(0,H),a=rr(0,6.283),L=rr(0.4,3.2)*U*3;
    var cc=(i%9===0)?mix(ACC,C.crimson,0.55):(rnd()>0.4?mix(C.crimson,C.ember,rnd()):mix(C.blood,C.ink,0.4));
    brush(x,y,x+Math.cos(a)*L,y+Math.sin(a)*L,rr(0.8,4.5),cc,rr(0.15,0.6));
  }
  /* 干笔刮痕：把整幅画统一成一张纸 */
  for(i=0;i<70;i++){
    var sx=rr(-0.1,1.05)*W, sy=rr(-0.05,1.05)*H;
    var sa=rr(-1.35,-0.18), sl=rr(0.03,0.22)*Math.max(W,H);
    brush(sx,sy,sx+Math.cos(sa)*sl,sy+Math.sin(sa)*sl,rr(0.5,2.4),
      rnd()>0.55?C.ink:mix(C.bone,C.ochre,0.6),rr(0.04,0.16));
  }
  /* 从画面上缘淌下来的旧血（静态的那层，动的在 drip 层） */
  for(i=0;i<6;i++){
    var tx=rr(0.05,0.95)*W, ty=-8, tl=rr(0.10,0.34)*H;
    for(var k2=0;k2<3;k2++){
      brush(tx+rr(-6,6),ty+tl*k2*0.34,tx+rr(-8,8),ty+tl*(k2+1)*0.34,
        rr(2,9),mix(C.deepred,C.crimson,rr(0.1,0.6)),rr(0.25,0.55));
    }
  }
  /* 歌词暗带：下三分之一沉下去（字是骨白的，正需要这块黑） */
  var bg=ctx.createLinearGradient(0,H*0.64,0,H*1.02);
  bg.addColorStop(0,'rgba(6,2,5,0)');bg.addColorStop(0.55,'rgba(6,2,5,0.55)');bg.addColorStop(1,'rgba(4,1,4,0.86)');
  ctx.fillStyle=bg;ctx.fillRect(0,H*0.64,W,H*0.38);
  for(i=0;i<26;i++){
    var bx=rr(-0.05,1.02)*W, by=H*rr(0.64,0.99);
    brush(bx,by,bx+rr(-0.2,0.2)*W,by+rr(-0.02,0.02)*H,U*rr(6,26),
      rnd()>0.5?mix(C.pitch,C.blood,0.30):mix(C.pitch,C.cobalt,0.28),rr(0.1,0.34));
  }
}

/* ================= GPU：让这幅画还在湿着、还在渗 ================= */
var GLB={ok:false,gl:null,prog:null,tex:null,u:{},buf:null,iw:0,ih:0};
var VS='attribute vec2 p;varying vec2 vUv;void main(){vUv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
var FS=[
'precision highp float;',
'varying vec2 vUv;',
'uniform sampler2D uTex;uniform vec2 uRes;',
'uniform float uT,uBeat,uLevel,uBass,uTreb,uAmp;',
'float h21(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}',
'float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);',
' float a=h21(i),b=h21(i+vec2(1.0,0.0)),c=h21(i+vec2(0.0,1.0)),d=h21(i+vec2(1.0,1.0));',
' return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}',
'float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<3;i++){s+=a*n2(p);p*=2.07;a*=0.5;}return s;}',
'void main(){',
' vec2 uv=vUv;float asp=uRes.x/max(uRes.y,1.0);',
' float t=uT*0.05;',
' vec2 p=vec2(uv.x*asp,uv.y);',
' float qx=fbm(p*2.1+t);',
' float qy=fbm(p*2.1+vec2(5.2,1.3)-t*0.8);',
' vec2 q=vec2(qx,qy);',
' float wx=fbm(p*2.9+q*1.6+t*0.9)-0.5;',
' float wy=fbm(p*2.9+q*1.6+vec2(3.1,7.7)-t*0.7)-0.5;',
' float amp=uAmp*(0.0032+0.011*uBass+0.005*uLevel);',
' uv.x+=wx*amp+(qx-0.5)*amp*0.45;',
' uv.y+=wy*amp*0.85;',
' float sl=floor(vUv.y*24.0);',
' float rnd=h21(vec2(sl,3.7));',
' float tear=step(0.80,rnd)*uBeat*uBeat*0.030;',
' uv.x+=tear*(h21(vec2(sl,9.1))-0.5)*2.0;',
' uv=(uv-0.5)*(1.0+0.010*uBass*uBeat)+0.5;',
' vec2 dir=normalize(uv-vec2(0.5));',
' float ca=(0.0008+0.0045*uTreb)*uAmp;',
' vec3 col;',
' col.r=texture2D(uTex,uv+dir*ca).r;',
' col.g=texture2D(uTex,uv).g;',
' col.b=texture2D(uTex,uv-dir*ca).b;',
' float b1=texture2D(uTex,uv+vec2(0.007,0.005)).r;',
' float b2=texture2D(uTex,uv+vec2(-0.007,0.005)).r;',
' float b3=texture2D(uTex,uv+vec2(0.0,-0.008)).r;',
' float hot=max(0.0,b1+b2+b3-1.55);',
' col+=vec3(0.95,0.16,0.14)*hot*(0.35+0.9*uLevel)*0.55;',
' float lum=dot(col,vec3(0.299,0.587,0.114));',
' col=mix(vec3(lum),col,1.14);',
' col=pow(max(col,vec3(0.0)),vec3(0.94));',
' float vg=1.0-0.42*dot(vUv-vec2(0.5),vUv-vec2(0.5))*1.6;',
' col*=mix(1.0,vg,0.85);',
' float gr=h21(vUv*uRes*0.9+fract(uT)*53.0);',
' col+=(gr-0.5)*0.050;',
' gl_FragColor=vec4(col,1.0);',
'}'].join('\n');

function sh(type,src){
  var gl=GLB.gl,s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){gl.deleteShader(s);return null;}
  return s;
}
function glFallback(){
  V.gl=false;GLB.ok=false;
  try{glc.style.display='none';}catch(e){}
  if(!RM&&plate)plate.classList.add('breathe');
}
function glBoot(){
  var gl=null;
  try{gl=glc.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:false});}catch(e){gl=null;}
  if(!gl){glFallback();return;}
  GLB.gl=gl;
  var v=sh(gl.VERTEX_SHADER,VS),f=sh(gl.FRAGMENT_SHADER,FS);
  if(!v||!f){glFallback();return;}
  var pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){glFallback();return;}
  gl.useProgram(pr);
  GLB.prog=pr;
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var u={};
  ['uTex','uRes','uT','uBeat','uLevel','uBass','uTreb','uAmp'].forEach(function(k){u[k]=gl.getUniformLocation(pr,k);});
  GLB.u=u;
  var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  GLB.tex=tex;GLB.buf=buf;
  gl.uniform1i(u.uTex,0);gl.activeTexture(gl.TEXTURE0);
  GLB.ok=true;V.gl=true;
  glc.classList.add('on');
  glResize();glUpload();
}
function glResize(){
  if(!GLB.ok)return;
  var w=VIEW.w,h=VIEW.h,dpr=Math.min(1.35,window.devicePixelRatio||1);
  var iw=Math.max(2,Math.round(w*dpr)),ih=Math.max(2,Math.round(h*dpr));
  var cap=1.9e6;
  if(iw*ih>cap){var k=Math.sqrt(cap/(iw*ih));iw=Math.round(iw*k);ih=Math.round(ih*k);}
  GLB.iw=iw;GLB.ih=ih;
  glc.width=iw;glc.height=ih;
  GLB.gl.viewport(0,0,iw,ih);
}
function glUpload(){
  if(!GLB.ok)return;
  var gl=GLB.gl;
  if(!plate.width||!plate.height)return;
  try{
    gl.bindTexture(gl.TEXTURE_2D,GLB.tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,plate);
  }catch(e){}
}
function glDraw(t){
  if(!GLB.ok)return;
  var gl=GLB.gl,u=GLB.u;
  gl.uniform2f(u.uRes,GLB.iw,GLB.ih);
  gl.uniform1f(u.uT,t);
  gl.uniform1f(u.uBeat,FX.beat);
  gl.uniform1f(u.uLevel,FX.level);
  gl.uniform1f(u.uBass,FX.bass);
  gl.uniform1f(u.uTreb,FX.treb);
  gl.uniform1f(u.uAmp,FX.amp);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function paint(){
  var W=VIEW.w,H=VIEW.h;
  if(!(W>0)||!(H>0))return;
  var pkey=VIEW.pw+'x'+VIEW.ph+'#'+SONGSEED;
  if(pkey===PAINTKEY)return;
  ctx.setTransform(VIEW.ppu,0,0,VIEW.ppu,0,0);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,W,H);
  rs=(20241103^(SONGSEED>>>0))|0;if(!rs)rs=7;
  paintField(W,H);
  FACE=paintFace(W,H);
  paintOver(W,H);
  paintGrain(W,H);
  PAINTKEY=pkey;
  seedDrips();
  if(!GLB.booted){GLB.booted=true;glBoot();}
  else{glResize();glUpload();}
}

function resize(){
  var w=Math.max(320,Math.round(window.innerWidth||960));
  var h=Math.max(240,Math.round(window.innerHeight||540));
  if(!isFinite(w)||w<=0)w=960; if(!isFinite(h)||h<=0)h=540;
  var dpr=Math.min(1.5,window.devicePixelRatio||1);
  if(!isFinite(dpr)||dpr<=0)dpr=1;
  var s=dpr, big=Math.max(w,h)*s;
  if(big>1500)s=s*1500/big;
  VIEW.w=w;VIEW.h=h;VIEW.ppu=s;
  VIEW.pw=Math.max(2,Math.round(w*s));VIEW.ph=Math.max(2,Math.round(h*s));
  if(plate.width!==VIEW.pw||plate.height!==VIEW.ph){plate.width=VIEW.pw;plate.height=VIEW.ph;}
  /* 血滴层用低分辨率即可 */
  var dw=Math.max(2,Math.round(VIEW.pw*0.7)), dh=Math.max(2,Math.round(VIEW.ph*0.7));
  if(drip.width!==dw||drip.height!==dh){drip.width=dw;drip.height=dh;}
  dctx.setTransform(drip.width/w,0,0,drip.height/h,0,0);
  dctx.lineCap='round';
  if(!NOISE)makeNoise();
  if(GLB.ok)glResize();
}

/* ================= 歌词（必须读得出来） ================= */
var LYR={key:-2,spans:[],times:[],shown:0,n:0,fs:0};
var lyEl=$('#ly'), empEl=$('#empty'), e1El=$('#e1'), e2El=$('#e2');

function hashDeg(i){var h=Math.imul(i+7,2654435761)>>>0;return (h%8001)/1000-4;}

function fitLine(){
  var Wl=VIEW.w,Hl=VIEW.h;
  if(!(Wl>0)||!(Hl>0))return;
  var base=Math.min(78,Math.max(23,Wl*0.049+Hl*0.016));
  var maxH=Hl*0.33, fs=base, g=0;
  ln.style.fontSize=fs.toFixed(1)+'px';
  while(g++<16 && ln.scrollHeight>maxH+1 && fs>13){ fs*=0.92; ln.style.fontSize=fs.toFixed(1)+'px'; }
  LYR.fs=fs;
}
function setLine(i){
  var L=i>=0?V.lines[i]:null;
  var txt=(L&&L.text)?String(L.text):'';
  LYR.key=i;LYR.spans=[];LYR.times=[];LYR.shown=0;LYR.n=0;
  if(!txt){
    ln.textContent='';ln.removeAttribute('data-t');
    lyEl.classList.add('hide');
    return;
  }
  lyEl.classList.remove('hide');
  var arr;
  try{arr=Array.from(txt);}catch(e){arr=txt.split('');}
  if(!arr.length){ln.textContent='';return;}
  /* 病态超长句：不拆字，整句交给 CSS 折行，避免几千个 span */
  if(arr.length>190){
    ln.textContent=txt;ln.setAttribute('data-t',txt);ln.style.fontSize='';
    fitLine();
    return;
  }
  var n=arr.length,k,frag=document.createDocumentFragment();
  for(k=0;k<n;k++){
    var s=document.createElement('span');
    s.className='ch';
    s.textContent=(arr[k]===' ')?'\u00a0':arr[k];
    s.style.setProperty('--r',hashDeg(k).toFixed(1)+'deg');
    frag.appendChild(s);LYR.spans.push(s);
  }
  ln.textContent='';
  ln.setAttribute('data-t',txt);
  ln.appendChild(frag);
  LYR.n=n;
  var t0=L.t,dur=Math.max(0.4,L.dur||0),ch=L.chars;
  for(k=0;k<n;k++){
    LYR.times[k]=(ch&&ch.length===n)?ch[k].t:(t0+dur*(k/n)*0.92);
  }
  fitLine();
}
function tickChars(t){
  var s=LYR.shown,n=LYR.n,sp=LYR.spans,tm=LYR.times;
  while(s<n && tm[s]<=t){ sp[s].className='ch on'; s++; }
  LYR.shown=s;
}

/* ================= 反应：节拍 / 频谱 / 血滴 ================= */
var FX={beat:0,level:0,bass:0,treb:0,amp:1,idle:0};
var LASTT=0;
var DRIPS=[];

function updateFX(now){
  var dt=Math.min(0.12,Math.max(0,(now-LASTT)/1000));if(!dt)dt=0.016;
  LASTT=now;
  FX.level+=(LIVE.level-FX.level)*0.13;
  FX.bass +=(LIVE.bass -FX.bass )*0.15;
  FX.treb +=(LIVE.treble-FX.treb)*0.20;
  var b=FX.beat-dt*2.7;FX.beat=b<0?0:b;
  if(LIVE.level<=0.002&&BEAT.index<0){
    FX.idle=0.5+0.5*Math.sin(now*0.0015);
    FX.bass=Math.max(FX.bass,FX.idle*0.16);
    FX.level=Math.max(FX.level,FX.idle*0.20);
  }
  FX.amp=(RM?0.22:1)*(0.86+0.26*FX.level);
}
function seedDrips(){
  DRIPS=[];
  if(!FACE||!FACE.anchors||!(VIEW.w>0))return;
  var a=FACE.anchors,i,k;
  for(i=0;i<a.length;i++){
    var cnt=(i<5)?2:1;
    for(k=0;k<cnt;k++){
      DRIPS.push({x:a[i][0]+rr(-a[i][2]*10,a[i][2]*10),y:a[i][1]+rr(-3,3),
        len:0,sp:rr(0.035,0.10)*a[i][2],w:rr(1.3,3.6)*a[i][2],
        tr:rr(0.05,0.16)*a[i][2],ph:rr(0,6.283)});
    }
  }
  for(i=0;i<7;i++){
    DRIPS.push({x:rr(0.08,0.92)*VIEW.w,y:-4,len:0,sp:rr(0.02,0.05),
      w:rr(2,5.5),tr:rr(0.18,0.46),ph:rr(0,6.283)});
  }
}
function drawDrips(now,dt){
  var W=VIEW.w,H=VIEW.h;
  if(!(W>0))return;
  dctx.clearRect(0,0,W,H);
  var i,d,L,mx,a,ty;
  for(i=0;i<DRIPS.length;i++){
    d=DRIPS[i];
    L=d.tr*H;
    d.len+=(d.sp*H)*(0.45+FX.level*1.9+FX.bass*0.8)*dt;
    if(d.len>L||d.len<0){
      d.len=0;d.x+=rr(-10,10);
      d.sp=rr(0.02,0.07);
    }
    mx=Math.sin(now*0.0007+d.ph)*3.2;
    ty=d.y+d.len;
    a=0.42*(1-Math.min(1,d.len/(L*1.15)));
    if(a<=0.01)continue;
    dctx.strokeStyle=rgba(mix(C.deepred,C.crimson,0.45),a);
    dctx.lineWidth=d.w;
    dctx.beginPath();dctx.moveTo(d.x,d.y);
    dctx.quadraticCurveTo(d.x+mx*0.5,d.y+d.len*0.55,d.x+mx,ty);
    dctx.stroke();
    dctx.strokeStyle=rgba(mix(C.ember,C.bone,0.35),a*0.42);
    dctx.lineWidth=Math.max(0.5,d.w*0.22);
    dctx.beginPath();dctx.moveTo(d.x-d.w*0.22,d.y);
    dctx.quadraticCurveTo(d.x+mx*0.5-d.w*0.2,d.y+d.len*0.55,d.x+mx-d.w*0.18,ty);
    dctx.stroke();
    dctx.fillStyle=rgba(mix(C.crimson,C.blood,0.25),Math.min(0.85,a*1.5));
    dctx.beginPath();dctx.arc(d.x+mx,ty,d.w*0.62,0,6.283);dctx.fill();
  }
}

/* ================= 主循环 ================= */
function frame(now){
  var t0=performance.now();
  V.frames++;
  V.t=nowT();
  V.playing=T.playing;
  var i=findIdx(V.t);
  if(i!==LYR.key){V.idx=i;V.text=i>=0?String(V.lines[i].text||''):'';setLine(i);}
  if(LYR.n)tickChars(V.t);
  var dt=Math.min(0.12,Math.max(0.008,(now-LASTT)/1000));
  updateFX(now);
  GLB.t=(GLB.t||0)+dt*(T.playing?1:0.14);
  glDraw(GLB.t);
  drawDrips(now,dt*(T.playing?1:0.22));
  if(FX.beat>0.05){if(!SLAM){ln.classList.add('slam');SLAM=true;}}
  else if(SLAM){ln.classList.remove('slam');SLAM=false;}
  V.js=performance.now()-t0;
}
function loop(ts){frame(ts||performance.now());requestAnimationFrame(loop);}

function boot(){
  resize();
  if(RM)document.documentElement.classList.add('rm');
  /* 先把画面画出来再报 ready：播放器收到 ready 可能立刻截图 */
  try{paint();}catch(e){if(window.console&&console.error)console.error(e);}
  requestAnimationFrame(function(){ready();loop();});
  setTimeout(ready,90);
}

var sentReady=false;
function ready(){if(sentReady)return;sentReady=true;try{parent.postMessage({__c100:1,type:'ready'},'*');}catch(e){}}

var paintTimer=0;
function paintSoon(ms){clearTimeout(paintTimer);paintTimer=setTimeout(function(){resize();paint();},ms||20);}

window.addEventListener('resize',function(){paintSoon(230);});
window.addEventListener('orientationchange',function(){paintSoon(230);});
boot();
})();
</script>
