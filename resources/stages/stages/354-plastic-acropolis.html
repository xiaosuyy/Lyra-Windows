<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>354 · 塑料卫城</title>
<style>
  :root{
    --hot:#ff2fa4; --cool:#39f6ff; --violet:#7a2bff;
    --ink:#1c0c22; --plaster:#f5eff3; --plaster2:#e6d9e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0114}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--plaster)}
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
  canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
  #sky{z-index:1}

  /* ---- lyric price tag ---------------------------------------------- */
  #card{
    position:absolute;left:4.5vw;bottom:8.5vh;width:min(41vw,580px);z-index:6;
    padding:16px 22px 14px 26px;background:var(--plaster);color:var(--ink);
    transform:rotate(-1.6deg);overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5) inset;
  }
  #card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.42),rgba(255,255,255,0) 42%);
    opacity:.55;
  }
  #card .grain{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:.10;pointer-events:none}
  .punch{position:absolute;left:9px;top:9px;width:8px;height:8px;border-radius:50%;
    background:#0d0416;box-shadow:0 0 0 2px rgba(255,255,255,.65) inset}
  .tagrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
  .tag{font-size:10px;letter-spacing:.30em;text-transform:uppercase;color:#8c6f86;font-weight:700}
  .kana{font-size:11px;letter-spacing:.12em;color:#a98fa4;font-family:"Yu Gothic","MS Gothic",sans-serif}
  .lyric{position:relative;min-height:2.4em}
  #line{
    font-size:clamp(21px,2.75vw,44px);font-weight:800;line-height:1.22;
    letter-spacing:.01em;color:var(--ink);word-break:break-word;overflow-wrap:anywhere;
    max-height:31vh;overflow:hidden;
  }
  #line.long{font-size:clamp(17px,2.15vw,33px)}
  #line.xlong{font-size:clamp(14px,1.7vw,25px);line-height:1.3}
  #line .ch{color:#8d7689;transition:color .16s linear}
  #line .ch.on{color:#170819}
  #line .ch.sp{white-space:pre}
  .side{font-size:clamp(11px,1.05vw,14px);line-height:1.5;color:#7d6579;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #prev{margin-bottom:6px;opacity:.5}
  #next{margin-top:7px;opacity:.62}
  .price-row{display:flex;align-items:flex-end;gap:12px;margin-top:12px;
    border-top:1px dashed #bda8ba;padding-top:10px}
  .price{display:flex;align-items:baseline;gap:2px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .price .yen{font-size:clamp(15px,1.5vw,20px);color:var(--hot);transform:translateY(-2px)}
  .price .amt{font-size:clamp(24px,2.5vw,38px);line-height:.9;color:var(--ink)}
  .meta-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .meta-col .mini{font-size:9.5px;letter-spacing:.22em;color:#8c6f86;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barcode{display:flex;align-items:flex-end;gap:1.5px;height:22px}
  .barcode i{display:block;background:#2a1530;width:1px;height:100%}
  .stamp{
    flex:0 0 auto;font-size:clamp(9px,1vw,12px);font-weight:800;letter-spacing:.16em;
    color:#e0156f;border:2px solid #e0156f;padding:2px 6px;transform:rotate(-9deg);
    opacity:.9;white-space:nowrap;
  }
  .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(28,12,34,.10)}
  .prog i{display:block;height:100%;width:0;background:var(--hot)}

  /* ---- win95 window -------------------------------------------------- */
  .win{
    position:absolute;right:3.2vw;top:5vh;width:clamp(186px,17vw,268px);z-index:6;
    background:#c3c3c3;color:#111;
    border:2px solid;border-color:#fff #4c4c4c #4c4c4c #fff;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    font-family:Tahoma,"MS Sans Serif",Arial,sans-serif;font-size:11px;
  }
  .winbar{display:flex;align-items:center;gap:4px;height:18px;padding:0 2px 0 4px;
    background:linear-gradient(90deg,#00057a,#1084d0);color:#fff}
  .winbar b{flex:1;font-size:10px;font-weight:700;letter-spacing:.02em;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .winbar s{width:13px;height:12px;background:#c3c3c3;border:1px solid;
    border-color:#fff #4c4c4c #4c4c4c #fff;color:#111;font-size:9px;line-height:10px;
    text-align:center;text-decoration:none;font-style:normal}
  .winbody{display:flex;gap:8px;padding:8px}
  .cover{width:50px;height:50px;flex:0 0 auto;object-fit:cover;background:#8b8b8b;
    border:1px solid;border-color:#4c4c4c #fff #fff #4c4c4c}
  .cover.gone{background:repeating-linear-gradient(45deg,#9a9a9a 0 4px,#b8b8b8 4px 8px)}
  .wmeta{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .wmeta b{font-size:11px;line-height:1.2;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .wmeta span{font-size:10px;color:#3b3b3b;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .wstat{display:flex;align-items:center;gap:6px;padding:4px 6px;border-top:1px solid #8b8b8b;
    background:#c3c3c3;font-size:10px;font-variant-numeric:tabular-nums}
  .wstat .bars{flex:1;display:flex;align-items:flex-end;gap:1px;height:12px}
  .wstat .bars i{flex:1;background:#00057a;height:15%;display:block}

  /* ---- win95 dialog --------------------------------------------------- */
  #dialog{
    position:absolute;right:4.2vw;bottom:11vh;width:clamp(178px,16vw,244px);z-index:6;
    background:#c3c3c3;color:#111;transform:rotate(.9deg);
    border:2px solid;border-color:#fff #4c4c4c #4c4c4c #fff;
    box-shadow:0 14px 34px rgba(0,0,0,.5);
    font-family:Tahoma,"MS Sans Serif",Arial,sans-serif;
  }
  .dlgbar{display:flex;align-items:center;height:18px;padding:0 4px;
    background:linear-gradient(90deg,#00057a,#1084d0);color:#fff;font-size:10px}
  .dlgbar b{font-weight:700;letter-spacing:.04em}
  .dlgbody{display:flex;gap:9px;padding:10px 10px 6px;align-items:flex-start}
  .dlgicon{width:24px;height:24px;flex:0 0 auto;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fffbe6,#ffd447 58%,#b98600);
    border:1px solid #6b6b6b;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;color:#5a3c00;line-height:1}
  .dlgtext{font-size:10.5px;line-height:1.5}
  .dlgtext i{font-style:normal;color:#8a1080;font-weight:700}
  .dlgbtns{display:flex;gap:6px;justify-content:flex-end;padding:2px 8px 9px}
  .dlgbtns s{width:56px;height:17px;background:#c3c3c3;border:1px solid;
    border-color:#fff #4c4c4c #4c4c4c #fff;text-decoration:none;font-size:10px;
    display:flex;align-items:center;justify-content:center;color:#111}

  /* ---- decorations --------------------------------------------------- */
  #vert{position:absolute;right:1.6vw;top:34vh;z-index:4;writing-mode:vertical-rl;
    font-family:"Yu Gothic","MS Gothic",sans-serif;font-size:clamp(10px,1vw,13px);
    letter-spacing:.42em;color:rgba(255,235,245,.62);pointer-events:none}
  #colophon{position:absolute;left:3vw;top:3vh;z-index:4;
    font-size:clamp(6px,.72vw,10px);letter-spacing:.34em;color:rgba(255,225,240,.5);
    text-transform:uppercase;pointer-events:none}
  #floorline{position:absolute;left:0;right:0;bottom:1.5vh;z-index:4;text-align:center;
    font-weight:800;letter-spacing:.14em;pointer-events:none;
    color:rgba(255,214,233,.95);opacity:.21;
    transform:perspective(560px) rotateX(70deg);transform-origin:50% 100%;
    text-shadow:0 0 16px rgba(255,47,164,.55);
    font-size:clamp(22px,3.4vw,58px);white-space:nowrap;overflow:hidden}
  .fx{position:absolute;inset:0;pointer-events:none}


  /* ---- narrow / portrait --------------------------------------------- */
  @media (max-aspect-ratio: 5/6), (max-width: 820px){
    #card{left:4vw;right:4vw;width:auto;bottom:6vh;padding:13px 15px 11px 21px;
      transform:rotate(-1.1deg)}
    #line{font-size:clamp(19px,5.4vw,30px);max-height:26vh}
    #line.long{font-size:clamp(16px,4.6vw,24px)}
    #line.xlong{font-size:clamp(13px,3.8vw,19px)}
    .win{width:min(52vw,196px);right:3vw;top:2.4vh}
    .winbody{padding:6px;gap:6px}
    .cover{width:36px;height:36px}
    .wmeta b{font-size:10px}
    #vert{display:none}
    #dialog{display:none}
    #floorline{font-size:clamp(20px,7.4vw,40px);opacity:.14;bottom:1vh}
    #colophon{font-size:7px;letter-spacing:.18em;left:4vw;top:2.2vh;max-width:44vw;line-height:1.6}
    .stamp{display:none}
  }
  @media (max-height: 520px){
    #card{width:min(56vw,440px);left:4vw;bottom:3.5vh;right:auto}
    .win{display:none}
    #floorline{display:none}
    .lyric{min-height:0}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" class="layer"></canvas>

  <div id="floorline">—</div>
  <div id="card">
    <div class="punch"></div>
    <div class="tagrow">
      <span class="tag">EXHIBIT 07 · 展示品</span>
      <span class="kana">ナウ・プレイング</span>
    </div>
    <div class="lyric">
      <div class="side" id="prev"></div>
      <div id="line">—</div>
      <div class="side" id="next"></div>
    </div>
    <div class="price-row">
      <div class="price"><span class="yen">¥</span><span class="amt" id="price">0:00</span></div>
      <div class="meta-col">
        <div class="mini" id="mini">SALE · 税込 · 返品不可</div>
        <div class="barcode" id="barcode"></div>
      </div>
      <div class="stamp">SALE</div>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <img class="grain" src="assets/354-marble-grain.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="win" id="win">
    <div class="winbar"><b id="wintitle">354_MALL.EXE</b><s>_</s><s>□</s><s>×</s></div>
    <div class="winbody">
      <img class="cover" id="cover" alt="" onerror="this.classList.add('gone');this.removeAttribute('src')">
      <div class="wmeta"><b id="songname">—</b><span id="songartist"></span></div>
    </div>
    <div class="wstat"><span id="clock">00:00</span><span class="bars" id="bars"></span></div>
  </div>
  <div id="vert">モール・オブ・アテネ ・ 1995 ・ ポリプロピレン</div>
  <div id="dialog">
    <div class="dlgbar"><b>会計 · 確認</b></div>
    <div class="dlgbody">
      <span class="dlgicon">!</span>
      <span class="dlgtext">この石膏像を <i>¥3,540</i> で<br>お求めになりますか？<br>（税込・返品不可）</span>
    </div>
    <div class="dlgbtns"><s>はい</s><s>いいえ</s></div>
  </div>
  <div id="colophon">HELLENISTIC · PLASTIC · NEON · 消費期限 1999</div>
</div>
<script>
(function(){
  'use strict';
  var POST = function(m){ try{ parent.postMessage(m, '*'); }catch(e){} };
  var sky = document.getElementById('sky');
  var ctx = sky.getContext('2d');
  var lineEl = document.getElementById('line');

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
    accent: [255,47,164], duration: 0, song: {name:'', artists:'', cover:''},
    beatLevel: 0, beatPulse: 0, live: {bpm:0,level:0,bass:0,mid:0,treble:0}, phase: 0,
    reduced: false, gl: false, fpsAvg: 0, dbg: ''
  };
  var V = { w: 1440, h: 900, dpr: 1, horizon: 0 };

  /* ---- contract first: ready + __stage exist before any artwork work --- */
  var readySent = false;
  function ready(){
    if (readySent) return;
    readySent = true;
    POST({ __c100: 1, type: 'ready' });
  }
  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t || 0, playing: !!S.playing,
      frames: S.frames, js: (typeof S.js === 'number' ? S.js : 0), err: '',
      text: (S.idx >= 0 && S.lines[S.idx]) ? (S.lines[S.idx].text || '') : '',
      gl: !!S.gl, rm: !!S.reduced
    };
  };
  // frame #1 is allowed to be nothing but a blank gutter — ready does not wait for it
  try { requestAnimationFrame(function(){ ready(); }); } catch (e){ ready(); }
  setTimeout(ready, 350);

  function num(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  function readAccent(a){
    if (!a || !a.length) return [255,47,164];
    return [ Math.round(clamp(num(a[0],255),0,255)), Math.round(clamp(num(a[1],47),0,255)), Math.round(clamp(num(a[2],164),0,255)) ];
  }

  function prepare(p){
    p = p || {};
    var song = p.song || {};
    var artists = song.artists;
    if (Array.isArray(artists)) artists = artists.filter(function(x){ return typeof x === 'string' && x; }).join(' / ');
    else artists = (typeof artists === 'string') ? artists : '';

    S.song = {
      name: (typeof song.name === 'string') ? song.name : '',
      artists: artists || '',
      cover: (typeof song.cover === 'string') ? song.cover : ''
    };
    S.accent = readAccent(p.accent);
    applyAccent();
    S.duration = num(p.duration, 0);

    var raw = Array.isArray(p.lines) ? p.lines : [];
    var out = [];
    for (var i = 0; i < raw.length && i < 4000; i++){
      var L = raw[i]; if (!L) continue;
      var text = (typeof L.text === 'string') ? L.text : (L.text == null ? '' : String(L.text));
      var chars = Array.isArray(L.chars) ? L.chars : null;
      var dur = num(L.dur, 0);
      out.push({ t: num(L.t, 0), dur: dur > 0 ? dur : 0, text: text, chars: (chars && chars.length) ? chars : null });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    S.lines = out;
    S.t = clamp(S.t, 0, S.duration > 0 ? S.duration : 1e9);
    applySong();
    renderLine(true);
    scheduleFit();
  }

  function lineAt(t){
    var idx = -1;
    for (var i = 0; i < S.lines.length; i++){
      if (S.lines[i].t <= t + 0.03) idx = i; else break;
    }
    return idx;
  }

  /* ---- lyric card ---------------------------------------------------- */
  var el = {
    line: lineEl,
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
    price: document.getElementById('price'),
    prog: document.getElementById('prog'),
    clock: document.getElementById('clock'),
    bars: document.getElementById('bars'),
    songname: document.getElementById('songname'),
    songartist: document.getElementById('songartist'),
    cover: document.getElementById('cover'),
    floor: document.getElementById('floorline'),
    card: document.getElementById('card')
  };
  var cur = { idx: -2, spans: null, times: null, lit: -1 };
  var ui = { sec: -1, song: null, cover: null };

  function splitChars(txt){
    var out = [];
    for (var i = 0; i < txt.length && i < 1200; i++){
      var c = txt.charAt(i);
      var code = txt.charCodeAt(i);
      if (code >= 0xd800 && code <= 0xdbff && i + 1 < txt.length){
        out.push(c + txt.charAt(i + 1)); i++;
      } else out.push(c);
    }
    return out;
  }

  function buildLine(idx){
    var L = (idx >= 0 && S.lines[idx]) ? S.lines[idx] : null;
    cur.idx = idx; cur.spans = null; cur.times = null; cur.lit = -1;
    var txt = L ? (L.text || '') : '';
    el.prev.textContent = (idx > 0 && S.lines[idx - 1]) ? (S.lines[idx - 1].text || '') : '';
    el.next.textContent = (idx >= 0 && S.lines[idx + 1]) ? (S.lines[idx + 1].text || '')
                        : (idx < 0 && S.lines[0] ? (S.lines[0].text || '') : '');
    el.floor.textContent = txt || '—';
    el.line.className = '';
    el.line.style.fontSize = '';
    el.line.textContent = '';

    if (!L){
      if (!S.lines.length){
        el.line.textContent = '（此曲无词）';
        el.prev.textContent = 'NO LYRIC';
        el.next.textContent = 'インストゥルメンタル';
      } else el.line.textContent = '· · ·';
      return;
    }
    if (!txt){ el.line.textContent = '♪'; return; }

    var chars = splitChars(txt);
    var n = chars.length;
    el.line.className = n > 46 ? 'xlong' : (n > 26 ? 'long' : '');
    if (n > 260){ el.line.textContent = txt; fitLine(); return; }

    var per = (L.chars && L.chars.length === n) ? L.chars : null;
    var dur = L.dur > 0 ? L.dur : Math.max(1.8, n * 0.26);
    var times = new Array(n);
    var frag = document.createDocumentFragment();
    var spans = new Array(n);
    for (var i = 0; i < n; i++){
      var sp = document.createElement('span');
      sp.className = (chars[i] === ' ' || chars[i] === '\u3000') ? 'ch sp' : 'ch';
      sp.textContent = chars[i];
      times[i] = per ? num(per[i] && per[i].t, L.t + dur * (i / n)) : (L.t + dur * (i / n));
      frag.appendChild(sp);
      spans[i] = sp;
    }
    el.line.appendChild(frag);
    cur.spans = spans;
    cur.times = times;
    updateLit();
    fitLine();
  }

  // shrink only as far as needed, fixed iteration cap (never a decaying-step while)
  function fitLine(){
    if (!el.line || !el.line.parentNode) return;
    if (!(el.line.clientWidth > 0)) return;
    var fs = parseFloat(window.getComputedStyle(el.line).fontSize);
    if (!isFinite(fs) || fs <= 0) fs = 24;
    for (var i = 0; i < 9; i++){
      if (el.line.scrollHeight <= el.line.clientHeight + 1) break;
      if (fs <= 12) break;
      fs = Math.max(12, fs * 0.87);
      el.line.style.fontSize = fs.toFixed(1) + 'px';
    }
  }

  var fitTry = 0;
  function scheduleFit(){
    fitTry = 0;
    setTimeout(tryFit, 240);
  }
  function tryFit(){
    if (!el.line) return;
    if (!(el.line.clientWidth > 0)){
      if (++fitTry < 6) setTimeout(tryFit, 260);
      return;
    }
    fitLine();
  }

  function updateLit(){
    if (!cur.spans) return;
    var t = S.t + 0.001, n = 0, i;
    for (i = 0; i < cur.times.length; i++){
      if (cur.times[i] <= t) n = i + 1; else break;
    }
    if (n === cur.lit) return;
    if (n > cur.lit && cur.lit >= 0){
      for (i = cur.lit; i < n && i < cur.spans.length; i++) cur.spans[i].classList.add('on');
    } else {
      for (i = 0; i < cur.spans.length; i++){
        if (i < n) cur.spans[i].classList.add('on');
        else cur.spans[i].classList.remove('on');
      }
    }
    cur.lit = n;
  }

  function renderLine(force){
    var idx = lineAt(S.t);
    if (!force && idx === S.idx) return;
    S.idx = idx;
    buildLine(idx);
  }

  function pad2(v){ return (v < 10 ? '0' : '') + v; }

  function updateClock(){
    var t = S.t > 0 ? S.t : 0;
    var sec = Math.floor(t);
    if (sec === ui.sec) return;
    ui.sec = sec;
    var s = pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
    if (el.clock) el.clock.textContent = s;
    if (el.price) el.price.textContent = s;
    if (el.prog){
      var d = S.duration > 0 ? S.duration : 0;
      el.prog.style.width = d > 0 ? (clamp(t / d, 0, 1) * 100).toFixed(2) + '%' : '0%';
    }
  }

  function buildBarcode(){
    var host = document.getElementById('barcode');
    if (!host || host.childNodes.length) return;
    var x = 7, frag = document.createDocumentFragment();
    for (var i = 0; i < 34; i++){
      x = (x * 1103515 + 12345) & 0x7fffffff;
      var b = document.createElement('i');
      b.style.width = (1 + (x % 3)) + 'px';
      b.style.opacity = (0.42 + ((x >> 5) % 5) * 0.11).toFixed(2);
      frag.appendChild(b);
    }
    host.appendChild(frag);
  }

  function buildBars(){
    if (!el.bars || el.bars.childNodes.length) return;
    for (var i = 0; i < 14; i++) el.bars.appendChild(document.createElement('i'));
  }

  function updateBars(){
    if (!el.bars) return;
    var kids = el.bars.childNodes, lv = S.live;
    var pulse = clamp(S.beatPulse, 0, 1);
    for (var i = 0; i < kids.length; i++){
      var f = i / Math.max(1, kids.length - 1);
      var v = 0.14 + lv.bass * 0.85 * (1 - f) + lv.mid * 0.55 * (0.4 + 0.6 * Math.abs(Math.sin(i * 1.7)))
              + lv.treble * 0.5 * f + pulse * 0.3;
      kids[i].style.height = Math.round(clamp(v, 0.08, 1) * 100) + '%';
    }
  }

  function applySong(){
    if (el.songname){
      var n = S.song.name || '未命名曲目';
      if (el.songname.textContent !== n) el.songname.textContent = n;
    }
    if (el.songartist) el.songartist.textContent = S.song.artists || 'UNKNOWN ARTIST';
    if (el.cover && ui.cover !== S.song.cover){
      ui.cover = S.song.cover;
      if (S.song.cover){
        el.cover.classList.remove('gone');
        el.cover.setAttribute('src', S.song.cover);
      } else {
        el.cover.classList.add('gone');
        el.cover.removeAttribute('src');
      }
    }
  }

  /* ---- palette ------------------------------------------------------- */
  var C = { hot: [255,47,164], cool: [57,246,255], sun: '#ff2f9e' };

  function hsl(rgb){
    var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    var s = d === 0 ? 0 : (l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn));
    var h = 0;
    if (d > 0){
      if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l };
  }

  function neonRgb(rgb, sat, light){
    var c = hsl(rgb);
    var s = clamp(Math.max(c.s, sat), 0, 1);
    var l = clamp(light, 0, 1);
    // HSL -> RGB, every channel rounded and clamped before it can reach a gradient stop
    var cc = (1 - Math.abs(2 * l - 1)) * s;
    var x = cc * (1 - Math.abs((c.h / 60) % 2 - 1));
    var m = l - cc / 2, r = 0, g = 0, b = 0, hh = c.h;
    if (hh < 60){ r = cc; g = x; } else if (hh < 120){ r = x; g = cc; }
    else if (hh < 180){ g = cc; b = x; } else if (hh < 240){ g = x; b = cc; }
    else if (hh < 300){ r = x; b = cc; } else { r = cc; b = x; }
    return [
      Math.round(clamp((r + m) * 255, 0, 255)),
      Math.round(clamp((g + m) * 255, 0, 255)),
      Math.round(clamp((b + m) * 255, 0, 255))
    ];
  }

  function css(rgb, a){
    if (a === undefined) return 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
    return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + clamp(a, 0, 1).toFixed(3) + ')';
  }

  function applyAccent(){
    C.hot = neonRgb(S.accent, 0.86, 0.58);
    C.cool = neonRgb([57, 246, 255], 0.9, 0.62);
    var root = document.documentElement.style;
    root.setProperty('--hot', css(C.hot));
    root.setProperty('--cool', css(C.cool));
    root.setProperty('--hot-a', css(C.hot, 0.35));
    C.sun = css(neonRgb(S.accent, 0.92, 0.52), 0.95);
  }

  /* ---- baked backdrop ------------------------------------------------ */
  var bg = null;
  var marbleImg = new Image(), marbleReady = false;
  marbleImg.onload = function(){ marbleReady = true; try { if (bg) bake(); } catch (e){} };
  marbleImg.onerror = function(){ marbleReady = false; };
  marbleImg.src = 'assets/354-marble-white.jpg';

  function gradOK(g, stops){
    for (var i = 0; i < stops.length; i++){
      try { g.addColorStop(clamp(stops[i][0], 0, 1), stops[i][1]); } catch (e){}
    }
    return g;
  }

  function makeSun(px){
    var s = document.createElement('canvas');
    s.width = px; s.height = px;
    var c = s.getContext('2d');
    var r = px / 2;
    var g = c.createRadialGradient(r, r * 0.44, 0, r, r, r * 1.02);
    gradOK(g, [[0, '#fff9dd'], [0.28, '#ffe08a'], [0.55, '#ff9a72'], [0.8, '#ff3f92'], [1, C.sun]]);
    c.fillStyle = g;
    c.beginPath(); c.arc(r, r, r, 0, Math.PI * 2); c.fill();
    // horizontal slats, thicker toward the bottom
    c.globalCompositeOperation = 'destination-out';
    for (var i = 0; i < 13; i++){
      var f = i / 12;
      var y = px * (0.34 + 0.66 * Math.pow(f, 1.12));
      var bh = px * (0.008 + 0.062 * Math.pow(f, 1.5));
      c.fillRect(0, y, px, bh);
    }
    c.globalCompositeOperation = 'source-over';
    return s;
  }

  function palm(b, x, baseY, sc, tone){
    b.save();
    b.translate(x, baseY);
    b.scale(sc, sc);
    b.fillStyle = tone;
    b.beginPath();
    b.moveTo(-7, 0);
    b.quadraticCurveTo(-6, -78, 6, -158);
    b.lineTo(15, -158);
    b.quadraticCurveTo(2, -78, 5, 0);
    b.closePath();
    b.fill();
    var tx = 11, ty = -158;
    for (var i = 0; i < 9; i++){
      var a = -Math.PI * 0.97 + i * (Math.PI * 1.94 / 8);
      var L = 72 + (i % 3) * 11;
      var ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L * 0.5 - 12;
      b.beginPath();
      b.moveTo(tx, ty);
      b.quadraticCurveTo(tx + Math.cos(a) * L * 0.55 - 9, ty + Math.sin(a) * L * 0.38 - 30, ex, ey);
      b.quadraticCurveTo(tx + Math.cos(a) * L * 0.5 + 13, ty + Math.sin(a) * L * 0.3 - 4, tx, ty);
      b.fill();
      b.beginPath();
      b.moveTo(tx, ty);
      b.quadraticCurveTo(tx + Math.cos(a) * L * 0.7, ty + Math.sin(a) * L * 0.6 - 8, ex, ey);
      b.lineTo(tx, ty);
      b.fill();
    }
    b.restore();
  }

  function bake(){
    var w = V.w, h = V.h, hy = V.horizon;
    bg = document.createElement('canvas');
    // the backdrop is all gradients and soft silhouettes: baking it below dpr keeps the
    // first frame cheap (it is upscaled once per frame, the grid stays full resolution)
    var bs = Math.max(0.5, V.dpr * 0.62);
    bg.width = Math.max(2, Math.round(w * bs));
    bg.height = Math.max(2, Math.round(h * bs));
    var b = bg.getContext('2d');
    b.setTransform(bs, 0, 0, bs, 0, 0);

    // sunset air
    var sky1 = gradOK(b.createLinearGradient(0, 0, 0, hy), [
      [0, '#07000f'], [0.18, '#1d0533'], [0.38, '#4a0f5f'],
      [0.56, '#8e1b77'], [0.72, '#d5268f'], [0.85, '#ff6b86'], [1, '#ffb37a']
    ]);
    b.fillStyle = sky1;
    b.fillRect(0, 0, w, hy);

    // big cyan haze just above the horizon
    var haze = gradOK(b.createLinearGradient(0, hy - h * 0.22, 0, hy), [
      [0, 'rgba(57,246,255,0)'], [0.75, 'rgba(57,246,255,0.10)'], [1, 'rgba(180,255,255,0.34)']
    ]);
    b.fillStyle = haze;
    b.fillRect(0, hy - h * 0.22, w, h * 0.22);

    // sun
    var sunR = (w < h) ? Math.min(w * 0.36, h * 0.17) : Math.min(w * 0.24, h * 0.30);
    var sunX = w * 0.5, sunY = hy - sunR * ((w < h) ? 0.95 : 0.34);
    var sun = makeSun(Math.max(64, Math.round(sunR * 2 * bs)));
    try { b.drawImage(sun, sunX - sunR, sunY - sunR, sunR * 2, sunR * 2); } catch (e){}

    // soft dark pool behind the bust, so white plaster separates from the sun
    var poolCx = w * 0.5, poolCy = h * 0.30, poolR = Math.min(w, h) * 0.26;
    var pool = gradOK(b.createRadialGradient(poolCx, poolCy, poolR * 0.12, poolCx, poolCy, poolR), [
      [0, 'rgba(24,3,30,0.52)'], [0.5, 'rgba(24,3,30,0.30)'], [1, 'rgba(24,3,30,0)']
    ]);
    b.fillStyle = pool;
    b.fillRect(poolCx - poolR, poolCy - poolR, poolR * 2, poolR * 2);

    // distant colonnade / empty atrium silhouette
    b.fillStyle = 'rgba(16,3,24,0.92)';
    var cols = 9, x0 = w * 0.06, x1 = w * 0.94, cw = (x1 - x0) / (cols - 1);
    for (var i = 0; i < cols; i++){
      var cx = x0 + i * cw, ch = h * (0.055 + (i % 2) * 0.012);
      b.fillRect(cx - 4, hy - ch, 9, ch);
      // arch between columns
      if (i < cols - 1){
        b.beginPath();
        b.moveTo(cx, hy - ch);
        b.quadraticCurveTo(cx + cw / 2, hy - ch - h * 0.045, cx + cw, hy - ch * 0.94);
        b.lineTo(cx + cw, hy);
        b.lineTo(cx, hy);
        b.closePath();
        b.globalAlpha = 0.20;
        b.fill();
        b.globalAlpha = 1;
      }
    }
    // lamp dots along the arcade
    for (var k = 0; k < 9; k++){
      var lx = x0 + k * cw + cw / 2;
      b.fillStyle = 'rgba(255,236,190,' + (0.20 + (k % 3) * 0.10) + ')';
      b.beginPath(); b.arc(lx, hy - h * 0.062, 1.6, 0, Math.PI * 2); b.fill();
    }

    // palm silhouettes at the corners
    var ps = clamp(h / 900, 0.62, 1.5);
    palm(b, w * 0.055, hy + h * 0.10, ps * 1.15, 'rgba(12,2,18,0.94)');
    palm(b, w * 0.965, hy + h * 0.04, ps * 0.92, 'rgba(12,2,18,0.9)');
    palm(b, w * 0.20, hy + h * 0.02, ps * 0.34, 'rgba(28,6,34,0.55)');

    // floor
    var fl = gradOK(b.createLinearGradient(0, hy, 0, h), [
      [0, '#1b0624'], [0.28, '#120318'], [1, '#05000a']
    ]);
    b.fillStyle = fl;
    b.fillRect(0, hy, w, h - hy);

    // horizon neon smear
    var hg = gradOK(b.createLinearGradient(0, hy - 3, 0, hy + 26), [
      [0, 'rgba(255,120,190,0.55)'], [0.35, 'rgba(255,47,164,0.22)'], [1, 'rgba(255,47,164,0)']
    ]);
    b.fillStyle = hg;
    b.fillRect(0, hy - 3, w, 30);

    // scanlines + vignette are baked in: no extra full-screen compositing layers at runtime
    b.save();
    b.globalAlpha = 0.15;
    b.fillStyle = '#120015';
    for (var sy = 0; sy < h; sy += 3) b.fillRect(0, sy, w, 1);
    b.restore();
    // the plaster bust, cut out of the sunset
    var u = Math.min(w * (w < h ? 0.34 : 0.165), h * (w < h ? 0.22 : 0.245));
    var ox = w * 0.5;
    var baseY = hy - h * 0.018;
    var oy = baseY - 1.70 * u;
    b.save();
    b.filter = 'blur(18px)';
    b.globalAlpha = 0.55;
    b.fillStyle = '#150019';
    bustPath(b, u * 1.02, ox + u * 0.02, oy + u * 0.03);
    b.fill();
    b.restore();
    drawBust(b, u, ox, oy);

    // its reflection, dying into the polished floor
    b.save();
    b.beginPath();
    b.rect(0, baseY, w, Math.max(0, h - baseY));
    b.clip();
    b.globalAlpha = 0.13;
    b.filter = 'blur(5px)';
    b.translate(0, baseY * 2);
    b.scale(1, -1);
    drawBust(b, u * 0.98, ox, oy);
    b.filter = 'none';
    b.restore();
    var fg = gradOK(b.createLinearGradient(0, baseY, 0, baseY + h * 0.20), [
      [0, 'rgba(10,2,16,0.10)'], [0.45, 'rgba(10,2,16,0.82)'], [1, 'rgba(10,2,16,1)']
    ]);
    b.fillStyle = fg;
    b.fillRect(0, baseY, w, Math.max(0, h - baseY));


    var vg = gradOK(b.createRadialGradient(w * 0.5, h * 0.45, Math.min(w, h) * 0.30,
                                           w * 0.5, h * 0.45, Math.max(w, h) * 0.72), [
      [0, 'rgba(6,0,12,0)'], [0.65, 'rgba(6,0,12,0.28)'], [1, 'rgba(6,0,12,0.66)']
    ]);
    b.fillStyle = vg;
    b.fillRect(0, 0, w, h);
  }

  /* ---- plaster bust, drawn as a cut-out cameo ------------------------ */
  function bustPath(b, u, ox, oy){
        b.beginPath();
        b.moveTo(ox + 0.05*u, oy - 0.01*u);
        b.bezierCurveTo(ox - 0.06*u, oy + 0.02*u, ox - 0.12*u, oy + 0.12*u, ox - 0.135*u, oy + 0.22*u);
        b.bezierCurveTo(ox - 0.14*u, oy + 0.255*u, ox - 0.165*u, oy + 0.275*u, ox - 0.20*u, oy + 0.30*u);
        b.bezierCurveTo(ox - 0.245*u, oy + 0.335*u, ox - 0.30*u, oy + 0.365*u, ox - 0.295*u, oy + 0.395*u);
        b.bezierCurveTo(ox - 0.29*u, oy + 0.415*u, ox - 0.235*u, oy + 0.415*u, ox - 0.215*u, oy + 0.425*u);
        b.bezierCurveTo(ox - 0.205*u, oy + 0.445*u, ox - 0.215*u, oy + 0.462*u, ox - 0.225*u, oy + 0.478*u);
        b.bezierCurveTo(ox - 0.245*u, oy + 0.492*u, ox - 0.24*u, oy + 0.508*u, ox - 0.222*u, oy + 0.516*u);
        b.bezierCurveTo(ox - 0.238*u, oy + 0.532*u, ox - 0.232*u, oy + 0.548*u, ox - 0.205*u, oy + 0.556*u);
        // chin -> jaw -> neck front
        b.bezierCurveTo(ox - 0.245*u, oy + 0.592*u, ox - 0.255*u, oy + 0.655*u, ox - 0.19*u, oy + 0.712*u);
        b.bezierCurveTo(ox - 0.14*u, oy + 0.755*u, ox - 0.105*u, oy + 0.79*u, ox - 0.10*u, oy + 0.88*u);
        b.bezierCurveTo(ox - 0.098*u, oy + 0.95*u, ox - 0.115*u, oy + 0.99*u, ox - 0.17*u, oy + 1.03*u);
        // shoulder slope (front)
        b.bezierCurveTo(ox - 0.36*u, oy + 1.10*u, ox - 0.64*u, oy + 1.15*u, ox - 0.80*u, oy + 1.28*u);
        b.bezierCurveTo(ox - 0.91*u, oy + 1.39*u, ox - 0.945*u, oy + 1.52*u, ox - 0.945*u, oy + 1.70*u);
        // bust cut
        b.quadraticCurveTo(ox + 0.03*u, oy + 1.78*u, ox + 1.01*u, oy + 1.70*u);
        // shoulder slope (back)
        b.bezierCurveTo(ox + 1.01*u, oy + 1.50*u, ox + 0.95*u, oy + 1.32*u, ox + 0.79*u, oy + 1.16*u);
        b.bezierCurveTo(ox + 0.55*u, oy + 1.04*u, ox + 0.39*u, oy + 1.02*u, ox + 0.35*u, oy + 0.98*u);
        // neck back
        b.bezierCurveTo(ox + 0.355*u, oy + 0.90*u, ox + 0.345*u, oy + 0.83*u, ox + 0.355*u, oy + 0.775*u);    // back of skull
        b.bezierCurveTo(ox + 0.52*u, oy + 0.70*u, ox + 0.60*u, oy + 0.48*u, ox + 0.575*u, oy + 0.28*u);
        b.bezierCurveTo(ox + 0.545*u, oy + 0.07*u, ox + 0.36*u, oy - 0.03*u, ox + 0.13*u, oy - 0.005*u);    b.closePath();
  }

  function drawBust(b, u, ox, oy){
    var TAU = Math.PI * 2;
    bustPath(b, u, ox, oy);
    var g = gradOK(b.createLinearGradient(ox - 0.9*u, oy - 0.05*u, ox + 0.8*u, oy + 1.5*u), [
      [0, '#fdf7fb'], [0.30, '#f2e4f0'], [0.62, '#d3bdd5'], [1, '#a489aa']
    ]);
    b.fillStyle = g;
    b.fill();

    b.save();
    bustPath(b, u, ox, oy);
    b.clip();

    // marble grain on the plaster
    if (marbleReady){
      try {
        b.globalAlpha = 0.13;
        b.globalCompositeOperation = 'overlay';
        b.drawImage(marbleImg, ox - 1.1*u, oy - 0.3*u, 2.3*u, 2.2*u);
        b.globalCompositeOperation = 'source-over';
        b.globalAlpha = 1;
      } catch (e){ b.globalAlpha = 1; b.globalCompositeOperation = 'source-over'; }
    }

    var sg = gradOK(b.createLinearGradient(ox - 0.25*u, oy + 0.15*u, ox + 0.85*u, oy + 1.15*u), [
      [0, 'rgba(38,4,34,0)'], [0.45, 'rgba(38,4,34,0.24)'], [1, 'rgba(24,2,24,0.44)']
    ]);
    b.fillStyle = sg;
    b.fillRect(ox - 2*u, oy - u, 4*u, 3*u);

    var jg = gradOK(b.createRadialGradient(ox - 0.02*u, oy + 0.80*u, 0, ox - 0.02*u, oy + 0.80*u, 0.36*u), [
      [0, 'rgba(40,6,36,0.52)'], [0.55, 'rgba(40,6,36,0.22)'], [1, 'rgba(40,6,36,0)']
    ]);
    b.fillStyle = jg;
    b.fillRect(ox - 0.7*u, oy + 0.40*u, 1.4*u, 0.85*u);

    // brow shadow and cheek highlight, so the form reads at a glance
    var bg2 = gradOK(b.createRadialGradient(ox - 0.14*u, oy + 0.255*u, 0, ox - 0.14*u, oy + 0.255*u, 0.15*u), [
      [0, 'rgba(34,4,30,0.30)'], [1, 'rgba(34,4,30,0)']
    ]);
    b.fillStyle = bg2;
    b.fillRect(ox - 0.4*u, oy + 0.10*u, 0.55*u, 0.32*u);
    b.globalCompositeOperation = 'screen';
    var ch = gradOK(b.createRadialGradient(ox - 0.03*u, oy + 0.33*u, 0, ox - 0.03*u, oy + 0.33*u, 0.20*u), [
      [0, 'rgba(255,246,252,0.26)'], [1, 'rgba(255,246,252,0)']
    ]);
    b.fillStyle = ch;
    b.fillRect(ox - 0.35*u, oy + 0.15*u, 0.6*u, 0.45*u);
    b.globalCompositeOperation = 'source-over';
    // eye socket, lid, brow, lips, ear
    var ex = ox - 0.10*u, ey = oy + 0.245*u;
    var eg = gradOK(b.createRadialGradient(ex, ey, 0, ex, ey, 0.085*u), [
      [0, 'rgba(58,14,52,0.38)'], [1, 'rgba(58,14,52,0)']
    ]);
    b.fillStyle = eg;
    b.beginPath(); b.ellipse(ex, ey, 0.085*u, 0.055*u, -0.1, 0, TAU); b.fill();

    b.strokeStyle = 'rgba(58,16,52,0.42)';
    b.lineWidth = Math.max(1, 0.010*u);
    b.beginPath();
    b.moveTo(ex - 0.062*u, ey - 0.004*u);
    b.quadraticCurveTo(ex - 0.005*u, ey - 0.045*u, ex + 0.055*u, ey - 0.006*u);
    b.stroke();

    b.strokeStyle = 'rgba(60,18,54,0.26)';
    b.lineWidth = Math.max(1, 0.014*u);
    b.beginPath();
    b.moveTo(ox - 0.155*u, oy + 0.185*u);
    b.quadraticCurveTo(ox - 0.075*u, oy + 0.165*u, ox - 0.01*u, oy + 0.19*u);
    b.stroke();

    b.strokeStyle = 'rgba(74,22,64,0.36)';
    b.lineWidth = Math.max(1, 0.009*u);
    b.beginPath();
    b.moveTo(ox - 0.225*u, oy + 0.497*u);
    b.quadraticCurveTo(ox - 0.17*u, oy + 0.512*u, ox - 0.13*u, oy + 0.492*u);
    b.stroke();


    // neon rim: an inner edge band only, so the body itself stays plaster
    b.save();
    bustPath(b, u, ox, oy);
    b.clip();
    b.beginPath();
    b.rect(ox - 3 * u, oy - 2 * u, 6 * u, 3.68 * u);
    b.clip();
    b.globalCompositeOperation = 'screen';
    b.lineWidth = Math.max(2, u * 0.055);
    var lg = gradOK(b.createLinearGradient(ox - 0.75*u, 0, ox + 0.85*u, 0), [
      [0, 'rgba(255,47,164,0.95)'], [0.34, 'rgba(255,47,164,0)'],
      [0.64, 'rgba(57,246,255,0)'], [1, 'rgba(57,246,255,0.92)']
    ]);
    b.strokeStyle = lg;
    b.shadowColor = 'rgba(255,47,164,0.65)';
    b.shadowBlur = u * 0.07;
    bustPath(b, u, ox, oy);
    b.stroke();
    b.restore();
    b.save();
    bustPath(b, u, ox, oy);
    b.clip();
    b.globalCompositeOperation = 'screen';

    var kg = gradOK(b.createRadialGradient(ox - 0.25*u, oy + 0.10*u, 0, ox - 0.25*u, oy + 0.10*u, 0.85*u), [
      [0, 'rgba(255,250,255,0.42)'], [1, 'rgba(255,250,255,0)']
    ]);
    b.fillStyle = kg;
    b.fillRect(ox - u, oy - u, 2.4*u, 2.4*u);
    b.restore();

    b.save();
    b.globalCompositeOperation = 'screen';
    b.lineWidth = Math.max(1, u * 0.006);
    b.strokeStyle = 'rgba(255,130,210,0.30)';
    b.shadowColor = 'rgba(255,47,164,0.85)';
    b.shadowBlur = u * 0.10;
    bustPath(b, u, ox, oy);
    b.stroke();
    b.restore();
  }

  /* ---- per-frame floor grid ------------------------------------------ */
  function drawGrid(t){
    var w = V.w, h = V.h, hy = V.horizon;
    var pulse = 1 + clamp(S.beatPulse, 0, 1) * 1.5;
    var bass = S.live.bass;
    var cx = w * 0.5;

    // sun sheen on the polished floor
    var sw = w * 0.34;
    var sh = gradOK(ctx.createLinearGradient(0, hy, 0, h), [
      [0, 'rgba(255,90,150,0.20)'], [0.55, 'rgba(255,47,164,0.07)'], [1, 'rgba(255,47,164,0)']
    ]);
    ctx.fillStyle = sh;
    ctx.fillRect(cx - sw / 2, hy, sw, h - hy);

    var i, N = 20, phase = (S.phase % 1 + 1) % 1;
    ctx.lineCap = 'butt';
    for (i = 0; i < N; i++){
      var f = (i + phase) / N;
      var y = hy + (h - hy) * Math.pow(f, 2.55);
      var a = 0.05 + 0.62 * f;
      ctx.strokeStyle = css((i % 5 === 0) ? C.cool : C.hot, (i % 5 === 0) ? a * 0.85 : a);
      ctx.lineWidth = 0.6 + f * 2.4 * (1 + bass * 0.8);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
    // converging verticals
    var spread = w * 0.115;
    for (i = -9; i <= 9; i++){
      var xb = cx + i * spread;
      var aa = 0.30 * (1 - Math.abs(i) / 13);
      ctx.strokeStyle = css(C.hot, aa);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(cx, hy);
      ctx.lineTo(xb, h + 6);
      ctx.stroke();
    }
    // horizon line
    ctx.strokeStyle = css(C.cool, 0.85);
    ctx.lineWidth = 1.6 * pulse;
    ctx.beginPath();
    ctx.moveTo(0, hy);
    ctx.lineTo(w, hy);
    ctx.stroke();

    // VHS tracking band drifting down the frame
    var by = ((S.t * 0.055) % 1.2 - 0.12) * h;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,190,235,0.055)';
    ctx.fillRect(0, by, w, 13);
    ctx.fillStyle = 'rgba(120,255,255,0.035)';
    ctx.fillRect(0, by + 15, w, 2);
    ctx.globalCompositeOperation = 'source-over';
  }

  function draw(dt){
    if (!bg) bake();
    try { ctx.drawImage(bg, 0, 0, V.w, V.h); } catch (e){}
    drawGrid(S.t);
  }


  function resize(){
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!(w > 0) || !isFinite(w)) w = 1440;
    if (!(h > 0) || !isFinite(h)) h = 900;
    var dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    if (w * h * dpr * dpr > 3400000) dpr = Math.max(1, Math.sqrt(3400000 / (w * h)));
    V.w = w; V.h = h; V.dpr = dpr;
    V.horizon = Math.round(h * 0.585);
    sky.width = Math.round(w * dpr); sky.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bake();
  }

  var last = 0;
  function frame(now){
    var t0 = performance.now();
    var raw = last ? Math.max(0, (now - last) / 1000) : 0.016;
    var dt = Math.min(0.1, raw);
    last = now;
    try {
      if (raw > 0 && raw < 1.5) S.fpsAvg = S.fpsAvg ? S.fpsAvg * 0.88 + raw * 0.12 : raw;
      S.beatPulse *= Math.pow(0.07, dt) * (S.reduced ? 0.6 : 1);
      var speed = (S.playing ? 0.34 : 0.09) * (1 + S.live.bass * 0.55) * (S.reduced ? 0.45 : 1);
      S.phase = (S.phase + dt * speed) % 1;
      renderLine(false);
      updateLit();
      updateClock();
      if ((S.frames & 1) === 0) updateBars();
      draw(dt);
    } catch (e){
      S.dbg = String(e && e.message || e);
      if (window.console) console.warn('354 frame', e);
    }
    S.frames++;
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('message', function(ev){
    var d = ev.data; if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init'){ prepare(d.payload); }
      else if (d.type === 'tick'){
        var p = d.payload || {};
        var t = num(p.time, S.t);
        S.t = t < 0 ? 0 : t;          // a seek is a big jump: always take it
        if (typeof p.playing === 'boolean') S.playing = p.playing;
      }
      else if (d.type === 'beat'){
        var b = d.payload || {};
        S.beatLevel = clamp(num(b.level, 0.5), 0, 1);
        S.beatPulse = Math.max(S.beatPulse, S.beatLevel);
      }
      else if (d.type === 'live'){
        var L = d.payload || {};
        S.live = {
          bpm: num(L.bpm, 0), level: clamp(num(L.level,0),0,1),
          bass: clamp(num(L.bass,0),0,1), mid: clamp(num(L.mid,0),0,1), treble: clamp(num(L.treble,0),0,1)
        };
        if (typeof L.playing === 'boolean') S.playing = L.playing;
      }
    } catch (e){ S.dbg = String(e && e.message || e); if (window.console) console.warn('354', e); }
  });

  var rzT = 0;
  window.addEventListener('resize', function(){
    if (rzT) clearTimeout(rzT);
    rzT = setTimeout(function(){ rzT = 0; try { resize(); renderLine(true); } catch(e){} }, 120);
  });
  try { S.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e){}

  function boot(){
    applyAccent();
    buildBarcode();
    buildBars();
    resize();                       // static backdrop first: sunset + grid + price tag
    requestAnimationFrame(frame);
    scheduleFit();
  }

  try { boot(); } catch (e){
    S.dbg = String(e && e.message || e);
    if (window.console && console.error) console.error('354 boot', e);
    // the page must still animate and still report a sane __stage
    try { requestAnimationFrame(frame); } catch (e2){}
  }
})();
</script>
</body>
</html>
