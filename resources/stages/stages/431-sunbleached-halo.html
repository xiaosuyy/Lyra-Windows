<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灼光午后</title>
<style>
  :root{
    --accent: 255,168,92;
    --ink: 58,26,18;
    --beat: 0;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#241008}
  body{
    font-family: Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
  .layer{position:absolute;inset:0;pointer-events:none}
  #base{
    background:
      radial-gradient(120% 90% at 78% 8%, #fffdf2 0%, #ffeccb 26%, rgba(255,220,170,0) 62%),
      linear-gradient(168deg,#fff6e6 0%,#ffe4c4 38%,#ffc9a6 64%,#dfa08e 100%);
  }
  #sun{
    inset:auto;position:absolute;width:82vmax;height:82vmax;right:-20vmax;top:-34vmax;
    background:radial-gradient(closest-side,
      rgba(255,255,248,.98) 0%, rgba(255,244,214,.9) 18%,
      rgba(255,220,168,.5) 42%, rgba(255,196,140,.16) 62%, rgba(255,190,140,0) 78%);
    mix-blend-mode:screen;filter:blur(8px);opacity:.95;
  }
  #horizon{
    inset:auto;position:absolute;left:0;right:0;bottom:0;height:44%;
    background:
      repeating-linear-gradient(to bottom, rgba(255,250,232,.30) 0 1px, rgba(255,250,232,0) 1px 9px),
      linear-gradient(to bottom, rgba(255,244,220,0) 0%, rgba(255,238,208,.30) 34%, rgba(206,138,112,.50) 100%);
    mix-blend-mode:screen;filter:blur(2px);opacity:.8;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 32%, #000 100%);
    mask-image:linear-gradient(to bottom, transparent 0, #000 32%, #000 100%);
  }
  #bokeh{z-index:3;width:100%;height:100%;display:block;mix-blend-mode:screen;opacity:.9}
  #leakA{
    background:
      radial-gradient(58% 76% at -4% 20%, rgba(255,70,120,.85), rgba(255,116,96,.34) 44%, rgba(255,140,60,0) 74%),
      radial-gradient(38% 58% at 2% 82%, rgba(255,56,132,.62), rgba(255,56,132,0) 72%);
    mix-blend-mode:screen;filter:blur(28px);opacity:.78;
    animation:leakBreath 17s ease-in-out infinite alternate;
  }
  #leakB{
    background:
      radial-gradient(56% 72% at 102% 88%, rgba(255,148,44,.78), rgba(255,116,44,.30) 46%, rgba(255,92,30,0) 76%),
      radial-gradient(26% 40% at 74% -8%, rgba(255,255,244,.92), rgba(255,242,204,0) 78%);
    mix-blend-mode:screen;filter:blur(32px);opacity:.82;
    animation:leakBreath 23s ease-in-out infinite alternate-reverse;
  }
  #halo{
    background:linear-gradient(101deg,
      rgba(255,255,255,0) 28%, rgba(255,234,186,.52) 45%,
      rgba(255,174,96,.34) 52%, rgba(255,255,255,0) 68%);
    mix-blend-mode:screen;filter:blur(20px);opacity:.55;
    transform:translateY(-4%) rotate(-4deg) scale(1.25);
  }
  @keyframes leakBreath{
    from{opacity:.62;transform:translate3d(0,0,0) scale(1)}
    to{opacity:.92;transform:translate3d(1.6vw,-1.2vh,0) scale(1.05)}
  }
  #stage::after{
    content:"";position:absolute;inset:-10%;z-index:9;pointer-events:none;
    opacity:.22;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)'/%3E%3C/svg%3E");
    animation:grainShift 1.1s steps(3) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}
    33%{transform:translate(-1.4%,1.1%)}
    66%{transform:translate(1.2%,-1.4%)}
    100%{transform:translate(0,0)}
  }
  #lyrics::before{
    content:"";position:absolute;left:50%;top:50%;width:min(96vw,1220px);height:min(52vh,420px);
    transform:translate(-50%,-50%);pointer-events:none;
    /* 原来是乳白柔光垫底，反而把浅底上的深字对比度冲淡了；改成压暗一点的暖褐晕影，托住字 */
    background:radial-gradient(closest-side, rgba(92,44,26,.30), rgba(92,44,26,.14) 52%, rgba(92,44,26,0) 78%);
    filter:blur(14px);
  }
  #lyrics{position:absolute;inset:0;z-index:6}
  .slot{
    position:absolute;left:50%;top:52%;width:min(84vw,1100px);
    transform:translate(-50%,-50%) scale(.8);
    text-align:center;opacity:0;visibility:hidden;
    transition:opacity .75s ease, transform .85s cubic-bezier(.16,.7,.2,1), filter .75s ease;
    filter:blur(6px);
    color:rgb(var(--ink));
    line-height:1.45;
    --fscale: 1;
    font-size:calc(clamp(22px,3.6vw,54px) * var(--fscale));
    letter-spacing:.02em;
    text-wrap:balance;
    overflow-wrap:anywhere;
    font-weight:700;
  }
  .slot.prev,.slot.next{font-size:clamp(15px,2vw,27px);opacity:.42;filter:blur(1.2px);visibility:visible}
  .slot.prev{transform:translate(-50%,-50%) translate(0,-13vh) scale(.94)}
  .slot.next{transform:translate(-50%,-50%) translate(0,13vh) scale(.94)}
  .slot.cur{
    opacity:1;visibility:visible;filter:blur(0);
    transform:translate(-50%,-50%) scale(1);
    /* 浅底上的深字：要的是"压得住"，所以用浅色外发光描边而不是暗投影 */
    text-shadow:0 0 2px rgba(255,250,235,.9),0 1px 0 rgba(255,252,242,.75),0 2px 14px rgba(150,69,40,.28);
  }
  .slot .ch{opacity:.52;transition:opacity .28s ease, text-shadow .28s ease}
  .slot .ch.lit{opacity:1;text-shadow:0 0 3px rgba(255,250,235,.95)}
  #empty{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;z-index:6;color:rgba(var(--ink),.5);
    font-size:clamp(11px,1.1vw,14px);letter-spacing:.7em;text-indent:.7em;
    opacity:0;transition:opacity 1s ease;
  }
  #empty.on{opacity:1}
  #vignette{
    background:radial-gradient(120% 100% at 50% 45%, rgba(90,30,10,0) 45%, rgba(94,36,16,.28) 100%);
    mix-blend-mode:multiply;
  }
  #tint{
    background:radial-gradient(70% 55% at 22% 12%, rgba(var(--accent),.20), rgba(var(--accent),0) 72%);
    mix-blend-mode:soft-light;z-index:2;
  }
  @media (prefers-reduced-motion: reduce){
    #leakA,#leakB,#stage::after{animation:none}
    .slot{transition-duration:.3s}
  }
  @media (max-aspect-ratio: 3/4){
    .slot.prev{transform:translate(-50%,-50%) translate(0,-11vh) scale(.94)}
    .slot.next{transform:translate(-50%,-50%) translate(0,11vh) scale(.94)}
    #horizon{height:38%}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="base"></div>
  <div class="layer" id="sun"></div>
  <div class="layer" id="horizon"></div>
  <canvas class="layer" id="bokeh"></canvas>
  <div class="layer" id="leakA"></div>
  <div class="layer" id="leakB"></div>
  <div class="layer" id="halo"></div>
  <div class="layer" id="tint"></div>
  <div class="layer" id="lyrics"></div>
  <div id="empty">纯 音 乐</div>
  <div class="layer" id="vignette"></div>
</div>
<script>
(function(){
  "use strict";

  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "", text: "", rm: false, gl: false };
  window.__stage = function(){
    return { lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
             frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm };
  };

  var lyricsEl = document.getElementById("lyrics");
  var emptyEl  = document.getElementById("empty");
  var slots = { prev: null, cur: null, next: null };
  var curSpans = [], curTimes = [];

  var rmq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  S.rm = !!(rmq && rmq.matches);
  if (rmq && rmq.addEventListener) rmq.addEventListener("change", function(e){ S.rm = !!e.matches; });

  /* ---- ready：首帧无条件下发，另加定时兜底 ---- */
  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); }
    catch (e) { console.error("[431] ready post failed", e); }
  }
  requestAnimationFrame(function(){ sendReady(); });
  setTimeout(sendReady, 700);

  /* ---- 工具 ---- */
  function clamp(v, a, b){ v = +v; if (!isFinite(v)) return a; return v < a ? a : (v > b ? b : v); }
  function cssVar(n, v){ document.documentElement.style.setProperty(n, v); }

  function normLines(arr){
    var out = [], n = Math.min(Array.isArray(arr) ? arr.length : 0, 500);
    for (var i = 0; i < n; i++){
      var l = arr[i] || {};
      var text = (l.text == null) ? "" : String(l.text);
      var t = isFinite(+l.t) ? +l.t : 0;
      var dur = isFinite(+l.dur) && +l.dur > 0 ? +l.dur : 0;
      out.push({ t: t, dur: dur, text: text, chars: Array.isArray(l.chars) ? l.chars : null });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    return out;
  }

  function charTimes(line){
    var txt = line.text || "", n = txt.length, ts = new Array(n), i;
    var c = line.chars;
    var ok = c && c.length >= n && n > 0;
    var dur = line.dur > 0 ? line.dur : Math.max(1.6, n * 0.24);
    for (i = 0; i < n; i++){
      if (ok && c[i] && isFinite(+c[i].t)) ts[i] = +c[i].t;
      else ts[i] = line.t + dur * ((i + 1) / (n + 1));
    }
    return ts;
  }

  function buildSlot(el, line){
    var spans = [], times = [];
    el.textContent = "";
    if (!line || !line.text){ return { spans: spans, times: times }; }
    var txt = line.text, frag = document.createDocumentFragment(), n = Math.min(txt.length, 240);
    times = charTimes(line).slice(0, n);
    for (var i = 0; i < n; i++){
      var ch = txt.charAt(i);
      if (ch === " "){ frag.appendChild(document.createTextNode(" ")); continue; }
      var sp = document.createElement("span");
      sp.className = "ch";
      sp.textContent = ch;
      frag.appendChild(sp);
      spans.push(sp);
    }
    el.appendChild(frag);
    (function reveal(){
      var k = Math.min(spans.length, times.length);
      for (var j = 0; j < k; j++){
        var lit = S.t >= times[j];
        if (lit !== (spans[j].className === "ch lit")) spans[j].className = lit ? "ch lit" : "ch";
      }
    })();
    return { spans: spans, times: times };
  }

  function ensureSlots(){
    if (slots.cur) return;
    var roles = ["prev", "cur", "next"];
    for (var i = 0; i < 3; i++){
      var el = document.createElement("div");
      el.className = "slot " + roles[i];
      lyricsEl.appendChild(el);
      slots[roles[i]] = el;
    }
  }

  function paint(){
    ensureSlots();
    var i = S.idx;
    var cur = S.lines[i] || null;
    var prev = i > 0 ? S.lines[i - 1] : null;
    var next = (i >= 0 && i + 1 < S.lines.length) ? S.lines[i + 1] : (i < 0 ? S.lines[0] : null);
    if (i < 0){ prev = null; }

    var r = buildSlot(slots.cur, cur);
    curSpans = r.spans; curTimes = r.times;
    buildSlot(slots.prev, prev);
    buildSlot(slots.next, next);

    slots.prev.className = "slot prev";
    slots.cur.className  = "slot cur";
    slots.next.className = "slot next";
    slots.prev.style.visibility = prev ? "visible" : "hidden";
    slots.next.style.visibility = next ? "visible" : "hidden";
    S.text = cur ? cur.text : "";
    emptyEl.className = S.lines.length ? "" : "on";
    fitSlot(slots.cur, cur ? cur.text : "");
  }

  function fitSlot(el, txt){
    el.style.setProperty("--fscale", "1");
    var n = txt ? txt.length : 0;
    if (!n) return;
    var box = el.getBoundingClientRect();
    var base = box.height || 1;
    var limit = Math.max(120, (window.innerHeight || 900) * 0.36);
    var want = n > 26 ? Math.min(1, 26 / n + 0.16) : 1;
    var s = Math.min(1, want, Math.max(0.42, limit / base));
    if (s < 0.99) el.style.setProperty("--fscale", s.toFixed(3));
  }

  function findIdx(t){
    var ls = S.lines, lo = 0, hi = ls.length - 1, ans = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (ls[mid].t <= t + 0.02){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  function litUpdate(){
    var k = Math.min(curSpans.length, curTimes.length);
    for (var j = 0; j < k; j++){
      var lit = S.t >= curTimes[j];
      var has = curSpans[j].className === "ch lit";
      if (lit !== has) curSpans[j].className = lit ? "ch lit" : "ch";
    }
  }

  /* ---------- 散景 bokeh ---------- */
  var cv = document.getElementById("bokeh"), cx = cv.getContext("2d", { alpha: true });
  var VW = 0, VH = 0, DPR = 1;
  var dots = [], sprites = [], lastT = 0, pulse = 0, pulseT = 0, liveLvl = 0;

  function resize(){
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    VW = w; VH = h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function makeSprite(r, hue){
    var s = Math.max(8, Math.min(Math.ceil(r * 2.6), 460));
    var c = document.createElement("canvas");
    c.width = c.height = s;
    var g = c.getContext("2d");
    var grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0, "rgba(255,253,242,.95)");
    grd.addColorStop(.42, "hsla(" + hue + ",100%,82%,.55)");
    grd.addColorStop(.72, "hsla(" + hue + ",100%,68%,.20)");
    grd.addColorStop(1, "hsla(" + hue + ",100%,60%,0)");
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    return c;
  }

  function seedDots(){
    dots = [];
    var n = Math.min(24, Math.round(Math.min(VW, VH) / 42) + 12);
    for (var i = 0; i < n; i++){
      var r = 14 + Math.pow(Math.random(), 1.7) * (Math.min(VW, VH) * 0.10);
      dots.push({
        x: Math.random() * VW,
        y: Math.random() * VH,
        r: r,
        vy: -(2 + Math.random() * 7),
        vx: (Math.random() - .5) * 5,
        a: .16 + Math.random() * .42,
        hue: 26 + Math.random() * 34,
        ph: Math.random() * Math.PI * 2
      });
    }
    var hs = [34, 42, 50, 320, 20];
    sprites = hs.map(function(h){ return makeSprite(96, h); });
  }

  function render(now){
    if (!cx || !dots.length) return;
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
    lastT = now;
    var k = S.rm ? 0.15 : 1;
    pulse += (pulseT - pulse) * 0.12;
    pulseT *= 0.90;

    cx.clearRect(0, 0, VW, VH);
    cx.globalCompositeOperation = "lighter";
    for (var i = 0; i < dots.length; i++){
      var d = dots[i];
      d.y += d.vy * dt * k;
      d.x += d.vx * dt * k + Math.sin(now * 0.0004 + d.ph) * 0.12;
      if (d.y < -d.r * 2){ d.y = VH + d.r * 2; d.x = Math.random() * VW; }
      if (d.x < -d.r * 2) d.x = VW + d.r; else if (d.x > VW + d.r * 2) d.x = -d.r;
      var sp = sprites[i % sprites.length];
      var rr = d.r * (1 + pulse * 0.10 + Math.sin(now * 0.0011 + d.ph) * 0.035);
      var al = (d.a + pulse * 0.25 + liveLvl * 0.10) * (S.playing ? 1 : 0.55);
      cx.globalAlpha = Math.max(0.03, Math.min(0.95, al));
      cx.drawImage(sp, d.x - rr, d.y - rr, rr * 2, rr * 2);
    }
    cx.globalAlpha = 1;
    cx.globalCompositeOperation = "source-over";
  }

  window.addEventListener("resize", function(){
    try { resize(); seedDots(); } catch (e) { console.error("[431] resize", e); }
  });
  resize(); seedDots();

  function loop(now){
    S.frames++;
    var t0 = performance.now();
    try {
      var ni = findIdx(S.t);
      if (ni !== S.idx){ S.idx = ni; paint(); }
      else { litUpdate(); }
      render(now || t0);
    } catch (e) { console.error("[431] frame", e); }
    S.js = performance.now() - t0;
    requestAnimationFrame(loop);
  }

  window.addEventListener("message", function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === "init"){
        var p = d.payload || {};
        S.lines = normLines(p.lines);
        S.idx = findIdx(S.t);
        if (p.accent && p.accent.length >= 3){
          var a = [clamp(p.accent[0], 0, 255), clamp(p.accent[1], 0, 255), clamp(p.accent[2], 0, 255)];
          cssVar("--accent", a[0] + "," + a[1] + "," + a[2]);
        }
        ensureSlots();
        paint();
      } else if (d.type === "tick"){
        var tp = d.payload || {};
        if (isFinite(+tp.time)) S.t = Math.max(0, +tp.time);
        if (typeof tp.playing === "boolean") S.playing = tp.playing;
      } else if (d.type === "beat"){
        var bp = d.payload || {};
        var lv = clamp(bp.level == null ? 0.5 : bp.level, 0, 1);
        pulseT = Math.min(1, pulseT + 0.35 + lv * 0.75);
      } else if (d.type === "live"){
        var lp = d.payload || {};
        liveLvl = clamp(lp.level == null ? 0 : lp.level, 0, 1);
      }
    } catch (e) { console.error("[431] message", e); }
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
