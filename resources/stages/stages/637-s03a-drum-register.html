<!-- 637 / S03A —— 歌词是一台机械鼓轮计数器：每一句歌词，都是一次进位。 -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>637 / Drum Register</title>
<style>
  html,body{margin:0;height:100%;background:#060807;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  "use strict";

  var cv = document.getElementById("cv");
  var g = cv.getContext("2d", { alpha: false });
  if (!g) return;

  var W = 1440, H = 900, DPR = 1, TAU = Math.PI * 2;
  var S = { lines: [], idx: -1, t: 0, playing: false, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}
  var GL = false;

  var SERIF = 'Georgia,"Times New Roman","Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif';
  var MONO = '"SFMono-Regular",Consolas,"Courier New",monospace';
  var INK = "rgb(236,229,214)";
  var INK_RGB = "236,229,214";

  /* ---------- 自检 ---------- */
  window.__stage = function () {
    var i = S.idx, tx = "";
    if (i >= 0 && S.lines[i] && S.lines[i].text != null) tx = String(S.lines[i].text);
    return {
      lines: S.lines.length, idx: i, t: S.t, playing: !!S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
      text: tx, gl: GL, rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var now = (window.performance && performance.now()) || Date.now();
    if (now - lastErrAt > 1000) {
      lastErrAt = now;
      try { console.error(e); } catch (_) {}
    }
  }

  /* ---------- ready：首个 rAF 无条件 + 800ms 兜底，只发一次 ---------- */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }

  /* ---------- 工具 ---------- */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoothstep(e0, e1, x) {
    var t = clamp((x - e0) / ((e1 - e0) || 1e-6), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function num(v, d) { v = Number(v); return isFinite(v) ? v : d; }
  function pad2(n) { n = Math.round(n); return (n < 10 ? "0" : "") + n; }
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  /* ---------- 颜色 ---------- */
  var ACC = [214, 106, 58], ACC_UI = "rgb(214,106,58)";
  function setAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return;
    var r = clamp(Math.round(num(a[0], 214)), 0, 255);
    var gg = clamp(Math.round(num(a[1], 106)), 0, 255);
    var b = clamp(Math.round(num(a[2], 58)), 0, 255);
    if (r + gg + b < 24) { r = 214; gg = 106; b = 58; }
    var lum = (0.2126 * r + 0.7152 * gg + 0.0722 * b) / 255;
    if (lum < 0.42) {
      var m = Math.min(0.55, (0.42 - lum) * 1.15);
      r = Math.round(r + (238 - r) * m);
      gg = Math.round(gg + (232 - gg) * m);
      b = Math.round(b + (216 - b) * m);
    }
    ACC = [r, gg, b];
    ACC_UI = "rgb(" + r + "," + gg + "," + b + ")";
  }
  function accA(a) { return "rgba(" + ACC[0] + "," + ACC[1] + "," + ACC[2] + "," + a + ")"; }

  /* ---------- 歌词数据：charTimes / buildLines / idxAt ---------- */
  function charTimes(line) {
    var chars = Array.from(line.text || ""), n = chars.length, out = new Array(n);
    var cs = line.chars, i, j, rec, ct;
    if (cs && cs.length) {
      var rel = cs[0] && isFinite(cs[0].t) && cs[0].t < line.t - 0.08;
      for (i = 0; i < n; i++) {
        j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        rec = cs[j];
        ct = rec && rec.t;
        out[i] = isFinite(ct) ? (rel ? line.t + ct : ct) : null;
      }
      return out;
    }
    var d = line.dur > 0 ? line.dur : 3.4;
    for (i = 0; i < n; i++) out[i] = line.t + d * 0.88 * i / Math.max(1, n);
    return out;
  }

  function buildLines(raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      if (!l || typeof l !== "object") continue;
      var text = (l.text == null) ? "" : String(l.text);
      if (!text.trim()) continue;
      var t = num(l.t, 0); if (t < 0) t = 0;
      var dur = num(l.dur, 0); if (dur < 0) dur = 0;
      var line = {
        t: t, dur: dur, text: text,
        chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null
      };
      line.times = charTimes(line);
      out.push(line);
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  /* ---------- 播放状态 ---------- */
  var songName = "", artistName = "", duration = 0, lastSig = "";
  var drum = { pos: 0, vel: 0 };
  var beatAmt = 0, level = 0, bass = 0, bpm = 0, needle = 0.08;
  var lastTickAt = -1e9, lastMoveAt = -1e9, prevTickT = null, visT = 0;

  function applyInit(p) {
    p = p || {};
    var lines = buildLines(p.lines);
    var sig = lines.length + "|";
    for (var i = 0; i < lines.length; i++) sig += lines[i].t + ":" + lines[i].text + "~";
    var changed = sig !== lastSig;
    S.lines = lines;
    lastSig = sig;
    if (Array.isArray(p.accent)) setAccent(p.accent);
    var song = p.song || {};
    songName = String(song.title || song.name || "");
    artistName = String(song.artist || song.artistName || "");
    duration = num(p.duration, 0);
    if (typeof p.playing === "boolean") S.playing = p.playing;
    S.idx = idxAt(S.t);
    if (changed) {
      drum.pos = Math.max(0, S.idx);
      drum.vel = 0;
      beatAmt = 0;
    }
  }

  function onBeat(p) {
    p = p || {};
    var v = clamp(num(p.level, 0.5), 0, 1);
    var i = num(p.index, 1);
    var k = (i === 0) ? (0.85 + v * 0.15) : (0.42 + v * 0.30);
    beatAmt = Math.max(beatAmt, k);
  }

  addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    try {
      if (d.type === "init") {
        applyInit(p);
      } else if (d.type === "tick") {
        var t = Number(p.time);
        if (isFinite(t)) {
          if (Math.abs(t - S.t) > 0.5) {
            S.t = t;
            S.idx = idxAt(t);
            drum.pos = Math.max(0, S.idx);
            drum.vel = 0;
            beatAmt = 0;
          } else {
            S.t = t;
          }
          if (prevTickT == null || Math.abs(t - prevTickT) > 1e-4) {
            lastMoveAt = performance.now();
          }
          prevTickT = t;
          lastTickAt = performance.now();
        }
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") {
        onBeat(p);
      } else if (d.type === "live") {
        var lv = Number(p.level);
        if (isFinite(lv)) level = clamp(lv, 0, 1);
        var bs = Number(p.bass);
        if (isFinite(bs)) bass = clamp(bs, 0, 1);
        var bp = Number(p.bpm);
        if (isFinite(bp) && bp > 0) bpm = bp;
        if (typeof p.playing === "boolean") S.playing = p.playing;
      }
    } catch (e) { logErr(e); }
  });

  /* ---------- 画布 / 尺寸 ---------- */
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(320, window.innerWidth || 1440);
    H = Math.max(320, window.innerHeight || 900);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeGrain();
  }

  var grain = null;
  function makeGrain() {
    var c = document.createElement("canvas");
    c.width = 140; c.height = 140;
    var gg = c.getContext("2d");
    var id = gg.createImageData(140, 140);
    for (var i = 0; i < id.data.length; i += 4) {
      var v = (Math.random() * 255) | 0;
      id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = 20;
    }
    gg.putImageData(id, 0, 0);
    grain = g.createPattern(c, "repeat");
  }

  /* ---------- 布局 ---------- */
  function layoutStage() {
    var cx = W / 2, cy = H / 2;
    var pw = Math.min(Math.max(W * 0.88, 300), W - 24, 1120);
    var ph = Math.min(Math.max(H * 0.60, 260), H - 28, 540);
    var px = cx - pw / 2, py = cy - ph / 2;
    var padL = Math.max(26, Math.min(54, pw * 0.050));
    var padR = Math.max(26, Math.min(58, pw * 0.056));
    var padT = Math.max(52, Math.min(76, ph * 0.140));
    var padB = Math.max(54, Math.min(84, ph * 0.155));
    var ww = Math.max(150, pw - padL - padR);
    var wh = Math.max(110, ph - padT - padB);
    var wx = px + padL, wy = py + padT;
    return {
      cx: cx, cy: cy, px: px, py: py, pw: pw, ph: ph,
      padL: padL, padR: padR, padT: padT, padB: padB,
      wx: wx, wy: wy, ww: ww, wh: wh
    };
  }

  /* ---------- 背景 ---------- */
  function drawBG(L) {
    var bg = g.createRadialGradient(L.cx, L.cy * 0.86, 0, L.cx, L.cy, Math.max(W, H) * 0.82);
    bg.addColorStop(0, "#141815");
    bg.addColorStop(0.55, "#0b0e0c");
    bg.addColorStop(1, "#050706");
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    /* 极淡的 accent 温度，只在仪表背后 */
    var tone = g.createRadialGradient(L.cx, L.cy, Math.min(W, H) * 0.12, L.cx, L.cy, Math.min(W, H) * 0.62);
    tone.addColorStop(0, accA(0.035));
    tone.addColorStop(1, accA(0));
    g.fillStyle = tone;
    g.fillRect(0, 0, W, H);

    if (grain) {
      g.save();
      g.globalAlpha = 0.55;
      g.fillStyle = grain;
      g.fillRect(0, 0, W, H);
      g.restore();
    }

    /* 背景大圆弧 + 刻度，像一张检验图纸 */
    var r = Math.min(W, H) * 0.74;
    g.save();
    g.translate(L.cx, L.cy);
    g.strokeStyle = "rgba(" + INK_RGB + ",0.030)";
    g.lineWidth = 1;
    g.beginPath();
    g.arc(0, 0, r, 0, TAU);
    g.stroke();
    g.strokeStyle = "rgba(" + INK_RGB + ",0.045)";
    for (var i = 0; i < 72; i++) {
      var a = i / 72 * TAU;
      var r1 = r - (i % 6 === 0 ? 13 : 6), r2 = r;
      g.beginPath();
      g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      g.stroke();
    }
    g.restore();

    /* 四角裁切标记 */
    var m = Math.max(14, Math.min(W, H) * 0.032), s = Math.max(9, m * 0.7);
    g.strokeStyle = "rgba(" + INK_RGB + ",0.14)";
    g.lineWidth = 1;
    var pts = [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]];
    for (var k = 0; k < 4; k++) {
      var q = pts[k];
      g.beginPath();
      g.moveTo(q[0] + q[2] * s, q[1]);
      g.lineTo(q[0], q[1]);
      g.lineTo(q[0], q[1] + q[3] * s);
      g.stroke();
    }
  }

  /* ---------- 文本拟合 ---------- */
  function fitText(text, base, maxW) {
    g.font = base + "px " + SERIF;
    var w = g.measureText(text).width;
    var fs = base, sx = 1;
    if (w > maxW) {
      fs = Math.max(17, base * maxW / w);
      g.font = fs + "px " + SERIF;
      w = g.measureText(text).width;
      if (w > maxW) sx = maxW / w;
    }
    return { fs: fs, sx: sx, w: Math.min(maxW, w) };
  }

  function drawWholeLine(line, cx, cy, base, maxW, alpha) {
    if (alpha <= 0.002) return;
    var f = fitText(line.text, base, maxW);
    g.save();
    g.globalAlpha = alpha;
    g.fillStyle = INK;
    g.textAlign = "left";
    g.textBaseline = "middle";
    g.translate(cx - f.w * f.sx / 2, cy);
    g.scale(f.sx, 1);
    g.fillText(line.text, 0, 0);
    g.restore();
  }

  function drawCurrentLine(line, cx, cy, base, maxW) {
    var f = fitText(line.text, base, maxW);
    var fs = f.fs;
    g.font = fs + "px " + SERIF;
    g.textAlign = "left";
    g.textBaseline = "middle";
    var chars = Array.from(line.text);
    var n = chars.length, pref = new Array(n), i;
    for (i = 0; i < n; i++) pref[i] = g.measureText(chars.slice(0, i + 1).join("")).width;
    var total = pref[n - 1] || 1;
    var sx = Math.min(1, maxW / total);
    var x0 = cx - total * sx / 2;
    var caretX = -1;

    for (i = 0; i < n; i++) {
      var ch = chars[i];
      var ct = line.times[i];
      var e = 1, dy = 0;
      if (ct != null && isFinite(ct)) {
        e = clamp((S.t - ct) / 0.16, 0, 1);
        e = easeOutCubic(e);
        dy = (1 - e) * fs * 0.22;
      }
      if (e <= 0.004 && ct != null && S.t < ct) {
        if (caretX < 0) caretX = x0 + (i ? pref[i - 1] : 0) * sx;
        continue;
      }
      if (ch === " " || ch === "　") continue;
      var px = x0 + (i ? pref[i - 1] : 0) * sx;
      g.globalAlpha = e;
      g.fillStyle = INK;
      g.fillText(ch, px, cy + dy);
    }
    g.globalAlpha = 1;

    /* 下一个未唱字：一根细 accent 游标 */
    if (caretX < 0) {
      for (i = 0; i < n; i++) {
        if (line.times[i] != null && S.t < line.times[i] - 0.015) {
          if (chars[i] !== " ") { caretX = x0 + (i ? pref[i - 1] : 0) * sx; break; }
        }
      }
    }
    if (caretX >= 0) {
      g.strokeStyle = accA(0.55);
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(caretX + 1, cy - fs * 0.52);
      g.lineTo(caretX + 1, cy + fs * 0.52);
      g.stroke();
    }
  }

  /* ---------- 面板 ---------- */
  function drawPlate(L) {
    var jolt = RM ? 0 : Math.min(1.6, beatAmt * 1.7);
    var px = L.px, py = L.py, pw = L.pw, ph = L.ph;
    var win = L.wx, wiy = L.wy, ww = L.ww, wh = L.wh;

    g.save();
    g.translate(0, -jolt);

    /* 外板投影 */
    g.save();
    g.shadowColor = "rgba(0,0,0,0.58)";
    g.shadowBlur = 52;
    g.shadowOffsetY = 26;
    roundRect(px, py, pw, ph, 20);
    g.fillStyle = "#141815";
    g.fill();
    g.restore();

    /* 金属面 */
    var mg = g.createLinearGradient(px, py, px + pw * 0.85, py + ph);
    mg.addColorStop(0, "#2a2f2b");
    mg.addColorStop(0.38, "#1d221f");
    mg.addColorStop(0.72, "#171b18");
    mg.addColorStop(1, "#0f1210");
    roundRect(px, py, pw, ph, 20);
    g.fillStyle = mg;
    g.fill();

    g.save();
    roundRect(px, py, pw, ph, 20);
    g.clip();
    if (grain) {
      g.globalAlpha = 0.34;
      g.fillStyle = grain;
      g.fillRect(px, py, pw, ph);
      g.globalAlpha = 1;
    }
    /* 缓慢掠过的高光，哑光不发光 */
    var sweep = RM ? pw * 0.5 : (((visT * 26) % (pw + 500)) - 250);
    var sh = g.createLinearGradient(px + sweep - 150, py, px + sweep + 150, py + ph);
    sh.addColorStop(0, "rgba(255,248,232,0)");
    sh.addColorStop(0.5, "rgba(255,248,232,0.040)");
    sh.addColorStop(1, "rgba(255,248,232,0)");
    g.fillStyle = sh;
    g.fillRect(px, py, pw, ph);
    /* 细横纹 */
    g.strokeStyle = "rgba(0,0,0,0.10)";
    g.lineWidth = 1;
    for (var yy = py + 6; yy < py + ph; yy += 9) {
      g.beginPath();
      g.moveTo(px, yy);
      g.lineTo(px + pw, yy);
      g.stroke();
    }
    g.restore();

    /* 外框 */
    roundRect(px + 0.5, py + 0.5, pw - 1, ph - 1, 20);
    g.strokeStyle = "rgba(0,0,0,0.72)";
    g.lineWidth = 1;
    g.stroke();
    roundRect(px + 2.5, py + 2.5, pw - 5, ph - 5, 18);
    g.strokeStyle = "rgba(255,250,235,0.070)";
    g.stroke();

    /* 螺钉 */
    var sr = Math.max(3, Math.min(5, pw * 0.0048));
    var inset = 14;
    var screws = [
      [px + inset, py + inset], [px + pw - inset, py + inset],
      [px + inset, py + ph - inset], [px + pw - inset, py + ph - inset]
    ];
    for (var si = 0; si < screws.length; si++) {
      var sp = screws[si];
      g.beginPath();
      g.arc(sp[0], sp[1], sr, 0, TAU);
      g.fillStyle = "#313631";
      g.fill();
      g.strokeStyle = "rgba(0,0,0,0.65)";
      g.lineWidth = 1;
      g.stroke();
      g.beginPath();
      g.moveTo(sp[0] - sr * 0.72, sp[1] + sr * 0.32);
      g.lineTo(sp[0] + sr * 0.72, sp[1] - sr * 0.32);
      g.strokeStyle = "rgba(0,0,0,0.60)";
      g.stroke();
    }

    /* 顶部铭牌 */
    var topY = py + L.padT * 0.42;
    g.fillStyle = accA(0.90);
    g.fillRect(px + L.padL, topY - 4.5, 5, 9);
    drawSpaced("LYRIC REGISTER", px + L.padL + 13, topY, 2.3, 9.5, 0.58);

    var rightX = px + pw - L.padR;
    var title = songName || "UNTITLED";
    title = truncate(title, L.ww * 0.46, 10);
    g.font = "10px " + MONO;
    g.textAlign = "right";
    g.textBaseline = "middle";
    g.globalAlpha = 0.52;
    g.fillStyle = INK;
    g.fillText(title, rightX, topY);
    g.globalAlpha = 1;

    if (artistName) {
      g.globalAlpha = 0.30;
      g.fillText(truncate(artistName, L.ww * 0.46, 9), rightX, topY + 14);
      g.globalAlpha = 1;
    }

    /* 鼓轮视窗 */
    var wg = g.createLinearGradient(win, wiy, win, wiy + wh);
    wg.addColorStop(0, "#050706");
    wg.addColorStop(0.55, "#080b09");
    wg.addColorStop(1, "#0a0d0b");
    roundRect(win, wiy, ww, wh, 9);
    g.fillStyle = wg;
    g.fill();
    g.strokeStyle = "rgba(0,0,0,0.88)";
    g.lineWidth = 2;
    g.stroke();
    roundRect(win + 1.5, wiy + 1.5, ww - 3, wh - 3, 7.5);
    g.strokeStyle = "rgba(255,248,232,0.075)";
    g.lineWidth = 1;
    g.stroke();

    /* 窗内文本 */
    g.save();
    roundRect(win, wiy, ww, wh, 8);
    g.clip();

    var cy = wiy + wh * 0.5;
    var baseFs = clamp(wh * 0.38, 22, 82);
    var step = Math.max(86, Math.min(wh * 0.55, 168));
    var maxW = ww * 0.90;
    var i, d, y;

    if (!S.lines.length) {
      g.font = Math.max(15, baseFs * 0.4) + "px " + MONO;
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.globalAlpha = 0.24;
      g.fillStyle = INK;
      g.fillText("—   —   —", win + ww / 2, cy);
      g.globalAlpha = 1;
    } else {
      for (i = S.idx - 2; i <= S.idx + 2; i++) {
        if (i < 0 || i >= S.lines.length) continue;
        d = i - drum.pos;
        if (Math.abs(d) > 2.2) continue;
        y = cy + d * step;
        var ln = S.lines[i];
        if (i === S.idx) {
          drawCurrentLine(ln, win + ww / 2, y, baseFs, maxW);
        } else {
          var ga = 0.155 * clamp(1 - Math.abs(d) * 0.42, 0, 1);
          if (i === 0 && S.idx < 0) ga = 0.34;
          drawWholeLine(ln, win + ww / 2, y, baseFs, maxW, ga);
        }
      }
    }

    /* 中心基准线 */
    g.strokeStyle = "rgba(" + INK_RGB + ",0.055)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(win, cy);
    g.lineTo(win + ww, cy);
    g.stroke();

    /* 上下渐隐，制造鼓面的暗边 */
    var fg = g.createLinearGradient(0, wiy, 0, wiy + wh);
    fg.addColorStop(0, "rgba(5,7,6,1)");
    fg.addColorStop(0.22, "rgba(5,7,6,0)");
    fg.addColorStop(0.78, "rgba(5,7,6,0)");
    fg.addColorStop(1, "rgba(5,7,6,1)");
    g.fillStyle = fg;
    g.fillRect(win, wiy, ww, wh);

    g.restore();

    /* 左侧刻度 */
    var tx = win - 3;
    g.lineWidth = 1;
    for (var ty = wiy + 4; ty <= wiy + wh - 4; ty += 7) {
      var major = (Math.round((ty - wiy) / 7) % 5 === 0);
      g.strokeStyle = "rgba(" + INK_RGB + "," + (major ? 0.30 : 0.14) + ")";
      g.beginPath();
      g.moveTo(tx - (major ? 8 : 3.5), ty);
      g.lineTo(tx, ty);
      g.stroke();
    }
    /* 读数指针：固定的 accent 三角 */
    g.beginPath();
    g.moveTo(tx - 12, cy - 5);
    g.lineTo(tx - 1, cy);
    g.lineTo(tx - 12, cy + 5);
    g.closePath();
    g.fillStyle = accA(RM ? 0.70 : (0.55 + beatAmt * 0.4));
    g.fill();

    /* 右侧 VU 梯尺 */
    var gx = win + ww + Math.max(9, L.padR * 0.38);
    var gw = Math.max(4, Math.min(8, L.padR * 0.20));
    var gy0 = wiy + 6, gy1 = wiy + wh - 6, gh = gy1 - gy0;
    var segs = 16;
    var lvl = clamp(level * 0.9 + (RM ? beatAmt * 0.10 : beatAmt * 0.22), 0, 1);
    var lit = lvl * segs;
    for (var s = 0; s < segs; s++) {
      var sy = gy1 - (s + 1) * (gh / segs) + 1.2;
      var shh = Math.max(1.5, gh / segs - 2.4);
      roundRect(gx, sy, gw, shh, 1);
      if (s < lit) g.fillStyle = accA(0.86);
      else g.fillStyle = "rgba(" + INK_RGB + ",0.08)";
      g.fill();
    }
    var ny = gy1 - needle * gh;
    g.strokeStyle = accA(0.96);
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(gx - 4, ny);
    g.lineTo(gx + gw + 4, ny);
    g.stroke();
    g.fillStyle = accA(1);
    g.beginPath();
    g.moveTo(gx - 5, ny);
    g.lineTo(gx - 10, ny - 3);
    g.lineTo(gx - 10, ny + 3);
    g.closePath();
    g.fill();

    /* 底部：行号 / 进度条 / BPM */
    var by = wiy + wh + L.padB * 0.45;
    var prog = 0;
    if (S.lines.length && S.idx >= 0) {
      var cur = S.lines[S.idx];
      if (cur.dur > 0) prog = clamp((S.t - cur.t) / cur.dur, 0, 1);
    }
    var bw = ww, bh = 2;
    g.fillStyle = "rgba(" + INK_RGB + ",0.10)";
    g.fillRect(win, by - 9, bw, bh);
    g.fillStyle = accA(0.80);
    g.fillRect(win, by - 9, bw * prog, bh);

    var leftLabel = S.lines.length
      ? "LINE " + pad2(S.idx + 1) + " / " + pad2(S.lines.length)
      : "AUDIO ONLY";
    drawSpaced(leftLabel, win, by + 7, 1.5, 9, 0.50);

    var rightLabel = "BPM " + (bpm > 0 ? pad2(bpm) : "--");
    g.font = "9px " + MONO;
    g.textAlign = "right";
    g.textBaseline = "middle";
    g.globalAlpha = 0.50;
    g.fillStyle = INK;
    g.fillText(rightLabel, win + ww, by + 7);

    if (duration > 0) {
      g.globalAlpha = 0.32;
      var mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
      g.fillText("T " + pad2(mm) + ":" + pad2(ss), win + ww, by - 22);
      g.globalAlpha = 1;
    }

    /* 极小的型号铭文（矮屏让位给 BPM） */
    if (L.padB > 62) {
      g.font = "8px " + MONO;
      g.textAlign = "right";
      g.globalAlpha = 0.28;
      g.fillStyle = INK;
      g.fillText("SER. 637 · S03A", px + pw - L.padR, py + ph - 16);
      g.globalAlpha = 1;
      g.textAlign = "left";
    }

    g.restore();
  }

  function drawSpaced(text, x, y, sp, size, alpha) {
    g.font = size + "px " + MONO;
    g.textAlign = "left";
    g.textBaseline = "middle";
    var chars = Array.from(text), i, w, total = 0, ws = [];
    for (i = 0; i < chars.length; i++) { w = g.measureText(chars[i]).width; ws.push(w); total += w; }
    total += sp * Math.max(0, chars.length - 1);
    var cx = x;
    g.globalAlpha = alpha;
    g.fillStyle = INK;
    for (i = 0; i < chars.length; i++) {
      if (chars[i] !== " ") g.fillText(chars[i], cx, y);
      cx += ws[i] + sp;
    }
    g.globalAlpha = 1;
  }

  function truncate(text, maxW, size) {
    g.font = size + "px " + MONO;
    if (g.measureText(text).width <= maxW) return text;
    var out = text;
    while (out.length > 0 && g.measureText(out + "…").width > maxW) out = out.slice(0, -1);
    return out + "…";
  }

  /* ---------- 主循环 ---------- */
  var lastNow = 0, raf = 0, dead = false;

  function update(dt, now) {
    S.idx = idxAt(S.t);
    var target = S.idx >= 0 ? S.idx : 0;
    var k = RM ? 175 : 120;
    var c = RM ? 34 : 15;
    var acc = (target - drum.pos) * k - drum.vel * c;
    drum.vel += acc * dt;
    drum.pos += drum.vel * dt;
    if (Math.abs(target - drum.pos) < 0.0015 && Math.abs(drum.vel) < 0.01) {
      drum.pos = target; drum.vel = 0;
    }

    beatAmt *= Math.exp(-7 * dt);
    if (beatAmt < 0.001) beatAmt = 0;

    var bv = RM ? beatAmt * 0.25 : beatAmt;
    var nt = clamp(0.07 + level * 0.76 + bv * 0.20, 0, 1);
    needle += (nt - needle) * (1 - Math.exp(-10 * dt));

    visT = S.t;
    var recent = (now - lastTickAt) < 600 && (now - lastMoveAt) < 350;
    if (S.playing && recent) visT += Math.min(0.25, (now - lastMoveAt) / 1000);
  }

  function frame(now) {
    if (dead) return;
    raf = requestAnimationFrame(frame);
    if (!lastNow) lastNow = now;
    var dt = Math.min(0.045, Math.max(0.001, (now - lastNow) / 1000));
    lastNow = now;
    var a = performance.now();
    try {
      update(dt, now);
      var L = layoutStage();
      drawBG(L);
      drawPlate(L);
    } catch (e) { logErr(e); }
    S.js += performance.now() - a;
    S.frames++;
  }

  addEventListener("resize", resize);
  addEventListener("pagehide", function () {
    dead = true;
    cancelAnimationFrame(raf);
  });
  try {
    if (window.matchMedia) {
      var mq = matchMedia("(prefers-reduced-motion: reduce)");
      if (mq.addEventListener) mq.addEventListener("change", function (e) { RM = !!e.matches; });
    }
  } catch (e) {}

  resize();
  requestAnimationFrame(function () { sendReady(); });
  setTimeout(sendReady, 800);
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
