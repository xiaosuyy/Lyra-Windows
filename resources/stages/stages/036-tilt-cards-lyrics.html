<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倾斜卡片</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(150,158,190,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
  /* 卡片墙本身就是画布：body 的径向渐变 + 网格线 */
  body{background:
    radial-gradient(90% 70% at 50% -10%,rgba(80,100,220,.13),rgba(0,0,0,0) 55%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.016) 0 1px,transparent 1px 46px),
    #05060a}
  #wall{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
        perspective:1250px;perspective-origin:50% 44%;
        scrollbar-width:none;overscroll-behavior:contain}
  #wall::-webkit-scrollbar{width:0;height:0}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);
        gap:clamp(12px,1.7vw,26px);width:min(94vw,1120px);margin:0 auto;
        padding:22vh 0;transform-style:preserve-3d;will-change:transform}
  .card{position:relative;width:100%;height:calc(100% - 34px);min-height:190px;
        transform-style:preserve-3d;will-change:transform;
        transition:transform .78s cubic-bezier(.3,1.06,.34,1)}
  .card.live{transform:translateZ(58px) rotateY(180deg)}
  /* 没在唱的卡：退后 + 压暗 + 轻模糊 → 当前句卡片是唯一的焦点 */
  .card.away{transform:translateZ(-34px)}
  .card.away .face{opacity:.55;filter:saturate(.55) blur(1.4px)}
  .face{position:absolute;inset:0;border-radius:16px;overflow:hidden;
        backface-visibility:hidden;-webkit-backface-visibility:hidden;
        box-shadow:0 20px 46px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.07)}
  .card.active .face{box-shadow:0 28px 62px rgba(0,0,0,.6),
        inset 0 0 0 1px rgba(var(--ac),.55),0 0 44px -8px rgba(var(--ac),.5)}
  /* 正面：只有编号与进度，背面才藏着词 —— 翻面 = 开唱 */
  .front{background:
    radial-gradient(80% 70% at 24% 84%,rgba(255,255,255,.10),rgba(255,255,255,0) 62%),
    conic-gradient(from 205deg at 72% 16%,rgba(255,255,255,.10),rgba(255,255,255,0) 34%),
    linear-gradient(155deg,#1a1f36,#0b0e1a 62%,#080a12)}
  .front::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 9px)}
  .no{position:absolute;left:13px;top:11px;
      font:700 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.3em;
      color:rgba(255,255,255,.55)}
  .cd{position:absolute;right:13px;top:11px;
      font:600 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;
      color:rgba(180,195,255,.45)}
  .glare{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(230px circle at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,.30),rgba(255,255,255,0) 64%);
    opacity:0;transition:opacity .28s ease;mix-blend-mode:screen}
  .card:hover .glare{opacity:1}
  .bar{position:absolute;left:0;right:0;bottom:0;height:2px;
       background:rgba(255,255,255,.08)}
  .fill{display:block;height:100%;width:0;
        background:linear-gradient(90deg,rgba(var(--ac),.5),rgba(var(--ac),1));
        box-shadow:0 0 12px rgba(var(--ac),.85)}
  .back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;
        padding:16px 14px 20px;text-align:center;
        background:
          radial-gradient(75% 65% at 78% 2%,rgba(var(--ac),.20),rgba(0,0,0,0) 62%),
          linear-gradient(160deg,#10141f,#0a0d16)}
  .ly{font:800 var(--fs)/1.34 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      letter-spacing:0;color:#f2f5ff;white-space:pre-wrap;overflow-wrap:anywhere;
      text-shadow:0 0 26px rgba(var(--ac),.35)}
  .ly .ch{display:inline-block;opacity:.10;transform:translateY(9px) scale(.9);
          filter:blur(3px);transition:opacity .30s ease,transform .30s ease,filter .30s ease}
  .card.active .ly .ch.on{opacity:1;transform:none;filter:blur(0);
          text-shadow:0 0 20px rgba(var(--ac),.6)}
  .foot{position:absolute;left:0;right:0;bottom:6px;
        font:600 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.26em;
        color:rgba(190,200,240,.34)}
  /* 踩拍：整面墙相干地弹一下 */
  #grid.pulse{animation:wpulse .26s cubic-bezier(.22,.9,.3,1)}
  @keyframes wpulse{
    0%{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0)}
    38%{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(var(--bz,26px))}
    100%{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0)}
  }
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="wall"><div id="grid"></div></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ===========================================================================
   036 · 倾斜卡片 —— 一句词就是墙上一张卡，开唱即翻面
   ---------------------------------------------------------------------------
   核心机制：**卡片背面的朝向 + 全墙一致的指向性高光**。
   参考文件里一张卡有两个状态：正面是画，背面是说明；鼠标位置决定
   高光落在卡面的哪一点（radial-gradient 的 --mx/--my），
   悬停时整张卡绕 X/Y 倾斜（rotateX/rotateY）。
   这里把它接到歌词上，而且是**整面墙一起**：
     · 每一句词预先占据网格里的一个位置，正面只有编号和进度，
       词在**背面**。所以"翻面"就是"开唱"——翻之前你永远看不到下一句，
       翻面这件事本身是这句词的开场动作；
     · 鼠标位置不驱动单张卡，而是驱动整面墙的 rotateX/rotateY；
       每张卡的高光点由**它自己在墙上的位置**换算出来（卡越靠右，
       高光越靠右），于是整面墙共享同一个"光源方向"——
       这就是参考文件里每张卡各自 hover 的那种高光，被升级成一场光照；
     · 踩拍时整面墙相干地朝镜头弹一下（translateZ），不是逐张乱抖。

   和已有 10 个的区别：001-010 全在动**粒子**，这里是**朝向与光照**，
   而且"显示哪句"和"哪张卡朝前"是同一件事的两个面 ——
   信息藏在背面，翻面就是节拍点。

   性能：翻面是 CSS 合成层的 transform，不逐帧写样式；
   字形不采样（词是真的文字），每帧只写一个进度条宽度。

   精修记录：canvas 从"不透明黑布（盖住 body 渐变背景 → smoke 全黑、画面少一层）"
   改为**景深光斑层**（accent 染色的 bokeh 精灵，三层深度随 live 卡方向视差，
   beat 相干脉冲）；当前句卡片聚焦、其余卡片退后+压暗+轻模糊（.away，换句时切换）；
   字号按行数重排（长句 2~4 行折行，41 字从 12px 提到 ~29px，完整可读）；
   逐字点亮接 YRC（chars[k].t 时 .on，无 chars 均分；__stage 增加 yrc 字段）。
   分词：不使用。卡片背面按行折行、逐字时间已精确到字，分词没有收益。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: true });
const hint = document.getElementById('hint');
const wall = document.getElementById('wall');
const grid = document.getElementById('grid');

let W = 0, H = 0, DPR = 1;
let accent = [140, 150, 255];
let lines = [];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ---- 景深光斑层（canvas 唯一的活）：三层深度，beat 相干脉冲，live 卡方向视差 ---- */
let bok = null, beatP = 0, bokDrift = 0;
function bakeBokeh() {
  const n = 22;
  const rnd = () => { bokSeed = (bokSeed * 1103515245 + 12345) & 0x7fffffff; return bokSeed / 0x7fffffff; };
  bok = [];
  for (let i = 0; i < n; i++) {
    const layer = i % 3;                       // 0 远 1 中 2 近
    const r = 10 + rnd() * (26 + layer * 44);
    bok.push({
      x: rnd() * W, y: rnd() * H, r: r, layer: layer,
      vy: 4.5 + layer * 5 + rnd() * 3,
      a: 0.10 + layer * 0.05 + rnd() * 0.05,
      ph: rnd() * 6.283, tw: 0.4 + rnd() * 0.5
    });
  }
  /* 光斑精灵：accent 染色的软圆 */
  bokSpr = document.createElement('canvas');
  bokSpr.width = 128; bokSpr.height = 128;
  const g = bokSpr.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',0.9)');
  gr.addColorStop(0.55, 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',0.32)');
  gr.addColorStop(1, 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
}
let bokSeed = 90123, bokSpr = null;
function drawBokeh(dt, t0) {
  if (!bok || !bokSpr) return;
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen';
  const px = ry * 26, py = rx * 16;            // live 卡方向的反向视差
  for (let i = 0; i < bok.length; i++) {
    const b = bok[i];
    b.y -= b.vy * dt;
    if (b.y < -b.r * 2) { b.y = H + b.r; b.x = Math.random() * W; }
    const depth = [0.25, 0.55, 1][b.layer];
    const x = b.x + px * depth * -1, y = b.y + py * depth * -1;
    const tw = 0.72 + 0.28 * Math.sin(t0 * b.tw * 2.2 + b.ph);
    const r2 = b.r * (1 + beatP * 0.35 * depth);
    ctx.globalAlpha = b.a * tw * (0.8 + beatP * 0.5);
    ctx.drawImage(bokSpr, x - r2, y - r2, r2 * 2, r2 * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

const cards = [];
let live = -1;

function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function hex2(n) { const s = n.toString(16); return s.length < 2 ? '0' + s : s; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* 卡片高度随列宽走（4:5 的画框） */
function cardHeight() {
  const cw = (Math.min(W * 0.94, 1120) - 2 * clamp(W * 0.017, 12, 26)) / 3;
  return clamp(cw * 1.06, 180, 300);
}

/* 长句折行：可用面积 → 行数（2~4 行），标点/空格优先断，均匀分行；字号随最长行缩 */
function wrapLine(txt, h) {
  const n = txt.length;
  const maxRows = n <= 10 ? 1 : n <= 20 ? 2 : n <= 32 ? 3 : 4;
  const rows = [];
  if (maxRows === 1) rows.push(txt);
  else {
    let start = 0;
    for (let r = 1; r <= maxRows; r++) {
      const ideal = Math.round((n * r) / maxRows);
      let b = ideal, bd = 1e9;
      for (let i = Math.max(start + 2, ideal - 6); i <= Math.min(n - 2, ideal + 6); i++) {
        const c = txt[i - 1];
        if (c === ' ' || /[，。！？、；：…—,.!?;:]/.test(c)) {
          const d = Math.abs(i - ideal);
          if (d < bd) { bd = d; b = i; }
        }
      }
      b = Math.min(n, Math.max(start + 1, b));
      rows.push(txt.slice(start, b));
      start = b;
      if (start >= n) break;
    }
    if (start < n) rows.push(txt.slice(start));
  }
  let F = Math.min(h * 0.26, (W * 0.22) / Math.max(4, n / maxRows));
  let wMax = 0;
  const c2 = document.createElement('canvas').getContext('2d');
  c2.font = '800 ' + F + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  for (const r of rows) wMax = Math.max(wMax, c2.measureText(r).width);
  const boxW = (Math.min(W * 0.94, 1120) - 2 * clamp(W * 0.017, 12, 26)) / 3 - 30;
  if (wMax > boxW) F = Math.max(13, F * (boxW / wMax));
  F = Math.min(F, (h * 0.66) / rows.length / 1.34);
  return { rows: rows, fs: Math.max(13, Math.min(44, F * 0.94)) };
}

function build() {
  fit();
  bakeBokeh();
  grid.textContent = '';
  cards.length = 0;
  live = -1;
  grid.style.gridAutoRows = cardHeight().toFixed(0) + 'px';
  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i].text || '';
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--ac', accent[0] + ',' + accent[1] + ',' + accent[2]);
    const front = document.createElement('div');
    front.className = 'face front';
    const no = document.createElement('span');
    no.className = 'no'; no.textContent = 'NO.' + hex2(i + 1).toUpperCase();
    const cd = document.createElement('span');
    cd.className = 'cd'; cd.textContent = (txt.length || 0) + ' 字';
    const gl = document.createElement('span');
    gl.className = 'glare';
    const bar = document.createElement('span');
    bar.className = 'bar';
    const fill = document.createElement('i');
    fill.className = 'fill';
    bar.appendChild(fill);
    front.appendChild(no); front.appendChild(cd);
    front.appendChild(gl); front.appendChild(bar);
    const back = document.createElement('div');
    back.className = 'face back';
    const ly = document.createElement('div');
    ly.className = 'ly';
    const wr = wrapLine(txt, cardHeight());
    ly.style.setProperty('--fs', wr.fs.toFixed(1) + 'px');
    /* 折行 DOM + 逐字时间（YRC：chars 可信用它，否则均分） */
    const L = lines[i];
    const n2 = txt.length;
    const ct = [];
    let yrcOK = !!(L.chars && L.chars.length === n2);
    if (yrcOK) {
      for (let k = 0; k < n2; k++) {
        const v = +L.chars[k].t;
        if (!isFinite(v)) { yrcOK = false; break; }
        ct.push(v);
      }
    }
    if (!yrcOK) {
      const dur = L.dur > 0 ? L.dur : 4;
      for (let k = 0; k < n2; k++) ct.push(L.t + dur * k / Math.max(1, n2));
    }
    for (let k = 1; k < n2; k++) if (ct[k] < ct[k - 1]) ct[k] = ct[k - 1];
    if (i === 0) curYrc = yrcOK;
    const spans = [];
    let gi = 0;
    for (const r of wr.rows) {
      spans.push({ i0: gi, n: r.length });
      gi += r.length;
    }
    const chs = [];
    gi = 0;
    for (const r of wr.rows) {
      const rowEl = document.createElement('span');
      rowEl.className = 'row';
      rowEl.style.display = 'block';
      for (let k = 0; k < r.length; k++) {
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = r[k];
        s.dataset.ct = ct[gi].toFixed(3);
        rowEl.appendChild(s);
        chs.push(s);
        gi++;
      }
      ly.appendChild(rowEl);
    }
    const foot = document.createElement('span');
    foot.className = 'foot'; foot.textContent = 'LYRIC CARD';
    back.appendChild(ly); back.appendChild(foot);
    card.appendChild(front); card.appendChild(back);
    grid.appendChild(card);
    cards.push({ el: card, front: front, fill: fill, chs: chs, lit: -1, t: lines[i].t, dur: lines[i].dur || 0 });
  }
}

/* 把墙当成一个整体来照明：卡在墙上的位置 → 它自己的高光落点 */
function lightWall() {
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].el.getBoundingClientRect();
    if (r.bottom < -80 || r.top > H + 80) continue;
    const nx = clamp((mx - r.left) / Math.max(1, r.width), 0, 1);
    const ny = clamp((my - r.top) / Math.max(1, r.height), 0, 1);
    cards[i].front.style.setProperty('--mx', (nx * 100).toFixed(1) + '%');
    cards[i].front.style.setProperty('--my', (ny * 100).toFixed(1) + '%');
  }
}

/* 鼠标 → 整面墙的倾斜（参考文件的 hover 倾斜，放大到整面墙） */
let mx = 0, my = 0, tx = 0, ty = 0, rx = 0, ry = 0;
addEventListener('pointermove', (e) => {
  mx = e.clientX; my = e.clientY;
  tx = (0.5 - my / Math.max(1, H)) * 7.5;
  ty = (mx / Math.max(1, W) - 0.5) * 10;
}, { passive: true });

/* ---- 节奏 ---- */
let curIdx = -1, brewIdx = -1, lastT = -1, curYrc = false;
const LEAD = 1.3;
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1;
    for (let i = 0; i < cards.length; i++) {
      cards[i].el.classList.remove('live', 'active', 'away');
      setCardLit(cards[i], -1);
    }
    live = -1;
  }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    if (live >= 0 && cards[live]) {
      cards[live].el.classList.remove('live', 'active');
      setCardLit(cards[live], -1);
    }
    /* 焦点切换：其余卡退后压暗，不在唱的才 .away */
    for (let i = 0; i < cards.length; i++) cards[i].el.classList.toggle('away', i !== ci);
    live = -1;
    if (ci >= 0 && cards[ci]) {
      const el = cards[ci].el;
      el.classList.remove('away');
      el.classList.add('live');
      live = ci;
      /* 激活态要等翻面过半才加，不然字的过渡在背面看不见 */
      setTimeout(() => { if (live === ci) el.classList.add('active'); }, 240);
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
    }
    hint.style.opacity = lines.length ? (ci >= 0 ? '0' : '1') : '0.5';
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) brewIdx = nx;
  }
}

/* 逐字点亮：ct 挂在 dataset 上，状态机从 lit（-1=全灭）续扫（ct 单调） */
function setCardLit(c, upTo) {
  const chs = c.chs;
  for (let i = 0; i < chs.length; i++) {
    if (upTo < 0) chs[i].classList.remove('on');
    else chs[i].classList.toggle('on', i <= upTo);
  }
  c.lit = upTo;
}
function updateCardChars(T) {
  if (curIdx < 0 || !cards[curIdx]) return;
  const c = cards[curIdx];
  const chs = c.chs;
  let nl = -1;
  while (nl + 1 < chs.length && +chs[nl + 1].dataset.ct <= T) nl++;
  if (nl !== c.lit) setCardLit(c, nl);
}

let last = performance.now();
let t0 = 0;
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();
  timing(T);
  beatP *= Math.pow(0.02, dt);

  const k = 1 - Math.exp(-dt * 5.5);
  rx += (tx - rx) * k; ry += (ty - ry) * k;
  grid.style.setProperty('--rx', rx.toFixed(2) + 'deg');
  grid.style.setProperty('--ry', ry.toFixed(2) + 'deg');
  /* 踩拍那 280ms 里 .pulse 动画的 transform 优先级更高，会自然接管；之后回落到这里 */
  grid.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
  drawBokeh(dt, t0);
  updateCardChars(T);
  lightWall();

  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const r = c.el.getBoundingClientRect();
    if (r.bottom < -120 || r.top > H + 120) continue;
    let p;
    if (i === curIdx && curIdx >= 0) {
      const d = c.dur > 0 ? c.dur : 4;
      p = clamp((T - c.t) / d, 0, 1);
    } else p = T >= c.t ? 1 : 0;
    c.fill.style.width = (p * 100).toFixed(1) + '%';
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {

  }

    const lv = d.payload && d.payload.level ? d.payload.level : 0.5;
    beatP = Math.min(1.4, beatP + 0.55 + lv * 0.7);

    grid.style.setProperty('--bz', (18 + 26 * lv).toFixed(0) + 'px');

    void grid.offsetWidth;
    grid.classList.add('pulse');
    setTimeout(() => {
      grid.classList.remove('pulse');

  yrc: curYrc, t: +now().toFixed(2), cards: cards.length,
  bok: bok ? bok.length : 0, beatP: +beatP.toFixed(2),
  rot: [+rx.toFixed(2), +ry.toFixed(2)]
});
