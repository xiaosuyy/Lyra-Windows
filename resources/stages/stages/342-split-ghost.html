<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>342 · 分裂残影</title>
<style>
  :root{--ink:#060409;--mag:#ff2f8e;--blue:#4a6bff;--bone:#f7e9f1;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--ink);overflow:hidden;}
  #wrap{position:fixed;inset:0;isolation:isolate;}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(96deg,rgba(4,2,7,.84) 0%,rgba(5,3,9,.60) 38%,rgba(6,3,10,.14) 66%,rgba(6,3,10,0) 86%);}
  #vign{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 78% 70% at 56% 44%,rgba(0,0,0,0) 34%,rgba(3,1,6,.55) 74%,rgba(2,0,4,.92) 100%);}
  #grain{position:absolute;inset:-6%;pointer-events:none;opacity:.15;mix-blend-mode:overlay;
    background-repeat:repeat;background-size:180px 180px;}
  #lyrscrim{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 46% 46% at 26% 74%,rgba(4,2,8,.62) 0%,rgba(4,2,8,.30) 46%,rgba(4,2,8,0) 78%);}
  #lyrics{position:absolute;left:7vw;bottom:12vh;width:min(44vw,640px);pointer-events:none;
    font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;}
  .lyr{color:var(--bone);text-align:left;line-height:1.36;letter-spacing:.015em;
    font-size:clamp(25px,3.05vw,54px);font-weight:600;max-width:100%;word-break:break-word;
    text-shadow:1px 0 0 rgba(255,47,142,.42),-1px 0 0 rgba(74,107,255,.30),0 0 26px rgba(255,47,142,.12);}
  .lyr .ch{opacity:.40;transition:opacity .2s linear;}
  .lyr .ch.on{opacity:1;}
  .lyr.prev,.lyr.next{font-size:clamp(14px,1.45vw,24px);font-weight:400;color:rgba(233,208,224,.42);
    letter-spacing:.06em;text-shadow:none;}
  .lyr.prev{margin-bottom:.85em;}
  .lyr.next{margin-top:.9em;color:rgba(233,208,224,.26);}
  #hud{position:absolute;inset:0;pointer-events:none;color:rgba(240,222,236,.40);
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:clamp(8px,.72vw,11px);letter-spacing:.30em;text-transform:uppercase;}
  #hud .tl{position:absolute;left:3.2vw;top:4.2vh;}
  #hud .tr{position:absolute;right:3.2vw;top:4.2vh;text-align:right;letter-spacing:.22em;max-width:44vw;}
  #hud .tr b,#hud .tr span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  #hud .bl{position:absolute;left:3.2vw;bottom:4.4vh;letter-spacing:.20em;color:rgba(255,120,180,.42);}
  #hud .br{position:absolute;right:3.2vw;bottom:4.4vh;text-align:right;color:rgba(160,180,255,.40);}
  #hud b{font-weight:400;color:rgba(255,190,220,.72);}
  #empty{position:absolute;left:7vw;bottom:15vh;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:clamp(10px,1vw,14px);letter-spacing:.42em;color:rgba(236,214,230,.38);display:none;}
  @media (max-width:760px),(max-aspect-ratio:3/4){
    #lyrics{left:7vw;right:7vw;width:auto;bottom:15vh;text-align:center;}
    .lyr{text-align:center;}
    #empty{left:0;right:0;text-align:center;}
    #scrim{background:linear-gradient(180deg,rgba(4,2,7,.55) 0%,rgba(5,3,9,.30) 40%,rgba(4,2,7,.88) 100%);}
    #hud .bl{display:none;}
    #hud .tr{max-width:52vw;}
    #hud .tl{letter-spacing:.18em;}
    #lyrscrim{background:radial-gradient(ellipse 78% 40% at 50% 80%,rgba(4,2,8,.70) 0%,rgba(4,2,8,.34) 48%,rgba(4,2,8,0) 80%);}
  }
  @media (prefers-reduced-motion:reduce){
    #grain{animation:none;opacity:.10;}
    .lyr .ch{transition:none;}
  }
  @keyframes gflick{0%{background-position:0 0}20%{background-position:-42px 18px}
    40%{background-position:24px -30px}60%{background-position:-18px -12px}
    80%{background-position:36px 26px}100%{background-position:0 0}}
  #grain{animation:gflick 1.1s steps(1,end) infinite;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bg"></canvas>
  <div id="scrim"></div>
  <div id="vign"></div>
  <div id="grain"></div>
  <div id="lyrscrim"></div>
  <div id="lyrics"></div>
  <div id="empty">· 器乐 / NO LYRICS ·</div>
  <div id="hud">
    <div class="tl">PLATE 39/50 &nbsp;·&nbsp; 分裂残影</div>
    <div class="tr"><b id="hTitle">—</b><span id="hSub">—</span></div>
    <div class="bl">SLOW SHUTTER · MULTI-EXPOSURE · MAGENTA / CYAN DARKROOM</div>
    <div class="br">EXP <b id="hExp">05</b>/05 &nbsp;·&nbsp; <span id="hTime">0.0s</span></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var W=1440,H=900,DPR=1;
  var cvs=document.getElementById('bg'), ctx=cvs.getContext('2d');
  var lyricsEl=document.getElementById('lyrics');
  var grainEl=document.getElementById('grain');
  var emptyEl=document.getElementById('empty');
  var hTitle=document.getElementById('hTitle'), hSub=document.getElementById('hSub');
  var hExp=document.getElementById('hExp'), hTime=document.getElementById('hTime');

  function clamp01(v){ v=+v; if(!isFinite(v)) return 0; return v<0?0:v>1?1:v; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function smooth(a,b,x){ var t=clamp01((x-a)/(b-a)); return t*t*(3-2*t); }
  function r255(v){ v=Math.round(v); return v<0?0:v>255?255:v; }
  function rgb(r,g,b){ return 'rgb('+r255(r)+','+r255(g)+','+r255(b)+')'; }
  function rgba(r,g,b,a){ return 'rgba('+r255(r)+','+r255(g)+','+r255(b)+','+(Math.round(clamp01(a)*1000)/1000)+')'; }

  var S={lines:[],idx:-1,t:0,playing:true,duration:0,accent:[255,47,142],
         frames:0,js:0,rm:false,ready:false,vt:0,seek:false,
         beat:0,beatT:-99,live:{bpm:0,level:0,bass:0,mid:0,treble:0},
         title:'',artist:'',exp:1};

  var P={mag:[255,47,142],blue:[52,86,232],bone:[247,233,241],acc:[255,47,142]};

  var IMG={forest:null,canopy:null,fig:null};
  var PLATE={base:null,dust:null,w:1280,h:720,ok:false,token:0};
  var GHOST={copies:[],tw:1,th:1,ready:false};

  function size(){
    var w=window.innerWidth||0, h=window.innerHeight||0;
    if(!isFinite(w)||w<=0) w=document.documentElement.clientWidth||0;
    if(!isFinite(h)||h<=0) h=document.documentElement.clientHeight||0;
    if(!isFinite(w)||w<=0) w=1440;
    if(!isFinite(h)||h<=0) h=900;
    W=Math.round(w); H=Math.round(h);
    DPR=Math.min(window.devicePixelRatio||1,1.75);
    cvs.width=Math.max(2,Math.round(W*DPR));
    cvs.height=Math.max(2,Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildLeaks();
  }

  /* ---------- light leaks (rebuilt on resize) ---------- */
  var LEAK={a:null,b:null,c:null};
  function buildLeaks(){
    try{
      var m=P.mag,b=P.blue;
      LEAK.a=ctx.createRadialGradient(W*0.86,H*0.06,0,W*0.86,H*0.06,Math.max(W,H)*0.85);
      LEAK.a.addColorStop(0,rgba(m[0],m[1],m[2],0.32));
      LEAK.a.addColorStop(0.45,rgba(m[0],m[1],m[2],0.10));
      LEAK.a.addColorStop(1,rgba(m[0],m[1],m[2],0));
      LEAK.b=ctx.createRadialGradient(W*0.06,H*1.02,0,W*0.06,H*1.02,Math.max(W,H)*0.72);
      LEAK.b.addColorStop(0,rgba(b[0],b[1],b[2],0.30));
      LEAK.b.addColorStop(0.5,rgba(b[0],b[1],b[2],0.08));
      LEAK.b.addColorStop(1,rgba(b[0],b[1],b[2],0));
      LEAK.c=ctx.createLinearGradient(0,0,0,H);
      LEAK.c.addColorStop(0,rgba(6,3,12,0.38));
      LEAK.c.addColorStop(0.55,rgba(6,3,12,0.0));
    }catch(e){ LEAK.a=LEAK.b=LEAK.c=null; }
  }

  /* ---------- assets ---------- */
  var buildTimer=0;
  function scheduleBuild(){
    if(buildTimer) return;
    buildTimer=setTimeout(function(){ buildTimer=0; buildAll(); },40);
  }
  function loadImg(key,src){
    var im=new Image();
    im.decoding='async';
    im.onload=function(){ IMG[key]=im; scheduleBuild(); };
    im.onerror=function(){ IMG[key]=null; scheduleBuild(); };
    im.src=src;
  }

  function drawCover(g,im,w,h,ox,oy){
    if(!im||!im.width) return;
    var s=Math.max(w/im.width,h/im.height);
    var dw=im.width*s, dh=im.height*s;
    g.drawImage(im,(w-dw)/2+(ox||0)*w,(h-dh)/2+(oy||0)*h,dw,dh);
  }

  function duotone(c,token,done){
    var g=c.getContext('2d'), w=c.width, h=c.height, img;
    try{ img=g.getImageData(0,0,w,h); }catch(e){ done&&done(); return; }
    var d=img.data, y=0, STEP=96;
    function slice(){
      if(token!==PLATE.token){ return; }
      var end=Math.min(h,y+STEP);
      for(;y<end;y++){
        var o=y*w*4;
        for(var x=0;x<w;x++){
          var i=o+x*4;
          var l=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255;
          l=clamp01((l-0.02)/0.55);
          var r,gg,b;
          if(l<0.33){ var t=l/0.33; r=lerp(5,40,t); gg=lerp(4,10,t); b=lerp(12,50,t); }
          else if(l<0.72){ var t2=(l-0.33)/0.39; r=lerp(40,190,t2); gg=lerp(10,28,t2); b=lerp(50,120,t2); }
          else { var t3=(l-0.72)/0.28; r=lerp(190,252,t3); gg=lerp(28,165,t3); b=lerp(120,210,t3); }
          d[i]=r<0?0:r>255?255:r;
          d[i+1]=gg<0?0:gg>255?255:gg;
          d[i+2]=b<0?0:b>255?255:b;
        }
      }
      if(y<h) setTimeout(slice,0);
      else { try{ g.putImageData(img,0,0); }catch(e){} done&&done(); }
    }
    slice();
  }

  function fogFallback(g,w,h){
    g.fillStyle='#0a0714'; g.fillRect(0,0,w,h);
    for(var i=0;i<9;i++){
      var t=i/9;
      var grd=g.createLinearGradient(0,h*(0.18+t*0.72),0,h*(0.36+t*0.72));
      grd.addColorStop(0,'rgba(18,12,30,0)');
      grd.addColorStop(0.5,'rgba(26,18,44,0.5)');
      grd.addColorStop(1,'rgba(10,6,18,0)');
      g.fillStyle=grd; g.fillRect(0,0,w,h);
    }
  }

  function buildDust(w,h){
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var g=c.getContext('2d');
    for(var i=0;i<220;i++){
      var x=Math.random()*w, y=Math.random()*h;
      var r=Math.random()*1.7+0.3, a=Math.random()*0.42+0.06;
      g.fillStyle=rgba(255,225,240,a);
      g.beginPath(); g.arc(x,y,r,0,6.284); g.fill();
    }
    for(var k=0;k<5;k++){
      g.strokeStyle=rgba(255,220,238,Math.random()*0.05+0.02);
      g.lineWidth=Math.random()*1.4+0.4;
      g.beginPath(); g.moveTo(Math.random()*w,0);
      g.bezierCurveTo(Math.random()*w,h*0.35,Math.random()*w,h*0.7,Math.random()*w,h);
      g.stroke();
    }
    return c;
  }

  function buildAll(){
    buildPlate();
    buildFigure();
  }

  function buildPlate(){
    var token=++PLATE.token;
    var w=1280,h=720;
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var g=c.getContext('2d');
    if(IMG.forest){
      drawCover(g,IMG.forest,w,h,0,0);
      if(IMG.canopy){
        g.save(); g.globalCompositeOperation='multiply'; g.globalAlpha=0.38;
        drawCover(g,IMG.canopy,w,h,0.01,0.02); g.restore();
      }
    } else { fogFallback(g,w,h); }
    var finish=function(){
      var c2=document.createElement('canvas'); c2.width=w; c2.height=h;
      var g2=c2.getContext('2d');
      g2.drawImage(c,0,0);
      g2.save();
      try{
        var vg=g2.createRadialGradient(w*0.54,h*0.46,0,w*0.54,h*0.46,Math.max(w,h)*0.72);
        vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(3,1,7,0.82)');
        g2.fillStyle=vg; g2.fillRect(0,0,w,h);
      }catch(e){}
      g2.restore();
      PLATE.base=c2;
      PLATE.dust=buildDust(1400,900);
      PLATE.ok=true;
      buildBleed();
    };
    if(IMG.forest) duotone(c,token,finish);
    else { finish(); }
  }

  function makeFigCanvas(alpha,tw,th,r,g,b,blurPx){
    var pad=blurPx>0?Math.ceil(blurPx*2.2):0;
    var c=document.createElement('canvas'); c.width=tw+pad*2; c.height=th+pad*2;
    var cg=c.getContext('2d');
    var id=cg.createImageData(tw,th);
    var d=id.data;
    for(var i=0,n=tw*th;i<n;i++){
      var a=alpha[i];
      d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=a;
    }
    var tmp=document.createElement('canvas'); tmp.width=tw; tmp.height=th;
    var tg=tmp.getContext('2d'); tg.putImageData(id,0,0);
    if(pad>0){
      try{ cg.filter='blur('+(blurPx|0)+'px)'; }catch(e){}
      cg.drawImage(tmp,pad,pad);
      cg.filter='none';
    } else { cg.drawImage(tmp,0,0); }
    return {canvas:c,pad:pad};
  }

  function procSilhouette(tw,th){
    var c=document.createElement('canvas'); c.width=tw; c.height=th;
    var g=c.getContext('2d');
    g.fillStyle='#000';
    g.beginPath(); g.ellipse(tw*0.50,th*0.265,tw*0.150,th*0.180,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse(tw*0.50,th*0.240,tw*0.300,th*0.034,0,0,6.2832); g.fill();
    g.beginPath();
    g.moveTo(tw*0.34,th);
    g.quadraticCurveTo(tw*0.39,th*0.60,tw*0.50,th*0.585);
    g.quadraticCurveTo(tw*0.61,th*0.60,tw*0.66,th);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(tw*0.08,th);
    g.quadraticCurveTo(tw*0.18,th*0.715,tw*0.42,th*0.665);
    g.lineTo(tw*0.58,th*0.665);
    g.quadraticCurveTo(tw*0.82,th*0.715,tw*0.92,th);
    g.closePath(); g.fill();
    var id;
    try{ id=g.getImageData(0,0,tw,th); }catch(e){ return new Uint8ClampedArray(tw*th); }
    var d=id.data, a=new Uint8ClampedArray(tw*th);
    for(var i=0;i<tw*th;i++){
      var v=d[i*4+3]/255;
      var x=i%tw, y=(i-x)/tw;
      var fx=clamp01(Math.min(x,tw-1-x)/(tw*0.12));
      var fy=clamp01(Math.min(y,th-1-y)/(th*0.05));
      a[i]=Math.round(v*fx*fy*255);
    }
    return a;
  }

  function buildFigure(){
    var im=IMG.fig;
    var tw=520, th=560, alpha=null;
    GHOST.bleed=null;
    if(im&&im.width&&im.height){
      var cw=Math.round(im.width*0.62), ch=im.height;
      var sx=Math.round((im.width-cw)/2), sy=0;
      th=Math.max(2,Math.round(tw*ch/Math.max(1,cw)));
      var c=document.createElement('canvas'); c.width=tw; c.height=th;
      var g=c.getContext('2d');
      try{
        g.drawImage(im,sx,sy,cw,ch,0,0,tw,th);
        var id=g.getImageData(0,0,tw,th);
        var d=id.data;
        alpha=new Uint8ClampedArray(tw*th);
        for(var y=0;y<th;y++){
          for(var x=0;x<tw;x++){
            var i=y*tw+x, o=i*4;
            var l=(d[o]*0.299+d[o+1]*0.587+d[o+2]*0.114)/255;
            var a=clamp01((0.47-l)/0.34);
            a=a*a*(3-2*a);
            var fx=clamp01(Math.min(x,tw-1-x)/(tw*0.12));
            var fy=clamp01(Math.min(y,th-1-y)/(th*0.05));
            alpha[i]=Math.round(a*fx*fy*255);
          }
        }
      }catch(e){ alpha=null; }
    }
    if(!alpha){ alpha=procSilhouette(tw,th); }
    GHOST.alpha=alpha;
    var m=P.mag, b=P.blue, bone=P.bone;
    function mk(mode,off,dy,sc,a,blur,r,g,bb,rot){
      var made=makeFigCanvas(alpha,tw,th,r,g,bb,blur);
      return {cv:made.canvas,pad:made.pad,off:off,dy:dy,sc:sc,a:a,mode:mode,rot:rot||0};
    }
    var copies=[
      mk('multiply',-0.300,0.016,1.040,0.50,26,12,7,20,-0.021),
      mk('lighter',0.560,-0.050,0.930,0.22,30,m[0],m[1],m[2],0.0454),
      mk('source-over',0.620,-0.060,0.905,0.30,24,156,132,198,0.0524),
      mk('source-over',0.315,-0.028,0.955,0.30,12,222,188,228,0.0279),
      mk('source-over',0.0,0.0,1.0,0.46,0,bone[0],bone[1],bone[2],0)
    ];
    GHOST.copies=copies; GHOST.tw=tw; GHOST.th=th; GHOST.ready=true;
    buildBleed();
  }

  /* the forest itself printed *inside* the figure silhouette (true multi-exposure) */
  function buildBleed(){
    if(!GHOST.alpha||!PLATE.ok||!PLATE.base) return;
    var tw=GHOST.tw, th=GHOST.th;
    if(!tw||!th) return;
    try{
      var c=document.createElement('canvas'); c.width=tw; c.height=th;
      var g=c.getContext('2d');
      var pw=PLATE.base.width, ph=PLATE.base.height;
      g.drawImage(PLATE.base,pw*0.48,ph*0.03,pw*0.46,ph*0.94,0,0,tw,th);
      var id=g.getImageData(0,0,tw,th), d=id.data, a=GHOST.alpha;
      for(var i=0,n=tw*th;i<n;i++){ d[i*4+3]=Math.round(a[i]*0.62); }
      g.putImageData(id,0,0);
      GHOST.bleed=c;
    }catch(e){ GHOST.bleed=null; }
  }

  function sendReady(){
    if(S.ready) return;
    S.ready=true;
    parent.postMessage({__c100:1,type:'ready'},'*');
  }

  /* ---------- palette ---------- */
  function setPalette(){
    var a=S.accent;
    if(!Array.isArray(a)||a.length<3) a=[255,47,142];
    a=[r255(+a[0]||0),r255(+a[1]||0),r255(+a[2]||0)];
    var mx=Math.max(a[0],a[1],a[2]), mn=Math.min(a[0],a[1],a[2]);
    var sat=(mx-mn)/255;
    var k=sat>0.24?0.5:0.0;
    P.acc=a;
    P.mag=[r255(lerp(255,a[0],k)),r255(lerp(47,a[1],k)),r255(lerp(142,a[2],k))];
    P.blue=[r255(lerp(46,a[0],k*0.4)),r255(lerp(80,a[1],k*0.4)),r255(lerp(232,a[2],k*0.4))];
    if(Math.abs(P.mag[0]-P.blue[0])<40){ P.mag=[255,47,142]; }
    buildLeaks();
    var sig=P.mag.join(',')+'|'+P.blue.join(',');
    if(sig!==palSig){ palSig=sig; buildFigure(); }
  }
  var palSig='';

  /* ---------- film grain tile ---------- */
  function buildGrain(){
    var n=180, c=document.createElement('canvas');
    c.width=n; c.height=n;
    var g=c.getContext('2d'), id;
    try{ id=g.createImageData(n,n); }catch(e){ return; }
    var d=id.data;
    for(var i=0,nn=n*n;i<nn;i++){
      var v=Math.floor(Math.random()*255);
      d[i*4]=v; d[i*4+1]=v; d[i*4+2]=v;
      d[i*4+3]=Math.floor(Math.random()*80+26);
    }
    try{ g.putImageData(id,0,0); grainEl.style.backgroundImage='url('+c.toDataURL('image/png')+')'; }catch(e){}
  }

  /* ---------- paint ---------- */
  function paint(){
    var t=S.vt, pulse=S.beat, rm=S.rm, mv=rm?0.35:1;
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.fillStyle='#05030a';
    ctx.fillRect(0,0,W,H);

    if(PLATE.ok){
      var zoom=1.045+(0.010+0.020*S.live.level)*Math.sin(t*0.15)*mv;
      var pw=W*zoom, ph=H*zoom;
      var ox=(W-pw)/2+Math.sin(t*0.10)*W*0.010*mv;
      var oy=(H-ph)/2+Math.cos(t*0.083)*H*0.010*mv;
      ctx.drawImage(PLATE.base,ox,oy,pw,ph);
      /* second + third exposure of the whole scene = multiple exposure */
      var gd=(5+30*pulse)*mv;
      ctx.globalCompositeOperation='screen';
      ctx.globalAlpha=0.15+0.24*pulse;
      ctx.drawImage(PLATE.base,ox-gd*1.8,oy-gd*0.5,pw*1.004,ph*1.004);
      if(pulse>0.12){
        ctx.globalAlpha=0.05+0.12*pulse;
        ctx.drawImage(PLATE.base,ox+gd*2.6,oy+gd*0.9,pw*1.010,ph*1.010);
      }
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
    } else {
      var fg=ctx.createLinearGradient(0,0,W*0.7,H);
      fg.addColorStop(0,'#0c0716'); fg.addColorStop(0.6,'#120a20'); fg.addColorStop(1,'#08050f');
      ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
    }

    /* light leaks */
    try{
      ctx.globalCompositeOperation='screen';
      if(LEAK.a){ ctx.globalAlpha=Math.min(1,0.80+0.20*pulse); ctx.fillStyle=LEAK.a; ctx.fillRect(0,0,W,H); }
      if(LEAK.b){ ctx.globalAlpha=Math.min(1,0.62+0.18*pulse); ctx.fillStyle=LEAK.b; ctx.fillRect(0,0,W,H); }
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=1;
      if(LEAK.c){ ctx.fillStyle=LEAK.c; ctx.fillRect(0,0,W,H); }
    }catch(e){}

    /* dust / hair specks */
    if(PLATE.dust){
      ctx.globalCompositeOperation='screen';
      ctx.globalAlpha=0.42;
      var dh=H*1.08, dy=1-(t*5)%dh;
      ctx.drawImage(PLATE.dust,-W*0.04,-dy,W*1.08,dh);
      ctx.drawImage(PLATE.dust,-W*0.04,-dy+dh,W*1.08,dh);
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
    }

    /* the split ghosts */
    if(GHOST.ready&&GHOST.copies.length){
      var portrait=(W<=760)||(W/H<0.82);
      var figH=H*(rm?0.70:0.80);
      if(portrait) figH=Math.min(H*0.58,W*1.02);
      var ar=GHOST.tw/GHOST.th;
      var figW=figH*ar;
      var baseX=W*(portrait?0.5:0.665);
      var baseY=H*1.02;
      var sway=Math.sin(t*0.63)*0.013*W*mv;
      var split=(0.90+0.50*pulse+0.08*S.live.bass)*(rm?0.55:1);
      for(var i=0;i<GHOST.copies.length;i++){
        var cp=GHOST.copies[i], cv=cp.cv;
        var wob=Math.sin(t*0.92+i*1.9)*0.009*figW*mv;
        var off=(cp.off*figW*split)+wob*(0.55+i*0.5);
        var cxp=baseX+sway-off*(portrait?0.62:1);
        var cyp=baseY-figH/2+cp.dy*figH+Math.cos(t*0.71+i*1.3)*figH*0.006*mv;
        var s=figW/GHOST.tw*cp.sc;
        var dw=cv.width*s, dh2=cv.height*s;
        ctx.globalCompositeOperation=cp.mode;
        ctx.globalAlpha=Math.min(1,cp.a*(0.88+0.24*pulse));
        if(cp.rot){
          ctx.save();
          ctx.translate(cxp,cyp);
          ctx.rotate(cp.rot*(rm?0.4:1));
          ctx.drawImage(cv,-dw/2,-dh2/2,dw,dh2);
          ctx.restore();
        } else {
          ctx.drawImage(cv,cxp-dw/2,cyp-dh2/2,dw,dh2);
        }
      }
      /* forest texture printed inside the silhouette */
      if(GHOST.bleed){
        var bs=figW/GHOST.tw;
        var bc=GHOST.bleed;
        var bw=bc.width*bs, bh3=bc.height*bs;
        var bcy=baseY-figH/2;
        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha=0.48+0.15*pulse;
        ctx.drawImage(bc,baseX+sway-bw/2,bcy-bh3/2,bw,bh3);
      }
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
    }

    /* exposure flash */
    if(pulse>0.005){
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=Math.min(0.2,pulse*0.13);
      ctx.fillStyle=rgb(P.mag[0],P.mag[1],P.mag[2]);
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
    }
  }

  /* ---------- lyrics (clean solid type, its own layer) ---------- */
  var LYR={cur:-2,nodes:[],times:null,cursor:0};
  function fitLyrics(){
    var cur=lyricsEl.querySelector('.lyr.cur');
    if(!cur) return;
    cur.style.fontSize='';
    var cs=window.getComputedStyle(cur);
    var fs=parseFloat(cs.fontSize)||30;
    var avail=Math.min(H*0.50,620);
    var n=0;
    while(n<14&&fs>13&&(cur.scrollHeight>avail||cur.scrollWidth>cur.clientWidth+3)){
      fs*=0.92; cur.style.fontSize=fs.toFixed(2)+'px'; n++;
    }
    if(cur.scrollHeight>avail&&fs<=13){
      cur.style.fontSize='13px';
    }
  }

  function makeCurLine(l){
    var d=document.createElement('div');
    d.className='lyr cur';
    var chars=null;
    if(Array.isArray(l.chars)&&l.chars.length){
      chars=l.chars;
      var joined='';
      for(var i=0;i<chars.length;i++) joined+=String((chars[i]&&chars[i].c)||'');
      if(!joined) chars=null;
    }
    if(chars){
      var nodes=[], times=[], anyTime=false;
      for(var k=0;k<chars.length;k++){
        var cc=chars[k]||{};
        var sp=document.createElement('span');
        sp.className='ch';
        sp.textContent=String(cc.c==null?'':cc.c);
        d.appendChild(sp);
        var ct=Number(cc.t);
        nodes.push({el:sp,on:false});
        times.push(isFinite(ct)?ct:null);
        if(isFinite(ct)) anyTime=true;
      }
      LYR.nodes=nodes;
      LYR.times=anyTime?times:null;
      LYR.cursor=0;
      if(!anyTime){ for(var z=0;z<nodes.length;z++){ nodes[z].on=true; nodes[z].el.classList.add('on'); } }
    } else {
      d.textContent=l.text||'';
      LYR.nodes=[]; LYR.times=null; LYR.cursor=0;
    }
    return d;
  }

  function renderLine(){
    if(S.idx===LYR.cur) return;
    LYR.cur=S.idx;
    lyricsEl.innerHTML='';
    LYR.nodes=[]; LYR.times=null; LYR.cursor=0;
    if(!S.lines.length){ emptyEl.style.display='block'; return; }
    emptyEl.style.display='none';
    var l=S.lines[S.idx];
    if(!l){ return; }
    var pv=S.lines[S.idx-1], nx=S.lines[S.idx+1];
    if(pv&&pv.text){
      var pd=document.createElement('div'); pd.className='lyr prev'; pd.textContent=pv.text;
      lyricsEl.appendChild(pd);
    }
    lyricsEl.appendChild(makeCurLine(l));
    if(nx&&nx.text){
      var nd=document.createElement('div'); nd.className='lyr next'; nd.textContent=nx.text;
      lyricsEl.appendChild(nd);
    }
    fitLyrics();
  }

  function updateChars(reset){
    if(reset){
      for(var i=0;i<LYR.nodes.length;i++){
        LYR.nodes[i].on=false; LYR.nodes[i].el.classList.remove('on');
      }
      LYR.cursor=0;
    }
    if(!LYR.times) return;
    var n=LYR.times.length, guard=0;
    while(LYR.cursor<n&&guard<n+2){
      var tt=LYR.times[LYR.cursor];
      if(tt==null){ LYR.cursor++; guard++; continue; }
      if(S.t>=tt-0.001){
        var node=LYR.nodes[LYR.cursor];
        if(node&&!node.on){ node.on=true; node.el.classList.add('on'); }
        LYR.cursor++; guard++;
      } else break;
    }
  }

  function findIdx(t){
    var i=-1, n=S.lines.length;
    for(var k=0;k<n;k++){ if(S.lines[k].t<=t+0.02) i=k; }
    return i;
  }

  function artistText(a){
    if(!a) return '';
    if(Array.isArray(a)) return a.filter(function(x){ return x; }).join(' / ');
    return String(a);
  }

  /* ---------- protocol ---------- */
  function onInit(p){
    p=p||{};
    var L=Array.isArray(p.lines)?p.lines:[];
    var out=[];
    for(var i=0;i<L.length;i++){
      var x=L[i]||{};
      out.push({
        t:Number(x.t)||0,
        dur:Number(x.dur)||0,
        text:(x.text==null?'':String(x.text)),
        chars:Array.isArray(x.chars)&&x.chars.length?x.chars:null
      });
    }
    S.lines=out;
    if(Array.isArray(p.accent)&&p.accent.length>=3) S.accent=p.accent;
    else S.accent=[255,47,142];
    S.duration=Number(p.duration)||0;
    S.playing=(p.playing===undefined)?true:!!p.playing;
    var song=(p.song&&typeof p.song==='object')?p.song:{};
    S.title=song.name?String(song.name):'';
    S.artist=artistText(song.artists);
    hTitle.textContent=S.title||'—';
    hSub.textContent=S.artist||'—';
    setPalette();
    LYR.cur=-2;
    S.idx=findIdx(S.t);
    renderLine();
    updateChars(true);
  }

  function onTick(p){
    p=p||{};
    var t=Number(p.time);
    if(isFinite(t)){
      if(t<S.t-0.30){ LYR.cursor=0; S.seek=true; }
      S.t=t;
    }
    if(typeof p.playing==='boolean') S.playing=p.playing;
    var ni=findIdx(S.t);
    if(ni!==S.idx){ S.idx=ni; renderLine(); }
    var lineStart=(S.lines[S.idx]&&S.lines[S.idx].t);
    updateChars(S.seek||(isFinite(lineStart)&&S.t<lineStart-0.001));
    S.seek=false;
  }

  function onBeat(p){
    p=p||{};
    var lv=Number(p.level);
    if(!isFinite(lv)) lv=0.6;
    lv=clamp01(lv);
    S.beat=Math.max(S.beat,lv);
  }

  function onLive(p){
    p=p||{};
    S.live={
      bpm:Number(p.bpm)||0,
      level:clamp01(p.level),
      bass:clamp01(p.bass),
      mid:clamp01(p.mid),
      treble:clamp01(p.treble)
    };
  }

  window.addEventListener('message',function(e){
    var d=e.data;
    if(!d||d.__c100!==1) return;
    if(d.type==='init') onInit(d.payload);
    else if(d.type==='tick') onTick(d.payload);
    else if(d.type==='beat') onBeat(d.payload);
    else if(d.type==='live') onLive(d.payload);
  });

  /* ---------- loop ---------- */
  var lastNow=0, hudTick=0;
  function frame(now){
    requestAnimationFrame(frame);
    var t0=performance.now();
    try{
      var dt=Math.min(0.06,Math.max(0.001,(now-(lastNow||now))/1000));
      lastNow=now;
      S.frames++;
      S.vt+=dt*(S.playing?1:0.16);
      S.beat*=Math.exp(-dt*5.2);
      S.live.level*=Math.exp(-dt*0.7);
      var ls=(S.lines[S.idx]&&S.lines[S.idx].t);
      updateChars(S.seek||(isFinite(ls)&&S.t<ls-0.001));
      S.seek=false;
      paint();
      hudTick++;
      if(hudTick%6===0){
        hTime.textContent=S.t.toFixed(1)+'s';
        hExp.textContent=(GHOST.copies.length||5)<10?'0'+(GHOST.copies.length||5):String(GHOST.copies.length);
      }
    }catch(e){
      try{ ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }catch(e2){}
    }
    S.js=S.js*0.88+(performance.now()-t0)*0.12;
    if(S.frames===1) sendReady();
  }

  /* ---------- resize ---------- */
  var rzTimer=0;
  window.addEventListener('resize',function(){
    if(rzTimer) clearTimeout(rzTimer);
    rzTimer=setTimeout(function(){
      rzTimer=0; size(); fitLyrics();
    },140);
  });

  /* ---------- boot ---------- */
  try{
    var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
    S.rm=!!mq.matches;
    if(mq.addEventListener) mq.addEventListener('change',function(e){ S.rm=!!e.matches; });
  }catch(e){ S.rm=false; }
  buildGrain();
  size();
  loadImg('forest','assets/342-forest.jpg');
  loadImg('canopy','assets/342-woods.jpg');
  loadImg('fig','assets/342-figure.jpg');
  setTimeout(function(){ if(!PLATE.ok||!GHOST.ready) scheduleBuild(); },2200);
  requestAnimationFrame(frame);
  setTimeout(sendReady,420);

  window.__stage=function(){ return {
    lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing, frames:S.frames,
    js:S.js, err:'', text:(S.lines[S.idx]&&S.lines[S.idx].text)||'', gl:false,
    rm:!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) }; };
})();
</script>
</body>
</html>
