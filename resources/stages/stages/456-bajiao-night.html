<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bajiao night</title>
<style>
  :root{
    --acc:#7fae5e;
    --paper:#0d1512;
    --ink:#141b10;
    --cream:#f4ecd4;
    --mx:0; --my:0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);}
  body{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
       -webkit-font-smoothing:antialiased;}
  #stage{position:absolute;inset:0;overflow:hidden;background:#0b1310;}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;}
  #art{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;
       pointer-events:none;}
  #grain{position:absolute;inset:-2%;width:104%;height:104%;display:block;z-index:3;
    mix-blend-mode:soft-light;opacity:.34;pointer-events:none;}
  #lyr{position:absolute;left:0;right:0;bottom:0;height:44%;z-index:2;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    padding:0 5vw 6vh;pointer-events:none;
    background:linear-gradient(to bottom,rgba(9,18,14,0) 0%,rgba(9,18,14,.30) 46%,rgba(6,12,9,.74) 100%);}
  #lprev{font-size:clamp(13px,1.55vw,21px);color:rgba(240,228,200,.52);
    letter-spacing:.06em;line-height:1.5;max-width:86vw;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:.9em;opacity:0;transition:opacity .45s ease;
    text-shadow:0 1px 0 rgba(6,12,9,.7);}
  #lprev.on{opacity:1;}
  #lcur{font-weight:600;line-height:1.22;letter-spacing:.045em;text-align:center;
    max-width:90vw;color:#f2e6c6;
    font-size:clamp(21px,3.5vw,52px);
    text-shadow:0 2px 0 rgba(8,16,12,.82),0 3px 12px rgba(6,12,9,.7);}
  #lcur .ch{color:rgba(238,228,200,.46);
    transition:color .26s ease,text-shadow .26s ease;}
  #lcur .ch.on{color:#fff4cf;
    text-shadow:0 2px 0 rgba(8,16,12,.8),0 0 15px rgba(255,206,132,.42);}
  #lnext{font-size:clamp(12px,1.35vw,18px);color:rgba(238,226,196,.36);
    letter-spacing:.08em;line-height:1.5;max-width:86vw;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:1.15em;text-shadow:0 1px 0 rgba(6,12,9,.6);}
  #empty{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:2;
    font-size:clamp(13px,1.5vw,18px);letter-spacing:.42em;color:rgba(238,226,196,.34);
    opacity:0;transition:opacity .8s ease;pointer-events:none;}
  #empty.on{opacity:1;}
  #tag{position:absolute;left:4vw;top:4.2vh;z-index:2;pointer-events:none;
    font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.3em;
    color:rgba(240,228,198,.34);text-transform:uppercase;}
  @media (prefers-reduced-motion:reduce){
    #lcur .ch,#lprev,#empty{transition:none;}
  }
</style>
</head>
<body>
<div id="stage" aria-hidden="true">
  <canvas id="scene"></canvas>
  <canvas id="art"></canvas>
  <div id="lyr">
    <div id="lprev"></div>
    <div id="lcur"></div>
    <div id="lnext"></div>
  </div>
  <div id="empty">这一首 · 没有词</div>
  <div id="tag">南方 · 夏夜</div>
  <canvas id="grain"></canvas>
</div>
<script>
"use strict";
/* ---------------- state ---------------- */
var ST = {
  lines: [], idx: -1, t: 0, dur: 0, playing: true,
  frames: 0, js: 0, err: "", acc: [127, 174, 94],
  name: "", artists: "", cover: "", ready: false,
  reduced: false, last: 0, beat: 0, beatAt: -9e9,
  energy: 0, bass: 0, liveE: 0, liveOn: false
};

window.__stage = function(){
  var l = ST.idx >= 0 ? ST.lines[ST.idx] : null;
  return {
    lines: ST.lines.length, idx: ST.idx, t: ST.t, playing: ST.playing,
    frames: ST.frames, js: ST.js, err: ST.err,
    text: l ? String(l.text == null ? "" : l.text) : "",
    gl: false, rm: ST.reduced
  };
};

/* ---------------- utils ---------------- */
var W = 1440, H = 900, DPR = 1;
function viewSize(){
  var w = window.innerWidth, h = window.innerHeight;
  if (!(w > 0)) w = 1440;
  if (!(h > 0)) h = 900;
  return [w, h];
}
function clamp(v, a, b){ v = +v; if (!isFinite(v)) v = a; return v < a ? a : (v > b ? b : v); }
function num(v, d){ v = +v; return isFinite(v) ? v : d; }
function rgbMix(a, b, k){
  return [Math.round(a[0] + (b[0] - a[0]) * k),
          Math.round(a[1] + (b[1] - a[1]) * k),
          Math.round(a[2] + (b[2] - a[2]) * k)];
}
function css(c, a){ return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (a == null ? 1 : a) + ")"; }

/* ---------------- render view (built BEFORE any resize runs) ---------------- */
var view = { w: 0, h: 0, u: 1, cx: 0, cy: 0, hz: 0,
             bulbX: 0, bulbY: 0, bulbR: 20 };
var sprDirty = true, grainDirty = true;

function resize(){
  var s = viewSize();
  W = s[0]; H = s[1];
  DPR = clamp(window.devicePixelRatio || 1, 1, 2);
  view.w = W; view.h = H;
  view.u = Math.min(W / 1440, H / 900);
  if (!(view.u > 0)) view.u = 1;
  view.cx = W / 2; view.cy = H / 2;
  view.hz = H * 0.585;
  view.bulbX = W * 0.5; view.bulbY = H * 0.5; view.bulbR = Math.min(W, H) * 0.02;
  sizeCanvas(art, W, H, DPR);
  sizeCanvas(scene, W, H, DPR);
  sizeCanvas(grain, W, H, DPR);
  layoutLyrics();
  bgDirty = true;
  sprDirty = true;
  grainDirty = true;
}
function sizeCanvas(cv, w, h, dpr){
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + "px";
  cv.style.height = h + "px";
}

/* ---------------- lyrics ---------------- */
var art = document.getElementById("art");
var grain = document.getElementById("grain");
var scene = document.getElementById("scene");
var lyr = document.getElementById("lyr");
var lcur = document.getElementById("lcur");
var lprev = document.getElementById("lprev");
var lnext = document.getElementById("lnext");
var emptyEl = document.getElementById("empty");
var lyrCtx = art.getContext("2d");
var scCtx = scene.getContext("2d");
var grCtx = grain.getContext("2d");
var chNodes = [];        /* per-char spans of current line */
var curIdx = -9;
var curChars = null;     /* chars array of current line, or null */
var curLine = null;

function esc(s){ return s; }

/* split current line into per-char spans (capped) */
function paintChars(text, chars){
  lcur.textContent = "";
  chNodes = [];
  var n = Math.min(text.length, 120);
  for (var i = 0; i < n; i++){
    var sp = document.createElement("span");
    sp.className = "ch";
    sp.textContent = text.charAt(i);
    lcur.appendChild(sp);
    chNodes.push(sp);
  }
  return chNodes;
}

function setCurrentLine(idx){
  var L = ST.lines[idx] || null;
  var preview = false;
  if (!L && idx < 0 && ST.lines.length){ L = ST.lines[0]; preview = true; }
  var key = (L ? L.k : -1) * 2 + (preview ? 1 : 0);
  if (key === curIdx) return;
  curIdx = key;
  curLine = L;
  if (!L){
    lcur.textContent = "";
    chNodes = [];
    lprev.textContent = ""; lprev.classList.remove("on");
    lnext.textContent = "";
    return;
  }
  paintChars(L.text, L.chars);
  if (preview){
    for (var i = 0; i < chNodes.length; i++){ chNodes[i].__on = false; }
    lprev.textContent = "";
    lprev.classList.remove("on");
    var nx0 = ST.lines[1];
    lnext.textContent = nx0 ? nx0.text : "";
  } else {
    var p = ST.lines[idx - 1], nx = ST.lines[idx + 1];
    lprev.textContent = p ? p.text : "";
    lprev.classList.toggle("on", !!p);
    lnext.textContent = nx ? nx.text : "";
  }
  fitLine();
}

/* keep the current line inside the safe box */
function fitLine(){
  var base = clamp(Math.min(W * 0.041, H * 0.058), 19, 52);
  var len = curLine ? curLine.text.length : 1;
  if (len > 12) base *= Math.pow(12 / len, 0.66);
  if (len > 40) base *= Math.pow(40 / len, 0.55);
  base = clamp(base, 14, 52);
  /* portrait phones: narrower safe width */
  if (W / H < 0.8) base = Math.min(base, W * 0.072);
  lcur.style.fontSize = (Math.round(base * 10) / 10) + "px";
  /* latin-only lines read better with tighter tracking already set in CSS */
}
function layoutLyrics(){ fitLine(); }

function buildLyrics(lines){
  lcur.textContent = ""; lprev.textContent = ""; lnext.textContent = "";
  lprev.classList.remove("on");
  chNodes = [];
  curIdx = -9;
  curChars = null; curLine = null;
  emptyEl.classList.toggle("on", lines.length === 0);
}

function applyChars(t){
  if (!curLine) return;
  var L = curLine;
  var chars = L.chars;
  var txt = L.text;
  var n = chNodes.length;
  if (chars && chars.length){
    var total = Math.min(chars.length, n);
    /* map: char i -> time (fall back to line t) */
    for (var i = 0; i < total; i++){
      var ct = chars[i] && chars[i].t != null ? num(chars[i].t, L.t) : L.t;
      var on = t >= ct - 0.001;
      var el = chNodes[i];
      if (on !== (el.__on === true)){ el.__on = on; el.classList.toggle("on", on); }
    }
    for (var j = total; j < n; j++){
      var e2 = chNodes[j];
      if (e2.__on !== true){ e2.__on = true; e2.classList.add("on"); }
    }
  } else {
    /* LRC: distribute reveal across line duration */
    var d = L.dur > 0 ? L.dur : 3.2;
    var prog = clamp((t - L.t) / d, 0, 1);
    var lit = Math.floor(prog * n + 0.0001);
    for (var k = 0; k < n; k++){
      var on2 = k < lit;
      var el2 = chNodes[k];
      if (on2 !== (el2.__on === true)){ el2.__on = on2; el2.classList.toggle("on", on2); }
    }
  }
}

/* ---------------- payload handling ---------------- */
function normArtists(a){
  if (a == null) return "";
  if (typeof a === "string") return a;
  if (Array.isArray(a)){
    var out = [], n = Math.min(a.length, 8);
    for (var i = 0; i < n; i++){ if (a[i] != null) out.push(String(a[i])); }
    return out.join(" / ");
  }
  return String(a);
}

function onInit(p){
  try {
    p = p || {};
    var song = p.song || {};
    ST.name = song.name == null ? "" : String(song.name);
    ST.artists = normArtists(song.artists);
    ST.cover = typeof song.cover === "string" ? song.cover : "";
    ST.dur = num(p.duration, 0);
    if (ST.dur < 0) ST.dur = 0;
    var acc = p.accent;
    if (acc && acc.length >= 3){
      ST.acc = [clamp(acc[0], 0, 255), clamp(acc[1], 0, 255), clamp(acc[2], 0, 255)];
    }
    var raw = Array.isArray(p.lines) ? p.lines : [];
    var out = [];
    for (var i = 0; i < raw.length && out.length < 160; i++){
      var L = raw[i] || {};
      var tx = L.text == null ? "" : String(L.text);
      if (!tx) continue;
      if (tx.length > 600) tx = tx.slice(0, 600);
      out.push({
        t: Math.max(0, num(L.t, 0)),
        dur: Math.max(0, num(L.dur, 0)),
        text: tx,
        chars: Array.isArray(L.chars) ? L.chars : null,
        sum: 0, k: i
      });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    ST.lines = out;
    ST.idx = -1;
    curIdx = -9;
    buildLyrics(out);
    setCurrentLine(-1);
    layoutLyrics();
    buildScene();
    updateTag();
    ST.err = "";
  } catch (e){
    ST.err = String(e && e.message || e);
    console.error("init failed", e);
  }
}

function findIdx(t){
  var a = ST.lines, lo = 0, hi = a.length - 1, r = -1;
  while (lo <= hi){
    var mid = (lo + hi) >> 1;
    if (a[mid].t <= t + 0.02){ r = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return r;
}

var tagEl = document.getElementById("tag");
function updateTag(){
  var bits = [];
  if (ST.name) bits.push(ST.name);
  if (ST.artists) bits.push(ST.artists);
  tagEl.textContent = bits.length ? bits.join(" · ") : "南方 · 夏夜";
}

function onTick(p){
  p = p || {};
  ST.t = Math.max(0, num(p.time, ST.t));
  ST.playing = p.playing == null ? true : !!p.playing;
  var i = findIdx(ST.t);
  if (i !== ST.idx){
    ST.idx = i;
    setCurrentLine(i);
  }
  applyChars(ST.t);
}

/* ================= scene: naive oil-pastel, painted once ================= */
var bgDirty = true;
var wheelSpr = null, bikeSpr = null, glowSpr = null;
var motes = [];
var hotCol = [255, 210, 130];

function makeGlow(){
  var R = 220, d = 1;
  var c = document.createElement("canvas");
  c.width = R * 2; c.height = R * 2;
  var x = c.getContext("2d");
  var g = x.createRadialGradient(R, R, 0, R, R, R);
  g.addColorStop(0, "rgba(255,232,168,0.56)");
  g.addColorStop(0.10, "rgba(255,214,138,0.34)");
  g.addColorStop(0.30, "rgba(226,196,120,0.13)");
  g.addColorStop(0.62, "rgba(196,180,110,0.04)");
  g.addColorStop(1, "rgba(180,170,100,0)");
  x.fillStyle = g;
  x.fillRect(0, 0, R * 2, R * 2);
  return c;
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* wobbly pastel line */
function wline(ctx, x1, y1, x2, y2, amp, w, style){
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var nx = -dy / len, ny = dx / len;
  var mid = 0.5 + (Math.random() - 0.5) * 0.5;
  var off = (Math.random() - 0.5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(x1 + dx * mid + nx * off, y1 + dy * mid + ny * off, x2, y2);
  ctx.lineWidth = w;
  ctx.strokeStyle = style;
  ctx.stroke();
}
function blob(ctx, x, y, r, color, wob){
  ctx.beginPath();
  var n = 12;
  for (var i = 0; i <= n; i++){
    var a = i / n * Math.PI * 2;
    var rr = r * (1 + Math.sin(a * 3 + 1.7) * (wob || 0.06));
    var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function buildScene(){
  try {
    if (sprDirty){
      wheelSpr = makeWheel();
      bikeSpr = makeBike();
      glowSpr = makeGlow();
      makeMotes();
      sprDirty = false;
    }
    if (grainDirty){ buildGrain(); grainDirty = false; }
    bgDirty = true;
  } catch (e){ ST.err = String(e && e.message || e); console.error("scene failed", e); }
}

function paintBackground(){
  var ctx = scCtx, r = mulberry32(4560713);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  var hz = H * 0.585;
  var portrait = W / H < 0.82;

  /* --- sky --- */
  var g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, "#132319");
  g.addColorStop(0.45, "#26432c");
  g.addColorStop(0.82, "#45603a");
  g.addColorStop(1, "#6d7a48");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, hz);

  /* --- sky pastel strokes (fixed count) --- */
  ctx.lineCap = "round";
  var cols = ["#3d6a45", "#6e8a4a", "#a8b070", "#2f5740", "#cbc37f", "#7f9b58"];
  for (var i = 0; i < 78; i++){
    var y = r() * hz;
    var len = (0.08 + r() * 0.3) * W;
    var x = r() * W - len * 0.2;
    var w = (1 + r() * 4) * view.u;
    ctx.globalAlpha = 0.05 + r() * 0.13;
    var c = cols[(i * 7) % cols.length];
    for (var k = 0; k < 2; k++){
      wline(ctx, x, y + k * 2.2 * view.u, x + len, y + (r() - 0.5) * 10 * view.u,
        (2 + r() * 9) * view.u, w, c);
    }
  }
  ctx.globalAlpha = 1;

  /* --- moon --- */
  var mx = W * (portrait ? 0.5 : 0.47), my = H * 0.255, mr = Math.min(W, H) * 0.052;
  var halo = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 5.2);
  halo.addColorStop(0, "rgba(238,232,178,0.30)");
  halo.addColorStop(0.45, "rgba(190,206,140,0.10)");
  halo.addColorStop(1, "rgba(160,190,120,0)");
  ctx.fillStyle = halo;
  ctx.fillRect(mx - mr * 5.4, my - mr * 5.4, mr * 10.8, mr * 10.8);
  blob(ctx, mx, my, mr, "#f2ecc0", 0.045);
  ctx.globalAlpha = 0.30;
  blob(ctx, mx - mr * 0.22, my - mr * 0.18, mr * 0.42, "#d9d29a", 0.12);
  ctx.globalAlpha = 1;

  /* --- sea --- */
  var sg = ctx.createLinearGradient(0, hz, 0, H);
  sg.addColorStop(0, "#5d6f45");
  sg.addColorStop(0.35, "#3a5340");
  sg.addColorStop(1, "#141f19");
  ctx.fillStyle = sg;
  ctx.fillRect(0, hz, W, H - hz);
  for (var s = 0; s < 56; s++){
    var yy = hz + Math.pow(r(), 1.5) * (H - hz) * 0.68;
    var lw = (20 + r() * 150) * view.u;
    ctx.globalAlpha = 0.07 + r() * 0.12;
    wline(ctx, r() * W, yy, r() * W * 0.2 + lw, yy + (r() - 0.5) * 3,
      (1 + r() * 4) * view.u, (1 + r() * 2.6) * view.u,
      r() > 0.62 ? "#a9bb84" : "#243b2d");
  }
  /* moon path on water */
  for (var p = 0; p < 26; p++){
    var py2 = hz + 6 + Math.pow(p / 26, 1.3) * (H - hz) * 0.55;
    var pw = (5 + r() * 26) * view.u * (1 - p / 40);
    ctx.globalAlpha = 0.16 + r() * 0.26;
    ctx.strokeStyle = "#efe6ac";
    ctx.lineWidth = (1.4 + r() * 2.4) * view.u;
    ctx.beginPath();
    ctx.moveTo(mx - pw + (r() - 0.5) * 40 * view.u, py2);
    ctx.lineTo(mx + pw + (r() - 0.5) * 40 * view.u, py2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* --- distant shore / ferris wheel (static-ish drawing here, wheel is sprite) --- */
  ctx.globalAlpha = 0.5;
  blob(ctx, W * 0.82, hz + 2, Math.min(W, H) * 0.11, "#1d3226", 0.16);
  ctx.globalAlpha = 1;

  /* --- banana leaves framing --- */
  drawBanana(ctx, -W * 0.02, H * 0.02, Math.min(W, H) * 0.20, -0.5, 1);
  drawBanana(ctx, W * 1.01, H * 0.06, Math.min(W, H) * 0.16, 2.2, -1);
  drawBanana(ctx, W * 0.06, H * 0.40, Math.min(W, H) * 0.11, 0.9, 1);
  if (portrait) drawBanana(ctx, W * 0.97, H * 0.30, Math.min(W, H) * 0.10, 3.4, -1);

  /* --- 大排档: table, plastic chairs, bulb --- */
  var dx0 = W * (portrait ? 0.19 : 0.145), dy0 = H * 0.60;
  drawStall(ctx, dx0, dy0, Math.min(W, H) * 0.10);

  /* --- 岸 line (dark foreground band, keeps lyrics legible) --- */
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, H * 0.735);
  for (var q = 0; q <= 14; q++){
    var qx = W * q / 14;
    var qy = H * 0.735 + Math.sin(q * 1.7 + 0.5) * H * 0.012 + (r() - 0.5) * H * 0.008;
    ctx.lineTo(qx, qy);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  var fg = ctx.createLinearGradient(0, H * 0.70, 0, H);
  fg.addColorStop(0, "rgba(14,24,19,0.55)");
  fg.addColorStop(0.45, "rgba(10,18,14,0.88)");
  fg.addColorStop(1, "rgba(6,12,9,0.97)");
  ctx.fillStyle = fg;
  ctx.fill();

  /* bank pebbles / weed strokes */
  for (var e = 0; e < 30; e++){
    var ex = r() * W, ey = H * 0.74 + r() * H * 0.06;
    ctx.globalAlpha = 0.1 + r() * 0.16;
    wline(ctx, ex, ey, ex + (r() - 0.5) * 30 * view.u, ey - (14 + r() * 30) * view.u,
      5 * view.u, (1.4 + r() * 2) * view.u, "#5c7a4e");
  }
  ctx.globalAlpha = 1;
}

function drawBanana(ctx, x, y, s, rot, dir){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(dir, 1);
  var stem = "#2c4a30", leafA = "#1f3a28", leafB = "#33553a", vein = "#48684a";
  /* stem */
  ctx.strokeStyle = stem; ctx.lineWidth = s * 0.10; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s * 0.6, -s * 0.1, s * 1.15, -s * 0.42); ctx.stroke();
  for (var i = 0; i < 5; i++){
    var a = -0.85 + i * 0.30;
    var L = s * (0.95 + (i % 2) * 0.34);
    var px = s * 0.35 + Math.cos(a) * L * 0.16;
    var py = -s * 0.05 + Math.sin(a) * L * 0.10;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a * 0.9);
    /* leaf body: two arcs */
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(L * 0.42, -L * 0.40, L, -L * 0.05);
    ctx.quadraticCurveTo(L * 0.46, L * 0.34, 0, 0);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? leafA : leafB;
    ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = vein; ctx.lineWidth = Math.max(1, s * 0.012);
    for (var v = 1; v <= 4; v++){
      var k = v / 5;
      ctx.beginPath();
      ctx.moveTo(L * k, -L * 0.02 - Math.sin(k * 3) * L * 0.06);
      ctx.lineTo(L * k + L * 0.03, -L * 0.16 - Math.abs(Math.cos(k * 4)) * L * 0.05);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  ctx.restore();
}

function drawStall(ctx, x, y, s){
  /* table */
  ctx.strokeStyle = "#3a2b22"; ctx.lineWidth = Math.max(2, s * 0.05); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x - s * 0.32, y + s * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s * 0.5, y); ctx.lineTo(x + s * 0.34, y + s * 0.5); ctx.stroke();
  ctx.fillStyle = "#4a3327";
  ctx.fillRect(x - s * 0.62, y - s * 0.07, s * 1.24, s * 0.1);
  /* plastic chairs */
  for (var c = 0; c < 2; c++){
    var cx = x + (c ? s * 0.95 : -s * 0.95), cy = y + s * 0.34;
    ctx.strokeStyle = "#3d4a3a"; ctx.lineWidth = Math.max(1.6, s * 0.035);
    ctx.beginPath(); ctx.moveTo(cx - s * 0.2, cy); ctx.lineTo(cx - s * 0.2, cy + s * 0.34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s * 0.2, cy); ctx.lineTo(cx + s * 0.2, cy + s * 0.34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * 0.24, cy); ctx.lineTo(cx + s * 0.24, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * 0.22, cy); ctx.lineTo(cx - s * 0.10, cy - s * 0.44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s * 0.22, cy); ctx.lineTo(cx + s * 0.10, cy - s * 0.44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * 0.12, cy - s * 0.40); ctx.lineTo(cx + s * 0.12, cy - s * 0.40); ctx.stroke();
  }
  /* pole + bulb */
  ctx.strokeStyle = "#5a4632"; ctx.lineWidth = Math.max(1.6, s * 0.03);
  ctx.beginPath(); ctx.moveTo(x + s * 0.62, y); ctx.lineTo(x + s * 0.62, y - s * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s * 0.62, y - s * 1.5); ctx.lineTo(x + s * 0.92, y - s * 1.42); ctx.stroke();
  view.bulbX = x + s * 0.92; view.bulbY = y - s * 1.46; view.bulbR = s * 0.30;
}

/* ---- sprites ---- */
function makeWheel(){
  var R = Math.min(W, H) * (W / H < 0.82 ? 0.085 : 0.105);
  var pad = R * 1.35;
  var c = document.createElement("canvas");
  var d = clamp(DPR, 1, 2);
  c.width = Math.round(pad * 2 * d);
  c.height = Math.round(pad * 2 * d);
  var x = c.getContext("2d");
  x.setTransform(d, 0, 0, d, 0, 0);
  x.translate(pad, pad);
  var rust = "#6e4530", rust2 = "#8f5a3a", lit = "#c9894f";
  x.lineCap = "round";
  /* outer rim */
  for (var k = 0; k < 3; k++){
    x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2);
    x.strokeStyle = k === 0 ? rust2 : rust;
    x.lineWidth = R * (0.055 - k * 0.012);
    x.globalAlpha = 0.85 - k * 0.18;
    x.stroke();
  }
  x.globalAlpha = 1;
  /* spokes */
  for (var i = 0; i < 12; i++){
    var a = i / 12 * Math.PI * 2;
    x.beginPath();
    x.moveTo(0, 0);
    x.lineTo(Math.cos(a) * R * 0.97, Math.sin(a) * R * 0.97);
    x.strokeStyle = i % 3 === 0 ? rust2 : rust;
    x.lineWidth = R * 0.022;
    x.globalAlpha = 0.7;
    x.stroke();
    /* cabin */
    x.globalAlpha = 1;
    var cxp = Math.cos(a) * R, cyp = Math.sin(a) * R;
    x.save(); x.translate(cxp, cyp);
    x.fillStyle = i % 2 ? rust2 : lit;
    x.fillRect(-R * 0.055, 0, R * 0.11, R * 0.10);
    x.strokeStyle = "#3a2a20"; x.lineWidth = R * 0.012;
    x.strokeRect(-R * 0.055, 0, R * 0.11, R * 0.10);
    x.restore();
  }
  /* hub */
  blob(x, 0, 0, R * 0.12, lit, 0.05);
  blob(x, 0, 0, R * 0.06, "#3a2a20", 0.08);
  return c;
}

function makeBike(){
  var w = 250, h = 200, d = clamp(DPR, 1, 2);
  var c = document.createElement("canvas");
  c.width = Math.round(w * d); c.height = Math.round(h * d);
  var x = c.getContext("2d");
  x.setTransform(d, 0, 0, d, 0, 0);
  x.lineCap = "round"; x.lineJoin = "round";
  var ink = "#0f1a13", rim = "#c8d39a", frame = "#3b2f26", cloth = "#b6c07e", skin = "#d8a978";
  /* wheels */
  [[62, 148, 40], [188, 148, 40]].forEach(function(W3){
    x.beginPath(); x.arc(W3[0], W3[1], W3[2], 0, Math.PI * 2);
    x.strokeStyle = frame; x.lineWidth = 3.4; x.stroke();
    x.beginPath(); x.arc(W3[0], W3[1], W3[2] * 0.62, 0, Math.PI * 2);
    x.strokeStyle = "rgba(200,211,154,.35)"; x.lineWidth = 1.2; x.stroke();
    x.beginPath(); x.arc(W3[0], W3[1], 2.6, 0, Math.PI * 2);
    x.fillStyle = rim; x.fill();
  });
  /* frame */
  x.strokeStyle = frame; x.lineWidth = 4.2;
  x.beginPath(); x.moveTo(62, 148); x.lineTo(112, 100); x.lineTo(160, 100); x.lineTo(188, 148); x.stroke();
  x.beginPath(); x.moveTo(112, 100); x.lineTo(126, 148); x.stroke();
  x.beginPath(); x.moveTo(160, 100); x.lineTo(150, 74); x.lineTo(176, 68); x.stroke();
  x.beginPath(); x.moveTo(150, 74); x.lineTo(140, 70); x.stroke();
  /* riders: back one on rack, front pedaling */
  x.fillStyle = ink;
  /* back rider */
  blob(x, 96, 68, 15, cloth, 0.10);
  blob(x, 96, 46, 11, skin, 0.08);
  x.beginPath(); x.moveTo(104, 60); x.lineTo(120, 76); x.strokeStyle = cloth; x.lineWidth = 7; x.stroke();
  /* front rider */
  blob(x, 141, 52, 15, cloth, 0.10);
  blob(x, 143, 30, 11, skin, 0.08);
  x.strokeStyle = cloth; x.lineWidth = 6;
  x.beginPath(); x.moveTo(133, 66); x.lineTo(126, 104); x.stroke();
  x.beginPath(); x.moveTo(148, 66); x.lineTo(160, 92); x.stroke();
  /* rim light */
  x.globalAlpha = 0.5; x.strokeStyle = rim; x.lineWidth = 1.3;
  x.beginPath(); x.arc(96, 46, 11.5, Math.PI * 1.05, Math.PI * 1.85); x.stroke();
  x.beginPath(); x.arc(143, 30, 11.5, Math.PI * 1.05, Math.PI * 1.85); x.stroke();
  x.globalAlpha = 1;
  return c;
}

function makeMotes(){
  var r = mulberry32(77);
  motes = [];
  var n = Math.min(30, 14 + Math.floor(W / 90));
  for (var i = 0; i < n; i++){
    motes.push({ x: r() * W, y: H * (0.25 + r() * 0.6),
      vx: (r() - 0.5) * 5, vy: -3 - r() * 9, s: 0.7 + r() * 1.9, a: 0.15 + r() * 0.4 });
  }
}

function buildGrain(){
  var n = 160, d = 1;
  var s = document.createElement("canvas");
  s.width = n; s.height = n;
  var gx = s.getContext("2d");
  var img = gx.createImageData(n, n);
  var r = mulberry32(2024);
  for (var i = 0; i < n * n; i++){
    var v = 128 + (r() - 0.5) * 190;
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  gx.putImageData(img, 0, 0);
  grCtx.setTransform(1, 0, 0, 1, 0, 0);
  grCtx.clearRect(0, 0, grain.width, grain.height);
  grCtx.fillStyle = grCtx.createPattern(s, "repeat");
  grCtx.fillRect(0, 0, grain.width, grain.height);
  /* horizontal paper fibres */
  grCtx.globalAlpha = 0.16;
  grCtx.strokeStyle = "#ffffff";
  var rr = mulberry32(31);
  for (var k = 0; k < 90; k++){
    var yy = rr() * grain.height, xx = rr() * grain.width;
    grCtx.lineWidth = 1;
    grCtx.beginPath();
    grCtx.moveTo(xx, yy);
    grCtx.lineTo(xx + 30 + rr() * 160, yy + (rr() - 0.5) * 2);
    grCtx.stroke();
  }
  grCtx.globalAlpha = 1;
}

/* ---- per-frame overlay ---- */
var dynAcc = 0;
function drawDynamic(t, dt){
  /* 165Hz screens: run overlay at ~half rate (visually indistinguishable) */
  var need = ST.reduced ? 1 : 2;
  dynAcc++;
  if (dynAcc % need !== 0){
    ST.beat *= Math.pow(0.02, dt * need);
    return;
  }
  var step = dt * need;
  var ctx = lyrCtx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "source-over";

  var e = ST.energy;

  /* ferris wheel: sprite rotate (cheap) */
  if (wheelSpr){
    var R = Math.min(W, H) * (W / H < 0.82 ? 0.085 : 0.105);
    var wx = W * 0.815, wy = H * 0.475;
    var stop = ST.reduced ? 0 : t * 0.05;
    var wd = clamp(DPR, 1, 2);
    var drawSize = wheelSpr.width / wd;
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(stop);
    ctx.globalAlpha = 0.66;
    ctx.drawImage(wheelSpr, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
    ctx.restore();
    ctx.globalAlpha = 1;
    /* support legs */
    ctx.strokeStyle = "rgba(74,52,38,.7)";
    ctx.lineWidth = Math.max(2, R * 0.05);
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx - R * 0.66, H * 0.60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + R * 0.66, H * 0.60); ctx.stroke();
  }

  /* couple on the old bicycle, drifting along the bank */
  if (bikeSpr){
    var span = W * 0.62;
    var ph = ST.reduced ? 0.35 : (t * 0.035) % 1;
    var bx = W * 0.10 + ph * span;
    var by = H * 0.695 + Math.sin((ST.reduced ? 0 : t) * 2.1) * 2.2;
    var scl = clamp(Math.min(W, H) / 900, 0.55, 1.25) * 0.62;
    ctx.save();
    ctx.translate(bx, by);
    ctx.scale(scl, scl);
    ctx.globalAlpha = 0.9;
    ctx.drawImage(bikeSpr, 0, 0, 250, 200, -125, -190, 250, 200);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* hanging bulb glow — pulses with bass */
  var bx2 = view.bulbX || W * 0.2, by2 = view.bulbY || H * 0.5;
  var br = (view.bulbR || 26) * (1 + e * 0.35);
  if (glowSpr){
    var gw = Math.max(40, br * 8.5), gh = gw;
    ctx.globalAlpha = clamp(0.55 + e * 0.45, 0, 1);
    ctx.drawImage(glowSpr, bx2 - gw / 2, by2 - gh / 2, gw, gh);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "rgba(255,246,206," + (0.85 + e * 0.15) + ")";
  ctx.beginPath(); ctx.arc(bx2, by2, br * 0.42, 0, Math.PI * 2); ctx.fill();

  /* dust motes */
  var speed = ST.playing ? 1 : 0.25;
  ctx.fillStyle = "#ffe9b0";
  for (var i = 0; i < motes.length; i++){
    var m = motes[i];
    if (!ST.reduced){
      m.x += m.vx * step * speed;
      m.y += m.vy * step * speed;
      if (m.y < H * 0.15){ m.y = H * 0.85; m.x = Math.random() * W; }
      if (m.x < -10) m.x = W + 10; else if (m.x > W + 10) m.x = -10;
    }
    ctx.globalAlpha = m.a * (0.6 + e * 0.7);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* beat flash: soft warm wash, cheap fill only */
  if (ST.beat > 0.01){
    ctx.globalAlpha = ST.beat * 0.14;
    ctx.fillStyle = "#ffd9a0";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ST.beat *= Math.pow(0.02, step);
  }
}

/* ---------------- frame loop ---------------- */
var readySent = false;
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); }
  catch (e){ console.error("ready post failed", e); }
}
function shell(){
  lyrCtx.setTransform(1, 0, 0, 1, 0, 0);
  lyrCtx.clearRect(0, 0, art.width, art.height);
  lyrCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function frame(now){
  var perf = (window.performance && performance.now) ? performance.now.bind(window.performance) : function(){ return Date.now(); };
  var t0 = perf();
  if (!readySent) sendReady();
  try {
    ST.frames++;
    var dt = Math.min(0.05, Math.max(0.0005, (now - (ST.last || now)) / 1000));
    if (!ST.last) dt = 0.016;
    ST.last = now;

    if (sprDirty){ wheelSpr = makeWheel(); bikeSpr = makeBike(); glowSpr = makeGlow(); makeMotes(); sprDirty = false; }
    if (grainDirty){ buildGrain(); grainDirty = false; }
    if (bgDirty){ paintBackground(); bgDirty = false; }

    /* eased spectrum energy: chase live target, decay without signal */
    var target = ST.liveOn && ST.playing ? ST.liveE : 0;
    ST.energy += (target - ST.energy) * Math.min(1, dt * (target > ST.energy ? 9 : 3.2));
    if (ST.energy < 0.001) ST.energy = 0;

    drawDynamic(ST.t, dt);
    ST.js = Math.round((perf() - t0) * 100) / 100;
  } catch (e){
    ST.err = String(e && e.message || e);
    console.error("frame failed", e);
  }
  requestAnimationFrame(frame);
}

function onBeat(p){
  p = p || {};
  ST.beat = clamp(num(p.level, 0.6), 0, 1);
  ST.beatAt = ST.t;
}
function onLive(p){
  p = p || {};
  var lv = clamp(num(p.level, 0), 0, 1);
  var bs = clamp(num(p.bass, 0), 0, 1);
  var tr = clamp(num(p.treble, 0), 0, 1);
  var md = clamp(num(p.mid, 0), 0, 1);
  ST.liveE = lv * 0.35 + bs * 0.45 + tr * 0.10 + md * 0.10;
  ST.liveOn = true;
  if (p.playing != null) ST.playing = !!p.playing;
}

window.addEventListener("message", function(ev){
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === "init") onInit(d.payload);
    else if (d.type === "tick") onTick(d.payload);
    else if (d.type === "beat") onBeat(d.payload);
    else if (d.type === "live") onLive(d.payload);
  } catch (e){ ST.err = String(e && e.message || e); console.error(e); }
}, false);

window.addEventListener("error", function(e){
  if (!ST.err) ST.err = String(e.message || "error");
});

try {
  ST.reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
} catch (e){ ST.reduced = false; }

resize();
window.addEventListener("resize", function(){ try { resize(); } catch (e){ console.error(e); } });
requestAnimationFrame(frame);
setTimeout(sendReady, 900);
</script>
</body>
</html>
