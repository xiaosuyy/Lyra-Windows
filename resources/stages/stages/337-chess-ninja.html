<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>棋盘忍者 · CHESS NINJA · #337</title>
<style>
  :root{
    --ink:#070509; --bone:#efe6d4; --blood:#c3102c; --accent:#ff3b5c;
    --fs:clamp(22px,4.4vw,58px);
    --comic:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",
      "Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--bone);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:fixed;inset:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---- top-left issue caption ---- */
  #meta{position:absolute;left:max(16px,3vw);top:max(12px,3.4vh);z-index:7;
    pointer-events:none;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif;
    line-height:1.45;text-shadow:0 2px 10px rgba(0,0,0,.9)}
  #meta .iss{display:inline-flex;align-items:center;gap:7px;font-size:clamp(9px,1.02vw,12px);
    font-weight:800;letter-spacing:.22em;color:#f4ecda;text-transform:uppercase}
  #meta .iss i{width:8px;height:8px;background:var(--accent);
    box-shadow:0 0 10px var(--accent);display:inline-block;transform:rotate(45deg)}
  #meta .ttl{margin-top:7px;font-size:clamp(15px,2vw,26px);font-weight:800;letter-spacing:.04em;
    color:#f6efdf;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #meta .art{font-size:clamp(9px,1.05vw,12px);letter-spacing:.16em;color:rgba(239,230,212,.62);
    text-transform:uppercase;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- lyric caption box ---- */
  #lyr{position:absolute;left:50%;bottom:4.2vh;z-index:8;pointer-events:none;
    width:min(70vw,860px);transform:translateX(-50%) rotate(-1.1deg);
    transition:opacity .35s ease;opacity:1}
  #lyr .panel{position:relative;padding:clamp(11px,1.5vh,20px) clamp(15px,2.2vw,32px) clamp(9px,1.2vh,15px);
    background-color:rgba(8,4,11,.84);
    background-image:radial-gradient(circle at 1px 1px,rgba(239,230,212,.13) 1px,transparent 1.4px);
    background-size:5px 5px;
    border:2px solid rgba(239,230,212,.92);
    box-shadow:10px 10px 0 rgba(196,16,46,.30),0 0 0 1px rgba(5,3,7,.9) inset,
      0 18px 60px rgba(0,0,0,.6);
  }
  #lyr .panel::before,#lyr .panel::after{content:"";position:absolute;width:14px;height:14px;
    border:2px solid var(--accent);opacity:.85}
  #lyr .panel::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
  #lyr .panel::after{right:-2px;bottom:-2px;border-left:0;border-top:0}

  #lyr .prev,#lyr .next{font-family:var(--comic);font-weight:900;color:rgba(239,230,212,.44);
    letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.3}
  #lyr .prev{font-size:clamp(11px,1.35vw,17px);opacity:.8}
  #lyr .next{font-size:clamp(10px,1.2vw,15px);opacity:.55}
  #lyr .next:empty,#lyr .prev:empty{display:none}

  #cur{font-family:var(--comic);font-weight:900;font-size:var(--fs);color:#fdf7e9;letter-spacing:.015em;
    line-height:1.16;word-break:break-word;overflow-wrap:anywhere;
    text-shadow:3px 3px 0 rgba(0,0,0,.55);text-align:center}
  #cur .ch{display:inline-block;white-space:pre}
  #cur .ch.off{color:rgba(239,230,212,.20);text-shadow:none}
  @supports ((-webkit-text-stroke:1px #fff)){
    #cur .ch.off{color:transparent;-webkit-text-stroke:1.4px rgba(239,230,212,.30);text-shadow:none}
  }
  #cur .ch.on{color:#fdf7e9}
  #cur .ch.on.glow{text-shadow:0 0 14px var(--accent),3px 3px 0 rgba(0,0,0,.55)}
  @keyframes slam{
    from{opacity:.2;transform:translateY(12px) scale(.975)}
    to{opacity:1;transform:none}
  }
  #cur.slam{animation:slam .3s cubic-bezier(.18,.9,.2,1) both}
  @media (prefers-reduced-motion:reduce){#cur.slam{animation:none}}

  #lyr .bar{margin-top:clamp(7px,1vh,12px);height:3px;background:rgba(239,230,212,.14);
    position:relative;overflow:hidden}
  #lyr .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);
    box-shadow:0 0 12px var(--accent)}

  #lyr.empty .panel{border-color:rgba(239,230,212,.55)}
  #lyr.empty #cur{color:rgba(239,230,212,.75);letter-spacing:.3em}

  /* ---- beat/level HUD, bottom-left ---- */
  #hud{position:absolute;left:max(16px,3vw);bottom:max(12px,2.6vh);z-index:7;pointer-events:none;
    font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.24em;
    color:rgba(239,230,212,.4);text-transform:uppercase}
  #hud b{color:rgba(239,230,212,.8);font-weight:700}

  /* ---- red chop seal, top right ---- */
  #seal{position:absolute;right:max(18px,3.4vw);top:max(16px,4vh);z-index:7;
    width:clamp(36px,4.4vw,60px);height:clamp(36px,4.4vw,60px);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(6deg);pointer-events:none;
    color:#fbf3e2;background:rgba(196,16,46,.88);
    font-family:var(--comic);font-weight:900;font-size:clamp(18px,2.3vw,31px);line-height:1;
    border:2px solid rgba(247,239,221,.82);
    box-shadow:0 0 0 3px rgba(196,16,46,.16),6px 6px 0 rgba(0,0,0,.45);
    text-shadow:0 0 8px rgba(0,0,0,.35)}
  @media (max-aspect-ratio:1/1){#seal{right:14px;top:14px;opacity:.9}}

  @media (max-aspect-ratio:1/1){
    #lyr{width:88vw;bottom:3.4vh}
    #lyr .panel{box-shadow:6px 6px 0 rgba(196,16,46,.30),0 0 0 1px rgba(5,3,7,.9) inset}
    #meta .ttl,#meta .art{max-width:72vw}
    #hud{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #cur .ch{transition:none}
    #lyr{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="meta">
    <div class="iss"><i></i>棋局 · 337</div>
    <div class="ttl" id="ttl">—</div>
    <div class="art" id="art"></div>
  </div>
  <div id="lyr">
    <div class="panel">
      <div class="prev" id="prev"></div>
      <div id="cur">· · ·</div>
      <div class="next" id="next"></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </div>
  <div id="hud"><b id="hudBpm">—</b> BPM</div>
  <div id="seal">忍</div>
</div>
<script>
(function(){
'use strict';

/* ---------------- state ---------------- */
var S = {
  lines: [], idx: -1, t: 0, playing: true,
  frames: 0, js: 0, err: '', rm: false,
  W: 1440, H: 900, dpr: 1, clock: 0,
  dur: 0, title: '', artist: '', accent: [220, 40, 60]
};

var cv = document.getElementById('cv');
var g = cv.getContext('2d', { alpha: false });
var elCur = document.getElementById('cur');
var elPrev = document.getElementById('prev');
var elNext = document.getElementById('next');
var elLyr = document.getElementById('lyr');
var elBar = document.getElementById('barFill');
var elTtl = document.getElementById('ttl');
var elArt = document.getElementById('art');
var elBpm = document.getElementById('hudBpm');

/* ---------------- ready (once only) ---------------- */
var readySent = false;
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch(e){}
}
setTimeout(sendReady, 700);

/* ---------------- helpers ---------------- */
function num(v, d){ v = +v; return isFinite(v) ? v : d; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function wob(seed){
  var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return (x - Math.floor(x)) * 2 - 1;
}

/* ---------------- palette ---------------- */
var COL = { ink: '#070409', deep: '#1b0410', blood: '#c3102c', bone: '#efe6d4' };
var ACC = { r: 255, g: 59, b: 92, css: 'rgb(255,59,92)', soft: 'rgba(255,59,92,.55)', dim: 'rgba(255,59,92,.2)' };

function applyAccent(){
  var a = S.accent;
  ACC.r = clamp(Math.round(num(a[0], 220)), 0, 255);
  ACC.g = clamp(Math.round(num(a[1], 40)), 0, 255);
  ACC.b = clamp(Math.round(num(a[2], 60)), 0, 255);
  ACC.css = 'rgb(' + ACC.r + ',' + ACC.g + ',' + ACC.b + ')';
  ACC.soft = 'rgba(' + ACC.r + ',' + ACC.g + ',' + ACC.b + ',.55)';
  ACC.dim = 'rgba(' + ACC.r + ',' + ACC.g + ',' + ACC.b + ',.2)';
  try { document.documentElement.style.setProperty('--accent', ACC.css); } catch(e){}
}

function lg(c, x0, y0, x1, y1, stops){
  var gr;
  try { gr = c.createLinearGradient(x0, y0, x1, y1); } catch(e){ return COL.ink; }
  for (var i = 0; i < stops.length; i++){
    try { gr.addColorStop(clamp(stops[i][0], 0, 1), stops[i][1]); } catch(e){}
  }
  return gr;
}
function rg(c, x0, y0, r0, x1, y1, r1, stops){
  var gr;
  try { gr = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0.1, r1)); } catch(e){ return COL.ink; }
  for (var i = 0; i < stops.length; i++){
    try { gr.addColorStop(clamp(stops[i][0], 0, 1), stops[i][1]); } catch(e){}
  }
  return gr;
}

/* hand-drawn ink line */
function inkLine(c, x1, y1, x2, y2, w, seed){
  var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var nx = -dy / len, ny = dx / len;
  var j = wob(seed) * len * 0.012, k = wob(seed + 7.3) * len * 0.012;
  c.beginPath();
  c.moveTo(x1 + j * nx, y1 + j * ny);
  c.quadraticCurveTo(mx + k * nx, my + k * ny, x2, y2);
  c.lineWidth = w;
  c.stroke();
}

/* ---------------- geometry: chessboard in perspective ---------------- */
var GEO = { cx: 720, farY: 270, nearY: 774, halfNear: 864, k: 2.35, smin: 900 };
function computeGeo(){
  var W = S.W, H = S.H;
  GEO.cx = W * 0.5;
  GEO.farY = H * 0.295;
  GEO.nearY = H * 0.80;
  GEO.halfNear = W * 0.625;
  GEO.k = 2.35;
  GEO.smin = Math.min(W, H);
  GEO.ver = (GEO.ver || 0) + 1;
}
function bp(u, nv){
  var s = 1 / (1 + nv * GEO.k);
  var sFar = 1 / (1 + GEO.k);
  var f = (s - sFar) / (1 - sFar);
  var y = GEO.farY + (GEO.nearY - GEO.farY) * f;
  return { x: GEO.cx + (u / 4) * GEO.halfNear * s, y: y, s: s };
}

/* ---------------- textures ---------------- */
var TEX = { halftone: null, grain: null };
function makeHalftoneTile(size, r, color){
  var cv2 = document.createElement('canvas');
  cv2.width = size; cv2.height = size;
  var c = cv2.getContext('2d');
  c.fillStyle = color;
  c.beginPath();
  c.arc(size / 2, size / 2, r, 0, Math.PI * 2);
  c.fill();
  return cv2;
}
function makeGrainTile(size){
  var cv2 = document.createElement('canvas');
  cv2.width = size; cv2.height = size;
  var c = cv2.getContext('2d');
  var img = c.createImageData(size, size);
  var d = img.data;
  var seed = 991;
  for (var i = 0; i < d.length; i += 4){
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    var v = (seed >> 16) & 255;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 26;
  }
  c.putImageData(img, 0, 0);
  return cv2;
}

/* ---------------- stars ---------------- */
var STARS = (function(){
  var a = [], seed = 20250711;
  function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  for (var i = 0; i < 190; i++){
    a.push({ x: rnd(), y: rnd() * 0.66, r: 0.5 + rnd() * 1.7, al: 0.18 + rnd() * 0.72, s: rnd() });
  }
  var sp = [];
  for (var j = 0; j < 13; j++){
    sp.push({ x: rnd(), y: rnd() * 0.55, r: 4 + rnd() * 9, al: 0.35 + rnd() * 0.45 });
  }
  return { dots: a, spikes: sp };
})();

/* ---------------- scene cache ---------------- */
var scene = document.createElement('canvas');
var sceneOK = false;
var SH = {};

function buildScene(){
  if (!scene || !scene.getContext) return;
  var W = S.W, H = S.H;
  var dpr = clamp(Math.min(S.dpr, Math.sqrt(3.6e6 / Math.max(1, W * H))), 0.6, 1.6);
  scene.width = Math.max(2, Math.round(W * dpr));
  scene.height = Math.max(2, Math.round(H * dpr));
  var c = scene.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  SH.dpr = dpr;
  TEX.halftone = makeHalftoneTile(7, 1.7, '#000');
  TEX.grain = TEX.grain || makeGrainTile(256);

  drawSky(c);
  drawMoon(c);
  drawBoard(c);
  drawArmy(c);
  buildOverlay();
  sceneOK = true;
}

function drawSky(c){
  var W = S.W, H = S.H;
  c.fillStyle = lg(c, 0, 0, 0, H, [[0, '#10030a'], [0.32, '#260711'], [0.62, '#1a0410'], [1, '#060308']]);
  c.fillRect(0, 0, W, H);

  c.fillStyle = rg(c, W * 0.5, H * 0.33, 0, W * 0.5, H * 0.33, Math.max(W, H) * 0.62,
    [[0, 'rgba(178,20,46,.42)'], [0.42, 'rgba(120,10,34,.22)'], [1, 'rgba(0,0,0,0)']]);
  c.fillRect(0, 0, W, H);

  /* stars */
  for (var i = 0; i < STARS.dots.length; i++){
    var s = STARS.dots[i];
    var a = s.al * (0.55 + 0.45 * Math.sin(i * 2.1));
    c.fillStyle = 'rgba(240,232,214,' + a.toFixed(3) + ')';
    c.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  for (var j = 0; j < STARS.spikes.length; j++){
    var p = STARS.spikes[j];
    var px2 = p.x * W, py2 = p.y * H, r = p.r;
    c.strokeStyle = 'rgba(244,238,224,' + p.al.toFixed(2) + ')';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(px2 - r, py2); c.lineTo(px2 + r, py2);
    c.moveTo(px2, py2 - r); c.lineTo(px2, py2 + r);
    c.stroke();
  }

  /* ink cloud bands */
  c.save();
  c.globalAlpha = 0.5;
  for (var k = 0; k < 5; k++){
    var bx = W * (0.05 + 0.22 * k), by = H * (0.08 + 0.055 * (k % 3)), bw = W * 0.5, bh = H * 0.045;
    c.fillStyle = rg(c, bx, by, 1, bx, by, bw * 0.5, [[0, 'rgba(10,3,8,.85)'], [1, 'rgba(10,3,8,0)']]);
    c.beginPath();
    c.ellipse(bx, by, bw * 0.5, bh, 0, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}

function drawMoon(c){
  var W = S.W, H = S.H;
  var r = Math.min(W, H) * 0.315;
  var cx = W * 0.5, cy = H * 0.225;

  c.save();
  c.translate(cx, cy);
  c.strokeStyle = 'rgba(196,20,44,.20)';
  c.lineWidth = Math.max(1, r * 0.012);
  for (var i = 0; i < 54; i++){
    var a = (i / 54) * Math.PI * 2;
    var rr = r * (1.1 + 0.5 * Math.abs(Math.sin(i * 2.7)));
    c.beginPath();
    c.moveTo(Math.cos(a) * r * 1.01, Math.sin(a) * r * 1.01);
    c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    c.stroke();
  }
  c.restore();

  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = rg(c, cx - r * 0.32, cy - r * 0.38, r * 0.05, cx, cy, r,
    [[0, '#a3162a'], [0.5, '#5e0a18'], [1, '#1b0308']]);
  c.fill();

  c.save();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.clip();
  var pat = null;
  try { pat = c.createPattern(TEX.halftone, 'repeat'); } catch(e){}
  if (pat){
    c.globalAlpha = 0.42;
    c.fillStyle = pat;
    c.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  c.globalAlpha = 0.35;
  for (var q = 0; q < 7; q++){
    var qx = cx - r + r * (0.3 + 0.55 * Math.abs(wob(q * 3.1))) * 2 - r * 0.3;
    var qy = cy - r + r * (0.25 + 0.5 * Math.abs(wob(q * 5.7))) * 2 - r * 0.3;
    c.strokeStyle = 'rgba(15,2,6,.5)';
    c.lineWidth = Math.max(1, r * 0.012);
    c.beginPath();
    c.arc(qx, qy, r * (0.06 + 0.09 * Math.abs(wob(q))), 0, Math.PI * 2);
    c.stroke();
  }
  c.restore();

  c.strokeStyle = 'rgba(239,230,212,.75)';
  c.lineWidth = Math.max(1.5, r * 0.012);
  c.beginPath();
  c.arc(cx, cy, r - 1, 0, Math.PI * 2);
  c.stroke();
}

function drawBoard(c){
  var W = S.W, H = S.H;
  var nL = bp(-4, 0), nR = bp(4, 0), fL = bp(-4, 1), fR = bp(4, 1);
  var th = Math.max(7, Math.min(W, H) * 0.024);

  /* red glow pooling under the slab */
  c.save();
  c.fillStyle = rg(c, W * 0.5, (nL.y + fL.y) * 0.5, 0, W * 0.5, (nL.y + fL.y) * 0.5, W * 0.62,
    [[0, 'rgba(196,16,46,.30)'], [1, 'rgba(196,16,46,0)']]);
  c.beginPath();
  c.moveTo(nL.x, nL.y); c.lineTo(fL.x, fL.y); c.lineTo(fR.x, fR.y); c.lineTo(nR.x, nR.y);
  c.closePath(); c.fill();
  c.restore();

  /* slab thickness */
  c.beginPath();
  c.moveTo(nL.x, nL.y); c.lineTo(nL.x, nL.y + th);
  c.lineTo(fL.x, fL.y + th * 0.42); c.lineTo(fR.x, fR.y + th * 0.42);
  c.lineTo(nR.x, nR.y + th); c.closePath();
  c.fillStyle = '#0d0409';
  c.fill();

  /* squares */
  var pat = null;
  try { pat = c.createPattern(TEX.halftone, 'repeat'); } catch(e){}
  for (var i = 0; i < 8; i++){
    for (var j = 0; j < 8; j++){
      var u1 = -4 + j, u2 = u1 + 1, nv1 = i / 8, nv2 = (i + 1) / 8;
      var p1 = bp(u1, nv1), p2 = bp(u2, nv1), p3 = bp(u2, nv2), p4 = bp(u1, nv2);
      c.beginPath();
      c.moveTo(p1.x, p1.y); c.lineTo(p2.x, p2.y); c.lineTo(p3.x, p3.y); c.lineTo(p4.x, p4.y);
      c.closePath();
      if ((i + j) % 2 === 0){
        c.fillStyle = '#ddd2bc';
        c.fill();
        if (pat){
          c.save();
          c.clip();
          c.globalAlpha = 0.16;
          c.fillStyle = pat;
          c.fillRect(p4.x, p4.y, p2.x - p4.x || 1, p1.y - p4.y || 1);
          c.restore();
        }
      } else {
        c.fillStyle = (i * 3 + j) % 5 === 0 ? '#330813' : '#20050d';
        c.fill();
      }
    }
  }

  /* grid ink lines */
  c.strokeStyle = '#0a050b';
  c.lineCap = 'round';
  for (var m = 0; m <= 8; m++){
    var uu = -4 + m;
    var a1 = bp(uu, 0), a2 = bp(uu, 1);
    inkLine(c, a1.x, a1.y, a2.x, a2.y, Math.max(1.4, 2.4 * a1.s), m * 2.1);
  }
  for (var n = 0; n <= 8; n++){
    var nv = n / 8;
    var b1 = bp(-4, nv), b2 = bp(4, nv);
    inkLine(c, b1.x, b1.y, b2.x, b2.y, Math.max(1.2, 2.4 * b1.s), n * 3.7 + 40);
  }

  /* chess pieces flanking the duel */
  var qp = bp(-3.35, 0.36), rp = bp(3.45, 0.33);
  piece(c, qp.x, qp.y, S.H * 0.19 * qp.s, 'queen');
  piece(c, rp.x, rp.y, S.H * 0.175 * rp.s, 'rook');

  /* outer rim */
  c.strokeStyle = 'rgba(239,230,212,.8)';
  c.lineWidth = Math.max(1.2, 2.2);
  c.beginPath();
  c.moveTo(nL.x, nL.y); c.lineTo(nR.x, nR.y); c.lineTo(fR.x, fR.y); c.lineTo(fL.x, fL.y);
  c.closePath();
  c.stroke();

  /* near edge highlight */

}

function skel(c, x, y, h, flip, seed){
  var u = h / 100;
  c.save();
  c.translate(x, y);
  c.scale(flip * u, u);
  c.lineCap = 'round';
  c.lineJoin = 'round';
  var lean = wob(seed) * 3;
  var bone = '#e4dac6', ink = '#0a050b';

  c.strokeStyle = bone;
  c.fillStyle = bone;

  /* legs */
  c.lineWidth = 4.6;
  c.beginPath();
  c.moveTo(-3, -44); c.lineTo(-7 + lean, -22); c.lineTo(-6 + lean, 0);
  c.moveTo(3, -44); c.lineTo(8 + lean, -22); c.lineTo(10 + lean, 0);
  c.stroke();

  /* spine + ribs */
  c.lineWidth = 4.2;
  c.beginPath(); c.moveTo(0, -46); c.lineTo(lean * 0.5, -70); c.stroke();
  c.lineWidth = 2.6;
  for (var i = 0; i < 4; i++){
    var ry = -50 - i * 5.4;
    c.beginPath();
    c.arc(lean * 0.4, ry, 9 - i * 0.7, Math.PI * 0.92, Math.PI * 2.08);
    c.stroke();
  }

  /* arms + spear */
  c.lineWidth = 4;
  c.beginPath();
  c.moveTo(-1, -68); c.lineTo(-16, -56); c.lineTo(-20, -40);
  c.moveTo(1, -68); c.lineTo(14, -62); c.lineTo(18, -52);
  c.stroke();

  /* skull */
  c.beginPath();
  c.ellipse(lean * 0.5, -82, 8.4, 9.2, 0, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = ink;
  c.beginPath();
  c.ellipse(lean * 0.5 - 3.2, -84, 2.4, 2.9, 0, 0, Math.PI * 2);
  c.ellipse(lean * 0.5 + 3.4, -84, 2.4, 2.9, 0, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = bone;
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(lean * 0.5 - 3, -77); c.lineTo(lean * 0.5 + 3, -77);
  c.stroke();

  /* spear */
  if (seed % 3 === 0){
    c.strokeStyle = '#c8bda6';
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(-24, 4); c.lineTo(20, -104);
    c.stroke();
    c.fillStyle = '#c8bda6';
    c.beginPath();
    c.moveTo(20, -104); c.lineTo(14, -96); c.lineTo(23, -95);
    c.closePath(); c.fill();
  }
  c.restore();
}

function drawArmy(c){
  var rows = [
    { nv: 0.62, u0: -3.5, du: 0.64, n: 11, h: 0.080, flip: 1 },
    { nv: 0.48, u0: -3.4, du: 0.62, n: 10, h: 0.090, flip: -1 },
    { nv: 0.36, u0: -3.6, du: 0.70, n: 9, h: 0.100, flip: 1 }
  ];
  for (var r = 0; r < rows.length; r++){
    var row = rows[r];
    for (var i = 0; i < row.n; i++){
      var u = row.u0 + i * row.du + wob(r * 9 + i) * 0.12;
      var p = bp(u, row.nv);
      var hh = S.H * row.h * p.s * (0.86 + 0.28 * Math.abs(wob(i * 3.3 + r)));
      skel(c, p.x, p.y, hh, row.flip * (1 + 0.2 * wob(i)), r * 17 + i * 5.1);
    }
  }
}

/* ---------------- lyrics ---------------- */
var LY = { spans: [], times: [], cursor: 0, start: 0, dur: 1, idx: -2, glow: -1 };

function fitFontSize(text){
  var W = S.W, H = S.H;
  var portrait = W / H < 0.95;
  var panelW = Math.min(W * (portrait ? 0.86 : 0.68), 860) - Math.min(W * 0.055, 76);
  var base = portrait ? clamp(W * 0.082, 20, 46)
                      : clamp(Math.min(W * 0.048, H * 0.063), 19, 62);
  var em = 0;
  for (var i = 0; i < text.length; i++){
    var cc = text.charCodeAt(i);
    em += (cc < 0x2e80) ? 0.56 : 1.0;
  }
  var maxLines = portrait ? 4.2 : 3.1;
  var fs = Math.min(base, (panelW * maxLines) / Math.max(1, em));
  return clamp(Math.round(fs), 13, 62);
}

function charTimes(line, n){
  var arr = [];
  var t0 = num(line.t, 0);
  var d = num(line.dur, 0);
  if (!(d > 0)) d = Math.max(1.2, n * 0.17);
  var ch = (line.chars && line.chars.length) ? line.chars : null;
  for (var i = 0; i < n; i++){
    var ct = null;
    if (ch){
      var cn = ch[Math.min(i, ch.length - 1)];
      if (cn && isFinite(+cn.t)) ct = +cn.t;
    }
    if (ct === null) ct = t0 + d * 0.88 * (i / Math.max(1, n - 1));
    arr.push(ct);
  }
  return arr;
}

function setPanelVisible(v){
  elLyr.style.opacity = v ? '1' : '0';
}

function buildLine(line, idx){
  LY.spans = []; LY.times = []; LY.cursor = 0; LY.glow = -1;
  LY.idx = idx;
  elCur.innerHTML = '';
  elCur.classList.remove('slam');
  elLyr.classList.remove('empty');
  setPanelVisible(true);

  var text = (line && typeof line.text === 'string') ? line.text : '';
  var lines = S.lines;

  var prevTxt = (idx > 0 && lines[idx - 1] && typeof lines[idx - 1].text === 'string') ? lines[idx - 1].text : '';
  var nextTxt = (idx + 1 < lines.length && lines[idx + 1] && typeof lines[idx + 1].text === 'string') ? lines[idx + 1].text : '';
  elPrev.textContent = prevTxt;
  elNext.textContent = nextTxt;

  if (!text){
    elCur.textContent = idx < 0 ? '· · ·' : '';
    LY.start = num(line && line.t, S.t);
    LY.dur = Math.max(0.4, num(line && line.dur, 1.6));
    elCur.style.fontSize = '';
    return;
  }

  var fs = fitFontSize(text);
  elCur.style.fontSize = fs + 'px';

  LY.start = num(line.t, 0);
  LY.dur = num(line.dur, 0);
  if (!(LY.dur > 0)) LY.dur = Math.max(1.2, text.length * 0.17);
  LY.times = charTimes(line, text.length);

  var frag = document.createDocumentFragment();
  for (var i = 0; i < text.length; i++){
    var sp = document.createElement('span');
    sp.className = 'ch off';
    sp.textContent = text[i];
    frag.appendChild(sp);
    LY.spans.push(sp);
  }
  elCur.appendChild(frag);

  elCur.classList.remove('slam');
  if (!S.rm){
    void elCur.offsetWidth;
    elCur.classList.add('slam');
  }
}

function syncLyric(t){
  if (!S.lines.length) return;
  var spans = LY.spans;
  if (spans.length){
    if (t < LY.times[0] - 0.05 && LY.cursor > 0){
      for (var k = 0; k < spans.length; k++) spans[k].className = 'ch off';
      LY.cursor = 0; LY.glow = -1;
    }
    var i = LY.cursor;
    while (i < LY.times.length && LY.times[i] <= t + 0.001){
      spans[i].className = 'ch on';
      i++;
    }
    LY.cursor = i;
    if (!S.rm && i > 0 && i - 1 !== LY.glow){
      if (LY.glow >= 0 && spans[LY.glow]) spans[LY.glow].className = 'ch on';
      spans[i - 1].className = 'ch on glow';
      LY.glow = i - 1;
    }
  }
  var p = clamp((t - LY.start) / Math.max(0.25, LY.dur), 0, 1);
  var w = (p * 100).toFixed(1);
  if (w !== LY.barW){ LY.barW = w; elBar.style.width = w + '%'; }
}

function showEmpty(){
  setPanelVisible(true);
  elLyr.classList.add('empty');
  elCur.innerHTML = '';
  elCur.style.fontSize = '';
  elCur.textContent = '無  詞';
  elPrev.textContent = '';
  elNext.textContent = 'INSTRUMENTAL · 此局无词';
  elBar.style.width = '0%';
  LY.spans = []; LY.times = []; LY.cursor = 0;
}

function tickLyrics(){
  var lines = S.lines;
  if (!lines.length){
    if (S.idx !== -1 || !elLyr.classList.contains('empty')){
      S.idx = -1;
      showEmpty();
    }
    return;
  }
  var idx = -1;
  for (var i = 0; i < lines.length; i++){
    var ln = lines[i];
    if (!ln) continue;
    var lt = num(ln.t, NaN);
    if (!isFinite(lt)) continue;
    if (lt <= S.t + 0.001) idx = i;
  }
  if (idx !== S.idx){
    S.idx = idx;
    buildLine(idx >= 0 ? lines[idx] : null, idx);
  }
}

/* ---------------- messages ---------------- */
function onInit(p){
  p = p || {};
  S.lines = Array.isArray(p.lines) ? p.lines : [];
  S.dur = num(p.duration, 0);
  var song = p.song || {};
  S.title = (song.name === null || song.name === undefined) ? '' : String(song.name);
  var a = song.artists;
  if (Array.isArray(a)){
    S.artist = a.map(function(v){
      if (v === null || v === undefined) return '';
      return typeof v === 'string' ? v : String(v.name || '');
    }).filter(Boolean).join(' / ');
  } else {
    S.artist = (a === null || a === undefined) ? '' : String(a);
  }
  if (Array.isArray(p.accent) && p.accent.length >= 3){
    S.accent = [num(p.accent[0],220), num(p.accent[1],40), num(p.accent[2],60)].map(function(v){ return clamp(Math.round(v),0,255); });
  }
  S.idx = -2;
  applyAccent();
  elTtl.textContent = S.title || '無 題';
  elArt.textContent = S.artist || '';
  LY.barW = '';
  tickLyrics();
}

function onMsg(ev){
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') onInit(d.payload);
  else if (d.type === 'tick'){
    var p = d.payload || {};
    S.t = num(p.time, S.t);              // always adopt
    S.playing = p.playing !== false;
    tickLyrics();
  } else if (d.type === 'beat'){
    var pb = d.payload || {};
    BEAT.level = clamp(num(pb.level, 0.6), 0, 1);
    BEAT.imp = Math.min(1.8, BEAT.imp + 0.5 + BEAT.level * 0.8);
    BEAT.count++;
    BEAT.seq++;
    BEAT.at = S.clock || 0;
    LIVE.level = Math.max(LIVE.level * 0.7, BEAT.level);
  } else if (d.type === 'live'){
    var pl = d.payload || {};
    LIVE.bpm = num(pl.bpm, LIVE.bpm);
    LIVE.level = clamp(num(pl.level, LIVE.level), 0, 1);
    LIVE.bass = clamp(num(pl.bass, LIVE.bass), 0, 1);
    LIVE.mid = clamp(num(pl.mid, LIVE.mid), 0, 1);
    LIVE.treble = clamp(num(pl.treble, LIVE.treble), 0, 1);
    if (pl.playing === false) S.playing = false;
    var bpmTxt = LIVE.bpm > 0 ? String(Math.round(LIVE.bpm)) : '—';
    if (bpmTxt !== LY.bpmTxt){ LY.bpmTxt = bpmTxt; elBpm.textContent = bpmTxt; }
  }
}

function onResize(){
  var w = window.innerWidth, h = window.innerHeight;
  S.W = (isFinite(w) && w > 0) ? w : 1440;
  S.H = (isFinite(h) && h > 0) ? h : 900;
  var dpr = window.devicePixelRatio || 1;
  if (!isFinite(dpr) || dpr <= 0) dpr = 1;
  var px = S.W * S.H * dpr * dpr;
  if (px > 8.4e6) dpr = Math.sqrt(8.4e6 / (S.W * S.H));
  S.dpr = clamp(dpr, 1, 2);
  cv.width = Math.max(1, Math.round(S.W * S.dpr));
  cv.height = Math.max(1, Math.round(S.H * S.dpr));
  g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  computeGeo();
  sceneOK = false;
  if (rzT) clearTimeout(rzT);
  rzT = setTimeout(function(){
    rzT = 0;
    if (S.lines.length && S.idx >= 0 && S.lines[S.idx]){
      buildLine(S.lines[S.idx], S.idx);
    }
  }, 160);
}

function spawnBlood(x, y, n, spread){
  for (var i = 0; i < n; i++){
    var a = -Math.PI * 0.5 + wob(i * 3.1 + DROPS.length) * spread;
    var sp = 90 + Math.abs(wob(i * 7.7 + DROPS.length * 1.3)) * 260;
    DROPS.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 40,
      r: 1.4 + Math.abs(wob(i * 2.2)) * 3.4,
      life: 0,
      max: 0.8 + Math.abs(wob(i * 5.5)) * 0.9
    });
  }
  if (DROPS.length > 90) DROPS.splice(0, DROPS.length - 90);
}
function updateDrops(dt){
  for (var i = DROPS.length - 1; i >= 0; i--){
    var d = DROPS[i];
    d.life += dt;
    if (d.life > d.max){ DROPS.splice(i, 1); continue; }
    d.vy += 900 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
  }
}
function drawDrops(c){
  for (var i = 0; i < DROPS.length; i++){
    var d = DROPS[i];
    var a = clamp(1 - d.life / d.max, 0, 1);
    c.fillStyle = 'rgba(190,16,44,' + (0.85 * a).toFixed(3) + ')';
    c.beginPath();
    c.ellipse(d.x, d.y, d.r * 0.8, d.r * (1.5 + Math.min(2, d.life * 2)), 0, 0, Math.PI * 2);
    c.fill();
  }
}

/* ---------------- per-frame action layer ---------------- */
function drawAction(c, t, dt){
  var W = S.W, H = S.H;
  updateDrops(dt);

  /* low-end pulse travelling along the board's near edge */
  var edgeY = bp(0, 0).y;
  var eL = bp(-4, 0).x, eR = bp(4, 0).x;
  c.save();
  c.globalAlpha = 0.10 + LIVE.bass * 0.55 + BEAT.imp * 0.2;
  c.strokeStyle = ACC.css;
  c.lineWidth = 1.5 + LIVE.bass * 5;
  c.beginPath();
  c.moveTo(eL, edgeY + 1.5);
  c.lineTo(eR, edgeY + 1.5);
  c.stroke();
  c.restore();

  var pL = bp(-1.70, 0.135), pR = bp(1.90, 0.160);
  var hL = H * 0.42 * pL.s;
  var hR = H * 0.44 * pR.s;
  var swing = Math.sin(t * 1.9) * 0.30 + BEAT.imp * 0.85;
  if (!S.playing) swing = Math.sin(t * 0.5) * 0.12;

  /* accent pool under each duelist */
  c.save();
  c.globalAlpha = 0.24 + BEAT.imp * 0.3;
  c.fillStyle = ACC.soft;
  c.beginPath();
  c.ellipse(pL.x, pL.y + 2, hL * 0.34, hL * 0.055, 0, 0, Math.PI * 2);
  c.ellipse(pR.x, pR.y + 2, hR * 0.36, hR * 0.06, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();

  /* contact shadows */
  c.fillStyle = 'rgba(4,1,5,.5)';
  c.beginPath();
  c.ellipse(pL.x, pL.y, hL * 0.40, hL * 0.06, 0, 0, Math.PI * 2);
  c.ellipse(pR.x, pR.y, hR * 0.42, hR * 0.065, 0, 0, Math.PI * 2);
  c.fill();

  /* backlit auras so the ink silhouettes separate from dark squares */
  if (AURA.ver !== GEO.ver){
    AURA.ver = GEO.ver;
    AURA.L = rg(c, pL.x, pL.y - hL * 0.52, 0, pL.x, pL.y - hL * 0.52, hL * 0.62,
      [[0, 'rgba(206,20,52,.75)'], [0.6, 'rgba(160,12,44,.28)'], [1, 'rgba(120,8,32,0)']]);
    AURA.R = rg(c, pR.x, pR.y - hR * 0.52, 0, pR.x, pR.y - hR * 0.52, hR * 0.62,
      [[0, 'rgba(206,20,52,.75)'], [0.6, 'rgba(160,12,44,.28)'], [1, 'rgba(120,8,32,0)']]);
  }
  c.save();
  c.globalAlpha = 0.30 + BEAT.imp * 0.25;
  c.fillStyle = AURA.L;
  c.beginPath();
  c.ellipse(pL.x, pL.y - hL * 0.52, hL * 0.62, hL * 0.66, 0, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = AURA.R;
  c.beginPath();
  c.ellipse(pR.x, pR.y - hR * 0.52, hR * 0.62, hR * 0.66, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();

  var tipR = drawSamurai(c, pR.x, pR.y, hR, -1, t, swing);
  var tipL = drawNinja(c, pL.x, pL.y, hL, 1, t, swing);
  /* blood: on beat, and a slow drip from the blade */
  if (BEAT.seq !== BEAT.seen){
    BEAT.seen = BEAT.seq;
    spawnBlood(tipL.x, tipL.y, 7 + Math.round(BEAT.level * 6), 1.6);
    spawnBlood(tipR.x, tipR.y, 5, 1.3);
  }
  if (S.playing && !S.rm){
    BEAT.drip = (BEAT.drip || 0) + dt;
    if (BEAT.drip > 0.28){
      BEAT.drip = 0;
      spawnBlood(tipL.x, tipL.y, 1, 0.3);
    }
  }

  /* foreground flankers (skip on narrow screens) */
  if (W >= 560){
    var fgH = Math.min(H * 0.40, W * 0.30);
    var fgY = bp(0, 0).y + H * 0.014;
    c.save();
    c.globalAlpha = 0.92;
    skel(c, W * 0.052, fgY, fgH, 1, 11);
    skel(c, W * 0.952, fgY - H * 0.012, fgH * 1.06, -1, 23);
    c.restore();
  }

  drawDrops(c);
}


/* ---------------- motion / beat state ---------------- */
var SHAKE = { x: 0, y: 0, amp: 0 };
var AURA = { ver: -1, L: null, R: null };
var BEAT = { imp: 0, level: 0, count: 0, at: -999, seq: 0, seen: 0, drip: 0 };
var LIVE = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 };

function stepMotion(dt){
  BEAT.imp *= Math.pow(0.02, dt);
  if (BEAT.imp < 0.002) BEAT.imp = 0;
  LIVE.level *= Math.pow(0.35, dt);
  LIVE.bass *= Math.pow(0.5, dt);
  var amp = S.rm ? 0 : (BEAT.imp * 6.5 + LIVE.bass * 2.5);
  SHAKE.amp = amp;
  SHAKE.x = wob((S.clock || 0) * 31.7) * amp;
  SHAKE.y = wob((S.clock || 0) * 41.3) * amp;
}

/* ---------------- print artefacts overlay (cached) ---------------- */
var OV = document.createElement('canvas');

function buildOverlay(){
  var W = S.W, H = S.H;
  var dpr = SH.dpr || 1;
  OV.width = Math.max(2, Math.round(W * dpr));
  OV.height = Math.max(2, Math.round(H * dpr));
  var c = OV.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  /* halftone concentrated at the edges */
  var pat = null;
  try { pat = c.createPattern(TEX.halftone, 'repeat'); } catch(e){}
  if (pat){
    c.fillStyle = pat;
    c.fillRect(0, 0, W, H);
    var mask = rg(c, W * 0.5, H * 0.46, Math.min(W, H) * 0.18, W * 0.5, H * 0.46, Math.max(W, H) * 0.72,
      [[0, 'rgba(0,0,0,0)'], [0.55, 'rgba(0,0,0,.35)'], [1, 'rgba(0,0,0,1)']]);
    c.globalCompositeOperation = 'destination-in';
    c.fillStyle = mask;
    c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'source-over';
  }

  /* film grain */
  var gp = null;
  try { gp = c.createPattern(TEX.grain, 'repeat'); } catch(e){}
  if (gp){
    c.globalAlpha = 0.5;
    c.fillStyle = gp;
    c.fillRect(0, 0, W, H);
    c.globalAlpha = 1;
  }

  /* edge vignette + bottom shadow for the caption area */
  c.fillStyle = rg(c, W * 0.5, H * 0.45, Math.min(W, H) * 0.30, W * 0.5, H * 0.45, Math.max(W, H) * 0.78,
    [[0, 'rgba(4,1,6,0)'], [0.65, 'rgba(4,1,6,.28)'], [1, 'rgba(4,1,6,.9)']]);
  c.fillRect(0, 0, W, H);
  c.fillStyle = lg(c, 0, H * 0.55, 0, H, [[0, 'rgba(4,1,6,0)'], [1, 'rgba(4,1,6,.85)']]);
  c.fillRect(0, H * 0.55, W, H * 0.45);

  /* torn ink margin */
  c.fillStyle = '#050307';
  var side = Math.max(6, Math.min(W, H) * 0.012);
  c.beginPath();
  c.moveTo(0, 0); c.lineTo(W, 0);
  c.lineTo(W, side);
  for (var x = W; x > 0; x -= W / 14){
    c.lineTo(x, side * (0.55 + 0.9 * Math.abs(wob(x * 0.31))));
  }
  c.closePath();
  c.fill();
}

function drawFx(c, t, dt){
  var W = S.W, H = S.H;
  var imp = BEAT.imp;

  /* ghost registration (comic misprint) */
  if (imp > 0.12){
    c.save();
    c.globalAlpha = Math.min(0.22, imp * 0.16);
    c.globalCompositeOperation = 'lighter';
    c.drawImage(scene, 3 + imp * 3, -2 - imp * 2, W, H);
    c.restore();
  }

  /* speed lines radiating from the duel */
  if (imp > 0.05 && !S.rm){
    var cx = W * 0.5, cy = H * 0.42;
    c.save();
    c.translate(cx, cy);
    c.strokeStyle = 'rgba(239,230,212,' + (0.05 + imp * 0.09).toFixed(3) + ')';
    c.lineWidth = 1.2;
    for (var i = 0; i < 34; i++){
      var a = (i / 34) * Math.PI * 2 + t * 0.06;
      var r0 = Math.min(W, H) * (0.30 + 0.18 * Math.abs(wob(i * 2.7)));
      var r1 = r0 + Math.min(W, H) * (0.12 + 0.3 * Math.abs(wob(i * 5.3 + 1)));
      c.beginPath();
      c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0 * 0.62);
      c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1 * 0.62);
      c.stroke();
    }
    c.restore();
  }

  /* slash crescent between the two fighters */
  if (imp > 0.06){
    var mx = W * 0.5, my = H * 0.46;
    c.save();
    c.translate(mx, my);
    c.rotate(-0.42 + (1 - imp) * 0.18);
    var R = Math.min(W, H) * (0.19 + imp * 0.09);
    c.strokeStyle = 'rgba(246,239,224,' + Math.min(0.9, imp * 0.8).toFixed(3) + ')';
    c.lineWidth = 2 + imp * 7;
    c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, R, -1.15, 0.95); c.stroke();
    c.strokeStyle = 'rgba(196,16,46,' + Math.min(0.8, imp * 0.6).toFixed(3) + ')';
    c.lineWidth = 1.4 + imp * 2.4;
    c.beginPath(); c.arc(0, 0, R * 0.94, -1.0, 0.8); c.stroke();
    c.restore();
  }

  /* embers */
  var n = S.rm ? 16 : 42;
  for (var k = 0; k < n; k++){
    var seedx = wob(k * 3.7) * 0.5 + 0.5;
    var speed = 0.012 + Math.abs(wob(k * 1.9)) * 0.03;
    var yy = 1 - ((t * speed + Math.abs(wob(k * 9.1))) % 1);
    var xx = seedx * W + Math.sin(t * 0.7 + k) * W * 0.02;
    var al = 0.25 + 0.5 * Math.abs(Math.sin(t * 1.3 + k * 2.1));
    c.fillStyle = k % 5 === 0 ? 'rgba(196,16,46,' + (al * 0.8).toFixed(3) + ')'
                              : 'rgba(239,230,212,' + (al * 0.45).toFixed(3) + ')';
    var sz = 1 + Math.abs(wob(k * 4.4)) * 2.2;
    c.fillRect(xx, yy * H * 0.92, sz, sz);
  }

  /* cached print artefacts */
  c.drawImage(OV, 0, 0, W, H);

  /* beat flash */
  if (imp > 0.02){
    c.fillStyle = 'rgba(196,16,46,' + Math.min(0.14, imp * 0.09).toFixed(3) + ')';
    c.fillRect(0, 0, W, H);
  }

  /* hand-lettered sound effect */
  if (imp > 0.55 && !S.rm){
    var words = ['斬', 'SHIING!', 'KRAK', '血', 'SWOOSH'];
    var wd = words[BEAT.count % words.length];
    var ax = W * 0.5 + (BEAT.count % 2 ? -1 : 1) * W * 0.18;
    var ay = H * 0.33 + Math.sin(BEAT.count) * H * 0.03;
    var al2 = clamp((imp - 0.55) / 0.9, 0, 1);
    c.save();
    c.translate(ax, ay);
    c.rotate(-0.16);
    var fs = Math.max(18, Math.min(W, H) * 0.075);
    c.font = '900 ' + fs.toFixed(0) + 'px Impact,"Arial Black","Noto Sans SC",sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.globalAlpha = al2;
    c.lineWidth = fs * 0.14;
    c.strokeStyle = '#050307';
    c.strokeText(wd, 0, 0);
    c.fillStyle = '#f4ecda';
    c.fillText(wd, 0, 0);
    c.restore();
  }
}

/* ---------------- loop ---------------- */
var lastNow = 0;
function frame(){
  var t0 = performance.now();
  try {
    sendReady();
    S.frames++;
    var dt = lastNow ? Math.min(0.05, (t0 - lastNow) / 1000) : 0.016;
    lastNow = t0;
    S.clock = (S.clock || 0) + dt;

    if (!sceneOK) buildScene();
    stepMotion(dt);
    g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    g.save();
    g.translate(SHAKE.x, SHAKE.y);
    g.drawImage(scene, -14, -14, S.W + 28, S.H + 28);
    drawAction(g, S.clock, dt);
    g.restore();
    drawFx(g, S.clock, dt);
    syncLyric(S.t);
  } catch(e){
    S.err = String((e && e.message) || e);
  }
  S.js = Math.round((performance.now() - t0) * 100) / 100;
  requestAnimationFrame(frame);
}

window.__stage = function(){
  var line = (S.idx >= 0 && S.lines[S.idx]) ? S.lines[S.idx] : null;
  return {
    lines: S.lines.length,
    idx: S.idx,
    t: S.t,
    playing: S.playing,
    frames: S.frames,
    js: S.js,
    err: S.err,
    text: line && typeof line.text === 'string' ? line.text : '',
    gl: false,
    rm: S.rm
  };
};

try {
  S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
} catch(e){}

window.addEventListener('message', onMsg, false);
window.addEventListener('resize', onResize, false);
onResize();
requestAnimationFrame(frame);
})();
</script>
</body>
