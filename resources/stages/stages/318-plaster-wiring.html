<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>318 · 石膏接线</title>
<style>
  :root{
    --accent-rgb: 127 227 255;
    --accent: rgb(var(--accent-rgb));
    --ink:#08090b;
    --plaster:#ece5d6;
    --plaster-dim:#9b9384;
    --gold:#b9955a;
    --grain:none;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{
    font-family:Georgia,"Times New Roman","Songti SC",SimSun,"Source Han Serif SC","Noto Serif CJK SC",serif;
    color:var(--plaster);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#07080a}

  /* ---------- 画室墙 ---------- */
  #wall{
    position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(70% 55% at 74% 14%, rgba(255,213,158,.13), rgba(255,213,158,0) 62%),
      radial-gradient(60% 70% at 12% 78%, rgba(var(--accent-rgb) / .10), rgba(var(--accent-rgb) / 0) 65%),
      radial-gradient(130% 120% at 40% 30%, #171618 0%, #0d0d10 46%, #060608 100%);
  }
  #wall::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 26%, transparent 70%, rgba(0,0,0,.5) 100%);
  }

  /* ---------- 地台 ---------- */
  #floor{
    position:absolute;left:0;right:0;bottom:0;height:27vh;z-index:1;pointer-events:none;
    background:
      linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.45) 34%, rgba(0,0,0,0) 100%),
      radial-gradient(46% 130% at 33% 0%, rgba(255,222,180,.10), transparent 72%),
      radial-gradient(34% 120% at 20% 0%, rgba(var(--accent-rgb) / .08), transparent 70%);
  }
  #floor::before{
    content:'';position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg, rgba(255,231,203,0) 0%, rgba(255,231,203,0) 43%, rgba(255,231,203,.11) 58%, rgba(255,231,203,.05) 74%, rgba(255,231,203,.09) 88%, rgba(255,231,203,0) 100%);
  }

  /* ---------- 墙上的画框（里面是示波器） ---------- */
  #frame{
    position:absolute;right:7.5%;top:7%;width:clamp(78px,10.5vw,172px);aspect-ratio:3/4;z-index:2;
    transform:rotate(-1.4deg);
    background:linear-gradient(143deg,#4b3a22 0%,#a9854d 16%,#6d5731 33%,#e2c68c 52%,#8a6c3c 68%,#c8a565 84%,#5a4626 100%);
    box-shadow:0 24px 48px rgba(0,0,0,.62), 0 2px 6px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,236,200,.22);
    padding:8%;
  }
  #frame::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(118deg, rgba(255,244,214,.26) 0%, rgba(255,244,214,0) 26%, rgba(255,244,214,0) 74%, rgba(255,244,214,.10) 100%);
    mix-blend-mode:screen;
  }
  #frame .mat{
    position:relative;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 45%, #0a1116 0%, #05070a 70%, #020304 100%);
    box-shadow:inset 0 0 26px rgba(0,0,0,.95), inset 0 0 0 2px rgba(0,0,0,.7), 0 0 0 1px rgba(255,232,190,.16);
  }
  #frame .mat::after{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, rgba(var(--accent-rgb) / .05) 0 1px, transparent 1px 4px);
    opacity:.5;
  }
  #scope{position:absolute;inset:8% 4%;width:92%;height:84%;overflow:visible}
  #scopePath{
    fill:none;stroke:rgb(var(--accent-rgb));stroke-width:1.1;opacity:.82;
    filter:drop-shadow(0 0 3px rgb(var(--accent-rgb) / .8));
  }

  /* ---------- 歌词 ---------- */
  #lyrics{
    position:absolute;left:47%;right:5.5%;top:0;bottom:0;z-index:5;
    display:flex;flex-direction:column;justify-content:center;
    pointer-events:none;
  }
  /* 词句是这面墙上的投影：一片很淡的光池 */
  #lyrics::before{
    content:'';position:absolute;inset:-14% -16% -14% -10%;z-index:-1;
    background:radial-gradient(58% 52% at 30% 50%, rgba(var(--accent-rgb) / .10), rgba(var(--accent-rgb) / .035) 55%, transparent 74%);
    filter:blur(14px);
  }
  .meta{
    display:flex;align-items:baseline;gap:.9em;flex-wrap:nowrap;
    margin-bottom:1.5em;padding-bottom:.65em;
    border-bottom:1px solid rgba(236,229,214,.10);
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-size:clamp(7.5px,0.72vw,11px);letter-spacing:.3em;text-transform:uppercase;
    color:rgba(236,229,214,.32);white-space:nowrap;overflow:hidden;
  }
  .meta b{font-weight:500;color:rgba(236,229,214,.6);letter-spacing:.22em;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .meta i{font-style:normal;color:rgb(var(--accent-rgb) / .45);overflow:hidden;text-overflow:ellipsis;min-width:0}

  .ln{text-align:left}
  .ln.prev,.ln.next{
    font-size:clamp(11px,1.3vw,19px);line-height:1.72;
    color:rgba(236,229,214,.24);margin:.5em 0;
    transition:opacity .5s ease;white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .ln.prev{opacity:.55}
  .ln.next{opacity:.4}
  .curWrap{position:relative}
  .ln.cur{
    font-size:calc(clamp(20px,3.15vw,47px) * var(--k,1));
    line-height:1.52;letter-spacing:.012em;
    margin:.1em 0 .16em;overflow-wrap:anywhere;
  }
  .ln.cur.swap{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{
    from{opacity:.12;transform:translateY(7px);filter:blur(1.4px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }
  .ln .ch{
    color:rgba(236,229,214,.35);
    transition:color .26s linear, text-shadow .26s linear;
  }
  .ln.cur .ch.on{
    color:#fcf5e7;
    text-shadow:0 0 18px rgba(var(--accent-rgb) / .5), 0 0 3px rgba(255,250,240,.55);
  }
  .ln .ch.now{color:#fffdf6}
  .prog{
    position:relative;height:1px;width:100%;margin-top:.35em;
    background:rgba(236,229,214,.10);overflow:hidden;
  }
  .prog i{
    position:absolute;left:0;top:0;bottom:0;width:100%;
    transform:scaleX(0);transform-origin:0 50%;
    background:linear-gradient(90deg, rgba(var(--accent-rgb) / .05), rgb(var(--accent-rgb) / .8));
  }
  #empty{
    display:none;flex-direction:column;gap:.7em;margin-top:.2em;
  }
  #empty b{
    font-size:clamp(24px,3.4vw,52px);font-weight:400;letter-spacing:.22em;
    color:rgba(236,229,214,.9);
  }
  #empty i{
    font-style:normal;font-family:ui-monospace,monospace;font-size:clamp(8px,.8vw,12px);
    letter-spacing:.42em;color:rgb(var(--accent-rgb) / .6);text-transform:uppercase;
  }
  #lyrics.none .ln,#lyrics.none .curWrap{display:none}
  #lyrics.none #empty{display:flex}
  #lyrics.none .meta{border-bottom-color:rgba(236,229,214,.06)}

  /* ---------- 石膏祭坛：机柜 + 胸像 + 跳线 ---------- */
  #altar{
    position:absolute;z-index:3;left:-1%;bottom:2.5vh;width:55vw;height:90vh;
    pointer-events:none;
  }
  #altarIn{position:absolute;inset:0;will-change:transform}

  .bust{
    position:absolute;bottom:0;left:19%;height:min(100%,48.8vw);aspect-ratio:400/640;
  }
  .bust svg{display:block;width:100%;height:100%;overflow:visible;color:rgb(var(--accent-rgb))}
  .rim{transition:none}

  /* 机柜 */
  .rack{
    position:absolute;left:0;bottom:10%;width:28.5%;height:69%;z-index:1;
    padding:1.6% 1.4%;
    border-radius:3px;
    background:linear-gradient(163deg,#24282e 0%,#14171b 34%,#0b0d10 72%,#07080a 100%);
    box-shadow:
      0 30px 54px rgba(0,0,0,.65),
      0 2px 3px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 0 44px rgba(0,0,0,.72),
      inset 1px 0 0 rgba(255,255,255,.04);
    transform:perspective(1200px) rotateY(11deg) rotateX(1.2deg);
    transform-origin:100% 90%;
    display:flex;flex-direction:column;gap:1.2%;
    /* 机柜向左侧的冷光溢出 */
    filter:drop-shadow(0 0 26px rgba(var(--accent-rgb) / .16));
  }
  .rack-head,.rack-foot{
    display:flex;align-items:center;justify-content:space-between;
    font:500 6.4px/1 ui-monospace,monospace;letter-spacing:.18em;
    color:rgba(233,226,210,.34);text-transform:uppercase;flex:0 0 auto;
    padding:0 2px;
  }
  .rack-head span:last-child{color:rgb(var(--accent-rgb) / .55)}
  .rack-body{flex:1 1 auto;display:flex;flex-direction:column;gap:1.1%;min-height:0}
  .mod{
    position:relative;flex:1 1 auto;min-height:0;border-radius:2px;
    padding:2.5% 3%;
    background:linear-gradient(170deg,rgba(255,255,255,.045),rgba(255,255,255,.005) 40%,rgba(0,0,0,.28));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.055), inset 0 -8px 14px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:4%;
  }
  .mod-lab{
    font:600 5.6px/1 ui-monospace,monospace;letter-spacing:.16em;color:rgba(236,229,214,.5);
    display:flex;justify-content:space-between;align-items:center;
  }
  .mod-lab em{font-style:normal;color:rgb(var(--accent-rgb) / .5)}
  .knobs{display:flex;gap:6%;align-items:center}
  .knob{
    position:relative;flex:1 1 0;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 32% 26%,#3c4149,#191c21 62%,#0c0e11 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.14);
    min-width:0;
  }
  .knob b{
    position:absolute;left:50%;top:12%;width:1.5px;height:32%;
    background:rgba(236,229,214,.72);transform-origin:50% 118%;border-radius:1px;
  }
  .vu{display:flex;align-items:flex-end;gap:5%;height:26%;min-height:8px}
  .vu i{
    flex:1 1 0;background:linear-gradient(to top,rgb(var(--accent-rgb) / .85),rgb(var(--accent-rgb) / .18));
    border-radius:1px;height:100%;transform-origin:50% 100%;transform:scaleY(.18);
    box-shadow:0 0 6px rgb(var(--accent-rgb) / .45);
  }
  .patch{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8%;min-height:0}
  .jack{
    height:100%;width:auto;max-width:100%;aspect-ratio:1;justify-self:center;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#000 0 34%,#23262b 36% 62%,#0b0d10 64%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), 0 1px 2px rgba(0,0,0,.8);
  }
  .jack.live{box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb) / .6), 0 0 8px rgb(var(--accent-rgb) / .5)}

  /* 跳线 */
  #cables{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:4;pointer-events:none}
  .cbl{fill:none;stroke-linecap:round}
  .cbl-shell{stroke:#000;stroke-opacity:.55}
  .cbl-body{stroke:#1a1d22;stroke-opacity:1}
  .cbl-hi{stroke:#4a5158;stroke-opacity:.55}
  .cbl-pulse{
    stroke:rgb(var(--accent-rgb));stroke-opacity:.9;
    filter:drop-shadow(0 0 4px rgb(var(--accent-rgb)));
  }

  /* 插孔锚点（胸像上的） */
  .socket{cursor:default}

  /* ---------- 颗粒 / 暗角 ---------- */
  #vignette{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:
      radial-gradient(78% 68% at 52% 48%, rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 78%, rgba(0,0,0,.74) 100%),
      linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 26%);
  }
  #grain{
    position:absolute;inset:-10%;z-index:6;pointer-events:none;opacity:.055;
    background-image:var(--grain);background-repeat:repeat;mix-blend-mode:overlay;
  }

  /* ---------- 竖屏 / 窄屏 ---------- */
  @media (max-aspect-ratio: 1/1), (max-width: 720px){
    #altar{left:0;width:100%;height:45vh;top:0;bottom:auto}
    .bust{left:24%;height:97%}
    .rack{width:30%;height:64%;bottom:7%}
    #lyrics{left:7.5%;right:7.5%;top:47vh;bottom:3.5vh;justify-content:center}
    .ln.cur{font-size:calc(clamp(21px,7.4vw,34px) * var(--k,1))}
    .ln.prev,.ln.next{font-size:clamp(11px,3.3vw,15px);margin:.42em 0}
    .meta{font-size:9px;letter-spacing:.24em;margin-bottom:1em}
    #frame{display:none}
    #vignette{background:radial-gradient(96% 70% at 50% 30%, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 82%, rgba(0,0,0,.78) 100%)}
  }
  @media (max-height: 460px){
    .meta{margin-bottom:.7em;padding-bottom:.4em}
    .ln.prev,.ln.next{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    .ln .ch{transition:none}
    .ln.cur.swap{animation:none}
    #grain{opacity:.04}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wall"></div>
  <div id="floor"></div>
  <div id="frame">
    <div class="mat">
      <svg id="scope" viewBox="0 0 100 130" preserveAspectRatio="none" aria-hidden="true">
        <path id="scopePath" d="M0,65 L100,65"></path>
      </svg>
    </div>
  </div>
  <div id="altar">
    <div id="altarIn">
      <div class="rack" id="rack">
        <div class="rack-head"><span>MOD·1748</span><span>PWR</span></div>
        <div class="rack-body" id="rackBody"></div>
        <div class="rack-foot"><span>SILICON</span><span>CV/IN</span></div>
      </div>

      <div class="bust" id="bustHost">
        <svg id="bustSvg" viewBox="0 0 400 640" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
          <defs>
            <linearGradient id="gBody" x1="0.92" y1="0.05" x2="0.15" y2="0.98">
              <stop offset="0" stop-color="#f8f2e6"/>
              <stop offset=".24" stop-color="#e9dfcc"/>
              <stop offset=".52" stop-color="#c6bba5"/>
              <stop offset=".76" stop-color="#928876"/>
              <stop offset="1" stop-color="#675f52"/>
            </linearGradient>
            <linearGradient id="gChest" x1="0.9" y1="0.05" x2="0.2" y2="1">
              <stop offset="0" stop-color="#efe7d7"/>
              <stop offset=".3" stop-color="#dcd1bc"/>
              <stop offset=".58" stop-color="#b3a894"/>
              <stop offset=".82" stop-color="#847a6a"/>
              <stop offset="1" stop-color="#5c5549"/>
            </linearGradient>
            <linearGradient id="gPlinth" x1="1" y1="0" x2="0.05" y2="1">
              <stop offset="0" stop-color="#9a907c"/>
              <stop offset=".42" stop-color="#70685a"/>
              <stop offset="1" stop-color="#34312a"/>
            </linearGradient>
            <linearGradient id="gHair" x1="0.85" y1="0.02" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
              <stop offset="0" stop-color="#ded4c0"/>
              <stop offset=".45" stop-color="#b3a892"/>
              <stop offset="1" stop-color="#6a6254"/>
            </linearGradient>
            <radialGradient id="sDark" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#211c15" stop-opacity=".55"/>
              <stop offset=".45" stop-color="#211c15" stop-opacity=".24"/>
              <stop offset="1" stop-color="#211c15" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="sLight" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#fffaf0" stop-opacity=".55"/>
              <stop offset=".45" stop-color="#fffaf0" stop-opacity=".2"/>
              <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="gCast" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#000" stop-opacity=".68"/>
              <stop offset=".5" stop-color="#000" stop-opacity=".26"/>
              <stop offset="1" stop-color="#000" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="gSocket" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="currentColor" stop-opacity=".85"/>
              <stop offset=".45" stop-color="currentColor" stop-opacity=".3"/>
              <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e2c78e"/>
              <stop offset=".5" stop-color="#a1834b"/>
              <stop offset="1" stop-color="#6d5629"/>
            </linearGradient>
            <clipPath id="cHead"><use href="#pHead"/></clipPath>
            <clipPath id="cNeck"><use href="#pNeck"/></clipPath>
            <clipPath id="cChest"><use href="#pChest"/></clipPath>
            <clipPath id="cPlinth"><use href="#pCap"/><use href="#pShaft"/><use href="#pBase"/></clipPath>
            <clipPath id="cBody"><use href="#pHead"/><use href="#pNeck"/><use href="#pChest"/></clipPath>
          </defs>

          <!-- 落地影 -->
          <ellipse cx="200" cy="610" rx="162" ry="19" fill="url(#gCast)"/>
          <ellipse cx="206" cy="601" rx="106" ry="9" fill="#000" opacity=".42"/>

          <!-- 冷侧轮廓光（机柜方向） -->
          <g class="rim rimL" fill="currentColor" opacity=".5" transform="translate(-6,-1)">
            <path d="M204,86 C238,87 264,102 274,131 C283,157 280,186 273,212 C268,240 256,268 240,286 C228,300 214,308 204,308 C193,308 178,300 165,286 C149,268 137,240 132,212 C125,186 122,157 131,131 C141,102 170,86 204,86 Z"/>
            <path d="M167,262 L167,332 C167,352 160,366 148,378 L252,378 C240,366 233,352 233,332 L233,262 Z"/>
            <path d="M150,354 C112,362 86,376 71,398 C60,414 54,438 53,464 L53,474 L347,474 L347,464 C346,438 340,414 329,398 C314,376 288,362 250,354 C240,372 226,380 202,380 C178,380 160,372 150,354 Z"/>
          </g>
          <!-- 暖侧轮廓光（窗） -->
          <g class="rim rimW" fill="#ffd9a4" opacity=".5" transform="translate(6,-2)">
            <path d="M204,86 C238,87 264,102 274,131 C283,157 280,186 273,212 C268,240 256,268 240,286 C228,300 214,308 204,308 C193,308 178,300 165,286 C149,268 137,240 132,212 C125,186 122,157 131,131 C141,102 170,86 204,86 Z"/>
            <path d="M150,354 C112,362 86,376 71,398 C60,414 54,438 53,464 L53,474 L347,474 L347,464 C346,438 340,414 329,398 C314,376 288,362 250,354 C240,372 226,380 202,380 C178,380 160,372 150,354 Z"/>
          </g>

          <!-- 底座 -->
          <path id="pCap" d="M124,470 L276,470 L276,479 L267,489 L133,489 L124,479 Z" fill="url(#gPlinth)"/>
          <path id="pShaft" d="M136,489 L264,489 L258,556 L142,556 Z" fill="url(#gPlinth)"/>
          <path id="pBase" d="M118,601 L282,601 L282,588 L270,556 L130,556 L118,588 Z" fill="url(#gPlinth)"/>
          <g clip-path="url(#cPlinth)">
            <ellipse cx="200" cy="486" rx="104" ry="9" fill="url(#sDark)" opacity=".9"/>
            <ellipse cx="200" cy="474" rx="150" ry="11" fill="#000" opacity=".34"/>
          </g>
          <path d="M124,470 L276,470 L276,474 L124,474 Z" fill="#b7ac96" opacity=".5"/>
          <path d="M264,489 L258,556 L252,556 L258,489 Z" fill="#000" opacity=".16"/>
          <path d="M136,489 L142,556 L148,556 L142,489 Z" fill="#fff" opacity=".07"/>
          <!-- 铭牌 -->
          <rect x="168" y="512" width="64" height="26" rx="1.5" fill="url(#gBrass)" opacity=".82"/>
          <g stroke="#3a2f1a" stroke-width="1.1" opacity=".55">
            <path d="M176,520 L224,520"/><path d="M176,526 L212,526"/><path d="M176,532 L220,532"/>
          </g>
          <rect x="168" y="512" width="64" height="26" rx="1.5" fill="none" stroke="#3a2f1a" stroke-width=".9" opacity=".5"/>

          <!-- 颈 -->
          <path id="pNeck" d="M167,262 L167,332 C167,352 160,366 148,378 L252,378 C240,366 233,352 233,332 L233,262 Z" fill="url(#gChest)"/>
          <g clip-path="url(#cNeck)">
            <ellipse cx="204" cy="322" rx="52" ry="24" fill="url(#sDark)" opacity=".95"/>
            <ellipse cx="186" cy="316" rx="26" ry="18" fill="url(#sDark)" opacity=".8"/>
            <ellipse cx="232" cy="352" rx="20" ry="18" fill="url(#sDark)" opacity=".5"/>
            <ellipse cx="204" cy="300" rx="30" ry="10" fill="url(#sLight)" opacity=".18"/>
          </g>

          <!-- 胸肩 -->
          <path id="pChest" d="M150,354 C112,362 86,376 71,398 C60,414 54,438 53,464 L53,474 L347,474 L347,464 C346,438 340,414 329,398 C314,376 288,362 250,354 C240,372 226,380 202,380 C178,380 160,372 150,354 Z" fill="url(#gChest)"/>
          <g clip-path="url(#cChest)">
            <ellipse cx="120" cy="430" rx="54" ry="46" fill="url(#sDark)" opacity=".7"/>
            <ellipse cx="272" cy="392" rx="46" ry="30" fill="url(#sLight)" opacity=".35"/>
            <ellipse cx="204" cy="416" rx="34" ry="26" fill="url(#sLight)" opacity=".28"/>
            <ellipse cx="160" cy="404" rx="26" ry="14" fill="url(#sDark)" opacity=".5"/>

          <g fill="none" stroke="currentColor" stroke-linecap="round" clip-path="url(#cBody)">
            <path class="crackGlow" d="M146,196 C152,224 141,246 150,266 C159,286 147,300 155,318 C163,336 150,356 138,378 C126,400 116,420 110,442" stroke-width="5" opacity=".07"/>
            <path d="M146,196 C152,224 141,246 150,266 C159,286 147,300 155,318 C163,336 150,356 138,378 C126,400 116,420 110,442" stroke-width="1.2" opacity=".3"/>

            <path d="M155,318 C144,322 136,330 128,336" stroke-width=".8" opacity=".18"/>
          </g>

          <!-- 肩上第二个插孔 -->
          <g class="socket" id="socketB" clip-path="url(#cBody)">
            <circle cx="104" cy="422" r="12" fill="url(#gSocket)" opacity=".5"/>
            <circle cx="104" cy="422" r="6.4" fill="url(#gBrass)"/>
            <circle cx="104" cy="422" r="3.8" fill="#0a0c0e"/>

  <div id="lyrics">
    <div class="meta"><b id="mTitle">—</b><i id="mArtist"></i></div>
    <div class="ln prev" id="lnPrev"></div>
    <div class="curWrap">
      <div class="ln cur" id="lnCur"></div>
      <div class="prog"><i id="progBar"></i></div>
    </div>
    <div class="ln next" id="lnNext"></div>
    <div id="empty"><b>此曲无词</b><i>only the current</i></div>
  </div>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>
<script>
(function(){
  'use strict';

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', text: '', song: {}, accent: [127, 227, 255], duration: 0
  };

  var readySent = false;
  function ready(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {}
  }
  requestAnimationFrame(ready);
  setTimeout(ready, 140);

  function num(v, d){ v = +v; return isFinite(v) ? v : d; }
  function str(v){ return (typeof v === 'string') ? v : (v == null ? '' : String(v)); }

  function normLines(raw){
    var out = [], i, l, txt, dur, ch, arr;
    if (!Array.isArray(raw)) return out;
    for (i = 0; i < raw.length; i++){
      l = raw[i] || {};
      txt = str(l.text);
      dur = num(l.dur, 0);
      if (dur <= 0) dur = Math.max(1.6, txt.length * 0.3);
      arr = null;
      if (Array.isArray(l.chars) && l.chars.length){
        arr = [];
        for (var k = 0; k < l.chars.length; k++){
          ch = l.chars[k];
          if (ch == null) continue;
          arr.push({ c: str(ch.c), t: num(ch.t, -1) });
        }
        if (!arr.length) arr = null;
      }
      out.push({ t: Math.max(0, num(l.t, 0)), dur: dur, text: txt, chars: arr });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    return out;
  }

  function init(p){
    p = p || {};
    S.duration = Math.max(0, num(p.duration, 0));
    if (Array.isArray(p.accent) && p.accent.length >= 3){
      S.accent = [num(p.accent[0],127)|0, num(p.accent[1],227)|0, num(p.accent[2],255)|0];
    }
    S.song = p.song || {};
    S.lines = normLines(p.lines);
    S.idx = -2;
    S.playing = true;
    if (p.playing === false) S.playing = false;
    applyAccent();

    var sg = S.song || {}, nm = str(sg.name) || '未命名', ar = artistStr(sg.artists);
    if (mTitle) mTitle.textContent = nm;
    if (mArtist) mArtist.textContent = ar ? '· ' + ar : '';

    render(true);
  }

  function applyAccent(){
    var a = S.accent.slice(0), l = 0.299 * a[0] + 0.587 * a[1] + 0.114 * a[2], i, m;
    /* 封面取色可能极暗，提亮到能发光的程度，避免整页死黑 */
    if (l < 118){
      m = (118 - l) / 118 * 0.8;
      for (i = 0; i < 3; i++) a[i] = Math.round(a[i] + (255 - a[i]) * m);
    }
    document.documentElement.style.setProperty('--accent-rgb', a[0] + ' ' + a[1] + ' ' + a[2]);
  }

  /* 程序化颗粒：一次生成 128×128 噪点，转成 data URL，运行时不发任何外部请求 */
  function makeGrain(){
    try{
      var c = document.createElement('canvas'); c.width = c.height = 128;
      var g = c.getContext('2d'), im = g.createImageData(128, 128), d = im.data, i, v;
      for (i = 0; i < d.length; i += 4){
        v = 190 + ((Math.random() * 65) | 0);
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = (Math.random() * 200) | 0;
      }
      g.putImageData(im, 0, 0);
      document.documentElement.style.setProperty('--grain', 'url(' + c.toDataURL('image/png') + ')');
    }catch(e){}
  }
  makeGrain();

  function lyricIdx(t){
    var lo = 0, hi = S.lines.length - 1, best = -1, mid;
    while (lo <= hi){
      mid = (lo + hi) >> 1;
      if (S.lines[mid].t <= t + 0.001){ best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best;
  }

  var lnPrev = document.getElementById('lnPrev'),
      lnCur = document.getElementById('lnCur'),
      lnNext = document.getElementById('lnNext'),
      lyricsEl = document.getElementById('lyrics'),
      mTitle = document.getElementById('mTitle'),
      mArtist = document.getElementById('mArtist'),
      progBar = document.getElementById('progBar');

  var CUR = { idx: -2, spans: [], times: [], lit: -1, p: -1, t0: 0, dur: 1 };

  function artistStr(a){
    if (Array.isArray(a)){
      var o = [], i;
      for (i = 0; i < a.length; i++) if (str(a[i])) o.push(str(a[i]));
      return o.join(' / ');
    }
    return str(a);
  }

  function cw(c){
    if (c === ' ' || c === '\u00a0' || c === '\t') return 0.34;
    return c.charCodeAt(0) < 128 ? 0.55 : 1;
  }

  function setLines(i){
    CUR.idx = i;
    if (!S.lines.length){
      lyricsEl.classList.add('none');
      lnPrev.textContent = ''; lnNext.textContent = '';
      lnCur.textContent = ''; CUR.spans = []; CUR.times = [];
      if (progBar) progBar.style.transform = 'scaleX(0)';
      return;
    }
    lyricsEl.classList.remove('none');
    lnPrev.textContent = i > 0 ? S.lines[i - 1].text : '';
    lnNext.textContent = (i + 1 < S.lines.length) ? S.lines[i + 1].text : '';

    if (i < 0 || !S.lines[i]){
      lnCur.textContent = ''; CUR.spans = []; CUR.times = []; CUR.lit = -1;
      if (progBar) progBar.style.transform = 'scaleX(0)';
      return;
    }

    var L = S.lines[i], txt = L.text || '';
    var n = txt.length;
    var k = n <= 12 ? 1 : n <= 17 ? 0.92 : n <= 24 ? 0.8 : n <= 32 ? 0.68 : n <= 44 ? 0.58 : 0.5;
    lnCur.style.setProperty('--k', k);

    /* 逐字时间：YRC 优先，长度对不上 / 时间缺太多 / LRC 就按字重均分 */
    var times = [], j, c, ok = 0, useYrc = false;
    if (L.chars && L.chars.length === n){
      for (j = 0; j < n; j++) if (L.chars[j] && L.chars[j].t >= 0) ok++;
      useYrc = ok >= Math.ceil(n * 0.6);
    }
    if (useYrc){
      for (j = 0; j < n; j++){
        c = L.chars[j];
        times.push((c && c.t >= 0) ? c.t : L.t);
      }
    } else {
      var tot = 0, w = [];
      for (j = 0; j < n; j++){ w.push(cw(txt.charAt(j))); tot += w[j]; }
      var acc = 0;
      for (j = 0; j < n; j++){
        times.push(L.t + L.dur * (acc + w[j] * 0.5) / tot);
        acc += w[j];
      }
    }

    var frag = document.createDocumentFragment(), spans = [];
    for (j = 0; j < n; j++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = txt.charAt(j);
      frag.appendChild(sp);
      spans.push(sp);
    }
    lnCur.textContent = '';
    lnCur.appendChild(frag);
    lnCur.classList.remove('swap');
    if (!RM){ void lnCur.offsetWidth; lnCur.classList.add('swap'); }
    CUR.spans = spans; CUR.times = times; CUR.lit = -1; CUR.p = -1;
    CUR.t0 = L.t; CUR.dur = Math.max(0.25, L.dur);
  }

  function tickChars(t){
    var times = CUR.times, n = times.length;
    if (!n) return;
    var lo = 0, hi = n - 1, lit = 0, mid;
    if (t >= times[n - 1]) lit = n;
    else if (t < times[0]) lit = 0;
    else {
      while (lo <= hi){
        mid = (lo + hi) >> 1;
        if (times[mid] <= t){ lit = mid + 1; lo = mid + 1; }
        else hi = mid - 1;
      }
    }
    if (lit !== CUR.lit){
      var prev = CUR.lit < 0 ? 0 : CUR.lit, q;
      if (lit > prev){
        for (q = prev; q < lit; q++) CUR.spans[q].className = 'ch on';
        if (prev > 0) CUR.spans[prev - 1].className = 'ch on';
      } else {
        for (q = lit; q < prev; q++) CUR.spans[q].className = 'ch';
      }
      if (lit > 0) CUR.spans[lit - 1].className = 'ch on now';
      CUR.lit = lit;
    }
    if (progBar){
      var p = Math.min(1, Math.max(0, (t - CUR.t0) / CUR.dur));
      if (Math.abs(p - CUR.p) > 0.004){
        CUR.p = p;
        progBar.style.transform = 'scaleX(' + p.toFixed(3) + ')';
      }
    }
  }

  function render(force){
    var i = lyricIdx(S.t);
    if (force || i !== S.idx){
      S.idx = i;
      setLines(i);
      CUR.idx = i;
    }
    S.text = (i >= 0 && S.lines[i]) ? S.lines[i].text : '';
    if (i >= 0) tickChars(S.t);
  }

  /* ================= 机柜 ================= */
  var rackBody = document.getElementById('rackBody');
  var jacks = [], vuBars = [], socketA = null, socketB = null;

  function mk(tag, cls){ var d = document.createElement(tag); if (cls) d.className = cls; return d; }

  function buildRack(){
    if (!rackBody) return;
    var mods = [
      { lab: 'PATCH', tag: 'CV', patch: true },
      { lab: 'VCO', tag: '1748', knobs: [-42, 26, 96], vu: 6, zone: 0 },
      { lab: 'VCF', tag: 'LP·24', knobs: [138, -18], vu: 5, zone: 1 }
    ];
    for (var i = 0; i < mods.length; i++){
      var m = mods[i], box = mk('div', 'mod'), lr = mk('div', 'mod-lab');
      lr.innerHTML = '<span>' + m.lab + '</span><em>' + m.tag + '</em>';
      box.appendChild(lr);
      if (m.patch){
        var pg = mk('div', 'patch');
        for (var k = 0; k < 9; k++){
          var jk = mk('div', 'jack');
          if (k === 1 || k === 4) jk.className = 'jack live';
          pg.appendChild(jk); jacks.push(jk);
        }
        box.appendChild(pg);
      } else {
        var kb = mk('div', 'knobs');
        for (var n = 0; n < m.knobs.length; n++){
          var kd = mk('div', 'knob'), tick = mk('b');
          tick.style.transform = 'rotate(' + m.knobs[n] + 'deg)';
          kd.appendChild(tick); kb.appendChild(kd);
        }
        box.appendChild(kb);
        var vu = mk('div', 'vu');
        for (var v = 0; v < m.vu; v++){
          var bar = mk('i'); vu.appendChild(bar);
          vuBars.push({ el: bar, zone: m.zone, v: 0 });
        }
        box.appendChild(vu);
      }
      rackBody.appendChild(box);
    }
  }

  /* ================= 跳线 ================= */
  var cablesEl = document.getElementById('cables');
  var cables = [];
  var WIRE = [
    { a: 'jack0', b: 'socketA', sag: 46 },
    { a: 'jack2', b: 'socketB', sag: 62 },
    { a: 'rack', b: 'off', sag: 30 }
  ];

  function buildCables(){
    if (!cablesEl) return;
    var h = '', i;
    for (i = 0; i < 3; i++){
      h += '<g class="cable">' +
        '<path class="cbl cbl-shell" stroke-width="10"/>' +
        '<path class="cbl cbl-body" stroke-width="5.6"/>' +
        '<path class="cbl cbl-hi" stroke-width="1.1"/>' +
        '<path class="cbl cbl-pulse" stroke-width="1.9" stroke-dasharray="12 132"/>' +
        '</g>';
    }
    cablesEl.innerHTML = h;
    var gs = cablesEl.querySelectorAll('.cable');
    for (i = 0; i < gs.length; i++){
      var ps = gs[i].querySelectorAll('path');
      cables.push({ shell: ps[0], body: ps[1], hi: ps[2], pulse: ps[3], off: 0 });
    }
  }

  function pt(el, host, r){
    if (!el) return null;
    var b = el.getBoundingClientRect();
    if (!b || !b.width) return null;
    return { x: b.left + b.width / 2 - r.left, y: b.top + b.height / 2 - r.top };
  }

  function cableD(a, b, sag){
    var mx = a.x + (b.x - a.x) * 0.2, my = Math.max(a.y, b.y) + sag;
    var nx = a.x + (b.x - a.x) * 0.75, ny = Math.max(a.y, b.y) + sag * 0.55;
    return 'M' + a.x.toFixed(1) + ',' + a.y.toFixed(1) +
      ' C' + mx.toFixed(1) + ',' + my.toFixed(1) + ' ' + nx.toFixed(1) + ',' + ny.toFixed(1) +
      ' ' + b.x.toFixed(1) + ',' + b.y.toFixed(1);
  }

  function routeCables(){
    if (!cablesEl || !cables.length) return;
    var host = document.getElementById('altarIn');
    var rack = document.getElementById('rack');
    var svgBust = document.getElementById('bustSvg');
    var hr = host.getBoundingClientRect();
    if (!hr.width) return;
    cablesEl.setAttribute('viewBox', '0 0 ' + hr.width.toFixed(0) + ' ' + hr.height.toFixed(0));
    var a1 = jacks[0] ? pt(jacks[0], host, hr) : null;
    var a2 = jacks[2] ? pt(jacks[2], host, hr) : null;
    var s1 = socketA ? pt(socketA, host, hr) : null;
    var s2 = socketB ? pt(socketB, host, hr) : null;
    var rr = rack.getBoundingClientRect();
    var startR = { x: rr.left - hr.left + 8, y: rr.bottom - hr.top - 6 };
    var ends = [s1, s2, { x: -hr.width * 0.34, y: hr.height * 1.03 }];
    var starts = [a1, a2, startR];
    for (var i = 0; i < cables.length; i++){
      var a = starts[i], b = ends[i];
      if (!a || !b) continue;
      var d = cableD(a, b, WIRE[i].sag);
      cables[i].shell.setAttribute('d', d);
      cables[i].body.setAttribute('d', d);
      cables[i].hi.setAttribute('d', d);
      cables[i].pulse.setAttribute('d', d);
    }
    if (svgBust) svgBust.style.opacity = '1';
  }

  /* ================= 电平 ================= */
  var A = { bass: 0, mid: 0, treble: 0, level: 0, bpm: 0 };
  var sm = { bass: 0, mid: 0, treble: 0, level: 0, beat: 0 };
  var RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  function updateVisuals(now){
    var i, b, v, c;
    for (i = 0; i < vuBars.length; i++){
      b = vuBars[i];
      v = b.zone === 0 ? sm.bass * 0.9 + sm.level * 0.35 : sm.mid * 0.95;
      v = Math.min(1.15, v * (0.8 + 0.35 * Math.abs(Math.sin(now * 0.0013 + i * 0.7))));
      if (Math.abs(v - b.v) > 0.015){
        b.v = v;
        b.el.style.transform = 'scaleY(' + (0.08 + v * 0.9).toFixed(3) + ')';
      }
    }
    var sp = RM ? 0.25 : 0.55 + sm.mid * 7 + sm.level * 2.5;
    for (i = 0; i < cables.length; i++){
      c = cables[i];
      c.off = (c.off + sp) % 144;
      c.pulse.setAttribute('stroke-dashoffset', (-c.off).toFixed(1));
    }
    if (rimL) rimL.style.opacity = (0.26 + sm.bass * 0.55 + sm.beat * 0.14).toFixed(3);
    if (rimW) rimW.style.opacity = (0.30 + sm.level * 0.22).toFixed(3);
    if (socketGlow) socketGlow.style.opacity = (0.35 + sm.bass * 0.6 + sm.beat * 0.25).toFixed(3);
    if (crackGlow) crackGlow.style.opacity = (0.04 + sm.bass * 0.16 + sm.beat * 0.1).toFixed(3);
    drawScope(now);
  }

  /* 画框里的示波器 */
  var scopePath = document.getElementById('scopePath');
  function drawScope(now){
    if (!scopePath || (S.frames % 3) !== 0) return;
    var amp = 4 + sm.level * 26 + sm.bass * 20 + sm.beat * 10;
    var d = 'M0,65', i, x, y, ph = now * 0.0021;
    for (i = 1; i <= 40; i++){
      x = i * 2.5;
      y = 65 +
        amp * (Math.sin(ph + i * 0.62) * 0.52 + Math.sin(ph * 1.7 + i * 1.31) * 0.3) *
        Math.exp(-Math.pow((i - 20) / 19, 2));
      d += ' L' + x.toFixed(1) + ',' + y.toFixed(1);
    }
    scopePath.setAttribute('d', d);
  }

  var rimL = document.querySelector('.rimL');
  var rimW = document.querySelector('.rimW');
  var socketGlow = null;
  var crackGlow = document.querySelector('.crackGlow');

  /* ================= 视差 ================= */
  var px = 0, py = 0, tx = 0, ty = 0;
  function onMove(e){
    if (RM) return;
    tx = (e.clientX / innerWidth - 0.5) * -26;
    ty = (e.clientY / innerHeight - 0.5) * -14;
  }
  addEventListener('pointermove', onMove, { passive: true });

  var lastWall = 0, lastT = 0;
  var altarIn = document.getElementById('altarIn');

  function loop(now){
    var t0 = performance.now();
    if (S.playing) S.t = lastT + (now - lastWall) / 1000;
    else S.t = lastT;
    if (S.duration > 0 && S.t > S.duration) S.t = S.duration;
    render(false);

    sm.bass += (A.bass - sm.bass) * 0.14;
    sm.mid += (A.mid - sm.mid) * 0.18;
    sm.treble += (A.treble - sm.treble) * 0.2;
    sm.level += (A.level - sm.level) * 0.12;
    sm.beat *= 0.9;

    updateVisuals(now);

    if (!RM && altarIn){
      px += (tx - px) * 0.07;
      py += (ty - py) * 0.07;
      altarIn.style.transform = 'translate3d(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px,0)';
    }

    S.frames++;
    S.js = performance.now() - t0;
    requestAnimationFrame(loop);
  }

  function onMsg(ev){
    var d = ev && ev.data;
    if (!d || typeof d !== 'object' || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === 'init'){ init(p); }
    else if (d.type === 'tick'){
      if (p.time != null){ lastT = num(p.time, lastT); lastWall = performance.now(); S.t = lastT; }
      if (typeof p.playing === 'boolean') S.playing = p.playing;
    }
    else if (d.type === 'beat'){
      sm.beat = Math.max(sm.beat, Math.min(1, num(p.level, 0.7)));
      if (p.level != null) A.level = Math.max(A.level * 0.6, num(p.level, 0));
    }
    else if (d.type === 'live'){
      A.bass = num(p.bass, A.bass);
      A.mid = num(p.mid, A.mid);
      A.treble = num(p.treble, A.treble);
      A.level = num(p.level, A.level);
      A.bpm = num(p.bpm, A.bpm);
      if (typeof p.playing === 'boolean') S.playing = p.playing;
    }
  }

  addEventListener('message', onMsg);

  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: '', text: S.text, gl: false,
      rm: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
    };
  };

  buildRack();
  buildCables();
  socketGlow = document.querySelector('#socketA circle');
  if (socketGlow) socketGlow.style.opacity = '0.4';
  routeCables();
  requestAnimationFrame(function(){ routeCables(); });
  var rT = 0;
  addEventListener('resize', function(){
    clearTimeout(rT); rT = setTimeout(routeCables, 120);
  });

  lastWall = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
