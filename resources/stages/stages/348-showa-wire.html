<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>348 · 昭和線纜 / SHOWA WIRE</title>
<style>
  :root{ --ink:#0a0908; --ivory:#f2e9dd; --crimson:#d3212c; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--ink); overflow:hidden; }
  body{
    font-family:"Yu Gothic UI Light","Yu Gothic Light","Hiragino Sans","Noto Sans JP","PingFang SC","Microsoft YaHei Light","Helvetica Neue",Arial,sans-serif;
    color:var(--ivory); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #c{ position:fixed; inset:0; display:block; width:100%; height:100%; }
  .meta{
    position:fixed; left:clamp(18px,4.4vw,66px); top:clamp(16px,4.2vh,42px);
    display:flex; align-items:center; gap:14px; z-index:3;
    font-size:clamp(9px,.78vw,11px); letter-spacing:.24em; text-transform:uppercase;
    color:rgba(242,233,221,.40);
  }
  .meta b{ font-weight:400; color:rgba(242,233,221,.72); letter-spacing:.3em; }
  #mTitle, #mArtist{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw; }
  #mArtist{ max-width:26vw; }
  .meta{ text-shadow:0 1px 14px rgba(6,6,7,.95); }
  .meta .dot{ width:4px; height:4px; min-width:4px; background:var(--crimson); border-radius:50%; transition:opacity .4s; }
  body.paused .dot{ opacity:.22; }
  .life{ position:fixed; right:clamp(14px,2.2vw,32px); top:22vh; z-index:3; pointer-events:none;
         writing-mode:vertical-rl; font-size:clamp(9px,.95vw,12px); letter-spacing:.44em;
         color:rgba(242,233,221,.26); font-weight:300; }
  .lyric{
    position:fixed; left:clamp(20px,6vw,104px); bottom:clamp(74px,13vh,128px);
    width:min(58vw,680px); z-index:3; pointer-events:none;
  }
  .idx{
    display:flex; align-items:center; gap:12px; margin-bottom:clamp(13px,2.2vh,24px);
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:clamp(9px,.72vw,10.5px); letter-spacing:.32em; font-weight:500;
    color:rgba(242,233,221,.34);
  }
  .idx i{ display:block; width:clamp(16px,2.2vw,28px); height:1px; background:var(--crimson); opacity:.75; }
  .lines{ position:relative; min-height:1.5em; }
  .line{
    font-weight:200; font-size:1em; line-height:1.52; letter-spacing:.055em; color:var(--ivory);
    white-space:pre-wrap; overflow-wrap:anywhere; text-shadow:0 2px 30px rgba(0,0,0,.55);
  }
  .line .ch{
    display:inline-block; opacity:0; transform:translateY(.13em);
    transition:opacity .5s ease, transform .62s cubic-bezier(.2,.72,.24,1);
  }
  .line .ch.on{ opacity:1; transform:translateY(0); }
  .line.leaving, .lines > .leaving{
    position:absolute; left:0; top:0; width:100%; opacity:0; transform:translateY(-.3em);
    transition:opacity .34s ease, transform .5s ease;
  }
  .line.idle{ opacity:.20; }
  .empty b{ display:block; font-weight:200; font-size:.92em; letter-spacing:.2em; color:rgba(242,233,221,.36); }
  .empty small{
    display:block; margin-top:1em; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px; letter-spacing:.3em; color:rgba(242,233,221,.36);
  }
  .pbar{ position:fixed; left:0; right:0; bottom:0; height:2px; background:rgba(242,233,221,.085); z-index:4; }
  .pbar i{
    display:block; height:100%; width:100%; transform:scaleX(0); transform-origin:0 50%;
    background:linear-gradient(90deg, rgba(211,33,44,.45), var(--crimson));
    transition:opacity .4s;
  }
  body.paused .pbar i{ opacity:.55; }
  @media (max-aspect-ratio:1/1){
    .lyric{ left:clamp(18px,7vw,62px); width:86vw; bottom:clamp(70px,12vh,112px); }
    .meta{ letter-spacing:.16em; gap:10px; }
    .idx{ margin-bottom:14px; }
    .life{ display:none; }
  }
  @media (max-width:820px){
    .life{ display:none; }
    .meta{ max-width:72vw; }
    .meta b{ letter-spacing:.16em; }
    #mTitle{ max-width:48vw; }
    #mArtist{ max-width:26vw; }
  }
  @media (prefers-reduced-motion:reduce){
    .line .ch{ transition-duration:.01s; }
    .line.leaving, .lines > .leaving{ transition-duration:.01s; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="meta"><span class="dot"></span><b id="mTitle">SHOWA WIRE</b><span id="mArtist">—</span></div>
<div class="life">緋の制服・電子の耳</div>
<div class="lyric">
  <div class="idx"><span id="lyrNo">00</span><i></i><span id="lyrTot">00</span></div>
  <div class="lines" id="lyrLines"></div>
</div>
<div class="pbar"><i id="pFill"></i></div>

<script>
(function(){
  'use strict';
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d', { alpha: false });
  var lyrLines = document.getElementById('lyrLines');
  var lyrNo = document.getElementById('lyrNo');
  var lyrTot = document.getElementById('lyrTot');
  var pFill = document.getElementById('pFill');
  var mTitle = document.getElementById('mTitle');
  var mArtist = document.getElementById('mArtist');

  var W = 1440, H = 900, DPR = 1;
  var lines = [], idx = -1, curIdx = -2, t = 0, playing = true, dur = 0;
  var frames = 0, jsMs = 0, readySent = false, started = false, lastSongId = null;
  var lastPr = -1;
  var curEl = null, spans = [], charTimes = [];
  var accent = [211, 33, 44];
  var beatLevel = 0, beatIndex = -1;
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, playing: true };
  var rm = false;
  try { rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e){}

  function num(v, d){ v = +v; return isFinite(v) ? v : d; }
  function clamp(v, a, b){ v = num(v, a); return v < a ? a : (v > b ? b : v); }

  // ------------------------------------------------------------
  // 版 / palette
  // ------------------------------------------------------------
  var TAU = Math.PI * 2;
  var scene = null, pal = null;
  var bgDirty = true, uniPat = null, noiseTile = null;
  var bgC = document.createElement('canvas'), bgX = bgC.getContext('2d');
  var vigC = document.createElement('canvas'), vigX = vigC.getContext('2d');
  var en = { beat: 0, bass: 0, mid: 0, treble: 0, level: 0 };
  var lastNow = 0, dt = 0.016, age = 0;
  var assetPaper = null, assetGrain = null;

  function mixc(a, b, k){
    k = clamp(k, 0, 1);
    return [ Math.round(clamp(a[0] + (b[0] - a[0]) * k, 0, 255)),
             Math.round(clamp(a[1] + (b[1] - a[1]) * k, 0, 255)),
             Math.round(clamp(a[2] + (b[2] - a[2]) * k, 0, 255)) ];
  }
  function rgba(c, a){
    var al = (a == null) ? 1 : clamp(a, 0, 1);
    return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' +
           Math.round(clamp(c[2], 0, 255)) + ',' + al + ')';
  }
  function mkLin(g, x0, y0, x1, y1, stops){
    try {
      var gr = g.createLinearGradient(x0, y0, x1, y1);
      for (var i = 0; i < stops.length; i++) gr.addColorStop(clamp(stops[i][0], 0, 1), stops[i][1]);
      return gr;
    } catch (e) { return stops[0][1]; }
  }
  function mkRad(g, x0, y0, r0, x1, y1, r1, stops){
    try {
      var gr = g.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(0.5, r1));
      for (var i = 0; i < stops.length; i++) gr.addColorStop(clamp(stops[i][0], 0, 1), stops[i][1]);
      return gr;
    } catch (e) { return stops[0][1]; }
  }

  function recolor(){
    var a = accent;
    pal = {
      hot:   mixc([236, 58, 44], a, 0.20),
      red:   mixc([182, 26, 34], a, 0.16),
      deep:  mixc([58, 6, 11], [0, 0, 0], 0.22),
      ink:   [10, 9, 8],
      ivory: [242, 233, 221],
      cold:  [166, 190, 194],
      silk:  mixc([211, 33, 44], a, 0.24),
      rubber:[26, 25, 27],
      steel: [118, 138, 142]
    };
    pal.mid = mixc(pal.red, pal.deep, 0.42);
    pal.suit = mixc(pal.red, pal.deep, 0.62);
    try {
      document.documentElement.style.setProperty('--crimson', rgba(pal.silk, 1));
    } catch (e) {}
    bgDirty = true;
  }

  function loadImg(src, ok){
    var im = new Image();
    im.onload = function(){ ok(im); };
    im.onerror = function(){ ok(null); };
    try { im.src = src; } catch (e) { ok(null); }
  }

  function buildNoiseTile(){
    var n = document.createElement('canvas');
    n.width = n.height = 128;
    var x = n.getContext('2d');
    var d = x.createImageData(128, 128), q = d.data;
    for (var i = 0; i < q.length; i += 4) {
      var v = 96 + Math.random() * 118;
      q[i] = q[i + 1] = q[i + 2] = v;
      q[i + 3] = 255;
    }
    x.putImageData(d, 0, 0);
    noiseTile = n;
  }

  // ------------------------------------------------------------
  // 构 / layout
  // ------------------------------------------------------------
  function layout(){
    var land = (W / H) > 1.12;
    if (land) {
      scene = {
        land: true,
        sun:   { x: W * 0.645, y: H * 0.435, r: Math.min(H * 0.335, W * 0.295) },
        panel: { x: W * 0.902, y: H * 0.145, w: Math.max(28, W * 0.052), h: H * 0.635 },
        coil:  { x: W * 0.312, y: H * 0.300, r: Math.min(H * 0.060, 58) },
        table: { x: W * 0.812, y: H * 0.862, r: Math.min(H * 0.165, 176) },
        motes: 46
      };
    } else {
      scene = {
        land: false,
        sun:   { x: W * 0.520, y: H * 0.300, r: Math.min(W * 0.470, H * 0.290) },
        panel: { x: W * 0.858, y: H * 0.090, w: Math.max(24, W * 0.105), h: H * 0.340 },
        coil:  { x: W * 0.300, y: H * 0.272, r: Math.min(W * 0.110, 48) },
        table: { x: W * 0.760, y: H * 0.640, r: Math.min(W * 0.300, 148) },
        motes: 26
      };
    }
    buildUniPattern();
    buildBg();
    buildVig();
    buildCables();
  }

  function buildBg(){
    bgC.width = Math.max(1, Math.round(W));
    bgC.height = Math.max(1, Math.round(H));
    var x = bgX;
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = 1;
    x.fillStyle = rgba(pal.ink, 1);
    x.fillRect(0, 0, W, H);

    // 冷光地台 / cold stage floor
    var fl = mkRad(x, W * 0.56, H * 1.06, 0, W * 0.56, H * 1.06, Math.max(W * 0.62, H * 0.78), [
      [0, 'rgba(158,186,192,0.20)'], [0.40, 'rgba(96,120,126,0.09)'], [1, 'rgba(0,0,0,0)']]);
    x.fillStyle = fl;
    x.fillRect(0, 0, W, H);

    // 纸 / pulp
    if (assetPaper) {
      try {
        var pp = x.createPattern(assetPaper, 'repeat');
        if (pp) {
          x.save();
          x.globalCompositeOperation = 'overlay';
          x.globalAlpha = 0.42;
          x.fillStyle = pp;
          x.fillRect(0, 0, W, H);
          x.restore();
        }
      } catch (e) {}
    }
    if (noiseTile) {
      try {
        var np = x.createPattern(noiseTile, 'repeat');
        if (np) {
          x.save();
          x.globalCompositeOperation = 'overlay';
          x.globalAlpha = assetPaper ? 0.10 : 0.20;
          x.fillStyle = np;
          x.fillRect(0, 0, W, H);
          x.restore();
        }
      } catch (e) {}
    }
    if (assetGrain) {
      try {
        var gp = x.createPattern(assetGrain, 'repeat');
        if (gp) {
          x.save();
          x.globalCompositeOperation = 'overlay';
          x.globalAlpha = 0.16;
          x.fillStyle = gp;
          x.fillRect(0, 0, W, H);
          x.restore();
        }
      } catch (e) {}
    }

    // 留白 / legibility grade
    var lg = mkLin(x, 0, H, W * 0.66, H * 0.30, [
      [0, 'rgba(7,7,8,0.72)'], [0.55, 'rgba(7,7,8,0.30)'], [1, 'rgba(7,7,8,0)']]);
    x.fillStyle = lg;
    x.fillRect(0, 0, W, H);
    bgDirty = false;
  }

  function buildVig(){
    vigC.width = Math.max(1, Math.round(W));
    vigC.height = Math.max(1, Math.round(H));
    var x = vigX;
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, W, H);
    var g = mkRad(x, W * 0.52, H * 0.44, Math.min(W, H) * 0.16, W * 0.52, H * 0.44,
                  Math.max(W, H) * 0.76, [
      [0, 'rgba(0,0,0,0)'], [0.58, 'rgba(0,0,0,0.16)'], [1, 'rgba(0,0,0,0.78)']]);
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
    var b = mkLin(x, 0, H, 0, H * 0.62, [
      [0, 'rgba(6,6,7,0.62)'], [1, 'rgba(6,6,7,0)']]);
    x.fillStyle = b;
    x.fillRect(0, 0, W, H);
  }

  function buildUniPattern(){
    var S = 64;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var x = c.getContext('2d');
    if (!x) return;
    // 制服剪影：圆头 + 立领 + 直筒肩线，一排一排，整齐划一
    x.fillStyle = 'rgba(38, 3, 7, 0.42)';
    x.beginPath();
    x.arc(32, 13, 4.4, 0, TAU);
    x.fill();
    x.beginPath();
    x.moveTo(26.6, 19.6);
    x.lineTo(37.4, 19.6);
    x.lineTo(39.2, 34);
    x.lineTo(37.0, 52);
    x.lineTo(27.0, 52);
    x.lineTo(24.8, 34);
    x.closePath();
    x.fill();
    // 领口
    x.strokeStyle = 'rgba(255, 226, 206, 0.16)';
    x.lineWidth = 0.9;
    x.beginPath();
    x.moveTo(29.2, 20.2);
    x.lineTo(32, 25.4);
    x.lineTo(34.8, 20.2);
    x.stroke();
    // 袖线
    x.strokeStyle = 'rgba(20, 1, 4, 0.30)';
    x.beginPath();
    x.moveTo(27.4, 21.5);
    x.lineTo(26.2, 47);
    x.moveTo(36.6, 21.5);
    x.lineTo(37.8, 47);
    x.stroke();
    try { uniPat = ctx.createPattern(c, 'repeat'); } catch (e) { uniPat = null; }
  }

  function fit(){
    var w = cvs.clientWidth || 0, h = cvs.clientHeight || 0;
    W = Math.round(w > 0 ? w : 1440);
    H = Math.round(h > 0 ? h : 900);
    if (!isFinite(W) || W <= 0) W = 1440;
    if (!isFinite(H) || H <= 0) H = 900;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!pal) recolor();
    layout();
    curIdx = -999;
    paintLyric();
  }

  // ------------------------------------------------------------
  // 缆 / patch bay + cable harness
  // ------------------------------------------------------------
  var cables = [], jacks = [], motes = [];

  function makeCable(ax, ay, bx, by, c1x, c1y, c2x, c2y, kind, w, seed){
    var n = 20;
    return {
      ax: ax, ay: ay, bx: bx, by: by,
      c1x: c1x, c1y: c1y, c2x: c2x, c2y: c2y,
      kind: kind, w: w, seed: seed, n: n,
      buf: new Float32Array((n + 1) * 2),
      amp: 2.2 + (seed % 5) * 1.1,
      spd: 0.34 + (seed % 7) * 0.06,
      plug: true
    };
  }

  function buildCables(){
    cables = []; jacks = []; motes = [];
    var p = scene.panel;
    var rows = scene.land ? 8 : 5;
    var jr = Math.max(3.2, Math.min(p.w * 0.135, 8.5));
    var top = p.y + p.h * 0.10, bot = p.y + p.h * 0.90;
    var c, r;
    for (c = 0; c < 2; c++) {
      for (r = 0; r < rows; r++) {
        jacks.push({
          x: p.x + p.w * (c === 0 ? 0.32 : 0.70),
          y: top + (bot - top) * (rows === 1 ? 0.5 : (r / (rows - 1))),
          r: jr, lit: 0, seed: c * 7.3 + r * 3.1
        });
      }
    }

    var coil = scene.coil;
    var s0 = 348017;
    function rnd(){ s0 = (s0 * 1664525 + 1013904223) >>> 0; return s0 / 4294967296; }
    var kinds = ['silk', 'rubber', 'silk', 'steel', 'rubber', 'silk', 'ivory'];
    var widths = { silk: 2.7, rubber: 3.5, steel: 1.9, ivory: 1.5 };

    // A · 主线束：从配线盘绕到耳侧的线圈
    for (var i = 0; i < 7; i++) {
      var j = jacks[(i * 2) % jacks.length];
      var ang = -1.25 + i * 0.30;
      var ex = coil.x + Math.cos(ang) * coil.r * (0.86 + rnd() * 0.22);
      var ey = coil.y + Math.sin(ang) * coil.r * (0.62 + rnd() * 0.20);
      var above = (i % 3 !== 1);
      var kind = kinds[i % kinds.length];
      cables.push(makeCable(
        j.x - jr * 0.5, j.y, ex, ey,
        j.x - W * (0.10 + rnd() * 0.10), above ? j.y - H * (0.10 + rnd() * 0.16) : j.y + H * (0.06 + rnd() * 0.10),
        coil.x + W * (0.10 + rnd() * 0.16), coil.y + (above ? H * (0.04 + rnd() * 0.10) : H * (0.14 + rnd() * 0.10)),
        kind, widths[kind], i * 1.7
      ));
    }

    // B · 甩到画面左上的自由端
    for (var b = 0; b < 3; b++) {
      var jb = jacks[(3 + b * 3) % jacks.length];
      var tx = W * (0.12 + rnd() * 0.16);
      var ty = H * (0.16 + rnd() * 0.22);
      var kindB = b === 0 ? 'rubber' : (b === 1 ? 'steel' : 'silk');
      cables.push(makeCable(
        jb.x - jr * 0.5, jb.y, tx, ty,
        jb.x - W * (0.16 + rnd() * 0.10), jb.y + H * (0.02 + rnd() * 0.08),
        tx + W * (0.12 + rnd() * 0.10), ty - H * (0.10 + rnd() * 0.10),
        kindB, widths[kindB], 20 + b * 2.3
      ));
    }

    // C · 从画外垂下来的散缆
    for (var d = 0; d < 3; d++) {
      var hx = W * (0.20 + d * 0.17 + rnd() * 0.05);
      var hy = H * (0.20 + rnd() * 0.18);
      cables.push(makeCable(
        hx, -H * 0.08, hx + W * (0.03 + rnd() * 0.06), hy,
        hx - W * 0.05, H * 0.02,
        hx + W * 0.10, hy - H * 0.12,
        d === 1 ? 'steel' : 'rubber', d === 1 ? 1.9 : 2.9, 40 + d * 1.9
      ));
    }

    // D · 盘面上的短跳线
    for (var e = 0; e < 2; e++) {
      var ja = jacks[e * 4 + 1], jbb = jacks[e * 4 + 6];
      if (!ja || !jbb) continue;
      cables.push(makeCable(
        ja.x - jr * 0.5, ja.y, jbb.x - jr * 0.5, jbb.y,
        ja.x - W * 0.055, ja.y - H * 0.03,
        jbb.x - W * 0.075, jbb.y + H * 0.05,
        e ? 'silk' : 'ivory', e ? 2.4 : 1.5, 60 + e
      ));
    }

    // E · 干线：从盘底甩出画面右下
    if (jacks.length) {
      var jl = jacks[jacks.length - 1];
      cables.push(makeCable(
        jl.x - jr * 0.5, jl.y, W * 1.04, H * 1.06,
        jl.x + W * 0.02, jl.y + H * 0.18,
        W * 0.98, H * 0.72,
        'rubber', 5.2, 77
      ));
    }

    // 光尘
    var count = scene.motes;
    for (var m = 0; m < count; m++) {
      motes.push({
        x: rnd() * W, y: rnd() * H,
        vx: (rnd() - 0.5) * 5, vy: -(4 + rnd() * 14),
        r: 0.5 + rnd() * 1.5, a: 0.12 + rnd() * 0.35, ph: rnd() * TAU
      });
    }
  }

  function sampleCable(cb, c1y, c2y, bx, by){
    var buf = cb.buf, n = cb.n, k = 0, i, u, iu, w0, w1, w2, w3;
    for (i = 0; i <= n; i++) {
      u = i / n; iu = 1 - u;
      w0 = iu * iu * iu; w1 = 3 * iu * iu * u; w2 = 3 * iu * u * u; w3 = u * u * u;
      buf[k++] = cb.ax * w0 + cb.c1x * w1 + cb.c2x * w2 + bx * w3;
      buf[k++] = cb.ay * w0 + c1y * w1 + c2y * w2 + by * w3;
    }
  }

  function updateCables(){
    var i, cb, sw, bob, c1y, c2y, bx, by;
    for (i = 0; i < cables.length; i++) {
      cb = cables[i];
      sw = rm ? 0 : Math.sin(age * cb.spd + cb.seed) * cb.amp * (1 + en.bass * 1.5);
      bob = rm ? 0 : Math.cos(age * cb.spd * 0.8 + cb.seed * 0.7) * cb.amp * 0.5 * (1 + en.bass);
      c1y = cb.c1y + sw * 0.9;
      c2y = cb.c2y - sw * 0.7;
      bx = cb.bx + sw * 0.35;
      by = cb.by + bob;
      sampleCable(cb, c1y, c2y, bx, by);
    }
  }

  function tracePath(cb){
    var buf = cb.buf, n = cb.n, i;
    ctx.beginPath();
    ctx.moveTo(buf[0], buf[1]);
    for (i = 1; i <= n; i++) ctx.lineTo(buf[i * 2], buf[i * 2 + 1]);
  }

  function cableColor(kind){
    if (kind === 'silk') return rgba(pal.silk, 0.96);
    if (kind === 'rubber') return 'rgba(24,23,25,0.98)';
    if (kind === 'steel') return rgba(pal.steel, 0.82);
    return rgba(pal.ivory, 0.52);
  }
  function cableHi(kind){
    if (kind === 'silk') return 'rgba(255,208,196,0.22)';
    if (kind === 'rubber') return 'rgba(186,214,220,0.30)';
    if (kind === 'steel') return 'rgba(226,240,244,0.34)';
    return 'rgba(255,248,236,0.26)';
  }

  function drawPanel(){
    var p = scene.panel, i, j;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = mkLin(ctx, p.x, p.y, p.x + p.w, p.y + p.h, [
      [0, '#1d2224'], [0.45, '#101416'], [1, '#171c1e']]);
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = 'rgba(214,232,236,0.13)';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeRect(p.x + 1.5, p.y + 1.5, p.w - 3, p.h - 3);

    // 盘面刻度
    ctx.strokeStyle = 'rgba(200,220,224,0.07)';
    for (i = 0; i < 6; i++) {
      var yy = p.y + p.h * (0.08 + i * 0.165);
      ctx.beginPath();
      ctx.moveTo(p.x + 3, yy);
      ctx.lineTo(p.x + p.w - 3, yy);
      ctx.stroke();
    }
    // 螺钉
    for (i = 0; i < 4; i++) {
      var sx = p.x + (i % 2 ? p.w - 7 : 7);
      var sy = p.y + (i < 2 ? 7 : p.h - 7);
      ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, TAU);
      ctx.fillStyle = 'rgba(196,212,216,0.35)'; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(sx - 1.3, sy); ctx.lineTo(sx + 1.3, sy); ctx.stroke();
    }
    // 插座
    for (j = 0; j < jacks.length; j++) {
      var jk = jacks[j];
      var gl = 0.20 + jk.lit * 0.8;
      ctx.beginPath(); ctx.arc(jk.x, jk.y, jk.r, 0, TAU);
      ctx.fillStyle = 'rgba(6,8,9,0.9)'; ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = 'rgba(196,214,218,' + (0.28 + jk.lit * 0.5) + ')';
      ctx.stroke();
      ctx.beginPath(); ctx.arc(jk.x, jk.y, jk.r * 0.42, 0, TAU);
      ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fill();
      // LED
      if (jk.lit > 0.02) {
        ctx.beginPath();
        ctx.arc(jk.x - jk.r * 1.55, jk.y, 1.5, 0, TAU);
        ctx.fillStyle = rgba(pal.silk, gl);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawCables(){
    var i, cb, p;
    drawPanel();
    updateCables();

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 影
    ctx.translate(2.5, 3.5);
    ctx.strokeStyle = 'rgba(0,0,0,0.46)';
    for (i = 0; i < cables.length; i++) {
      cb = cables[i];
      ctx.lineWidth = cb.w + 3.2;
      tracePath(cb);
      ctx.stroke();
    }
    ctx.restore();

    // 本体
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (i = 0; i < cables.length; i++) {
      cb = cables[i];
      ctx.lineWidth = cb.w;
      ctx.strokeStyle = cableColor(cb.kind);
      tracePath(cb);
      ctx.stroke();
      ctx.lineWidth = Math.max(0.8, cb.w * 0.34);
      ctx.strokeStyle = cableHi(cb.kind);
      ctx.save();
      ctx.translate(-0.6, -0.8);
      tracePath(cb);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // 节点脉冲
    for (i = 0; i < cables.length; i++) {
      cb = cables[i];
      var u = ((age * 0.26 + cb.seed * 0.137) % 1.15);
      if (u > 1) continue;
      var ui = Math.min(cb.n, Math.max(0, Math.round(u * cb.n)));
      var px = cb.buf[ui * 2], py = cb.buf[ui * 2 + 1];
      var glow = 0.25 + en.beat * 0.9;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgba(pal.silk, 0.55 * glow);
      ctx.beginPath(); ctx.arc(px, py, cb.w * 1.5 + 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,238,226,' + (0.55 * glow) + ')';
      ctx.beginPath(); ctx.arc(px, py, Math.max(0.9, cb.w * 0.55), 0, TAU); ctx.fill();
      ctx.restore();
    }

    // 接头
    for (i = 0; i < cables.length; i++) {
      cb = cables[i];
      var li = cb.n;
      var ex = cb.buf[li * 2], ey = cb.buf[li * 2 + 1];
      var px2 = cb.buf[(li - 1) * 2], py2 = cb.buf[(li - 1) * 2 + 1];
      drawPlug(ex, ey, Math.atan2(ey - py2, ex - px2), cb.w, cb.kind);
    }

    // 插座灯
    var glow2 = en.beat;
    for (i = 0; i < jacks.length; i++) {
      jacks[i].lit = Math.max(0, glow2 * (0.25 + 0.75 * Math.abs(Math.sin(age * 1.4 + jacks[i].seed))));
    }
  }

  function drawPlug(x, y, ang, w, kind){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    var L = w * 2.6, Hh = Math.max(2.2, w * 0.62);
    // 尾套
    ctx.fillStyle = kind === 'silk' ? rgba(pal.silk, 0.95) : 'rgba(30,29,31,0.98)';
    ctx.beginPath();
    approxRect(ctx, -L, -Hh * 1.02, L * 0.72, Hh * 2.04, Hh * 0.5);
    ctx.fill();
    // 金属筒
    ctx.fillStyle = mkLin(ctx, -L * 0.3, -Hh, L * 0.5, Hh, [
      [0, 'rgba(206,222,226,0.85)'], [0.45, 'rgba(96,112,116,0.9)'], [1, 'rgba(186,204,208,0.7)']]);
    ctx.beginPath();
    approxRect(ctx, -L * 0.30, -Hh * 0.86, L * 0.55, Hh * 1.72, Hh * 0.4);
    ctx.fill();
    // 尖端
    ctx.fillStyle = 'rgba(226,238,240,0.9)';
    ctx.beginPath();
    ctx.moveTo(L * 0.25, -Hh * 0.34);
    ctx.lineTo(L * 0.52, -Hh * 0.34);
    ctx.lineTo(L * 0.52, Hh * 0.34);
    ctx.lineTo(L * 0.25, Hh * 0.34);
    ctx.closePath();
    ctx.fill();
    // 红环
    ctx.strokeStyle = rgba(pal.silk, 0.9);
    ctx.lineWidth = Math.max(0.8, w * 0.3);
    ctx.beginPath();
    ctx.moveTo(-L * 0.30, -Hh * 0.86);
    ctx.lineTo(-L * 0.30, Hh * 0.86);
    ctx.stroke();
    ctx.restore();
  }

  function drawCoil(){
    var k = scene.coil, i;
    var rot = rm ? 0 : Math.sin(age * 0.5) * 0.03;
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(rot);
    for (i = 3; i >= 0; i--) {
      var rr = k.r * (0.66 + i * 0.17);
      ctx.lineWidth = 5.6 - i * 0.8;
      ctx.strokeStyle = rgba(pal.silk, 0.30 + i * 0.16);
      ctx.beginPath();
      ctx.ellipse(0, 0, rr, rr * 0.70, -0.16 + i * 0.022, 0, TAU);
      ctx.stroke();
      ctx.lineWidth = Math.max(0.7, ctx.lineWidth * 0.28);
      ctx.strokeStyle = 'rgba(255,206,192,0.16)';
      ctx.beginPath();
      ctx.ellipse(-0.8, -1.2, rr, rr * 0.70, -0.16 + i * 0.022, Math.PI * 1.05, Math.PI * 1.62);
      ctx.stroke();
    }
    // 便签吊牌
    ctx.save();
    ctx.translate(k.r * 0.55, k.r * 0.95);
    ctx.rotate(0.22 + (rm ? 0 : Math.sin(age * 0.9) * 0.02 + en.beat * 0.05));
    ctx.fillStyle = 'rgba(238,230,214,0.88)';
    ctx.beginPath();
    approxRect(ctx, -34, -10, 68, 20, 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    approxRect(ctx, -34, -10, 68, 20, 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(30,26,24,0.9)';
    ctx.font = '600 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('MONITOR 348', 0, 0.5);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
    ctx.restore();
  }

  // ------------------------------------------------------------
  // 灯 / cold spotlights + dust
  // ------------------------------------------------------------
  function drawBeams(){
    var spots = scene.land
      ? [[0.18, -0.06, 0.16, 0.20], [0.66, -0.10, 0.20, 0.14]]
      : [[0.26, -0.08, 0.22, 0.18]];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < spots.length; i++) {
      var s = spots[i];
      var ox = W * s[0] + (rm ? 0 : Math.sin(age * 0.21 + i * 2) * W * 0.012);
      var oy = H * s[1];
      var spread = W * s[2];
      var len = H * 1.45;
      var alpha = 0.055 + en.mid * 0.05 + en.beat * 0.03;
      var g = mkLin(ctx, ox, oy, ox, oy + len, [
        [0, 'rgba(212,232,236,' + (alpha * 1.25) + ')'],
        [0.42, 'rgba(190,216,222,' + (alpha * 0.7) + ')'],
        [1, 'rgba(176,204,212,0)']]);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(ox - W * 0.006, oy);
      ctx.lineTo(ox + W * 0.006, oy);
      ctx.lineTo(ox + spread, oy + len);
      ctx.lineTo(ox - spread * 0.72, oy + len);
      ctx.closePath();
      ctx.fill();
      // 灯嘴
      ctx.fillStyle = 'rgba(226,240,244,' + (0.10 + en.beat * 0.12) + ')';
      ctx.beginPath();
      ctx.ellipse(ox, oy + H * 0.005, W * 0.010, H * 0.005, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 光尘
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var m = 0; m < motes.length; m++) {
      var p = motes[m];
      if (!rm) {
        p.x += p.vx * dt + Math.sin(age * 0.6 + p.ph) * 0.15;
        p.y += p.vy * dt;
        if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
        if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      }
      ctx.fillStyle = 'rgba(222,236,238,' + (p.a * (0.35 + en.treble * 0.5)) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch(e){}
  }

  function lineAt(time){
    var lo = 0, hi = lines.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (num(lines[mid].t, 0) <= time + 0.001) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  function pad2(n){ n = Math.max(0, Math.round(n)); return (n < 10 ? '0' : '') + n; }

  function timesFor(ln, i){
    var txt = (ln && ln.text != null) ? String(ln.text) : '';
    var chs = Array.from(txt);
    var times = [];
    var cs = (ln && Array.isArray(ln.chars)) ? ln.chars : null;
    var yrc = !!(cs && cs.length > 0 && cs.length === chs.length);
    var t0 = num(ln && ln.t, 0);
    var nextT = (i + 1 < lines.length) ? num(lines[i + 1].t, 0) : 0;
    var dd = num(ln && ln.dur, 0);
    if (!(dd > 0) && nextT > t0) dd = nextT - t0;
    if (!(dd > 0) || dd > 14) dd = Math.max(1.6, chs.length * 0.24);
    var span = Math.min(dd * 0.86, Math.max(0.72, chs.length * 0.155));
    for (var k = 0; k < chs.length; k++) {
      times.push(yrc ? num(cs[k] && cs[k].t, t0) : t0 + span * (chs.length <= 1 ? 0 : k / (chs.length - 1)));
    }
    for (var m = 1; m < times.length; m++) {
      if (times[m] < times[m - 1]) times[m] = times[m - 1];
    }
    return { chs: chs, times: times };
  }

  function fadeOut(el){
    el.classList.add('leaving');
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 760);
  }

  function fitLine(el, size0){
    var maxH = H * ((scene && scene.land) ? 0.295 : 0.265);
    var size = Math.max(17, num(size0, 32));
    el.style.fontSize = size + 'px';
    for (var it = 0; it < 9; it++) {
      var h = el.getBoundingClientRect().height;
      if (h <= maxH || size <= 17.5) break;
      size = Math.max(17, size * 0.88);
      el.style.fontSize = size + 'px';
    }
    lyrLines.style.minHeight = Math.round(size * 1.55) + 'px';
    el._size = size;
  }

  function paintLyric(){
    if (idx === curIdx) return;
    curIdx = idx;
    if (curEl) { fadeOut(curEl); curEl = null; }
    spans = []; charTimes = [];

    var total = lines.length;
    var base = Math.min(W * ((scene && scene.land) ? 0.045 : 0.078), H * 0.085, 72);
    lyrTot.textContent = total ? pad2(total) : '00';
    lyrNo.textContent = idx >= 0 ? pad2(idx + 1) : '00';

    if (!total) {
      var emp = document.createElement('div');
      emp.className = 'empty';
      emp.style.fontSize = Math.round(Math.max(26, base * 0.92)) + 'px';
      emp.innerHTML = '<b>—</b><small>NO LYRICS · 純器楽</small>';
      lyrLines.appendChild(emp);
      curEl = emp;
      lyrLines.style.minHeight = Math.round(Math.max(26, base * 0.92) * 1.7) + 'px';
      return;
    }

    var ln = lines[idx];
    var el = document.createElement('div');

    if (!ln || ln.text == null || String(ln.text) === '') {
      el.className = 'line idle';
      el.textContent = '—';
      lyrLines.appendChild(el);
      curEl = el;
      fitLine(el, base * 0.7);
      return;
    }

    el.className = 'line';
    var d = timesFor(ln, idx);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < d.chs.length; i++) {
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = (d.chs[i] === ' ') ? '\u00A0' : d.chs[i];
      sp._on = false;
      frag.appendChild(sp);
      spans.push(sp);
      charTimes.push(d.times[i]);
    }
    el.appendChild(frag);
    lyrLines.appendChild(el);
    curEl = el;
    fitLine(el, base);
    syncChars();
  }

  function syncChars(){
    for (var i = 0; i < spans.length; i++) {
      var want = t >= charTimes[i] - 0.035;
      if (want !== spans[i]._on) {
        spans[i]._on = want;
        if (want) spans[i].classList.add('on');
        else spans[i].classList.remove('on');
      }
    }
  }

  function onInit(p){
    p = p || {};
    var song = p.song || {};
    var sid = (song.id != null) ? String(song.id) : null;
    if (sid !== null && sid !== lastSongId) { lastSongId = sid; t = 0; }
    if (Array.isArray(p.accent) && p.accent.length >= 3) {
      accent = [ clamp(Math.round(num(p.accent[0], 211)), 0, 255),
                 clamp(Math.round(num(p.accent[1], 33)), 0, 255),
                 clamp(Math.round(num(p.accent[2], 44)), 0, 255) ];
    }
    lines = Array.isArray(p.lines) ? p.lines.filter(function(l){ return l && typeof l === 'object'; }) : [];
    dur = Math.max(0, num(p.duration, 0));
    mTitle.textContent = (song.name ? String(song.name) : 'SHOWA WIRE').slice(0, 48);
    var ar = song.artists;
    mArtist.textContent = (Array.isArray(ar) ? ar.join(' / ') : (ar ? String(ar) : '—')).slice(0, 60);
    if (typeof p.playing === 'boolean') playing = p.playing; else playing = true;
    document.body.classList.toggle('paused', !playing);
    recolor();
    curIdx = -999;
    lastPr = -1;
    if (!(dur > 0)) { pFill.style.transform = 'scaleX(0)'; lastPr = 0; }
    idx = lineAt(t); paintLyric();
  }

  function onTick(p){
    p = p || {};
    var nt = num(p.time, t);
    t = nt < 0 ? 0 : nt;
    if (typeof p.playing === 'boolean' && p.playing !== playing) {
      playing = p.playing;
      document.body.classList.toggle('paused', !playing);
    }
    var ni = lineAt(t);
    if (ni !== idx) { idx = ni; paintLyric(); }
    syncChars();
  }

  function onBeat(p){
    p = p || {};
    beatIndex = Math.round(num(p.index, beatIndex));
    beatLevel = clamp(num(p.level, 0), 0, 1);
    en.beat = Math.max(en.beat, 0.28 + beatLevel * 0.72);
  }
  function onLive(p){ p = p || {}; live.bpm = num(p.bpm, live.bpm); live.level = clamp(num(p.level, 0), 0, 1); live.bass = clamp(num(p.bass, 0), 0, 1); live.mid = clamp(num(p.mid, 0), 0, 1); live.treble = clamp(num(p.treble, 0), 0, 1); if (typeof p.playing === 'boolean') live.playing = p.playing; }

  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.__c100 !== 1) return;
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') onBeat(d.payload);
    else if (d.type === 'live') onLive(d.payload);
  });

  function smooth(dv){
    var k = 1 - Math.pow(rm ? 0.05 : 0.008, dv);
    en.bass   += (live.bass   - en.bass)   * k;
    en.mid    += (live.mid    - en.mid)    * k;
    en.treble += (live.treble - en.treble) * k;
    en.level  += (live.level  - en.level)  * k;
    en.beat = Math.max(0, en.beat * Math.exp(-dv * (rm ? 11 : 7.5)));
  }

  // ------------------------------------------------------------
  // 日 / the crimson sun
  // ------------------------------------------------------------
  var uniM = null;
  function drawSun(){
    var s = scene.sun, x = s.x, y = s.y;
    var pulse = en.beat * 0.022 + en.bass * 0.016;
    var r = s.r * (1 + (rm ? pulse * 0.4 : pulse));

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = mkRad(ctx, x, y, r * 0.62, x, y, r * 2.0, [
      [0, rgba(pal.red, 0.10 + en.beat * 0.10)],
      [0.42, rgba(pal.red, 0.05 + en.beat * 0.045)],
      [1, rgba(pal.red, 0)]]);
    ctx.beginPath();
    ctx.arc(x, y, r * 2.0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.clip();

    ctx.fillStyle = mkRad(ctx, x - r * 0.26, y - r * 0.32, r * 0.04,
                          x + r * 0.14, y + r * 0.22, r * 1.28, [
      [0, rgba(pal.hot, 1)],
      [0.36, rgba(pal.red, 1)],
      [0.74, rgba(pal.mid, 1)],
      [1, rgba(pal.deep, 1)]]);
    ctx.fillRect(x - r, y - r, r * 2, r * 2);

    // 套印错位：右半版多压一层墨，左缘提一道暖光
    ctx.fillStyle = rgba([28, 2, 6], 0.15);
    ctx.fillRect(x, y - r, r, r * 2);
    ctx.fillStyle = rgba([255, 128, 86], 0.055);
    ctx.fillRect(x - r, y - r, r * 0.46, r * 2);

    // 纸纹压印
    if (assetPaper) {
      try {
        if (!paperPat) paperPat = ctx.createPattern(assetPaper, 'repeat');
        if (paperPat) {
          ctx.save();
          ctx.globalCompositeOperation = 'multiply';
          ctx.globalAlpha = 0.30;
          ctx.fillStyle = paperPat;
          ctx.fillRect(x - r, y - r, r * 2, r * 2);
          ctx.restore();
        }
      } catch (e) {}
    }

    // 制服纹样：整齐划一的一排排剪影，缓慢下移
    if (uniPat) {
      var sp = 64;
      var dx = rm ? 0 : (age * 4.6) % sp;
      var dy = rm ? 0 : (age * 2.2 + en.beat * 7) % sp;
      try {
        if (!uniM && typeof DOMMatrix !== 'undefined') uniM = new DOMMatrix();
        if (uniM && uniPat.setTransform) {
          uniM.e = dx; uniM.f = dy;
          uniPat.setTransform(uniM);
        }
      } catch (e) {}
      ctx.globalAlpha = 0.52 + en.level * 0.10;
      ctx.fillStyle = uniPat;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
    }

    // 版缝
    ctx.strokeStyle = rgba(pal.ivory, 0.09 + en.beat * 0.10);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.round(x) + 0.5, y - r);
    ctx.lineTo(Math.round(x) + 0.5, y + r);
    ctx.stroke();
    ctx.restore();

    // 印边
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.arc(x, y, r + 0.7, 0, TAU);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba([255, 214, 190], 0.20);
    ctx.beginPath();
    ctx.arc(x, y, r - 0.8, Math.PI * 1.06, Math.PI * 1.62);
    ctx.stroke();
  }

  // ------------------------------------------------------------
  // 圆桌 / ghosted old round table, fanned cards
  // ------------------------------------------------------------
  function drawTable(){
    var tb = scene.table, r = tb.r;
    var a0 = rm ? 0 : Math.sin(age * 0.24) * 0.012;
    ctx.save();
    ctx.translate(tb.x, tb.y);
    ctx.rotate(a0);
    ctx.globalAlpha = 0.50;
    ctx.strokeStyle = rgba(pal.ivory, 0.26);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.34;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.84, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.stroke();

    // 罗盘刻线
    ctx.globalAlpha = 0.26;
    for (var i = 0; i < 24; i++) {
      var a = (i / 24) * TAU;
      var l = (i % 6 === 0) ? 0.10 : 0.045;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.955, Math.sin(a) * r * 0.955);
      ctx.lineTo(Math.cos(a) * r * (0.955 - l), Math.sin(a) * r * (0.955 - l));
      ctx.stroke();
    }

    // 纸牌扇形
    ctx.globalAlpha = 0.62;
    ctx.strokeStyle = rgba(pal.ivory, 0.34);
    for (var k = -2; k <= 2; k++) {
      ctx.save();
      ctx.rotate(k * 0.155 + Math.sin(age * 0.34 + k) * 0.004);
      ctx.translate(0, -r * 0.40);
      ctx.beginPath();
      approxRect(ctx, -r * 0.105, -r * 0.155, r * 0.21, r * 0.31, r * 0.022);
      ctx.stroke();
      if (k === 0) {
        ctx.globalAlpha = 0.34;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.036, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 0.62;
      }
      ctx.restore();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function approxRect(c, x, y, w, h, rad){
    c.moveTo(x + rad, y);
    c.lineTo(x + w - rad, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rad);
    c.lineTo(x + w, y + h - rad);
    c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    c.lineTo(x + rad, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rad);
    c.lineTo(x, y + rad);
    c.quadraticCurveTo(x, y, x + rad, y);
  }

  // ------------------------------------------------------------
  // 列 / a chorus line in crimson uniform, in silhouette
  // ------------------------------------------------------------
  function uniformFigure(x, y, h, sway){
    var bw = h * 0.175;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(sway);
    ctx.beginPath();
    ctx.arc(0, -h * 0.845, h * 0.068, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-bw, -h * 0.775);
    ctx.lineTo(bw, -h * 0.775);
    ctx.lineTo(bw * 1.20, -h * 0.315);
    ctx.lineTo(-bw * 1.20, -h * 0.315);
    ctx.closePath();
    ctx.fill();
    // 腿
    var lw = bw * 0.30;
    ctx.fillRect(-bw * 0.86, -h * 0.335, lw, h * 0.335);
    ctx.fillRect(bw * 0.86 - lw, -h * 0.335, lw, h * 0.335);
    // 领口 / 腰带
    ctx.strokeStyle = 'rgba(255,196,178,0.20)';
    ctx.lineWidth = Math.max(0.7, h * 0.012);
    ctx.beginPath();
    ctx.moveTo(-bw * 0.62, -h * 0.755);
    ctx.lineTo(0, -h * 0.66);
    ctx.lineTo(bw * 0.62, -h * 0.755);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,170,150,0.13)';
    ctx.beginPath();
    ctx.moveTo(-bw * 1.07, -h * 0.36);
    ctx.lineTo(bw * 1.07, -h * 0.36);
    ctx.stroke();
    // 背光边缘
    ctx.strokeStyle = 'rgba(255,132,104,0.16)';
    ctx.lineWidth = Math.max(0.8, h * 0.014);
    ctx.beginPath();
    ctx.moveTo(bw, -h * 0.765);
    ctx.lineTo(bw * 1.20, -h * 0.315);
    ctx.stroke();
    ctx.restore();
  }

  function drawCorps(){
    var n, h, base, xa, xb, i;
    if (scene.land) {
      n = 9;
      h = H * 0.128;
      base = H * 0.962;
      xa = Math.max(W * 0.635, W * 0.06 + Math.min(W * 0.58, 680) + W * 0.018);
      xb = W * 1.02;
    } else {
      n = 8;
      h = Math.min(W * 0.055, H * 0.042);
      base = scene.sun.y + scene.sun.r * 0.99;
      xa = W * 0.06;
      xb = W * 0.95;
    }
    if (xb <= xa + h) return;

    // 地台光，让剪影有底
    ctx.save();
    var g = mkRad(ctx, (xa + xb) / 2, base, 0, (xa + xb) / 2, base, Math.max(60, (xb - xa) * 0.62), [
      [0, 'rgba(178,202,208,' + (0.13 + en.mid * 0.05) + ')'],
      [0.55, 'rgba(178,202,208,0.045)'],
      [1, 'rgba(178,202,208,0)']]);
    ctx.fillStyle = g;
    ctx.fillRect(xa - h, base - h * 0.9, (xb - xa) + h * 2, h * 1.35);

    var bob = rm ? 0 : Math.sin(age * 1.15) * (h * 0.012);
    var swayA = rm ? 0 : Math.sin(age * 1.15 + 0.5) * 0.012;
    ctx.fillStyle = rgba(pal.suit, 1);
    for (i = 0; i < n; i++) {
      var f = (n === 1) ? 0.5 : i / (n - 1);
      var x = xa + (xb - xa) * f;
      uniformFigure(x, base + bob - (i % 2) * h * 0.004, h * (0.94 + (i % 3) * 0.03), swayA);
    }
    ctx.restore();
  }

  function drawScrim(){
    ctx.fillStyle = mkRad(ctx, -W * 0.05, H * 1.02, Math.min(W, H) * 0.05,
                          W * 0.12, H * 0.96, Math.max(W, H) * 0.74, [
      [0, 'rgba(7,6,7,0.62)'],
      [0.52, 'rgba(7,6,7,0.30)'],
      [1, 'rgba(7,6,7,0)']]);
    ctx.fillRect(0, H * 0.24, W, H * 0.76);
  }

  function drawOverlay(){
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(vigC, 0, 0, W, H);
  }
  var grainPat = null, paperPat = null;

  function render(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (bgDirty) buildBg();
    ctx.drawImage(bgC, 0, 0, W, H);
    drawTable();
    drawSun();
    drawCables();
    drawCoil();
    drawBeams();
    drawScrim();
    drawOverlay();
    drawCorps();
  }

  function frame(now){
    var t0 = performance.now();
    if (!lastNow) lastNow = now;
    var dv = (now - lastNow) / 1000;
    if (!(dv > 0) || dv > 0.25) dv = 0.016;
    dt = dv; lastNow = now;
    age += dv * (playing ? 1 : 0.28);
    smooth(dv);
    render();
    syncChars();
    if (dur > 0) {
      var pr = clamp(t / dur, 0, 1);
      if (Math.abs(pr - lastPr) > 0.0013) {
        lastPr = pr;
        pFill.style.transform = 'scaleX(' + pr + ')';
      }
    }
    frames++;
    jsMs = jsMs ? jsMs * 0.9 + (performance.now() - t0) * 0.1 : (performance.now() - t0);
    requestAnimationFrame(frame);
  }

  window.__stage = function(){
    var ln = lines[idx];
    return { lines: lines.length, idx: idx, t: t, playing: playing, frames: frames,
             js: Math.round(jsMs * 100) / 100, err: '', text: (ln && ln.text) ? String(ln.text) : '',
             gl: false, rm: rm };
  };

  window.addEventListener('resize', fit, { passive: true });
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); }, { passive: true });
  buildNoiseTile();
  fit();
  loadImg('assets/348-paper.jpg', function(im){ if (im) { assetPaper = im; paperPat = null; bgDirty = true; } });
  loadImg('assets/348-grain.png', function(im){ if (im) { assetGrain = im; grainPat = null; bgDirty = true; } });
  requestAnimationFrame(function(){
    sendReady();
    requestAnimationFrame(frame);
  });
  setTimeout(sendReady, 680);
  setTimeout(sendReady, 1400);
  started = true;
})();
</script>
</body>
