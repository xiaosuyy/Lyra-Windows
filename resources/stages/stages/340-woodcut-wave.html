<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>340 · 木刻跃浪</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0d0b0a}
  #art{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ov{position:absolute;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
  #grain{position:absolute;inset:0;pointer-events:none;z-index:3;
         background-image:url(assets/340-grain.jpg);background-size:680px auto;
         mix-blend-mode:multiply;opacity:.40}
  #lyrWrap{position:absolute;left:5.2vw;right:5.2vw;bottom:clamp(22px,8.5vh,104px);
           display:flex;justify-content:flex-start}
  #slab{position:relative;display:inline-block;box-sizing:border-box;
        max-width:min(74vw,1000px);padding:.58em .74em .52em;
        background-color:#dccfb4;color:#15110e;
        border-radius:3px 13px 5px 11px / 9px 4px 12px 5px;
        box-shadow:inset 0 0 0 1px rgba(21,17,14,.52), 0 .18em .50em rgba(0,0,0,.34);
        transform:rotate(-.38deg) translateZ(0);transition:opacity .4s ease}
  #slab:before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
        background-image:url(assets/340-kraft.jpg);background-size:460px auto;
        mix-blend-mode:multiply;opacity:.26}
  #slab.empty{padding:.5em .7em}
  #lhead{position:relative;display:flex;align-items:center;gap:.5em;margin-bottom:.22em}
  #lrule{flex:1 1 auto;height:1px;background:currentColor;opacity:.55;
         clip-path:polygon(0 45%,12% 0,38% 80%,64% 10%,86% 70%,100% 30%,100% 100%,0 100%)}
  #lnum{position:relative;font:600 clamp(8px,.78vw,11px)/1 ui-monospace,Menlo,Consolas,monospace;
        letter-spacing:.16em;opacity:.62;white-space:nowrap}
  #ltext{position:relative;
        font:900 clamp(17px,3.7vw,50px)/1.24 "PingFang SC","Microsoft YaHei","Noto Sans SC",
              "Source Han Sans SC","Heiti SC",sans-serif;
        letter-spacing:.005em;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
        text-shadow:0 0 .35px currentColor}
  #slab.empty #ltext{font-size:clamp(14px,2.1vw,26px);opacity:.72;letter-spacing:.06em}
  .ch{display:inline-block;white-space:pre;transform-origin:50% 62%;opacity:0}
  .ch.on{opacity:1;animation:stamp .32s cubic-bezier(.16,.9,.24,1) both}
  #slab.empty .ch.on{animation:none;opacity:1}
  @keyframes stamp{
    0%{opacity:0;transform:scale(1.30) translateY(-.05em)}
    58%{opacity:1;transform:scale(.985)}
    100%{opacity:1;transform:scale(1)}
  }
  @media (prefers-reduced-motion: reduce){ .ch.on{animation:none;opacity:1} }
  @media (max-aspect-ratio: 9/10){
    #lyrWrap{left:6vw;right:6vw;bottom:clamp(18px,7vh,72px)}
    #slab{max-width:88vw}
    #ltext{font-size:clamp(19px,6.1vw,42px);line-height:1.30}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="art"></canvas>
  <div id="ov">
    <div id="lyrWrap">
      <div id="slab" class="empty" style="opacity:0">
        <div id="lhead"><span id="lnum"></span><i id="lrule"></i></div>
        <div id="ltext"></div>
      </div>
    </div>
  </div>
  <div id="grain"></div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('art');
var cx=cv.getContext('2d',{alpha:false});
var slabEl=document.getElementById('slab');
var textEl=document.getElementById('ltext');
var numEl=document.getElementById('lnum');

var S={W:0,H:0,dpr:1,lines:[],idx:-1,t:0,playing:true,dur:0,text:'',accent:[212,190,156],
       frames:0,js:0,err:'',gl:false,rm:false,beat:0,bev:0,songName:'',artistsLine:'',
       live:{bpm:0,level:0,bass:0,mid:0,treble:0},ready:false,revealed:-1};

var readySent=false;
function sendReady(){
  if(readySent) return; readySent=true;
  try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){}
}
function clamp255(v){ v=Math.round(+v); if(!isFinite(v)) v=0; return v<0?0:v>255?255:v; }
function num(v,d){ return (typeof v==='number'&&isFinite(v))?v:d; }
var mq=window.matchMedia?window.matchMedia('(prefers-reduced-motion:reduce)'):null;
S.rm=!!(mq&&mq.matches);

/* ---------- 调色：全部先取整+夹取，再进 canvas ---------- */
var AC={ink:[30,26,22],paper:[216,202,178],accent:[212,190,156]};
function mix(a,b,k){ return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]; }
function rgba(c,a){ return 'rgba('+clamp255(c[0])+','+clamp255(c[1])+','+clamp255(c[2])+','+(+a||1)+')'; }
function rgb(c){ return 'rgb('+clamp255(c[0])+','+clamp255(c[1])+','+clamp255(c[2])+')'; }
function rePalette(){
  var acc=[clamp255(S.accent[0]),clamp255(S.accent[1]),clamp255(S.accent[2])];
  AC.accent=acc;
  // 墨：极深、只留一点主色倾向，仍然是"黑"
  AC.ink=mix([5,4,4],acc,0.11);
  // 纸：暖灰卡纸底色，被主色极轻地染一点
  AC.paper=mix([219,206,181],acc,0.05);
}
rePalette();

/* ---------- 素材（本地相对路径，运行时零外部请求；失败一律回落程序化纹理） ---------- */
var TEX={
  kraft:{img:null,ok:false,url:'assets/340-kraft.jpg'},
  fiber:{img:null,ok:false,url:'assets/340-fiber.jpg'},
  grey:{img:null,ok:false,url:'assets/340-grey.jpg'}
};
var platesDirty=true;
function loadTex(k){
  var t=TEX[k], im=new Image();
  t.img=im; t.ok=false;
  im.decoding='async';
  im.onload=function(){ if(im.naturalWidth>1){ t.ok=true; platesDirty=true; } };
  im.onerror=function(){ t.ok=false; t.img=null; };
  im.onabort=function(){ t.ok=false; };
  im.src=t.url;
  setTimeout(function(){ if(!t.ok&&im&&!im.complete){ im.onload=im.onerror=null; t.ok=false; t.img=null; } },2600);
}
function drawCover(g,img,w,h,sx,sy){
  var iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw||!ih||w<=0||h<=0) return false;
  var r=Math.max(w/iw,h/ih), dw=iw*r, dh=ih*r;
  g.drawImage(img,(w-dw)*0.5+(sx||0),(h-dh)*0.5+(sy||0),dw,dh);
  return true;
}
/* 程序化纸张：素材缺失时的兜底，也保证首帧不等图片 */
function proceduralPaper(g,w,h){
  var base=AC.paper;
  g.fillStyle=rgb(base); g.fillRect(0,0,w,h);
  var i,x,y,r;
  for(i=0;i<220;i++){
    x=Math.random()*w; y=Math.random()*h; r=40+Math.random()*260;
    var gr=g.createRadialGradient(x,y,0,x,y,r);
    var dark=Math.random()<0.5;
    gr.addColorStop(0,'rgba('+(dark?60:255)+','+(dark?48:250)+','+(dark?38:235)+','+(dark?0.05:0.06)+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);
  }
}

function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  if(!isFinite(w)||!isFinite(h)||!(w>1)||!(h>1)){ w=1440; h=900; }
  S.W=Math.max(2,Math.round(w)); S.H=Math.max(2,Math.round(h));
  var dpr=Math.min(window.devicePixelRatio||1,2);
  if(S.W*S.H*dpr*dpr>3.3e6) dpr=Math.max(1,Math.sqrt(3.3e6/(S.W*S.H)));
  S.dpr=dpr;
  cv.width=Math.round(S.W*dpr); cv.height=Math.round(S.H*dpr);
  cx.setTransform(dpr,0,0,dpr,0,0);
  platesDirty=true;
}

/* ---------- 静态版基（只在 resize / 素材到达时重建） ---------- */
var PL={paper:null,land:null,wave:null,fig:null};
function PS(){ return Math.min(S.dpr||1,1.55); }
function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(2,Math.round(w)); c.height=Math.max(2,Math.round(h));
  return c;
}
function flutes(g,w,h,scale){
  // 瓦楞纸的横向楞线：极轻的明暗交替，制造"纸板"而不是"纸"
  var step=Math.max(6,Math.round(h/40)),i;
  g.save(); g.globalCompositeOperation='multiply';
  for(i=0;i<h;i+=step){
    g.fillStyle='rgba(70,56,40,0.045)'; g.fillRect(0,i,w,Math.max(1,step*0.32));
    g.fillStyle='rgba(255,250,238,0.05)'; g.fillRect(0,i+step*0.42,w,Math.max(1,step*0.16));
  }
  g.restore();
}
function buildPaper(){
  var s=PS(), w=Math.max(2,Math.round(S.W*s)), h=Math.max(2,Math.round(S.H*s));
  var c=mkCanvas(w,h), g=c.getContext('2d');
  proceduralPaper(g,w,h);
  if(TEX.kraft.ok){
    try{
      var kp=g.createPattern(TEX.kraft.img,'repeat');
      if(kp){ g.save(); g.fillStyle=kp; g.fillRect(0,0,w,h); g.restore(); }
    }catch(e){}
    g.save(); g.globalCompositeOperation='multiply';
    g.fillStyle=rgb(mix(AC.paper,[255,252,244],0.55)); g.fillRect(0,0,w,h);
    g.restore();
  }
  if(TEX.fiber.ok){
    g.save(); g.globalCompositeOperation='multiply'; g.globalAlpha=0.3;
    drawCover(g,TEX.fiber.img,w,h,0,0);
    g.restore();
  }
  flutes(g,w,h,s);
  // 老化斑 + 四周压暗
  var i,x,y,r,gr;
  try{
    for(i=0;i<26;i++){
      x=Math.random()*w; y=Math.random()*h; r=Math.min(w,h)*(0.08+Math.random()*0.30);
      gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,'rgba(96,74,48,0.055)'); gr.addColorStop(1,'rgba(96,74,48,0)');
      g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);
    }
    gr=g.createRadialGradient(w*0.52,h*0.46,Math.min(w,h)*0.18,w*0.5,h*0.5,Math.max(w,h)*0.78);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(28,20,12,0.5)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  }catch(e){}
  PL.paper={c:c,w:w,h:h};
}
/* ---------- 版面几何 ---------- */
var LY={p:false,hz:0,cx:0,cy:0,R:0};
function layout(){
  var p=S.H>S.W*1.03, w=S.W, h=S.H;
  LY.p=p;
  LY.hz=(p?0.800:0.895)*h;
  LY.cx=(p?0.500:0.505)*w;
  LY.cy=(p?0.270:0.395)*h;
  LY.R=Math.min(w*(p?0.66:0.50), h*(p?0.31:0.47));
  LY.fx=(p?0.335:0.283)*w;
  LY.fy=(p?0.262:0.330)*h;
  LY.rot=p?0.62:0.44;
  LY.tx=0.186*w;
  LY.ty=(p?0.398:0.395)*h;
}
function crestY(t){
  var h=S.H, base=LY.hz;
  var amp=base-(LY.p?0.300:0.180)*h;
  var main=Math.exp(-Math.pow((t-0.665)/0.265,2));
  return base-amp*main-Math.sin(t*11.0+0.6)*h*0.0045*(0.30+main);
}
function waveX(t){ return t*S.W; }
function plateCanvas(){
  var s=PS(), c=mkCanvas(S.W*s,S.H*s), g=c.getContext('2d');
  g.setTransform(s,0,0,s,0,0); g.lineJoin='round'; g.lineCap='round';
  return {c:c,g:g};
}

/* ---------- 工业荒原：冷却塔 / 烟囱 / 铁塔 / 厂房 / 吊车 ---------- */
function buildLand(){
  var pc=plateCanvas(), g=pc.g, w=S.W, h=S.H, hz=LY.hz, i;
  var ink=rgb(AC.ink);
  g.fillStyle=ink; g.strokeStyle=ink;

  function cooling(cx0,base,ww,hh){
    var topw=ww*0.60;
    g.beginPath();
    g.moveTo(cx0-ww*0.5,base);
    g.bezierCurveTo(cx0-ww*0.33,base-hh*0.60,cx0-topw*0.5,base-hh*0.86,cx0-topw*0.5,base-hh);
    g.lineTo(cx0+topw*0.5,base-hh);
    g.bezierCurveTo(cx0+topw*0.5,base-hh*0.86,cx0+ww*0.33,base-hh*0.60,cx0+ww*0.5,base);
    g.closePath(); g.fill();
  }
  function stack(cx0,base,ww,hh){
    g.beginPath();
    g.moveTo(cx0-ww*0.5,base); g.lineTo(cx0-ww*0.34,base-hh);
    g.lineTo(cx0+ww*0.34,base-hh); g.lineTo(cx0+ww*0.5,base);
    g.closePath(); g.fill();
    g.fillRect(cx0-ww*0.42,base-hh-ww*0.18,ww*0.84,ww*0.20);
  }
  function pylon(cx0,base,ww,hh){
    g.lineWidth=Math.max(0.7,w*0.0009);
    g.beginPath();
    g.moveTo(cx0-ww*0.5,base); g.lineTo(cx0-ww*0.12,base-hh);
    g.lineTo(cx0+ww*0.12,base-hh); g.lineTo(cx0+ww*0.5,base);
    g.stroke();
    var k;
    for(k=1;k<=5;k++){
      var f=k/5, yy=base-hh*f, hw=ww*(0.5-0.38*f);
      g.beginPath(); g.moveTo(cx0-hw,yy); g.lineTo(cx0+hw,yy); g.stroke();
      if(k<5){ g.beginPath(); g.moveTo(cx0-hw,yy); g.lineTo(cx0+hw*0.92,yy-hh/5); g.stroke(); }
    }
    g.beginPath(); g.moveTo(cx0-ww*0.85,base-hh*0.86); g.lineTo(cx0+ww*0.85,base-hh*0.86); g.stroke();
    g.beginPath(); g.moveTo(cx0-ww*0.95,base-hh*0.74); g.lineTo(cx0-ww*0.95,base-hh*0.90); g.stroke();
    g.beginPath(); g.moveTo(cx0+ww*0.95,base-hh*0.74); g.lineTo(cx0+ww*0.95,base-hh*0.90); g.stroke();
  }
  function shed(x0,x1,base,hh){
    g.beginPath(); g.moveTo(x0,base); g.lineTo(x0,base-hh);
    var n=6,dx=(x1-x0)/n,j;
    for(j=0;j<n;j++){
      g.lineTo(x0+dx*j+dx*0.5,base-hh*1.55);
      g.lineTo(x0+dx*(j+1),base-hh);
    }
    g.lineTo(x1,base); g.closePath(); g.fill();
  }

  cooling(w*0.052,hz,w*0.050,h*0.150);
  cooling(w*0.112,hz,w*0.044,h*0.122);
  pylon(w*0.160,hz,w*0.030,h*0.180);
  stack(w*0.232,hz,w*0.0075,h*0.235);
  stack(w*0.250,hz,w*0.0055,h*0.152);
  stack(w*0.266,hz,w*0.0080,h*0.268);
  stack(w*0.282,hz,w*0.0050,h*0.132);
  shed(w*0.300,w*0.398,hz+h*0.006,h*0.048);
  pylon(w*0.318,hz+h*0.004,w*0.026,h*0.155);

  // 门式吊车
  g.lineWidth=Math.max(0.8,w*0.0011);
  g.beginPath();
  g.moveTo(w*0.302,hz-h*0.158); g.lineTo(w*0.392,hz-h*0.158);
  g.moveTo(w*0.302,hz-h*0.158); g.lineTo(w*0.302,hz-h*0.060);
  g.moveTo(w*0.392,hz-h*0.158); g.lineTo(w*0.392,hz-h*0.060);
  g.moveTo(w*0.352,hz-h*0.158); g.lineTo(w*0.352,hz-h*0.108);
  g.stroke();
  g.fillRect(w*0.3495,hz-h*0.111,w*0.005,h*0.012);

  // 纵身的高处：断裂的塔
  var tx=w*0.186, tw=w*0.0225, ttop=h*0.395;
  g.beginPath();
  g.moveTo(tx-tw*0.5,hz+h*0.004); g.lineTo(tx-tw*0.30,hz-h*0.02);
  g.lineTo(tx-tw*0.42,ttop+h*0.012);
  g.lineTo(tx-tw*0.10,ttop);
  g.lineTo(tx+tw*0.16,ttop+h*0.008);
  g.lineTo(tx+tw*0.30,ttop+h*0.020);
  g.lineTo(tx+tw*0.50,hz-h*0.02);
  g.lineTo(tx+tw*0.56,hz+h*0.004);
  g.closePath(); g.fill();
  // 塔顶平台
  g.fillRect(tx-tw*0.62,ttop+h*0.016,tw*1.30,Math.max(2,h*0.007));

  // 山脊般的岸线
  g.beginPath(); g.moveTo(0,hz+h*0.012);
  for(i=0;i<=24;i++){
    var xx=w*0.46*i/24;
    g.lineTo(xx,hz+h*0.010+Math.sin(i*1.7)*h*0.0035);
  }
  g.lineTo(w*0.46,h+h*0.05); g.lineTo(0,h+h*0.05); g.closePath(); g.fill();

  // 刀刻：横向通体排线，让剪影变成"印"出来的
  g.save(); g.globalCompositeOperation='destination-out';
  for(var y=hz-h*0.32; y<h*1.02; y+=Math.max(2.4,h*0.0042)){
    g.globalAlpha=0.10+Math.random()*0.16;
    g.lineWidth=0.9;
    g.beginPath();
    g.moveTo(-4,y); g.lineTo(w*0.47,y); g.stroke();
  }
  g.restore();

  // 窗洞
  g.save(); g.globalCompositeOperation='destination-out'; g.fillStyle='#fff';
  for(i=0;i<5;i++){
    var wy=ttop+h*0.030+i*h*0.055;
    g.globalAlpha=0.55+Math.random()*0.35;
    g.fillRect(tx-tw*0.16,wy,tw*0.40,Math.max(1.4,h*0.0055));
  }
  g.restore();

  // 烟
  g.save();
  g.strokeStyle=rgba(AC.ink,0.42); g.lineCap='round';
  for(i=0;i<5;i++){
    var sx=w*(0.232+i*0.0125), sy=hz-h*(0.238+(i%2)*0.030);
    var j;
    for(j=0;j<7;j++){
      var len=w*(0.020+Math.random()*0.045);
      g.globalAlpha=0.50-j*0.055;
      g.lineWidth=Math.max(0.7,h*0.0022);
      g.beginPath();
      g.moveTo(sx+len*j*0.55, sy-h*0.012-j*h*0.010);
      g.lineTo(sx+len*j*0.55+len, sy-h*0.012-j*h*0.010+Math.sin(j)*1.5);
      g.stroke();
    }
  }
  g.restore();
  PL.land={c:pc.c,w:pc.c.width,h:pc.c.height};
}

/* ---------- 巨浪：实心墨体 + 刀刻白线 + 爪状浪尖 ---------- */
function buildWave(){
  var pc=plateCanvas(), g=pc.g, w=S.W, h=S.H, i, t, OV=Math.max(40,h*0.06);
  var ink=rgb(AC.ink);
  var body=new Path2D();
  body.moveTo(-OV,h+OV);
  body.lineTo(-OV,crestY(0)+h*0.010);
  for(i=0;i<=90;i++){ t=i/90; body.lineTo(waveX(t),crestY(t)); }
  body.lineTo(w+OV,crestY(1)+h*0.02);
  body.lineTo(w+OV,h+OV);
  body.closePath();

  g.fillStyle=ink; g.fill(body);

  // 浪尖：爪状白痕（先画成墨块，再用刀刻开）
  g.save();
  for(i=0;i<=26;i++){
    var tt=0.10+i*0.0335;
    if(tt>0.985) break;
    var y0=crestY(tt);
    if(y0>LY.hz-h*0.035) continue;
    var x0=waveX(tt);
    var xa=waveX(Math.max(0,tt-0.012)), ya=crestY(Math.max(0,tt-0.012));
    var xb=waveX(Math.min(1,tt+0.012)), yb=crestY(Math.min(1,tt+0.012));
    var ang=Math.atan2(yb-ya,xb-xa)+Math.PI*0.5-0.42;
    var len=h*(0.030+Math.random()*0.036)*(0.7+0.7*Math.exp(-Math.pow((tt-0.55)/0.45,2)));
    g.save(); g.translate(x0,y0); g.rotate(ang-Math.PI*0.5);
    g.beginPath();
    g.moveTo(-len*0.16,0); g.quadraticCurveTo(-len*0.30,-len*0.62,len*0.30,-len*0.99);
    g.quadraticCurveTo(len*0.10,-len*0.55,len*0.17,0);
    g.closePath(); g.fill();
    g.restore();
  }
  g.restore();

  // 爪内刻线（把每根爪分成两三根爪尖）
  g.save(); g.globalCompositeOperation='destination-out';
  for(i=0;i<34;i++){
    var t2=0.10+i*0.026;
    if(t2>0.985) break;
    var bx=waveX(t2), by=crestY(t2);
    var al=Math.atan2(crestY(Math.min(1,t2+0.02))-crestY(Math.max(0,t2-0.02)),
                      waveX(Math.min(1,t2+0.02))-waveX(Math.max(0,t2-0.02)))-Math.PI*0.5;
    var ll=h*(0.020+Math.random()*0.030);
    g.globalAlpha=0.55+Math.random()*0.3;
    g.lineWidth=Math.max(0.8,h*0.0022);
    g.beginPath();
    g.moveTo(bx,by+2);
    g.quadraticCurveTo(bx+Math.sin(al)*ll*0.6,by+Math.cos(al)*-ll*0.5,
                       bx+Math.sin(al)*ll*0.2,by-ll*0.95);
    g.stroke();
  }
  g.restore();

  // 水体内部：顺浪走的刀痕
  g.save(); g.clip(body); g.globalCompositeOperation='destination-out';
  for(i=1;i<=26;i++){
    var dy=i*h*0.0155;
    if(dy>h*0.42) break;
    g.globalAlpha=Math.max(0.10,0.62-i*0.017);
    g.lineWidth=Math.max(0.7,h*(0.0016+(i%3)*0.0006));
    g.setLineDash([h*(0.02+Math.random()*0.11), h*(0.006+Math.random()*0.03)]);
    g.beginPath();
    var start=Math.max(0,(i*0.012));
    var first=true;
    for(t=start;t<=1.001;t+=0.02){
      var yy=crestY(t)+dy;
      if(yy>h*1.04) break;
      if(first){ g.moveTo(waveX(t),yy); first=false; }
      else g.lineTo(waveX(t),yy);
    }
    g.stroke();
  }
  g.setLineDash([]);
  // 几刀横扫的浪脊
  for(i=0;i<7;i++){
    var yy0=h*(0.42+i*0.075);
    g.globalAlpha=0.30+Math.random()*0.2;
    g.lineWidth=Math.max(0.8,h*0.0026);
    g.beginPath();
    g.moveTo(w*(0.10+Math.random()*0.2), yy0+h*0.02);
    g.quadraticCurveTo(w*0.55, yy0-h*0.05, w*1.02, yy0+h*0.01);
    g.stroke();
  }
  g.restore();

  // 浪头上空的飞沫：墨点（落在纸上）
  g.save(); g.fillStyle=ink;
  for(i=0;i<200;i++){
    var pxx=w*(0.08+Math.random()*0.94);
    var cyy=crestY(Math.min(1,Math.max(0,pxx/w)));
    var pyy=cyy-h*(0.004+Math.random()*Math.random()*0.085);
    if(pyy<0||pyy>h) continue;
    g.globalAlpha=0.18+Math.random()*0.55;
    g.beginPath();
    g.arc(pxx,pyy,h*(0.0009+Math.random()*0.0021),0,6.2832);
    g.fill();
  }
  g.restore();

  // 深水：横向刀痕，避免下半张纸变成一块死黑
  g.save(); g.clip(body); g.globalCompositeOperation='destination-out';
  for(i=0;i<26;i++){
    var byy=h*(0.545+i*0.0195);
    if(byy>h*1.05) break;
    g.globalAlpha=0.09+Math.random()*0.13;
    g.lineWidth=Math.max(0.8,h*0.0019);
    g.setLineDash([h*(0.030+Math.random()*0.150), h*(0.010+Math.random()*0.055)]);
    g.beginPath();
    g.moveTo(-12,byy+Math.sin(i*1.3)*h*0.004);
    g.quadraticCurveTo(w*0.5,byy-h*0.012+Math.sin(i*1.7)*h*0.006,w+12,byy+Math.cos(i*2.1)*h*0.004);
    g.stroke();
  }
  g.setLineDash([]);
  // 水体里的白点（刻掉的飞沫）
  for(i=0;i<70;i++){
    var qx=w*(0.10+Math.random()*0.92);
    var qy=crestY(Math.min(1,Math.max(0,qx/w)))+h*(0.01+Math.random()*0.30);
    if(qy>h*1.02) continue;
    g.globalAlpha=0.30+Math.random()*0.45;
    g.beginPath();
    g.arc(qx,qy,h*(0.0011+Math.random()*0.0024),0,6.2832);
    g.fill();
  }
  g.restore();

  // 刻进浪里的圆环（与天上转动的日晷同轴，形成"穿过水面的法阵"）
  g.save(); g.globalCompositeOperation='destination-out'; g.strokeStyle='#fff';
  var rings=[1.18,0.86,0.58];
  for(i=0;i<rings.length;i++){
    var rr=LY.R*rings[i];
    g.globalAlpha=i===0?0.55:0.40;
    g.lineWidth=Math.max(0.8,h*0.0022);
    g.beginPath(); g.arc(LY.cx,LY.cy,rr,0,6.2832); g.stroke();
    // 刻度
    var k;
    for(k=0;k<72;k++){
      var aa=k/72*6.2832;
      var l1=rr, l2=rr+h*(k%6===0?0.012:0.005);
      g.globalAlpha=0.32;
      g.beginPath();
      g.moveTo(LY.cx+Math.cos(aa)*l1,LY.cy+Math.sin(aa)*l1);
      g.lineTo(LY.cx+Math.cos(aa)*l2,LY.cy+Math.sin(aa)*l2);
      g.stroke();
    }
  }
  g.restore();
  PL.wave={c:pc.c,w:pc.c.width,h:pc.c.height};
}

/* ---------- 样条与变径"胶囊"，用来长手脚躯干 ---------- */
function crPoint(p0,p1,p2,p3,t){
  var t2=t*t,t3=t2*t;
  return [
    0.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    0.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}
function splinePts(ctrl,n){
  var pts=[],i,u,k,t;
  for(i=0;i<=n;i++){
    u=i/n*(ctrl.length-1); k=Math.min(Math.floor(u),ctrl.length-2); t=u-k;
    pts.push(crPoint(ctrl[Math.max(0,k-1)],ctrl[k],ctrl[k+1],ctrl[Math.min(ctrl.length-1,k+2)],t));
  }
  return pts;
}
function taperPath(pts,r0,r1,bulge){
  var n=pts.length,i,L=[],R=[],a,b,dx,dy,len,nx,ny,u,r;
  for(i=0;i<n;i++){
    a=pts[Math.max(0,i-1)]; b=pts[Math.min(n-1,i+1)];
    dx=b[0]-a[0]; dy=b[1]-a[1]; len=Math.sqrt(dx*dx+dy*dy)||1;
    nx=-dy/len; ny=dx/len; u=i/(n-1);
    r=r0+(r1-r0)*u+(bulge||0)*Math.sin(Math.PI*u);
    L.push([pts[i][0]+nx*r,pts[i][1]+ny*r]);
    R.push([pts[i][0]-nx*r,pts[i][1]-ny*r]);
  }
  var p=new Path2D();
  p.moveTo(L[0][0],L[0][1]);
  for(i=1;i<n;i++) p.lineTo(L[i][0],L[i][1]);
  for(i=n-1;i>=0;i--) p.lineTo(R[i][0],R[i][1]);
  p.closePath();
  return p;
}
function ellipsePath(cx0,cy0,rx,ry,rot){
  var p=new Path2D();
  p.ellipse(cx0,cy0,rx,ry,rot||0,0,6.2832);
  return p;
}

/* ---------- 纵身者：身体轴沿 +x，头在 +x 端 ---------- */
function buildFigure(){
  var fs=Math.min(LY.p?0.310*S.W:0.215*S.H,0.235*S.H);
  var minX=-0.30,maxX=1.30,minY=-0.56,maxY=0.56;
  var lw=(maxX-minX)*fs, lh=(maxY-minY)*fs, s=PS();
  var c=mkCanvas(lw*s,lh*s), g=c.getContext('2d');
  g.setTransform(s,0,0,s,0,0);
  g.lineJoin='round'; g.lineCap='round';
  g.translate(-minX*fs,-minY*fs);
  g.scale(fs,fs);
  var ink=rgb(AC.ink);
  g.fillStyle=ink; g.strokeStyle=ink;

  g.fill(taperPath(splinePts([[0.26,0],[0.46,0.005],[0.66,0.005],[0.84,0]],20),0.070,0.082,0.026));
  g.fill(ellipsePath(0.79,0,0.105,0.070,-0.06));
  g.fill(taperPath(splinePts([[0.80,0],[0.86,0],[0.91,0]],8),0.048,0.040,0));
  g.fill(ellipsePath(0.945,0.008,0.080,0.090,0.30));

  // 后摆的手臂
  g.fill(taperPath(splinePts([[0.775,-0.058],[0.845,-0.20],[0.80,-0.315]],14),0.047,0.024,0.008));
  g.fill(taperPath(splinePts([[0.80,-0.315],[0.775,-0.375],[0.755,-0.405]],8),0.024,0.013,0));
  // 前伸的手臂
  g.fill(taperPath(splinePts([[0.775,0.058],[0.885,0.165],[0.985,0.265]],14),0.047,0.022,0.008));
  g.fill(taperPath(splinePts([[0.985,0.265],[1.035,0.315],[1.075,0.335]],8),0.022,0.012,0));

  // 腿：一条绷直，一条折起
  g.fill(taperPath(splinePts([[0.28,-0.048],[0.13,-0.085],[-0.02,-0.052]],14),0.058,0.022,0.014));
  g.fill(taperPath(splinePts([[-0.02,-0.052],[-0.075,-0.062],[-0.115,-0.075]],8),0.022,0.011,0));
  g.fill(taperPath(splinePts([[0.28,0.048],[0.14,0.128],[0.035,0.198]],14),0.058,0.022,0.014));
  g.fill(taperPath(splinePts([[0.035,0.198],[-0.02,0.228],[-0.058,0.235]],8),0.022,0.011,0));

  // 头发向后拖
  g.lineWidth=0.013; g.beginPath();
  var hi;
  for(hi=0;hi<5;hi++){
    var hy=-0.05+hi*0.026;
    g.moveTo(0.885,hy);
    g.quadraticCurveTo(0.83,hy*1.5-0.01,0.795,hy*1.7-0.02);
  }
  g.stroke();

  // 刀刻：把墨块刻开（脊线、肋、四肢中线、面部）
  g.save(); g.globalCompositeOperation='destination-out'; g.strokeStyle='#fff';
  g.lineWidth=0.012; g.globalAlpha=0.85;
  g.beginPath(); g.moveTo(0.30,-0.005);
  g.quadraticCurveTo(0.52,-0.012,0.76,-0.004); g.stroke();
  var k;
  for(k=0;k<5;k++){
    var rx=0.50+k*0.058;
    g.lineWidth=0.0105; g.globalAlpha=0.42+0.08*k;
    g.beginPath();
    g.moveTo(rx,-0.012);
    g.quadraticCurveTo(rx+0.028,-0.062,rx+0.012,-0.082);
    g.stroke();
    g.beginPath();
    g.moveTo(rx,0.012);
    g.quadraticCurveTo(rx+0.028,0.058,rx+0.010,0.076);
    g.stroke();
  }
  // 背脊外侧
  g.lineWidth=0.011; g.globalAlpha=0.5;
  g.beginPath(); g.moveTo(0.34,-0.070); g.quadraticCurveTo(0.58,-0.082,0.74,-0.062); g.stroke();
  // 四肢中线
  g.globalAlpha=0.62; g.lineWidth=0.0105;
  g.beginPath(); g.moveTo(0.80,-0.30); g.quadraticCurveTo(0.845,-0.20,0.79,-0.10); g.stroke();
  g.beginPath(); g.moveTo(1.02,0.30); g.quadraticCurveTo(0.90,0.17,0.795,0.08); g.stroke();
  g.beginPath(); g.moveTo(0.24,-0.050); g.quadraticCurveTo(0.11,-0.088,-0.03,-0.056); g.stroke();
  g.beginPath(); g.moveTo(0.24,0.050); g.quadraticCurveTo(0.12,0.128,0.030,0.192); g.stroke();
  // 腹与胯
  g.lineWidth=0.010; g.globalAlpha=0.5;
  g.beginPath(); g.moveTo(0.335,-0.045); g.quadraticCurveTo(0.285,0.0,0.335,0.045); g.stroke();
  // 面部：眉、眼、颌
  g.lineWidth=0.011; g.globalAlpha=0.9;
  g.beginPath(); g.moveTo(0.905,0.010); g.quadraticCurveTo(0.925,-0.012,0.948,0.004); g.stroke();
  g.globalAlpha=0.85;
  g.beginPath(); g.ellipse(0.960,0.042,0.016,0.011,0.35,0,6.2832); g.fill();
  g.lineWidth=0.009; g.globalAlpha=0.6;
  g.beginPath(); g.moveTo(0.985,0.075); g.quadraticCurveTo(1.005,0.060,1.010,0.030); g.stroke();
  g.restore();

  PL.fig={c:c,w:lw,h:lh};
}

function buildPlates(){
  PL.paper=null; PL.land=null; PL.wave=null; PL.fig=null;
  layout();
  buildPaper();
  buildLand();
  // 纸 + 远岸合成一张底版，每帧只摊一次
  if(PL.paper&&PL.land){
    try{
      var pg=PL.paper.c.getContext('2d');
      pg.drawImage(PL.land.c,0,0,PL.land.w,PL.land.h,0,0,PL.paper.w,PL.paper.h);
    }catch(e){}
    PL.land=null;
  }
  buildWave();
  buildFigure();
  platesDirty=false;
}

function normLines(raw){
  var out=[],i,it,ch,text,t,dur;
  if(!Array.isArray(raw)) return out;
  for(i=0;i<raw.length;i++){
    it=raw[i]; if(!it||typeof it!=='object') continue;
    t=num(it.t,0);
    text=(typeof it.text==='string')?it.text:(it.text==null?'':String(it.text));
    dur=num(it.dur,0);
    ch=Array.isArray(it.chars)?it.chars:null;
    out.push({t:Math.max(0,t),dur:Math.max(0,dur),text:text,chars:ch});
  }
  out.sort(function(a,b){return a.t-b.t;});
  return out;
}

function findIdx(t){
  var L=S.lines,lo=0,hi=L.length-1,r=-1;
  while(lo<=hi){ var m=(lo+hi)>>1; if(L[m].t<=t+0.02){r=m;lo=m+1;} else hi=m-1; }
  return r;
}

var units=[];

function isAsciiWord(ch){ return /[A-Za-z0-9'’\-\u00c0-\u024f]/.test(ch); }

/* 把一句拆成"可逐字点亮"的单元；YRC 用真时间，LRC 自己均分 */
function makeUnits(line,idx){
  var src=[],i,joined='';
  if(!line) return src;
  var text=line.text||'';
  if(Array.isArray(line.chars)){
    for(i=0;i<line.chars.length;i++){
      var c=line.chars[i];
      if(c&&typeof c==='object'&&typeof c.c==='string') joined+=c.c;
      else if(typeof c==='string') joined+=c;
    }
  }
  if(Array.isArray(line.chars)&&line.chars.length&&joined&&joined===text){
    for(i=0;i<line.chars.length;i++){
      var cc=line.chars[i];
      var s=(cc&&typeof cc.c==='string')?cc.c:String(cc&&cc.c!=null?cc.c:'');
      var tt=num(cc&&cc.t,line.t);
      src.push({s:s,t:tt});
    }
  }else{
    var arr=Array.from(text);
    var dur=line.dur>0?Math.min(line.dur,7):Math.min(4.2,Math.max(1.2,arr.length*0.185));
    for(i=0;i<arr.length;i++) src.push({s:arr[i],t:line.t+(arr.length<=1?0:i/arr.length*dur)});
  }
  var us=[],cur=null;
  for(i=0;i<src.length;i++){
    if(!src[i].s) continue;
    if(isAsciiWord(src[i].s)&&cur&&cur.word){
      cur.text+=src[i].s;
    }else{
      cur={text:src[i].s,t:src[i].t,word:isAsciiWord(src[i].s)};
      us.push(cur);
    }
  }
  return us;
}

function renderLine(){
  var i=S.idx, line=(i>=0)?S.lines[i]:null;
  units=[]; S.revealed=-1; S.text='';
  textEl.textContent='';
  numEl.textContent='';
  var txt=line?(line.text||''):'';
  if(!S.lines.length){
    slabEl.classList.add('empty');
    slabEl.style.opacity='1';
    textEl.textContent='器乐 · 无词';
    return;
  }
  if(!line||!txt){
    slabEl.classList.add('empty');
    slabEl.style.opacity=line?'1':'0';
    textEl.textContent='';
    return;
  }
  slabEl.classList.remove('empty');
  slabEl.style.opacity='1';
  numEl.textContent=String(i+1).padStart(2,'0')+' / '+String(S.lines.length).padStart(2,'0');
  var us=makeUnits(line,i), k;
  for(k=0;k<us.length;k++){
    var sp=document.createElement('span');
    sp.className='ch';
    sp.textContent=us[k].text;
    textEl.appendChild(sp);
    units.push({el:sp,t:us[k].t});
  }
  S.text=txt;
  applyReveal(S.t);
  fitBlock();
}

function applyReveal(t){
  if(!units.length) return;
  var n=0,i;
  for(i=0;i<units.length;i++){ if(units[i].t<=t+0.02) n++; }
  if(n===S.revealed) return;
  if(n<S.revealed){
    for(i=Math.max(0,n);i<S.revealed&&i<units.length;i++) units[i].el.classList.remove('on');
  }else{
    for(i=Math.max(0,S.revealed);i<n&&i<units.length;i++) units[i].el.classList.add('on');
  }
  S.revealed=n;
}

/* 超长句不许溢出：按高度/宽度阶梯缩字号 */
function fitBlock(){
  textEl.style.fontSize='';
  var fs=parseFloat(window.getComputedStyle(textEl).fontSize)||28;
  var maxH=Math.min(S.H*0.34,360), guard=0;
  while(guard++<7 && slabEl.getBoundingClientRect().height>maxH && fs>13){
    fs*=0.90;
    textEl.style.fontSize=fs.toFixed(2)+'px';
  }
}

function onInit(p){
  p=p||{};
  var a=p.accent,before=AC.accent.join(',');
  if(a&&a.length){ S.accent=[clamp255(a[0]),clamp255(a[1]),clamp255(a[2])]; }
  rePalette();
  if(AC.accent.join(',')!==before) platesDirty=true;
  var song=(p&&p.song)||{};
  S.songName=(typeof song.name==='string'&&song.name.trim())?song.name.trim():'';
  var ar=song.artists;
  if(Array.isArray(ar)) ar=ar.filter(function(x){return typeof x==='string'&&x;}).join(' / ');
  S.artistsLine=(typeof ar==='string'&&ar.trim())?ar.trim():'';
  S.lines=normLines(p.lines);
  S.dur=Math.max(0,num(p.duration,0));
  if(typeof p.playing==='boolean') S.playing=p.playing;
  S.idx=-1; S.revealed=-1;
  S.text='';
  S.ready=true;
  renderLine();
}

addEventListener('message',function(ev){
  var d=ev.data; if(!d||d.__c100!==1) return;
  var p=d.payload||{};
  if(d.type==='init'){ onInit(p); }
  else if(d.type==='tick'){
    var tt=p.time;
    if(typeof tt==='number'&&isFinite(tt)) S.t=tt;
    if(typeof p.playing==='boolean') S.playing=p.playing;
  } else if(d.type==='beat'){
    if(typeof p.level==='number'&&isFinite(p.level)) S.bev=Math.max(0,Math.min(1,p.level));
    S.beat=1;
  } else if(d.type==='live'){
    if(typeof p.bpm==='number'&&isFinite(p.bpm)) S.live.bpm=p.bpm;
    if(typeof p.level==='number'&&isFinite(p.level)) S.live.level=Math.max(0,Math.min(1,p.level));
    if(typeof p.bass==='number'&&isFinite(p.bass)) S.live.bass=Math.max(0,Math.min(1,p.bass));
    if(typeof p.mid==='number'&&isFinite(p.mid)) S.live.mid=Math.max(0,Math.min(1,p.mid));
    if(typeof p.treble==='number'&&isFinite(p.treble)) S.live.treble=Math.max(0,Math.min(1,p.treble));
  }
});

/* ---------- 天穹上的日晷圆环（每帧现画，很轻） ---------- */
function drawDial(now){
  var r=LY.R,c0=LY.cx,c1=LY.cy,t=now/1000,i,a;
  if(r<20) return;
  var rot=S.rm?0:t*0.011;
  var prog=S.dur>0?Math.min(1,Math.max(0,S.t/S.dur)):(S.rm?0.3:((t*0.016)%1));
  cx.save();
  cx.lineCap='butt'; cx.lineJoin='miter';

  cx.strokeStyle=rgba(AC.ink,0.52); cx.lineWidth=1;
  cx.beginPath(); cx.arc(c0,c1,r,0,6.2832); cx.stroke();

  var ticks=96;
  cx.beginPath();
  for(i=0;i<ticks;i++){
    a=rot+i/ticks*6.2832;
    var big=(i%8===0), mid=(i%4===0);
    var l=big?r*0.048:(mid?r*0.030:r*0.015);
    cx.moveTo(c0+Math.cos(a)*r,c1+Math.sin(a)*r);
    cx.lineTo(c0+Math.cos(a)*(r+l),c1+Math.sin(a)*(r+l));
  }
  cx.strokeStyle=rgba(AC.ink,0.40); cx.lineWidth=1; cx.stroke();

  cx.strokeStyle=rgba(AC.ink,0.30);
  cx.beginPath(); cx.arc(c0,c1,r*0.952,0,6.2832); cx.stroke();
  cx.strokeStyle=rgba(AC.ink,0.24);
  cx.setLineDash([r*0.052,r*0.020]);
  cx.beginPath(); cx.arc(c0,c1,r*0.795,0,6.2832); cx.stroke();
  cx.setLineDash([]);
  cx.strokeStyle=rgba(AC.ink,0.22);
  cx.beginPath(); cx.arc(c0,c1,r*0.548,0,6.2832); cx.stroke();

  // 十二时辰
  var fs=Math.max(7,Math.min(13,r*0.050));
  cx.font='600 '+fs.toFixed(1)+'px "Times New Roman",Georgia,serif';
  cx.fillStyle=rgba(AC.ink,0.44); cx.textAlign='center'; cx.textBaseline='middle';
  for(i=0;i<12;i++){
    a=rot+i/12*6.2832-Math.PI/2;
    cx.save();
    cx.translate(c0+Math.cos(a)*r*0.888,c1+Math.sin(a)*r*0.888);
    cx.rotate(a+Math.PI/2);
    cx.fillText(String(((i+11)%12)+1),0,0);
    cx.restore();
  }

  // 四道贯穿的长规
  cx.strokeStyle=rgba(AC.ink,0.20); cx.lineWidth=1;
  for(i=0;i<4;i++){
    a=rot*0.55+i*Math.PI*0.5;
    cx.beginPath();
    cx.moveTo(c0+Math.cos(a)*r*0.548,c1+Math.sin(a)*r*0.548);
    cx.lineTo(c0+Math.cos(a)*r*1.055,c1+Math.sin(a)*r*1.055);
    cx.stroke();
  }

  // 走带弧 + 指针
  cx.strokeStyle=rgba(AC.ink,0.46); cx.lineWidth=Math.max(1.3,r*0.007);
  cx.beginPath(); cx.arc(c0,c1,r*1.004,-Math.PI/2,-Math.PI/2+prog*6.2832); cx.stroke();

  var na=-Math.PI/2+prog*6.2832+rot*0.35;
  cx.strokeStyle=rgba(AC.ink,0.66); cx.lineWidth=Math.max(1,r*0.0045);
  cx.beginPath();
  cx.moveTo(c0+Math.cos(na+Math.PI)*r*0.20,c1+Math.sin(na+Math.PI)*r*0.20);
  cx.lineTo(c0+Math.cos(na)*r*0.985,c1+Math.sin(na)*r*0.985);
  cx.stroke();
  cx.fillStyle=rgba(AC.ink,0.78);
  cx.beginPath();
  cx.moveTo(c0+Math.cos(na)*r*1.012,c1+Math.sin(na)*r*1.012);
  cx.lineTo(c0+Math.cos(na-0.030)*r*0.930,c1+Math.sin(na-0.030)*r*0.930);
  cx.lineTo(c0+Math.cos(na+0.030)*r*0.930,c1+Math.sin(na+0.030)*r*0.930);
  cx.closePath(); cx.fill();
  cx.beginPath(); cx.arc(c0,c1,Math.max(1.2,r*0.010),0,6.2832); cx.fill();
  cx.restore();
}

/* ---------- 起跳抛物线的虚线 ---------- */
function drawTrail(now){
  var x0=LY.tx, y0=LY.ty-Math.min(10,S.H*0.010);
  var x1=LY.fx+0.240*S.W, y1=LY.fy+0.240*S.H;
  var cxp=LY.fx-0.030*S.W, cyp=LY.fy-0.020*S.H;
  var pts=[],i,t,split=-1;
  function qx(u){ return (1-u)*(1-u)*x0+2*(1-u)*u*cxp+u*u*x1; }
  function qy(u){ return (1-u)*(1-u)*y0+2*(1-u)*u*cyp+u*u*y1; }
  for(i=0;i<=48;i++){ t=i/48; pts.push([qx(t),qy(t)]); }
  if(PL.wave){
    for(i=0;i<pts.length;i++){
      var cxw=Math.min(1,Math.max(0,pts[i][0]/S.W));
      if(pts[i][1]>crestY(cxw)+S.H*0.004){ split=i; break; }
    }
  }
  cx.save();
  cx.lineWidth=Math.max(1,S.H*0.0014);
  cx.setLineDash([S.W*0.0035,S.W*0.006]);
  cx.lineDashOffset=S.rm?0:(-(now/60)%100);
  // 水面之上：墨色虚线
  cx.strokeStyle=rgba(AC.ink,0.26);
  cx.beginPath(); cx.moveTo(pts[0][0],pts[0][1]);
  var end=(split<0?pts.length-1:split);
  for(i=1;i<=end;i++) cx.lineTo(pts[i][0],pts[i][1]);
  cx.stroke();
  // 没入水面之下：翻成纸上留白，才看得见
  if(split>0&&split<pts.length-1){
    cx.strokeStyle=rgba(AC.paper,0.42);
    cx.beginPath(); cx.moveTo(pts[split][0],pts[split][1]);
    for(i=split+1;i<pts.length;i++) cx.lineTo(pts[i][0],pts[i][1]);
    cx.stroke();
  }
  cx.setLineDash([]);
  cx.restore();
  // 幾道速度短线
  cx.save();
  cx.strokeStyle=rgba(AC.ink,0.30);
  for(i=0;i<3;i++){
    var u=0.50+i*0.11, mx=qx(u), my=qy(u);
    cx.beginPath(); cx.moveTo(mx,my); cx.lineTo(mx-S.W*0.013,my+S.H*0.007); cx.stroke();
  }
  cx.restore();
  // 入水的一点爆裂：翻成纸白，别在墨里消失
  if(split>0){
    var ex=pts[pts.length-1][0], ey=pts[pts.length-1][1], k;
    cx.save();
    cx.strokeStyle=rgba(AC.paper,0.46); cx.lineWidth=Math.max(1,S.H*0.0016);
    for(k=0;k<8;k++){
      var a2=-1.15+k*0.30+(S.rm?0:Math.sin(now/700+k)*0.05);
      var rr=S.H*(0.012+((k*7)%5)*0.0022);
      cx.beginPath();
      cx.moveTo(ex+Math.cos(a2)*rr*0.35, ey+Math.sin(a2)*rr*0.30);
      cx.lineTo(ex+Math.cos(a2)*rr, ey+Math.sin(a2)*rr*0.62);
      cx.stroke();
    }
    cx.restore();
  }
}

/* ---------- 人 ---------- */
function drawFigureLayer(now,surge){
  if(!PL.fig) return;
  var wob=S.rm?0:Math.sin(now/1500)*0.013;
  cx.save();
  cx.translate(LY.fx,LY.fy-surge*0.62);
  cx.rotate(LY.rot+wob);
  cx.drawImage(PL.fig.c,-PL.fig.w*0.5,-PL.fig.h*0.5,PL.fig.w,PL.fig.h);
  cx.restore();
}

/* ---------- 版口、裁切线、刊记 ---------- */
function label(str,x,y,size,alpha,align,track,col){
  if(!str) return;
  cx.save();
  cx.font='600 '+size.toFixed(1)+'px "Times New Roman",Georgia,"Songti SC",serif';
  cx.fillStyle=rgba(col||AC.ink,alpha); cx.textAlign=align||'left'; cx.textBaseline='middle';
  try{ if('letterSpacing' in cx) cx.letterSpacing=(track||0)+'px'; }catch(e){}
  cx.fillText(str,x,y);
  cx.restore();
}
function fitStr(str,maxW,size){
  if(!str) return '';
  var s=str, guard=0;
  while(guard++<40){
    cx.font='600 '+size.toFixed(1)+'px "Times New Roman",Georgia,"Songti SC",serif';
    if(cx.measureText(s).width<=maxW) break;
    if(s.length<=1) break;
    s=s.slice(0,-1);
  }
  return s===str?str:s.replace(/.$/,'…');
}
function fmtTime(sec){
  sec=Math.max(0,num(sec,0));
  var m=Math.floor(sec/60), s=Math.floor(sec%60);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function drawMeta(){
  var w=S.W,h=S.H, m=Math.max(10,Math.min(w,h)*0.032);
  cx.save();
  cx.strokeStyle=rgba(AC.ink,0.15); cx.lineWidth=1;
  cx.strokeRect(m,m*0.70,w-m*2,h-m*1.40);
  // 裁切角标
  var L=Math.min(w,h)*0.020;
  cx.strokeStyle=rgba(AC.ink,0.42); cx.lineWidth=1;
  var cxs=[m*0.34,w-m*0.34], cys=[m*0.24,h-m*0.24], i,j;
  for(i=0;i<2;i++) for(j=0;j<2;j++){
    var x=cxs[i], y=cys[j], sx=i?-1:1, sy=j?-1:1;
    cx.beginPath();
    cx.moveTo(x+sx*L,y); cx.lineTo(x,y); cx.lineTo(x,y+sy*L);
    cx.stroke();
  }
  // 刊记：贴一张灰卡小标签，和瓦楞纸底形成两种材料
  var fs=Math.max(9,Math.min(15,Math.min(w,h)*0.0145));
  var chipW=Math.min(w*0.245,fs*13.2), chipH=fs*3.15;
  var chipX=m*1.15, chipY=m*0.95, onChip=false;
  if(TEX.grey.ok){
    cx.save();
    cx.translate(chipX,chipY); cx.rotate(-0.009);
    try{
      cx.drawImage(TEX.grey.img,0,0,chipW,chipH);
      cx.strokeStyle=rgba(AC.ink,0.34); cx.lineWidth=1;
      cx.strokeRect(0.5,0.5,chipW-1,chipH-1);
      onChip=true;
    }catch(e){}
    cx.restore();
  }
  var tcol=onChip?AC.paper:AC.ink;
  label('木刻跃浪',chipX+fs*0.82,chipY+chipH*0.37,fs*1.20,onChip?0.94:0.80,'left',1.6,tcol);
  label('340 · 36/50 · WOODCUT',chipX+fs*0.82,chipY+chipH*0.75,fs*0.64,onChip?0.58:0.46,'left',1.5,tcol);
  var rightX=w-m*1.6;
  var title=S.songName?fitStr(S.songName,w*0.34,fs*0.92):'';
  label(title||'未知曲目',rightX,m*1.42,fs*0.92,0.66,'right',0.6);
  var sub=(S.artistsLine||'');
  label(fitStr(sub,w*0.34,fs*0.78),rightX,m*1.42+fs*1.1,fs*0.78,0.42,'right',0.6);
  label(fmtTime(S.t)+' / '+(S.dur>0?fmtTime(S.dur):'--:--'),
        rightX,m*1.42+fs*2.15,fs*0.80,0.40,'right',1.0);
  if(S.live.bpm>0){
    label(Math.round(S.live.bpm)+' BPM',rightX,m*1.42+fs*3.05,fs*0.66,0.32,'right',1.4);
  }
  // 版次小注
  if(S.lines.length){
    label('对此打印之版 · NO.'+String(Math.max(1,S.idx+1)).padStart(2,'0'),
          chipX,chipY+chipH+fs*0.95,fs*0.60,0.26,'left',1.2);
  }
  cx.restore();
}

/* ---------- 墨迹残破：交给上层 CSS（mix-blend-mode），不占 JS 预算 ---------- */

window.__stage=function(){
  return {lines:S.lines.length,idx:S.idx,t:S.t,playing:S.playing,frames:S.frames,
          js:S.js,err:S.err,text:S.text,gl:false,rm:S.rm};
};

function frame(now){
  var t0=performance.now();
  if(!now) now=t0;
  S.frames++;
  try{
    if(platesDirty) buildPlates();
    var i=findIdx(S.t);
    if(i!==S.idx){ S.idx=i; renderLine(); }
    if(units.length) applyReveal(S.t);
    S.beat*=0.9; if(S.beat<0.002) S.beat=0;

    if(PL.paper){
      cx.drawImage(PL.paper.c,0,0,PL.paper.w,PL.paper.h,0,0,S.W,S.H);
    }else{
      cx.fillStyle=rgb(AC.paper); cx.fillRect(0,0,S.W,S.H);
    }

    var bass=S.live.bass, pulse=S.beat*S.bev;
    var surge=S.rm?0:(bass*5+pulse*9)*Math.min(1,S.H/900)*(S.playing?1:0.35);
    drawDial(now);
    if(PL.wave){
      cx.save();
      cx.translate(0,-surge*0.5);
      cx.translate(S.W*0.5,S.H*0.62);
      var sc=1+(S.rm?0:(0.006+bass*0.010+pulse*0.010));
      cx.scale(sc,1+(sc-1)*0.6);
      cx.translate(-S.W*0.5,-S.H*0.62);
      cx.drawImage(PL.wave.c,0,0,PL.wave.w,PL.wave.h,0,0,S.W,S.H);
      cx.restore();
    }
    drawTrail(now);
    drawFigureLayer(now,surge);
    drawMeta();
  }catch(e){}
  S.js=performance.now()-t0;
  sendReady();
  requestAnimationFrame(frame);
}

loadTex('kraft'); loadTex('fiber'); loadTex('grey');
resize();
addEventListener('resize',resize);
setTimeout(sendReady,600);
requestAnimationFrame(frame);
})();
</script>
