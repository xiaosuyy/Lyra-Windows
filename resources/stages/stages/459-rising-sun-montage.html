<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>昭和大判</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#f2e2bd}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho","Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;-webkit-font-smoothing:antialiased}
  #poster{position:fixed;inset:0;width:100%;height:100%;display:block}
  #lyr{position:fixed;left:5.5vw;top:5vh;z-index:4;width:min(62vw,920px);display:none;flex-direction:column;align-items:flex-start;justify-content:center;padding:2.2vh 3vw 2.4vh;pointer-events:none;
       background:linear-gradient(180deg,rgba(249,238,214,.96),rgba(240,224,192,.93));
       border:1px solid rgba(24,18,15,.62);
       box-shadow:0 0 0 3px rgba(248,236,211,.32),inset 0 0 0 3px rgba(24,18,15,.09),0 10px 26px rgba(24,18,15,.18)}
  #curText{text-align:left}
  @media (max-aspect-ratio:1/1){#lyr{left:6vw;width:88vw;top:3.6vh;padding:1.8vh 4vw 2vh}}
  #curText{font-size:var(--fs,clamp(23px,5vw,66px));line-height:1.26;letter-spacing:.02em;text-align:center;font-weight:800;max-width:100%;word-break:break-word}
  #curText .c{color:rgba(30,20,14,.55);transition:color .12s linear}
  #curText .c.half{color:rgba(26,18,13,.80)}
  #curText .c.on{color:#140d0a}
  #side{position:fixed;left:0;top:0;bottom:0;z-index:3;width:min(3.4vw,46px);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:#c3342a;color:#f6e9cd;writing-mode:vertical-rl;
        font-size:clamp(10px,1.15vw,14px);letter-spacing:.4em;pointer-events:none;
        box-shadow:inset -2px 0 0 rgba(24,18,15,.55)}
  @media (max-width:760px){#side{display:none}}
  #topline{position:fixed;left:0;right:0;top:0;height:6px;z-index:5;background:#18120f}
  #rule{margin-top:1.6vh;height:3px;width:100%;background:rgba(23,16,13,.20);transform-origin:0 50%;transform:scaleX(0)}
  #rule i{display:block;height:100%;background:#c33227}
  #nextText{margin-top:1.5vh;font-size:clamp(11px,1.35vw,16px);color:rgba(23,16,13,.62);letter-spacing:.14em;text-align:left;max-width:100%}
  #empty{position:fixed;left:0;right:0;top:38%;z-index:3;text-align:center;color:rgba(24,18,15,.62);font-size:clamp(14px,2vw,24px);letter-spacing:.42em;display:none}
  #empty small{display:block;margin-top:1.6vh;font-size:.44em;letter-spacing:.5em;color:rgba(24,18,15,.42)}
</style>
</head>
<body>
<canvas id="poster"></canvas>
<div id="side">歌 舞 伎 大 判 · 浮 世 蒙 太 奇</div>
<div id="lyr">
  <div id="curText"></div>
  <div id="rule"><i></i></div>
  <div id="nextText"></div>
</div>
<div id="empty">此 曲 无 词<small>INSTRUMENTAL</small></div>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('poster');
  var ctx = cv.getContext('2d');
  var elCur = document.getElementById('curText');
  var elNext = document.getElementById('nextText');
  var elEmpty = document.getElementById('empty');
  var elRule = document.getElementById('rule');
  var elRuleIn = elRule.firstElementChild;
  var elLyr = document.getElementById('lyr');

  var W = 1440, H = 900, dpr = 1;
  var rm = false;
  try { rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { console.error(e); }

  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, text: '', title: '', meta: '' };
  var gotInit = false;
  var lastBandAt = 0;

  window.__stage = function () {
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: '', text: S.text, gl: false, rm: rm
    };
  };

  /* ---------- palette ---------- */
  var A = [201, 60, 44];
  var P = {
    verm: [198, 52, 42], ink: [24, 18, 15], cream: [246, 233, 205],
    indigo: [24, 48, 76], gold: [224, 172, 52]
  };
  var ACC_DARK = [160, 40, 34], ACC_LIGHT = [232, 108, 72];

  function cch(v) { return v < 0 ? 0 : v > 255 ? 255 : Math.round(v); }
  function rgb(c, a) { return a == null ? 'rgb(' + cch(c[0]) + ',' + cch(c[1]) + ',' + cch(c[2]) + ')' : 'rgba(' + cch(c[0]) + ',' + cch(c[1]) + ',' + cch(c[2]) + ',' + a + ')'; }
  function lum(c) { return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
  function mix(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function setAccent(rgbv) {
    var a = rgbv;
    var ok = Object.prototype.toString.call(a) === '[object Array]' || (a && typeof a.length === 'number');
    if (ok && a.length >= 3) {
      var r = +a[0], g = +a[1], b = +a[2];
      if (isFinite(r) && isFinite(g) && isFinite(b)) {
        A = [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
      }
    }
    var l = lum(A);
    ACC_DARK = l > 0.42 ? mix(A, P.ink, 0.62) : mix(A, P.ink, 0.18);
    ACC_LIGHT = l < 0.3 ? mix(A, [255, 245, 225], 0.42) : mix(A, [255, 245, 225], 0.22);
    if (Math.abs(lum(ACC_DARK) - lum(ACC_LIGHT)) < 0.06) { ACC_DARK = mix(A, P.ink, 0.5); ACC_LIGHT = mix(A, [255, 250, 235], 0.3); }
  }
  setAccent(A);

  /* ---------- static layers ---------- */
  var paperCv = document.createElement('canvas');
  var bandCv = document.createElement('canvas');
  var sunGrad = null, vigGrad = null;
  var rayA = null, rayB = null;
  var SUN = { x: 0, y: 0, r: 0 };
  var BAND = { y: 0, h: 0 };
  var bandSeed = -999, bandT = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function buildPaper() {
    paperCv.width = Math.max(1, Math.round(W));
    paperCv.height = Math.max(1, Math.round(H));
    var p = paperCv.getContext('2d');
    p.fillStyle = rgb(P.cream); p.fillRect(0, 0, W, H);

    // warm blotches
    var g1 = p.createRadialGradient(W * 0.22, H * 0.18, 0, W * 0.22, H * 0.18, Math.max(W, H) * 0.7);
    g1.addColorStop(0, 'rgba(226,198,150,.55)'); g1.addColorStop(1, 'rgba(226,198,150,0)');
    p.fillStyle = g1; p.fillRect(0, 0, W, H);
    var g2 = p.createRadialGradient(W * 0.82, H * 0.8, 0, W * 0.82, H * 0.8, Math.max(W, H) * 0.6);
    g2.addColorStop(0, 'rgba(190,170,132,.4)'); g2.addColorStop(1, 'rgba(190,170,132,0)');
    p.fillStyle = g2; p.fillRect(0, 0, W, H);

    // halftone dots (baked)
    var step = Math.max(7, Math.round(Math.min(W, H) / 110));
    var dots = 0, maxDots = 9000;
    p.fillStyle = 'rgba(24,18,15,.13)';
    for (var y = step; y < H && dots < maxDots; y += step) {
      for (var x = step; x < W && dots < maxDots; x += step) {
        var d = Math.hypot((x - W * 0.5) / (W * 0.5), (y - H * 0.62) / (H * 0.62));
        var a = clamp(1 - d, 0, 1);
        if (a <= 0.04) continue;
        var r = step * 0.16 * (0.5 + a);
        p.beginPath(); p.arc(x, y, r, 0, 6.2832); p.fill();
        dots++;
      }
    }
    // fibre speckle
    var rnd = mulberry32(45901), n = Math.min(2600, Math.round(W * H / 620));
    for (var i = 0; i < n; i++) {
      var sx = rnd() * W, sy = rnd() * H, sw = 1 + rnd() * 2.2;
      p.fillStyle = rnd() > 0.5 ? 'rgba(120,96,64,.10)' : 'rgba(255,250,232,.24)';
      p.fillRect(sx, sy, sw, sw * (0.5 + rnd()));
    }
    // fold lines
    p.strokeStyle = 'rgba(140,116,80,.16)'; p.lineWidth = 1;
    for (var k = 1; k <= 2; k++) {
      p.beginPath(); p.moveTo(0, H * k / 3); p.lineTo(W, H * k / 3); p.stroke();
    }
    p.beginPath(); p.moveTo(W * 0.5, 0); p.lineTo(W * 0.5, H); p.stroke();
  }

  var rayGradA = null, rayGradB = null, ringGrad = null;
  var WAVE = { base: 0, amp: 0 };

  function buildRays() {
    SUN.x = W * 0.685;
    SUN.y = H * 0.615;
    SUN.r = Math.min(W, H) * 0.275;
    WAVE.base = H * 0.705;
    WAVE.amp = H * 0.032;
    var cx = SUN.x, cy = SUN.y;
    var R = Math.hypot(W, H) * 1.15;
    var N = 18, oa = -Math.PI / 2, stepA = Math.PI * 2 / N;
    rayA = new Path2D(); rayB = new Path2D();
    for (var i = 0; i < N; i++) {
      var a0 = oa + stepA * i, a1 = a0 + stepA * 0.56;
      var pth = (i % 2 === 0) ? rayA : rayB;
      pth.moveTo(cx, cy);
      pth.arc(cx, cy, R, a0, a1);
      pth.closePath();
    }
    var ry = cy - Math.min(W, H) * 0.5, ry2 = cy + H * 0.1;
    rayGradA = ctx.createLinearGradient(0, ry, 0, ry2);
    rayGradA.addColorStop(0, rgb(P.verm, 0));
    rayGradA.addColorStop(0.42, rgb(P.verm, 0.28));
    rayGradA.addColorStop(1, rgb(P.verm, 0.82));
    rayGradB = ctx.createLinearGradient(0, ry, 0, ry2);
    rayGradB.addColorStop(0, rgb(P.indigo, 0));
    rayGradB.addColorStop(0.5, rgb(P.indigo, 0.06));
    rayGradB.addColorStop(1, rgb(P.indigo, 0.26));
    sunGrad = ctx.createRadialGradient(cx - SUN.r * 0.34, cy - SUN.r * 0.4, SUN.r * 0.08, cx, cy, SUN.r * 1.12);
    sunGrad.addColorStop(0, rgb(ACC_LIGHT));
    sunGrad.addColorStop(0.62, rgb(mix(A, ACC_DARK, 0.55)));
    sunGrad.addColorStop(1, rgb(ACC_DARK));

    vigGrad = ctx.createRadialGradient(W * 0.5, H * 0.52, Math.min(W, H) * 0.36, W * 0.5, H * 0.52, Math.hypot(W, H) * 0.62);
    vigGrad.addColorStop(0, 'rgba(30,20,14,0)');
    vigGrad.addColorStop(1, 'rgba(30,20,14,.30)');

    BAND.h = Math.max(64, H * 0.145);
    BAND.y = H - BAND.h;
    bandCv.width = Math.max(1, Math.round(W));
    bandCv.height = Math.max(1, Math.round(BAND.h));
    bandSeed = -999;
  }

  function buildBands(seed) {
    var bh = Math.max(1, Math.round(BAND.h));
    if (bandCv.height !== bh) { bandCv.height = bh; }
    var p = bandCv.getContext('2d');
    p.clearRect(0, 0, W, bh);
    var rnd = mulberry32(seed * 7919 + 13);
    var cols = [P.ink, P.cream, ACC_DARK, P.verm, P.gold, P.indigo, mix(A, P.cream, 0.55)];
    var y = 0, guard = 0;
    while (y < bh && guard < 40) {
      var h = Math.max(6, bh * (0.12 + rnd() * 0.26));
      if (y + h > bh) h = bh - y;
      var c = cols[Math.floor(rnd() * cols.length)];
      var onCream = lum(c) > 0.55;
      p.fillStyle = rgb(c);
      p.fillRect(0, y, W, h);
      // marks inside band
      var marks = 3 + Math.floor(rnd() * 7);
      for (var m = 0; m < marks; m++) {
        var mx = rnd() * W, mw = 4 + rnd() * Math.min(90, W * 0.09);
        p.fillStyle = onCream ? 'rgba(24,18,15,.55)' : 'rgba(246,233,205,.62)';
        var kind = rnd();
        if (kind < 0.5) p.fillRect(mx, y + h * 0.34, mw, Math.max(2, h * 0.16));
        else if (kind < 0.78) { p.beginPath(); p.arc(mx, y + h * 0.5, Math.max(3, h * 0.16), 0, 6.2832); p.fill(); }
        else p.fillRect(mx, y + h * 0.25, Math.max(3, h * 0.3), Math.max(3, h * 0.3));
      }
      y += h; guard++;
    }
    // vertical separators, silkscreen feel
    p.fillStyle = 'rgba(246,233,205,.18)';
    for (var v = 1; v < 6; v++) p.fillRect(W * v / 6, 0, 1, bh);
    bandSeed = seed;
  }

  /* ---------- dynamic drawing ---------- */
  var pulse = 0, bass = 0, mid = 0, lvl = 0;

  function drawRays(t) {
    if (!rayA) return;
    var rot = rm ? 0 : (t * 0.045);
    ctx.save();
    ctx.translate(SUN.x, SUN.y); ctx.rotate(rot); ctx.translate(-SUN.x, -SUN.y);
    ctx.globalAlpha = 0.9 + pulse * 0.1;
    ctx.fillStyle = rayGradA;
    ctx.fill(rayA);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = rayGradB;
    ctx.fill(rayB);
    ctx.restore();
  }

  function drawSun(t) {
    var r = SUN.r * (1 + pulse * 0.035 + bass * 0.02);
    ctx.save();
    ctx.beginPath(); ctx.arc(SUN.x, SUN.y, r, 0, 6.2832); ctx.fillStyle = sunGrad; ctx.fill();
    // ink rim
    ctx.lineWidth = Math.max(2, r * 0.022);
    ctx.strokeStyle = rgb(P.ink, 0.78);
    ctx.stroke();
    // inner ring
    ctx.beginPath(); ctx.arc(SUN.x, SUN.y, r * 0.79, 0, 6.2832);
    ctx.lineWidth = Math.max(1, r * 0.012); ctx.strokeStyle = rgb(P.cream, 0.55); ctx.stroke();
    // horizontal slats, like a woodblock sky
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = rgb(P.cream);
    var slat = Math.max(7, r * 0.075);
    for (var y = SUN.y - r + slat; y < SUN.y + r; y += slat * 2) {
      var dy = y - SUN.y, hh = Math.min(slat * 0.55, r * 0.4);
      var wd = Math.sqrt(Math.max(0, r * r - dy * dy));
      ctx.fillRect(SUN.x - wd, y, wd * 2, hh);
    }
    ctx.restore();
  }

  function wavePath(baseY, amp, phase, t) {
    ctx.beginPath();
    ctx.moveTo(-10, H + 10);
    ctx.lineTo(-10, baseY);
    var seg = 16, i, x, y;
    for (i = 0; i <= seg; i++) {
      x = -10 + (W + 20) * i / seg;
      y = baseY - Math.sin(i * 0.55 + phase + (rm ? 0 : t * 0.55)) * amp
               - Math.sin(i * 1.31 + phase * 1.7 + (rm ? 0 : t * 0.31)) * amp * 0.34;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 10, H + 10);
    ctx.closePath();
    return baseY;
  }

  function drawFuji(t) {
    var baseY = H * 0.742, apexY = H * 0.556;
    var halfW = Math.min(W * 0.34, H * 0.46);
    var cx = W * 0.30;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - halfW, baseY);
    ctx.lineTo(cx - halfW * 0.16, apexY + H * 0.012);
    ctx.quadraticCurveTo(cx - halfW * 0.06, apexY, cx, apexY);
    ctx.quadraticCurveTo(cx + halfW * 0.09, apexY + H * 0.004, cx + halfW * 0.18, apexY + H * 0.02);
    ctx.lineTo(cx + halfW, baseY);
    ctx.closePath();
    var fg = ctx.createLinearGradient(0, apexY, 0, baseY);
    fg.addColorStop(0, rgb(mix(P.indigo, P.cream, 0.10)));
    fg.addColorStop(0.35, rgb(P.indigo));
    fg.addColorStop(1, rgb(mix(P.indigo, P.ink, 0.45)));
    ctx.fillStyle = fg;
    ctx.fill();
    // snow cap, jagged
    ctx.beginPath();
    ctx.moveTo(cx - halfW * 0.24, apexY + H * 0.058);
    var j, jx, jy, segs = 9;
    for (j = 0; j <= segs; j++) {
      jx = cx - halfW * 0.24 + halfW * 0.48 * j / segs;
      jy = apexY + H * (j % 2 ? 0.036 : 0.066);
      ctx.lineTo(jx, jy);
    }
    ctx.lineTo(cx + halfW * 0.16, apexY + H * 0.012);
    ctx.quadraticCurveTo(cx, apexY, cx - halfW * 0.16, apexY + H * 0.012);
    ctx.closePath();
    ctx.fillStyle = rgb(P.cream, 0.94);
    ctx.fill();
    ctx.lineWidth = Math.max(1.4, H * 0.0026);
    ctx.strokeStyle = rgb(P.ink, 0.7);
    ctx.stroke();
    ctx.restore();
  }

  function drawWaves(t) {
    var baseY = WAVE.base;
    var amp = WAVE.amp * (1 + pulse * 0.35);
    var layers = [
      { y: baseY + H * 0.045, a: amp * 0.9, ph: 0.4, c: mix(P.indigo, P.cream, 0.30) },
      { y: baseY + H * 0.105, a: amp * 1.25, ph: 2.1, c: P.indigo },
      { y: baseY + H * 0.175, a: amp * 0.8, ph: 4.0, c: mix(P.indigo, P.ink, 0.55) }
    ];
    ctx.save();
    for (var i = 0; i < layers.length; i++) {
      var L = layers[i];
      wavePath(L.y, L.a, L.ph, t);
      ctx.fillStyle = rgb(L.c);
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, H * 0.0035);
      ctx.strokeStyle = rgb(P.cream, i === 1 ? 0.85 : 0.45);
      ctx.stroke();
    }
    // foam beads on the crest
    ctx.fillStyle = rgb(P.cream, 0.9);
    var seg = 16;
    for (var k = 1; k < seg; k += 2) {
      var x = -10 + (W + 20) * k / seg;
      var yy = baseY + H * 0.105 - Math.sin(k * 0.55 + 2.1 + (rm ? 0 : t * 0.55)) * amp * 1.25
               - Math.sin(k * 1.31 + 2.1 * 1.7 + (rm ? 0 : t * 0.31)) * amp * 1.25 * 0.34;
      var rr = Math.max(2.5, H * 0.006 * (0.8 + pulse * 0.5));
      ctx.beginPath(); ctx.arc(x, yy - rr * 0.4, rr, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawSeal(t) {
    var s = Math.min(W, H) * 0.115;
    var x = W - s * 1.55, y = H - BAND.h - s * 0.55;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-0.045);
    ctx.fillStyle = rgb(P.verm, 0.96);
    ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = rgb(P.cream, 0.8); ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.strokeRect(s * 0.09, s * 0.09, s * 0.82, s * 0.82);
    ctx.fillStyle = rgb(P.cream);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(s * 0.44) + 'px serif';
    ctx.fillText('大', s * 0.5, s * 0.36);
    ctx.fillText('判', s * 0.5, s * 0.68);
    ctx.restore();
  }

  function drawCorners() {
    var m = Math.min(W, H) * 0.052, ln = m * 0.5;
    ctx.save();
    ctx.strokeStyle = rgb(P.ink, 0.55); ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.0018);
    var pts = [[m, m], [W - m, m], [m, H - m], [W - m, H - m]];
    for (var i = 0; i < 4; i++) {
      var px = pts[i][0], py = pts[i][1];
      ctx.beginPath(); ctx.moveTo(px - ln, py); ctx.lineTo(px + ln, py);
      ctx.moveTo(px, py - ln); ctx.lineTo(px, py + ln); ctx.stroke();
      ctx.beginPath(); ctx.arc(px, py, ln * 0.42, 0, 6.2832); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- montage: cut-paper disc + cover card + halftone arc ---------- */
  var coverImg = null, coverOk = false, coverTried = false;
  var DISC = { x: 0, y: 0, r: 0 };
  var discCv = document.createElement('canvas');
  var discDirty = true;

  function loadCover(url) {
    coverTried = true; coverOk = false; coverImg = null; discDirty = true;
    if (!url || typeof url !== 'string') return;
    try {
      var im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = function () {
        try {
          if (im.naturalWidth > 0) { coverImg = im; coverOk = true; discDirty = true; buildDisc(); }
        } catch (e) { console.error('[459] cover', e); }
      };
      im.onerror = function () { coverOk = false; coverImg = null; };
      im.src = url;
    } catch (e) { console.error('[459] cover load', e); }
  }

  function buildDisc() {
    discDirty = false;
    if (W < 620) return;
    var r = Math.min(W, H) * 0.122;
    var pad = Math.ceil(r * 1.22);
    discCv.width = Math.max(1, Math.round(pad * 2));
    discCv.height = Math.max(1, Math.round(pad * 2));
    var x = pad, y = pad;
    DISC.x = W * 0.895; DISC.y = H * 0.325; DISC.r = r;
    var c = discCv.getContext('2d');
    c.clearRect(0, 0, discCv.width, discCv.height);
    c.setLineDash([]);
    // torn paper backing
    c.beginPath();
    var j, a, rr;
    for (j = 0; j <= 26; j++) {
      a = Math.PI * 2 * j / 26;
      rr = r * (1.06 + ((j * 37 % 11) / 11 - 0.5) * 0.11);
      if (j === 0) c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      else c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath();
    c.fillStyle = rgb(P.cream, 0.95); c.fill();
    c.lineWidth = Math.max(1.5, r * 0.02); c.strokeStyle = rgb(P.ink, 0.85); c.stroke();

    // photo / cover face, or printed fallback
    c.save();
    c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.clip();
    if (coverOk && coverImg) {
      c.drawImage(coverImg, x - r, y - r, r * 2, r * 2);
      c.fillStyle = rgb(ACC_DARK, 0.28); c.fillRect(x - r, y - r, r * 2, r * 2);
    } else {
      var sg = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
      sg.addColorStop(0, rgb(P.gold)); sg.addColorStop(0.55, rgb(ACC_DARK)); sg.addColorStop(1, rgb(mix(A, P.ink, 0.5)));
      c.fillStyle = sg; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // coarse halftone over the photo
    c.fillStyle = 'rgba(246,233,205,.28)';
    var st = Math.max(4, r * 0.115);
    for (var yy = y - r; yy < y + r; yy += st) {
      for (var xx = x - r; xx < x + r; xx += st) {
        if (Math.hypot(xx - x, yy - y) / r > 1) continue;
        c.beginPath(); c.arc(xx + st * 0.5, yy + st * 0.5, st * 0.20, 0, 6.2832); c.fill();
      }
    }
    c.restore();

    // vermilion ring
    c.beginPath(); c.arc(x, y, r, 0, 6.2832);
    c.lineWidth = Math.max(2, r * 0.055); c.strokeStyle = rgb(P.verm, 0.95); c.stroke();
    c.beginPath(); c.arc(x, y, r * 0.995, 0, 6.2832);
    c.lineWidth = Math.max(1, r * 0.012); c.strokeStyle = rgb(P.cream, 0.6); c.stroke();

    // caption block, left of the disc
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillStyle = rgb(P.ink, 0.72);
    c.font = '700 ' + Math.round(r * 0.2) + 'px serif';
    c.fillText('浮世', x - r * 1.24, y + r * 0.40);
    c.fillText('写生', x - r * 1.24, y + r * 0.62);
  }

  function drawDisc() {
    if (W < 620 || !discCv.width || discDirty) return;
    ctx.drawImage(discCv, DISC.x - discCv.width / 2, DISC.y - discCv.height / 2);
  }

  function drawClaw(t) {
    // Hokusai foam claws at the right crest
    var baseY = WAVE.base;
    var amp = WAVE.amp * (1 + pulse * 0.35);
    var sw = rm ? 0 : Math.sin(t * 0.55);
    ctx.save();
    ctx.strokeStyle = rgb(P.cream, 0.92);
    ctx.lineWidth = Math.max(2, H * 0.005);
    ctx.lineCap = 'round';
    var cx = W * 0.80, cy = baseY + H * 0.048 - amp * 0.7 + sw * H * 0.004;
    var arms = 5;
    for (var i = 0; i < arms; i++) {
      var k = i / (arms - 1) - 0.5;
      var len = H * (0.055 + 0.03 * (1 - Math.abs(k) * 1.4));
      ctx.beginPath();
      ctx.moveTo(cx + k * W * 0.05, cy);
      ctx.quadraticCurveTo(cx + k * W * 0.075, cy - len * 0.7, cx + k * W * 0.10, cy - len);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + k * W * 0.10, cy - len, Math.max(2, H * 0.005), 0, 6.2832);
      ctx.fillStyle = rgb(P.cream, 0.92); ctx.fill();
    }
    ctx.restore();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(paperCv, 0, 0, W, H);
    drawRays(t);
    drawSun(t);
    drawFuji(t);
    drawWaves(t);
    var seed = Math.floor(t / 0.72);
    if (seed !== bandSeed) {
      try { buildBands(seed); } catch (e) { console.error('[459] band', e); bandSeed = seed; }
    }
    ctx.drawImage(bandCv, 0, BAND.y, W, BAND.h);
    ctx.fillStyle = 'rgba(246,233,205,.55)';
    ctx.fillRect(0, BAND.y, W, Math.max(1, H * 0.0022));
    drawSeal(t);
    drawCorners();
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, W, H);
    drawDisc();
    drawClaw(t);
  }

  /* ---------- poster imprint ---------- */
  var imprintKey = '';
  function imprint() {
    var u = Math.min(W, H);
    ctx.save();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgb(P.cream, 0.82);
    ctx.font = '700 ' + Math.round(u * 0.023) + 'px serif';
    ctx.fillText('昭 和 大 判', u * 0.072, BAND.y + BAND.h * 0.30);
    ctx.font = '400 ' + Math.round(u * 0.0155) + 'px serif';
    ctx.fillStyle = rgb(P.cream, 0.58);
    ctx.fillText('SHOWA GRAND PRINT · No.459', u * 0.072, BAND.y + BAND.h * 0.64);

    // song credit on the band, right aligned, shrunk to fit once
    var label = IMPRINT_LABEL;
    if (!label) { ctx.restore(); return; }
    ctx.font = '700 ' + IMPRINT_FS + 'px serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = rgb(P.cream, 0.86);
    ctx.fillText(label, W - u * 0.075, BAND.y + BAND.h * 0.47);
    ctx.restore();
  }

  var IMPRINT_LABEL = '', IMPRINT_FS = 14;
  function layoutImprint() {
    var u = Math.min(W, H);
    var label = (S.title ? S.title : '无题') + (S.meta ? ' — ' + S.meta : '');
    var maxW = W * 0.52, fs = Math.round(u * 0.0195);
    ctx.font = '700 ' + fs + 'px serif';
    var tw = ctx.measureText(label).width, guard = 0;
    while (tw > maxW && fs > 9 && guard < 24) { fs -= 1; ctx.font = '700 ' + fs + 'px serif'; tw = ctx.measureText(label).width; guard++; }
    if (tw > maxW) {
      var cut = label.length, g2 = 0;
      while (cut > 1 && tw > maxW && g2 < 60) { cut--; label = label.slice(0, cut) + '…'; tw = ctx.measureText(label).width; g2++; }
    }
    IMPRINT_LABEL = label; IMPRINT_FS = fs;
  }

  /* ---------- lyric layer ---------- */
  var curSpans = [], charT = [], spanState = [], paintedKey = '\u0000', lyricFont = 0;

  function fitText(tx) {
    // one size per line, measured against the real paper card so nothing spills
    var pad = Math.min(W * 0.05, 44);
    var cardW = 0;
    try { cardW = elLyr.clientWidth || 0; } catch (e) { cardW = 0; }
    if (!(cardW > 40)) cardW = Math.min(W * 0.62, 920);
    var boxW = Math.max(140, cardW - pad * 2);
    var boxH = Math.max(64, Math.min(H * 0.26, 300));
    var n = Math.max(1, tx.length);
    var size = clamp(Math.min(boxW / 8.5, boxH / 1.35), 15, 60);
    var guard = 0, per, linesN;
    while (guard < 26) {
      per = Math.max(1, Math.floor(boxW / size));
      linesN = Math.ceil(n / per);
      if (linesN <= 3 && linesN * size * 1.26 <= boxH) break;
      size *= 0.9; guard++;
    }
    return Math.max(13, Math.round(size));
  }

  function paintText() {
    var ln = (S.idx >= 0 && S.idx < S.lines.length) ? S.lines[S.idx] : null;
    var ghost = false;
    if (!ln && S.idx < 0 && S.lines.length) { ln = S.lines[0]; ghost = true; }
    var tx = ln ? (ln.text || '') : '';
    var key = S.idx + (ghost ? 'g' : '') + '\u0001' + tx;
    if (key === paintedKey) return;
    paintedKey = key;
    S.text = ghost ? '' : tx;

    if (!gotInit) { elCur.textContent = ''; elNext.textContent = ''; elEmpty.style.display = 'none'; elLyr.style.display = 'none'; return; }

    elCur.textContent = '';
    curSpans = []; charT = []; spanState = [];
    var n = Math.min(tx.length, 240), i;
    if (!n) {
      elNext.textContent = '';
      elEmpty.style.display = S.lines.length === 0 ? 'block' : 'none';
      elRule.style.transform = 'scaleX(0)';
      elLyr.style.display = 'none';
      return;
    }
    elEmpty.style.display = 'none';
    elLyr.style.display = 'flex';

    lyricFont = tx.length;
    elCur.style.setProperty('--fs', fitText(tx) + 'px');

    var chars = ln.chars, hasY = !!(chars && chars.length) && !ghost;
    var t0 = isFinite(ln.t) ? ln.t : 0;
    if (ghost) t0 = 1e9;
    var dur = isFinite(ln.dur) && ln.dur > 0 ? ln.dur : 0;
    var frag = document.createDocumentFragment();
    for (i = 0; i < n; i++) {
      var ct;
      if (hasY) {
        var ci = chars[i];
        ct = (ci && isFinite(+ci.t)) ? +ci.t : (t0 + (dur ? dur * i / n : i * 0.14));
      } else {
        ct = t0 + (dur ? dur * i / n : i * 0.14);
      }
      var ch = tx.charAt(i);
      var sp = document.createElement('span');
      sp.className = 'c';
      sp.textContent = ch === ' ' ? '\u00a0' : ch;
      frag.appendChild(sp);
      curSpans.push(sp); charT.push(ct); spanState.push(-1);
    }
    elCur.appendChild(frag);

    var nl = S.idx + 1 < S.lines.length ? S.lines[S.idx + 1] : null;
    elNext.textContent = nl && nl.text ? nl.text : '';
  }

  function updateChars() {
    var i, n = curSpans.length, p, st;
    if (S.idx < 0) {
      for (i = 0; i < n; i++) {
        if (spanState[i] !== 0) { curSpans[i].className = 'c'; spanState[i] = 0; }
      }
      elRule.style.transform = 'scaleX(0)';
      return;
    }
    for (i = 0; i < n; i++) {
      if (S.t < charT[i]) { st = 0; }
      else {
        p = (S.t - charT[i]) * 5.5;
        st = p > 1 ? 2 : 1;
      }
      if (st !== spanState[i]) {
        curSpans[i].className = st === 2 ? 'c on' : st === 1 ? 'c half' : 'c';
        spanState[i] = st;
      }
    }
    var ln = (S.idx >= 0 && S.idx < S.lines.length) ? S.lines[S.idx] : null;
    var prog = 0;
    if (ln) {
      var dur = isFinite(ln.dur) && ln.dur > 0 ? ln.dur : 0;
      prog = dur ? clamp((S.t - ln.t) / dur, 0, 1) : (n ? clamp((S.t - charT[0]) * 0.55, 0, 1) : 0);
    }
    elRule.style.transform = 'scaleX(' + prog.toFixed(3) + ')';
    elRuleIn.style.opacity = '1';
  }

  /* ---------- messages ---------- */
  function setLines(lines) {
    var out = [], i, n = Array.isArray(lines) ? Math.min(lines.length, 4000) : 0;
    for (i = 0; i < n; i++) {
      var l = lines[i] || {};
      var tx = l.text == null ? '' : String(l.text);
      out.push({
        t: isFinite(+l.t) ? +l.t : 0,
        dur: isFinite(+l.dur) ? +l.dur : 0,
        text: tx,
        chars: Array.isArray(l.chars) ? l.chars : null
      });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    // fill missing durations from the next line's start, capped so nothing runs forever
    for (i = 0; i < out.length; i++) {
      if (!(out[i].dur > 0)) {
        var nxt = i + 1 < out.length ? out[i + 1].t : out[i].t + 4;
        var d = nxt - out[i].t;
        out[i].dur = clamp(isFinite(d) ? d : 3, 0.4, 12);
      }
    }
    S.lines = out;
    S.idx = -1; S.text = '\u0000'; paintedKey = '\u0000'; lyricFont = -1;
    paintText();
  }

  function findIdx() {
    var lo = 0, hi = S.lines.length - 1, r = -1, m;
    while (lo <= hi) {
      m = (lo + hi) >> 1;
      if (S.lines[m].t <= S.t + 0.0005) { r = m; lo = m + 1; } else hi = m - 1;
    }
    return r;
  }

  function onMsg(d) {
    if (!d || d.__c100 !== 1) return;
    if (d.type === 'init') {
      var p = d.payload || {};
      gotInit = true;
      setAccent(p.accent || A);
      buildPaper(); buildRays(); bandSeed = -999;
      discDirty = true; buildDisc();
      S.t = 0; S.idx = -1;
      if (typeof p.playing === 'boolean') S.playing = p.playing; else S.playing = true;
      setLines(p.lines);
      paintText();
      if (p.song) {
        try {
          var ar = p.song.artists;
          ar = Array.isArray(ar) ? ar.join(' / ') : (ar == null ? '' : String(ar));
          S.meta = ar;
          if (p.song.name) S.title = String(p.song.name); else S.title = '';
          loadCover(p.song.cover);
        } catch (e) { console.error('[459] song', e); }
      }
      draw(0); layoutImprint(); imprint();
    } else if (d.type === 'tick') {
      var tp = d.payload || {};
      if (typeof tp.playing === 'boolean') S.playing = tp.playing;
      if (isFinite(+tp.time)) {
        S.t = +tp.time;
        var target = findIdx();
        if (target !== S.idx) { S.idx = target; paintText(); }
        if (S.idx >= 0) updateChars();
      }
    } else if (d.type === 'beat') {
      var bl = d.payload && +d.payload.level;
      pulse = Math.max(pulse, isFinite(bl) ? clamp(bl, 0, 1) : 0.6);
      var nowMs = performance.now();
      if (nowMs - lastBandAt > 170) { lastBandAt = nowMs; bandSeed = -999; }
    } else if (d.type === 'live') {
      var lp = d.payload || {};
      if (typeof lp.playing === 'boolean') S.playing = lp.playing;
      if (isFinite(+lp.bass)) bass = bass * 0.7 + clamp(+lp.bass, 0, 1) * 0.3;
      if (isFinite(+lp.mid)) mid = mid * 0.7 + clamp(+lp.mid, 0, 1) * 0.3;
      if (isFinite(+lp.level)) lvl = lvl * 0.7 + clamp(+lp.level, 0, 1) * 0.3;
    }
  }

  window.addEventListener('message', function (e) {
    try { onMsg(e.data); } catch (err) { console.error('[459] message error', err); }
  });
  window.addEventListener('resize', function () {
    try { resize(); } catch (err) { console.error('[459] resize error', err); }
  });

  /* ---------- sizing ---------- */
  function resize() {
    var w = Math.round(window.innerWidth || 0), h = Math.round(window.innerHeight || 0);
    if (!w || !h || !isFinite(w) || !isFinite(h)) { w = 1440; h = 900; }
    W = w; H = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * dpr));
    cv.height = Math.max(1, Math.round(H * dpr));
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    buildPaper(); buildRays();
    discDirty = true; buildDisc();
    layoutImprint();
    paintedKey = '\u0000'; lyricFont = -1;
    try { paintText(); } catch (e) { console.error('[459] repaint', e); }
    draw(S.t); imprint();
  }

  /* ---------- loop ---------- */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {
      console.error('[459] ready post failed', e);
      try { window.parent && window.parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e2) { console.error(e2); }
    }
  }

  function frame(ts) {
    var t0 = performance.now();
    S.frames++;
    if (pulse > 0.002) pulse *= 0.93; else pulse = 0;
    if (bass > 0.002) bass *= 0.96; else bass = 0;
    var seed = Math.floor(S.t / 0.72);
    if (seed !== bandSeed) {
      try { buildBands(seed); } catch (e) { console.error('[459] band', e); bandSeed = seed; }
    }
    try { draw(S.t); } catch (e) { console.error('[459] draw', e); }
    try { imprint(); } catch (e3) { console.error('[459] imprint', e3); }
    try { updateChars(); } catch (e2) { console.error('[459] chars', e2); }
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  try {
    setAccent(A);
    resize();
    layoutImprint();
    paintText();
  } catch (e) { console.error('[459] boot', e); }

  requestAnimationFrame(function () {
    sendReady();
    requestAnimationFrame(frame);
  });
  setTimeout(sendReady, 800);
})();
</script>
</body>
</html>
