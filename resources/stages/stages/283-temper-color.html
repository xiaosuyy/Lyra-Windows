<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>烤色</title>
<!--
  机制：一句词是一道焊枪走过的路。字是那块被烧过的钢板 —— 焊道正芯白到发亮，
        外面一圈稻草黄，再外面是已经退成冷青的那一圈；热一走，等温线就一圈圈往外退。
  用了：WebGL2 实例化（10 万颗火星/氧化皮屑/板面亮点）＋ 真三维相机 ＋ 背景着色器全分辨率画字。
        背景对每像素做 **射线→z=0 板面求交**，取世界坐标采样字形纹理的三个通道：
        G = 焊道正芯（最热），R = 稻草黄回火带，B = 退到外沿的冷青圈；
        加起来归一化成温度，量化成五档色阶 —— 等温线一挪，颜色就一道一道往外走。
        钢板本身的痕迹（轧制纹/砂轮划痕/溅上去的焊渣）先立住，字是烧出来的结果。
  镜头：贴着板面滑 —— 13° 几乎趴在板上（色带压成一条亮棱，高光横扫）／
        26° 凑近看回火带上那几道色阶／36° 退远，整排字连着焊道躺在钢板上。
-->
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
       background:radial-gradient(128% 96% at 50% 46%,rgba(0,0,0,0) 28%,rgba(0,0,0,.76) 100%)}
  #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);pointer-events:none;z-index:3;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(178,232,236,.30);transition:opacity .8s;white-space:nowrap}
  #type{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0}
  html.fb #c{display:none}
  html.fb #type{opacity:1;display:flex;align-items:center;justify-content:center}
  html.fb #type .in{font-weight:900;font-size:clamp(30px,6vh,80px);letter-spacing:.10em;
       color:#d8fbf8;text-align:center;text-shadow:0 0 40px rgba(120,240,255,.45)}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="type"><div class="in"></div></div>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   283 · 烤色 —— 钢板 · 焊枪扫过，回火色一圈圈往外退 · 贴着板面滑
   ══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const typeBox = document.getElementById('type');
const typeIn = typeBox.querySelector('.in');
const hint = document.getElementById('hint');
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';

const N = 100000;
let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, beatN = 0, bass = 0, treb = 0;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false;
let inAmt = 0, act = 0, uCut = 0.35, uProgG = 0;

const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;

let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) { RM = !!mq.matches; const onMQ = (e) => { RM = !!e.matches; }; if (mq.addEventListener) mq.addEventListener('change', onMQ); else if (mq.addListener) mq.addListener(onMQ); }
} catch (_) {}

/* ══════════════════════════ 字形纹理（fillText → GPU，不回读） ══════════════════════════ */
const gcv = document.createElement('canvas');
const gctx = gcv.getContext('2d');
const GT = { w: 0, h: 0, box: [-0.7, -0.1, 1.4, 0.35], chars: [], ready: false };
const RAMP_N = 64;
const ramp = new Uint8Array(RAMP_N * 4);
const BOX_W = 1.40;

function bakeText(text) {
  const t = (text || '').trim();
  if (!t) { GT.ready = false; return; }
  const fsPx = 190;
  const font = '900 ' + fsPx + 'px ' + FAMILY;
  gctx.font = font;
  const mt = gctx.measureText(t);
  const pad = Math.round(fsPx * 0.34);
  const w = Math.max(32, Math.ceil(mt.width + pad * 6));
  const h = Math.max(32, Math.ceil(fsPx * 2.45));
  gcv.width = w; gcv.height = h;
  gctx.font = font;
  gctx.textBaseline = 'middle';
  gctx.textAlign = 'left';
  gctx.fillStyle = '#000';
  gctx.fillRect(0, 0, w, h);
  /* 三个通道各管一件事，全用 lighter 往上叠，互不覆盖：
     G = 焊道正芯（最热，白到发亮，窄）—— 整块板上最亮的那一棱。
     R = 稻草黄那一圈回火带（宽，边软 —— 热是往金属里渗的，不是画上去的）。
     B = 已经退到最外沿的冷青圈（更宽更淡），以及溅到旁边还热着的小焊渣。 */
  gctx.globalCompositeOperation = 'lighter';
  gctx.globalAlpha = 1;
  gctx.filter = 'none';
  gctx.lineJoin = 'round';
  gctx.lineCap = 'round';
  const by = Math.round(h * 0.30);
  const x0 = pad;
  const inkBot = by + Math.min(fsPx * 0.47, (mt.actualBoundingBoxDescent || fsPx * 0.44));

  /* 1) 冷圈：热早就退到这儿了。颜色最冷、边界最糊，几乎要贴回钢的本色 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.150) + 'px)';
  gctx.strokeStyle = 'rgba(0,0,255,0.36)';
  gctx.lineWidth = fsPx * 0.62;
  gctx.strokeText(t, x0, by);
  gctx.fillStyle = 'rgba(0,0,255,0.09)';
  gctx.fillText(t, x0, by);

  /* 2) 回火带：那层氧化膜的颜色被压进字里，边上一圈还是软的 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.056) + 'px)';
  gctx.fillStyle = 'rgba(255,0,0,0.42)';
  gctx.fillText(t, x0, by);
  gctx.strokeStyle = 'rgba(255,0,0,0.42)';
  gctx.lineWidth = fsPx * 0.24;
  gctx.strokeText(t, x0, by);

  /* 3) 芯：焊枪最后停在这儿，白到发亮。
        这一条窄亮线是整块板上最热的窄条，色阶全从它往外排。 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.018) + 'px)';
  gctx.fillStyle = 'rgba(0,255,0,0.26)';
  gctx.fillText(t, x0, by);
  gctx.strokeStyle = 'rgba(0,255,0,0.60)';
  gctx.lineWidth = fsPx * 0.068;
  gctx.strokeText(t, x0, by);

  /* 4) 焊渣：崩出去溅在板上、已经氧化成小圆点的那几点；还有几处反光 */
  const nT = Math.max(10, Math.round(mt.width / (fsPx * 0.088)));
  let sd2 = 2166136261;
  for (let k = 0; k < t.length; k++) sd2 = ((sd2 ^ t.charCodeAt(k)) * 16777619) >>> 0;
  const rnd2 = () => { sd2 = (sd2 * 1103515245 + 12345) >>> 0; return sd2 / 4294967296; };
  gctx.filter = 'blur(' + Math.round(fsPx * 0.016) + 'px)';
  for (let i = 0; i < nT; i++) {
    const px = x0 + (0.02 + 0.96 * rnd2()) * mt.width;
    const py = by + (rnd2() - 0.5) * fsPx * 1.30;
    const rr = fsPx * (0.006 + 0.017 * rnd2());
    gctx.fillStyle = 'rgba(255,0,0,' + (0.20 + 0.32 * rnd2()).toFixed(2) + ')';
    gctx.beginPath(); gctx.ellipse(px, py, rr * 1.40, rr, 0, 0, 6.2832); gctx.fill();
  }
  /* 一点锡箔似的反光：灯扫过去才亮，落在字的边沿上 */
  gctx.filter = 'blur(' + Math.round(fsPx * 0.010) + 'px)';
  for (let i = 0; i < 11; i++) {
    const px = x0 + (0.04 + 0.92 * rnd2()) * mt.width;
    const py = inkBot - fsPx * (0.10 + 0.52 * rnd2());
    const rr = fsPx * (0.004 + 0.010 * rnd2());
    gctx.fillStyle = 'rgba(0,255,0,' + (0.26 + 0.30 * rnd2()).toFixed(2) + ')';
    gctx.beginPath(); gctx.arc(px, py, rr, 0, 6.2832); gctx.fill();
  }
  gctx.filter = 'none';
  gctx.globalCompositeOperation = 'source-over';

  const arr = Array.from(t);
  const chars = [];
  let acc = 0;
  for (const ch of arr) {
    const cw = gctx.measureText(ch).width;
    chars.push({ c: ch, x0: (pad + acc) / w, x1: (pad + acc + cw) / w });
    acc += cw;
  }
  GT.chars = chars;
  GT.w = w; GT.h = h;
  const boxH = BOX_W * (h / w);
  GT.box = [-BOX_W / 2, -boxH / 2, BOX_W, boxH];
  GT.ready = true;
  if (glOk) uploadGlyph();
}

function uploadGlyph() {
  gl.bindTexture(gl.TEXTURE_2D, glyphTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gcv);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

let charProg = [];
function buildRamp() {
  if (!GT.chars.length) { ramp.fill(0); if (glOk) pushRamp(); return; }
  for (let i = 0; i < RAMP_N; i++) {
    const u = (i + 0.5) / RAMP_N;
    let v = 0;
    for (let k = 0; k < GT.chars.length; k++) {
      const c = GT.chars[k];
      if (u >= c.x0 - 0.004 && u <= c.x1 + 0.004) { v = charProg[k] || 0; break; }
      if (u < c.x0) { v = charProg[k] || 0; break; }
    }
    const b = Math.round(clamp01(v) * 255);
    ramp[i * 4] = b; ramp[i * 4 + 1] = b; ramp[i * 4 + 2] = b; ramp[i * 4 + 3] = 255;
  }
  pushRamp();
}
function pushRamp() {
  if (!glOk) return;
  gl.bindTexture(gl.TEXTURE_2D, rampTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RAMP_N, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, ramp);
}

/* ══════════════════════════ 线性代数 ══════════════════════════ */
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function cameraBasis(eye, at, roll) {
  let fx = at[0] - eye[0], fy = at[1] - eye[1], fz = at[2] - eye[2];
  let fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, ry = 0, rz = fx;
  let rl = Math.hypot(rx, ry, rz) || 1;
  if (rl < 1e-4) { rx = 1; ry = 0; rz = 0; rl = 1; }
  rx /= rl; ry /= rl; rz /= rl;
  let ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
  const c = Math.cos(roll), s = Math.sin(roll);
  const RX = rx * c + ux * s, RY = ry * c + uy * s, RZ = rz * c + uz * s;
  const UX = ux * c - rx * s, UY = uy * c - ry * s, UZ = uz * c - rz * s;
  const dt = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const view = new Float32Array([
    RX, UX, -fx, 0,
    RY, UY, -fy, 0,
    RZ, UZ, -fz, 0,
    -dt([RX, RY, RZ], eye), -dt([UX, UY, UZ], eye), dt([fx, fy, fz], eye), 1
  ]);
  return { view, right: [RX, RY, RZ], up: [UX, UY, UZ], fwd: [fx, fy, fz] };
}

/* ══════════════════════════ GLSL ══════════════════════════ */
const BG_VS = `#version 300 es
in vec2 aQ; out vec2 vUV;
void main(){ vUV = aQ; gl_Position = vec4(aQ * 2.0 - 1.0, 0.0, 1.0); }`;

/* 背景：一块冷轧钢板。每像素一条射线打到 z=0 的板面上，用世界坐标去采样字形纹理的三个通道 ——
   字就是被焊枪烧过的那块金属：G 是焊道正芯，R 是一圈稻草黄回火带，B 是退到外沿的冷青圈。
   归一化的温度量化成五档色阶，等温线随冷却往字外挪，颜色就一圈圈往外退。 */
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform vec3 uEye, uRight, uUp, uFwd;
uniform float uTan, uAsp, uT, uBass, uAct, uCut;
uniform sampler2D uGlyph, uRamp;
uniform vec4 uBox;

float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = h21(i), b = h21(i + vec2(1.0, 0.0)), c = h21(i + vec2(0.0, 1.0)), d = h21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

/* 灯：一把带罩的冷白工作灯，从左后压得极低，贴着板面扫过来 —— 色带亮起来就是它扫过 */
const vec3 LG = vec3(-0.72, 0.48, 0.50);

vec4 gtex(vec2 w){
  vec2 uv = (w - uBox.xy) / uBox.zw;
  if (uv.x < -0.06 || uv.x > 1.06 || uv.y < -0.06 || uv.y > 1.06) return vec4(0.0);
  return texture(uGlyph, uv);
}

/* 轧制纹：轧辊沿一个方向压出来的细纹，钢板上最藏不住的痕迹 */
float mill(vec2 w){
  return 0.58 * vnoise(vec2(w.x * 2.4, w.y * 210.0))
       + 0.42 * vnoise(vec2(w.x * 6.8, w.y * 560.0));
}
/* 砂轮蹭过去的那几道长划痕 */
float scratch(vec2 w){
  float a = vnoise(vec2(w.x * 1.15, w.y * 30.0));
  return smoothstep(0.845, 0.995, a);
}
float surf(vec2 w){
  return 0.0012 * vnoise(w * 4.4) + 0.00045 * vnoise(w * 18.0);
}

/* 回火色：冷钢 → 氧化灰 → 青铜 → 稻草黄 → 金白。
   紫那一段刻意压成不饱和的灰褐 —— 一屏里不许挤出四五种色相来。 */
vec3 temper(float q){
  vec3 c = vec3(0.340, 0.352, 0.380);
  c = mix(c, vec3(0.402, 0.372, 0.330), smoothstep(0.05, 0.28, q));
  c = mix(c, vec3(0.640, 0.436, 0.216), smoothstep(0.28, 0.47, q));
  c = mix(c, vec3(0.980, 0.706, 0.286), smoothstep(0.47, 0.68, q));
  c = mix(c, vec3(1.000, 0.930, 0.792), smoothstep(0.70, 0.94, q));
  return c;
}

void main(){
  vec2 nd = vUV * 2.0 - 1.0;
  vec3 dir = normalize(uRight * (nd.x * uTan * uAsp) + uUp * (nd.y * uTan) + uFwd);
  vec3 Vv = -dir;

  /* 车间暗处：灯只罩住板面那一小块 */
  vec3 col = vec3(0.0180, 0.0190, 0.0225);
  col *= 0.58 + 0.58 * pow(max(0.0, 1.0 - length(nd * vec2(0.80, 1.0))), 2.3);

  if (dir.z < -0.008) {
    float t = -uEye.z / dir.z;
    if (t > 0.02 && t < 15.0) {
      vec2 w = uEye.xy + dir.xy * t;
      vec2 uv = (w - uBox.xy) / uBox.zw;
      vec4 g4 = gtex(w);

      float core  = g4.g;   /* 焊道正芯：最热的那一条 */
      float straw = g4.r;   /* 稻草黄那一圈回火带 */
      float cool  = g4.b;   /* 退到外沿的冷青圈 */

      /* 焊枪现在烧到哪儿：已经走过的地方才氧化上色，走过的一直留着色 */
      float front = uCut;
      float ahead = smoothstep(-0.07, 0.12, front - uv.x);
      float age   = clamp(front - uv.x, 0.0, 1.5);

      /* 温度场：芯最热，往外一层层退 */
      float q = (core * 0.55 + straw * 0.45 + cool * 0.22) * 1.15;
      q *= mix(0.70, 1.0, ahead);

      /* 一圈圈往外退：冷却把整条温度曲线往下压，色阶边界就顺着往字外走 */
      q -= 0.085 * age * (0.55 + 0.55 * vnoise(w * 2.7));
      /* 焊枪扫过的那道窄热区：经过时那一段被重新烧白 */
      float hot = exp(-pow((uv.x - (front - 0.11)) / 0.115, 2.0)) * step(-0.30, uv.x);
      q += hot * 0.30;
      q = clamp(q, 0.0, 1.0);

      /* 量化成色阶：等温线一动，肉眼看到的就是一道一道往外退 */
      float s = q * 5.0 + age * 0.75;
      float band = (floor(s) - age * 0.75 + 0.5) / 5.0;
      q = clamp(mix(q, band, 0.60), 0.0, 1.0);

      /* 板上几乎没有起伏，只有轧制纹和焊道堆起来的那一点点 */
      float H = surf(w) + core * 0.0026 + straw * 0.0010;
      vec2 dxw = dFdx(w), dyw = dFdy(w);
      float hx = dFdx(H), hy = dFdy(H);
      float det = dxw.x * dyw.y - dxw.y * dyw.x;
      vec2 g = (abs(det) > 1e-13) ? vec2((hx * dyw.y - hy * dxw.y) / det, (hy * dxw.x - hx * dyw.x) / det) : vec2(0.0);
      g = clamp(g, vec2(-6.0), vec2(6.0));
      vec3 N = normalize(vec3(-g, 1.0));

      /* 钢板底色：冷、灰、带一点蓝。轧制纹和划痕都压得极浅 ——
         背景一花，就被审计算成墨了 */
      float mt = mill(w);
      float sc = scratch(w);
      vec3 alb = temper(q);
      alb *= mix(1.0, 0.84 + 0.30 * mt, 1.0 - 0.70 * clamp(q * 1.8, 0.0, 1.0));
      alb *= 1.0 - 0.15 * sc * (1.0 - 0.78 * q);

      vec3 Ldn = normalize(LG);
      float ndl = clamp(dot(N, Ldn), 0.0, 1.0);
      vec3 c = alb * (0.26 + 1.32 * ndl);
      c += alb * vec3(0.075, 0.085, 0.115) * clamp(N.z, 0.0, 1.0);

      /* 氧化膜那层油亮：机位一动，镜面高光就在色带上横扫过去 */
      vec3 Hv = normalize(Ldn + Vv);
      float spec = pow(clamp(dot(N, Hv), 0.0, 1.0), 26.0);
      float gloss = 0.30 + 0.55 * clamp(q * 2.0, 0.0, 1.0);
      c += vec3(1.0, 0.955, 0.900) * spec * (0.030 + 0.60 * gloss);
      float fres = pow(1.0 - clamp(dot(N, Vv), 0.0, 1.0), 5.0);
      c += vec3(0.32, 0.37, 0.46) * fres * 0.10;

      /* 焊道正芯那道细亮线：热还没散完，白里透一点蓝 */
      float bead = smoothstep(0.62, 0.96, core);
      c += vec3(1.0, 0.94, 0.82) * bead * 0.30;
      /* 焊枪正下方那一点电弧光，落在板上 */
      c += vec3(0.90, 0.86, 0.78) * exp(-pow((uv.x - (front - 0.11)) / 0.020, 2.0)) * 0.09;

      c *= 0.72 + 0.28 * exp(-t * 1.6);
      col = c;
    }
  }

  /* 远处那层热雾，别让板面在尽头被刀切成一条硬边 */
  col += vec3(0.020, 0.021, 0.024) * exp(-pow(dir.z / 0.055, 2.0)) * 0.80;

  float n = h21(vUV * 640.0 + uT * 0.5);
