<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青蓝沉睡</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#020304;overflow:hidden;}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:#020304;}
  #lyr{position:fixed;inset:0;pointer-events:none;overflow:hidden;color:#e4eef6;
       font-family:"Songti SC","STSong","SimSun","Songti TC","Noto Serif CJK SC","Source Han Serif SC",serif;
       -webkit-font-smoothing:antialiased;}
  #lyr .scrim{position:absolute;left:0;top:0;bottom:0;width:44vw;opacity:.85;
       background:linear-gradient(90deg,rgba(1,2,4,.80),rgba(1,2,4,.46) 42%,rgba(1,2,4,0));}
  #vwrap{position:absolute;inset:0;}
  #rule{position:absolute;width:1px;opacity:.5;
       background:linear-gradient(180deg,rgba(150,192,220,0),rgba(150,192,220,.24) 30%,rgba(150,192,220,.16) 70%,rgba(150,192,220,0));}
  .lgrp{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;}
  .lgrp.on{opacity:1;}
  .lgrp.gone{opacity:0;transition:opacity .55s ease;}
  .vcol{position:absolute;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;
        line-height:1.66;letter-spacing:.18em;color:#cfdde8;
        text-shadow:0 0 10px rgba(120,172,205,.26),0 0 26px rgba(70,120,158,.14);}
  .hcol{position:absolute;left:0;white-space:normal;word-break:break-word;line-height:1.55;
        letter-spacing:.10em;color:#cfdde8;transform-origin:0 100%;
        text-shadow:0 0 12px rgba(120,172,205,.22);}
  .ch{opacity:.50;transition:opacity .55s ease,color .55s ease,text-shadow .55s ease;}
  .ch.sp{display:inline-block;width:.55em;}
  .ch.lit{opacity:1;color:#f3f9fd;
          text-shadow:0 0 7px rgba(186,220,242,.55),0 0 20px rgba(112,164,200,.30);}
  #empty{position:absolute;font-size:17px;letter-spacing:.55em;color:#cfdde8;opacity:.42;
         writing-mode:vertical-rl;text-shadow:0 0 12px rgba(120,172,205,.24);}
  #meta{position:absolute;right:6.5vw;bottom:5.6vh;text-align:right;max-width:40vw;
        font-family:"Songti SC","STSong","SimSun",serif;opacity:.40;color:#b9cddd;}
  #meta .ttl{font-size:clamp(11px,1.35vh,15px);letter-spacing:.22em;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;}
  #meta .art{font-size:clamp(9px,1.05vh,12px);letter-spacing:.28em;opacity:.72;margin-top:.5em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #prog{position:absolute;left:8.5vw;bottom:6vh;width:19vw;height:1px;
        background:rgba(178,212,236,.14);}
  #prog i{position:absolute;left:0;top:0;height:1px;width:100%;transform:scaleX(0);
        transform-origin:0 50%;background:linear-gradient(90deg,rgba(196,226,244,.05),rgba(206,232,247,.55));
        transition:transform .35s linear;}
  @media (max-aspect-ratio: 1/1){
    #lyr .scrim{width:100%;opacity:1;
      background:linear-gradient(90deg,rgba(1,2,4,.62),rgba(1,2,4,.20) 38%,rgba(1,2,4,0) 64%),
                 linear-gradient(180deg,rgba(1,2,4,0),rgba(1,2,4,.34) 46%,rgba(1,2,4,.76));}
    #meta{right:7vw;left:auto;top:6vh;bottom:auto;max-width:64vw;}
    #prog{left:8vw;width:34vw;bottom:9vh;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="lyr">
  <div class="scrim"></div>
  <div id="rule"></div>
  <div id="vwrap"></div>
  <div id="meta"><div class="ttl"></div><div class="art"></div></div>
  <div id="prog"><i></i></div>
</div>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('stage'), ctx=cv.getContext('2d',{alpha:false});
  var vwrap=document.getElementById('vwrap');
  var W=0,H=0,DPR=1;
  var st={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',text:'',gl:false,rm:false,
          inited:false,dur:0,songId:null};
  var readySent=false, relayout=false;

  function sendReady(){
    if(readySent) return; readySent=true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){}
  }
  window.addEventListener('error',function(e){ st.err=String((e&&e.message)||'error'); });

  function resize(){
    var w=window.innerWidth, h=window.innerHeight;
    if(!isFinite(w)||!isFinite(h)||w<=0||h<=0){ w=1440; h=900; }
    DPR=Math.min(w>1500?1.5:2,Math.max(1,window.devicePixelRatio||1));
    W=w; H=h;
    cv.width=Math.max(1,Math.round(w*DPR));
    cv.height=Math.max(1,Math.round(h*DPR));
    cv.style.width=w+'px'; cv.style.height=h+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    loadPortrait(false);
    computeCover();
    buildScreenGrads();
    seedMotes();
    relayout=true;
    if(emptyEl) buildEmpty();
  }

  function normText(s){ return (typeof s==='string'?s:'').replace(/\s+/g,' ').trim(); }

  function setLines(lines){
    var out=[];
    if(Array.isArray(lines)){
      for(var i=0;i<lines.length&&i<4000;i++){
        var l=lines[i]; if(!l) continue;
        var raw=l.text;
        var txt=normText(raw==null?'':String(raw));
        var t=Number(l.t); if(!isFinite(t)) t=0;
        var dur=Number(l.dur); if(!isFinite(dur)||dur<0) dur=0;
        out.push({t:t,dur:dur,text:txt,chars:Array.isArray(l.chars)?l.chars:null});
      }
    }
    out.sort(function(a,b){return a.t-b.t;});
    st.lines=out;
  }

  function pickIdx(t){
    var L=st.lines, lo=0, hi=L.length-1, r=-1;
    for(var i=0;i<L.length;i++){ if(L[i].t<=t+0.0001) r=i; else break; }
    return r;
  }

  /* ---------------- 竖排宋体歌词 ---------------- */
  var ruleEl=document.getElementById('rule');
  var metaTtl=document.querySelector('#meta .ttl');
  var metaArt=document.querySelector('#meta .art');
  var progFill=document.querySelector('#prog i');
  var emptyEl=null;

  var L={idx:-2, mode:'v', group:null, pending:null, spans:[], times:[], lit:0, fs:20};

  function clampNum(v,a,b){ return v<a?a:(v>b?b:v); }

  function metrics(){
    var portraitMode=H>=W;
    if(!portraitMode){
      var fs=clampNum(Math.min(H*0.025,W*0.015),16,23);
      return {x:Math.max(W*0.075,30),y:H*0.20,colH:H*0.58,fs:fs,cap:3,portrait:false,
              hfs:clampNum(Math.min(H*0.030,W*0.020),16,31)};
    }
    var fs2=clampNum(W*0.045,15,21);
    return {x:Math.max(W*0.085,24),y:H*0.635,colH:H*0.255,fs:fs2,cap:2,portrait:true,
            hfs:clampNum(W*0.052,15,24)};
  }

  function timesFor(i){
    var ln=st.lines[i], chars=Array.from(ln.text||''), n=chars.length;
    var out=new Array(n), ok=false, src=ln.chars;
    if(Array.isArray(src)&&src.length===n&&n>0){
      ok=true;
      for(var k=0;k<n;k++){
        var tt=src[k]?Number(src[k].t):NaN;
        if(!isFinite(tt)){ ok=false; break; }
        out[k]=tt;
      }
    }
    if(!ok){
      var start=ln.t, end, nxt=st.lines[i+1];
      if(ln.dur>0.02) end=start+ln.dur;
      else if(nxt&&nxt.t>start) end=nxt.t;
      else end=start+Math.max(1.8,n*0.24);
      if(!(end>start)) end=start+Math.max(1.4,n*0.2);
      var span=end-start;
      for(var k2=0;k2<n;k2++) out[k2]=start+span*(k2/Math.max(1,n));
    }
    return out;
  }

  function makeGroup(){
    var g=document.createElement('div'); g.className='lgrp';
    return g;
  }

  function retire(g){
    if(!g) return;
    g.classList.remove('on'); g.classList.add('gone');
    setTimeout(function(){ if(g.parentNode) g.parentNode.removeChild(g); },700);
  }

  function buildEmpty(){
    if(!emptyEl){
      emptyEl=document.createElement('div'); emptyEl.id='empty'; emptyEl.textContent='无词';
      document.getElementById('lyr').appendChild(emptyEl);
    }
    var m=metrics();
    emptyEl.style.left=Math.round(m.x)+'px';
    emptyEl.style.top=Math.round(m.y+m.fs*0.4)+'px';
    emptyEl.style.fontSize=Math.round(m.fs*0.92)+'px';
    emptyEl.style.display=(st.inited&&st.lines.length===0)?'block':'none';
  }

  function buildLine(i){
    var wrap=document.getElementById('vwrap');
    if(L.group){ retire(L.group); L.group=null; }
    L.spans=[]; L.times=[]; L.lit=0;

    if(i<0||!st.lines[i]||!st.lines[i].text){
      if(st.lines.length===0) buildEmpty();
      else if(emptyEl) emptyEl.style.display='none';
      return;
    }
    if(emptyEl) emptyEl.style.display='none';

    var ln=st.lines[i];
    var chars=Array.from(ln.text).slice(0,220);
    var times=timesFor(i);
    if(times.length>chars.length) times=times.slice(0,chars.length);

    var m=metrics(); L.fs=m.fs;
    var g=makeGroup();
    var spans=[];
    var vertical=(L.mode==='v');

    if(vertical){
      var fs=m.fs, step=fs*1.95, adv=fs*1.20;
      var perCol=Math.max(1,Math.floor(m.colH/adv));
      var cols=Math.max(1,Math.ceil(chars.length/perCol));
      var guard=0;
      while(cols>m.cap&&fs>12.5&&guard<14){
        fs=fs*0.92; guard++;
        adv=fs*1.20;
        perCol=Math.max(1,Math.floor(m.colH/adv));
        cols=Math.max(1,Math.ceil(chars.length/perCol));
      }
      if(fs<12.5) fs=12.5;
      step=fs*1.95; adv=fs*1.20; perCol=Math.max(1,Math.floor(m.colH/adv));
      cols=Math.max(1,Math.ceil(chars.length/perCol));
      L.fs=fs;

      for(var j=0;j<cols;j++){
        var col=document.createElement('div');
        col.className='vcol';
        col.style.left=Math.round(m.x+(cols-1-j)*step)+'px';
        col.style.top=Math.round(m.y)+'px';
        col.style.height=Math.round(m.colH)+'px';
        col.style.fontSize=fs.toFixed(1)+'px';
        var from=j*perCol, to=Math.min(chars.length,from+perCol);
        for(var k=from;k<to;k++){
          var sp=document.createElement('span');
          sp.className='ch';
          sp.textContent=(chars[k]===' ')?'\u00A0':chars[k];
          col.appendChild(sp);
          spans[k]=sp;
        }
        g.appendChild(col);
      }
      if(ruleEl){
        ruleEl.style.left=Math.round(m.x-fs*0.95)+'px';
        ruleEl.style.top=Math.round(m.y)+'px';
        ruleEl.style.height=Math.round(m.colH*0.92)+'px';
        ruleEl.style.opacity=cols<=m.cap?'0.5':'0.25';
      }
    } else {
      var h=document.createElement('div');
      h.className='hcol';
      h.style.left=Math.round(m.x)+'px';
      h.style.bottom=Math.round(H*0.15)+'px';
      h.style.width=Math.round(W-m.x-W*0.07)+'px';
      h.style.fontSize=m.hfs.toFixed(1)+'px';
      for(var k3=0;k3<chars.length;k3++){
        var sp2=document.createElement('span');
        sp2.className='ch';
        sp2.textContent=chars[k3];
        h.appendChild(sp2);
        spans[k3]=sp2;
      }
      g.appendChild(h);
      wrap.appendChild(g);
      requestAnimationFrame(function(){
        var maxW=h.clientWidth, maxH=H*0.34;
        var sw=h.scrollWidth||1, sh=h.scrollHeight||1;
        var k=Math.min(1,maxW/sw,maxH/sh);
        if(!isFinite(k)||k<=0) k=1;
        h.style.transform='scale('+k.toFixed(3)+')';
      });
    }

    L.spans=spans; L.times=times; L.group=g;
    if(vertical) wrap.appendChild(g);
    requestAnimationFrame(function(){ if(g.isConnected) g.classList.add('on'); });
    setTimeout(function(){ if(g.isConnected) g.classList.add('on'); },140);
  }

  function applyLit(n){
    if(n===L.lit) return;
    var s=L.spans, k;
    if(n<L.lit){ for(k=n;k<L.lit&&k<s.length;k++) if(s[k]) s[k].classList.remove('lit'); }
    else { for(k=L.lit;k<n&&k<s.length;k++) if(s[k]) s[k].classList.add('lit'); }
    L.lit=n;
  }

  function updateLyric(force){
    var i=st.idx;
    if(force||i!==L.idx){ buildLine(i); L.idx=i; }
    st.text=(i>=0&&st.lines[i])?st.lines[i].text:'';
    if(i<0){ applyLit(0); return; }
    var t=st.t, n=0;
    for(var k=0;k<L.times.length;k++){ if(L.times[k]<=t+0.0015) n++; else break; }
    applyLit(n);
  }

  function decideMode(){
    var cjk=0,lat=0;
    for(var i=0;i<st.lines.length&&i<40;i++){
      var s=st.lines[i].text||'';
      for(var k=0;k<s.length;k++){
        var c=s.charCodeAt(k);
        if(c>=0x3400&&c<=0x9fff) cjk++;
        else if((c>=65&&c<=90)||(c>=97&&c<=122)) lat++;
      }
    }
    L.mode=(cjk+lat===0||cjk>=lat*0.55)?'v':'h';
  }

  function updateMeta(p){
    var song=p.song||{};
    var name=normText(song.name);
    var ar=song.artists, txt='';
    if(Array.isArray(ar)) txt=ar.map(function(x){return normText(String(x==null?'':x));}).filter(Boolean).join(' / ');
    else if(typeof ar==='string') txt=normText(ar);
    if(metaTtl) metaTtl.textContent=name||'未命名';
    if(metaArt) metaArt.textContent=txt;
  }

  /* ---------------- 画面：沉睡的面孔 ---------------- */
  var FOCUS={x:0.545,y:0.47};          /* 面部在当前素材中的锚点 */
  var ART={
    wide:{src:'assets/345-face.jpg',focus:{x:0.545,y:0.47}},
    tall:{src:'assets/345-face-portrait.jpg',focus:{x:0.56,y:0.46}}
  };
  var artKey=null;
  var portrait={img:null,ok:false,failed:false,cv:null,ctx:null,w:0,h:0};
  var facePt={x:0,y:0,r:0};           /* 面部在屏幕上的位置 */
  var gradeLUT=null;

  function cl255(v){ v=Math.round(v); return v<0?0:(v>255?255:v); }

  function buildLUT(){
    var stops=[[0,1,2,3],[0.14,4,8,12],[0.34,12,25,36],[0.55,32,58,76],
               [0.75,78,118,142],[0.92,150,190,210],[1,214,236,246]];
    var lut=new Uint8Array(256*3);
    for(var i=0;i<256;i++){
      var v=i/255, seg=0;
      while(seg<stops.length-2 && v>stops[seg+1][0]) seg++;
      var a=stops[seg],b=stops[seg+1];
      var k=(v-a[0])/Math.max(1e-6,b[0]-a[0]); if(!isFinite(k)) k=0;
      lut[i*3]=cl255(a[1]+(b[1]-a[1])*k);
      lut[i*3+1]=cl255(a[2]+(b[2]-a[2])*k);
      lut[i*3+2]=cl255(a[3]+(b[3]-a[3])*k);
    }
    gradeLUT=lut;
  }

  function buildGrade(){
    if(!portrait.img) return;
    if(!gradeLUT) buildLUT();
    var im=portrait.img, maxW=1400;
    var s=Math.min(1,maxW/Math.max(1,im.width));
    var gw=Math.max(2,Math.round(im.width*s)), gh=Math.max(2,Math.round(im.height*s));
    var c=document.createElement('canvas'); c.width=gw; c.height=gh;
    var g=c.getContext('2d',{willReadFrequently:true});
    try{
      g.drawImage(im,0,0,gw,gh);
      var id=g.getImageData(0,0,gw,gh), d=id.data;
      for(var p=0;p<d.length;p+=4){
        var r=d[p],gg=d[p+1],b=d[p+2];
        var v=(0.2126*r+0.7152*gg+0.0722*b)/255;
        v=Math.pow(v,1.16);
        v=(v*v*(3-2*v))*0.55+v*0.45;
        if(v<0) v=0; else if(v>1) v=1;
        var idx=(v*255)|0;
        d[p]  =cl255(gradeLUT[idx*3]  *0.92 + r*0.08);
        d[p+1]=cl255(gradeLUT[idx*3+1]*0.92 + gg*0.08);
        d[p+2]=cl255(gradeLUT[idx*3+2]*0.92 + b*0.08);
        d[p+3]=255;
      }
      g.putImageData(id,0,0);
      portrait.cv=c; portrait.ctx=g; portrait.w=gw; portrait.h=gh; portrait.ok=true;
    }catch(e){ portrait.failed=true; }
  }

  function buildFallback(){
    var c=document.createElement('canvas'); c.width=900; c.height=600;
    var g=c.getContext('2d');
    g.fillStyle='#020304'; g.fillRect(0,0,900,600);
    var glow=g.createRadialGradient(560,250,10,560,250,330);
    try{
      glow.addColorStop(0,'rgba(96,150,182,0.30)');
      glow.addColorStop(0.45,'rgba(40,74,98,0.16)');
      glow.addColorStop(1,'rgba(4,8,12,0)');
    }catch(e){}
    g.fillStyle=glow; g.fillRect(0,0,900,600);
    /* 一笔侧脸：额—眉—鼻—唇—颏—颈 */
    g.save();
    g.translate(275,96); g.scale(1.45,1.45);
    g.strokeStyle='rgba(176,214,236,0.55)';
    g.lineWidth=2.2; g.lineCap='round'; g.lineJoin='round';
    g.shadowColor='rgba(120,178,214,0.9)'; g.shadowBlur=22;
    g.beginPath();
    g.moveTo(96,8);
    g.bezierCurveTo(140,14,168,48,170,92);
    g.bezierCurveTo(172,120,164,140,156,152);
    g.bezierCurveTo(196,168,212,190,208,206);
    g.bezierCurveTo(205,220,190,222,178,224);
    g.bezierCurveTo(188,238,186,250,172,256);
    g.bezierCurveTo(160,262,150,258,146,250);
    g.bezierCurveTo(150,268,168,282,186,288);
    g.bezierCurveTo(210,296,232,304,240,330);
    g.stroke();
    g.restore();
    portrait.cv=c; portrait.ctx=g; portrait.w=900; portrait.h=600;
    portrait.ok=true; portrait.failed=true;
    if(W>0&&H>0){ computeCover(); buildScreenGrads(); relayout=true; }
  }

  function wantKey(){ return (H>=W)?'tall':'wide'; }

  function loadPortrait(force){
    var k=wantKey();
    if(!force&&artKey===k) return;
    artKey=k;
    FOCUS=ART[k].focus;
    var im=new Image();
    im.onload=function(){
      portrait.img=im;
      buildGrade();
      if(!portrait.ok) buildFallback();
      if(W&&H){ computeCover(); buildScreenGrads(); relayout=true; }
    };
    im.onerror=function(){
      portrait.failed=true; buildFallback();
    };
    im.src=ART[k].src;
  }

  var lightGrad=null, edgeL=null, edgeB=null, edgeT=null, edgeD=null, bloomGrad=null, veilCv=null;
  var accentCol=[150,200,226];

  function applyAccent(a){
    var r=Number(a[0]),g=Number(a[1]),b=Number(a[2]);
    if(!isFinite(r)||!isFinite(g)||!isFinite(b)) return;
    r=cl255(r); g=cl255(g); b=cl255(b);
    if(r+g+b<30) return;
    var mix=0.26;
    accentCol=[cl255(150+(r-150)*mix),cl255(200+(g-200)*mix),cl255(226+(b-226)*mix)];
    if(W>0&&H>0) buildScreenGrads();
  }
  var cover={sx:0,sy:0,sw:1,sh:1};

  function computeCover(){
    var iw=portrait.w||1800, ih=portrait.h||1200;
    var vA=W/H, sA=iw/ih, sw, sh;
    if(vA>sA){ sw=iw; sh=iw/vA; } else { sh=ih; sw=ih*vA; }
    var sx=FOCUS.x*iw-sw/2, sy=FOCUS.y*ih-sh/2;
    sx=Math.max(0,Math.min(iw-sw,sx));
    sy=Math.max(0,Math.min(ih-sh,sy));
    cover.sx=sx; cover.sy=sy; cover.sw=sw; cover.sh=sh;
    facePt.x=(FOCUS.x*iw-sx)/sw*W;
    facePt.y=(FOCUS.y*ih-sy)/sh*H;
    facePt.r=Math.min(W,H)*0.62;
  }

  function buildScreenGrads(){
    var rr=Math.max(W,H)*0.60;
    var g=ctx.createRadialGradient(facePt.x,facePt.y,Math.min(W,H)*0.04,
                                   facePt.x,facePt.y,rr);
    try{
      g.addColorStop(0,'rgba(1,2,3,0)');
      g.addColorStop(0.20,'rgba(1,2,3,0.08)');
      g.addColorStop(0.36,'rgba(1,2,3,0.50)');
      g.addColorStop(0.52,'rgba(1,2,3,0.84)');
      g.addColorStop(0.70,'rgba(1,2,3,0.94)');
      g.addColorStop(1,'rgba(1,2,3,0.975)');
    }catch(e){}
    lightGrad=g;

    var e=ctx.createLinearGradient(0,0,W*0.60,0);
    try{
      e.addColorStop(0,'rgba(1,2,4,0.94)');
      e.addColorStop(0.40,'rgba(1,2,4,0.52)');
      e.addColorStop(1,'rgba(1,2,4,0)');
    }catch(e2){}
    edgeL=e;

    var b=ctx.createLinearGradient(0,H*0.55,0,H);
    try{
      b.addColorStop(0,'rgba(1,2,4,0)');
      b.addColorStop(1,'rgba(1,2,4,0.90)');
    }catch(e3){}
    edgeB=b;

    var t=ctx.createLinearGradient(0,0,0,H*0.44);
    try{
      t.addColorStop(0,'rgba(1,2,4,0.62)');
      t.addColorStop(1,'rgba(1,2,4,0)');
    }catch(e6){}
    edgeT=t;

    /* 斜向塑形：光从右上落下，左下退进暗部 */
    var dg=ctx.createLinearGradient(facePt.x-W*0.26,facePt.y+H*0.34,
                                    facePt.x+W*0.10,facePt.y-H*0.06);
    try{
      dg.addColorStop(0,'rgba(1,2,4,0.62)');
      dg.addColorStop(0.55,'rgba(1,2,4,0.16)');
      dg.addColorStop(1,'rgba(1,2,4,0)');
    }catch(e7){}
    edgeD=dg;

    var bl=ctx.createRadialGradient(facePt.x,facePt.y,0,facePt.x,facePt.y,Math.min(W,H)*0.46);
    try{
      bl.addColorStop(0,'rgba('+accentCol[0]+','+accentCol[1]+','+accentCol[2]+',0.17)');
      bl.addColorStop(0.40,'rgba('+accentCol[0]+','+accentCol[1]+','+accentCol[2]+',0.055)');
      bl.addColorStop(1,'rgba(10,20,30,0)');
    }catch(e4){}
    bloomGrad=bl;

    try{
      var vc=document.createElement('canvas');
      vc.width=Math.max(2,Math.round(W)); vc.height=Math.max(2,Math.round(H));
      var vg=vc.getContext('2d');
      if(lightGrad){ vg.fillStyle=lightGrad; vg.fillRect(0,0,W,H); }
      if(edgeL){ vg.fillStyle=edgeL; vg.fillRect(0,0,W*0.60,H); }
      if(edgeB){ vg.fillStyle=edgeB; vg.fillRect(0,H*0.55,W,H*0.45); }
      if(edgeT){ vg.fillStyle=edgeT; vg.fillRect(0,0,W,H*0.44); }
      if(edgeD){ vg.fillStyle=edgeD; vg.fillRect(0,0,W,H); }
      veilCv=vc;
    }catch(e5){ veilCv=null; }
  }

  /* ---------------- 浮尘 / 颗粒 / 合成 ---------------- */
  var motes=[], grainPat=null, grainOff={x:0,y:0}, lastGrain=0;
  var live={bass:0,level:0,mid:0,treble:0,bpm:0};
  var beatLvl=0, beatAt=-99, frameStart=0, bootAt=0;

  function seedMotes(){
    motes.length=0;
    var n = (W*H>1400000)?54:34;
    for(var i=0;i<n;i++){
      motes.push({x:Math.random(),y:Math.random(),r:0.5+Math.random()*1.5,
                  v:0.004+Math.random()*0.012,p:Math.random()*6.283,
                  a:0.25+Math.random()*0.75});
    }
  }

  function buildGrain(){
    var c=document.createElement('canvas'); c.width=160; c.height=160;
    var g=c.getContext('2d');
    var id=g.createImageData(160,160), d=id.data;
    for(var i=0;i<d.length;i+=4){
      var v=200+Math.random()*55;
      d[i]=v; d[i+1]=v; d[i+2]=v+8; d[i+3]=Math.random()*46;
    }
    g.putImageData(id,0,0);
    grainPat=ctx.createPattern(c,'repeat');
  }

  function drawPortrait(breath,time){
    if(!portrait.ok) return;
    var drift=st.rm?0:1;
    var s=1+0.011*breath*drift;
    var dx=Math.sin(time*0.13)*W*0.0045*drift;
    var dy=Math.cos(time*0.105)*H*0.0045*drift;
    ctx.save();
    ctx.translate(facePt.x+dx,facePt.y+dy);
    ctx.scale(s,s);
    ctx.translate(-facePt.x,-facePt.y);
    try{
      ctx.drawImage(portrait.cv,cover.sx,cover.sy,Math.max(1,cover.sw),Math.max(1,cover.sh),
                    0,0,W,H);
    }catch(e){}
    ctx.restore();
  }

  function drawMotes(time,breath){
    if(st.rm) return;
    ctx.globalCompositeOperation='lighter';
    var R=facePt.r;
    for(var i=0;i<motes.length;i++){
      var m=motes[i];
      m.y-=m.v*0.016;
      if(m.y<-0.05){ m.y=1.05; m.x=Math.random(); }
      var px=m.x*W, py=m.y*H;
      var dd=Math.hypot(px-facePt.x,py-facePt.y)/R;
      if(dd>1.35) continue;
      var fall=Math.max(0,1-dd/1.35);
      var tw=0.55+0.45*Math.sin(time*0.7+m.p);
      var a=0.16*m.a*fall*tw*(0.5+0.5*breath);
      if(a<=0.004) continue;
      ctx.fillStyle='rgba(198,224,240,'+a.toFixed(3)+')';
      ctx.beginPath();
      ctx.arc(px,py,m.r,0,6.2832);
      ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }

  function draw(now){
    var time=now*0.001;
    if(!bootAt) bootAt=now;
    var breath=0.5+0.5*Math.sin(time*0.55);
    if(relayout){ relayout=false; if(st.inited){ L.idx=-2; updateLyric(true); } }
    if(st.inited) updateLyric(false);
    if(beatAt>-90) beatLvl*=0.94;
    var pulse=Math.max(beatLvl, Math.min(1,live.bass*0.85));
    var playK=st.playing?1:0.62;

    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;

    if(!portrait.ok){
      ctx.fillStyle='#020304';
      ctx.fillRect(0,0,W,H);
    }

    drawPortrait(breath,time);

    /* 光只落在脸上：外圈压黑（预合成，一次贴图） */
    if(veilCv){
      var vs=1.0+0.014*breath;
      ctx.globalAlpha=0.90+0.08*breath;
      ctx.save();
      ctx.translate(facePt.x,facePt.y);
      ctx.scale(vs,vs);
      ctx.translate(-facePt.x,-facePt.y);
      ctx.drawImage(veilCv,0,0,W,H);
      ctx.restore();
      ctx.globalAlpha=1;
    }

    if(bloomGrad){
      var br=Math.min(W,H)*0.46;
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=(0.28+0.24*breath+0.26*pulse)*playK;
      ctx.fillStyle=bloomGrad;
      ctx.fillRect(facePt.x-br,facePt.y-br,br*2,br*2);
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=1;
    }

    drawMotes(time,breath*playK);

    if(grainPat){
      ctx.save();
      if(!st.rm){
        grainOff.x=(Math.random()*160)|0;
        grainOff.y=(Math.random()*160)|0;
      }
      ctx.translate(-grainOff.x,-grainOff.y);
      ctx.globalAlpha=0.55;
      ctx.fillStyle=grainPat;
      ctx.fillRect(0,0,W+160,H+160);
      ctx.restore();
      ctx.globalAlpha=1;
    }

    if(!st.rm&&bootAt){
      var f=clampNum((now-bootAt)/1500,0,1);
      if(f<1){
        f=f*f*(3-2*f);
        ctx.globalAlpha=1-f;
        ctx.fillStyle='#020304';
        ctx.fillRect(0,0,W,H);
        ctx.globalAlpha=1;
      }
    }
    st.js=Math.round((performance.now()-frameStart)*100)/100;
  }

  function frame(now){
    frameStart=performance.now();
    if(!W||!H) resize();
    st.frames++;
    draw(now);
    requestAnimationFrame(frame);
  }

  window.addEventListener('message',function(ev){
    var d=ev.data; if(!d||d.__c100!==1) return;
    if(d.type==='init'){
      var p=d.payload||{};
      var sameSong=!!(st.inited&&p.song&&p.song.id!=null&&st.songId===p.song.id);
      st.songId=(p.song&&p.song.id!=null)?p.song.id:null;
      st.inited=true;
      var prevMode=L.mode;
      setLines(p.lines);
      st.dur=(isFinite(Number(p.duration))&&Number(p.duration)>0)?Number(p.duration):0;
      if(!st.dur&&st.lines.length){
        var last=st.lines[st.lines.length-1];
        st.dur=last.t+(last.dur>0?last.dur:3);
      }
      st.playing=(p.playing!==false);
      if(p.accent&&p.accent.length>=3) applyAccent(p.accent);
      decideMode();
      updateMeta(p);
      if(!sameSong){ st.t=0; bootAt=0; }
      st.idx=pickIdx(st.t);
      L.idx=-2;
      updateLyric(true);
      if(prevMode!==L.mode) L.lit=0;
      updateProgress();
    } else if(d.type==='tick'){
      var tp=d.payload||{};
      var nt=Number(tp.time);
      st.t=isFinite(nt)?nt:0;            /* 无条件采纳，拖进度 / 切歌不设限 */
      st.playing=tp.playing!==false;
      st.idx=pickIdx(st.t);
      updateLyric(false);
      st.text=(st.idx>=0&&st.lines[st.idx])?st.lines[st.idx].text:'';
      updateProgress();
    } else if(d.type==='beat'){
      var bp=d.payload||{};
      var lv=Number(bp.level);
      if(isFinite(lv)) beatLvl=Math.max(0,Math.min(1,lv));
      beatAt=performance.now()*0.001;
    } else if(d.type==='live'){
      var lp=d.payload||{};
      var f=function(v){ var n=Number(v); return isFinite(n)?Math.max(0,Math.min(1,n)):0; };
      live.bass=f(lp.bass); live.level=f(lp.level);
      live.mid=f(lp.mid); live.treble=f(lp.treble);
      var bb=Number(lp.bpm); live.bpm=isFinite(bb)?bb:0;
      st.playing=lp.playing!==false;
    }
  });

  function updateProgress(){
    if(!progFill) return;
    var pct=0;
    if(st.dur>0) pct=clampNum(st.t/st.dur,0,1);
    progFill.style.transform='scaleX('+pct.toFixed(4)+')';
  }

  window.__stage=function(){
    return {lines:st.lines.length, idx:st.idx, t:st.t, playing:st.playing,
            frames:st.frames, js:st.js, err:st.err, text:st.text, gl:false, rm:st.rm};
  };

  resize();
  window.addEventListener('resize',resize);
  buildGrain();
  loadPortrait();
  st.rm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  st.idx=pickIdx(st.t);
  requestAnimationFrame(function(){ sendReady(); });
  setTimeout(sendReady,450);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
