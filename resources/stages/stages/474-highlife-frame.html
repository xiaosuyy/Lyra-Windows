<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花布影棚</title>
<style>
  :root{
    --cream:#E9D6A9; --cream2:#F3E4BF; --ink:#241B12;
    --ochre:#D9A21B; --red:#BE3A2A; --green:#2C6742;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);}
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--cream);}
  .lay{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 100%;
       opacity:0;transition:opacity .5s ease;}
  #stage.on .lay{opacity:1;}
  #dyn.lay{opacity:0;transition:none;}
  #stage.on #dyn{opacity:1;}
  #bust{will-change:transform;transform-origin:50% 78%;}
  #sign{
    position:absolute;left:5.4%;top:4.6%;max-width:52%;
    padding:.5em .8em .45em;transform:rotate(-1.1deg);
    background:linear-gradient(#F6E8C6,#EBD8AC);
    border:.22em solid var(--ink);border-radius:.18em;
    box-shadow:.22em .26em 0 rgba(36,27,18,.55), inset 0 0 0 .14em var(--ochre);
    opacity:0;transition:opacity .45s ease;
  }
  #stage.on #sign{opacity:1;}
  #signTitle{
    display:block;font:800 clamp(13px,1.55vw,21px)/1.15 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    letter-spacing:.06em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:1px 1px 0 #cfae6b;
  }
  #signSub{
    display:block;margin-top:.22em;font:600 clamp(10px,1.05vw,14px)/1.2 "PingFang SC",sans-serif;
    letter-spacing:.14em;color:#7A4B22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #band{
    position:absolute;left:8.5%;right:8.5%;top:70.6%;bottom:5.5%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;
  }
  #line{
    font:800 clamp(20px,4.1vw,56px)/1.22 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);letter-spacing:.03em;max-width:100%;
    text-shadow:0 .035em 0 rgba(217,162,27,.55);
  }
  #line .ch{color:#8A7550;transition:color .18s linear,transform .18s ease;}
  #line .ch.on{color:#1C140B;}
  #next{
    margin-top:.5em;font:600 clamp(11px,1.5vw,17px)/1.3 "PingFang SC",sans-serif;
    letter-spacing:.09em;color:#8A6B3E;max-width:100%;opacity:.92;
  }
  #empty{
    font:700 clamp(12px,1.6vw,18px)/1.5 "PingFang SC",sans-serif;
    letter-spacing:.18em;color:#8A6B3E;
  }
  .hide{display:none;}
</style>
</head>
<body>
<div id="stage">
  <div id="wall" class="lay"></div>
  <canvas id="dyn" class="lay"></canvas>
  <div id="bust" class="lay"></div>
  <div id="frame" class="lay"></div>
  <div id="sign"><b id="signTitle">Highlife</b><span id="signSub">&nbsp;</span></div>
  <div id="band">
    <div id="line"></div>
    <div id="next"></div>
    <div id="empty" class="hide">此 曲 无 词</div>
  </div>
</div>
<script>
(function(){
  "use strict";

  var C={cream:'#E9D6A9',cream2:'#F3E4BF',ink:'#241B12',ochre:'#D9A21B',gold:'#B5791A',
         red:'#BE3A2A',green:'#2C6742',indigo:'#1E2A47',indigo2:'#2B3A5E',
         skin:'#8A5232',skinD:'#57301C',hair:'#1B1410'};

  var stageEl=document.getElementById('stage');
  var wallEl=document.getElementById('wall');
  var bustEl=document.getElementById('bust');
  var frameEl=document.getElementById('frame');
  var cv=document.getElementById('dyn');
  var ctx=cv.getContext('2d');
  var bandEl=document.getElementById('band');
  var lineEl=document.getElementById('line');
  var nextEl=document.getElementById('next');
  var emptyEl=document.getElementById('empty');
  var signTitle=document.getElementById('signTitle');
  var signSub=document.getElementById('signSub');

  var W=1440,H=900,DPR=1;
  var S={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',text:'',gl:false,rm:false,
         acc:[212,168,60],title:'',artist:''};
  var pulse=0, bassSm=0;
  var curIdx=-2, curLit=-1, spans=[], lineText='';
  var started=false, built=false, rebuildT=0;

  /* ---- self-check port: outermost in this script, unconditional, computed from live state ---- */
  window.__stage=function(){
    var L=S.lines||[], t=isFinite(S.t)?+S.t:0, idx=-1;
    for(var i=L.length-1;i>=0;i--){ if(t>=L[i].t){ idx=i; break; } }
    var txt=(idx>=0&&L[idx]&&L[idx].text!=null)?String(L[idx].text):'';
    return {lines:L.length, idx:idx, t:t, playing:!!S.playing, frames:S.frames,
            js:isFinite(S.js)?+S.js:0, err:S.err?String(S.err):'', text:txt,
            gl:false, rm:!!S.rm};
  };

  /* ---------------- utils ---------------- */
  function rng(seed){ var a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0;
    var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  /* ---------------- sizing ---------------- */
  function fit(){
    var w=window.innerWidth||1440, h=window.innerHeight||900;
    if(!isFinite(w)||w<=0) w=1440;
    if(!isFinite(h)||h<=0) h=900;
    W=Math.round(w); H=Math.round(h);
    DPR=clamp(window.devicePixelRatio||1,1,2);
    cv.width=Math.max(1,Math.round(W*DPR));
    cv.height=Math.max(1,Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    fitText();
  }

  /* ---------------- painted wall ---------------- */
  function makeCanvas(){
    var c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(W*DPR)); c.height=Math.max(1,Math.round(H*DPR));
    var g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
    return {c:c,g:g};
  }
  function push(el,c){
    try{ el.style.backgroundImage='url('+c.toDataURL('image/png')+')'; }
    catch(e){ console.error(e); }
  }

  function clothPanel(g,x,y,w,h,base,rand,motif){
    g.save();
    g.beginPath(); g.rect(x,y,w,h); g.clip();
    g.fillStyle=base; g.fillRect(x,y,w,h);
    // drape shading
    for(var i=0;i<10;i++){
      var xx=x+w*(i/10);
      g.globalAlpha=0.08; g.fillStyle=(i%2?'#000':'#fff');
      g.fillRect(xx,y,w/14,h);
    }
    g.globalAlpha=1;
    var step=Math.max(26,Math.min(w,h)/7);
    var rows=clamp(Math.floor(h/step),1,26), cols=clamp(Math.floor(w/step),1,26);
    for(var r=0;r<rows;r++){
      for(var c0=0;c0<cols;c0++){
        var mx=x+step*(c0+0.5)+((r%2)?step*0.5:0), my=y+step*(r+0.5);
        g.save(); g.translate(mx,my);
        motif(g,step*0.34,rand,(r*7+c0*3)%4);
        g.restore();
      }
    }
    g.restore();
  }

  function motifWax(g,s,rand,k){
    g.globalAlpha=0.9;
    if(k===0){
      g.fillStyle=C.ochre; g.beginPath(); g.arc(0,0,s*0.62,0,6.2832); g.fill();
      g.fillStyle=C.indigo; g.beginPath(); g.arc(0,0,s*0.34,0,6.2832); g.fill();
      g.fillStyle=C.red; g.beginPath(); g.arc(0,0,s*0.14,0,6.2832); g.fill();
    } else if(k===1){
      g.strokeStyle=C.cream; g.lineWidth=Math.max(1,s*0.16);
      g.beginPath(); g.moveTo(-s*0.7,0); g.lineTo(0,-s*0.7); g.lineTo(s*0.7,0); g.lineTo(0,s*0.7); g.closePath(); g.stroke();
    } else if(k===2){
      g.fillStyle=C.red; g.beginPath();
      g.moveTo(0,-s*0.7); g.lineTo(s*0.42,0); g.lineTo(0,s*0.7); g.lineTo(-s*0.42,0); g.closePath(); g.fill();
    } else {
      g.strokeStyle=C.ochre; g.lineWidth=Math.max(1,s*0.12);
      g.beginPath(); g.moveTo(-s*0.7,-s*0.3); g.lineTo(-s*0.2,-s*0.3); g.lineTo(-s*0.2,s*0.3);
      g.lineTo(s*0.25,s*0.3); g.lineTo(s*0.25,-s*0.3); g.lineTo(s*0.7,-s*0.3); g.stroke();
    }
    g.globalAlpha=1;
  }

  function drawWall(g){
    var rand=rng(20040121);
    g.fillStyle=C.cream; g.fillRect(0,0,W,H);
    // brush texture
    g.lineCap='round';
    for(var i=0;i<260;i++){
      var x=rand()*W, y=rand()*H, len=14+rand()*70, a=(-0.55+rand()*1.1);
      g.globalAlpha=0.05+rand()*0.05;
      g.strokeStyle=rand()<0.5?'#fff8e6':'#b99a5f';
      g.lineWidth=1+rand()*3;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len); g.stroke();
    }
    g.globalAlpha=1;
    // painted arch behind the sitter
    var cx=W*0.5, ar=Math.min(W*0.34,H*0.5);
    var grd=g.createRadialGradient(cx,H*0.34,ar*0.1,cx,H*0.34,ar*1.05);
    grd.addColorStop(0,'rgba(217,162,27,.30)'); grd.addColorStop(1,'rgba(217,162,27,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(cx,H*0.36,ar*1.05,0,6.2832); g.fill();
    // hanging wax prints
    var pw=Math.min(W*0.56,H*0.86);
    clothPanel(g,cx-pw/2,H*0.035,pw,H*0.72,C.indigo,rand,motifWax);
    var sw=Math.min(W*0.15,H*0.5);
    clothPanel(g,W*0.055,H*0.10,sw,H*0.60,C.green,rand,motifWax);
    clothPanel(g,W-sw-W*0.055,H*0.14,sw,H*0.52,C.red,rand,motifWax);
    // painted pole + cloth edge shadow
    g.globalAlpha=0.5; g.fillStyle='#000';
    g.fillRect(cx-pw/2-3,H*0.035,pw+6,H*0.012);
    g.globalAlpha=1;
    g.fillStyle='#3A2A16'; g.fillRect(cx-pw/2-W*0.02,H*0.028,pw+W*0.04,H*0.012);
  }

  /* ---------------- screenprint sitter ---------------- */
  function drawBust(g){
    var cx=W*0.5;
    var half=Math.min(W*0.27,H*0.34);
    var headR=Math.min(W*0.108,H*0.088);
    var headY=H*0.375;
    var shoulderY=H*0.60;

    // ---- robe (agbada) ----
    g.beginPath();
    g.moveTo(cx-half*1.06,H*1.02);
    g.quadraticCurveTo(cx-half*1.12,H*0.72,cx-half*0.72,shoulderY+headR*0.35);
    g.quadraticCurveTo(cx-half*0.30,H*0.565,cx, H*0.555);
    g.quadraticCurveTo(cx+half*0.30,H*0.565,cx+half*0.72,shoulderY+headR*0.35);
    g.quadraticCurveTo(cx+half*1.12,H*0.72,cx+half*1.06,H*1.02);
    g.closePath();
    g.save(); g.clip();
    g.fillStyle=C.cream2; g.fillRect(cx-half*1.2,H*0.5,half*2.4,H*0.6);
    // wax-print embroidery on the robe
    var step=Math.max(22,headR*0.62);
    for(var r=0;r<14;r++){
      for(var c0=0;c0<16;c0++){
        var mx=cx-half*1.15+step*(c0+0.5)+((r%2)?step*0.5:0), my=H*0.56+step*(r+0.5);
        if(tor(mx,my,cx,half,step)) continue;
        g.globalAlpha=0.75;
        if((r+c0)%3===0){ g.fillStyle=C.ochre; g.beginPath(); g.arc(mx,my,step*0.11,0,6.2832); g.fill(); }
        else if((r+c0)%3===1){ g.strokeStyle=C.green; g.lineWidth=Math.max(1,step*0.06);
          g.beginPath(); g.moveTo(mx-step*0.18,my+step*0.16); g.lineTo(mx,my-step*0.18); g.lineTo(mx+step*0.18,my+step*0.16); g.stroke(); }
        else { g.fillStyle=C.red; g.fillRect(mx-step*0.05,my-step*0.05,step*0.1,step*0.1); }
        g.globalAlpha=1;
      }
    }
    // fold shadows
    g.globalAlpha=0.16; g.fillStyle=C.ink;
    g.beginPath(); g.moveTo(cx-half*0.18,H*0.58); g.quadraticCurveTo(cx-half*0.34,H*0.86,cx-half*0.26,H*1.02);
    g.lineTo(cx-half*0.02,H*1.02); g.quadraticCurveTo(cx-half*0.06,H*0.8,cx+half*0.06,H*0.58); g.closePath(); g.fill();
    g.globalAlpha=1;
    g.restore();
    // robe outline
    g.lineWidth=Math.max(2,headR*0.055); g.strokeStyle=C.ink;
    g.beginPath();
    g.moveTo(cx-half*1.06,H*1.02);
    g.quadraticCurveTo(cx-half*1.12,H*0.72,cx-half*0.72,shoulderY+headR*0.35);
    g.quadraticCurveTo(cx-half*0.30,H*0.565,cx, H*0.555);
    g.quadraticCurveTo(cx+half*0.30,H*0.565,cx+half*0.72,shoulderY+headR*0.35);
    g.quadraticCurveTo(cx+half*1.12,H*0.72,cx+half*1.06,H*1.02);
    g.stroke();

    // ---- neck ----
    var nw=headR*0.52;
    g.fillStyle=C.skinD;
    g.beginPath(); g.moveTo(cx-nw,H*0.53); g.lineTo(cx-nw,H*0.40);
    g.lineTo(cx+nw,H*0.40); g.lineTo(cx+nw,H*0.53);
    g.quadraticCurveTo(cx,H*0.58,cx-nw,H*0.53); g.closePath(); g.fill();
    // collar
    g.fillStyle=C.cream; g.strokeStyle=C.ink; g.lineWidth=Math.max(2,headR*0.05);
    g.beginPath(); g.moveTo(cx-nw*1.5,H*0.565); g.lineTo(cx-nw*0.9,H*0.505);
    g.lineTo(cx,H*0.545); g.lineTo(cx+nw*0.9,H*0.505); g.lineTo(cx+nw*1.5,H*0.565);
    g.closePath(); g.fill(); g.stroke();

    // ---- head ----
    var hy=headY, rx=headR, ry=headR*1.24;
    g.fillStyle=C.skin;
    g.beginPath(); g.ellipse(cx,hy,rx,ry,0,0,6.2832); g.fill();
    // shadow side
    g.save();
    g.beginPath(); g.ellipse(cx,hy,rx,ry,0,0,6.2832); g.clip();
    g.globalAlpha=0.30; g.fillStyle=C.skinD;
    g.beginPath(); g.ellipse(cx+rx*0.62,hy, rx*0.8, ry*1.02,0,0,6.2832); g.fill();
    g.globalAlpha=1; g.restore();
    // jaw shadow
    g.globalAlpha=0.14; g.fillStyle=C.ink;
    g.beginPath(); g.ellipse(cx,hy+ry*0.62,rx*0.78,ry*0.3,0,0,6.2832); g.fill();
    g.globalAlpha=1;

    // ---- afro ----
    g.fillStyle=C.hair;
    g.beginPath();
    g.ellipse(cx,hy-ry*0.52,rx*1.30,ry*0.92,0,Math.PI*1.02,Math.PI*1.98);
    g.closePath(); g.fill();
    var rand=rng(7717);
    for(var i=0;i<15;i++){
      var a=Math.PI*(1.05+0.92*(i/14));
      var rad=rx*(1.12+rand()*0.22);
      g.beginPath(); g.arc(cx+Math.cos(a)*rad, hy-ry*0.42+Math.sin(a)*rad*0.72, rx*(0.20+rand()*0.11),0,6.2832); g.fill();
    }
    // ears
    g.fillStyle=C.skin;
    g.beginPath(); g.ellipse(cx-rx*1.02,hy+ry*0.02,rx*0.20,ry*0.24,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse(cx+rx*1.02,hy+ry*0.02,rx*0.20,ry*0.24,0,0,6.2832); g.fill();

    // ---- brows / glasses ----
    var eyeY=hy-ry*0.05, ew=rx*0.42, eh=rx*0.30, gap=rx*0.30;
    g.strokeStyle=C.ink; g.lineCap='round';
    g.lineWidth=Math.max(2,headR*0.055);
    g.beginPath(); g.moveTo(cx-gap-ew*1.05,eyeY-eh*1.55); g.lineTo(cx-gap+ew*0.15,eyeY-eh*1.75); g.stroke();
    g.beginPath(); g.moveTo(cx+gap-ew*0.15,eyeY-eh*1.75); g.lineTo(cx+gap+ew*1.05,eyeY-eh*1.55); g.stroke();
    // sunglasses
    g.fillStyle=C.hair;
    [[-1, cx-gap-ew*0.5],[1, cx+gap+ew*0.5]].forEach(function(p){
      g.beginPath();
      if(g.roundRect){ g.roundRect(p[1]-ew*0.62,eyeY-eh*0.85,ew*1.24,eh*1.62,eh*0.45); }
      else { g.rect(p[1]-ew*0.62,eyeY-eh*0.85,ew*1.24,eh*1.62); }
      g.fill();
    });
    g.strokeStyle=C.gold; g.lineWidth=Math.max(1.5,headR*0.035);
    g.beginPath(); g.moveTo(cx-gap+ew*0.14,eyeY-eh*0.3); g.lineTo(cx+gap-ew*0.14,eyeY-eh*0.3); g.stroke();
    // lens glint
    g.globalAlpha=0.5; g.strokeStyle='#fff6de'; g.lineWidth=Math.max(1,headR*0.03);
    g.beginPath(); g.moveTo(cx-gap-ew*0.62,eyeY-eh*0.55); g.lineTo(cx-gap-ew*0.2,eyeY-eh*0.72); g.stroke();
    g.globalAlpha=1;

    // ---- nose + mouth ----
    g.fillStyle=C.skinD; g.globalAlpha=0.55;
    g.beginPath(); g.moveTo(cx-rx*0.06,hy+ry*0.30); g.lineTo(cx-rx*0.20,hy+ry*0.50);
    g.lineTo(cx+rx*0.08,hy+ry*0.50); g.closePath(); g.fill();
    g.globalAlpha=1;
    g.fillStyle='#4A2418';
    g.beginPath(); g.ellipse(cx,hy+ry*0.68,rx*0.30,ry*0.09,0,0,6.2832); g.fill();
    g.fillStyle='#6B3524';
    g.beginPath(); g.ellipse(cx,hy+ry*0.665,rx*0.24,ry*0.055,0,0,6.2832); g.fill();

    // ---- rim light ----
    g.strokeStyle='rgba(233,214,169,.85)'; g.lineWidth=Math.max(2,headR*0.07);
    g.beginPath(); g.ellipse(cx,hy,rx*1.01,ry*1.01,0,-2.5,-1.15); g.stroke();
  }
  function tor(mx,my,cx,half,step){
    var dx=Math.abs(mx-cx);
    return dx>half*1.02;
  }

  /* ---------------- painted border + band ---------------- */
  function waveEdge(g,x1,y1,x2,y2,amp,waves,phase){
    var len=Math.hypot(x2-x1,y2-y1); if(!(len>0)) return;
    var nx=-(y2-y1)/len, ny=(x2-x1)/len;
    var steps=Math.max(10,Math.min(220,Math.round(len/9)));
    g.beginPath();
    for(var i=0;i<=steps;i++){
      var u=i/steps, o=amp*Math.sin(u*Math.PI*2*waves+phase);
      var x=x1+(x2-x1)*u+nx*o, y=y1+(y2-y1)*u+ny*o;
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.stroke();
  }
  function flower(g,x,y,r,petals,c1,c2){
    petals=clamp(petals,4,12);
    for(var i=0;i<petals;i++){
      var a=(6.2832/petals)*i;
      g.save(); g.translate(x,y); g.rotate(a);
      g.fillStyle=c1; g.beginPath(); g.ellipse(r*0.62,0,r*0.56,r*0.30,0,0,6.2832); g.fill();
      g.restore();
    }
    g.fillStyle=c2; g.beginPath(); g.arc(x,y,r*0.36,0,6.2832); g.fill();
    g.strokeStyle=C.ink; g.lineWidth=Math.max(1,r*0.09);
    g.beginPath(); g.arc(x,y,r*0.36,0,6.2832); g.stroke();
  }

  function drawFrame(g){
    var m=Math.min(W,H);
    var inset=Math.min(m*0.045, 42);
    var amp=m*0.012;
    var cols=[C.ochre,C.green,C.red];
    g.lineJoin='round'; g.lineCap='round';
    for(var k=0;k<3;k++){
      var ins=inset*(1+k*0.20);
      var x0=ins,y0=ins,x1=W-ins,y1=H-ins;
      g.strokeStyle=cols[k]; g.lineWidth=Math.max(3,m*0.016);
      g.globalAlpha=0.96;
      waveEdge(g,x0,y0,x1,y0,amp,Math.max(3,Math.round(W/(m*0.09))),k*1.1);
      waveEdge(g,x1,y0,x1,y1,amp,Math.max(3,Math.round(H/(m*0.09))),k*1.1+0.8);
      waveEdge(g,x1,y1,x0,y1,amp,Math.max(3,Math.round(W/(m*0.09))),k*1.1+1.6);
      waveEdge(g,x0,y1,x0,y0,amp,Math.max(3,Math.round(H/(m*0.09))),k*1.1+2.4);
    }
    g.globalAlpha=1;
    // corner flowers
    var fr=Math.min(m*0.055,52);
    var cs=[[inset*1.5,inset*1.5],[W-inset*1.5,inset*1.5],[inset*1.5,H-inset*1.6],[W-inset*1.5,H-inset*1.6]];
    for(var i=0;i<cs.length;i++){
      flower(g,cs[i][0],cs[i][1],fr,7,i%2?C.red:C.ochre,C.green);
    }
    // small painted ticks along the inner edge
    g.fillStyle=C.red; g.globalAlpha=0.75;
    for(var j=0;j<8;j++){
      var tx=W*(0.16+j*0.096);
      g.beginPath(); g.arc(tx,inset*0.62,Math.max(1.6,m*0.0045),0,6.2832); g.fill();
    }
    g.globalAlpha=1;

    // ---- lyric band ----
    var bt=H*0.685, wav=Math.max(6,H*0.014);
    function bandPath(off){
      g.beginPath(); g.moveTo(-4,H+4); g.lineTo(-4,bt+off);
      var n=clamp(Math.round(W/26),8,80);
      for(var i=0;i<=n;i++){
        var x=-4+(W+8)*(i/n);
        g.lineTo(x, bt+off+Math.sin((i/n)*Math.PI*6+0.5)*wav);
      }
      g.lineTo(W+4,H+4); g.closePath();
    }
    bandPath(0); g.fillStyle=C.cream2; g.fill();
    bandPath(0); g.strokeStyle=C.ink; g.lineWidth=Math.max(2,m*0.006); g.stroke();
    bandPath(Math.max(5,H*0.011)); g.strokeStyle=C.red; g.lineWidth=Math.max(1.5,m*0.0035); g.stroke();
    // ochre painted dots across the band's top
    g.fillStyle=C.ochre;
    for(var d=0; d<26; d++){
      var dx=W*(0.04+0.036*d);
      g.beginPath(); g.arc(dx, bt+Math.sin((dx/W)*Math.PI*6+0.5)*wav+Math.max(9,H*0.019), Math.max(1.5,m*0.004),0,6.2832); g.fill();
    }
  }

  /* ---------------- build layers ---------------- */
  function build(){
    if(!(W>0&&H>0)) return;
    try{
      var a=makeCanvas(); drawWall(a.g); push(wallEl,a.c);
      var b=makeCanvas(); drawBust(b.g); push(bustEl,b.c);
      var f=makeCanvas(); drawFrame(f.g); push(frameEl,f.c);
      built=true;
      stageEl.classList.add('on');
    }catch(e){ console.error(e); S.err=String(e&&e.message||e); }
  }
  function scheduleBuild(){
    clearTimeout(rebuildT);
    rebuildT=setTimeout(function(){ if(!built) build(); else build(); },170);
  }

  /* ---------------- lyrics ---------------- */
  function findIdx(t){
    var L=S.lines;
    for(var i=L.length-1;i>=0;i--){ if(t>=L[i].t) return i; }
    return -1;
  }
  function spanText(str){
    lineEl.innerHTML='';
    spans=[];
    for(var i=0;i<str.length;i++){
      var sp=document.createElement('span');
      sp.className='ch';
      sp.textContent=str.charAt(i)===' '?'\u00A0':str.charAt(i);
      lineEl.appendChild(sp); spans.push(sp);
    }
  }
  function fitText(){
    var str=lineText;
    if(!str){ return; }
    lineEl.style.whiteSpace='normal';
    var base=clamp(Math.min(W*0.045, H*0.062),18,58);
    lineEl.style.fontSize=base.toFixed(1)+'px';
    var maxH=bandEl.clientHeight*0.62;
    var maxW=bandEl.clientWidth;
    var n=0;
    while(n<16 && (lineEl.scrollHeight>maxH || lineEl.scrollWidth>maxW+2)){
      base*=0.92; lineEl.style.fontSize=base.toFixed(1)+'px'; n++;
    }
  }
  function setLine(idx){
    curIdx=idx; curLit=-1;
    var cur=idx>=0?S.lines[idx]:null;
    var txt=cur&&cur.text?String(cur.text):'';
    lineText=txt;
    if(txt!==S.text){ S.text=txt; }
    if(txt){
      emptyEl.classList.add('hide');
      lineEl.classList.remove('hide'); nextEl.classList.remove('hide');
      spanText(txt);
      fitText();
    } else {
      spans=[]; lineEl.innerHTML='';
      lineEl.classList.add('hide'); nextEl.classList.remove('hide');
      emptyEl.classList.toggle('hide', S.lines.length>0);
    }
    var nx=idx+1<S.lines.length?S.lines[idx+1]:null;
    nextEl.textContent=nx&&nx.text?String(nx.text):'';
  }

  function updateLit(litCount){
    if(litCount===curLit) return;
    if(litCount>curLit){
      for(var i=Math.max(0,curLit);i<litCount&&i<spans.length;i++) spans[i].classList.add('on');
    } else {
      for(var j=litCount;j<curLit&&j<spans.length;j++) spans[j].classList.remove('on');
    }
    curLit=litCount;
  }
  function charTime(cur,i){
    if(cur.chars && cur.chars.length){
      var c=cur.chars[Math.min(i,cur.chars.length-1)];
      if(c && isFinite(c.t)) return +c.t;
      var p=cur.chars[Math.min(i,cur.chars.length-1)];
      if(p&&isFinite(p.t)) return +p.t;
    }
    var dur=(cur.dur&&isFinite(cur.dur)&&cur.dur>0)?cur.dur:2.6;
    var n=Math.max(1,cur.text?cur.text.length:1);
    return cur.t + dur*(i/Math.max(1,n));
  }

  /* ---------------- frame loop ---------------- */
  function drawDyn(dt){
    ctx.clearRect(0,0,W,H);
    var cx=W*0.5, cy=H*0.375, m=Math.min(W,H);
    var k=clamp(pulse,0,1), b=clamp(bassSm,0,1);
    ctx.save();
    // painted halo rings behind the sitter
    ctx.globalAlpha=0.20+0.26*b;
    ctx.strokeStyle=C.ochre;
    ctx.lineWidth=Math.max(2,m*0.006);
    ctx.beginPath(); ctx.arc(cx,cy,m*(0.20+0.02*k),0,6.2832); ctx.stroke();
    ctx.globalAlpha=0.14+0.18*b;
    ctx.beginPath(); ctx.arc(cx,cy,m*(0.245+0.035*k),0,6.2832); ctx.stroke();
    // rays
    var rays=18;
    ctx.globalAlpha=0.10+0.16*b;
    ctx.strokeStyle=C.red;
    ctx.lineWidth=Math.max(1.5,m*0.0035);
    for(var i=0;i<rays;i++){
      var a=(6.2832/rays)*i + S.t*0.06;
      var r0=m*(0.255+0.03*k), r1=r0+m*(0.035+0.05*k);
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.stroke();
    }
    // floating dust
    if(!S.rm){
      ctx.globalAlpha=0.5;
      ctx.fillStyle='#FFF3D2';
      for(var d=0;d<26;d++){
        var seed=(d*97)%360;
        var yy=((H - ((S.t*18 + seed*7)%H)) + H)%H;
        var xx=(W*0.5)+Math.sin(S.t*0.5+d)*W*0.30 + (d%5-2)*W*0.02;
        ctx.fillRect(xx, yy, Math.max(1.4,m*0.003), Math.max(1.4,m*0.003));
      }
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function loop(){
    requestAnimationFrame(loop);
    var t0=performance.now();
    try{
      var dt=t0-(loop._p||t0); loop._p=t0;
      S.frames++;
      var idx=findIdx(S.t);
      if(idx!==curIdx) setLine(idx);
      if(idx>=0){
        var cur=S.lines[idx];
        if(cur&&cur.text){
          var lit=0;
          for(var i=0;i<cur.text.length;i++){ if(S.t>=charTime(cur,i)) lit=i+1; else break; }
          updateLit(lit);
        } else { updateLit(0); }
      } else { updateLit(0); }
      // beat smoothing
      pulse*=0.93; bassSm+=((S.bass||0)-bassSm)*0.16;
      drawDyn(dt);
      var sc=1+pulse*0.008, ty=-pulse*3;
      bustEl.style.transform='translateY('+ty.toFixed(2)+'px) scale('+sc.toFixed(4)+')';
      S.js=performance.now()-t0;
    }catch(e){ S.err=String(e&&e.message||e); console.error(e); }
  }

  /* ---------------- ready ---------------- */
  function ready(){
    if(started) return; started=true;
    try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){ console.error(e); }
  }

  /* ---------------- messages ---------------- */
  function onInit(p){
    p=p||{};
    var song=p.song||{};
    var lines=Array.isArray(p.lines)?p.lines:[];
    var out=[];
    for(var i=0;i<lines.length && i<4000;i++){
      var L=lines[i];
      if(!L||!isFinite(L.t)) continue;
      out.push({
        t:+L.t,
        dur:(isFinite(L.dur)&&L.dur>0)?+L.dur:0,
        text:L.text==null?'':String(L.text),
        chars:Array.isArray(L.chars)?L.chars:null
      });
    }
    out.sort(function(a,b){ return a.t-b.t; });
    S.lines=out;
    S.t=isFinite(S.t)?S.t:0;
    if(Array.isArray(p.accent)&&p.accent.length===3){
      var a=[+p.accent[0]||0,+p.accent[1]||0,+p.accent[2]||0];
      if(a[0]+a[1]+a[2]>30) S.acc=a;
    }
    S.playing=(typeof p.playing==='boolean')?p.playing:true;
    var name=song.name?String(song.name).trim():'';
    var art='';
    if(Array.isArray(song.artists)) art=song.artists.filter(function(x){return x!=null&&String(x).trim();}).map(String).join(' / ');
    else if(song.artists!=null) art=String(song.artists).trim();
    S.title=name; S.artist=art;
    signTitle.textContent=name||'无题';
    signSub.textContent=art||'影 棚 录 音';
    curIdx=-2; S.text='';
    setLine(findIdx(S.t));
    if(out.length){
      emptyEl.classList.add('hide');
    } else {
      emptyEl.classList.remove('hide');
      emptyEl.textContent='此 曲 无 词';
      lineEl.classList.add('hide'); nextEl.textContent='';
      curIdx=-1;
    }
  }

  window.addEventListener('message',function(ev){
    var d=ev.data; if(!d||d.__c100!==1) return;
    try{
      if(d.type==='init'){ onInit(d.payload); }
      else if(d.type==='tick'){
        var q=d.payload||{};
        if(isFinite(q.time)) S.t=+q.time;
        if(typeof q.playing==='boolean') S.playing=q.playing;
      } else if(d.type==='beat'){
        var bp=d.payload||{};
        if(isFinite(bp.level)) pulse=Math.max(pulse,clamp(+bp.level,0,1));
      } else if(d.type==='live'){
        var lp=d.payload||{};
        if(isFinite(lp.bass)) S.bass=clamp(+lp.bass,0,1);
        if(isFinite(lp.level)) S.bass=Math.max(S.bass||0,clamp(+lp.level,0,1)*0.7);
        if(typeof lp.playing==='boolean') S.playing=lp.playing;
      }
    }catch(e){ S.err=String(e&&e.message||e); console.error(e); }
  });

  window.addEventListener('resize',function(){
    try{ fit(); scheduleBuild(); }catch(e){ console.error(e); }
  });
  window.addEventListener('orientationchange',function(){
    try{ fit(); scheduleBuild(); }catch(e){ console.error(e); }
  });

  /* ---------------- boot ---------------- */
  try{
    S.rm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }catch(e){ S.rm=false; }

  function boot(){
    try{ fit(); }catch(e){ console.error(e); }
    requestAnimationFrame(function(){ ready(); });
    setTimeout(ready,500);
    requestAnimationFrame(loop);
    setTimeout(function(){ try{ build(); }catch(e){ console.error(e); } },0);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();

</script>
</body>
</html>
