<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLESH RELIQUARY — 05</title>
<style>
  :root{
    --ink:#050506;
    --bone:#f3ece1;
    --blood:rgb(214,26,30);
    --blood-rgb:214,26,30;
    --accent:rgb(214,26,30);
    --mono:'Consolas','SFMono-Regular',ui-monospace,monospace;
    --goth:'Old English Text MT','UnifrakturMaguntia','Blackletter',Georgia,serif;
    --disp:'Impact','Haettenschweiler','Arial Narrow',"Franklin Gothic Bold",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    font-family:var(--mono);color:#8b8580;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  #fig{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
  /* fallback / extra depth if webgl dies */
  #stage.nogl #bg{background:
      radial-gradient(60% 70% at 26% 46%, #240a0c 0%, #0b0405 46%, #000 78%),
      radial-gradient(40% 40% at 96% 100%, #1c0507 0%, #000 70%);}

  /* film layer: grain + scan + vignette */
  #film{position:absolute;inset:0;z-index:6;pointer-events:none;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 90% at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.92) 100%);
    mix-blend-mode:multiply;
  }
  #grain{position:absolute;inset:-40%;z-index:7;pointer-events:none;opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grainMove .6s steps(3) infinite;
  }
  @keyframes grainMove{
    0%{transform:translate3d(0,0,0)}33%{transform:translate3d(-2%,1.6%,0)}66%{transform:translate3d(1.4%,-2.2%,0)}100%{transform:translate3d(0,0,0)}
  }

  /* ── header / rot logo ─────────────────────────── */
  #head{position:absolute;z-index:5;left:2.6vw;top:3.2vh;max-width:44vw}
  #logo{
    font-family:var(--disp);
    font-size:clamp(22px,3.1vw,46px);
    line-height:.92;letter-spacing:.035em;
    color:#e9dfd2;
    filter:url(#rot) drop-shadow(0 0 22px rgba(214,26,30,.38));
    text-transform:uppercase;
    transform:skewX(-4deg) rotate(-.8deg);
    text-shadow:2px 2px 0 #000, 0 0 3px rgba(0,0,0,.9);
  }
  #logo b{color:var(--blood);font-weight:400}
  #meta{margin-top:10px;font-size:10px;letter-spacing:.34em;color:#6b6460;text-transform:uppercase;
    display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #meta i{font-style:normal;color:#3f3a38}
  #meta .dot{width:4px;height:4px;border-radius:50%;background:var(--blood);box-shadow:0 0 10px var(--blood)}

  /* ── top right rec ─────────────────────────────── */
  #rec{position:absolute;z-index:5;right:2.4vw;top:3.4vh;text-align:right;font-size:10px;letter-spacing:.3em;color:#585250;text-transform:uppercase}
  #rec .l{display:flex;gap:8px;align-items:center;justify-content:flex-end}
  #rec .led{width:6px;height:6px;border-radius:50%;background:var(--blood);box-shadow:0 0 12px var(--blood);animation:blink 1.6s steps(1) infinite}
  @keyframes blink{0%,52%{opacity:1}53%,100%{opacity:.14}}
  #tc{margin-top:8px;color:#7d7672;font-variant-numeric:tabular-nums;letter-spacing:.16em}

  /* ── suture line tying figure to text ──────────── */
  #suture{position:absolute;z-index:2;left:47.5%;right:-2%;top:67%;height:3px;pointer-events:none;
    transform:rotate(-.55deg);transform-origin:left center;
    background:repeating-linear-gradient(90deg, rgba(206,28,26,.66) 0 26px, rgba(206,28,26,0) 26px 38px);
    opacity:.6;filter:drop-shadow(0 0 10px rgba(214,26,30,.55))}
  #suture::before{content:"";position:absolute;left:0;right:0;top:50%;height:17px;transform:translateY(-50%);
    background:repeating-linear-gradient(90deg, rgba(238,232,224,.20) 0 1.5px, rgba(0,0,0,0) 1.5px 38px)}
  #suture::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;transform:translateY(-50%);
    background:linear-gradient(90deg, rgba(255,60,44,0), rgba(255,60,44,.35) 18%, rgba(255,60,44,.10) 100%)}

  /* ── vertical watermark ────────────────────────── */
  #wm{position:absolute;z-index:2;right:-1.6vw;top:50%;transform:translateY(-50%);pointer-events:none;
    writing-mode:vertical-rl;font-family:var(--disp);font-size:clamp(80px,15vw,240px);line-height:.8;
    letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.075);
    opacity:.9;user-select:none}
  /* ── lyrics ────────────────────────────────────── */
  #lyr{position:absolute;z-index:5;left:48.5%;right:4.4vw;top:50%;transform:translateY(-50%);
    padding-left:24px;border-left:2px solid rgba(214,26,30,.5)}
  #lyr::before{content:"";position:absolute;left:-2px;top:0;width:2px;height:100%;
    background:linear-gradient(180deg,rgba(214,26,30,0) 0%,rgba(255,60,50,.9) 30%,rgba(214,26,30,.25) 100%);
    box-shadow:0 0 22px rgba(214,26,30,.7)}
  #prev,#next{font-family:var(--disp);text-transform:uppercase;line-height:.95;letter-spacing:.01em;
    white-space:pre-wrap;overflow:hidden;transition:opacity .3s}
  #prev{font-size:clamp(14px,1.5vw,24px);color:#fff;opacity:.24;filter:blur(.35px);margin-bottom:.55em;max-height:2em}
  #next{font-size:clamp(13px,1.35vw,21px);color:#fff;opacity:.16;margin-top:.75em;filter:blur(.5px);max-height:2em}
  #cur{
    position:relative;
    font-family:var(--disp);text-transform:uppercase;
    font-size:clamp(30px,4.55vw,86px);line-height:.9;letter-spacing:-.004em;
    white-space:pre-wrap;word-break:normal;overflow-wrap:break-word;hyphens:none;
    filter:drop-shadow(0 2px 26px rgba(0,0,0,.9));
    min-height:1em;
  }
  #cur .ch{
    display:inline-block;white-space:pre;
    color:#2b2221;
    transform:translateY(calc(var(--jo,0) * 1px)) rotate(var(--ro,0deg));
    transition:color .16s linear, text-shadow .34s ease, transform .42s cubic-bezier(.16,1.5,.3,1);
    will-change:color,transform,text-shadow;
  }
  #cur .ch.on{
    color:var(--bone);
    text-shadow:
      0 0 2px rgba(255,235,225,.55),
      0 0 26px rgba(214,26,30,.5),
      -.8px 0 0 rgba(255,40,40,.55),
      .8px 0 0 rgba(120,210,230,.22);
    transform:translateY(calc((var(--jo,0) - 1.4) * 1px)) rotate(calc(var(--ro,0deg) * .3));
  }
  #cur .ch.sp{width:.28em}
  #cur.hit .ch.on{
    text-shadow:
      0 0 2px rgba(255,255,255,.8),
      0 0 40px rgba(255,30,30,.85),
      -2.5px 0 0 rgba(255,40,40,.7),
      2.5px 0 0 rgba(90,225,235,.3);
  }
  /* line entry slam */
  #cur.slam{animation:slamIn .44s cubic-bezier(.2,.9,.2,1)}
  @keyframes slamIn{
    0%{transform:translateY(12px) scaleX(1.05);filter:blur(8px) brightness(2.1)}
    55%{filter:blur(0) brightness(1.2)}
    100%{transform:none;filter:drop-shadow(0 2px 26px rgba(0,0,0,.9))}
  }

  #lidx{margin-top:1.15em;display:flex;gap:10px;align-items:center;font-size:10px;letter-spacing:.34em;color:#4d4644}
  #lidx .bar{flex:1;height:1px;background:linear-gradient(90deg,rgba(214,26,30,.75),rgba(255,255,255,.04))}
  #lidx b{color:#a09a95;font-weight:400}

  /* ── meters ────────────────────────────────────── */
  #meters{position:absolute;z-index:5;right:1.1vw;bottom:12vh;display:flex;gap:3px;align-items:flex-end;height:16vh;opacity:.55}
  #meters i{display:block;width:3px;height:100%;background:linear-gradient(180deg,rgba(255,70,50,.95),rgba(214,26,30,.25));
    transform-origin:bottom;transform:scaleY(.08);transition:transform .07s linear}

  /* ── footer ────────────────────────────────────── */
  #foot{position:absolute;z-index:5;left:2.6vw;bottom:3.4vh;font-size:9.5px;letter-spacing:.36em;color:#413b39;text-transform:uppercase;display:flex;gap:16px}
  #foot b{color:#8a827d;font-weight:400}
  #sig{position:absolute;z-index:5;right:2.4vw;bottom:3.4vh;font-family:var(--goth);font-size:16px;color:rgba(214,26,30,.5);letter-spacing:.06em}
  #flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(70% 60% at 34% 48%,rgba(255,44,36,.5),rgba(255,30,24,0) 70%);opacity:0;mix-blend-mode:screen}

  /* portrait / narrow */
  @media (max-aspect-ratio:1/1){
    #lyr{left:5.5vw;right:5.5vw;top:auto;bottom:6.5vh;transform:none;padding-left:16px}
    #head{max-width:76vw}
    #wm{font-size:22vw;opacity:.5}
    #cur{font-size:clamp(28px,7.4vw,64px)}
    #meters{bottom:auto;top:16vh;height:11vh;right:2vw}
    #prev,#next{max-height:1.6em}
  }

  @media (prefers-reduced-motion: reduce){
    #grain{animation:none}
    #rec .led{animation:none;opacity:1}
    #cur .ch{transition:none}
    #cur.slam{animation:none}
  }
  .shot #grain,.shot #rec .led{animation:none}
  .shot #rec .led{opacity:1}
  .shot #cur .ch{transition:none}
  .shot #cur.slam{animation:none}
  /* 未唱的字要「暗但可见」：靠 .ch 的颜色区分，不再整行压半透明 */
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rot" x="-25%" y="-45%" width="150%" height="200%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.062" numOctaves="3" seed="17" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation=".28"/>
  </filter>
</svg>

<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="fig"></canvas>
  <!-- 人物视频 + 蒙版必须待在 #stage 里：#stage 有 isolation:isolate，
       放在 body 上（z-index 2/4）会整层盖住里面的歌词，把字压成灰的 -->
  <video id="charVid" src="assets/char-296.mp4" muted loop playsinline autoplay preload="auto"></video>
  <div id="scrim"></div>
  <div id="wm">GRIND</div>
  <div id="suture"></div>
  <div id="flash"></div>
  <div id="film"></div>
  <div id="grain"></div>

  <header id="head">
    <div id="logo">FLESH<b>&nbsp;//&nbsp;</b>RELIQUARY</div>
    <div id="meta"><span class="dot"></span><span id="mArt">GORE//GANG</span><i>/</i><span id="mName">UNTITLED</span><i>/</i><span id="mBpm">— BPM</span></div>
  </header>

  <div id="rec">
    <div class="l"><span class="led"></span><span>REC</span></div>
    <div id="tc">00:00.00</div>
  </div>

  <section id="lyr">
    <div id="prev"></div>
    <div id="cur" data-text=""></div>
    <div id="next"></div>
    <div id="lidx"><span id="lno">01</span><span class="bar"></span><span><b id="ltot">08</b>&nbsp;LINES</span></div>
  </section>

  <div id="meters"></div>

  <footer id="foot"><span>C100 <b>/ 05</b></span><span>TRAP&nbsp;METAL&nbsp;×&nbsp;GOREGRIND</span><span id="fstate">STANDBY</span></footer>
  <div id="sig">memento mori</div>
</div>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════
   0. state / util
   ══════════════════════════════════════════════════════════ */
var $ = function(s){ return document.querySelector(s); };
var ERRS = "", FRAMES = 0, HASGL = false, REDUCED = false, DEMO = false;
var SHOT = /(?:[?&#]|^)shot\b/.test((location.search || "") + (location.hash || ""));
var TEST = /(?:[?&#]|^)test\b/.test((location.search || "") + (location.hash || ""));
var SHOTSTOP = false;
if(SHOT) document.documentElement.classList.add("shot");
var stageEl = $("#stage"), bg = $("#bg"), fig = $("#fig");
var curEl = $("#cur"), prevEl = $("#prev"), nextEl = $("#next");
var flashEl = $("#flash");

window.addEventListener("error", function(e){ ERRS = String((e && e.message) || "error"); });
window.addEventListener("unhandledrejection", function(e){
  try{ ERRS = String(e.reason && e.reason.message || e.reason || "rejection"); }catch(_){ ERRS = "rejection"; }
});
try{
  var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
  REDUCED = !!mq.matches;
  if(mq.addEventListener) mq.addEventListener("change", function(e){ REDUCED = e.matches; });
}catch(_){}

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  var t = Math.imul(a ^ a >>> 15, 1 | a), u = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((u ^ u >>> 14) >>> 0) / 4294967296; }; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rr(r,a,b){ return a + (b-a)*r(); }
function fmtT(t){
  t = Math.max(0, t||0);
  var m = Math.floor(t/60), s = t - m*60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s.toFixed(2);
}

/* ══════════════════════════════════════════════════════════
   1. song / timeline state
   ══════════════════════════════════════════════════════════ */
var S = {
  name:"FLESH RELIQUARY", artists:["GORE//GANG"], cover:null,
  accent:[214,26,30], lines:[], duration:36,
  idx:-1, lit:-1, text:""
};
var playing = false;
var clockT = 0, clockWall = 0;        // authoritative clock from tick
var started = false;
var beatLvl = 0, beatIdx = -1, beatWall = 0;
var live = {bpm:0, level:0, bass:0, mid:0, treble:0, playing:false};
var motionT = 0;
var synthNext = 0, synthStep = 0;

function nowSec(){ return performance.now()/1000; }

function estT(){
  if(!playing) return clockT;
  var t = clockT + (nowSec() - clockWall);
  if(S.duration) t = Math.min(t, S.duration + 0.001);
  return t;
}

/* ══════════════════════════════════════════════════════════
   2. accent → blood palette
   ══════════════════════════════════════════════════════════ */
function setAccent(acc){
  var a = (acc && acc.length >= 3) ? acc : [214,26,30];
  var r = clamp(Math.round(a[0]*0.42 + 255*0.58), 120, 255);
  var g = clamp(Math.round(a[1]*0.10 + 14*0.9), 0, 70);
  var b = clamp(Math.round(a[2]*0.10 + 16*0.9), 0, 70);
  var blood = "rgb("+r+","+g+","+b+")";
  var ar = clamp(Math.round(a[0]),0,255), ag = clamp(Math.round(a[1]),0,255), ab = clamp(Math.round(a[2]),0,255);
  document.documentElement.style.setProperty("--blood", blood);
  document.documentElement.style.setProperty("--blood-rgb", r+","+g+","+b);
  document.documentElement.style.setProperty("--accent", "rgb("+ar+","+ag+","+ab+")");
  BLOOD = [r/255, g/255, b/255];
}
var BLOOD = [1,0.13,0.14];

/* ══════════════════════════════════════════════════════════
   3. WebGL backdrop — flayed leather / muscle field
   ══════════════════════════════════════════════════════════ */
var gl = null, prog = null, U = {}, glCanvas = bg;
function initGL(){
  try{
    gl = bg.getContext("webgl", {antialias:false, alpha:false, depth:false, preserveDrawingBuffer:true})
      || bg.getContext("experimental-webgl", {antialias:false, alpha:false});
  }catch(e){ gl = null; }
  if(!gl) return false;
  var VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}";
  var FS = [
  "precision highp float;",
  "uniform vec2 R;uniform float T;uniform float B;uniform float BT;",
  "float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}",
  "float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);",
  " float a=h(i),b=h(i+vec2(1.0,0.0)),c=h(i+vec2(0.0,1.0)),d=h(i+vec2(1.0,1.0));",
  " return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
  "float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*n2(p);p=p*2.03+vec2(3.7,9.1);a*=0.5;}return s;}",
  "void main(){",
  " vec2 uv=gl_FragCoord.xy/R;float asp=R.x/R.y;vec2 p=vec2(uv.x*asp,uv.y);",
  " float tt=T*0.10;",
  " float m=fbm(p*2.4+vec2(tt*0.4,-tt*0.3));",
  " float grain=fbm(vec2(p.x*3.5,p.y*80.0));",
  " float fib=fbm(vec2(p.x*9.0+m*1.4,p.y*1.2+m*0.4));",
  " float fib2=fbm(vec2(p.x*26.0+m*2.0,p.y*1.7));",
  " float vv=1.0-abs(fbm(p*3.2+vec2(1.7,4.3))-0.5)*2.0;",
  " float vein=pow(clamp(vv,0.0,1.0),11.0);",
  " float dA=length((uv-vec2(0.34,0.50))*vec2(1.05,1.0));",
  " float mA=smoothstep(0.44,1.05,dA);",
  " float dB=length((uv-vec2(0.96,0.02))*vec2(1.3,1.0));",
  " float mB=smoothstep(0.58,0.02,dB);",
  " float dC=length((uv-vec2(-0.02,0.02))*vec2(1.3,1.0));",
  " float mC=smoothstep(0.62,0.02,dC);",
  " float mask=clamp(mA*0.5+mB*0.95+mC*0.55,0.0,1.0);",
  " float pulse=0.74+0.46*B+0.30*BT;",
  " vec3 col=vec3(0.004,0.003,0.004);",
  " float leather=smoothstep(0.34,0.94,grain);",
  " col+=vec3(0.022,0.020,0.024)*leather*mask;",
  " float meat=fib*0.72+fib2*0.28;",
  " col+=mix(vec3(0.07,0.006,0.008),vec3(0.34,0.032,0.034),smoothstep(0.46,0.94,meat))*smoothstep(0.50,0.96,meat)*mask*pulse*0.70;",
  " col+=vec3(0.52,0.026,0.030)*vein*mask*pulse*0.62;",
  " float seam=exp(-pow((uv.x-0.470)*8.0,2.0));",
  " col+=vec3(0.15,0.006,0.008)*seam*0.20*pulse;",
  " col*=smoothstep(1.34,0.20,length((uv-0.5)*vec2(1.02,1.14))*1.3);",
  " col+=(h(gl_FragCoord.xy+fract(T)*311.0)-0.5)*0.030;",
  " gl_FragColor=vec4(max(col,vec3(0.0)),1.0);"
  ].join("\n");

  function sh(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader");
    return s;
  }
  try{
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link");
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "a");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    U.R = gl.getUniformLocation(prog, "R");
    U.T = gl.getUniformLocation(prog, "T");
    U.B = gl.getUniformLocation(prog, "B");
    U.BT = gl.getUniformLocation(prog, "BT");
    HASGL = true;
    return true;
  }catch(e){
    // silent, graceful fallback to the CSS backdrop
    HASGL = false;
    stageEl.classList.add("nogl");
    return false;
  }
}

/* ══════════════════════════════════════════════════════════
   4. procedural flesh / noise textures (offscreen, once)
   ══════════════════════════════════════════════════════════ */
var fleshCv = null, noiseCv = null;

function makeFlesh(){
  var c = document.createElement("canvas"); c.width = c.height = 460;
  var x = c.getContext("2d");
  x.fillStyle = "#1b0406"; x.fillRect(0,0,460,460);
  var r = mulberry(9173);
  // deep subcutaneous blotches
  for(var i=0;i<46;i++){
    var bx = r()*460, by = r()*460, br = 24+r()*90;
    var g = x.createRadialGradient(bx,by,1,bx,by,br);
    var tone = r();
    g.addColorStop(0, tone>.6 ? "rgba(150,30,26,.34)" : "rgba(24,3,4,.55)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.beginPath(); x.arc(bx,by,br,0,7); x.fill();
  }
  // muscle striations, vertical
  for(var k=0;k<3000;k++){
    var px = r()*460, py = r()*460;

    ctx.bezierCurveTo(cx+w*0.05, top+h*1.02, cx-w*0.05, top+h*1.02, cx-w*0.16, top+h);

    g.addColorStop(0.88,"#8f8172");

function drawChain(ctx, x0,y0,x1,y1, sag, n){

    var dx = (x1-x0) + Math.PI*Math.cos(Math.PI*u)*sag;
    var dy = (y1-y0) + Math.PI*Math.cos(Math.PI*u)*sag;

    ctx.beginPath(); ctx.ellipse(0,0,10.6,5.6,0,0,7);

function drawWire(ctx, x0,y0,x1,y1, sag, n, alpha){
  var p = new Path2D();
  p.moveTo(x0,y0);
  p.quadraticCurveTo((x0+x1)/2, (y0+y1)/2 + sag*2, x1,y1);
  ctx.beginPath(); ctx.moveTo(x0,y0);
  ctx.quadraticCurveTo((x0+x1)/2, (y0+y1)/2 + sag*2, x1,y1);
  ctx.strokeStyle = "rgba(150,152,160,"+(alpha||.3)+")"; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0,y0);
  ctx.quadraticCurveTo((x0+x1)/2, (y0+y1)/2 + sag*2 - 1.2, x1,y1-1.2);
  ctx.strokeStyle = "rgba(255,255,255,"+((alpha||.3)*0.5)+")"; ctx.lineWidth = 0.6; ctx.stroke();
  for(var i=1;i<n;i++){
    var u = i/n;
    var x = (1-u)*(1-u)*x0 + 2*(1-u)*u*((x0+x1)/2) + u*u*x1;
    var y = (1-u)*(1-u)*y0 + 2*(1-u)*u*((y0+y1)/2 + sag*2) + u*u*y1;
    ctx.save(); ctx.translate(x,y); ctx.rotate(-0.6 + (i%2)*0.9);
    ctx.beginPath();
    ctx.moveTo(-7,-5); ctx.lineTo(0,0); ctx.lineTo(-7,5);
    ctx.moveTo(7,-5); ctx.lineTo(0,0); ctx.lineTo(7,5);
    ctx.strokeStyle = "rgba(180,182,190,"+(alpha||.3)*0.95+")"; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.restore();
  }
}

/* ══════════════════════════════════════════════════════════
   6. lyric rendering
   ══════════════════════════════════════════════════════════ */
var lineSpans = [], litIdx = -1, glitchUntil = 0, RL = 0;
var measureCtx = document.createElement("canvas").getContext("2d");

function fitCur(){
  var txt = curEl.dataset.text || "";
  curEl.style.fontSize = "";
  if(!txt) return;
  var cs = getComputedStyle(curEl);
  var base = parseFloat(cs.fontSize) || 48;
  var avail = (curEl.clientWidth - 2) * 0.995;
  if(avail <= 10) return;
  var fam = cs.fontFamily || "Impact, sans-serif";
  var s = base;
  while(s > 17){
    measureCtx.font = "400 " + s + "px " + fam;
    if(measureCtx.measureText(txt).width * 1.03 <= avail) break;
    s -= 1.5;
  }
  curEl.style.fontSize = s + "px";
}

/* 逐字切分：以「正文」为准，绝不因为 YRC 与正文长度不一致而丢字。
   - 有 chars 且长度与正文相同 → 直接用它的逐字时间（YRC）
   - 有 chars 但长度不同 → 按位置比例映射时间（YRC 里常夹标点/空格）
   - 没有 chars（LRC）→ 时间留 null，由上层按句长均分 */
function makeChars(line){
  var raw = String(line.text || "");
  var arr = [];
  var cs = line.chars;
  var n = raw.length;
  if(cs && cs.length){
    for(var k=0;k<n;k++){
      var t = null;
      if(cs.length === n){ t = (cs[k].t == null ? null : +cs[k].t); }
      else {
        var j = Math.min(cs.length - 1, Math.floor(k * cs.length / Math.max(1, n)));
        t = (cs[j] && cs[j].t != null) ? +cs[j].t : null;
      }
      arr.push({ c: raw.charAt(k), t: t });
    }
    return arr;
  }
  for(var m=0;m<n;m++) arr.push({ c: raw.charAt(m), t: null });
  return arr;
}

function hash01(n){
  var x = Math.sin(n*127.1 + 311.7)*43758.5453;
  return x - Math.floor(x);
}

function renderLine(i){
  RL++;
  var ln = S.lines[i];
  if(!ln){ curEl.innerHTML = ""; curEl.setAttribute("data-text",""); prevEl.textContent=""; nextEl.textContent=""; return; }
  var chars = makeChars(ln);
  curEl.innerHTML = "";
  curEl.setAttribute("data-text", ln.text || "");
  lineSpans = [];
  for(var k=0;k<chars.length;k++){
    var ch = chars[k];
    var sp = document.createElement("span");
    sp.className = "ch" + (ch.c === " " ? " sp" : "");
    sp.textContent = ch.c;
    sp.style.setProperty("--jo", ((hash01(k+i*13)*2-1)*2.4).toFixed(2));
    sp.style.setProperty("--ro", ((hash01(k+i*7)*2-1)*2.6).toFixed(2)+"deg");
    curEl.appendChild(sp);
    var ct = ch.t;
    if(ct == null){ var _d = (ln.dur == null ? 4 : +ln.dur); ct = (+ln.t || 0) + _d * 0.88 * k / Math.max(1, chars.length); }
    lineSpans.push({ el: sp, t: ct, on: false });
  }
  litIdx = -1;
  prevEl.textContent = S.lines[i-1] ? S.lines[i-1].text : "";
  nextEl.textContent = S.lines[i+1] ? S.lines[i+1].text : "";
  fitCur();
  /* 自愈：容器比例极端时 fitCur 可能把字号算成 0，兜底给一个可见字号 */
  try{
    if(lineSpans.length && lineSpans[0].el.getBoundingClientRect().height < 2){
      curEl.style.fontSize = "clamp(16px, 3.0vw, 46px)";
      curEl.style.opacity = "1";}
  }catch(e){}
  curEl.style.opacity = "1";var total = S.lines.length;
  $("#lno").textContent = (i+1<10?"0":"") + (i+1);
  $("#ltot").textContent = (total<10?"0":"") + total;
  // line entry slam
  if(!REDUCED && !SHOT){
    curEl.classList.remove("slam");
    void curEl.offsetWidth;
    curEl.classList.add("slam");
  }
}

function updateLyrics(t){
  var i = -1;
  for(var k=0;k<S.lines.length;k++){
    if(S.lines[k].t <= t + 1e-4) i = k; else break;
  }
  if(i !== S.idx){
    S.idx = i;
    if(i >= 0) renderLine(i);
    else { curEl.innerHTML=""; curEl.setAttribute("data-text",""); prevEl.textContent=""; nextEl.textContent=""; lineSpans=[]; litIdx=-1; }
  }
  if(i < 0){ S.text = ""; return; }

  var ln = S.lines[i];
  var hasCharT = false;
  for(var m=0;m<lineSpans.length;m++){ if(lineSpans[m].t != null){ hasCharT = true; break; } }

  if(!hasCharT){
    if(litIdx !== -2){
      for(var a=0;a<lineSpans.length;a++){
        lineSpans[a].on = true;
        lineSpans[a].el.classList.add("on");
        lineSpans[a].el.style.color = "#efe9dc";
      }
      litIdx = -2;
    }
  } else {
    var _prog = (t - (+ln.t || 0)) / Math.max(0.6, (ln.dur == null ? 4 : +ln.dur));
    var _upto = Math.floor(Math.max(0, _prog) * lineSpans.length * 1.12);
    for(var b=0;b<lineSpans.length;b++){
      var sp = lineSpans[b];
      if(sp.on) continue;
      if((sp.t != null && t >= sp.t) || b <= _upto){
        sp.on = true;
        sp.el.classList.add("on");
        sp.el.style.color = "#efe9dc";
      }
      else if(sp.t == null){
        sp.on = true;
        sp.el.classList.add("on");
        sp.el.style.color = "#efe9dc";
      }
    }
  }
  S.text = ln.text || "";
}

/* ══════════════════════════════════════════════════════════
   7. meters / hud
   ══════════════════════════════════════════════════════════ */
var meterEls = [], metN = 26;
(function buildMeters(){
  var box = $("#meters");
  for(var i=0;i<metN;i++){
    var el = document.createElement("i");
    box.appendChild(el); meterEls.push(el);
  }
})();
var meterSeed = []; for(var mi=0;mi<metN;mi++) meterSeed.push(hash01(mi*3.77));

function updateMeters(){
  var lvl = Math.max(live.level || 0, beatLvl);
  var bass = Math.max(live.bass || 0, beatLvl*0.9);
  var mid = live.mid || 0, tre = live.treble || 0;
  for(var i=0;i<metN;i++){
    var x = i/(metN-1);
    var shape = Math.sin(x*Math.PI*0.92 + 0.18);
    var jitter = meterSeed[i]*0.22;
    var v = 0.06 + shape*(0.18 + lvl*0.42) + jitter*(0.3+lvl*0.7) + bass*0.16*shape + tre*(1-shape)*0.14;
    if(!playing) v *= 0.55;
    meterEls[i].style.transform = "scaleY(" + clamp(v,0.03,1).toFixed(3) + ")";
  }
}

function updateHud(t){
  $("#tc").textContent = fmtT(t);
  var bpm = live.bpm || 0;
  $("#mBpm").textContent = bpm ? (Math.round(bpm) + " BPM") : "— BPM";
  $("#fstate").textContent = playing ? "LIVE" : (started ? "PAUSED" : "STANDBY");
}

/* ══════════════════════════════════════════════════════════
   8. main loop
   ══════════════════════════════════════════════════════════ */
var lastWall = nowSec(), metersTick = 0;

function frame(){
  try{
    var nw = nowSec();
    var dt = Math.min(0.06, Math.max(0, nw - lastWall));
    lastWall = nw;
    FRAMES++;

    // demo synth beats
    if(DEMO && playing && !REDUCED){
      if(nw >= synthNext){
        beatLvl = 0.55 + 0.45*Math.abs(Math.sin(synthStep*1.7));
        beatIdx = synthStep;
        if(synthStep % 4 === 0) addFlash(0.5 + beatLvl*0.4);
        synthStep++;
        synthNext = nw + 0.415;
      }
      var ls = 0.55 + 0.35*Math.sin(synthStep*1.1) + 0.1*Math.sin(synthStep*4.3);
      live.level = Math.max(live.level*0.8, clamp(ls,0,1));
      live.bass = clamp(0.55 + 0.4*Math.sin(synthStep*0.8), 0, 1);
      live.mid = clamp(0.4 + 0.35*Math.sin(synthStep*1.6), 0, 1);
      live.treble = clamp(0.35 + 0.4*Math.sin(synthStep*2.7), 0, 1);
      live.bpm = 142;
    }

    if(playing && !REDUCED) motionT += dt;
    var decay = playing ? Math.exp(-dt * (REDUCED ? 14 : 5.6)) : 1;
    beatLvl *= decay;
    if(beatLvl < 0.001) beatLvl = 0;
    figState.eyeDilate = beatLvl * 0.85 + (live.bass || 0) * 0.25;
    figState.vPulse = beatLvl;

    var bA = Math.min(1, beatLvl);

    // flash decay
    var fl = parseFloat(flashEl.dataset.v || "0");
    if(fl > 0.001){
      fl *= Math.exp(-dt*11);
      flashEl.dataset.v = fl;
      flashEl.style.opacity = fl.toFixed(3);
    } else if(fl !== 0){ flashEl.dataset.v = 0; flashEl.style.opacity = 0; }

    // lyrics
    var t = estT();
    updateLyrics(t);
    updateHud(t);
    if(bA > 0.40 && !REDUCED){ curEl.classList.add("hit"); }
    else if(bA < 0.20){ curEl.classList.remove("hit"); }

    // meters ~ every other frame
    metersTick++;
    if(metersTick % 2 === 0) updateMeters();

    // ── paint backdrop
    if(gl && HASGL){
      gl.viewport(0,0,bg.width,bg.height);
      gl.uniform2f(U.R, bg.width, bg.height);
      gl.uniform1f(U.T, REDUCED ? 0 : (motionT + 1.7));
      gl.uniform1f(U.B, clamp(live.bass||0,0,1));
      gl.uniform1f(U.BT, bA);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // ── paint figure
    if(fctx){
      fctx.setTransform(1,0,0,1,0,0);
      fctx.clearRect(0,0,fig.width,fig.height);
      fctx.setTransform(dpr,0,0,dpr,0,0);
      // micro shake on beat / reduce
      var sh = REDUCED ? 0 : bA*4.6;
      if(sh > 0.05){
        fctx.translate((Math.random()-0.5)*sh, (Math.random()-0.5)*sh*0.7);
      }
      drawFigure(fctx, fw, fh, motionT, live.bass||0, bA);
    }
  }catch(err){
    ERRS = String(err && err.stack || err && err.message || err);
  }
  if(SHOT && FRAMES > 36){ SHOTSTOP = true; return; }   // static capture mode
  requestAnimationFrame(frame);
}

function addFlash(v){
  var cur = parseFloat(flashEl.dataset.v || "0");
  flashEl.dataset.v = Math.min(1, cur + v);
}

/* ══════════════════════════════════════════════════════════
   9. resize
   ══════════════════════════════════════════════════════════ */
function resize(){
  var d = sizeCanvas(bg, null);
  fw = d.w; fh = d.h;
  var d2 = sizeCanvas(fig, null);
  fctx = fig.getContext("2d");
  fctx.setTransform(dpr,0,0,dpr,0,0);
  if(gl) gl.viewport(0,0,bg.width,bg.height);
  if(!fctx.createPattern){}
  fleshPat = fctx.createPattern(fleshCv, "repeat");
  noisePat = fctx.createPattern(noiseCv, "repeat");
  // rebuild dependent paths (they are deterministic anyway)
  WOUND = woundPath();
  if(typeof fitCur === "function") fitCur();
  // a resize clears the canvas — make sure something repaints it
  if(SHOTSTOP){ SHOTSTOP = false; requestAnimationFrame(frame); }
}

/* ══════════════════════════════════════════════════════════
   10. boot
   ══════════════════════════════════════════════════════════ */
fleshCv = makeFlesh();
noiseCv = makeNoise();
HEAD = headPath(); TORSO = torsoPath(); BEANIE = beaniePath(); BRIM = brimPath(); WOUND = woundPath();

initGL();
resize();
window.addEventListener("resize", function(){ resize(); }, {passive:true});

/* ── demo payload (used when no parent speaks) ──────────── */
function demoLines(){
  var raw = [
    ["FLESH IS THE COSTUME", 0.6, 4.3],
    ["BONE IS THE CROWN", 5.0, 4.3],
    ["I WEAR MY TEETH OUTSIDE", 9.4, 4.3],
    ["GRILLZ ON A DEAD GOD", 13.8, 4.3],
    ["肉 是 唯 一 的 语 言", 18.2, 4.3],
    ["SCREAM IN STEREO", 22.6, 4.3],
    ["MEAT IS THE MESSAGE", 27.0, 4.3],
    ["NO GOD / NO GRISTLE", 31.4, 5.0]
  ];
  var out = [];
  for(var i=0;i<raw.length;i++){
    var txt = raw[i][0], t = raw[i][1], dur = raw[i][2];
    var chars = [];
    for(var k=0;k<txt.length;k++){
      chars.push({ c: txt[k], t: +(t + 0.14 + k*0.052).toFixed(3) });
    }
    out.push({ t:t, dur:dur, text:txt, chars:chars });
  }
  return out;
}

function applyInit(p){
  if(!p) return;
  if(p.song){
    S.name = p.song.name || "UNTITLED";
    S.artists = Array.isArray(p.song.artists) ? p.song.artists : (p.song.artists ? [p.song.artists] : ["—"]);
    S.cover = p.song.cover || null;
    setAccent(p.song.accent);
  }
  if(Array.isArray(p.lines)){
    S.lines = p.lines.map(function(l){
      return { t:+l.t || 0, dur:(l.dur == null ? 6 : +l.dur), text:String(l.text == null ? "" : l.text), chars:l.chars || null };
    }).sort(function(a,b){ return a.t - b.t; });
  }
  if(p.duration) S.duration = +p.duration;
  $("#mArt").textContent = (S.artists && S.artists.length) ? S.artists.join(" / ") : "—";
  $("#mName").textContent = S.name;
  $("#logo").innerHTML = String(S.name).replace(/&/g,"&amp;").replace(/</g,"&lt;") + '<b>&nbsp;//&nbsp;</b>05';
  S.idx = -2; // force redraw of line
  renderLine(-1); S.idx = -1;
}

function startDemo(){
  if(DEMO) return;
  DEMO = true;
  applyInit({
    song:{ id:"05", name:"FLESH RELIQUARY", artists:["GORE//GANG"], cover:null, accent:[214,26,30] },
    lines: demoLines(),
    duration: 36.6
  });
  var jt = 0;
  try{
    var hm = /(?:^|[#&?\s])t=([0-9.]+)/.exec(location.hash || "");
    if(!hm) hm = /[?&]t=([0-9.]+)/.exec(location.search || "");
    if(hm) jt = parseFloat(hm[1]) || 0;
  }catch(_){}
  clockT = jt; clockWall = nowSec(); playing = true; started = true;
  live.bpm = 142; live.level = .5;
  synthNext = nowSec() + 0.1;
}

/* ── message bridge ─────────────────────────────────────── */
function post(msg){
  try{ if(window.parent && window.parent !== window) window.parent.postMessage(msg, "*"); }catch(_){}
}
/* ready 只报一次。宿主收到 ready 会再发一次 init，我们若在 init 里再回 ready，
   就会无限对撞（实测一秒几千次 init）：时间被反复清零、tick 定时器被反复重置，
   tick 一条都发不出来 —— 这就是「歌词不跟」的根因。 */
var READY_SENT = false;
function ready(){
  if(READY_SENT) return;
  READY_SENT = true;
  post({__c100:1, type:"ready"});
}

window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || d.__c100 !== 1 || !d.type) return;
  var p = d.payload || {};
  try{
    if(d.type === "init"){
      DEMO = false;
      applyInit(p);
      /* 缺省按播放：入口时音频多半已经在放，真 tick 会在 66ms 内把它校准回来 */
      clockT = 0; clockWall = nowSec(); playing = true; started = false;
      $("#fstate").textContent = "STANDBY";
      ready();
    }else if(d.type === "tick"){
      if(typeof p.time === "number"){
        clockT = Math.max(0, p.time);
        clockWall = nowSec();
      }
      if(typeof p.playing === "boolean"){ playing = p.playing; }
      started = true;
      if(!playing) { /* frozen: clock stops advancing via estT */ }
    }else if(d.type === "beat"){
      var lv = clamp(parseFloat(p.level) || 0, 0, 1);
      beatLvl = Math.max(beatLvl, lv);
      beatIdx = p.index;
      if(!REDUCED && lv > 0.28) addFlash(lv * 0.62);
    }else if(d.type === "live"){
      live.bpm = p.bpm || live.bpm;
      live.level = clamp(parseFloat(p.level) || 0, 0, 1);
      live.bass = clamp(parseFloat(p.bass) || 0, 0, 1);
      live.mid = clamp(parseFloat(p.mid) || 0, 0, 1);
      live.treble = clamp(parseFloat(p.treble) || 0, 0, 1);
      playing = (typeof p.playing === "boolean") ? p.playing : true; started = true;   /* init 常不带 playing，缺省按播放 */
    }
  }catch(e){ ERRS = String(e.message || e); }
});

/* self-check port */
window.__stage = function(){
  return {
    lines: S.lines.length,
    idx: S.idx,
    t: +estT().toFixed(3),
    playing: !!playing,
    frames: FRAMES,
    js: true,
    err: ERRS,
    text: S.text,
    gl: !!HASGL,
    rm: !!REDUCED
  };
};

// first paint + kickoff
renderLine(-1);
S.idx = -1;
requestAnimationFrame(frame);
ready();

// if nobody hands us a song, run the demo
if(SHOT){
  startDemo();
  motionT = 3.4;
  if(TEST){
    window.postMessage({__c100:1,type:"init",payload:{
      song:{id:"T1",name:"WOUND PROTOCOL",artists:["TEST//CREW","NULL"],cover:null,accent:[0,170,120]},
      lines:[{t:0,dur:3,text:"PLUGGED IN AND BLEEDING",chars:null},
             {t:3,dur:3,text:"SECOND ROW OF THE TEST",chars:null}],
      duration:9
    }},"*");
    window.postMessage({__c100:1,type:"tick",payload:{time:1.1,playing:true}},"*");
  }
  setTimeout(function(){ for(var pre=0; pre<3; pre++){ try{ frame(); }catch(e){} } }, 0);
}else{
  setTimeout(function(){ if(!started && !DEMO) startDemo(); }, 520);
  setTimeout(function(){ ready(); }, 120);
}

})();
</script>
<style>
  /* 台词层只剩形态自带的 #cur/#prev/#next。之前为了“某些尺寸不显字”另起过一套
     #lyr2（还带一个绿色 msg 计数器），两套时钟各算各的，全部拆掉。 */
  /* 未唱的字原来是 #2b2221（近黑），在黑场里等于没有字 —— 提到暗骨灰，唱到转骨白 */
  #cur .ch{ color:#a2948d; }
  /* 台词挪到左下：视频里那颗头在正中间，原来的 48.5% 正好糊在脸上 */
  #lyr{ left:6.5vw; right:6vw; top:auto; bottom:11vh; transform:none; width:auto;
        max-width:64vw; padding-left:20px; }
  #prev{ margin-bottom:.5em; }
  #next{ margin-top:.6em; }
</style>
<style>
  /* 用生成的人物视频替换原来那颗 canvas 画的头：screen 混合，黑场自然融进去 */
    /* canvas 退到最后：只留视频人物和它自己的 UI */
  #c{ opacity:.34 !important; }
  #charVid{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    z-index:1; mix-blend-mode:screen; opacity:1; pointer-events:none;
    filter:contrast(1.06) saturate(.95) }
</style>
<script>
(function(){
  var v=document.getElementById('charVid'); if(!v) return;
  var rm=false; try{ rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(rm){ v.pause(); }
  addEventListener('message', function(e){
    var d=e.data; if(!d || d.__c100!==1) return;
    if(d.type==='tick'){
      var p = d.payload || {};
      if(p.playing && !rm){ if(v.paused) v.play().catch(function(){}); }
      else { if(!v.paused) v.pause(); }
    }
  });
  v.play().catch(function(){});
})();
</script><style>
  /* 原 canvas 人物整层去掉，只留视频 + 蒙版 + 歌词 */
  #fig{ display:none !important; }   /* 原来那颗 canvas 人物 */
  #charVid{ opacity:1 !important; filter:contrast(1.08) saturate(.92) brightness(.96) }
  /* 蒙版护住歌词四周：压在视频上、歌词下（#lyr 是 5，视频是 1） */
  #scrim{ position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.18) 26%, rgba(0,0,0,0) 44%,
                      rgba(0,0,0,.30) 62%, rgba(0,0,0,.88) 88%, rgba(0,0,0,.96) 100%),
      radial-gradient(120% 90% at 78% 42%, rgba(120,10,18,.22) 0%, rgba(0,0,0,0) 62%); }
</style>
