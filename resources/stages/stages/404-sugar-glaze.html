<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>糖釉过载</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a0320;
    -webkit-tap-highlight-color: transparent;
  }
  #candy-stage {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #lyric-live {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    color: transparent;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="candy-stage" aria-hidden="true"></canvas>
<div id="lyric-live" aria-live="polite">糖釉过载</div>
<script>
/* The stage snapshot hook must exist unconditionally, at the very top of the script. */
window.__stage = function () {
  var snapshot = window.__stageState;
  if (!snapshot) {
    return {
      lines: 0, idx: -1, t: 0, playing: true, frames: 0,
      js: 0, err: "", text: "", gl: false, rm: false
    };
  }
  return {
    lines: typeof snapshot.lineCount === "number" ? snapshot.lineCount : 0,
    idx: typeof snapshot.lineIndex === "number" ? snapshot.lineIndex : -1,
    t: typeof snapshot.time === "number" ? snapshot.time : 0,
    playing: snapshot.playing !== false,
    frames: typeof snapshot.frames === "number" ? snapshot.frames : 0,
    js: typeof snapshot.jsMs === "number" ? snapshot.jsMs : 0,
    err: "",
    text: typeof snapshot.currentText === "string" ? snapshot.currentText : "",
    gl: false,
    rm: snapshot.reducedMotion === true
  };
};

(function () {
  "use strict";

  var stageState = {
    lineCount: 0,
    lineIndex: -1,
    time: 0,
    playing: true,
    frames: 0,
    jsMs: 0,
    currentText: "",
    reducedMotion: false,
    accent: [255, 63, 164],
    lines: [],
    duration: 0,
    beatLevel: 0,
    liveLevel: 0.4,
    bass: 0.4,
    bpm: 0,
    songTitle: "",
    songArtist: "",
    hasInit: false
  };
  window.__stageState = stageState;

  /* ---------- ready: scheduled before every other boot task ---------- */
  var readySent = false;
  function reportReady() {
    if (readySent) {
      return;
    }
    readySent = true;
    try {
      window.parent.postMessage({ __c100: 1, type: "ready" }, "*");
    } catch (error) {
      console.error("[sugar-glaze] ready postMessage failed", error);
    }
  }
  if (typeof window.requestAnimationFrame === "function") {
    window.requestAnimationFrame(reportReady);
  } else {
    window.setTimeout(reportReady, 16);
  }
  window.setTimeout(reportReady, 900);

  /* ---------- throttled diagnostics: never swallow silently ---------- */
  var lastErrorAt = 0;
  function noteError(scope, error) {
    var stamp = Date.now();
    if (stamp - lastErrorAt < 1000) {
      return;
    }
    lastErrorAt = stamp;
    console.error("[sugar-glaze] " + scope, error);
  }

  var canvas = document.getElementById("candy-stage");
  var context = canvas ? canvas.getContext("2d") : null;
  var liveRegion = document.getElementById("lyric-live");
  var viewWidth = 1440;
  var viewHeight = 900;
  var pixelRatio = 1;
  var lastFrameAt = 0;
  var resizeTimer = 0;
  var motionQuery = null;

  if (typeof window.matchMedia === "function") {
    motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    stageState.reducedMotion = !!(motionQuery && motionQuery.matches);
    if (motionQuery && typeof motionQuery.addEventListener === "function") {
      motionQuery.addEventListener("change", function (event) {
        stageState.reducedMotion = !!(event && event.matches);
      });
    }
  }

  function clampNumber(value, low, high) {
    if (!isFinite(value)) {
      return low;
    }
    if (value < low) return low;
    if (value > high) return high;
    return value;
  }

  function clampByte(value) {
    if (!isFinite(value)) {
      return 0;
    }
    var rounded = Math.round(value);
    if (rounded < 0) return 0;
    if (rounded > 255) return 255;
    return rounded;
  }

  function toColorString(triple, alpha) {
    var red = clampByte(triple && triple[0]);
    var green = clampByte(triple && triple[1]);
    var blue = clampByte(triple && triple[2]);
    var opacity = clampNumber(typeof alpha === "number" ? alpha : 1, 0, 1);
    return "rgba(" + red + "," + green + "," + blue + "," + Math.round(opacity * 1000) / 1000 + ")";
  }

  function parseAccent(rawAccent) {
    if (!rawAccent || typeof rawAccent === "string" || typeof rawAccent.length !== "number" || rawAccent.length < 3) {
      return [255, 63, 164];
    }
    var red = Number(rawAccent[0]);
    var green = Number(rawAccent[1]);
    var blue = Number(rawAccent[2]);
    if (!isFinite(red) || !isFinite(green) || !isFinite(blue)) {
      return [255, 63, 164];
    }
    if (red <= 0 && green <= 0 && blue <= 0) {
      return [255, 63, 164];
    }
    return [clampByte(red), clampByte(green), clampByte(blue)];
  }

  function mixTriple(firstColor, secondColor, amount) {
    var ratio = clampNumber(amount, 0, 1);
    return [
      clampByte(firstColor[0] + (secondColor[0] - firstColor[0]) * ratio),
      clampByte(firstColor[1] + (secondColor[1] - firstColor[1]) * ratio),
      clampByte(firstColor[2] + (secondColor[2] - firstColor[2]) * ratio)
    ];
  }

  function lightenTriple(sourceColor, amount) {
    return mixTriple(sourceColor, [255, 255, 255], amount);
  }

  function darkenTriple(sourceColor, amount) {
    return mixTriple(sourceColor, [26, 2, 30], amount);
  }

  function safeAddStop(gradient, offset, color) {
    if (!gradient || typeof gradient.addColorStop !== "function") {
      return;
    }
    try {
      gradient.addColorStop(clampNumber(offset, 0, 1), color);
    } catch (error) {
      noteError("addColorStop", error);
    }
  }

  function createSink(width, height) {
    var sinkCanvas = document.createElement("canvas");
    var safeWidth = Math.max(1, Math.round(isFinite(width) ? width : 1));
    var safeHeight = Math.max(1, Math.round(isFinite(height) ? height : 1));
    if (safeWidth > 4096 || safeHeight > 4096) {
      return null;
    }
    sinkCanvas.width = safeWidth;
    sinkCanvas.height = safeHeight;
    var sinkContext = sinkCanvas.getContext("2d");
    if (!sinkContext) {
      return null;
    }
    return {
      canvas: sinkCanvas,
      context: sinkContext,
      width: sinkCanvas.width,
      height: sinkCanvas.height
    };
  }

  function canUseAsImage(source) {
    if (!source) {
      return false;
    }
    if (typeof HTMLCanvasElement !== "undefined" && !(source instanceof HTMLCanvasElement)) {
      return false;
    }
    if (!(source.width > 0) || !(source.height > 0)) {
      return false;
    }
    return typeof source.getContext === "function";
  }

  function hasPathApi(target) {
    return !!target && typeof target.beginPath === "function" && typeof target.arc === "function";
  }

  function resolveViewportSize() {
    var width = window.innerWidth;
    var height = window.innerHeight;
    if (!isFinite(width) || !isFinite(height) || width <= 0 || height <= 0) {
      width = 1440;
      height = 900;
    }
    return { width: width, height: height };
  }

  /* ---------- palette & reactive levels ---------- */
  var accentColor = [255, 63, 164];
  var beatPulse = 0;
  var smoothedLevel = 0.4;
  var motionScale = 1;
  var backgroundCache = {
    key: "",
    sky: null,
    blooms: [],
    dotPattern: null,
    vignette: null,
    scrim: null
  };

  function accentKey() {
    return accentColor[0] + "-" + accentColor[1] + "-" + accentColor[2];
  }

  function ensureBackground() {
    var key = Math.round(viewWidth) + "x" + Math.round(viewHeight) + "|" + accentKey();
    if (backgroundCache.key === key && backgroundCache.sky) {
      return;
    }
    backgroundCache.key = key;
    var sky = context.createLinearGradient(0, 0, viewWidth * 0.3, viewHeight);
    safeAddStop(sky, 0, "#190229");
    safeAddStop(sky, 0.2, "#4a0b7d");
    safeAddStop(sky, 0.42, "#b418a8");
    safeAddStop(sky, 0.62, "#ff3c9d");
    safeAddStop(sky, 0.82, "#ff9a76");
    safeAddStop(sky, 1, "#ffd977");
    backgroundCache.sky = sky;

    var bloomSpecs = [
      { nx: 0.14, ny: 0.12, radius: 0.66, inner: "rgba(110,255,238,0.28)", outer: "rgba(110,255,238,0)" },
      { nx: 0.9, ny: 0.08, radius: 0.58, inner: "rgba(255,241,140,0.26)", outer: "rgba(255,241,140,0)" },
      { nx: 0.74, ny: 0.88, radius: 0.72, inner: "rgba(124,70,255,0.34)", outer: "rgba(124,70,255,0)" },
      { nx: 0.04, ny: 0.84, radius: 0.54, inner: "rgba(255,74,196,0.34)", outer: "rgba(255,74,196,0)" }
    ];
    var unit = Math.max(viewWidth, viewHeight);
    var blooms = [];
    for (var bloomIndex = 0; bloomIndex < bloomSpecs.length; bloomIndex += 1) {
      var spec = bloomSpecs[bloomIndex];
      var centerX = spec.nx * viewWidth;
      var centerY = spec.ny * viewHeight;
      var radius = spec.radius * unit;
      var gradient = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      safeAddStop(gradient, 0, spec.inner);
      safeAddStop(gradient, 0.55, spec.outer);
      safeAddStop(gradient, 1, spec.outer);
      blooms.push({ nx: centerX - radius, ny: centerY - radius, size: radius * 2, gradient: gradient });
    }
    backgroundCache.blooms = blooms;

    var vignette = context.createRadialGradient(
      viewWidth * 0.5, viewHeight * 0.48, Math.min(viewWidth, viewHeight) * 0.22,
      viewWidth * 0.5, viewHeight * 0.48, Math.max(viewWidth, viewHeight) * 0.78
    );
    safeAddStop(vignette, 0, "rgba(20,0,26,0)");
    safeAddStop(vignette, 0.72, "rgba(20,0,26,0.16)");
    safeAddStop(vignette, 1, "rgba(14,0,20,0.62)");
    backgroundCache.vignette = vignette;

    var scrim = context.createLinearGradient(0, viewHeight * 0.2, 0, viewHeight * 0.82);
    safeAddStop(scrim, 0, "rgba(22,0,28,0)");
    safeAddStop(scrim, 0.32, "rgba(22,0,28,0.3)");
    safeAddStop(scrim, 0.5, "rgba(20,0,26,0.4)");
    safeAddStop(scrim, 0.72, "rgba(22,0,28,0.26)");
    safeAddStop(scrim, 1, "rgba(22,0,28,0)");
    backgroundCache.scrim = scrim;

    if (!backgroundCache.dotPattern) {
      backgroundCache.dotPattern = buildDotPattern();
    }
  }

  function buildDotPattern() {
    var sink = createSink(34, 34);
    if (!sink) {
      return null;
    }
    var sinkContext = sink.context;
    sinkContext.fillStyle = "rgba(255,255,255,0.15)";
    if (hasPathApi(sinkContext)) {
      sinkContext.beginPath();
      sinkContext.arc(8, 8, 2.5, 0, Math.PI * 2);
      sinkContext.fill();
      sinkContext.beginPath();
      sinkContext.arc(25, 25, 3.3, 0, Math.PI * 2);
      sinkContext.fillStyle = "rgba(255,92,196,0.24)";
      sinkContext.fill();
    }
    try {
      return context.createPattern(sink.canvas, "repeat");
    } catch (error) {
      noteError("dotPattern", error);
      return null;
    }
  }

  function invalidateSunburst() {
    sunburstSprite = null;
    sunburstTried = false;
  }

  function ensureSunburstSprite() {
    if (sunburstSprite && canUseAsImage(sunburstSprite.canvas)) {
      return sunburstSprite;
    }
    if (sunburstTried) {
      return null;
    }
    sunburstTried = true;
    var spriteSize = 640;
    var center = spriteSize / 2;
    var rayCount = 22;
    sunburstSprite = bakeSprite(spriteSize, spriteSize, function (paint) {
      if (!hasPathApi(paint)) {
        return;
      }
      paint.fillStyle = "rgba(255,255,255,0.06)";
      for (var rayIndex = 0; rayIndex < rayCount; rayIndex += 1) {
        var angle = (rayIndex / rayCount) * Math.PI * 2;
        var halfWidth = (Math.PI / rayCount) * 0.6;
        paint.beginPath();
        paint.moveTo(center, center);
        paint.arc(center, center, center, angle - halfWidth, angle + halfWidth);
        paint.closePath();
        paint.fill();
      }
    });
    return sunburstSprite;
  }

  function drawSunburst(timeSec) {
    var sprite = ensureSunburstSprite();
    if (!sprite || !canUseAsImage(sprite.canvas)) {
      return;
    }
    var cover = Math.max(viewWidth, viewHeight) * 2;
    context.save();
    context.translate(viewWidth * 0.5, viewHeight * 0.38);
    context.rotate(timeSec * 0.05 * motionScale);
    context.globalAlpha = 0.9;
    context.drawImage(sprite.canvas, -cover / 2, -cover / 2, cover, cover);
    context.restore();
  }

  function drawHalftone(timeSec) {
    if (!backgroundCache.dotPattern) {
      return;
    }
    var offsetX = (timeSec * 6 * motionScale) % 34;
    var offsetY = (timeSec * 3.5 * motionScale) % 34;
    context.save();
    context.translate(-offsetX, -offsetY);
    context.fillStyle = backgroundCache.dotPattern;
    context.fillRect(0, 0, viewWidth + 68, viewHeight + 68);
    context.restore();
  }

  function drawGlossSweep(timeSec) {
    var span = clampNumber(viewWidth * 1.6, 900, 3600);
    var travel = (timeSec * 46 * motionScale) % (span + viewWidth);
    var left = travel - span;
    var gradient = context.createLinearGradient(left, 0, left + span * 0.7, viewHeight);
    safeAddStop(gradient, 0, "rgba(255,255,255,0)");
    safeAddStop(gradient, 0.46, "rgba(255,255,255,0.09)");
    safeAddStop(gradient, 0.54, "rgba(255,255,255,0.09)");
    safeAddStop(gradient, 1, "rgba(255,255,255,0)");
    context.fillStyle = gradient;
    context.fillRect(0, 0, viewWidth, viewHeight);
  }

  function drawBackground(timeSec) {
    ensureBackground();
    if (backgroundCache.sky) {
      context.fillStyle = backgroundCache.sky;
    } else {
      context.fillStyle = "#2a0533";
    }
    context.fillRect(0, 0, viewWidth, viewHeight);

    for (var bloomIndex = 0; bloomIndex < backgroundCache.blooms.length; bloomIndex += 1) {
      var bloom = backgroundCache.blooms[bloomIndex];
      if (!bloom) {
        continue;
      }
      context.fillStyle = bloom.gradient;
      context.fillRect(bloom.nx, bloom.ny, bloom.size, bloom.size);
    }

    drawSunburst(timeSec);
    drawHalftone(timeSec);
    drawGlossSweep(timeSec);
  }

  function drawScrim() {
    if (backgroundCache.scrim) {
      context.fillStyle = backgroundCache.scrim;
      context.fillRect(0, 0, viewWidth, viewHeight);
    }
  }

  function drawVignette() {
    if (backgroundCache.vignette) {
      context.fillStyle = backgroundCache.vignette;
      context.fillRect(0, 0, viewWidth, viewHeight);
    }
  }

  function applyViewportSize() {
    var size = resolveViewportSize();
    viewWidth = size.width;
    viewHeight = size.height;
    var ratio = window.devicePixelRatio || 1;
    if (!isFinite(ratio) || ratio <= 0) {
      ratio = 1;
    }
    pixelRatio = Math.min(ratio, 2);
    if (!canvas) {
      return;
    }
    canvas.width = Math.max(1, Math.round(viewWidth * pixelRatio));
    canvas.height = Math.max(1, Math.round(viewHeight * pixelRatio));
    canvas.style.width = viewWidth + "px";
    canvas.style.height = viewHeight + "px";
    if (context) {
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }
  }

  function applyInit(payload) {
    var lines = Array.isArray(payload.lines) ? payload.lines : [];
    stageState.lineIndex = -1;
    stageState.currentText = "";
    stageState.playing = payload.playing !== false;
    stageState.duration = typeof payload.duration === "number" && isFinite(payload.duration) ? payload.duration : 0;
    stageState.hasInit = true;

    var previousAccentKey = accentKey();
    accentColor = parseAccent(payload.accent);
    stageState.accent = accentColor;

    var song = payload.song && typeof payload.song === "object" ? payload.song : {};
    var titleText = "";
    var artistText = "";
    try {
      titleText = typeof song.name === "string" ? song.name.replace(/\s+/g, " ").trim() : "";
      if (Array.isArray(song.artists)) {
        var artistParts = [];
        for (var artistIndex = 0; artistIndex < Math.min(song.artists.length, 6); artistIndex += 1) {
          var artist = song.artists[artistIndex];
          if (artist != null && String(artist).trim()) {
            artistParts.push(String(artist).trim());
          }
        }
        artistText = artistParts.join(" / ");
      } else if (song.artists != null) {
        artistText = String(song.artists).trim();
      }
    } catch (error) {
      noteError("init:song", error);
      titleText = typeof song.name === "string" ? song.name : "";
      artistText = "";
    }
    stageState.songTitle = titleText;
    stageState.songArtist = artistText;

    try {
      normalizedLines = normalizeLines(lines);
    } catch (error) {
      noteError("init:lyrics", error);
      normalizedLines = [];
    }
    stageState.lines = normalizedLines;
    stageState.lineCount = normalizedLines.length;
    layoutCache.key = "";
    layoutCache.layout = null;
    if (normalizedLines.length > 0) {
      var initialIndex = findLineIndex(stageState.time);
      stageState.lineIndex = initialIndex;
      stageState.currentText = initialIndex >= 0 ? normalizedLines[initialIndex].text : "";
    }

    backgroundCache.key = "";
    if (previousAccentKey !== accentKey()) {
      resetPropCaches();
    }
    if (liveRegion) {
      liveRegion.textContent = titleText ? titleText + " · " + (artistText || "糖釉过载") : "糖釉过载";
    }
  }

  function applyTick(payload) {
    if (typeof payload.time === "number" && isFinite(payload.time)) {
      stageState.time = payload.time;
    }
    if (typeof payload.playing === "boolean") {
      stageState.playing = payload.playing;
    }
    if (Array.isArray(normalizedLines) && normalizedLines.length > 0) {
      var index = findLineIndex(stageState.time);
      stageState.lineIndex = index;
      stageState.currentText = index >= 0 ? normalizedLines[index].text : "";
    } else {
      stageState.lineIndex = -1;
      stageState.currentText = "";
    }
  }

  function applyBeat(payload) {
    var level = typeof payload.level === "number" && isFinite(payload.level) ? payload.level : 0.6;
    var clamped = clampNumber(level, 0, 1);
    stageState.beatLevel = clamped;
    beatPulse = Math.max(beatPulse, clamped);
  }

  function applyLive(payload) {
    var level = typeof payload.level === "number" && isFinite(payload.level) ? payload.level : 0.5;
    stageState.liveLevel = clampNumber(level, 0, 1);
    if (typeof payload.bass === "number" && isFinite(payload.bass)) {
      stageState.bass = clampNumber(payload.bass, 0, 1);
    }
    if (typeof payload.bpm === "number" && isFinite(payload.bpm) && payload.bpm > 0) {
      stageState.bpm = clampNumber(payload.bpm, 40, 220);
    }
  }

  /* ---------- lyric data ---------- */
  var normalizedLines = [];
  var advanceCache = new Map();
  var layoutCache = { key: "", layout: null };
  var measureSink = null;
  var measureContext = null;
  var EMPTY_STATE_TEXT = "纯音乐 · 没有歌词";
  var EMPTY_STATE_HINT = "让糖浆自己流一会儿";

  function ensureMeasureContext() {
    if (measureContext) {
      return measureContext;
    }
    measureSink = createSink(8, 8);
    measureContext = measureSink ? measureSink.context : context;
    return measureContext;
  }

  function resolveFontSpec(fontPx) {
    var size = Math.round(clampNumber(fontPx, 8, 220) * 10) / 10;
    return "900 " + size + "px \"PingFang SC\", \"Microsoft YaHei\", \"Noto Sans SC\", \"Source Han Sans SC\", system-ui, sans-serif";
  }

  function tokenizeText(rawText) {
    var tokens = [];
    if (typeof rawText !== "string" || !rawText) {
      return tokens;
    }
    var characters = Array.from(rawText);
    var limit = Math.min(characters.length, 600);
    var latinPattern = /[A-Za-z0-9\u00C0-\u024F'’\-_.!?&+]/;
    var gluePattern = /[\s，。、！？；：”’）】》…—~～·,.;:!?)\]]/;
    var pending = "";
    for (var index = 0; index < limit; index += 1) {
      var character = characters[index];
      if (/\s/.test(character)) {
        if (pending) {
          tokens.push({ text: pending + " ", weight: Math.max(1, Array.from(pending).length) });
          pending = "";
        } else if (tokens.length > 0) {
          tokens[tokens.length - 1].text += " ";
        } else {
          tokens.push({ text: " ", weight: 1 });
        }
        continue;
      }
      if (latinPattern.test(character) || (pending && gluePattern.test(character))) {
        pending += character;
        continue;
      }
      if (pending) {
        tokens.push({ text: pending, weight: Math.max(1, Array.from(pending).length) });
        pending = "";
      }
      if (gluePattern.test(character)) {
        if (tokens.length > 0) {
          tokens[tokens.length - 1].text += character;
          tokens[tokens.length - 1].weight = Math.max(1, Array.from(tokens[tokens.length - 1].text).length);
        } else {
          tokens.push({ text: character, weight: 1 });
        }
        continue;
      }
      tokens.push({ text: character, weight: 1 });
    }
    if (pending) {
      tokens.push({ text: pending, weight: Math.max(1, Array.from(pending).length) });
    }
    return tokens;
  }

  function normalizeYrcChars(rawChars, lineStart) {
    var tokens = [];
    if (!Array.isArray(rawChars)) {
      return tokens;
    }
    var limit = Math.min(rawChars.length, 600);
    for (var index = 0; index < limit; index += 1) {
      var entry = rawChars[index];
      if (!entry) {
        continue;
      }
      var charText = typeof entry.c === "string" ? entry.c : (entry.c == null ? "" : String(entry.c));
      if (!charText) {
        continue;
      }
      if (/^\s+$/.test(charText) && tokens.length > 0) {
        tokens[tokens.length - 1].text += charText;
        continue;
      }
      var startTime = typeof entry.t === "number" && isFinite(entry.t) ? entry.t : lineStart;
      tokens.push({
        text: charText,
        start: startTime,
        weight: Math.max(1, Array.from(charText).length)
      });
    }
    return tokens;
  }

  function normalizeUniformChars(text, lineStart, lineDuration) {
    var tokens = tokenizeText(text);
    if (!tokens.length) {
      return tokens;
    }
    var totalWeight = 0;
    for (var index = 0; index < tokens.length; index += 1) {
      totalWeight += tokens[index].weight;
    }
    if (totalWeight <= 0) {
      totalWeight = tokens.length;
    }
    var span = lineDuration > 0 ? lineDuration : clampNumber(tokens.length * 0.26, 1.6, 7);
    var cursor = lineStart;
    for (var tokenIndex = 0; tokenIndex < tokens.length; tokenIndex += 1) {
      tokens[tokenIndex].start = cursor;
      cursor += (tokens[tokenIndex].weight / totalWeight) * span;
    }
    return tokens;
  }

  function normalizeLines(rawLines) {
    var result = [];
    if (!Array.isArray(rawLines)) {
      return result;
    }
    var limit = Math.min(rawLines.length, 3000);
    for (var index = 0; index < limit; index += 1) {
      var raw = rawLines[index];
      if (!raw || typeof raw !== "object") {
        continue;
      }
      var text = typeof raw.text === "string" ? raw.text : (raw.text == null ? "" : String(raw.text));
      text = text.replace(/\s+/g, " ").trim();
      var hasTime = typeof raw.t === "number" && isFinite(raw.t);
      if (!text && !hasTime) {
        continue;
      }
      var start = hasTime ? raw.t : 0;
      var duration = typeof raw.dur === "number" && isFinite(raw.dur) && raw.dur > 0 ? Math.min(raw.dur, 60) : 0;
      var tokens = normalizeYrcChars(raw.chars, start);
      if (!tokens.length) {
        tokens = normalizeUniformChars(text, start, duration);
      }
      result.push({
        start: start,
        duration: duration,
        text: text,
        tokens: tokens
      });
    }
    result.sort(function (firstLine, secondLine) {
      if (firstLine.start !== secondLine.start) {
        return firstLine.start - secondLine.start;
      }
      return 0;
    });
    for (var lineIndex = 0; lineIndex < result.length; lineIndex += 1) {
      var line = result[lineIndex];
      if (line.duration > 0) {
        continue;
      }
      var nextStart = lineIndex + 1 < result.length ? result[lineIndex + 1].start : line.start + 4;
      line.duration = clampNumber(nextStart - line.start, 0.8, 12);
    }
    return result;
  }

  function findLineIndex(timeSec) {
    var lines = normalizedLines;
    if (!lines.length) {
      return -1;
    }
    var found = -1;
    for (var index = 0; index < lines.length; index += 1) {
      if (lines[index].start <= timeSec + 0.02) {
        found = index;
      } else {
        break;
      }
    }
    return found;
  }

  function measureAdvance(text, fontPx) {
    var key = Math.round(fontPx * 10) + "|" + text;
    var cached = advanceCache.get(key);
    if (typeof cached === "number" && isFinite(cached)) {
      return cached;
    }
    var measure = ensureMeasureContext();
    if (!measure) {
      return fontPx * 0.62;
    }
    measure.font = resolveFontSpec(fontPx);
    var width = measure.measureText(text).width;
    if (!isFinite(width) || width <= 0) {
      width = fontPx * 0.62;
    }
    var advance = width + fontPx * 0.035;
    if (advanceCache.size > 1400) {
      advanceCache.clear();
    }
    advanceCache.set(key, advance);
    return advance;
  }

  function buildLayoutRows(tokens, fontPx, maxWidth) {
    var rows = [];
    var currentRow = { tokens: [], width: 0 };
    var widest = 0;
    for (var index = 0; index < tokens.length; index += 1) {
      var token = tokens[index];
      var advance = measureAdvance(token.text, fontPx);
      if (currentRow.tokens.length > 0 && currentRow.width + advance > maxWidth) {
        rows.push(currentRow);
        currentRow = { tokens: [], width: 0 };
      }
      currentRow.tokens.push({ token: token, advance: advance, offsetX: currentRow.width });
      currentRow.width += advance;
    }
    if (currentRow.tokens.length > 0) {
      rows.push(currentRow);
    }
    for (var rowIndex = 0; rowIndex < rows.length; rowIndex += 1) {
      if (rows[rowIndex].width > widest) {
        widest = rows[rowIndex].width;
      }
    }
    return { rows: rows, widest: widest };
  }

  function buildLineLayout(line, baseFontPx, maxWidth) {
    if (!line || !line.tokens.length) {
      return null;
    }
    var fontPx = baseFontPx;
    var built = null;
    for (var attempt = 0; attempt < 4; attempt += 1) {
      built = buildLayoutRows(line.tokens, fontPx, maxWidth);
      var fitsWidth = built.widest <= maxWidth + 0.5;
      if (fitsWidth && built.rows.length <= 3) {
        break;
      }
      fontPx = Math.max(16, fontPx * 0.84);
    }
    if (!built || !built.rows.length) {
      return null;
    }
    if (built.widest > maxWidth + 0.5) {
      var fitRatio = maxWidth / built.widest;
      if (isFinite(fitRatio) && fitRatio > 0.1) {
        fontPx = Math.max(8, fontPx * fitRatio);
        built = buildLayoutRows(line.tokens, fontPx, maxWidth);
      }
    }
    return {
      fontPx: fontPx,
      rows: built.rows,
      widest: built.widest,
      rowHeight: fontPx * 1.24,
      blockHeight: built.rows.length * fontPx * 1.24
    };
  }

  function getLineLayout(line, baseFontPx, maxWidth) {
    var key = line.start + "|" + line.text + "|" + Math.round(baseFontPx) + "|" + Math.round(maxWidth) + "|" + Math.round(viewHeight) + "|" + Math.round(viewWidth);
    if (layoutCache.key === key && layoutCache.layout) {
      return layoutCache.layout;
    }
    var layout = buildLineLayout(line, baseFontPx, maxWidth);
    layoutCache.key = key;
    layoutCache.layout = layout;
    return layout;
  }

  function roundedRectPath(target, left, top, width, height, radius) {
    if (!hasPathApi(target) || typeof target.arcTo !== "function") {
      return false;
    }
    var safeRadius = clampNumber(radius, 0, Math.min(width, height) / 2);
    target.beginPath();
    target.moveTo(left + safeRadius, top);
    target.lineTo(left + width - safeRadius, top);
    target.arcTo(left + width, top, left + width, top + safeRadius, safeRadius);
    target.lineTo(left + width, top + height - safeRadius);
    target.arcTo(left + width, top + height, left + width - safeRadius, top + height, safeRadius);
    target.lineTo(left + safeRadius, top + height);
    target.arcTo(left, top + height, left, top + height - safeRadius, safeRadius);
    target.lineTo(left, top + safeRadius);
    target.arcTo(left, top, left + safeRadius, top, safeRadius);
    target.closePath();
    return true;
  }

  function sparklePath(target, centerX, centerY, radius, innerRatio) {
    if (!hasPathApi(target)) {
      return false;
    }
    var points = 4;
    target.beginPath();
    for (var index = 0; index < points * 2; index += 1) {
      var angle = (index / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      var radiusHere = index % 2 === 0 ? radius : radius * innerRatio;
      var pointX = centerX + Math.cos(angle) * radiusHere;
      var pointY = centerY + Math.sin(angle) * radiusHere;
      if (index === 0) {
        target.moveTo(pointX, pointY);
      } else {
        target.lineTo(pointX, pointY);
      }
    }
    target.closePath();
    return true;
  }

  function drawLyricToken(text, originX, centerY, lit, fontPx, outlineWidth, fillStyle) {
    context.lineWidth = outlineWidth;
    context.strokeStyle = lit ? "rgba(28,1,32,0.92)" : "rgba(34,4,40,0.42)";
    context.strokeText(text, originX, centerY);
    context.fillStyle = fillStyle;
    context.fillText(text, originX, centerY);
  }

  function drawGhostLine(text, centerY, fontPx, alpha) {
    if (!text) {
      return;
    }
    var measure = ensureMeasureContext();
    if (!measure) {
      return;
    }
    var maxWidth = Math.min(viewWidth * 0.86, 1100);
    measure.font = resolveFontSpec(fontPx);
    var width = measure.measureText(text).width;
    var scaledFont = fontPx;
    if (isFinite(width) && width > maxWidth && width > 0) {
      scaledFont = Math.max(11, fontPx * (maxWidth / width));
    }
    context.save();
    context.globalAlpha = alpha;
    context.font = resolveFontSpec(scaledFont);
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.lineJoin = "round";
    context.lineWidth = Math.max(2, scaledFont * 0.14);
    context.strokeStyle = "rgba(28,2,32,0.62)";
    context.strokeText(text, viewWidth / 2, centerY);
    context.fillStyle = "rgba(255,247,253,0.85)";
    context.fillText(text, viewWidth / 2, centerY);
    context.restore();
  }

  function drawCurrentLine(line, layout, centerY, audioTime) {
    var fontPx = layout.fontPx;
    var outlineWidth = Math.max(2, fontPx * 0.1);
    var blockTop = centerY - layout.blockHeight / 2;
    var glowRadius = Math.max(viewWidth, viewHeight) * 0.42;
    var glow = context.createRadialGradient(viewWidth / 2, centerY, 0, viewWidth / 2, centerY, glowRadius);
    safeAddStop(glow, 0, toColorString(lightenTriple(accentColor, 0.18), 0.14 + smoothedLevel * 0.14 + beatPulse * 0.22));
    safeAddStop(glow, 1, "rgba(255,120,220,0)");
    context.fillStyle = glow;
    context.fillRect(viewWidth / 2 - glowRadius, centerY - glowRadius, glowRadius * 2, glowRadius * 2);

    var litTop = lightenTriple(accentColor, 0.82);
    var litMiddle = lightenTriple(accentColor, 0.58);
    var litDeep = darkenTriple(accentColor, 0.24);
    var depthColor = toColorString(darkenTriple(accentColor, 0.68), 0.9);
    var dimFill = "rgba(255,246,252,0.54)";

    context.save();
    context.textAlign = "left";
    context.textBaseline = "middle";
    context.lineJoin = "round";
    context.lineCap = "round";

    for (var rowIndex = 0; rowIndex < layout.rows.length; rowIndex += 1) {
      var row = layout.rows[rowIndex];
      var rowCenterY = blockTop + rowIndex * layout.rowHeight + layout.rowHeight / 2;
      var rowStartX = (viewWidth - row.width) / 2;
      var tokenIndex = 0;
      var token = null;
      var elapsed = 0;
      var pop = 0;

      context.font = resolveFontSpec(fontPx);
      for (tokenIndex = 0; tokenIndex < row.tokens.length; tokenIndex += 1) {
        token = row.tokens[tokenIndex];
        if (audioTime < token.token.start) {
          continue;
        }
        context.fillStyle = depthColor;
        context.fillText(token.token.text, rowStartX + token.offsetX, rowCenterY + fontPx * 0.085);
      }

      context.font = resolveFontSpec(fontPx);
      var fillGradient = context.createLinearGradient(0, rowCenterY - fontPx * 0.62, 0, rowCenterY + fontPx * 0.62);
      safeAddStop(fillGradient, 0, "#fffafd");
      safeAddStop(fillGradient, 0.24, toColorString(litTop, 1));
      safeAddStop(fillGradient, 0.58, toColorString(litMiddle, 1));
      safeAddStop(fillGradient, 1, toColorString(litDeep, 1));

      for (tokenIndex = 0; tokenIndex < row.tokens.length; tokenIndex += 1) {
        token = row.tokens[tokenIndex];
        elapsed = audioTime - token.token.start;
        if (elapsed >= 0) {
          context.font = resolveFontSpec(fontPx);
          pop = 0.16 * Math.exp(-elapsed * 9) * motionScale;
          if (pop > 0.005) {
            context.save();
            context.translate(rowStartX + token.offsetX + token.advance / 2, rowCenterY);
            context.scale(1 + pop, 1 + pop);
            context.translate(-(rowStartX + token.offsetX + token.advance / 2), -rowCenterY);
            drawLyricToken(token.token.text, rowStartX + token.offsetX, rowCenterY, true, fontPx, outlineWidth, fillGradient);
            context.restore();
          } else {
            drawLyricToken(token.token.text, rowStartX + token.offsetX, rowCenterY, true, fontPx, outlineWidth, fillGradient);
          }
        } else {
          context.font = resolveFontSpec(fontPx);
          drawLyricToken(token.token.text, rowStartX + token.offsetX, rowCenterY, false, fontPx, outlineWidth * 0.8, dimFill);
        }
      }

      var bandTop = rowCenterY - fontPx * 0.6;
      var bandHeight = fontPx * 0.5;
      context.save();
      if (hasPathApi(context)) {
        context.beginPath();
        context.rect(0, bandTop, viewWidth, bandHeight);
        context.clip();
        var glossGradient = context.createLinearGradient(0, bandTop, 0, bandTop + bandHeight);
        safeAddStop(glossGradient, 0, "rgba(255,255,255,0.72)");
        safeAddStop(glossGradient, 0.5, "rgba(255,255,255,0.3)");
        safeAddStop(glossGradient, 1, "rgba(255,255,255,0)");
        context.fillStyle = glossGradient;
        context.font = resolveFontSpec(fontPx);
        for (tokenIndex = 0; tokenIndex < row.tokens.length; tokenIndex += 1) {
          token = row.tokens[tokenIndex];
          if (audioTime < token.token.start) {
            continue;
          }
          context.fillText(token.token.text, rowStartX + token.offsetX, rowCenterY);
        }
        context.restore();
      } else {
        context.restore();
      }
    }
    context.restore();
    return layout;
  }

  function drawEmptyState(audioTime) {
    var centerX = viewWidth / 2;
    var centerY = viewHeight * 0.5;
    var plateWidth = Math.min(viewWidth * 0.8, 600);
    var plateHeight = clampNumber(viewHeight * 0.17, 104, 178);
    var bob = Math.sin(audioTime * 1.1) * 6 * motionScale;
    var plateX = centerX - plateWidth / 2;
    var plateY = centerY - plateHeight / 2 + bob;
    var titleText = stageState.hasInit ? EMPTY_STATE_TEXT : "糖釉过载";
    var hintText = stageState.hasInit ? EMPTY_STATE_HINT : "等待播放器接入";

    context.save();
    context.translate(centerX, plateY + plateHeight / 2);
    context.rotate(-0.018);
    context.translate(-centerX, -(plateY + plateHeight / 2));

    if (roundedRectPath(context, plateX, plateY, plateWidth, plateHeight, plateHeight * 0.42)) {
      context.shadowColor = "rgba(32,0,36,0.5)";
      context.shadowBlur = Math.max(12, plateHeight * 0.28);
      context.shadowOffsetY = plateHeight * 0.1;
      var plateGradient = context.createLinearGradient(plateX, plateY, plateX, plateY + plateHeight);
      safeAddStop(plateGradient, 0, toColorString(lightenTriple(accentColor, 0.72), 0.98));
      safeAddStop(plateGradient, 0.55, toColorString(accentColor, 0.96));
      safeAddStop(plateGradient, 1, toColorString(darkenTriple(accentColor, 0.32), 0.96));
      context.fillStyle = plateGradient;
      context.fill();
      context.shadowColor = "transparent";
      context.shadowBlur = 0;
      context.shadowOffsetY = 0;
      context.lineWidth = Math.max(2, plateHeight * 0.035);
      context.strokeStyle = "rgba(30,2,34,0.85)";
      context.stroke();

      context.save();
      context.beginPath();
      context.rect(plateX, plateY, plateWidth, plateHeight * 0.42);
      context.clip();
      var sheen = context.createLinearGradient(0, plateY, 0, plateY + plateHeight * 0.42);
      safeAddStop(sheen, 0, "rgba(255,255,255,0.62)");
      safeAddStop(sheen, 1, "rgba(255,255,255,0)");
      context.fillStyle = sheen;
      context.fillRect(plateX, plateY, plateWidth, plateHeight * 0.42);
      context.restore();
    }

    context.textAlign = "center";
    context.textBaseline = "middle";
    context.font = "900 " + Math.round(plateHeight * 0.24) + "px \"PingFang SC\", \"Microsoft YaHei\", sans-serif";
    context.lineJoin = "round";
    context.lineWidth = Math.max(2, plateHeight * 0.032);
    context.strokeStyle = "rgba(30,2,34,0.72)";
    context.strokeText(titleText, centerX, plateY + plateHeight * 0.42);
    context.fillStyle = "#fffafd";
    context.fillText(titleText, centerX, plateY + plateHeight * 0.42);
    context.font = "600 " + Math.round(clampNumber(plateHeight * 0.135, 11, 22)) + "px \"PingFang SC\", \"Microsoft YaHei\", sans-serif";
    context.fillStyle = "rgba(48,4,52,0.78)";
    context.fillText(hintText, centerX, plateY + plateHeight * 0.72);
    context.restore();
  }

  function drawSongChip() {
    var label = stageState.songTitle;
    if (!label) {
      return;
    }
    if (stageState.songArtist) {
      label = label + "  ·  " + stageState.songArtist;
    }
    if (label.length > 24) {
      label = label.slice(0, 24) + "…";
    }
    var chipFont = Math.round(clampNumber(viewWidth * 0.0125, 11, 16));
    var maxChipWidth = viewWidth * 0.66;
    context.save();
    context.font = "700 " + chipFont + "px \"PingFang SC\", \"Microsoft YaHei\", sans-serif";
    var textWidth = context.measureText(label).width;
    if (isFinite(textWidth) && textWidth > maxChipWidth - 54) {
      chipFont = Math.max(9, chipFont * ((maxChipWidth - 54) / textWidth));
      context.font = "700 " + chipFont + "px \"PingFang SC\", \"Microsoft YaHei\", sans-serif";
      textWidth = context.measureText(label).width;
    }
    if (!isFinite(textWidth) || textWidth <= 0) {
      textWidth = chipFont * 6;
    }
    var chipHeight = chipFont * 2.2;
    var chipWidth = textWidth + chipHeight * 1.2;
    var chipX = Math.max(14, viewWidth * 0.038);
    var chipY = Math.max(14, viewHeight * 0.05);
    context.translate(chipX, chipY);
    context.rotate(-0.022);
    if (roundedRectPath(context, 0, 0, chipWidth, chipHeight, chipHeight / 2)) {
      context.shadowColor = "rgba(30,0,34,0.45)";
      context.shadowBlur = chipHeight * 0.5;
      context.shadowOffsetY = chipHeight * 0.14;
      var chipGradient = context.createLinearGradient(0, 0, 0, chipHeight);
      safeAddStop(chipGradient, 0, "rgba(60,10,80,0.92)");
      safeAddStop(chipGradient, 1, "rgba(28,4,40,0.86)");
      context.fillStyle = chipGradient;
      context.fill();
      context.shadowColor = "transparent";
      context.shadowBlur = 0;
      context.shadowOffsetY = 0;
      context.lineWidth = Math.max(1, chipHeight * 0.04);
      context.strokeStyle = "rgba(255,190,235,0.7)";
      context.stroke();
    }
    if (sparklePath(context, chipHeight * 0.62, chipHeight * 0.5, chipHeight * 0.28, 0.34)) {
      var starGradient = context.createLinearGradient(0, 0, chipHeight, chipHeight);
      safeAddStop(starGradient, 0, toColorString(lightenTriple(accentColor, 0.8), 1));
      safeAddStop(starGradient, 1, toColorString(accentColor, 1));
      context.fillStyle = starGradient;
      context.fill();
    }
    context.textAlign = "left";
    context.textBaseline = "middle";
    context.font = "700 " + chipFont + "px \"PingFang SC\", \"Microsoft YaHei\", sans-serif";
    context.fillStyle = "rgba(255,248,253,0.96)";
    context.fillText(label, chipHeight * 1.05, chipHeight * 0.54);
    context.restore();
  }

  function drawLyrics(timeSec) {
    var audioTime = stageState.time;
    if (!normalizedLines.length) {
      stageState.lineIndex = -1;
      stageState.currentText = "";
      drawEmptyState(timeSec);
      drawSongChip();
      return;
    }
    var index = findLineIndex(audioTime);
    if (index !== stageState.lineIndex) {
      stageState.lineIndex = index;
      stageState.currentText = index >= 0 ? normalizedLines[index].text : "";
      if (liveRegion) {
        liveRegion.textContent = stageState.currentText || stageState.songTitle || "糖釉过载";
      }
    }
    drawSongChip();
    if (index < 0) {
      return;
    }
    var line = normalizedLines[index];
    var baseFontPx = clampNumber(Math.min(viewWidth * 0.082, viewHeight * 0.108), 22, 104);
    var maxWidth = Math.min(viewWidth * 0.86, 1100);
    var layout = getLineLayout(line, baseFontPx, maxWidth);
    if (!layout) {
      return;
    }
    var centerY = viewHeight * 0.5;
    var gap = Math.max(16, layout.rowHeight * 0.52);
    var ghostFont = clampNumber(layout.fontPx * 0.42, 14, 34);
    var previousLine = index > 0 ? normalizedLines[index - 1] : null;
    var nextLine = index + 1 < normalizedLines.length ? normalizedLines[index + 1] : null;
    if (previousLine && previousLine.text) {
      drawGhostLine(previousLine.text, Math.max(viewHeight * 0.11, centerY - layout.blockHeight / 2 - gap - ghostFont * 0.5), ghostFont, 0.5);
    }
    if (nextLine && nextLine.text) {
      drawGhostLine(nextLine.text, Math.min(viewHeight * 0.93, centerY + layout.blockHeight / 2 + gap + ghostFont * 0.5), ghostFont, 0.36);
    }
    drawCurrentLine(line, layout, centerY, audioTime);
  }

  /* ---------- inflatable props ---------- */
  var propList = [];
  var bakeCursor = 0;
  var glowSprites = { accent: null, cyan: null };
  var sunburstSprite = null;
  var sunburstTried = false;
  var shadowSprite = null;
  var slimeTone = null;

  function currentTimeMs() {
    if (typeof window.performance !== "undefined" && window.performance.now) {
      return window.performance.now();
    }
    return Date.now();
  }

  function bakeSprite(cssWidth, cssHeight, painter) {
    var sink = createSink(cssWidth * pixelRatio, cssHeight * pixelRatio);
    if (!sink) {
      return null;
    }
    sink.context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    try {
      painter(sink.context, cssWidth, cssHeight);
    } catch (error) {
      noteError("bake", error);
      return null;
    }
    return { canvas: sink.canvas, cssWidth: cssWidth, cssHeight: cssHeight };
  }

  function ellipsePath(target, centerX, centerY, radiusX, radiusY, rotation) {
    if (!target || typeof target.beginPath !== "function") {
      return false;
    }
    var safeX = Math.max(0.5, Math.abs(radiusX));
    var safeY = Math.max(0.5, Math.abs(radiusY));
    try {
      target.beginPath();
      if (typeof target.ellipse === "function") {
        target.ellipse(centerX, centerY, safeX, safeY, rotation || 0, 0, Math.PI * 2);
        return true;
      }
      target.save();
      target.translate(centerX, centerY);
      target.rotate(rotation || 0);
      target.scale(1, safeY / safeX);
      target.arc(0, 0, safeX, 0, Math.PI * 2);
      target.restore();
      return true;
    } catch (error) {
      noteError("ellipsePath", error);
      return false;
    }
  }

  function resetPropCaches() {
    propList = [];
    bakeCursor = 0;
    glowSprites = { accent: null, cyan: null };
    slimeTone = null;
    invalidateSunburst();
  }

  function ensurePropList() {
    if (propList.length > 0) {
      return;
    }
    propList = [
      { kind: "donut", nx: 0.11, ny: 0.16, size: 0.19, tilt: -0.2, phase: 0.3, beatScale: 0.05, sprite: null },
      { kind: "can", nx: 0.885, ny: 0.72, size: 0.135, tilt: 0.26, phase: 1.7, beatScale: 0.06, sprite: null },
      { kind: "heart", nx: 0.855, ny: 0.15, size: 0.1, tilt: 0.16, phase: 0.9, beatScale: 0.09, sprite: null },
      { kind: "ball", nx: 0.945, ny: 0.33, size: 0.05, tilt: 0, phase: 2.4, beatScale: 0.12, sprite: null },
      { kind: "ball", nx: 0.07, ny: 0.71, size: 0.045, tilt: 0, phase: 3.1, beatScale: 0.1, sprite: null },
      { kind: "heart", nx: 0.17, ny: 0.87, size: 0.085, tilt: -0.22, phase: 1.2, beatScale: 0.08, sprite: null },
      { kind: "spike", nx: 0.74, ny: 0.9, size: 0.055, tilt: 0.4, phase: 2, beatScale: 0.14, sprite: null }
    ];
    bakeCursor = 0;
  }

  function propRadius(prop) {
    var unit = Math.min(viewWidth, viewHeight);
    return clampNumber(prop.size * unit, 10, 520);
  }

  function ensurePropsBaked() {
    var startAt = currentTimeMs();
    for (var step = 0; step < 2; step += 1) {
      if (bakeCursor >= propList.length) {
        return;
      }
      var prop = propList[bakeCursor];
      if (!prop.sprite) {
        prop.sprite = bakePropSprite(prop);
      }
      bakeCursor += 1;
      if (currentTimeMs() - startAt > 5) {
        return;
      }
    }
  }

  function bakePropSprite(prop) {
    var radius = propRadius(prop);
    if (prop.kind === "donut") {
      return bakeDonutSprite(radius);
    }
    if (prop.kind === "ball") {
      return bakeBallSprite(radius, mixTriple(accentColor, [110, 245, 255], 0.55));
    }
    if (prop.kind === "heart") {

      var gradient = paint.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      safeAddStop(gradient, 0, toColorString(lightenTriple(color, 0.5), 0.9));
      safeAddStop(gradient, 0.4, toColorString(color, 0.35));
      safeAddStop(gradient, 1, toColorString(color, 0));
      paint.fillStyle = gradient;
      paint.fillRect(0, 0, size, size);
    });
    glowSprites[tint] = sprite || false;
    return sprite;
  }

  function drawFloatingOrbs(timeSec) {
    var orbSpecs = [
      { nx: 0.24, ny: 0.32, size: 0.09, tint: "cyan", phase: 0.4 },
      { nx: 0.63, ny: 0.18, size: 0.06, tint: "accent", phase: 1.9 },
      { nx: 0.47, ny: 0.78, size: 0.08, tint: "accent", phase: 2.7 },
      { nx: 0.92, ny: 0.55, size: 0.07, tint: "cyan", phase: 3.4 },
      { nx: 0.05, ny: 0.42, size: 0.055, tint: "accent", phase: 4.1 },
      { nx: 0.79, ny: 0.94, size: 0.05, tint: "cyan", phase: 5.2 }
    ];
    var unit = Math.min(viewWidth, viewHeight);
    context.save();
    context.globalCompositeOperation = "lighter";
    for (var index = 0; index < orbSpecs.length; index += 1) {
      var orb = orbSpecs[index];
      var sprite = ensureGlowSprite(orb.tint);
      if (!sprite || !canUseAsImage(sprite.canvas)) {
        continue;
      }
      var size = orb.size * unit * (1 + Math.sin(timeSec * 1.3 + orb.phase) * 0.12 * motionScale);
      var orbX = orb.nx * viewWidth + Math.sin(timeSec * 0.4 + orb.phase) * unit * 0.02 * motionScale;
      var orbY = orb.ny * viewHeight + Math.cos(timeSec * 0.33 + orb.phase) * unit * 0.03 * motionScale;
      context.globalAlpha = 0.42 + beatPulse * 0.3;
      context.drawImage(sprite.canvas, orbX - size / 2, orbY - size / 2, size, size);
    }
    context.restore();
  }

  function drawSparkles(timeSec) {
    var sparkleSpecs = [
      { nx: 0.36, ny: 0.2, size: 0.014, speed: 1.4, phase: 0.2 },
      { nx: 0.56, ny: 0.13, size: 0.01, speed: 1.1, phase: 1.1 },
      { nx: 0.68, ny: 0.34, size: 0.012, speed: 1.7, phase: 2.3 },
      { nx: 0.31, ny: 0.6, size: 0.011, speed: 1.3, phase: 3.4 },
      { nx: 0.61, ny: 0.7, size: 0.016, speed: 1.5, phase: 4.6 },
      { nx: 0.16, ny: 0.5, size: 0.009, speed: 1.2, phase: 5.2 },
      { nx: 0.9, ny: 0.44, size: 0.013, speed: 1.6, phase: 0.8 },
      { nx: 0.48, ny: 0.88, size: 0.01, speed: 1.35, phase: 2.9 },
      { nx: 0.78, ny: 0.6, size: 0.009, speed: 1.8, phase: 3.7 },
      { nx: 0.08, ny: 0.3, size: 0.012, speed: 1.45, phase: 4.9 }
    ];
    var unit = Math.min(viewWidth, viewHeight);
    context.save();
    context.globalCompositeOperation = "lighter";
    for (var index = 0; index < sparkleSpecs.length; index += 1) {
      var sparkle = sparkleSpecs[index];
      var twinkle = 0.5 + 0.5 * Math.sin(timeSec * sparkle.speed * 2 + sparkle.phase);
      var radius = sparkle.size * unit * (0.6 + twinkle * 0.8 + beatPulse * 0.4);
      if (radius < 1) {
        continue;
      }
      context.globalAlpha = 0.35 + twinkle * 0.5;
      context.fillStyle = index % 3 === 0 ? toColorString([190, 255, 255], 1) : "rgba(255,250,255,1)";
      if (sparklePath(context, sparkle.nx * viewWidth, sparkle.ny * viewHeight, radius, 0.22)) {
        context.fill();
      }
    }
    context.restore();
  }

  function drawFrame(nowMs) {
    if (!context) {
      return;
    }
    var timeSec = nowMs / 1000;
    if (!lastFrameAt) {
      lastFrameAt = nowMs;
    }
    var delta = clampNumber((nowMs - lastFrameAt) / 1000, 0, 0.1);
    lastFrameAt = nowMs;

    motionScale = stageState.reducedMotion ? 0.22 : 1;
    beatPulse += (0 - beatPulse) * Math.min(1, delta * 5.5);
    smoothedLevel += (stageState.liveLevel - smoothedLevel) * Math.min(1, delta * 4);

    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    context.globalAlpha = 1;
    context.globalCompositeOperation = "source-over";

    drawBackground(timeSec);
    drawProps(timeSec);
    drawChromeSlime(timeSec);
    drawScrim();
    drawLyrics(timeSec);
    drawFloatingOrbs(timeSec);
    drawSparkles(timeSec);
    drawVignette();
  }

  function frame(nowMs) {
    var startAt = (typeof window.performance !== "undefined" && window.performance.now) ? window.performance.now() : Date.now();
    try {
      drawFrame(typeof nowMs === "number" ? nowMs : startAt);
    } catch (error) {
      noteError("frame", error);
    }
    stageState.frames += 1;
    var endAt = (typeof window.performance !== "undefined" && window.performance.now) ? window.performance.now() : Date.now();
    stageState.jsMs = Math.round((endAt - startAt) * 100) / 100;
    window.requestAnimationFrame(frame);
  }

  function handleMessage(event) {
    var message = event ? event.data : null;
    if (!message || message.__c100 !== 1) {
      return;
    }
    try {
      if (message.type === "init") {
        applyInit(message.payload || {});
      } else if (message.type === "tick") {
        applyTick(message.payload || {});
      } else if (message.type === "beat") {
        applyBeat(message.payload || {});
      } else if (message.type === "live") {
        applyLive(message.payload || {});
      }
    } catch (error) {
      noteError("message:" + message.type, error);
    }
  }

  window.addEventListener("message", handleMessage, false);
  window.addEventListener("resize", function () {
    try {
      applyViewportSize();
    } catch (error) {
      noteError("resize", error);
    }
    if (resizeTimer) {
      window.clearTimeout(resizeTimer);
    }
    resizeTimer = window.setTimeout(function () {
      resizeTimer = 0;
      try {
        layoutCache.key = "";
        layoutCache.layout = null;
        backgroundCache.key = "";
        resetPropCaches();
      } catch (error) {
        noteError("resize:cache", error);
      }
    }, 160);
  }, false);

  applyViewportSize();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
