<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>静默之境</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#17191a}
  body{font-family:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong","SimSun",Georgia,serif;
       -webkit-font-smoothing:antialiased;color:#dcd8d0}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #dyn{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  #stage{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
  #stage.on{opacity:1}
  #lyr{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;
       padding-left:clamp(20px,7.6vw,152px);padding-right:clamp(20px,7vw,130px);
       padding-bottom:clamp(76px,14vh,168px)}
  #blk{width:100%;max-width:min(84vw,1080px);display:flex;flex-direction:column;
       will-change:transform}
  #over{display:flex;align-items:center;gap:.85em;margin-bottom:2.1em;
        font-size:clamp(8px,.6vw,11px);letter-spacing:.4em;text-transform:uppercase;
        color:rgba(226,221,210,.52);white-space:nowrap;overflow:hidden}
  #over i{flex:0 0 auto;width:2.4em;height:1px;background:rgba(226,221,210,.42)}
  #ovn{max-width:44vw;overflow:hidden;text-overflow:ellipsis}
  #ova{opacity:.62;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
  .gst{color:#cdc7bb;opacity:.2;letter-spacing:.2em;line-height:1.75;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,.92vw,15px);
       min-height:.2em;transition:opacity .6s ease}
  .gst#g0{opacity:.09}
  .gst#g3{opacity:.05}
  .ln{opacity:0;transform:translateY(12px);transition:opacity .85s ease,transform 1.15s cubic-bezier(.2,.78,.22,1);
      will-change:opacity,transform;color:#f4efe4;letter-spacing:.055em;line-height:1.42;
      word-break:break-word;overflow-wrap:anywhere;text-shadow:0 1px 3px rgba(0,0,0,.42);
      font-size:34px}
  .ln.live{opacity:1;transform:translateY(0)}
  .c{color:rgba(232,227,216,.26);transition:color .34s ease}
  .c.on{color:#fbf6ec}
  #hair{height:1px;background:rgba(226,222,212,.12);margin:.95em 0 .9em;
        width:clamp(52px,13vw,168px);position:relative;overflow:hidden}
  #hair i{position:absolute;left:0;top:0;height:100%;width:100%;background:rgba(244,240,229,.7);
          transform:scaleX(0);transform-origin:0 50%;will-change:transform}
  #empty{display:none;color:rgba(236,231,220,.68);letter-spacing:.42em;
         font-size:clamp(14px,1.3vw,19px);line-height:1.9}
  #empty b{display:block;font-weight:400;color:rgba(205,199,189,.36);letter-spacing:.34em;
           font-size:clamp(8px,.62vw,11px);margin-top:1.7em;text-transform:uppercase}
  .mk{position:absolute;left:clamp(20px,7.6vw,152px);bottom:8.4vh;
      font-size:clamp(8px,.6vw,11px);letter-spacing:.44em;color:rgba(224,219,208,.52);
      text-transform:uppercase;white-space:nowrap}
  .mk i{display:inline-block;width:2.6em;height:1px;background:rgba(224,219,208,.4);
        vertical-align:middle;margin-right:1.1em}
  .rt{position:absolute;right:clamp(20px,7vw,130px);bottom:8.4vh;font-size:clamp(8px,.6vw,11px);
      letter-spacing:.32em;color:rgba(224,219,208,.44);white-space:nowrap;
      font-variant-numeric:tabular-nums}
  .nm{display:none}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.3;mix-blend-mode:overlay}
  @media (max-width:640px){
    #blk{max-width:100%}
    .gst{letter-spacing:.14em;font-size:11px}
    #lyr{padding-left:26px;padding-right:26px;padding-bottom:clamp(96px,17vh,150px)}
    #over{margin-bottom:1.5em;letter-spacing:.3em}
    .ln{line-height:1.5;letter-spacing:.03em}
    .mk{bottom:6.6vh;letter-spacing:.32em}
    .rt{bottom:6.6vh;letter-spacing:.2em}
  }
  @media (max-height:520px){
    #lyr{padding-bottom:64px}
    #over{margin-bottom:1.1em}
    .gst#g0,.gst#g3{display:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="dyn"></canvas>
<div id="stage">
  <div id="lyr">
    <div id="blk">
      <div id="over">
        <span id="ovn"></span>
        <i></i>
        <span id="ova"></span>
      </div>
      <div class="gst" id="g0"></div>
      <div class="gst" id="g1"></div>
      <div class="ln" id="ln"></div>
      <div id="hair"><i id="hairi"></i></div>
      <div class="gst" id="g2"></div>
      <div class="gst" id="g3"></div>
      <div id="empty">安静 · 暂无词<b>Instrumental / Silence</b></div>
    </div>
  </div>
  <div class="mk" id="mk"><i></i><span id="mkT">ECM · SILENCE</span></div>
  <div class="rt" id="rt">00:00</div>
</div>
<div id="grain"></div>
<script>
(function(){
'use strict';
var S = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
  text: '', gl: false, rm: false, dur: 0
};
window.__stage = function(){
  return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: S.err, text: S.text,
    gl: S.gl, rm: S.rm
  };
};
var W = 1440, H = 900, DPR = 1;
var cvs = document.getElementById('gl');
var ctx = cvs.getContext('2d');
var dcvs = document.getElementById('dyn');
var dctx = dcvs ? dcvs.getContext('2d') : null;
var stageEl = document.getElementById('stage');
var rtEl = document.getElementById('rt');
var mkT = document.getElementById('mkT');

function setSize(){
  var w = window.innerWidth || 0, h = window.innerHeight || 0;
  if(!isFinite(w) || w < 2) w = 1440;
  if(!isFinite(h) || h < 2) h = 900;
  W = Math.round(w); H = Math.round(h);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.max(2, Math.round(W * DPR));
  cvs.height = Math.max(2, Math.round(H * DPR));
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(dcvs && dctx){
    dcvs.width = Math.max(2, Math.round(W * DPR));
    dcvs.height = Math.max(2, Math.round(H * DPR));
    dcvs.style.width = W + 'px'; dcvs.style.height = H + 'px';
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
setSize();
window.addEventListener('resize', function(){
  try{
    setSize();
    buildPlate();
    buildGrads();
    buildSpec();
    paintStatic();
    paint();
    if(S.lines.length){ rebuild(); sync(true); }
  }catch(e){ console.error('[490] resize', e); }
});
S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

var R = Math.random;
function rnd(a, b){ return a + R() * (b - a); }

// ===== PLATE: offscreen winter coast, rendered once per size =====
var plate = document.createElement('canvas');
var pctx = plate.getContext('2d');
var ridgePath = null, shoreY = 0, horizonY = 0;

function buildPlate(){
  plate.width = Math.max(2, Math.round(W * DPR));
  plate.height = Math.max(2, Math.round(H * DPR));
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var w = W, h = H;
  var g, i, x, y;

  // base sky: cold grey gradient, dark enough for white chamber type
  g = pctx.createLinearGradient(0, 0, w * 0.16, h * 0.72);
  g.addColorStop(0, '#101415');
  g.addColorStop(0.30, '#1a1f20');
  g.addColorStop(0.58, '#2c3132');
  g.addColorStop(0.82, '#4e5353');
  g.addColorStop(1, '#767a76');
  pctx.fillStyle = g;
  pctx.fillRect(0, 0, w, h);

  // soft light source bleeding from upper right
  var rg = pctx.createRadialGradient(w * 0.86, h * 0.10, 0, w * 0.86, h * 0.10, Math.max(w, h) * 0.78);
  rg.addColorStop(0, 'rgba(224,222,212,.16)');
  rg.addColorStop(0.4, 'rgba(200,200,190,.05)');
  rg.addColorStop(1, 'rgba(200,200,190,0)');
  pctx.fillStyle = rg;
  pctx.fillRect(0, 0, w, h);

  // low-contrast cloud strata (horizontal bands, never a gradient fade loop)
  for(i = 0; i < 26; i++){
    y = rnd(-0.04, 0.62) * h;
    var bh = rnd(2, 34) * (h / 900);
    pctx.globalAlpha = rnd(0.025, 0.085);
    pctx.fillStyle = R() > 0.45 ? '#e8e6dc' : '#1b2021';
    pctx.beginPath();
    pctx.ellipse(rnd(0, w), y, rnd(w * 0.18, w * 0.62), bh, rnd(-0.05, 0.05), 0, 6.2832);
    pctx.fill();
  }
  pctx.globalAlpha = 1;

  // horizon line: thin cold seam between sky and water
  horizonY = h * 0.548;
  pctx.globalAlpha = 0.5;
  pctx.fillStyle = '#cfd0c6';
  pctx.fillRect(0, horizonY, w, Math.max(1, h / 900));
  pctx.globalAlpha = 1;

  // far water: pale shrinking band, brightest at the horizon seam
  g = pctx.createLinearGradient(0, horizonY, 0, horizonY + h * 0.11);
  g.addColorStop(0, 'rgba(178,181,175,.34)');
  g.addColorStop(0.35, 'rgba(120,124,122,.18)');
  g.addColorStop(1, 'rgba(40,44,44,.05)');
  pctx.fillStyle = g;
  pctx.fillRect(0, horizonY, w, h * 0.12);

  // water ripples: thin horizontal strokes, denser near the horizon
  for(i = 0; i < 260; i++){
    var fy = R();
    y = horizonY + Math.pow(fy, 1.75) * h * 0.125;
    var len = rnd(w * 0.008, w * 0.14) * (0.35 + fy);
    x = rnd(-w * 0.05, w);
    pctx.globalAlpha = rnd(0.025, 0.15) * (1 - fy * 0.4);
    pctx.strokeStyle = R() > 0.45 ? '#eceade' : '#151a1a';
    pctx.lineWidth = Math.max(0.6, (0.6 + fy * 1.5) * (h / 900));
    pctx.beginPath();
    pctx.moveTo(x, y);
    pctx.lineTo(x + len, y + rnd(-1.1, 1.1));
    pctx.stroke();
  }
  pctx.globalAlpha = 1;

  // layered coast ridges: three receding planes, darkest at the front
  for(var band = 0; band < 3; band++){
    var baseY = h * (0.735 + band * 0.085);
    var amp = h * (0.030 + band * 0.028);
    var rp = new Path2D();
    rp.moveTo(-w * 0.02, h * 1.02);
    var steps = 30;
    for(i = 0; i <= steps; i++){
      var u = i / steps;
      var rx = u * w * 1.04;
      var ry = baseY
        + Math.sin(u * (2.1 + band * 1.3) + band * 2.2) * amp
        + Math.sin(u * (6.4 + band * 2.1) + 1.3) * amp * 0.34
        - Math.pow(u, 1.6) * h * 0.06;
      rp.lineTo(rx, ry);
    }
    rp.lineTo(w * 1.04, h * 1.02);
    rp.closePath();
    var shade = ['#2a2e2e', '#1c2121', '#0d1111'][band];
    g = pctx.createLinearGradient(0, baseY - amp, 0, h);
    g.addColorStop(0, shade);
    g.addColorStop(1, band === 2 ? '#080b0b' : '#141818');
    pctx.fillStyle = g;
    pctx.fill(rp);
    if(band === 0){ ridgePath = rp; shoreY = baseY; }

    // snow-dust crest along this plane
    pctx.save();
    pctx.clip(rp);
    for(i = 0; i < 70; i++){
      var sx = rnd(0, w);
      pctx.globalAlpha = rnd(0.02, 0.10) * (1 - band * 0.25);
      pctx.fillStyle = '#dfe0d6';
      pctx.beginPath();
      pctx.ellipse(sx, baseY + rnd(-amp * 0.5, h * 0.03), rnd(w * 0.008, w * 0.07), rnd(0.5, 2.6), 0, 0, 6.2832);
      pctx.fill();
    }
    pctx.restore();
    pctx.globalAlpha = 1;
  }

  // distant pines along the first ridge, small and sparse
  for(i = 0; i < 9; i++){
    var px = rnd(w * 0.04, w * 0.95);
    var pb = h * 0.735 + h * rnd(-0.012, 0.026);
    var ph = h * rnd(0.014, 0.048);
    pctx.globalAlpha = rnd(0.3, 0.62);
    pctx.fillStyle = '#0c1010';
    pctx.beginPath();
    pctx.moveTo(px, pb - ph);
    pctx.lineTo(px + ph * 0.21, pb);
    pctx.lineTo(px - ph * 0.21, pb);
    pctx.closePath();
    pctx.fill();
  }
  pctx.globalAlpha = 1;

  // reflected light column under the horizon: the one bright gesture in the print
  var colX = w * 0.735;
  var cg = pctx.createLinearGradient(colX - w * 0.13, 0, colX + w * 0.13, 0);
  cg.addColorStop(0, 'rgba(232,230,218,0)');
  cg.addColorStop(0.5, 'rgba(232,230,218,.20)');
  cg.addColorStop(1, 'rgba(232,230,218,0)');
  pctx.fillStyle = cg;
  pctx.fillRect(colX - w * 0.13, horizonY, w * 0.26, h * 0.115);
  var cg2 = pctx.createLinearGradient(0, horizonY, 0, horizonY + h * 0.115);
  cg2.addColorStop(0, 'rgba(20,26,26,0)');
  cg2.addColorStop(1, 'rgba(20,26,26,.55)');
  pctx.fillStyle = cg2;
  pctx.fillRect(colX - w * 0.13, horizonY, w * 0.26, h * 0.115);

  // drifting mist: soft low-alpha horizontal veils over the water
  for(i = 0; i < 7; i++){
    var my = horizonY + h * rnd(-0.03, 0.075);
    pctx.globalAlpha = rnd(0.02, 0.055);
    pctx.fillStyle = '#e9e7da';
    pctx.beginPath();
    pctx.ellipse(rnd(w * 0.1, w * 0.95), my, rnd(w * 0.22, w * 0.55), rnd(2, 14) * (h / 900), 0, 0, 6.2832);
    pctx.fill();
  }
  pctx.globalAlpha = 1;

  // left-to-right shade that reserves clean space for type
  g = pctx.createLinearGradient(0, 0, w * 0.78, h * 0.3);
  g.addColorStop(0, 'rgba(8,11,11,.50)');
  g.addColorStop(0.5, 'rgba(8,11,11,.16)');
  g.addColorStop(1, 'rgba(8,11,11,0)');
  pctx.fillStyle = g;
  pctx.fillRect(0, 0, w, h);

  // paper fibre: tiny specks baked in
  for(i = 0; i < 1400; i++){
    x = R() * w; y = R() * h;
    pctx.globalAlpha = rnd(0.015, 0.07);
    pctx.fillStyle = R() > 0.5 ? '#ffffff' : '#000000';
    pctx.fillRect(x, y, rnd(0.5, 1.6), rnd(0.5, 1.6));
  }
  pctx.globalAlpha = 1;

  // faint fold/scan lines: the print itself, not the scene
  for(i = 0; i < 3; i++){
    var fy2 = h * rnd(0.1, 0.95);
    pctx.globalAlpha = rnd(0.012, 0.035);
    pctx.fillStyle = R() > 0.5 ? '#ffffff' : '#000000';
    pctx.fillRect(0, fy2, w, rnd(0.6, 1.8));
  }
  pctx.globalAlpha = 1;
}

var spec = null, specW = 0;
function buildSpec(){
  specW = Math.max(48, Math.min(200, Math.round(W / 9)));
  spec = new Float32Array(specW);
}
buildSpec();

var F = { live: { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 }, pulse: 0, sweep: 0, haze: 0, tick: 0 };
var lastTs = 0;
var gradeG = null, sweepG = null;

function buildGrain(){
  var s = 150;
  var tile = document.createElement('canvas');
  tile.width = s; tile.height = s;
  var gc = tile.getContext('2d');
  var img = gc.createImageData(s, s);
  var d = img.data;
  for(var i = 0; i < d.length; i += 4){
    var v = Math.sin(i * 12.9898) * 43758.5453;
    v = v - Math.floor(v);
    var l = 128 + (v - 0.5) * 250;
    d[i] = l; d[i + 1] = l; d[i + 2] = l;
    d[i + 3] = v > 0.66 ? 30 : 0;
  }
  gc.putImageData(img, 0, 0);
  var gEl = document.getElementById('grain');
  if(gEl){
    // static film grain lives in CSS: one composited layer, zero per-frame cost
    gEl.style.background = 'url(' + tile.toDataURL() + ') repeat';
    gEl.style.backgroundSize = s + 'px ' + s + 'px';
  }
}
try{ buildGrain(); }catch(e){ console.error('[490] grain', e); }

function buildGrads(){
  gradeG = ctx.createLinearGradient(0, 0, 0, H);
  gradeG.addColorStop(0, 'rgba(9,12,12,.66)');
  gradeG.addColorStop(0.24, 'rgba(9,12,12,0)');
  gradeG.addColorStop(0.62, 'rgba(9,12,12,.05)');
  gradeG.addColorStop(0.76, 'rgba(7,10,10,.30)');
  gradeG.addColorStop(1, 'rgba(5,7,7,.74)');
  var sx2 = dctx || ctx;
  sweepG = sx2.createLinearGradient(0, 0, W * 0.9, H);
  sweepG.addColorStop(0, 'rgba(255,253,246,0)');
  sweepG.addColorStop(0.36, 'rgba(255,253,246,.60)');
  sweepG.addColorStop(0.5, 'rgba(255,253,246,.14)');
  sweepG.addColorStop(1, 'rgba(255,253,246,0)');
}

// ---- static layer: painted once per resize, never again ----
function paintStatic(){
  if(!ridgePath) buildPlate();
  if(!gradeG) buildGrads();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(plate, 0, 0, W, H);
  // fixed dark grade: reserves clean contrast for the type
  ctx.fillStyle = gradeG;
  ctx.globalAlpha = 1;
  ctx.fillRect(0, 0, W, H);

  // bottom-left hairline rule (type anchor), drawn once
  var pad = Math.min(152, Math.max(20, W * 0.076));
  var ry = H - Math.max(48, H * 0.084) - Math.round(H * 0.036);
  ctx.fillStyle = '#e6e1d4';
  ctx.globalAlpha = 0.26;
  ctx.fillRect(pad, ry, Math.round(Math.min(W * 0.11, 210)), 1);
  ctx.globalAlpha = 1;
}

// ---- dynamic layer: sweep, glints, seam, progress. Cleared every frame. ----
function paint(){
  if(!dctx){ return; }
  var i, x, y, a, w, hh;
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.globalCompositeOperation = 'source-over';
  dctx.globalAlpha = 1;
  dctx.clearRect(0, 0, dcvs.width, dcvs.height);
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // slow light sweep drifting across the water (band only: no full-screen blend)
  if(!S.rm && sweepG){
    var sp = ((F.sweep % 1) + 1) % 1;
    dctx.globalCompositeOperation = 'lighter';
    dctx.globalAlpha = 0.05 + F.live.treble * 0.06 + F.pulse * 0.05;
    var sw = W * 1.2, sx = -W * 0.25 + sp * W * 1.5;
    dctx.fillStyle = sweepG;
    dctx.fillRect(sx - sw * 0.5, horizonY - H * 0.12, sw, H * 0.34);
    dctx.globalCompositeOperation = 'source-over';
    dctx.globalAlpha = 1;
  }

  // horizon thread: the quietest accent in the frame, always breathing
  if(horizonY > 0){
    var br = 0.5 + 0.5 * Math.sin(F.tick * 0.008);       // runs even in reduced motion
    dctx.globalAlpha = 0.14 + br * 0.10 + F.pulse * 0.26 + F.live.level * 0.10;
    dctx.fillStyle = '#f4efe2';
    dctx.fillRect(0, horizonY, W, 1);
    // a wide, very faint halo over the seam, never a full-screen filter
    dctx.globalAlpha = 0.035 + br * 0.03 + F.pulse * 0.05;
    dctx.fillRect(0, horizonY - H * 0.012, W, H * 0.024);
    dctx.globalAlpha = 1;
  }

  // water glints: tiny additive bars over the near water
  var bass = F.live.bass;
  dctx.globalCompositeOperation = 'lighter';
  dctx.fillStyle = '#fbf7ea';
  for(i = 0; i < specW; i += 2){
    var v = spec[i];
    if(v < 0.02) continue;
    var fy = i / specW;
    x = fy * W * 1.02 - W * 0.01;
    y = horizonY + H * (0.030 + fy * 0.082);
    a = (0.03 + v * 0.30) * (0.55 + bass * 0.9);
    dctx.globalAlpha = a > 0.6 ? 0.6 : a;
    w = 2 + v * 26;
    hh = 1 + v * 1.6;
    dctx.fillRect(x, y, w, hh);
  }
  dctx.globalAlpha = 1;
  dctx.globalCompositeOperation = 'source-over';

  // drifting haze: one wide translucent band sliding across the water plane
  if(!S.rm){
    var hz2 = ((F.haze % 1) + 1) % 1;
    var hx = -W * 0.5 + hz2 * W * 1.6;
    dctx.globalAlpha = 0.05 + F.live.mid * 0.05;
    dctx.fillStyle = '#e8e6da';
    dctx.beginPath();
    dctx.ellipse(hx, horizonY + H * 0.028, W * 0.30, H * 0.022, 0, 0, 6.2832);
    dctx.fill();
    dctx.globalAlpha = 1;
  }

  // airborne motes: a dozen specks on slow independent orbits
  if(!S.rm){
    var tsec = F.tick / 60;
    dctx.fillStyle = '#f4f0e2';
    for(i = 0; i < 14; i++){
      var seedX = (i * 0.1732) % 1, seedY = (i * 0.3571) % 1, seedS = (i * 0.0917) % 1;
      var mx = (seedX + Math.sin(tsec * (0.05 + seedS * 0.09) + i) * 0.05) * W;
      var my = horizonY - H * 0.42 + seedY * H * 0.55
             + Math.sin(tsec * (0.07 + seedS * 0.12) + i * 2.1) * H * 0.035;
      var mx2 = ((mx % (W + 60)) + W + 60) % (W + 60) - 30;
      dctx.globalAlpha = 0.10 + seedS * 0.16 + F.pulse * 0.10;
      dctx.fillRect(mx2, my, 1.2 + seedS, 1.2 + seedS);
    }
    dctx.globalAlpha = 1;
  }

  // progress hairline, bottom right
  var padR = Math.min(130, Math.max(20, W * 0.07));
  var len = Math.round(Math.min(W * 0.11, 210));
  var x1 = W - padR;
  var py = H - Math.max(48, H * 0.084) - Math.round(H * 0.036);
  var prog = (S.dur > 0) ? clampNum(S.t / S.dur, 0, 1) : 0;
  dctx.fillStyle = '#e6e1d4';
  dctx.globalAlpha = 0.16;
  dctx.fillRect(x1 - len, py, len, 1);
  dctx.globalAlpha = 0.6;
  dctx.fillRect(x1 - len, py, len * prog, 1);
  dctx.globalAlpha = 0.85;
  dctx.fillRect(x1 - 1, py - 2.5, 1, 6);
  dctx.globalAlpha = 1;
}
// ---- boot: everything below runs once, guarded ----
try{
  buildPlate();
  buildGrads();
  paintStatic();
  paint();
}catch(e){ console.error('[490] boot paint', e); }

// --- lyrics layer: one live line, ghost lines above/below (ECM small-type stack) ---
var G = [document.getElementById('g0'), document.getElementById('g1'),
         document.getElementById('g2'), document.getElementById('g3')];
var L = document.getElementById('ln');
var hairEl = document.getElementById('hair');
var hairI = document.getElementById('hairi');
var blkEl = document.getElementById('blk');
var ovnEl = document.getElementById('ovn');
var ovaEl = document.getElementById('ova');
var emptyEl = document.getElementById('empty');
var LN = { idx: -1, chars: [], base: 0, dur: 3, size: 34, w: 0 };
var stageReady = false;

function clampNum(v, a, b){ return v < a ? a : (v > b ? b : v); }
function txtOf(o){ return (o && typeof o.text === 'string' && o.text.length) ? o.text : ''; }

function charTimes(line){
  var out = [], ch = line && line.chars;
  if(Array.isArray(ch) && ch.length){
    for(var i = 0; i < ch.length && i < 900; i++){
      var c = ch[i];
      if(c && typeof c.c === 'string' && c.c.length){
        var tt = (typeof c.t === 'number' && isFinite(c.t)) ? c.t : null;
        out.push({ c: c.c.slice(0, 12), t: tt });
      }
    }
  }
  return out;
}

// choose font size so the active line never overflows its column (fixed 8 passes, no shrinking loop)
function fitLine(text, chars){
  var n = Math.max(1, chars.length || text.length);
  var pad = Math.min(152, W * 0.076) + Math.min(130, W * 0.07);
  var avail = Math.max(150, Math.min(W - pad - 24, 1080));
  var maxLines = (H < 620) ? 3 : 4;
  // area-based base size: holds up from 1600x900 down to a phone in portrait
  var f = Math.round(clampNum(Math.sqrt(W * H) * 0.043, 22, 54));
  for(var pass = 0; pass < 8; pass++){
    var per = n * f * 1.12;               // serif CJK advance ≈1.06em + tracking slack
    var lines = Math.ceil(per / avail);
    if((per <= avail || lines <= maxLines) && per <= avail * maxLines) break;
    if(f <= 11) break;
    f = Math.max(11, Math.round(f * clampNum(avail * maxLines / per, 0.6, 0.96)));
  }
  LN.size = f;
  LN.w = avail;
  return f;
}

function buildLine(){
  L.textContent = '';
  var line = S.lines[LN.idx] || {};
  var txt = txtOf(line);
  var chars = charTimes(line);
  var f = fitLine(txt, chars);
  L.style.fontSize = f + 'px';
  LN.chars = [];
  if(chars.length){
    var frag = document.createDocumentFragment();
    var acc = 0;
    for(var i = 0; i < chars.length; i++){
      var sp = document.createElement('span');
      sp.className = 'c';
      sp.textContent = chars[i].c;
      frag.appendChild(sp);
      LN.chars.push({ el: sp, t: chars[i].t, i: i });
      acc += chars[i].c.length;
    }
    if(acc < txt.length) frag.appendChild(document.createTextNode(txt.slice(acc)));
    L.appendChild(frag);
  } else {
    L.textContent = txt;
  }
  var n = Math.max(1, txt.length);
  LN.base = (typeof line.t === 'number' && isFinite(line.t)) ? line.t : 0;
  var d = (typeof line.dur === 'number' && isFinite(line.dur) && line.dur > 0) ? line.dur : 0;
  if(!d && S.dur > 0) d = clampNum(S.dur / Math.max(1, S.lines.length), 1.2, 9);
  if(!d) d = clampNum(n * 0.24, 1.4, 8);
  LN.dur = d;
  L.classList.add('live');
  hairEl.style.opacity = '.9';
}

function applyProgress(){
  var n = LN.chars.length;
  if(n){
    var p = clampNum((S.t - LN.base) / (LN.dur * 0.94 + 0.001), 0, 1);
    var upto = Math.round(p * n);
    for(var i = 0; i < n; i++){
      var c = LN.chars[i];
      if(c.t !== null){
        var on = S.t >= c.t - 0.02;
        if(c.onState !== on){ c.el.classList.toggle('on', on); c.onState = on; }
      } else if(c.onState !== (i < upto)){
        c.el.classList.toggle('on', i < upto); c.onState = (i < upto);
      }
    }
  }
  hairI.style.transform = 'scaleX(' + clampNum((S.t - LN.base) / (LN.dur + 0.001), 0, 1).toFixed(3) + ')';
}

function paintGhosts(){
  var i, txt;
  for(i = 0; i < 4; i++){ G[i].textContent = ''; }
  if(!S.lines.length) return;
  var prev = LN.idx - 1, next = LN.idx + 1;
  txt = txtOf(S.lines[prev]);    if(txt) G[1].textContent = txt;
  txt = txtOf(S.lines[prev - 1]); if(txt) G[0].textContent = txt;
  txt = txtOf(S.lines[next]);    if(txt) G[2].textContent = txt;
  txt = txtOf(S.lines[next + 1]); if(txt) G[3].textContent = txt;
}

function rebuild(){
  var n = S.lines.length;
  LN.idx = -2;                     // force a rebuild even if the index matches
  if(!n){
    emptyEl.style.display = 'block';
    L.textContent = ''; L.classList.remove('live');
    hairEl.style.opacity = '0';
    for(var i = 0; i < 4; i++) G[i].textContent = '';
    LN.chars = [];
    S.idx = -1; S.text = '';
    return;
  }
  emptyEl.style.display = 'none';
}

function sync(force){
  var n = S.lines.length;
  if(!n){ S.idx = -1; S.text = ''; return; }
  // active index: last line whose start <= t (binary search, no scan)
  var lo = 0, hi = n - 1, k = -1;
  while(lo <= hi){
    var mid = (lo + hi) >> 1;
    var mt = (typeof S.lines[mid].t === 'number' && isFinite(S.lines[mid].t)) ? S.lines[mid].t : 0;
    if(mt <= S.t + 0.002){ k = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  S.idx = k;
  S.text = k >= 0 ? txtOf(S.lines[k]) : '';
  if(k !== LN.idx || force){
    LN.idx = k;
    if(k < 0){
      L.classList.remove('live');
      L.textContent = '';
      LN.chars = [];
      hairEl.style.opacity = '0';
      hairI.style.transform = 'scaleX(0)';
    } else {
      buildLine();
      L.classList.remove('live');
      void L.offsetWidth;          // restart the entrance transition
      L.classList.add('live');
    }
    paintGhosts();
  }
  if(k >= 0) applyProgress();
}
void stageReady;

function onMsg(ev){
  var d = ev.data;
  if(!d || d.__c100 !== 1) return;
  try{
    if(d.type === 'init'){
      var p = d.payload || {};
      var lines = Array.isArray(p.lines) ? p.lines : [];
      S.lines = lines;
      S.dur = (typeof p.duration === 'number' && p.duration > 0) ? p.duration : 0;
      var nm = (p.song && p.song.name) ? String(p.song.name) : '';
      var ar = (p.song && p.song.artists) ? p.song.artists : '';
      if(Array.isArray(ar)) ar = ar.join(' / ');
      ar = ar ? String(ar) : '';
      nm = nm || '';
      ovnEl.textContent = nm || 'Untitled';
      ovaEl.textContent = ar || '';
      rebuild();
      sync(true);
      stageEl.classList.add('on');
    } else if(d.type === 'tick'){
      var q = d.payload || {};
      if(typeof q.time === 'number' && isFinite(q.time)) S.t = Math.max(0, q.time);
      if(typeof q.playing === 'boolean') S.playing = q.playing;
      sync(false);
    } else if(d.type === 'beat'){
      var b = d.payload || {};
      var bl = (typeof b.level === 'number' && isFinite(b.level)) ? b.level : 0.4;
      bl = clampNum(bl, 0, 1);
      F.pulse = Math.min(1, F.pulse + 0.25 + bl * 0.65);
    } else if(d.type === 'live'){
      var l = d.payload || {};
      var pb = l.playing;
      if(typeof pb === 'boolean') S.playing = pb;
      var lv = F.live;
      lv.level = num01(l.level, lv.level);
      lv.bass = num01(l.bass, lv.bass);
      lv.mid = num01(l.mid, lv.mid);
      lv.treble = num01(l.treble, lv.treble);
      lv.bpm = (typeof l.bpm === 'number' && isFinite(l.bpm)) ? l.bpm : lv.bpm;
    }
  }catch(e){ console.error('[490] msg', e); }
}
function num01(v, dflt){
  return (typeof v === 'number' && isFinite(v)) ? clampNum(v, 0, 1) : dflt;
}
window.addEventListener('message', onMsg);

// --- ready: first rAF is unconditional, plus timer fallback, once only ---
var readySent = false;
function ready(){
  if(readySent) return;
  readySent = true;
  try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }catch(e){ console.error('[490] ready', e); }
  // reveal the type plate even if init never arrives (never leave a bare frame)
  setTimeout(function(){
    try{ stageEl.classList.add('on'); }catch(e){ console.error('[490] reveal', e); }
  }, 700);
}
function frame(ts){
  requestAnimationFrame(frame);
  var t0 = (window.performance && performance.now) ? performance.now() : 0;
  try{
    S.frames++;
    if(!readySent) ready();
    update(ts);
  }catch(e){ S.err = ''; console.error('[490] frame', e); }
  var t1 = (window.performance && performance.now) ? performance.now() : 0;
  S.js = t1 - t0;
}
function update(ts){
  var dt = lastTs ? Math.min(64, ts - lastTs) : 16.7;
  lastTs = ts;
  F.tick++;
  var k = Math.min(0.4, dt / 1000 * 3.4);
  var lv = F.live;

  // glints: bars decay, a few are re-seeded by the music's energy
  if(spec){
    var i;
    for(i = 0; i < specW; i++){
      var v = spec[i] - k * 0.62;
      spec[i] = v > 0 ? v : 0;
    }
    var energy = 0.08 + lv.level * 0.55 + lv.bass * 0.42 + F.pulse * 0.55;
    var seeds = 2 + Math.round(energy * 9);
    for(var s2 = 0; s2 < seeds; s2++){
      var bi = (Math.random() * specW) | 0;
      spec[bi] = Math.min(1, spec[bi] + energy * (0.3 + Math.random() * 0.7));
    }
  }

  F.pulse *= (1 - Math.min(0.5, dt / 1000 * 6));
  F.sweep += dt / 1000 * (S.rm ? 0.005 : 0.019);
  F.haze += dt / 1000 * (S.rm ? 0.004 : 0.016);

  paint();

  // the type block drifts a hair with the room tone (compositor only)
  if((F.tick & 3) === 0){
    var dx = Math.sin(F.tick * 0.0052) * (1.6 + lv.bass * 3.4);
    var dy = Math.cos(F.tick * 0.0037) * (1.1 + lv.level * 2.2);
    blkEl.style.transform = S.rm ? 'none' : 'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0)';
    // parallax: the plate itself creeps a few px, so the print feels photographed
    var px = Math.sin(F.tick * 0.0021) * (S.rm ? 0 : 7);
    var py2 = Math.cos(F.tick * 0.0016) * (S.rm ? 0 : 5);
    cvs.style.transform = 'translate3d(' + px.toFixed(2) + 'px,' + py2.toFixed(2) + 'px,0) scale(1.03)';
    dcvs.style.transform = cvs.style.transform;
  }

  // text readouts: 6 Hz is plenty, and avoids layout churn at 165 Hz
  if((F.tick % 5) === 0){
    var sTxt = fmt(S.t) + (S.dur > 0 ? '  /  ' + fmt(S.dur) : '');
    if(rtEl.textContent !== sTxt) rtEl.textContent = sTxt;
    var mTxt = S.playing ? 'ECM · SILENCE' : 'PAUSED';
    if(mkT.textContent !== mTxt) mkT.textContent = mTxt;
  }
}
function fmt(s){
  s = s > 0 ? s : 0;
  var m = Math.floor(s / 60), r = Math.floor(s % 60);
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
}
requestAnimationFrame(frame);
setTimeout(ready, 900);
})();
</script>
</body>
