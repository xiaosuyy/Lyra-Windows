<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雷在砖里</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#120a08;
    -webkit-font-smoothing:antialiased;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #lyr{position:absolute;inset:0;pointer-events:none;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    padding:0 3vw 9vh;gap:.34em}
  .row{width:min(94vw,1180px);text-align:center;line-height:1.16;word-break:break-word;
    color:rgba(255,238,220,.88);text-shadow:0 2px 0 rgba(10,4,8,.7);
    transition:opacity .5s ease,filter .5s ease}
  .row.prev,.row.next{opacity:.30;filter:blur(.35px);font-size:.52em;font-weight:700;
    color:rgba(255,226,200,.95)}
  .row.cur{opacity:1;font-size:calc(1em * var(--fit,1));font-weight:900;letter-spacing:.015em;max-width:min(94vw,1180px)}
  .row.cur span{display:inline-block;white-space:pre;
    color:rgba(255,242,228,.30);
    text-shadow:0 3px 0 rgba(20,8,12,.62),0 0 1px rgba(0,0,0,.6);
    transition:color .16s ease,transform .2s cubic-bezier(.2,1.6,.4,1),text-shadow .16s ease;
    transform:translateY(.06em) scale(.985)}
  .row.cur span.on{color:#FFF8EC;
    text-shadow:0 3px 0 #3d0c17,0 0 14px rgba(255,96,48,.62),0 0 34px rgba(255,170,50,.34),0 0 2px #fff;
    transform:translateY(0) scale(1)}
  .row.cur span.on::after{content:none}
  .tint{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 78%,rgba(8,4,10,.62) 0%,rgba(8,4,10,.30) 46%,rgba(8,4,10,0) 74%)}
  #tag{position:absolute;left:clamp(14px,3.2vw,52px);top:clamp(14px,3.6vh,44px);
    display:flex;flex-direction:column;gap:.35em;pointer-events:none;
    transform:rotate(-1.4deg);opacity:.9}
  #tag b{font:900 clamp(11px,1.5vw,17px)/1 ui-monospace,Menlo,monospace;letter-spacing:.24em;
    color:#120a10;background:#FFD62C;padding:.5em .6em .42em;
    box-shadow:0 3px 0 #7a1020;display:inline-block;align-self:flex-start}
  #tag i{font:700 clamp(10px,1.15vw,13px)/1.5 ui-monospace,Menlo,monospace;font-style:normal;
    letter-spacing:.2em;color:rgba(255,232,210,.62);
    text-shadow:0 2px 0 rgba(0,0,0,.6);max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #vhs{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,0) 1px 4px)}
  #empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:.8em;
    color:#FFE7C8;font:800 clamp(15px,2vw,24px)/1.4 "PingFang SC",system-ui,sans-serif;
    letter-spacing:.34em;text-shadow:0 3px 0 #3c0f18,0 0 24px rgba(255,120,40,.5)}
  #empty small{font:400 clamp(10px,1.1vw,13px)/1.6 ui-monospace,monospace;letter-spacing:.28em;opacity:.5}
  @media (prefers-reduced-motion: reduce){
    .row{transition:none}
    .row.cur span{transition:color .12s linear;transform:none}
    .row.cur span.on{transform:none}
    #vhs{opacity:.28}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="tint"></div>
<div id="lyr"></div>
<div id="tag"><b>BAILE FUNK</b><i id="tagmeta">PAREDÃO DE SOM</i></div>
<div id="empty">无 歌 词<small>APENAS O SOM</small></div>
<div id="vhs"></div>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var lyrEl = document.getElementById('lyr'), emptyEl = document.getElementById('empty');
  var tagMeta = document.getElementById('tagmeta');

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', gl: false, rm: false, accent: [255,80,40], dur: 0, ready: false
  };
  var W = 1440, H = 900, DPR = 1;

  window.__stage = function(){
    var l = S.lines[S.idx];
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err,
      text: l && typeof l.text === 'string' ? l.text : '',
      gl: !!S.gl, rm: !!S.rm
    };
  };

  function safe(fn, tag){
    try { return fn(); } catch(e){ S.err = String(e && e.message || e); console.error('[' + tag + ']', e); return null; }
  }

  // ================= 工具 =================
  var PAL = [[255,58,132],[255,122,26],[255,214,44],[46,226,188],[86,190,255],[172,96,255]];
  function rgb(a, al){ return 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + (al == null ? 1 : al) + ')'; }
  function hsh(a, b, c){ var x = Math.sin(a * 127.1 + b * 311.7 + (c || 0) * 74.7) * 43758.5453; return x - Math.floor(x); }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function mixc(a, b, t){
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    return [(lerp(a[0], b[0], t)) | 0, (lerp(a[1], b[1], t)) | 0, (lerp(a[2], b[2], t)) | 0];
  }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function roundRect(c, x, y, w, h, r){
    var rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.lineTo(x + w - rr, y); c.quadraticCurveTo(x + w, y, x + w, y + rr);
    c.lineTo(x + w, y + h - rr); c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    c.lineTo(x + rr, y + h); c.quadraticCurveTo(x, y + h, x, y + h - rr);
    c.lineTo(x, y + rr); c.quadraticCurveTo(x, y, x + rr, y);
    c.closePath();
  }

  // ================= 全局动画状态 =================
  var anim = { vt: 0, kick: 0, bass: 0.35, mid: 0.3, treble: 0.2, beat: 0, flash: 0, pulseT: 0, lastCyc: -1 };
  var dolly = 1, panX = 0, panY = 0;

  // ================= 离屏墙 =================
  var WALL = document.createElement('canvas');
  var wctx = WALL.getContext('2d');
  var pScale = 1, PCW = 1, PCH = 1, padX = 0, padY = 0;
  var L = null, buildQ = [], buildIdx = 0, built = false;
  var glowCache = {}, noisePat = null;
  var LYF = 48;

  function glowSprite(col){
    var key = col.join(',');
    if (glowCache[key]) return glowCache[key];
    var s = document.createElement('canvas'); s.width = s.height = 128;
    var g2 = s.getContext('2d');
    var rg = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(' + key + ',0.95)');
    rg.addColorStop(0.42, 'rgba(' + key + ',0.34)');
    rg.addColorStop(1, 'rgba(' + key + ',0)');
    g2.fillStyle = rg; g2.fillRect(0, 0, 128, 128);
    glowCache[key] = s; return s;
  }

  // ================= 墙面结构 =================
  function makeLayout(){
    var rh = clamp(Math.min(W, H) * (W < H ? 0.030 : 0.048), 13, 52);
    var bw = rh * 2.2;
    var lay = { rh: rh, bw: bw, blocks: [], spk: [], bulbs: [] };
    var cols = clamp(Math.round(PCW / (bw * 2.0)), 4, 60);
    var rows = clamp(Math.round(PCH / (rh * 2.6)), 4, 60);
    var cw = PCW / cols, chh = PCH / rows;

    for (var gy = 0; gy < rows; gy++){
      for (var gx = 0; gx < cols; gx++){
        var r1 = hsh(gx + 3, gy + 11, 1);
        if (r1 < 0.13) continue;
        var wmul = (r1 > 0.80 && gx < cols - 1) ? 2 : 1;
        var hmul = (r1 > 0.91 && gy < rows - 1) ? 2 : 1;
        var bx = gx * cw + 2 + (hsh(gx, gy, 2) - 0.5) * cw * 0.10;
        var by = gy * chh + 2 + (hsh(gx, gy, 3) - 0.5) * chh * 0.10;
        var base = PAL[(hsh(gx, gy, 4) * PAL.length) | 0];
        if (hsh(gx, gy, 14) > 0.72) base = mixc(base, S.accent, 0.3);
        lay.blocks.push({
          x: bx, y: by, w: cw * wmul - 4, h: chh * hmul - 4,
          c: mixc(base, [14, 10, 19], 0.38 + hsh(gx, gy, 5) * 0.32),
          edge: mixc(base, [255, 255, 255], 0.35),
          win: hsh(gx, gy, 7), wn: 1 + ((hsh(gx, gy, 8) * 2) | 0), gy: gy
        });
      }
    }
    lay.blocks.sort(function(a, b){ return a.y - b.y; });

    // —— 音箱：从地面往上垒成 5 组塔，像真正的 paredão ——
    var sz = clamp(Math.min(W, H) * 0.135, 40, 120);
    var ground = H * 0.965;
    var towers = clamp(Math.round(PCW / (sz * 1.55)), 3, 9);
    for (var tw = 0; tw < towers; tw++){
      var tx = PCW * ((tw + 0.5) / towers) + (hsh(tw, 1, 9) - 0.5) * sz * 1.1 - padX;
      var tiersN = 3 + ((hsh(tw, 2, 10) * 4) | 0);
      var ty = ground - sz * 0.9;
      for (var tr = 0; tr < tiersN; tr++){
        var w2 = sz * (0.90 + hsh(tw, tr, 11) * 0.26);
        var h2 = w2 * (0.74 + hsh(tw, tr, 12) * 0.20);
        lay.spk.push({
          x: tx - w2 * 0.5 + (hsh(tw, tr, 13) - 0.5) * sz * 0.12,
          y: ty - h2,
          w: w2, h: h2, r: w2 * 0.33,
          ph: hsh(tw, tr, 14) * 6.283,
          hue: hsh(tw, tr, 15)
        });
        ty -= h2 + sz * 0.035;
        // 顶部偶尔再挂一个横躺的大箱
        if (tr === tiersN - 1 && hsh(tw, tr, 16) > 0.55){
          lay.spk.push({
            x: tx - w2 * 0.62, y: ty - h2 * 0.8, w: w2 * 1.24, h: h2 * 0.8,
            r: w2 * 0.30, ph: hsh(tw, tr, 17) * 6.283, hue: hsh(tw, tr, 18)
          });
        }
      }
    }
    // 缝隙里再补几台小箱
    for (var gx2 = 0; gx2 < 14; gx2++){
      if (hsh(gx2, 3, 19) < 0.45) continue;
      var w3 = sz * (0.5 + hsh(gx2, 4, 20) * 0.35);
      lay.spk.push({
        x: hsh(gx2, 5, 21) * (PCW - w3) - padX,
        y: PCH * (0.30 + hsh(gx2, 6, 22) * 0.34),
        w: w3, h: w3 * 0.76, r: w3 * 0.33,
        ph: hsh(gx2, 7, 23) * 6.283, hue: hsh(gx2, 8, 24)
      });
    }
    if (lay.spk.length > 120) lay.spk.length = 120;
    lay.spk.sort(function(a, b){ return a.y - b.y; });
    // 灯串
    for (var b = 0; b < 34; b++){
      lay.bulbs.push({ u: b / 33, hue: hsh(b, 3, 17) });
    }
    return lay;
  }

  // ---------- 砖 ----------
  function drawBricks(c, r0, r1){
    var rh = L.rh, bw = L.bw;
    var cols = clamp(Math.ceil(PCW / (bw * 2)) + 1, 1, 170);
    for (var r = r0; r < r1; r++){
      var y = -padY + r * rh;
      var off = (r % 2) * bw * 0.5;
      for (var k = 0; k < cols; k++){
        var x = -padX + k * bw * 2 + off - bw;
        var hv = hsh(k, r, 21);
        var cb = mixc(PAL[(hv * PAL.length) | 0], [10, 7, 13], 0.70 + hv * 0.14);
        c.fillStyle = rgb(cb, 0.96);
        c.fillRect(x + 1, y + 1, bw * 2 - 2, rh - 2);
        c.fillStyle = 'rgba(255,255,255,' + (0.012 + hv * 0.022).toFixed(3) + ')';
        c.fillRect(x + 1, y + 1, bw * 2 - 2, 1.4);
        c.fillStyle = 'rgba(0,0,0,.42)';
        c.fillRect(x + 1, y + rh - 3, bw * 2 - 2, 2);
      }
    }
  }

  // ---------- 砖房块 ----------
  function drawBlocks(c, a, b){
    for (var i = a; i < b; i++){
      var d = L.blocks[i];
      if (d.y < -padY - 200 || d.y > PCH + 100) continue;
      c.fillStyle = 'rgba(0,0,0,.55)';
      c.fillRect(d.x + 5, d.y + 7, d.w, d.h);
      c.fillStyle = rgb(d.c);
      c.fillRect(d.x, d.y, d.w, d.h);
      // 顶面高光 + 右侧暗面（体积）
      c.fillStyle = 'rgba(255,255,255,.10)';
      c.fillRect(d.x, d.y, d.w, Math.max(1, d.h * 0.045));
      c.fillStyle = 'rgba(0,0,0,.28)';
      c.fillRect(d.x + d.w - Math.max(2, d.w * 0.045), d.y, Math.max(2, d.w * 0.045), d.h);
      c.fillStyle = 'rgba(0,0,0,.22)';
      c.fillRect(d.x, d.y + d.h - Math.max(2, d.h * 0.05), d.w, Math.max(2, d.h * 0.05));
      c.strokeStyle = 'rgba(8,5,10,.55)'; c.lineWidth = 1;
      c.strokeRect(d.x + 0.5, d.y + 0.5, d.w - 1, d.h - 1);

      var ws = Math.max(5, Math.min(d.w, d.h) * 0.26);
      var lit = d.win > 0.42;
      for (var k = 0; k < d.wn; k++){
        var wx = d.x + d.w * (0.28 + k * 0.34) - ws * 0.5;
        var wy = d.y + d.h * (0.30 + (k % 2) * 0.30);
        if (wx + ws > d.x + d.w - 2) continue;
        if (lit){
          var wc = d.win > 0.82 ? [255, 196, 96] : (d.win > 0.62 ? [120, 235, 255] : [255, 120, 170]);
          c.fillStyle = rgb(wc, 0.16);
          c.fillRect(wx - ws * 0.7, wy - ws * 0.7, ws * 2.4, ws * 2.4);
          c.fillStyle = rgb(wc, 0.9);
          c.fillRect(wx, wy, ws, ws * 1.25);
          c.fillStyle = 'rgba(20,10,8,.45)';
          c.fillRect(wx, wy + ws * 0.58, ws * 1.2, 1.5);
          c.fillRect(wx + ws * 0.48, wy, 1.5, ws * 1.25);
        } else {
          c.fillStyle = 'rgba(10,7,14,.85)';
          c.fillRect(wx, wy, ws, ws * 1.25);
          c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
          c.strokeRect(wx + 0.5, wy + 0.5, ws - 1, ws * 1.25 - 1);
        }
      }
      // 空调机 / 水管
      if (d.win < 0.22 && d.w > 40){
        c.fillStyle = 'rgba(180,190,200,.18)';
        c.fillRect(d.x + d.w * 0.62, d.y + d.h * 0.72, d.w * 0.24, d.h * 0.13);
      }
    }
  }

  // ---------- 涂鸦 ----------
  function drawGraffiti(c){
    c.save();
    for (var i = 0; i < 4; i++){
      var col = PAL[(hsh(i, 5, 41) * PAL.length) | 0];
      var cx0 = hsh(i, 1, 42) * PCW - padX;
      var cy0 = hsh(i, 2, 43) * PCH - padY;
      var rr = 40 + hsh(i, 3, 44) * W * 0.20;
      c.strokeStyle = rgb(col, 0.17);
      c.lineWidth = rr * (0.30 + hsh(i, 4, 45) * 0.40);
      c.shadowColor = rgb(col, 0.35); c.shadowBlur = 18;
      c.beginPath();
      c.arc(cx0, cy0, rr, hsh(i, 6, 46) * 6.28, hsh(i, 6, 46) * 6.28 + 2.2);
      c.stroke();
    }
    c.shadowBlur = 0;
    // 喷点
    for (var d0 = 0; d0 < 420; d0++){
      var px0 = hsh(d0, 7, 51) * PCW - padX;
      var py0 = hsh(d0, 8, 52) * PCH - padY;
      var pc = PAL[(hsh(d0, 9, 53) * PAL.length) | 0];
      c.fillStyle = rgb(pc, 0.10 + hsh(d0, 10, 54) * 0.22);
      var ps = 1 + hsh(d0, 11, 55) * 2.6;
      c.fillRect(px0, py0, ps, ps);
    }
    // 大字 tag
    var tags = ['BAILE', 'FUNK', 'PAVÃO', 'RJ', 'SOM'];
    for (var t0 = 0; t0 < tags.length; t0++){
      var col2 = PAL[(t0 * 2 + 1) % PAL.length];
      var fs = W * (0.10 + hsh(t0, 12, 56) * 0.09);
      c.save();
      c.translate(hsh(t0, 13, 57) * PCW - padX, (0.1 + hsh(t0, 14, 58) * 0.85) * PCH - padY);
      c.rotate((hsh(t0, 15, 59) - 0.5) * 0.18);
      c.font = '900 ' + fs.toFixed(0) + 'px "Arial Black", Impact, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = fs * 0.05;
      c.strokeStyle = rgb(col2, 0.34);
      c.shadowColor = rgb(col2, 0.35); c.shadowBlur = 14;
      c.strokeText(tags[t0], 0, 0);
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,240,220,.035)';
      c.fillText(tags[t0], 0, 0);
      c.restore();
    }
    c.restore();
  }

  // ---------- 音箱矩阵 ----------
  function drawSpeakers(c, a, b){
    for (var i = a; i < b; i++){
      var s = L.spk[i];
      var col = mixc(PAL[(s.hue * PAL.length) | 0], S.accent, 0.42);
      c.fillStyle = 'rgba(0,0,0,.62)';
      roundRect(c, s.x + s.w * 0.07, s.y + s.h * 0.10, s.w, s.h, s.w * 0.06); c.fill();
      var g = c.createLinearGradient(s.x, s.y, s.x + s.w * 0.3, s.y + s.h);
      g.addColorStop(0, '#2a2032'); g.addColorStop(0.5, '#191220'); g.addColorStop(1, '#0c0911');
      c.fillStyle = g;
      roundRect(c, s.x, s.y, s.w, s.h, s.w * 0.05); c.fill();
      // 木纹竖条
      c.save();
      roundRect(c, s.x, s.y, s.w, s.h, s.w * 0.05); c.clip();
      for (var v = 0; v < 4; v++){
        c.fillStyle = 'rgba(255,255,255,' + (0.012 + v * 0.006).toFixed(3) + ')';
        c.fillRect(s.x + s.w * (0.15 + v * 0.22), s.y, 1, s.h);
      }
      c.restore();
      // 霓虹描边
      c.shadowColor = rgb(col, 0.9); c.shadowBlur = 16;
      c.strokeStyle = rgb(col, 0.72); c.lineWidth = Math.max(1.2, s.w * 0.018);
      roundRect(c, s.x, s.y, s.w, s.h, s.w * 0.05); c.stroke();
      c.shadowBlur = 0;
      // 喇叭
      var cx0 = s.x + s.w * 0.5, cy0 = s.y + s.h * 0.5, R = s.r;
      c.beginPath(); c.arc(cx0, cy0, R, 0, 6.2832);
      c.fillStyle = '#08060c'; c.fill();
      var g2 = c.createRadialGradient(cx0 - R * 0.25, cy0 - R * 0.28, R * 0.08, cx0, cy0, R * 0.95);
      g2.addColorStop(0, '#3d2f44'); g2.addColorStop(0.55, '#1b1422'); g2.addColorStop(1, '#0a0710');
      c.beginPath(); c.arc(cx0, cy0, R * 0.92, 0, 6.2832);
      c.fillStyle = g2; c.fill();
      c.beginPath(); c.arc(cx0 - R * 0.24, cy0 - R * 0.26, R * 0.34, Math.PI * 1.02, Math.PI * 1.78);
      c.strokeStyle = 'rgba(255,255,255,.17)'; c.lineWidth = R * 0.13; c.stroke();
      c.beginPath(); c.arc(cx0, cy0, R * 0.29, 0, 6.2832);
      c.fillStyle = rgb(mixc(col, [22, 15, 26], 0.42)); c.fill();
      c.beginPath(); c.arc(cx0, cy0, R * 0.10, 0, 6.2832);
      c.fillStyle = 'rgba(0,0,0,.55)'; c.fill();
      // 螺丝
      c.fillStyle = 'rgba(255,255,255,.22)';
      c.fillRect(s.x + s.w * 0.08, s.y + s.h * 0.09, 2, 2);
      c.fillRect(s.x + s.w * 0.90, s.y + s.h * 0.09, 2, 2);
    }
  }

  // ---------- 电缆 / 灯串 ----------
  function drawCables(c){
    var n = L.bulbs.length;
    for (var w0 = 0; w0 < 3; w0++){
      var y0 = -padY + PCH * (0.03 + w0 * 0.055);
      var sag = 26 + w0 * 18;
      c.strokeStyle = 'rgba(6,4,8,.85)'; c.lineWidth = 2;
      c.beginPath();
      c.moveTo(-padX, y0);
      c.quadraticCurveTo(PCW * 0.5 - padX, y0 + sag * 2, PCW - padX, y0);
      c.stroke();
      for (var b = 0; b < n; b += 2){
        var u = L.bulbs[b].u;
        var bx = -padX + u * PCW;
        var by = y0 + sag * 2 * 4 * u * (1 - u) * 0.5;
        var col = PAL[(L.bulbs[b].hue * PAL.length) | 0];
        c.shadowColor = rgb(col, 0.95); c.shadowBlur = 14;
        c.fillStyle = rgb(mixc(col, [255, 255, 255], 0.35), 0.95);
        c.beginPath(); c.arc(bx, by + 4, 3.4, 0, 6.2832); c.fill();
        c.shadowBlur = 0;
        c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(bx, by); c.lineTo(bx, by + 2); c.stroke();
      }
    }
  }

  // ---------- 前景：热舞剪影 + 摩托 ----------
  function drawCrowd(c){
    // 地面基线：略高于画面底部，让剪影真正露出
    var ground = H * 0.965;
    // 摩托车（左）
    c.save();
    c.translate(-padX + PCW * 0.115, ground - 2);
    var sc = clamp(W * 0.072, 44, 112) / 100;
    c.scale(sc, sc);
    c.fillStyle = 'rgba(4,2,6,.96)';
    c.beginPath(); c.arc(-42, 8, 15, 0, 6.2832); c.fill();
    c.beginPath(); c.arc(42, 8, 15, 0, 6.2832); c.fill();
    c.fillStyle = 'rgba(7,4,9,.92)';
    roundRect(c, -28, -18, 62, 20, 8); c.fill();
    c.beginPath(); c.moveTo(-6, -18); c.lineTo(22, -40); c.lineTo(34, -38);
    c.lineTo(12, -16); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(7,4,9,.9)'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(24, -38); c.lineTo(40, -38); c.stroke();
    // 车灯霓虹
    c.shadowColor = 'rgba(255,214,60,.95)'; c.shadowBlur = 26;
    c.fillStyle = 'rgba(255,236,150,.95)';
    c.beginPath(); c.arc(-46, -12, 7, 0, 6.2832); c.fill();
    c.shadowBlur = 0;
    // 骑手剪影
    c.fillStyle = 'rgba(6,3,8,.9)';
    c.beginPath(); c.arc(-2, -56, 10, 0, 6.2832); c.fill();
    c.beginPath(); c.moveTo(-10, -46); c.lineTo(12, -46); c.lineTo(16, -20);
    c.lineTo(-14, -20); c.closePath(); c.fill();
    c.restore();

    // 跳舞人群（底部一排）
    var n = clamp(Math.round(W / 130), 5, 12);
    for (var i = 0; i < n; i++){
      var bx = -padX + PCW * (0.08 + (i + 0.5) / n * 0.88) + (hsh(i, 4, 61) - 0.5) * 20;
      var by = ground;
      var hh = clamp(H * (0.10 + hsh(i, 6, 63) * 0.075), 46, 190);
      var up = hsh(i, 7, 64);
      c.save();
      c.translate(bx, by);
      c.fillStyle = 'rgba(3,2,5,' + (0.80 + hsh(i, 8, 65) * 0.18).toFixed(2) + ')';
      // 头
      c.beginPath(); c.arc(0, -hh * 0.86, hh * 0.115, 0, 6.2832); c.fill();
      // 躯干
      c.beginPath();
      c.moveTo(-hh * 0.13, -hh * 0.74);
      c.lineTo(hh * 0.13, -hh * 0.74);
      c.lineTo(hh * 0.10, -hh * 0.30);
      c.lineTo(-hh * 0.10, -hh * 0.30);
      c.closePath(); c.fill();
      // 腿
      c.beginPath(); c.moveTo(-hh * 0.09, -hh * 0.32); c.lineTo(-hh * 0.20, 0);
      c.lineTo(-hh * 0.04, 0); c.lineTo(hh * 0.02, -hh * 0.30); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(hh * 0.09, -hh * 0.32); c.lineTo(hh * 0.22, 0);
      c.lineTo(hh * 0.06, 0); c.lineTo(-hh * 0.02, -hh * 0.30); c.closePath(); c.fill();
      // 手臂举起
      c.lineWidth = hh * 0.085; c.strokeStyle = 'rgba(3,2,5,.92)'; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-hh * 0.11, -hh * 0.70);
      c.lineTo(-hh * 0.26, -hh * (0.88 + up * 0.20));
      c.stroke();
      c.beginPath();
      c.moveTo(hh * 0.11, -hh * 0.70);
      c.lineTo(hh * (0.20 + up * 0.14), -hh * (1.00 + (1 - up) * 0.18));
      c.stroke();
      c.restore();
    }

    // 地面反光（湿沥青）
    var gg = c.createLinearGradient(0, ground - 40, 0, PCH);
    gg.addColorStop(0, 'rgba(255,90,120,0.04)');
    gg.addColorStop(0.5, 'rgba(255,150,60,0.08)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gg; c.fillRect(-padX, ground - 40, PCW, PCH - ground + 40);
  }

  // ---------- 拼贴：太阳镜大头 + 纸片 + 胶带 ----------
  function drawCollage(c){
    // A. 半调网点太阳镜头像（右上方，斜贴）
    var hw = clamp(W * 0.155, 96, 235);
    var hx = -padX + PCW * 0.715, hy = PCH * 0.255;
    c.save();
    c.translate(hx, hy);
    c.rotate(-0.075);
    // 撕边纸底 + 投影
    c.shadowColor = 'rgba(0,0,0,.65)'; c.shadowBlur = 26; c.shadowOffsetY = 10;
    c.fillStyle = 'rgba(255,228,186,.94)';
    c.beginPath();
    for (var i = 0; i <= 18; i++){
      var a0 = i / 18 * 6.2832;
      var rr0 = hw * (0.87 + hsh(i, 9, 81) * 0.11);
      var px = Math.cos(a0) * rr0, py = Math.sin(a0) * rr0 * 0.95;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill();
    c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.fillStyle = 'rgba(226,180,132,.55)';
    c.fillRect(-hw * 0.84, hw * 0.70, hw * 1.68, hw * 0.15);
    // 头像：半调网点填充
    c.save();
    c.beginPath(); c.arc(0, 0, hw * 0.72, 0, 6.2832); c.clip();
    c.fillStyle = '#1a1020';
    c.fillRect(-hw, -hw, hw * 2, hw * 2);
    var dot = Math.max(4, hw * 0.045);
    for (var dy = -hw; dy < hw; dy += dot){
      for (var dx = -hw; dx < hw; dx += dot){
        var dd = Math.sqrt(dx * dx + dy * dy) / (hw * 0.74);
        if (dd > 1.05) continue;
        var fade = 1 - dd * 0.85;
        var cr = dot * 0.52 * fade;
        if (cr < 0.5) continue;
        var hue2 = 0.55 + dy / hw * 0.30;
        var col2 = PAL[(hue2 * PAL.length) | 0];
        c.fillStyle = 'rgba(' + col2[0] + ',' + col2[1] + ',' + col2[2] + ',' + (0.24 + fade * 0.62).toFixed(3) + ')';
        c.beginPath(); c.arc(dx, dy, cr, 0, 6.2832); c.fill();
      }
    }
    c.restore();
    // 头发块
    c.fillStyle = 'rgba(14,8,18,.94)';
    c.beginPath(); c.ellipse(0, -hw * 0.30, hw * 0.60, hw * 0.34, 0, Math.PI, 0); c.fill();
    // 太阳镜
    c.fillStyle = 'rgba(10,6,14,.96)';
    c.save();
    c.translate(0, -hw * 0.03);
    roundRect(c, -hw * 0.50, -hw * 0.14, hw * 0.40, hw * 0.24, hw * 0.06); c.fill();
    roundRect(c, hw * 0.10, -hw * 0.14, hw * 0.40, hw * 0.24, hw * 0.06); c.fill();
    c.fillRect(-hw * 0.11, -hw * 0.06, hw * 0.22, hw * 0.04);
    var lensG = c.createLinearGradient(-hw * 0.5, -hw * 0.14, hw * 0.5, hw * 0.12);
    lensG.addColorStop(0, 'rgba(255,214,44,.85)');
    lensG.addColorStop(0.5, 'rgba(255,58,132,.72)');
    lensG.addColorStop(1, 'rgba(46,226,188,.80)');
    c.fillStyle = lensG;
    roundRect(c, -hw * 0.47, -hw * 0.11, hw * 0.34, hw * 0.17, hw * 0.04); c.fill();
    roundRect(c, hw * 0.13, -hw * 0.11, hw * 0.34, hw * 0.17, hw * 0.04); c.fill();
    c.restore();
    // 嘴 + 金牙亮
    c.strokeStyle = 'rgba(255,240,220,.72)'; c.lineWidth = hw * 0.035; c.lineCap = 'round';
    c.beginPath(); c.arc(0, hw * 0.26, hw * 0.16, 0.25, Math.PI - 0.25); c.stroke();
    c.fillStyle = 'rgba(255,214,44,.95)';
    c.fillRect(-hw * 0.03, hw * 0.30, hw * 0.06, hw * 0.045);
    c.restore();

    // B. 黄色纸片（左中，斜贴）
    c.save();
    c.translate(-padX + PCW * 0.145, PCH * 0.42);
    c.rotate(0.10);
    var pw = clamp(W * 0.115, 62, 190);
    c.fillStyle = 'rgba(255,214,44,.94)';
    c.fillRect(-pw * 0.55, -pw * 0.30, pw * 1.10, pw * 0.60);
    c.fillStyle = 'rgba(122,16,32,.96)';
    c.font = '900 ' + (pw * 0.30).toFixed(0) + 'px "Arial Black",Impact,sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('VOLUME', 0, -pw * 0.055);
    c.font = '900 ' + (pw * 0.44).toFixed(0) + 'px "Arial Black",Impact,sans-serif';
    c.fillStyle = 'rgba(20,12,18,.95)';
    c.fillText('MÁXIMO', 0, pw * 0.15);
    c.restore();

    // C. 斜胶带
    var tape = function(x, y, w, rot, col){
      c.save(); c.translate(x, y); c.rotate(rot);
      c.fillStyle = col;
      c.fillRect(-w / 2, -w * 0.075, w, w * 0.15);
      c.fillStyle = 'rgba(255,255,255,.12)';
      c.fillRect(-w / 2, -w * 0.075, w, w * 0.035);
      c.restore();
    };
    tape(-padX + PCW * 0.715, PCH * 0.255 - clamp(W * 0.155, 96, 235) * 0.72, clamp(W * 0.085, 54, 122), -0.12, 'rgba(255,242,214,.62)');
    tape(-padX + PCW * 0.855, PCH * 0.60, clamp(W * 0.062, 40, 92), 0.55, 'rgba(255,120,170,.45)');
    tape(-padX + PCW * 0.05, PCH * 0.20, clamp(W * 0.058, 38, 84), -0.5, 'rgba(120,225,255,.36)');

    // D. 价格贴 / 小贴纸
    for (var s0 = 0; s0 < 5; s0++){
      var sx = -padX + PCW * (0.2 + hsh(s0, 21, 82) * 0.7);
      var sy = PCH * (0.55 + hsh(s0, 22, 83) * 0.32);
      var sr = clamp(W * (0.012 + hsh(s0, 23, 84) * 0.012), 7, 24);
      var col3 = PAL[(hsh(s0, 24, 85) * PAL.length) | 0];
      c.save();
      c.translate(sx, sy); c.rotate((hsh(s0, 25, 86) - 0.5) * 1.2);
      c.fillStyle = rgb(col3, 0.86);
      c.beginPath(); c.arc(0, 0, sr, 0, 6.2832); c.fill();
      c.fillStyle = 'rgba(255,250,235,.92)';
      c.beginPath(); c.arc(0, 0, sr * 0.42, 0, 6.2832); c.fill();
      c.restore();
    }
  }

  // ================= 建造（拆帧） =================
  function buildWall(){
    pScale = Math.min(DPR, 1.5);
    padX = Math.round(W * 0.24);
    padY = Math.round(H * 0.07);
    PCW = W + padX * 2;
    PCH = H + padY * 2;
    var maxPix = 3.4e6;
    var px = PCW * PCH * pScale * pScale;
    if (px > maxPix) pScale *= Math.sqrt(maxPix / px);
    WALL.width = Math.max(2, Math.round(PCW * pScale));
    WALL.height = Math.max(2, Math.round(PCH * pScale));
    L = makeLayout();
    buildQ = []; buildIdx = 0; built = false;

    var rows = clamp(Math.ceil(PCH / L.rh) + 1, 1, 120);
    var chunk = Math.max(2, Math.ceil(rows / 4));
    buildQ.push(function(){
      wctx.setTransform(1, 0, 0, 1, 0, 0);
      wctx.clearRect(0, 0, WALL.width, WALL.height);
      wctx.setTransform(pScale, 0, 0, pScale, padX * pScale, padY * pScale);
      var g = wctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#150d18'); g.addColorStop(0.5, '#0f0a13'); g.addColorStop(1, '#06040a');
      wctx.fillStyle = g; wctx.fillRect(-padX, -padY, PCW, PCH);
    });
    for (var r0 = 0; r0 < rows; r0 += chunk){
      (function(a, b){
        buildQ.push(function(){
          wctx.setTransform(pScale, 0, 0, pScale, padX * pScale, padY * pScale);
          drawBricks(wctx, a, b);
        });
      })(r0, Math.min(rows, r0 + chunk));
    }
    var bn = L.blocks.length, bc = Math.max(1, Math.ceil(bn / 3));
    for (var ba = 0; ba < bn; ba += bc){
      (function(a, b){
        buildQ.push(function(){
          wctx.setTransform(pScale, 0, 0, pScale, padX * pScale, padY * pScale);
          drawBlocks(wctx, a, b);
        });
      })(ba, Math.min(bn, ba + bc));
    }
    buildQ.push(function(){
      wctx.setTransform(pScale, 0, 0, pScale, padX * pScale, padY * pScale);
      drawGraffiti(wctx);
    });
    var sn = L.spk.length, sc = Math.max(1, Math.ceil(sn / 4));
    for (var sa = 0; sa < sn; sa += sc){
      (function(a, b){
        buildQ.push(function(){
          wctx.setTransform(pScale, 0, 0, pScale, padX * pScale, padY * pScale);
          drawSpeakers(wctx, a, b);
        });
      })(sa, Math.min(sn, sa + sc));
    }
    buildQ.push(function(){
      wctx.setTransform(pScale, 0, 0, pScale, padX * pScale, padY * pScale);
      drawCables(wctx);
      drawCrowd(wctx);
      drawCollage(wctx);
      // 底部暗压 + 顶部暗压（字底反差）
      var g2 = wctx.createLinearGradient(0, H * 0.34, 0, H + padY);
      g2.addColorStop(0, 'rgba(6,4,10,0)');
      g2.addColorStop(0.42, 'rgba(6,4,10,.52)');
      g2.addColorStop(0.72, 'rgba(5,3,8,.86)');
      g2.addColorStop(1, 'rgba(4,2,7,.97)');
      wctx.fillStyle = g2; wctx.fillRect(-padX, H * 0.34, PCW, PCH);
      var g3 = wctx.createLinearGradient(0, -padY, 0, H * 0.30);
      g3.addColorStop(0, 'rgba(6,4,10,.86)');
      g3.addColorStop(0.55, 'rgba(6,4,10,.34)');
      g3.addColorStop(1, 'rgba(6,4,10,0)');
      wctx.fillStyle = g3; wctx.fillRect(-padX, -padY, PCW, H * 0.3 + padY);
      // 四周压边，让光聚在中央
      var eg = wctx.createRadialGradient(W * 0.5, H * 0.42, Math.min(W, H) * 0.28, W * 0.5, H * 0.46, Math.max(W, H) * 0.92);
      eg.addColorStop(0, 'rgba(0,0,0,0)');
      eg.addColorStop(0.62, 'rgba(8,4,12,.34)');
      eg.addColorStop(1, 'rgba(6,3,10,.82)');
      wctx.fillStyle = eg; wctx.fillRect(-padX, -padY, PCW, PCH);
    });
    stepBuild();
  }

  function stepBuild(){
    if (built) return;
    if (buildIdx < buildQ.length){
      var fn = buildQ[buildIdx++];
      try { fn(); } catch(e){ console.error('[build]', e); S.err = String(e && e.message || e); }
      if (buildIdx >= buildQ.length){ built = true; }
    } else built = true;
  }

  function sizeLyric(){
    var portrait = H > W;
    var base = portrait
      ? clamp(Math.min(W * 0.077, H * 0.042), 20, 48)
      : clamp(Math.min(W * 0.050, H * 0.092), 19, 78);
    LYF = base;
    lyrEl.style.fontSize = LYF.toFixed(1) + 'px';
    lyrEl.style.paddingBottom = (portrait ? 11 : 9) + 'vh';
  }

  function resize(){
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    if (w < 240) w = 1440;
    if (h < 240) h = 900;
    W = w; H = h;
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sizeLyric();
    safe(buildWall, 'buildWall');
  }

  function normArtists(a){
    if (Array.isArray(a)) return a.filter(function(x){ return x != null && x !== ''; }).join(' / ');
    if (typeof a === 'string') return a;
    return '';
  }

  function onInit(p){
    S.err = '';
    p = p || {};
    var ls = Array.isArray(p.lines) ? p.lines : [];
    S.lines = ls.map(function(x){
      if (!x || typeof x !== 'object') return { t: 0, dur: 0, text: '', chars: null };
      return {
        t: isFinite(+x.t) ? +x.t : 0,
        dur: isFinite(+x.dur) && +x.dur > 0 ? +x.dur : 0,
        text: typeof x.text === 'string' ? x.text : (x.text == null ? '' : String(x.text)),
        chars: Array.isArray(x.chars) ? x.chars : null
      };
    });
    S.dur = isFinite(+p.duration) && +p.duration > 0 ? +p.duration : 0;
    if (Array.isArray(p.accent) && p.accent.length >= 3)
      S.accent = p.accent.slice(0,3).map(function(v){ var n = +v; return isFinite(n) ? Math.max(0,Math.min(255,n)) : 128; });
    S.playing = p.playing === false ? false : true;
    S.song = { name: (p.song && p.song.name) || '', artists: normArtists(p.song && p.song.artists) };
    S.idx = findIdx(S.t);
    S.t = 0;
    S.idx = -1;
    lyState.idx = -2;
    emptyEl.style.display = S.lines.length ? 'none' : 'flex';
    tagMeta.textContent = (S.song.artists ? S.song.artists + ' ' : '') + (S.song.name ? '— ' + S.song.name : 'PAREDÃO DE SOM');
    safe(function(){ resize(); initLyricDom(); }, 'init-visual');
  }

  function findIdx(t){
    var ls = S.lines, lo = 0, hi = ls.length - 1, r = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (ls[mid].t <= t + 0.06){ r = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return r;
  }

  // ================= 每帧 =================
  var vig = null;
  function makeVig(){
    vig = document.createElement('canvas');
    vig.width = Math.max(2, Math.round(W * 0.5)); vig.height = Math.max(2, Math.round(H * 0.5));
    var vc = vig.getContext('2d');
    var g = vc.createRadialGradient(vig.width * 0.5, vig.height * 0.56, 0, vig.width * 0.5, vig.height * 0.56, Math.max(vig.width, vig.height) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.52, 'rgba(10,4,10,0.12)');
    g.addColorStop(1, 'rgba(6,2,6,0.80)');
    vc.fillStyle = g; vc.fillRect(0, 0, vig.width, vig.height);
  }

  var grain = null, grainPat = null, rays = null, raysBuilt = false;
  function makeGrain(){
    grain = document.createElement('canvas'); grain.width = grain.height = 128;
    var gc = grain.getContext('2d');
    var img = gc.createImageData(128, 128);
    for (var i = 0; i < 128 * 128; i++){
      var v = (hsh(i % 128, (i / 128) | 0, 91) * 255) | 0;
      img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 26;
    }
    gc.putImageData(img, 0, 0);
  }

  // 舞台光锥（一次预渲染，之后每帧只是旋转贴图）
  function makeRays(){
    var S0 = 512;
    rays = document.createElement('canvas'); rays.width = rays.height = S0;
    var rc = rays.getContext('2d');
    rc.translate(S0 / 2, S0 / 2);
    for (var i = 0; i < 14; i++){
      var a0 = (i / 14) * Math.PI * 2;
      var wid = 0.055 + (i % 3) * 0.022;
      var g = rc.createLinearGradient(0, 0, Math.cos(a0 + wid / 2) * S0 * 0.5, Math.sin(a0 + wid / 2) * S0 * 0.5);
      g.addColorStop(0, 'rgba(255,236,200,0.5)');
      g.addColorStop(0.45, 'rgba(255,190,120,0.14)');
      g.addColorStop(1, 'rgba(255,160,90,0)');
      rc.fillStyle = g;
      rc.beginPath();
      rc.moveTo(0, 0);
      rc.arc(0, 0, S0 * 0.52, a0 - wid / 2, a0 + wid / 2);
      rc.closePath(); rc.fill();
    }
    raysBuilt = true;
  }

  function drawBeatRings(kick, dolly, panX, panY){
    if (!L || kick < 0.05) return;
    var sp = L.spk;
    for (var i = 0; i < sp.length; i += 3){
      var s = sp[i];
      var sx = W * 0.5 + panX + dolly * (s.x - W * 0.5);
      var sy = H * 0.5 + panY + dolly * (s.y + s.h * 0.5 - H * 0.5);
      if (sx < -80 || sx > W + 80) continue;
      var col = mixc(PAL[(s.hue * PAL.length) | 0], S.accent, 0.5);
      var r0 = s.r * (0.95 + kick * 0.55);
      ctx.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (kick * 0.42).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, s.r * 0.09);
      ctx.beginPath(); ctx.arc(sx, sy, r0, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (kick * 0.18).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, r0 * 1.5, 0, 6.2832); ctx.stroke();
    }
  }

  function draw(t, dt){
    // --- 动画状态推进 ---
    anim.kick *= Math.pow(0.0016, dt);
    anim.flash *= Math.pow(0.002, dt);
    anim.pulseT += dt * (S.playing ? 1 : 0.15);
    // 没有 beat 消息时用自走节拍兜底（约 128 BPM 放克节奏）
    if (S.playing){
      var bp = (S.live && isFinite(+S.live.bpm) && +S.live.bpm > 30) ? +S.live.bpm : 128;
      var per2 = 60 / bp;
      var cyc = Math.floor(anim.pulseT / per2);
      if (cyc !== anim.lastCyc){
        anim.lastCyc = cyc;
        anim.kick = Math.min(1.4, anim.kick * 0.6 + 0.75);
        if (cyc % 4 === 0) anim.flash = Math.min(1, anim.flash + 0.34);
      }
    }
    anim.bass += ((S.live && isFinite(S.live.bass) ? clamp(S.live.bass, 0, 1) : 0.34) - anim.bass) * Math.min(1, dt * 5);
    anim.mid += ((S.live && isFinite(S.live.mid) ? clamp(S.live.mid, 0, 1) : 0.3) - anim.mid) * Math.min(1, dt * 5);
    anim.treble += ((S.live && isFinite(S.live.treble) ? clamp(S.live.treble, 0, 1) : 0.2) - anim.treble) * Math.min(1, dt * 5);
    anim.vt += dt * (S.playing ? 1 : 0.16) * (S.rm ? 0.25 : 1);

    var kick = anim.kick, bass = anim.bass, vt = anim.vt;
    var moving = S.rm ? 0.22 : 1;

    dolly = 1.035 + Math.sin(vt * 0.13) * 0.016 * moving + kick * 0.022 * moving;
    panX = Math.sin(vt * 0.071) * W * 0.014 * moving;
    panY = Math.cos(vt * 0.049) * H * 0.010 * moving + kick * H * 0.006;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0a060d';
    ctx.fillRect(0, 0, W, H);

    if (L && WALL.width > 1){
      ctx.save();
      ctx.translate(W * 0.5 + panX, H * 0.5 + panY);
      ctx.scale(dolly, dolly);
      ctx.translate(-W * 0.5, -H * 0.5);
      ctx.drawImage(WALL, -padX, -padY, PCW, PCH);
      ctx.restore();
    }

    // --- 低频光：墙后放射光 + 舞台光锥 ---
    if (!makeVig.__done){ safe(function(){ makeVig(); makeGrain(); grainPat = ctx.createPattern(grain, 'repeat'); makeRays(); }, 'assets'); makeVig.__done = true; }
    var cx0 = W * 0.5, cy0 = H * 0.52;
    var acc = S.accent;
    ctx.globalCompositeOperation = 'screen';
    var g1 = ctx.createRadialGradient(cx0 + panX * 2, cy0, 0, cx0 + panX * 2, cy0, Math.max(W, H) * (0.52 + bass * 0.10));
    g1.addColorStop(0, 'rgba(' + acc[0] + ',' + acc[1] + ',' + acc[2] + ',' + (0.07 + bass * 0.09 + kick * 0.07).toFixed(3) + ')');
    g1.addColorStop(0.5, 'rgba(' + acc[0] + ',' + acc[1] + ',' + acc[2] + ',0.03)');
    g1.addColorStop(1, 'rgba(' + acc[0] + ',' + acc[1] + ',' + acc[2] + ',0)');
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);

    // 光锥：旋转的预渲染贴图
    if (rays){
      var rs = Math.max(W, H) * (0.72 + bass * 0.16) * 2;
      ctx.save();
      ctx.globalAlpha = 0.10 + anim.mid * 0.10 + kick * 0.09;
      ctx.translate(W * 0.5 + panX * 1.6, H * 0.34);
      ctx.rotate(vt * (S.rm ? 0.02 : 0.055));
      ctx.drawImage(rays, -rs / 2, -rs / 2, rs, rs);
      ctx.restore();
    }

    // 斜切光带（街灯穿过墙缝）
    var bands = 3;
    for (var b = 0; b < bands; b++){
      var u = ((vt * 0.045 + b / bands) % 1);
      var bx = -W * 0.35 + u * W * 1.7;
      var bw2 = W * (0.16 + b * 0.05);
      var bg = ctx.createLinearGradient(bx, 0, bx + bw2, H * 0.9);
      bg.addColorStop(0, 'rgba(255,170,60,0)');
      bg.addColorStop(0.5, 'rgba(255,160,70,' + (0.035 + anim.treble * 0.05).toFixed(3) + ')');
      bg.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.moveTo(bx, -20); ctx.lineTo(bx + bw2, -20);
      ctx.lineTo(bx + bw2 + W * 0.16, H + 20); ctx.lineTo(bx + W * 0.16, H + 20);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // --- 灯串呼吸 & 频闪 ---
    var fl = anim.flash;
    if (fl > 0.02){
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = 'rgba(' + acc[0] + ',' + acc[1] + ',' + acc[2] + ',' + (fl * 0.16).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }

    // --- 箱体脉冲环（跟着鼓点） ---
    drawBeatRings(kick, dolly, panX, panY);

    // --- 色彩分级：青蓝压进阴影、暖橙提亮高光（一次 screen + 一次 multiply 之外的轻量做法） ---
    ctx.globalCompositeOperation = 'overlay';
    var cg = ctx.createLinearGradient(0, 0, 0, H);
    cg.addColorStop(0, 'rgba(52,120,255,0.10)');
    cg.addColorStop(0.55, 'rgba(20,0,40,0.02)');
    cg.addColorStop(1, 'rgba(255,110,40,0.12)');
    ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    // --- 暗角 ---
    if (vig) ctx.drawImage(vig, 0, 0, W, H);

    // --- 颗粒 ---
    if (grainPat){
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.translate((vt * 37) % 128 - 128, (vt * 23) % 128 - 128);
      ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 128, H + 128);
      ctx.restore();
    }

    // --- HUD：声压表 + 标题 ---
    drawHud(bass, kick);
  }

  function drawHud(bass, kick){
    var n = 16, bw3 = clamp(W * 0.0055, 3, 9), gap = bw3 * 0.7;
    var totalW = n * (bw3 + gap);
    var x0 = W - clamp(W * 0.045, 14, 64) - totalW;
    var y0 = clamp(H * 0.055, 12, 46);
    var hMax = clamp(H * 0.045, 12, 40);
    for (var i = 0; i < n; i++){
      var rnd = hsh(i, 2, 71);
      var lvl = clamp(bass * (0.5 + rnd * 0.9) + anim.mid * rnd * 0.6 + kick * 0.55, 0, 1.25);
      var hh = Math.max(2, hMax * lvl);
      var col = i < 10 ? [255, 232, 214] : (i < 13 ? [255, 196, 60] : [255, 70, 150]);
      ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (0.34 + lvl * 0.6).toFixed(3) + ')';
      ctx.fillRect(x0 + i * (bw3 + gap), y0 + hMax - hh, bw3, hh);
    }
    // 标签放到频谱下方，避免和它抢同一行
    var fs = clamp(Math.min(W, H) * 0.016, 8, 13);
    ctx.font = '600 ' + fs.toFixed(1) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,232,214,.46)';
    ctx.fillText('PAREDÃO · ' + (S.playing ? 'AO VIVO' : 'PAUSA'), W - clamp(W * 0.045, 14, 64), y0 + hMax + fs * 0.5);
  }

  // ================= 歌词 =================
  var rows = { prev: null, cur: null, next: null };
  var lyState = { idx: -2, n: 0, chars: [] };

  function rowEl(cls){
    var d = document.createElement('div');
    d.className = 'row ' + cls;
    lyrEl.appendChild(d);
    return d;
  }
  function initLyricDom(){
    lyrEl.innerHTML = '';
    rows.prev = rowEl('prev');
    rows.cur = rowEl('cur');
    rows.next = rowEl('next');
  }

  function fitSize(txt){
    // 超长句缩字号；手机竖屏允许缩得更多（本来字号就大）
    var len = txt ? txt.length : 0;
    var lim = H > W ? 11 : 15;
    var f = 1;
    if (len > lim) f = Math.max(H > W ? 0.40 : 0.48, lim / len);
    return f;
  }

  function rebuildLyric(){
    var cur = S.lines[S.idx];
    var prev = S.idx > 0 ? S.lines[S.idx - 1] : null;
    var next = S.lines[S.idx + 1] || null;
    if (!cur) next = S.lines[0] || null;
    if (!cur && S.idx >= S.lines.length) { prev = S.lines[S.lines.length - 1] || null; next = null; }

    rows.prev.textContent = prev ? prev.text : '';
    rows.next.textContent = next ? next.text : '';

    var txt = cur ? cur.text : '';
    rows.cur.textContent = '';
    lyState.chars = [];
    rows.cur.style.setProperty('--fit', fitSize(txt).toFixed(3));
    rows.cur.style.setProperty('--chars', Math.max(1, Math.min(64, txt.length || 1)));

    if (!cur) return;
    var chars = (cur.chars && cur.chars.length) ? cur.chars : null;
    var useCh = chars && txt.length > 0;
    var n = useCh ? Math.min(chars.length, txt.length) : Math.min(txt.length, 120);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++){
      var s = document.createElement('span');
      var chTxt = txt.charAt(i);
      s.textContent = chTxt === ' ' ? '\u00a0' : chTxt;
      var ct = useCh && chars[i] && isFinite(+chars[i].t) ? +chars[i].t : null;
      s.__t = ct;
      s.__i = i;
      s.__on = false;
      frag.appendChild(s);
      lyState.chars.push(s);
    }
    if (n < txt.length){
      var s2 = document.createElement('span');
      s2.textContent = txt.slice(n);
      s2.__t = useCh ? null : null; s2.__i = -1; s2.__on = false;
      frag.appendChild(s2); lyState.chars.push(s2);
    }
    rows.cur.appendChild(frag);

    // 无逐字时间 → 按句长均分
    var ld = cur.dur > 0 ? cur.dur : 2.4;
    var per = ld / Math.max(1, lyState.chars.length);
    for (var k = 0; k < lyState.chars.length; k++){
      if (lyState.chars[k].__t == null) lyState.chars[k].__t = cur.t + k * per;
    }
    lyState.idx = S.idx;
  }

  function paintChars(){
    var cur = S.lines[S.idx];
    if (!cur) return;
    var t = S.t;
    // 提前 0.12s 点亮，观感跟手
    var lead = S.rm ? 0.02 : 0.12;
    var ch = lyState.chars;
    for (var i = 0; i < ch.length; i++){
      var on = ch[i].__t != null && t + lead >= ch[i].__t;
      if (on !== ch[i].__on){ ch[i].__on = on; ch[i].className = on ? 'on' : ''; }
    }
  }

  var last = 0, fpsAvg = 60, readyTimer = 0;
  var READY_DEFER = 140; // 首帧之后极短延迟再发，让真首帧已经落地
  function loop(now){
    var t0 = performance.now();
    try {
      S.frames++;
      if (!S.ready && !readyTimer){
        readyTimer = 1;
        setTimeout(function(){ sendReady(); }, READY_DEFER);
      }
      var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
      last = now;
      if (dt > 0) fpsAvg += ((1 / dt) - fpsAvg) * 0.05;

      // 墙分帧建造（每帧硬预算 4ms，单任务，绝不超 8ms）
      if (!built){
        var b0 = performance.now();
        stepBuild();
        if (performance.now() - b0 > 6) { /* 单任务已花较多时间，下一帧再继续 */ }
      }

      draw(S.t, dt);

      // 歌词索引变化才重建
      if (S.idx !== lyState.idx){ safe(rebuildLyric, 'lyric'); }
      paintChars();
    } catch(e){
      S.err = String(e && e.message || e); console.error('[frame]', e);
    }
    S.js = performance.now() - t0;
    requestAnimationFrame(loop);
  }

  function sendReady(){
    if (S.ready) return;
    S.ready = true;
    try { parent.postMessage({__c100:1,type:'ready'}, '*'); } catch(e){ console.error('[ready]', e); }
  }

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    safe(function(){
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick'){
        var p = d.payload || {};
        if (isFinite(+p.time)) S.t = Math.max(0, +p.time);
        if (typeof p.playing === 'boolean') S.playing = p.playing;
        S.idx = findIdx(S.t);
      } else if (d.type === 'beat'){
        S.beat = d.payload || {};
        var lv = isFinite(+S.beat.level) ? clamp(+S.beat.level, 0, 1) : 0.6;
        anim.kick = Math.min(1.5, anim.kick + 0.55 + lv * 0.5);
        anim.flash = Math.min(1, anim.flash + 0.28 + lv * 0.3);
      } else if (d.type === 'live'){
        S.live = d.payload || {};
        if (isFinite(+S.live.bass)) anim.bass = clamp(+S.live.bass, 0, 1);
        if (isFinite(+S.live.mid)) anim.mid = clamp(+S.live.mid, 0, 1);
        if (isFinite(+S.live.treble)) anim.treble = clamp(+S.live.treble, 0, 1);
        if (typeof S.live.playing === 'boolean') S.playing = S.live.playing;
      }
    }, 'msg:' + d.type);
  });

  var rsTimer = 0;
  function onResize(){
    if (rsTimer) clearTimeout(rsTimer);
    rsTimer = setTimeout(function(){
      rsTimer = 0;
      safe(function(){ resize(); initLyricDom(); }, 'resize');
    }, 140);
  }

  S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  initLyricDom();
  resize();
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  requestAnimationFrame(loop);
  // 兜底：首帧没跑到也必须 ready（只发一次）
  setTimeout(sendReady, 900);
})();
</script>
</body>
</html>
