<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONYX / GILT</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#070506;overflow:hidden}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;color:#efe1c8;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* ---------- editorial masthead ---------- */
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  .mast{position:absolute;left:5.2vw;top:4.4vh;max-width:52vw}
  .kicker{
    font-size:clamp(8px,0.95vw,10px);letter-spacing:.52em;text-transform:uppercase;
    color:rgba(226,178,106,.80);margin-bottom:.9em
  }
  .kicker i{font-style:normal;color:rgba(255,222,170,.55)}
  .title{
    font-size:clamp(13px,1.55vw,20px);font-weight:700;letter-spacing:.16em;
    color:rgba(255,241,214,.96);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw
  }
  .artist{
    margin-top:.55em;font-size:clamp(9px,1.05vw,12px);letter-spacing:.30em;
    text-transform:uppercase;color:rgba(216,182,132,.62)
  }
  .meta{position:absolute;right:5.2vw;top:4.4vh;text-align:right}
  .time{
    font-size:clamp(11px,1.25vw,15px);font-weight:600;letter-spacing:.24em;
    color:rgba(255,238,206,.90);font-variant-numeric:tabular-nums
  }
  .pill{
    margin-top:.9em;display:inline-block;font-size:clamp(8px,0.9vw,10px);
    letter-spacing:.42em;text-transform:uppercase;color:rgba(224,180,110,.72);
    border-top:1px solid rgba(224,180,110,.42);padding-top:.7em
  }
  .edge{
    position:absolute;right:4.2vw;bottom:12vh;transform:rotate(180deg);
    writing-mode:vertical-rl;font-size:clamp(8px,0.9vw,10px);letter-spacing:.46em;
    text-transform:uppercase;color:rgba(210,168,106,.40)
  }
  .foot{
    position:absolute;left:5.2vw;bottom:3.4vh;font-size:clamp(8px,0.9vw,10px);
    letter-spacing:.44em;text-transform:uppercase;color:rgba(206,166,106,.34)
  }
  #prog{
    position:absolute;left:0;right:0;bottom:0;height:2px;
    background:rgba(246,206,140,.10);
  }
  #prog i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,rgba(246,190,110,.20),rgba(255,226,168,.92));
    box-shadow:0 0 12px rgba(255,186,96,.55);
    transform-origin:left center;
  }

  /* ---------- lyrics ---------- */
  #lyr{
    position:fixed;z-index:4;left:5.2vw;bottom:9.5vh;
    width:min(44vw,700px);
    isolation:isolate;
  }
  #prev,#next{
    color:rgba(214,178,128,.34);font-weight:500;letter-spacing:.02em;
    line-height:1.35;word-break:break-word;
  }
  #prev{font-size:clamp(11px,1.22vw,17px);margin-bottom:1.05em;color:rgba(222,190,144,.46)}
  #next{font-size:clamp(11px,1.30vw,18px);margin-top:.85em;color:rgba(226,196,152,.56)}
  #cur{
    font-weight:800;line-height:1.1;letter-spacing:.015em;
    word-break:break-word;hyphens:auto;white-space:pre-wrap;
    font-size:clamp(26px,4.25vw,66px);
    max-height:34vh;overflow:hidden;
  }
  #cur .ch{
    color:rgba(240,220,190,.52);
    transition:color .34s ease-out;
  }
  #cur .ch.on{
    color:#FFF0CE;
    text-shadow:0 0 16px rgba(255,183,92,.55),0 0 40px rgba(255,132,42,.28);
  }
  #cur .ch.now{text-shadow:0 0 20px rgba(255,214,152,.85),0 0 54px rgba(255,150,60,.45)}
  #hint{
    font-size:clamp(9px,1.0vw,11px);letter-spacing:.46em;text-transform:uppercase;
    color:rgba(220,176,112,.62);margin-bottom:1.1em;
    padding-left:.2em;
  }
  #empty{display:none}
  #empty .ek{
    font-size:clamp(9px,1.0vw,11px);letter-spacing:.50em;text-transform:uppercase;
    color:rgba(220,176,112,.60);margin-bottom:1.0em
  }
  #empty .et{font-size:clamp(20px,2.5vw,34px);font-weight:800;letter-spacing:.06em;color:rgba(255,236,204,.92)}
  #empty .es{margin-top:.7em;font-size:clamp(10px,1.15vw,14px);letter-spacing:.26em;color:rgba(210,172,120,.62)}
  #empty .rule{height:1px;width:clamp(90px,14vw,210px);background:rgba(246,206,140,.42);margin-top:1.4em}

  /* ---------- narrow / portrait ---------- */
  body.narrow #lyr{
    left:6.4vw;right:6.4vw;bottom:7.2vh;width:auto;
  }
  body.narrow #lyr::before{
    content:"";position:absolute;left:-12vw;right:-12vw;top:-16vh;bottom:-9vh;
    background:radial-gradient(120% 90% at 40% 70%,rgba(3,2,2,.90),rgba(3,2,2,.62) 55%,rgba(3,2,2,0) 100%);
    z-index:-1;pointer-events:none;
  }
  body.narrow #cur{font-size:clamp(23px,7.3vw,42px);line-height:1.18}
  body.narrow #prev{font-size:clamp(10px,3.1vw,14px)}
  body.narrow #next{font-size:clamp(10px,3.3vw,15px)}
  body.narrow .mast{max-width:66vw;top:3.6vh}
  body.narrow .title{max-width:62vw}
  body.narrow .meta{top:3.6vh;right:6.4vw}
  body.narrow .edge,body.narrow .foot{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="mast">
    <div class="kicker">LAGOS <i>·</i> ACCRA <i>·</i> A/W 26</div>
    <div class="title" id="hTitle">ONYX / GILT</div>
    <div class="artist" id="hArtist">STUDIO N°135</div>
  </div>
  <div class="meta">
    <div class="time" id="hTime">00:00</div>
    <div class="pill" id="hState">LIVE</div>
  </div>
  <div class="edge">MELANIN GLOW — 24K RIM</div>
  <div class="foot" id="hFoot">— ETUDES IN OBSIDIAN —</div>
  <div id="prog"><i id="progBar"></i></div>
</div>

<div id="lyr">
  <div id="hint">INTRO</div>
  <div id="prev"></div>
  <div id="cur"></div>
  <div id="next"></div>
  <div id="empty">
    <div class="ek">NO LYRICS</div>
    <div class="et">INSTRUMENTAL</div>
    <div class="es">纯音乐 · 无歌词</div>
    <div class="rule"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, err: '', text: '', gl: false, rm: false
  };

  var W = 1440, H = 900, dpr = 1;
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d', { alpha: false });
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var pt = document.createElement('canvas'), ptx = pt.getContext('2d');

  var accent = [214, 168, 88];
  var duration = 0;
  var readySent = false;

  var liveE = { level: 0, bass: 0, mid: 0, treble: 0, bpm: 0, playing: true };
  var beatE = { index: 0, level: 0, at: -1e9 };

  var narrow = false;
  var face = { cx: 1180, cy: 360, R: 190, bx: 0, by: 0, bw: 0, bh: 0 };
  var goldA = 'rgba(248,210,140,1)';
  var goldB = 'rgba(206,158,86,1)';
  var coolA = 'rgba(112,152,226,1)';
  var haloSprite = null, glintSprite = null;
  var sweepSprite = null, sweepW = 0, sweepH = 0;

  var elPrev = document.getElementById('prev');
  var elCur = document.getElementById('cur');
  var elNext = document.getElementById('next');
  var elHint = document.getElementById('hint');
  var elEmpty = document.getElementById('empty');
  var elTime = document.getElementById('hTime');
  var elState = document.getElementById('hState');
  var elTitle = document.getElementById('hTitle');
  var elArtist = document.getElementById('hArtist');
  var elProg = document.getElementById('progBar');
  var lastProg = -1;

  var spans = [];
  var spanT = [];
  var litPtr = 0;
  var curKey = '\u0000';
  var lastT = -1;
  var lastClock = '';
  var lyricMode = 'idle';
  var inited = false;

  state.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function logErr(where, e) {
    try { console.error('[488-onyx-gilt] ' + where, e); } catch (x) {}
  }

  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { logErr('ready', e); }
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  /* ================= palette ================= */
  function buildPalette() {
    var r = accent[0], b = accent[2];
    if (b > r + 24) {
      goldA = 'rgba(168,206,255,1)';
      goldB = 'rgba(104,146,214,1)';
      coolA = 'rgba(255,198,124,1)';
    } else {
      goldA = 'rgba(250,212,142,1)';
      goldB = 'rgba(206,158,86,1)';
      coolA = 'rgba(112,152,226,1)';
    }
  }

  function halo(rgb, size) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gr.addColorStop(0, 'rgba(' + rgb + ',1)');
    gr.addColorStop(0.30, 'rgba(' + rgb + ',0.40)');
    gr.addColorStop(0.62, 'rgba(' + rgb + ',0.10)');
    gr.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, size, size);
    return c;
  }

  function buildSprites() {
    var warm = (accent[2] > accent[0] + 24) ? '176,210,255' : '255,204,140';
    haloSprite = halo(warm, 320);
    glintSprite = halo('255,246,218', 128);
    buildSweep();
  }

  /* visor specular band, pre-rendered once — animated by translation, never re-created */
  function buildSweep() {
    var R = face.R, vw = R * 1.72, vh = R * 0.44;
    var cssW = Math.max(16, vw * 0.34);
    var cssH = Math.max(8, vh);
    var c = document.createElement('canvas');
    c.width = Math.max(8, Math.round(cssW * 0.6));
    c.height = Math.max(8, Math.round(cssH * 0.6));
    var g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, c.width, 0);
    gr.addColorStop(0, 'rgba(206,228,255,0)');
    gr.addColorStop(0.4, 'rgba(226,242,255,0.90)');
    gr.addColorStop(0.52, 'rgba(255,255,255,0.34)');
    gr.addColorStop(0.68, 'rgba(206,228,255,0)');
    gr.addColorStop(1, 'rgba(206,228,255,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, c.width, c.height);
    sweepSprite = c;
    sweepW = cssW;
    sweepH = cssH;
  }

  /* ================= geometry ================= */
  function computeFace() {
    narrow = H > W * 1.06;
    document.body.classList.toggle('narrow', narrow);
    var R;
    if (narrow) {
      R = Math.min(W * 0.300, H * 0.118);
      R = Math.max(52, R);
      face.cx = W * 0.50;
      face.cy = H * 0.290;
    } else {
      R = Math.min(H * 0.225, W * 0.150);
      R = Math.max(64, R);
      face.cx = W * 0.775;
      face.cy = H * 0.385;
    }
    face.R = R;
  }

  var BOTMUL = 3.3;   // how far the torso extends below the head (in R)

  function headPath(g, cx, cy, R) {
    var B = BOTMUL;
    g.beginPath();
    g.moveTo(cx, cy - 1.03 * R);
    g.bezierCurveTo(cx + 0.62 * R, cy - 1.03 * R, cx + 0.80 * R, cy - 0.50 * R, cx + 0.80 * R, cy - 0.02 * R);
    g.bezierCurveTo(cx + 0.80 * R, cy + 0.34 * R, cx + 0.50 * R, cy + 0.64 * R, cx + 0.20 * R, cy + 0.86 * R);
    g.bezierCurveTo(cx + 0.29 * R, cy + 1.02 * R, cx + 0.34 * R, cy + 1.13 * R, cx + 0.33 * R, cy + 1.30 * R);
    g.bezierCurveTo(cx + 0.62 * R, cy + 1.46 * R, cx + 0.86 * R, cy + 1.62 * R, cx + 1.28 * R, cy + 1.76 * R);
    g.lineTo(cx + 1.86 * R, cy + B * R);
    g.lineTo(cx - 1.86 * R, cy + B * R);
    g.lineTo(cx - 1.28 * R, cy + 1.76 * R);
    g.bezierCurveTo(cx - 0.86 * R, cy + 1.62 * R, cx - 0.62 * R, cy + 1.46 * R, cx - 0.33 * R, cy + 1.30 * R);
    g.bezierCurveTo(cx - 0.34 * R, cy + 1.13 * R, cx - 0.29 * R, cy + 1.02 * R, cx - 0.20 * R, cy + 0.86 * R);
    g.bezierCurveTo(cx - 0.50 * R, cy + 0.64 * R, cx - 0.80 * R, cy + 0.34 * R, cx - 0.80 * R, cy - 0.02 * R);
    g.bezierCurveTo(cx - 0.80 * R, cy - 0.50 * R, cx - 0.62 * R, cy - 1.03 * R, cx, cy - 1.03 * R);
    g.closePath();
  }

  function rr(g, x, y, w, h, r) {
    r = Math.min(r, w * 0.5, h * 0.5);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  /* ================= prerender: studio backdrop ================= */
  function buildBackdrop() {
    bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgx.clearRect(0, 0, W, H);

    var g = bgx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0709');
    g.addColorStop(0.48, '#0d0808');
    g.addColorStop(1, '#050404');
    bgx.fillStyle = g;
    bgx.fillRect(0, 0, W, H);

    var cx = face.cx, cy = face.cy, R = face.R;
    var mx = Math.max(W, H);

    // key light behind the sitter
    var kx = cx + R * 0.9, ky = cy - R * 1.55;
    var rg = bgx.createRadialGradient(kx, ky, 0, kx, ky, mx * 0.82);
    rg.addColorStop(0, 'rgba(178,120,52,0.62)');
    rg.addColorStop(0.30, 'rgba(108,68,28,0.30)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    bgx.fillStyle = rg;
    bgx.fillRect(0, 0, W, H);

    // cool kicker, opposite corner
    var lx = W * 0.06, ly = H * 0.10;
    var rl = bgx.createRadialGradient(lx, ly, 0, lx, ly, mx * 0.68);
    rl.addColorStop(0, 'rgba(38,72,132,0.34)');
    rl.addColorStop(1, 'rgba(0,0,0,0)');
    bgx.fillStyle = rl;
    bgx.fillRect(0, 0, W, H);

    // floor pool
    var fg = bgx.createLinearGradient(0, H * 0.60, 0, H);
    fg.addColorStop(0, 'rgba(34,22,12,0)');
    fg.addColorStop(1, 'rgba(46,30,15,0.60)');
    bgx.fillStyle = fg;
    bgx.fillRect(0, H * 0.60, W, H * 0.40);

    // vertical studio seams
    bgx.save();
    bgx.globalAlpha = 0.055;
    bgx.strokeStyle = goldB;
    bgx.lineWidth = 1;
    for (var i = 1; i <= 5; i++) {
      var x = W * (i / 6);
      bgx.beginPath();
      bgx.moveTo(x, 0);
      bgx.lineTo(x + W * 0.014, H);
      bgx.stroke();
    }
    bgx.restore();

    // ambient occlusion behind the sitter (static, so it lives in the backdrop)
    var ao = bgx.createRadialGradient(face.cx + face.R * 0.18, face.cy + face.R * 0.10, face.R * 0.15, face.cx + face.R * 0.18, face.cy + face.R * 0.10, face.R * 1.55);
    ao.addColorStop(0, 'rgba(0,0,0,0.66)');
    ao.addColorStop(1, 'rgba(0,0,0,0)');
    bgx.fillStyle = ao;
    bgx.fillRect(0, 0, W, H);

    // lower scrim — guarantees lyric contrast on any art
    var sc = bgx.createLinearGradient(0, H * 0.34, 0, H);
    sc.addColorStop(0, 'rgba(4,3,3,0)');
    sc.addColorStop(0.46, 'rgba(4,3,3,0.42)');
    sc.addColorStop(1, 'rgba(3,2,2,0.90)');
    bgx.fillStyle = sc;
    bgx.fillRect(0, H * 0.34, W, H * 0.66);

    // left column scrim (behind the text block)
    var lsc = bgx.createLinearGradient(0, 0, W * (narrow ? 1.0 : 0.58), 0);
    lsc.addColorStop(0, 'rgba(3,2,2,' + (narrow ? 0.10 : 0.52) + ')');
    lsc.addColorStop(1, 'rgba(3,2,2,0)');
    bgx.fillStyle = lsc;
    bgx.fillRect(0, 0, W, H);

    // vignette
    var vg = bgx.createRadialGradient(W * 0.56, H * 0.44, Math.min(W, H) * 0.26, W * 0.56, H * 0.44, Math.max(W, H) * 0.80);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.72)');
    bgx.fillStyle = vg;
    bgx.fillRect(0, 0, W, H);

    // film grain (fixed seed, deterministic)
    bgx.save();
    bgx.globalAlpha = 0.055;
    var n = Math.min(3200, Math.round((W * H) / 700));
    for (var k = 0; k < n; k++) {
      var s1 = Math.sin(k * 12.9898) * 43758.5453;
      var s2 = Math.sin(k * 78.233) * 24461.119;
      var px = (s1 - Math.floor(s1)) * W;
      var py = (s2 - Math.floor(s2)) * H;
      bgx.fillStyle = (k % 3) ? 'rgba(255,228,184,1)' : 'rgba(128,158,228,1)';
      bgx.fillRect(px, py, 1, 1);
    }
    bgx.restore();

    // hard light shaft raking across the studio, top-right
    bgx.save();
    bgx.globalCompositeOperation = 'lighter';
    var sx0 = W * 0.72, sy0 = -H * 0.10, sx1 = W * 1.02, sy1 = H * 0.92;
    var shaft = bgx.createLinearGradient(sx0, sy0, sx1, sy1);
    shaft.addColorStop(0, 'rgba(255,214,156,0.085)');
    shaft.addColorStop(0.42, 'rgba(255,196,124,0.045)');
    shaft.addColorStop(1, 'rgba(255,196,124,0)');
    bgx.fillStyle = shaft;
    bgx.beginPath();
    bgx.moveTo(W * 0.60, 0);
    bgx.lineTo(W * 0.80, 0);
    bgx.lineTo(W * 1.10, H);
    bgx.lineTo(W * 0.86, H);
    bgx.closePath();
    bgx.fill();
    bgx.restore();

    // hairline catalogue frame
    var insetX = Math.max(14, W * 0.022), insetY = Math.max(14, H * 0.026);
    bgx.save();
    bgx.strokeStyle = 'rgba(236,196,134,0.22)';
    bgx.lineWidth = 1;
    bgx.strokeRect(insetX, insetY, W - insetX * 2, H - insetY * 2);
    bgx.strokeStyle = 'rgba(236,196,134,0.48)';
    var cl = Math.max(10, Math.min(W, H) * 0.022);
    var corners = [[insetX, insetY, 1, 1], [W - insetX, insetY, -1, 1], [insetX, H - insetY, 1, -1], [W - insetX, H - insetY, -1, -1]];
    for (var ci = 0; ci < 4; ci++) {
      var C = corners[ci];
      bgx.beginPath();
      bgx.moveTo(C[0] + C[2] * cl, C[1]);
      bgx.lineTo(C[0], C[1]);
      bgx.lineTo(C[0], C[1] + C[3] * cl);
      bgx.stroke();
    }
    bgx.restore();
  }

  /* ================= prerender: portrait ================= */
  function buildPortrait() {
    ptx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ptx.clearRect(0, 0, W, H);
    var cx = face.cx, cy = face.cy, R = face.R;

    // bbox so the frame loop can blit only the head, not the whole screen
    var pad = R * 0.55;
    face.bx = Math.max(0, Math.floor(cx - 1.92 * R - pad));
    face.by = Math.max(0, Math.floor(cy - 1.10 * R - pad));
    face.bw = Math.min(W, Math.ceil(cx + 1.92 * R + pad)) - face.bx;
    face.bh = Math.min(H, Math.ceil(cy + BOTMUL * R + pad)) - face.by;
    if (!(face.bw > 4) || !(face.bh > 4)) {
      face.bx = 0; face.by = 0; face.bw = W; face.bh = H;
    }

    // ---- torso / skin base
    headPath(ptx, cx, cy, R);
    var body = ptx.createLinearGradient(cx - R * 0.9, cy - R, cx + R * 1.25, cy + R * 2.6);
    body.addColorStop(0, '#0c0909');
    body.addColorStop(0.40, '#181011');
    body.addColorStop(0.66, '#291a14');
    body.addColorStop(0.86, '#150d0e');
    body.addColorStop(1, '#080607');
    ptx.fillStyle = body;
    ptx.fill();

    ptx.save();
    headPath(ptx, cx, cy, R);
    ptx.clip();

    // melanin sheen — warm, directional
    var sheen = ptx.createLinearGradient(cx - R * 0.85, cy - R * 0.9, cx + R * 1.0, cy + R * 2.1);
    sheen.addColorStop(0, 'rgba(58,28,12,0)');
    sheen.addColorStop(0.38, 'rgba(120,64,26,0.10)');
    sheen.addColorStop(0.58, 'rgba(198,126,52,0.28)');
    sheen.addColorStop(0.74, 'rgba(255,198,120,0.22)');
    sheen.addColorStop(1, 'rgba(60,28,12,0)');
    ptx.fillStyle = sheen;
    ptx.fillRect(cx - R * 2, cy - R * 2, R * 5, R * 6);

    // cheekbone specular
    var sp1 = ptx.createRadialGradient(cx + R * 0.40, cy - R * 0.06, 0, cx + R * 0.40, cy - R * 0.06, R * 0.50);
    sp1.addColorStop(0, 'rgba(255,216,162,0.36)');
    sp1.addColorStop(0.52, 'rgba(214,144,74,0.11)');
    sp1.addColorStop(1, 'rgba(0,0,0,0)');

    var sp2 = ptx.createRadialGradient(cx + R * 0.04, cy - R * 0.64, 0, cx + R * 0.04, cy - R * 0.64, R * 0.40);
    sp2.addColorStop(0, 'rgba(255,228,182,0.24)');
    sp2.addColorStop(1, 'rgba(0,0,0,0)');
    ptx.fillStyle = sp2;
    ptx.fillRect(cx - R, cy - R * 1.7, R * 2.4, R * 2.2);

    jd.addColorStop(1, 'rgba(0,0,0,0)');

    ptx.fillRect(cx - R * 1.3, cy - R * 0.5, R * 1.9, R * 2.2);

    nk.addColorStop(0, 'rgba(0,0,0,0.46)');
    nk.addColorStop(1, 'rgba(0,0,0,0.06)');

    ptx.fillRect(cx - R * 0.5, cy + R * 0.82, R, R * 0.7);

    hair.addColorStop(0.58, 'rgba(9,7,8,0.62)');

    ptx.fillRect(cx - R * 1.2, hgTop, R * 2.4, hgBot - hgTop);

    // hairline sheen (tight specular band right at the crown edge)
    var hspec = ptx.createLinearGradient(cx - R * 0.55, cy - R * 0.94, cx + R * 0.75, cy - R * 0.86);
    hspec.addColorStop(0, 'rgba(255,206,150,0)');
    hspec.addColorStop(0.52, 'rgba(255,220,172,0.24)');
    hspec.addColorStop(1, 'rgba(255,206,150,0)');

    brow.addColorStop(0, 'rgba(0,0,0,0.42)');
    brow.addColorStop(1, 'rgba(0,0,0,0)');

    ptx.fillRect(cx - R * 0.75, cy - R * 0.10, R * 1.5, R * 0.4);

    // nose: bridge highlight + soft shadow
    var nb = ptx.createLinearGradient(cx, cy + R * 0.05, cx + R * 0.05, cy + R * 0.40);
    nb.addColorStop(0, 'rgba(255,214,164,0)');
    nb.addColorStop(0.6, 'rgba(255,220,172,0.20)');
    nb.addColorStop(1, 'rgba(255,220,172,0)');
    ptx.fillStyle = nb;
    ptx.fillRect(cx - R * 0.06, cy + R * 0.05, R * 0.14, R * 0.36);

    var ns = ptx.createRadialGradient(cx + R * 0.055, cy + R * 0.36, 0, cx + R * 0.055, cy + R * 0.36, R * 0.20);
    ns.addColorStop(0, 'rgba(0,0,0,0.46)');
    ns.addColorStop(1, 'rgba(0,0,0,0)');
    ptx.fillStyle = ns;
    ptx.fillRect(cx - R * 0.2, cy + R * 0.16, R * 0.55, R * 0.42);

    // lips — sculpted, faint
    ptx.strokeStyle = 'rgba(122,58,48,0.72)';
    ptx.lineWidth = Math.max(1.2, R * 0.020);
    ptx.lineCap = 'round';
    ptx.beginPath();
    ptx.moveTo(cx - R * 0.16, cy + R * 0.56);
    ptx.quadraticCurveTo(cx - R * 0.02, cy + R * 0.50, cx + R * 0.16, cy + R * 0.55);
    ptx.stroke();
    ptx.strokeStyle = 'rgba(196,120,104,0.52)';
    ptx.lineWidth = Math.max(1, R * 0.014);
    ptx.beginPath();
    ptx.moveTo(cx - R * 0.15, cy + R * 0.585);
    ptx.quadraticCurveTo(cx + R * 0.01, cy + R * 0.65, cx + R * 0.15, cy + R * 0.585);

    var jh = ptx.createRadialGradient(cx + R * 0.10, cy + R * 0.76, 0, cx + R * 0.10, cy + R * 0.76, R * 0.24);
    jh.addColorStop(0, 'rgba(255,212,160,0.22)');
    jh.addColorStop(1, 'rgba(255,212,160,0)');
    ptx.fillStyle = jh;
    ptx.fillRect(cx - R * 0.2, cy + R * 0.5, R * 0.7, R * 0.5);

    // neck: collarbone shadows
    ptx.strokeStyle = 'rgba(0,0,0,0.35)';
    ptx.lineWidth = Math.max(1.2, R * 0.024);
    ptx.beginPath();
    ptx.moveTo(cx - R * 0.28, cy + R * 0.96);

    ptx.moveTo(cx + R * 0.28, cy + R * 0.96);

    ptx.stroke();

    shl.addColorStop(0, 'rgba(255,208,148,0.22)');
    shl.addColorStop(1, 'rgba(0,0,0,0)');

    ptx.fillRect(cx, cy, R * 5, R * 4);
    ptx.restore();

    // ---- rim light along the silhouette
    ptx.save();
    headPath(ptx, cx, cy, R);
    var rim = ptx.createLinearGradient(cx - R * 0.95, cy, cx + R * 0.95, cy + R * 0.8);
    rim.addColorStop(0, 'rgba(72,116,196,0.34)');
    rim.addColorStop(0.30, 'rgba(72,116,196,0)');
    rim.addColorStop(0.60, 'rgba(255,196,120,0.05)');
    rim.addColorStop(0.85, 'rgba(255,216,154,0.94)');
    rim.addColorStop(1, 'rgba(255,238,200,0.60)');
    ptx.strokeStyle = rim;
    ptx.lineWidth = Math.max(1.6, R * 0.032);
    ptx.shadowColor = 'rgba(255,190,110,0.55)';
    ptx.shadowBlur = R * 0.30;
    ptx.stroke();
    ptx.restore();

    // ---- visor sunglasses
    var vw = R * 1.72, vh = R * 0.44, vx = cx - vw * 0.5, vy = cy - R * 0.25;
    ptx.save();
    rr(ptx, vx, vy, vw, vh, vh * 0.34);
    var lens = ptx.createLinearGradient(vx, vy, vx + vw, vy + vh);
    lens.addColorStop(0, 'rgba(5,9,16,0.99)');
    lens.addColorStop(0.38, 'rgba(15,25,42,0.97)');
    lens.addColorStop(0.60, 'rgba(44,58,86,0.95)');
    lens.addColorStop(0.76, 'rgba(11,17,29,0.98)');
    lens.addColorStop(1, 'rgba(3,5,9,1)');
    ptx.fillStyle = lens;
    ptx.fill();

    ptx.save();
    rr(ptx, vx, vy, vw, vh, vh * 0.34);
    ptx.clip();
    var gl = ptx.createLinearGradient(vx + vw * 0.50, vy, vx + vw * 0.74, vy + vh);
    gl.addColorStop(0, 'rgba(255,255,255,0)');
    gl.addColorStop(0.44, 'rgba(216,234,255,0.44)');
    gl.addColorStop(0.52, 'rgba(255,255,255,0.10)');
    gl.addColorStop(0.72, 'rgba(255,255,255,0)');
    ptx.fillStyle = gl;
    ptx.fillRect(vx, vy, vw, vh);
    ptx.restore();

    rr(ptx, vx, vy, vw, vh, vh * 0.34);
    ptx.strokeStyle = goldA;
    ptx.lineWidth = Math.max(1.6, R * 0.028);
    ptx.stroke();
    rr(ptx, vx + R * 0.033, vy + R * 0.033, vw - R * 0.066, vh - R * 0.066, vh * 0.30);
    ptx.strokeStyle = 'rgba(255,238,200,0.32)';
    ptx.lineWidth = Math.max(0.8, R * 0.010);
    ptx.stroke();

    ptx.strokeStyle = 'rgba(214,168,94,0.86)';
    ptx.lineWidth = Math.max(1.4, R * 0.022);
    ptx.beginPath();
    ptx.moveTo(vx + vw, vy + vh * 0.30);
    ptx.lineTo(cx + R * 0.84, vy + vh * 0.16);
    ptx.moveTo(vx, vy + vh * 0.30);
    ptx.lineTo(cx - R * 0.84, vy + vh * 0.16);
    ptx.stroke();
    ptx.restore();

    // ---- stacked hoops (hero jewellery)
    var hx = cx + R * 0.87, hy = cy + R * 0.40;
    for (var i = 0; i < 3; i++) {
      var hr = R * (0.29 - i * 0.082);
      ptx.beginPath();
      ptx.arc(hx + i * R * 0.02, hy + i * R * 0.03, hr, -0.62, Math.PI * 1.36);
      ptx.strokeStyle = i === 0 ? goldA : 'rgba(240,198,126,0.88)';
      ptx.lineWidth = Math.max(1.6, R * (0.030 - i * 0.006));
      ptx.shadowColor = 'rgba(255,190,110,0.55)';
      ptx.shadowBlur = R * 0.16;
      ptx.stroke();
    }
    ptx.shadowBlur = 0;

    // ---- torque collar
    ptx.beginPath();
    ptx.ellipse(cx, cy + R * 1.31, R * 0.46, R * 0.150, 0, 0.10 * Math.PI, 0.90 * Math.PI);
    ptx.strokeStyle = goldA;
    ptx.lineWidth = Math.max(2, R * 0.060);
    ptx.shadowColor = 'rgba(255,190,110,0.45)';
    ptx.shadowBlur = R * 0.18;
    ptx.stroke();
    ptx.strokeStyle = 'rgba(255,248,220,0.55)';
    ptx.lineWidth = Math.max(0.9, R * 0.013);
    ptx.beginPath();
    ptx.ellipse(cx, cy + R * 1.31, R * 0.46, R * 0.150, 0, 0.16 * Math.PI, 0.84 * Math.PI);
    ptx.stroke();
    ptx.shadowBlur = 0;

    // ---- chain of beads
    ptx.fillStyle = 'rgba(238,196,126,0.95)';
    for (var c = 0; c <= 22; c++) {
      var tt = c / 22;
      var px2 = cx + (tt - 0.5) * 2.20 * R;
      var py2 = cy + R * 1.74 + Math.sin(Math.PI * tt) * R * 0.30;
      ptx.beginPath();
      ptx.arc(px2, py2, R * (0.024 + 0.012 * Math.sin(Math.PI * tt)), 0, Math.PI * 2);
      ptx.fill();
    }

    // dissolve the torso base into the studio darkness (no hard cut-off line)
    var baseY = cy + BOTMUL * R;
    ptx.globalCompositeOperation = 'destination-out';
    var fade = ptx.createLinearGradient(0, baseY - R * 1.15, 0, baseY);
    fade.addColorStop(0, 'rgba(0,0,0,0)');
    fade.addColorStop(0.55, 'rgba(0,0,0,0.55)');
    fade.addColorStop(1, 'rgba(0,0,0,1)');
    ptx.fillStyle = fade;
    ptx.fillRect(0, baseY - R * 1.15, W, R * 1.2);
    ptx.globalCompositeOperation = 'source-over';
  }

  /* ================= layout ================= */
  function resize() {
    var w = window.innerWidth || 1440;
    var h = window.innerHeight || 900;
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    dpr = window.devicePixelRatio || 1;
    if (!isFinite(dpr) || dpr < 1) dpr = 1;
    dpr = Math.min(dpr, 2, Math.sqrt(4200000 / Math.max(1, w * h)));
    dpr = Math.max(1, dpr);
    W = Math.round(w); H = Math.round(h);
    cv.width = Math.max(2, Math.round(W * dpr));
    cv.height = Math.max(2, Math.round(H * dpr));
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    bg.width = cv.width; bg.height = cv.height;
    pt.width = cv.width; pt.height = cv.height;
    computeFace();
    buildPalette();
    buildSprites();
    buildBackdrop();
    buildPortrait();
    curKey = '\u0000';
    renderLyric(true);
  }

  /* ================= lyric DOM ================= */
  function textOf(L) { return L && L.text ? String(L.text) : ''; }

  function timeForChar(L, i, total) {
    var ch = L.chars;
    if (ch && ch.length) return ch[Math.min(i, ch.length - 1)];
    var span = Math.max(0.3, L.dur || 3) * 0.86;
    return L.t + span * (i / Math.max(1, total));
  }

  function fitFont() {
    var box = Math.max(90, H * (narrow ? 0.235 : 0.30));
    for (var k = 0; k < 9; k++) {
      if (elCur.scrollHeight <= box) break;
      var fs = parseFloat(getComputedStyle(elCur).fontSize) || 40;
      if (fs <= 15) break;
      elCur.style.fontSize = (fs * 0.89).toFixed(1) + 'px';
    }
  }

  function resetFont() { elCur.style.fontSize = ''; }

  function renderLyric(force) {
    var n = state.lines.length;
    var idx = state.idx;

    if (!inited) {
      if (!force && lyricMode === 'standby') return;
      lyricMode = 'standby';
      elPrev.textContent = '';
      elCur.textContent = '';
      elNext.textContent = '';
      elHint.style.display = 'block';
      elHint.textContent = 'STANDBY';
      elEmpty.style.display = 'none';
      spans = []; spanT = []; litPtr = 0;
      curKey = 'standby';
      if (force) {
        elCur.textContent = '';
      }
      return;    }

    if (!n) {
      if (!force && lyricMode === 'empty') return;
      lyricMode = 'empty';
      elPrev.textContent = '';
      elCur.textContent = '';
      elNext.textContent = '';
      elHint.style.display = 'none';
      elEmpty.style.display = 'block';
      spans = []; spanT = []; litPtr = 0;
      return;
    }
    elEmpty.style.display = 'none';
    elHint.style.display = 'block';

    if (idx < 0) {
      if (!force && lyricMode === 'intro') return;
      lyricMode = 'intro';
      elPrev.textContent = '';
      elCur.textContent = '';
      resetFont();
      var first = state.lines[0];
      elNext.textContent = textOf(first).slice(0, 80);
      elHint.textContent = 'INTRO';
      spans = []; spanT = []; litPtr = 0;
      curKey = 'intro';
      return;
    }

    var L = state.lines[idx];
    var txt = textOf(L);
    if (!force && lyricMode === 'line' && curKey === idx + ':' + txt.length) return;

    lyricMode = 'line';
    curKey = idx + ':' + txt.length;
    elHint.textContent = 'N° ' + (idx + 1) + ' / ' + state.lines.length;

    var pv = state.lines[idx - 1];
    elPrev.textContent = pv ? textOf(pv).slice(0, 90) : '';
    var nx = state.lines[idx + 1];
    elNext.textContent = nx ? textOf(nx).slice(0, 90) : '';

    elCur.textContent = '';
    spans = []; spanT = []; litPtr = 0;
    resetFont();

    if (!txt) return;
    var caps = Math.min(txt.length, 260);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < caps; i++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = txt.charAt(i);
      frag.appendChild(s);
      spans.push(s);
      spanT.push(timeForChar(L, i, txt.length));
    }
    elCur.appendChild(frag);
    fitFont();

    if (state.t >= L.t) advanceChars(true);
  }

  function advanceChars() {
    var t = state.t + 0.015;
    var guard = 0;
    var changed = false;
    while (litPtr < spans.length && spanT[litPtr] <= t && guard < 400) {
      spans[litPtr].classList.add('on');
      litPtr++;
      guard++;
      changed = true;
    }
    if (!changed) return;
    var ni = litPtr - 1;
    if (ni >= 0 && ni < spans.length) spans[ni].classList.add('now');
    var oi = litPtr - 2;
    if (oi >= 0 && oi < spans.length && oi !== ni) spans[oi].classList.remove('now');
  }

  /* ================= protocol ================= */
  function applyInit(p) {
    if (!p || typeof p !== 'object') return;
    var song = p.song || {};
    var nm = song.name ? String(song.name) : '';
    var ar = song.artists;
    if (Array.isArray(ar)) ar = ar.filter(Boolean).join(' · ');
    ar = ar ? String(ar) : '';
    elTitle.textContent = (nm || 'ONYX / GILT').slice(0, 48);
    elArtist.textContent = (ar || 'STUDIO N°135').slice(0, 60);

    duration = Math.max(0, Number(p.duration) || 0);
    if (Array.isArray(p.accent) && p.accent.length >= 3) {
      var a = [];
      for (var q = 0; q < 3; q++) {
        var v = Number(p.accent[q]);
        a.push(isFinite(v) ? Math.max(0, Math.min(255, Math.round(v))) : 128);
      }
      accent = a;
      buildPalette();
      buildSprites();
    }

    var raw = Array.isArray(p.lines) ? p.lines : [];
    var out = [];
    var lim = Math.min(raw.length, 5000);
    for (var i = 0; i < lim; i++) {
      var L = raw[i];
      if (!L || typeof L !== 'object') continue;
      var t = Number(L.t);
      if (!isFinite(t) || t < 0) t = 0;
      var txt = (L.text === null || L.text === undefined) ? '' : String(L.text);
      var arr = Array.isArray(L.chars) ? L.chars : null;
      var chars = null;
      if (arr && arr.length) {
        chars = [];
        var cap = Math.min(arr.length, 300, Math.max(1, txt.length || 1));
        for (var j = 0; j < cap; j++) {
          var c = arr[j];
          var ct = c ? Number(c.t) : NaN;
          chars.push(isFinite(ct) ? Math.max(0, ct) : t);
        }
        if (!chars.length) chars = null;
      }
      out.push({ t: t, dur: Math.max(0.25, Number(L.dur) || 0), text: txt, chars: chars });
    }
    out.sort(function (a2, b2) { return a2.t - b2.t; });
    state.lines = out;
    state.idx = -1;
    state.text = '';
    lastT = -1;
    inited = true;
    renderLyric(true);
  }

  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') applyInit(d.payload);
      else if (d.type === 'tick') {
        var tp = d.payload || {};
        var nt = Number(tp.time);
        if (isFinite(nt) && nt >= 0) state.t = nt;
        if (typeof tp.playing === 'boolean') state.playing = tp.playing;
      } else if (d.type === 'beat') {
        var bp = d.payload || {};
        beatE.index = Number(bp.index) || 0;
        var bl = Number(bp.level);
        beatE.level = isFinite(bl) ? clamp01(bl) : 0.5;
        beatE.at = performance.now();
      } else if (d.type === 'live') {
        var lp = d.payload || {};
        liveE.bpm = Number(lp.bpm) || 0;
        var keys = ['level', 'bass', 'mid', 'treble'];
        for (var kk = 0; kk < keys.length; kk++) {
          var lv = Number(lp[keys[kk]]);
          if (isFinite(lv)) liveE[keys[kk]] = clamp01(lv);
        }
        if (typeof lp.playing === 'boolean') liveE.playing = lp.playing;
      }
    } catch (e) { logErr('message', e); }
  });

  /* ================= frame ================= */
  var tickAngles = [];
  (function () {
    for (var i = 0; i < 44; i++) tickAngles.push(-Math.PI * 0.92 + (i / 43) * Math.PI * 1.84);
  })();

  var DUST = [];
  (function () {
    for (var i = 0; i < 26; i++) {
      var s1 = Math.sin(i * 91.7) * 4375.85;
      var s2 = Math.sin(i * 37.3) * 9123.41;
      DUST.push({
        x0: 0.06 + (s1 - Math.floor(s1)) * 0.88,
        y0: (s2 - Math.floor(s2)) * 1.2,
        r: 0.05 + (i % 5) * 0.02,
        sp: 0.012 + (i % 7) * 0.004,
        ph: i * 1.37
      });
    }
  })();

  function fmtTime(s) {
    s = Math.max(0, Math.floor(s || 0));
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function idxAt(t) {
    var L = state.lines, n = L.length;
    if (!n) return -1;
    var lo = 0, hi = n - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (L[mid].t <= t) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  function updateIdx() {
    var idx = idxAt(state.t + 0.015);
    if (idx !== state.idx) {
      state.idx = idx;
      renderLyric(false);
    }
    state.text = (idx >= 0 && state.lines[idx]) ? textOf(state.lines[idx]) : '';
    if (state.t < lastT - 0.45) { renderLyric(true); }
    lastT = state.t;
    if (lyricMode === 'line') advanceChars();
  }

  function drawRing(now, cx, cy, R, kick, treble) {
    var rot = state.rm ? 0 : (now / 26000) * Math.PI * 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    // hairline oval, off to the left of the head so it frames the lyric column
    ctx.strokeStyle = 'rgba(246,206,140,' + (0.20 + treble * 0.22 + kick * 0.14).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, R * 0.0055);
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 1.52, R * 1.66, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    for (var i = 0; i < tickAngles.length; i++) {
      var a = tickAngles[i];
      var r1 = R * 1.545, r2 = R * (1.60 + (i % 4 === 0 ? 0.075 : 0.022));
      var ca = Math.cos(a), sa = Math.sin(a);
      ctx.moveTo(ca * r1, sa * r1 * 1.09);
      ctx.lineTo(ca * r2, sa * r2 * 1.09);
    }
    ctx.strokeStyle = 'rgba(250,216,158,' + (0.26 + treble * 0.30 + kick * 0.12).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, R * 0.0055);
    ctx.stroke();
    ctx.restore();
  }

  function drawSpectrum(cx, cy, R, lvl) {
    // small vertical meter hugging the right shoulder, always inside the frame border
    var n = 14;
    var bw = Math.max(2, W * 0.0022);
    var gap = bw * 2.0;
    var total = n * bw + (n - 1) * gap;
    var margin = Math.max(24, W * 0.055);
    var x0 = Math.min(narrow ? W * 0.84 : cx + R * 1.30, W - margin - total);
    if (x0 < margin) x0 = margin;
    var yb = H * 0.70;
    var tnow = performance.now();
    for (var i = 0; i < n; i++) {
      var v = clamp01(lvl * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.7 + tnow / 620))));
      var hh = Math.max(2, v * H * 0.12);
      ctx.fillStyle = 'rgba(246,204,138,' + (0.18 + v * 0.42).toFixed(3) + ')';
      ctx.fillRect(x0 + i * (bw + gap), yb - hh, bw, hh);
    }
  }

  function drawGlows(now, cx, cy, R) {
    var bass = liveE.bass, lvl = liveE.level, tre = liveE.treble;
    var since = (now - beatE.at) / 1000;
    var kick = Math.max(0, 1 - since * 3.2) * (0.35 + beatE.level * 0.65);
    if (state.rm) kick *= 0.30;
    var breath = 0.5 + 0.5 * Math.sin(now / 2800);

    ctx.globalCompositeOperation = 'lighter';

    // key halo
    var hx = cx + R * 0.58, hy = cy - R * 0.62;
    var hr = R * (2.05 + bass * 0.40 + kick * 0.26);
    if (haloSprite) {
      ctx.globalAlpha = clamp01(0.24 + lvl * 0.20 + kick * 0.24 + breath * 0.05);
      ctx.drawImage(haloSprite, hx - hr, hy - hr, hr * 2, hr * 2);
    }

    // skin speculars
    var gx = cx + R * 0.42, gy = cy - R * 0.02;
    var gr = R * (0.52 + bass * 0.14 + kick * 0.12);
    if (glintSprite) {
      ctx.globalAlpha = clamp01(0.10 + lvl * 0.10 + kick * 0.20);
      ctx.drawImage(glintSprite, gx - gr, gy - gr, gr * 2, gr * 2);
      var fr = R * 0.40;
      ctx.globalAlpha = clamp01(0.05 + lvl * 0.05 + kick * 0.06);
      ctx.drawImage(glintSprite, cx + R * 0.04 - fr, cy - R * 0.64 - fr, fr * 2, fr * 2);
    }

    // hoop glints
    var hox = cx + R * 0.87, hoy = cy + R * 0.40;
    if (glintSprite) {
      for (var i = 0; i < 3; i++) {
        var tw = Math.abs(Math.sin(now / 940 + i * 1.9));
        var rr2 = R * (0.15 + kick * 0.13);
        ctx.globalAlpha = clamp01((0.22 + 0.78 * tw) * (0.30 + kick * 0.55));
        ctx.drawImage(glintSprite, hox - R * 0.26 + i * R * 0.03 - rr2, hoy - R * 0.30 + i * R * 0.02 - rr2, rr2 * 2, rr2 * 2);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // visor sweep — translated sprite, no per-frame gradient
    var vw = R * 1.72, vh = R * 0.44, vx = cx - vw * 0.5, vy = cy - R * 0.25;
    if (!state.rm && sweepSprite) {
      var sweep = ((now / 6400) % 1.7) - 0.35;
      ctx.save();
      rr(ctx, vx, vy, vw, vh, vh * 0.34);
      ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp01(0.30 + kick * 0.55);
      ctx.drawImage(sweepSprite, vx + vw * sweep, vy, sweepW, sweepH);
      ctx.restore();
    }
  }

  function drawDust(now, cx, cy, R) {
    if (state.rm || !glintSprite) return;
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < DUST.length; i++) {
      var d = DUST[i];
      var yy = ((d.y0 - (now / 1000) * d.sp) % 1.35 + 1.35) % 1.35 - 0.15;
      var xx = d.x0 + Math.sin(now / (3400 + i * 90) + d.ph) * 0.022;
      var a = 0.06 + 0.20 * Math.abs(Math.sin(now / (1500 + i * 60) + d.ph));
      var rr2 = R * d.r;
      ctx.globalAlpha = a;
      ctx.drawImage(glintSprite, xx * W - rr2, yy * H - rr2, rr2 * 2, rr2 * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    requestAnimationFrame(frame);
    state.frames++;
    if (state.frames === 1) sendReady();
    var t0 = performance.now();
    try {
      updateIdx();

      var cx = face.cx, cy = face.cy, R = face.R;
      var since = (now - beatE.at) / 1000;
      var kick = Math.max(0, 1 - since * 3.2) * (0.35 + beatE.level * 0.65);
      if (state.rm) kick *= 0.3;

      var ox = state.rm ? 0 : Math.sin(now / 5200) * R * 0.014;
      var oy = state.rm ? 0 : (-liveE.bass * R * 0.022 - kick * R * 0.012);

      ctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalAlpha = 1;
      ctx.drawImage(bg, 0, 0, W, H);
      drawDust(now, cx, cy, R);

      ctx.save();
      ctx.translate(ox, oy);
      drawRing(now, cx, cy, R, kick, liveE.treble);
      // blit only the portrait's bounding box, never the full frame
      ctx.drawImage(
        pt,
        face.bx * dpr, face.by * dpr, face.bw * dpr, face.bh * dpr,
        face.bx, face.by, face.bw, face.bh
      );
      drawGlows(now, cx, cy, R);
      ctx.restore();

      drawSpectrum(cx, cy, R, liveE.level);

      var clk = fmtTime(state.t);
      if (clk !== lastClock) {
        lastClock = clk;
        elTime.textContent = clk;
        elState.textContent = state.playing ? 'LIVE' : 'HOLD';
      }
      var prog = duration > 0 ? clamp01(state.t / duration) : 0;
      var progQ = Math.round(prog * 400) / 400;
      if (progQ !== lastProg) {
        lastProg = progQ;
        elProg.style.width = (prog * 100).toFixed(2) + '%';
      }
    } catch (e) {
      state.err = String((e && e.message) || e);
      logErr('frame', e);
    }
    state.js = performance.now() - t0;
  }

  window.__stage = function () {
    return {
      lines: state.lines.length,
      idx: state.idx,
      t: state.t,
      playing: state.playing,
      frames: state.frames,
      js: state.js,
      err: state.err,
      text: state.text,
      gl: false,
      rm: state.rm
    };
  };

  window.addEventListener('resize', function () {
    try { resize(); } catch (e) { logErr('resize', e); }
  });

  try {
    resize();
  } catch (e) {
    logErr('boot', e);
  }
  setTimeout(sendReady, 800);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
