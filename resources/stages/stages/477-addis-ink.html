<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阿迪斯金痕</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#140b07;overflow:hidden}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #ui{position:fixed;inset:0;z-index:2;pointer-events:none;
      font-family:"Noto Sans Ethiopic","Ebrima","Nyala","Kefa","Abyssinica SIL",
                  "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
      color:#2b140c}

  /* ---------- title, top-left ---------- */
  #titlebar{position:absolute;left:4.6%;top:5%;max-width:44%}
  #tAm{display:block;font-size:clamp(9px,.86vw,14px);letter-spacing:.30em;font-weight:700;
       color:#7a2f1d;margin-bottom:.7em;text-shadow:0 1px 0 rgba(255,244,216,.6)}
  #tLa{display:block;font-size:clamp(16px,1.95vw,32px);font-weight:800;letter-spacing:.13em;
       line-height:1.08;color:#2a1008;text-transform:uppercase;overflow-wrap:anywhere;
       text-shadow:0 1px 0 rgba(255,248,226,.55),0 12px 26px rgba(60,20,8,.18)}
  #tRule{display:block;height:3px;width:clamp(38px,6.4vw,110px);margin:.6em 0 .5em;
         background:linear-gradient(90deg,#a1361f,rgba(161,54,31,0))}
  #tSub{display:block;font-size:clamp(8px,.74vw,11px);letter-spacing:.36em;font-weight:700;
        color:#8a4525;max-width:26ch;overflow-wrap:anywhere}

  /* ---------- footer mark, bottom-left ---------- */
  #gmark{position:absolute;left:4.6%;bottom:4.6%;font-size:clamp(8px,.72vw,11px);
         letter-spacing:.34em;font-weight:700;color:#f2d9a8;opacity:.86;
         text-shadow:0 2px 8px rgba(20,6,2,.9)}
  #gmark b{display:block;font-size:clamp(11px,1.05vw,16px);letter-spacing:.26em;
           color:#ffedc8;margin-bottom:.45em;font-weight:800}

  /* ---------- lyric card, right ---------- */
  #lyric{position:absolute;left:44%;right:4.2%;top:50%;transform:translateY(-50%)}
  #card{position:relative;padding:clamp(15px,1.7vw,30px) clamp(16px,2vw,34px) clamp(13px,1.3vw,22px);
        background:linear-gradient(157deg,rgba(46,19,11,.95) 0%,rgba(29,11,6,.93) 58%,rgba(21,8,4,.95) 100%);
        border-left:5px solid #c8892f;
        box-shadow:0 30px 74px rgba(0,0,0,.46),inset 0 0 0 1px rgba(240,206,132,.16);
        border-radius:2px}
  #lyMeta{display:flex;align-items:center;gap:.7em;margin-bottom:.72em;
          font-size:clamp(8px,.68vw,11px);letter-spacing:.36em;font-weight:800;color:#e2a44c}
  #lyMeta i{display:block;width:clamp(14px,2.2vw,32px);height:2px;background:#c8892f;opacity:.9}
  #lyBody{position:relative;min-height:clamp(52px,6.4vw,116px);display:flex;align-items:center}
  #lyWrap{position:relative;width:100%;font-size:clamp(20px,2.15vw,39px);line-height:1.5;font-weight:800;
          letter-spacing:.01em;color:#fff5e4;word-break:break-word;overflow-wrap:anywhere;
          text-shadow:0 2px 0 rgba(26,7,3,.9),0 4px 12px rgba(16,4,2,.85),0 12px 34px rgba(10,2,1,.75)}
  #lyWrap.dense{font-size:clamp(16px,1.62vw,30px);line-height:1.42}
  #lyWrap .c{color:#e5c39c;opacity:.62;transition:opacity .22s linear,color .22s linear}
  #lyWrap .c.on{color:#fffaf0;opacity:1;
       text-shadow:0 2px 0 rgba(28,8,3,.92),0 6px 14px rgba(16,4,2,.8),
                  .05em -.04em 0 rgba(206,138,64,.62)}
  #lyIdle{position:absolute;left:0;top:50%;transform:translateY(-50%);display:none;
          align-items:center;gap:.85em;font-size:clamp(12px,1.1vw,18px);letter-spacing:.44em;
          font-weight:800;color:#e2a44c;opacity:.9}
  #lyIdle s{display:block;width:1.5em;height:1.5em;border:2px solid #c8892f;
            border-radius:50%;text-decoration:none;position:relative;flex:0 0 auto}
  #lyIdle s::after{content:'';position:absolute;inset:34% 34%;border-radius:50%;background:#c8892f}
  #lyEmpty{display:none;align-items:center;gap:1em;font-size:clamp(11px,1vw,15px);font-weight:700;
           letter-spacing:.30em;color:#e2a44c;opacity:.9}
  #lyEmpty b{font-size:clamp(28px,3.2vw,54px);letter-spacing:.06em;color:#c8892f;opacity:.95;
             line-height:1;font-weight:400}
  #lyFoot{margin-top:1.1em;padding-top:.85em;border-top:1px solid rgba(240,206,132,.22);
          display:flex;align-items:center;justify-content:space-between;gap:.8em;
          font-size:clamp(8px,.66vw,10px);letter-spacing:.28em;font-weight:800;color:#d9a468}
  #cArtist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56%}
  #clock{white-space:nowrap;color:#f0cf95}
  #meter{position:relative;height:5px;margin-top:.9em;background:rgba(240,206,132,.16);
         border-radius:1px;overflow:hidden}
  #mFill{position:absolute;left:0;top:0;bottom:0;width:0%;
         background:linear-gradient(90deg,#a1361f,#e2a44c 62%,#ffedc8)}
  #mPeak{position:absolute;top:-1px;bottom:-1px;width:2px;left:0;background:#ffedc8;opacity:.55}

  #card.in{animation:cardIn .52s cubic-bezier(.2,.7,.3,1) both}
  @keyframes cardIn{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

  @media (max-aspect-ratio: 82/100){
    #titlebar{left:6%;top:4%;max-width:82%}
    #tLa{font-size:clamp(15px,4.4vw,25px);letter-spacing:.1em}
    #tSub{font-size:8px;letter-spacing:.28em}
    #gmark{display:none}
    #lyric{left:0;right:0;top:auto;bottom:0;transform:none}
    #card{padding:5vw 6vw 4.4vw;border-left:0;border-top:4px solid #c8892f;
          background:linear-gradient(180deg,rgba(48,20,12,.90) 0%,rgba(25,10,5,.96) 38%,rgba(18,7,3,.985) 100%);
          box-shadow:0 -30px 66px rgba(0,0,0,.5)}
    #lyWrap{font-size:clamp(22px,5.6vw,34px);line-height:1.44}
    #lyWrap.dense{font-size:clamp(17px,4.3vw,26px)}
  }
  @media (max-aspect-ratio: 82/100) and (max-height: 560px){
    #titlebar{top:3%}
    #tAm{display:none}
    #lyWrap{font-size:clamp(19px,4.6vw,26px)}
    #lyMeta{margin-bottom:.4em}
    #lyFoot{margin-top:.6em;padding-top:.5em}
  }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="ui">
  <div id="titlebar">
    <span id="tAm">አዲስ አበባ</span>
    <span id="tLa"></span>
    <span id="tRule"></span>
    <span id="tSub">GOLDEN AGE · SIDE A</span>
  </div>

  <div id="gmark"><b>አዲስ አበባ</b>ADDIS ABABA · 1973</div>

  <div id="lyric">
    <div id="card">
      <div id="lyMeta"><i></i><span id="lyTag">LYRIC</span></div>
      <div id="lyBody">
        <div id="lyWrap"></div>
        <div id="lyIdle"><s>◌</s><span id="lyIdleTxt">待奏</span></div>
        <div id="lyEmpty"><b>∷</b><span>纯器乐 · 无词</span></div>
      </div>
      <div id="lyFoot"><span id="cArtist"></span><span id="clock">0:00</span></div>
      <div id="meter"><i id="mFill"></i><b id="mPeak"></b></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv');
  var ctx = null;
  try { ctx = cv ? cv.getContext('2d', { alpha: false }) : null; }
  catch (e) { console.error('[477] ctx', e); }

  var elTitle = $('tLa'), elTitleAm = $('tAm'), elSub = $('tSub');
  var elCard = $('card'), elWrap = $('lyWrap'), elEmpty = $('lyEmpty'), elTag = $('lyTag');
  var elIdle = $('lyIdle'), elIdleTxt = $('lyIdleTxt');
  var elArtist = $('cArtist'), elClock = $('clock');
  var elFill = $('mFill'), elPeak = $('mPeak');

  /* ================= state (read by __stage) ================= */
  var S = { lines: [], idx: -1, t: 0, dur: 0, playing: true, frames: 0, js: 0 };

  var W = 1440, H = 900, DPR = 1, PS = 1;
  var bgC = null, bgX = null;              // paper plate
  var ghC = null, ghX = null;              // ghost-line plate
  var accent = [200, 137, 47];
  var songName = '', songArtists = '';
  var curLine = null, curChars = null, curDisp = '';
  var spanArr = [], revealN = 0, lastIdx = -2;
  var pen = null, bootAt = 0;
  var beatLvl = 0, beatAt = -1e9, glowB = 0;
  var live = { level: 0, bass: 0, mid: 0, treble: 0, bpm: 0, at: -1e9 };
  var lvSmooth = 0, peakShown = 0.4, peakFrom = 0.4;
  var readySent = false, firstLoop = true, lastClock = '';
  var rmq = (window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false });

  /* ================= self-check hook, top level, once ================= */
  window.__stage = function () {
    var ln = S.lines[S.idx];
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: Math.round(S.t * 1000) / 1000,
      playing: !!S.playing,
      frames: S.frames,
      js: Math.round(S.js * 100) / 100,
      err: '',
      text: ln ? String(ln.text || '') : '',
      gl: false,
      rm: !!(rmq && rmq.matches)
    };
  };

  /* ================= helpers ================= */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function num(v, d) { var x = +v; return isFinite(x) ? x : d; }
  function pad2(v) { return (v < 10 ? '0' : '') + v; }
  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + pad2(s);
  }
  function mk(w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    return c;
  }
  function rgba(a, al) { return 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + al + ')'; }
  function mix(a, b, k) {
    return [Math.round(a[0] + (b[0] - a[0]) * k), Math.round(a[1] + (b[1] - a[1]) * k),
      Math.round(a[2] + (b[2] - a[2]) * k)];
  }
  function hash(s) {
    var h = 2166136261, i; s = String(s || '');
    for (i = 0; i < s.length && i < 200; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rnd(seed) { var x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }

  var SYL = ['ሰ', 'ለ', 'ማ', 'ው', 'ነ', 'ሽ', 'ደ', 'ሪ', 'ጎ', 'ላ', 'ባ', 'ኝ', 'ታ', 'ር', 'ከ', 'ወ',
    'ስ', 'ዳ', 'ኒ', 'ሀ', 'ይ', 'መ', 'ት', 'ሳ', 'ጠ', 'ኖ', 'ሉ', 'ጪ', 'ሹ', 'ኩ', 'ሚ', 'ዛ'];
  var SEPS = ['፡', '፡', '፣', '፡'];
  /* real Amharic, used for the headline so it never reads as broken text */
  var AM = ['የወርቅ ዘመን', 'አዲስ አበባ', 'ኢትዮጵያ', 'የአዲስ አበባ ሌሊት'];

  function geWords(seed, count) {
    var out = [], i, j, len, w;
    count = Math.min(count | 0, 300);
    for (i = 0; i < count; i++) {
      len = 2 + Math.floor(rnd(seed + i * 3.17) * 3);
      w = '';
      for (j = 0; j < len; j++) {
        w += SYL[Math.floor(rnd(seed + i * 7.3 + j * 1.7) * 997) % SYL.length];
      }
      out.push(w);
    }
    return out;
  }
  function geLine(seed, maxChars) {
    var words = geWords(seed, 16), s = '', i = 0;
    while (i < words.length && s.length < maxChars) {
      s += words[i] + (i % 4 === 3 ? '  ' : SEPS[i % 4]);
      i++;
    }
    return s.slice(0, Math.max(0, maxChars));
  }

  /* ================= init (every init message) ================= */
  function str(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    return '';
  }

  function normLines(arr) {
    var out = [], i, j, m, L, txt, tt, dd, cs, cm, c;
    if (!arr || typeof arr.length !== 'number') return out;
    m = Math.min(arr.length, 600);
    for (i = 0; i < m; i++) {
      L = arr[i] || {};
      txt = str(L.text);
      tt = num(L.t, 0); if (tt < 0) tt = 0;
      dd = num(L.dur, 0); if (dd < 0) dd = 0;
      cs = null;
      if (L.chars && typeof L.chars.length === 'number' && L.chars.length) {
        cs = []; cm = Math.min(L.chars.length, 300);
        for (j = 0; j < cm; j++) {
          c = L.chars[j] || {};
          cs.push({ c: str(c.c), t: num(c.t, tt) });
        }
      }
      out.push({ t: tt, dur: dd, text: txt, chars: cs });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function init(p) {
    var pl = p || {};
    if (pl.accent && pl.accent.length >= 3) {
      var a = [clamp(num(pl.accent[0], 0), 0, 255), clamp(num(pl.accent[1], 0), 0, 255),
        clamp(num(pl.accent[2], 0), 0, 255)];
      if (a[0] + a[1] + a[2] > 40) accent = a;
    }
    var sg = pl.song || {};
    songName = str(sg.name);
    if (sg.artists && typeof sg.artists.length === 'number' && typeof sg.artists !== 'string') {
      var bits = [], i;
      for (i = 0; i < Math.min(sg.artists.length, 5); i++) bits.push(str(sg.artists[i]));
      songArtists = bits.join(' / ');
    } else songArtists = str(sg.artists);

    S.lines = normLines(pl.lines);
    S.dur = Math.max(0, num(pl.duration, 0));
    S.idx = -1; S.t = 0; S.playing = (pl.playing === undefined) ? true : !!pl.playing;
    pen = null; bootAt = performance.now();
    curLine = null; curChars = null; curDisp = ''; lastIdx = -2; lastClock = '';

    elTitle.textContent = songName || 'አዲስ አበባ';
    elTitleAm.textContent = AM[hash(songName || 'addis') % AM.length];
    elSub.textContent = songArtists ? songArtists.toUpperCase().slice(0, 60) : 'GOLDEN AGE · SIDE A';
    elArtist.textContent = songArtists ? songArtists.slice(0, 48) : 'ANONYMOUS';
    elTag.textContent = S.lines.length ? 'LYRIC · 33⅓' : 'INSTRUMENTAL';

    elEmpty.style.display = 'none';
    elIdle.style.display = 'none';
    elWrap.style.display = 'block';
    clearSpans();
    elWrap.textContent = '';

    plate();
    ghostPlate();
    if (!readySent) sendReady();
  }

  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[477] ready', e); }
  }

  /* a frame really ran: proves rAF is alive, not just that the timer fired */
  function alive() { if (!readySent) sendReady(); }

  /* ================= layout ================= */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = Math.max(240, Math.round(w));
    H = Math.max(260, Math.round(h));
    DPR = clamp(num(window.devicePixelRatio, 1), 1, 1.75);
    if (W * DPR > 2600) DPR = clamp(2600 / W, 1, 1.75);
    /* the plate is drawn once at extra resolution so the Ge'ez stays crisp */
    PS = clamp(DPR * 1.4, 1, 2);

    if (cv && ctx) {
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    if (!bgC) { bgC = mk(W * PS, H * PS); } else { bgC.width = Math.round(W * PS); bgC.height = Math.round(H * PS); }
    bgX = bgC.getContext('2d');
    bgX.setTransform(PS, 0, 0, PS, 0, 0);
    if (!ghC) { ghC = mk(W * PS, H * PS); } else { ghC.width = Math.round(W * PS); ghC.height = Math.round(H * PS); }
    ghX = ghC.getContext('2d');
    ghX.setTransform(PS, 0, 0, PS, 0, 0);

    plate();
    ghostPlate();
  }

  /* ================= plate: the printed sleeve ================= */
  var PORT = { x: 0.255, y: 0.545, r: 0.152 };   // fractions; r of min(W,H)

  function dots(col, r, gap) {
    var t = mk(gap, gap), x = t.getContext('2d');
    x.fillStyle = col;
    x.beginPath(); x.arc(gap / 2, gap / 2, r, 0, 6.2832); x.fill();
    return t;
  }

  function drawFigure(g) {
    var R = PORT.r * Math.min(W, H);
    var gold = mix(accent, [255, 214, 146], 0.5);
    var cx = W * PORT.x, cy = H * PORT.y;
    g.save();

    /* spotlight */
    var halo = g.createRadialGradient(cx, cy - R * 0.4, R * 0.3, cx, cy - R * 0.4, R * 5.2);
    halo.addColorStop(0, 'rgba(255,236,196,.42)');
    halo.addColorStop(0.42, rgba(mix(accent, [140, 52, 24], 0.5), 0.17));
    halo.addColorStop(1, 'rgba(70,26,10,0)');
    g.fillStyle = halo;
    g.fillRect(0, 0, W * 0.72, H);

    g.translate(cx, cy);

    /* ---- torso ---- */
    g.beginPath();
    g.moveTo(-R * 0.92, R * 0.66);
    g.bezierCurveTo(-R * 1.62, R * 1.06, -R * 1.94, R * 1.86, -R * 2.06, R * 3.9);
    g.lineTo(R * 2.06, R * 3.9);
    g.bezierCurveTo(R * 1.9, R * 1.80, R * 1.48, R * 1.02, R * 0.92, R * 0.64);
    g.closePath();
    var tg = g.createLinearGradient(-R * 1.6, R * 0.8, R * 1.4, R * 3.4);
    tg.addColorStop(0, '#2a0d06'); tg.addColorStop(.5, '#4d170c'); tg.addColorStop(1, '#2c0c05');
    g.fillStyle = tg; g.fill();
    /* lapel edge catches the stage light */
    g.beginPath();
    g.moveTo(-R * 0.86, R * 0.74);
    g.bezierCurveTo(-R * 1.5, R * 1.2, -R * 1.8, R * 2.0, -R * 1.92, R * 3.7);
    g.strokeStyle = 'rgba(255,220,168,.30)'; g.lineWidth = R * 0.06; g.stroke();

    /* ---- head ---- */
    g.beginPath();
    g.ellipse(-R * 0.03, 0, R * 0.70, R * 0.86, -0.10, 0, 6.2832);
    g.fillStyle = '#240b05'; g.fill();

    /* ---- collar ---- */
    g.beginPath();
    g.moveTo(-R * 0.52, R * 0.78); g.lineTo(R * 0.02, R * 1.62); g.lineTo(R * 0.58, R * 0.76);
    g.fillStyle = '#180703'; g.fill();

    /* ---- fedora ---- */
    g.beginPath();
    g.ellipse(-R * 0.02, -R * 0.66, R * 1.46, R * 0.25, -0.05, 0, 6.2832);
    g.fillStyle = '#1d0803'; g.fill();
    g.beginPath();
    g.moveTo(-R * 0.86, -R * 0.70);
    g.bezierCurveTo(-R * 0.80, -R * 1.86, R * 0.56, -R * 1.98, R * 0.84, -R * 0.70);
    g.closePath(); g.fillStyle = '#1a0703'; g.fill();
    g.beginPath();
    g.moveTo(-R * 0.80, -R * 0.80); g.lineTo(R * 0.80, -R * 0.86);
    g.strokeStyle = rgba(gold, 0.62); g.lineWidth = R * 0.085; g.stroke();

    /* ---- saxophone ---- */
    var sx = R * 0.16, sy = R * 0.42;      // neck at the mouth
    g.beginPath();
    g.moveTo(sx, sy);
    g.bezierCurveTo(sx + R * 0.62, sy + R * 0.42, R * 0.92, R * 1.10, R * 1.02, R * 1.58);
    g.strokeStyle = '#160502'; g.lineWidth = R * 0.30; g.lineCap = 'round'; g.stroke();
    g.strokeStyle = 'rgba(255,224,172,.20)'; g.lineWidth = R * 0.10; g.stroke();

    /* bell: a flared cone opening up-right, dark mouth */
    g.save();
    g.translate(R * 0.95, R * 1.50);
    g.rotate(-1.06);
    g.beginPath();
    g.moveTo(-R * 0.30, R * 0.11);
    g.quadraticCurveTo(R * 0.06, R * 0.26, R * 0.36, R * 0.43);
    g.lineTo(R * 0.36, -R * 0.43);
    g.quadraticCurveTo(R * 0.06, -R * 0.26, -R * 0.30, -R * 0.11);
    g.closePath();
    var bg2 = g.createLinearGradient(-R * 0.3, 0, R * 0.36, 0);
    bg2.addColorStop(0, 'rgba(255,232,186,.97)');
    bg2.addColorStop(0.5, rgba(mix(accent, [255, 208, 140], 0.62), 0.96));
    bg2.addColorStop(1, rgba(mix(accent, [110, 36, 14], 0.28), 0.97));
    g.fillStyle = bg2; g.fill();
    g.beginPath();
    g.ellipse(R * 0.34, 0, R * 0.13, R * 0.40, 0, 0, 6.2832);
    g.fillStyle = 'rgba(22,6,2,.92)'; g.fill();

  /* ================= ghost plate: previous lines, doubled print ================= */

    for (i = 0; i < lim; i++) {

      if (ch === '\n') { out.push(line); line = ''; if (out.length > 5) break; continue; }
      if (g.measureText(line + ch).width > maxW && line.length) { out.push(line); line = ch; }
      else line += ch;
      if (out.length > 5) break;
    }
    if (line && out.length < 6) out.push(line);
    return out;
  }

      g.font = '800 ' + fs.toFixed(1) + 'px "Noto Sans Ethiopic","PingFang SC",sans-serif';
      rows = wrapRows(g, pl.text, maxW);

  /* ================= lyric DOM ================= */
  function clearSpans() {

    var arr = (typeof Array.from === 'function') ? Array.from(text) : text.split('');
    var lim = Math.min(arr.length, 160), i, sp;
    for (i = 0; i < lim; i++) {
      sp = document.createElement('span');
      sp.className = 'c';
      sp.textContent = arr[i];
      frag.appendChild(sp);
      spanArr.push(sp);
    }
    if (arr.length > lim) {
      sp = document.createElement('span');
      sp.className = 'c';
      sp.textContent = arr.slice(lim).join('');
      frag.appendChild(sp);
      spanArr.push(sp);
    }
    elWrap.appendChild(frag);
    revealN = 0;
    elWrap.className = (text.length > 30) ? 'dense' : '';
  }

    if (k === revealN) return;
    var i, lo, hi;
    if (k > revealN) { lo = revealN; hi = Math.min(k, revealN + 48); }
    else { lo = k; hi = revealN; }
    for (i = lo; i < hi; i++) {

      else hi = mid - 1;

  }

  function updateLyric() {
    var idx = idxAt(S.t);

      var ln = (idx >= 0 && idx < S.lines.length) ? S.lines[idx] : null;
      curLine = ln;
      var hasLines = S.lines.length > 0;
      if (!ln) {
        curDisp = ''; curChars = null;
        clearSpans(); elWrap.textContent = '';
        /* before the first line, and between lines: say something, don't show an empty box */
        elEmpty.style.display = (!hasLines && idx < 0) ? 'flex' : 'none';
        elIdle.style.display = (!hasLines) ? 'none' : 'flex';
        if (elIdleTxt && hasLines) {
          elIdleTxt.textContent = (idx < 0) ? '待奏 · STAND BY'
            : (idx >= S.lines.length - 1 ? '间奏 · INTERLUDE' : '间奏 · INTERLUDE');
        }
        elWrap.style.display = 'none';
        elTag.textContent = hasLines ? 'LYRIC · 33⅓' : 'INSTRUMENTAL';

        if (ln.chars && ln.chars.length) {

        if (elCard) {

  /* ================= messages ================= */

      var q = d.payload;

        var t = Math.max(0, num(q.time, S.t));

      } else if (d.type === 'beat') {

        beatAt = performance.now();

      } else if (d.type === 'live') {

        live.bass = clamp(num(q.bass, 0), 0, 1);
        live.mid = clamp(num(q.mid, 0), 0, 1);
        live.treble = clamp(num(q.treble, 0), 0, 1);
        live.bpm = num(q.bpm, 0);

    }

    /* dust drift */
    if (!rmq.matches) {
      var i, dx, dy;
      for (i = 0; i < 4; i++) {
        dx = ((rnd(i * 3.1 + 1) * W) + now * (0.012 + i * 0.006)) % W;
        dy = (rnd(i * 7.7 + 1) * H + Math.sin(now / 2300 + i * 1.7) * 14);
        ctx.beginPath();
        ctx.arc(dx, dy, 1.1 + i * 0.45, 0, 6.2832);
        ctx.fillStyle = 'rgba(255,240,206,.55)';
        ctx.fill();
      }
    }

    /* breathing ink glow behind the card, driven by bass */
    var gl = clamp(beatLvl * 0.8 + live.bass * 0.5, 0, 1);
    if (gl > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var gx2 = W * 0.62, gy2 = H * 0.5;
      var rad = Math.max(W, H) * (0.20 + 0.05 * gl);
      var rg = ctx.createRadialGradient(gx2, gy2, 0, gx2, gy2, rad);
      rg.addColorStop(0, 'rgba(255,168,84,' + (0.10 * gl).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(255,140,60,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(gx2 - rad, gy2 - rad, rad * 2, rad * 2);
      ctx.restore();
    }
  }

  function loop(now) {
    requestAnimationFrame(loop);
    var t0 = performance.now();
    try {
      advance(now);
      updateLyric();
      beatLvl = clamp(beatLvl * (rmq.matches ? 0.86 : 0.925), 0, 1);
      glowB = clamp(beatLvl + live.bass * 0.5, 0, 1);
      hud(now);
      drawFrame(now);
    } catch (e) { console.error('[477] frame', e); }
    S.frames++;
    S.js = performance.now() - t0;
    if (firstLoop) { firstLoop = false; alive(); }
  }

  /* ================= boot ================= */
  window.addEventListener('message', onMsg);
  window.addEventListener('error', function (e) { console.error('[477] error', e && e.message); });
  var rzT = 0;
  function onResize() {
    if (rzT) { clearTimeout(rzT); }
    rzT = setTimeout(function () {
      rzT = 0;
      try { resize(); } catch (e) { console.error('[477] resize', e); }
    }, 90);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) {
    try { window.visualViewport.addEventListener('resize', onResize); }
    catch (e) { console.error('[477] vv', e); }
  }

  try { init(null); } catch (e) { console.error('[477] boot init', e); }
  try { resize(); } catch (e) { console.error('[477] boot resize', e); }

  requestAnimationFrame(loop);
  setTimeout(sendReady, 620);

  try {
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(function () {
        try { plate(); ghostPlate(); } catch (e) { console.error('[477] fonts', e); }
      });
    }
  } catch (e) { console.error('[477] fonts hook', e); }
})();
</script>
</body>
