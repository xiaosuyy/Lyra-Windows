<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>狂草金印</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050403}
  body{font-family:"Songti SC","STSong","SimSun",serif;color:#e8d9b8;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;overflow:hidden;background:#050403}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #ly{z-index:2;pointer-events:none}
  #rail{position:absolute;z-index:3;right:2.6vw;top:11.5vh;writing-mode:vertical-rl;text-orientation:mixed;
        max-height:54vh;overflow:hidden;white-space:nowrap;
        font-size:clamp(10px,1.05vw,15px);letter-spacing:.42em;color:#c9a862;opacity:.55;
        text-shadow:0 0 14px rgba(0,0,0,.75);display:none}
  #meta{position:absolute;z-index:3;left:4.4vw;bottom:5.6vh;font-size:clamp(10px,1vw,14px);
        letter-spacing:.22em;color:#8d7644;opacity:.72;white-space:nowrap;display:none;
        text-shadow:0 0 12px rgba(0,0,0,.7)}
  #bar{position:absolute;z-index:3;left:4.4vw;right:4.4vw;bottom:3.2vh;height:1px;background:rgba(160,130,70,.18)}
  #bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(200,53,42,.7),#e6c37a)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="ly"></canvas>
  <div id="rail"></div>
  <div id="meta"></div>
  <div id="bar"><i></i></div>
</div>
<script>
(function(){
  "use strict";
  var stageEl = document.getElementById('stage');
  var bgCv = document.getElementById('bg'), lyCv = document.getElementById('ly');
  var bg = bgCv.getContext('2d'), ly = lyCv.getContext('2d');
  var railEl = document.getElementById('rail'), metaEl = document.getElementById('meta'), barEl = document.querySelector('#bar>i');

  var W = 1440, H = 900, DPR = 1;
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', text: '',
            dur: 0, song: { name: '', artists: '' }, accent: [200,160,90],
            live: {}, beat: {}, flash: 0, kick: 0, lyCy: 0.5,
            rm: !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) };
  var readySent = false;
  function sendReady(){
    if (readySent) return; readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
  }

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function num(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }

  function resize(){
    var r = stageEl.getBoundingClientRect();
    var w = Math.round(num(r.width, 0)), h = Math.round(num(r.height, 0));
    if (!(w > 0)) w = Math.round(window.innerWidth) || 1440;
    if (!(h > 0)) h = Math.round(window.innerHeight) || 900;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = w; H = h;
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    [bgCv, lyCv].forEach(function(cv){
      cv.width = Math.max(1, Math.round(W * DPR));
      cv.height = Math.max(1, Math.round(H * DPR));
    });
    bg.setTransform(DPR,0,0,DPR,0,0);
    ly.setTransform(DPR,0,0,DPR,0,0);
    applyChrome();
  }

  function pickIdx(t){
    var L = S.lines, i;
    if (!L.length) return -1;
    for (i = L.length - 1; i >= 0; i--) { if (t >= L[i].t) return i; }
    return -1;
  }

  function onMsg(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    if (d.type === 'init') {
      var p = d.payload || {};
      var song = p.song || {};
      var astr = artistStr(song.artists);
      S.song = { name: String(song.name || ''), artists: song.artists, artistText: astr };
      var prevEnd = 0;
      S.lines = Array.isArray(p.lines) ? p.lines.map(function(l){
        if (!l || typeof l.text !== 'string') return null;
        var lt = (typeof l.t === 'number' && isFinite(l.t)) ? Math.max(0, l.t) : prevEnd;
        var ld = Math.max(0, num(l.dur, 0));
        prevEnd = lt + (ld > 0 ? ld : 0.6);
        return { t: lt, dur: ld, text: l.text,
                 chars: Array.isArray(l.chars) && l.chars.length ? l.chars : null };
      }).filter(function(x){ return !!x; }) : [];
      S.dur = Math.max(0, num(p.duration, 0));
      S.accent = Array.isArray(p.accent) && p.accent.length >= 3 ? p.accent : [200, 160, 90];
      var sid = (song.id === undefined || song.id === null) ? (S.song.name || '?') : song.id;
      if (sid !== S.songId){ S.songId = sid; S.t = 0; }
      S.idx = pickIdx(S.t);
      LY.key = '';
      SEAL.txt = sealText(S.song.name);
      SEAL.key = '';
      SEAL.stamp();
      applyChrome();
    } else if (d.type === 'tick') {
      var q = d.payload || {};
      if (typeof q.time === 'number' && isFinite(q.time)) { S.t = q.time; S.idx = pickIdx(S.t); }
      if (typeof q.playing === 'boolean') S.playing = q.playing;
    } else if (d.type === 'beat') {
      var bp = d.payload || {};
      S.beat = bp;
      var lv = clamp(num(bp.level, 0), 0, 1);
      if (lv > 0.08) S.flash = Math.min(1, S.flash + 0.28 + lv * 0.42);
      S.kick = Math.max(S.kick || 0, lv);
    } else if (d.type === 'live') {
      S.live = d.payload || {};
      if (typeof S.live.playing === 'boolean') S.playing = S.live.playing;
    }
  }
  function artistStr(a){
    if (Array.isArray(a)) return a.filter(function(x){ return x; }).join(' / ');
    return a ? String(a) : '';
  }
  function sealText(name){
    var s = String(name || '');
    var out = '', i, ch;
    for (i = 0; i < s.length && out.length < 2; i++){
      ch = s.charAt(i);
      if (isCJK(ch)) out += ch;
    }
    if (!out){
      var lat = s.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      out = lat.slice(0, 2);
    }
    return out || '金聲';
  }
  function applyChrome(){
    if (!railEl || !metaEl) return;
    var landscape = W >= H * 1.08;
    var name = S.song.name || '';
    railEl.style.display = (landscape && name) ? 'block' : 'none';
    if (name) railEl.textContent = name;
    var at = S.song.artistText || '';
    metaEl.style.display = at ? 'block' : 'none';
    metaEl.textContent = at;
  }

  /* ============ colour helpers: everything rounded + clamped ============ */
  function rgba(c, a){
    var r = Math.round(clamp(num(c && c[0], 0), 0, 255));
    var g = Math.round(clamp(num(c && c[1], 0), 0, 255));
    var b = Math.round(clamp(num(c && c[2], 0), 0, 255));
    a = (a === undefined) ? 1 : clamp(num(a, 1), 0, 1);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + (Math.round(a * 1000) / 1000) + ')';
  }
  function linG(ctx, x0, y0, x1, y1, stops){
    var g;
    try { g = ctx.createLinearGradient(x0, y0, x1, y1); } catch (e) { return 'rgba(0,0,0,1)'; }
    for (var i = 0; i < stops.length; i++){
      try { g.addColorStop(clamp(num(stops[i][0], 0), 0, 1), rgba(stops[i][1], stops[i][2])); } catch (e) {}
    }
    return g;
  }
  function radG(ctx, x, y, r0, r1, stops){
    var g;
    try { g = ctx.createRadialGradient(x, y, Math.max(0, num(r0, 0)), x, y, Math.max(0.5, num(r1, 1))); }
    catch (e) { return 'rgba(0,0,0,0)'; }
    for (var i = 0; i < stops.length; i++){
      try { g.addColorStop(clamp(num(stops[i][0], 0), 0, 1), rgba(stops[i][1], stops[i][2])); } catch (e) {}
    }
    return g;
  }
  function rng(seed){
    var s = (seed | 0) >>> 0;
    return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function coverBox(iw, ih, w, h){
    iw = Math.max(1, iw || 1); ih = Math.max(1, ih || 1);
    var sc = Math.max(w / iw, h / ih);
    return { w: iw * sc, h: ih * sc };
  }
  function softBlob(col){
    var c = document.createElement('canvas'); c.width = 192; c.height = 192;
    var g = c.getContext('2d');
    g.fillStyle = radG(g, 96, 96, 0, 96,
      [[0, col, 0.62], [0.34, col, 0.3], [0.66, col, 0.09], [1, col, 0]]);
    g.fillRect(0, 0, 192, 192);
    return c;
  }

  /* ============ textures: local files, onerror never blocks ============ */
  var TEX = { stone: null, patina: null, gold: null, seal: null, taotie: null };
  var TEX_DIRTY = true;
  function loadTex(key, url){
    try {
      var im = new Image();
      im.onload = function(){
        TEX[key] = im; TEX_DIRTY = true;
        try { GLY.size = 0; GLY.map = Object.create(null); } catch (e) {}
      };
      im.onerror = function(){ TEX[key] = null; };
      im.src = url;
    } catch (e) { TEX[key] = null; }
  }
  loadTex('stone',  'assets/336-stone.jpg');
  loadTex('patina', 'assets/336-patina.jpg');
  loadTex('gold',   'assets/336-gold.jpg');
  loadTex('seal',   'assets/336-seal.jpg');
  loadTex('taotie', 'assets/336-taotie.png');

  var DUST = softBlob([214, 170, 96]);
  var DUST2 = softBlob([120, 132, 120]);
  var NOISE = (function(){
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d'), d = g.createImageData(128, 128);
    var r = rng(90210);
    for (var i = 0; i < d.data.length; i += 4){
      var v = 128 + (r() - 0.5) * 200;
      d.data[i] = d.data[i+1] = d.data[i+2] = clamp(Math.round(v), 0, 255);
      d.data[i+3] = 255;
    }
    g.putImageData(d, 0, 0);
    return c;
  })();

  /* ============ background: carved stele, bronze dust, ruined columns ============ */
  var BG = {
    s: document.createElement('canvas'),
    w: 0, h: 0, dpr: 0,
    blobs: [], motes: [],
    init: function(){ this.sctx = this.s.getContext('2d'); },
    rebuild: function(){
      var w = W, h = H, dpr = DPR, c = this.sctx;
      var pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
      if (this.s.width !== pw) this.s.width = pw;
      if (this.s.height !== ph) this.s.height = ph;
      this.w = w; this.h = h; this.dpr = dpr;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 1;
      c.clearRect(0, 0, w, h);
      c.fillStyle = '#050403'; c.fillRect(0, 0, w, h);

      // deep warm shaft of light, the only "stage" light we allow
      c.fillStyle = linG(c, 0, 0, 0, h, [[0, [20, 15, 9], 1], [0.42, [11, 9, 6], 1], [1, [4, 3, 3], 1]]);
      c.fillRect(0, 0, w, h);
      c.fillStyle = radG(c, w * 0.5, h * 0.46, 0, Math.max(w, h) * 0.7,
        [[0, [126, 90, 42], 0.34], [0.4, [78, 54, 25], 0.17], [1, [0, 0, 0], 0]]);
      c.fillRect(0, 0, w, h);

      // weathered stone relief
      if (TEX.stone){
        var sb = coverBox(TEX.stone.width, TEX.stone.height, w, h);
        c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.115;
        c.drawImage(TEX.stone, (w - sb.w) / 2, (h - sb.h) / 2, sb.w, sb.h);
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
      }
      // verdigris bronze bloom
      if (TEX.patina){
        var pb = coverBox(TEX.patina.width, TEX.patina.height, w, h);
        c.globalCompositeOperation = 'soft-light'; c.globalAlpha = 0.3;
        c.drawImage(TEX.patina, (w - pb.w) / 2, (h - pb.h) / 2, pb.w, pb.h);
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
      }

      this.ruins(c, w, h);

      // 饕餮纹 crown frieze: bronze relief, additive, carved into the top edge
      if (TEX.taotie){
        var fh = clamp(h * 0.052, 34, 78);
        c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.26;
        c.drawImage(TEX.taotie, -w * 0.02, h * 0.052, w * 1.04, fh);
        c.globalAlpha = 0.12;
        c.drawImage(TEX.taotie, -w * 0.02, h - fh * 0.55 - h * 0.012, w * 1.04, fh * 0.55);
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
      }

      // vignette + edge crush
      c.fillStyle = radG(c, w * 0.5, h * 0.5, Math.min(w, h) * 0.22, Math.max(w, h) * 0.78,
        [[0, [0, 0, 0], 0], [0.55, [0, 0, 0], 0.18], [1, [0, 0, 0], 0.88]]);
      c.fillRect(0, 0, w, h);
      c.fillStyle = linG(c, 0, 0, 0, h, [[0, [0, 0, 0], 0.55], [0.16, [0, 0, 0], 0], [0.86, [0, 0, 0], 0], [1, [0, 0, 0], 0.5]]);
      c.fillRect(0, 0, w, h);

      // film grain baked in
      try {
        var pat = c.createPattern(NOISE, 'repeat');
        if (pat){
          c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.09;
          c.fillStyle = pat; c.fillRect(0, 0, w, h);
          c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
        }
      } catch (e) {}

      this.layout(w, h);
      TEX_DIRTY = false;
    },
    ruins: function(c, w, h){
      var r = rng(20771);
      var dark = '#070604';
      function pillar(x0, x1, top, bot, lit){
        var n = 9, i, xx;
        c.beginPath();
        c.moveTo(x0, bot);
        c.lineTo(x0 + (r() - 0.5) * w * 0.006, top);
        for (i = 1; i <= n; i++){
          xx = x0 + (x1 - x0) * (i / n);
          c.lineTo(xx, top + (r() - 0.35) * (h * 0.028));
        }
        c.lineTo(x1, bot);
        c.closePath();
        c.fillStyle = linG(c, x0, 0, x1, 0,
          lit > 0 ? [[0, [4, 3, 3], 1], [0.55, [9, 7, 5], 1], [1, [22, 16, 9], 1]]
                  : [[0, [22, 16, 9], 1], [0.45, [9, 7, 5], 1], [1, [4, 3, 3], 1]]);
        c.fill();
        // rim light on the lit flank
        c.beginPath();
        c.moveTo(lit > 0 ? x1 : x0, bot);
        c.lineTo(lit > 0 ? x1 : x0, top + h * 0.006);
        c.strokeStyle = linG(c, 0, top, 0, bot,
          [[0, [236, 196, 118], 0.42], [0.35, [190, 146, 72], 0.2], [1, [120, 88, 40], 0]]);
        c.lineWidth = 1.3;
        c.stroke();
      }
      // broken columns, left and right thirds — kept off the lyric column
      pillar(w * 0.012, w * 0.072, h * 0.26, h * 1.02, +1);
      pillar(w * 0.084, w * 0.108, h * 0.47, h * 1.02, +1);
      pillar(w * 0.928, w * 0.982, h * 0.21, h * 1.02, -1);
      pillar(w * 0.892, w * 0.916, h * 0.42, h * 1.02, -1);

      // shattered capital chunks
      for (var k = 0; k < 6; k++){
        var bw = w * (0.02 + r() * 0.03), bh = h * (0.012 + r() * 0.016);
        var bx = (k < 3 ? w * 0.01 + r() * w * 0.1 : w * 0.86 + r() * w * 0.12);
        var by = h * (0.2 + r() * 0.55);
        c.fillStyle = 'rgba(9,7,5,0.95)';
        c.beginPath();
        c.moveTo(bx, by);
        c.lineTo(bx + bw, by + (r() - 0.5) * bh);
        c.lineTo(bx + bw * (0.8 + r() * 0.3), by + bh);
        c.lineTo(bx + (r() - 0.5) * bw * 0.2, by + bh * (0.7 + r() * 0.4));
        c.closePath();
        c.fill();
      }

      // terrace / stone platform under everything
      var ty = h * 0.945;
      c.fillStyle = 'rgba(6,5,4,0.94)';
      c.fillRect(0, ty, w, h - ty);
      c.strokeStyle = 'rgba(198,155,84,0.16)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, ty + 0.5); c.lineTo(w, ty + 0.5); c.stroke();
      c.strokeStyle = 'rgba(198,155,84,0.07)';
      c.beginPath(); c.moveTo(0, ty + h * 0.022); c.lineTo(w, ty + h * 0.022); c.stroke();
    },
    layout: function(w, h){
      var r = rng(4242), i;
      this.blobs = [];
      for (i = 0; i < 9; i++){
        this.blobs.push({
          x: r(), y: 0.18 + r() * 0.78, rad: 0.18 + r() * 0.3,
          sp: 0.06 + r() * 0.16, ph: r() * 6.283, amp: 0.012 + r() * 0.03,
          warm: r() > 0.42, a: 0.05 + r() * 0.1
        });
      }
      this.motes = [];
      var n = S.rm ? 70 : 190;
      for (i = 0; i < n; i++){
        this.motes.push({
          x: r(), y: r(), sz: 0.6 + r() * 1.7,
          sp: 0.004 + r() * 0.02, ph: r() * 6.283, a: 0.15 + r() * 0.6
        });
      }
    },
    draw: function(t){
      if (this.w !== W || this.h !== H || TEX_DIRTY) this.rebuild();
      var w = W, h = H, i, b, m;
      var live = S.live || {};
      var bass = clamp(num(live.bass, 0.35), 0, 1);
      var mid  = clamp(num(live.mid, 0.3), 0, 1);
      var treb = clamp(num(live.treble, 0.25), 0, 1);
      var en = S.playing ? 1 : 0.45;

      bg.globalCompositeOperation = 'source-over';
      bg.globalAlpha = 1;
      bg.drawImage(this.s, 0, 0, w, h);

      // slow bronze smoke
      bg.globalCompositeOperation = 'lighter';
      var span = Math.max(w, h);
      for (i = 0; i < this.blobs.length; i++){
        b = this.blobs[i];
        var bx = (b.x + Math.sin(t * b.sp + b.ph) * b.amp) * w;
        var by = (b.y + Math.cos(t * b.sp * 0.8 + b.ph) * b.amp * 1.6) * h - h * 0.06;
        var rr = b.rad * span * (0.9 + 0.12 * Math.sin(t * 0.3 + b.ph)) * (0.85 + bass * 0.4);
        bg.globalAlpha = clamp(b.a * (0.55 + bass * 0.9) * en, 0, 1);
        bg.drawImage(b.warm ? DUST : DUST2, bx - rr, by - rr, rr * 2, rr * 2);
      }

      // gold filings drifting upward through the light
      var drift = t * (0.02 + bass * 0.05);
      for (i = 0; i < this.motes.length; i++){
        m = this.motes[i];
        var mx = (m.x + Math.sin(t * 0.21 + m.ph) * 0.012) * w;
        var my = ((m.y - drift * m.sp * 24) % 1 + 1) % 1;
        var tw = 0.45 + 0.55 * Math.sin(t * 1.7 + m.ph);
        bg.globalAlpha = clamp(m.a * tw * (0.3 + treb * 0.8) * en, 0, 1);
        bg.fillStyle = m.warm ? '#f0cf94' : '#d8a765';
        bg.fillRect(mx, my * h, m.sz, m.sz);
      }

      // breathing bloom behind the lyric block
      var cy = h * (S.lyCy || 0.5), cx = w * 0.5;
      var br = Math.max(w, h) * (0.34 + mid * 0.09);
      var ac = (S.accent && S.accent.length >= 3) ? S.accent : [232, 186, 108];
      var gc = [Math.round(232 * 0.86 + num(ac[0], 0) * 0.14),
                Math.round(186 * 0.86 + num(ac[1], 0) * 0.14),
                Math.round(108 * 0.86 + num(ac[2], 0) * 0.14)];
      bg.globalAlpha = clamp((0.1 + mid * 0.12) * en, 0, 1);
      bg.fillStyle = radG(bg, cx, cy, 0, br,
        [[0, gc, 0.55], [0.45, [140, 96, 40], 0.22], [1, [0, 0, 0], 0]]);
      bg.fillRect(cx - br, cy - br, br * 2, br * 2);

      // beat flash, quick and dirty
      if (S.flash > 0.01){
        var fr = Math.max(w, h) * 0.75;
        bg.globalAlpha = clamp(S.flash * (S.rm ? 0.18 : 0.5), 0, 1);
        bg.fillStyle = radG(bg, w * 0.5, h * 0.55, 0, fr,
          [[0, [255, 214, 150], 0.5], [0.5, [180, 90, 40], 0.16], [1, [0, 0, 0], 0]]);
        bg.fillRect(0, 0, w, h);
      }
      bg.globalCompositeOperation = 'source-over';
      bg.globalAlpha = 1;
    }
  };
  BG.init();

  /* ============ brush glyph engine ============ */
  var FONT_STACK = '"KaiTi","Kaiti SC","STKaiti","Kaiti TC","STXingkai","Xingkai SC","Songti SC","SimSun",serif';
  var ADV = Object.create(null);
  function advOf(ch, size){
    var f = ADV[ch];
    if (f === undefined){
      var wd = 100;
      try { ly.font = '400 100px ' + FONT_STACK; wd = ly.measureText(ch).width || 100; } catch (e) {}
      f = clamp(wd / 100, 0.22, 1.08);
      ADV[ch] = f;
    }
    return f * size;
  }
  function isCJK(ch){
    var c = ch.charCodeAt(0);
    return (c >= 0x2E80 && c <= 0xA4CF) || (c >= 0xAC00 && c <= 0xD7AF) ||
           (c >= 0xF900 && c <= 0xFAFF) || (c >= 0xFE30 && c <= 0xFE4F) ||
           (c >= 0xFF00 && c <= 0xFF60);
  }
  var SCRATCH = document.createElement('canvas');
  var SCTX = SCRATCH.getContext('2d');

  var GLY = { size: 0, map: Object.create(null) };

      BG.draw(t);

      ly.clearRect(0, 0, W, H);
      S.text = S.idx >= 0 ? S.lines[S.idx].text : '';
      ly.save();
      if (S.kick > 0.04 && !S.rm){
        var amp = S.kick * Math.min(W, H) * 0.0045;
        ly.translate((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp);
      }
      LY.draw(t);
      ly.restore();

      SEAL.draw(ly, t);
      FX.step(dt);
      FX.draw(ly);

      if (S.dur > 0 && barEl) barEl.style.width = (clamp(S.t / S.dur, 0, 1) * 100).toFixed(2) + '%';
    } catch (e) { S.err = String(e && e.message || e); }
    S.js = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('message', onMsg, false);
  window.addEventListener('resize', resize, false);
  resize();
  requestAnimationFrame(function(){ sendReady(); requestAnimationFrame(frame); });
  setTimeout(sendReady, 320);

  window.__stage = function(){ return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: !!S.playing, frames: S.frames,
    js: Math.round(S.js * 100) / 100, err: S.err || '', text: S.text || '',
    gl: false, rm: !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
  }; };
})();
</script>
