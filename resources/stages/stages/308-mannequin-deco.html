<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>308 · 人机橱窗</title>
<style>
  :root{
    --paper:#08080a;
    --ink:#f2efe6;
    --hair:rgba(242,239,230,.30);
    --dim:rgba(242,239,230,.46);
    --beat:0; --bass:0; --treble:0; --level:0;
    --acc-rgb:201,195,180;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--paper); color:var(--ink); overflow:hidden;}
  body{
    font-family:'Futura','Century Gothic','Avenir Next','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed; inset:0; overflow:hidden; isolation:isolate;}
  .backdrop{position:absolute; inset:0;
    background:
      radial-gradient(120% 80% at 50% 22%, rgba(242,239,230,.10), rgba(242,239,230,.02) 46%, rgba(0,0,0,0) 62%),
      radial-gradient(90% 90% at 50% 106%, rgba(0,0,0,.85), rgba(0,0,0,0) 60%);
  }
  .grain{position:absolute; inset:0; z-index:9; pointer-events:none; opacity:.5;
    mix-blend-mode:soft-light; background-repeat:repeat;}
  .scan{position:absolute; inset:0; z-index:5; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, rgba(0,0,0,0) 1px 3px);}
  .vignette{position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(120% 95% at 50% 46%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.88) 100%);}
  .scrim{position:absolute; inset:0; z-index:5; pointer-events:none;
    background:linear-gradient(180deg, rgba(6,6,8,0) 48%, rgba(6,6,8,.28) 57%,
      rgba(6,6,8,.62) 67%, rgba(6,6,8,.86) 78%, rgba(6,6,8,.93) 100%);}

  /* ---- deco halo behind the mannequin ---- */
  .rays{position:absolute; left:50%; top:34%; z-index:1; width:min(150vw,1500px); aspect-ratio:1;
    transform:translate(-50%,-50%); pointer-events:none;
    background:repeating-conic-gradient(from 0deg, rgba(242,239,230,.16) 0 .38deg, rgba(242,239,230,0) .38deg 6deg);
    -webkit-mask-image:radial-gradient(circle, rgba(0,0,0,0) 0 17%, #000 40%, rgba(0,0,0,0) 70%);
    mask-image:radial-gradient(circle, rgba(0,0,0,0) 0 17%, #000 40%, rgba(0,0,0,0) 70%);
    opacity:.42; animation:spin 360s linear infinite;}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
  .halo{position:absolute; left:50%; top:44%; z-index:1; width:min(88vw,900px); aspect-ratio:1;
    transform:translate(-50%,-50%); pointer-events:none; border-radius:50%;
    background:repeating-radial-gradient(circle, rgba(242,239,230,.30) 0 .6px, rgba(242,239,230,0) .6px 4.6vmin);
    -webkit-mask-image:radial-gradient(circle, rgba(0,0,0,0) 0 34%, #000 52%, rgba(0,0,0,0) 72%);
    mask-image:radial-gradient(circle, rgba(0,0,0,0) 0 34%, #000 52%, rgba(0,0,0,0) 72%);
    opacity:.5;}
  .arch{position:absolute; left:50%; top:6.5vh; z-index:2; width:min(46vw,480px); height:74vh;
    transform:translateX(-50%); pointer-events:none;
    border:1px solid rgba(242,239,230,.15);
    border-bottom-color:rgba(242,239,230,.04);
    border-radius:50% 50% 0 0 / 34% 34% 0 0;
    box-shadow:inset 0 0 0 1px rgba(242,239,230,.05), 0 0 60px rgba(242,239,230,.035);}
  .arch::after{content:''; position:absolute; inset:clamp(8px,1.4vmin,18px); display:block;
    border:1px solid rgba(var(--acc-rgb),.14); border-bottom:0;
    border-radius:50% 50% 0 0 / 34% 34% 0 0;}

  #plate{position:absolute; left:50%; top:50%; z-index:3; transform:translate(-50%,-50%);
    width:min(54vw,62vh,600px); aspect-ratio:600/860; max-height:92vh;
    -webkit-mask-image:linear-gradient(180deg,#000 0 58%,rgba(0,0,0,.86) 69%,rgba(0,0,0,0) 95%);
    mask-image:linear-gradient(180deg,#000 0 58%,rgba(0,0,0,.86) 69%,rgba(0,0,0,0) 95%);}
  #figure{width:100%; height:100%; display:block; overflow:visible;
    transform:scale(calc(1 + var(--bass) * .016)); transform-origin:50% 46%;}
  .eye-glow{opacity:calc(.16 + var(--beat) * .42);}

  /* ---- Art Deco frame: double rule, corner blocks, tick strips, rails ---- */
  .frame{position:absolute; inset:0; z-index:7; pointer-events:none;}
  .edge{position:absolute; border:1px solid rgba(242,239,230,.24);}
  .edge.o{inset:clamp(10px,2vmin,24px);}
  .edge.i{inset:clamp(16px,3.2vmin,38px); border-color:rgba(242,239,230,.12);}
  .edge.o::before,.edge.o::after{content:''; position:absolute; width:7px; height:7px; background:var(--ink); opacity:.82;}
  .edge.o::before{left:-1px; top:-1px;}
  .edge.o::after{right:-1px; bottom:-1px;}
  .tickbar{position:absolute; left:calc(clamp(16px,3.2vmin,38px) + 12px); right:calc(clamp(16px,3.2vmin,38px) + 12px);
    height:5px; background:repeating-linear-gradient(90deg, rgba(242,239,230,.34) 0 1px, rgba(0,0,0,0) 1px 18px);}
  .tickbar.top{top:calc(clamp(16px,3.2vmin,38px) + 7px);}
  .tickbar.bot{bottom:calc(clamp(16px,3.2vmin,38px) + 7px);}
  .corner{position:absolute; width:clamp(20px,3.4vmin,42px); height:clamp(20px,3.4vmin,42px);
    inset:calc(clamp(10px,2vmin,24px) - 1px);}
  .corner::before,.corner::after{content:''; position:absolute; background:var(--ink); opacity:.9;}
  .corner::before{width:1px; height:100%; left:0;}
  .corner::after{height:1px; width:100%; top:0;}
  .corner.tr{left:auto; right:calc(clamp(10px,2vmin,24px) - 1px); transform:rotate(90deg);}
  .corner.br{left:auto; right:calc(clamp(10px,2vmin,24px) - 1px); top:auto; bottom:calc(clamp(10px,2vmin,24px) - 1px); transform:rotate(180deg);}
  .corner.bl{top:auto; bottom:calc(clamp(10px,2vmin,24px) - 1px); transform:rotate(270deg);}
  .rail{position:absolute; top:50%; z-index:8; font-size:9px; letter-spacing:.46em; text-transform:uppercase;
    color:rgba(242,239,230,.42); writing-mode:vertical-rl; pointer-events:none;}
  .rail.l{left:calc(clamp(16px,3.2vmin,38px) + 8px); transform:translateY(-50%) rotate(180deg);}
  .rail.r{right:calc(clamp(16px,3.2vmin,38px) + 8px); transform:translateY(-50%);}
  .orn{position:absolute; z-index:8; left:50%; transform:translateX(-50%); pointer-events:none;}
  .orn.top{top:calc(clamp(16px,3.2vmin,38px) - 9px); width:clamp(150px,19vw,260px);}
  .orn.bot{bottom:calc(clamp(16px,3.2vmin,38px) - 4px); width:clamp(90px,11vw,150px); opacity:.7;}
  .toplabel{position:absolute; z-index:8; left:0; right:0;
    top:calc(clamp(16px,3.2vmin,38px) + 24px); text-align:center;
    font-size:8.5px; letter-spacing:.54em; text-indent:.54em; text-transform:uppercase;
    color:rgba(242,239,230,.42); pointer-events:none;}

  .lyric-wrap{position:absolute; left:8.5vw; right:8.5vw; bottom:12.5vh; z-index:6;
    padding-left:clamp(14px,2.4vw,32px);}
  .lyric-wrap::before{content:''; position:absolute; inset:-46% -4vw -5vh -7vw; z-index:-1; pointer-events:none;
    background:radial-gradient(58% 82% at 26% 62%, rgba(4,4,6,.72), rgba(4,4,6,.3) 46%, rgba(4,4,6,0) 74%);}
  .lyric-wrap::after{content:''; position:absolute; left:0; top:.35em; bottom:.35em; width:1px;
    background:linear-gradient(180deg, rgba(242,239,230,.55), rgba(242,239,230,.10) 60%, rgba(242,239,230,0));}
  .lyric-head{display:flex; align-items:center; gap:.9em; margin-bottom:clamp(9px,1.5vh,18px);
    font-size:9.5px; letter-spacing:.4em; text-transform:uppercase; color:rgba(242,239,230,.5);}
  .lyric-head .dia{width:4.5px; height:4.5px; flex:none; background:var(--ink); opacity:.85; transform:rotate(45deg);}
  .lyric-head .num{color:rgba(var(--acc-rgb),.92); letter-spacing:.26em; font-variant-numeric:tabular-nums;}
  .lyric-head .rule{flex:1; height:1px; background:linear-gradient(90deg, rgba(242,239,230,.3), rgba(242,239,230,.02));}
  .lyric-head .lbl{opacity:.72;}
  .lyric{position:relative; max-width:min(62ch,70vw);
    font-family:'Songti SC','STSong','Source Han Serif SC','Noto Serif CJK SC','Didot','Bodoni MT','Times New Roman',serif;
    font-size:clamp(23px,4.4vw,78px); line-height:1.32; letter-spacing:.045em;
    color:var(--ink); text-shadow:0 2px 26px rgba(0,0,0,.6);}
  .lyric .line{white-space:pre-wrap; opacity:0; transform:translateY(.16em);
    transition:opacity .5s ease, transform .6s cubic-bezier(.16,.8,.2,1);}
  .lyric .line.on{opacity:1; transform:none;}
  .lyric .line.leaving{position:absolute; left:0; top:0; right:0; opacity:0; transform:translateY(-.12em);}
  .lyric .ch{display:inline-block; white-space:pre;}
  .vacant{position:absolute; inset:0; z-index:7; display:none; align-content:end; justify-items:start;
    padding:0 8.5vw clamp(70px,17vh,180px); text-align:left;}
  .vacant.on{display:grid;}
  .vacant .panel{position:relative; min-width:min(52vw,360px); padding:clamp(14px,2.4vh,26px) 0;}
  .vacant .panel::before,.vacant .panel::after{content:''; position:absolute; left:0; right:0; height:1px;
    background:linear-gradient(90deg, rgba(242,239,230,.42), rgba(242,239,230,.08));}
  .vacant .panel::before{top:0;}
  .vacant .panel::after{bottom:0;}
  .vacant .big{font-family:'Songti SC','STSong','Didot','Times New Roman',serif;
    font-size:clamp(26px,3.6vw,48px); letter-spacing:.24em;}
  .vacant .small{margin-top:1.1em; font-size:9.5px; letter-spacing:.32em; opacity:.52; text-transform:uppercase;}
  .vacant .slow{display:block; margin:0 0 1.2em; width:7px; height:7px; background:rgb(var(--acc-rgb));
    transform:rotate(45deg); opacity:calc(.25 + var(--bass) * .65); transition:opacity .1s linear;}

  .hud{position:absolute; z-index:8; pointer-events:none;}
  .hud-tl{left:6vw; top:6.2vh; display:flex; align-items:center; gap:.95em;
    font-size:9.5px; letter-spacing:.34em; text-transform:uppercase; color:rgba(242,239,230,.62);}
  .hud-tl .mark{width:13px; height:13px; flex:none; border:1px solid rgba(242,239,230,.38); position:relative;}
  .hud-tl .mark::after{content:''; position:absolute; inset:4px; background:var(--ink); opacity:.85;}
  .hud-tr{right:6vw; top:6.1vh; text-align:right; max-width:44vw;}
  .hud-tr .song{font-family:'Songti SC','STSong','Didot','Times New Roman',serif;
    font-size:clamp(12px,1.05vw,16px); letter-spacing:.18em; color:rgba(242,239,230,.92);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hud-tr .artist{margin-top:.85em; font-size:9px; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(242,239,230,.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hud-bot{position:absolute; z-index:8; display:flex; align-items:center; gap:14px;
    left:calc(clamp(16px,3.2vmin,38px) + 20px); right:calc(clamp(16px,3.2vmin,38px) + 20px);
    bottom:calc(clamp(16px,3.2vmin,38px) + 21px);
    font-size:9px; letter-spacing:.3em; color:rgba(242,239,230,.55);
    font-variant-numeric:tabular-nums; pointer-events:none;}
  .hud-bot .gauge{position:relative; flex:1; height:9px;}
  .hud-bot .gauge::before{content:''; position:absolute; left:0; right:0; top:4px; height:4px;
    background:repeating-linear-gradient(90deg, rgba(242,239,230,.30) 0 1px, rgba(0,0,0,0) 1px 15px);
    border-bottom:1px solid rgba(242,239,230,.16);}
  .hud-bot .gauge::after{content:''; position:absolute; left:0; top:7px; height:1px;
    width:calc(var(--prog,0) * 100%); background:rgba(var(--acc-rgb),.78);}
  .hud-bot .needle{position:absolute; top:2px; left:calc(var(--prog,0) * 100%); width:6px; height:6px;
    margin-left:-3px; background:rgb(var(--acc-rgb)); transform:rotate(45deg);
    box-shadow:0 0 12px rgba(var(--acc-rgb),.55);}

  .sweep{animation:sweep 16s cubic-bezier(.45,0,.55,1) infinite;}
  @keyframes sweep{0%{transform:translateX(0);} 44%{transform:translateX(760px);} 100%{transform:translateX(760px);}}

  @media (max-width: 820px), (max-aspect-ratio: 3/4){
    #plate{width:min(90vw,520px); top:45%;}
    .arch{width:78vw; height:64vh; top:7vh;}
    .lyric-wrap{left:8vw; right:8vw; bottom:10.5vh; padding-left:14px;}
    .lyric{max-width:100%; font-size:clamp(24px,7.2vw,44px); letter-spacing:.03em;}
    .hud-tl{left:8vw; top:6.4vh; font-size:8.5px; letter-spacing:.26em;}
    .hud-tr{right:8vw; top:6.4vh; max-width:56vw;}
    .hud-bot{left:8vw; right:8vw; gap:10px;}
    .rail{display:none;}
    .toplabel{display:none;}
    .lyric-head{font-size:8.5px; letter-spacing:.3em;}
    .orn.top{width:46vw;}
    .vacant{padding-left:8vw; padding-right:8vw;}
    .vacant .panel{min-width:min(64vw,320px);}
  }
  @media (max-height: 560px) and (orientation: landscape){
    #plate{left:66%; width:min(30vw,55vh,320px); top:48%;}
    .arch{left:66%; width:52vw; height:82vh; top:5vh;}
    .rays,.halo{left:66%;}
    .lyric-wrap{left:7vw; right:40vw; bottom:8.5vh; padding-left:12px;}
    .lyric{max-width:100%; font-size:clamp(17px,5vh,36px);}
    .lyric-head{font-size:8px;}
    .hud-tl,.hud-tr{top:5.4vh;}
    .toplabel{display:none;}
    .hud-bot{left:7vw; right:7vw; bottom:16px;}
    .vacant{padding-left:7vw; padding-bottom:14vh;}
  }
  @media (prefers-reduced-motion: reduce){
    .rays{animation:none;}
    .sweep{display:none;}
    .lyric .line{transition:opacity .2s linear;}
    #figure{transform:none;}
    .hud-bot .needle{box-shadow:none;}
  }
</style>
</head>
<body>
<div id="stage" aria-live="off">
  <div class="backdrop"></div>
  <div class="rays"></div>
  <div class="halo"></div>
  <div class="arch"></div>
  <div id="plate">
    <svg id="figure" viewBox="0 0 600 860" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <radialGradient id="skin" cx="38%" cy="23%" r="88%">
          <stop offset="0" stop-color="#fffdf6"/>
          <stop offset=".34" stop-color="#f5eee2"/>
          <stop offset=".62" stop-color="#e2d9ca"/>
          <stop offset=".84" stop-color="#c7bdac"/>
          <stop offset="1" stop-color="#a89e8e"/>
        </radialGradient>
        <linearGradient id="bustGrad" x1=".15" y1="0" x2=".85" y2="1">
          <stop offset="0" stop-color="#f1ebdf"/>
          <stop offset=".42" stop-color="#dbd2c2"/>
          <stop offset=".78" stop-color="#b4aa99"/>
          <stop offset="1" stop-color="#948b7c"/>
        </linearGradient>
        <linearGradient id="sideShade" x1="0" y1=".1" x2="1" y2=".2">
          <stop offset=".3" stop-color="#221e18" stop-opacity="0"/>
          <stop offset=".72" stop-color="#221e18" stop-opacity=".34"/>
          <stop offset="1" stop-color="#17130f" stop-opacity=".62"/>
        </linearGradient>
        <linearGradient id="neckShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4b433a" stop-opacity=".55"/>
          <stop offset=".55" stop-color="#4b433a" stop-opacity=".12"/>
          <stop offset="1" stop-color="#4b433a" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="softLight">
          <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
          <stop offset=".6" stop-color="#fff" stop-opacity=".25"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#08080a" stop-opacity="0"/>
          <stop offset=".7" stop-color="#08080a" stop-opacity=".55"/>
          <stop offset="1" stop-color="#08080a" stop-opacity=".92"/>
        </linearGradient>
        <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="0">
          <stop offset=".42" stop-color="#000"/>
          <stop offset=".96" stop-color="#fff"/>
        </linearGradient>
        <pattern id="halftone" width="5" height="5" patternUnits="userSpaceOnUse">
          <circle cx="1.1" cy="1.1" r=".85" fill="#2b251e" opacity=".55"/>
        </pattern>
        <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".44" stop-color="#fff" stop-opacity=".26"/>
          <stop offset=".56" stop-color="#fff" stop-opacity=".26"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="blurL" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
        <filter id="blurM" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="blurS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.4"/></filter>
        <filter id="blurXS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.4"/></filter>
        <clipPath id="headClip">
          <path d="M300 108C372 108 414 168 414 258C414 326 396 392 358 438C341 459 322 472 300 472C278 472 259 459 242 438C204 392 186 326 186 258C186 168 228 108 300 108Z"/>
        </clipPath>
        <clipPath id="bustClip">
          <path d="M262 404C254 468 252 520 258 566C210 588 140 618 96 700C66 756 54 812 50 860L550 860C546 812 534 756 504 700C460 618 390 588 342 566C348 520 346 468 338 404Z"/>
        </clipPath>
        <mask id="rightMask"><rect x="180" y="90" width="260" height="420" fill="url(#dotFade)"/></mask>
      </defs>

      <!-- bust / shoulders -->
      <g>
        <path d="M262 404C254 468 252 520 258 566C210 588 140 618 96 700C66 756 54 812 50 860L550 860C546 812 534 756 504 700C460 618 390 588 342 566C348 520 346 468 338 404Z"
              fill="url(#bustGrad)"/>
        <g clip-path="url(#bustClip)">
          <path d="M262 404C254 468 252 520 258 566C210 588 140 618 96 700C66 756 54 812 50 860L550 860C546 812 534 756 504 700C460 618 390 588 342 566C348 520 346 468 338 404Z"
                fill="url(#sideShade)" opacity=".8"/>
          <ellipse cx="196" cy="726" rx="92" ry="118" fill="url(#softLight)" opacity=".5" filter="url(#blurL)"/>
          <ellipse cx="300" cy="620" rx="46" ry="120" fill="#fff" opacity=".2" filter="url(#blurL)"/>
          <path d="M250 700C262 760 258 818 248 858" stroke="#fff" stroke-opacity=".16" stroke-width="10" fill="none" filter="url(#blurM)"/>
          <path d="M348 690C360 752 366 812 370 858" stroke="#2a241d" stroke-opacity=".22" stroke-width="16" fill="none" filter="url(#blurM)"/>
        </g>
        <!-- collarbones + neck contact shadow -->
        <path d="M300 604C330 616 362 624 392 634" stroke="#7d7365" stroke-opacity=".38" stroke-width="3" fill="none" filter="url(#blurXS)"/>
        <path d="M300 604C270 616 238 624 208 634" stroke="#7d7365" stroke-opacity=".38" stroke-width="3" fill="none" filter="url(#blurXS)"/>
        <ellipse cx="300" cy="596" rx="66" ry="16" fill="#211c17" opacity=".38" filter="url(#blurM)"/>
        <ellipse cx="300" cy="490" rx="62" ry="15" fill="#1d1814" opacity=".5" filter="url(#blurM)"/>
        <!-- engraved serial on the chest -->
        <text x="300" y="686" text-anchor="middle" font-family="Futura,Century Gothic,Arial,sans-serif"
              font-size="13" letter-spacing="9" fill="#6f6557" fill-opacity=".5">N&#183;308</text>
        <path d="M252 700H348" stroke="#6f6557" stroke-opacity=".25" stroke-width="1"/>
      </g>

      <!-- neck -->
      <path d="M266 420C260 470 260 528 266 574L334 574C340 528 340 470 334 420Z" fill="url(#skin)"/>
      <path d="M266 420C260 470 260 528 266 574L334 574C340 528 340 470 334 420Z" fill="url(#neckShade)" opacity=".9"/>
      <path d="M268 430C264 478 266 528 270 566" stroke="#fff" stroke-opacity=".3" stroke-width="5" fill="none" filter="url(#blurS)"/>
      <path d="M334 430C338 478 336 528 332 566" stroke="#2a241d" stroke-opacity=".3" stroke-width="6" fill="none" filter="url(#blurS)"/>

      <ellipse cx="302" cy="300" rx="118" ry="192" fill="#0b0b0d" opacity=".55" filter="url(#blurL)"/>

      <!-- ears (behind the head, only the sculpted edge shows) -->
      <path d="M194 290C180 288 172 304 176 324C180 344 190 354 198 356C204 357 206 350 203 342C198 326 195 306 198 292Z"
            fill="url(#bustGrad)" stroke="#8c8171" stroke-opacity=".35" stroke-width="1"/>
      <path d="M406 290C420 288 428 304 424 324C420 344 410 354 402 356C396 357 394 350 397 342C402 326 405 306 402 292Z"
            fill="url(#bustGrad)" stroke="#8c8171" stroke-opacity=".3" stroke-width="1"/>

      <!-- head -->
      <path d="M300 108C372 108 414 168 414 258C414 326 396 392 358 438C341 459 322 472 300 472C278 472 259 459 242 438C204 392 186 326 186 258C186 168 228 108 300 108Z"
            fill="url(#skin)"/>

      <g clip-path="url(#headClip)">
        <!-- broad form shading -->
        <ellipse cx="404" cy="316" rx="128" ry="196" fill="url(#sideShade)" opacity=".85"/>
        <ellipse cx="238" cy="236" rx="86" ry="116" fill="url(#softLight)" opacity=".6" filter="url(#blurL)"/>

        <path d="M352 244L338 190L348 186L362 242Z" fill="#fff" opacity=".07" filter="url(#blurXS)"/>

        <!-- brows -->
        <path d="M219 258C235 248 264 247 282 256" fill="none" stroke="#5f574a" stroke-opacity=".42" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M318 256C336 247 365 248 381 258" fill="none" stroke="#5f574a" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/>

        <!-- eyes: closed, blank, mannequin -->

        <ellipse cx="349" cy="282" rx="40" ry="15" fill="#8a7f6d" opacity=".18" filter="url(#blurS)"/>
        <path d="M224 292C236 279 266 279 280 292C266 302 236 302 224 292Z" fill="#e6dfd1"/>
        <path d="M320 292C334 279 364 279 376 292C364 302 334 302 320 292Z" fill="#e2dacb"/>
        <path d="M224 292C236 279 266 279 280 292" fill="none" stroke="#544c40" stroke-opacity=".6" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M320 292C334 279 364 279 376 292" fill="none" stroke="#544c40" stroke-opacity=".55" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M226 276C240 267 266 267 280 277" fill="none" stroke="#7d7263" stroke-opacity=".26" stroke-width="1.6"/>

        <ellipse cx="350" cy="288" rx="12" ry="2.2" fill="#fff" opacity=".42"/>

        <!-- nose -->
        <path d="M310 300C318 334 318 362 309 381" fill="none" stroke="#7b6f5e" stroke-opacity=".35" stroke-width="7" filter="url(#blurS)"/>
        <ellipse cx="296" cy="338" rx="8" ry="42" fill="#fff" opacity=".26" filter="url(#blurM)"/>
        <ellipse cx="300" cy="383" rx="10" ry="5" fill="#fff" opacity=".5" filter="url(#blurS)"/>
        <ellipse cx="283" cy="392" rx="6.4" ry="3.2" fill="#4b4236" opacity=".38" filter="url(#blurXS)"/>
        <ellipse cx="317" cy="392" rx="6" ry="3" fill="#4b4236" opacity=".3" filter="url(#blurXS)"/>
        <ellipse cx="300" cy="402" rx="18" ry="5" fill="#6d6253" opacity=".26" filter="url(#blurS)"/>

        <!-- lips: pale, closed, emotionless -->
        <path d="M266 424C280 414 291 410 300 410C309 410 320 414 334 424C320 428 310 430 300 430C290 430 280 428 266 424Z"
              fill="#bda997" opacity=".9"/>
        <path d="M268 428C282 433 292 434 300 434C308 434 318 433 332 428C322 447 310 453 300 453C290 453 278 447 268 428Z"
              fill="#cdb9a6" opacity=".85"/>
        <path d="M266 425C286 434 314 434 334 425" fill="none" stroke="#6b5c4e" stroke-opacity=".55" stroke-width="2.4"/>
        <ellipse cx="300" cy="442" rx="16" ry="4" fill="#fff" opacity=".4" filter="url(#blurS)"/>
        <ellipse cx="300" cy="459" rx="24" ry="6" fill="#6b6152" opacity=".2" filter="url(#blurS)"/>

        <!-- machine details -->
        <path d="M300 112C302 148 301 176 300 202" fill="none" stroke="#7d7263" stroke-opacity=".3" stroke-width="1.2"/>
        <circle cx="300" cy="204" r="2.4" fill="#7d7263" opacity=".35"/>
        <circle cx="392" cy="322" r="9" fill="#f7f1e5" opacity=".55" stroke="#6b6051" stroke-opacity=".4" stroke-width="1.3"/>
        <circle cx="392" cy="322" r="3.4" fill="#3d362c" opacity=".55"/>
        <path d="M392 331C392 340 390 346 386 350" fill="none" stroke="#6b6051" stroke-opacity=".28" stroke-width="1.4"/>
        <path d="M374 372C378 380 380 388 379 396" fill="none" stroke="#6b6051" stroke-opacity=".2" stroke-width="1.2"/>

        <!-- rim light -->
        <path d="M404 214C414 262 410 330 386 390" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="7" filter="url(#blurM)"/>
        <path d="M196 214C186 262 190 330 214 390" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="5" filter="url(#blurM)"/>

        <!-- beat-driven window light in the eye zone -->
        <ellipse class="eye-glow" cx="300" cy="290" rx="104" ry="30" fill="url(#softLight)"/>

        <!-- slow shop-window light sweeping across the face -->
        <rect class="sweep" x="-170" y="70" width="170" height="430" fill="url(#sweepGrad)" style="mix-blend-mode:screen"/>
      </g>

      <rect x="120" y="700" width="360" height="160" fill="url(#bottomFade)"/>

  </div>
  <div class="lyric-wrap" id="lyricWrap">
    <div class="lyric-head" id="lyricHead">
      <span class="dia"></span>
      <span class="num" id="lyricIndex">—</span>
      <span class="rule"></span>
      <span class="lbl" id="lyricLabel">Standby</span>
    </div>
    <div class="lyric" id="lyric"></div>
  </div>
  <div class="vacant" id="vacant">
    <div class="panel">
      <span class="slow"></span>
      <div class="big">无词</div>
      <div class="small">Instrumental · 本面无人声</div>
    </div>
  </div>

  <div class="frame" aria-hidden="true">
    <div class="edge o"></div>
    <div class="edge i"></div>
    <div class="tickbar top"></div>
    <div class="tickbar bot"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner br"></div>
    <div class="corner bl"></div>
    <div class="orn top">
      <svg viewBox="0 0 260 18" fill="none" stroke="rgba(242,239,230,.55)" stroke-width="1">
        <path d="M0 9H110M150 9H260"/>
        <path d="M120 9l10-6 10 6-10 6z" fill="#f2efe6" stroke="none" opacity=".9"/>
        <path d="M100 4v10M108 6.5v5M152 6.5v5M160 4v10" opacity=".7"/>
      </svg>
    </div>
    <div class="orn bot">
      <svg viewBox="0 0 120 10" fill="none" stroke="rgba(242,239,230,.5)" stroke-width="1">
        <path d="M0 5H44M76 5H120"/><path d="M52 5h16" opacity=".8"/>
        <circle cx="48" cy="5" r="1.4" fill="#f2efe6" stroke="none"/><circle cx="72" cy="5" r="1.4" fill="#f2efe6" stroke="none"/>
      </svg>
    </div>
  </div>

  <div class="rail l">Neue Sachlichkeit</div>
  <div class="rail r">Apparat · № 308</div>
  <div class="toplabel">Mensch · Maschine</div>

  <div class="hud hud-tl" id="hudTL"><span class="mark"></span><span>№ 308 · Mannequin</span></div>
  <div class="hud hud-tr"><div class="song" id="hudSong"></div><div class="artist" id="hudArtist"></div></div>
  <div class="hud-bot">
    <span id="hudCur">00:00</span>
    <div class="gauge" id="gauge"><span class="needle" id="needle"></span></div>
    <span id="hudDur">00:00</span>
  </div>

  <div class="scrim"></div>
  <div class="scan"></div>
  <div class="grain" id="grain"></div>
  <div class="vignette"></div>
</div>
<script>
(function(){
  'use strict';
  var doc = document;
  var lyricEl = doc.getElementById('lyric');
  var plateEl = doc.getElementById('plate');
  var songEl = doc.getElementById('hudSong');
  var artistEl = doc.getElementById('hudArtist');
  var vacantEl = doc.getElementById('vacant');
  var stageEl = doc.getElementById('stage');
  var grainEl = doc.getElementById('grain');
  var lyricWrapEl = doc.getElementById('lyricWrap');
  var lyricIndexEl = doc.getElementById('lyricIndex');
  var lyricLabelEl = doc.getElementById('lyricLabel');
  var gaugeEl = doc.getElementById('gauge');
  var hudCurEl = doc.getElementById('hudCur');
  var hudDurEl = doc.getElementById('hudDur');

  function buildGrain(){
    var w = 200;
    var c = doc.createElement('canvas');
    c.width = w; c.height = w;
    var ctx = c.getContext && c.getContext('2d');
    if (!ctx) return;
    var img = ctx.createImageData(w, w), d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = 80 + (Math.random() * 175 | 0);
      d[i] = v; d[i+1] = v; d[i+2] = v;
      d[i+3] = 8 + (Math.random() * 30 | 0);
    }
    ctx.putImageData(img, 0, 0);
    grainEl.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
    grainEl.style.backgroundSize = w + 'px ' + w + 'px';
  }
  buildGrain();

  var S = {
    lines: [], idx: -1, text: '', t: 0, playing: true, frames: 0, js: 0, err: '',
    dur: 0, accent: [201,195,180], rm: false,
    tickT: 0, tickAt: 0, ready: false
  };
  var readySent = false, readyTimer = 0;

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function num(v,d){ v = +v; return isFinite(v) ? v : d; }
  function pad2(n){ n = Math.max(0, Math.floor(n)); return n < 10 ? '0' + n : '' + n; }
  function fmt(sec){ sec = Math.max(0, num(sec, 0)); return pad2(sec / 60) + ':' + pad2(sec % 60); }

  function ready(){
    if (readySent) return;
    readySent = true;
    S.ready = true;
    clearTimeout(readyTimer);
    try { parent.postMessage({ __c100:1, type:'ready' }, '*'); } catch(e){}
  }

  function makeLine(raw){
    raw = raw || {};
    var text = typeof raw.text === 'string' ? raw.text.replace(/\s+/g,' ').trim() : '';
    var t = Math.max(0, num(raw.t, 0));
    var dur = num(raw.dur, 0);
    if (!(dur > 0)) dur = Math.max(2.2, Math.min(9, text.length * 0.26));
    var cps = Array.from(text);
    var n = cps.length;
    var times = new Array(n);
    var cs = null;
    if (Array.isArray(raw.chars)) {
      cs = [];
      for (var k = 0; k < raw.chars.length; k++) {
        var c = raw.chars[k];
        if (c && typeof c.c === 'string' && isFinite(+c.t)) cs.push(Math.max(t, +c.t));
      }
    }
    var i;
    if (cs && cs.length > 1 && n) {
      for (i = 0; i < n; i++) times[i] = cs[Math.round(i * (cs.length - 1) / (n - 1))];
    } else {
      for (i = 0; i < n; i++) times[i] = t + (n ? i / n : 0) * dur * 0.9;
    }
    var prev = t;
    for (i = 0; i < n; i++) { times[i] = clamp(times[i], prev, t + dur); prev = times[i]; }
    return { t:t, dur:dur, text:text, times:times, spans:null, lastP:null, node:null };
  }

  function idxAt(t){
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (a[mid].t <= t + 0.02) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return best;
  }

  function buildLineNode(line){
    var node = doc.createElement('div');
    node.className = 'line';
    var spans = [], lastP = [], cps = Array.from(line.text);
    for (var i = 0; i < cps.length; i++) {
      var sp = doc.createElement('span');
      sp.className = 'ch';
      sp.textContent = cps[i];
      sp.style.opacity = '0.12';
      node.appendChild(sp);
      spans.push(sp); lastP.push(-1);
    }
    line.node = node; line.spans = spans; line.lastP = lastP;
  }

  function fitLine(node){
    node.style.fontSize = '';
    var base = parseFloat(getComputedStyle(node).fontSize) || 28;
    var maxW = lyricEl.clientWidth;
    var maxH = Math.max(96, Math.round(window.innerHeight * 0.30));
    var lo = 11, hi = base, best = base, mid, k;
    node.style.fontSize = base + 'px';
    for (k = 0; k < 7; k++) {
      mid = (lo + hi) / 2;
      node.style.fontSize = mid + 'px';
      if (node.scrollWidth <= maxW + 1 && node.scrollHeight <= maxH + 1) { best = mid; lo = mid; }
      else hi = mid;
    }
    node.style.fontSize = best.toFixed(1) + 'px';
  }

  function showLine(){
    var idx = S.idx, lines = S.lines;
    var ghosts = lyricEl.querySelectorAll('.line.leaving');
    for (var g = 0; g < ghosts.length; g++) {
      if (ghosts[g].parentNode) ghosts[g].parentNode.removeChild(ghosts[g]);
    }
    var old = lyricEl.querySelector('.line.on');
    if (old) {
      old.classList.remove('on');
      old.classList.add('leaving');
      (function(n){
        setTimeout(function(){ if (n.parentNode) n.parentNode.removeChild(n); }, 640);
      })(old);
    }
    if (idx < 0 || !lines[idx]) {
      S.text = '';
      lyricIndexEl.textContent = '—';
      lyricLabelEl.textContent = lines.length ? 'Standby' : 'No lyric';
      return;
    }
    var line = lines[idx], i;
    if (!line.node) buildLineNode(line);
    lyricIndexEl.textContent = pad2(idx + 1) + ' / ' + pad2(lines.length);
    lyricLabelEl.textContent = 'Lyric';
    for (i = 0; i < line.spans.length; i++) {
      line.spans[i].style.opacity = '0.12';
      line.lastP[i] = -1;
    }
    if (line.node.parentNode) line.node.parentNode.removeChild(line.node);
    line.node.classList.remove('leaving');
    lyricEl.appendChild(line.node);
    fitLine(line.node);
    void line.node.offsetWidth;
    line.node.classList.add('on');
    S.text = line.text;
    paintChars();
  }

  function paintChars(){
    var line = S.lines[S.idx];
    if (!line || !line.spans) return;
    for (var i = 0; i < line.spans.length; i++) {
      var p = clamp((S.t - line.times[i]) / 0.16, 0, 1);
      if (line.lastP[i] !== p) {
        line.lastP[i] = p;
        line.spans[i].style.opacity = (0.12 + 0.88 * p).toFixed(3);
      }
    }
  }

  function applyPayload(payload){
    payload = payload || {};
    var song = payload.song || {};
    var artists = song.artists;
    if (Array.isArray(artists)) artists = artists.filter(Boolean).join(' / ');
    if (typeof artists !== 'string') artists = '';
    var name = typeof song.name === 'string' ? song.name.trim() : '';
    songEl.textContent = name || 'Untitled';
    artistEl.textContent = artists.trim();
    artistEl.style.display = artists.trim() ? '' : 'none';
    S.dur = Math.max(0, num(payload.duration, 0));
    if (Array.isArray(payload.accent) && payload.accent.length >= 3) {
      S.accent = payload.accent.map(function(v){ return clamp(Math.round(num(v,0)),0,255); });
    }
    var a = S.accent;
    var dr = Math.round(a[0] * 0.42 + 196 * 0.58);
    var dg = Math.round(a[1] * 0.42 + 192 * 0.58);
    var db = Math.round(a[2] * 0.42 + 182 * 0.58);
    stageEl.style.setProperty('--acc-rgb', dr + ',' + dg + ',' + db);
    var raw = Array.isArray(payload.lines) ? payload.lines : [];
    var out = [];
    for (var i = 0; i < raw.length; i++) out.push(makeLine(raw[i]));
    out.sort(function(a,b){ return a.t - b.t; });
    S.lines = out;
    S.idx = -2;
    S.text = '';
    while (lyricEl.firstChild) lyricEl.removeChild(lyricEl.firstChild);
    var empty = out.length === 0;
    vacantEl.classList.toggle('on', empty);
    lyricWrapEl.style.display = empty ? 'none' : '';
    lyricIndexEl.textContent = '—';
    lyricLabelEl.textContent = empty ? 'No lyric' : 'Standby';
    hudDurEl.textContent = fmt(S.dur);
    hudCurEl.textContent = '00:00';
    gaugeEl.style.opacity = S.dur > 0 ? '' : '.35';
    gaugeEl.style.setProperty('--prog', '0');
    S.playing = payload.playing === false ? false : true;
    S.tickT = S.t; S.tickAt = performance.now();
    update();
  }

  var lastHud = 0;
  function update(){
    var now = performance.now();
    var t = S.tickT + (S.playing ? Math.min(0.35, (now - S.tickAt) / 1000) : 0);
    S.t = t;
    var idx = idxAt(t);
    if (idx !== S.idx) { S.idx = idx; showLine(); }
    else paintChars();
    if (now - lastHud > 160) {
      lastHud = now;
      hudCurEl.textContent = fmt(t);
      if (S.dur > 0) gaugeEl.style.setProperty('--prog', clamp(t / S.dur, 0, 1).toFixed(4));
    }
  }

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    if (d.type === 'init') {
      ready();
      applyPayload(d.payload);
    } else if (d.type === 'tick') {
      var p = d.payload || {};
      var nt = num(p.time, S.tickT);
      S.tickT = nt; S.tickAt = performance.now();
      if (typeof p.playing === 'boolean') S.playing = p.playing;
    } else if (d.type === 'beat') {
      var bl = clamp(num((d.payload || {}).level, 0.6), 0, 1);
      if (bl > tgt.beat) tgt.beat = bl;
    } else if (d.type === 'live') {
      var lp = d.payload || {};
      tgt.bass = clamp(num(lp.bass, 0), 0, 1);
      tgt.treble = clamp(num(lp.treble, 0), 0, 1);
      tgt.level = clamp(num(lp.level, 0), 0, 1);
      if (lp.playing === false) { tgt.bass = tgt.treble = tgt.level = 0; }
    }
  }, false);

  window.addEventListener('error', function(e){
    S.err = String((e && e.message) || 'error');
  }, false);

  var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq) {
    S.rm = !!mq.matches;
    var onMq = function(e){ S.rm = !!e.matches; };
    if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  }

  var tgt = { beat: 0, bass: 0, treble: 0, level: 0 };
  var smooth = { beat: 0, bass: 0, treble: 0, level: 0 };
  var varsAt = { beat: -1, bass: -1, treble: -1, level: -1 };

  function writeVars(){
    var d = S.rm ? 0.4 : 1;
    for (var k in smooth) {
      var v = Math.round(smooth[k] * d * 1000) / 1000;
      if (Math.abs(v - varsAt[k]) > 0.004) {
        varsAt[k] = v;
        stageEl.style.setProperty('--' + k, v);
      }
    }
  }

  function frame(now){
    var t0 = performance.now();
    update();
    tgt.beat *= 0.935;
    if (!S.playing) { tgt.bass *= 0.9; tgt.treble *= 0.9; tgt.level *= 0.9; }
    smooth.beat += (tgt.beat - smooth.beat) * 0.3;
    smooth.bass += (tgt.bass - smooth.bass) * 0.14;
    smooth.treble += (tgt.treble - smooth.treble) * 0.22;
    smooth.level += (tgt.level - smooth.level) * 0.12;
    writeVars();
    S.frames++;
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var rzTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rzTimer);
    rzTimer = setTimeout(function(){
      var line = S.lines[S.idx];
      if (line && line.node && line.node.classList.contains('on')) fitLine(line.node);
    }, 160);
  }, false);

  readyTimer = setTimeout(ready, 320);

  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: Math.round(S.t * 1000) / 1000,
      playing: !!S.playing, frames: S.frames, js: Math.round(S.js * 100) / 100,
      err: S.err, text: S.text, gl: false, rm: S.rm
    };
  };
})();
</script>
