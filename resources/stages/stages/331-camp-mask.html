<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>331 · 怪诞礼帽</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0708}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #root{position:fixed;inset:0;overflow:hidden;isolation:isolate}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  #bg{z-index:0}
  #fig{z-index:1}
  #scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(125% 95% at 16% 94%, rgba(7,5,9,.88) 0%, rgba(7,5,9,.58) 36%, rgba(7,5,9,0) 70%),
      linear-gradient(to top, rgba(7,5,9,.74) 0%, rgba(7,5,9,.20) 32%, rgba(7,5,9,0) 56%)}
  #type{position:absolute;inset:0;z-index:3;pointer-events:none}
  #veil{position:absolute;inset:0;z-index:4;pointer-events:none}

  .tiny{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#f0e7dd;opacity:.62}
  #credits{position:absolute;left:6.5vw;top:5.4vh;display:flex;align-items:center;gap:14px;color:#f0e7dd}
  #credits .mark{color:#fff6ea;opacity:.92;font-weight:700}
  #credits .hair{width:38px;height:1px;background:currentColor;opacity:.34}
  #song{position:absolute;right:6.5vw;top:5.4vh;max-width:42vw;text-align:right;
        font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#efe6dc;opacity:.58;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #meta{position:absolute;right:6.5vw;bottom:5.6vh;font-size:10px;letter-spacing:.3em;
        color:#efe6dc;opacity:.5;font-variant-numeric:tabular-nums}
  #meta b{font-weight:600;color:#fff6ea;opacity:.85}

  #lyric{position:absolute;left:6.5vw;bottom:11vh;width:46vw;max-width:760px}
  #prev{height:auto;margin-bottom:.5em;font-weight:500;color:#f0e7dd;opacity:.22;
        line-height:1.14;letter-spacing:.01em;overflow:hidden;white-space:nowrap;
        text-overflow:ellipsis;direction:ltr}
  #prev .c{opacity:.5}
  #line{font-weight:800;line-height:.98;letter-spacing:-.005em;color:#f7f0e7;
        word-break:break-word;overflow-wrap:anywhere;text-shadow:0 2px 34px rgba(0,0,0,.72)}
  #line .c{display:inline-block;opacity:.30;transform:translateY(.06em) scale(.985);
           transition:opacity .34s cubic-bezier(.2,.7,.1,1),transform .44s cubic-bezier(.2,.7,.1,1);
           will-change:opacity,transform}
  #line .c.on{opacity:1;transform:none}
  #line .sp{display:inline-block;width:.34em}
  #empty{position:absolute;left:6.5vw;bottom:16vh;max-width:52vw;display:none}
  #empty .big{font-size:clamp(20px,3.4vw,44px);line-height:1.16;font-weight:800;color:#f7f0e7;
              letter-spacing:-.01em;text-shadow:0 2px 30px rgba(0,0,0,.7)}
  #empty .sub{margin-top:18px;font-size:10px;letter-spacing:.4em;text-transform:uppercase;
              color:#efe6dc;opacity:.55}
  html.empty #lyric{display:none}
  html.empty #empty{display:block}

  #veil{background-image:repeating-linear-gradient(0deg,
        rgba(255,255,255,.055) 0 1px, rgba(0,0,0,0) 1px 3px);
        opacity:.30;mix-blend-mode:overlay}

  html.portrait #lyric{left:7vw;right:7vw;width:auto;max-width:none;bottom:8.5vh}
  html.portrait #prev{white-space:normal;overflow:visible;text-overflow:clip}
  html.portrait #song{max-width:50vw}
  html.portrait #empty{right:7vw;left:7vw;max-width:none;bottom:20vh}
  html.portrait #credits{left:7vw;top:4.6vh}
  html.portrait #song{right:7vw;top:4.6vh}
  @media (max-height:520px){
    #lyric{bottom:9vh}
    #credits,#song{top:4vh}
    #meta{bottom:4.5vh}
  }
  @media (prefers-reduced-motion: reduce){
    #line .c{transition:opacity .01s linear}
  }
</style>
</head>
<body>
<div id="root">
  <canvas id="bg"></canvas>
  <canvas id="fig"></canvas>
  <div id="scrim"></div>
  <div id="type">
    <div id="credits"><span class="mark">331</span><span class="hair"></span><span class="tiny">Grotesque Hat</span></div>
    <div id="song"></div>
    <div id="lyric">
      <div id="prev"></div>
      <div id="line"></div>
    </div>
    <div id="empty"><div class="big"></div><div class="sub">Instrumental · 无词</div></div>
    <div id="meta"><b>00</b> / 00</div>
  </div>
  <div id="veil"></div>
</div>
<script>
(function(){
  'use strict';
  var bgC = document.getElementById('bg'), figC = document.getElementById('fig');
  var bgx = bgC.getContext('2d'), figx = figC.getContext('2d');
  var lineEl = document.getElementById('line'), prevEl = document.getElementById('prev');
  var credEl = document.getElementById('credits'), songEl = document.getElementById('song');
  var metaEl = document.getElementById('meta'), emptyEl = document.getElementById('empty');
  var rootEl = document.documentElement;
  var W = 1440, H = 900, DPR = 1;

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
    text: '', gl: false, rm: false, dur: 0, accent: [214, 62, 48],
    song: { name: '', artists: '' }, beat: 0, level: 0
  };
  var readySent = false;

  function post(m){ try{ parent.postMessage(m, '*'); }catch(e){} }
  function fireReady(){
    if (readySent) return; readySent = true;
    post({ __c100:1, type:'ready' });
  }

  function num(v, d){ v = typeof v === 'number' ? v : parseFloat(v); return isFinite(v) ? v : d; }
  function str(v){ return v == null ? '' : String(v); }

  /* ---------- colour helpers: never let an illegal colour reach canvas ---------- */
  function c8(v){ v = Math.round(num(v, 0)); return v < 0 ? 0 : v > 255 ? 255 : v; }
  function rgbStr(c){ return 'rgb(' + c8(c[0]) + ',' + c8(c[1]) + ',' + c8(c[2]) + ')'; }
  function rgba(c, a){ a = num(a, 1); a = a < 0 ? 0 : a > 1 ? 1 : a; return 'rgba(' + c8(c[0]) + ',' + c8(c[1]) + ',' + c8(c[2]) + ',' + a + ')'; }
  function mix(a, b, k){
    k = num(k, .5); k = k < 0 ? 0 : k > 1 ? 1 : k;
    return [c8(a[0] + (b[0] - a[0]) * k), c8(a[1] + (b[1] - a[1]) * k), c8(a[2] + (b[2] - a[2]) * k)];
  }
  function addStop(g, at, col, a){
    try { g.addColorStop(Math.max(0, Math.min(1, num(at, 0))), rgba(col, a)); } catch(e){}
  }
  function radial(x, x0, y0, r0, x1, y1, r1){
    r0 = Math.max(0, num(r0, 0)); r1 = Math.max(r0 + .01, num(r1, 1));
    return x.createRadialGradient(x0, y0, r0, x1, y1, r1);
  }
  function linear(x, x0, y0, x1, y1){ return x.createLinearGradient(x0, y0, x1, y1); }
  function lerp(a, b, k){ return a + (b - a) * k; }

  /* ---------- textures (all local, onerror never blocks the show) ---------- */
  var TEX = { velvet: null, grain: null, satin: null };
  var dirty = true;
  function loadTex(key, src){
    var img = new Image();
    img.onload = function(){ TEX[key] = img; dirty = true; };
    img.onerror = function(){ TEX[key] = null; };
    img.src = src;
  }
  function coverRect(iw, ih, w, h){
    if (!iw || !ih) return [0, 0, w, h];
    var s = Math.max(w / iw, h / ih);
    var dw = iw * s, dh = ih * s;
    return [(w - dw) / 2, (h - dh) / 2, dw, dh];
  }

  function offscreen(w, h){
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    var x = c.getContext('2d');
    x.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
    return { c: c, x: x };
  }

  /* ---------- baked studio backdrop: one hot pool, everything else falls to black ---------- */
  var backdrop = null, grainPat = null, dotPat = null, bloomG = null;
  var lightX = .64, lightY = .36, poolR = .9;

  function makeTiles(){
    var g = TEX.grain;
    if (g && g.width > 8){
      var t = document.createElement('canvas'); t.width = 256; t.height = 256;
      var tx = t.getContext('2d');
      tx.drawImage(g, 40, 40, 256, 256, 0, 0, 256, 256);
      grainPat = bgx.createPattern(t, 'repeat');
    }
    var d = document.createElement('canvas'); d.width = 6; d.height = 6;
    var dx = d.getContext('2d');
    dx.fillStyle = 'rgba(0,0,0,.5)';
    dx.beginPath(); dx.arc(3, 3, 1.15, 0, 6.2832); dx.fill();
    dotPat = bgx.createPattern(d, 'repeat');
  }

  function bakeBackdrop(){
    var o = offscreen(W, H), x = o.x;
    var A = S.accent;
    var hot = mix(A, [255, 240, 220], .62);
    var mid = mix(A, [0, 0, 0], .34);
    var deep = mix(A, [0, 0, 0], .93);
    var cool = mix(A, [8, 10, 22], .82);
    var R = Math.max(W, H);

    x.fillStyle = rgbStr(deep);
    x.fillRect(-2, -2, W + 4, H + 4);

    /* the sweep: huge backlight the figure will be cut out of */
    var g1 = radial(x, W * lightX, H * lightY, R * .02, W * lightX, H * lightY, R * 1.02);
    addStop(g1, 0, hot, 1); addStop(g1, .16, mix(hot, mid, .5), 1);
    addStop(g1, .44, mid, 1); addStop(g1, .74, deep, 1); addStop(g1, 1, [0, 0, 0], 1);
    x.fillStyle = g1; x.fillRect(-2, -2, W + 4, H + 4);

    /* tighter core so the rim reads */
    var g2 = radial(x, W * lightX, H * (lightY - .04), R * .01, W * lightX, H * lightY, R * .46);
    addStop(g2, 0, [255, 250, 242], .82); addStop(g2, .42, hot, .40); addStop(g2, 1, hot, 0);
    x.fillStyle = g2; x.fillRect(-2, -2, W + 4, H + 4);

    /* photographic relief: real quilted-velvet photograph, desaturated, overlaid */
    if (TEX.velvet){
      x.save();
      try { x.filter = 'grayscale(1) contrast(1.15) brightness(1.05)'; } catch(e){}
      x.globalCompositeOperation = 'overlay';
      x.globalAlpha = .34;
      var r = coverRect(TEX.velvet.width, TEX.velvet.height, W, H);
      x.drawImage(TEX.velvet, r[0], r[1], r[2], r[3]);
      x.restore();
    }

    /* fine halftone screen: prints the light */
    if (dotPat){
      x.save(); x.globalCompositeOperation = 'multiply'; x.globalAlpha = .16;
      x.fillStyle = dotPat; x.fillRect(0, 0, W, H); x.restore();
    }

    /* ring light framing the headpiece — the studio lamp itself */
    var G = computeGeo();
    var ringR = G.brimRx * 1.13;
    x.save();
    x.globalCompositeOperation = 'lighter';
    var ringA = radial(x, G.brimX, G.brimY, ringR * .90, G.brimX, G.brimY, ringR * 1.10);
    addStop(ringA, 0, [0, 0, 0], 0); addStop(ringA, .5, [255, 244, 232], .16); addStop(ringA, 1, [0, 0, 0], 0);
    x.fillStyle = ringA; x.fillRect(0, 0, W, H);
    x.strokeStyle = rgba(mix(hot, [255, 255, 255], .45), .13);
    x.lineWidth = 1;
    x.beginPath(); x.arc(G.brimX, G.brimY, ringR, 0, TAU); x.stroke();
    x.restore();

    /* cold shadow on the type side, keeps the lyric legible */
    var g3 = linear(x, 0, H, W * .62, H * .18);
    addStop(g3, 0, cool, .86); addStop(g3, .55, cool, .30); addStop(g3, 1, cool, 0);
    x.fillStyle = g3; x.fillRect(0, 0, W, H);

    /* vignette */
    var g4 = radial(x, W * .5, H * .48, Math.min(W, H) * .28, W * .5, H * .48, R * .82);
    addStop(g4, 0, [0, 0, 0], 0); addStop(g4, .62, [0, 0, 0], .22); addStop(g4, 1, [0, 0, 0], .88);
    x.fillStyle = g4; x.fillRect(0, 0, W, H);

    backdrop = o.c;

    /* cached per-resize: the breathing bloom over the pool */
    bloomG = radial(bgx, W * lightX, H * lightY, R * .01, W * lightX, H * lightY, R * .55);
    addStop(bloomG, 0, mix(S.accent, [255, 246, 232], .85), 1);
    addStop(bloomG, .46, mix(S.accent, [255, 246, 232], .5), .62);
    addStop(bloomG, 1, S.accent, 0);
  }

  /* ---------- the sculpture: bust, grotesque hat, giant mouth ---------- */
  var figBake = null, lipsBake = null, Geo = null;
  var TAU = Math.PI * 2;

  function computeGeo(){
    var portrait = H > W * 1.05;
    var u = portrait ? Math.min(H * .0092, W * .023) : Math.min(H, W * .72) * .01;
    var hx = portrait ? W * .55 : W * .655;
    var hy = portrait ? H * .400 : H * .478;
    var uu = u;
    return {
      portrait: portrait, u: uu, hx: hx, hy: hy,
      headRx: 6.6 * uu, headRy: 8.3 * uu,
      brimX: hx - 1.5 * uu, brimY: hy - 16 * uu,
      brimRx: 52 * uu, brimRy: 11 * uu,
      crownX: hx - 2.5 * uu, crownY: hy - 25 * uu,
      crownRx: 23 * uu, crownRy: 17 * uu,
      lipsX: hx + 1.4 * uu, lipsY: hy - .8 * uu,
      lipsW: 24.5 * uu, lipsH: 12.6 * uu, lipRot: -.10
    };
  }

  function wobbly(x, cx, cy, rx, ry, rot, seed, amp){
    var N = 88, a, r, px, py, cs = Math.cos(rot), sn = Math.sin(rot);
    x.beginPath();
    for (var i = 0; i <= N; i++){
      a = i / N * TAU;
      r = 1 + Math.sin(a * 3 + seed) * amp + Math.sin(a * 5 - seed * 1.7) * amp * .5;
      px = Math.cos(a) * rx * r; py = Math.sin(a) * ry * r;
      var X = cx + px * cs - py * sn, Y = cy + px * sn + py * cs;
      if (i === 0) x.moveTo(X, Y); else x.lineTo(X, Y);
    }
    x.closePath();
  }

  function lipPath(x, w, h){
    var hw = w / 2, hh = h / 2;
    x.beginPath();
    x.moveTo(-hw, -hh * .02);
    x.bezierCurveTo(-hw * .70, -hh * .62, -hw * .40, -hh * .88, -hw * .17, -hh * .71);
    x.bezierCurveTo(-hw * .07, -hh * .58, hw * .07, -hh * .58, hw * .17, -hh * .71);
    x.bezierCurveTo(hw * .40, -hh * .88, hw * .70, -hh * .62, hw * .99, -hh * .02);
    x.bezierCurveTo(hw * .86, hh * .32, hw * .50, hh * .92, hw * .02, hh * .94);
    x.bezierCurveTo(-hw * .46, hh * .92, -hw * .82, hh * .34, -hw, -hh * .02);
    x.closePath();
  }

  function bakeFigure(){
    if (!Geo) Geo = computeGeo();
    var g = Geo, u = g.u, hx = g.hx, hy = g.hy;
    var o = offscreen(W, H), x = o.x;
    var dark = mix(S.accent, [5, 4, 6], .94);
    var lx = W * lightX, ly = H * lightY;

    function lit(alphaK){
      var gg = radial(x, lx, ly, 0, lx, ly, Math.max(W, H) * .72);
      addStop(gg, 0, [255, 250, 241], .34 * alphaK);
      addStop(gg, .20, mix([255, 238, 216], S.accent, .45), .19 * alphaK);
      addStop(gg, .48, S.accent, .05 * alphaK);
      addStop(gg, 1, dark, 0);
      return gg;
    }

    var paths = [];
    /* --- bust / cape --- */
    var sw = 40 * u, sy = hy + 27 * u;
    var bust = function(){
      x.beginPath();
      x.moveTo(hx - sw * 1.62, H + 14);
      x.bezierCurveTo(hx - sw * 1.50, sy + 46 * u, hx - sw * 1.08, sy + 15 * u, hx - sw * .56, sy + 1.5 * u);
      x.bezierCurveTo(hx - sw * .24, sy - 7 * u, hx + sw * .28, sy - 8 * u, hx + sw * .62, sy - 1 * u);
      x.bezierCurveTo(hx + sw * 1.26, sy + 18 * u, hx + sw * 1.62, sy + 50 * u, hx + sw * 1.88, H + 14);
      x.closePath();
    };
    /* --- neck --- */
    var nw = 3.6 * u;
    var neck = function(){
      x.beginPath();
      x.moveTo(hx - nw, hy + 4 * u);
      x.lineTo(hx - nw * 1.30, hy + 25 * u);
      x.lineTo(hx + nw * 1.30, hy + 25 * u);
      x.lineTo(hx + nw, hy + 4 * u);
      x.closePath();
    };
    var head = function(){ wobbly(x, hx, hy, g.headRx, g.headRy, -.06, 1.1, .022); };
    var brim = function(){ wobbly(x, g.brimX, g.brimY, g.brimRx, g.brimRy, -.075, 2.4, .062); };
    var crown = function(){ wobbly(x, g.crownX, g.crownY, g.crownRx, g.crownRy, .03, 4.2, .05); };

    x.fillStyle = rgbStr(dark);
    [bust, neck, head, crown, brim].forEach(function(f){ f(); x.fill(); });

    /* real velvet photo printed onto the hat, gives the felt a body */
    if (TEX.velvet){
      x.save();
      brim(); x.clip();
      try { x.filter = 'grayscale(1) contrast(1.3) brightness(.9)'; } catch(e){}
      x.globalCompositeOperation = 'overlay'; x.globalAlpha = .55;
      var rr = coverRect(TEX.velvet.width, TEX.velvet.height, W, H);
      x.globalAlpha = .55;
      x.drawImage(TEX.velvet, rr[0], rr[1], rr[2], rr[3]);
      x.restore();
      x.save();
      crown(); x.clip();
      try { x.filter = 'grayscale(1) contrast(1.45) brightness(.75)'; } catch(e){}
      x.globalCompositeOperation = 'overlay'; x.globalAlpha = .5;
      rr = coverRect(TEX.velvet.width, TEX.velvet.height, W, H * 1.3);
      x.drawImage(TEX.velvet, rr[0], rr[1] + H * .25, rr[2], rr[3]);
      x.restore();
    }

    /* hat band in the accent, a single band of colour under the crown */
    x.save();
    x.globalAlpha = .9;
    var bandG = linear(x, g.crownX - g.crownRx, 0, g.crownX + g.crownRx, 0);
    addStop(bandG, 0, mix(S.accent, [0, 0, 0], .75), 1);
    addStop(bandG, .45, mix(S.accent, [255, 220, 190], .35), 1);
    addStop(bandG, 1, mix(S.accent, [0, 0, 0], .8), 1);
    x.fillStyle = bandG;
    x.beginPath();
    x.ellipse(g.crownX, g.brimY - g.brimRy * .80, g.crownRx * .94, g.brimRy * .31, -.02, 0, TAU);
    x.fill();
    x.restore();

    /* veil netting: hand-drawn lines from crown to brim edge */
    x.save();
    x.globalAlpha = .07;
    x.strokeStyle = '#f4ece4';
    x.lineWidth = Math.max(.5, u * .09);
    for (var i = 0; i < 26; i++){
      var a = i / 26 * TAU;
      x.beginPath();
      x.moveTo(g.crownX + Math.cos(a) * g.crownRx * .55, g.brimY - g.brimRy * .30 + Math.sin(a) * g.crownRy * .4);
      x.lineTo(g.brimX + Math.cos(a) * g.brimRx * 1.02, g.brimY + Math.sin(a) * g.brimRy * 1.02);
      x.stroke();
    }
    x.restore();

    /* bristling quills around the brim: the headpiece is a sculpture, not a hat */
    x.save();
    x.globalCompositeOperation = 'lighter';
    x.strokeStyle = lit(2.4);
    x.lineWidth = Math.max(.7, u * .085);
    for (var q = 0; q < 44; q++){
      var aq = q / 44 * TAU;
      var len = (.10 + .07 * Math.sin(q * 1.7) + .04 * Math.cos(q * 2.31)) * g.brimRx;
      x.beginPath();
      x.moveTo(g.brimX + Math.cos(aq) * g.brimRx * .985, g.brimY + Math.sin(aq) * g.brimRy * .985);
      x.lineTo(g.brimX + Math.cos(aq) * (g.brimRx * .985 + len),
               g.brimY + Math.sin(aq) * (g.brimRy * .985 + len * .40));
      x.stroke();
    }
    x.restore();

    /* shadow cast by the brim onto the face */
    x.save();
    head(); x.clip();
    var sg = linear(x, 0, g.brimY, 0, g.brimY + g.headRy * 2.1);
    addStop(sg, 0, [0, 0, 0], .92); addStop(sg, .55, [0, 0, 0], .55); addStop(sg, 1, [0, 0, 0], 0);
    x.fillStyle = sg; x.fillRect(hx - g.headRx * 2, g.brimY - g.brimRy, g.headRx * 4, g.headRy * 4);
    x.restore();

    /* backlight pass: paint the light straight into the silhouette */
    x.save();
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = lit(1);
    x.fillRect(-2, -2, W + 4, H + 4);
    x.restore();

    /* and a crisp lit edge where the body faces the lamp */
    x.save();
    x.globalCompositeOperation = 'lighter';
    x.strokeStyle = lit(2.6);
    x.lineWidth = Math.max(2, u * .55);
    [bust, neck, head, crown, brim].forEach(function(f){ f(); x.stroke(); });
    x.strokeStyle = lit(3.4);
    x.lineWidth = Math.max(1, u * .16);
    [bust, neck, head, crown, brim].forEach(function(f){ f(); x.stroke(); });
    x.restore();

    figBake = o.c;
    bakeLips();
  }

  function bakeLips(){
    var g = Geo;
    var lw = Math.ceil(g.lipsW * 1.35), lh = Math.ceil(g.lipsH * 1.55);
    g.lipCanvasW = lw; g.lipCanvasH = lh;
    var c = document.createElement('canvas');
    c.width = Math.round(lw * DPR); c.height = Math.round(lh * DPR);
    var x = c.getContext('2d');
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    x.translate(lw / 2, lh / 2);
    var w = g.lipsW, h = g.lipsH, hh = h / 2;

    var base = mix(S.accent, [178, 18, 34], .58);
    var hotc = mix(base, [255, 168, 132], .5);
    var deepc = mix(base, [40, 2, 8], .62);

    lipPath(x, w, h);
    var lg = linear(x, 0, -hh, 0, hh);
    addStop(lg, 0, deepc, 1);
    addStop(lg, .30, base, 1);
    addStop(lg, .52, hotc, 1);
    addStop(lg, .72, base, 1);
    addStop(lg, 1, deepc, 1);
    x.fillStyle = lg; x.fill();

    /* the parting */
    x.save();
    lipPath(x, w, h); x.clip();
    x.strokeStyle = rgba(mix(deepc, [0, 0, 0], .5), .9);
    x.lineWidth = Math.max(1, h * .035);
    x.beginPath();
    x.moveTo(-w * .48, -hh * .02);
    x.quadraticCurveTo(0, hh * .10, w * .48, -hh * .02);
    x.stroke();

    /* satin photograph as the lip surface */
    if (TEX.satin){
      try { x.filter = 'grayscale(1) contrast(1.5) brightness(1.1)'; } catch(e){}
      x.globalCompositeOperation = 'overlay'; x.globalAlpha = .38;
      var rr = coverRect(TEX.satin.width, TEX.satin.height, w, h);
      x.drawImage(TEX.satin, rr[0] - w * .25, rr[1], rr[2] * 1.5, rr[3]);
      try { x.filter = 'none'; } catch(e){}
      x.globalCompositeOperation = 'source-over';
      x.globalAlpha = 1;
    }

    /* wet speculars */
    x.globalCompositeOperation = 'lighter';
    var spec = function(cx, cy, rx, ry, a){
      var s = radial(x, cx, cy, 0, cx, cy, Math.max(rx, ry));
      addStop(s, 0, [255, 252, 248], a); addStop(s, .5, [255, 240, 230], a * .35); addStop(s, 1, [255, 255, 255], 0);
      x.fillStyle = s;
      x.beginPath(); x.ellipse(cx, cy, rx, ry, -.18, 0, TAU); x.fill();
    };
    spec(-w * .17, -hh * .30, w * .16, hh * .16, .55);
    spec(w * .28, -hh * .22, w * .10, hh * .10, .38);
    spec(-w * .05, hh * .34, w * .28, hh * .22, .45);
    spec(w * .30, hh * .30, w * .10, hh * .10, .30);
    x.restore();

    /* backlit rim */
    x.save();
    x.globalCompositeOperation = 'lighter';
    x.strokeStyle = rgba([255, 236, 226], .5);
    x.lineWidth = Math.max(1, h * .022);
    lipPath(x, w, h); x.stroke();
    x.restore();

    lipsBake = c;
  }

  function drawFig(){
    var x = figx;
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = 1;
    x.clearRect(0, 0, W, H);
    if (!figBake || !Geo) return;
    var g = Geo;
    var ox = Math.sin(clock * .21) * W * .0045 + Math.sin(clock * .57) * W * .0017;
    var oy = Math.cos(clock * .16) * H * .0040 + Math.sin(clock * .87) * H * .0013;
    if (S.rm){ ox *= .22; oy *= .22; }
    x.drawImage(figBake, ox, oy, W, H);
    if (lipsBake){
      x.save();
      x.translate(g.lipsX + ox * 1.45, g.lipsY + oy * 1.45);
      x.rotate(g.lipRot + Math.sin(clock * .38) * .006);
      var s = 1 + pulse * .04;
      x.scale(s, s);
      var lw = g.lipCanvasW, lh = g.lipCanvasH;
      x.drawImage(lipsBake, -lw / 2, -lh / 2, lw, lh);
      x.globalCompositeOperation = 'lighter';
      x.globalAlpha = .10 + Math.min(.5, pulse * .34);
      x.drawImage(lipsBake, -lw / 2, -lh / 2, lw, lh);
      x.restore();
    }
  }

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = w; H = h;
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    [bgC, figC].forEach(function(c){
      c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    });
    bgx.setTransform(DPR,0,0,DPR,0,0); figx.setTransform(DPR,0,0,DPR,0,0);
    rootEl.classList.toggle('portrait', H > W * 1.05);
    dirty = true;
    if (S.lines.length && S.idx >= 0) renderLine();
  }

  function bake(){
    try {
      if (!grainPat) makeTiles();
      Geo = computeGeo();
      bakeBackdrop();
      bakeFigure();
    } catch (e) { /* keep whatever last rendered cleanly */ }
    dirty = false;
  }

  /* ---- lyric text ---- */
  var spans = [], times = [], lit = -1, curText = '';

  function charTimes(ln, txt){
    var n = txt.length, out = new Array(n), i;
    var t0 = ln.t, run = Math.max(.35, ln.dur), chs = ln.chars;
    if (Array.isArray(chs) && chs.length){
      var ok = chs.length === n;
      if (ok) for (i = 0; i < chs.length; i++){ if (!chs[i] || !isFinite(num(chs[i].t, NaN))) { ok = false; break; } }
      if (ok) for (i = 0; i < n; i++) out[i] = num(chs[i].t, t0);
      else {
        var m = chs.length;
        for (i = 0; i < n; i++){
          var j = Math.round(i * (m - 1) / Math.max(1, n - 1));
          j = j < 0 ? 0 : j > m - 1 ? m - 1 : j;
          out[i] = num(chs[j] && chs[j].t, t0 + run * i / Math.max(1, n));
        }
      }
    } else {
      for (i = 0; i < n; i++) out[i] = t0 + run * i / Math.max(1, n);
    }
    for (i = 1; i < n; i++){ var a = num(out[i], t0), b = num(out[i - 1], t0); if (a < b) out[i] = b + .001; }
    return out;
  }

  function fitLine(txt){
    var box = document.getElementById('lyric');
    var bw = Math.max(120, box.clientWidth || W * .42);
    var portrait = H > W * 1.05;
    var maxH = Math.max(64, H * (portrait ? .26 : .30));
    var minS = 13;
    var maxS = Math.max(minS + 2, Math.min(H * .13, bw / 5.5, 140));
    var unit = 0, i, c;
    for (i = 0; i < txt.length; i++){
      c = txt.charCodeAt(i);
      unit += (c >= 0x2e80) ? 1 : (c === 32 ? .30 : .53);
    }
    unit = Math.max(.6, unit);
    var s = maxS;
    for (var step = 0; step < 20; step++){
      s = maxS - (maxS - minS) * step / 19;
      var lines = Math.ceil(unit * s / bw);
      if (lines * s * 1.02 <= maxH) break;
    }
    var fs = Math.max(minS, Math.round(s));
    lineEl.style.fontSize = fs + 'px';
    prevEl.style.fontSize = Math.max(11, Math.round(fs * .30)) + 'px';
  }

  function litTo(k){
    var a = spans, i;
    k = k > a.length - 1 ? a.length - 1 : k;
    if (k > lit){
      for (i = lit + 1; i <= k; i++) if (a[i]) a[i].className = 'c on';
    } else if (k < lit){
      for (i = lit; i > k && i >= 0; i--) if (a[i]) a[i].className = 'c';
    }
    lit = k;
  }

  function renderLine(){
    var ln = S.lines[S.idx];
    var prev = S.idx > 0 ? S.lines[S.idx - 1] : null;
    prevEl.textContent = (S.idx > 0 && prev) ? prev.text : '';
    lineEl.textContent = '';
    spans = []; times = []; lit = -1;
    if (!ln){ curText = ''; S.text = ''; updateMeta(); return; }
    S.text = ln.text; curText = ln.text;
    var txt = ln.text;
    times = charTimes(ln, txt);
    var frag = document.createDocumentFragment(), k = 0;
    for (var i = 0; i < txt.length; i++){
      var ch = txt.charAt(i);
      if (ch === ' ' || ch === '\t'){
        var sp = document.createElement('span'); sp.className = 'sp'; frag.appendChild(sp);
      } else {
        var el = document.createElement('span'); el.className = 'c'; el.textContent = ch;
        frag.appendChild(el); spans.push(el); spans[spans.length - 1].__t = times[k]; k++;
      }
    }
    lineEl.appendChild(frag);
    fitLine(txt);
    updateMeta();
    updateLit(true);
  }

  function updateLit(force){
    var n = spans.length;
    if (!n) { lit = -1; return; }
    var lo = 0, hi = n - 1, r = -1, m;
    while (lo <= hi){
      m = (lo + hi) >> 1;
      if (num(spans[m].__t, 0) <= S.t + 1e-4){ r = m; lo = m + 1; } else hi = m - 1;
    }
    if (force) lit = -99;
    if (r !== lit) litTo(r);
  }

  function pad2(v){ v = Math.max(0, Math.min(99, Math.round(num(v, 0)))); return v < 10 ? '0' + v : '' + v; }
  function updateMeta(){
    var n = S.lines.length, i = S.idx;
    metaEl.innerHTML = '<b>' + (i >= 0 ? pad2(i + 1) : '--') + '</b> / ' + pad2(n);
  }

  function pick(t){
    var a = S.lines, lo = 0, hi = a.length - 1, r = -1;
    while (lo <= hi){
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 1e-4){ r = m; lo = m + 1; } else hi = m - 1;
    }
    return r;
  }
  function sync(){
    var i = pick(S.t);
    if (i !== S.idx){ S.idx = i; renderLine(); }
  }

  /* ---- message protocol ---- */
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === 'init'){
      var arr = Array.isArray(p.lines) ? p.lines : [];
      S.lines = arr.map(function(l, i){
        var t = num(l && l.t, 0);
        return { t: t, dur: Math.max(0.2, num(l && l.dur, 3)), text: str(l && l.text), chars: (l && l.chars) || null, i: i };
      }).filter(function(l){ return l.text.replace(/\s/g, '').length > 0; })
        .sort(function(a, b){ return a.t - b.t; });
      S.dur = num(p.duration, 0);
      if (Array.isArray(p.accent) && p.accent.length >= 3){
        var na = [c8(p.accent[0]), c8(p.accent[1]), c8(p.accent[2])];
        if (Math.abs(na[0] - S.accent[0]) + Math.abs(na[1] - S.accent[1]) + Math.abs(na[2] - S.accent[2]) > 8){
          S.accent = na; dirty = true;
        }
      }
      var sg = p.song || {};
      var ar = sg.artists;
      S.song = { name: str(sg.name), artists: Array.isArray(ar) ? ar.map(str).join(' / ') : str(ar) };
      songEl.textContent = (S.song.name || 'UNTITLED') + (S.song.artists ? '  —  ' + S.song.artists : '');
      emptyEl.querySelector('.big').textContent = S.song.name || S.song.artists || 'Untitled';
      rootEl.classList.toggle('empty', S.lines.length === 0);
      S.playing = p.playing !== false;
      S.idx = -2; S.text = '';
      renderLine(); sync();
      updateMeta();
    } else if (d.type === 'tick'){
      S.t = num(p.time, S.t);
      S.playing = p.playing !== false;
      sync();
    } else if (d.type === 'beat'){
      S.beat = num(p.level, .6); S.beatIdx = num(p.index, 0);
      pulse = Math.min(1.6, pulse + .55 + S.beat * .5);
    } else if (d.type === 'live'){
      S.level = num(p.level, 0);
      S.playing = p.playing !== false;
    }
  });

  /* ---- loop ---- */
  var t0 = 0, last = 0, clock = 0, pulse = 0, glow = 0, lastJx = 0;
  function drawBack(){
    var x = bgx;
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = 1;
    x.clearRect(0, 0, W, H);
    if (backdrop) x.drawImage(backdrop, 0, 0, W, H);
    else { x.fillStyle = '#0b0708'; x.fillRect(0, 0, W, H); }

    /* the pool breathes with the low end */
    if (bloomG){
      x.globalCompositeOperation = 'lighter';
      x.globalAlpha = .04 + glow * .10;
      x.fillStyle = bloomG;
      x.fillRect(0, 0, W, H);
      x.globalAlpha = 1;
      x.globalCompositeOperation = 'source-over';
    }

    /* real scanned film grain, jittered every frame */
    if (grainPat){
      x.save();
      x.globalCompositeOperation = 'overlay';
      x.globalAlpha = .085 + glow * .05;
      x.translate(-((Math.random() * 256) | 0), -((Math.random() * 256) | 0));
      x.fillStyle = grainPat;
      x.fillRect(0, 0, W + 256, H + 256);
      x.restore();
    }
  }

  function frame(now){
    requestAnimationFrame(frame);
    var js0 = performance.now();
    if (!t0) t0 = now;
    var dt = Math.min(0.06, (now - last) / 1000 || 0.016); last = now;
    clock += dt;
    S.frames++;
    if (dirty) { bake(); }
    pulse *= Math.pow(.0016, dt);
    glow = lerp(glow, Math.max(S.level, 0) * .7 + pulse * .9, Math.min(1, dt * 6));
    drawBack();
    drawFig();

    /* misregistration jitter: the type slips off the print on a hit */
    if (!S.rm && pulse > .02){
      var jx = Math.round(pulse * 6 * Math.sin(clock * 47) * 10) / 10;
      if (Math.abs(jx - lastJx) > .25){ lastJx = jx; lineEl.style.transform = 'translate3d(' + jx + 'px,0,0)'; }
    } else if (lastJx !== 0){
      lastJx = 0; lineEl.style.transform = 'none';
    }

    updateLit();
    S.js = performance.now() - js0;
    fireReady();
  }

  window.__stage = function(){
    return { lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing, frames: S.frames,
             js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm };
  };

  var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  S.rm = !!(mq && mq.matches);
  loadTex('velvet', 'assets/331-velvet.jpg');
  loadTex('grain', 'assets/331-grain.jpg');
  loadTex('satin', 'assets/331-satin.jpg');
  resize();
  window.addEventListener('resize', resize, { passive:true });
  requestAnimationFrame(frame);
  setTimeout(fireReady, 60);
})();
</script>
</body>
</html>
