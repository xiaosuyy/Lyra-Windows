<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>319 · PUNK ACTION / TYPOGRAPHIC PASTICHE</title>
<style>
  :root{
    --paper:#f1e9da; --ink:#0d0c0b; --pink:#f6a6bf; --hot:#e8356f;
    --mint:#a8e4c2; --deep:#18735a; --cream:#fbf6ea;
    --acc:#f6a6bf; --accInk:#a83a61;
    --pad:clamp(10px,1.5vw,26px);
    --hair:clamp(1px,.09vw,2px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{
    font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- paper ground ---------- */
  #stage{
    position:fixed;inset:0;display:flex;flex-direction:column;
    padding:var(--pad);gap:clamp(7px,1.1vh,16px);
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.75), transparent 42%),
      radial-gradient(circle at 88% 96%, rgba(232,53,111,.07), transparent 38%),
      var(--paper);
    overflow:hidden;
  }
  /* halftone dot field, fades toward the middle */
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(13,12,11,.16) 0.9px, transparent 1px);
    background-size:4px 4px;opacity:.34;
    -webkit-mask-image:radial-gradient(120% 100% at 50% 50%, transparent 45%, #000 100%);
            mask-image:radial-gradient(120% 100% at 50% 50%, transparent 45%, #000 100%);
  }
  /* classic double keyline, printed on the sheet */
  #stage::after{
    content:"";position:absolute;inset:calc(var(--pad)*.42);pointer-events:none;z-index:0;
    border:var(--hair) solid rgba(13,12,11,.55);
    box-shadow:inset 0 0 0 calc(var(--hair)*2.5) var(--paper),
               inset 0 0 0 calc(var(--hair)*3.5) rgba(13,12,11,.28);
  }
  /* colour blocks peeking from the edges */
  #blobs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #blobs i{position:absolute;display:block}
  #blobs .b1{right:-9%;top:4%;width:26%;height:38%;background:var(--pink);border-radius:50%;opacity:.5}
  #blobs .b2{left:-4%;bottom:-6%;width:30%;height:26%;background:var(--mint);transform:rotate(-7deg);opacity:.55}
  #blobs .b3{left:36%;top:-3%;width:30%;height:6px;background:var(--ink);opacity:.18;transform:rotate(-1.2deg)}

  /* ---------- header : classic sleeve typography ---------- */
  #head{
    position:relative;z-index:3;flex:0 0 auto;
    display:flex;align-items:baseline;justify-content:space-between;gap:2vw;
    background:var(--pink);
    padding:clamp(5px,.75vh,11px) clamp(8px,1.1vw,18px) clamp(4px,.6vh,9px);
    text-transform:uppercase;
  }
  #head .no{font-size:clamp(9px,.95vw,13px);letter-spacing:.16em;font-weight:700;white-space:nowrap}
  #head .no b{font-size:1.5em;letter-spacing:0}
  #head .no i{font-style:normal;opacity:.4}
  #head .kick{
    flex:1;text-align:center;font-size:clamp(8px,.85vw,12px);letter-spacing:.32em;
    font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.82;
  }
  #head .right{font-size:clamp(8px,.8vw,11px);letter-spacing:.2em;opacity:.62;white-space:nowrap}
  #head .right em{font-style:normal;color:var(--cream)}

  /* ---------- photo ---------- */
  #photo{
    position:relative;z-index:2;flex:0 0 45%;min-height:0;overflow:hidden;
    background:#060606;
    transform:rotate(-.9deg);
    box-shadow:
      clamp(7px,1vw,15px) clamp(7px,1vw,15px) 0 0 var(--pink),
      calc(clamp(7px,1vw,15px) * -1) calc(clamp(7px,1vw,15px) * -.4) 0 0 var(--mint),
      0 0 0 var(--hair) var(--ink);
  }
  #chaos{position:absolute;inset:0;width:100%;height:100%;display:block;filter:contrast(1.18) grayscale(1)}
  #photo .scrim{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(0deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.05) 34%, transparent 60%),
      radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%);
  }
  #photo .tag{
    position:absolute;left:clamp(8px,1vw,14px);top:clamp(8px,1vw,14px);z-index:2;
    display:flex;align-items:center;gap:.5em;
    background:var(--hot);color:var(--cream);
    font-size:clamp(7px,.72vw,10px);font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    padding:.42em .7em;transform:rotate(-1.4deg);
  }
  #photo .tag u{display:inline-block;width:.5em;height:.5em;background:var(--cream);border-radius:50%;animation:blip 1.1s steps(2,end) infinite}
  @keyframes blip{50%{opacity:.15}}
  #photo .cap{
    position:absolute;left:clamp(10px,1.4vw,20px);right:clamp(10px,1.4vw,20px);bottom:clamp(8px,1.2vh,16px);z-index:2;
    display:flex;align-items:flex-end;justify-content:space-between;gap:2vw;color:var(--cream);
  }
  #photo .cap .l{min-width:0}
  #photo .cap .tno{
    display:inline-block;background:var(--cream);color:var(--ink);
    font-size:clamp(7px,.7vw,10px);letter-spacing:.2em;font-weight:700;
    padding:.2em .55em;margin-bottom:.55em;text-transform:uppercase;
  }
  #photo .cap .sname{
    font-family:Georgia,"Times New Roman","Songti SC",serif;
    font-size:clamp(15px,2.1vw,34px);line-height:1.05;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    text-shadow:0 1px 12px rgba(0,0,0,.7);
  }
  #photo .cap .sartist{
    display:block;margin-top:.4em;font-size:clamp(7px,.72vw,10px);letter-spacing:.24em;
    text-transform:uppercase;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #photo .tc{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:clamp(9px,1vw,14px);letter-spacing:.12em;color:var(--cream);opacity:.86;white-space:nowrap;
  }
  #photo .tc b{color:var(--pink);font-weight:400}

  /* ---------- lyrics ---------- */
  #lyr{
    position:relative;z-index:3;flex:1 1 auto;min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:0 clamp(2px,1.2vw,18px);
  }
  #lyr .idxno{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    font-family:Georgia,serif;font-size:clamp(34px,7vw,110px);line-height:.8;
    color:var(--acc);opacity:.34;letter-spacing:-.04em;user-select:none;
  }
  #lines{width:100%;text-align:center;transform-origin:50% 50%;will-change:transform}
  .ln{
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    font-size:clamp(26px,4.6vw,78px);line-height:1.16;letter-spacing:.005em;
    color:var(--ink);
    animation:lnIn .40s cubic-bezier(.2,.75,.25,1) backwards;
  }
  @keyframes lnIn{from{opacity:0;transform:translateY(.12em) skewX(-.6deg)}to{opacity:1;transform:none}}
  .w{display:inline-block;white-space:pre;transform:rotate(var(--r,0deg)) translateY(var(--y,0em))}
  .w.hi{box-shadow:inset 0 -.16em 0 rgba(246,166,191,.5)}
  .ch{
    display:inline-block;white-space:pre;
    color:transparent;-webkit-text-stroke:1px rgba(13,12,11,.34);
    transition:color .18s ease, opacity .18s ease, transform .18s ease;
  }
  .ch.on{color:var(--ink);-webkit-text-stroke:0px transparent}
  .ch.now{color:var(--accInk);-webkit-text-stroke:0px transparent;transform:translateY(-.06em)}
  .ln.gone{opacity:.3}
  #next{
    position:absolute;right:0;top:0;max-width:46%;
    font-family:Georgia,serif;font-size:clamp(9px,1vw,14px);letter-spacing:.06em;
    opacity:.34;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;
    transition:opacity .25s ease;
  }
  body.tight #lyr .idxno{opacity:.1}
  body.tight #next{opacity:.14}
  #empty,#pre{
    font-family:Georgia,serif;font-size:clamp(14px,1.9vw,26px);letter-spacing:.3em;
    text-transform:uppercase;opacity:.45;
  }
  #empty span,#pre span{display:block;font-size:.5em;letter-spacing:.5em;margin-top:1.4em;opacity:.8}
  #pre span{letter-spacing:.18em}
  #pre{animation:breathe 2.8s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.26}}

  /* ---------- footer ---------- */
  #foot{
    position:relative;z-index:3;flex:0 0 auto;
    display:flex;align-items:center;gap:clamp(8px,1.4vw,22px);
    background:var(--mint);
    padding:clamp(5px,.75vh,10px) clamp(8px,1.1vw,18px);
    font-size:clamp(7px,.72vw,10px);letter-spacing:.2em;text-transform:uppercase;
  }
  #foot .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
  #foot .who b{font-weight:700}
  #foot .prog{flex:1;position:relative;height:clamp(3px,.45vh,6px);background:rgba(13,12,11,.2)}
  #foot .prog i{
    position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--ink);
    box-shadow:clamp(3px,.3vw,5px) 0 0 0 var(--cream);
  }
  #foot .clock{white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}

  @media (max-aspect-ratio:4/5){
    #photo{flex-basis:39%}
    #head .kick{letter-spacing:.2em}
    #head .right{display:none}
    #lyr .idxno{font-size:22vw;opacity:.18}
    #foot .who{max-width:46%}
    #next{max-width:68%;top:0}
  }
  @media (max-width:560px){
    #head .kick{display:none}
    #foot .clock{display:none}
    #photo .cap .sartist{letter-spacing:.14em}
  }
  @media (prefers-reduced-motion:reduce){
    #photo .tag u{animation:none}
    #pre{animation:none;opacity:.4}
    .ln{animation:none}
    .ch{transition:none}
    #next{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="blobs"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <header id="head">
    <span class="no">N° <b>15</b> <i>/</i> 50</span>
    <span class="kick">Deconstructivist Punk Action</span>
    <span class="right">Typographic Pastiche <em>·</em> Side A</span>
  </header>
  <section id="photo">
    <canvas id="chaos"></canvas>
    <div class="scrim"></div>
    <span class="tag"><u></u>Live · Focus Lost</span>
    <div class="cap">
      <div class="l">
        <span class="tno" id="tno">Track 15</span>
        <div class="sname" id="sname">Untitled</div>
        <span class="sartist" id="sartist">Unknown Artist</span>
      </div>
      <div class="tc"><b id="tc">00:00</b></div>
    </div>
  </section>
  <section id="lyr">
    <div class="idxno" id="idxno">01</div>
    <div id="lines"></div>
    <div id="next"></div>
  </section>
  <footer id="foot">
    <span class="who">Now · <b id="fname">Untitled</b></span>
    <div class="prog"><i id="bar"></i></div>
    <span class="clock"><span id="tc2">00:00</span> / <span id="dur">00:00</span></span>
  </footer>
</div>
<script>
(function(){
  'use strict';
  var TAU = Math.PI * 2;
  var $ = function(s){ return document.querySelector(s); };
  var linesEl = $('#lines'), lyrEl = $('#lyr'), photoEl = $('#photo'), cv = $('#chaos');
  var snameEl = $('#sname'), sartistEl = $('#sartist'), tnoEl = $('#tno'), tcEl = $('#tc');
  var tc2El = $('#tc2'), durEl = $('#dur'), idxnoEl = $('#idxno'), nextEl = $('#next');
  var fnameEl = $('#fname'), barEl = $('#bar');

  var lines = [], idx = -1, t = 0, playing = true, frames = 0, jsMs = 0, err = '';
  var song = {}, duration = 0, cur = null, curEnded = false;
  var charSpans = [], charTimes = [], revealPtr = 0, nowEl = null;
  var accent = [246, 166, 191];
  var energy = 0, flash = 0, bounce = 0, lastBounce = 0;
  var lastBar = -1, lastSec = -1;
  var rm = false;
  try { rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { rm = false; }

  /* ---------------- protocol: ready 只报一次 ---------------- */
  function ready(){
    if (ready.done) return;
    ready.done = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) {}
  }

  /* ---------------- helpers ---------------- */
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function fmt(s){ s = Math.max(0, s || 0); var m = Math.floor(s / 60); return pad2(m) + ':' + pad2(Math.floor(s - m * 60)); }
  function toChars(txt){ return Array.from(String(txt == null ? '' : txt)); }
  function clean(v){ return typeof v === 'string' ? v.replace(/\s+/g, ' ').trim() : ''; }
  function artistsOf(a){
    if (Array.isArray(a)) return a.map(clean).filter(Boolean).join(' / ');
    return clean(a);
  }
  function rnd(a, b){ var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }
  function isCJK(ch){
    var c = ch.codePointAt(0);
    return (c >= 0x2e80 && c <= 0x9fff) || (c >= 0xf900 && c <= 0xfaff) ||
           (c >= 0x3040 && c <= 0x30ff) || (c >= 0xac00 && c <= 0xd7af) ||
           (c >= 0xff00 && c <= 0xffef);
  }
  function shade(c, k){
    return 'rgb(' + Math.min(255, Math.round(c[0] * k)) + ',' +
           Math.min(255, Math.round(c[1] * k)) + ',' +
           Math.min(255, Math.round(c[2] * k)) + ')';
  }
  function applyAccent(c){
    if (!Array.isArray(c) || c.length < 3) return;
    var lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
    var ink = lum > 0.55 ? shade(c, 0.42) : shade(c, 1);
    var root = document.documentElement.style;
    root.setProperty('--acc', 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')');
    root.setProperty('--accInk', ink);
  }

  /* ---------------- 元信息 ---------------- */
  function updateMeta(){
    var name = clean(song && song.name) || 'UNTITLED';
    var art = artistsOf(song && song.artists) || 'UNKNOWN ARTIST';
    snameEl.textContent = name;
    fnameEl.textContent = name;
    sartistEl.textContent = art;
    tnoEl.textContent = 'TRACK 15';
    durEl.textContent = duration > 0 ? fmt(duration) : '--:--';
    document.title = '319 · ' + name;
  }

  /* ---------------- 逐字时序 ---------------- */
  function evenTimes(line, n){
    var t0 = line.t || 0;
    var span = line.dur > 0 ? line.dur : Math.max(1.2, n * 0.16);
    var out = [], i;
    for (i = 0; i < n; i++) out.push(t0 + span * 0.86 * (n > 1 ? i / (n - 1) : 0));
    return out;
  }
  function times(line, n){
    var cs = line.chars, out = [], i;
    if (Array.isArray(cs) && cs.length === n) {
      for (i = 0; i < n; i++) {
        var c0 = cs[i];
        out.push(c0 && typeof c0.t === 'number' ? c0.t : (line.t || 0));
      }
      for (i = 1; i < n; i++) if (out[i] < out[i - 1]) out[i] = out[i - 1];
      return out;
    }
    out = evenTimes(line, n);
    for (i = 1; i < n; i++) if (out[i] < out[i - 1]) out[i] = out[i - 1];
    return out;
  }

  /* 切成可换行的字块：CJK 每 4 字一块，拉丁每 13 字符一块 */
  function tokenize(txt){
    var arr = toChars(txt), out = [], i = 0;
    while (i < arr.length) {
      var ch = arr[i];
      if (/\s/.test(ch)) { out.push({ sp: true }); i++; continue; }
      var cjk = isCJK(ch), run = [];
      while (i < arr.length && !/\s/.test(arr[i]) && isCJK(arr[i]) === cjk) { run.push(arr[i]); i++; }
      var step = cjk ? 4 : 13;
      for (var k = 0; k < run.length; k += step) out.push({ ch: run.slice(k, k + step) });
    }
    return out;
  }

  function fit(row){
    if (lyrEl.clientHeight < 40) return;
    var availH = lyrEl.clientHeight * 0.92;
    var availW = Math.max(80, linesEl.clientWidth);
    row.style.fontSize = '';
    var fs = parseFloat(getComputedStyle(row).fontSize) || 40;
    var guard = 0;
    while (guard++ < 14 && fs > 13 && (row.scrollHeight > availH + 1 || row.scrollWidth > availW + 1)) {
      fs *= 0.9;
      row.style.fontSize = fs.toFixed(1) + 'px';
    }
    if (document.body) document.body.classList.toggle('tight', row.scrollWidth > availW * 0.78);
  }

  function buildLine(i){
    charSpans = []; charTimes = []; revealPtr = 0; nowEl = null; cur = null; curEnded = false;
    linesEl.textContent = '';
    if (document.body) document.body.classList.remove('tight');
    idxnoEl.textContent = i >= 0 ? pad2(i + 1) : '00';
    nextEl.textContent = '';
    if (i >= 0 && lines[i + 1]) {
      var nx = clean(lines[i + 1].text);
      if (nx) nextEl.textContent = '↳ ' + (nx.length > 30 ? nx.slice(0, 30) + '…' : nx);
    }
    var line = lines[i];
    if (!line) {
      if (lines.length) {
        var pre = document.createElement('div');
        pre.id = 'pre';
        pre.textContent = 'INTRO';
        var sb = document.createElement('span');
        sb.textContent = '等待第一句 / stand by';
        pre.appendChild(sb);
        linesEl.appendChild(pre);
      }
      return;
    }
    var chars = toChars(line.text);
    if (!chars.length) {
      var gap = document.createElement('div');
      gap.className = 'ln';
      gap.style.opacity = '.22';
      gap.textContent = '—';
      linesEl.appendChild(gap);
      cur = gap;
      return;
    }
    var srcTimes = times(line, chars.length);
    var row = document.createElement('div');
    row.className = 'ln';
    var frag = document.createDocumentFragment();
    var toks = tokenize(line.text);
    var src = 0; // 源文本字符指针，保证逐字时间与 span 一一对齐（空白不建 span）
    charTimes = [];
    for (var k = 0; k < toks.length; k++) {
      var tk = toks[k];
      if (tk.sp) { frag.appendChild(document.createTextNode(' ')); src++; continue; }
      var w = document.createElement('span');
      w.className = 'w';
      var r = (rnd(i + 1, k + 1) - 0.5) * 4.4;
      var y = (rnd(i + 3, k + 2) - 0.5) * 0.18;
      w.style.setProperty('--r', r.toFixed(2) + 'deg');
      w.style.setProperty('--y', y.toFixed(3) + 'em');
      if (rnd(i + 7, k + 5) > 0.88) w.className += ' hi';
      for (var j = 0; j < tk.ch.length; j++) {
        var sp = document.createElement('span');
        sp.className = 'ch';
        sp.textContent = tk.ch[j];
        w.appendChild(sp);
        charSpans.push(sp);
        charTimes.push(srcTimes[src + j]);
      }
      src += tk.ch.length;
      frag.appendChild(w);
    }
    row.appendChild(frag);
    linesEl.appendChild(row);
    cur = row;
    fit(row);
  }

  function markNow(el){
    if (nowEl === el) return;
    if (nowEl) nowEl.classList.remove('now');
    nowEl = el;
    if (el) el.classList.add('now');
  }

  function reveal(){
    var n = charTimes.length, target = 0;
    while (target < n && charTimes[target] <= t) target++;
    if (target === revealPtr) return;
    while (revealPtr < target) { charSpans[revealPtr].classList.add('on'); revealPtr++; }
    while (revealPtr > target) { revealPtr--; charSpans[revealPtr].classList.remove('on'); charSpans[revealPtr].classList.remove('now'); }
    markNow(revealPtr > 0 ? charSpans[revealPtr - 1] : null);
  }

  function updateIdx(){
    var n = lines.length, i = -1;
    for (var k = 0; k < n; k++) { if (lines[k].t <= t) i = k; else break; }
    if (i !== idx) { idx = i; buildLine(i); }
  }

  function showEmpty(){
    linesEl.textContent = '';
    var em = document.createElement('div');
    em.id = 'empty';
    em.textContent = 'INSTRUMENTAL';
    var sp = document.createElement('span');
    sp.textContent = 'NO LYRICS ON THIS SIDE';
    em.appendChild(sp);
    linesEl.appendChild(em);
    nextEl.textContent = '';
    idxnoEl.textContent = '00';
    charSpans = []; charTimes = []; revealPtr = 0; nowEl = null; cur = null; idx = -1;
  }

  function refreshClock(){
    var sec = Math.floor(t);
    if (sec === lastSec) return;
    lastSec = sec;
    var s = fmt(t);
    tcEl.textContent = s;
    tc2El.textContent = s;
  }

  function refreshBar(){
    var p = duration > 0 ? Math.min(1, Math.max(0, t / duration)) : 0;
    var q = Math.round(p * 1000) / 10;
    if (q === lastBar) return;
    lastBar = q;
    barEl.style.width = q + '%';
  }

  /* ---------------- 主视觉：程序化黑白失焦现场 ---------------- */
  var Art = (function(){
    var ctx = cv.getContext('2d');
    var base = document.createElement('canvas');
    var bx = base.getContext('2d');
    var W = 0, H = 0, built = false;

    function grain(c){
      var s = 220;
      var g = document.createElement('canvas');
      g.width = s; g.height = s;
      var gc = g.getContext('2d');
      var im = gc.createImageData(s, s), d = im.data;
      for (var i = 0; i < d.length; i += 4) {
        d[i] = d[i + 1] = d[i + 2] = Math.random() < 0.5 ? 0 : 255;
        d[i + 3] = Math.random() * 96;
      }
      gc.putImageData(im, 0, 0);
      c.save();
      c.globalCompositeOperation = 'overlay';
      c.globalAlpha = 0.5;
      c.fillStyle = c.createPattern(g, 'repeat');
      c.fillRect(0, 0, W, H);
      c.restore();
    }

    function figure(c, dx, dy, alpha, blur){
      var R = H * 1.3;                  // 以画面高度为基准，宽画幅也不会被拉扁
      var cx = W * 0.52 + dx, hy = H * 0.36 + dy;
      c.filter = 'blur(' + blur.toFixed(1) + 'px)';
      c.fillStyle = 'rgba(2,2,3,' + alpha.toFixed(3) + ')';
      c.strokeStyle = 'rgba(2,2,3,' + alpha.toFixed(3) + ')';
      c.lineCap = 'round';
      c.lineJoin = 'round';
      // 躯干（裁到画底，像一张被切断的现场照）
      c.beginPath();
      c.moveTo(cx - R * 0.24, H * 1.08);
      c.lineTo(cx - R * 0.26, hy + R * 0.12);
      c.quadraticCurveTo(cx - R * 0.20, hy + R * 0.04, cx, hy + R * 0.035);
      c.quadraticCurveTo(cx + R * 0.21, hy + R * 0.05, cx + R * 0.25, hy + R * 0.14);
      c.lineTo(cx + R * 0.30, H * 1.08);
      c.closePath();
      c.fill();
      // 头
      c.beginPath();
      c.ellipse(cx, hy, R * 0.115, R * 0.128, -0.16, 0, TAU);
      c.fill();
      // 鸡冠头 / 乱发
      for (var k = 0; k < 8; k++) {
        var a = -2.05 + k * 0.28;
        var len = R * (0.09 + rnd(k + 2, 5) * 0.09);
        var sx0 = cx + Math.cos(a) * R * 0.085;
        var sy0 = hy + Math.sin(a) * R * 0.095;
        c.beginPath();
        c.moveTo(sx0 - R * 0.030, sy0 + R * 0.035);
        c.lineTo(sx0 + Math.cos(a) * len, sy0 + Math.sin(a) * len);
        c.lineTo(sx0 + R * 0.030, sy0 - R * 0.030);
        c.closePath();
        c.fill();
      }
      // 甩起来的左臂
      c.lineWidth = R * 0.075;
      c.beginPath();
      c.moveTo(cx - R * 0.21, hy + R * 0.12);
      c.quadraticCurveTo(cx - R * 0.40, hy - R * 0.06, cx - R * 0.62, hy - R * 0.30);
      c.stroke();
      // 抡琴的右臂
      c.beginPath();
      c.moveTo(cx + R * 0.20, hy + R * 0.12);
      c.quadraticCurveTo(cx + R * 0.36, hy - R * 0.02, cx + R * 0.52, hy - R * 0.14);
      c.stroke();
      // 琴颈
      c.lineWidth = R * 0.034;
      c.beginPath();
      c.moveTo(cx + R * 0.74, hy - R * 0.30);
      c.lineTo(cx + R * 0.10, hy + R * 0.44);
      c.stroke();
      // 琴身
      c.beginPath();
      c.ellipse(cx + R * 0.06, hy + R * 0.50, R * 0.13, R * 0.20, -0.62, 0, TAU);
      c.fill();
    }

    function build(){
      if (!W || !H) return;
      base.width = W;
      base.height = H;
      bx.setTransform(1, 0, 0, 1, 0, 0);
      bx.globalCompositeOperation = 'source-over';
      bx.globalAlpha = 1;
      bx.filter = 'none';
      bx.fillStyle = '#050506';
      bx.fillRect(0, 0, W, H);

      var s = Math.min(W, H);
      var far = Math.max(W, H);
      var lx = W * 0.615, ly = H * 0.395;

      bx.filter = 'blur(' + (s * 0.045).toFixed(1) + 'px)';
      var g1 = bx.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * 0.78);
      g1.addColorStop(0, 'rgba(255,255,255,.96)');
      g1.addColorStop(0.10, 'rgba(236,236,236,.72)');
      g1.addColorStop(0.34, 'rgba(148,148,148,.20)');
      g1.addColorStop(1, 'rgba(0,0,0,0)');
      bx.fillStyle = g1;
      bx.fillRect(0, 0, W, H);

      bx.globalCompositeOperation = 'lighter';
      bx.filter = 'blur(' + (s * 0.014).toFixed(1) + 'px)';
      for (var i = 0; i < 64; i++) {
        var a = -2.55 + rnd(i, 3) * 2.9;
        var len = far * (0.30 + rnd(i, 7) * 1.05);
        bx.lineWidth = s * (0.003 + rnd(i, 11) * 0.026);
        bx.strokeStyle = 'rgba(255,255,255,' + (0.025 + rnd(i, 13) * 0.10).toFixed(3) + ')';
        bx.beginPath();
        bx.moveTo(lx + Math.cos(a) * s * 0.05, ly + Math.sin(a) * s * 0.05);
        bx.lineTo(lx + Math.cos(a) * len, ly + Math.sin(a) * len);
        bx.stroke();
      }
      bx.globalCompositeOperation = 'source-over';

      for (var e = 5; e >= 1; e--) {
        var kk = e / 5;
        figure(bx, -kk * H * 0.085, kk * H * 0.030, 0.12 + (1 - kk) * 0.30, H * (0.004 + kk * 0.030));
        figure(bx, kk * H * 0.060, -kk * H * 0.045, 0.08 + (1 - kk) * 0.20, H * (0.004 + kk * 0.030));
      }
      figure(bx, 0, 0, 0.96, H * 0.002);

      bx.filter = 'blur(' + (s * 0.0015).toFixed(2) + 'px)';
      for (var d = 0; d < 42; d++) {
        var px = W * (0.66 + rnd(d, 21) * 0.36);
        var py = H * (0.02 + rnd(d, 22) * 0.52);
        var sz = s * (0.004 + rnd(d, 23) * 0.022);
        bx.save();
        bx.translate(px, py);
        bx.rotate(rnd(d, 24) * TAU);
        bx.fillStyle = 'rgba(255,255,255,' + (0.25 + rnd(d, 25) * 0.7).toFixed(2) + ')';
        bx.beginPath();
        bx.moveTo(-sz, 0);
        bx.lineTo(sz * 0.7, -sz * 0.55);
        bx.lineTo(sz * 0.15, sz);
        bx.closePath();
        bx.fill();
        bx.restore();
      }

      bx.filter = 'blur(' + (s * 0.05).toFixed(1) + 'px)';
      var g2 = bx.createRadialGradient(W * 0.80, H * 0.27, 0, W * 0.80, H * 0.27, s * 0.30);
      g2.addColorStop(0, 'rgba(255,255,255,.55)');
      g2.addColorStop(1, 'rgba(255,255,255,0)');
      bx.fillStyle = g2;
      bx.fillRect(0, 0, W, H);

      bx.filter = 'none';
      var g3 = bx.createRadialGradient(W * 0.5, H * 0.46, s * 0.15, W * 0.5, H * 0.5, Math.max(W, H) * 0.82);
      g3.addColorStop(0, 'rgba(0,0,0,0)');
      g3.addColorStop(0.62, 'rgba(0,0,0,.18)');
      g3.addColorStop(1, 'rgba(0,0,0,.92)');
      bx.fillStyle = g3;
      bx.fillRect(0, 0, W, H);
      grain(bx);
      built = true;
    }

    function draw(ms, en, fl){
      if (!built || !W || !H) return;
      var amp = rm ? 0 : (1.1 + en * 9 + fl * 16);
      var ox = (Math.sin(ms * 0.0023) + Math.sin(ms * 0.0071) * 0.6) * amp;
      var oy = (Math.cos(ms * 0.0019) * 0.8 + Math.sin(ms * 0.0053)) * amp * 0.6;
      var zoom = 1 + (rm ? 0 : en * 0.010 + fl * 0.016);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#050506';
      ctx.fillRect(0, 0, W, H);

      var dw = W * zoom, dh = H * zoom;
      ctx.drawImage(base, (W - dw) / 2 + ox, (H - dh) / 2 + oy, dw, dh);

      if (!rm && fl > 0.22) {
        var band = H * 0.05;
        var by = rnd(Math.floor(ms / 80), 4) * (H - band);
        var off = (rnd(Math.floor(ms / 80), 9) - 0.5) * W * 0.07 * fl;
        ctx.drawImage(base, 0, by, W, band, off, by, W, band);
      }
      if (fl > 0.01) {
        ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.16, fl * 0.14).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
      }
      if (!rm) {
        var sx = W * (0.5 + Math.sin(ms * 0.0009) * 0.42);
        var lg = ctx.createLinearGradient(sx - W * 0.18, 0, sx + W * 0.18, 0);
        lg.addColorStop(0, 'rgba(255,255,255,0)');
        lg.addColorStop(0.5, 'rgba(255,255,255,' + (0.035 + en * 0.06).toFixed(3) + ')');
        lg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(sx - W * 0.18, 0, W * 0.36, H);
      }
    }

    function resize(){
      var r = photoEl, w0 = r.clientWidth, h0 = r.clientHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 1.25);
      var w = Math.max(2, Math.round(w0 * dpr));
      var h = Math.max(2, Math.round(h0 * dpr));
      var cap = 1900 / Math.max(w, 1);
      if (cap < 1) { w = Math.round(w * cap); h = Math.round(h * cap); }
      if (w === W && h === H) return;
      W = w; H = h;
      cv.width = W; cv.height = H;
      build();
      draw(performance.now(), 0, 0);
    }

    return { resize: resize, draw: draw, isBuilt: function(){ return built; } };
  })();

  /* ---------------- 每帧 ---------------- */
  var lastPaint = 0;
  function frame(now){
    frames++;
    var t0 = performance.now();

    if (now - lastPaint >= 32) {
      lastPaint = now;
      Art.draw(now, energy, flash);
      flash *= 0.82;
      bounce *= rm ? 0 : 0.86;
    }
    if (!rm) energy *= 0.985;

    reveal();
    refreshClock();
    refreshBar();

    if (cur && idx >= 0) {
      var ended = lines[idx].dur > 0 && t > lines[idx].t + lines[idx].dur + 0.5;
      if (ended !== curEnded) { curEnded = ended; cur.classList.toggle('gone', ended); }
    }
    if (!rm && Math.abs(bounce - lastBounce) > 0.05) {
      lastBounce = bounce;
      linesEl.style.transform = 'translateY(' + (-bounce).toFixed(2) + 'px)';
    }

    jsMs = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  /* ---------------- 协议 ---------------- */
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') {
        var p = d.payload || {};
        song = (p.song && typeof p.song === 'object') ? p.song : {};
        duration = (typeof p.duration === 'number' && isFinite(p.duration)) ? Math.max(0, p.duration) : 0;
        accent = (Array.isArray(p.accent) && p.accent.length >= 3) ? p.accent : accent;
        applyAccent(accent);
        var raw = Array.isArray(p.lines) ? p.lines : [];
        lines = [];
        for (var li = 0; li < raw.length; li++) {
          var l = raw[li] || {};
          lines.push({
            t: (typeof l.t === 'number' && isFinite(l.t)) ? l.t : 0,
            dur: (typeof l.dur === 'number' && isFinite(l.dur)) ? Math.max(0, l.dur) : 0,
            text: (l.text == null ? '' : String(l.text)),
            chars: Array.isArray(l.chars) ? l.chars : null
          });
        }
        for (var q = 1; q < lines.length; q++) {
          if (lines[q].t < lines[q - 1].t) lines[q].t = lines[q - 1].t;
        }
        playing = p.playing !== false;
        updateMeta();
        lastSec = -1; lastBar = -1;
        idx = -2;
        if (!lines.length) showEmpty();
        else updateIdx();
      } else if (d.type === 'tick') {
        var tp = d.payload || {};
        if (typeof tp.time === 'number' && isFinite(tp.time)) t = tp.time;
        if (typeof tp.playing === 'boolean') playing = tp.playing;
        if (lines.length) { updateIdx(); reveal(); }
      } else if (d.type === 'beat') {
        var bp = d.payload || {};
        var lv = (typeof bp.level === 'number' && isFinite(bp.level)) ? Math.min(1, Math.max(0, bp.level)) : 0.6;
        flash = Math.max(flash, lv);
        bounce = 5 + lv * 7;
        energy = Math.max(energy, lv * 0.85);
      } else if (d.type === 'live') {
        var lp = d.payload || {};
        if (typeof lp.level === 'number' && isFinite(lp.level)) energy = Math.min(1, Math.max(0, lp.level));
        if (lp.playing === false) energy *= 0.6;
      }
    } catch (ex) {
      err = String(ex && ex.message ? ex.message : ex);
    }
  });

  /* ---------------- 自检口 ---------------- */
  window.__stage = function(){
    var text = (idx >= 0 && lines[idx]) ? String(lines[idx].text || '') : '';
    return {
      lines: lines.length,
      idx: idx < 0 ? -1 : idx,
      t: t,
      playing: playing,
      frames: frames,
      js: jsMs,
      err: err,
      text: text,
      gl: false,
      rm: rm
    };
  };

  /* ---------------- 启动 ---------------- */
  requestAnimationFrame(function(){
    ready();
    requestAnimationFrame(frame);
    try { Art.resize(); } catch (e) { err = String(e && e.message ? e.message : e); }
  });
  setTimeout(ready, 200);
  setTimeout(function(){
    try { Art.resize(); if (cur) fit(cur); } catch (e) {}
  }, 420);

  if (window.ResizeObserver) {
    var pending = 0;
    var ro = new ResizeObserver(function(){
      if (pending) return;
      pending = requestAnimationFrame(function(){
        pending = 0;
        try { Art.resize(); if (cur) fit(cur); } catch (e) { err = String(e && e.message ? e.message : e); }
      });
    });
    ro.observe(photoEl);
  } else {
    var rz = 0;
    window.addEventListener('resize', function(){
      clearTimeout(rz);
      rz = setTimeout(function(){ Art.resize(); if (cur) fit(cur); }, 140);
    });
  }
})();
</script>
</body>
</html>
