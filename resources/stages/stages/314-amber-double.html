<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>琥珀重影 · amber double</title>
<style>
  :root{
    --amber:#e8811a; --ember:#ffb347; --crimson:#c1121f; --ink:#070302; --acc:#e8811a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#070302}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
    color:#f6e3c8; -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#070302}
  #stage::after{
    content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
    box-shadow:inset 0 0 150px 34px rgba(6,2,1,.86), inset 0 0 1px 1px rgba(255,150,60,.10);
  }
  canvas#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #veil{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(78% 62% at 16% 96%, rgba(8,3,2,.86), rgba(8,3,2,0) 68%),
      linear-gradient(to top, rgba(7,3,2,.90) 0%, rgba(7,3,2,.55) 14%, rgba(7,3,2,0) 46%),
      radial-gradient(140% 100% at 50% 50%, rgba(0,0,0,0) 50%, rgba(4,1,1,.38) 100%);
  }

  #lyr{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 7vw 8.5vh;
  }
  #meta{
    font-size:clamp(10px,.86vw,13px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,179,71,.55);margin-bottom:clamp(12px,1.8vh,26px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72vw;
  }
  #meta::before{
    content:'';display:inline-block;width:.62em;height:.62em;margin-right:1em;
    background:var(--acc);box-shadow:0 0 16px var(--acc);vertical-align:baseline;
  }
  #linewrap{position:relative;max-width:min(78vw,1180px);--fs:clamp(30px,4.6vw,74px)}
  .ly{
    font-weight:800;line-height:1.18;letter-spacing:.02em;
    font-size:var(--fs);
    white-space:pre-wrap;overflow-wrap:anywhere;
  }
  #main{
    position:relative;color:#ffd79b;
    text-shadow:0 2px 26px rgba(0,0,0,.6),0 0 60px rgba(255,120,40,.18);
  }
  #main .ch{text-shadow:0 2px 22px rgba(0,0,0,.55),0 0 34px rgba(255,140,50,.30)}
  .ghost{position:absolute;inset:0;pointer-events:none;user-select:none;opacity:.38}
  #g1{color:#a81a26}
  #g2{color:#ffb347;opacity:.28}
  .ch{opacity:.22;transition:opacity .18s linear}
  .ch.on{opacity:1}
  #linewrap.gap .ly{opacity:.34;transition:opacity .5s ease}
  #empty{
    position:absolute;inset:0;z-index:3;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:1.2em;
    padding:0 9vw;text-align:center;pointer-events:none;
  }
  #empty.show{display:flex}
  #empty .t{font-size:clamp(22px,3.2vw,48px);font-weight:800;letter-spacing:.16em;color:#ffcf95;
    text-shadow:0 0 46px rgba(255,140,50,.45)}
  #empty .s{font-size:clamp(10px,1.05vw,14px);letter-spacing:.36em;color:rgba(255,179,71,.5)}
  #empty .r{width:min(240px,42vw);height:1px;background:linear-gradient(90deg,transparent,rgba(255,179,71,.55),transparent)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="veil"></div>
  <div id="lyr">
    <div id="meta"></div>
    <div id="linewrap">
      <div id="g2" class="ly ghost"></div>
      <div id="g1" class="ly ghost"></div>
      <div id="main" class="ly"></div>
    </div>
  </div>
  <div id="empty"><div class="t">器乐 · 无词</div><div class="r"></div><div class="s">INSTRUMENTAL · NO LYRICS</div></div>
</div>
<script>
(function(){
  'use strict';
  var M = function(o){ try{ parent.postMessage(o, '*'); }catch(e){} };

  /* ---- ready: 首帧报一次，绝不在 init 里重报 ---- */
  var saidReady = false;
  function fireReady(){
    if(saidReady) return;
    saidReady = true;
    M({__c100:1, type:'ready'});
  }
  requestAnimationFrame(fireReady);
  setTimeout(fireReady, 420);

  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', text: '', gl: false, rm: false, accent: [232,129,26]
  };
  try{ S.rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}

  var elMain = document.getElementById('main');
  var elG1   = document.getElementById('g1');
  var elG2   = document.getElementById('g2');
  var elMeta = document.getElementById('meta');
  var elEmpty= document.getElementById('empty');
  var elWrap = document.getElementById('linewrap');

  /* ==================================================================
     画布层：琥珀剧场 —— 暖光晕 / 火焰笔触 / 舞台光束 / 颗粒
     全部程序化生成，运行时零外部请求
     ================================================================== */
  var cv  = document.getElementById('bg');
  var ctx = cv.getContext('2d', { alpha:false });
  var W = 1, H = 1, DPR = 1;
  var gradA = null, gradB = null, gradV = null, grainPat = null;
  var beamX = [0,0,0], beamW = [0,0,0], beamGrad = [null,null,null];
  var flameTex = null;      // 火焰笔触团（一次性生成）
  var dust = [];
  for(var di=0; di<30; di++){
    dust.push({
      x: rnd(di*3.7), y: rnd(di*5.9), v: 0.3 + rnd(di*8.1)*1.4,
      r: 0.7 + rnd(di*11.3)*1.9, a: 0.10 + rnd(di*13.7)*0.30,
      s: 0.6 + rnd(di*17.1)*1.6
    });
  }

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function rnd(seed){ // 稳定的伪随机
    var x = Math.sin(seed*127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  /* --- 火焰笔触纹理：把浓烈橙红画成团状，边缘自然衰减 --- */
  function buildFlame(){
    var S0 = 700;
    var c = document.createElement('canvas');
    c.width = c.height = S0;
    var g = c.getContext('2d');
    g.clearRect(0,0,S0,S0);

    // 底层：大块暖雾
    var i, r0;
    for(i=0;i<7;i++){
      r0 = S0*(0.16 + rnd(i*3.1)*0.16);
      var cx0 = S0*(0.5 + (rnd(i*7.7)-0.5)*0.42);
      var cy0 = S0*(0.52 + (rnd(i*5.3)-0.5)*0.4);
      var rg = g.createRadialGradient(cx0,cy0,0,cx0,cy0,r0);
      var hue = i%2 ? '232,129,26' : '193,18,31';
      rg.addColorStop(0, 'rgba('+hue+',0.20)');
      rg.addColorStop(1, 'rgba('+hue+',0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(cx0,cy0,r0,0,6.2832); g.fill();
    }

    // 笔触：竖向拉长的火苗
    for(i=0;i<300;i++){
      var a = rnd(i*1.37), b = rnd(i*2.71), d = rnd(i*4.19);
      var x = S0*(0.06 + a*0.88);
      var y = S0*(0.06 + b*0.88);
      var len = S0*(0.05 + d*0.20);
      var wid = 1.2 + rnd(i*6.1)*5.5;
      var tilt = (rnd(i*8.3)-0.5)*0.55;
      var hot = rnd(i*9.9);
      var col = hot < 0.28 ? '255,196,110' : (hot < 0.7 ? '232,129,26' : '186,26,36');
      g.save();
      g.translate(x,y); g.rotate(-1.5708 + tilt);
      g.strokeStyle = 'rgba('+col+','+(0.10 + hot*0.30)+')';
      g.lineWidth = wid; g.lineCap = 'round';
      g.beginPath(); g.moveTo(0, -len*0.5); g.quadraticCurveTo(len*0.16, 0, 0, len*0.5); g.stroke();
      g.restore();
    }
    // 边缘衰减，避免出现硬边
    g.globalCompositeOperation = 'destination-in';
    var m = g.createRadialGradient(S0/2,S0/2,S0*0.06,S0/2,S0/2,S0*0.50);
    m.addColorStop(0,'rgba(0,0,0,1)');
    m.addColorStop(0.62,'rgba(0,0,0,0.85)');
    m.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = m; g.fillRect(0,0,S0,S0);
    flameTex = c;
  }

  /* --- 颗粒：程序化噪点图案 --- */
  function buildGrain(){
    var N = 96, c = document.createElement('canvas');
    c.width = c.height = N;
    var g = c.getContext('2d');
    var img = g.createImageData(N,N), px = img.data;
    for(var i=0;i<px.length;i+=4){
      var v = 128 + (Math.random()*2-1)*96;
      px[i] = px[i+1] = px[i+2] = v; px[i+3] = 255;
    }
    g.putImageData(img,0,0);
    grainPat = ctx.createPattern(c, 'repeat');
  }

  function buildGradients(){
    var cx = W*0.64, cy = H*0.42, r = Math.max(W,H)*0.78;
    gradA = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    gradA.addColorStop(0,   'rgba(255,150,52,0.62)');
    gradA.addColorStop(0.26,'rgba(214,88,20,0.34)');
    gradA.addColorStop(0.62,'rgba(96,20,10,0.16)');
    gradA.addColorStop(1,   'rgba(0,0,0,0)');

    var bx = W*0.16, by = H*0.86, r2 = Math.max(W,H)*0.52;
    gradB = ctx.createRadialGradient(bx,by,0,bx,by,r2);
    gradB.addColorStop(0,   'rgba(150,12,26,0.55)');
    gradB.addColorStop(0.5, 'rgba(80,8,18,0.22)');
    gradB.addColorStop(1,   'rgba(0,0,0,0)');

    var vr = Math.hypot(W,H)*0.62;
    gradV = ctx.createRadialGradient(W*0.5,H*0.46,vr*0.30, W*0.5,H*0.46,vr);
    gradV.addColorStop(0,   'rgba(0,0,0,0)');
    gradV.addColorStop(0.62,'rgba(6,2,1,0.34)');
    gradV.addColorStop(1,   'rgba(4,1,1,0.92)');

    // 光束：位置固定，摆动靠平移
    for(var i=0;i<3;i++){
      beamX[i] = W*(0.30 + i*0.20);
      beamW[i] = W*(0.10 + 0.03*i);
      var g2 = ctx.createLinearGradient(beamX[i], 0, beamX[i], H);
      g2.addColorStop(0,   'rgba(255,186,96,0.12)');
      g2.addColorStop(0.55,'rgba(255,140,50,0.05)');
      g2.addColorStop(1,   'rgba(255,120,40,0)');
      beamGrad[i] = g2;
    }
  }

  /* ==================================================================
     主视觉：压迫感人物特写（侧面像）+ 镜像重影 + 光晕中的舞者剪影
     ================================================================== */
  var headPath = null, bodyGrad = null, rimGrad = null;

  function buildHead(){
    var p = new Path2D();
    p.moveTo(0.10, 0.10);
    p.bezierCurveTo(0.14, 0.015, 0.40, 0.015, 0.472, 0.165); // 颅顶 → 额
    p.bezierCurveTo(0.500, 0.225, 0.502, 0.272, 0.478, 0.316); // 额 → 眉
    p.bezierCurveTo(0.505, 0.330, 0.505, 0.340, 0.478, 0.356); // 眉骨
    p.bezierCurveTo(0.508, 0.382, 0.556, 0.406, 0.600, 0.440); // 鼻梁 → 鼻尖
    p.bezierCurveTo(0.560, 0.468, 0.528, 0.474, 0.512, 0.474); // 鼻底
    p.bezierCurveTo(0.538, 0.487, 0.540, 0.496, 0.508, 0.503); // 上唇
    p.bezierCurveTo(0.534, 0.516, 0.538, 0.527, 0.506, 0.536); // 下唇
    p.bezierCurveTo(0.522, 0.556, 0.528, 0.578, 0.500, 0.600); // 颏唇沟
    p.bezierCurveTo(0.520, 0.628, 0.510, 0.652, 0.474, 0.664); // 下巴
    p.bezierCurveTo(0.430, 0.706, 0.340, 0.734, 0.262, 0.748); // 下颌 → 颌角
    p.lineTo(0.276, 0.830);                                   // 颈前
    p.lineTo(0.300, 1.05);                                    // 颈 → 胸（裁出画外）
    p.lineTo(-0.10, 1.05);
    p.lineTo(-0.06, 0.860);                                   // 颈后
    p.bezierCurveTo(0.010, 0.740, 0.000, 0.560, 0.012, 0.380); // 后脑
    p.bezierCurveTo(0.022, 0.230, 0.050, 0.135, 0.10, 0.10);
    p.closePath();
    headPath = p;
  }

  function limb(g, x1,y1,x2,y2,x3,y3,w){
    g.lineWidth = w;
    g.beginPath(); g.moveTo(x1,y1); g.quadraticCurveTo(x2,y2,x3,y3); g.stroke();
  }

  /* 光晕里的舞者剪影：非常简化的肢体，靠姿态传达律动 */
  function drawDancers(now, pulse){
    var t = (S.rm ? now*0.45 : now) * 0.001;
    var portrait = H > W * 1.05;
    var list = portrait
      ? [[0.30, 0.34, 1.00], [0.74, 0.24, 0.72], [0.52, 0.52, 0.55]]
      : [[0.155, 0.50, 1.00], [0.285, 0.27, 0.78], [0.435, 0.62, 0.60], [0.045, 0.76, 0.52]];
    var base = Math.min(W, H) * (portrait ? 0.30 : 0.235);

    for(var i=0;i<list.length;i++){
      var it = list[i], sc = base * it[2], ph = t*0.62 + i*1.31;
      var sx = W*it[0] + Math.sin(ph*0.7)*W*0.008;
      var sy = H*it[1] + Math.cos(ph*0.9)*H*0.006;

      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(Math.sin(ph*0.55) * 0.10);
      ctx.scale(sc, sc);

      var sw = Math.sin(ph*1.5), bob = Math.sin(ph*2.4)*0.02;
      var dark = 'rgba(10,4,2,'+(0.58 - i*0.075)+')';

      // 腿
      ctx.strokeStyle = dark; ctx.lineCap = 'round';
      limb(ctx, 0.01, -0.10, 0.02 - sw*0.16, 0.16, -0.02 - sw*0.26, 0.42, 0.085);
      limb(ctx, -0.01, -0.10, 0.02 + sw*0.14, 0.14, 0.06 + sw*0.22, 0.40, 0.085);
      // 躯干
      limb(ctx, 0, -0.62 + bob, Math.sin(ph)*0.04, -0.34, Math.sin(ph*0.9)*0.03 + 0.01, -0.06, 0.115);
      // 手臂
      limb(ctx, 0.00, -0.55 + bob, 0.20 + Math.sin(ph*1.6)*0.14, -0.44,
           (0.30 + Math.sin(ph*1.6)*0.24), -0.30 + Math.cos(ph*1.6)*0.10, 0.062);
      limb(ctx, -0.01, -0.55 + bob, -0.16 - Math.sin(ph*1.6 + 1.1)*0.12, -0.40,
           -0.26 - Math.sin(ph*1.6 + 1.1)*0.20, -0.62 + Math.cos(ph*1.6)*0.08, 0.058);
      // 头
      ctx.fillStyle = dark;
      ctx.beginPath();
      ctx.arc(Math.sin(ph*0.9)*0.045, -0.72 + bob, 0.075, 0, 6.2832);
      ctx.fill();
      ctx.restore();

      // 重影：错位的第二层，偏红
      ctx.save();
      ctx.translate(sx + W*0.012, sy - H*0.010);
      ctx.rotate(Math.sin(ph*0.55 + 0.4) * 0.10);
      ctx.scale(sc*1.02, sc*1.02);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.055 + pulse*0.03;
      ctx.strokeStyle = 'rgba(255,80,30,1)'; ctx.fillStyle = 'rgba(255,80,30,1)';
      ctx.lineCap = 'round';
      limb(ctx, 0.01, -0.10, 0.02 - sw*0.16, 0.16, -0.02 - sw*0.26, 0.42, 0.085);
      limb(ctx, 0, -0.62 + bob, Math.sin(ph)*0.04, -0.34, Math.sin(ph*0.9)*0.03 + 0.01, -0.06, 0.115);
      limb(ctx, 0.00, -0.55 + bob, 0.20 + Math.sin(ph*1.6)*0.14, -0.44,
           (0.30 + Math.sin(ph*1.6)*0.24), -0.30 + Math.cos(ph*1.6)*0.10, 0.062);
      ctx.beginPath();
      ctx.arc(Math.sin(ph*0.9)*0.045, -0.72 + bob, 0.075, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFigure(now, pulse){
    if(!headPath) buildHead();
    var t = (S.rm ? now*0.45 : now) * 0.001;
    var portrait = H > W * 1.05;
    var hs = portrait ? Math.min(W*1.75, H*0.95) : Math.max(H*1.30, W*0.58);
    var ox = portrait ? W*0.06 : W*0.520;
    var oy = portrait ? -H*0.02 : -H*0.180;
    var sw = hs * 0.885;                      // 侧脸比例：宽 ≈ 高的 0.53，头部略竖长
    var breathe = 1 + pulse*0.006;

    ctx.globalCompositeOperation = 'source-over';

    // 1) 镜像重影：以右缘为轴翻折，低透明度，制造"双重曝光"
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.13 + pulse*0.05;
    ctx.translate(ox + sw*1.02 - Math.sin(t*0.2)*W*0.006, oy + H*0.012);
    ctx.scale(-sw*1.22*breathe, hs*1.22*breathe);
    ctx.fillStyle = 'rgba(168,26,32,1)';
    ctx.fill(headPath);
    ctx.restore();

    // 2) 主体剪影：近黑，底部带一点暖褐
    if(!bodyGrad){
      bodyGrad = ctx.createLinearGradient(0, 0.05, 0, 1.0);
      bodyGrad.addColorStop(0,   'rgba(14,6,4,0.985)');
      bodyGrad.addColorStop(0.55,'rgba(10,4,2,0.99)');
      bodyGrad.addColorStop(1,   'rgba(24,9,4,0.97)');
    }
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(sw*breathe, hs*breathe);
    ctx.fillStyle = bodyGrad;
    ctx.fill(headPath);
    ctx.restore();

    // 3) 边缘暖光（rim light）：宽带 + 细亮线，不用 shadowBlur（太贵）
    if(!rimGrad){
      rimGrad = ctx.createLinearGradient(0.05, 0.05, 0.62, 0.75);
      rimGrad.addColorStop(0,   'rgba(255,200,120,1)');
      rimGrad.addColorStop(0.45,'rgba(255,140,52,0.8)');
      rimGrad.addColorStop(0.8, 'rgba(200,40,34,0.5)');
      rimGrad.addColorStop(1,   'rgba(120,20,24,0.18)');
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(ox, oy);
    ctx.scale(sw, hs);
    ctx.strokeStyle = rimGrad;
    ctx.lineJoin = 'round';
    var px = 1 / Math.max(0.001, hs);
    ctx.globalAlpha = 0.10 + pulse*0.05;
    ctx.lineWidth = 18*px;
    ctx.stroke(headPath);
    ctx.globalAlpha = 0.24 + pulse*0.10;
    ctx.lineWidth = 7*px;
    ctx.stroke(headPath);
    ctx.globalAlpha = 0.85 + pulse*0.15;
    ctx.lineWidth = 1.6*px;
    ctx.stroke(headPath);

    // 冷色反光：与暖光对冲，制造冷暖反转
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = 'rgba(120,170,210,0.6)';
    ctx.lineWidth = 0.9*px;
    ctx.stroke(headPath);
    ctx.restore();

    // 4) 火焰笔触压在脸上：蒙太奇的色彩切片
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    var strokes = 6;
    for(var i=0;i<strokes;i++){
      var ph = t*(0.16 + i*0.021) + i*0.9;
      var y0 = 0.10 + i*0.135;
      var amp = 0.05 + (i%3)*0.02;
      var c = i%2 ? '232,96,26' : '255,168,72';
      ctx.strokeStyle = 'rgba('+c+','+(0.16 + 0.10*Math.sin(ph*1.3)) + ')';
      ctx.lineWidth = (0.006 + 0.010*Math.abs(Math.sin(ph))) * hs;
      ctx.beginPath();
      ctx.moveTo(W*(-0.05), H*y0);
      ctx.bezierCurveTo(
        W*0.28, H*(y0 - amp + Math.sin(ph)*0.03),
        W*0.66, H*(y0 + amp*1.6 + Math.cos(ph*0.8)*0.03),
        W*1.06, H*(y0 - amp*0.6));
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  function resize(){
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = Math.max(1, cv.clientWidth | 0);
    H = Math.max(1, cv.clientHeight | 0);
    cv.width  = Math.round(W*DPR);
    cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildGradients();
  }

  /* --- 一帧背景 --- */
  function drawBack(now, pulse){
    var t = now * 0.001;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#070302';
    ctx.fillRect(0,0,W,H);

    // 暖光晕（随节拍呼吸；暂停时压暗一点，画面留在原地）
    var dim = S.playing ? 1 : 0.62;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (0.72 + pulse*0.35) * dim;
    ctx.fillStyle = gradA;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = (0.50 + pulse*0.22) * dim;
    ctx.fillStyle = gradB;
    ctx.fillRect(0,0,W,H);

    // 火焰笔触：两层不同尺度/方向，构成蒙太奇的多重曝光
    if(flameTex){
      var cover = Math.max(W,H) / flameTex.width;
      ctx.globalCompositeOperation = 'lighter';

      ctx.save();
      ctx.translate(W*0.60 + Math.sin(t*0.21)*W*0.012, H*0.44 + Math.cos(t*0.17)*H*0.016);
      var s1 = cover*1.28*(1 + pulse*0.02);
      ctx.scale(s1, s1);
      ctx.rotate(Math.sin(t*0.13)*0.05);
      ctx.globalAlpha = (0.36 + pulse*0.14) * dim;
      ctx.drawImage(flameTex, -0.5, -0.5, 1, 1);
      ctx.restore();

      ctx.save();
      ctx.translate(W*0.30 + Math.cos(t*0.16)*W*0.02, H*0.68);
      var s2 = cover*1.95*(1 + Math.sin(t*0.11)*0.03);
      ctx.scale(-s2, s2);
      ctx.rotate(0.16 + Math.sin(t*0.09)*0.06);
      ctx.globalAlpha = (0.15 + pulse*0.08) * dim;
      ctx.drawImage(flameTex, -0.5, -0.5, 1, 1);
      ctx.restore();
    }

    // 舞台光束：三道从顶部洒下的暖光锥（渐变只建一次，靠平移摆动）
    ctx.globalCompositeOperation = 'lighter';
    for(var b=0;b<3;b++){
      var bx = beamX[b] + Math.sin(t*0.25 + b*1.7)*W*0.02;
      var bw = beamW[b];
      ctx.save();
      ctx.translate(bx - beamX[b], 0);
      ctx.fillStyle = beamGrad[b];
      ctx.beginPath();
      ctx.moveTo(beamX[b] - bw*0.32, 0);
      ctx.lineTo(beamX[b] + bw*0.32, 0);
      ctx.lineTo(beamX[b] + bw*1.5, H);
      ctx.lineTo(beamX[b] - bw*1.5, H);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 光尘：被灯打亮后飘在空气里的颗粒
    for(var d2=0; d2<dust.length; d2++){
      var it = dust[d2];
      var dx = it.x*W + Math.sin(t*0.22 + it.s*2.1)*W*0.018;
      var dy = it.y*H - (t*it.v*H*0.02) % H;
      dy = ((dy % H) + H) % H;
      ctx.globalAlpha = it.a * (0.55 + 0.45*Math.sin(t*it.s*1.7));
      ctx.fillStyle = 'rgba(255,196,120,1)';
      ctx.beginPath();
      ctx.arc(dx, dy, it.r * (W>900?1:0.7), 0, 6.2832);
      ctx.fill();
    }

    // 暗角
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = gradV;
    ctx.fillRect(0,0,W,H);

    // 颗粒
    if(grainPat){
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.055;
      ctx.save();
      ctx.translate(-Math.random()*90, -Math.random()*90);
      ctx.fillStyle = grainPat;
      ctx.fillRect(0,0,W+100,H+100);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  /* ---- 当前句索引 ---- */
  function idxAt(t){
    var ls = S.lines, n = ls.length;
    if(!n) return -1;
    if(!(t >= ls[0].t - 0.02)) return -1;
    var lo = 0, hi = n - 1, r = 0;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(ls[mid].t <= t + 0.0005){ r = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return r;
  }

  var LB = { times: [], on: 0, els: [[],[],[]], w: 0 };
  var GRAD_SRC = 'linear-gradient(96deg,#fff6e2 0%,#ffd79b 26%,#ffae55 58%,#f2703a 82%,#c93a25 100%)';

  function setText(layer, i, str){
    // 按码点切字（emoji / 生僻字不会被劈成两半）
    var cps = Array.from(str);
    var frag = document.createDocumentFragment(), arr = [];
    for(var k=0;k<cps.length;k++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = (cps[k] === ' ') ? '\u00a0' : cps[k];
      frag.appendChild(sp);
      arr.push(sp);
    }
    layer.textContent = '';
    layer.appendChild(frag);
    LB.els[i] = arr;
  }

  /* 每个字自己裁一段横向渐变：逐字点亮时颜色依然连续 */
  var gradOK = false;
  try{
    gradOK = !!(window.CSS && CSS.supports &&
      (CSS.supports('-webkit-background-clip', 'text') || CSS.supports('background-clip', 'text')));
  }catch(e){ gradOK = false; }

  function paintGrad(els, host){
    if(!gradOK || !els || !els.length) return;   // 不支持就不上透明字，保证永远读得清
    var baseX = host.getBoundingClientRect().left;
    var w = Math.max(1, host.offsetWidth);
    for(var i=0;i<els.length;i++){
      var sp = els[i];
      var x = sp.getBoundingClientRect().left - baseX;
      sp.style.backgroundImage = GRAD_SRC;
      sp.style.backgroundSize = w.toFixed(0) + 'px 100%';
      sp.style.backgroundPosition = (-x).toFixed(1) + 'px 0';
      sp.style.webkitBackgroundClip = 'text';
      sp.style.backgroundClip = 'text';
      sp.style.color = 'transparent';
      sp.style.webkitTextFillColor = 'transparent';
    }
  }

  function normalizeChars(L){
    var text = (L.text == null ? '' : String(L.text));
    var cps = Array.from(text), i, m = cps.length;
    var times = new Array(m);
    var cs = Array.isArray(L.chars) ? L.chars : null;

    if(cs && cs.length){
      // YRC：展平成逐码点时间；与正文对不上就整体退回均分，绝不乱点
      var tps = [], ok = true;
      for(i=0;i<cs.length;i++){
        var e = cs[i];
        if(!e || typeof e.t !== 'number' || !isFinite(e.t)){ ok = false; break; }
        var sub = Array.from(e.c == null ? '' : String(e.c));
        for(var j=0;j<sub.length;j++){
          if(/\s/.test(sub[j])) continue;   // 空白不占时间，避免与正文错位
          tps.push({ c: sub[j], t: e.t });
        }
      }
      if(ok && tps.length){
        var nonSp = 0;
        for(i=0;i<m;i++){ if(!/\s/.test(cps[i])) nonSp++; }
        if(nonSp === tps.length){
          var p = 0, lastT = tps[0].t, bad = false;
          for(i=0;i<m;i++){
            if(/\s/.test(cps[i])){ times[i] = (p < tps.length ? tps[p].t : lastT); continue; }
            if(tps[p].c !== cps[i]){ bad = true; break; }
            times[i] = tps[p].t; lastT = tps[p].t; p++;
          }
          if(!bad) return { text: text, times: times };
        }
      }
    }

    // LRC：按句长均分到每个字
    var start = (typeof L.t === 'number' && isFinite(L.t)) ? L.t : 0;
    var dur = (typeof L.dur === 'number' && L.dur > 0 && isFinite(L.dur)) ? L.dur : 0;
    if(!dur) dur = Math.max(1.2, m * 0.34);
    for(i=0;i<m;i++){
      times[i] = start + (m <= 1 ? 0 : (i / m) * dur * 0.94);
    }
    return { text: text, times: times };
  }

  function fitText(){
    var maxH = (H > W * 1.05 ? H*0.40 : H*0.34);
    var fs = Math.min(W * 0.062, H * 0.088);
    fs = Math.max(15, Math.min(fs, 92));
    elWrap.style.setProperty('--fs', fs.toFixed(1) + 'px');
    var guard = 0;
    while(elMain.getBoundingClientRect().height > maxH && fs > 14 && guard++ < 22){
      fs *= 0.92;
      elWrap.style.setProperty('--fs', fs.toFixed(1) + 'px');
    }
    LB.w = fs;
  }

  function showLine(i){
    var L = (i >= 0) ? S.lines[i] : null;
    if(!L){
      S.text = '';
      elMain.textContent = ''; elG1.textContent = ''; elG2.textContent = '';
      LB.times = []; LB.on = 0; LB.els = [[],[],[]];
      return;
    }
    var norm = normalizeChars(L);
    S.text = norm.text;
    LB.times = norm.times;
    LB.on = 0;
    setText(elMain, 0, norm.text);
    setText(elG1, 1, norm.text);
    setText(elG2, 2, norm.text);
    fitText();
    paintGrad(LB.els[0], elMain);
  }

  function updateReveal(time){
    var n = 0, ts = LB.times, lo = 0, hi = ts.length - 1;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(ts[mid] <= time + 0.02){ n = mid + 1; lo = mid + 1; } else hi = mid - 1;
    }
    if(n === LB.on) return;
    var a = LB.on, b = n;
    LB.on = n;
    if(b > a){
      for(var L=0; L<3; L++){
        var els = LB.els[L]; if(!els) continue;
        for(var k=a;k<b && k<els.length;k++) els[k].classList.add('on');
      }
    }else{
      for(var L2=0; L2<3; L2++){
        var e2 = LB.els[L2]; if(!e2) continue;
        for(var k2=b;k2<a && k2<e2.length;k2++) e2[k2].classList.remove('on');
      }
    }
  }

  function drawLyric(now, pulse){
    if(LB.times.length) updateReveal(S.t);
    var d = (S.rm ? 0.4 : 1) * (1 + (pulse||0) * 1.7);
    elG1.style.transform = 'translate(' + (-3*d).toFixed(1) + 'px,' + (5*d).toFixed(1) + 'px)';
    elG2.style.transform = 'translate(' + (4*d).toFixed(1) + 'px,' + (-6*d).toFixed(1) + 'px)';

    // 一句唱完、下一句还没来：把它按暗，让舞台重新成为主角
    var L = S.lines[S.idx], gap = false;
    if(L && typeof L.dur === 'number' && L.dur > 0){
      gap = S.t > L.t + L.dur + 0.45;
    }
    if(gap !== LB.gap){ LB.gap = gap; elWrap.classList.toggle('gap', gap); }
  }

  /* ---- init / tick / beat / live ---- */
  function onInit(p){
    p = p || {};
    var song = p.song || {};
    S.lines = Array.isArray(p.lines) ? p.lines.filter(function(l){ return l && typeof l === 'object'; }) : [];
    // 脏数据先洗干净：t / dur / text 都可能是坏的
    S.lines = S.lines.map(function(l){
      var o = { t: 0, dur: 0, text: (l.text == null ? '' : String(l.text)), chars: Array.isArray(l.chars) ? l.chars : null };
      if(typeof l.t === 'number' && isFinite(l.t)) o.t = Math.max(0, l.t);
      if(typeof l.dur === 'number' && isFinite(l.dur) && l.dur > 0) o.dur = l.dur;
      return o;
    });
    S.lines.sort(function(a,b){ return a.t - b.t; });
    S.accent = (Array.isArray(p.accent) && p.accent.length >= 3) ? p.accent : [232,129,26];
    S.playing = (p.playing === false) ? false : true;
    S.t = 0; S.idx = -1; S.text = '';

    // 每次 init 都完整重置歌词层（换歌 / 歌词晚到 / 无歌词）
    LB.times = []; LB.on = 0; LB.els = [[],[],[]];
    elMain.textContent = ''; elG1.textContent = ''; elG2.textContent = '';
    elWrap.style.removeProperty('--fs');

    // 封面主色只做一点点缀（一个小色块 + 空状态标题），底色仍是琥珀剧场
    var a = S.accent;
    document.documentElement.style.setProperty('--acc', 'rgb(' +
      clamp(a[0]|0,0,255) + ',' + clamp(a[1]|0,0,255) + ',' + clamp(a[2]|0,0,255) + ')');

    var name = (song.name == null ? '' : String(song.name)).trim();
    var art = song.artists;
    if(Array.isArray(art)) art = art.filter(Boolean).join(' / ');
    art = (art == null ? '' : String(art)).trim();
    elMeta.textContent = [name, art].filter(Boolean).join('  ·  ') || '—';
    elEmpty.classList.toggle('show', S.lines.length === 0);
    elWrap.style.visibility = S.lines.length ? 'visible' : 'hidden';
  }

  /* ---- 节拍/频谱状态 ---- */
  S.pulse = 0; S.bass = 0; S.mid = 0; S.treble = 0; S.lvl = 0; S.bpm = 0;

  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if(!d || d.__c100 !== 1) return;
    try{
      if(d.type === 'init') onInit(d.payload);
      else if(d.type === 'tick'){
        var p = d.payload || {};
        if(typeof p.time === 'number' && isFinite(p.time)) S.t = p.time;
        if(typeof p.playing === 'boolean') S.playing = p.playing;
      }
      else if(d.type === 'beat'){
        var b = d.payload || {};
        var lv = (typeof b.level === 'number' && isFinite(b.level)) ? b.level : 0.5;
        S.pulse = Math.min(1, Math.max(S.pulse, clamp(lv, 0, 1))*0.9 + 0.1);
      }
      else if(d.type === 'live'){
        var v = d.payload || {};
        if(typeof v.bpm === 'number') S.bpm = v.bpm;
        if(typeof v.level === 'number') S.lvl = clamp(v.level,0,1);
        if(typeof v.bass === 'number') S.bass = clamp(v.bass,0,1);
        if(typeof v.mid === 'number') S.mid = clamp(v.mid,0,1);
        if(typeof v.treble === 'number') S.treble = clamp(v.treble,0,1);
        if(typeof v.playing === 'boolean') S.playing = v.playing;
      }
    }catch(e){ S.err = String(e && e.message || e); }
  }, false);

  /* ---- 主循环 ---- */
  function frame(now){
    var t0 = performance.now();
    S.frames++;

    S.pulse *= S.rm ? 0.86 : 0.915;

    // 先定句，再画，避免"画面比字早一帧"
    var i = idxAt(S.t);
    if(i !== S.idx){
      S.idx = i;
      showLine(i);
    }

    if(ctx){
      drawBack(now, clamp(S.pulse + S.bass*0.25, 0, 1));
      drawDancers(now, S.pulse);
      drawFigure(now, S.pulse);
    }
    drawLyric(now, S.pulse);

    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }

  function relayout(){
    try{
      resize();
      if(LB.times.length){
        fitText();
        paintGrad(LB.els[0], elMain);
      }
    }catch(e){ S.err = String(e && e.message || e); }
  }

  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm
    };
  };

  try{
    resize();
    buildFlame();
    buildGrain();
    buildGradients();
  }catch(e){ S.err = String(e && e.message || e); }
  var rTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rTimer);
    rTimer = setTimeout(relayout, 90);
  }, {passive:true});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
