<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水墨</title>
<!-- 302 · 新中式写意：墨分五色 / 飞白 / 计白当黑；毛笔字 对撞 极细西文 -->
<style>
  html,body{margin:0;height:100%;background:#f3efe6;overflow:hidden;
    font-family:"Songti SC","STSong","SimSun","PingFang SC",serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ty{position:fixed;inset:0;pointer-events:none;z-index:3}
  #cur{position:absolute;left:9%;bottom:16%;width:76%;text-align:left;
    font-size:clamp(26px,4.4vw,74px);font-weight:700;letter-spacing:.10em;line-height:1.34;
    color:#12100d;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  #cur span{opacity:.18;transition:none}
  #cur span.on{opacity:1}
  #prev{position:absolute;left:9%;bottom:calc(16% + clamp(30px,4.6vw,78px));width:70%;
    font-size:clamp(13px,1.5vw,24px);letter-spacing:.18em;color:rgba(18,16,13,.34);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #next{position:absolute;left:9%;bottom:calc(16% - clamp(20px,2.4vw,38px));width:70%;
    font-size:clamp(13px,1.5vw,24px);letter-spacing:.18em;color:rgba(18,16,13,.22);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #en{position:absolute;right:5%;top:12%;writing-mode:vertical-rl;
    font-family:"Helvetica Neue",Arial,sans-serif;font-weight:200;
    font-size:clamp(11px,1.1vw,17px);letter-spacing:.62em;color:rgba(18,16,13,.5)}
  #seal{position:absolute;right:6.5%;bottom:14%;width:clamp(38px,3.4vw,58px);height:clamp(38px,3.4vw,58px);
    background:#a8331f;color:#f3efe6;font-size:clamp(15px,1.5vw,23px);font-weight:700;
    display:flex;align-items:center;justify-content:center;letter-spacing:0;opacity:.9;
    box-shadow:0 0 0 2px rgba(168,51,31,.25)}
  #hint{position:fixed;left:9%;bottom:7%;font:500 12px/1.6 ui-monospace,monospace;
    letter-spacing:.2em;color:rgba(18,16,13,.35);z-index:4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ty"><div id="prev"></div><div id="cur"></div><div id="next"></div></div>
<div id="en">C H E N &nbsp; L I</div>
<div id="seal">墨</div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
const cv=document.getElementById('c'), curEl=document.getElementById('cur'),
      prevEl=document.getElementById('prev'), nextEl=document.getElementById('next'),
      hint=document.getElementById('hint');
const now=()=>clockT+(playing?(performance.now()-clockAt)/1000:0);
let W=1,H=1,PR=1,lines=[],idx=-1,clockT=0,clockAt=0,playing=false,vT=0;
let frames=0,jsMs=0,errMsg='',readySent=false,dirty=true,raf=0,tickN=0;
let RM=false; try{ RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){}

/* ---- 一次性烘「纸 + 墨」底图：宣纸纤维、几团淡墨、飞白 ---- */
const bc=document.createElement('canvas'); const bx=bc.getContext('2d');
function bake(){
  bc.width=Math.round(W*PR); bc.height=Math.round(H*PR);
  bx.setTransform(PR,0,0,PR,0,0);
  bx.fillStyle='#f3efe6'; bx.fillRect(0,0,W,H);
  // 纸纤维
  let sd=7717; const rnd=()=>{ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };
  for(let i=0;i<2600;i++){
    const x=rnd()*W, y=rnd()*H, l=6+rnd()*46, a=(rnd()-.5)*.5;
    bx.strokeStyle='rgba(120,110,92,'+(0.02+rnd()*0.05).toFixed(3)+')';
    bx.lineWidth=0.6+rnd()*0.9;
    bx.beginPath(); bx.moveTo(x,y); bx.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); bx.stroke();
  }
  // 墨团（靠上、偏右，避开歌词区）
  function bloom(cx,cy,r,alpha){
    const g=bx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(22,20,18,'+alpha+')');
    g.addColorStop(.45,'rgba(30,27,24,'+(alpha*0.55)+')');
    g.addColorStop(1,'rgba(40,36,32,0)');
    bx.fillStyle=g; bx.beginPath(); bx.arc(cx,cy,r,0,6.2832); bx.fill();
  }
  bloom(W*0.72,H*0.22,W*0.20,0.55);
  bloom(W*0.80,H*0.30,W*0.13,0.42);
  bloom(W*0.62,H*0.12,W*0.10,0.34);
  // 三笔飞白：干笔横掠
  for(let k=0;k<3;k++){
    const y0=H*(0.30+k*0.07);
    for(let s=0;s<130;s++){
      const t=s/130, x=W*(0.10+t*0.86), y=y0+Math.sin(t*6.2+k)*H*0.012;
      const w=1.2+((s*37)%9)/3, a=(0.05+((s*13)%7)/90)*(1-Math.abs(t-0.5)*0.9);
      bx.strokeStyle='rgba(26,23,20,'+a.toFixed(3)+')'; bx.lineWidth=w;
      bx.beginPath(); bx.moveTo(x,y); bx.lineTo(x+w*3.2,y+0.6); bx.stroke();
    }
  }
  dirty=true;
}

function resize(){
  W=Math.max(2,innerWidth); H=Math.max(2,innerHeight); PR=Math.min(1.5,devicePixelRatio||1);
  cv.width=Math.round(W*PR); cv.height=Math.round(H*PR);
  bake(); dirty=true;
}
addEventListener('resize',()=>{ clearTimeout(resize._t); resize._t=setTimeout(resize,140); });

function draw(){
  const g=cv.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.drawImage(bc,0,0);
}

function build(i){
  const L=lines[i];
  curEl.innerHTML=''; 
  if(!L){ prevEl.textContent=''; nextEl.textContent=''; return; }
  for(const ch of Array.from(String(L.text||''))){
    const s=document.createElement('span');
    s.textContent = ch===' ' ? '\u00a0' : ch;
    curEl.appendChild(s);
  }
  prevEl.textContent = lines[i-1] ? lines[i-1].text : '';
  nextEl.textContent = lines[i+1] ? lines[i+1].text : '';
  hint.style.opacity='0';
}

frame_loop();
function frame_loop(){
  const js0=performance.now();
  vT = RM ? now()*0.24 : now();
  const T=now();
  let i=-1; for(let k=0;k<lines.length;k++){ if(lines[k].t<=T+1e-4) i=k; else break; }
  if(i!==idx){ idx=i; if(i<0){ curEl.innerHTML=''; hint.style.opacity='.9'; } else build(i); dirty=true; }
  if(idx>=0 && lines[idx]){
    const L=lines[idx], sp=curEl.children, n=sp.length, dur=Math.max(0.8,(L.dur==null?4:+L.dur)), cs=L.chars;
    for(let k=0;k<n;k++){
      let tt;
      if(cs && cs.length){ const j=Math.min(cs.length-1,Math.floor(k*cs.length/n)); tt=(cs[j]&&cs[j].t!=null)?+cs[j].t:(L.t+dur*0.88*k/n); }
      else tt=L.t+dur*0.88*k/n;
      const on = T>=tt;
      if((sp[k].className==='on') !== on) sp[k].className = on?'on':'';
    }
  }
  try{ if(playing||dirty){ draw(); dirty=false; } }catch(e){ errMsg='draw:'+(e&&e.message||e); }
  if(!readySent){ readySent=true; try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(_){} }
  frames++; jsMs=performance.now()-js0;
  raf=requestAnimationFrame(frame_loop);
}

addEventListener('message',(e)=>{
  const d=e.data; if(!d||d.__c100!==1) return;
  const p=d.payload||{};
  if(d.type==='init'){
    lines=(p.lines||[]).slice().sort((a,b)=>a.t-b.t);
    idx=-1; clockT=0; clockAt=performance.now(); playing=true;
    hint.textContent = lines.length?'等待第一句…':'这首没有歌词';
    hint.style.opacity = lines.length?'.9':'.5';
    curEl.innerHTML=''; prevEl.textContent=''; nextEl.textContent='';
    dirty=true;
  } else if(d.type==='tick'){
    clockT=+p.time||0; clockAt=performance.now();
    playing = (p.playing===undefined)? true : !!p.playing;  /* init 常不带 playing */
    tickN++; dirty=true;
  } else if(d.type==='beat'){ dirty=true; }
});

window.__stage=()=>({
  lines:lines.length, idx, t:+now().toFixed(2), playing, frames,
  js:+jsMs.toFixed(2), err:errMsg, text:(idx>=0&&lines[idx])?lines[idx].text:'',
  gl:false, rm:RM
});

resize(); draw();
</script>
</body>
</html>
