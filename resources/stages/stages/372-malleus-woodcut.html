<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>女巫之锤</title>
<style>
  @font-face { font-family: 'StageBlackletter'; src: url('./assets/372-blackletter.woff2') format('woff2'); font-display: swap; }
  html, body { margin: 0; height: 100%; background: #e7dfca; overflow: hidden; }
  #plate { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="plate" width="1440" height="900"></canvas>
<script>
window.__stage = function () {
  var s = window.__stageState || {};
  return {
    lines: (s.lines && s.lines.length) || 0,
    idx: typeof s.idx === 'number' ? s.idx : -1,
    t: s.time || 0,
    playing: !!s.playing,
    frames: s.frames || 0,
    js: s.jsMs || 0,
    err: s.err || '',
    text: s.text || '',
    gl: false,
    rm: !!s.reduced
  };
};

(function () {
  'use strict';

  var state = {
    lines: [], idx: -1, time: 0, duration: 0, playing: true,
    frames: 0, jsMs: 0, err: '', text: '', reduced: false,
    songName: '', stampAt: 0, pulse: 0, bass: 0, level: 0, treble: 0,
    beatIndex: 0, clock: 0, lineCache: null, cacheWidth: 0, dust: null, hasInit: false
  };
  window.__stageState = state;

  var canvas = document.getElementById('plate');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;

  var lastErrorAt = 0;
  function reportError(where, error) {
    var message = (error && error.message) ? error.message : String(error);
    if (state.err.length < 180) state.err = where + ': ' + message;
    var nowMs = Date.now();
    if (nowMs - lastErrorAt >= 1000) {
      lastErrorAt = nowMs;
      try { console.error('[stage372] ' + where + ': ' + message); } catch (ignored) {}
    }
  }

  if (!ctx) {
    reportError('boot', new Error('canvas 2d context unavailable'));
    return;
  }

  var INK = [19, 16, 13];
  var PAPER = [232, 223, 203];
  var accent = [120, 96, 64];

  function clampNumber(value, low, high) {
    var number = Number(value);
    if (!isFinite(number)) return low;
    return Math.min(high, Math.max(low, number));
  }

  function isDrawable(source) {
    return !!source && source.width > 0 && source.height > 0 &&
      typeof source.getContext === 'function';
  }

  function currentStamp() {
    if (window.performance && typeof window.performance.now === 'function') {
      return window.performance.now();
    }
    return Date.now();
  }

  var readySent = false;
  function signalReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (error) { reportError('ready', error); }
  }

  var layout = { w: 1440, h: 900, dpr: 1 };
  var plate = document.createElement('canvas');
  var plateCtx = plate.getContext('2d');

  var IMG_ASPECT = 626 / 888;
  var geom = null;
  var grainTile = null;
  var hero = { canvas: null, ready: false, failed: false, image: null };
  var knight = { canvas: null, ready: false, failed: false, image: null };

  function clamp01(value) {
    var number = Number(value);
    if (!isFinite(number)) return 0;
    return Math.min(1, Math.max(0, number));
  }

  function ink(alpha) {
    return 'rgba(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ',' + clamp01(alpha) + ')';
  }

  function paperColor(alpha) {
    return 'rgba(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ',' + clamp01(alpha) + ')';
  }

  function accentColor(alpha) {
    return 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',' + clamp01(alpha) + ')';
  }

  function serifFont(size, weight) {
    return (weight || 400) + ' ' + size.toFixed(1) + 'px "Songti SC", "STSong", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif';
  }

  function blackletterFont(size) {
    return '400 ' + size.toFixed(1) + 'px "StageBlackletter", "Songti SC", serif';
  }

  function makeRandom(seed) {
    var value = seed >>> 0;
    return function () {
      value = (value * 1664525 + 1013904223) >>> 0;
      return value / 4294967296;
    };
  }

  function drawSpacedText(pen, text, centerX, baselineY, spacing) {
    var glyphs = String(text).split('');
    var widths = [];
    var total = 0;
    var index;
    for (index = 0; index < glyphs.length; index++) {
      var glyphWidth = pen.measureText(glyphs[index]).width;
      widths.push(glyphWidth);
      total += glyphWidth;
    }
    var gap = Math.max(-3, Number(spacing) || 0);
    total += gap * Math.max(0, glyphs.length - 1);
    var x = centerX - total / 2;
    var previousAlign = pen.textAlign;
    pen.textAlign = 'left';
    for (index = 0; index < glyphs.length; index++) {
      pen.fillText(glyphs[index], x, baselineY);
      x += widths[index] + gap;
    }
    pen.textAlign = previousAlign;
  }

  function buildGrain() {
    var size = 160;
    var layer = document.createElement('canvas');
    layer.width = size;
    layer.height = size;
    var context = layer.getContext('2d');
    var image = context.createImageData(size, size);
    var data = image.data;
    var random = makeRandom(372111);
    for (var offset = 0; offset < data.length; offset += 4) {
      var noise = random();
      data[offset] = 92;
      data[offset + 1] = 76;
      data[offset + 2] = 54;
      data[offset + 3] = noise < 0.52 ? 0 : Math.round((noise - 0.52) * 2 * 30);
    }
    context.putImageData(image, 0, 0);
    grainTile = layer;
  }

  function computeGeometry() {
    var width = layout.w;
    var height = layout.h;
    var margin = clampNumber(Math.min(width, height) * 0.040, 11, 46);
    var band = clampNumber(Math.min(width, height) * 0.014, 5, 15);
    var innerX = margin + band;
    var innerY = margin + band;
    var innerW = Math.max(60, width - innerX * 2);
    var innerH = Math.max(60, height - innerY * 2);
    var portrait = width / height < 1.06;
    var headH = clampNumber(innerH * (portrait ? 0.17 : 0.15), 46, 104);
    var footH = clampNumber(innerH * 0.09, 32, 72);
    var bodyTop = innerY + headH;
    var bodyH = Math.max(80, innerH - headH - footH);
    var captionH = clampNumber(headH * 0.26, 12, 24);
    var geometry = {
      w: width, h: height, margin: margin, band: band, portrait: portrait,
      innerX: innerX, innerY: innerY, innerW: innerW, innerH: innerH,
      headH: headH, footH: footH, bodyTop: bodyTop, bodyH: bodyH,
      captionH: captionH, plate: null, text: null
    };
    var plateHeight;
    var plateWidth;
    var plateX;
    var plateY;
    if (!portrait) {
      var textGap = clampNumber(innerW * 0.045, 16, 54);
      plateHeight = Math.min(bodyH * 0.90 - captionH, (innerW * 0.32) / IMG_ASPECT);
      plateHeight = Math.max(18, Math.min(plateHeight, bodyH * 0.96));
      plateWidth = plateHeight * IMG_ASPECT;
      plateX = innerX + Math.min(innerW * 0.02, 20);
      plateY = bodyTop + Math.max(0, (bodyH - plateHeight - captionH) * 0.45);
      var textX = plateX + plateWidth + textGap;
      geometry.plate = { x: plateX, y: plateY, w: plateWidth, h: plateHeight };
      geometry.text = {
        x: textX, y: bodyTop,
        w: Math.max(120, innerX + innerW - textX),
        h: bodyH
      };
    } else {
      plateHeight = Math.min(bodyH * 0.34, (innerW * 0.66) / IMG_ASPECT);
      plateHeight = Math.max(18, Math.min(plateHeight, bodyH * 0.42));
      plateWidth = plateHeight * IMG_ASPECT;
      plateX = innerX + (innerW - plateWidth) * 0.5;
      plateY = bodyTop + 2;
      var textTop = plateY + plateHeight + captionH + clampNumber(innerH * 0.02, 6, 20);
      geometry.plate = { x: plateX, y: plateY, w: plateWidth, h: plateHeight };
      geometry.text = {
        x: innerX, y: textTop,
        w: innerW,
        h: Math.max(80, bodyTop + bodyH - textTop)
      };
    }
    return geometry;
  }

  function paintPaper(pen, width, height) {
    pen.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
    pen.fillRect(0, 0, width, height);

    var random = makeRandom(3722016);
    var stains = Math.min(9, 4 + Math.round((width * height) / 420000));
    for (var index = 0; index < stains; index++) {
      var centerX = random() * width;
      var centerY = random() * height;
      var radius = (0.12 + random() * 0.22) * Math.max(width, height) * 0.5;
      var stainAlpha = 0.035 + random() * 0.05;
      var stain = makeGradient(pen, function () {
        var built = pen.createRadialGradient(centerX, centerY, radius * 0.1, centerX, centerY, radius);
        addStop(built, 0, 'rgba(122,94,58,' + stainAlpha.toFixed(3) + ')');
        addStop(built, 1, 'rgba(122,94,58,0)');
        return built;
      });
      if (!stain) continue;
      pen.fillStyle = stain;
      pen.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);
    }

    if (isDrawable(grainTile)) {
      var pattern = pen.createPattern(grainTile, 'repeat');
      if (pattern) {
        pen.save();
        pen.globalAlpha = 0.62;
        pen.fillStyle = pattern;
        pen.fillRect(0, 0, width, height);
        pen.restore();
      }
    }

    var speckles = Math.min(140, 40 + Math.round((width * height) / 26000));
    pen.fillStyle = ink(0.16);
    for (var spot = 0; spot < speckles; spot++) {
      var spotX = random() * width;
      var spotY = random() * height;
      var spotR = 0.4 + random() * 1.5;
      pen.beginPath();
      pen.arc(spotX, spotY, spotR, 0, Math.PI * 2);
      pen.fill();
    }

    var edge = makeGradient(pen, function () {
      var built = pen.createLinearGradient(0, 0, 0, height);
      addStop(built, 0, 'rgba(84,62,34,0.16)');
      addStop(built, 0.16, 'rgba(84,62,34,0)');
      addStop(built, 0.85, 'rgba(84,62,34,0)');
      addStop(built, 1, 'rgba(84,62,34,0.20)');
      return built;
    });
    if (edge) {
      pen.fillStyle = edge;
      pen.fillRect(0, 0, width, height);
    }

    var sideEdge = makeGradient(pen, function () {
      var built = pen.createLinearGradient(0, 0, width, 0);
      addStop(built, 0, 'rgba(84,62,34,0.15)');
      addStop(built, 0.10, 'rgba(84,62,34,0)');
      addStop(built, 0.90, 'rgba(84,62,34,0)');
      addStop(built, 1, 'rgba(84,62,34,0.15)');
      return built;
    });
    if (sideEdge) {
      pen.fillStyle = sideEdge;
      pen.fillRect(0, 0, width, height);
    }
  }

  function paintFrame(pen, width, height) {
    var margin = geom.margin;
    var band = geom.band;
    var innerW = width - margin * 2;
    var innerH = height - margin * 2;

    pen.save();
    pen.fillStyle = 'rgb(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ')';
    pen.fillRect(margin, margin, innerW, band);
    pen.fillRect(margin, height - margin - band, innerW, band);
    pen.fillRect(margin, margin, band, innerH);
    pen.fillRect(width - margin - band, margin, band, innerH);

    pen.beginPath();
    pen.rect(margin, margin, innerW, band);
    pen.rect(margin, height - margin - band, innerW, band);
    pen.rect(margin, margin, band, innerH);
    pen.rect(width - margin - band, margin, band, innerH);
    pen.save();
    pen.clip();
    pen.strokeStyle = paperColor(0.16);
    pen.lineWidth = 1;
    for (var line = -innerH; line < width + innerH; line += 5) {
      pen.beginPath();
      pen.moveTo(line, 0);
      pen.lineTo(line + height, height);
      pen.stroke();
    }
    pen.restore();
    pen.restore();

    pen.strokeStyle = ink(0.94);
    pen.lineWidth = 1;
    var outerRule = margin + band + Math.max(2, band * 0.35);
    pen.strokeRect(outerRule, outerRule, width - outerRule * 2, height - outerRule * 2);
    pen.strokeRect(margin - Math.max(2, band * 0.3), margin - Math.max(2, band * 0.3),
      width - 2 * (margin - Math.max(2, band * 0.3)), height - 2 * (margin - Math.max(2, band * 0.3)));

    var corner = Math.max(9, band * 2.2);
    var corners = [
      [outerRule, outerRule], [width - outerRule, outerRule],
      [outerRule, height - outerRule], [width - outerRule, height - outerRule]
    ];
    for (var index = 0; index < corners.length; index++) {
      var cornerX = corners[index][0];
      var cornerY = corners[index][1];
      pen.fillStyle = 'rgb(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ')';
      pen.fillRect(cornerX - corner / 2, cornerY - corner / 2, corner, corner);
      pen.strokeStyle = paperColor(0.85);
      pen.lineWidth = 1;
      pen.beginPath();
      pen.moveTo(cornerX - corner * 0.28, cornerY - corner * 0.28);
      pen.lineTo(cornerX + corner * 0.28, cornerY + corner * 0.28);
      pen.moveTo(cornerX + corner * 0.28, cornerY - corner * 0.28);
      pen.lineTo(cornerX - corner * 0.28, cornerY + corner * 0.28);
      pen.stroke();
      pen.beginPath();
      pen.arc(cornerX, cornerY, corner * 0.13, 0, Math.PI * 2);
      pen.fillStyle = paperColor(0.9);
      pen.fill();
    }
  }

  function paintHeader(pen) {
    var centerX = geom.innerX + geom.innerW / 2;
    var titleSize = clampNumber(geom.headH * 0.50, 15, 42);
    pen.textBaseline = 'alphabetic';
    pen.fillStyle = ink(0.93);
    pen.font = blackletterFont(titleSize);
    drawSpacedText(pen, 'MALLEVS · MALEFICARVM', centerX, geom.innerY + titleSize * 0.94, titleSize * 0.055);

    var ruleY = geom.innerY + titleSize * 1.24;
    var ruleHalf = Math.min(geom.innerW * 0.34, titleSize * 12);
    pen.strokeStyle = ink(0.7);
    pen.lineWidth = 1;
    pen.beginPath();
    pen.moveTo(centerX - ruleHalf, ruleY);
    pen.lineTo(centerX - titleSize * 0.6, ruleY);
    pen.moveTo(centerX + titleSize * 0.6, ruleY);
    pen.lineTo(centerX + ruleHalf, ruleY);
    pen.stroke();
    pen.save();
    pen.translate(centerX, ruleY);
    pen.rotate(Math.PI / 4);
    pen.fillStyle = ink(0.8);
    pen.fillRect(-titleSize * 0.12, -titleSize * 0.12, titleSize * 0.24, titleSize * 0.24);
    pen.restore();

    var subtitleSize = clampNumber(titleSize * 0.29, 8.5, 12.5);
    pen.font = serifFont(subtitleSize, 500);
    pen.fillStyle = ink(0.62);
    drawSpacedText(pen, 'DE LAMIIS ET PYTHONICIS MVLERIBVS', centerX, ruleY + subtitleSize * 1.9, subtitleSize * 0.28);

    if (geom.innerW > 560) {
      var noteSize = clampNumber(subtitleSize * 0.92, 7.5, 11);
      pen.font = serifFont(noteSize, 400);
      pen.fillStyle = ink(0.5);
      pen.textAlign = 'left';
      pen.fillText('ANNO · M · CD · LXXXVI', geom.innerX + 10, ruleY + noteSize * 1.85);
      pen.textAlign = 'right';
      pen.fillText('LIBER · PRIMVS', geom.innerX + geom.innerW - 10, ruleY + noteSize * 1.85);
      pen.textAlign = 'center';
    }

    var markY = geom.innerY + geom.headH - Math.max(10, geom.headH * 0.16);
    var markCount = 9;
    var markGap = clampNumber(geom.headH * 0.36, 8, 20);
    var markSize = clampNumber(titleSize * 0.075, 2, 3.6);
    for (var markIndex = 0; markIndex < markCount; markIndex++) {
      var markX = centerX + (markIndex - (markCount - 1) / 2) * markGap * 2;
      pen.fillStyle = ink(markIndex % 3 === 0 ? 0.42 : 0.24);
      pen.beginPath();
      if (markIndex % 3 === 0) {
        pen.arc(markX, markY, markSize, 0, Math.PI * 2);
      } else {
        pen.rect(markX - markSize * 0.7, markY - markSize * 0.7, markSize * 1.4, markSize * 1.4);
      }
      pen.fill();
    }
  }

  function drawCover(pen, source, x, y, width, height, cropInset) {
    if (!isDrawable(source) || width <= 1 || height <= 1) return false;
    var insetX = source.width * clamp01(cropInset);
    var insetY = source.height * clamp01(cropInset);
    var sourceWidth = Math.max(1, source.width - insetX * 2);
    var sourceHeight = Math.max(1, source.height - insetY * 2);
    var targetRatio = width / height;
    var sourceRatio = sourceWidth / sourceHeight;
    var sw = sourceWidth;
    var sh = sourceHeight;
    var sx = insetX;
    var sy = insetY;
    if (sourceRatio > targetRatio) {
      sw = sourceHeight * targetRatio;
      sx = insetX + (sourceWidth - sw) / 2;
    } else {
      sh = sourceWidth / targetRatio;
      sy = insetY + (sourceHeight - sh) / 2;
    }
    pen.save();
    pen.beginPath();
    pen.rect(x, y, width, height);
    pen.clip();
    pen.drawImage(source, sx, sy, sw, sh, x, y, width, height);
    pen.restore();
    return true;
  }

  function paintHeroPlate(pen) {
    var target = geom.plate;
    if (!target) return;
    pen.fillStyle = ink(0.14);
    pen.fillRect(target.x + 4, target.y + 5, target.w, target.h);

    pen.strokeStyle = ink(0.95);
    pen.lineWidth = 2;
    pen.strokeRect(target.x, target.y, target.w, target.h);

    var inset = clampNumber(target.w * 0.035, 4, 9);
    var imageX = target.x + inset;
    var imageY = target.y + inset;
    var imageW = target.w - inset * 2;
    var imageH = target.h - inset * 2;

    pen.fillStyle = paperColor(0.55);
    pen.fillRect(imageX, imageY, imageW, imageH);

    var painted = drawCover(pen, hero.canvas, imageX, imageY, imageW, imageH, 0.02);
    if (!painted) {
      pen.save();
      pen.beginPath();
      pen.rect(imageX, imageY, imageW, imageH);
      pen.clip();
      pen.strokeStyle = ink(0.30);
      pen.lineWidth = 1;
      var step = Math.max(5, Math.round(imageW / 24));
      for (var line = -imageH; line < imageW + imageH; line += step) {
        pen.beginPath();
        pen.moveTo(imageX + line, imageY);
        pen.lineTo(imageX + line - imageH, imageY + imageH);
        pen.stroke();
      }
      pen.restore();
      pen.fillStyle = ink(0.45);
      pen.font = serifFont(clampNumber(imageW * 0.07, 7, 12), 500);
      pen.textAlign = 'center';
      pen.fillText(hero.failed ? 'IMAGO · DEEST' : 'IMAGO · FIT', imageX + imageW / 2, imageY + imageH / 2);
      pen.textAlign = 'center';
    }

    pen.strokeStyle = ink(0.72);
    pen.lineWidth = 1;
    pen.strokeRect(imageX, imageY, imageW, imageH);
    pen.strokeRect(target.x + inset * 0.4, target.y + inset * 0.4,
      target.w - inset * 0.8, target.h - inset * 0.8);

    var cornerSize = clampNumber(target.w * 0.036, 5, 11);
    var plateCorners = [
      [target.x, target.y], [target.x + target.w, target.y],
      [target.x, target.y + target.h], [target.x + target.w, target.y + target.h]
    ];
    for (var cornerIndex = 0; cornerIndex < plateCorners.length; cornerIndex++) {
      var cornerX = plateCorners[cornerIndex][0];
      var cornerY = plateCorners[cornerIndex][1];
      pen.fillStyle = 'rgb(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ')';
      pen.fillRect(cornerX - cornerSize * 0.5, cornerY - cornerSize * 0.5, cornerSize, cornerSize);
      pen.fillStyle = paperColor(0.92);
      pen.beginPath();
      pen.moveTo(cornerX, cornerY - cornerSize * 0.22);
      pen.lineTo(cornerX + cornerSize * 0.22, cornerY);
      pen.lineTo(cornerX, cornerY + cornerSize * 0.22);
      pen.lineTo(cornerX - cornerSize * 0.22, cornerY);
      pen.closePath();
      pen.fill();
    }

    var captionText = 'SABBATVM · MALEFICARVM';
    var fleuronY = target.y + target.h + geom.captionH * 0.20;
    pen.fillStyle = ink(0.5);
    pen.fillRect(target.x + target.w * 0.10, fleuronY - 0.5, target.w * 0.13, 1);
    pen.fillRect(target.x + target.w * 0.77, fleuronY - 0.5, target.w * 0.13, 1);

    var captionSize = clampNumber(target.w * 0.055, 7, 11.5);
    captionSize = Math.min(captionSize, target.w * 0.94 / (captionText.length * 0.80));
    pen.font = serifFont(captionSize, 500);
    pen.fillStyle = ink(0.7);
    drawSpacedText(pen, captionText, target.x + target.w / 2,
      target.y + target.h + geom.captionH * 0.95, captionSize * 0.22);
  }

  function paintRules(pen) {
    var ruleY = geom.bodyTop - Math.max(4, geom.headH * 0.10);
    pen.strokeStyle = ink(0.28);
    pen.lineWidth = 1;
    pen.beginPath();
    pen.moveTo(geom.innerX + 6, ruleY);
    pen.lineTo(geom.innerX + geom.innerW - 6, ruleY);
    pen.stroke();
    pen.beginPath();
    pen.moveTo(geom.innerX + 6, ruleY);
    pen.lineTo(geom.innerX + 6, ruleY + 4);
    pen.moveTo(geom.innerX + geom.innerW - 6, ruleY);
    pen.lineTo(geom.innerX + geom.innerW - 6, ruleY + 4);
    pen.stroke();

    if (!geom.portrait && geom.text) {
      var columnX = geom.text.x - clampNumber(geom.innerW * 0.022, 8, 26);
      pen.strokeStyle = ink(0.18);
      pen.beginPath();
      pen.moveTo(columnX, geom.bodyTop + 6);
      pen.lineTo(columnX, geom.bodyTop + geom.bodyH - 6);
      pen.stroke();
      pen.save();
      pen.translate(columnX, geom.bodyTop + 6);
      pen.rotate(Math.PI / 4);
      pen.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
      pen.fillRect(-3, -3, 6, 6);
      pen.strokeStyle = ink(0.3);
      pen.strokeRect(-3, -3, 6, 6);
      pen.restore();
    }
  }

  function paintSigil(pen) {
    var target = geom.text;
    if (!target) return;
    var radius = Math.min(target.w * 0.34, target.h * 0.36);
    if (radius < 30) return;
    var centerX = target.x + target.w / 2;
    var centerY = target.y + target.h / 2;
    pen.save();
    pen.strokeStyle = ink(0.085);
    pen.lineWidth = 1;
    pen.beginPath();
    pen.arc(centerX, centerY, radius, 0, Math.PI * 2);
    pen.stroke();
    pen.beginPath();
    pen.arc(centerX, centerY, radius * 0.83, 0, Math.PI * 2);
    pen.stroke();

    pen.strokeStyle = ink(0.065);
    pen.beginPath();
    for (var step = 0; step < 40; step++) {
      var tickAngle = step * Math.PI / 20;
      var inner = radius * 0.83;
      var outer = radius * (step % 5 === 0 ? 0.98 : 0.92);

    var glyphIndex;

      var row = block.rows[rowIndex];
      var baseline = topY + (rowIndex + 0.5) * block.lineHeight;

      item.x += item.driftX * step * 0.01;
      item.y += item.driftY * step * 0.01;
      if (item.y < -0.04) { item.y = 1.04; item.x = Math.random(); }
      if (item.x < -0.04) item.x = 1.04;
      if (item.x > 1.04) item.x = -0.04;
    }
  }

  function drawDust(pen) {
    if (state.reduced) return;
    ensureDust();
    var items = state.dust;
    var alphaBoost = 0.6 + state.bass * 0.8;
    for (var bucket = 0; bucket < 3; bucket++) {
      pen.fillStyle = ink((0.055 + bucket * 0.045) * alphaBoost);
      pen.beginPath();
      for (var index = bucket; index < items.length; index += 3) {
        var item = items[index];
        var pointX = item.x * layout.w;
        var pointY = item.y * layout.h;
        pen.moveTo(pointX + item.radius, pointY);
        pen.arc(pointX, pointY, item.radius, 0, Math.PI * 2);
      }
      pen.fill();
    }
  }

  function drawGlow(pen) {
    if (!geom || !geom.plate) return;
    if (!isDrawable(glowLayer && glowLayer.canvas)) return;
    var flicker = 0.58 + 0.42 * Math.sin(state.clock * 2.7) * Math.cos(state.clock * 1.3 + 0.7);
    var energy = clamp01(0.32 + state.bass * 0.85 + state.pulse * 0.55);
    var strength = (state.reduced ? 0.7 : flicker) * energy;
    if (strength <= 0.02) return;
    pen.save();
    pen.globalCompositeOperation = 'multiply';
    pen.globalAlpha = clamp01(strength);
    pen.drawImage(glowLayer.canvas, glowLayer.x, glowLayer.y, glowLayer.size, glowLayer.size);
    pen.restore();
  }

  function drawFooter(pen) {
    var baseY = geom.innerY + geom.innerH - geom.footH * 0.46;
    var left = geom.innerX + geom.band * 0.5;
    var right = geom.innerX + geom.innerW - geom.band * 0.5;
    var width = Math.max(40, right - left);
    var ratio = state.duration > 0 ? clamp01(state.time / state.duration) : 0;

    pen.strokeStyle = ink(0.30);
    pen.lineWidth = 1;
    pen.beginPath();
    pen.moveTo(left, baseY);
    pen.lineTo(right, baseY);
    pen.stroke();

    var tickCount = Math.min(48, Math.max(16, Math.round(width / 26)));
    pen.beginPath();
    for (var tick = 0; tick <= tickCount; tick++) {
      var tickX = left + width * (tick / tickCount);
      var tickHeight = tick % 4 === 0 ? 4 : 2;
      pen.moveTo(tickX, baseY);
      pen.lineTo(tickX, baseY - tickHeight);
    }
    pen.stroke();

    if (ratio > 0) {
      pen.strokeStyle = ink(0.86);
      pen.lineWidth = Math.max(2, geom.band * 0.22);
      pen.beginPath();
      pen.moveTo(left, baseY);
      pen.lineTo(left + width * ratio, baseY);
      pen.stroke();
    }

    var markerSize = clampNumber(geom.footH * 0.20, 6, 13);
    drawSkull(pen, left + width * ratio, baseY - markerSize * 0.72, markerSize, 0.9);

    var timeSize = clampNumber(geom.footH * 0.16, 7.5, 11);
    pen.font = serifFont(timeSize, 400);
    pen.textBaseline = 'alphabetic';
    pen.fillStyle = ink(0.46);
    pen.textAlign = 'left';
    pen.fillText(formatClock(state.time), left, baseY - markerSize * 1.6);
    if (state.duration > 0) {
      pen.textAlign = 'right';
      pen.fillText(formatClock(state.duration), right, baseY - markerSize * 1.6);
    }
    pen.textAlign = 'center';

    var dialSize = clampNumber(geom.footH * 0.16, 7, 10);
    var dialCount = 12;
    var dialWidth = Math.min(width * 0.42, dialCount * dialSize * 3.2);
    var dialLeft = left + (width - dialWidth) / 2;
    var active = Math.abs(state.beatIndex) % dialCount;
    for (var mark = 0; mark < dialCount; mark++) {
      var markX = dialLeft + dialWidth * (mark + 0.5) / dialCount;
      var markY = baseY - markerSize * 2.5;
      var lit = mark === active ? 0.82 : 0.30;
      pen.fillStyle = ink(lit);
      pen.beginPath();
      if (mark % 3 === 0) {
        pen.arc(markX, markY, dialSize * 0.32, 0, Math.PI * 2);
        pen.fill();
      } else if (mark % 3 === 1) {
        pen.moveTo(markX, markY - dialSize * 0.40);
        pen.lineTo(markX + dialSize * 0.36, markY + dialSize * 0.28);
        pen.lineTo(markX - dialSize * 0.36, markY + dialSize * 0.28);
        pen.closePath();
        pen.fill();
      } else {
        pen.fillRect(markX - dialSize * 0.28, markY - dialSize * 0.28, dialSize * 0.56, dialSize * 0.56);
      }
    }
  }

  var marqueeCache = { unit: '', width: 0, size: 0 };
  function drawMarquee(pen) {
    var size = clampNumber(geom.footH * 0.135, 6.5, 9.5);
    var stripBaseline = geom.innerY + geom.innerH - size * 0.9;
    var left = geom.innerX + geom.band;
    var right = geom.innerX + geom.innerW - geom.band;
    if (right - left < 80) return;
    var unit = 'DE LAMIIS · ET PYTHONICIS · SABBATVM · MALLEVS · STRIGA · VENEFICIVM · ';
    if (marqueeCache.unit !== unit || marqueeCache.size !== size) {
      pen.font = serifFont(size, 400);
      marqueeCache.unit = unit;
      marqueeCache.size = size;
      marqueeCache.width = Math.max(40, pen.measureText(unit).width);
    }
    pen.font = serifFont(size, 400);
    pen.fillStyle = ink(0.36);
    pen.textAlign = 'left';
    pen.textBaseline = 'alphabetic';
    var offset = state.reduced ? 0 : (state.clock * 8) % marqueeCache.width;
    pen.save();
    pen.beginPath();
    pen.rect(left, stripBaseline - size * 1.6, right - left, size * 2.4);
    pen.clip();
    for (var x = left - offset; x < right; x += marqueeCache.width) {
      pen.fillText(unit, x, stripBaseline);
    }
    pen.restore();
  }

  var vignetteLayer = null;
  var glowLayer = null;

  function buildVignetteLayer() {
    if (layout.w < 2 || layout.h < 2) return;
    var layer = document.createElement('canvas');
    layer.width = Math.max(1, Math.round(layout.w * layout.dpr));
    layer.height = Math.max(1, Math.round(layout.h * layout.dpr));
    var layerCtx = layer.getContext('2d');
    layerCtx.setTransform(layout.dpr, 0, 0, layout.dpr, 0, 0);
    var centerX = layout.w / 2;
    var centerY = layout.h / 2;
    var radius = Math.max(layout.w, layout.h) * 0.74;
    var gradient = makeGradient(layerCtx, function () {
      var built = layerCtx.createRadialGradient(centerX, centerY, radius * 0.32, centerX, centerY, radius);
      addStop(built, 0, 'rgba(34,22,10,0)');
      addStop(built, 1, 'rgba(34,22,10,0.085)');
      return built;
    });
    if (!gradient) return;
    layerCtx.fillStyle = gradient;
    layerCtx.fillRect(0, 0, layout.w, layout.h);
    vignetteLayer = layer;
  }

  function buildGlowLayer() {
    glowLayer = null;
    if (!geom || !geom.plate) return;
    var radius = Math.max(12, geom.plate.w * 0.62);
    var size = Math.max(8, Math.round(radius * 2));
    var layer = document.createElement('canvas');
    layer.width = Math.min(2048, Math.round(size * layout.dpr));
    layer.height = Math.min(2048, Math.round(size * layout.dpr));
    var layerCtx = layer.getContext('2d');
    var scale = layer.width / size;
    layerCtx.setTransform(scale, 0, 0, scale, 0, 0);
    var gradient = makeGradient(layerCtx, function () {
      var built = layerCtx.createRadialGradient(radius, radius, radius * 0.05, radius, radius, radius);
      addStop(built, 0, accentColor(0.30));
      addStop(built, 0.55, accentColor(0.13));
      addStop(built, 1, accentColor(0));
      return built;
    });
    if (!gradient) return;
    layerCtx.fillStyle = gradient;
    layerCtx.fillRect(0, 0, size, size);
    glowLayer = { canvas: layer, x: geom.plate.x + geom.plate.w * 0.52 - radius, y: geom.plate.y + geom.plate.h * 0.80 - radius, size: size };
  }

  function drawVignette(pen) {
    var amount = clamp01(0.55 + state.pulse * 0.55);
    if (isDrawable(vignetteLayer)) {
      pen.save();
      pen.globalAlpha = amount;
      pen.drawImage(vignetteLayer, 0, 0, layout.w, layout.h);
      pen.restore();
      return;
    }
    var centerX = layout.w / 2;
    var centerY = layout.h / 2;
    var radius = Math.max(layout.w, layout.h) * 0.74;
    var gradient = makeGradient(pen, function () {
      var built = pen.createRadialGradient(centerX, centerY, radius * 0.34, centerX, centerY, radius);
      addStop(built, 0, 'rgba(38,26,12,0)');
      addStop(built, 1, 'rgba(38,26,12,0.06)');
      return built;
    });
    if (!gradient) return;
    pen.fillStyle = gradient;
    pen.fillRect(0, 0, layout.w, layout.h);
  }

  function drawPalimpsest(pen) {
    var target = geom.text;
    if (!target || !isDrawable(knight.canvas)) return;
    var height = target.h * 1.04;
    var width = Math.min(target.w * 0.92, height * (knight.canvas.width / knight.canvas.height) * 1.30);
    var x = target.x + target.w - width * 0.96;
    var y = target.y + (target.h - height) * 0.5;
    pen.save();
    pen.globalAlpha = state.reduced ? 0.06 : 0.05 + state.pulse * 0.025;
    pen.beginPath();
    pen.rect(target.x, target.y, target.w, target.h);
    pen.clip();
    pen.drawImage(knight.canvas, x, y, width, height);
    pen.restore();
  }

  function drawPlatePulse(pen) {
    var target = geom.plate;
    if (!target || state.pulse <= 0.02) return;
    var strength = clamp01(state.pulse);
    pen.save();
    pen.strokeStyle = ink(strength * 0.24);
    pen.lineWidth = 1 + strength * 2.2;
    pen.strokeRect(target.x - 2, target.y - 2, target.w + 4, target.h + 4);
    pen.restore();
  }

  function drawScene() {
    var width = layout.w;
    var height = layout.h;
    ctx.setTransform(layout.dpr, 0, 0, layout.dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    if (isDrawable(plate)) ctx.drawImage(plate, 0, 0, width, height);
    if (!geom) return;
    drawGlow(ctx);
    drawPalimpsest(ctx);
    drawPlatePulse(ctx);
    drawDust(ctx);
    drawLyrics(ctx);
    drawFooter(ctx);
    drawMarquee(ctx);
    drawVignette(ctx);
  }

  var lastFrameAt = 0;
  function loop(nowMs) {
    window.requestAnimationFrame(loop);
    var startedAt = currentStamp();
    var delta = lastFrameAt > 0 ? Math.min(80, Math.max(0, nowMs - lastFrameAt)) : 16;
    lastFrameAt = nowMs;
    state.clock += delta / 1000;
    state.pulse = Math.max(0, state.pulse - delta * 0.0016);
    updateDust(delta);
    state.frames += 1;
    try {
      drawScene();
    } catch (error) {
      reportError('draw', error);
    }
    state.jsMs = currentStamp() - startedAt;
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resizeTimer = 0;
      try { resize(); } catch (error) { reportError('resize', error); }
    }, 120);
  });
  window.addEventListener('orientationchange', function () {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resizeTimer = 0;
      try { resize(); } catch (error) { reportError('resize', error); }
    }, 200);
  });

  function bootVisuals() {
    try {
      buildGrain();
    } catch (error) {
      reportError('grain', error);
    }
    try {
      resize();
    } catch (error) {
      reportError('resize', error);
      layout.w = 1440;
      layout.h = 900;
      layout.dpr = 1;
      canvas.width = 1440;
      canvas.height = 900;
      plate.width = 1440;
      plate.height = 900;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      rebuildPlate();
      buildVignetteLayer();
    }
    try {
      loadWoodcut(hero, './assets/372-hexen.jpg');
      loadWoodcut(knight, './assets/372-knight.jpg');
      loadDisplayFont();
    } catch (error) {
      reportError('assets', error);
    }
  }

  window.requestAnimationFrame(function () {
    signalReady();
    window.requestAnimationFrame(function () {
      bootVisuals();
    });
  });
  window.setTimeout(signalReady, 800);
  window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
