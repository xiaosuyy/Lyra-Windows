<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>翻页牌</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(160,172,205,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}

  /* ---------- 面板：参考文件的深色机械箱体 ---------- */
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:16px 30px 20px;border-radius:22px;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg,#161b27 0%,#0d1119 100%);
    box-shadow:0 34px 80px rgba(0,0,0,.62),
               inset 0 3px 0 rgba(255,255,255,.045),
               inset 0 -12px 30px rgba(0,0,0,.5);
    --cw:40px;--ch:56px;--fs:34px;--gap:6px;--gapy:8px;
    --scw:20px;--sch:28px;--sfs:16px}

  .hdr{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:10px}
  .hdr b{font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.30em;color:#7c88a6}
  .hdr .tc{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.20em;color:#586180}
  .lamp{display:flex;align-items:center;gap:8px;font:600 10px/1 ui-monospace,Consolas,monospace;
        letter-spacing:.22em;color:#7c88a6}
  .lamp i{width:7px;height:7px;border-radius:50%;background:#ffd479;
    box-shadow:0 0 12px rgba(255,212,121,.85),0 0 3px rgba(255,212,121,1);
    opacity:.22;transition:opacity .10s}
  .lamp.on i{opacity:1}

  /* ---------- 牌子 ---------- */
  #main,#sub{display:flex;flex-direction:column;gap:var(--gapy);align-items:center}
  .mrow{display:flex;gap:var(--gap)}
  .flap{position:relative;width:var(--cw);height:var(--ch);border-radius:7px;overflow:hidden;
    background:linear-gradient(#020305,#0b0d13);
    box-shadow:0 7px 16px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.055);
    perspective:420px;transition:box-shadow .2s ease}
  .t,.b{position:absolute;left:0;width:100%;height:50%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font:800 var(--fs)/1 ui-monospace,"Cascadia Code",Consolas,monospace;
    color:#e7ecfb;text-shadow:0 2px 7px rgba(0,0,0,.55);
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 10%)}
  .t{top:0;border-radius:7px 7px 0 0;background-color:#2b3242;
     background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 10%),linear-gradient(180deg,#3a4254,#232938 96%)}
  .b{bottom:0;border-radius:0 0 7px 7px;
     background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 10%),linear-gradient(180deg,#1d2330,#2b3242 100%)}
  .ct,.cb{position:absolute;left:0;width:100%;height:50%;display:none;overflow:hidden;
    align-items:center;justify-content:center;
    font:800 var(--fs)/1 ui-monospace,"Cascadia Code",Consolas,monospace;
    color:#e7ecfb;text-shadow:0 2px 7px rgba(0,0,0,.55);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 10%),linear-gradient(180deg,#3a4254,#232938 96%)}
  .ct{top:0;border-radius:7px 7px 0 0;transform-origin:50% 100%}
  .cb{bottom:0;border-radius:0 0 7px 7px;transform-origin:50% 0;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 10%),linear-gradient(180deg,#1d2330,#2b3242 100%)}
  /* 两个同形不同名的动画：交替挂 f1/f2 就能重启动画，不用强制 reflow */
  .flap.f1 .ct,.flap.f1 .cb,.flap.f2 .ct,.flap.f2 .cb{display:flex}
  .flap.f1 .ct{animation:fa1 .1s cubic-bezier(.42,0,.78,.5) forwards}
  .flap.f1 .cb{animation:fb1 .1s cubic-bezier(.22,.5,.58,1) .1s forwards}
  .flap.f2 .ct{animation:fa2 .1s cubic-bezier(.42,0,.78,.5) forwards}
  .flap.f2 .cb{animation:fb2 .1s cubic-bezier(.22,.5,.58,1) .1s forwards}
  @keyframes fa1{from{transform:rotateX(0deg)}to{transform:rotateX(-90deg)}}
  @keyframes fa2{from{transform:rotateX(0deg)}to{transform:rotateX(-90deg)}}
  @keyframes fb1{from{transform:rotateX(90deg)}to{transform:rotateX(0deg)}}
  @keyframes fb2{from{transform:rotateX(90deg)}to{transform:rotateX(0deg)}}
  .flap.hit{box-shadow:0 0 0 1px rgba(152,170,255,.55),0 0 22px rgba(120,150,255,.30)}
  .flap.hit .t,.flap.hit .b,.flap.hit .ct,.flap.hit .cb{color:#fff}

  .sub .flap{width:var(--scw);height:var(--sch);border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04)}
  .sub .t,.sub .b,.sub .ct,.sub .cb{font-size:var(--sfs)}
  #sub{opacity:.62;transition:opacity .45s ease;filter:saturate(.8)}

  .sep{display:flex;align-items:center;gap:14px;margin:12px 0 9px}
  .sep s{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.09),rgba(255,255,255,0));text-decoration:none}
  .sep b{font:600 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.30em;color:#5d6884}

  #panel.j1{animation:jo1 .13s ease-out}
  #panel.j2{animation:jo2 .13s ease-out}
  @keyframes jo1{0%{transform:translate(-50%,-50%) translateY(2.6px)}100%{transform:translate(-50%,-50%)}}
  @keyframes jo2{0%{transform:translate(-50%,-50%) translateY(2.6px)}100%{transform:translate(-50%,-50%)}}
  #glare{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .22s ease;
    background:radial-gradient(70% 60% at 50% 46%,rgba(150,175,255,.10),rgba(150,175,255,0) 70%)}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="glare"></div>
<div id="panel">
  <div class="hdr">
    <b>歌 词 牌</b>
    <span class="tc" id="tc">00:00</span>
    <span class="lamp" id="lamp"><i></i>SYNC</span>
  </div>
  <div id="main"></div>
  <div class="sep"><s></s><b>NEXT · 下 一 句</b><s></s></div>
  <div id="sub"></div>
</div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   026 · 翻页牌 —— 歌词是一块**机场翻页牌**
   ----------------------------------------------------------------------------
   核心机制：**表盘环形走位 + 到点必达的最后一张翻牌**。
   每个格子是一块独立的机械翻片，它只能沿"字符表盘(drum)"**单向**往前转。
   要显示某个字，就从这个格子当前停的盘位一路转过去；走多少格由两个字在
   表盘上的环形距离决定 —— 所以每个格子的转数和停下的时刻都不一样。
   关键是最后一格：不管前面转了多少格，最后一张一定是一记 200ms 的
   **真 3D 翻牌**（顶卡 0→-90°，底卡 90°→0°，背向面隐藏），
   而这一记翻牌的**落位时刻 = 这一格的 deadline**。
   于是整块牌子在换句那一瞬间是"一片模糊的转盘声"，
   然后从左到右、一格一格地"咔哒"落定 —— 声音是画出来的。

   显示与酝酿分离：主牌（正在唱的那句）只在句首翻；
   下面的 NEXT 牌是**真·预告牌**：brewIdx 一到，它就提前把下一句
   转出来（它的 deadline 就是下一句的开唱时刻），
   开唱瞬间主牌才翻过去。所以"准备"在屏幕上是一件看得见的体力活。

   精修记录（批次B）：① **主牌 2 行 → 3 行** —— 原 mapMain 对 >40 字直接
   截断（实测 41 字丢末字），改为最多 3 行均分排布（空行隐藏、layout 按
   3 行预留高度），任何字数完整可见。② **每格 deadline 接 YRC** ——
   格 i 对应原文第 map[i] 个字时，落位时刻压在 chars[map[i]].t 上
   （无 chars 按 t + dur*i/n 均分 + 从左到右级联）；NEXT 预告牌同样接
   下一句的 YRC。③ 分词接入 segdict.bin（同 004）：级联波按**词团**分组 ——
   同词的格子一起开转、词间多停一拍，转盘声就有了词的颗粒。
   ========================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const panel = document.getElementById('panel');
const lampEl = document.getElementById('lamp');
const tcEl = document.getElementById('tc');
const mainEl = document.getElementById('main');
const subEl = document.getElementById('sub');
const glare = document.getElementById('glare');

let W = 0, H = 0, DPR = 1;
let accent = [120, 150, 255];

/* ---------- 表盘 ---------- */
const BASE = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789·:.-—/、。，！？";
let DRUM = BASE, DN = DRUM.length, DIDX = new Map();
for (let i = 0; i < DRUM.length; i++) DIDX.set(DRUM.charAt(i), i);

function buildDrum() {
  const out = [], seen = new Set();
  const push = (ch) => { if (ch && !seen.has(ch)) { seen.add(ch); out.push(ch); } };
  for (let i = 0; i < BASE.length; i++) push(BASE.charAt(i));
  /* 把这首歌里出现过的字刻进表盘（上限 240 个，防止表盘过长） */
  for (let i = 0; i < lines.length && out.length < 240; i++) {
    const t = lines[i].text || '';
    for (let k = 0; k < t.length && out.length < 240; k++) push(t.charAt(k));
  }
  DRUM = out.join('');
  DN = DRUM.length;
  DIDX = new Map();
  for (let i = 0; i < DN; i++) DIDX.set(DRUM.charAt(i), i);
}
function drumIdx(ch) {
  let i = DIDX.get(ch);
  if (i === undefined) { DRUM += ch; DN = DRUM.length; i = DN - 1; DIDX.set(ch, i); }
  return i;
}

/* ---------- 牌子 ---------- */
const MCOLS = 20, MROWS = 3;        // 主牌 60 格（3 行 × 20，长句完整）
const SCOLS = 20;                   // 预告牌 20 格
const MAIN = [], SUB = [];
const FLIPMS = 200;                 // 最后一记 3D 翻牌的时长
const CAPSTEP = 34;                 // 单次最多转多少格（再多也只是转得更糊）

function makeFlap(small) {
  const el = document.createElement('div');
  el.className = 'flap';
  const t = document.createElement('span'); t.className = 't';
  const b = document.createElement('span'); b.className = 'b';
  el.appendChild(t); el.appendChild(b);
  const f = { el, t, b, ct: null, cb: null, small: !!small,
              ci: 0, ti: 0, left: 0, fin: true, stepAt: 0, deadline: 0,
              commitAt: 0, hitUntil: 0, tog: 0 };
  if (!small) {
    const ct = document.createElement('i'); ct.className = 'ct';
    const cb = document.createElement('i'); cb.className = 'cb';
    el.appendChild(ct); el.appendChild(cb);
    f.ct = ct; f.cb = cb;
  }
  t.textContent = ' '; b.textContent = ' ';
  return f;
}
function buildBoard(host, rows, cols, store, small) {
  host.innerHTML = '';
  store.length = 0;
  for (let r = 0; r < rows; r++) {
    const row = document.createElement('div');
    row.className = 'mrow';
    for (let c = 0; c < cols; c++) {
      const f = makeFlap(small);
      row.appendChild(f.el);
      store.push(f);
    }
    host.appendChild(row);
  }
}
function setStatic(f, ch) { f.t.textContent = ch; f.b.textContent = ch; }

/* ---------- 机械动作 ---------- */
/** 让一格转去目标字。deadline 是"必须落在这一格"的绝对毫秒时刻。
    startAt 可以早于现在（开转时刻由 YRC 反推）；机械时间有硬下限：
    还要转的步数 × 16ms + 200ms 翻牌 —— 排不出时 deadline 顺延，
    宁可晚一点咔哒，也绝不把翻牌卡成半截的"双字叠印"。 */
function launch(f, ch, startAt, deadline) {
  const ti = drumIdx(ch);
  if (f.commitAt) { f.commitAt = 0; f.el.classList.remove('f1', 'f2'); }
  let steps = (ti - f.ci + DN) % DN;
  const nowMs = performance.now();
  if (steps === 0) { f.ti = ti; f.left = 0; f.fin = true; f.stepAt = Infinity; return; }
  if (steps > CAPSTEP) { f.ci = (ti - CAPSTEP + DN) % DN; steps = CAPSTEP; setStatic(f, DRUM.charAt(f.ci)); }
  f.ti = ti; f.left = steps; f.fin = false;
  /* 机械下限：步进至少 16ms/格 + 最后一记 200ms 翻牌 */
  const need = steps * 16 + FLIPMS + 60;
  const dlMs = Math.max(nowMs + need, Math.min(deadline, startAt + need));
  f.deadline = Math.max(nowMs + 140, dlMs);
  f.stepAt = Math.max(nowMs, Math.min(startAt, f.deadline - need));   // 不得晚于"再开转就来不及"
}
function commit(f) {
  f.commitAt = 0; f.left = 0; f.fin = true; f.stepAt = Infinity; f.ci = f.ti;
  f.el.classList.remove('f1', 'f2');
  setStatic(f, DRUM.charAt(f.ci));
  f.el.classList.add('hit');
  f.hitUntil = performance.now() + 110;
}
function startFlip(f, nowMs) {
  if (f.small) { f.ci = (f.ci + 1) % DN; commit(f); return; }
  const cur = DRUM.charAt(f.ci);
  f.t.textContent = cur; f.b.textContent = cur;
  f.ct.textContent = cur;
  f.cb.textContent = DRUM.charAt((f.ci + 1) % DN);
  f.el.classList.remove('f1', 'f2');
  f.tog ^= 1;
  f.el.classList.add(f.tog ? 'f1' : 'f2');
  f.left = 0;
  f.commitAt = nowMs + FLIPMS;
}
function pump(f, nowMs) {
  if (f.hitUntil && nowMs >= f.hitUntil) { f.el.classList.remove('hit'); f.hitUntil = 0; }
  if (f.fin) return;
  if (f.commitAt) { if (nowMs >= f.commitAt) commit(f); return; }
  /* 兜底：deadline 已过 250ms 还没进入翻牌 —— 直接落定。
     （机械时间被节流挤掉时绝不能停在半截，否则就是"双字叠印"） */
  if (nowMs > f.deadline + 250 && f.left > 1) { f.ci = f.ti; commit(f); return; }
  if (nowMs < f.stepAt) return;
  if (f.left > 1) {
    f.ci = (f.ci + 1) % DN;
    f.left--;
    setStatic(f, DRUM.charAt(f.ci));
    /* 剩下的时间要同时喂饱"还要转的格数 + 最后一记 3D 翻牌" */
    const rest = f.left - 1;
    let iv = rest > 0 ? (f.deadline - FLIPMS - nowMs) / rest : (f.deadline - FLIPMS - nowMs);
    if (iv < 16) iv = 16; else if (iv > 1200) iv = 1200;
    f.stepAt = nowMs + iv;
  } else {
    /* 最后一格：翻牌动画本身固定 200ms，所以要等"落位时刻 - 200ms"再起跑，
       这样短路的格子也不会提前落定 —— 从左到右的咔哒声才排得齐 */
    const flipStart = f.deadline - FLIPMS;
    if (nowMs < flipStart - 8) { f.stepAt = flipStart; return; }
    startFlip(f, nowMs);
  }
}
/** 待机自检：整块牌子一格一格地空转（相干，不是逐格乱转） */
function idlePump(f, nowMs) {
  if (nowMs < f.stepAt) return;
  f.ci = (f.ci + 1) % DN;
  setStatic(f, DRUM.charAt(f.ci));
  f.stepAt = nowMs + 360;
}

/* ---------- 排版：一句词怎么放进格子里 ----------
   3 行均分 + 居中，任何字数都完整（41 字 → 14/14/13）。
   map[i] = 第 i 格对应的原文索引，-1 = 空格（不映射字）。 */
const MAP = new Int16Array(MROWS * MCOLS);
function mapMain(text) {
  MAP.fill(-1);
  const s = (text || '').replace(/\s+/g, ' ').trim();
  const L = s.length;
  if (!L) return 0;
  const rows = Math.min(MROWS, Math.ceil(L / MCOLS));
  const per = Math.ceil(L / rows);
  let p = 0;
  for (let r = 0; r < rows; r++) {
    const take = Math.min(per, L - p);
    const off = Math.max(0, ((MCOLS - take) / 2) | 0);
    for (let k = 0; k < take; k++) MAP[r * MCOLS + off + k] = p + k;
    p += take;
  }
  return rows;
}
function mapSub(text) {
  const row = new Array(SCOLS).fill(' ');
  const s = (text || '').replace(/\s+/g, ' ').trim();
  const c = s.length > SCOLS ? s.slice(0, SCOLS) : s;
  const off = Math.max(0, ((SCOLS - c.length) / 2) | 0);
  for (let k = 0; k < c.length; k++) row[off + k] = c.charAt(k);
  return row.join('');
}

/* 分词：级联波按词团分组（同 004 词典，DICT 判空回退规则切分）。
   gid[i] = 原文第 i 个字所在的词团编号（团内连转、团间稍停） */
let DICT = null;
fetch('/segdict.bin')
  .then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); })
  .catch(() => {});
const fnv26 = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};
function isWord26(s, i, L) {
  const h = fnv26(s.substr(i, L));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1, v = DICT[m];
    if (v === h) return true;
    if (v < h) lo = m + 1; else hi = m - 1;
  }
  return false;
}
const PUNCT26 = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】\s]/;
function wordGroups(text) {
  const n = text.length, gid = new Int16Array(n);
  let g = 0, i = 0;
  while (i < n) {
    if (PUNCT26.test(text[i])) { gid[i] = g++; i++; continue; }
    let hit = 0;
    if (DICT) for (let L = Math.min(4, n - i); L >= 2; L--) if (isWord26(text, i, L)) { hit = L; break; }
    const L = hit || 1;
    for (let k = 0; k < L && i + k < n; k++) gid[i + k] = g;
    i += L; g++;
  }
  return { gid, groups: g };
}

/** 换句：主牌整块翻过去。落位时刻逐格压 YRC：
    格 i 映射字 map[i] → deadline = chars[map[i]].t（无 chars 均分）；
    空格格落在左右邻字的时刻之间。开转提前 0.55s（预备期可见地空转）。 */
let mainYrc = false;
function launchMain(text, nowMs, line) {
  const used = mapMain(text);
  const s = (text || '').replace(/\s+/g, ' ').trim();
  const n = s.length;
  const t0 = line ? line.t : 0;
  const dur = Math.max(0.8, (line && line.dur) || 2.4);
  const end = line && line.t + dur > t0 ? t0 + dur : t0 + 2.4;
  const chs = line && line.chars && line.chars.length === n ? line.chars : null;
  /* 逐字落位时刻（原文索引 → 秒），无 chars 均分 */
  const ct = new Float32Array(n);
  mainYrc = !!chs;
  let prev = 0;
  for (let i = 0; i < n; i++) {
    let t = chs && isFinite(+chs[i].t) ? +chs[i].t : t0 + dur * 0.86 * (i / Math.max(1, n));
    if (!(t >= t0)) t = t0;
    if (t > end) t = end;
    if (i && t < prev) t = prev;
    prev = t;
    ct[i] = t;
  }
  /* 级联分组：词团编号决定"团内连转、团间稍停"的开转顺序 */
  const { gid } = wordGroups(s);
  const idleMs = performance.now();
  for (let i = 0; i < MAIN.length; i++) {
    const mi = MAP[i];
    const f = MAIN[i];
    let dl;
    if (mi < 0) {
      /* 空格格：夹在左右邻字之间落位 */
      let l = i - 1, r = i + 1;
      while (l >= 0 && MAP[l] < 0) l--;
      while (r < MAIN.length && MAP[r] < 0) r++;
      const tl = l >= 0 ? ct[MAP[l]] : t0;
      const tr = r < MAIN.length && MAP[r] >= 0 ? ct[MAP[r]] : end;
      dl = (tl + tr) / 2;
    } else {
      dl = ct[mi];
    }
    /* 开转时刻 = 落位 - 0.55s，再按词团错峰：团号越大起得越晚（词间稍停） */
    const g = mi >= 0 ? gid[mi] : 0;
    const start = Math.max(idleMs, idleMs + (dl - t0 - 0.55) * 1000 + g * 26);
    /* 空格格的目标是空格符（表盘 0 位），绝不能拿 charAt(0) 当目标 */
    launch(f, mi >= 0 ? s.charAt(mi) : ' ', start, idleMs + (dl - t0) * 1000);
  }
}
/** 酝酿：预告牌把下一句转出来，落位时刻 = 下一句开唱时刻（同样接 YRC） */
function launchSub(text, nowMs, ahead, line) {
  const row = mapSub(text);
  const total = Math.max(0.28, ahead);
  const s = (text || '').replace(/\s+/g, ' ').trim();
  const n = s.length;
  const t0 = line ? line.t : 0;
  const dur = Math.max(0.8, (line && line.dur) || 2.4);
  const chs = line && line.chars && line.chars.length === n ? line.chars : null;
  const base = Math.max(0.22, total - 0.50);       // 最后一格正好落在下一句开唱那一刻
  for (let i = 0; i < SUB.length; i++) {
    const col = i % SCOLS;
    let st = (col / (SCOLS - 1)) * 0.50;
    /* 有 YRC 时：预告格按下一句对应字的时刻前置 —— 用比例映射进预告窗口 */
    if (chs && col < n && isFinite(+chs[col].t)) {
      const frac = dur > 0 ? (chs[col].t - t0) / dur : st / 0.5;
      st = Math.max(0, Math.min(0.50, frac * 0.50));
    }
    launch(SUB[i], row.charAt(i), nowMs, nowMs + (base + st) * 1000);
  }
}
function blankBoard(store) {
  for (let i = 0; i < store.length; i++) {
    const f = store[i];
    f.fin = true; f.left = 0; f.commitAt = 0; f.stepAt = Infinity;
    f.el.classList.remove('f1', 'f2', 'hit');
    f.ci = 0; f.ti = 0;
    setStatic(f, ' ');
  }
}

/* ---------- 背景（一次画好，不占每帧预算） ---------- */
function backdrop() {
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
  const [ar, ag, ab] = accent;
  const g = ctx.createRadialGradient(W * 0.5, H * 0.44, 10, W * 0.5, H * 0.5, Math.max(W, H) * 0.62);
  g.addColorStop(0, 'rgba(' + (ar * 0.10 | 0) + ',' + (ag * 0.11 | 0) + ',' + (ab * 0.16 | 0) + ')');
  g.addColorStop(1, 'rgba(5,6,10,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.022)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < W; x += 46) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y < H; y += 46) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
}

function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const padX = 30, gap = 6, gapY = 8;
  const maxW = Math.min(W * 0.94, 1460);
  let cw = (maxW - padX * 2 - (MCOLS - 1) * gap) / MCOLS;
  let ch = cw * 1.4;
  const chrome = 152;                     // 头部 + 分隔 + 内边距
  /* 按 3 行预留高度 —— 长句折满 3 行时牌子不许溢出屏幕 */
  const need = ch * MROWS + gapY * (MROWS - 1) + ch * 0.5 + chrome;
  const maxH = H * 0.90;
  if (need > maxH) { const k = (maxH - chrome) / (ch * MROWS + gapY * (MROWS - 1) + ch * 0.5); cw *= k; ch = cw * 1.4; }
  cw = Math.max(12, cw); ch = Math.max(17, ch);

  panel.style.setProperty('--cw', cw.toFixed(2) + 'px');
  panel.style.setProperty('--ch', ch.toFixed(2) + 'px');
  panel.style.setProperty('--gap', gap + 'px');
  panel.style.setProperty('--gapy', gapY + 'px');
  panel.style.setProperty('--fs', Math.min(ch * 0.62, cw * 0.80).toFixed(2) + 'px');
  panel.style.setProperty('--scw', (cw * 0.5).toFixed(2) + 'px');
  panel.style.setProperty('--sch', (ch * 0.5).toFixed(2) + 'px');
  panel.style.setProperty('--sfs', (ch * 0.31).toFixed(2) + 'px');
  backdrop();
}

/* ================= 节奏：1-10 的教训固化在这里 =================
   ① 显示与酝酿分离 —— curIdx 只在句首切换，brewIdx 提前 lead 秒准备
   ② 索引单调不回退 —— 时钟在 tick 之间外推、tick 一来会往回缩一点，
      不锁单调的话句边界来回跳、同一句被反复重建
   ③ 提前量自适应 —— 快歌早开始，慢歌不提前太多
   ④ 只有拖进度条（时间明显倒退）才允许重置
   ================================================================ */
let lines = [];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
let curIdx = -1, brewIdx = -1, lastT = -1;
const LEAD = 1.3;
let idle = true;
let beatGlow = 0;

function reset() {
  /* lastT 必须一起归位：换歌时上一首的最后时间可能是 200s，
     而新歌从 0 开始 —— 不归位的话"时间倒退"判定会一直成立，
     牌子会被无限重置，新歌一句都显示不出来 */
  curIdx = -1; brewIdx = -1; lastT = -1;
  idle = true;
  subEl.style.opacity = '0.20';
  blankBoard(MAIN); blankBoard(SUB);
  for (let i = 0; i < MAIN.length; i++) MAIN[i].stepAt = performance.now() + (i % MCOLS) * 12;
}

function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) reset();
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    if (ci >= 0) {
      /* 显示切到第 ci 句：主牌整块翻过去（旧句的格子当场被派了新活，
         没有独立粒子池要归还 —— 每一格的盘位是它自己的状态，
         不存在"池子被旧句占满"这回事） */
      idle = false;
      subEl.style.opacity = '0.20';        // 预告牌暂时"正在装载"
      const ms = performance.now();
      launchMain(lines[ci].text || '', ms, lines[ci]);
      hint.style.opacity = '0';
    } else {
      idle = true;
    }
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) {
      brewIdx = nx;
      /* 开始准备第 nx 句：预告牌一行一格地转出下一句，
         它的落位时刻正好是下一句开唱的那一刻（同样接下一句的 YRC） */
      subEl.style.opacity = '0.62';
      launchSub(lines[nx].text || '', performance.now(), lines[nx].t - T, lines[nx]);
    }
  }
}

let last = performance.now();
let jolt = 0, tcLast = '', joltTog = 0;
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs;
  const T = now();
  timing(T);

  for (let i = 0; i < MAIN.length; i++) {
    const f = MAIN[i];
    if (idle && f.fin) idlePump(f, nowMs); else pump(f, nowMs);
  }
  for (let i = 0; i < SUB.length; i++) pump(SUB[i], nowMs);

  if (jolt && nowMs >= jolt) {
    panel.classList.remove('j1', 'j2');
    lampEl.classList.remove('on');
    jolt = 0;
  }
  if (beatGlow > 0) {
    beatGlow = Math.max(0, beatGlow - dt * 3.4);
    glare.style.opacity = (beatGlow * 0.9).toFixed(3);
  }

  const tt = Math.max(0, T) | 0;
  const s = (tt / 60 | 0) + ':' + ('0' + (tt % 60)).slice(-2);
  if (s !== tcLast) { tcLast = s; tcEl.textContent = s; }

  requestAnimationFrame(frame);
}

/* 尺寸变化 */
let rzTimer = 0;
addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(layout, 140);
});

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent) accent = p.accent;
    buildDrum();
    reset();
    clockT = 0; clockAt = performance.now();
    layout();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 踩拍：相干 —— 整箱抖一下 + 顶灯亮 + 所有还在转的格子一起加速，
       绝不逐格随机乱踢（那会把字形逻辑和机械逻辑一起打散） */
    const lv = d.payload.level || 0;
    panel.classList.remove('j1', 'j2');
    joltTog ^= 1;
    panel.classList.add(joltTog ? 'j1' : 'j2');
    lampEl.classList.add('on');
    jolt = performance.now() + 130;
    beatGlow = Math.min(1, 0.35 + lv * 0.65);
    const nowMs = performance.now();
    const all = [MAIN, SUB];
    for (let a = 0; a < 2; a++) {
      const arr = all[a];
      for (let i = 0; i < arr.length; i++) {
        const f = arr[i];
        if (!f.fin && !f.commitAt && f.stepAt > nowMs) f.stepAt = nowMs + (f.stepAt - nowMs) * 0.45;
      }
    }
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

buildDrum();
buildBoard(mainEl, MROWS, MCOLS, MAIN, false);
buildBoard(subEl, 1, SCOLS, SUB, true);
subEl.style.opacity = '0.20';
layout();
requestAnimationFrame(frame);
window.__stage = () => ({ lines: lines.length, curIdx, brewIdx, T: +now().toFixed(2), drum: DN, yrc: mainYrc });
</script>
</body>
</html>
