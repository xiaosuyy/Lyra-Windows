<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨翎 · 457</title>
<style>
  :root{
    --ink:#f2ebdd;
    --bg:#07070a;
    --accent:#c8402f;
    --accent-lt:#ff6a4d;
    --dim:rgba(242,235,221,.30);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #stage{
    position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(120% 82% at 62% 32%,#171319 0%,#0c0b0f 46%,#060608 100%);
  }
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(72% 52% at 56% 42%,rgba(255,240,220,.05),transparent 70%),
      linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 20%,transparent 72%,rgba(0,0,0,.78) 100%);
  }
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
  #art{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  #art svg{position:absolute;overflow:visible}
  #meta{
    position:absolute;left:clamp(22px,6.4vw,116px);top:clamp(20px,5vh,54px);z-index:6;
    display:flex;align-items:baseline;gap:.9em;
    font-size:clamp(10px,1.02vw,13px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(242,235,221,.42);max-width:70vw;white-space:nowrap;overflow:hidden;
  }
  #meta #track{color:rgba(242,235,221,.66);letter-spacing:.2em;overflow:hidden;text-overflow:ellipsis}
  #meta #artists{letter-spacing:.14em;overflow:hidden;text-overflow:ellipsis}
  #rule{
    position:absolute;left:clamp(22px,6.4vw,116px);top:26vh;height:44vh;width:1px;z-index:6;
    background:linear-gradient(180deg,var(--accent),rgba(200,64,47,0));
    opacity:.85;
  }
  #rule::before{
    content:"";position:absolute;left:-2px;top:0;width:5px;height:5px;border-radius:50%;
    background:var(--accent-lt);opacity:.9;
  }
  #lyr{
    position:absolute;left:clamp(28px,7.2vw,132px);bottom:clamp(54px,16vh,168px);
    max-width:min(54vw,860px);z-index:6;
    padding-left:clamp(16px,2.2vw,38px);
  }
  .lr{white-space:pre-wrap;word-break:break-word;font-weight:400;letter-spacing:.02em}
  #prev,#next{font-size:clamp(12px,1.35vw,19px);line-height:1.55;color:rgba(242,235,221,.34)}
  #prev{margin-bottom:.9em;max-width:min(48vw,660px)}
  #next{margin-top:.9em;color:rgba(242,235,221,.26);max-width:min(48vw,660px)}
  #cur{font-size:clamp(26px,4.6vw,66px);line-height:1.32;color:var(--ink);position:relative}
  #cur .ph{color:rgba(242,235,221,.5);font-size:.62em;letter-spacing:.42em}
  #cur .ch{color:rgba(242,235,221,.46);transition:color .26s ease}
  #cur .ch.on{color:var(--ink)}
  #cur .ch.sing{color:var(--accent-lt)}
  #empty{
    position:absolute;left:clamp(28px,7.2vw,132px);bottom:clamp(54px,16vh,168px);z-index:6;
    padding-left:clamp(16px,2.2vw,38px);display:none;align-items:baseline;gap:.7em;
    font-size:clamp(22px,3.4vw,44px);color:rgba(242,235,221,.72);letter-spacing:.14em;
  }
  #empty span{font-size:.42em;letter-spacing:.5em;color:var(--accent-lt);opacity:.75}
  #seal{
    position:absolute;right:clamp(16px,3.4vw,54px);bottom:clamp(18px,4vh,46px);z-index:6;
    width:clamp(34px,3.2vw,52px);aspect-ratio:1/1;display:none;place-items:center;
    background:var(--accent);color:#0a0608;font-size:clamp(18px,1.8vw,26px);
    border-radius:2px;opacity:.82;transform:rotate(-3deg);
  }
  body.paused #cur .ch.sing{color:var(--ink)}
  body.rm #cur .ch{transition:none}

  /* ---- 解构脸谱：套版错位的双色丝网 ---- */
  #art svg.mask{
    position:absolute;right:4.5vw;top:50%;height:min(84vh,96vw);width:auto;
    transform:translateY(-50%);opacity:.95;
    will-change:transform;
    animation:maskDrift 17s ease-in-out infinite alternate;
  }
  @keyframes maskDrift{
    from{transform:translate3d(0,-50%,0) rotate(-1.1deg) scale(1)}
    to  {transform:translate3d(-1.4vw,-50.8%,0) rotate(.9deg) scale(1.015)}
  }
  #art svg.mask .s{fill:none;stroke-linecap:round;stroke-linejoin:round}
  #art svg.mask .ink {stroke:rgba(242,235,221,.58);stroke-width:1.5}
  #art svg.mask .inkd{stroke:rgba(242,235,221,.30);stroke-width:1.1}
  #art svg.mask .inkb{stroke:rgba(242,235,221,.80);stroke-width:6.2}
  #art svg.mask .inkf{fill:rgba(242,235,221,.055);stroke:none}
  #art svg.mask .acc {stroke:var(--accent);stroke-width:1.7}
  #art svg.mask .accd{stroke:var(--accent);stroke-width:3.6}
  #art svg.mask .accf{fill:var(--accent);stroke:none}
  #art svg.mask .ghost{animation:misprint 9s steps(1,end) infinite}
  @keyframes misprint{
    0%{transform:translate(0,0)} 42%{transform:translate(5px,-3px)}
    70%{transform:translate(-3px,2px)} 100%{transform:translate(0,0)}
  }
  body.rm #art svg.mask{animation:none;transform:translateY(-50%)}
  body.rm #art svg.mask .ghost{animation:none}

  body.portrait #art svg.mask{
    right:-14vw;top:5vh;height:min(52vh,118vw);opacity:.5;
    animation:none;transform:none;
  }
  body.portrait #lyr,body.portrait #empty{bottom:clamp(40px,13vh,120px);max-width:86vw}
  body.portrait #cur{font-size:clamp(24px,7.2vw,44px)}
  body.portrait #prev,body.portrait #next{max-width:80vw}
  body.portrait #meta{letter-spacing:.26em;max-width:86vw}
  body.portrait #rule{top:auto;bottom:clamp(30px,10vh,90px);height:44vh}

  #vign{position:absolute;inset:0;z-index:4;pointer-events:none;
    box-shadow:inset 0 0 min(22vh,200px) min(3vh,32px) rgba(0,0,0,.55)}

  /* 入场：一道帘子从右抽开 */
  #veil{position:absolute;inset:0;z-index:20;pointer-events:none;background:#06060a;
    transform-origin:100% 50%;animation:veil 1.15s cubic-bezier(.16,.84,.3,1) forwards}
  @keyframes veil{from{transform:scaleX(1);opacity:1}to{transform:scaleX(0);opacity:0}}
  body.rm #veil{animation-duration:.01s}

  /* 落字：每句进场 */
  #cur.line-in{animation:lineIn .5s cubic-bezier(.2,.9,.25,1) both}
  @keyframes lineIn{
    from{opacity:0;transform:translate3d(-14px,7px,0)}
    to  {opacity:1;transform:translate3d(0,0,0)}
  }
  body.rm #cur.line-in{animation:none}

  /* 朱印随鼓点涨一下 */
  #seal.beat{animation:sealHit .42s ease-out}
  @keyframes sealHit{
    0%{transform:rotate(-3deg) scale(1)}
    32%{transform:rotate(-3deg) scale(1.16);filter:brightness(1.35)}
    100%{transform:rotate(-3deg) scale(1)}
  }
  body.rm #seal.beat{animation:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="art" aria-hidden="true"></div>
  <div id="vign" aria-hidden="true"></div>
  <header id="meta"><span id="track"></span><span id="artists"></span></header>
  <div id="rule"></div>
  <div id="lyr">
    <div class="lr" id="prev"></div>
    <div class="lr" id="cur"><span class="ph">听 场</span></div>
    <div class="lr" id="next"></div>
  </div>
  <div id="seal" aria-hidden="true">翎</div>
  <div id="empty">此曲无词<span>静场</span></div>
  <div id="veil" aria-hidden="true"></div>
</div>
<script>
'use strict';

var S = {
  lines: [], idx: -1, t: 0, playing: true, duration: 0,
  frames: 0, js: 0, err: '', text: '', gl: false, rm: false,
  accent: [200, 64, 47],
  w: 1440, h: 900, dpr: 1,
  beat: 0, beatPulse: 0, live: null, bpm: 0, portrait: false,
  started: false, readySent: false, curKey: '', tokens: []
};
var view = { w: 1440, h: 900, dpr: 1 };
var el = {};

window.__stage = function () {
  return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm
  };
};

function pos(n, fb) { n = +n; return isFinite(n) && n > 0 ? n : fb; }
function num(n, fb) { n = +n; return isFinite(n) ? n : fb; }
function clamp(n, a, b) { n = +n; if (!isFinite(n)) n = a; return n < a ? a : (n > b ? b : n); }

function grabDom() {
  el.cv = document.getElementById('cv');
  el.ctx = el.cv ? el.cv.getContext('2d') : null;
  el.lyr = document.getElementById('lyr');
  el.cur = document.getElementById('cur');
  el.prev = document.getElementById('prev');
  el.next = document.getElementById('next');
  el.empty = document.getElementById('empty');
  el.meta = document.getElementById('meta');
  el.track = document.getElementById('track');
  el.artists = document.getElementById('artists');
  el.art = document.getElementById('art');
  el.seal = document.getElementById('seal');
  el.veil = document.getElementById('veil');
}

function resize() {
  try {
    var w = pos(window.innerWidth, 1440), h = pos(window.innerHeight, 900);
    S.w = w; S.h = h; S.dpr = clamp(window.devicePixelRatio || 1, 0.75, 1.6);
    view.w = w; view.h = h; view.dpr = S.dpr;
    var portrait = h > w * 1.12;
    if (portrait !== S.portrait) {
      S.portrait = portrait;
      document.body.classList.toggle('portrait', portrait);
    }
    if (el.cv && el.ctx) {
      el.cv.width = Math.round(w * S.dpr);
      el.cv.height = Math.round(h * S.dpr);
      el.ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    }
    layout();
  } catch (e) {
    console.error('[457] resize', e);
    S.err = String((e && e.message) || e);
  }
}

function setAccent(a) {
  var r = clamp(a[0] | 0, 0, 255), g = clamp(a[1] | 0, 0, 255), b = clamp(a[2] | 0, 0, 255);
  if (r + g + b < 42) { r = 200; g = 64; b = 47; }
  S.accent = [r, g, b];
  var root = document.documentElement.style;
  root.setProperty('--accent', 'rgb(' + r + ',' + g + ',' + b + ')');
  root.setProperty('--accent-lt', 'rgb(' + Math.min(255, r + 34) + ',' + Math.min(255, g + 26) + ',' + Math.min(255, b + 22) + ')');
}

function setMeta(song) {
  if (!el.track) return;
  var name = song && song.name ? String(song.name) : '';
  var ar = song && song.artists;
  if (Array.isArray(ar)) ar = ar.join(' / ');
  ar = ar ? String(ar) : '';
  el.track.textContent = name || (S.lines.length ? '未命名曲目' : '');
  el.artists.textContent = ar;
  if (el.meta) el.meta.style.display = (name || ar) ? '' : 'none';
}

function lineText(i) {
  var l = S.lines[i];
  if (!l) return '';
  return l.text == null ? '' : String(l.text);
}

function findIdx(t) {
  var best = -1, i, lt, n = S.lines.length;
  for (i = 0; i < n; i++) {
    lt = num(S.lines[i] && S.lines[i].t, NaN);
    if (!isFinite(lt)) continue;
    if (lt <= t + 0.06) best = i;
    else if (best >= 0) break;
  }
  return best;
}

function renderPlain() {
  var i = S.idx;
  if (el.prev) el.prev.textContent = i > 0 ? lineText(i - 1) : '';
  if (el.next) el.next.textContent = i >= 0 && i + 1 < S.lines.length ? lineText(i + 1) : '';
  S.tokens = [];
  if (!el.cur) return;
  var li = i >= 0 ? i : (S.lines.length ? 0 : -1);
  var txt = li >= 0 ? lineText(li) : '';
  S.text = txt;
  if (!txt) { el.cur.textContent = ''; return; }
  var line = S.lines[li] || {};
  /* 逐字时间：YRC 优先，长度不符则按句长均分回落 */
  var chars = Array.isArray(line.chars) ? line.chars : null;
  var t0 = num(line.t, 0), dur = num(line.dur, 0);
  if (!(dur > 0)) dur = clamp(txt.length * 0.22, 0.6, 9);
  var times = null, ok = false, k;
  if (chars && chars.length === txt.length) {
    ok = true;
    times = [];
    for (k = 0; k < chars.length; k++) {
      var ct = num(chars[k] && chars[k].t, NaN);
      if (!isFinite(ct)) { ok = false; break; }
      times.push(ct);
    }
  }
  var frag = document.createDocumentFragment();
  var n = Math.min(txt.length, 220);
  for (k = 0; k < n; k++) {
    var sp = document.createElement('span');
    sp.className = 'ch';
    var chch = txt.charAt(k);
    sp.textContent = chch === ' ' ? '\u00a0' : chch;
    var a = ok ? times[k] : t0 + (dur * k) / Math.max(1, n);
    var b = ok ? (k + 1 < n ? times[k + 1] : a + 0.24) : t0 + (dur * (k + 1)) / Math.max(1, n);
    S.tokens.push({ el: sp, a: a, b: b });
    frag.appendChild(sp);
  }
  el.cur.textContent = '';
  el.cur.appendChild(frag);
  S.sungTo = -1;
  paintChars();
  layout();
}

/* 每 tick 只切必要的类，不重建 DOM */
function paintChars() {
  var toks = S.tokens, i, n = toks.length;
  if (!n) return;
  var t = S.idx >= 0 ? S.t : num((S.lines[0] || {}).t, 0);
  var sung = 0;
  for (i = 0; i < n; i++) {
    if (toks[i].a <= t + 0.001) sung = i + 1; else break;
  }
  var prev = S.sungTo == null ? -1 : S.sungTo;
  if (sung === prev) return;
  var lo = prev < 0 ? 0 : Math.min(prev, sung);
  var hi = Math.max(prev, sung);
  for (i = lo; i < hi && i < n; i++) {
    toks[i].el.className = i < sung ? 'ch on' : 'ch';
  }
  if (prev >= 0 && prev < n && toks[prev]) toks[prev].el.className = prev < sung ? 'ch on' : 'ch';
  if (sung > 0 && toks[sung - 1] && S.playing && !S.rm) toks[sung - 1].el.className = 'ch on sing';
  S.sungTo = sung;
}

function refresh(force) {
  try {
    if (!S.lines.length) {
      S.idx = -1; S.text = '';
      if (el.cur) el.cur.textContent = '';
      if (el.prev) el.prev.textContent = '';
      if (el.next) el.next.textContent = '';
      if (el.empty) el.empty.style.display = 'flex';
      if (el.seal) el.seal.style.display = 'grid';
      return;
    }
    if (el.empty) el.empty.style.display = 'none';
    if (el.seal) el.seal.style.display = 'grid';
    var idx = findIdx(S.t);
    S.idx = idx;
    var key = idx + '|' + (idx >= 0 ? lineText(idx) : '');
    if (force || key !== S.curKey) {
      S.curKey = key;
      renderPlain();
      if (el.cur && !S.rm && idx >= 0) {
        el.cur.classList.remove('line-in');
        void el.cur.offsetWidth;
        el.cur.classList.add('line-in');
      }
    } else {
      paintChars();
    }
  } catch (e) {
    console.error('[457] refresh', e);
    S.err = String((e && e.message) || e);
  }
}

function layout() {
  if (!el.cur) return;
  var fs = clamp(Math.min(S.w * 0.052, S.h * 0.082), 25, 68);
  el.cur.style.fontSize = fs.toFixed(1) + 'px';
  for (var k = 0; k < 8; k++) {
    if (el.cur.scrollHeight <= fs * 3.3) break;
    fs *= 0.9;
    el.cur.style.fontSize = fs.toFixed(1) + 'px';
  }
}

function onInit(p) {
  var lines = Array.isArray(p.lines) ? p.lines.slice(0, 900) : [];
  S.lines = lines;
  S.duration = pos(p.duration, 0);
  if (Array.isArray(p.accent) && p.accent.length >= 3) setAccent(p.accent);
  S.playing = p.playing === false ? false : true;
  document.body.classList.toggle('paused', !S.playing);
  setMeta(p.song || {});
  var tt = num(p.time, NaN);
  if (isFinite(tt) && tt >= 0) S.t = tt;
  S.curKey = '';
  S.sungTo = -1;
  refresh(true);
}

function onTick(p) {
  if (!p) return;
  var t = num(p.time, S.t);
  if (t < 0) t = 0;
  if (t > 60 * 60 * 12) t = S.t;
  S.t = t;
  var playing = p.playing !== false;
  if (playing !== S.playing) {
    S.playing = playing;
    document.body.classList.toggle('paused', !playing);
  }
  refresh(false);
}

function onBeat(p) {
  var lv = clamp(p.level, 0, 1);
  S.beat = Math.max(S.beat || 0, lv);
  S.beatPulse = 1;
  if (el.seal && S.lines.length && !S.rm && !S.beatLock) {
    S.beatLock = true;
    el.seal.classList.remove('beat');
    void el.seal.offsetWidth;
    el.seal.classList.add('beat');
    setTimeout(function () { S.beatLock = false; if (el.seal) el.seal.classList.remove('beat'); }, 460);
  }
}
function onLive(p) {
  S.live = p || null;
  if (p && p.bpm) S.bpm = clamp(p.bpm, 30, 220);
}

/* ================= 解构脸谱（静态 SVG，一次构建） ================= */
var ART = { built: false, drops: [], seed: 457 };

function rnd() {
  ART.seed = (ART.seed * 1103515245 + 12345) & 0x7fffffff;
  return ART.seed / 0x7fffffff;
}

function maskSvg() {
  var face = 'M200 62C232 62 254 84 258 118C262 152 268 178 272 206' +
    'C278 244 268 286 250 320C234 350 220 376 200 392' +
    'C180 376 166 350 150 320C132 286 122 244 128 206' +
    'C132 178 138 152 142 118C146 84 168 62 200 62Z';
  var s = '<svg class="mask" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  /* 中轴与翎羽 */
  s += '<path class="s inkd" d="M200 8L200 56"/>';
  s += '<path class="s ink" d="M214 66C252 40 300 26 348 30"/>';
  s += '<path class="s inkd" d="M218 76C258 54 306 44 356 54"/>';
  s += '<path class="s acc" d="M210 84C240 70 268 62 292 62" opacity=".7"/>';
  /* 脸廓主墨线 */
  s += '<path class="s inkb" d="' + face + '"/>';
  s += '<path class="s ink" d="' + face + '" opacity=".35"/>';
  /* 结构线 */
  s += '<path class="s inkd" d="M200 96L200 296"/>';
  s += '<path class="s ink" d="M150 196C172 176 198 178 212 194"/>';
  s += '<path class="s ink" d="M250 196C228 176 202 178 188 194"/>';
  s += '<path class="s ink" d="M148 232C166 218 188 222 197 236"/>';
  s += '<path class="s ink" d="M252 232C234 218 212 222 203 236"/>';
  s += '<path class="s inkd" d="M160 300C172 332 186 352 200 364"/>';
  s += '<path class="s inkd" d="M240 300C228 332 214 352 200 364"/>';
  /* 朱色：脸谱纹样 */
  s += '<g class="ghost">';
  s += '<path class="s accd" d="M150 250C170 240 192 244 202 258"/>';
  s += '<path class="s accd" d="M250 250C230 240 208 244 198 258"/>';
  s += '<path class="s acc" d="M186 296C192 306 200 308 204 300"/>';
  s += '<path class="s acc" d="M214 296C208 306 200 308 196 300"/>';
  s += '<path class="s acc" d="M178 336C190 326 210 326 222 336"/>';
  s += '<path class="s acc" d="M178 338C190 348 210 348 222 338"/>';
  s += '</g>';
  s += '<path class="s accf" d="M200 96L188 128L200 146L212 128Z" opacity=".55"/>';
  s += '<circle class="accf" cx="200" cy="168" r="4" opacity=".8"/>';
  s += '<circle class="accf" cx="172" cy="266" r="2.6" opacity=".55"/>';
  s += '<circle class="accf" cx="228" cy="266" r="2.6" opacity=".55"/>';
  /* 口部留白块 */
  s += '<path class="inkf" d="M176 330C190 322 210 322 224 330C210 346 190 346 176 330Z"/>';
  s += '</svg>';
  return s;
}

function buildArt() {
  if (!el.art || ART.built) return;
  try {
    el.art.innerHTML = maskSvg();
    ART.built = true;
  } catch (e) { console.error('[457] buildArt', e); }
  var i, n = 34;
  for (i = 0; i < n; i++) {
    ART.drops.push({
      x: rnd(), y: rnd(), r: 0.6 + rnd() * 3.4,
      vy: 0.02 + rnd() * 0.05, a: 0.10 + rnd() * 0.30, sw: rnd() * 6.28
    });
  }
}

/* ================= 墨袖：水袖抽象 + 高速快门墨滴 ================= */
function drawSleeve(c, w, h, t, energy) {
  c.clearRect(0, 0, w, h);

  /* 地平线 / 台面留白 */
  var hy = h * 0.78;
  c.strokeStyle = 'rgba(242,235,221,.055)';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, hy); c.lineTo(w, hy); c.stroke();

  var cx = w * (S.portrait ? 0.5 : 0.6), cy = h * 0.46;
  var R = Math.min(w * 0.62, h * 0.8) * 0.5;
  var i, k, u, n = 22;

  /* 水袖绸带：三遍叠加做笔锋粗细衰减 */
  var cols = ['rgba(242,235,221,.42)', 'rgba(242,235,221,.20)', 'rgba(242,235,221,.08)'];
  var wid = [1.5, 6, 16];
  for (var pass = 0; pass < 3; pass++) {
    c.strokeStyle = cols[pass];
    c.lineWidth = wid[pass];
    c.lineCap = 'round';
    for (k = 0; k < 2; k++) {
      c.beginPath();
      for (i = 0; i <= n; i++) {
        u = i / n;
        var amp = (0.30 + 0.20 * Math.sin(t * 0.55 + k * 2.1)) * (1 + energy * 0.55);
        var x = cx + Math.sin(u * 3.1 - t * (0.42 + k * 0.11) + k * 2.0) * R * amp * (0.35 + u * 0.9);
        var x2 = x - R * 0.55 * u;
        var y = cy + R * 0.62 - u * R * 1.5 + Math.cos(u * 2.0 + t * 0.62 + k) * R * 0.14;
        if (i === 0) c.moveTo(x2, y); else c.lineTo(x2, y);
      }
      c.stroke();
    }
  }

  /* 墨滴（预生成，纯位移） */
  var drops = ART.drops, span = R * 2.0;
  c.fillStyle = 'rgb(242,235,221)';
  for (i = 0; i < drops.length; i++) {
    var d = drops[i];
    var dy = cy + (d.y - 0.5) * span + ((t * d.vy * R * 2.4) % span);
    var dx = cx + (d.x - 0.5) * span * 1.15 + Math.sin(t * 0.5 + d.sw) * R * 0.045;
    c.globalAlpha = d.a;
    c.beginPath();
    c.arc(dx, dy, d.r * (1 + energy * 0.4), 0, 6.2832);
    c.fill();
  }
  c.globalAlpha = 1;

  /* 朱色：快门截住的那一点 */
  var ar = (2.6 + energy * 8) * (Math.min(w, h) / 900 + 0.28);
  c.fillStyle = 'rgb(' + S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2] + ')';
  c.globalAlpha = 0.9;
  c.beginPath(); c.arc(cx - R * 0.42, cy - R * 0.55, ar, 0, 6.2832); c.fill();
  c.globalAlpha = 1;

  /* 台面投影：一道极淡的横墨 */
  var g = c.createLinearGradient(w * 0.1, 0, w * 0.9, 0);
  g.addColorStop(0, 'rgba(200,64,47,0)');
  g.addColorStop(0.5, 'rgba(200,64,47,' + (0.16 + energy * 0.2).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(200,64,47,0)');
  c.strokeStyle = g;
  c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(w * 0.1, hy); c.lineTo(w * 0.9, hy); c.stroke();
}

function step(ts) {
  var c = el.ctx;
  if (!c) return;
  var t = ts * 0.001;
  var ease = S.beatPulse || 0;
  S.beatPulse = ease * 0.9;
  S.beat = Math.max(0, (S.beat || 0) * 0.9);
  var live = S.live || {};
  var energy = clamp((live.level || 0) * 0.7 + S.beat * 0.7, 0, 1);
  if (S.rm) energy *= 0.35;
  if (!S.playing) energy *= 0.4;
  drawSleeve(c, S.w, S.h, S.rm ? 0.7 : t, energy);
}


function frame(ts) {
  var t0 = performance.now();
  S.frames++;
  try {
    step(ts);
  } catch (e) {
    console.error('[457] step', e);
    S.err = String((e && e.message) || e);
  }
  var dt = performance.now() - t0;
  S.js = S.js ? S.js * 0.82 + dt * 0.18 : dt;
  requestAnimationFrame(frame);
}

function sendReady() {
  if (S.readySent) return;
  S.readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) { console.error('[457] ready', e); }
}

function boot() {
  /* 兜底先挂上：任何后面步骤炸掉，ready 仍会发出 */
  setTimeout(sendReady, 700);
  try {
    grabDom();
    try { S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { S.rm = false; }
    if (S.rm) document.body.classList.add('rm');
    resize();
    buildArt();
  } catch (e) {
    console.error('[457] boot', e);
    S.err = String((e && e.message) || e);
  }
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload || {});
      else if (d.type === 'tick') onTick(d.payload || {});
      else if (d.type === 'beat') onBeat(d.payload || {});
      else if (d.type === 'live') onLive(d.payload || {});
    } catch (e) {
      console.error('[457] message ' + (d && d.type), e);
      S.err = String((e && e.message) || e);
    }
  });
  if (S.started) return;
  S.started = true;
  requestAnimationFrame(function (ts) {
    sendReady();
    frame(ts);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
