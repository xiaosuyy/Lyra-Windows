<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>316 · Maximal Tableau</title>
<style>
  :root{
    --ink:#0d0b16; --cream:#f7edd8; --gold:#f2c14e; --gold2:#b8862c;
    --hot:#ff2d95; --acid:#ffe500; --cyan:#00e5ff; --orange:#ff5a1f; --violet:#7a5cff;
    --accent:#ff2d95;
    --cur-a:#8d1030; --cur-b:#b3183f; --cur-c:#5d0a1f;
    --pad:clamp(9px,1.35vw,26px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#07060c;color:var(--cream);
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    -webkit-font-smoothing:antialiased;}
  #frame{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(130% 95% at 50% 6%,#1b1330 0%,#0b0817 52%,#05040a 100%);}

  /* ---------- the room (3d depth stack) ---------- */
  #hall{position:absolute;inset:0;perspective:2000px;perspective-origin:50% 47%;}
  #cam{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;}
  .pl{position:absolute;transform-style:preserve-3d;}

  #backdrop{inset:-30%;transform:translateZ(-820px) scale(1.45);
    background:
      radial-gradient(70% 55% at 50% 62%,#3a2263 0%,#221641 46%,#120d24 78%,#0a0716 100%);}
  #rays{position:absolute;left:50%;top:64%;width:230vmax;height:230vmax;
    margin:-115vmax 0 0 -115vmax;border-radius:50%;opacity:.22;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,236,150,.95) 0deg 3.1deg, rgba(255,236,150,0) 3.1deg 13deg);
    animation:spin 150s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #halftone{position:absolute;inset:0;opacity:.5;mix-blend-mode:screen;
    background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.22) 0 1.1px,transparent 1.5px);
    background-size:9px 9px;}
  #halftone2{position:absolute;inset:0;opacity:.28;
    background-image:radial-gradient(circle at 50% 50%,rgba(255,45,149,.30) 0 2.6px,transparent 3.1px);
    background-size:26px 26px;background-position:13px 13px;}

  #floor{left:-40%;right:-40%;bottom:0;height:47vh;
    transform:translateZ(-740px) scale(1.37);transform-origin:50% 100%;
    background:linear-gradient(180deg,#2c1f4b 0%,#1c1334 30%,#120c22 68%,#08060f 100%);
    box-shadow:inset 0 0 26vmin rgba(0,0,0,.75);}
  #floor svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #floor::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,rgba(242,193,78,0),rgba(242,193,78,.34) 26%,rgba(242,193,78,.34) 74%,rgba(242,193,78,0));}

  #numeral{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%);
    font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;
    font-size:24vmax;line-height:.78;letter-spacing:-.015em;color:transparent;
    -webkit-text-stroke:3px rgba(242,193,78,.22);white-space:nowrap;pointer-events:none}

  .row{left:-5%;right:-5%;bottom:0;height:0;display:flex;justify-content:space-evenly;
    align-items:flex-end;gap:clamp(0px,.28vw,6px);}
  #rowG{bottom:46.7%;transform:translateZ(-420px);opacity:.8;left:-11%;right:-11%}
  #rowA{bottom:32.1%;transform:translateZ(-250px);opacity:.89;left:-8%;right:-8%}
  #rowB{bottom:21.9%;transform:translateZ(-100px);opacity:.95;left:-5%;right:-5%}
  #rowC{bottom:11.7%;transform:translateZ(50px);left:-2.5%;right:-2.5%}
  #rowD{bottom:3.4%;transform:translateZ(150px)}
  #protag{position:absolute;left:50%;bottom:4.8%;transform:translate(-50%,0) translateZ(200px);
    height:0;display:flex;justify-content:center;align-items:flex-end;}
  #protag::before{content:"";position:absolute;left:50%;bottom:0;
    width:min(34vw,380px);height:min(44vh,460px);transform:translateX(-50%);
    border-radius:50%;filter:blur(14px);pointer-events:none;
    background:radial-gradient(50% 50% at 50% 66%,rgba(255,232,150,.42),rgba(255,232,150,0) 72%);}
  #protag::after{content:"";position:absolute;left:50%;bottom:26%;
    width:min(15vw,168px);height:min(15vw,168px);transform:translateX(-50%);
    border-radius:50%;border:2px solid rgba(255,226,150,.34);pointer-events:none;
    box-shadow:0 0 26px rgba(255,226,150,.22) inset;}

  /* ---------- proscenium (flat frame) ---------- */
  #pros{position:absolute;inset:0;pointer-events:none;z-index:6}
  .curtain{position:absolute;top:0;bottom:0;width:clamp(46px,13.5vw,232px);
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.42) 0 3px,rgba(255,255,255,0) 3px 9%,
        rgba(255,255,255,.09) 9% 13%,rgba(0,0,0,.3) 13% 18%,rgba(255,255,255,0) 18% 26%),
      linear-gradient(180deg,var(--cur-b) 0%,var(--cur-a) 40%,var(--cur-c) 100%);
    box-shadow:0 0 5vmin rgba(0,0,0,.9);}
  .curtain::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 45%,rgba(0,0,0,.45));}
  #curL{left:0;border-right:3px solid var(--gold2);
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
  #curR{right:0;border-left:3px solid var(--gold2);transform:scaleX(-1)}
  #valance{position:absolute;left:0;right:0;top:0;height:clamp(64px,13.5vh,158px);
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 2px,rgba(255,255,255,0) 2px 12%,
        rgba(255,255,255,.08) 12% 17%,rgba(0,0,0,.28) 17% 23%,rgba(255,255,255,0) 23% 34%),
      linear-gradient(180deg,var(--cur-b),var(--cur-a) 55%,var(--cur-c));
    box-shadow:0 2vmin 6vmin rgba(0,0,0,.75);}
  #valance::after{content:"";position:absolute;left:0;right:0;bottom:calc(-1*clamp(13px,2.4vh,26px));
    height:clamp(14px,2.6vh,28px);
    background:radial-gradient(circle at 14px 0,var(--cur-c) 0 14px,transparent 15px) repeat-x;
    background-size:28px 28px;}
  #fringe{position:absolute;left:0;right:0;top:calc(clamp(64px,13.5vh,158px) - 1px);
    height:clamp(5px,1vh,9px);background:linear-gradient(180deg,var(--gold),var(--gold2));
    box-shadow:0 0 14px rgba(242,193,78,.55);z-index:2}
  #bulbs{position:absolute;left:0;right:0;top:calc(clamp(64px,13.5vh,158px) + clamp(4px,.7vh,7px));
    display:flex;justify-content:space-between;padding:0 clamp(10px,2vw,34px);z-index:2}
  .bulb{width:clamp(4px,.55vw,8px);height:clamp(4px,.55vw,8px);border-radius:50%;
    background:#ffe9a8;box-shadow:0 0 6px 2px rgba(255,214,120,.8);
    animation:bulb 2.6s ease-in-out infinite alternate;}
  @keyframes bulb{0%{opacity:.35;box-shadow:0 0 3px 0 rgba(255,214,120,.35)}
    100%{opacity:1;box-shadow:0 0 9px 3px rgba(255,214,120,.85)}}
  #gauze{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(125% 85% at 50% 44%,rgba(0,0,0,0) 46%,rgba(0,0,0,.42) 88%,rgba(0,0,0,.74) 100%);}

  /* ---------- standees ---------- */
  .sd{flex:0 0 auto;height:calc(var(--h,180px) * var(--k,1));transform-origin:50% 100%;
    transform:rotate(var(--rot,0deg));
    animation:sway 8.5s ease-in-out infinite alternate;animation-delay:var(--d,0s);}
  .sd svg{height:100%;width:auto;display:block;overflow:visible}
  @keyframes sway{
    from{transform:rotate(var(--rot,0deg)) translateY(0)}
    to{transform:rotate(calc(var(--rot,0deg) + .75deg)) translateY(-.35%)}
  }
  #rowG .sd{--h:clamp(38px,min(11.4vw,12.6vh),180px)}
  #rowA .sd{--h:clamp(48px,min(15.6vw,17.6vh),240px)}
  #rowB .sd{--h:clamp(56px,min(20.8vw,23vh),300px)}
  #rowC .sd{--h:clamp(64px,min(27.8vw,29vh),360px)}
  #rowD{align-items:flex-end;justify-content:space-between;padding:0 4.5vw;
    left:0;right:0}
  #rowD .sd{--h:clamp(70px,min(30vw,35vh),430px)}
  #protag{align-items:flex-end;height:0}
  #protag .sd{--h:clamp(86px,min(33vw,38vh),470px)}
  #spot{position:absolute;left:50%;bottom:0;width:min(46vw,560px);height:min(58vh,620px);
    transform:translateX(-50%);pointer-events:none;
    background:conic-gradient(from 180deg at 50% 100%,
      rgba(255,245,200,0) 158deg,rgba(255,245,200,.20) 172deg,rgba(255,255,235,.34) 180deg,
      rgba(255,245,200,.20) 188deg,rgba(255,245,200,0) 202deg);
    filter:blur(6px);opacity:.45}

  /* ---------- paper blooms + flash ---------- */
  #blooms{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  .bloom{position:absolute;transform-origin:50% 0;animation:dangle 6.5s ease-in-out infinite alternate}
  .bloom svg{width:100%;height:100%;display:block;overflow:visible}
  @keyframes dangle{from{transform:rotate(-1.4deg)}to{transform:rotate(1.8deg)}}
  #flash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;
    background:radial-gradient(58% 46% at 50% 26%,rgba(255,244,210,.6),rgba(255,200,120,0) 72%);
    mix-blend-mode:screen}
  #curL{animation:curDrift 19s ease-in-out infinite alternate}
  #curR{animation:curDrift 23s ease-in-out infinite alternate-reverse}
  @keyframes curDrift{from{background-position:0 0,0 0}to{background-position:3% 0,0 0}}

  /* ---------- house print: marquee, legend, stamps ---------- */
  #ui{position:absolute;inset:0;z-index:8;pointer-events:none}
  #marquee{position:absolute;left:50%;top:clamp(9px,2.1vh,26px);transform:translateX(-50%);
    width:min(64vw,780px);text-align:center;color:#ffe9b8;
    text-shadow:0 2px 0 rgba(88,8,28,.95),0 0 20px rgba(255,190,90,.4)}
  #mqSong{font-family:Impact,"Haettenschweiler","Arial Narrow Bold","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:clamp(12px,2vw,30px);line-height:1.1;letter-spacing:.14em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mqArtist{margin-top:.35em;font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;
    font-size:clamp(6.5px,.78vw,11px);letter-spacing:.4em;text-transform:uppercase;opacity:.82}
  #legend,#caption{position:absolute;font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;
    color:#f4e4c4;opacity:.6;text-transform:uppercase;font-weight:600}
  #legend{left:clamp(5px,1.1vw,18px);bottom:clamp(140px,29vh,330px);
    width:clamp(82px,9.4vw,156px);font-size:clamp(5.8px,.56vw,9px);line-height:1.6;letter-spacing:.12em}
  #legend .leg-h{color:var(--gold);letter-spacing:.3em;margin-bottom:.5em;opacity:.9}
  .leg-row{display:flex;align-items:baseline;gap:.45em;padding:.12em 0;
    border-bottom:1px dotted rgba(244,228,196,.22)}
  .leg-n{color:var(--gold);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .leg-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #caption{right:clamp(5px,1.1vw,18px);top:clamp(118px,22vh,250px);
    width:clamp(82px,9vw,148px);font-size:clamp(5.6px,.54vw,8.6px);line-height:1.75;
    letter-spacing:.1em;text-align:right}
  #caption b{color:var(--gold);font-weight:700;display:block;letter-spacing:.26em;margin-bottom:.55em}
  #stamp{position:absolute;right:clamp(6px,1.2vw,20px);top:clamp(96px,17.2vh,196px);
    transform:rotate(-7deg);border:2px solid rgba(255,45,149,.8);border-radius:2px;
    padding:.25em .55em;font:700 clamp(6px,.6vw,9px)/1 "Helvetica Neue",Arial,sans-serif;
    letter-spacing:.22em;color:rgba(255,140,200,.92);text-transform:uppercase;
    box-shadow:0 0 12px rgba(255,45,149,.25) inset}
  #lyricCard{position:absolute;left:50%;bottom:4.2vh;z-index:9;
    transform:translateX(-50%) rotate(-.35deg);
    width:min(78vw,880px);min-height:clamp(88px,14.5vh,170px);
    padding:clamp(10px,1.8vh,22px) clamp(16px,2.8vw,44px) clamp(11px,2.1vh,26px);
    background:linear-gradient(178deg,#fbf4e3,#f0e3c6 62%,#e7d8b8);
    color:var(--ink);border-radius:2px;
    box-shadow:0 2.4vmin 6vmin rgba(0,0,0,.72),0 0 0 1px rgba(0,0,0,.35),
      inset 0 0 6vmin rgba(120,90,40,.16);}
  #lyricCard::before{content:"";position:absolute;inset:clamp(5px,.9vh,11px);
    border:1px solid rgba(20,16,25,.35);pointer-events:none;opacity:.55}
  #lyricText{font-size:clamp(19px,3.05vw,50px);line-height:1.26;letter-spacing:.012em;
    text-align:center;text-wrap:balance;font-weight:600;
    overflow-wrap:anywhere;word-break:break-word;hyphens:auto;}
  #lyricText.long{font-size:clamp(15px,2.25vw,36px)}
  #lyricText.xlong{font-size:clamp(13px,1.72vw,28px)}
  .ch{opacity:.34;transition:opacity .22s linear}
  .ch.on{opacity:1}
  .ov{display:inline-block;font-size:.52em;letter-spacing:.34em;text-transform:uppercase;
    font-style:italic;opacity:.62;font-weight:400}
  #lyricCard.empty #lyricText{opacity:.9}
  #lcTop{display:flex;align-items:center;gap:.6em;margin-bottom:clamp(5px,.9vh,12px);
    font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;font-weight:700;
    font-size:clamp(5.8px,.58vw,9px);letter-spacing:.3em;text-transform:uppercase;
    color:var(--accent-ink,#7a2410);white-space:nowrap;overflow:hidden}
  #lcRule{flex:1;min-width:8px;height:1px;opacity:.5;
    background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 9px)}
  #lcBrand{opacity:.58;letter-spacing:.34em}
  #lcBot{display:flex;align-items:center;gap:.7em;margin-top:clamp(5px,.9vh,12px);
    font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;font-weight:500;
    font-size:clamp(5.6px,.54vw,8.6px);letter-spacing:.2em;text-transform:uppercase;
    color:#5b4a33;opacity:.8}
  #lcSong{max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lcBar{flex:1;height:2px;background:rgba(20,16,25,.14);position:relative;overflow:hidden}
  #lcBar i{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent-ink,#7a2410);
    transition:width .1s linear}
  #lcCount{font-variant-numeric:tabular-nums;letter-spacing:.16em}

  /* ---------- adaptation ---------- */
  @media (max-aspect-ratio:1/1),(max-width:760px){
    #legend,#caption,#stamp{display:none}
    #marquee{width:90vw;top:.8vh}
    #lyricCard{width:91vw;bottom:2.8vh;padding:clamp(8px,1.5vh,18px) clamp(11px,4vw,30px)}
    #lyricText{font-size:clamp(17px,4.35vw,32px)}
    #lyricText.long{font-size:clamp(14px,3.4vw,25px)}
    #lyricText.xlong{font-size:clamp(12px,2.9vw,21px)}
    #lcBrand{display:none}
    #rowG .sd{--h:clamp(44px,10vh,120px)}
    #rowA .sd{--h:clamp(74px,16.5vh,200px)}
    #rowB .sd{--h:clamp(84px,18.5vh,222px)}
    #rowC .sd{--h:clamp(94px,21vh,252px)}
    #rowD .sd{--h:clamp(104px,24vh,282px)}
    #protag .sd{--h:clamp(112px,26vh,300px)}
    #rowG .sd:nth-child(n+6),#rowA .sd:nth-child(n+7),
    #rowB .sd:nth-child(n+6),#rowC .sd:nth-child(n+5),
    #rowD .sd:nth-child(n+3){display:none}
    #rowD{padding:0 1vw}
    #spot{width:76vw;height:40vh}
    .bloom{width:clamp(22px,6vw,56px)!important;height:clamp(44px,9vh,104px)!important}
    .bloom:nth-last-child(1),.bloom:nth-last-child(2){
      width:clamp(64px,26vw,150px)!important;height:clamp(90px,20vh,240px)!important}
  }
  @media (max-height:560px){
    #marquee{top:.4vh}
    #mqSong{font-size:clamp(10px,2.2vh,18px)}
    #mqArtist{display:none}
    #lyricCard{bottom:2.4vh;min-height:clamp(70px,22vh,120px)}
    #valance{height:clamp(40px,12vh,90px)}
    #fringe{top:calc(clamp(40px,12vh,90px) - 1px)}
    #bulbs{top:calc(clamp(40px,12vh,90px) + 4px)}
  }
  @media (prefers-reduced-motion:reduce){
    #rays,.sd,.bloom,.bulb,#curL,#curR{animation:none!important}
    #flash{display:none}
    .ch{transition:none}
  }
</style>
</head>
<body>
<div id="frame">
  <div id="hall">
    <div id="cam">
      <div class="pl" id="backdrop">
        <div id="rays"></div><div id="halftone"></div><div id="halftone2"></div>
        <div id="numeral">316</div>
      </div>
      <div class="pl" id="floor"></div>
      <div class="pl row" id="rowG"></div>
      <div class="pl row" id="rowA"></div>
      <div class="pl row" id="rowB"></div>
      <div class="pl row" id="rowC"></div>
      <div class="pl row" id="rowD"></div>
      <div id="spot"></div>
      <div id="protag"></div>
    </div>
  </div>
  <div id="gauze"></div>
  <div id="pros">
    <div id="valance"></div>
    <div id="fringe"></div>
    <div id="bulbs"></div>
    <div class="curtain" id="curL"></div>
    <div class="curtain" id="curR"></div>
  </div>
  <div id="blooms"></div>
  <div id="flash"></div>
  <div id="ui">
    <div id="marquee"><div id="mqSong"></div><div id="mqArtist"></div></div>
    <div id="legend"></div>
    <div id="caption"></div>
    <div id="stamp">Admit One</div>
  </div>
  <div id="lyricCard">
    <div id="lcTop">
      <span id="lcPlate">PLATE 01</span>
      <span id="lcRule"></span>
      <span id="lcBrand">Maximal Tableau</span>
    </div>
    <div id="lyricText"></div>
    <div id="lcBot">
      <span id="lcSong"></span>
      <span id="lcBar"><i></i></span>
      <span id="lcCount">—</span>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var S = { lines:[], idx:-1, t:0, playing:true, frames:0, js:0, text:"", gl:false, rm:false, err:"" };
  var sentReady = false, lyricText = document.getElementById("lyricText");
  var lastIdx = -99, lastChar = -1, lastPct = -1, mode = "", curChars = null, charSpans = [];

  S.rm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ============ procedural cardboard standees ============ */
  var NEON = ["#ff2d95","#00e5ff","#ffe500","#ff5a1f","#7a5cff","#3cf07a","#ff8ad1","#22d3c5","#f2e6cc","#171226"];
  var SKIN = ["#f3cba6","#e2ab7c","#c08a56","#8d5533","#f2ddc2","#cd9066"];
  var PAPER = "#f6efdb";

  function rng(seed){
    var s = (seed >>> 0) || 7;
    return function(){ s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }

  function hairSVG(kind, c){
    switch (kind % 7){
      case 0: return '<path d="M38 58A22 22 0 0 1 82 58Z" fill="'+c+'"/>' +
                     '<rect x="35" y="54" width="9" height="30" rx="4" fill="'+c+'"/>' +
                     '<rect x="76" y="54" width="9" height="30" rx="4" fill="'+c+'"/>';
      case 1: return '<circle cx="60" cy="33" r="19" fill="'+c+'"/>' +
                     '<circle cx="41" cy="48" r="12" fill="'+c+'"/>' +
                     '<circle cx="79" cy="48" r="12" fill="'+c+'"/>';
      case 2: return '<rect x="47" y="1" width="26" height="30" rx="12" fill="'+c+'"/>' +
                     '<rect x="43" y="18" width="34" height="22" rx="10" fill="'+c+'"/>';
      case 3: return '<ellipse cx="60" cy="41" rx="22" ry="15" fill="'+c+'"/>' +
                     '<path d="M44 40q12-18 30-8" stroke="'+c+'" stroke-width="5" fill="none" stroke-linecap="round"/>';
      case 4: return '<rect x="34" y="33" width="52" height="7" rx="3" fill="'+c+'"/>' +
                     '<rect x="43" y="6" width="34" height="28" rx="4" fill="'+c+'"/>';
      case 5: return '<path d="M37 52q9-31 23-31t23 31q-11 6-23 6t-23-6z" fill="'+c+'"/>' +
                     '<circle cx="60" cy="12" r="5" fill="'+c+'"/>';
      default: return '<path d="M39 56q2-21 21-21t21 21q-12-7-21-5-9-2-21 5z" fill="'+c+'"/>';
    }
  }

  function propSVG(kind, c, d){
    switch (kind % 10){

  function figureSVG(i){

    var trim = NEON[(i * 5 + 4) % NEON.length];

               " L" + (60 + hw + flare) + " 281 Q60 292 " + (60 - hw - flare) + " 281 Z";

    var sleeveR = '<rect x="' + (60 + hw - 5) + '" y="100" width="13" height="62" rx="6" fill="' + coat + '" opacity=".92"/>';
    var sleeveWL = '<rect x="' + (60 - hw - 8) + '" y="100" width="13" height="62" rx="6"/>';

  /* ---------- cut-paper flower installations ---------- */
  function petalRing(cx, cy, radius, n, fill, core){
    var s = "", i, ang, w = radius * 0.46, h = radius * 0.8;
    for (i = 0; i < n; i++){
      ang = (360 / n) * i;
      s += '<ellipse cx="' + cx + '" cy="' + (cy - radius * 0.6).toFixed(1) + '" rx="' +
           w.toFixed(1) + '" ry="' + h.toFixed(1) + '" fill="' + fill +
           '" transform="rotate(' + ang.toFixed(1) + " " + cx + " " + cy + ')"/>';
    }
    return s + '<circle cx="' + cx + '" cy="' + cy + '" r="' + (radius * 0.28).toFixed(1) +
           '" fill="' + core + '"/>';
  }

  function garlandSVG(i, petal, core){

    s += '<path d="M50 0 C43 46 57 76 50 108" stroke="#cbb98f" stroke-width="1.7" fill="none" opacity=".85"/>';
    s += '<path d="M50 32 C40 38 34 44 29 54" stroke="#9c9070" stroke-width="1.2" fill="none"/>';
    s += '<path d="M50 58 C62 62 69 70 73 80" stroke="#9c9070" stroke-width="1.2" fill="none"/>';
    s += '<ellipse cx="27" cy="58" rx="7.5" ry="4" fill="#3cf07a" opacity=".9" transform="rotate(-30 27 58)"/>';
    s += '<ellipse cx="75" cy="84" rx="7.5" ry="4" fill="#22d3c5" opacity=".9" transform="rotate(24 75 84)"/>';
    s += petalRing(50, 128, 30, 6, petal, core);
    s += petalRing(28, 62, 17, 5, core, petal);
    s += petalRing(75, 90, 14, 5, petal, core);

  /* ---------- painted stage floor (1-point perspective boards) ---------- */
  function buildFloor(){
    var host = document.getElementById("floor");
    if (!host) return;
    var s = '<svg viewBox="0 0 200 100" preserveAspectRatio="none">';
    var i, x0, x1;
    for (i = -14; i <= 14; i++){
      x0 = 100 + i * 15; x1 = 100 + i * 4.4;
      s += '<line x1="' + x0 + '" y1="100" x2="' + x1 + '" y2="0" stroke="rgba(0,0,0,.5)" stroke-width=".55"/>';
    }
    var y = 100, step = 12, rows = 0, maxRows = Math.min(16, 16);   // hard-capped: never accumulate unbounded
    while (rows < maxRows && y > 0){
      s += '<line x1="0" y1="' + y.toFixed(1) + '" x2="200" y2="' + y.toFixed(1) +
           '" stroke="rgba(255,255,255,.055)" stroke-width=".45"/>';

  function ready(){
    if (sentReady) return;
    sentReady = true;
    try { parent.postMessage({__c100:1, type:"ready"}, "*"); } catch(e){}
  }
  requestAnimationFrame(function(){ ready(); });
  setTimeout(ready, 260);

  function normLines(arr){
    if (!Array.isArray(arr)) return [];
    var out = [];
    for (var i=0;i<arr.length;i++){
      var l = arr[i];
      if (!l || typeof l !== "object") continue;
      var text = (l.text == null) ? "" : String(l.text);
      var t = Number(l.t); if (!isFinite(t)) t = 0;
      var dur = Number(l.dur); if (!isFinite(dur) || dur <= 0) dur = 0;
      out.push({ t:t, dur:dur, text:text, chars:Array.isArray(l.chars)?l.chars:null });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    return out;
  }

  var cardEl = document.getElementById("lyricCard");
  var plateEl = document.getElementById("lcPlate");
  var songEl = document.getElementById("lcSong");
  var barEl = document.querySelector("#lcBar i");
  var countEl = document.getElementById("lcCount");
  var mqSong = document.getElementById("mqSong");
  var mqArtist = document.getElementById("mqArtist");
  var CJKRE = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F\uFF61-\uFF9F]/;

  function effectiveEnd(i){
    var l = S.lines[i];
    if (!l) return 0;
    var nx = S.lines[i+1];
    var e = nx ? nx.t : l.t + (l.dur || 4.2);
    if (!(e > l.t)) e = l.t + (l.dur || 4.2);
    return e;
  }

  function viewport(){
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    return { w: w, h: h };
  }

  function fitLine(){
    if (!lyricText.firstChild) return;
    lyricText.style.fontSize = "";
    var vp = viewport();
    var cap = Math.min(Math.max(120, vp.h * 0.30), 262);
    var h = lyricText.scrollHeight;
    if (h <= cap) return;
    var size = parseFloat(getComputedStyle(lyricText).fontSize) || 24;
    var guard = 0;
    while (h > cap && guard < 10 && size > 13){
      size = Math.max(13, size * Math.max(0.74, (cap / h) * 0.99));
      lyricText.style.fontSize = size.toFixed(1) + "px";
      h = lyricText.scrollHeight;
      guard++;
    }
  }

  function buildChars(i){
    charSpans = []; curChars = null; lastChar = -1;
    lyricText.innerHTML = "";
    lyricText.className = "";
    var line = S.lines[i];
    if (!line || !line.text) return;
    var txt = line.text;
    var end = effectiveEnd(i);
    var times = null;
    if (line.chars && line.chars.length === txt.length){
      var tmp = [], ok = true;
      for (var k = 0; k < line.chars.length; k++){
        var ct = Number(line.chars[k] && line.chars[k].t);
        if (!isFinite(ct)) { ok = false; break; }
        tmp.push(ct);
      }
      if (ok) times = tmp;
    }
    curChars = { times: times, start: line.t, end: end };
    var frag = document.createDocumentFragment(), wsum = 0;
    for (var j = 0; j < txt.length; j++){
      var sp = document.createElement("span");
      sp.className = "ch";
      sp.textContent = txt.charAt(j);
      charSpans.push(sp);
      frag.appendChild(sp);
      wsum += CJKRE.test(txt.charAt(j)) ? 1.62 : 0.6;
    }
    lyricText.appendChild(frag);
    if (wsum > 38) lyricText.className = "xlong";
    else if (wsum > 25) lyricText.className = "long";
    fitLine();
  }

  function showState(kind){
    charSpans = []; curChars = null; lastChar = -1;
    lyricText.style.fontSize = "";
    if (kind === "empty"){
      cardEl.classList.add("empty");
      lyricText.className = "";
      lyricText.innerHTML = '<span class="ov">本曲无词 · INSTRUMENTAL</span>';
      plateEl.textContent = "NO LIBRETTO";
      countEl.textContent = "—";
      songEl.textContent = songEl.textContent || "—";
    } else {
      cardEl.classList.remove("empty");
      lyricText.className = "";
      lyricText.innerHTML = '<span class="ov">序曲 · OVERTURE</span>';
      plateEl.textContent = "PRELUDE";
      countEl.textContent = "— / " + S.lines.length;
    }
    if (barEl) barEl.style.width = "0%";
  }

  function applyLine(i){
    var line = S.lines[i] || null;
    S.text = line ? line.text : "";
    cardEl.classList.remove("empty");
    buildChars(i);
    var no = i + 1;
    plateEl.textContent = "PLATE " + (no < 10 ? "0" : "") + no;
    countEl.textContent = (no < 10 ? "0" : "") + no + " / " + S.lines.length;
    if (barEl) barEl.style.width = "0%";
  }

  function paintChars(t){
    if (!curChars || !charSpans.length) return;
    var n = charSpans.length, i = -1, k, ct;
    if (curChars.times){
      for (k = 0; k < n; k++){
        ct = curChars.times[k];
        if (ct == null) continue;
        if (ct <= t + 0.04) i = k; else break;
      }
    } else {
      var d = curChars.end - curChars.start;
      var p = d > 0.2 ? (t - curChars.start) / d : 1;
      if (!(p >= 0)) p = 0;
      if (p > 1) p = 1;
      i = Math.floor(p * n);
      if (i >= n) i = n - 1;
    }
    if (i === lastChar) return;
    var a = lastChar, j;
    if (i > a){ for (j = a + 1; j <= i; j++) charSpans[j].classList.add("on"); }
    else { for (j = i + 1; j <= a; j++) charSpans[j].classList.remove("on"); }
    lastChar = i;
  }

  function updateBar(t){
    if (!barEl) return;
    var l = S.lines[S.idx];
    if (!l){ if (lastPct !== 0){ barEl.style.width = "0%"; lastPct = 0; } return; }
    var e = effectiveEnd(S.idx), d = e - l.t, p = d > 0 ? (t - l.t) / d : 0;
    if (!(p >= 0)) p = 0;
    if (p > 1) p = 1;
    var pct = Math.round(p * 200) / 2;
    if (pct !== lastPct){ barEl.style.width = pct + "%"; lastPct = pct; }
  }

  function paintLyric(t){
    if (!S.lines.length){
      if (mode !== "empty"){ mode = "empty"; lastIdx = -1; S.idx = -1; S.text = ""; showState("empty"); }
      return;
    }
    var i = -1;
    for (var k = 0; k < S.lines.length; k++){ if (S.lines[k].t <= t + 1e-3) i = k; else break; }
    if (i !== lastIdx){
      lastIdx = i; S.idx = i;
      if (i < 0){ mode = "pre"; showState("pre"); }
      else { mode = "line"; applyLine(i); }
      lastPct = -1;
    }
    if (i >= 0) paintChars(t);
    updateBar(t);
  }

  function setAccent(a){
    if (!Array.isArray(a) || a.length < 3) return;
    var r = Math.max(0, Math.min(255, a[0] | 0)),
        g = Math.max(0, Math.min(255, a[1] | 0)),
        b = Math.max(0, Math.min(255, a[2] | 0));
    var root = document.documentElement.style;
    root.setProperty("--accent", "rgb(" + r + "," + g + "," + b + ")");
    var dr = Math.round(r * 0.52), dg = Math.round(g * 0.44), db = Math.round(b * 0.48);
    root.setProperty("--accent-ink", "rgb(" + dr + "," + dg + "," + db + ")");
  }

  function setSong(song){
    var s = (song && typeof song === "object") ? song : {};
    var name = (s.name == null) ? "" : String(s.name).trim();
    var art = s.artists;
    if (Array.isArray(art)) art = art.filter(function(x){ return x != null && String(x).trim() !== ""; }).map(String).join(" · ");
    else art = (art == null) ? "" : String(art).trim();
    if (!name) name = "Untitled";
    if (mqSong) mqSong.textContent = name;
    if (mqArtist) mqArtist.textContent = art || "Various Artists";
    if (songEl) songEl.textContent = art ? name + "  —  " + art : name;
  }

  function onInit(p){
    if (!p || typeof p !== "object") p = {};
    S.lines = normLines(p.lines);
    setAccent(p.accent);
    setSong(p.song);
    if (typeof p.playing === "boolean") S.playing = p.playing; else S.playing = true;
    S.idx = -1; lastIdx = -99; lastChar = -1; mode = ""; lastPct = -1;
    paintLyric(S.t);
  }

  function onTick(p){
    if (!p) return;
    var t = Number(p.time);
    if (isFinite(t)) S.t = t;
    if (typeof p.playing === "boolean") S.playing = p.playing;
    paintLyric(S.t);
  }

  var refitTimer = 0;
  window.addEventListener("resize", function(){
    if (refitTimer) clearTimeout(refitTimer);
    refitTimer = setTimeout(function(){
      refitTimer = 0;
      if (S.idx >= 0) fitLine();
    }, 180);
  });

  function onBeat(p){
    if (!p) return;
    var lv = Number(p.level);
    if (!isFinite(lv)) lv = 0.6;
    if (lv > beatLevel) beatLevel = Math.min(1, lv);
    beatAt = performance.now();
  }

  function onLive(p){
    if (!p) return;
    var v;
    v = Number(p.bass);  if (isFinite(v)) LIVE.bass = Math.min(1, Math.max(0, v));
    v = Number(p.mid);   if (isFinite(v)) LIVE.mid = Math.min(1, Math.max(0, v));
    v = Number(p.treble);if (isFinite(v)) LIVE.treble = Math.min(1, Math.max(0, v));
    v = Number(p.level); if (isFinite(v)) LIVE.level = Math.min(1, Math.max(0, v));
    v = Number(p.bpm);   if (isFinite(v)) LIVE.bpm = Math.min(300, Math.max(20, v));
    if (typeof p.playing === "boolean") S.playing = p.playing;
  }

  window.addEventListener("message", function(e){
    var d = e.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === "init") onInit(p);
    else if (d.type === "tick") onTick(p);
    else if (d.type === "beat") onBeat(p);
    else if (d.type === "live") onLive(p);
  });

  var camEl = document.getElementById("cam"),
      spotEl = document.getElementById("spot"),
      flashEl = document.getElementById("flash");
  var beatLevel = 0, beatAt = performance.now() - 4000;
  var LIVE = { bass:0.4, mid:0.3, treble:0.2, level:0.4, bpm:88 };
  var frameT = 0, lastFrameStamp = 0;

  function loop(now){
    var a = performance.now();
    S.frames++;
    if (!lastFrameStamp) lastFrameStamp = now;
    var dt = now - lastFrameStamp; lastFrameStamp = now;
    if (dt > 90) dt = 90;
    frameT += dt * 0.001;

    var k = Math.pow(0.845, dt / 16.7);
    beatLevel *= k;
    if (beatLevel < 0.002) beatLevel = 0;

    var tt = frameT, rx, ry, ty, tz;
    var amp = S.playing ? 1 : 0.18;
    if (S.rm){
      rx = 0; ry = beatLevel * 0.25; ty = 0; tz = beatLevel * 8;
    } else {
      rx = (Math.cos(tt * 0.19) * 0.45 - beatLevel * 0.5) * amp;
      ry = (Math.sin(tt * 0.29) * 0.95 + beatLevel * 0.4) * amp;
      ty = Math.sin(tt * 0.24) * 5 * amp;
      tz = (Math.sin(tt * 0.13) * 9 + beatLevel * 24) * amp;
    }
    if (camEl) camEl.style.transform =
      "translate3d(0," + ty.toFixed(2) + "px," + tz.toFixed(2) + "px) rotateX(" +
      rx.toFixed(3) + "deg) rotateY(" + ry.toFixed(3) + "deg)";
    if (spotEl) spotEl.style.opacity = (0.30 + LIVE.bass * 0.30 + beatLevel * 0.20).toFixed(3);
    if (flashEl) flashEl.style.opacity = (beatLevel * 0.26).toFixed(3);

    requestAnimationFrame(loop);
    S.js = performance.now() - a;
  }

  window.__stage = function(){
    return { lines:S.lines.length, idx:S.idx, t:S.t, playing:S.playing, frames:S.frames,
             js:S.js, err:"", text:S.text, gl:S.gl, rm:S.rm };
  };
  requestAnimationFrame(loop);
  setTimeout(ready, 400);
})();
</script>
