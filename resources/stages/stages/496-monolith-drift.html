<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MONOLITH — drift</title>
<style>
  :root{
    --ink:#e8dcc0;
    --accent:#d8a05a;
    --void:#05070c;
    --mx:50vw; --my:42vh;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060a;overflow:hidden}
  body{
    font-family:"Futura","Avenir Next","Century Gothic","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;overflow:hidden;background:#04060a}
  #sky{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
  #beam{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(60vw 8vh at var(--mx) var(--my), rgba(255,232,190,.20), rgba(255,232,190,0) 70%),
      radial-gradient(120vw 60vh at 50% 20%, rgba(30,60,110,.12), rgba(30,60,110,0) 70%);
    mix-blend-mode:screen;
  }
  #vig{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(140% 110% at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.8) 100%);}
  /* ---------- typography : wide tracked, engraved on the void ---------- */
  #head{
    position:absolute;z-index:5;left:0;right:0;top:clamp(18px,4.2vh,52px);
    text-align:center;pointer-events:none;
  }
  #txt{
    font-size:clamp(10px,1.02vw,15px);
    letter-spacing:.62em;
    text-transform:uppercase;
    color:rgba(232,220,192,.62);
    text-shadow:0 0 18px rgba(214,168,110,.18);
    opacity:0;transition:opacity .9s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:0 6vw;
  }
  #txt.on{opacity:1}
  #rule{margin:clamp(8px,1.4vh,14px) auto 0;width:clamp(60px,8vw,120px);height:1px;background:linear-gradient(90deg,transparent,rgba(232,220,192,.55),transparent)}
  /* ---------- lyrics : lower-left field, engraved on the void ---------- */
  #lyr{
    position:absolute;z-index:6;
    left:clamp(22px,7.5vw,150px);
    bottom:clamp(9vh,14vh,19vh);
    width:min(42vw,620px);
    display:flex;align-items:flex-end;
    padding:0;
    pointer-events:none;
  }
  #lyr:before{
    content:"";position:absolute;left:calc(-1 * clamp(12px,1.6vw,26px));top:6%;bottom:8%;width:1px;
    background:linear-gradient(180deg,rgba(232,220,192,0),rgba(232,220,192,.42) 22%,rgba(232,220,192,.16) 78%,rgba(232,220,192,0));
  }
  #line{
    max-width:100%;
    text-align:left;
    font-size:clamp(22px,3.6vw,52px);
    line-height:1.45;
    letter-spacing:.055em;
    font-weight:400;
    color:#f2e9d6;
    text-shadow:0 2px 22px rgba(0,0,0,.9),0 0 90px rgba(0,0,0,.7);
    opacity:0;transform:translateY(16px);
    transition:opacity .62s ease, transform .62s cubic-bezier(.2,.7,.2,1);
    will-change:opacity,transform;
    word-break:break-word;
  }
  #line.tight{letter-spacing:.02em}
  #line.tighter{letter-spacing:-.005em;line-height:1.5}
  #line.on{opacity:1;transform:translateY(0)}
  #line .u{display:inline-block;position:relative;color:rgba(238,228,206,.34);transition:color .18s linear,text-shadow .18s linear}
  #line .u[data-k="1"]{color:#fff6e2;text-shadow:0 0 18px rgba(246,206,150,.55),0 2px 20px rgba(0,0,0,.9)}
  #line .sp{display:inline-block;width:.4em}
  /* chorus / long lines get a quieter tracking so they still fit */
  @media (max-aspect-ratio:1/1){
    #lyr{left:clamp(20px,7vw,60px);right:clamp(20px,7vw,60px);width:auto;bottom:clamp(13vh,17vh,22vh)}
    #line{font-size:clamp(21px,5.6vw,38px);line-height:1.5;letter-spacing:.03em}
  }
  /* ---------- bottom telemetry ---------- */
  #meta{
    position:absolute;z-index:6;left:0;right:0;bottom:clamp(14px,3vh,32px);
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:0 clamp(18px,5vw,64px);
    font-size:clamp(8px,.72vw,11px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(226,214,190,.42);pointer-events:none;white-space:nowrap;
  }
  #meta .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:8px;vertical-align:middle;opacity:.5;transition:opacity .2s}
  #meta .dot.beat{opacity:1}
  #prog{position:absolute;z-index:6;left:clamp(18px,5vw,64px);right:clamp(18px,5vw,64px);bottom:calc(clamp(14px,3vh,32px) + 16px);height:1px;background:rgba(232,220,192,.12);pointer-events:none}
  #prog i{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(232,220,192,.1),rgba(232,220,192,.75));transition:width .3s linear}
  /* empty state */
  #empty{
    position:absolute;z-index:7;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .8s ease;
  }
  #empty.on{opacity:1}
  #empty b{font-weight:400;font-size:clamp(13px,1.35vw,18px);letter-spacing:.72em;text-transform:uppercase;color:rgba(236,226,204,.72);text-indent:.72em}
  #empty s{text-decoration:none;font-size:clamp(9px,.78vw,12px);letter-spacing:.4em;color:rgba(226,214,190,.34);text-transform:uppercase}
  #grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.16;mix-blend-mode:overlay;background-repeat:repeat}
</style>
</head>
<body>
<div id="app">
  <canvas id="sky" width="1440" height="900"></canvas>
  <div id="beam"></div>
  <div id="vig"></div>
  <header id="head"><div id="txt"></div><div id="rule"></div></header>
  <div id="lyr"><div id="line"></div></div>
  <div id="prog"><i></i></div>
  <div id="meta">
    <span><i class="dot" id="bdot"></i><span id="mname">—</span></span>
    <span id="mclock">00:00 / 00:00</span>
  </div>
  <div id="empty"><b>no signal</b><s>instrumental transmission</s></div>
  <div id="grain"></div>
</div>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var app=$('app'), cv=$('sky'), ctx=cv.getContext('2d');
  var elLine=$('line'), elTxt=$('txt'), elName=$('mname'),
      elClock=$('mclock'), elProg=$('prog').firstElementChild, elDot=$('bdot'), elEmpty=$('empty');

  // ---------- state : always established before any use ----------
  var S = {
    W: 1440, H: 900, dpr: 1,
    lines: [], cur: -1, t: 0, playing: true, dur: 0,
    frames: 0, js: 0, err: '', gl: false,
    rm: (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || false,
    accent: [216,160,90], name: '', artists: '', cover: '',
    ready: false, beat: -1, beatAt: -1e9, level: 0, bass: 0, mid: 0, treble: 0,
    intro: 0, shot: 0, lineKey: -1, altOn: false
  };

  function clamp(v,a,b){ v = (typeof v==='number' && isFinite(v)) ? v : a; return v<a?a:(v>b?b:v); }
  function fmt(x){ x = clamp(x,0,1e6); var m=Math.floor(x/60), s=Math.floor(x%60); return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

  // ---------- sizing ----------
  var layer = null;
  function resize(){
    var w = (app.clientWidth|0) || (document.documentElement.clientWidth|0) || 1440;
    var h = (app.clientHeight|0) || (document.documentElement.clientHeight|0) || 900;
    if (!w || !isFinite(w) || w<2) w = 1440;
    if (!h || !isFinite(h) || h<2) h = 900;
    S.W = w; S.H = h;
    S.dpr = clamp(window.devicePixelRatio||1, 1, 2);
    cv.width = Math.max(2, Math.round(w*S.dpr));
    cv.height = Math.max(2, Math.round(h*S.dpr));
    cv.style.width = w+'px'; cv.style.height = h+'px';
    if (layer) layer.resize(w,h,S.dpr);
    document.documentElement.style.setProperty('--my', (h*0.40)+'px');
    if (S.spans && S.spans.length) fitLine();
  }

  // ---------- lyrics model ----------
  function normLines(raw){
    if (!raw || !raw.length || typeof raw.length !== 'number') return [];
    var out=[], n = Math.min(raw.length, 400);
    for (var i=0;i<n;i++){
      var L = raw[i] || {};
      var text = (typeof L.text==='string') ? L.text : (L.text==null ? '' : String(L.text));
      var t = (typeof L.t==='number' && isFinite(L.t)) ? L.t : 0;
      var dur = (typeof L.dur==='number' && isFinite(L.dur) && L.dur>0) ? Math.min(L.dur,60) : 0;
      var chars = null;
      if (L.chars && L.chars.length){ 
        chars=[]; var cn=Math.min(L.chars.length, 300);
        for (var k=0;k<cn;k++){ var C=L.chars[k]||{}; chars.push({ c:(typeof C.c==='string'?C.c:''), t:(typeof C.t==='number'&&isFinite(C.t)?C.t:t) }); }
        if (!chars.length) chars=null;
      }
      out.push({ t:t, dur:dur, text:text, chars:chars });
    }
    out.sort(function(a,b){ return a.t-b.t; });
    return out;
  }
  function lineAt(t){
    var lo=0, hi=S.lines.length-1, r=-1;
    while (lo<=hi){ var m=(lo+hi)>>1; if (S.lines[m].t <= t+0.06){ r=m; lo=m+1; } else hi=m-1; }
    return r;
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  function renderLine(i){
    S.lineKey = i;
    var L = S.lines[i];
    if (!L){ elLine.classList.remove('on'); S.spans = null; return; }
    var txt = L.text || '';
    if (!txt.trim()){ elLine.classList.remove('on'); S.spans = null; return; }
    var chars = L.chars || null;
    // YRC char arrays sometimes include spaces, sometimes don't : pick the mapping
    // that matches the raw text length, otherwise fall back to non-space indexing.
    var byPos = !!(chars && chars.length && chars.length === txt.length);
    var max = Math.min(txt.length, 220);
    var nOn = 0, p, ch;
    for (p=0;p<max;p++){ if (txt.charAt(p) !== ' ') nOn++; }
    var dur = L.dur > 0 ? L.dur : 3.4;
    var html = '', k = 0, sp = [];
    for (p=0;p<max;p++){
      ch = txt.charAt(p);
      if (ch === ' '){ html += '<span class="sp"></span>'; continue; }
      var rec = (chars && (byPos ? chars[p] : chars[k])) || null;
      var ts = (rec && typeof rec.t === 'number' && isFinite(rec.t))
        ? rec.t
        : L.t + dur * (k + 0.5) / Math.max(1, nOn);
      html += '<span class="u" data-k="0" data-t="'+ts.toFixed(3)+'">'+esc(ch)+'</span>';
      k++;
    }
    elLine.innerHTML = html;
    elLine.classList.add('on');
    elLine.classList.remove('tight','tighter');
    if (nOn > 26) elLine.classList.add('tighter');
    else if (nOn > 13) elLine.classList.add('tight');
    S.spans = [];
    var kids = elLine.children;
    for (var z=0; z<kids.length; z++){
      if (kids[z].dataset && kids[z].dataset.t !== undefined)
        S.spans.push({ el:kids[z], t:+kids[z].dataset.t, on:false });
    }
    fitLine();
  }

  // Pick a font size from an estimate of the line's typographic width, so it
  // never overflows and never needs a measurement loop.
  function fitLine(){
    try{
      var box = elLine.parentNode;
      var avail = (box && box.clientWidth) ? box.clientWidth - 4 : Math.max(140, S.W*0.44);
      var txt = elLine.textContent || '';
      var units = 0;
      for (var q=0;q<txt.length;q++){
        var code = txt.charCodeAt(q);
        units += (code > 0x2e7f) ? 1.0 : (code === 32 ? 0.34 : 0.56);
      }
      units = Math.max(1, units);
      // aim for two rows on long lines, one row on short ones
      var rows = units > 13 ? 2 : 1;
      var perRow = units / rows;
      var base = clamp(Math.min(S.W*0.036, 52), 17, 52);
      var fit = (avail / Math.max(1, perRow)) * (rows > 1 ? 0.97 : 0.94);
      var fs = clamp(Math.min(base * (rows>1?1.28:1), fit), 15, 62);
      elLine.style.fontSize = fs.toFixed(1)+'px';
    }catch(e){ console.error('[496] fit', e); }
  }

  function paintLine(i, t){
    var sp = S.spans;
    if (!sp) return;
    for (var k=0;k<sp.length;k++){
      var o = sp[k], on = (t >= o.t - 0.015);
      if (on !== o.on){ o.on = on; o.el.dataset.k = on ? '1' : '0'; }
    }
  }

  // ---------- message bus ----------
  function applyInit(p){
    if (!p || typeof p!=='object') return;
    var song = p.song || {};
    var nm = (song.name==null) ? '' : String(song.name);
    var ar = song.artists;
    if (Array.isArray(ar)) ar = ar.filter(function(x){return x!=null && x!=='';}).join(' · ');
    ar = (ar==null) ? '' : String(ar);
    S.name = nm; S.artists = ar;
    S.cover = (typeof song.cover==='string') ? song.cover : '';
    var ac = p.accent;
    if (Array.isArray(ac) && ac.length>=3){
      var r=clamp(+ac[0],0,255), g=clamp(+ac[1],0,255), b=clamp(+ac[2],0,255);
      if (r+g+b > 24){ S.accent=[r,g,b]; }
    }
    S.lines = normLines(p.lines);
    S.dur = (typeof p.duration==='number' && isFinite(p.duration) && p.duration>0) ? Math.min(p.duration, 36000) : 0;
    S.cur = -1; S.lineKey = -1;
    elLine.classList.remove('on');
    elLine.innerHTML='';
    S.spans = null;
    elName.textContent = (nm || 'untitled').slice(0,42).toUpperCase();
    elTxt.textContent = ((ar ? ar+'  /  ' : '') + (nm||'')).slice(0, 90);
    elTxt.classList.add('on');
    var has = S.lines.length>0;
    elEmpty.classList.toggle('on', !has);
    if (layer && layer.setAccent) layer.setAccent(S.accent);
    var _ac = (Array.isArray(S.accent) && S.accent.length >= 3) ? S.accent : [150, 165, 255];
    document.documentElement.style.setProperty('--accent', 'rgb('+_ac[0]+','+_ac[1]+','+_ac[2]+')');
    if (has) { S.cur = lineAt(S.t); if (S.cur>=0) renderLine(S.cur); }
  }

  function applyTick(p){
    if (!p) return;
    if (typeof p.time==='number' && isFinite(p.time)) S.t = clamp(p.time, 0, 36000);
    if (typeof p.playing==='boolean') S.playing = p.playing;
  }

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    try{
      if (d.type==='init') applyInit(d.payload);
      else if (d.type==='tick') applyTick(d.payload);
      else if (d.type==='beat'){
        var bp=d.payload||{};
        if (typeof bp.index==='number') S.beat = bp.index;
        if (typeof bp.level==='number') S.level = clamp(bp.level,0,1);
        S.beatAt = performance.now();
        if (layer && layer.beat) layer.beat(S.level);
      }
      else if (d.type==='live'){
        var lp=d.payload||{};
        if (typeof lp.bass==='number') S.bass = clamp(lp.bass,0,1);
        if (typeof lp.mid==='number') S.mid = clamp(lp.mid,0,1);
        if (typeof lp.treble==='number') S.treble = clamp(lp.treble,0,1);
        if (typeof lp.level==='number') S.level = clamp(lp.level,0,1);
        if (typeof lp.playing==='boolean' && lp.playing===false) S.playing = false;
      }
    }catch(e){ S.err = String(e && e.message || e); console.error('[496] msg', e); }
  }, false);

  window.addEventListener('resize', function(){ try{ resize(); }catch(e){ console.error('[496] resize', e); } }, {passive:true});
  window.addEventListener('orientationchange', function(){ try{ resize(); }catch(e){ console.error('[496] resize', e); } }, {passive:true});

  // ---------- loop ----------
  var lastT = 0, lastClock = 0;
  function frame(now){
    var t0 = performance.now();
    try{
      S.frames++;
      var dt = lastT ? Math.min(0.1, (now - lastT)/1000) : 0.016;
      lastT = now;
      if (S.playing) S.t = S.t; // time is authoritative from ticks
      S.intro = Math.min(1, S.intro + dt*0.42);

      // lyric index
      if (S.lines.length){
        var idx = lineAt(S.t);
        if (idx !== S.lineKey){
          if (idx < 0){ elLine.classList.remove('on'); S.spans=null; S.lineKey=-1; }
          else renderLine(idx);
        }
        if (idx >= 0) paintLine(idx, S.t);
        S.cur = idx;
      } else S.cur = -1;

      if (layer && layer.draw) layer.draw(now, S);
      updateChrome(now);
    }catch(e){ S.err = String(e && e.message || e); console.error('[496] frame', e); }
    S.js = Math.round((performance.now() - t0)*100)/100;
    if (!S.ready){ S.ready = true; try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }catch(e){ console.error('[496] ready', e); } }
    requestAnimationFrame(frame);
  }

  function updateChrome(now){
    var pct = S.dur>0 ? clamp(S.t/S.dur,0,1) : 0;
    if (now - lastClock > 220){
      lastClock = now;
      elClock.textContent = fmt(S.t) + ' / ' + fmt(S.dur);
      elProg.style.width = (pct*100).toFixed(2)+'%';
      var lit = (now - S.beatAt) < 130;
      if (lit !== S.altOn){ S.altOn = lit; elDot.classList.toggle('beat', lit); }
    }
  }

  // ---------- boot (invoked at the very end, once every var is initialised) ----------
  function boot(){
    try{ buildLayer(); }catch(e){ console.error('[496] layer', e); }
    try{ resize(); }catch(e){ console.error('[496] boot resize', e); }
    try{ buildGrain(); }catch(e){ console.error('[496] grain', e); }
    requestAnimationFrame(frame);
    setTimeout(function(){
      if (!S.ready){ S.ready = true; try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }catch(e){ console.error('[496] ready2', e); } }
    }, 420);
  }

  function buildGrain(){
    var c = document.createElement('canvas'); c.width=128; c.height=128;
    var g = c.getContext('2d'), im = g.createImageData(128,128), d = im.data;
    for (var i=0;i<d.length;i+=4){ var v = 128 + ((Math.random()*70)|0) - 35; d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=26; }
    g.putImageData(im,0,0);
    $('grain').style.backgroundImage = 'url('+c.toDataURL('image/png')+')';
  }

  // =================== visual engine ===================
  // Everything expensive is painted once into offscreen canvases; the frame
  // loop only composites and modulates alpha/scale. No per-frame blur/filter.
  var V = {
    q: 1, seed: 20250907, bg:null, stars:null, mono:null, rim:null,
    orb:null, pyr:null, streak:null, G:null, acc:[216,160,90], pulse:0, lastBeat:-1e9
  };
  function rnd(){ V.seed = (V.seed * 1664525 + 1013904223) >>> 0; return V.seed / 4294967296; }
  function mk(w,h){
    var c = document.createElement('canvas');
    c.width = Math.max(2, Math.round(w)); c.height = Math.max(2, Math.round(h));
    return c;
  }
  function hexA(rgb,a){ return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')'; }

  function layout(w,h){
    var portrait = h > w*1.06;
    var G = { portrait: portrait, horizon: h*(portrait?0.625:0.645) };
    var mh = h*(portrait?0.30:0.40);
    var mw = mh/4;
    var cx = w*(portrait?0.5:0.695);
    G.mon = { x: cx - mw/2, y: G.horizon - mh, w: mw, h: mh };
    var RR = Math.min(w,h)*(portrait?0.040:0.031);
    G.orb = { x: w*(portrait?0.32:0.208), y: G.horizon - h*(portrait?0.34:0.372), r: RR };
    var pw = Math.min(w,h)*(portrait?0.155:0.125);
    G.pyr = { x: w*(portrait?0.145:0.152), y: G.horizon, w: pw };
    G.pyr.h = pw*0.62;
    var srx = Math.min(w*0.255, h*0.52), sry = srx*0.44;
    G.sun = { rx: srx, ry: sry, x: G.mon.x + G.mon.w/2, y: G.horizon - sry*0.62 };
    return G;
  }

  // ---------- background : nebula, horizon, ground ----------
  function paintBg(w,h,G,q){
    q = q || 1;
    var c = mk(w*q, h*q), g = c.getContext('2d');
    g.scale(q,q);
    // sky gradient : near-black at the zenith, warm haze on the horizon
    var hz = clamp(G.horizon, 1, h-1);
    var lg = g.createLinearGradient(0,0,0,hz);
    lg.addColorStop(0, '#04060b');
    lg.addColorStop(0.34, '#070a13');
    lg.addColorStop(0.66, '#0d111c');
    lg.addColorStop(0.88, '#161a22');
    lg.addColorStop(1, '#23252d');
    g.fillStyle = lg; g.fillRect(0,0,w,hz);

    // nebula veils (additive, no filter)
    g.globalCompositeOperation = 'lighter';
    var nebs = [
      [0.30,0.30,0.62,0.34,'rgba(38,78,92,',0.20],
      [0.66,0.22,0.52,0.26,'rgba(84,62,86,',0.15],
      [0.48,0.52,0.80,0.22,'rgba(126,96,62,',0.14],
      [0.15,0.52,0.40,0.20,'rgba(34,70,88,',0.13],
      [0.86,0.55,0.34,0.26,'rgba(74,88,100,',0.10]
    ];
    for (var i=0;i<nebs.length;i++){
      var n = nebs[i];
      var rg = g.createRadialGradient(w*n[0],h*n[1],0,w*n[0],h*n[1],w*n[2]);
      rg.addColorStop(0, n[4]+n[5]+')');
      rg.addColorStop(0.45, n[4]+(n[5]*0.45).toFixed(3)+')');
      rg.addColorStop(1, n[4]+'0)');
      g.fillStyle = rg;
      g.beginPath(); g.ellipse(w*n[0],h*n[1],w*n[2],h*n[3],0,0,6.2832); g.fill();
    }
    // horizon bloom behind the monolith
    var hx = G.mon.x + G.mon.w/2, hy = G.horizon;
    var hg = g.createRadialGradient(hx,hy,0,hx,hy,w*0.55);
    hg.addColorStop(0,'rgba(150,120,80,0.30)');
    hg.addColorStop(0.35,'rgba(120,96,66,0.12)');
    hg.addColorStop(1,'rgba(120,96,66,0)');
    g.fillStyle = hg; g.beginPath(); g.ellipse(hx,hy,w*0.55,h*0.16,0,0,6.2832); g.fill();

    // distant dust band (milky way smear)
    for (var d=0; d<260; d++){
      var bx = rnd()*w, by = h*(0.05 + rnd()*0.55);
      var rr = 1 + rnd()*2.4, a = 0.018 + rnd()*0.05;
      g.fillStyle = 'rgba(198,214,230,'+a.toFixed(3)+')';
      g.beginPath(); g.arc(bx, by, rr, 0, 6.2832); g.fill();
    }
    g.globalCompositeOperation = 'source-over';

    // ground
    var gg = g.createLinearGradient(0, G.horizon, 0, h);
    gg.addColorStop(0, '#101219');
    gg.addColorStop(0.10, '#0a0c11');
    gg.addColorStop(1, '#040509');
    g.fillStyle = gg; g.fillRect(0, G.horizon, w, h-G.horizon);

    // ground perspective bands
    g.save();
    for (var b=0;b<9;b++){
      var yy = G.horizon + Math.pow(b/8, 1.7) * (h-G.horizon);
      g.globalAlpha = 0.06 + b*0.004;
      g.strokeStyle = 'rgba(190,200,214,0.5)';
      g.lineWidth = 0.6;
      g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke();
    }
    g.restore();

    // pool of light on the ground in front of the slab
    var pg = g.createRadialGradient(hx, G.horizon+h*0.03, 0, hx, G.horizon+h*0.03, w*0.24);
    pg.addColorStop(0,'rgba(214,178,120,0.20)');
    pg.addColorStop(0.5,'rgba(190,150,100,0.05)');
    pg.addColorStop(1,'rgba(190,150,100,0)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = pg;
    g.beginPath(); g.ellipse(hx, G.horizon+h*0.035, w*0.24, h*0.045, 0,0,6.2832); g.fill();
    g.globalCompositeOperation = 'source-over';

    // horizon ridge
    g.strokeStyle = 'rgba(210,214,224,0.16)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(0,G.horizon); g.lineTo(w,G.horizon); g.stroke();
    return c;
  }

  // ---------- the rising disc behind the slab ----------
  function paintSun(w,h,G,q){
    var rx = Math.min(w*0.255, h*0.52), ry = rx*0.44;
    var pad = rx*1.7;
    var c = mk((rx*2+pad*2)*q, (ry*2+pad*2)*q), g = c.getContext('2d');
    g.scale(q,q); g.translate(rx+pad, ry+pad);
    // outer bloom
    var og = g.createRadialGradient(0,0,ry*0.2,0,0,pad+rx*0.9);
    og.addColorStop(0,'rgba(240,196,132,0.42)');
    og.addColorStop(0.30,'rgba(206,158,104,0.16)');
    og.addColorStop(1,'rgba(180,132,86,0)');
    g.fillStyle = og;
    g.beginPath(); g.ellipse(0,0,pad+rx*0.9,(pad+rx*0.9)*0.62,0,0,6.2832); g.fill();
    // the disc itself : pale amber, softly edged
    var dg = g.createRadialGradient(0,-ry*0.2,ry*0.05,0,0,rx);
    dg.addColorStop(0,'rgba(255,240,210,0.96)');
    dg.addColorStop(0.55,'rgba(250,222,176,0.90)');
    dg.addColorStop(0.90,'rgba(232,186,128,0.72)');
    dg.addColorStop(1,'rgba(214,164,110,0)');
    g.fillStyle = dg;
    g.beginPath(); g.ellipse(0,0,rx,ry,0,0,6.2832); g.fill();
    // engraved latitude striations across the disc
    g.save();
    g.beginPath(); g.ellipse(0,0,rx,ry,0,0,6.2832); g.clip();
    g.globalCompositeOperation = 'multiply';
    for (var i=1;i<=15;i++){
      var yy = -ry + (i/16)*ry*2;
      var a = 0.10 + 0.06*Math.sin(i*2.1);
      g.strokeStyle = 'rgba(150,116,78,'+a.toFixed(3)+')';
      g.lineWidth = Math.max(0.6, ry*0.012);
      g.beginPath();
      var span = rx*Math.sqrt(Math.max(0,1-(yy/ry)*(yy/ry)))*0.99;
      g.moveTo(-span, yy); g.lineTo(span, yy); g.stroke();
    }
    g.restore();
    return c;
  }

  // ---------- star field, drifting with parallax ----------
  function paintStars(w,h,q){
    var c = mk(w*1.4, h), g=c.getContext('2d');
    var n = Math.round(Math.min(560, w*0.34));
    for (var i=0;i<n;i++){
      var x = rnd()*c.width, y = rnd()*h*0.80;
      var s = rnd();
      var r = s>0.985 ? 1.5+ rnd()*0.7 : (s>0.90 ? 0.85 : 0.55);
      var a = 0.10 + rnd()*0.75 * (1 - y/(h*0.95))*0.9 + 0.08;
      g.fillStyle = 'rgba('+(200+rnd()*55|0)+','+(205+rnd()*50|0)+','+(215+rnd()*40|0)+','+a.toFixed(3)+')';
      g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
      if (s>0.992){
        g.strokeStyle='rgba(220,228,240,'+(a*0.55).toFixed(3)+')'; g.lineWidth=0.5;
        g.beginPath(); g.moveTo(x-4,y); g.lineTo(x+4,y); g.moveTo(x,y-4); g.lineTo(x,y+4); g.stroke();
      }
    }
    return c;
  }

  // ---------- the monolith ----------
  function paintMono(mw,mh,q){
    var pad = Math.max(10, mw*1.2), d = Math.max(3, mw*0.34);
    var c = mk((mw+d*0.8+pad*2)*q, (mh+pad*2)*q), g = c.getContext('2d');
    g.scale(q,q); g.translate(pad, pad);
    // contact shadow
    var sg = g.createRadialGradient(mw*0.5, mh, 0, mw*0.5, mh, mw*2.4);
    sg.addColorStop(0,'rgba(0,0,0,0.72)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = sg;
    g.beginPath(); g.ellipse(mw*0.5, mh, mw*2.4, mw*0.34, 0,0,6.2832); g.fill();

    // side (right) face — slightly cooler, catch of sky
    g.beginPath();
    g.moveTo(mw, 0.0); g.lineTo(mw+d*0.62, -d*0.34);
    g.lineTo(mw+d*0.62, mh-d*0.34); g.lineTo(mw, mh);
    g.closePath();
    var sfg = g.createLinearGradient(mw, 0, mw+d*0.62, 0);
    sfg.addColorStop(0,'#101319'); sfg.addColorStop(1,'#191d26');
    g.fillStyle = sfg; g.fill();

    // top face
    g.beginPath();
    g.moveTo(0,0); g.lineTo(mw,0); g.lineTo(mw+d*0.62,-d*0.34); g.lineTo(d*0.62,-d*0.34);
    g.closePath();
    var tfg = g.createLinearGradient(0,0,mw,-d*0.34);
    tfg.addColorStop(0,'#20252f'); tfg.addColorStop(1,'#2a303b');
    g.fillStyle = tfg; g.fill();

    // front face — near-absolute black with a faint vertical sheen
    var ffg = g.createLinearGradient(0,0,mw,0);
    ffg.addColorStop(0,'#0b0d13');
    ffg.addColorStop(0.18,'#05060a');
    ffg.addColorStop(0.72,'#030407');
    ffg.addColorStop(1,'#080a10');
    g.fillStyle = ffg; g.fillRect(0,0,mw,mh);

    // faint vertical striations to read as machined surface
    g.save();
    g.beginPath(); g.rect(0,0,mw,mh); g.clip();
    for (var i=0;i<26;i++){
      var x = rnd()*mw;
      g.strokeStyle = 'rgba(210,220,235,'+(0.006+rnd()*0.014).toFixed(3)+')';
      g.lineWidth = 0.5 + rnd()*1.4;
      g.beginPath(); g.moveTo(x,0); g.lineTo(x + (rnd()-0.5)*2, mh); g.stroke();
    }
    // lower falloff (ground contact darkening)
    var dg = g.createLinearGradient(0, mh*0.72, 0, mh);
    dg.addColorStop(0,'rgba(0,0,0,0)'); dg.addColorStop(1,'rgba(0,0,0,0.55)');
    g.fillStyle = dg; g.fillRect(0, mh*0.72, mw, mh*0.28);
    g.restore();

    // rim light on the left arris (light from the orb, upper-left)
    var rl = g.createLinearGradient(0,0,0,mh);
    rl.addColorStop(0,'rgba(255,238,206,0.92)');
    rl.addColorStop(0.28,'rgba(238,214,178,0.55)');
    rl.addColorStop(0.72,'rgba(200,170,130,0.22)');
    rl.addColorStop(1,'rgba(160,130,96,0.05)');
    g.strokeStyle = rl; g.lineWidth = Math.max(1, mw*0.032);
    g.beginPath(); g.moveTo(0.5,0); g.lineTo(0.5,mh); g.stroke();
    // hairline on the top edge
    g.strokeStyle = 'rgba(255,244,220,0.55)'; g.lineWidth = Math.max(0.7, mw*0.012);
    g.beginPath(); g.moveTo(0,0.5); g.lineTo(mw,0.5); g.stroke();
    return c;
  }

  // rim overlay used for the beat pulse — same canvas box as the slab so it aligns
  function paintRim(mw,mh,q){
    var pad = Math.max(10, mw*1.2), d = Math.max(3, mw*0.34);
    var c = mk((mw+d*0.8+pad*2)*q, (mh+pad*2)*q), g=c.getContext('2d');
    g.scale(q,q); g.translate(pad,pad);
    var rg = g.createLinearGradient(0,0,mw,mh*0.5);
    rg.addColorStop(0,'rgba(255,236,200,0.9)');
    rg.addColorStop(1,'rgba(255,200,140,0.0)');
    g.strokeStyle = rg; g.lineWidth = Math.max(1.6, mw*0.09);
    g.beginPath(); g.moveTo(0.9,0); g.lineTo(0.9,mh); g.stroke();
    return c;
  }

  // ---------- glowing sphere ----------
  function paintOrb(R,q){
    var S2 = Math.max(48, R*9);
    var c = mk(S2*2*q, S2*2*q), g = c.getContext('2d');
    g.scale(q,q); g.translate(S2,S2);
    var hue = V.acc;
    var glow = g.createRadialGradient(0,0,R*0.4,0,0,S2);
    glow.addColorStop(0,'rgba(255,246,226,0.95)');
    glow.addColorStop(0.10,hexA(hue,0.75));
    glow.addColorStop(0.24,hexA(hue,0.30));
    glow.addColorStop(0.55,hexA(hue,0.07));
    glow.addColorStop(1,hexA(hue,0));
    g.fillStyle = glow; g.beginPath(); g.arc(0,0,S2,0,6.2832); g.fill();
    // hard core
    var core = g.createRadialGradient(-R*0.3,-R*0.3,0,0,0,R);
    core.addColorStop(0,'#fffdf6'); core.addColorStop(0.55,'#ffeccd');
    core.addColorStop(0.88,hexA(hue,0.95)); core.addColorStop(1,hexA(hue,0.55));
    g.fillStyle = core; g.beginPath(); g.arc(0,0,R,0,6.2832); g.fill();
    return c;
  }

  // ---------- distant pyramid ----------
  function paintPyr(pw,ph,q){
    var pad = Math.max(4, pw*0.45);
    var c = mk((pw+pad*2)*q,(ph+pad*2)*q), g=c.getContext('2d');
    g.scale(q,q); g.translate(pad,pad);
    g.beginPath(); g.moveTo(0,ph); g.lineTo(pw*0.5,0); g.lineTo(pw,ph); g.closePath();
    var lg = g.createLinearGradient(0,0,pw,0);
    lg.addColorStop(0,'rgba(26,30,38,1)');
    lg.addColorStop(0.47,'rgba(16,18,24,1)');
    lg.addColorStop(0.53,'rgba(9,10,14,1)');
    lg.addColorStop(1,'rgba(6,7,10,1)');
    g.fillStyle = lg; g.fill();
    g.strokeStyle = 'rgba(226,196,150,0.30)'; g.lineWidth = Math.max(0.6,pw*0.011);
    g.beginPath(); g.moveTo(pw*0.5,0); g.lineTo(pw,ph); g.stroke();
    g.strokeStyle = 'rgba(226,196,150,0.14)';
    g.beginPath(); g.moveTo(pw*0.5,0); g.lineTo(0,ph); g.stroke();
    return c;
  }

  function buildLayer(){
    layer = {
      resize: function(w,h,dpr){
        V.q = clamp(dpr, 1, 1.5);
        V.dpr = dpr;
        var G = layout(w,h);
        V.G = G;
        V.bg = paintBg(w, h, G, 0.55);          // painted soft, upscaled on blit (cheap nebula)
        V.stars = paintStars(w, h, 1);
        V.sun = paintSun(w, h, G, 1);
        V.mono = paintMono(G.mon.w, G.mon.h, V.q);
        V.rim = paintRim(G.mon.w, G.mon.h, V.q);
        V.orb = paintOrb(G.orb.r, V.q);
        V.pyr = paintPyr(G.pyr.w, G.pyr.h, V.q);
        // line the CSS light beam up with the slab's foot
        var root = document.documentElement.style;
        root.setProperty('--mx', (G.mon.x + G.mon.w/2).toFixed(1)+'px');
        root.setProperty('--my', (G.horizon - G.mon.h*0.42).toFixed(1)+'px');
      },
      setAccent: function(rgb){
        V.acc = (Array.isArray(rgb) && rgb.length >= 3) ? rgb : (V.acc || [216,160,90]);
        if (V.G) V.orb = paintOrb(V.G.orb.r, V.q);
      },
      beat: function(level){ V.pulse = 1; V.lastBeat = performance.now(); },
      draw: function(now, st){
        var G = V.G; if (!G || !V.bg) return;
        var w = st.W, h = st.H;
        var ctx2 = ctx;
        ctx2.setTransform(V.dpr || 1,0,0,V.dpr || 1,0,0);
        ctx2.globalCompositeOperation = 'source-over';
        ctx2.globalAlpha = 1;

        var drift = st.rm ? 0 : Math.sin(now*0.00006)*w*0.004;
        // slow camera : the whole plate creeps in, so no two moments are identical
        var cam = st.rm ? 1 : 1.018 + Math.sin(now*0.000045)*0.012;
        var cy = st.rm ? 0 : Math.sin(now*0.000031)*h*0.006;
        ctx2.save();
        ctx2.translate(w/2, h*0.52 + cy);
        ctx2.scale(cam, cam);
        ctx2.translate(-w/2, -h*0.52);
        ctx2.drawImage(V.bg, -1 + drift*0.35, -1, w+2, h+2);

        // stars : slow parallax scroll, only above the horizon
        var sx = V.stars.width - w;
        var off = st.rm ? 0 : ((now*0.0045) % Math.max(1,sx));
        ctx2.save();
        ctx2.beginPath();
        ctx2.rect(0, 0, w, Math.max(0, G.horizon - 1));
        ctx2.clip();
        ctx2.globalAlpha = 0.9;
        ctx2.drawImage(V.stars, -off + drift, 0, V.stars.width, h);
        ctx2.globalAlpha = 1;
        ctx2.restore();

        // pyramid
        var ppad = G.pyr.w*0.2;
        ctx2.drawImage(V.pyr, G.pyr.x - ppad, G.pyr.y - G.pyr.h - ppad,
          G.pyr.w + ppad*2, G.pyr.h + ppad*2);

        // rising disc : clipped by the horizon so it reads as half-set
        var sunRx = G.sun.rx, sunRy = G.sun.ry, sunPad = sunRx*1.7;
        var sunW = (sunRx+sunPad)*2, sunH = (sunRy+sunPad)*2;
        var sunCx = G.sun.x, sunCy = G.sun.y;
        ctx2.save();
        ctx2.beginPath();
        ctx2.rect(0, 0, w, Math.max(0, G.horizon - 1));
        ctx2.clip();
        ctx2.globalCompositeOperation = 'lighter';
        var sunS = 1 + (st.bass||0)*0.03;
        ctx2.globalAlpha = 0.95;
        ctx2.drawImage(V.sun, sunCx - sunW/2*sunS, sunCy - sunH/2*sunS, sunW*sunS, sunH*sunS);
        ctx2.globalAlpha = 1;
        ctx2.globalCompositeOperation = 'source-over';
        ctx2.restore();

        // engraved orbital arc in front of the disc
        ctx2.save();
        ctx2.translate(sunCx, sunCy);
        ctx2.rotate(-0.10);
        ctx2.strokeStyle = 'rgba(236,222,196,'+(0.13 + (st.bass||0)*0.10).toFixed(3)+')';
        ctx2.lineWidth = 0.7;
        ctx2.beginPath(); ctx2.ellipse(0,0,Math.max(10,sunRx*1.22),Math.max(4,sunRy*0.92),0,0,6.2832); ctx2.stroke();
        ctx2.restore();

        // orb : pulse with live bass, halo scaled
        var bass = st.bass || 0;
        var pulse = (now - V.lastBeat < 260) ? 1 : 0;
        var os = 1 + bass*0.10 + pulse*0.05;
        var osz = V.orb.width / V.q * os;
        ctx2.globalCompositeOperation = 'lighter';
        ctx2.globalAlpha = 0.92;
        ctx2.drawImage(V.orb, G.orb.x - osz/2, G.orb.y - osz/2, osz, osz);
        ctx2.globalCompositeOperation = 'source-over';
        ctx2.globalAlpha = 1;

        // engraved orbital arc : a thin ring the sphere sits inside
        ctx2.save();
        ctx2.translate(G.orb.x, G.orb.y);
        ctx2.rotate(-0.42);
        ctx2.strokeStyle = 'rgba(232,220,192,'+(0.10 + bass*0.09).toFixed(3)+')';
        ctx2.lineWidth = 0.65;
        ctx2.beginPath(); ctx2.ellipse(0,0,G.orb.r*2.5,G.orb.r*0.55,0,0,6.2832); ctx2.stroke();
        ctx2.restore();

        // monolith : breathes with the beat, anchored on the horizon
        var m = G.mon;
        var bass2 = st.bass || 0;
        var breath = 1 + (pulse?0.004:0) + bass2*0.003;
        var mw2 = m.w*breath, mh2 = m.h*breath;
        var mx = m.x + (m.w-mw2)/2, my = G.horizon - mh2;
        var mp = Math.max(10, m.w*1.2);
        var ms = mw2/m.w;
        ctx2.drawImage(V.mono, mx - mp*ms, my - mp*ms,
          (V.mono.width/V.q)*ms, (V.mono.height/V.q)*ms);
        // beat rim flash
        if (pulse){
          var a = 0.10 + (st.level||0)*0.26;
          ctx2.globalCompositeOperation = 'lighter';
          ctx2.globalAlpha = a;
          ctx2.drawImage(V.rim, mx - mp*ms, my - mp*ms,
            (V.rim.width/V.q)*ms, (V.rim.height/V.q)*ms);
          ctx2.globalAlpha = 1; ctx2.globalCompositeOperation = 'source-over';
        }

        // wet-ground reflection : the slab's rim light falling forward
        ctx2.save();
        ctx2.globalCompositeOperation = 'lighter';
        var refl = ctx2.createLinearGradient(0, G.horizon, 0, G.horizon + m.h*0.30);
        refl.addColorStop(0, 'rgba(226,190,140,0.085)');
        refl.addColorStop(1, 'rgba(226,190,140,0)');
        ctx2.fillStyle = refl;
        ctx2.fillRect(m.x - m.w*0.45, G.horizon, m.w*1.9, m.h*0.30);
        ctx2.restore();

        // light sweep : one thin raking band, very slow (screen space)
        ctx2.restore();
        if (!st.rm){
          var ph = ((now*0.000035) % 1);
          var bx = (-0.35 + ph*1.7) * w;
          var bg2 = ctx2.createLinearGradient(bx - w*0.18, 0, bx + w*0.18, 0);
          bg2.addColorStop(0,'rgba(255,240,214,0)');
          bg2.addColorStop(0.5,'rgba(255,240,214,0.035)');
          bg2.addColorStop(1,'rgba(255,240,214,0)');
          ctx2.globalCompositeOperation = 'lighter';
          ctx2.fillStyle = bg2;
          ctx2.fillRect(0,0,w,h);
          ctx2.globalCompositeOperation = 'source-over';
        }
      }
    };
  }

  // ---------- self-check port : defined once, reads live state ----------
  window.__stage = function(){
    var i = S.cur;
    return {
      lines: S.lines.length,
      idx: (S.lines.length ? i : -1),
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: S.js,
      err: S.err || '',
      text: (i>=0 && S.lines[i]) ? (S.lines[i].text || '') : '',
      gl: !!S.gl,
      rm: !!S.rm
    };
  };

  boot();
})();
</script>
</body>
