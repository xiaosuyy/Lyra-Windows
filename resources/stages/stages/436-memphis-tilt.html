<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>柠檬斜塔</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#F6E7C1;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
       color:#141414;-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #art{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #lyr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
       width:min(88vw,1180px);text-align:center;z-index:5;pointer-events:none;
       padding:min(6vh,64px) 0;}
  #lyr::before{content:"";position:absolute;inset:-12% -14%;z-index:-1;pointer-events:none;
       background:radial-gradient(closest-side,
         rgba(252,246,226,.95) 0%, rgba(252,246,226,.88) 40%,
         rgba(252,246,226,.55) 68%, rgba(252,246,226,0) 100%);}
  #prev,#next{font-size:clamp(12px,1.35vw,17px);font-weight:700;opacity:.40;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
              letter-spacing:.02em;}
  #cur{font-size:clamp(24px,5vw,74px);line-height:1.18;font-weight:800;
       letter-spacing:.005em;margin:.3em 0 .16em;word-break:break-word;
       text-shadow:0 1px 0 rgba(255,255,255,.55);}
  #cur .ch{display:inline-block;transform-origin:50% 80%;
       transition:opacity .16s linear, transform .22s cubic-bezier(.2,.9,.3,1.4);}
  .rm #cur .ch{transition:none;}
  #rule{height:3px;width:min(34%,220px);margin:0 auto;border-radius:2px;
        background:rgba(22,22,22,.16);overflow:hidden;}
  #rule i{display:block;height:100%;width:0%;background:#161616;border-radius:2px;}
  #empty{font-size:clamp(15px,2vw,23px);font-weight:800;letter-spacing:.16em;opacity:.62;}
  .hide{opacity:0 !important;}
  /* float / breathe animations (cheap, SVG-only) */
  .pc{animation:fl 7.5s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .rm .pc{animation:none !important;}
  .pop{transform-box:fill-box;transform-origin:center;}
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="bg"></g>
    <g id="pieces"></g>
    <g id="bars"></g>
  </svg>
  <div id="lyr">
    <div id="prev" class="hide"></div>
    <div id="cur">柠檬斜塔</div>
    <div id="rule"><i></i></div>
    <div id="next" class="hide"></div>
    <div id="empty" class="hide">纯器乐 · 让几何自己跳</div>  </div>
</div>
<script>
'use strict';

/* ---------- state ---------- */
var view = { w: 1440, h: 900, rm: false };
var state = {
  lines: [], idx: -1, t: 0, playing: true,
  accent: [242, 194, 48], dur: 0, text: '', gotInit: false
};
var frames = 0, jsMs = 0, lastErr = '';
var readySent = false;

/* ---------- self-check hook: outermost, unconditional ---------- */
window.__stage = function () {
  return {
    lines: state.lines.length,
    idx: state.idx,
    t: state.t,
    playing: state.playing,
    frames: frames,
    js: jsMs,
    err: lastErr,
    text: state.text,
    gl: false,
    rm: view.rm
  };
};

/* ---------- ready ---------- */
function sendReady() {
  if (readySent) { return; }
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error('[436] ready postMessage failed', e); }
}

/* ---------- helpers ---------- */
function clamp(n, a, b) { n = +n; if (!isFinite(n)) { n = a; } return n < a ? a : (n > b ? b : n); }

function findIdx(t) {
  var ls = state.lines, lo = 0, hi = ls.length - 1, ans = -1;
  if (!ls.length) { return -1; }
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if ((+ls[mid].t || 0) <= t + 0.001) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}

/* ================= ART: Memphis isometric geometry ================= */
var PAL = {
  ink: '#141414', paper: '#F6E7C1', lemon: '#F5C63F', pink: '#F09CBE',
  blue: '#93C9E7', coral: '#E8502C', mint: '#74C6AC', cream: '#FCF6E2'
};

var artEl = document.getElementById('art');
var bgG, piecesG, barsG;
var bars = [], pops = [];
var vbW = 1440;

/* --- isometric cube helper --- */
function iso(x, y, z, u) {
  return [ (x - y) * u * 0.8660254, (x + y) * u * 0.5 - z * u ];
}
function p3(a) { return a[0].toFixed(1) + ',' + a[1].toFixed(1); }
function cube(gx, gy, gz, u) {
  var t = [iso(gx, gy, gz + 1, u), iso(gx + 1, gy, gz + 1, u),
           iso(gx + 1, gy + 1, gz + 1, u), iso(gx, gy + 1, gz + 1, u)];
  var r = [iso(gx + 1, gy, gz + 1, u), iso(gx + 1, gy + 1, gz + 1, u),
           iso(gx + 1, gy + 1, gz, u), iso(gx + 1, gy, gz, u)];
  var l = [iso(gx, gy + 1, gz + 1, u), iso(gx + 1, gy + 1, gz + 1, u),
           iso(gx + 1, gy + 1, gz, u), iso(gx, gy + 1, gz, u)];
  function f(a) { return 'M' + p3(a[0]) + 'L' + p3(a[1]) + 'L' + p3(a[2]) + 'L' + p3(a[3]) + 'Z'; }
  return '<path d="' + f(r) + '" fill="' + PAL.coral + '" stroke="' + PAL.ink + '" stroke-width="6" stroke-linejoin="round"/>' +
         '<path d="' + f(l) + '" fill="' + PAL.lemon + '" stroke="' + PAL.ink + '" stroke-width="6" stroke-linejoin="round"/>' +
         '<path d="' + f(t) + '" fill="' + PAL.cream + '" stroke="' + PAL.ink + '" stroke-width="6" stroke-linejoin="round"/>';
}

/* --- shape makers, drawn around local origin --- */
function mkCone() {
  return '<path d="M0,-66 L40,36 A40 13 0 0 1 -40,36 Z" fill="url(#pDot)" stroke="' + PAL.ink + '" stroke-width="6" stroke-linejoin="round"/>' +
         '<ellipse cx="0" cy="36" rx="40" ry="13" fill="' + PAL.lemon + '" stroke="' + PAL.ink + '" stroke-width="6"/>';
}
function mkColumn() {
  return '<rect x="-34" y="-82" width="68" height="164" rx="16" fill="url(#pStripe)" stroke="' + PAL.ink + '" stroke-width="6"/>' +
         '<circle cx="0" cy="-100" r="15" fill="' + PAL.coral + '" stroke="' + PAL.ink + '" stroke-width="5"/>';
}
function mkTorus() {
  return '<g transform="rotate(-16)">' +
    '<ellipse cx="0" cy="0" rx="56" ry="34" fill="none" stroke="' + PAL.ink + '" stroke-width="22"/>' +
    '<ellipse cx="0" cy="0" rx="56" ry="34" fill="none" stroke="' + PAL.lemon + '" stroke-width="11"/>' +
    '</g>';
}
function mkBlob() {
  return '<circle cx="0" cy="0" r="56" fill="url(#pGerm)" stroke="' + PAL.ink + '" stroke-width="6"/>';
}
function mkTri() {
  return '<polygon points="0,-60 54,46 -54,46" fill="url(#pDotB)" stroke="' + PAL.ink + '" stroke-width="6" stroke-linejoin="round"/>';
}
function mkSpring() {
  var s = '<g transform="skewX(-10)">', i, y;
  for (i = 0; i < 6; i++) {
    y = -46 + i * 17;
    s += '<ellipse cx="' + ((i % 2) ? 5 : -5) + '" cy="' + y + '" rx="31" ry="10" fill="none" stroke="' +
         PAL.ink + '" stroke-width="7"/>';
  }
  return s + '</g><circle cx="0" cy="-62" r="9" fill="' + PAL.mint + '" stroke="' + PAL.ink + '" stroke-width="4"/>';
}
function mkStairs() {
  return '<g>' + cube(0, 0, 0, 30) + cube(-1, 0, 1, 30) + cube(-2, 0, 2, 30) + '</g>';
}
function mkZig() {
  return '<path d="M-70,0 L-46,-24 L-22,0 L2,-24 L26,0 L50,-24 L74,0" fill="none" stroke="' +
         PAL.ink + '" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>';
}
function mkHalf() {
  return '<path d="M-52,0 A52 52 0 0 1 52,0 Z" fill="' + PAL.mint + '" stroke="' + PAL.ink + '" stroke-width="6" stroke-linejoin="round"/>' +
         '<circle cx="-24" cy="-18" r="7" fill="' + PAL.ink + '"/>';
}

function defs() {
  return '<defs>' +
    '<pattern id="pDot" patternUnits="userSpaceOnUse" width="17" height="17">' +
      '<rect width="17" height="17" fill="' + PAL.blue + '"/>' +
      '<circle cx="8.5" cy="8.5" r="3.6" fill="' + PAL.ink + '"/></pattern>' +
    '<pattern id="pDotB" patternUnits="userSpaceOnUse" width="19" height="19">' +
      '<rect width="19" height="19" fill="' + PAL.pink + '"/>' +
      '<circle cx="9.5" cy="9.5" r="3.4" fill="' + PAL.ink + '"/></pattern>' +
    '<pattern id="pStripe" patternUnits="userSpaceOnUse" width="20" height="20">' +
      '<rect width="20" height="20" fill="' + PAL.cream + '"/>' +
      '<rect width="9" height="20" fill="' + PAL.ink + '"/></pattern>' +
    '<pattern id="pGerm" patternUnits="userSpaceOnUse" width="46" height="46">' +
      '<rect width="46" height="46" fill="' + PAL.coral + '"/>' +
      '<path d="M8,14c7,-9 18,-5 17,4c0,8 -12,9 -15,3c-2,-5 1,-8 5,-7" fill="' + PAL.ink + '"/>' +
      '<path d="M30,32c5,-6 13,-3 12,3c0,6 -9,7 -11,2c-1,-3 1,-6 4,-5" fill="' + PAL.ink + '"/>' +
      '</pattern>' +
    '<pattern id="pGrid" patternUnits="userSpaceOnUse" width="54" height="54">' +
      '<circle cx="27" cy="27" r="3.2" fill="' + PAL.ink + '" opacity="0.5"/></pattern>' +
    '<radialGradient id="gBlush" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="#F6E7C1" stop-opacity="0.95"/>' +
      '<stop offset="62%" stop-color="#F6E7C1" stop-opacity="0.62"/>' +
      '<stop offset="100%" stop-color="#F6E7C1" stop-opacity="0"/>' +
    '</radialGradient>' +
    '</defs>';
}

/* layout presets: [nx, ny, scale, rot, maker] — centre band kept clear for lyrics */
var WIDE = [
  [0.100, 0.280, 1.05,  -7, mkCone],
  [0.152, 0.705, 0.80,   6, mkColumn],
  [0.480, 0.082, 0.88,  -3, mkZig],
  [0.058, 0.520, 0.56,  14, mkTri],
  [0.892, 0.238, 0.98,  10, mkTorus],
  [0.862, 0.700, 0.90,  -6, mkBlob],
  [0.958, 0.520, 0.64, -12, mkHalf],
  [0.300, 0.930, 0.76,   8, mkStairs],
  [0.722, 0.925, 0.64,  -9, mkSpring]
];
var TALL = [
  [0.150, 0.105, 0.55, -8, mkCone],
  [0.855, 0.098, 0.50,  7, mkTorus],
  [0.115, 0.255, 0.38, 12, mkTri],
  [0.880, 0.250, 0.42, -6, mkHalf],
  [0.520, 0.058, 0.50, -4, mkZig],
  [0.155, 0.760, 0.46,  9, mkColumn],
  [0.850, 0.775, 0.44, -7, mkBlob],
  [0.520, 0.860, 0.40,  5, mkStairs]
];

function buildArt() {
  var w = view.w, h = view.h;
  if (!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) { w = 1440; h = 900; }
  vbW = clamp(900 * (w / h), 440, 1800);
  artEl.setAttribute('viewBox', '0 0 ' + vbW.toFixed(0) + ' 900');
  artEl.setAttribute('preserveAspectRatio', 'xMidYMid slice');

  var tall = vbW < 820;
  var set = tall ? TALL : WIDE;
  var k = tall ? 1 : clamp(vbW / 1500, 0.72, 1.06);

  /* ---- background ---- */
  var bg = '<rect x="-50" y="-50" width="' + (vbW + 100) + '" height="1000" fill="' + PAL.paper + '"/>';
  /* cover-accent wash: a soft tint under a paper-coloured radial, so text stays readable */
  bg += '<ellipse id="tint" cx="' + (vbW * 0.5).toFixed(0) + '" cy="450" rx="' +
        (vbW * 0.62).toFixed(0) + '" ry="420" fill="#F6E7C1" opacity=".55"/>';
  bg += '<ellipse id="blush" cx="' + (vbW * 0.5).toFixed(0) + '" cy="450" rx="' +
        (tall ? vbW * 0.75 : vbW * 0.42).toFixed(0) + '" ry="' + (tall ? 380 : 300) +
        '" fill="url(#gBlush)"/>';
  bg += '<circle cx="' + (vbW * 0.77) + '" cy="' + (900 * 0.14) + '" r="' + (tall ? 150 : 230) +
        '" fill="' + PAL.lemon + '"/>';
  bg += '<circle cx="' + (vbW * 0.13) + '" cy="' + (900 * 0.10) + '" r="' + (tall ? 90 : 130) +
        '" fill="' + PAL.pink + '" opacity=".85"/>';
  bg += '<rect x="' + (vbW * 0.03) + '" y="' + (900 * 0.58) + '" width="' + (vbW * 0.22) + '" height="' + (900 * 0.30) +
        '" rx="' + (vbW * 0.11) + '" fill="' + PAL.blue + '" transform="rotate(-7 ' + (vbW * 0.14) + ' ' + (900 * 0.73) + ')"/>';
  bg += '<rect x="' + (vbW * 0.70) + '" y="' + (900 * 0.40) + '" width="' + (vbW * 0.40) + '" height="26" rx="13" fill="' +
        PAL.mint + '" transform="rotate(-9 ' + (vbW * 0.9) + ' ' + (900 * 0.42) + ')"/>';
  bg += '<rect x="0" y="0" width="' + vbW + '" height="' + 260 + '" fill="url(#pGrid)" opacity=".55"/>';
  bg += '<rect x="0" y="' + (900 - 300) + '" width="' + vbW + '" height="300" fill="url(#pGrid)" opacity=".35"/>';
  /* checker strip + squiggle: pure Memphis confetti, kept at the edges */
  var ck = tall ? 4 : 7, ckS = 22, ckx = vbW * 0.02, cky = 900 * 0.40, ai, aj;
  for (ai = 0; ai < ck; ai++) {
    for (aj = 0; aj < 2; aj++) {
      if ((ai + aj) % 2) { continue; }
      bg += '<rect x="' + (ckx + ai * ckS).toFixed(0) + '" y="' + (cky + aj * ckS).toFixed(0) +
            '" width="' + ckS + '" height="' + ckS + '" fill="' + PAL.ink + '" opacity=".85"/>';
    }
  }
  bg += '<path d="M' + (vbW * 0.60).toFixed(0) + ',' + (900 * 0.955).toFixed(0) +
        ' q18,-26 36,0 q18,26 36,0 q18,-26 36,0" fill="none" stroke="' + PAL.pink +
        '" stroke-width="9" stroke-linecap="round"/>';
  bg += '<path d="M' + (vbW * 0.045).toFixed(0) + ',' + (900 * 0.20).toFixed(0) +
        ' a54,54 0 0 1 0,108" fill="none" stroke="' + PAL.coral +
        '" stroke-width="8" stroke-dasharray="4 16" stroke-linecap="round"/>';
  /* a few accent chips, recoloured from the cover colour */
  var chipN = tall ? 5 : 9, ci, cx, cy;
  for (ci = 0; ci < chipN; ci++) {
    cx = (ci % 3) * (vbW / 3) + (vbW / 6) + (ci % 2 ? 34 : -34);
    cy = 900 * (ci < 3 ? 0.07 : (ci < 6 ? 0.5 : 0.93));
    if (Math.abs(cy - 450) < 150) { cy += (ci % 2 ? 190 : -190); }
    bg += '<circle class="hit" cx="' + cx.toFixed(0) + '" cy="' + cy.toFixed(0) + '" r="' +
          (ci % 2 ? 9 : 13) + '" fill="#E8502C" stroke="' + PAL.ink + '" stroke-width="3.5" opacity=".9"/>';
  }

  /* ---- pieces ---- */
  var pc = '', i, p;
  for (i = 0; i < set.length; i++) {
    p = set[i];
    pc += '<g transform="translate(' + (p[0] * vbW).toFixed(1) + ',' + (p[1] * 900).toFixed(1) +
          ') scale(' + (k * p[2]).toFixed(3) + ') rotate(' + p[3] + ')">' +
          '<g class="pc" style="animation-delay:-' + (i * 1.3).toFixed(1) + 's">' + p[4]() + '</g></g>';
  }

  /* ---- beat bars + pops (dynamic) ---- */
  var nb = vbW < 620 ? 7 : 11;
  var bw = vbW < 620 ? 26 : 30;
  var gap = vbW < 620 ? 10 : 14;
  var total = nb * bw + (nb - 1) * gap;
  var x0 = (vbW - total) / 2, baseY = 900 - 46;
  var barsStr = '<line x1="' + (x0 - 24).toFixed(0) + '" y1="' + baseY + '" x2="' + (x0 + total + 24).toFixed(0) +
                '" y2="' + baseY + '" stroke="' + PAL.ink + '" stroke-width="5" stroke-linecap="round"/>';
  var cols = [PAL.coral, PAL.lemon, PAL.pink, PAL.mint, PAL.blue];
  for (i = 0; i < nb; i++) {
    var bh0 = 18 + (i % 3) * 7;
    barsStr += '<rect class="bar" x="' + (x0 + i * (bw + gap)) + '" y="' + (baseY - bh0) + '" width="' + bw +
               '" height="' + bh0 + '" rx="6" fill="' + cols[i % cols.length] + '" stroke="' + PAL.ink + '" stroke-width="4"/>';
  }
  var popStr = '';
  var popPos = [[0.055, 0.10], [0.945, 0.11], [0.055, 0.92]];
  for (i = 0; i < 3; i++) {
    popStr += '<circle class="pop" cx="' + (popPos[i][0] * vbW).toFixed(0) + '" cy="' + (popPos[i][1] * 900).toFixed(0) +
              '" r="13" fill="' + (i === 1 ? PAL.pink : PAL.cream) + '" stroke="' + PAL.ink + '" stroke-width="4" opacity="0"/>';
  }

  artEl.innerHTML = defs() + '<g id="bg">' + bg + '</g><g id="pieces">' + pc +
                    '</g><g id="bars">' + barsStr + '</g><g id="pops">' + popStr + '</g>';

  bars = [];
  var bs = artEl.querySelectorAll('.bar');
  for (i = 0; i < bs.length; i++) { bars.push(bs[i]); }
  pops = [];
  var ps = artEl.querySelectorAll('.pop');
  for (i = 0; i < ps.length; i++) { pops.push(ps[i]); }
}

/* ================= LYRIC LAYER ================= */
var elPrev = document.getElementById('prev');
var elCur = document.getElementById('cur');
var elNext = document.getElementById('next');
var elRule = document.querySelector('#rule i');
var elEmpty = document.getElementById('empty');
var curLine = null, curChars = null, curIdx = -2, curCharsRef = null;

function lineText(l) {
  if (!l || typeof l.text !== 'string') { return ''; }
  return l.text;
}
function lineEnd(l, i) {
  var s = (+l.t || 0);
  var d = +l.dur;
  if (!isFinite(d) || d <= 0) {
    var nx = state.lines[i + 1];
    d = (nx && isFinite(+nx.t) && +nx.t > s) ? (+nx.t - s) : 4.2;
  }
  return s + clamp(d, 0.2, 60);
}
/* build per-char timings: YRC when it actually matches the text, else even split */
function charTimes(l, li) {
  var txt = lineText(l);
  var n = Math.min(txt.length, 400);
  var cs = l && l.chars;
  var i, out = [];
  if (Array.isArray(cs) && cs.length > 0) {
    var m = Math.min(cs.length, 400);
    var joined = '', okLen = m === n;
    for (i = 0; i < m; i++) {
      var c = cs[i];
      var cc = (c && typeof c.c === 'string') ? c.c : '';
      joined += cc.slice(0, 4);
      out.push({ c: cc, t: clamp(c && c.t, -10, 1e6) });
    }
    if (okLen && joined === txt) { return out; }
    /* chars disagree with the text: keep the text, spread it over the given span */
    var lo = 1e9, hi = -1e9;
    for (i = 0; i < out.length; i++) {
      if (out[i].t < lo) { lo = out[i].t; }
      if (out[i].t > hi) { hi = out[i].t; }
    }
    if (!isFinite(lo) || !isFinite(hi) || hi <= lo) { lo = +l.t || 0; hi = lo + 3; }
    return spread(txt, lo, hi);
  }
  var t0 = +l.t || 0;
  return spread(txt, t0, lineEnd(l, li));
}
/* even split, fixed count cap — never a decreasing-step loop */
function spread(txt, t0, t1) {
  var n = Math.min(txt.length, 400);
  var span = Math.max(0.3, t1 - t0);
  var per = span / Math.max(1, n);
  var out = [], i;
  for (i = 0; i < n; i++) { out.push({ c: txt.charAt(i), t: t0 + per * i }); }
  return out;
}

var curLineRef = null;
function paintLyric() {
  var i = state.idx;
  var l = state.lines[i] || null;
  if (i === curIdx && l === curLineRef) { return; }
  curIdx = i;
  curLineRef = l;
  curLine = l;

  var txt = l ? lineText(l) : '';
  state.text = txt;
  litCount = -1;

  elPrev.textContent = (i > 0) ? lineText(state.lines[i - 1]) : '';
  elPrev.classList.toggle('hide', !elPrev.textContent);
  elNext.textContent = state.lines[i + 1] ? lineText(state.lines[i + 1]) : '';
  elNext.classList.toggle('hide', !elNext.textContent);

  if (!state.lines.length) {
    elEmpty.classList.toggle('hide', !state.gotInit);
    elRule.style.width = '0%';
    curChars = null;
    if (state.gotInit) {
      /* genuinely instrumental: a composed, deliberate empty state */
      elCur.textContent = '';
      elCur.style.fontSize = '';
    } else {
      /* before init: quiet poster wordmark, no invented lyrics */
      fitLyric('柠檬斜塔');
      elCur.textContent = '';
      elCur.appendChild(chipRow('柠檬斜塔', 0));
    }
    return;
  }
  if (i < 0) {
    /* pre-roll: preview the first line, unlit; state.text stays empty (no line yet) */
    state.text = '';
    elEmpty.classList.add('hide');
    var ptxt = lineText(state.lines[0]);
    fitLyric(ptxt || '···');
    elCur.textContent = '';
    elCur.appendChild(chipRow(ptxt || '···', 0));
    elRule.style.width = '0%';
    curChars = null;
    return;
  }
  elEmpty.classList.add('hide');
  if (!txt) {
    elCur.textContent = '· · ·';
    elCur.style.fontSize = '';
    curChars = null;
    elRule.style.width = '0%';
    return;
  }

  var ft = charTimes(l, i);
  fitLyric(txt);
  elCur.textContent = '';
  elCur.appendChild(chipRow(txt, ft));
  curChars = ft;
  paintChars();
}

/* shrink long lines so they never overflow; no measurement loop, pure arithmetic */
function fitLyric(txt) {
  var n = Math.max(1, txt.length);
  var w = isFinite(view.w) && view.w > 0 ? view.w : 1440;
  var base = clamp(w * 0.052, 23, 74);
  var fit = (w * 0.86) / (n * 1.04);
  var fs = Math.min(base, Math.max(15, fit));
  elCur.style.fontSize = fs.toFixed(1) + 'px';
}

function chipRow(txt, ft) {
  var frag = document.createDocumentFragment();
  var i, n = Math.min(txt.length, 400);
  var timed = Array.isArray(ft) && ft.length >= n;
  for (i = 0; i < n; i++) {
    var sp = document.createElement('span');
    sp.className = 'ch';
    var ch = timed ? ft[i].c : txt.charAt(i);
    sp.textContent = ch === '' || ch === ' ' ? (ch === ' ' ? '\u00a0' : '\u00a0') : ch;
    sp.style.opacity = '0.30';
    sp.style.transform = 'translateY(.10em)';
    frag.appendChild(sp);
  }
  return frag;
}

/* light up the characters already sung (called every frame, cheap) */
var litCount = -1;
function paintChars() {
  var ft = curChars;
  if (!ft || !elCur.firstChild || state.idx < 0) { return; }
  var t = state.t, i, n = ft.length;
  var cnt = 0;
  for (i = 0; i < n; i++) { if (ft[i].t <= t + 0.001) { cnt++; } else { break; } }
  if (cnt === litCount) { return; }
  litCount = cnt;
  var kids = elCur.children, last = -1;
  for (i = 0; i < kids.length; i++) {
    var k = kids[i];
    if (i < cnt) {
      if (k.style.opacity !== '1') {
        k.style.opacity = '1';
        k.style.transform = 'translateY(0)';
        last = i;
      }
    } else {
      k.style.opacity = GHOST;
      k.style.transform = 'translateY(.10em)';
    }
  }
  if (last >= 0) { popChar(kids[last]); }
  var p = n ? clip01(cnt / n) : 0;
  elRule.style.width = (p * 100).toFixed(1) + '%';
}
/* unlit chars stay clearly legible (ghosted ink, not invisible) */
var GHOST = '0.30';
function clip01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function popChar(el) {
  if (!el.animate || view.rm) { return; }
  try {
    el.animate(
      [{ transform: 'translateY(.14em) scale(.86)' }, { transform: 'translateY(0) scale(1.06)' },
       { transform: 'translateY(0) scale(1)' }],
      { duration: 260, easing: 'cubic-bezier(.2,.9,.3,1.4)' }
    );
  } catch (e) { /* animation API is best-effort only */ }
}
/* ---------- messages ---------- */
function onInit(p) {
  p = p || {};
  state.gotInit = true;
  var lines = Array.isArray(p.lines) ? p.lines : [];
  state.lines = lines.slice(0, 4000);
  state.dur = clamp(p.duration, 0, 1e6);
  var acc = p.accent;
  if (Array.isArray(acc) && acc.length >= 3) {
    state.accent = [clamp(acc[0], 0, 255), clamp(acc[1], 0, 255), clamp(acc[2], 0, 255)];
    applyAccent();
  }
  if (typeof p.playing === 'boolean') { state.playing = p.playing; }
  state.idx = findIdx(state.t);
  curIdx = -2; curLine = null; curLineRef = null; curChars = null; litCount = -1;
  paintLyric();
}

function onTick(p) {
  p = p || {};
  state.t = clamp(p.time, -1, 1e6);
  if (typeof p.playing === 'boolean') { state.playing = p.playing; }
  var i = findIdx(state.t);
  if (i !== state.idx) { state.idx = i; paintLyric(); }
}

window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || d.__c100 !== 1) { return; }
  try {
    if (d.type === 'init') { onInit(d.payload); }
    else if (d.type === 'tick') { onTick(d.payload); }
    else if (d.type === 'beat') { onBeat(d.payload); }
    else if (d.type === 'live') { onLive(d.payload); }
  } catch (e) {
    lastErr = String(e && e.message || e);
    console.error('[436] message handler', e);
  }
}, false);

/* ---------- audio reactivity ---------- */
var beatLv = 0, beatImp = 0, liveLv = 0, liveBass = 0, liveMid = 0, liveTreb = 0, liveBpm = 0;
function onBeat(p) {
  p = p || {};
  beatLv = clamp(p.level, 0, 1);
  beatImp = 1;
  /* a little pop on the beat, if allowed (animation drives opacity; rest state stays 0) */
  if (!view.rm && pops.length) {
    var el = pops[(clamp(p.index, 0, 1e9) | 0) % pops.length];
    if (el && el.animate) {
      try {
        el.animate([{ transform: 'scale(.35)', opacity: 1 }, { transform: 'scale(2.2)', opacity: 0 }],
                   { duration: 620, easing: 'ease-out' });
      } catch (e) { console.error('[436] pop', e); }
    }
  }
}
function onLive(p) {
  p = p || {};
  liveLv = clamp(p.level, 0, 1);
  liveBass = clamp(p.bass, 0, 1);
  liveMid = clamp(p.mid, 0, 1);
  liveTreb = clamp(p.treble, 0, 1);
  liveBpm = clamp(p.bpm, 0, 400);
  if (typeof p.playing === 'boolean') { state.playing = p.playing; }
}

/* ---------- accent tinting (kept light so lyrics stay readable) ---------- */
function toHex(a) {
  var s = '#', i, v;
  for (i = 0; i < 3; i++) {
    v = clamp(a[i], 0, 255) | 0;
    s += (v < 16 ? '0' : '') + v.toString(16);
  }
  return s;
}
function applyAccent() {
  var a = state.accent, blend = [0, 0, 0], hit = [0, 0, 0], i;
  /* pull the cover colour far toward paper: tint, never darken the text field */
  for (i = 0; i < 3; i++) {
    blend[i] = Math.round(a[i] * 0.42 + 246 * 0.58);
    hit[i] = Math.round(a[i] * 0.72 + 60 * 0.28);
  }
  document.documentElement.style.setProperty('--accSoft', toHex(blend));
  var tint = document.getElementById('tint');
  if (tint) { tint.setAttribute('fill', toHex(blend)); }
  var accentDots = document.querySelectorAll('.hit');
  for (i = 0; i < accentDots.length; i++) { accentDots[i].setAttribute('fill', toHex(hit)); }
}

/* ---------- main loop ---------- */
var baseBarH = 20, maxBarH = 132;
function loop() {
  var t0 = performance.now();
  frames++;
  try {
    if (bars.length) {
      /* decay the beat impulse, then drive bar heights from live levels + time */
      if (beatImp > 0.001) { beatImp *= view.rm ? 0.82 : 0.90; }
      var lv = Math.max(liveLv * 0.75, beatImp * beatLv);
      var phase = state.t * Math.max(1, liveBpm / 60);
      for (var i = 0; i < bars.length; i++) {
        var wv = Math.sin(phase * 2.2 + i * 0.62);
        var hh = baseBarH + (maxBarH - baseBarH) *
                 clip01(lv * (0.55 + 0.45 * (wv * 0.5 + 0.5)) + liveBass * 0.10);
        var b = bars[i];
        b.setAttribute('y', (900 - 46 - hh).toFixed(1));
        b.setAttribute('height', hh.toFixed(1));
      }
    }
    if (state.lines.length) { paintChars(); }
  } catch (e) {
    lastErr = String(e && e.message || e);
    if (frames % 60 === 0) { console.error('[436] frame', e); }
  }
  jsMs = performance.now() - t0;
  requestAnimationFrame(loop);
}

/* ---------- responsive rebuild ---------- */
var rszT = 0;
function resize() {
  var w = window.innerWidth || 0, h = window.innerHeight || 0;
  if (!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) { w = 1440; h = 900; }
  view.w = w; view.h = h;
  try { buildArt(); applyAccent(); }
  catch (e) { lastErr = String(e && e.message || e); console.error('[436] buildArt', e); }
  curIdx = -2; curLine = null; curLineRef = null; curChars = null; litCount = -1;
  paintLyric();
}
window.addEventListener('resize', function () {
  clearTimeout(rszT);
  rszT = setTimeout(resize, 120);
}, false);

/* ---------- boot ---------- */
try {
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  view.rm = !!(mq && mq.matches);
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) { view.rm = !!e.matches; document.body.classList.toggle('rm', view.rm); });
  }
  document.body.classList.toggle('rm', view.rm);
} catch (e) { console.error('[436] motion query', e); }

/* first rAF: paint, then report ready unconditionally */
requestAnimationFrame(function () {
  frames++;
  try { resize(); } catch (e) { console.error('[436] first paint', e); }
  sendReady();
  requestAnimationFrame(loop);
});
setTimeout(sendReady, 700);
</script>
</body>
</html>
