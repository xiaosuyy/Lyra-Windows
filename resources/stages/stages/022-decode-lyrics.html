<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乱码解码</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06070b}
  #bg{position:fixed;inset:0;background:radial-gradient(1000px 700px at 50% 46%,#0c0e18,#05060a 70%)}
  /* bg 比 viewport 大一圈：整场慢漂移不露边 */
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #kicker{font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.46em;
          color:rgba(77,84,112,.9);text-transform:uppercase;margin-bottom:11vh;height:11px}
  #stage{position:relative;width:100%;height:0}
  /* 一句 = 最多 3 行的网格。字号按最长行自适应，行内 nowrap 安全 */
  .line{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);text-align:center;
        font:700 clamp(17px,3.5vw,40px)/1.5 ui-monospace,Consolas,
        "Sarasa Mono SC","Courier New",monospace;letter-spacing:0}
  .lrow{display:block;white-space:nowrap}
  .ch{display:inline-block;width:1.06em;text-align:center;color:#6d7594;
      transition:color .3s ease,text-shadow .3s ease}
  .ch.lock{color:#eef1ff;text-shadow:0 0 18px rgba(125,145,255,.45)}
  .ch.flash{color:#fff;text-shadow:0 0 30px rgba(150,170,255,.9)}
  #beam{position:absolute;top:0;bottom:0;width:2px;opacity:0;
        background:linear-gradient(180deg,rgba(125,145,255,0),rgba(150,170,255,.95),rgba(125,145,255,0));
        box-shadow:0 0 22px rgba(125,145,255,.75)}
  #meta{margin-top:11vh;font:500 11px/1 ui-monospace,Consolas,monospace;
        letter-spacing:.28em;color:rgba(69,75,99,.95);height:11px}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(175,190,255,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<div id="bg"></div>
<div id="wrap">
  <div id="kicker">decoding</div>
  <div id="stage">
    <div class="line" id="lineA"></div>
    <div class="line" id="lineB"></div>
  </div>
  <div id="meta"></div>
</div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   022 · 乱码解码 —— 一条**从左向右推进的锁定前沿**
   ----------------------------------------------------------------------------
   和已有 10 个形态的区别：没有粒子、没有物理。屏幕上只有字符，
   动的是「哪些字符还是噪声」。每句一进场，整行都是乱码，
   然后一条锁线从行首扫到行尾：线扫过的字符**当场定住**，线前面的还在闪。
   和 021 的区别：021 是垂直滚轮逐字落位（字符从上方滑进来），
   这里是水平扫描逐列锁定（字符原地闪替 + 一道扫描光束跟着前沿走）。

   精修记录（批次B）：① **逐字 YRC 锁定** —— 第 k 个字符的锁定时刻压在
   chars[k].t 上（预备期该格继续闪乱码，锁定瞬间换真字+闪光）；无 chars 按
   t + dur*i/n 均分。② 扫描光带位置 = 实测锁定进度（最近锁定的格的屏幕位置），
   不再是按时间假推。③ 长句排版 —— nowrap 单行改为自适应字号 + 最多 3 行折行，
   行内改用网格宽度测字，任何字数完整可见。④ 动效：整场慢漂移镜头（bg 平移
   + 微缩放）、accent 主色接进锁定字的光晕与光带颜色、beat 相干脉冲保留。
   分词：**未接入** —— 本形态的节奏骨架是"逐格依次锁定"，YRC 逐字时刻
   天然就是按字推进的节奏，词团分组反而会破坏扫描前沿的连续性。
   ========================================================================== */
const lineA = document.getElementById('lineA');
const lineB = document.getElementById('lineB');
const hint  = document.getElementById('hint');
const meta  = document.getElementById('meta');
const kicker = document.getElementById('kicker');
const bgEl  = document.getElementById('bg');

const POOL = "日月水火木金土气光尘影风烟云雨天地玄黄宇宙洪荒时空01#$%&@*+=<>/\\|~^░▒▓█";
const pick = () => POOL[(Math.random() * POOL.length) | 0];

let accent = [125, 145, 255];
let lines = [];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

const A = { el: lineA, chars: [], beam: null, text: '', active: 0, yrc: false, _mx: -1, _my: -1 };
const B = { el: lineB, chars: [], beam: null, text: '', active: 0, yrc: false, _mx: -1, _my: -1 };
let cur = A, nxt = B;
let lastT = -1, beat = 0, entered = false, drift = 0;
let lastMeta = '';

function makeBeam(slot) {
  const b = document.createElement('div');
  b.id = 'beam';
  slot.el.appendChild(b);
  slot.beam = b;
  return b;
}
makeBeam(A); makeBeam(B);

/* ---------- 排版规划：自适应字号 + 最多 3 行 ---------- */
const meas = document.createElement('canvas').getContext('2d');
const CW = 1.06;                                   // .ch 的 em 宽
const w100 = (t) => { meas.font = '100px ui-monospace,Consolas,monospace'; return t.length * 100 * CW; };
const BREAK = /[\s，。！？、；：,.!?;:…—～·「」『』（）()《》【】]/;

function splitRows(text, R) {
  const L = text.length, rows = [];
  let prev = 0;
  for (let r = 1; r < R; r++) {
    const ideal = prev + Math.max(1, Math.round((L - prev) / (R - r + 1)));
    let i = ideal;
    for (const d of [0, 1, 2, 3, -1, -2, -3]) {
      const j = ideal + d;
      if (j > prev && j < L && (BREAK.test(text[j - 1]) || BREAK.test(text[j]))) { i = j; break; }
    }
    i = Math.max(prev + 1, Math.min(L - (R - r), i));
    rows.push(text.slice(prev, i));
    prev = i;
  }
  rows.push(text.slice(prev));
  return rows;
}
function best2(text) {
  let bi = -1, bw = Infinity;
  for (let i = 1; i < text.length; i++) {
    const m = Math.max(w100(text.slice(0, i)), w100(text.slice(i)))
      - ((BREAK.test(text[i - 1]) || BREAK.test(text[i])) ? 1e5 : 0);
    if (m < bw) { bw = m; bi = i; }
  }
  return bi > 0 ? [text.slice(0, bi), text.slice(bi)] : [text];
}
function planLayout(text) {
  const base = Math.min(40, Math.max(17, innerWidth * 0.035));
  if (!text) return { fs: base, rows: [''] };
  const maxW = innerWidth * 0.90;
  const maxH = innerHeight * 0.46;
  const fsFor = (rows) => {
    let mw = 1;
    for (const r of rows) mw = Math.max(mw, w100(r));
    return Math.min(base, maxW * 100 / mw, maxH / (1.5 * rows.length) * (100 / 100));
  };
  /* 单行字号一旦低于 0.78×base 就折行 —— 长句宁可折 2~3 行也不压成蚂蚁字 */
  const floor = base * 0.78;
  const one = [text];
  const f1 = fsFor(one);
  if (f1 >= floor) return { fs: f1, rows: one };
  const two = text.length > 3 ? best2(text) : one;
  const f2 = fsFor(two);
  if (f2 >= floor || text.length <= 8) return { fs: Math.max(14, f2), rows: two };
  const three = splitRows(text, 3);
  const f3 = fsFor(three);
  return f2 >= f3 ? { fs: Math.max(14, f2), rows: two } : { fs: Math.max(14, f3), rows: three };
}

function build(slot, text) {
  const plan = planLayout(text);
  slot.text = text;
  slot.chars.length = 0;
  /* 移除旧字符格（beam 和 .lrow 之外的都算），beam 本身保留 */
  for (const node of Array.from(slot.el.childNodes)) if (node !== slot.beam) node.remove();
  slot.el.style.fontSize = plan.fs.toFixed(1) + 'px';
  for (let r = 0; r < plan.rows.length; r++) {
    const row = document.createElement('div');
    row.className = 'lrow';
    const rt = plan.rows[r];
    for (let i = 0; i < rt.length; i++) {
      const sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = pick();
      row.appendChild(sp);
      slot.chars.push({ el: sp, raw: rt[i], lock: 1e9, next: 0, settled: false, flash: 0 });
    }
    slot.el.insertBefore(row, slot.beam);
  }
}

/** 让一句开始解码：每个字符的锁定时刻独立排定。
    YRC：lock = chars[k].t（预备期继续闪乱码）；无 chars：t0 + span*i/n 均分 */
function arm(slot, t0, t1, line) {
  const n = slot.chars.length;
  if (!n) return;
  slot.active = 1;
  const chs = line && line.chars && line.chars.length === slot.text.length ? line.chars : null;
  slot.yrc = !!chs;
  const end = isFinite(t1) ? t1 : t0 + Math.max(0.8, (line && line.dur) || 2.4);
  let prev = 0;
  for (let i = 0; i < n; i++) {
    const c = slot.chars[i];
    let t = chs && isFinite(+chs[i].t) ? +chs[i].t
          : t0 + (end - t0) * (i / n);
    if (!(t >= t0)) t = t0;
    if (t > end) t = end;
    if (i && t < prev) t = prev;
    prev = t;
    c.lock = t;
    c.settled = false;
    c.flash = 0;
    c.next = 0;
    c.el.textContent = pick();
    c.el.className = 'ch';
  }
  slot.beam.style.opacity = '0.9';
  slot._mx = -1; slot._my = -1;
}

function hide(slot) {
  slot.active = 0;
  slot.el.style.transition = 'transform .42s cubic-bezier(.4,0,.7,.4),opacity .42s ease,filter .42s ease';
  slot.el.style.transform = 'translate(-50%,-190%)';
  slot.el.style.opacity = '0';
  slot.el.style.filter = 'blur(7px)';
  slot.beam.style.opacity = '0';
}

function clearAll() {
  for (const s of [A, B]) {
    for (const node of Array.from(s.el.childNodes)) if (node !== s.beam) node.remove();
    s.chars.length = 0;
    s.text = '';
    s.active = 0;
    s.yrc = false;
    s.beam.style.opacity = '0';
  }
  cur = A; nxt = B;
  A.el.style.transition = 'none'; A.el.style.opacity = '0'; A.el.style.filter = 'none';
  A.el.style.transform = 'translate(-50%,-50%)';
  B.el.style.transition = 'none'; B.el.style.opacity = '0'; B.el.style.filter = 'none';
  B.el.style.transform = 'translate(-50%,-50%)';
  meta.textContent = '';
  lastMeta = '';
  entered = false;
}

function animate(slot, T, dt) {
  if (!slot.active) return;
  const ch = slot.chars;
  const n = ch.length;
  /* 光带跟随实测锁定进度：找最后一个已锁定的格，用它相对行首的横向比例定位 */
  let lastLocked = -1;
  for (let i = 0; i < n; i++) {
    const c = ch[i];
    if (c.settled) { lastLocked = i; continue; }
    if (T >= c.lock) {
      c.el.textContent = c.raw === ' ' ? '\u00A0' : c.raw;
      c.el.className = 'ch lock flash';
      c.settled = true;
      c.flash = 0.26;
      lastLocked = i;
      continue;
    }
    /* 前沿之前：原地闪替。刷新间隔随距离锁定时刻的远近收窄，越近越急 */
    if (T >= c.next) {
      c.el.textContent = pick();
      const near = Math.max(0, Math.min(1, 1 - (c.lock - T) / 0.9));
      c.next = T + 0.085 - 0.045 * near;
    }
  }
  /* 光束横跨整个 .line 宽度，按已锁定格的位置推进 */
  if (lastLocked >= 0 && n) {
    const elr = slot.el.getBoundingClientRect();
    const r = ch[lastLocked].el.getBoundingClientRect();
    const span = Math.max(1, elr.width);
    const x = Math.min(1, Math.max(0, (r.left - elr.left + r.width) / span));
    if (T < ch[n - 1].lock + 0.3) {
      const px = (x * 100).toFixed(2);
      if (px !== slot._mx) { slot._mx = px; slot.beam.style.left = px + '%'; }
      const op = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(T * 26))).toFixed(3);
      if (op !== slot._my) { slot._my = op; slot.beam.style.opacity = op; }
    } else if (slot.beam.style.opacity !== '0') {
      slot.beam.style.opacity = '0';
      slot._my = '0';
    }
  }
  /* 闪光余辉衰减：只碰还亮着的 */
  for (let i = 0; i < n; i++) {
    const c = ch[i];
    if (c.flash <= 0) continue;
    c.flash -= dt;
    if (c.flash <= 0) { c.el.className = 'ch lock'; c.flash = 0; }
  }
}

/* ================= 节奏：1-10 的教训固化在这里 =================
   ① 显示与酝酿分离 —— curIdx 只在句首切换，brewIdx 提前 lead 秒准备
   ② 索引单调不回退 —— 时钟在 tick 之间外推、tick 一来会往回缩一点
   ③ 提前量自适应 —— 快歌早开始，慢歌不提前太多
   ④ 只有拖进度条（时间明显倒退）才允许重置
   ================================================================ */
let curIdx = -1, brewIdx = -1;
const LEAD = 1.3;
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) { curIdx = -1; brewIdx = -1; clearAll(); }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    if (ci >= 0) {
      const old = cur;
      cur = nxt; nxt = old;
      hide(nxt);
      const ln = lines[ci];
      const text = ln.text || '';
      /* 第一句（以及没经过酝酿的句）切进来时槽位是空的 —— 在这里补 build */
      if (cur.text !== text) build(cur, text);
      const end = ci + 1 < lines.length ? lines[ci + 1].t : ln.t + Math.max(1.2, ln.dur || 2.4) * 1.5;
      arm(cur, ln.t, end - 0.12, ln);
      cur.el.style.transition = 'none';
      cur.el.style.opacity = '1';
      cur.el.style.filter = 'none';
      cur.el.style.transform = 'translate(-50%,-50%) translateY(34px)';
      void cur.el.offsetWidth;
      cur.el.style.transition = 'transform .5s cubic-bezier(.16,.84,.30,1)';
      cur.el.style.transform = 'translate(-50%,-50%)';
      kicker.textContent = 'decoding · ' + String(ci + 1).padStart(2, '0') + '/' +
                           String(lines.length).padStart(2, '0');
      entered = true;
      hint.style.opacity = '0';
    } else {
      clearAll();
    }
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) {
      brewIdx = nx;
      /* 提前准备：下一句先在下方把乱码铺好，开唱那一刻才升上来开始扫 */
      const text = lines[nx].text || '';
      if (nxt.text !== text) build(nxt, text);
      const end = nx + 1 < lines.length ? lines[nx + 1].t : lines[nx].t + Math.max(1.2, lines[nx].dur || 2.4) * 1.5;
      arm(nxt, lines[nx].t, end - 0.12, lines[nx]);
      nxt.el.style.transition = 'none';
      nxt.el.style.transform = 'translate(-50%,-50%) translateY(' + (38 + 30 * (nx % 2 ? 1 : -1)) + 'px)';
      nxt.el.style.opacity = '0.30';
      nxt.el.style.filter = 'blur(2px)';
    }
  }
}

let last = performance.now();
let lastBeat = -1;
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs;
  const T = now();
  timing(T);

  beat *= Math.exp(-dt * 5.4);
  drift += dt;
  animate(cur, T, dt);

  const ch = cur.chars;
  const m = 'DECODED ' + String(ch.length - ch.filter((c) => !c.settled).length).toString().padStart(3, '0') +
            ' / ' + String(ch.length).padStart(3, '0');
  if (m !== lastMeta) { lastMeta = m; meta.textContent = m; }

  /* 踩拍：整行一起亮一下（相干）；样式只在数值变化时写 */
  const db = Math.abs(beat - lastBeat) > 0.012;
  lastBeat = beat;
  if (cur.active && db) {
    const g = 0.30 + 0.45 * beat;
    cur.el.style.textShadow = '0 0 ' + (12 + 26 * beat).toFixed(0) + 'px rgba(' +
      Math.min(255, accent[0] + 30) + ',' + Math.min(255, accent[1] + 25) + ',' +
      Math.min(255, accent[2] + 15) + ',' + g.toFixed(3) + ')';
  }
  /* 整场慢漂移镜头：bg 缓慢平移 + 微缩放，accent 染在镜头上 */
  if (drift > 0) {
    const bx = Math.sin(drift * 0.10) * 12, by = Math.cos(drift * 0.071) * 7;
    bgEl.style.transform = 'translate(' + bx.toFixed(2) + 'px,' + (by + 3.0 * beat).toFixed(2) + 'px)' +
                           ' scale(' + (1.03 + 0.012 * Math.sin(drift * 0.05)).toFixed(4) + ')';
  }

  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  if (curIdx >= 0 && cur.text) {
    build(cur, cur.text);
    const ln = lines[curIdx];
    const end = curIdx + 1 < lines.length ? lines[curIdx + 1].t : ln.t + Math.max(1.2, ln.dur || 2.4) * 1.5;
    arm(cur, Math.max(ln.t, now()), end - 0.12, ln);
  }
  if (brewIdx >= 0 && nxt.text && brewIdx !== curIdx) {
    build(nxt, nxt.text);
    const ln = lines[brewIdx];
    const end = brewIdx + 1 < lines.length ? lines[brewIdx + 1].t : ln.t + Math.max(1.2, ln.dur || 2.4) * 1.5;
    arm(nxt, Math.max(ln.t, now()), end - 0.12, ln);
    nxt.el.style.transition = 'none';
    nxt.el.style.transform = 'translate(-50%,-50%) translateY(38px)';
    nxt.el.style.opacity = '0.30';
    nxt.el.style.filter = 'blur(2px)';
  }
});

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1;
    if (p.accent) accent = p.accent;
    clearAll();
    clockT = 0; clockAt = performance.now();
    kicker.textContent = 'decoding';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 踩拍：相干 —— 整行一起亮、光束一起变粗 */
    beat = Math.min(1.4, beat + 0.35 + 0.65 * (d.payload.level || 0));
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

requestAnimationFrame(frame);
window.__stage = () => ({ lines: lines.length, curIdx, brewIdx, T: +now().toFixed(2),
  left: cur.chars.filter((c) => !c.settled).length, yrc: !!cur.yrc });
</script>
</body>
</html>
