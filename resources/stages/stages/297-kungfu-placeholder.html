<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>功夫占位</title>
<!-- 297 · 占位形态：只用来确认「新编号能不能出现在播放器里」 -->
<style>
  html,body{margin:0;height:100%;background:#f5c400;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #tag{position:fixed;left:26px;top:20px;color:#c8102e;font:900 15px/1.3 ui-monospace,monospace;
    letter-spacing:.22em;z-index:3}
  #big{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:3;
    font-weight:900;font-size:clamp(30px,7vw,96px);color:#c8102e;letter-spacing:.06em;
    text-shadow:6px 6px 0 #111;white-space:nowrap}
  #lyr{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:3;width:92%;
    text-align:center;font-weight:900;font-size:clamp(20px,3.4vw,52px);color:#fff;
    letter-spacing:.04em;text-shadow:0 3px 0 #111,0 0 22px rgba(0,0,0,.6)}
  #lyr span{opacity:.34}
  #lyr span.on{opacity:1}
  #hint{position:fixed;left:50%;bottom:5%;transform:translateX(-50%);z-index:3;
    font:500 12px/1.5 ui-monospace,monospace;letter-spacing:.16em;color:rgba(17,17,17,.55)}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="tag">SHAN / 297 — PLACEHOLDER</div>
<div id="big">297 占位</div>
<div id="lyr"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
const cv = document.getElementById('c');
const lyrEl = document.getElementById('lyr');
const hint = document.getElementById('hint');
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
let W=1,H=1,PR=1, lines=[], idx=-1, clockT=0, clockAt=0, playing=false, vT=0;
let beatPulse=0, frames=0, jsMs=0, errMsg='', readySent=false, dirty=true, raf=0;
let RM=false;
try{ const mq=window.matchMedia('(prefers-reduced-motion: reduce)'); RM=!!mq.matches; }catch(_){}

function resize(){
  W=Math.max(2,innerWidth); H=Math.max(2,innerHeight); PR=Math.min(1.5,devicePixelRatio||1);
  cv.width=Math.round(W*PR); cv.height=Math.round(H*PR); dirty=true;
}
addEventListener('resize',()=>{ clearTimeout(resize._t); resize._t=setTimeout(resize,120); });

const gl = cv.getContext('webgl2') || cv.getContext('webgl');
const ctx2 = gl ? null : cv.getContext('2d');

function draw(){
  if(gl){
    gl.viewport(0,0,cv.width,cv.height);
    gl.clearColor(0.96,0.77,0.0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  } else if(ctx2){
    ctx2.setTransform(PR,0,0,PR,0,0);
    ctx2.fillStyle='#f5c400'; ctx2.fillRect(0,0,W,H);
    ctx2.fillStyle='rgba(200,16,46,.10)';
    for(let y=0;y<H;y+=26){ ctx2.fillRect(0,y,W,2); }
    ctx2.fillStyle='rgba(17,17,17,.08)';
    for(let i=0;i<40;i++) ctx2.fillRect((i*97)%W, (i*61)%H, 3, 3);
  }
}

function renderLine(i){
  const L = lines[i];
  if(!L){ lyrEl.innerHTML=''; return; }
  const txt = String(L.text||'');
  lyrEl.innerHTML='';
  for(const ch of Array.from(txt)){
    const s=document.createElement('span');
    s.textContent = ch===' ' ? '\u00a0' : ch;
    lyrEl.appendChild(s);
  }
  hint.style.opacity='0';
}

let last=performance.now();
function frame(ms){
  const js0=performance.now();
  const dt=Math.min(0.05,Math.max(0,(ms-last)/1000)); last=ms; frames++;
  const T=now(); vT = RM ? T*0.24 : T;
  if(playing) beatPulse *= Math.exp(-dt*3.6);
  let ci=-1;
  for(let k=lines.length-1;k>=0;k--){ if(T>=lines[k].t){ ci=k; break; } }
  if(ci!==idx){ idx=ci; if(ci<0){ lyrEl.innerHTML=''; hint.style.opacity='.9'; } else renderLine(ci); dirty=true; }
  if(idx>=0 && lines[idx]){
    const L=lines[idx], n=lyrEl.children.length;
    const dur=Math.max(0.8,(L.dur==null?4:+L.dur));
    const cs=L.chars;
    for(let k=0;k<n;k++){
      let t;
      if(cs && cs.length){ const j=Math.min(cs.length-1,Math.floor(k*cs.length/n)); t=(cs[j]&&cs[j].t!=null)?+cs[j].t:(L.t+dur*0.88*k/n); }
      else t=L.t+dur*0.88*k/n;
      lyrEl.children[k].className = (T>=t)?'on':'';
    }
  }
  try{ if(playing||dirty){ draw(); dirty=false; } }catch(e){ errMsg='draw: '+(e&&e.message||e); }
  if(!readySent){ readySent=true; try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(_){} }
  jsMs=performance.now()-js0;
  raf=requestAnimationFrame(frame);
}

addEventListener('message',(e)=>{
  const d=e.data; if(!d || d.__c100!==1) return;
  if(d.type==='init'){
    const p=d.payload||{};
    lines=(p.lines||[]).slice().sort((a,b)=>a.t-b.t);
    idx=-1; vT=0; beatPulse=0; clockT=0; clockAt=performance.now(); playing=true;
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length?'.9':'.5';
    lyrEl.innerHTML='';
    dirty=true;
  } else if(d.type==='tick'){ clockT=d.payload.time; clockAt=performance.now(); playing=!!d.payload.playing; dirty=true; }
  else if(d.type==='beat'){ beatPulse=Math.min(1,beatPulse+0.32+(d.payload.level||0)*0.5); dirty=true; }
});

window.__stage = () => ({
  lines: lines.length, idx, t:+now().toFixed(2), playing, frames,
  js:+jsMs.toFixed(2), err: errMsg, text:(idx>=0&&lines[idx])?lines[idx].text:'',
  gl: !!gl || !!ctx2, rm: RM
});

resize(); draw();
raf=requestAnimationFrame(frame);
</script>
</body>
</html>
