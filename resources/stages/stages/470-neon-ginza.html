<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>470</title>
<style>
  :root{ --acc:#d6608a; --cream:#f7e9d0; --vermilion:#d8452f; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#080405; }
  body{ font-family:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",serif;
        -webkit-font-smoothing:antialiased; }
  #stage{ position:fixed; inset:0; overflow:hidden; background:#080405; }
  #bg{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ---- 竖排歌名（一角行书招牌） ---- */
  #title{
    position:absolute; top:9vh; right:5.2vw; z-index:3;
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:clamp(19px,2.5vw,42px); letter-spacing:.3em; line-height:1.15;
    color:#ffe0ec; opacity:.95; max-height:66vh; overflow:hidden;
    text-shadow:0 0 9px rgba(255,124,178,.8), 0 0 26px rgba(206,42,108,.55), 0 0 46px rgba(120,20,70,.5);
    pointer-events:none;
  }
  #title .art{ display:block; margin-top:.9em; font-size:.34em; letter-spacing:.5em; color:rgba(255,224,236,.62);
    text-shadow:0 0 10px rgba(255,110,160,.5); }
  #seal{
    position:absolute; right:5.6vw; bottom:11vh; z-index:3; width:clamp(26px,2.4vw,40px);
    aspect-ratio:1/1; border:1.5px solid rgba(216,69,47,.85); border-radius:2px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-size:clamp(10px,.82vw,14px); line-height:1.02; letter-spacing:.05em;
    color:rgba(255,150,120,.92); background:rgba(120,26,18,.28);
    text-shadow:0 0 8px rgba(255,90,60,.6); opacity:.85; pointer-events:none;
  }

  /* ---- 歌词区 ---- */
  #lyrics{ position:absolute; inset:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 7vw; }
  #lyrics::before{ content:""; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(96deg, rgba(6,3,5,.86) 0%, rgba(6,3,5,.62) 42%, rgba(6,3,5,.14) 68%, rgba(6,3,5,0) 84%);
  }
  #lyricInner{ width:min(56%,720px); max-width:100%; }
  .cur{
    font-size:clamp(23px,3.15vw,54px); line-height:1.62; letter-spacing:.055em;
    color:var(--cream); text-wrap:balance;
    transition:opacity .5s ease, transform .6s cubic-bezier(.2,.7,.3,1), filter .5s ease;
    text-shadow:0 2px 12px rgba(0,0,0,.95);
  }
  .cur.fade{ animation:lnIn .72s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes lnIn{
    from{ opacity:0; transform:translate3d(0,14px,0); filter:blur(3px); }
    to{ opacity:1; transform:translate3d(0,0,0); filter:blur(0); }
  }
  .cur .ch{
    color:rgba(247,233,208,.38);
    text-shadow:0 2px 10px rgba(0,0,0,.9);
    transition:color .3s ease, text-shadow .3s ease;
  }
  .cur .ch.on{
    color:#fffaef;
    text-shadow:0 0 12px rgba(255,206,224,.55), 0 0 30px rgba(226,96,150,.42), 0 2px 9px rgba(0,0,0,.95);
  }
  .cur .ch.lead{ color:rgba(255,244,222,.74); }

  /* 招牌的呼吸与偶发接触不良 */
  #title{ animation:signBreath 5.2s ease-in-out infinite; }
  #title.hit{ animation:signHit .34s steps(3,end) 1; }
  @keyframes signBreath{
    0%,100%{ opacity:.9; filter:brightness(1); }
    48%{ opacity:1; filter:brightness(1.12); }
  }
  @keyframes signHit{
    0%{ opacity:.35; filter:brightness(.6); }
    40%{ opacity:1; filter:brightness(1.35); }
    62%{ opacity:.5; filter:brightness(.7); }
    100%{ opacity:.95; filter:brightness(1.05); }
  }
  @media (prefers-reduced-motion: reduce){
    #title{ animation:none; }
    .cur.fade{ animation:none; }
    .cur .ch{ transition:none; }
  }
  .side{
    font-size:clamp(12px,1.32vw,21px); line-height:1.9; letter-spacing:.15em;
    color:rgba(247,233,208,.28); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 2px 8px rgba(0,0,0,.9);
  }
  .side.up{ margin-bottom:.9em; }
  .side.down{ margin-top:.85em; }
  #empty{ font-size:clamp(13px,1.5vw,22px); letter-spacing:.6em; color:rgba(247,233,208,.34);
    text-shadow:0 2px 10px rgba(0,0,0,.9); }

  @media (max-width:760px), (orientation:portrait){
    #lyrics{ justify-content:flex-end; padding:0 6vw 17vh; }
    #lyrics::before{ background:linear-gradient(0deg, rgba(6,3,5,.92) 6%, rgba(6,3,5,.62) 44%, rgba(6,3,5,0) 82%); }
    #lyricInner{ width:100%; }
    .cur{ font-size:clamp(21px,6.2vw,38px); letter-spacing:.04em; }
    .side{ font-size:clamp(11px,3.1vw,16px); letter-spacing:.1em; }
    #title{ top:6vh; right:4vw; font-size:clamp(16px,4.4vw,30px); max-height:48vh; }
    #seal{ right:4.4vw; bottom:6vh; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="title"></div>
  <div id="seal"><span>演</span><span>歌</span></div>
  <div id="lyrics">
    <div id="lyricInner">
      <div class="side up" id="lnUp"></div>
      <div class="cur" id="lnCur"></div>
      <div class="side down" id="lnDown"></div>
      <div id="empty"></div>
    </div>
  </div>
</div>
<script>
'use strict';

var S = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
  err: '', gl: false, rm: false,
  accent: [214, 96, 138],
  song: { name: '', artists: '', cover: '' },
  duration: 0, ready: false, lastNow: 0
};

window.__stage = function () {
  var i = S.idx, ln = (i >= 0 && i < S.lines.length) ? S.lines[i] : null;
  return {
    lines: S.lines.length,
    idx: i,
    t: S.t,
    playing: !!S.playing,
    frames: S.frames,
    js: S.js,
    err: S.err,
    text: ln && typeof ln.text === 'string' ? ln.text : '',
    gl: !!S.gl,
    rm: !!S.rm
  };
};

var bg = document.getElementById('bg');
var ctx = bg.getContext('2d', { alpha: true });
var lyricBox = document.getElementById('lyrics');
var W = 0, H = 0, DPR = 1;

function sendReady() {
  if (S.ready) return;
  S.ready = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) { console.error(e); S.err = String(e && e.message || e); }
}

function resize() {
  var w = Math.round(window.innerWidth || 0), h = Math.round(window.innerHeight || 0);
  if (!isFinite(w) || w < 1) w = 1440;
  if (!isFinite(h) || h < 1) h = 900;
  W = w; H = h;
  DPR = Math.min(1.5, Math.max(1, window.devicePixelRatio || 1));
  bg.width = Math.max(2, Math.round(W * DPR));
  bg.height = Math.max(2, Math.round(H * DPR));
  bg.style.width = W + 'px';
  bg.style.height = H + 'px';
}

function normalize(p) {
  var o = p && typeof p === 'object' ? p : {};
  var arr = Array.isArray(o.lines) ? o.lines : [];
  var out = [];
  for (var i = 0; i < arr.length && i < 4000; i++) {
    var L = arr[i];
    if (!L || typeof L !== 'object') { out.push({ t: 0, dur: 0, text: '', chars: null }); continue; }
    var t = Number(L.t);
    out.push({
      t: isFinite(t) ? t : 0,
      dur: Math.max(0, Number(L.dur) || 0),
      text: typeof L.text === 'string' ? L.text : (L.text == null ? '' : String(L.text)),
      chars: Array.isArray(L.chars) ? L.chars : null
    });
  }
  return out;
}

/* ============ 光斑（离屏预渲染，每帧只贴图） ============ */
var SPR = [], STREAK = null, GRAIN = null, PAT = null;
var CACHE = { grad: null, gw: 0, gh: 0, ga: '' };
var ORBS = [], VBOK = { w: 0, h: 0 };
var beatLv = 0, liveLv = 0.35, bassLv = 0.3, trebLv = 0.2, bpm = 92;

function mkCanvas(w, h) {
  w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function rgb2(a, m) {
  var r = S.accent[0], g = S.accent[1], b = S.accent[2];
  // 封面若是暗色/近黑，先抬亮再算霓虹，否则光斑在深底上等于没有
  var lum = 0.299 * r + 0.587 * g + 0.114 * b;
  if (lum < 96) {
    var k = 96 / Math.max(1, lum);
    r *= k; g *= k; b *= k;
  }
  r = Math.round(r + m[0]); g = Math.round(g + m[1]); b = Math.round(b + m[2]);
  return [Math.max(24, Math.min(255, r)), Math.max(18, Math.min(255, g)), Math.max(22, Math.min(255, b))];
}
function makeBokeh(rgb, size) {
  var c = mkCanvas(size, size), g = c.getContext('2d');
  var h = size / 2;
  var col = rgb[0] + ',' + rgb[1] + ',' + rgb[2];
  var grd = g.createRadialGradient(h, h, h * 0.02, h, h, h);
  grd.addColorStop(0, 'rgba(' + col + ',0.92)');
  grd.addColorStop(0.46, 'rgba(' + col + ',0.60)');
  grd.addColorStop(0.74, 'rgba(' + col + ',0.30)');
  grd.addColorStop(0.88, 'rgba(' + col + ',0.34)');
  grd.addColorStop(0.97, 'rgba(' + col + ',0.08)');
  grd.addColorStop(1, 'rgba(' + col + ',0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(h, h, h, 0, 6.2832); g.fill();
  // 镜片边缘的一圈亮环，让虚化更"像镜头"
  g.globalCompositeOperation = 'lighter';
  g.beginPath(); g.arc(h, h, h * 0.885, 0, 6.2832);
  g.lineWidth = Math.max(1, h * 0.035);
  g.strokeStyle = 'rgba(' + col + ',0.22)';
  g.stroke();
  return c;
}
function buildSprites() {
  var tints = [
    [0, 0, 0],            // accent 本尊
    [26, -14, 12],        // 偏暖（金）
    [-86, 40, 56],        // 深玫
    [-92, -52, 58],       // 青（对比霓虹）
    [30, 26, -46],        // 金
    [70, 18, -80],        // 琥珀
    [-40, 26, 86]         // 洋红
  ];
  SPR = [];
  for (var i = 0; i < tints.length; i++) SPR.push(makeBokeh(rgb2(S.accent, tints[i]), 160));

  var sc = mkCanvas(96, 384), sg = sc.getContext('2d');
  var grd = sg.createLinearGradient(48, 0, 48, 384);
  var c0 = rgb2(S.accent, [18, 10, 18]);
  grd.addColorStop(0, 'rgba(' + c0[0] + ',' + c0[1] + ',' + c0[2] + ',0)');
  grd.addColorStop(0.34, 'rgba(' + c0[0] + ',' + c0[1] + ',' + c0[2] + ',0.42)');
  grd.addColorStop(0.58, 'rgba(255,232,240,0.34)');
  grd.addColorStop(0.86, 'rgba(' + c0[0] + ',' + c0[1] + ',' + c0[2] + ',0.22)');
  grd.addColorStop(1, 'rgba(' + c0[0] + ',' + c0[1] + ',' + c0[2] + ',0)');
  sg.fillStyle = grd;
  sg.fillRect(0, 0, 96, 384);
  STREAK = sc;

  GRAIN = mkCanvas(128, 128);
  var gg = GRAIN.getContext('2d');
  var img = gg.createImageData(128, 128), d = img.data;
  for (var n = 0; n < d.length; n += 4) {
    var v = 120 + ((n * 2654435761) % 96);
    d[n] = v; d[n + 1] = v; d[n + 2] = v;
    d[n + 3] = 26 + ((n * 40503) % 34);
  }
  gg.putImageData(img, 0, 0);
}

function seedOrbs() {
  ORBS = [];
  var area = Math.max(1, W) * Math.max(1, H);
  var n = Math.max(14, Math.min(34, Math.round(area / 46000)));
  if (W < 700) n = Math.min(n, 20);
  for (var i = 0; i < n; i++) {
    var depth = 0.24 + Math.random() * 0.76;
    ORBS.push({
      x: Math.random(),
      y: Math.random(),
      r: (0.028 + Math.random() * 0.075) * (0.6 + depth * 0.85),
      a: 0.16 + Math.random() * 0.42,
      vx: (Math.random() - 0.5) * 0.006,
      vy: -(0.004 + Math.random() * 0.010) * depth,
      sp: 0.35 + Math.random() * 1.1,
      ph: Math.random() * 6.2832,
      wob: 0.004 + Math.random() * 0.02,
      s: (Math.random() * SPR.length) | 0,
      depth: depth,
      hue: Math.random()
    });
  }
  VBOK = { w: W, h: H };
}

function drawBokeh(time, dt) {
  var spd = S.rm ? 0.12 : 1;
  var pulse = 1 + beatLv * 0.18 + liveLv * 0.06 + bassLv * 0.05;
  var cw = W, ch = H;
  var base = Math.min(cw, ch * 1.15);

  ctx.globalCompositeOperation = 'source-over';
  // 底部湿润街面的柔光底（渐变缓存，避免每帧重建）
  if (!CACHE.grad || CACHE.gw !== cw || CACHE.gh !== ch || CACHE.ga !== S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2]) {
    var a0 = rgb2(S.accent, [-46, -24, 2]);
    var g0 = ctx.createLinearGradient(0, ch * 0.56, 0, ch);
    g0.addColorStop(0, 'rgba(' + a0[0] + ',' + a0[1] + ',' + a0[2] + ',0)');
    g0.addColorStop(1, 'rgba(' + a0[0] + ',' + a0[1] + ',' + a0[2] + ',0.22)');
    CACHE.grad = g0; CACHE.gw = cw; CACHE.gh = ch;
    CACHE.ga = S.accent[0] + ',' + S.accent[1] + ',' + S.accent[2];
  }
  ctx.fillStyle = CACHE.grad;
  ctx.fillRect(0, ch * 0.56, cw, ch * 0.44);

  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < ORBS.length; i++) {
    var o = ORBS[i];
    o.y += o.vy * dt * spd;
    o.x += o.vx * dt * spd;
    if (o.y < -0.2) { o.y = 1.2; o.x = Math.random(); }
    if (o.x < -0.22) o.x = 1.22; else if (o.x > 1.22) o.x = -0.22;

    var x = (o.x + Math.sin(time * o.sp + o.ph) * o.wob) * cw;
    var y = o.y * ch;
    var rr = o.r * base * pulse * (0.94 + 0.06 * Math.sin(time * o.sp * 1.7 + o.ph));
    if (!(rr > 1)) continue;
    var alpha = o.a * (0.72 + 0.28 * Math.sin(time * 0.8 + o.ph)) * (0.5 + o.depth * 0.65);
    if (alpha <= 0.006) continue;

    var spr = SPR[o.s % SPR.length];
    ctx.globalAlpha = Math.min(0.95, alpha);
    ctx.drawImage(spr, x - rr, y - rr, rr * 2, rr * 2);

    // 湿润街面上的竖向拖影
    if (o.y > 0.46 && rr > 6) {
      ctx.globalAlpha = Math.min(0.42, alpha * 0.4);
      var ry = ch * 0.88 + (ch - y) * 0.14;
      ctx.drawImage(spr, x - rr * 0.62, ry, rr * 1.24, rr * 2.8);
    }
  }

  // 横向灯箱拖影（银座招牌那种被雨水拉长的光）
  if (STREAK && W > 380) {
    var nS = 3;
    for (var s = 0; s < nS; s++) {
      var sx = ((s * 0.37 + 0.16) % 1) * cw;
      var sy = ch * (0.18 + s * 0.26);
      var sw = 26 + s * 14, sh = ch * 0.5;
      ctx.globalAlpha = 0.1 + 0.05 * Math.sin(time * 0.7 + s);
      ctx.drawImage(STREAK, sx - sw / 2, sy, sw, sh);
    }
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/* 前景剪影：只预渲染一次，每帧一次 drawImage */
var FIG = { c: null, w: 0, h: 0, key: '' };

function buildFigure() {
  var hh = Math.round(Math.max(200, Math.min(H * 0.76, 1400)));
  var ww = Math.round(Math.max(150, hh * 0.74));
  var key = hh + 'x' + S.accent.join(',');
  if (FIG.key === key && FIG.c) return;
  var c = mkCanvas(ww, hh), g = c.getContext('2d');
  var cx = ww * 0.5;

  var body = '#0a0609', hair = '#0b0508';
  g.fillStyle = body;
  g.beginPath(); g.ellipse(cx, hh * 1.02, ww * 0.47, hh * 0.62, 0, 0, 6.2832); g.fill();
  g.fillRect(cx - ww * 0.058, hh * 0.24, ww * 0.116, hh * 0.16);

  g.fillStyle = hair;
  g.beginPath(); g.ellipse(cx, hh * 0.168, ww * 0.178, hh * 0.152, 0, 0, 6.2832); g.fill();
  g.beginPath(); g.ellipse(cx - ww * 0.105, hh * 0.20, ww * 0.095, hh * 0.11, 0.15, 0, 6.2832); g.fill();
  g.beginPath(); g.ellipse(cx + ww * 0.112, hh * 0.135, ww * 0.082, hh * 0.082, 0, 0, 6.2832); g.fill();
  // 肩线的一道和服轮廓
  g.strokeStyle = 'rgba(255,190,215,0.10)';
  g.lineWidth = Math.max(1, ww * 0.006);
  g.beginPath();
  g.moveTo(cx - ww * 0.40, hh * 0.99);
  g.quadraticCurveTo(cx - ww * 0.12, hh * 0.44, cx, hh * 0.42);
  g.quadraticCurveTo(cx + ww * 0.14, hh * 0.45, cx + ww * 0.40, hh * 0.99);
  g.stroke();

  // 侧逆光：让轮廓从背景里浮出来（预渲染，零每帧成本）
  g.globalCompositeOperation = 'source-atop';
  var a1 = rgb2(S.accent, [-30, -6, 10]);
  var rg = g.createRadialGradient(cx + ww * 0.36, hh * 0.42, ww * 0.02, cx + ww * 0.30, hh * 0.45, ww * 0.72);
  rg.addColorStop(0, 'rgba(' + a1[0] + ',' + a1[1] + ',' + a1[2] + ',0.34)');
  rg.addColorStop(0.55, 'rgba(' + a1[0] + ',' + a1[1] + ',' + a1[2] + ',0.13)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, ww, hh);

  // 边缘羽化，避免"贴纸感"
  g.globalCompositeOperation = 'destination-in';
  var mk = g.createRadialGradient(cx, hh * 0.55, ww * 0.18, cx, hh * 0.55, ww * 0.82);
  mk.addColorStop(0, 'rgba(0,0,0,1)');
  mk.addColorStop(0.72, 'rgba(0,0,0,0.94)');
  mk.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = mk;
  g.fillRect(0, 0, ww, hh);
  g.globalCompositeOperation = 'source-over';

  FIG.c = c; FIG.w = ww; FIG.h = hh; FIG.key = key;
}

function drawFigure() {
  if (!FIG.c) return;
  var portrait = H > W * 1.15;
  var x, y, sc = 1;
  if (portrait) {
    sc = Math.min(1.15, (W * 1.15) / FIG.w);
    x = W * 0.5 - (FIG.w * sc) * 0.5;
    y = H - FIG.h * sc + H * 0.02;
  } else {
    x = W * 0.715 - FIG.w * 0.5;
    y = H - FIG.h * 1.02;
  }
  ctx.globalAlpha = portrait ? 0.82 : 0.94;
  ctx.drawImage(FIG.c, x, y, FIG.w * sc, FIG.h * sc);
  ctx.globalAlpha = 1;
}

/* ============ 歌词层 ============ */
var lnUp = document.getElementById('lnUp');
var lnCur = document.getElementById('lnCur');
var lnDown = document.getElementById('lnDown');
var emptyEl = document.getElementById('empty');
var titleEl = document.getElementById('title');

var revealAt = [];
var curSpans = [];

function parseReveal(ln) {
  revealAt = [];
  if (!ln) return;
  var txt = ln.text || '';
  var n = Math.min(txt.length, 300), i;
  if (ln.chars && ln.chars.length) {
    var t0 = ln.t, t1 = ln.t + (ln.dur > 0 ? ln.dur : 0);
    if (!(t1 > t0)) t1 = t0 + Math.max(0.9, n * 0.19);
    var m = Math.min(ln.chars.length, n);
    for (i = 0; i < n; i++) {
      var c = ln.chars[Math.min(m - 1, i)];
      var ts = c && isFinite(Number(c.t)) ? Number(c.t) : t0 + (t1 - t0) * (n > 1 ? i / (n - 1) : 0);
      if (i > 0 && ts < revealAt[i - 1]) ts = revealAt[i - 1];
      revealAt.push(isFinite(ts) ? ts : t0);
    }
  } else {
    var span = ln.dur > 0 ? ln.dur : Math.max(1.1, n * 0.2);
    for (i = 0; i < n; i++) revealAt.push(ln.t + span * (n > 1 ? (i / n) * 0.94 : 0));
  }
}

function paintLine(ln) {
  lnCur.textContent = '';
  curSpans = [];
  if (!ln) return;
  var txt = (ln.text || '').slice(0, 300);
  var frag = document.createDocumentFragment();
  for (var i = 0; i < txt.length; i++) {
    var ch = txt.charAt(i);
    if (ch === ' ' || ch === '\u3000') { frag.appendChild(document.createTextNode(ch)); continue; }
    var sp = document.createElement('span');
    sp.className = 'ch';
    sp.textContent = ch;
    sp.__on = 0;
    sp.__at = revealAt[i] !== undefined ? revealAt[i] : (ln.t || 0);
    curSpans.push(sp);
    frag.appendChild(sp);
  }
  lnCur.appendChild(frag);
}

function tickReveal(now) {
  var n = curSpans.length;
  if (!n) return;
  for (var i = 0; i < n; i++) {
    var sp = curSpans[i];
    var on = now >= sp.__at - 0.02;
    if (on ? sp.__on !== 1 : sp.__on !== 0) {
      sp.__on = on ? 1 : 0;
      sp.className = on ? 'ch on' : 'ch';
    }
  }
}

function render(force) {
  var total = S.lines.length;

  if (!total) {
    lnUp.textContent = ''; lnDown.textContent = '';
    lnCur.textContent = ''; curSpans = []; revealAt = [];
    emptyEl.textContent = '\u4eca \u591c \u65e0 \u8bcd';
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';

  // idx<0（还没到第一句）时，把第一句当"待唱"预显出来，别让画面空着
  var di = S.idx >= 0 ? S.idx : 0;
  var ln = S.lines[di] || null;
  var up = di - 1 >= 0 ? S.lines[di - 1] : null;
  var dn = di + 1 < total ? S.lines[di + 1] : null;

  lnUp.textContent = up ? (up.text || '') : '';
  lnDown.textContent = dn ? (dn.text || '') : '';

  if (force) {
    parseReveal(ln);   // 必须先算好逐字时刻，paintLine 要用
    paintLine(ln);
    fitLine();
    if (!S.rm && (S.idx >= 0 || S.lines.length)) {
      lnCur.classList.remove('fade');
      void lnCur.offsetWidth;
      lnCur.classList.add('fade');
    }
  }
  lnCur.style.opacity = S.idx < 0 ? '0.72' : '1';
}

/* 超长句：按可用宽度缩字号，绝不溢出 */
function fitLine() {
  var base = 0;
  lnCur.style.fontSize = '';
  try {
    var w = lnCur.clientWidth;
    if (!w) w = lyricBox.clientWidth * 0.56;
    if (!w) return;
    base = parseFloat(window.getComputedStyle(lnCur).fontSize) || 32;
    var need = lnCur.scrollWidth;
    if (need > w + 1) {
      var k = Math.max(0.5, Math.min(1, (w / need) * 0.985));
      lnCur.style.fontSize = Math.max(13, base * k) + 'px';
    }
  } catch (e) { console.error('[470] fit error', e); }
}

function setTitle() {
  var name = (S.song && typeof S.song.name === 'string') ? S.song.name.trim() : '';
  var a = S.song && S.song.artists, art = '';
  if (Array.isArray(a)) {
    var parts = [];
    for (var i = 0; i < a.length && i < 4; i++) { if (a[i] != null && String(a[i]).trim()) parts.push(String(a[i]).trim()); }
    art = parts.join(' / ');
  } else if (typeof a === 'string') art = a.trim();
  titleEl.textContent = name ? name.slice(0, 22) : '\u6f14\u6b4c';
  if (art) {
    var sp = document.createElement('span');
    sp.className = 'art';
    sp.textContent = art.slice(0, 20);
    titleEl.appendChild(sp);
  }
}

/* ============ 消息 ============ */
window.addEventListener('message', function (ev) {
  var m = ev && ev.data;
  if (!m || typeof m !== 'object' || m.__c100 !== 1) return;
  try {
    if (m.type === 'init') {
      var p = m.payload || {};
      S.song = p.song && typeof p.song === 'object' ? p.song : { name: '', artists: '', cover: '' };
      var ac = Array.isArray(p.accent) ? p.accent : null;
      if (ac && ac.length >= 3 && isFinite(Number(ac[0])) && isFinite(Number(ac[1])) && isFinite(Number(ac[2]))) {
        S.accent = [ Math.max(0, Math.min(255, Number(ac[0]) | 0)),
                     Math.max(0, Math.min(255, Number(ac[1]) | 0)),
                     Math.max(0, Math.min(255, Number(ac[2]) | 0)) ];
        buildSprites();
      }
      S.lines = normalize(p);
      S.duration = Math.max(0, Number(p.duration) || 0);
      if (typeof p.playing === 'boolean') S.playing = p.playing; else S.playing = true;
      S.t = 0; S.idx = -1;
      setTitle();
      render(true);
      tickReveal(-1);
    } else if (m.type === 'tick') {
      var d = m.payload || {};
      var tt = Number(d.time);
      if (isFinite(tt)) S.t = Math.max(0, tt);
      if (typeof d.playing === 'boolean') S.playing = d.playing;
      var i = -1, L = S.lines;
      for (var k = 0; k < L.length; k++) { if (L[k].t <= S.t + 0.06) i = k; else break; }
      if (i !== S.idx) { S.idx = i; render(true); }
    } else if (m.type === 'beat') {
      var b = m.payload || {};
      var lv = Number(b.level);
      beatLv = isFinite(lv) ? Math.max(0, Math.min(1, lv)) : 0.6;
      S.beatAt = performance.now();
      // 鼓点让招牌接触不良地闪一下（每 ~1.2s 最多一次，别太吵）
      var tn = performance.now();
      if (!S.signAt || tn - S.signAt > 1200) {
        S.signAt = tn;
        if (!S.rm) {
          titleEl.classList.remove('hit');
          void titleEl.offsetWidth;
          titleEl.classList.add('hit');
        }
      }
    } else if (m.type === 'live') {
      var v = m.payload || {};
      var g = Number(v.level), bs = Number(v.bass), md = Number(v.mid), tr = Number(v.treble), bp = Number(v.bpm);
      liveLv = isFinite(g) ? Math.max(0, Math.min(1, g)) : liveLv;
      bassLv = isFinite(bs) ? Math.max(0, Math.min(1, bs)) : bassLv;
      if (isFinite(md)) S.mid = Math.max(0, Math.min(1, md));
      trebLv = isFinite(tr) ? Math.max(0, Math.min(1, tr)) : trebLv;
      if (isFinite(bp) && bp > 20) bpm = Math.min(220, bp);
      if (typeof v.playing === 'boolean') S.playing = v.playing;
    }
  } catch (e) {
    console.error('[470] message error', e);
    S.err = String(e && e.message || e);
  }
});

/* ============ 主循环 ============ */
var lastT = 0, clock = 0;

function frame(now) {
  var a = performance.now();
  S.frames++;
  if (!S.ready) sendReady();

  var dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0.016;
  lastT = now;
  clock += dt * (S.playing ? 1 : 0.25);

  try {
    // 鼓点衰减
    if (S.beatAt) beatLv *= Math.pow(0.86, dt * 60);
    if (beatLv < 0.002) beatLv = 0;

    if (!S.pausedDraw) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.clearRect(0, 0, W, H);
      if (SPR.length) drawBokeh(clock, dt);
      drawFigure();

      // 颗粒（128 纹理平铺，pattern 已缓存）
      if (GRAIN) {
        if (!PAT) PAT = ctx.createPattern(GRAIN, 'repeat');
        if (PAT) {
          ctx.globalAlpha = 0.45;
          ctx.fillStyle = PAT;
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
      }
    }

    tickReveal(S.t + (S.playing ? Math.min(0.05, (performance.now() - a) / 1000) : 0));
  } catch (e) {
    console.error('[470] frame error', e);
    S.err = String(e && e.message || e);
  }

  S.js = S.js ? S.js * 0.88 + (performance.now() - a) * 0.12 : (performance.now() - a);
  requestAnimationFrame(frame);
}

/* ============ 引导 ============ */
try { S.rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { S.rm = false; }
try {
  resize();
  buildSprites();
  seedOrbs();
  buildFigure();
  window.addEventListener('resize', function () {
    try {
      resize();
      CACHE.grad = null;
      PAT = null;
      if (Math.abs(VBOK.w - W) > 2 || Math.abs(VBOK.h - H) > 2) seedOrbs();
      buildSprites();
      buildFigure();
    } catch (e) { console.error(e); }
  });
  render(true);
  setTitle();
  requestAnimationFrame(frame);
  setTimeout(sendReady, 800);
} catch (e) {
  console.error('[470] boot error', e);
  S.err = String(e && e.message || e);
}
</script>
</body>
</html>
