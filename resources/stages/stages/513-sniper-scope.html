<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>513 · 狙击歌词</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { background: #000; }
  #hud { pointer-events: none; }
  #fb {
    position: fixed; left: 4vw; right: 4vw; top: 50%;
    transform: translateY(-50%);
    text-align: center; color: #e9eefb; opacity: .92;
    font: 600 clamp(17px, 2.4vw, 42px)/1.4 "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: .05em;
    text-shadow: 0 0 26px rgba(150, 170, 255, .35);
    transition: opacity .5s ease;
    pointer-events: none;
  }
  #fb.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="fb"></div>
<script>/* ============================================================
   513 · 狙击歌词 · boot
   零依赖，先于 3D 包执行。即使 WebGL 包整个挂掉，
   这一层也保证：ready 发得出去、__stage 读得到、歌词有兜底。
   ============================================================ */
(function () {
  "use strict";

  var S = {
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, err: "", gl: false,
    song: { name: "", artists: "", cover: "" },
    accent: [150, 165, 255],
    duration: 0

  var RM = false;

    return {
      lines: ln.length,
      idx: i,
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: Math.round(S.js * 100) / 100,
      err: S.err,
      text: (i >= 0 && ln[i] && ln[i].text != null) ? String(ln[i].text) : "",
      gl: !!S.gl,
      rm: RM

  };

  var lastErrAt = 0;
  function report(e) {
    S.err = String((e && e.message) || e || "error");
    var now = Date.now();
    if (now - lastErrAt < 1000) return;   /* 报错限流：每秒最多一条 */

    try { console.error(e); } catch (_) { }

  function send(type, payload) {

  function sendReady() {
    if (readySent) return;
    readySent = true;
    send("ready");
  }
  requestAnimationFrame(sendReady);
  setTimeout(sendReady, 800);

      if (!isFinite(tt)) { out.push(null); continue; }

  function normLines(arr) {

      if (!l || typeof l !== "object") continue;
      var t = Number(l.t);
      if (!isFinite(t) || t < 0) t = 0;
      out.push({
        t: t,
        dur: isFinite(Number(l.dur)) && Number(l.dur) > 0 ? Number(l.dur) : 0,
        text: (l.text == null ? "" : String(l.text)),
        chars: normChars(l.chars)

  var LZ = window.__LZ = {

    on: function (fn) { subs.push(fn); return fn; },
    idxAt: idxAt,
    report: report,
    send: send,
    mounted: false,
    accentLin: [0.30, 0.36, 0.68],
    version: 1

  /* ---------- 兜底文字层：3D 起来之前 / 起不来时都靠它 ---------- */
  var fb = document.getElementById("fb");
  var fbText = null;
  function paintFallback() {
    if (!fb || LZ.mounted) return;
    var i = S.idx;

      fb.textContent = tx;
    }
  }

  /* ---------- 消息 ---------- */
  addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};

        S.idx = -1;
        var song = p.song && typeof p.song === "object" ? p.song : {};

          artists: Array.isArray(song.artists) ? song.artists.join(" / ") : (song.artists == null ? "" : String(song.artists)),

        S.playing = typeof p.playing === "boolean" ? p.playing : true;
        var a = S.accent;
        var lin = LZ.accentLin;
        lin[0] = Math.pow(a[0] / 255, 2.2);
        lin[1] = Math.pow(a[1] / 255, 2.2);
        lin[2] = Math.pow(a[2] / 255, 2.2);
        fbText = null;
        LZ.emit("init");
      } else if (d.type === "tick") {
        var t = Number(p.time);
        if (isFinite(t)) S.t = t;                                    /* 无条件采纳 */
        if (typeof p.playing === "boolean") S.playing = p.playing;
      } else if (d.type === "beat") {

      } else if (d.type === "live") {
        LZ.emit && LZ.emit("live", {
          bpm: Number(p.bpm) || 0,
          level: isFinite(Number(p.level)) ? Number(p.level) : 0,
          bass: isFinite(Number(p.bass)) ? Number(p.bass) : 0,
          treble: isFinite(Number(p.treble)) ? Number(p.treble) : 0
        });
      }
    } catch (e) { report(e); }
  });

  /* 事件总线（3D 包订阅 init / beat / live） */
  var handlers = { init: [], beat: [], live: [] };
  LZ.emit = function (type, payload) {
    var hs = handlers[type] || [];
    for (var i = 0; i < hs.length; i++) { try { hs[i](payload); } catch (e) { report(e); } }
  };
  LZ.onEvent = function (type, fn) {
    (handlers[type] || (handlers[type] = [])).push(fn);
  };

  /* ---------- 用户活动 / 空格 ---------- */
  var lastAct = 0;
  function act() {
    var n = Date.now();
    if (n - lastAct < 220) return;
    lastAct = n;
    send("activity");
  }
  addEventListener("mousemove", act, { passive: true });
  addEventListener("pointerdown", act, { passive: true });
  addEventListener("wheel", act, { passive: true });
  addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      try { e.preventDefault(); } catch (_) { }
      send("key", { key: "Space" });
    }
    act();
  });

  /* ---------- 主循环（唯一的 rAF） ---------- */
  var subsFrame = [];
  LZ.onFrame = function (fn) { subsFrame.push(fn); };

  var last = performance.now();
  function frame(now) {
    var t0 = performance.now();
    try {
      var dt = (now - last) / 1000;
      last = now;
      if (!isFinite(dt) || dt < 0) dt = 0;
      if (dt > 0.1) dt = 0.1;
      S.idx = idxAt(S.t);
      paintFallback();
      for (var i = 0; i < subsFrame.length; i++) {
        try { subsFrame[i](now / 1000, dt); } catch (e) { report(e); }
      }
      S.frames++;
    } catch (e) { report(e); }
    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
