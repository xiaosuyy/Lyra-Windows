<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>516 · 一点落款</title>
<style>
  :root {
    --ac: 152, 176, 255;
    --ink: 226, 234, 246;
    --mono: "SFMono-Regular", ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", "Heiti SC", sans-serif;
    --serif: Georgia, "Times New Roman", "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #04060a; color: #e2eaf6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    user-select: none; -webkit-user-select: none;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #lyric {
    position: fixed; z-index: 3; pointer-events: none;
    left: 7.5vw; bottom: calc(11.5vh + env(safe-area-inset-bottom, 0px));
    width: min(56vw, 760px);
  }
  #lyric::before {
    content: ""; position: absolute; left: -19px; top: 3px; bottom: 1px; width: 1px;
    background: linear-gradient(to bottom, rgba(var(--ac), .6), rgba(var(--ac), .05));
  }
  #capRow {
    display: flex; align-items: baseline; gap: 15px;
    margin-bottom: .95em;
    font: 500 clamp(10px, .78vw, 12px)/1 var(--mono);
    letter-spacing: .24em; color: rgba(var(--ink), .56);
  }
  #capIdx { color: rgba(var(--ac), .82); }
  #capClock { color: rgba(var(--ink), .5); }
  #curLine {
    font: 600 clamp(21px, 2.35vw, 42px)/1.42 var(--sans);
    letter-spacing: .015em; color: #f2f6fb;
    text-shadow: 0 2px 24px rgba(0, 0, 0, .78);
    min-height: 1.42em;
  }
  #curLine .ch {
    display: inline-block; white-space: pre-wrap;
    color: rgba(var(--ink), .45);
    transition: color .16s linear, text-shadow .16s linear;
  }
  #curLine .ch.on {
    color: #fbfdff;
    text-shadow: 0 0 18px rgba(var(--ac), .5), 0 0 3px rgba(var(--ac), .35);
  }
  #curLine .pre {
    display: inline-block;
    font: 500 clamp(11px, .82vw, 13px)/1 var(--mono);
    letter-spacing: .34em; color: rgba(var(--ink), .52);
  }
  #lyricRule {
    position: relative; height: 1px; margin-top: 1.2em;
    background: rgba(var(--ink), .1);
  }
  #lyricFill {
    position: absolute; left: 0; top: 0; height: 1px; width: 0;
    background: linear-gradient(to right, rgba(var(--ac), .92), rgba(var(--ac), .28));
    box-shadow: 0 0 10px rgba(var(--ac), .5);
  }
  #scaleTag {
    position: absolute; right: 0; top: -2.1em;
    font: 500 10px/1 var(--mono); letter-spacing: .18em;
    color: rgba(var(--ink), .5); white-space: nowrap;
  }

  #fin {
    position: fixed; inset: 0; z-index: 4; display: grid;
    grid-template-rows: 1fr auto 1fr;
    pointer-events: none; opacity: 0; visibility: hidden;
  }
  #finTop {
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 6vw clamp(26px, 4.6vh, 54px);
  }
  #finTitle {
    width: 88vw; max-width: 1280px; text-align: center;
    font-family: var(--serif); font-weight: 400;
    font-size: 96px; line-height: 1.16; letter-spacing: .06em;
    color: #f4f7fb; text-wrap: balance;
    text-shadow: 0 0 60px rgba(var(--ac), .16), 0 6px 44px rgba(0, 0, 0, .9);
  }
  #finLine {
    position: relative; width: min(64vw, 620px); height: 1px; margin: 0 auto;
    background: linear-gradient(to right,
      rgba(var(--ink), 0), rgba(var(--ink), .42) 14%,
      rgba(var(--ink), .42) 86%, rgba(var(--ink), 0));
    transform: scaleX(0); transform-origin: center;
  }
  #finLine .end {
    position: absolute; top: 0; width: 1px; height: 7px;
    background: rgba(var(--ink), .4);
  }
  #finLine .end.l { left: 14%; }
  #finLine .end.r { right: 14%; }
  #finBot {
    display: flex; justify-content: center;
    padding: clamp(18px, 3.4vh, 34px) 6vw 0;
  }
  #finMeta {
    display: flex; align-items: center; gap: 14px;
    font: 500 11px/1 var(--mono); letter-spacing: .24em;
    color: rgba(var(--ink), .66); max-width: 88vw;
  }
  #finArtist {
    max-width: 52vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #finSep { color: rgba(var(--ink), .3); }
  #finTag {
    color: rgba(var(--ac), .76); font-size: 9px; letter-spacing: .3em; white-space: nowrap;
  }

  @media (max-width: 720px) {
    #lyric { left: 8vw; width: 84vw; bottom: calc(9vh + env(safe-area-inset-bottom, 0px)); }
    #lyric::before { left: -12px; }
    #curLine { font-size: clamp(20px, 5.4vw, 30px); }
    #capRow { margin-bottom: .8em; }
    #finTop { padding-bottom: clamp(20px, 4vh, 36px); }
    #finMeta { gap: 10px; font-size: 10px; letter-spacing: .18em; }
    #finArtist { max-width: 46vw; }
    #finTag { font-size: 8px; letter-spacing: .22em; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="lyric">
  <div id="capRow">
    <span id="capIdx">— / —</span>
    <span id="capClock">00:00 / 00:00</span>
  </div>
  <div id="curLine"></div>
  <div id="lyricRule">
    <i id="lyricFill"></i>
    <span id="scaleTag">×0.6</span>
  </div>
</div>

<div id="fin">
  <div id="finTop"><div id="finTitle"></div></div>
  <div id="finLine"><span class="end l"></span><span class="end r"></span></div>
  <div id="finBot">
    <div id="finMeta">
      <span id="finArtist"></span>
      <span id="finSep">·</span>
      <span id="finTag">Lyra · STAGE 516</span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }

  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '' };

  window.__stage = function () {
    var i = S.idx;
    var L = (i >= 0 && S.lines[i]) ? S.lines[i] : null;
    return {
      lines: S.lines.length,
      idx: i,
      t: S.t,
      playing: !!S.playing,
      frames: S.frames,
      js: Math.round(S.js * 100) / 100,
      err: S.err,
      text: L ? String(L.text || '') : '',
      gl: false,
      rm: RM
    };
  };

  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) { }
  }
  requestAnimationFrame(sendReady);
  setTimeout(sendReady, 800);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function sstep(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function easeOut(x) { var y = 1 - x; return 1 - y * y * y; }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); }
  function pad2(n) { n = Math.max(0, Math.floor(n)); return (n < 10 ? '0' : '') + n; }
  function mmss(sec) { sec = Math.max(0, Math.floor(sec)); return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
  function cleanName(v) { return (v == null ? '' : String(v)).replace(/\s+/g, ' ').trim(); }
  function artistText(a) {
    if (Array.isArray(a)) {
      var out = [];
      for (var i = 0; i < a.length; i++) {
        var s = cleanName(a[i]);
        if (s) out.push(s);
      }
      return out.join(' / ');
    }
    return cleanName(a);
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var h = 0, s = 0, l = (mx + mn) / 2;
    if (mx !== mn) {
      var d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s * 100, l: l * 100 };
  }

  function hsl2rgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return {
      r: Math.round((r + m) * 255),
      g: Math.round((g + m) * 255),
      b: Math.round((b + m) * 255)
    };
  }

  var AC = { r: 152, g: 176, b: 255, css: '152, 176, 255' };

  function setAccent(a) {
    var r = 152, g = 176, b = 255;
    if (Array.isArray(a) && a.length >= 3) {
      var rr = Number(a[0]), gg = Number(a[1]), bb = Number(a[2]);
      if (isFinite(rr) && isFinite(gg) && isFinite(bb)) {
        r = clamp(Math.round(rr), 0, 255);
        g = clamp(Math.round(gg), 0, 255);
        b = clamp(Math.round(bb), 0, 255);
      }
    }
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx < 26 || mx - mn < 4) { r = 152; g = 176; b = 255; }
    var c = rgb2hsl(r, g, b);
    if (c.s < 10) { c.h = 222; c.s = 55; }
    c.s = clamp(c.s, 32, 68);
    c.l = clamp(c.l, 55, 70);
    var o = hsl2rgb(c.h, c.s, c.l);
    AC.r = o.r; AC.g = o.g; AC.b = o.b;
    AC.css = o.r + ', ' + o.g + ', ' + o.b;
    try { document.documentElement.style.setProperty('--ac', AC.css); } catch (e) { }
  }

  function ink(a) { return 'rgba(226, 234, 246, ' + a + ')'; }
  function accent(a) { return 'rgba(' + AC.css + ', ' + a + ')'; }

  function q(id) { return document.getElementById(id); }

  var cv = q('cv');
  var ctx = null;
  try { ctx = cv ? cv.getContext('2d', { alpha: false }) : null; } catch (e) { ctx = null; }

  var lyricEl = q('lyric');
  var curLine = q('curLine');
  var capIdx = q('capIdx');
  var capClock = q('capClock');
  var lyricFill = q('lyricFill');
  var scaleTag = q('scaleTag');

  var finEl = q('fin');
  var finTitle = q('finTitle');
  var finLine = q('finLine');
  var finArtist = q('finArtist');
  var finSep = q('finSep');
  var finTag = q('finTag');

  var W = 1440, H = 900, DPR = 1, CX = 720, CY = 450, maxDim = 1600, minDim = 900;
  var bgGrad = null, vigGrad = null, grain = null;

  function buildBg() {
    if (!ctx) return;
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#06090f');
    bgGrad.addColorStop(0.52, '#05070b');
    bgGrad.addColorStop(1, '#030509');
    vigGrad = ctx.createRadialGradient(CX, CY, minDim * 0.3, CX, CY, maxDim * 0.78);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vigGrad.addColorStop(0.65, 'rgba(0,0,0,0.18)');
    vigGrad.addColorStop(1, 'rgba(0,0,0,0.66)');
  }

  function buildGrain() {
    try {
      var n = 256;
      var c = document.createElement('canvas');
      c.width = n; c.height = n;
      var g = c.getContext('2d');
      if (!g) { grain = null; return; }
      var img = g.createImageData(n, n);
      for (var i = 0; i < img.data.length; i += 4) {
        var v = (rnd(i * 0.37) * 255) | 0;
        img.data[i] = 245; img.data[i + 1] = 247; img.data[i + 2] = 252;
        img.data[i + 3] = (v * 0.10) | 0;
      }
      g.putImageData(img, 0, 0);
      grain = c;
    } catch (e) { grain = null; }
  }

  function fitTitle() {
    if (!finTitle) return;
    var maxW = Math.min(W * 0.88, 1280);
    finTitle.style.width = maxW + 'px';
    finTitle.style.maxWidth = maxW + 'px';
    var size = Math.max(34, Math.min(W * 0.095, H * 0.14, 128));
    finTitle.style.fontSize = size.toFixed(1) + 'px';
    var maxH = H * 0.3;
    for (var k = 0; k < 10; k++) {
      if (finTitle.scrollHeight <= maxH || size <= 34) break;
      size *= 0.9;
      finTitle.style.fontSize = size.toFixed(1) + 'px';
    }
  }

  function resize() {
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    W = w; H = h;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    if (cv) {
      cv.width = Math.max(1, Math.round(W * DPR));
      cv.height = Math.max(1, Math.round(H * DPR));
      cv.style.width = W + 'px';
      cv.style.height = H + 'px';
    }
    if (ctx) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W * 0.5;
    CY = H * 0.5;
    maxDim = Math.max(W, H);
    minDim = Math.min(W, H);
    buildBg();
    fitTitle();
  }

  var meta = { name: '', artist: '', duration: 0 };
  var inited = false;
  var lastSongId = null;
  var pulses = [];
  var beatGlow = 0;
  var live = { bass: 0, mid: 0, treble: 0, level: 0 };
  var liveT = { bass: 0, mid: 0, treble: 0, level: 0 };
  var curS = 0.55;
  var finQ = 0;
  var finStart = 0.9;

  var clock = { base: 0, at: 0, playing: true, ok: false };

  function totalDur() {
    if (meta.duration > 0.5) return meta.duration;
    var last = 0;
    if (S.lines.length) {
      var l = S.lines[S.lines.length - 1];
      last = (l.t || 0) + (l.dur > 0 ? l.dur : 3.4);
    }
    return last > 0 ? last + 8 : 210;
  }

  function clockTime(now) {
    if (!clock.ok) return 0;
    var t = clock.base;
    if (clock.playing && clock.at > 0) {
      t += (now - clock.at) / 1000;
      if (t > clock.base + 0.42) t = clock.base + 0.42;
    }
    if (t < 0) t = 0;
    var d = totalDur();
    if (d > 0 && t > d) t = d;
    return t;
  }

  function computeFinStart() {
    var d = totalDur();
    var v = d > 1 ? (1 - 17 / d) : 0.86;
    finStart = clamp(v, 0.8, 0.97);
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; }
      else { hi = m - 1; }
    }
    return best;
  }

  function sanitizeLines(arr) {
    var out = [];
    if (!Array.isArray(arr)) return out;
    for (var i = 0; i < arr.length; i++) {
      var l = arr[i];
      if (!l || typeof l !== 'object') continue;
      var tx = (l.text == null ? '' : String(l.text)).trim();
      if (!tx) continue;
      var tt = num(l.t);
      if (tt < 0) tt = 0;
      var dd = num(l.dur);
      if (dd < 0) dd = 0;
      var ch = null;
      if (Array.isArray(l.chars) && l.chars.length) {
        ch = [];
        for (var j = 0; j < l.chars.length; j++) {
          var c = l.chars[j];
          if (!c || typeof c !== 'object') { ch.push(null); continue; }
          var ct = Number(c.t);
          ch.push({
            c: (c.c == null ? '' : String(c.c)),
            t: isFinite(ct) ? ct : null
          });
        }
      }
      out.push({ t: tt, dur: dd, text: tx, chars: ch });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function lineTimes(line) {
    var chars = Array.from(line.text || '');
    var n = chars.length;
    var out = [];
    var i;
    var cs = line.chars;
    if (cs && cs.length) {
      var first = null;
      for (i = 0; i < cs.length; i++) {
        if (cs[i] && isFinite(cs[i].t)) { first = cs[i].t; break; }
      }
      var rel = first != null && first < line.t - 0.08;
      for (i = 0; i < n; i++) {
        var j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        var rec = cs[j] || null;
        var ct = rec && isFinite(rec.t) ? rec.t : null;
        out.push(ct == null ? null : (rel ? line.t + ct : ct));
      }
      return out;
    }
    var d = line.dur > 0 ? line.dur : 3.4;
    for (i = 0; i < n; i++) out.push(line.t + d * 0.9 * i / Math.max(1, n));
    return out;
  }

  var curIdx = -2;
  var curSpans = [];
  var curLineData = null;

  function renderLine(i) {
    if (!curLine) return;
    curLine.innerHTML = '';
    curSpans = [];
    curLineData = null;
    if (lyricFill) lyricFill.style.width = '0%';

    if (i < 0) {
      if (!inited) {
        if (capIdx) capIdx.textContent = '— / —';
        return;
      }
      if (S.lines.length === 0) {
        curLine.innerHTML = '<span class="pre">纯音乐 · INSTRUMENTAL</span>';
        if (capIdx) capIdx.textContent = '— / —';
      } else {
        curLine.innerHTML = '<span class="pre">前奏 · INTRO</span>';
        if (capIdx) capIdx.textContent = '00 / ' + pad2(S.lines.length);
      }
      return;
    }

    var line = S.lines[i];
    if (!line) return;
    var chars = Array.from(line.text);
    var times = lineTimes(line);
    for (var k = 0; k < chars.length; k++) {
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = chars[k] === ' ' ? '\u00A0' : chars[k];
      curLine.appendChild(sp);
      curSpans.push({ el: sp, t: times[k], on: false });
    }
    curLineData = line;
    if (capIdx) capIdx.textContent = pad2(i + 1) + ' / ' + pad2(S.lines.length);

    if (!RM && curLine.animate) {
      try {
        curLine.animate(
          [{ opacity: 0.35, transform: 'translateY(7px)' }, { opacity: 1, transform: 'translateY(0)' }],
          { duration: 460, easing: 'cubic-bezier(.2,.72,.2,1)' }
        );
      } catch (e) { }
    }
  }

  function updateChars(t) {
    if (!curSpans.length) return;
    for (var k = 0; k < curSpans.length; k++) {
      var sp = curSpans[k];
      var on = sp.t != null && t >= sp.t;
      if (on !== sp.on) {
        sp.on = on;
        if (on) sp.el.classList.add('on');
        else sp.el.classList.remove('on');
      }
    }
    if (curLineData && lyricFill) {
      var d = curLineData.dur > 0 ? curLineData.dur : 3.4;
      var pr = clamp((t - curLineData.t) / d, 0, 1);
      lyricFill.style.width = (pr * 100).toFixed(2) + '%';
    }
  }

  function lastQSet(q) {
    if (!finEl) return;
    if (q <= 0.0005) {
      finEl.style.visibility = 'hidden';
      finEl.style.opacity = '0';
      if (lyricEl) lyricEl.style.opacity = '1';
      return;
    }
    finEl.style.visibility = 'visible';
    finEl.style.opacity = q.toFixed(4);
    if (lyricEl) lyricEl.style.opacity = (1 - clamp(q * 1.45, 0, 1)).toFixed(4);

    if (finLine) {
      var rq = easeOut(clamp(q / 0.42, 0, 1));
      finLine.style.transform = 'scaleX(' + rq.toFixed(4) + ')';
    }
    if (finTitle) {
      var tq = clamp((q - 0.12) / 0.62, 0, 1);
      var te = easeOut(tq);
      finTitle.style.opacity = tq.toFixed(4);
      finTitle.style.transform = 'translateY(' + ((1 - te) * 16).toFixed(2) + 'px)';
      finTitle.style.letterSpacing = (0.3 - 0.24 * te).toFixed(4) + 'em';
      if (!RM) finTitle.style.filter = 'blur(' + ((1 - te) * 5).toFixed(2) + 'px)';
      else finTitle.style.filter = 'none';
    }
    if (finArtist && finSep) {
      var mq = clamp((q - 0.56) / 0.36, 0, 1);
      var mqe = easeOut(mq);
      finArtist.style.opacity = mq.toFixed(4);
      finSep.style.opacity = mq.toFixed(4);
      finArtist.style.transform = 'translateY(' + ((1 - mqe) * 7).toFixed(2) + 'px)';
      if (finTag) finTag.style.opacity = (0.4 + 0.6 * mq).toFixed(4);
    }
  }

  function applyFinaleText() {
    if (!finTitle) return;
    var name = meta.name || '无题';
    if (finTitle.textContent !== name) finTitle.textContent = name;
    if (finArtist) {
      finArtist.textContent = meta.artist || '';
      finArtist.style.display = meta.artist ? '' : 'none';
    }
    if (finSep) finSep.style.display = meta.artist ? '' : 'none';
    fitTitle();
  }

  function fail(e) {
    S.err = String((e && e.message) || e);
    if (!fail.t) fail.t = 0;
    var now = performance.now();
    if (now - fail.t > 1000) {
      fail.t = now;
      try { console.error(e); } catch (x) { }
    }
  }

  function buildEase(xs, ys) {
    var n = xs.length;
    var d = [];
    var m = new Array(n);
    var i;
    for (i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
    m[0] = 0;
    m[n - 1] = 0;
    for (i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] <= 0) m[i] = 0;
      else m[i] = (d[i - 1] + d[i]) / 2;
    }
    for (i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      var a = m[i] / d[i], b = m[i + 1] / d[i];
      var ss = a * a + b * b;
      if (ss > 9) {
        var tau = 3 / Math.sqrt(ss);
        m[i] = tau * a * d[i];
        m[i + 1] = tau * b * d[i];
      }
    }
    return function (x) {
      if (x <= xs[0]) return ys[0];
      if (x >= xs[n - 1]) return ys[n - 1];
      var lo = 0, hi = n - 1;
      while (hi - lo > 1) {
        var mid = (lo + hi) >> 1;
        if (xs[mid] <= x) lo = mid; else hi = mid;
      }
      var h = xs[lo + 1] - xs[lo];
      var tt = (x - xs[lo]) / h;
      var t2 = tt * tt, t3 = t2 * tt;
      var h00 = 2 * t3 - 3 * t2 + 1;
      var h10 = t3 - 2 * t2 + tt;
      var h01 = -2 * t3 + 3 * t2;
      var h11 = t3 - t2;
      return h00 * ys[lo] + h10 * h * m[lo] + h01 * ys[lo + 1] + h11 * h * m[lo + 1];
    };
  }

  var zoomEase = buildEase(
    [0, 0.035, 0.12, 0.28, 0.5, 0.7, 0.86, 0.95, 1],
    [0, 0.012, 0.07, 0.22, 0.47, 0.7, 0.865, 0.95, 1]
  );

  var LOG_S0 = Math.log(0.55);
  var LOG_S1 = Math.log(420000);
  var K = 1.85;
  var LK = Math.log(K);

  var motes = null;
  function buildMotes() {
    motes = [];
    for (var i = 0; i < 72; i++) {
      motes.push({
        a: rnd(i * 1.37 + 3.1) * TAU,
        u: rnd(i * 7.13 + 11.7),
        r: 0.45 + rnd(i * 3.71 + 5.5),
        ac: (i % 9 === 0),
        ph: rnd(i * 5.27 + 2.2) * TAU
      });
    }
  }

  function sciR(v) {
    if (v >= 1000 || v < 0.1) {
      var e = Math.floor(Math.log10(v));
      var m = v / Math.pow(10, e);
      return m.toFixed(1) + 'e' + e;
    }
    if (v >= 100) return v.toFixed(0);
    if (v >= 10) return v.toFixed(1);
    return v.toFixed(2);
  }

  function sciS(v) {
    if (v < 1) return v.toFixed(2);
    if (v >= 10000) {
      var e = Math.floor(Math.log10(v));
      var m = v / Math.pow(10, e);
      return m.toFixed(1) + 'e' + e;
    }
    if (v >= 1000) return (v / 1000).toFixed(1) + 'e3';
    return v.toFixed(v >= 100 ? 0 : 1);
  }

  function ringAlpha(sr) {
    var a = sstep((sr - 24) / 48);
    var b = 1 - sstep((sr - maxDim * 0.58) / (maxDim * 0.4));
    return a < b ? a : b;
  }

  function draw(now, t, p, s, dt) {
    if (!ctx) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = bgGrad || '#04060a';
    ctx.fillRect(0, 0, W, H);

    var cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, maxDim * 0.55);
    cg.addColorStop(0, accent(0.032));
    cg.addColorStop(1, accent(0));
    ctx.fillStyle = cg;
    ctx.fillRect(0, 0, W, H);

    var q = finQ;
    var worldA = 1 - 0.9 * q;
    var ignition = sstep(clamp(p / 0.05, 0, 1));
    var baseA = ignition * worldA;
    var music = 0.8 + 0.4 * live.level;
    var rot = RM ? -0.4 : (-0.4 - t * 0.0085);

    if (motes && baseA > 0.01) {
      var logMin = Math.log(12);
      var logMax = Math.log(maxDim * 0.95);
      var span = logMax - logMin;
      var shift = (Math.log(s) - LOG_S0) * 0.82;
      for (var mi = 0; mi < motes.length; mi++) {
        var mo = motes[mi];
        var v = mo.u + shift / span;
        v -= Math.floor(v);
        var sr = Math.exp(logMin + v * span);
        var edge = sstep(v / 0.1) * (1 - sstep((v - 0.78) / 0.22));
        if (edge <= 0.01) continue;
        var tw = 0.62 + 0.38 * Math.sin(t * 1.9 + mo.ph);
        var al = edge * tw * 0.2 * baseA;
        var mx = CX + Math.cos(mo.a) * sr;
        var my = CY + Math.sin(mo.a) * sr;
        ctx.fillStyle = mo.ac ? accent(al * 1.5) : ink(al);
        ctx.beginPath();
        ctx.arc(mx, my, mo.r * (0.7 + 0.3 * live.level), 0, TAU);
        ctx.fill();
      }
    }

    ctx.lineWidth = 0.6;
    for (var si = 0; si < 24; si++) {
      var ang = rot + si * TAU / 24;
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var al2 = (si % 6 === 0 ? 0.085 : 0.032) * baseA * music;
      ctx.strokeStyle = ink(al2);
      ctx.beginPath();
      ctx.moveTo(CX + ca * 26, CY + sa * 26);
      ctx.lineTo(CX + ca * maxDim * 0.88, CY + sa * maxDim * 0.88);
      ctx.stroke();
    }

    var rMin = 26 / s;
    var rMax = maxDim * 1.02 / s;
    var n0 = Math.ceil(Math.log(rMin) / LK);
    var n1 = Math.floor(Math.log(rMax) / LK);
    var rings = [];
    var hero = -1;
    var heroA = -Infinity;
    var heroTarget = minDim * 0.34;
    for (var n = n0; n <= n1; n++) {
      var r = Math.pow(K, n);
      var sr2 = r * s;
      var a2 = ringAlpha(sr2);
      if (a2 <= 0.004) continue;
      rings.push({ n: n, r: r, sr: sr2, a: a2, major: (((n % 3) + 3) % 3 === 0) });
      var score = -Math.abs(Math.log(sr2 / heroTarget));
      if (a2 > 0.05 && score > heroA) { heroA = score; hero = rings.length - 1; }
    }

    for (var ri = 0; ri < rings.length; ri++) {
      var g = rings[ri];
      var ga = g.a * baseA;
      if (ga < 0.003) continue;
      ctx.strokeStyle = ink(ga * (g.major ? 0.15 : 0.085) * music);
      ctx.lineWidth = g.major ? 0.8 : 0.5;
      ctx.beginPath();
      ctx.arc(CX, CY, g.sr, 0, TAU);
      ctx.stroke();

      if (g.major) {
        ctx.strokeStyle = accent(ga * 0.12);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(CX, CY, g.sr, rot - 0.18, rot + 0.1);
        ctx.stroke();
      }

      var a3 = rnd(g.n * 12.9 + 0.7) * TAU + rot * 0.6;
      var a4 = a3 + 2.35;
      for (var ci = 0; ci < 2; ci++) {
        var aa = ci === 0 ? a3 : a4;
        var px = CX + Math.cos(aa) * g.sr;
        var py = CY + Math.sin(aa) * g.sr;
        ctx.strokeStyle = ci === 0 ? accent(ga * 0.4) : ink(ga * 0.34);
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(px - 3, py); ctx.lineTo(px + 3, py);
        ctx.moveTo(px, py - 3); ctx.lineTo(px, py + 3);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(px, py, 2.4, 0, TAU);
        ctx.stroke();
      }
    }

    if (hero >= 0) {
      var hg = rings[hero];
      var ha = hg.a * baseA;
      ctx.strokeStyle = ink(ha * 0.22 * music);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(CX, CY, hg.sr, 0, TAU);
      ctx.stroke();

      ctx.lineWidth = 0.6;
      for (var tk = 0; tk < 72; tk++) {
        var ta = rot + tk * TAU / 72;
        var len = (tk % 6 === 0) ? 9 : 3.5;
        var tca = Math.cos(ta), tsa = Math.sin(ta);
        var rr = hg.sr - 1;
        ctx.strokeStyle = ink(ha * (tk % 6 === 0 ? 0.34 : 0.18) * music);
        ctx.beginPath();
        ctx.moveTo(CX + tca * rr, CY + tsa * rr);
        ctx.lineTo(CX + tca * (rr - len), CY + tsa * (rr - len));
        ctx.stroke();
      }

      var accentAng = rot + Math.PI * 1.5;
      ctx.strokeStyle = accent(ha * 0.55);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(accentAng) * hg.sr, CY + Math.sin(accentAng) * hg.sr);
      ctx.lineTo(CX + Math.cos(accentAng) * (hg.sr - 14), CY + Math.sin(accentAng) * (hg.sr - 14));
      ctx.stroke();

      var la = -0.62 + rot * 0.4;
      var lx = CX + Math.cos(la) * hg.sr;
      var ly = CY + Math.sin(la) * hg.sr;
      ctx.strokeStyle = ink(ha * 0.28);
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + 8, ly - 4);
      ctx.stroke();
      ctx.fillStyle = accent(ha * 0.75);
      ctx.beginPath();
      ctx.arc(lx, ly, 1.6, 0, TAU);
      ctx.fill();
      ctx.font = '11px ' + '"Cascadia Mono", Consolas, "SFMono-Regular", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = ink(Math.min(0.6, ha * 0.8));
      ctx.fillText('R ' + sciR(hg.r), lx + 12, ly - 5);
    }

    if (!RM && baseA > 0.04) {
      var settle = sstep(clamp(q / 0.35, 0, 1));
      var rawSweep = 0.8 + t * 0.085;
      var sweepA = rawSweep;
      if (settle > 0) {
        var dd = ((Math.PI - rawSweep) % TAU + TAU) % TAU - Math.PI;
        sweepA = rawSweep + dd * settle;
      }
      var spread = 0.5;
      var RR = maxDim * 0.72;
      var fanA = (1 - settle * 0.85) * baseA;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (var w = 0; w < 16; w++) {
        var wa = sweepA - (w + 1) * spread / 16;
        var wb = sweepA - w * spread / 16;
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, RR, wa, wb);
        ctx.closePath();
        ctx.fillStyle = accent((0.006 + 0.012 * (1 - w / 16)) * (0.35 + 0.65 * live.level) * fanA);
        ctx.fill();
      }

      var needleLen = minDim * 0.42;
      var targetLen = Math.min(310, W * 0.32) * 0.72;
      needleLen += (targetLen - needleLen) * settle;
      var ncx = Math.cos(sweepA), nsy = Math.sin(sweepA);
      var nx = CX + ncx * needleLen;
      var ny = CY + nsy * needleLen;
      ctx.strokeStyle = accent((0.14 + 0.08 * live.level) * baseA);
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(CX + ncx * 22, CY + nsy * 22);
      ctx.lineTo(nx, ny);
      ctx.stroke();
      ctx.strokeStyle = ink(0.2 * baseA);
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.arc(nx, ny, 6.5, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = accent(Math.min(0.6, 0.42 * baseA + 0.14 * beatGlow));
      ctx.beginPath();
      ctx.arc(nx, ny, 2.1 + 0.5 * live.bass, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    for (var pi = pulses.length - 1; pi >= 0; pi--) {
      var pu = pulses[pi];
      var age = (now - pu.at) / 1000;
      if (age > 1.7) { pulses.splice(pi, 1); continue; }
      var u = age / 1.7;
      var rad = 6 + easeOut(u) * minDim * 0.62;
      var pa = Math.pow(1 - u, 2.2) * 0.2 * pu.lv * (1 - 0.5 * q);
      ctx.strokeStyle = accent(pa);
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(CX, CY, rad, 0, TAU);
      ctx.stroke();
    }

    if (q > 0.001) {
      var bloom = Math.sin(Math.PI * clamp((q - 0.05) / 0.55, 0, 1));
      if (bloom > 0.001) {
        var bg2 = ctx.createRadialGradient(CX, CY, 0, CX, CY, minDim * 0.55);
        bg2.addColorStop(0, 'rgba(255,255,255,' + (0.1 * bloom).toFixed(4) + ')');
        bg2.addColorStop(0.35, accent(0.06 * bloom));
        bg2.addColorStop(1, accent(0));
        ctx.fillStyle = bg2;
        ctx.fillRect(0, 0, W, H);
      }
    }

    var boost = 1 + 0.18 * live.bass + 0.22 * beatGlow;
    var glowR = (q > 0.3 ? 26 : 54) * boost;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var gg = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
    gg.addColorStop(0, accent(0.16 * boost * (1 - 0.6 * q)));
    gg.addColorStop(0.4, accent(0.05 * boost * (1 - 0.6 * q)));
    gg.addColorStop(1, accent(0));
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(CX, CY, glowR, 0, TAU);
    ctx.fill();
    ctx.restore();

    if (q < 0.55) {
      var cA = 0.3 * (1 - q / 0.55);
      ctx.strokeStyle = ink(cA);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(CX - 15, CY); ctx.lineTo(CX - 6, CY);
      ctx.moveTo(CX + 6, CY); ctx.lineTo(CX + 15, CY);
      ctx.moveTo(CX, CY - 15); ctx.lineTo(CX, CY - 6);
      ctx.moveTo(CX, CY + 6); ctx.lineTo(CX, CY + 15);
      ctx.stroke();
      ctx.strokeStyle = accent(0.22 * (1 - q / 0.55));
      ctx.beginPath();
      ctx.arc(CX, CY, 7.5, 0, TAU);
      ctx.stroke();
    }

    ctx.fillStyle = '#f7fbff';
    ctx.beginPath();
    ctx.arc(CX, CY, 1.9 + 0.5 * beatGlow + 0.2 * live.bass + q * 0.6, 0, TAU);
    ctx.fill();

    if (vigGrad) {
      ctx.fillStyle = vigGrad;
      ctx.fillRect(0, 0, W, H);
    }

    if (grain && !RM) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      var fr = Math.floor(t * 60);
      var ox = -((fr * 167) % 512);
      var oy = -((fr * 311) % 512);
      for (var gy = oy - 512; gy < H + 512; gy += 512) {
        for (var gx = ox - 512; gx < W + 512; gx += 512) {
          ctx.drawImage(grain, gx, gy, 512, 512);
        }
      }
      ctx.restore();
    }
  }

  var lastCapAt = 0;
  function updateCaption(t, total, now) {
    if (now - lastCapAt < 180) return;
    lastCapAt = now;
    if (capClock) capClock.textContent = mmss(t) + ' / ' + mmss(total);
    if (scaleTag) scaleTag.textContent = '×' + sciS(curS);
  }

  var lastNow = performance.now();

  function frame(now) {
    var js0 = performance.now();
    try {
      var dt = clamp((now - lastNow) / 1000, 0, 0.08);
      lastNow = now;

      var t = clockTime(now);
      S.t = t;
      var total = totalDur();
      var p = total > 1 ? clamp(t / total, 0, 1) : 0;

      var i = idxAt(t);
      if (i !== curIdx) {
        curIdx = i;
        S.idx = i;
        renderLine(i);
      }
      updateChars(t);

      beatGlow *= Math.exp(-dt * 3.4);
      if (beatGlow < 0.0005) beatGlow = 0;

      live.bass += (liveT.bass - live.bass) * (1 - Math.exp(-dt / (liveT.bass > live.bass ? 0.09 : 0.42)));
      live.mid += (liveT.mid - live.mid) * (1 - Math.exp(-dt / (liveT.mid > live.mid ? 0.1 : 0.42)));
      live.treble += (liveT.treble - live.treble) * (1 - Math.exp(-dt / (liveT.treble > live.treble ? 0.08 : 0.36)));
      live.level += (liveT.level - live.level) * (1 - Math.exp(-dt / (liveT.level > live.level ? 0.1 : 0.45)));

      var ep = zoomEase(p);
      var breath = RM ? 0 : (Math.sin(t * 0.47) * 0.6 + Math.sin(t * 0.19 + 1.6) * 0.4);
      var punch = RM ? 0 : beatGlow * 0.0018;
      var logS = LOG_S0 + (LOG_S1 - LOG_S0) * ep + breath * 0.014 + punch;
      var s = Math.exp(logS);
      curS = s;

      var fq = sstep(clamp((p - finStart) / Math.max(0.02, 0.995 - finStart), 0, 1));
      finQ = fq;
      lastQSet(fq);

      updateCaption(t, total, now);
      draw(now, t, p, s, dt);
    } catch (e) {
      fail(e);
    } finally {
      S.js = performance.now() - js0;
      S.frames++;
    }
    requestAnimationFrame(frame);
  }

  var lastAct = 0;
  function pingActivity() {
    var n = performance.now();
    if (n - lastAct < 220) return;
    lastAct = n;
    try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (e) { }
  }

  addEventListener('mousemove', pingActivity, { passive: true });
  addEventListener('pointerdown', pingActivity, { passive: true });
  addEventListener('touchstart', pingActivity, { passive: true });

  addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') {
      try {
        parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*');
      } catch (err) { }
    }
  });

  addEventListener('resize', resize);

  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var pl = d.payload || {};
    try {
      if (d.type === 'init') {
        var song = pl.song || {};
        var sid = song.id != null ? String(song.id) : '';
        if (sid && sid !== lastSongId) {
          lastSongId = sid;
          clock.base = 0;
          clock.at = 0;
          clock.ok = false;
          S.t = 0;
          pulses.length = 0;
          beatGlow = 0;
          curS = 0.55;
        }

        var alb = song.album;
        if (alb && typeof alb === 'object') alb = alb.name;
        meta.name = cleanName(alb) || cleanName(song.name);
        meta.artist = artistText(song.artists);
        meta.duration = Math.max(0, num(pl.duration));

        setAccent(pl.accent);
        S.lines = sanitizeLines(pl.lines);
        S.idx = -1;
        inited = true;
        curIdx = -2;
        applyFinaleText();
        computeFinStart();

        if (typeof pl.playing === 'boolean') {
          S.playing = pl.playing;
          clock.playing = pl.playing;
        } else {
          S.playing = true;
          clock.playing = true;
        }
        lastCapAt = 0;
      } else if (d.type === 'tick') {
        var tt = Number(pl.time);
        if (isFinite(tt)) {
          clock.base = tt;
          clock.at = performance.now();
          clock.ok = true;
        }
        if (typeof pl.playing === 'boolean') {
          S.playing = pl.playing;
          clock.playing = pl.playing;
        }
      } else if (d.type === 'beat') {
        var lv = Number(pl.level);
        if (!isFinite(lv)) lv = 0.6;
        pulses.push({ at: performance.now(), lv: clamp(lv, 0, 1) });
        if (pulses.length > 7) pulses.shift();
        beatGlow = Math.min(1.4, beatGlow + 0.55 + lv * 0.5);
      } else if (d.type === 'live') {
        liveT.level = clamp(num(pl.level), 0, 1);
        liveT.bass = clamp(num(pl.bass), 0, 1);
        liveT.mid = clamp(num(pl.mid), 0, 1);
        liveT.treble = clamp(num(pl.treble), 0, 1);
        if (typeof pl.playing === 'boolean') {
          S.playing = pl.playing;
          clock.playing = pl.playing;
        }
      }
    } catch (e) {
      fail(e);
    }
  });

  buildMotes();
  resize();
  buildGrain();
  applyFinaleText();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
