<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>493 · Noir</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#06060a;overflow:hidden}
  #vec{position:fixed;inset:0;background:#06060a}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .scrim{position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(3,3,5,.90) 0%,rgba(3,3,5,.74) 24%,rgba(3,3,5,.32) 46%,rgba(3,3,5,.04) 65%,rgba(3,3,5,0) 100%)}
  .scrim2{position:absolute;inset:0;
    background:radial-gradient(120% 90% at 72% 46%,rgba(0,0,0,0) 40%,rgba(2,2,4,.55) 100%)}

  /* ——— 角落的黄色惊悚小说标题 ——— */
  .case{position:absolute;left:5.2vw;top:6.6vh;transform:rotate(-3.4deg);transform-origin:left top;
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;font-style:italic;
    color:var(--acc,#e8c25c);max-width:44vw}
  .case:before{content:"";display:block;width:min(210px,12vw);height:1px;margin:0 0 .9vh 2px;
    background:linear-gradient(90deg,var(--acc,#e8c25c),rgba(232,194,92,0))}
  .ct{font-size:clamp(17px,2.15vw,34px);line-height:1.08;letter-spacing:.05em;font-weight:700;
    text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs{font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;font-style:normal;font-weight:400;
    font-size:clamp(8px,0.78vw,12px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(240,224,178,.62);margin-top:.75em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{position:absolute;right:3.4vw;bottom:6vh;transform:rotate(90deg);transform-origin:right bottom;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(7px,.62vw,10px);letter-spacing:.5em;
    text-transform:uppercase;color:rgba(226,232,238,.30)}

  /* ——— 歌词 ——— */
  .lyr{position:absolute;left:6.4vw;bottom:14vh;width:min(58vw,760px)}
  .now{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
    font-size:clamp(21px,3.9vmin,50px);line-height:1.42;letter-spacing:.045em;font-weight:500;
    color:#f4eee0;text-shadow:0 1px 2px rgba(0,0,0,.7);word-break:break-word;overflow-wrap:anywhere}
  .now.swap{animation:lineIn .40s cubic-bezier(.22,.7,.3,1) both}
  @keyframes lineIn{from{opacity:0;transform:translateY(.16em)}to{opacity:1;transform:none}}
  .cm{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:clamp(8px,.72vw,11px);letter-spacing:.26em;color:rgba(220,228,236,.30);margin-top:2.1em}
  .now .w{color:rgba(238,232,216,.30);transition:color .22s ease}
  .now .w.on{color:#f8f2e3}
  .now.out{opacity:0}
  .next{margin-top:2.6vh;font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;
    font-size:clamp(11px,1.62vmin,20px);letter-spacing:.08em;color:rgba(232,226,210,.36);
    line-height:1.5;overflow:hidden;word-break:break-word}
  .bar{margin-top:1.9vh;width:min(180px,26vw);height:1px;background:rgba(240,234,220,.14);position:relative}
  .bar i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--acc,#e8c25c);transition:width .18s linear}
  .empty{position:absolute;left:6.4vw;bottom:16vh;font-family:Georgia,"Songti SC",serif;
    font-style:italic;font-size:clamp(15px,2.3vmin,26px);letter-spacing:.3em;color:rgba(238,231,214,.5);
    opacity:0;transition:opacity .5s ease}
  .empty.show{opacity:1}
  .empty small{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-style:normal;
    font-size:clamp(7px,.66vw,10px);letter-spacing:.42em;margin-top:1.2em;color:var(--accSoft,rgba(232,194,92,.5))}
  @media (max-aspect-ratio:1/1){
    .scrim{background:linear-gradient(180deg,rgba(3,3,5,.35) 0%,rgba(3,3,5,.55) 42%,rgba(3,3,5,.86) 78%,rgba(3,3,5,.94) 100%)}
    .lyr{left:7vw;bottom:11vh;width:86vw}
    .now{font-size:clamp(23px,5.6vmin,40px)}
    .case{max-width:72vw}
  }
</style>
</head>
<body>
<div id="vec"><canvas id="c"></canvas></div>
<div id="ui">
  <div class="scrim"></div>
  <div class="scrim2"></div>
  <div class="case" id="caseBox">
    <div class="ct" id="ct">无题</div>
    <div class="cs" id="cs"></div>
  </div>
  <div class="tag">Case 493 · Noir</div>
  <div class="lyr" id="lyr">
    <div class="now" id="now"></div>
    <div class="bar"><i id="barI"></i></div>
    <div class="next" id="nx"></div>
    <div class="cm" id="cm">SCENE 01</div>
  </div>
  <div class="empty" id="empty">此曲无词<small>Instrumental</small></div>
</div>
<script>
(function(){
  'use strict';
  var D = document;
  var cv = D.getElementById('c');
  var cx = cv.getContext('2d', { alpha: false });
  var elNow = D.getElementById('now'), elNx = D.getElementById('nx'), elEmpty = D.getElementById('empty');
  var elCt = D.getElementById('ct'), elCs = D.getElementById('cs'), elBar = D.getElementById('barI');
  var elCm = D.getElementById('cm');

  var S = {
    W: 1440, H: 900, dpr: 1,
    lines: [], idx: -1, t: 0, playing: true,
    frames: 0, js: 0, gl: false, rm: false,
    song: { name: '', artists: '' }, accent: [232, 194, 92], dur: 0,
    readySent: false, cur: null, curIdx: -2, lit: 0,
    beatLvl: 0, beatAt: -99, live: { level: 0, bass: 0, mid: 0, treble: 0 },
    sc: 0, lastNow: 0, cmShown: ''
  };

  try { S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e){ console.error(e); }

  /* ===== 自检口：全文件唯一一次定义 ===== */
  window.__stage = function(){
    var ln = S.idx >= 0 ? S.lines[S.idx] : null;
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: '',
      text: ln ? String(ln.text || '') : '', gl: false, rm: S.rm
    };
  };

  function ready(){
    if (S.readySent) return;
    S.readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch(e){ console.error(e); }
  }

  function num(v, d){ v = +v; return isFinite(v) ? v : d; }

  /* ---------- 尺寸与预渲染 ---------- */
  function resize(){
    var w = Math.round(window.innerWidth || 0), h = Math.round(window.innerHeight || 0);
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    S.W = w; S.H = h;
    S.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    cv.width = Math.max(2, Math.round(w * S.dpr));
    cv.height = Math.max(2, Math.round(h * S.dpr));
    cx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    build();
  }

  /* ---------- 离屏层 ---------- */
  var B = {}, L = {}, DUST = [];
  function mk(w, h){
    var c = D.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  function layout(){
    var W = S.W, H = S.H, portrait = (W / H) < 0.92;
    L.portrait = portrait;
    if (portrait){
      L.wx = W * 0.13; L.wy = H * 0.152; L.ww = W * 0.84; L.wh = H * 0.335;
      L.figH = Math.min(H * 0.415, W * 0.99);
      L.figTop = H * 0.238;
      L.figX = W * 0.60;
    } else {
      L.wx = W * 0.585; L.wy = H * 0.072; L.ww = W * 0.352; L.wh = H * 0.818;
      L.figH = H * 0.80;
      L.figTop = H * 0.198;
      L.figX = W * 0.716;
    }
  }

  function build(){
    layout();
    try { buildBg(); } catch(e){ console.error('[493 bg]', e); }
    try { buildStripes(); } catch(e){ console.error('[493 stripes]', e); }
    try { buildFigure(); } catch(e){ console.error('[493 figure]', e); }
    try { buildSmoke(); } catch(e){ console.error('[493 smoke]', e); }
    try { buildGrain(); } catch(e){ console.error('[493 grain]', e); }
    try { buildPool(); } catch(e){ console.error('[493 pool]', e); }
    try { applyAccent(); } catch(e){ console.error('[493 accent]', e); }
    initDust();
  }

  function applyAccent(){
    var a = S.accent || [232, 194, 92];
    var r = a[0] | 0, g = a[1] | 0, b = a[2] | 0;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var sat = mx === 0 ? 0 : (mx - mn) / mx;
    // 封面太灰 / 太暗时退回"惊悚小说黄"
    if (!isFinite(sat) || sat < 0.22 || mx < 60){ r = 232; g = 194; b = 92; }
    var lum = (0.299 * r + 0.587 * g + 0.114 * b);
    if (!isFinite(lum) || lum > 176){ r = Math.round(r * 0.86); g = Math.round(g * 0.80); b = Math.round(b * 0.62); }
    D.documentElement.style.setProperty('--acc', 'rgb(' + r + ',' + g + ',' + b + ')');
    D.documentElement.style.setProperty('--accSoft', 'rgba(' + r + ',' + g + ',' + b + ',0.55)');
  }

  function buildBg(){
    var W = S.W, H = S.H, d = S.dpr;
    var c = mk(W * d, H * d), g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);

    // 墙面
    var wg = g.createLinearGradient(0, 0, W * 0.7, H);
    wg.addColorStop(0, '#13151b'); wg.addColorStop(0.42, '#0b0c10'); wg.addColorStop(1, '#050507');
    g.fillStyle = wg; g.fillRect(0, 0, W, H);

    // 灰泥竖缝
    var sw = Math.max(2, W * 0.005);
    for (var x = W * 0.05; x < W * 0.96; x += W * 0.118){
      g.fillStyle = 'rgba(255,255,255,0.013)';
      g.fillRect(x, 0, sw, H * 0.86);
      g.fillStyle = 'rgba(0,0,0,0.30)';
      g.fillRect(x + sw, 0, Math.max(1, sw * 0.6), H * 0.86);
    }

    // 踢脚线 + 地板
    var skirtY = H * 0.862;
    g.fillStyle = 'rgba(255,255,255,0.045)';
    g.fillRect(0, skirtY, W, Math.max(1, H * 0.003));
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillRect(0, skirtY + Math.max(1, H * 0.003), W, H * 0.03);
    var fg = g.createLinearGradient(0, skirtY, 0, H);
    fg.addColorStop(0, '#0e0e12'); fg.addColorStop(1, '#030304');
    g.fillStyle = fg; g.fillRect(0, skirtY, W, H - skirtY);
    g.fillStyle = 'rgba(150,166,178,0.05)';
    g.fillRect(0, skirtY + H * 0.004, W, Math.max(1, H * 0.0012));

    // 窗外散光
    var cxp = L.wx + L.ww * 0.52, cyp = L.wy + L.wh * 0.40;
    var spill = g.createRadialGradient(cxp, cyp, Math.min(L.ww, L.wh) * 0.18, cxp, cyp, Math.max(W, H) * 0.66);
    spill.addColorStop(0, 'rgba(126,144,158,0.34)');
    spill.addColorStop(0.36, 'rgba(70,84,98,0.14)');
    spill.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = spill; g.fillRect(0, 0, W, H);

    // 窗洞
    g.save();
    g.beginPath(); g.rect(L.wx, L.wy, L.ww, L.wh); g.clip();
    var sky = g.createLinearGradient(L.wx, L.wy, L.wx + L.ww * 0.34, L.wy + L.wh);
    sky.addColorStop(0, 'rgba(198,214,222,0.95)');
    sky.addColorStop(0.42, 'rgba(154,174,184,0.74)');
    sky.addColorStop(0.78, 'rgba(98,114,126,0.44)');
    sky.addColorStop(1, 'rgba(48,58,68,0.22)');
    g.fillStyle = sky; g.fillRect(L.wx, L.wy, L.ww, L.wh);

    // 远处楼影 / 消防梯
    var bh = L.wh * 0.32;
    g.fillStyle = 'rgba(11,13,17,0.58)';
    g.fillRect(L.wx, L.wy + L.wh - bh, L.ww, bh);
    g.fillStyle = 'rgba(9,11,14,0.72)';
    g.fillRect(L.wx + L.ww * 0.56, L.wy + L.wh - bh * 1.85, L.ww * 0.44, bh * 1.85);
    g.strokeStyle = 'rgba(9,11,14,0.50)';
    g.lineWidth = Math.max(1, L.wh * 0.0035);
    for (var i = 0; i < 4; i++){
      var yy = L.wy + L.wh - bh * 0.80 + i * bh * 0.135;
      g.beginPath(); g.moveTo(L.wx, yy); g.lineTo(L.wx + L.ww, yy); g.stroke();
    }
    // 街灯光晕
    var lamp = g.createRadialGradient(L.wx + L.ww * 0.60, L.wy + L.wh * 0.34, 0,
      L.wx + L.ww * 0.60, L.wy + L.wh * 0.34, L.ww * 1.0);
    lamp.addColorStop(0, 'rgba(234,242,246,0.60)');
    lamp.addColorStop(0.48, 'rgba(182,198,208,0.18)');
    lamp.addColorStop(1, 'rgba(182,198,208,0)');
    g.fillStyle = lamp; g.fillRect(L.wx, L.wy, L.ww, L.wh);
    g.restore();

    // 窗框 / 中梃 / 窗台
    var fw = Math.max(2, Math.min(W, H) * 0.0055);
    g.fillStyle = 'rgba(4,4,6,0.94)';
    g.fillRect(L.wx - fw, L.wy - fw, fw, L.wh + fw * 2);
    g.fillRect(L.wx + L.ww, L.wy - fw, fw, L.wh + fw * 2);
    g.fillRect(L.wx - fw, L.wy - fw, L.ww + fw * 2, fw);
    g.fillRect(L.wx - fw, L.wy + L.wh, L.ww + fw * 2, fw);
    var mw = Math.max(1.5, fw * 0.7);
    g.fillRect(L.wx + L.ww * 0.52 - mw / 2, L.wy, mw, L.wh);
    g.fillRect(L.wx, L.wy + L.wh * 0.44, L.ww, mw);
    g.fillStyle = 'rgba(17,19,24,1)';
    g.fillRect(L.wx - fw * 3, L.wy + L.wh + fw, L.ww + fw * 6, Math.max(3, H * 0.011));

    // 暗角
    var vg = g.createRadialGradient(W * 0.57, H * 0.45, Math.min(W, H) * 0.16, W * 0.57, H * 0.45, Math.max(W, H) * 0.80);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.52, 'rgba(0,0,0,0.22)');
    vg.addColorStop(1, 'rgba(2,2,3,0.88)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);

    B.bg = c;
  }

  function buildStripes(){
    var W = S.W, H = S.H, d = S.dpr;
    var c = mk(W * d, H * d), g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    var span = Math.sqrt(W * W + H * H) * 1.25;
    var pitch = (L.portrait ? H * 0.070 : H * 0.092);
    var barH = pitch * 0.55;
    g.save();
    g.translate(W * 0.54, H * 0.44);
    g.rotate(-0.34);
    g.filter = 'blur(' + Math.max(2, pitch * 0.10).toFixed(1) + 'px)';
    g.fillStyle = 'rgba(208,222,230,1)';
    var n = 0;
    for (var y = -span; y < span && n < 90; y += pitch, n++){
      g.fillRect(-span, y, span * 2, barH);
    }
    g.filter = 'none';
    g.restore();

    var cxp = L.wx + L.ww * 0.60, cyp = L.wy + L.wh * 0.38;
    g.globalCompositeOperation = 'destination-in';
    var rad = g.createRadialGradient(cxp, cyp, Math.min(W, H) * 0.10, cxp, cyp, Math.max(W, H) * 0.98);
    rad.addColorStop(0, 'rgba(0,0,0,0.98)');
    rad.addColorStop(0.44, 'rgba(0,0,0,0.56)');
    rad.addColorStop(1, 'rgba(0,0,0,0.10)');
    g.fillStyle = rad; g.fillRect(0, 0, W, H);
    var lf = g.createLinearGradient(0, 0, W * 0.62, 0);
    lf.addColorStop(0, 'rgba(0,0,0,0.18)');
    lf.addColorStop(1, 'rgba(0,0,0,1)');
    g.fillStyle = lf; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
    B.stripe = c;
  }

  function buildFigure(){
    var hf = L.figH, pad = 26, d = S.dpr;
    var fw = hf * 0.52, fh = hf * 1.07;
    var c = mk((fw + pad * 2) * d, (fh + pad * 2) * d), g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    g.translate(pad + fw / 2, pad);
    g.scale(hf, hf);
    g.fillStyle = '#07070a';

    // 大衣主体
    g.beginPath();
    g.moveTo(-0.176, 0.346);
    g.bezierCurveTo(-0.090, 0.296, 0.014, 0.288, 0.146, 0.326);
    g.bezierCurveTo(0.188, 0.350, 0.196, 0.442, 0.204, 0.560);
    g.bezierCurveTo(0.212, 0.720, 0.212, 0.890, 0.215, 1.070);
    g.lineTo(-0.206, 1.070);
    g.bezierCurveTo(-0.212, 0.890, -0.208, 0.720, -0.200, 0.560);
    g.bezierCurveTo(-0.194, 0.442, -0.196, 0.380, -0.176, 0.346);
    g.closePath(); g.fill();

    // 立起的衣领
    g.beginPath();
    g.moveTo(-0.092, 0.352);
    g.bezierCurveTo(-0.062, 0.256, 0.006, 0.242, 0.048, 0.252);
    g.lineTo(0.090, 0.288);
    g.lineTo(0.060, 0.340);
    g.lineTo(-0.092, 0.352);
    g.closePath(); g.fill();

    // 脖子
    g.fillRect(-0.006, 0.222, 0.090, 0.086);

    // 头 / 侧脸
    g.beginPath();
    g.ellipse(0.028, 0.164, 0.073, 0.080, 0, 0, Math.PI * 2); g.fill();
    g.beginPath();
    g.moveTo(0.084, 0.146); g.lineTo(0.114, 0.177); g.lineTo(0.086, 0.188);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(0.090, 0.197); g.lineTo(0.106, 0.207); g.lineTo(0.092, 0.214);
    g.closePath(); g.fill();

    // 软呢帽帽檐
    g.save();
    g.translate(0.018, 0.108); g.rotate(-0.055);
    g.beginPath(); g.ellipse(0, 0, 0.185, 0.0295, 0, 0, Math.PI * 2); g.fill();
    g.restore();

    // 帽冠（带捏痕）
    g.beginPath();
    g.moveTo(-0.099, 0.112);
    g.bezierCurveTo(-0.106, 0.046, -0.076, 0.006, -0.020, 0.003);
    g.bezierCurveTo(-0.010, 0.032, 0.008, 0.032, 0.021, 0.005);
    g.bezierCurveTo(0.072, 0.012, 0.114, 0.044, 0.120, 0.112);
    g.closePath(); g.fill();

    // 轮廓冷光（只在剪影上）
    g.globalCompositeOperation = 'source-atop';
    var rim = g.createLinearGradient(0.245, 0.05, 0.105, 0.10);
    rim.addColorStop(0, 'rgba(216,230,238,0.62)');
    rim.addColorStop(0.45, 'rgba(198,216,228,0.20)');
    rim.addColorStop(1, 'rgba(198,216,228,0)');
    g.fillStyle = rim; g.fillRect(-0.3, -0.1, 0.7, 1.4);
    var top = g.createLinearGradient(0, -0.02, 0, 0.16);
    top.addColorStop(0, 'rgba(226,238,244,0.20)');
    top.addColorStop(1, 'rgba(226,238,244,0)');
    g.fillStyle = top; g.fillRect(-0.3, -0.1, 0.7, 0.4);
    g.globalCompositeOperation = 'source-over';

    B.fig = c;
    B.figW = fw + pad * 2;
    B.figH = fh + pad * 2;
    B.figPad = pad;

    // 把百叶窗的暗条纹也烙在剪影上 —— 光从人身上切过去
    try {
      var gx = L.figX - B.figW / 2, gy = L.figTop - pad;
      var span2 = Math.sqrt(S.W * S.W + S.H * S.H) * 1.3;
      var pitch2 = (L.portrait ? S.H * 0.070 : S.H * 0.092);
      g.save();
      g.globalCompositeOperation = 'source-atop';
      g.translate(S.W * 0.54 - gx, S.H * 0.44 - gy);
      g.rotate(-0.34);
      g.fillStyle = 'rgba(3,4,7,0.90)';
      var k = 0;
      for (var yy = -span2; yy < span2 && k < 90; yy += pitch2, k++){
        g.fillRect(-span2, yy + pitch2 * 0.55, span2 * 2, pitch2 * 0.45);
      }
      g.restore();
    } catch(e){ console.error('[493 figstripes]', e); }
  }

  function buildSmoke(){
    var w = Math.round(Math.min(S.W * 0.30, 430));
    var h = Math.round(Math.min(S.H * 0.46, 520));
    var d = S.dpr;
    var c = mk(w * d, h * d), g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    g.lineCap = 'round';
    g.filter = 'blur(' + (w * 0.055).toFixed(1) + 'px)';
    for (var i = 0; i < 9; i++){
      var x0 = w * (0.46 + ((i % 3) - 1) * 0.05);
      g.beginPath();
      g.moveTo(x0, h * 1.04);
      g.bezierCurveTo(x0 - w * 0.22, h * 0.74, x0 + w * 0.27, h * 0.52, x0 - w * 0.03, h * 0.20);
      g.strokeStyle = 'rgba(216,226,232,' + (0.15 - i * 0.011).toFixed(3) + ')';
      g.lineWidth = w * Math.max(0.006, 0.030 - i * 0.0022);
      g.stroke();
    }
    g.filter = 'none';
    B.smoke = c; B.smokeW = w; B.smokeH = h;
  }

  function buildGrain(){
    var n = 160;
    var c = mk(n, n), g = c.getContext('2d');
    var id = g.createImageData(n, n);
    for (var i = 0; i < n * n; i++){
      var v = 108 + Math.random() * 96;
      id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v;
      id.data[i * 4 + 3] = 30;
    }
    g.putImageData(id, 0, 0);
    B.grain = c;
    try { B.grainPat = cx.createPattern(c, 'repeat'); } catch(e){ console.error(e); B.grainPat = null; }
  }

  function initDust(){
    DUST = [];
    var n = S.rm ? 10 : 26;
    for (var i = 0; i < n; i++){
      DUST.push({
        x: Math.random(), y: Math.random(),
        s: 0.5 + Math.random() * 1.2,
        vy: 0.0009 + Math.random() * 0.0022,
        vx: (Math.random() - 0.5) * 0.0012,
        a: 0.12 + Math.random() * 0.42
      });
    }
  }

  /* ---------- 歌词解析 ---------- */
  function normLines(arr){
    var out = [], i, n;
    if (!Array.isArray(arr)) return out;
    n = Math.min(arr.length, 1200);
    for (i = 0; i < n; i++){
      var L = arr[i];
      if (!L) continue;
      var txt = (L.text === 0 ? '0' : L.text);
      txt = (typeof txt === 'string') ? txt : (txt == null ? '' : String(txt));
      var t0 = num(L.t, 0), dur = num(L.dur, 0);
      var chars = Array.isArray(L.chars) ? L.chars : null;
      out.push({ t: t0, dur: dur, text: txt, chars: chars });
    }
    // 脏数据可能乱序：按时间稳定排序（带固定上限的比较，不写 while 死循环）
    out.sort(function(a, b){ return a.t - b.t; });
    return out;
  }

  function tokenize(text, t0, dur, chars){
    var toks = [], i, cp, arr, ct = [], n = text.length;
    var fallbackSpan = dur > 0.15 ? dur * 0.92 : 3.2;
    for (i = 0; i < n; i++){
      var has = chars && chars[i] && isFinite(+chars[i].t);
      ct.push(has ? +chars[i].t : (t0 + fallbackSpan * (i / Math.max(1, n))));
    }
    var buf = '', bufT = 0;
    function flush(){ if (buf){ toks.push({ s: buf, t: bufT }); buf = ''; } }
    for (i = 0; i < n; i++){
      var ch = text.charAt(i);
      var isLatin = /[A-Za-z0-9'’\- ]/.test(ch);
      if (isLatin){
        if (!buf) bufT = ct[i];
        buf += ch;
      } else {
        flush();
        toks.push({ s: ch, t: ct[i] });
      }
    }
    flush();
    return toks;
  }

  function setLine(i){
    if (i === S.curIdx) return;
    S.curIdx = i;
    updateScene(i);
    var L2 = i >= 0 ? S.lines[i] : null;
    if (!L2){ S.cur = null; elNow.innerHTML = ''; elNx.textContent = ''; elBar.style.width = '0%'; return; }
    var toks = tokenize(L2.text || '', L2.t, L2.dur, L2.chars);
    var frag = D.createDocumentFragment(), spans = [];
    for (var k = 0; k < toks.length; k++){
      var sp = D.createElement('span');
      sp.className = 'w';
      sp.textContent = toks[k].s;
      frag.appendChild(sp); spans.push(sp);
    }
    elNow.innerHTML = '';
    elNow.appendChild(frag);
    elNow.classList.remove('swap');
    void elNow.offsetWidth;
    if (!S.rm) elNow.classList.add('swap');
    S.cur = { times: toks.map(function(o){ return o.t; }), spans: spans, lit: 0, idx: i };
    S.lit = 0;
    var nl = S.lines[i + 1];
    elNx.textContent = nl ? (nl.text || '') : '';
    fitNow();
    // 立即同步一次（跳转/回放）
    syncChars();
    elNow.classList.remove('out');
  }

  function syncChars(){
    var C = S.cur; if (!C) return;
    var k = 0, i, n = C.times.length;
    for (i = 0; i < n; i++) if (C.times[i] <= S.t + 0.03) k = i + 1;
    if (k === C.lit) return;
    if (k > C.lit){ for (i = C.lit; i < k; i++) if (C.spans[i]) C.spans[i].classList.add('on'); }
    else { for (i = k; i < C.lit; i++) if (C.spans[i]) C.spans[i].classList.remove('on'); }
    C.lit = k; S.lit = k;
    elBar.style.width = (n ? Math.min(100, k / n * 100) : 0).toFixed(1) + '%';
  }

  function updateScene(i){
    var n = S.lines.length;
    var s = i < 0 ? 1 : Math.min(99, i + 1);
    var txt = 'SCENE ' + (s < 10 ? '0' + s : '' + s) + (n ? ' / ' + (n < 10 ? '0' + n : n) : ' / --');
    if (txt !== S.cmShown){ S.cmShown = txt; elCm.textContent = txt; }
  }

  function fitNow(){
    var fs = Math.min(S.W, S.H);
    var base = fs * (S.W / S.H < 1 ? 0.056 : 0.0455);
    base = Math.max(18, Math.min(base, 52));
    elNow.style.fontSize = base.toFixed(1) + 'px';
    var cap = Math.max(90, S.H * 0.34);
    for (var g = 0; g < 7 && elNow.scrollHeight > cap; g++){
      base *= 0.86;
      elNow.style.fontSize = base.toFixed(1) + 'px';
    }
  }

  /* ---------- 消息 ---------- */
  function onInit(p){
    p = p || {};
    var song = p.song || {};
    var name = song.name == null ? '' : String(song.name);
    var art = song.artists;
    if (Array.isArray(art)) art = art.filter(Boolean).join(' / ');
    art = art == null ? '' : String(art);
    S.song.name = name; S.song.artists = art;
    elCt.textContent = name || '无题';
    elCs.textContent = art || 'The Jazz Detective';
    if (Array.isArray(p.accent) && p.accent.length >= 3){
      var a = p.accent.map(function(v){ return Math.max(0, Math.min(255, num(v, 0))); });
      S.accent = a;
    }
    S.dur = num(p.duration, 0);
    S.lines = normLines(p.lines);
    S.idx = -1; S.curIdx = -2; S.cur = null;
    S.cmShown = '';
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    elEmpty.classList.toggle('show', S.lines.length === 0);
    elNow.classList.remove('out');
    setLine(-1);
    updateIdx();
    fitNow();
    try { applyAccent(); } catch(e){ console.error('[493 accent]', e); }
  }

  function updateIdx(){
    var t = S.t, lo = 0, hi = S.lines.length - 1, res = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (S.lines[mid].t <= t + 0.02){ res = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (res !== S.idx){ S.idx = res; setLine(res); }
    else syncChars();
  }

  function onTick(p){
    p = p || {};
    S.t = num(p.time, S.t);
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    updateIdx();
  }

  function onBeat(p){
    p = p || {};
    S.beatLvl = Math.max(0, Math.min(1, num(p.level, 0.6)));
    S.beatAt = performance.now();
  }

  function onLive(p){
    p = p || {};
    S.live.level = Math.max(0, Math.min(1, num(p.level, 0)));
    S.live.bass = Math.max(0, Math.min(1, num(p.bass, 0)));
    S.live.mid = Math.max(0, Math.min(1, num(p.mid, 0)));
    S.live.treble = Math.max(0, Math.min(1, num(p.treble, 0)));
    if (typeof p.playing === 'boolean') S.playing = p.playing;
  }

  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object' || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch (err){ console.error('[493 noir]', err); }
  }, false);

  /* ---------- 主循环 ---------- */
  function pulse(){
    if (S.rm) return 0;
    var dt = (performance.now() - S.beatAt) / 1000;
    if (dt < 0 || dt > 1.2) return 0;
    return S.beatLvl * Math.exp(-dt * 4.2);
  }

  function buildPool(){
    var W = S.W, H = S.H, d = S.dpr;
    var c = mk(W * d, H * d), g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    g.save();
    g.translate(W * 0.70, H * 0.925);
    g.scale(1, 0.30);
    var r = Math.max(W, H) * 0.52;
    var rg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    rg.addColorStop(0, 'rgba(196,214,224,0.20)');
    rg.addColorStop(0.42, 'rgba(150,172,186,0.075)');
    rg.addColorStop(1, 'rgba(120,140,155,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    g.restore();
    B.pool = c;
  }

  function draw(){
    var W = S.W, H = S.H;
    var now = performance.now(), ts = S.sc + now * 0.00004;
    cx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    cx.globalAlpha = 1;
    cx.globalCompositeOperation = 'source-over';

    if (B.bg) cx.drawImage(B.bg, 0, 0, W, H);
    else { cx.fillStyle = '#08080c'; cx.fillRect(0, 0, W, H); }

    var pl = pulse();
    var bass = S.live.bass, lvl = S.live.level;

    // 百叶窗光带 — 轻微游移 + 随拍呼吸
    if (B.stripe){
      var drift = S.rm ? 0 : Math.sin(ts * 0.21) * W * 0.012;
      cx.globalCompositeOperation = 'lighter';
      cx.globalAlpha = 0.46 + pl * 0.15 + lvl * 0.07;
      cx.drawImage(B.stripe, drift, S.rm ? 0 : Math.cos(ts * 0.17) * H * 0.008, W, H);
      cx.globalAlpha = 1;
      cx.globalCompositeOperation = 'source-over';
    }

    // 地面光池
    if (B.pool){
      cx.globalCompositeOperation = 'lighter';
      cx.globalAlpha = 0.55 + pl * 0.30;
      cx.drawImage(B.pool, 0, 0, W, H);
      cx.globalAlpha = 1;
      cx.globalCompositeOperation = 'source-over';
    }

    // 侦探剪影
    if (B.fig && B.figW){
      var self = 1 + pl * 0.006;
      var fx = L.figX, fy = L.figTop - B.figPad;
      cx.save();
      cx.translate(fx, fy + B.figH * 0.5);
      cx.scale(self, self);
      cx.drawImage(B.fig, -B.figW / 2, -B.figH / 2, B.figW, B.figH);
      cx.restore();

      // 香烟与烟头：从嘴角伸向光里
      var hf = L.figH;
      var mx0 = fx + 0.100 * hf, my0 = L.figTop + 0.208 * hf;
      var ex = fx + 0.196 * hf, ey = L.figTop + 0.219 * hf;
      cx.strokeStyle = 'rgba(206,216,222,0.58)';
      cx.lineWidth = Math.max(1, hf * 0.008);
      cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(mx0, my0); cx.lineTo(ex, ey); cx.stroke();

      var em = 0.5 + bass * 0.5 + pl * 0.3;
      var er = Math.max(6, hf * 0.042);
      var eg = cx.createRadialGradient(ex, ey, 0, ex, ey, er);
      eg.addColorStop(0, 'rgba(255,176,104,' + Math.min(0.9, 0.42 * em).toFixed(3) + ')');
      eg.addColorStop(0.34, 'rgba(242,122,54,' + Math.min(0.6, 0.15 * em).toFixed(3) + ')');
      eg.addColorStop(1, 'rgba(220,90,40,0)');
      cx.globalCompositeOperation = 'lighter';
      cx.fillStyle = eg;
      cx.beginPath(); cx.arc(ex, ey, er, 0, Math.PI * 2); cx.fill();
      cx.globalCompositeOperation = 'source-over';

      // 烟从烟头升起
      if (B.smoke && !S.rm){
        var sway = Math.sin(ts * 0.55) * W * 0.012;
        var sx = ex - B.smokeW * 0.42 + sway;
        var sy = ey - B.smokeH * 0.96;
        cx.globalAlpha = 0.70 + pl * 0.16;
        cx.drawImage(B.smoke, sx, sy, B.smokeW, B.smokeH);
        cx.globalAlpha = 1;
      }
    }

    // 光柱里的尘埃
    if (!S.rm && DUST.length){
      cx.globalCompositeOperation = 'lighter';
      var wx0 = L.wx, wy0 = L.wy, ww = L.ww, wh = L.wh;
      var ccx = wx0 + ww * 0.58, ccy = wy0 + wh * 0.42;
      for (var i = 0; i < DUST.length; i++){
        var p = DUST[i];
        p.y -= p.vy; p.x += p.vx + Math.sin(ts * 0.6 + i) * 0.00035;
        if (p.y < -0.05){ p.y = 1.06; p.x = Math.random(); }
        if (p.x < -0.05) p.x = 1.05; else if (p.x > 1.05) p.x = -0.05;
        var dx = ccx + (p.x - 0.5) * ww * 2.5;
        var dy = ccy + (p.y - 0.5) * wh * 2.2;
        var fall = 1 - Math.min(1, Math.hypot((dx - ccx) / (ww * 1.6), (dy - ccy) / (wh * 1.7)));
        if (fall <= 0.02) continue;
        cx.fillStyle = 'rgba(222,234,240,' + (p.a * fall * (0.55 + pl * 0.4)).toFixed(3) + ')';
        cx.beginPath();
        cx.arc(dx, dy, p.s * (1 + pl * 0.25), 0, Math.PI * 2);
        cx.fill();
      }
      cx.globalCompositeOperation = 'source-over';
    }

    // 胶片颗粒
    if (B.grainPat){
      var ox = (Math.random() * 160) | 0, oy = (Math.random() * 160) | 0;
      cx.globalAlpha = S.rm ? 0.16 : 0.30;
      cx.fillStyle = B.grainPat;
      cx.save();
      cx.translate(-ox, -oy);
      cx.fillRect(0, 0, W + 160, H + 160);
      cx.restore();
      cx.globalAlpha = 1;
    }
  }

  function frame(now){
    if (!S.readySent) ready();
    requestAnimationFrame(frame);
    var t0 = performance.now();
    var dt = S.lastNow ? (now - S.lastNow) : 16.7;
    S.lastNow = now;
    if (!isFinite(dt) || dt < 0) dt = 16.7;
    if (dt > 120) dt = 120;
    if (S.playing && !S.rm) S.sc += dt / 1000;
    try { draw(); } catch (err){ console.error('[493 noir draw]', err); }
    S.js = performance.now() - t0;
    S.frames++;
  }

  window.addEventListener('resize', function(){
    clearTimeout(window.__rz);
    window.__rz = setTimeout(function(){ try { resize(); } catch(e){ console.error(e); } }, 120);
  }, false);

  resize();
  requestAnimationFrame(frame);
  setTimeout(function(){ ready(); }, 600);
})();
</script>
</body>
</html>
