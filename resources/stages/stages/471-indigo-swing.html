<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>藍摺</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#EDE4D0}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,"Songti SC","STSong","SimSun",serif;
       color:#16273D;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;overflow:hidden}
  #paper{position:absolute;inset:0;z-index:0}
  #ink{position:absolute;inset:0;z-index:2}
  #lyr{position:absolute;inset:0;z-index:5;display:flex;align-items:center;
       justify-content:flex-end;padding:0 clamp(18px,4.6vw,86px) 0 calc(var(--pw, 44vw) + 2.6vw);
       pointer-events:none}
  #lines{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
         gap:.30em;max-width:min(46vw,780px);text-align:left;min-height:0}
  .ln{font-size:calc(var(--fs) * .56);line-height:1.22;letter-spacing:.012em;position:relative;
      color:#12405F;margin:0;max-width:100%;word-break:break-word;overflow-wrap:anywhere;
      transition:font-size .40s cubic-bezier(.22,.61,.36,1),color .30s linear,opacity .40s ease}
  #stage.night #stamp .meta{color:#DCD5C2;opacity:.72}
  #stage.night #stamp .seal{color:#E8E1CE;border-color:#E8E1CE}
  .ln .c{color:#4E86A0;transition:color .16s linear}
  .ln .c.on{color:#0B1B2E}
  .ln.cur{font-size:var(--fs);color:#12405F}
  .ln.cur .c{color:#4E86A0}
  .ln.cur .c.on{color:#0B1B2E}
  .ln.prev{color:#5A8AA0;opacity:.62}
  .ln.prev .c{color:#7FA8B8}
  .ln.prev .c.on{color:#4A7E97}
  .ln.next{color:#5A8AA0;opacity:.38}
  .ln.next .c{color:#7FA8B8}
  .ln.next .c.on{color:#4A7E97}
  #empty{position:absolute;right:clamp(18px,5vw,90px);top:50%;transform:translateY(-50%);
         font-size:clamp(15px,1.5vw,20px);letter-spacing:.4em;color:#0F2136;opacity:.6;
         display:none;text-align:left;line-height:2}
  #empty b{display:block;font-size:clamp(34px,4.4vw,64px);letter-spacing:.1em;opacity:.18;margin-bottom:.1em}
  #stamp{position:absolute;left:clamp(18px,5vw,90px);bottom:clamp(18px,5vh,54px);z-index:6;
         display:flex;align-items:flex-end;gap:clamp(8px,1.2vw,18px);pointer-events:none}
  #stamp .seal{width:clamp(30px,3vw,46px);height:clamp(30px,3vw,46px);border:2px solid #A83B2B;
         color:#A83B2B;display:flex;align-items:center;justify-content:center;flex-direction:column;
         font-size:clamp(11px,1.05vw,15px);line-height:1.02;letter-spacing:0;opacity:.78;
         transform:rotate(-6deg);border-radius:2px;font-weight:600}
  #stamp .meta{font-size:clamp(9px,.86vw,12px);letter-spacing:.28em;color:#16273D;opacity:.6;
         text-transform:uppercase;max-width:min(46vw,520px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #grain{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.55;
         background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
         background-size:180px 180px;mix-blend-mode:multiply}
  @media (max-aspect-ratio:1/1){
    #lyr{justify-content:flex-start;align-items:flex-end;padding:0 clamp(18px,7vw,44px) 4vh;}
    #lines{max-width:100%;align-items:flex-start;width:100%}
    #stamp .meta{max-width:56vw}
    #stamp{bottom:clamp(10px,2.4vh,22px)}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="paper" aria-hidden="true"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <div id="lyr"><div id="lines"></div></div>
  <div id="empty"><b>藍</b>無歌詞</div>  <div id="stamp"><div class="seal">藍摺<span>JAZZ</span></div><div class="meta"></div></div>
  <div id="grain"></div>
</div>
<script>
(function(){
  'use strict';
  var W=1440,H=900,DPR=1;
  var S={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',acc:[0,0,0],tBase:0,tAt:0,cover:''};
  var stageEl=document.getElementById('stage'),paper=document.getElementById('paper'),
      ink=document.getElementById('ink'),lyr=document.getElementById('lyr'),
      linesEl=document.getElementById('lines'),emptyEl=document.getElementById('empty'),
      metaEl=document.querySelector('#stamp .meta');
  var pctx=paper.getContext('2d'),ictx=ink.getContext('2d');
  var rows=[],domNodes=[],domCount=-1;
  var RM=(function(){try{return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){return false}})();
  try{ window.__stage=function(){ return {lines:S.lines.length,idx:S.idx,t:S.t,playing:S.playing,frames:S.frames,js:S.js,err:S.err,text:(S.idx>=0&&S.lines[S.idx]&&S.lines[S.idx].text)||'',gl:false,rm:RM}; }; }catch(e){ console.error('__stage',e); }

  function clamp(v,a,b){v=+v; if(!isFinite(v))v=a; return v<a?a:(v>b?b:v);}
  function resize(){
    W=Math.round(window.innerWidth||1440); H=Math.round(window.innerHeight||900);
    if(!(W>0))W=1440; if(!(H>0))H=900;
    DPR=Math.min(window.devicePixelRatio||1,2);
    [paper,ink].forEach(function(c){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); c.style.width=W+'px'; c.style.height=H+'px'; });
    pctx.setTransform(DPR,0,0,DPR,0,0); ictx.setTransform(DPR,0,0,DPR,0,0);
  }
  function onMsg(ev){
    var d=ev&&ev.data; if(!d||d.__c100!==1) return;
    try{
      if(d.type==='init'){ init(d.payload||{}); }
      else if(d.type==='tick'){ var p=d.payload||{}; if(typeof p.time==='number'&&isFinite(p.time)){ S.t=p.time; S.tBase=p.time; S.tAt=(window.performance&&performance.now)?performance.now():Date.now(); } if(typeof p.playing==='boolean') S.playing=p.playing; }
      else if(d.type==='live'){ var l=d.payload||{}; if(typeof l.playing==='boolean') S.playing=l.playing; if(typeof l.bass==='number') bass=l.bass; if(typeof l.mid==='number') mid=l.mid; if(typeof l.treble==='number') treb=l.treble; }
      else if(d.type==='beat'){ var b=d.payload||{}; beatS=clamp(b.level===undefined?0.6:b.level,0,1); }
    }catch(e){ S.err=String(e&&e.message||e); console.error('msg',d&&d.type,e); }
  }
  window.addEventListener('message',onMsg,false);
  window.addEventListener('resize',onResize,false);
  function onResize(){ try{ resize(); buildVisual(); build(); renderLines(); }catch(e){ console.error('resize',e); } }
  function buildVisual(){
    makeGeo(); makePrint(); makeDisc(); blitPrint();
  }

  // ---------- 色彩：蓝染三阶 ----------
  function palette(acc){
    var r=acc[0],g=acc[1],b=acc[2];
    var warm=clamp(((r||0)-(b||0))*0.16,-16,16);
    S.acc=[r,g,b];
    S.cyan='rgb('+Math.round(clamp(20+warm,14,30))+','+Math.round(clamp(40+warm,26,58))+','+Math.round(clamp(70+warm,52,92))+')';
    S.paperC='rgb(237,228,208)';
    S.accent='rgb('+Math.round(clamp(150+warm*0.5,110,190))+',62,48)';
  }

  // ---------- 文本切分 ----------
  function splitChars(text,chars){
    var arr=[],i,n=text.length;
    for(i=0;i<n;i++){
      var ct=null;
      if(chars&&chars[i]&&typeof chars[i].t==='number'&&isFinite(chars[i].t)) ct=chars[i].t;
      arr.push({c:text.charAt(i),t:ct});
    }
    return arr;
  }
  function init(p){
    p=p||{};
    var song=p.song||{};
    var acc=(p.accent&&p.accent.length>=3)?p.accent:[40,60,92];
    palette([clamp(acc[0],0,255),clamp(acc[1],0,255),clamp(acc[2],0,255)]);
    var raw=(p.lines&&p.lines.length)?p.lines:[];
    var out=[],i=0,n=Math.min(raw.length,400);
    for(i=0;i<n;i++){
      var L=raw[i]||{};
      var txt=(typeof L.text==='string')?L.text:'';
      if(!txt){ continue; }
      var t=+L.t; if(!isFinite(t))t=0;
      var dur=+L.dur; if(!isFinite(dur)||dur<=0) dur=3.6;
      dur=clamp(dur,.6,30);
      var chars=null;
      if(L.chars&&L.chars.length){ chars=splitChars(txt,L.chars); }
      out.push({t:t,dur:dur,text:txt,chars:chars});
    }
    out.sort(function(a,b){ return a.t-b.t; });
    S.lines=out; S.idx=-1; S.t=0; S.tBase=0; S.tAt=0; S.cover=(typeof song.cover==='string')?song.cover:'';
    var nm=(typeof song.name==='string'&&song.name)?song.name:'';
    var ar=song.artists;
    if(Array.isArray(ar)) ar=ar.filter(function(x){return typeof x==='string'&&x;}).join(' · ');
    else if(typeof ar!=='string') ar='';
    var durTot=+p.duration; if(!isFinite(durTot)||durTot<0) durTot=0;
    metaEl.textContent=('No.471  ·  ') + (nm?nm:'無題') + (ar?'  /  '+ar:'') + (durTot?('  ·  '+fmt(durTot)):'');
    buildVisual();
    build();
    emptyEl.style.display = S.lines.length ? 'none' : 'block';
  }
  function fmt(s){ var m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+(r<10?'0':'')+r; }

  // ---------- 行模型：分块 + 尺寸 ----------
  function build(){
    rows=[]; domNodes=[]; domCount=-1;
    for(var i=0;i<S.lines.length;i++){
      var L=S.lines[i], chars=L.chars;
      var per=L.dur/Math.max(1,L.text.length);
      L._ch=[];
      var ci=0;
      if(chars&&chars.length){
        var n2=Math.min(chars.length,L.text.length);
        for(ci=0;ci<n2;ci++){
          var ct=chars[ci]&&chars[ci].t;
          if(typeof ct!=='number'||!isFinite(ct)) ct=L.t+per*ci;
          if(ci>0 && ct<L._ch[ci-1]) ct=L._ch[ci-1];
          L._ch.push(ct);
        }
        for(ci=n2;ci<L.text.length;ci++) L._ch.push(L.t+per*ci);
      } else {
        for(ci=0;ci<L.text.length;ci++) L._ch.push(L.t+per*ci);
      }
    }
    renderLines();
  }

  // ---------- DOM ----------
  var FS=24;
  function renderLines(){
    var active=Math.max(-1,S.idx);
    var from=Math.max(0,active-1), to=Math.min(S.lines.length-1,active+3);
    if(active<0){ from=0; to=Math.min(S.lines.length-1,3); }
    linesEl.textContent='';
    domNodes=[];
    for(var i=from;i<=to;i++){
      var L=S.lines[i];
      var el=document.createElement('div');
      el.className='ln';
      var chars=L._ch, txt=L.text, frag=document.createDocumentFragment(), spans=[], j=0;
      for(j=0;j<txt.length;j++){
        var sp=document.createElement('span');
        sp.className='c';
        sp.textContent=txt.charAt(j);
        frag.appendChild(sp); spans.push(sp);
      }
      el.appendChild(frag);
      if(i===active) el.classList.add('cur');
      else if(i<active) el.classList.add('prev');
      else el.classList.add('next');
      linesEl.appendChild(el);
      domNodes.push({el:el,spans:spans,L:L,i:i,on:[],fs:0});
    }
    domCount=domNodes.length;
    fitFont();
  }
  function fitFont(){
    var land = W/H>1.02;
    // 文字可用宽度：右侧纸面的实际宽度
    var avail = land ? Math.max(220, W - geo.pw - clamp(W*0.045,18,86) - W*0.02)
                     : Math.min(W*0.88,720);
    var base = land ? clamp(avail*0.16,22,56) : clamp(avail*0.115,22,48);
    var ref=12,i=0;
    var act=S.idx;
    if(act>=0&&S.lines[act]&&S.lines[act].text.length) ref=S.lines[act].text.length;
    // 当前句按宽度整除，长句自动缩
    var perChar = avail/Math.max(1,ref);
    var fs = clamp(Math.min(base, perChar*1.06), 16, 60);
    linesEl.style.setProperty('--fs', (Math.round(fs*10)/10)+'px');
    FS=fs;
    for(i=0;i<domNodes.length;i++){
      var d=domNodes[i], n2=Math.max(1,d.L.text.length);
      var cap = avail/Math.max(1,n2);
      var target = (d.i===S.idx) ? fs : Math.min(fs*0.56, cap*0.86);
      target = clamp(target,12,fs);
      if(!d.fs || Math.abs(d.fs-target)>0.3){ d.fs=target; d.el.style.fontSize=(Math.round(target*10)/10)+'px'; }
    }
  }

  // ---------- 预渲染：版画底 ----------
  var printCv=document.createElement('canvas'), printCtx=printCv.getContext('2d');
  var discCv=document.createElement('canvas'), discCtx=discCv.getContext('2d');
  var geo={land:true,pw:600,rx:300,ry:400,rr:220,tableY:700,catX:0,catS:0};

  function makeGeo(){
    var land = W/H > 1.02;
    geo.land=land;
    if(land){
      var pw = clamp(Math.min(W*0.44, H*0.46),280,W*0.5);
      geo.pw=pw; geo.ph=H;
      geo.rx = pw*0.47;
      geo.ry = H*0.435;
      geo.rr = Math.min(pw*0.335, H*0.225);
      geo.tableY = Math.min(H*0.80, geo.ry+geo.rr*1.55);
      geo.catX = pw*0.70; geo.catS = Math.min(H*0.235, pw*0.34);
    } else {
      geo.pw=W; geo.ph=H*0.535;
      geo.rx = W*0.325;
      geo.ry = H*0.255;
      geo.rr = Math.min(W*0.215, H*0.105);
      geo.tableY = Math.min(geo.ph, geo.ry+geo.rr*1.7);
      geo.catX = W*0.685; geo.catS = Math.min(W*0.30, H*0.115);
    }
    stageEl.style.setProperty('--pw', Math.round(geo.pw)+'px');
    stageEl.style.setProperty('--ph', Math.round(geo.ph)+'px');
    // 横屏时左下角印章压在靛蓝版画上 → 用浅色；竖屏印章落在纸面 → 深色
    if(land) stageEl.classList.add('night'); else stageEl.classList.remove('night');
  }

  function makePrint(){
    if(!(W>0&&H>0)) return;
    var pw=geo.pw;
    printCv.width=Math.round(W*DPR); printCv.height=Math.round(H*DPR);
    var c=printCtx;
    c.setTransform(DPR,0,0,DPR,0,0);
    c.clearRect(0,0,W,H);

    // 纸底
    c.fillStyle=S.paperC||'rgb(237,228,208)';
    c.fillRect(0,0,W,H);

    // 靛蓝版画区（带撕裂毛边）
    var edge=[], step=Math.max(5,geo.ph/64), y=0, seed=7;
    function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
    for(y=0;y<=geo.ph+step;y+=step){ edge.push({y:y,dx:(rnd()-0.5)*(H*0.012)}); }
    var i;
    if(geo.land){
      c.beginPath();
      c.moveTo(0,0); c.lineTo(pw+edge[0].dx,0);
      for(i=0;i<edge.length;i++){ c.lineTo(pw+edge[i].dx, edge[i].y); }
      c.lineTo(0,H); c.closePath();
    } else {
      var phh=geo.ph, xstep=W/(edge.length-1||1);
      c.beginPath();
      c.moveTo(0,0); c.lineTo(W,0);
      c.lineTo(W, phh);
      for(i=edge.length-1;i>=0;i--){ c.lineTo(i*xstep, phh+edge[i].dx); }
      c.lineTo(0,0); c.closePath();
    }
    var g=c.createLinearGradient(0,0,geo.pw,geo.ph);
    g.addColorStop(0,'#17324F'); g.addColorStop(.55,'#122A46'); g.addColorStop(1,'#0D2036');
    c.fillStyle=g; c.fill();

    // 版画刀触纹理（细白线，模拟木刻留白）
    c.save(); c.globalCompositeOperation='screen';
    for(i=0;i<170;i++){
      var x0=rnd()*pw, y0=rnd()*H, len=6+rnd()*46, a=0.02+rnd()*0.05;
      c.strokeStyle='rgba(214,226,232,'+a.toFixed(3)+')';
      c.lineWidth=0.7+rnd()*0.8;
      c.beginPath(); c.moveTo(x0,y0);
      c.lineTo(x0+(rnd()-0.5)*10, y0+len); c.stroke();
    }
    c.restore();

    // 远处横向波纹（像唱片的声纹地平线）
    c.save();
    c.strokeStyle='rgba(150,180,200,0.10)'; c.lineWidth=1;
    for(i=0;i<7;i++){ var yy=geo.tableY+ (i*i*3.2) + i*2; c.beginPath(); c.moveTo(0,yy); c.lineTo(geo.pw,yy); c.stroke(); }
    c.restore();

    drawSax(c);
    drawGlass(c);
    drawCat(c);
    drawEdgeText(c);

    // 纸纤维与污渍
    c.save();
    seed=11;
    for(i=0;i<520;i++){
      var fx=rnd()*W, fy=rnd()*H, fl=2+rnd()*10;
      c.strokeStyle='rgba(120,105,80,'+(0.02+rnd()*0.05).toFixed(3)+')';
      c.lineWidth=0.6+rnd()*0.7; c.beginPath(); c.moveTo(fx,fy); c.lineTo(fx+fl,fy+(rnd()-0.5)*3); c.stroke();
    }
    var vg=c.createRadialGradient(W*0.5,H*0.45,Math.min(W,H)*0.22,W*0.5,H*0.5,Math.max(W,H)*0.78);
    vg.addColorStop(0,'rgba(60,45,25,0)'); vg.addColorStop(1,'rgba(60,45,25,0.20)');
    c.fillStyle=vg; c.fillRect(0,0,W,H);
    c.restore();
  }

  function drawSax(c){
    var pw=geo.pw, x=pw*0.085, y0=H*0.16, y1=H*0.60;
    if(!geo.land){ x=W*0.075; y0=H*0.06; y1=H*0.30; }
    c.save();
    c.strokeStyle='rgba(226,232,226,0.80)'; c.lineCap='round';
    c.lineWidth=Math.max(3,pw*0.011);
    c.beginPath();
    c.moveTo(x, y0);
    c.bezierCurveTo(x-6, y0+(y1-y0)*0.55, x-4, y1-(y1-y0)*0.22, x+pw*0.055, y1);
    c.stroke();
    // 喇叭口
    c.beginPath();
    c.ellipse(x+pw*0.062, y1+2, pw*0.030, pw*0.018, -0.35,0,Math.PI*2);
    c.lineWidth=Math.max(2,pw*0.006);
    c.strokeStyle='rgba(226,232,226,0.72)'; c.stroke();
    // 按键
    for(var i=0;i<5;i++){
      var ky=y0+(y1-y0)*(0.16+i*0.115);
      c.beginPath(); c.arc(x-1.5, ky, Math.max(1.6,pw*0.0055), 0, Math.PI*2);
      c.fillStyle='rgba(226,232,226,0.66)'; c.fill();
    }
    c.restore();
  }

  function drawGlass(c){
    var pw=geo.pw, bx=pw*0.175, by=geo.tableY+2, w=pw*0.085, h=geo.tableY*0.20;
    if(!geo.land){ bx=W*0.82; w=W*0.115; h=H*0.105; }
    var top=by-h*1.9;
    c.save();
    c.lineWidth=Math.max(1.6,w*0.045);
    c.strokeStyle='rgba(228,234,228,0.78)';
    c.beginPath();
    c.moveTo(bx-w/2, top);
    c.lineTo(bx+w/2, top);
    c.lineTo(bx+w*0.36, by-h*0.30);
    c.quadraticCurveTo(bx, by+h*0.10, bx-w*0.36, by-h*0.30);
    c.closePath(); c.stroke();
    // 酒液
    c.beginPath(); c.moveTo(bx-w*0.40, top+h*0.55);
    c.lineTo(bx+w*0.40, top+h*0.55);
    c.lineTo(bx+w*0.32, by-h*0.34);
    c.quadraticCurveTo(bx, by+h*0.02, bx-w*0.32, by-h*0.34);
    c.closePath();
    c.fillStyle='rgba(228,234,228,0.16)'; c.fill();
    // 冰球
    c.beginPath(); c.arc(bx+w*0.02, top+h*0.32, w*0.22, 0, Math.PI*2);
    c.strokeStyle='rgba(228,234,228,0.52)'; c.lineWidth=Math.max(1,w*0.02); c.stroke();
    c.restore();
  }

  function drawCat(c){
    var x=geo.catX, y=geo.tableY+2, s=geo.catS;
    if(!(s>2)) return;
    c.save();
    c.fillStyle='rgba(232,231,216,0.94)';
    c.strokeStyle='rgba(232,231,216,0.94)';
    // 尾巴
    c.lineWidth=s*0.075; c.lineCap='round';
    c.beginPath();
    c.moveTo(x-s*0.34, y-s*0.06);
    c.bezierCurveTo(x-s*0.74, y-s*0.02, x-s*0.80, y-s*0.44, x-s*0.46, y-s*0.50);
    c.stroke();
    // 身体
    c.beginPath();
    c.moveTo(x-s*0.40, y);
    c.bezierCurveTo(x-s*0.46, y-s*0.50, x-s*0.16, y-s*0.66, x+s*0.06, y-s*0.62);
    c.bezierCurveTo(x+s*0.30, y-s*0.57, x+s*0.26, y-s*0.10, x+s*0.30, y);
    c.closePath(); c.fill();
    // 头
    var hx=x+s*0.10, hy=y-s*0.78, hr=s*0.215;
    c.beginPath(); c.arc(hx,hy,hr,0,Math.PI*2); c.fill();
    // 耳朵
    c.beginPath();
    c.moveTo(hx-hr*0.92, hy-hr*0.18); c.lineTo(hx-hr*0.86, hy-hr*1.28); c.lineTo(hx-hr*0.10, hy-hr*0.90);
    c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(hx+hr*0.90, hy-hr*0.20); c.lineTo(hx+hr*0.80, hy-hr*1.20); c.lineTo(hx+hr*0.06, hy-hr*0.92);
    c.closePath(); c.fill();
    // 眼（靛蓝细缝）
    c.fillStyle='#0E2138';
    c.beginPath(); c.ellipse(hx-hr*0.36, hy-hr*0.02, hr*0.10, hr*0.20, 0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(hx+hr*0.34, hy-hr*0.02, hr*0.10, hr*0.20, 0,0,Math.PI*2); c.fill();
    // 胡须
    c.strokeStyle='rgba(14,33,56,0.55)'; c.lineWidth=Math.max(0.7,s*0.008);
    for(var i=0;i<3;i++){
      var ay=hy+hr*0.16+i*hr*0.16;
      c.beginPath(); c.moveTo(hx-hr*0.5, ay); c.lineTo(hx-hr*1.5, ay-hr*0.12+i*hr*0.10); c.stroke();
      c.beginPath(); c.moveTo(hx+hr*0.5, ay); c.lineTo(hx+hr*1.5, ay-hr*0.12+i*hr*0.10); c.stroke();
    }
    c.restore();
  }

  function drawEdgeText(c){
    if(!geo.land) return;
    var pw=geo.pw;
    c.save();
    c.translate(pw*0.945, H*0.085);
    c.rotate(Math.PI/2);
    c.fillStyle='rgba(226,232,226,0.50)';
    c.font='500 '+Math.round(clamp(H*0.019,10,20))+'px "Hiragino Mincho ProN","Yu Mincho",serif';
    c.letterSpacing='0.42em';
    try{ c.letterSpacing='0.42em'; }catch(e){}
    c.fillText('JAZZ  KISSA   藍摺  木版', 0, 0);
    c.restore();
  }

  // ---------- 唱片 ----------
  function makeDisc(){
    var R=geo.rr; if(!(R>4)) return;
    var sz=Math.ceil(R*2.28*DPR);
    discCv.width=sz; discCv.height=sz;
    var c=discCtx, cx=sz/2, cy=sz/2;
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,sz,sz);
    var R2=R*DPR;
    // 盘体
    c.beginPath(); c.arc(cx,cy,R2,0,Math.PI*2);
    c.fillStyle='#0A1728'; c.fill();
    // 音槽
    for(var i=1;i<=44;i++){
      var rr=R2*(0.36+ (i/44)*0.63);
      c.beginPath(); c.arc(cx,cy,rr,0,Math.PI*2);
      c.strokeStyle='rgba(150,178,196,'+(0.03+ (i%5===0?0.05:0.015)).toFixed(3)+')';
      c.lineWidth=Math.max(1,0.9*DPR);
      c.stroke();
    }
    // 高光扇区（旋转可见）
    var gr=c.createLinearGradient(cx-R2,cy-R2,cx+R2,cy+R2);
    gr.addColorStop(0,'rgba(190,215,228,0)');
    gr.addColorStop(.42,'rgba(190,215,228,0.13)');
    gr.addColorStop(.5,'rgba(210,230,240,0.20)');
    gr.addColorStop(.58,'rgba(190,215,228,0.10)');
    gr.addColorStop(1,'rgba(190,215,228,0)');
    c.beginPath(); c.arc(cx,cy,R2*0.995,0,Math.PI*2); c.fillStyle=gr; c.fill();
    // 中心标签
    c.beginPath(); c.arc(cx,cy,R2*0.31,0,Math.PI*2);
    c.fillStyle='#E4DCC8'; c.fill();
    c.beginPath(); c.arc(cx,cy,R2*0.31,0,Math.PI*2);
    c.strokeStyle='rgba(20,40,64,0.55)'; c.lineWidth=1.4*DPR; c.stroke();
    c.beginPath(); c.arc(cx,cy,R2*0.045,0,Math.PI*2);
    c.fillStyle='#122A46'; c.fill();
    // 朱印
    c.beginPath(); c.arc(cx+R2*0.17,cy-R2*0.10,R2*0.075,0,Math.PI*2);
    c.fillStyle='#A83B2B'; c.fill();
    // 标签上的细刻字
    c.save(); c.translate(cx,cy); c.rotate(-0.9);
    c.fillStyle='rgba(20,40,64,0.72)';
    c.font='600 '+Math.round(Math.max(8,R2*0.075))+'px "Hiragino Mincho ProN",serif';
    c.textAlign='center';
    c.fillText('藍摺', 0, -R2*0.50);
    c.restore();
  }

  // ---------- 每帧 ----------
  var spin=0, beatS=0, bass=0, mid=0, treb=0;

  // 静态版画只在尺寸/换歌时刷一次，画在独立的 paper 画布上
  function blitPrint(){
    try{
      pctx.setTransform(1,0,0,1,0,0);
      pctx.clearRect(0,0,printCv.width,printCv.height);
      pctx.drawImage(printCv,0,0);
    }catch(e){ console.error('blit',e); }
  }

  function drawInk(ts,dt){
    var c=ictx;
    c.setTransform(DPR,0,0,DPR,0,0);
    c.clearRect(0,0,W,H);

    if(!(geo.rr>4)) return;
    // 唱片旋转：转/分 → 弧度/毫秒
    var spd = (S.playing? 0.0031 : 0) + bass*0.0022;
    if(!RM){ spin += dt*spd; }
    var wob = RM?0:Math.sin(ts*0.0007)*0.006 + beatS*0.010;
    var sc = 1 + beatS*0.010;

    c.save();
    c.translate(geo.rx, geo.ry);
    c.rotate(spin+wob);
    c.scale(sc,sc);
    c.drawImage(discCv, -geo.rr*1.14, -geo.rr*1.14, geo.rr*2.28, geo.rr*2.28);
    c.restore();

    // 频谱：外圈刻度
    var n=52, i, a0=-Math.PI*0.5;
    c.save();
    c.translate(geo.rx, geo.ry);
    for(i=0;i<n;i++){
      var a=a0+(i/n)*Math.PI*2;
      var v=0.5+0.5*Math.sin(i*1.7+ts*0.002);
      var amp=clamp(bass*0.9+mid*0.8+treb*0.6,0,1);
      var len=geo.rr*(0.035+v*amp*0.20);
      var r0=geo.rr*1.10, r1=r0+len;
      c.beginPath();
      c.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
      c.lineTo(Math.cos(a)*r1, Math.sin(a)*r1);
      c.strokeStyle='rgba(228,234,228,'+(0.16+v*0.5*amp).toFixed(3)+')';
      c.lineWidth=Math.max(1, geo.rr*0.012);
      c.lineCap='round';
      c.stroke();
    }
    c.restore();

    // 唱臂
    var ax=geo.rx-geo.rr*1.30, ay=geo.ry-geo.rr*1.08;
    c.save();
    c.strokeStyle='rgba(228,234,228,0.55)'; c.lineWidth=Math.max(1.6,geo.rr*0.030); c.lineCap='round';
    c.beginPath(); c.moveTo(ax,ay); c.lineTo(geo.rx-geo.rr*0.34, geo.ry-geo.rr*0.52); c.stroke();
    c.beginPath(); c.arc(ax,ay,geo.rr*0.055,0,Math.PI*2);
    c.fillStyle='rgba(228,234,228,0.60)'; c.fill();
    c.restore();

    // 拍点脉冲：面板边框闪一下
    if(beatS>0.02){
      c.save();
      c.strokeStyle='rgba(168,59,43,'+(beatS*0.45).toFixed(3)+')';
      c.lineWidth=Math.max(1,geo.pw*0.004);
      c.strokeRect(geo.pw*0.035, geo.pw*0.035, geo.pw*0.93, geo.pw*0.93);
      c.restore();
    }
  }

  var lastT=0, extT=0;
  function frame(ts){
    var t0=(window.performance&&performance.now)?performance.now():Date.now();
    S.frames++;
    var dt=lastT?clamp(ts-lastT,0,60):16.7; lastT=ts||0;
    if(!W||!H){ S.js=0; requestAnimationFrame(frame); return; }
    try{
      updateState(dt);
      drawInk(ts||0,dt);
      syncDom();
    }catch(e){ S.err=String(e&&e.message||e); console.error('frame',e); }
    S.js=((window.performance&&performance.now)?performance.now():Date.now())-t0;
    requestAnimationFrame(frame);
  }

  function updateState(dt){
    // 频谱与拍点衰减
    beatS*=Math.pow(0.86, dt/16.7);
    bass*=Math.pow(0.985, dt/16.7); mid*=Math.pow(0.985, dt/16.7); treb*=Math.pow(0.985, dt/16.7);
    // 帧间插值：以上一次 tick 为基准外推，tick 到达即校正
    var now=(window.performance&&performance.now)?performance.now():Date.now();
    if(S.playing && S.tAt && now-S.tAt<500){ S.t = S.tBase + (now-S.tAt)/1000; }
    var idx=-1,n=S.lines.length;
    if(n){
      var lo=0,hi=n-1,ans=-1;
      while(lo<=hi){ var mid2=(lo+hi)>>1; if(S.lines[mid2].t<=S.t+0.13){ ans=mid2; lo=mid2+1; } else hi=mid2-1; }
      idx=ans;
    }
    if(idx!==S.idx){ S.idx=idx; renderLines(); }
  }

  function syncDom(){
    var i=0;
    for(i=0;i<domNodes.length;i++){
      var d=domNodes[i], ch=d.L._ch, spans=d.spans, k=0, m=spans.length;
      for(k=0;k<m;k++){
        var on;
        if(d.i<S.idx) on=true;
        else if(d.i>S.idx||d.i<0) on=false;
        else on=(ch[k]!==undefined) && (S.t>=ch[k]-0.001);
        if(d.on[k]!==on){ d.on[k]=on; if(on) spans[k].classList.add('on'); else spans[k].classList.remove('on'); }
      }
    }
  }
  resize();
  try{ buildVisual(); }catch(e){ console.error('init visual',e); }
  build(); renderLines(); requestAnimationFrame(frame);
  var readySent=false;
  requestAnimationFrame(function(){ if(readySent)return; readySent=true; try{parent.postMessage({__c100:1,type:'ready'},'*')}catch(e){console.error('ready',e)} });
  setTimeout(function(){ if(readySent)return; readySent=true; try{parent.postMessage({__c100:1,type:'ready'},'*')}catch(e){console.error('ready',e)} },1200);
})();
</script>
