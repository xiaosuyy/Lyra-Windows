<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 — BIRDS / LYRIC AS STRUCTURE</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0c;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  'use strict';
  const cv=document.getElementById('stage'), cx=cv.getContext('2d',{alpha:false});
  const S={lines:[],idx:-1,t:0,playing:false,frames:0,ready:false,duration:0,text:'',beat:0};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,DPR=1,energy=0;
  let wallPhrases=['THE BIRDS','NO SIGNAL','BLACK FEATHER','HOLD STILL',"DON'T LOOK UP",'THE SKY IS FULL'];
  let birds=[], heroBird=null, noisePattern=null;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cx.setTransform(DPR,0,0,DPR,0,0);
    buildBirds();
  }
  addEventListener('resize',resize); resize();

  function activeLine(){ return S.idx>=0?S.lines[S.idx]:null; }
  function textNow(){ const l=activeLine(); return l&&typeof l.text==='string'?l.text:''; }
  function seek(t){
    let i=-1;
    for(let k=0;k<S.lines.length;k++) if(typeof S.lines[k].t==='number'&&S.lines[k].t<=t+0.001) i=k;
    S.idx=i; S.text=textNow();
  }

  function margin(){ return clamp(W*.042,20,64); }
  function headerY(){ return Math.max(22,margin()*.58); }

  function phrasePool(){
    const src=S.lines.map(l=>String(l.text||'').trim()).filter(Boolean);
    const base=['THE BIRDS','NO SIGNAL','BLACK FEATHER','HOLD STILL',"DON'T LOOK UP",'THE SKY IS FULL'];
    const all=src.length?src.concat(base):base;
    return all.map(s=>s.replace(/\s+/g,' ')).filter((s,i,a)=>a.indexOf(s)===i).slice(0,10);
  }

  function drawGrid(){
    const m=margin(), cw=(W-m*2)/12;
    cx.save();
    cx.lineWidth=1;
    cx.strokeStyle='rgba(232,232,227,.055)';
    for(let i=0;i<=12;i++){
      const x=Math.round(m+cw*i)+.5;
      cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke();
    }
    const gy=headerY()+14;
    cx.strokeStyle='rgba(238,238,233,.21)';
    cx.beginPath(); cx.moveTo(m,gy); cx.lineTo(W-m,gy); cx.stroke();
    cx.beginPath(); cx.moveTo(m,H-m); cx.lineTo(W-m,H-m); cx.stroke();
    cx.fillStyle='rgba(242,242,237,.36)';
    cx.fillRect(m-13,gy-2,5,5); cx.fillRect(W-m+8,gy-2,5,5);
    cx.restore();
  }

  function drawWall(t){
    const m=margin(), top=headerY()+26, bottom=H-m-62;
    const bands=8, bh=(bottom-top)/bands;
    const styles=[
      {fill:'rgba(202,202,197,.14)'},
      {stroke:'rgba(220,220,215,.23)'},
      {fill:'rgba(192,192,187,.18)'},
      {stroke:'rgba(228,228,223,.11)'}
    ];
    for(let b=0;b<bands;b++){
      let txt=wallPhrases[(b*3+1)%wallPhrases.length]||'BLACK BIRDS';
      txt=txt.toUpperCase();
      if(txt.length<5) txt=(txt+'   ').repeat(4);
      const unit=txt+'   ///   ';
      const size=bh*(.94+((b*5)%3)*.04);
      const st=styles[b%4];
      cx.save();
      cx.beginPath(); cx.rect(0,top+b*bh,W,bh+.5); cx.clip();
      cx.font=`900 ${size}px "Arial Black","Helvetica Neue",Impact,"PingFang SC","Microsoft YaHei",sans-serif`;
      if('letterSpacing' in cx) cx.letterSpacing=`${-size*.035}px`;
      const uw=Math.max(1,cx.measureText(unit).width);
      const off=reduce ? 0 : ((t*(b%2?-18:23))%uw+uw)%uw;
      const y=top+b*bh+bh*.82;
      if(st.fill){
        cx.fillStyle=st.fill;
        for(let x=-uw+off;x<W+uw;x+=uw) cx.fillText(unit,x,y);
      }else{
        cx.strokeStyle=st.stroke; cx.lineWidth=Math.max(1,size*.008);
        for(let x=-uw+off;x<W+uw;x+=uw) cx.strokeText(unit,x,y);
      }
      if('letterSpacing' in cx) cx.letterSpacing='0px';
      cx.restore();
    }
  }

  function drawChrome(){
    const m=margin(), hy=headerY();
    cx.save();
    cx.textBaseline='middle';
    cx.font='600 10px ui-monospace,"SFMono-Regular",Consolas,monospace';
    cx.fillStyle='rgba(245,245,240,.76)';
    cx.fillText('A—SIDE / 06',m,hy);
    if(W>720){
      cx.fillStyle='rgba(245,245,240,.33)';
      cx.fillText('LYRIC AS STRUCTURE / 12 COL',m+112,hy);
    }
    cx.textAlign='right';
    cx.fillStyle='rgba(245,245,240,.62)';
    cx.fillText('THE BIRDS / 1963—2026',W-m,hy);
    cx.textAlign='left';
    const cw=(W-m*2)/12;
    cx.font='500 8px ui-monospace,"SFMono-Regular",Consolas,monospace';
    cx.fillStyle='rgba(245,245,240,.23)';
    for(let i=0;i<12;i++) cx.fillText(String(i+1).padStart(2,'0'),m+cw*i+4,hy+34);
    cx.save();
    cx.translate(m*.36,H*.59); cx.rotate(-Math.PI/2);
    cx.fillStyle='rgba(245,245,240,.27)';
    cx.font='500 9px ui-monospace,"SFMono-Regular",Consolas,monospace';
    cx.fillText('NO SIGNAL / NO EXIT / BLACK BIRDS',0,0);
    cx.restore();
    cx.restore();
  }

  function mulberry32(a){
    return function(){
      a=(a+0x6D2B79F5)|0;
      let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function gauss(r){ return (r()+r()+r()+r()-2)*.55; }

  function buildBirds(){
    birds=[];
    const r=mulberry32(0xB1D5);
    const n=Math.round(clamp(W/24,38,82));
    for(let i=0;i<n;i++){
      const u=r(), p=Math.pow(u,.72);
      const bx=W*(.05+p*.57)+gauss(r)*W*(.055+p*.035);
      const by=H*(.08+p*.38+Math.sin(p*3.2)*.055)+gauss(r)*H*.075;
      let s=clamp(Math.min(W,H)*(.007+r()*.021)*(.55+p*.85),4,44);
      if(r()<.075) s*=2.1;
      birds.push({
        x:clamp(bx,W*.02,W*.94), y:clamp(by,H*.03,H*.63), s,
        rot:(-.36+r()*.72)+(W*.5-bx)*.00007,
        phase:r()*Math.PI*2, drift:r()*Math.PI*2,
        ink:i%9===0?'#050506':'#000'
      });
    }
    heroBird={x:W*.705,y:H*.345,s:Math.min(W*.30,H*.42),rot:-.10,phase:1.7,drift:2.1,ink:'#000',hero:true};
    birds.push(heroBird);
    birds.sort((a,b)=>a.s-b.s);
  }

  function drawCrow(b,t){
    const f=reduce ? .72 : clamp(.58+.42*Math.sin(t*4.8+b.phase),.12,1);
    const ox=reduce ? 0 : Math.sin(t*.55+b.phase)*b.s*.15;
    const oy=reduce ? 0 : Math.cos(t*.47+b.drift)*b.s*.09;
    const s=b.s*(1+energy*.045);
    cx.save();
    cx.translate(b.x+ox,b.y+oy);
    cx.rotate(b.rot+(reduce?0:Math.sin(t*.8+b.phase)*.035));
    cx.scale(s,s);
    cx.fillStyle=b.ink;
    cx.strokeStyle='rgba(242,242,237,.075)';
    cx.lineWidth=Math.max(.003,1.2/s);
    cx.lineJoin='round';
    if(s<15){
      cx.beginPath();
      cx.moveTo(-1,.17);
      cx.quadraticCurveTo(-.60,-.58*f,.02,-.02);
      cx.quadraticCurveTo(.60,-.58*f,1,.17);
      cx.quadraticCurveTo(.52,.12,.02,.15);
      cx.quadraticCurveTo(-.52,.12,-1,.17);
      cx.closePath(); cx.fill(); cx.stroke();
    }else{
      cx.beginPath();
      cx.moveTo(.02,-.045);
      cx.bezierCurveTo(-.07,-.32*f-.09,-.34,-.63*f-.10,-.74,-.57*f-.08);
      cx.lineTo(-.63,-.41*f-.04);
      cx.lineTo(-.83,-.37*f-.02);
      cx.lineTo(-.63,-.28*f-.02);
      cx.lineTo(-.75,-.21*f);
      cx.lineTo(-.47,-.16*f);
      cx.quadraticCurveTo(-.27,-.09,-.08,-.03);
      cx.closePath(); cx.fill(); cx.stroke();

      cx.beginPath();
      cx.moveTo(-.03,-.005);
      cx.bezierCurveTo(.02,.22*f+.04,-.27,.50*f+.09,-.66,.54*f+.07);
      cx.lineTo(-.56,.38*f+.05);
      cx.lineTo(-.75,.34*f+.03);
      cx.lineTo(-.56,.25*f+.02);
      cx.lineTo(-.67,.17*f+.01);
      cx.quadraticCurveTo(-.32,.09,-.09,.02);
      cx.closePath(); cx.fill(); cx.stroke();

      cx.beginPath();
      cx.moveTo(.50,-.012);
      cx.quadraticCurveTo(.39,-.004,.31,-.06);
      cx.quadraticCurveTo(.22,-.185,.055,-.150);
      cx.quadraticCurveTo(-.155,-.128,-.275,-.035);
      cx.lineTo(-.53,.050);
      cx.lineTo(-.44,.010);
      cx.lineTo(-.58,.125);
      cx.quadraticCurveTo(-.29,.145,-.095,.138);
      cx.quadraticCurveTo(.105,.128,.195,.030);
      cx.quadraticCurveTo(.30,.005,.50,-.012);
      cx.closePath(); cx.fill(); cx.stroke();
    }
    cx.restore();
  }

  function drawBirds(t){
    if(!birds.length) return;
    if(heroBird){
      const h=heroBird;
      const g=cx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.s*1.05);
      g.addColorStop(0,'rgba(242,242,237,.055)');
      g.addColorStop(.55,'rgba(242,242,237,.016)');
      g.addColorStop(1,'rgba(242,242,237,0)');
      cx.fillStyle=g; cx.fillRect(h.x-h.s,h.y-h.s,h.s*2.1,h.s*2.1);
    }
    for(const b of birds) drawCrow(b,t);
  }

  function timecode(t){
    t=Math.max(0,Number(t)||0);
    const mm=Math.floor(t/60), ss=Math.floor(t%60), cc=Math.floor((t%1)*100);
    return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(cc).padStart(2,'0')}`;
  }
  function ink(v){
    const q=Math.round(72+(249-72)*v);
    return `rgb(${q},${q},${Math.min(255,q+2)})`;
  }
  function lineFont(size){
    return `900 ${size}px "Arial Black","Helvetica Neue",Impact,"PingFang SC","Microsoft YaHei",sans-serif`;
  }
  function charTime(line,k){
    const c=line.chars&&line.chars[k];
    if(c&&typeof c.t==='number'&&isFinite(c.t)) return c.t;
    const n=Math.max(1,(line.text||'').length);
    const start=Number(line.t)||0;
    const dur=Number(line.dur)||Math.max(.8,n*.16);
    return start+dur*.92*(k/Math.max(1,n-1));
  }
  function fitLine(line){
    const m=margin(), maxW=W-m*2, maxRows=W<620?3:2;
    let size=Math.min(W*.108,H*.158,320);
    const chars=Array.from(line.text||' ');
    const tokens=[]; let token=[];
    for(let k=0;k<chars.length;k++){
      if(chars[k]===' '){
        if(token.length){ tokens.push(token); token=[]; }
        tokens.push([k]);
      }else token.push(k);
    }
    if(token.length) tokens.push(token);
    let widths=[], rows=[];
    for(let attempt=0;attempt<14;attempt++){
      cx.font=lineFont(size);
      widths=chars.map(ch=>cx.measureText(ch).width);
      rows=[]; let row=[], w=0;
      for(const tk of tokens){
        const isSpace=tk.length===1&&chars[tk[0]]===' ';
        const tw=tk.reduce((a,k)=>a+widths[k],0);
        if(isSpace){
          if(row.length){ row.push(tk[0]); w+=tw; }
          continue;
        }
        if(w+tw>maxW&&row.length){
          while(row.length&&chars[row[row.length-1]]===' ') row.pop();
          rows.push({idx:row,w}); row=[]; w=0;
        }
        if(tw>maxW){
          for(const k of tk){
            if(w+widths[k]>maxW&&row.length){
              rows.push({idx:row,w}); row=[]; w=0;
            }
            row.push(k); w+=widths[k];
          }
        }else{
          row.push(...tk); w+=tw;
        }
      }
      if(row.length) rows.push({idx:row,w});
      if(rows.length<=maxRows) break;
      size*=.82;
    }
    return {chars,widths,rows,size};
  }

  function drawLyric(t){
    const m=margin(), fy=H-m, line=activeLine();
    const pct=S.duration>0?clamp(t/S.duration,0,1):0;
    cx.save();
    cx.strokeStyle='rgba(245,245,240,.20)'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(m,fy); cx.lineTo(W-m,fy); cx.stroke();
    if(pct>0){
      cx.strokeStyle='rgba(250,250,245,.8)'; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(m,fy); cx.lineTo(m+(W-m*2)*pct,fy); cx.stroke();
    }
    const hx=m+(W-m*2)*pct;
    cx.fillStyle='rgba(252,252,247,.9)'; cx.fillRect(hx-1,fy-6,2,13);

    cx.font='500 9px ui-monospace,"SFMono-Regular",Consolas,monospace';
    cx.textBaseline='middle';
    cx.fillStyle='rgba(245,245,240,.54)';
    cx.fillText(`T+ ${timecode(t)}`,m,fy+19);
    if(W>620){
      cx.fillStyle='rgba(245,245,240,.32)';
      cx.fillText(`${S.playing?'PLAY':'HOLD'} / ${S.lines.length?String(S.idx+1).padStart(2,'0'):'00'}—${String(S.lines.length).padStart(2,'0')}`,m+116,fy+19);
    }
    if(W>900){
      const n=10, lvl=clamp(energy,0,1), bx=W-m-236, bh=10;
      for(let i=0;i<n;i++){
        const on=i/n<lvl;
        cx.fillStyle=on?'rgba(248,248,243,.82)':'rgba(245,245,240,.16)';
        cx.fillRect(bx+i*8,fy+14-(on?bh:4),4,on?bh:4);
      }
    }
    cx.textAlign='right';
    cx.fillStyle='rgba(245,245,240,.5)';
    cx.fillText(`DUR ${timecode(S.duration)}`,W-m,fy+19);
    cx.textAlign='left';

    if(line&&String(line.text||'').trim()){
      const fit=fitLine(line), size=fit.size, rows=fit.rows;
      if(rows.length){
        const lineH=size*.91;
        const bottom=fy-Math.max(30,size*.16)-20;
        const top=bottom-(rows.length-1)*lineH;
        const labelY=top-size*.76-22;
        cx.strokeStyle='rgba(245,245,240,.28)'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(m,labelY+13); cx.lineTo(W-m,labelY+13); cx.stroke();
        cx.font='600 9px ui-monospace,"SFMono-Regular",Consolas,monospace';
        cx.fillStyle='rgba(245,245,240,.66)';
        cx.fillText(`[ ${String(S.idx+1).padStart(2,'0')} / ${String(S.lines.length).padStart(2,'0')} ]`,m,labelY);
        cx.textAlign='right';
        cx.fillStyle='rgba(245,245,240,.42)';
        cx.fillText(timecode(t),W-m,labelY);
        cx.textAlign='left';
        cx.font=lineFont(size);
        cx.textBaseline='alphabetic';
        for(let r=0;r<rows.length;r++){
          let x=m;
          const base=top+r*lineH;
          for(const k of rows[r].idx){
            const ch=fit.chars[k], cw=fit.widths[k];
            if(ch!==' '){
              const dt=t-charTime(line,k);
              const p=dt>=0?clamp(.6+dt/.12,0,1):0;
              const e=p*p*(3-2*p);
              cx.fillStyle=ink(e);
              if(e>.98){
                cx.shadowColor='rgba(250,250,245,.2)';
                cx.shadowBlur=size*(.055+energy*.10);
              }else{
                cx.shadowBlur=0;
              }
              cx.fillText(ch,x,base);
            }
            x+=cw;
          }
        }
        cx.shadowBlur=0;
      }
    }else{
      const size=Math.min(W*.155,H*.185);
      cx.font=lineFont(size);
      cx.textBaseline='alphabetic';
      cx.strokeStyle='rgba(242,242,237,.30)';
      cx.lineWidth=1.4;
      cx.strokeText('THE BIRDS',m,fy-size*.5);
      cx.fillStyle='rgba(242,242,237,.72)';
      cx.font='600 9px ui-monospace,"SFMono-Regular",Consolas,monospace';
      cx.fillText('AWAITING INIT / HOLD STILL / DO NOT LOOK UP',m,fy-size*.5+24);
    }
    cx.restore();
  }

  function buildNoise(){
    const n=document.createElement('canvas'); n.width=n.height=160;
    const g=n.getContext('2d'), im=g.createImageData(160,160);
    for(let i=0;i<im.data.length;i+=4){
      const v=Math.random()*255|0;
      im.data[i]=v; im.data[i+1]=v; im.data[i+2]=v; im.data[i+3]=30;
    }
    g.putImageData(im,0,0);
    noisePattern=cx.createPattern(n,'repeat');
  }

  function finish(){
    const vg=cx.createRadialGradient(W*.52,H*.45,Math.min(W,H)*.22,W*.52,H*.48,Math.max(W,H)*.72);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(.62,'rgba(0,0,0,.15)');
    vg.addColorStop(1,'rgba(0,0,0,.62)');
    cx.fillStyle=vg; cx.fillRect(0,0,W,H);
    if(noisePattern){
      cx.save(); cx.globalAlpha=.5; cx.fillStyle=noisePattern;
      cx.fillRect(0,0,W,H); cx.restore();
    }
    cx.fillStyle='rgba(255,255,255,.011)';
    for(let y=0;y<H;y+=4) cx.fillRect(0,y,W,1);
  }

  function render(){
    cx.fillStyle='#08090a'; cx.fillRect(0,0,W,H);
    const g=cx.createRadialGradient(W*.64,H*.26,0,W*.64,H*.26,Math.max(W,H)*.72);
    g.addColorStop(0,'rgba(222,222,217,.068)');
    g.addColorStop(.45,'rgba(120,120,120,.018)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
    drawWall(S.t);
    drawGrid();
    drawBirds(S.t);
    drawLyric(S.t);
    drawChrome();
    finish();
  }

  function frame(){
    render(); S.frames++;
    if(S.playing) energy*=.9;
    requestAnimationFrame(frame);
  }

  addEventListener('message',e=>{
    const m=e.data; if(!m||m.__c100!==1) return; const PL=m.payload||{};  /* 协议字段在 payload 里 */
    if(m.type==='init'){
      S.lines=Array.isArray(PL.lines)?PL.lines:(Array.isArray(m.lines)?m.lines:[]); S.duration=Number(PL.duration||m.duration)||0;
      wallPhrases=phrasePool(); energy=0;
      S.t=0; S.playing=false; S.ready=true; seek(0);
      parent.postMessage({__c100:1,type:'ready'},'*');
    }else if(m.type==='tick'){
      S.t=Number(PL.time!=null?PL.time:m.time)||0; S.playing=(PL.playing!==undefined)?!!PL.playing:!!m.playing; seek(S.t);
    }else if(m.type==='beat'){
      S.beat=clamp(Number(PL.level!=null?PL.level:m.level)||0,0,1);
      energy=Math.max(energy,S.beat);
    }
  });

  window.__stage=()=>({
    lines:S.lines,idx:S.idx,t:S.t,playing:S.playing,frames:S.frames,
    js:true,err:'',text:textNow(),gl:false,rm:reduce
  });

  buildNoise();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
