<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>靛蓝长路</title>
<style>
  :root{
    --ink:#1b1246;
    --ink-soft:rgba(27,18,70,.62);
    --cream:#f6e8c9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#241a4d}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

  .hud{position:fixed;left:6.2vw;top:6.4vh;z-index:3;pointer-events:none;color:var(--cream);max-width:64vw}
  .hud .tag{font-size:clamp(8.5px,.68vw,11px);letter-spacing:.36em;text-transform:uppercase;
            font-weight:700;color:rgba(246,232,201,.60)}
  .hud .song{margin-top:.9em;font-size:clamp(11px,1.02vw,15px);font-weight:600;letter-spacing:.15em;
             color:rgba(246,232,201,.94)}
  .hud .rule{position:relative;margin-top:1.15em;width:min(22vw,200px);height:1px;background:rgba(246,232,201,.24)}
  .hud .rule i{position:absolute;left:0;top:0;height:1px;width:0%;background:var(--cream);opacity:.9}

  #block{position:fixed;left:6.2vw;bottom:12.5vh;z-index:4;width:min(46vw,620px);
         pointer-events:none;color:var(--ink)}
  #lyr{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif}
  .lrow{transition:opacity .3s ease}
  .lprev{font-size:clamp(12px,1.34vw,20px);line-height:1.5;font-weight:400;letter-spacing:.05em;
         color:rgba(27,18,70,.60);margin-bottom:.45em;opacity:0;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lcur{--k:1;font-size:calc(clamp(28px,4.05vw,68px) * var(--k));line-height:1.24;font-weight:700;
        letter-spacing:.02em;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere;
        transition:opacity .3s ease}
  .lcur span{opacity:.42;transition:opacity .18s linear}
  .lcur span.on{opacity:1;color:var(--ink)}
  .lcur span.warm{color:#3a1f2c}
  .lnext{font-size:clamp(12px,1.34vw,20px);line-height:1.5;letter-spacing:.05em;
         color:rgba(27,18,70,.60);margin-top:.5em;opacity:0;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lnone{font-size:clamp(13px,1.5vw,21px);line-height:1.85;color:rgba(27,18,70,.70);letter-spacing:.06em}
  .lnone b{display:block;font-weight:700;font-size:clamp(18px,2vw,28px);color:var(--ink);
           margin-bottom:.25em;letter-spacing:.1em}

  @media (max-aspect-ratio:4/5){
    .hud{left:7vw;top:5.2vh;max-width:86vw}
    .hud .rule{width:46vw}
    #block{left:7vw;bottom:9.5vh;width:86vw}
    .lcur{font-size:calc(clamp(25px,7.2vw,52px) * var(--k));line-height:1.28}
    .lprev,.lnext{font-size:clamp(11.5px,3.1vw,16px)}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <div class="tag">Sahara &middot; Indigo Veil</div>
  <div class="song" id="song"></div>
  <div class="rule"><i id="prog"></i></div>
</div>

<div id="block">
  <div id="lyr">
    <div class="lrow lprev" id="lprev"></div>
    <div class="lrow lcur" id="lcur"></div>
    <div class="lrow lnext" id="lnext"></div>
    <div class="lnone" id="lnone" style="display:none"><b>沙丘还在走</b>这首歌没有词</div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   0. state — the single source of truth
   ============================================================ */
var S = {
  lines:[], t:0, playing:true, frames:0, js:0,
  err:'', text:'', gl:false, rm:false,
  idx:-1, dur:0, beat:0, live:null, song:null, ready:false
};
try{
  S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}catch(e){ console.error('[482 rm]', e); }

function calcIdx(t){
  var L = S.lines, n = L.length, i, b = -1, lt;
  for(i=0;i<n;i++){ lt = +L[i].t; if(lt === lt && lt <= t + 0.02) b = i; }
  return b;
}

/* the self-check hook: defined once, at top level, computed from live state */
window.__stage = function(){
  var i = calcIdx(S.t), L = S.lines[i];
  return {
    lines:   S.lines.length,
    idx:     i,
    t:       S.t,
    playing: !!S.playing,
    frames:  S.frames,
    js:      S.js,
    err:     S.err,
    text:    (L && typeof L.text === 'string') ? L.text : '',
    gl:      !!S.gl,
    rm:      !!S.rm
  };
};

/* ============================================================
   1. view / geometry
   ============================================================ */
var cvs = document.getElementById('stage');
var ctx = cvs.getContext('2d', { alpha:false });
var view = { w:1440, h:900, dpr:1, port:false };
var PAD = 26;

var GEO = {
  hz:0.42, sunX:0.700, sunY:0.392, sunR:0.052,
  c0:0.495, c1:0.205, cp:1.05,
  walkU:0.700, walkH:0.26, wide:true
};

/* crest: high on the left (holds the type), sliding down to the right */
function FGY(u){
  var h = view.h;
  return h*(GEO.c0 + GEO.c1*Math.pow(u, GEO.cp))
       + h*0.010*Math.sin(u*Math.PI*2.4+0.7)
       + h*0.005*Math.sin(u*Math.PI*5.3+2.1);
}
function MIDY(u){
  return seedRidge(u, view.h*(GEO.hz+0.105), view.h*0.044, 3.35);
}
function seedRidge(u, base, amp, ph){
  return base + amp*(0.62*Math.sin(u*Math.PI*1.9+ph)
                   + 0.26*Math.sin(u*Math.PI*4.3+ph*1.7)
                   + 0.10*Math.sin(u*Math.PI*9.1+ph*2.6));
}
function clamp01(v){ return v<0?0:(v>1?1:v); }
function mkC(w,h){ var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return c; }

/* ============================================================
   2. prerendered layers (baked on resize, never per frame)
   ============================================================ */
var PLATE = null, GLOW = null, FALLBACK = null, CLOUD = null, LIGHT = null;
var motes = [];

function makeFallback(){
  var w = Math.max(2, view.w), h = Math.max(2, view.h);
  var c = mkC(w,h), g = c.getContext('2d');
  var hz = h*GEO.hz;
  var sg = g.createLinearGradient(0,0,0,hz);
  sg.addColorStop(0,'#1b1246'); sg.addColorStop(0.45,'#5c2f66');
  sg.addColorStop(0.78,'#c05a45'); sg.addColorStop(1,'#ffc079');
  g.fillStyle = sg; g.fillRect(0,0,w,hz+1);
  var fg = g.createLinearGradient(0,hz,0,h);
  fg.addColorStop(0,'#f8c68b'); fg.addColorStop(1,'#c9875c');
  g.fillStyle = fg; g.fillRect(0,hz,w,h-hz);
  return c;
}

function newBaked(w,h,pr){
  var c = mkC((w+PAD*2)*pr, h*pr);
  var g = c.getContext('2d');
  g.setTransform(pr,0,0,pr,PAD*pr,0);
  return { c:c, g:g, w:w+PAD*2 };
}

function bakeGrain(g,w,h,alpha){
  g.save();
  g.globalAlpha = alpha;
  g.fillStyle = g.createPattern(getGrain(), 'repeat');
  g.fillRect(0,0,w,h);
  g.restore();
}

function makeGlow(){
  var s = 384, c = mkC(s,s), g = c.getContext('2d');
  var rg = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  rg.addColorStop(0.00,'rgba(255,240,205,0.95)');
  rg.addColorStop(0.18,'rgba(255,205,135,0.55)');
  rg.addColorStop(0.48,'rgba(247,146,84,0.20)');
  rg.addColorStop(1.00,'rgba(240,110,60,0)');
  g.fillStyle = rg; g.fillRect(0,0,s,s);
  return c;
}

/* soft dark blob: the cloud shadow that crosses the sand */
function makeCloudShadow(){
  var w = 640, h = 300, c = mkC(w,h), g = c.getContext('2d');
  var rg = g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  rg.addColorStop(0.00,'rgba(74,30,28,0.52)');
  rg.addColorStop(0.48,'rgba(84,34,26,0.24)');
  rg.addColorStop(1.00,'rgba(96,40,24,0)');
  g.save();
  g.translate(w/2,h/2); g.scale(1,0.36); g.translate(-w/2,-h/2);
  g.fillStyle = rg;
  g.beginPath(); g.arc(w/2,h/2,w/2,0,Math.PI*2); g.fill();
  g.restore();
  return c;
}

/* a wide, low-contrast band of brighter sand, blown across the dune */
function makeLightBand(){
  var w = 720, h = 260, c = mkC(w,h), g = c.getContext('2d');
  var lg = g.createLinearGradient(0,0,w,0);
  lg.addColorStop(0.00,'rgba(255,232,190,0)');
  lg.addColorStop(0.42,'rgba(255,238,203,0.22)');
  lg.addColorStop(0.58,'rgba(255,240,208,0.26)');
  lg.addColorStop(1.00,'rgba(255,232,190,0)');
  g.fillStyle = lg;
  g.save(); g.translate(w/2,h/2); g.rotate(-0.045); g.translate(-w/2,-h/2);
  g.fillRect(0,0,w,h); g.restore();
  return c;
}

/* ---- the sky ---- */
function bakeSky(w,h,pr){
  var b = newBaked(w,h,pr), g = b.g, pad = PAD, i;
  var hz = h*GEO.hz;

  var sg = g.createLinearGradient(0,-h*0.05,0,hz);
  sg.addColorStop(0.00,'#150f3c');
  sg.addColorStop(0.20,'#241653');
  sg.addColorStop(0.42,'#452265');
  sg.addColorStop(0.62,'#7b3560');
  sg.addColorStop(0.80,'#b95543');
  sg.addColorStop(0.92,'#e9824a');
  sg.addColorStop(1.00,'#ffce8a');
  g.fillStyle = sg; g.fillRect(-pad,-2,w+pad*2,hz+2);
  /* warm band below the horizon (mostly covered by dunes) */
  g.fillStyle = '#ffc077'; g.fillRect(-pad, hz-1, w+pad*2, h-hz+2);

  /* indigo haze streaks in the upper sky */
  g.save();
  for(i=0;i<9;i++){
    var yy = h*(0.05 + i*0.035);
    g.globalAlpha = 0.10 - i*0.008;
    g.fillStyle = (i%2===0) ? '#8f6bd8' : '#3a2470';
    g.fillRect(-pad, yy, w+pad*2, h*0.014);
  }
  g.restore();

  /* the sun */
  var sx = w*GEO.sunX, sy = h*GEO.sunY, sr = Math.min(w,h)*GEO.sunR;
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = 'rgba(255,196,128,0.26)';
  g.beginPath(); g.ellipse(sx,sy,sr*8.6,sr*4.0,0,0,Math.PI*2); g.fill();
  g.fillStyle = 'rgba(255,224,172,0.34)';
  g.beginPath(); g.ellipse(sx,sy,sr*3.4,sr*1.8,0,0,Math.PI*2); g.fill();
  g.restore();

  var disc = g.createRadialGradient(sx,sy,0,sx,sy,sr);
  disc.addColorStop(0.00,'#fffdf4');
  disc.addColorStop(0.55,'#ffeec2');
  disc.addColorStop(0.88,'#ffd189');
  disc.addColorStop(1.00,'rgba(255,196,120,0.35)');
  g.fillStyle = disc;
  g.beginPath(); g.arc(sx,sy,sr,0,Math.PI*2); g.fill();

  /* thin dust bands crossing the disc */
  g.save(); g.globalAlpha = 0.18; g.fillStyle = '#b5543c';
  for(i=0;i<5;i++){
    var yy2 = sy - sr*0.9 + i*sr*0.44;
    g.fillRect(sx-sr*5.2, yy2, sr*10.4, Math.max(1.1, sr*0.085));
  }
  g.restore();

  bakeGrain(g, w+pad*2, h, 0.055);
  return b;
}

/* ---- distant + middle dunes ---- */
function bakeFar(w,h,pr){
  var b = newBaked(w,h,pr), g = b.g, pad = PAD, hz = h*GEO.hz, i;
  var base = hz + h*0.014, amp = h*0.026, N = 60;

  g.beginPath();
  g.moveTo(-pad-2, h+2);
  for(i=0;i<=N;i++){
    var u = i/N, x = -pad-2 + (w+pad*2+4)*u, y = seedRidge(u, base, amp, 1.15);
    g.lineTo(x,y);
  }
  g.lineTo(w+pad+2, h+2); g.closePath();
  var fg = g.createLinearGradient(0,base-amp,0,h*0.70);
  fg.addColorStop(0,'#e9a26b');
  fg.addColorStop(1,'#d08454');
  g.fillStyle = fg; g.fill();

  g.save(); g.globalAlpha = 0.55; g.strokeStyle = '#ffd8a4'; g.lineWidth = 1.2;
  g.beginPath();
  for(i=0;i<=N;i++){
    var u2 = i/N, x2 = -pad-2 + (w+pad*2+4)*u2, y2 = seedRidge(u2, base, amp, 1.15);
    if(i===0) g.moveTo(x2,y2); else g.lineTo(x2,y2);
  }
  g.stroke(); g.restore();
  return b;
}

function bakeMid(w,h,pr){
  var b = newBaked(w,h,pr), g = b.g, pad = PAD, i;
  var base = h*(GEO.hz + 0.085), amp = h*0.040, N = 60;

  g.beginPath();
  g.moveTo(-pad-2, h+2);
  for(i=0;i<=N;i++){
    var u = i/N, x = -pad-2 + (w+pad*2+4)*u, y = seedRidge(u, base, amp, 3.35);
    g.lineTo(x,y);
  }
  g.lineTo(w+pad+2, h+2); g.closePath();
  var mg = g.createLinearGradient(0,base-amp,0,h*0.98);
  mg.addColorStop(0.00,'#bd6a41');
  mg.addColorStop(0.42,'#a4533a');
  mg.addColorStop(1.00,'#7a3930');
  g.fillStyle = mg; g.fill();

  g.save(); g.globalAlpha = 0.34; g.strokeStyle = '#ffb277'; g.lineWidth = 1.3;
  g.beginPath();
  for(i=0;i<=N;i++){
    var u2 = i/N, x2 = -pad-2 + (w+pad*2+4)*u2, y2 = seedRidge(u2, base, amp, 3.35);
    if(i===0) g.moveTo(x2,y2); else g.lineTo(x2,y2);
  }
  g.stroke(); g.restore();
  bakeGrain(g, w+pad*2, h, 0.03);
  return b;
}

/* ---- the foreground dune: the lit stage floor for the type ---- */
function bakeFore(w,h,pr){
  var b = newBaked(w,h,pr), g = b.g, pad = PAD, i, k;
  var N = 84;

  g.beginPath();
  g.moveTo(-pad-2, h+2);
  for(i=0;i<=N;i++){
    var u = i/N, x = -pad-2 + (w+pad*2+4)*u;
    g.lineTo(x, FGY(u));
  }
  g.lineTo(w+pad+2, h+2); g.closePath();
  var fg = g.createLinearGradient(0,h*0.42,0,h*1.02);
  fg.addColorStop(0.00,'#ffdda6');
  fg.addColorStop(0.14,'#f9c88a');
  fg.addColorStop(0.46,'#eeb074');
  fg.addColorStop(0.78,'#dd9c65');
  fg.addColorStop(1.00,'#c2835a');
  g.fillStyle = fg; g.fill();

  /* crest rim light */
  g.save(); g.globalAlpha = 0.85; g.strokeStyle = '#fff2d8'; g.lineWidth = 1.9;
  g.beginPath();
  for(i=0;i<=N;i++){
    var u1 = i/N, x1 = -pad-2 + (w+pad*2+4)*u1, y1 = FGY(u1);
    if(i===0) g.moveTo(x1,y1); else g.lineTo(x1,y1);
  }
  g.stroke(); g.restore();

  /* soft slip-face shadow just under the crest */
  g.save();
  g.globalAlpha = 0.13;
  g.strokeStyle = '#8a4a2a';
  g.lineWidth = h*0.055;
  g.lineJoin = 'round';
  g.beginPath();
  for(i=0;i<=N;i++){
    var u3 = i/N, x3 = -pad-2 + (w+pad*2+4)*u3, y3 = FGY(u3) + h*0.030;
    if(i===0) g.moveTo(x3,y3); else g.lineTo(x3,y3);
  }
  g.stroke();
  g.restore();

  /* wind ripples, baked — long shallow arcs that chase the slope */
  g.save();
  for(i=0;i<30;i++){
    var ro = (i+0.65)/30;
    var amp = h*0.0055*(0.45 + ((i*37)%10)/11);
    var x0 = -pad + ((i*53)%100)/100*(w*0.26);
    var span = (w+pad*2)*(0.40 + ((i*17)%10)/26);
    g.beginPath();
    for(k=0;k<=22;k++){
      var kx = x0 + span*(k/22);
      var ku = (kx+pad)/(w+pad*2);
      var ky = FGY(ku) + h*0.50*ro + Math.sin(k*0.58+i*1.87)*amp + Math.pow(ku,1.25)*h*0.020;
      if(k===0) g.moveTo(kx,ky); else g.lineTo(kx,ky);
    }
    g.strokeStyle = (i%2===0) ? 'rgba(255,240,206,0.19)' : 'rgba(146,80,44,0.115)';
    g.lineWidth = 1.15; g.stroke();
  }
  g.restore();

  /* a handful of sharp crescent ridges, the signature of wind-combed sand */
  g.save();
  for(i=0;i<7;i++){
    var cu = 0.10 + i*0.125;
    var cx = -pad + (w+pad*2)*cu;
    var cy = FGY(cu) + h*(0.10 + (i%3)*0.055);
    var cw = w*0.055*(0.65 + ((i*29)%10)/14);
    g.beginPath();
    g.moveTo(cx-cw, cy);
    g.quadraticCurveTo(cx, cy - cw*0.50, cx+cw, cy);
    g.quadraticCurveTo(cx, cy - cw*0.20, cx-cw, cy);
    g.fillStyle = 'rgba(255,246,220,0.115)';
    g.fill();
    g.strokeStyle = 'rgba(150,84,46,0.10)'; g.lineWidth = 1; g.stroke();
  }
  g.restore();

  bakeGrain(g, w+pad*2, h, 0.045);
  return b;
}

/* ---- grain sheet reused by every bake (one noise texture) ---- */
var GRAIN = null;
function getGrain(){
  if(GRAIN) return GRAIN;
  var n = 128, c = mkC(n,n), ng = c.getContext('2d'), d = ng.createImageData(n,n), i, v;
  for(i=0;i<d.data.length;i+=4){
    v = 128 + (Math.random()*2-1)*86;
    d.data[i]=v; d.data[i+1]=v; d.data[i+2]=v; d.data[i+3]=255;
  }
  ng.putImageData(d,0,0);
  GRAIN = c;
  return c;
}

function buildAll(){
  var w = view.w, h = view.h, pr = view.dpr, i;

  view.port = (w < h*0.82);
  if(view.port){
    GEO.hz = 0.360; GEO.sunX = 0.700; GEO.sunY = 0.300; GEO.sunR = 0.100;
    GEO.c0 = 0.505; GEO.c1 = 0.215; GEO.cp = 1.15;
    GEO.walkU = 0.620; GEO.walkH = 0.140; GEO.wide = false;
  } else {
    GEO.hz = 0.420; GEO.sunX = 0.865; GEO.sunY = 0.398; GEO.sunR = 0.048;
    GEO.c0 = 0.495; GEO.c1 = 0.205; GEO.cp = 1.05;
    GEO.walkU = 0.700; GEO.walkH = 0.260; GEO.wide = true;
  }
  FALLBACK = null;

  motes.length = 0;
  for(i=0;i<24;i++){
    motes.push({ x:Math.random(), y:Math.random(), s:0.5+Math.random()*1.5,
                 v:0.006+Math.random()*0.014, ph:Math.random()*6.28 });
  }

  try{
    var sky = bakeSky(w,h,pr);
    var far = bakeFar(w,h,pr);
    var mid = bakeMid(w,h,pr);
    var fore = bakeFore(w,h,pr);

    var plate = newBaked(w,h,pr), g = plate.g;
    g.drawImage(sky.c, -PAD, 0, sky.w, h);
    g.drawImage(far.c, -PAD, 0, far.w, h);
    g.drawImage(mid.c, -PAD, 0, mid.w, h);
    g.drawImage(fore.c, -PAD, 0, fore.w, h);

    /* vignette baked into the plate (zero per-frame cost) */
    var vg = g.createRadialGradient(w*0.44,h*0.40,Math.min(w,h)*0.20,
                                    w*0.50,h*0.50,Math.max(w,h)*0.80);
    vg.addColorStop(0.00,'rgba(30,14,32,0)');
    vg.addColorStop(0.62,'rgba(34,16,36,0.055)');
    vg.addColorStop(1.00,'rgba(24,10,32,0.28)');
    g.fillStyle = vg; g.fillRect(-PAD,0,w+PAD*2,h);

    /* a cool indigo breath at the very bottom, tying sand to cloth */
    var bg2 = g.createLinearGradient(0,h*0.80,0,h);
    bg2.addColorStop(0,'rgba(36,24,92,0)');
    bg2.addColorStop(1,'rgba(30,20,80,0.20)');
    g.fillStyle = bg2; g.fillRect(-PAD,h*0.80,w+PAD*2,h*0.20+2);

    PLATE = plate;
    GLOW = makeGlow();
    CLOUD = makeCloudShadow();
    LIGHT = makeLightBand();
    S.gl = false;
  }catch(e){
    S.err = String((e && e.message) || e);
    console.error('[482 build]', e);
  }
}

/* ============================================================
   3. the walker — indigo robe, tagelmust, electric guitar
   ============================================================ */
function drawWalker(g, x, groundY, H, ph, rim){
  var sway = Math.sin(ph)*0.010;
  g.save();
  g.translate(x, groundY);
  g.scale(H, H);

  /* long shadow on the sand (light comes from the right) */
  g.save();
  g.globalAlpha = 0.26; g.fillStyle = '#7d4225';
  g.beginPath();
  g.moveTo(0.010,0.004); g.lineTo(-0.360,0.040); g.lineTo(-0.360,0.062);
  g.lineTo(0.010,0.030); g.closePath(); g.fill();
  g.restore();

  /* guitar: neck rising over the left shoulder, body at the hip */
  g.save();
  g.strokeStyle = '#2b2168'; g.lineCap = 'round'; g.lineWidth = 0.021;
  g.beginPath(); g.moveTo(-0.040,-0.455); g.lineTo(-0.300,-0.940); g.stroke();
  g.strokeStyle = '#584ab0'; g.globalAlpha = 0.55; g.lineWidth = 0.004;
  g.beginPath(); g.moveTo(-0.052,-0.490); g.lineTo(-0.296,-0.932); g.stroke();
  g.globalAlpha = 1;
  g.fillStyle = '#2b2168';
  g.beginPath(); g.ellipse(-0.306,-0.958,0.030,0.019,-0.72,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(-0.045,-0.440,0.086,0.060,-0.40,0,Math.PI*2); g.fill();
  g.restore();

  /* robe */
  g.beginPath();
  g.moveTo(-0.070,-0.688);
  g.bezierCurveTo(-0.110,-0.540,-0.146,-0.205,-0.170,-0.014);
  g.quadraticCurveTo(-0.080, 0.012, 0.006,-0.006);
  g.quadraticCurveTo(0.098, 0.004, 0.152,-0.028);
  g.bezierCurveTo(0.166,-0.330, 0.128,-0.556, 0.074,-0.688);
  g.closePath();
  var rg = g.createLinearGradient(-0.18,-0.70,0.17,-0.02);
  rg.addColorStop(0.00,'#171043');
  rg.addColorStop(0.55,'#2c2170');
  rg.addColorStop(1.00,'#241a5c');
  g.fillStyle = rg; g.fill();

  /* robe folds */
  g.save();
  g.globalAlpha = 0.20; g.strokeStyle = '#6f5ec4'; g.lineWidth = 0.007; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-0.028,-0.640); g.quadraticCurveTo(-0.052,-0.340,-0.070,-0.060); g.stroke();
  g.beginPath(); g.moveTo(0.036,-0.630); g.quadraticCurveTo(0.060,-0.330,0.076,-0.050); g.stroke();
  g.restore();

  /* trailing arm / sleeve */
  g.beginPath();
  g.moveTo(0.048,-0.668);
  g.quadraticCurveTo(0.158,-0.545, 0.132,-0.338);
  g.quadraticCurveTo(0.102,-0.318, 0.078,-0.352);
  g.quadraticCurveTo(0.092,-0.535, 0.036,-0.648);
  g.closePath();
  g.fillStyle = '#251b62'; g.fill();

  /* shoulder wrap */
  g.beginPath();
  g.moveTo(-0.084,-0.690);
  g.quadraticCurveTo(0.000,-0.742, 0.090,-0.690);
  g.quadraticCurveTo(0.006,-0.654,-0.084,-0.690);
  g.closePath();
  g.fillStyle = '#171043'; g.fill();

  /* head, wholly wrapped */
  g.fillStyle = '#151040';
  g.beginPath(); g.ellipse(0.038,-0.772,0.057,0.061,0.05,0,Math.PI*2); g.fill();

  /* veil wraps */
  g.save(); g.globalAlpha = 0.50; g.strokeStyle = '#6d5cc8'; g.lineWidth = 0.007; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-0.010,-0.790); g.quadraticCurveTo(0.042,-0.750, 0.090,-0.778); g.stroke();
  g.beginPath(); g.moveTo(-0.012,-0.752); g.quadraticCurveTo(0.042,-0.716, 0.088,-0.742); g.stroke();
  g.restore();

  /* the only lit thing in the veil: the eye slit */
  g.save(); g.globalAlpha = 0.55; g.fillStyle = '#ffeac6';
  g.beginPath(); g.ellipse(0.050,-0.781,0.025,0.0055,-0.06,0,Math.PI*2); g.fill();
  g.restore();

  /* veil tail streaming back in the wind */
  var tail = 0.088 + Math.sin(ph*0.9)*0.013;
  g.beginPath();
  g.moveTo(0.002,-0.816);
  g.bezierCurveTo(-0.090-sway*5,-0.826, -0.150-tail,-0.756, -0.196-tail*1.7,-0.694+Math.sin(ph*1.3)*0.020);
  g.bezierCurveTo(-0.148-tail,-0.700, -0.084,-0.736, 0.004,-0.774);
  g.closePath();
  g.fillStyle = '#2e2474'; g.fill();

  /* a second, thinner tail for cloth weight */
  g.beginPath();
  g.moveTo(0.006,-0.826);
  g.bezierCurveTo(-0.070,-0.856, -0.126-tail*0.9,-0.806, -0.166-tail*1.4,-0.772);
  g.bezierCurveTo(-0.118-tail,-0.782, -0.060,-0.800, 0.006,-0.800);
  g.closePath();
  g.fillStyle = '#3a2f8c'; g.globalAlpha = 0.85; g.fill(); g.globalAlpha = 1;

  /* warm rim light from the low sun */
  g.save();
  g.globalAlpha = rim;
  g.strokeStyle = '#ffdba6';
  g.lineWidth = 0.0052;
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(0.152,-0.028);
  g.bezierCurveTo(0.166,-0.330, 0.128,-0.556, 0.074,-0.688);
  g.stroke();
  g.beginPath();
  g.moveTo(-0.196-tail*1.7,-0.694);
  g.bezierCurveTo(-0.150-tail,-0.756, -0.090-sway*5,-0.826, 0.002,-0.816);
  g.stroke();
  g.beginPath();
  g.moveTo(0.036,-0.696);
  g.quadraticCurveTo(0.060,-0.740, 0.086,-0.744);
  g.stroke();
  g.beginPath(); g.ellipse(0.038,-0.772,0.057,0.061,0.05,0,Math.PI*2); g.stroke();
  g.restore();

  g.restore();
}

/* ============================================================
   4. per-frame paint
   ============================================================ */
function draw(now){
  var w = view.w, h = view.h;
  var tt = now*0.001;
  var bass = 0, lvl = 0;
  if(S.live){ bass = clamp01(+S.live.bass||0); lvl = clamp01(+S.live.level||0); }
  if(!S.playing) lvl *= 0.30;
  var breathe = 0.5 + 0.5*Math.sin(tt*0.82);
  var still = S.rm ? 1 : 0;

  /* before the heavy bake lands, paint a plain sunset gradient so we are never black */
  if(!PLATE){
    if(!FALLBACK) FALLBACK = makeFallback();
    ctx.drawImage(FALLBACK, 0, 0, w, h);
    return;
  }

  var drift = still ? 0 : Math.sin(tt*0.05)*10;

  ctx.drawImage(PLATE.c, -PAD + drift, 0, PLATE.w, h);

  /* a slow band of brighter sand sweeping the lit face */
  if(!still){
    var lx = ((tt*0.010) % 1.35) - 0.35;
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.18*Math.sin(tt*0.4);
    ctx.drawImage(LIGHT, w*lx - w*0.30, h*0.50, w*0.86, h*0.34);
    ctx.restore();
  }

  /* cloud shadow, drifting the other way */
  if(!still){
    var cx = ((tt*0.0075) % 1.2) - 0.2;
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(CLOUD, w*cx - w*0.42, h*0.55, w*0.96, h*0.34);
    ctx.restore();
  }

  /* sun bloom — the only per-frame additive pass, kept small */
  var sx = w*GEO.sunX + drift*0.8, sy = h*GEO.sunY;
  var gr = Math.min(w,h)*(0.30 + lvl*0.05 + breathe*0.015);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.30 + bass*0.26 + breathe*0.06;
  ctx.drawImage(GLOW, sx-gr, sy-gr*0.72, gr*2, gr*1.44);
  ctx.restore();

  /* horizon haze */
  var hz = h*GEO.hz;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var hzA = (0.07 + lvl*0.09) * (S.rm ? 0.55 : 1);
  var g0 = hz - h*0.05, g1 = hz + h*0.05;
  var hg = ctx.createLinearGradient(0,g0,0,g1);
  hg.addColorStop(0,'rgba(255,198,132,0)');
  hg.addColorStop(0.45,'rgba(255,214,162,'+hzA.toFixed(3)+')');
  hg.addColorStop(1,'rgba(255,190,130,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, g0, w, g1-g0);
  ctx.restore();

  /* the walker on the crest */
  var u = GEO.walkU + (still ? 0 : Math.sin(tt*0.031)*0.006);
  var wx = -PAD + PLATE.w*u + drift;
  var gy = FGY(u);
  var figH = GEO.wide ? Math.min(h*GEO.walkH, w*0.135) : Math.min(h*GEO.walkH, w*0.300);
  var ph = tt*1.9 + 0.6;
  var bob = S.rm ? 0 : Math.abs(Math.sin(ph))*h*0.004;
  drawWalker(ctx, wx, gy + h*0.006 - bob, figH, ph, 0.52 + bass*0.30);

  /* blown dust */
  if(!S.rm){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var i=0;i<motes.length;i++){
      var m = motes[i];
      var mx = ((m.x + tt*m.v*0.55) % 1) * (w+90) - 45;
      var my = h*(0.55 + m.y*0.46) - ((tt*m.v*24) % (h*0.22));
      var a = 0.08 + 0.14*Math.abs(Math.sin(tt*1.3 + m.ph));
      ctx.fillStyle = 'rgba(255,228,182,'+a.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(mx,my,m.s,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================================================
   5. lyric rendering
   ============================================================ */
var elSong = document.getElementById('song');
var elPrev = document.getElementById('lprev'), elCur = document.getElementById('lcur'),
    elNext = document.getElementById('lnext'), elNone = document.getElementById('lnone'),
    elProg = document.getElementById('prog');

var curSpans = [], curTimes = [], curLit = -1, lastIdx = -2;
function charTimes(line){
  var n = line.text.length, out = new Array(n), i, tt;
  var span = (+line.dur > 0) ? +line.dur : 4;
  for(i=0;i<n;i++){
    tt = null;
    if(line.chars && line.chars[i] && isFinite(+line.chars[i].t)) tt = +line.chars[i].t;
    if(tt === null) tt = line.t + span * i / Math.max(1, n);
    out[i] = tt;
  }
  return out;
}

function fitCur(){
  var maxH = Math.max(70, view.h * (view.port ? 0.20 : 0.26));
  var f = 1, guard;
  elCur.style.setProperty('--k','1');
  for(guard=0; guard<4; guard++){
    var hh = elCur.offsetHeight || 0;
    if(hh <= maxH) break;
    f = Math.max(0.34, f * Math.sqrt(maxH / Math.max(1,hh)) * 0.97);
    elCur.style.setProperty('--k', f.toFixed(3));
  }
  elCur.style.letterSpacing = elCur.textContent.length > 12 ? '0.005em' : '';
}

function renderCur(idx){
  var line = S.lines[idx];
  elCur.textContent = ''; curSpans = []; curTimes = []; curLit = -1;
  if(!line) return;
  var chars = Array.from(line.text), frag = document.createDocumentFragment(), i, sp;
  for(i=0;i<chars.length;i++){
    sp = document.createElement('span');
    sp.textContent = chars[i];
    frag.appendChild(sp);
    curSpans.push(sp);
  }
  elCur.appendChild(frag);
  curTimes = charTimes(line);
  fitCur();
}

function showEmpty(){
  elPrev.style.display = 'none'; elNext.style.display = 'none';
  elCur.style.display = 'none';
  elNone.style.display = '';
  elNone.style.opacity = '1';
}
function showLyrics(){
  elNone.style.display = 'none';
  elPrev.style.display = ''; elNext.style.display = ''; elCur.style.display = '';
}

function paint(force){
  var idx = calcIdx(S.t);

  if(idx !== lastIdx || force){
    lastIdx = idx;
    if(!S.lines.length){
      showEmpty();
    } else if(idx < 0){
      showLyrics();
      elPrev.textContent = '';
      elPrev.style.opacity = '0';
      elCur.textContent = ''; curSpans = []; curTimes = []; curLit = -1;
      elCur.style.setProperty('--k','1');
      elCur.style.opacity = '0';
      elNext.textContent = S.lines[0].text;
      elNext.style.opacity = '0.55';
    } else {
      showLyrics();
      elCur.style.opacity = '1';
      elPrev.textContent = idx > 0 ? S.lines[idx-1].text : '';
      elPrev.style.opacity = idx > 0 ? '1' : '0';
      elNext.textContent = (idx+1 < S.lines.length) ? S.lines[idx+1].text : '';
      elNext.style.opacity = (idx+1 < S.lines.length) ? '1' : '0';
      renderCur(idx);
    }
  }

  if(idx >= 0 && curSpans.length){
    var lit = 0, i;
    for(i=0;i<curTimes.length;i++){ if(curTimes[i] <= S.t + 0.001) lit++; else break; }
    if(lit !== curLit){
      var from = curLit < 0 ? 0 : curLit;
      for(i=Math.max(0,from); i<lit && i<curSpans.length; i++) curSpans[i].className = 'on';
      curLit = lit;
    }
  }

  var prog = (S.dur > 0) ? Math.min(1, Math.max(0, S.t / S.dur)) : 0;
  elProg.style.width = (prog*100).toFixed(2) + '%';
}

/* ============================================================
   6. messages
   ============================================================ */
function onInit(p){
  try{
    S.song = p.song || {};
    S.dur = +p.duration || 0;
    S.playing = (p.playing === false) ? false : true;

    var raw = Array.isArray(p.lines) ? p.lines : [];
    var out = [], i, L, txt, lim = Math.min(raw.length, 3000);
    for(i=0;i<lim;i++){
      L = raw[i];
      if(!L) continue;
      txt = (typeof L.text === 'string' && L.text.length) ? L.text : '';
      if(!txt) continue;
      out.push({
        t:(isFinite(+L.t) ? +L.t : 0),
        dur:(isFinite(+L.dur) ? +L.dur : 0),
        text:txt,
        chars:Array.isArray(L.chars) ? L.chars : null
      });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    S.lines = out;
    lastIdx = -2;

    var sd = S.song || {};
    var nm = (typeof sd.name === 'string' ? sd.name : '') || '未命名';
    var ar = sd.artists;
    if(Array.isArray(ar)) ar = ar.filter(Boolean).join(' / ');
    if(typeof ar !== 'string') ar = '';
    elSong.textContent = ar ? (nm + '  ·  ' + ar) : nm;

    paint(true);
  }catch(e){
    S.err = String((e && e.message) || e);
    console.error('[482 init]', e);
  }
}

function onTick(p){
  var t = +p.time;
  if(isFinite(t)) S.t = t < 0 ? 0 : t;
  if(typeof p.playing === 'boolean') S.playing = p.playing;
  paint(false);
}

/* ============================================================
   7. resize + loop
   ============================================================ */
function layout(){
  var w = window.innerWidth | 0, h = window.innerHeight | 0;
  if(!isFinite(w) || !isFinite(h) || w < 2 || h < 2){ w = 1440; h = 900; }
  view.w = w; view.h = h;
  view.port = (w < h*0.82);

  var dpr = window.devicePixelRatio || 1;
  if(!isFinite(dpr) || dpr < 0.5) dpr = 1;
  dpr = Math.min(dpr, 1.6);
  /* hard cap on total backing pixels: five baked layers must stay affordable */
  dpr = Math.min(dpr, Math.sqrt(3.2e6 / Math.max(1, w*h)));
  dpr = Math.max(0.72, dpr);
  view.dpr = dpr;

  cvs.width = Math.max(2, Math.round(w*dpr));
  cvs.height = Math.max(2, Math.round(h*dpr));
  cvs.style.width = w + 'px';
  cvs.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function rebuild(){
  try{
    buildAll();
  }catch(e){ console.error('[482 rebuild]', e); }
  lastIdx = -2;
  paint(true);
}

function resize(){
  layout();
  rebuild();
}

var lastT = 0;
function frame(now){
  var t0 = performance.now();
  try{
    if(!S.ready){
      S.ready = true;
      try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }
      catch(e){ console.error('[482 ready]', e); }
    }
    S.frames++;
    ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
    draw(now || 0);
    paint(false);
  }catch(e){
    S.err = String((e && e.message) || e);
    console.error('[482 frame]', e);
  }
  S.js = Math.max(0, performance.now() - t0);
  requestAnimationFrame(frame);
}

/* ============================================================
   8. boot — ready first, heavy baking after
   ============================================================ */
try{
  var rzTimer = 0;
  window.addEventListener('resize', function(){
    if(rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(function(){
      rzTimer = 0;
      try{ resize(); }catch(e){ console.error('[482 resize]', e); }
    }, 130);
  });

  window.addEventListener('message', function(ev){
    try{
      var d = ev && ev.data;
      if(!d || d.__c100 !== 1) return;
      if(d.type === 'init') onInit(d.payload || {});
      else if(d.type === 'tick') onTick(d.payload || {});
      else if(d.type === 'live'){ S.live = d.payload || null; }
      else if(d.type === 'beat'){ S.beat = Math.max(0, +(((d.payload||{}).level)) || 0); }
    }catch(e){
      S.err = String((e && e.message) || e);
      console.error('[482 msg]', e);
    }
  });

  /* geometry only — cheap, and safe to do before the first frame */
  try{ layout(); }catch(e){ console.error('[482 layout]', e); }

  requestAnimationFrame(frame);

  setTimeout(function(){
    if(S.ready) return;
    S.ready = true;
    try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }
    catch(e){ console.error('[482 ready-fallback]', e); }
  }, 600);

  /* heavy layers, right after ready has been posted */
  requestAnimationFrame(function(){
    setTimeout(function(){
      try{ rebuild(); }catch(e){ console.error('[482 initial-build]', e); }
    }, 0);
  });
}catch(e){
  S.err = String((e && e.message) || e);
  console.error('[482 boot]', e);
}
})();
</script>
