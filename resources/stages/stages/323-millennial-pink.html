<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>323 · 千禧粉像</title>
<style>
  :root{
    --pink:#ff2e93;
    --pink-hi:#ff9ccc;
    --ink:#0b0b0c;
    --paper:#f4efe6;
    --dot:rgba(11,11,12,.16);
    --lyr:clamp(20px,3.1vw,46px);
    --beat:0;
    --lvl:0;
    --bass:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--pink)}
  body{
    font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans SC",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;
    background:
      radial-gradient(120% 92% at 76% 10%, rgba(255,255,255,.14), transparent 60%),
      var(--pink);
  }
  /* ---- hand-pulled screen-print dot field on the flat pink ---- */
  #dots{position:absolute;inset:-8%;pointer-events:none;opacity:.42;
    background-image:radial-gradient(var(--dot) 1.35px, transparent 1.45px);
    background-size:9px 9px;
    transform:translateX(var(--dx,0px)) rotate(-.6deg);
  }
  /* ---- giant outline glyph living behind the print ---- */
  #glyph{position:absolute;left:26%;bottom:-26vh;font-family:"Arial Black",Impact,sans-serif;
    font-weight:900;font-size:96vh;line-height:.78;letter-spacing:-.06em;
    color:transparent;-webkit-text-stroke:2px rgba(11,11,12,.16);
    transform:rotate(-9deg);white-space:nowrap;pointer-events:none;user-select:none;
  }
  /* ---- black paper slabs (the stable dark readable zone) ---- */
  .slab{background:var(--ink);color:var(--paper);
    box-shadow:0 0 0 2px var(--ink), .9vw .9vw 0 rgba(11,11,12,.92);}
  /* ---- the halftone print panel ---- */
  #poster{position:absolute;left:7vw;top:50%;width:min(47vw,640px);height:min(66vh,700px);
    transform:translateY(-50%) rotate(var(--pr,-2.4deg)) scale(var(--ps,1));
    transform-origin:50% 55%;z-index:2}
  #poster .paper{position:absolute;inset:0;background:var(--paper);
    box-shadow:1.1vw 1.1vw 0 rgba(11,11,12,.9), 0 0 0 3px var(--ink);
    overflow:hidden}
  #port,#portGhost{position:absolute;display:block;width:100%;height:100%}
  #port{top:0;left:0}
  #portGhost{top:0;left:0;opacity:.9;mix-blend-mode:multiply;
    transform:translate(var(--ghx,7px),var(--ghy,-6px))}
  /* uneven ink pass: a soft dark bar drifts down the print like a roller streak */
  #poster .paper::after{content:"";position:absolute;left:-20%;right:-20%;height:26%;
    top:-30%;background:linear-gradient(180deg,transparent,rgba(11,11,12,.16),transparent);
    animation:pass 9s linear infinite;mix-blend-mode:multiply}
  @keyframes pass{0%{top:-30%}100%{top:104%}}
  /* a strip of raw colour slapped across the print: pop against the grey dots */
  #bar{position:absolute;left:-7%;width:114%;top:33%;height:7.5%;z-index:3;
    background:var(--pink);transform:rotate(-2.6deg);
    box-shadow:0 -2px 0 var(--ink), 0 2px 0 var(--ink), .5vw .5vw 0 rgba(11,11,12,.35)}
  #cap{position:absolute;left:-1.2vw;bottom:-2.1vh;font-family:"Arial Black",sans-serif;
    font-weight:900;font-size:clamp(9px,1vw,13px);letter-spacing:.22em;padding:.5em .9em;
    background:var(--ink);color:var(--paper);transform:rotate(-2deg);white-space:nowrap;
    max-width:80%;overflow:hidden;text-overflow:ellipsis}
  /* ---- torn masking-tape corners ---- */
  .tape{position:absolute;width:9vw;height:2.6vh;background:rgba(244,239,230,.75);
    box-shadow:0 0 0 1px rgba(11,11,12,.25);z-index:3}
  .tape.t1{top:-1.4vh;left:6%;transform:rotate(-7deg)}
  .tape.t2{bottom:-1.2vh;right:4%;transform:rotate(5deg)}
  /* ---- cut-paper wordmark ---- */
  #name{position:absolute;right:4.5vw;top:5vh;z-index:4;max-width:46vw;text-align:right;
    transform:rotate(2.2deg) skewX(-9deg)}
  #name b{display:inline-block;font-family:"Arial Black",Impact,sans-serif;font-weight:900;
    font-size:clamp(15px,2.15vw,32px);line-height:1.02;letter-spacing:-.02em;
    color:var(--ink);text-shadow:.2em .2em 0 rgba(244,239,230,.98), -.02em -.02em 0 var(--ink);
    filter:drop-shadow(0 .16em 0 rgba(11,11,12,.14));
    padding:.08em .16em;background:rgba(255,255,255,.0);
    text-transform:uppercase;word-break:break-word}
  #name i{display:block;font-style:normal;margin-top:.5em;font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:700;font-size:clamp(9px,1vw,13px);letter-spacing:.3em;color:rgba(11,11,12,.72)}
  /* ---- lyric block: dark slab, never pink-ground text ---- */
  #lyricWrap{position:absolute;right:4vw;bottom:6.5vh;z-index:5;
    width:min(56vw,820px);padding:clamp(14px,1.9vw,30px) clamp(16px,2.1vw,34px);
    transform:rotate(var(--lr,1.1deg));}
  #lyricWrap .tagline{font-family:"Arial Black",sans-serif;font-weight:900;
    font-size:clamp(8px,.82vw,11px);letter-spacing:.32em;opacity:.62;margin-bottom:.7em}
  #lyric{font-size:var(--lyr);line-height:1.22;font-weight:800;color:#fff;
    letter-spacing:.01em;word-break:break-word;overflow-wrap:anywhere;
    max-height:38vh;overflow:hidden}
  #lyric .ln{display:block;transition:opacity .18s linear}
  #lyric .prev,#lyric .next{opacity:.40;font-size:.72em;font-weight:700;
    padding-left:.9em;border-left:3px solid rgba(255,156,204,.55);margin-bottom:.42em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lyric .cur{display:block;opacity:1;position:relative;padding:.10em .16em .16em;
    background:linear-gradient(96deg,var(--pink) 0%,var(--pink-hi) 100%);
    box-shadow:.22em .22em 0 rgba(0,0,0,.62);margin:.30em 0 0;
    color:#0b0b0c;text-shadow:none;}
  #lyric .cur .ch{opacity:.24;transition:opacity .12s linear}
  #lyric .cur .ch.on{opacity:1}
  #lyric .cur .ch.hot{background:#fff;box-shadow:0 0 0 .06em #0b0b0c;color:#0b0b0c;opacity:1}
  /* registration marks, the printer's own chrome */
  #stage::before,#stage::after{content:"";position:absolute;width:26px;height:26px;
    border:2px solid rgba(11,11,12,.55);border-radius:50%;z-index:8;pointer-events:none}
  #stage::before{left:2.4vw;top:2.6vh}
  #stage::after{right:2.4vw;bottom:2.6vh;border-radius:0;transform:rotate(45deg);
    border-width:0;border-top:2px solid rgba(11,11,12,.5);border-left:2px solid rgba(11,11,12,.5)}
  /* ---- tiny zine chrome ---- */
  #hud{position:absolute;left:4.5vw;bottom:4vh;z-index:6;font-family:"Arial Black",sans-serif;
    font-weight:900;font-size:clamp(8px,.8vw,11px);letter-spacing:.28em;
    color:rgba(11,11,12,.8);transform:rotate(-1.2deg)}
  #hud span{background:var(--ink);color:var(--paper);padding:.35em .7em;margin-right:.6em}
  #stamp{position:absolute;right:4.5vw;top:calc(5vh + 7.4vw);z-index:1;
    font-family:"Arial Black",sans-serif;font-weight:900;font-size:clamp(8px,.78vw,11px);
    letter-spacing:.3em;color:rgba(11,11,12,.55);transform:rotate(-3deg)}
  /* ---- calmer print for reduced motion ---- */
  @media (prefers-reduced-motion: reduce){
    #poster .paper::after{animation:none;opacity:0}
    #lyric .ln,#lyric .cur .ch{transition:none}
  }
  /* ---- no-lyrics state (never invented) ---- */
  #empty{position:absolute;inset:0;z-index:7;display:none;place-items:center;pointer-events:none}
  #empty b{font-family:"Arial Black",Impact,sans-serif;font-weight:900;
    font-size:clamp(28px,7vw,110px);letter-spacing:-.03em;color:transparent;
    -webkit-text-stroke:3px var(--ink);transform:rotate(-6deg)}
  #empty i{display:block;margin-top:1em;font-style:normal;text-align:center;
    font-size:clamp(9px,1vw,13px);letter-spacing:.42em;color:var(--ink);transform:rotate(-6deg)}
  /* ---- portrait phone ---- */
  @media (max-aspect-ratio: 4/5){    #poster{left:50%;top:34%;width:min(78vw,460px);height:min(40vh,430px);
      transform:translate(-50%,-50%) rotate(var(--pr,-2.4deg)) scale(var(--ps,1))}
    #lyricWrap{left:5vw;right:5vw;width:auto;bottom:4.5vh;padding:3.4vw 3.8vw}
    #lyric{max-height:27vh;font-size:clamp(18px,5.2vw,32px)}
    #lyric .prev,#lyric .next{display:none}
    #lyric .cur{padding:.08em .12em .12em}
    #name{top:3.4vh;right:6vw;max-width:60vw}
    #glyph{font-size:52vh;left:-10vw;bottom:-6vh}
    #stamp{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="dots"></div>
  <div id="glyph">19</div>

  <div id="poster">
    <div class="paper"></div>
    <canvas id="portGhost" aria-hidden="true"></canvas>
    <canvas id="port" aria-hidden="true"></canvas>
    <div id="bar" aria-hidden="true"></div>
    <div class="tape t1"></div>
    <div class="tape t2"></div>
    <div id="cap">HALFTONE&nbsp;/&nbsp;N°323</div>
  </div>

  <div id="name"><b>MILLENNIAL PINK</b><i>NEO-POP · ZINE PRINT</i></div>
  <div id="stamp">19 / 50 &nbsp;·&nbsp; SCREEN PRINT</div>

  <div id="lyricWrap" class="slab">
    <div class="tagline">LYRICS &nbsp;/&nbsp; 逐字</div>
    <div id="lyric"></div>
  </div>

  <div id="hud"><span>323</span>PINK × HALFTONE</div>
  <div id="empty"><b>NO LYRICS</b><i>无 词</i></div>
</div>
<script>
(function(){
  'use strict';
  var S = {
    lines: [], starts: [], duration: 0, accent: [255,46,147],
    t: 0, idx: -1, playing: true, frames: 0, js: 0,
    rm: false, gl: false, song: {}, readySent: false, lastTickAt: 0
  };
  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;
  var portC = $('port'), ghostC = $('portGhost'), posterEl = $('poster');
  S.pink = [255, 46, 147];
  S.coverSrc = '';
  S.coverImg = null;
  S.coverOk = false;

  /* ---------- small utils (all counts bounded) ---------- */
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function rgbCss(a){ return 'rgb(' + clamp(a[0]|0,0,255) + ',' + clamp(a[1]|0,0,255) + ',' + clamp(a[2]|0,0,255) + ')'; }
  function lumOf(a){ return (0.2126*a[0] + 0.7152*a[1] + 0.0722*a[2]) / 255; }
  function satOf(a){
    var mx = Math.max(a[0],a[1],a[2]), mn = Math.min(a[0],a[1],a[2]);
    return mx > 0 ? (mx - mn) / mx : 0;
  }
  function rngOf(seed){
    var s = (seed | 0) || 1;
    return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function cut(s, n){ s = (s == null) ? '' : String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function artistStr(x){
    if (typeof x === 'string') return x.trim();
    if (x && x.length){
      var out = [], i;
      for (i = 0; i < x.length && i < 8; i++){ if (typeof x[i] === 'string' && x[i]) out.push(x[i]); }
      return out.join(' / ');
    }
    return '';
  }

  /* ---------- palette: fluorescent flat ground, never muddy ---------- */
  function applyPalette(acc){
    var a = (acc && acc.length === 3) ? [ +acc[0]||0, +acc[1]||0, +acc[2]||0 ] : [255,46,147];
    if (!(lumOf(a) > 0.45 && satOf(a) > 0.30)) a = [255, 46, 147];
    S.pink = a;
    root.style.setProperty('--pink', rgbCss(a));
    var hi = [0,1,2].map(function(i){ return clamp(Math.round(a[i] + (255 - a[i]) * 0.64), 0, 255); });
    S.pinkHi = hi;
    root.style.setProperty('--pink-hi', rgbCss(hi));
    return a;
  }

  /* ---------- halftone print engine ---------- */
  var DOTS = [];                 // cached {x,y,r} in css px
  var printSig = '';             // cache key: size + source
  var coverCache = {};
  var srcCv = document.createElement('canvas');

  function drawCoverInto(ctx, w, h, img){
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (!(iw > 0) || !(ih > 0)) return false;
    var sc = Math.max(w / iw, h / ih) * 1.16;   /* push in: the print is a close crop */
    var dw = iw * sc, dh = ih * sc;
    ctx.drawImage(img, (w - dw) / 2, (h - dh) * 0.34, dw, dh);
    return true;
  }

  /* synthetic headshot used when the cover is missing or taints the canvas */
  function drawSilhouette(ctx, w, h, seed){
    var rnd = rngOf(seed || 7), i;
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#efeadf'); g.addColorStop(0.65, '#e7e1d5'); g.addColorStop(1, '#d9d2c4');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    /* shoulders */
    ctx.fillStyle = '#141416';
    ctx.beginPath();
    ctx.moveTo(-w * 0.05, h * 1.02);
    ctx.quadraticCurveTo(w * 0.14, h * 0.80, w * 0.36, h * 0.755);
    ctx.lineTo(w * 0.64, h * 0.755);
    ctx.quadraticCurveTo(w * 0.86, h * 0.80, w * 1.05, h * 1.02);
    ctx.closePath(); ctx.fill();
    /* neck */
    ctx.fillRect(w * 0.435, h * 0.60, w * 0.13, h * 0.18);
    /* head */
    ctx.beginPath();
    ctx.ellipse(w * 0.5, h * 0.41, w * 0.205, h * 0.235, 0, 0, Math.PI * 2);
    ctx.fill();
    /* hair: spiky crown, hand-cut */
    ctx.beginPath();
    ctx.moveTo(w * 0.285, h * 0.40);
    for (i = 0; i <= 9; i++){
      var x = w * (0.285 + 0.43 * (i / 9));
      var y = h * (0.24 - (i % 2 ? 0.035 : 0.005) - rnd() * 0.02);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w * 0.725, h * 0.42);
    ctx.quadraticCurveTo(w * 0.66, h * 0.30, w * 0.5, h * 0.305);
    ctx.quadraticCurveTo(w * 0.33, h * 0.30, w * 0.285, h * 0.40);
    ctx.closePath(); ctx.fill();
    /* eye sockets + mouth lift: light shapes read as dots opening up */
    ctx.fillStyle = 'rgba(238,233,223,.94)';
    ctx.beginPath(); ctx.ellipse(w * 0.427, h * 0.405, w * 0.045, h * 0.018, -0.08, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w * 0.573, h * 0.405, w * 0.045, h * 0.018, 0.08, 0, Math.PI * 2); ctx.fill();
    /* pupils */
    ctx.fillStyle = '#0b0b0c';
    ctx.beginPath(); ctx.arc(w * 0.427, h * 0.406, w * 0.014, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.573, h * 0.406, w * 0.014, 0, Math.PI * 2); ctx.fill();
    /* nose bridge highlight + shadow */
    ctx.fillStyle = 'rgba(230,224,212,.85)';
    ctx.beginPath(); ctx.ellipse(w * 0.5, h * 0.455, w * 0.026, h * 0.062, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(20,20,22,.9)';
    ctx.beginPath(); ctx.ellipse(w * 0.5, h * 0.505, w * 0.018, h * 0.012, 0, 0, Math.PI * 2); ctx.fill();
    /* mouth */
    ctx.fillRect(w * 0.455, h * 0.535, w * 0.09, h * 0.02);
    /* chin light */
    ctx.fillStyle = 'rgba(236,231,220,.55)';
    ctx.beginPath(); ctx.ellipse(w * 0.5, h * 0.565, w * 0.05, h * 0.022, 0, 0, Math.PI * 2); ctx.fill();
    /* print dust */
    ctx.fillStyle = 'rgba(11,11,12,.35)';
    for (i = 0; i < 90; i++){
      ctx.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
    }
  }

  function sampleToDots(src, seed){
    var cw = portC.clientWidth | 0, ch = portC.clientHeight | 0;
    if (cw < 8 || ch < 8) return false;
    var cell = Math.round(clamp(Math.min(cw, ch) / 46, 6, 16));
    var cols, rows, guard = 0;
    do {
      cols = Math.ceil(cw / cell);
      rows = Math.ceil(ch / cell);
      if (cols * rows <= 24000) break;
      cell += 2;
    } while (++guard < 12);
    if (cols < 2 || rows < 2 || cols * rows > 26000) return false;

    var small = document.createElement('canvas');
    small.width = cols; small.height = rows;
    var sx = small.getContext('2d');
    if (!sx) return false;
    try {
      sx.drawImage(src, 0, 0, cols, rows);
    } catch (e){ return false; }
    var data;
    try { data = sx.getImageData(0, 0, cols, rows).data; }
    catch (e){ return false; }
    if (!data || data.length < cols * rows * 4) return false;

    var out = [], cy, cx, p, v, dark, r, jx, jy, rnd = rngOf(seed || 11);
    for (cy = 0; cy < rows; cy++){
      for (cx = 0; cx < cols; cx++){
        p = (cy * cols + cx) * 4;
        v = (0.2126 * data[p] + 0.7152 * data[p + 1] + 0.0722 * data[p + 2]) / 255;
        /* hard contrast curve: screen-print blacks and blowouts */
        v = clamp((v - 0.26) / 0.62, 0, 1);
        v = Math.pow(v, 1.22);
        dark = 1 - v;
        r = cell * 0.70 * Math.sqrt(dark);
        if (r < 0.45) continue;
        jx = (rnd() - 0.5) * cell * 0.16;
        jy = (rnd() - 0.5) * cell * 0.16;
        out.push({ x: (cx + 0.5) * cell + jx, y: (cy + 0.5) * cell + jy, r: r });
        if (out.length > 24000) break;
      }
      if (out.length > 24000) break;
    }
    DOTS = out;
    return out.length > 40;
  }

  function paintDots(){
    var w = portC.clientWidth | 0, h = portC.clientHeight | 0;
    if (w < 8 || h < 8) return;
    var dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    var cvs = [portC, ghostC], k, i, d;
    for (k = 0; k < 2; k++){
      cvs[k].width = Math.round(w * dpr);
      cvs[k].height = Math.round(h * dpr);
    }
    var ink = portC.getContext('2d'), mis = ghostC.getContext('2d');
    if (!ink || !mis) return;
    ink.setTransform(dpr, 0, 0, dpr, 0, 0);
    mis.setTransform(dpr, 0, 0, dpr, 0, 0);
    ink.clearRect(0, 0, w, h);
    mis.clearRect(0, 0, w, h);
    mis.fillStyle = rgbCss(S.pink);
    ink.fillStyle = '#0b0b0c';
    var n = DOTS.length, off = 3.4;
    /* pink misregistration pass (slightly enlarged) */
    mis.beginPath();
    for (i = 0; i < n; i++){
      d = DOTS[i];
      mis.moveTo(d.x + off + d.r * 1.06, d.y - off);
      mis.arc(d.x + off, d.y - off, d.r * 1.06, 0, 6.28318);
    }
    mis.fill();
    /* black key pass */
    ink.beginPath();
    for (i = 0; i < n; i++){
      d = DOTS[i];
      ink.moveTo(d.x + d.r, d.y);
      ink.arc(d.x, d.y, d.r, 0, 6.28318);
    }
    ink.fill();
  }

  function makeJag(el, seed, jitter){
    var rnd = rngOf(seed), pts = [], per = 7, i, j, pct;
    var sides = [
      [0, 0, 100, 0], [100, 0, 100, 100], [100, 100, 0, 100], [0, 100, 0, 0]
    ];
    for (j = 0; j < 4; j++){
      var s = sides[j];
      for (i = 0; i < per; i++){
        var q = i / per;
        var x = s[0] + (s[2] - s[0]) * q;
        var y = s[1] + (s[3] - s[1]) * q;
        var nx = (j === 1) ? -1 : (j === 3 ? 1 : 0);
        var ny = (j === 0) ? 1 : (j === 2 ? -1 : 0);
        x += nx * rnd() * jitter;
        y += ny * rnd() * jitter;
        pts.push(x.toFixed(1) + '% ' + y.toFixed(1) + '%');
      }
    }
    try { el.style.clipPath = 'polygon(' + pts.join(',') + ')'; } catch (e){}
  }

  function buildPrint(reason){
    var w = portC.clientWidth | 0, h = portC.clientHeight | 0;
    if (w < 8 || h < 8) return;
    var sig = w + 'x' + h + '|' + (S.coverOk ? 'cover' : 'silo');
    if (sig === printSig && reason !== 'force') return;

    var cw = Math.min(w, 560), ch = Math.round(cw * (h / w));
    srcCv.width = cw; srcCv.height = ch;
    var cx = srcCv.getContext('2d');
    if (!cx) return;
    cx.clearRect(0, 0, cw, ch);
    var seeded = false;
    if (S.coverOk && S.coverImg){
      try { seeded = drawCoverInto(cx, cw, ch, S.coverImg); } catch (e){ seeded = false; }
    }
    if (!seeded) drawSilhouette(cx, cw, ch, (S.song && S.song.name) ? hashStr(S.song.name) : 23);

    /* burn the edges so the print always holds a dark frame around the face */
    try {
      var vg = cx.createRadialGradient(cw * 0.5, ch * 0.42, Math.min(cw, ch) * 0.18,
                                       cw * 0.5, ch * 0.46, Math.max(cw, ch) * 0.78);
      vg.addColorStop(0, 'rgba(11,11,12,0)');
      vg.addColorStop(0.62, 'rgba(11,11,12,.28)');
      vg.addColorStop(1, 'rgba(11,11,12,.72)');
      cx.globalCompositeOperation = 'multiply';
      cx.fillStyle = vg;
      cx.fillRect(0, 0, cw, ch);
      cx.globalCompositeOperation = 'source-over';
    } catch (e){}

    var ok = sampleToDots(srcCv, 17);
    if (!ok && seeded){
      /* cross-origin cover tainted the canvas: fall back to the generated headshot */
      if (S.coverImg) S.coverImg.__bad = true;
      S.coverOk = false;
      try { cx.clearRect(0, 0, cw, ch); } catch (e){}
      drawSilhouette(cx, cw, ch, (S.song && S.song.name) ? hashStr(S.song.name) : 23);
      ok = sampleToDots(srcCv, 19);
      seeded = false;
      sig = w + 'x' + h + '|silo';
    }
    if (!ok){ DOTS = []; }
    printSig = sig;
    paintDots();
    /* hand-torn print edges: the ink stops short of the paper in ragged nicks */
    var seed = hashStr((S.song && S.song.name) || 'pink');
    makeJag(portC, seed, 2.2);
    makeJag(ghostC, seed + 31, 3.1);
  }

  function hashStr(s){
    s = String(s || ''); var h = 7, i;
    for (i = 0; i < s.length && i < 64; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h || 7;
  }

  function loadCover(url){
    if (!url || typeof url !== 'string'){
      S.coverOk = false; S.coverImg = null; S.coverSrc = '';
      return;
    }
    S.coverSrc = url;
    if (coverCache[url]){
      if (coverCache[url].__bad){ S.coverOk = false; S.coverImg = null; return; }
      S.coverImg = coverCache[url]; S.coverOk = true;
      return;
    }
    S.coverOk = false;
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.decoding = 'async';
    img.onload = function(){
      if (S.coverSrc !== url) return;
      coverCache[url] = img;
      S.coverImg = img; S.coverOk = true;
      printSig = '';
      buildPrint('force');
    };
    img.onerror = function(){
      if (S.coverSrc !== url) return;
      S.coverImg = null; S.coverOk = false;
      printSig = '';
      buildPrint('force');
    };
    img.src = url;
  }

  /* ---------- chrome copy ---------- */
  function updateMeta(){
    var song = S.song || {};
    var nm = (song.name && String(song.name).trim()) || 'UNTITLED';
    var ar = artistStr(song.artists);
    var nmEl = $('name');
    if (nmEl){
      var b = nmEl.querySelector('b'), i = nmEl.querySelector('i');
      if (b) b.textContent = cut(nm, 26).toUpperCase();
      if (i) i.textContent = cut(ar, 42).toUpperCase() || 'UNKNOWN ARTIST';
    }
    var capEl = $('cap');
    if (capEl) capEl.textContent = 'HALFTONE  /  N°' + (hashStr(nm) % 900 + 100);
  }

  function sendReady(){
    if (S.readySent) return;
    S.readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
  }
  requestAnimationFrame(function(){ if (!S.readySent) sendReady(); });
  setTimeout(sendReady, 60);
  function normLines(raw){
    var out = [], i, l;
    if (!raw || !raw.length) return out;
    for (i = 0; i < raw.length; i++){
      l = raw[i] || {};
      out.push({
        t: isFinite(l.t) ? +l.t : 0,
        dur: isFinite(l.dur) && l.dur > 0 ? +l.dur : 0,
        text: typeof l.text === 'string' ? l.text : '',
        chars: l.chars && l.chars.length ? l.chars : null
      });
    }
    out.sort(function(a,b){ return a.t - b.t; });
    return out;
  }

  function findIdx(t){
    var lo = 0, hi = S.starts.length - 1, mid, r = -1;
    while (lo <= hi){ mid = (lo + hi) >> 1; if (t >= S.starts[mid]) { r = mid; lo = mid + 1; } else hi = mid - 1; }
    return r;
  }

  /* ---------- lyric layer ---------- */
  var lyricEl = $('lyric');
  var glyphEl = $('glyph');
  var lyrKey = '', chSpans = [], chTimes = [], chIdx = -1, curLine = null;

  function lineTimes(l){
    var txt = l.text || '', n = txt.length;
    var start = isFinite(l.t) ? +l.t : 0;
    var d = (isFinite(l.dur) && l.dur > 0) ? +l.dur : Math.max(1.5, n * 0.17);
    var cs = l.chars, out = new Array(n), i, j = 0, k, found;
    if (cs && cs.length){
      for (i = 0; i < n; i++){
        found = -1;
        for (k = 0; k < 3 && j + k < cs.length; k++){
          if (cs[j + k] && cs[j + k].c === txt.charAt(i)){ found = j + k; break; }
        }
        if (found < 0 && j < cs.length) found = j;
        if (found >= 0 && cs[found] && isFinite(cs[found].t)){
          out[i] = +cs[found].t;
          j = found + 1;
        }
      }
    }
    var last = start;
    for (i = 0; i < n; i++){
      if (out[i] == null || out[i] < start) out[i] = start + d * (i / Math.max(1, n));
      if (out[i] < last) out[i] = last;
      last = out[i];
    }
    return out;
  }

  function mkLine(text, cls){
    var el = document.createElement('span');
    el.className = cls;
    el.textContent = text;
    return el;
  }

  function paint(force){
    if (!lyricEl) return;
    var idx = S.idx;
    var line = (idx >= 0 && idx < S.lines.length) ? S.lines[idx] : null;
    var key = idx + '|' + (line ? (line.text || '') : '') + '|' + S.lines.length;
    if (!force && key === lyrKey) return;
    lyrKey = key;
    curLine = line;
    chSpans = []; chTimes = []; chIdx = -1;

    if (glyphEl){
      var g = line && line.text ? (line.text.replace(/\s+/g, '').charAt(0) || '') : '';
      if (g && glyphEl.textContent !== g) glyphEl.textContent = g;
    }
    if (!line || !line.text){
      /* before the first line lands (or across an instrumental gap):
         whisper the upcoming line instead of inventing anything */
      lyricEl.innerHTML = '';
      var upIdx = idx < 0 ? 0 : idx + 1;
      var up = (S.lines[upIdx] && S.lines[upIdx].text) ? S.lines[upIdx].text : '';
      if (up) lyricEl.appendChild(mkLine(cut(up, 46), 'ln next'));
      return;
    }

    var frag = document.createDocumentFragment();
    var prev = idx > 0 ? S.lines[idx - 1] : null;
    var next = idx < S.lines.length - 1 ? S.lines[idx + 1] : null;
    if (prev && prev.text) frag.appendChild(mkLine(cut(prev.text, 46), 'ln prev'));

    var cur = document.createElement('span');
    cur.className = 'ln cur';
    var txt = line.text || '';
    var lk = txt.length <= 12 ? 1 : (txt.length <= 20 ? 0.9 : (txt.length <= 30 ? 0.78 : (txt.length <= 46 ? 0.66 : 0.56)));
    if (lk !== 1) cur.style.fontSize = lk + 'em';

    if (txt.length > 160){
      cur.textContent = txt;
    } else {
      var times = lineTimes(line);
      var i, sp;
      for (i = 0; i < txt.length; i++){
        if (txt.charAt(i) === ' '){
          cur.appendChild(document.createTextNode(' '));
          continue;
        }
        sp = document.createElement('span');
        sp.className = 'ch';
        sp.textContent = txt.charAt(i);
        cur.appendChild(sp);
        chSpans.push(sp);
        /* times are kept span-aligned: spaces are not reveal targets */
        chTimes.push(times[i]);
      }
    }
    frag.appendChild(cur);
    if (next && next.text) frag.appendChild(mkLine(cut(next.text, 46), 'ln next'));
    lyricEl.innerHTML = '';
    lyricEl.appendChild(frag);
  }

  function paintChars(){
    if (!curLine || !chTimes.length || !chSpans.length) return;
    var t = S.t, n = chTimes.length, i, ci = 0, lim = Math.min(n, chSpans.length);
    for (i = 0; i < n; i++){ if (chTimes[i] <= t) ci = i + 1; else break; }
    if (ci === chIdx) return;
    chIdx = ci;
    for (i = 0; i < lim; i++){
      chSpans[i].className = i < ci - 1 ? 'ch on' : (i === ci - 1 ? 'ch hot' : 'ch');
    }
  }

  function syncEmpty(){
    var e = $('empty'), w = $('lyricWrap');
    var empty = S.lines.length === 0;
    if (e) e.style.display = empty ? 'grid' : 'none';
    if (w) w.style.display = empty ? 'none' : '';
  }

  function onTick(p){
    if (!p) return;
    if (isFinite(p.time)) S.t = +p.time;
    if (typeof p.playing === 'boolean') S.playing = p.playing;
    S.lastTickAt = performance.now();
    S.tickT = S.t;
    var i = findIdx(S.t);
    if (i !== S.idx){ S.idx = i; paint(false); }
    paintChars();
  }

  function onInit(p){
    p = p || {};
    S.song = p.song || {};
    S.duration = isFinite(p.duration) ? +p.duration : 0;
    applyPalette(p.accent);
    updateMeta();
    S.lines = normLines(p.lines);
    S.starts = S.lines.map(function(l){ return l.t; });
    S.idx = -1;
    S.t = 0;
    S.tickT = 0;
    S.lastTickAt = 0;
    S.playing = (typeof p.playing === 'boolean') ? p.playing : true;
    S.coverOk = false;
    S.coverImg = null;
    S.coverSrc = '';
    loadCover(S.song && S.song.cover);
    buildPrint('force');
    paint(true);
    syncEmpty();
  }

  var rzTimer = 0;
  window.addEventListener('resize', function(){
    if (rzTimer) return;
    rzTimer = setTimeout(function(){
      rzTimer = 0;
      printSig = '';
      buildPrint('resize');
    }, 140);
  });

  window.addEventListener('message', function(ev){
    var m = ev.data;
    if (!m || m.__c100 !== 1) return;
    if (m.type === 'init') onInit(m.payload);
    else if (m.type === 'tick') onTick(m.payload);
    else if (m.type === 'beat') onBeat(m.payload);
    else if (m.type === 'live') onLive(m.payload);
  });

  /* ---------- motion: beat chop + live breathing ---------- */
  var lastNow = 0, beatAt = -1e9, beatAmp = 0, liveLvl = 0, liveBass = 0;
  var ps = 1, pr = -2.4, ghx = 7, ghy = -6, lrot = 1.1;
  var buildTries = 0, lastBuildTry = 0;
  var wrapEl = $('lyricWrap'), dotsEl = $('dots');

  function onBeat(p){
    p = p || {};
    beatAmp = clamp(isFinite(p.level) ? +p.level : 0.6, 0, 1);
    beatAt = performance.now();
  }
  function onLive(p){
    p = p || {};
    liveLvl = clamp(isFinite(p.level) ? +p.level : 0, 0, 1);
    liveBass = clamp(isFinite(p.bass) ? +p.bass : 0, 0, 1);
  }

  function frame(now){
    var t0 = performance.now();
    S.frames++;

    if (S.playing && S.lastTickAt && isFinite(S.tickT)){
      var adv = (now - S.lastTickAt) / 1000;
      if (adv >= 0 && adv < 0.45) S.t = S.tickT + Math.min(adv, 0.26);
    }

    var i = findIdx(S.t);
    if (i !== S.idx){ S.idx = i; paint(false); }
    paintChars();

    /* layout may not have been measurable when init arrived: retry a bounded few times */
    if (!DOTS.length && buildTries < 8 && now - lastBuildTry > 350){
      buildTries++; lastBuildTry = now;
      printSig = '';
      buildPrint('force');
    }

    var since = now - beatAt;
    var b = (since >= 0 && since < 540) ? beatAmp * (1 - since / 540) : 0;
    if (S.rm) b *= 0.35;
    var breathe = S.rm ? 0 : 0.5 + 0.5 * Math.sin(now / 1100);

    var tps = 1 + b * 0.032 + liveBass * 0.010 + liveLvl * 0.004 + breathe * 0.0035;
    ps += (tps - ps) * 0.2;
    var tpr = -2.4 + b * 0.55;
    pr += (tpr - pr) * 0.2;
    var tgx = 7 + b * 8 - 3.5;
    var tgy = -6 - b * 6 + 3.5;
    ghx += (tgx - ghx) * 0.24;
    ghy += (tgy - ghy) * 0.24;

    if (posterEl){
      posterEl.style.setProperty('--ps', ps.toFixed(4));
      posterEl.style.setProperty('--pr', pr.toFixed(3) + 'deg');
      posterEl.style.setProperty('--ghx', ghx.toFixed(2) + 'px');
      posterEl.style.setProperty('--ghy', ghy.toFixed(2) + 'px');
    }
    if (wrapEl){
      var tl = 1.1 - b * 0.7;
      lrot += (tl - lrot) * 0.16;
      wrapEl.style.setProperty('--lr', lrot.toFixed(3) + 'deg');
    }
    if (dotsEl && !S.rm){
      /* ink screen drifts a hair against the paper — the classic off-register wobble */
      dotsEl.style.setProperty('--dx', (b * 2.4).toFixed(2) + 'px');
    }

    S.js = performance.now() - t0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  S.rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: +S.t.toFixed(3),
      playing: !!S.playing, frames: S.frames, js: +S.js.toFixed(3),
      err: '', text: (S.idx >= 0 && S.lines[S.idx]) ? S.lines[S.idx].text : '',
      gl: false, rm: !!S.rm
    };
  };
})();
</script>
</body>
</html>
