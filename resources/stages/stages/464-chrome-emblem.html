<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>曜铠图腾</title>
<style>
  :root{
    --accent:#8b5cf6;
    --platinum:#e9e6f5;
    --ink:#07060f;
    --lyric-dim:rgba(196,188,222,.42);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#05040b}
  body{
    font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;
    color:var(--platinum);
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;
    transform:scale(1.06);transform-origin:50% 45%}
  #emblem{position:absolute;left:50%;top:50%;width:min(66vmin,560px);height:min(66vmin,560px);
    transform:translate(-50%,-56%);z-index:2;pointer-events:none}
  #glow{position:absolute;left:50%;top:50%;width:118vmin;height:118vmin;
    transform:translate(-50%,-56%);z-index:1;pointer-events:none;
    background:radial-gradient(circle,rgba(150,105,255,.30) 0%,rgba(74,32,140,.12) 40%,rgba(0,0,0,0) 66%);
    mix-blend-mode:screen}
  #grain{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.055;
    mix-blend-mode:overlay;background-repeat:repeat;background-size:150px 150px}
  /* 顶栏微排版：世界观铭牌 */
  #plate{position:absolute;left:0;right:0;top:0;z-index:3;padding:max(4.4vh,26px) 6vw 0;
    display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none;
    opacity:.82}
  #pmark{font-size:clamp(8px,.66vw,11px);letter-spacing:.62em;text-indent:.62em;
    color:rgba(206,196,240,.62);text-transform:uppercase}
  #ptitle{font-size:clamp(12px,1.12vw,17px);letter-spacing:.3em;text-indent:.3em;
    color:#efeaff;font-weight:600;max-width:82vw;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  #pline{width:clamp(46px,7vw,104px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(210,198,255,.55),transparent)}
  .lyricWrap{position:absolute;left:0;right:0;bottom:0;z-index:5;
    padding:0 6vw max(8vh,44px);text-align:center}
  #cur{font-size:clamp(20px,3.05vw,45px);line-height:1.44;font-weight:600;
    letter-spacing:.02em;text-shadow:0 0 30px rgba(150,110,255,.5),0 2px 14px rgba(4,2,12,.9);
    min-height:1.44em;max-height:2.9em;overflow:hidden;
    word-break:break-word;line-break:anywhere}
  #cur.long{font-size:clamp(16px,2.34vw,34px);letter-spacing:0}
  #cur.xlong{font-size:clamp(14px,1.86vw,26px);letter-spacing:-.01em;line-height:1.38}
  #cur .cc{color:rgba(207,199,236,.44);display:inline-block;will-change:color}
  #cur .cc.on{color:#fff;text-shadow:0 0 22px rgba(178,140,255,.75),0 0 4px rgba(255,255,255,.5)}
  #cur .aa{display:inline-block;white-space:pre}
  #next{margin-top:.9em;font-size:clamp(11px,1.24vw,17px);opacity:.32;
    letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{font-size:clamp(13px,1.5vw,21px);opacity:.4;letter-spacing:.34em}
  @media (max-aspect-ratio:3/4){
    #emblem{width:min(84vmin,460px);height:min(84vmin,460px);top:44%;transform:translate(-50%,-50%)}
    #glow{top:44%;transform:translate(-50%,-50%)}
    .lyricWrap{padding:0 7vw max(11vh,58px)}
    #cur{font-size:clamp(19px,5.6vw,32px)}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="glow"></div>
  <div id="plate">
    <div id="pmark">KWANGYA · CORE</div>
    <div id="ptitle"></div>
    <div id="pline"></div>
  </div>
  <svg id="emblem" viewBox="-250 -250 500 500" aria-hidden="true"></svg>
  <div id="grain"></div>
  <div class="lyricWrap">
    <div id="cur"></div>
    <div id="next"></div>
  </div>
</div>
<script>
/* ---- 状态：定义在脚本最外层，__stage 直接从它算出返回值 ---- */
var S464 = {
  lines: [], idx: -1, t: 0, playing: true,
  frames: 0, js: 0, err: "", text: "", rm: false,
  accent: [139, 92, 246], gl: false, ready: false, dur: 0
};

/* 自检口：无条件、最外层赋值。不依赖 IIFE 里的任何东西。 */
window.__stage = function(){
  return {
    lines: S464.lines.length,
    idx: S464.idx,
    t: S464.t,
    playing: S464.playing,
    frames: S464.frames,
    js: S464.js,
    err: S464.err,
    text: S464.text,
    gl: S464.gl,
    rm: S464.rm
  };
};

(function(){
  "use strict";

  var S = S464;

  /* ---------- 基础工具 ---------- */
  var W = 0, H = 0;
  var $bg, $cur, $next, ctx;
  var bgT = 0, bgGrad = null;

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function num(v, d){ var n = +v; return (typeof v === 'undefined' || v === null || !isFinite(n)) ? d : n; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function resize(){
    W = Math.max(1, Math.round(window.innerWidth || 0)) || 1440;
    H = Math.max(1, Math.round(window.innerHeight || 0)) || 900;
    // 极光是柔和的，故意用低分辨率画布再由 CSS 拉满 —— 省性能且自带柔焦
    if ($bg) {
      $bg.width  = Math.round(clamp(W * 0.34, 160, 640));
      $bg.height = Math.round(clamp(H * 0.34, 100, 420));
    }
    bgGrad = null;
    drawBg();
  }

  /* ---------- 极光 / 黑曜石底子（离屏预渲染，低频更新） ---------- */
  function buildGrad(){
    if (!$bg) return;
    var g = ctx.createLinearGradient(0, 0, $bg.width, $bg.height);
    var a = S.accent;
    g.addColorStop(0, '#06040f');
    g.addColorStop(0.45, 'rgb(' + Math.round(a[0]*0.16) + ',' + Math.round(a[1]*0.10) + ',' + Math.round(a[2]*0.24+26) + ')');
    g.addColorStop(1, '#04030a');
    bgGrad = g;
  }

  function drawBg(){
    if (!ctx || !$bg) return;
    if (!$bg.width || !$bg.height) return;
    if (!bgGrad) buildGrad();
    var w = $bg.width, h = $bg.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = bgGrad || '#06040f';
    ctx.fillRect(0, 0, w, h);

    // 流体极光：几团柔和径向渐变，缓慢漂移
    var a = S.accent;
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 4; i++){
      var ph = bgT * 0.00016 + i * 1.7;
      var x = w * (0.5 + Math.cos(ph) * (0.30 + i * 0.045));
      var y = h * (0.42 + Math.sin(ph * 1.31 + i) * (0.26 + i * 0.03));
      var r = Math.max(60, Math.min(w, h) * (0.42 + i * 0.09));
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      var amt = 0.10 + 0.05 * Math.sin(ph * 2.1);
      g.addColorStop(0, 'rgba(' + a[0] + ',' + a[1] + ',' + Math.min(255, a[2] + 70) + ',' + amt.toFixed(3) + ')');
      g.addColorStop(0.5, 'rgba(' + Math.round(a[0]*0.6) + ',' + Math.round(a[1]*0.4) + ',255,' + (amt*0.35).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 徽章（SVG，一次构建，后续只改变换/呼吸） ---------- */
  var $emblem;
  function buildEmblem(){
    if (!$emblem) return;
    var parts = [];
    var uid = 'g464';
    parts.push(
      '<defs>' +
      '<linearGradient id="' + uid + 'pt" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#ffffff"/><stop offset=".22" stop-color="#cfd2ee"/>' +
        '<stop offset=".46" stop-color="#8f93c4"/><stop offset=".55" stop-color="#f4f2ff"/>' +
        '<stop offset=".78" stop-color="#9297c9"/><stop offset="1" stop-color="#5d5f8e"/>' +
      '</linearGradient>' +
      '<linearGradient id="' + uid + 'vi" x1=".2" y1="0" x2=".8" y2="1">' +
        '<stop offset="0" stop-color="#c8a6ff"/><stop offset=".5" stop-color="#7b3ff2"/>' +
        '<stop offset="1" stop-color="#3a1670"/>' +
      '</linearGradient>' +
      '<radialGradient id="' + uid + 'cr" cx=".38" cy=".3" r=".78">' +
        '<stop offset="0" stop-color="#f6f4ff"/><stop offset=".4" stop-color="#b9b6e6"/>' +
        '<stop offset=".72" stop-color="#6a6a9c"/><stop offset="1" stop-color="#2c2b4a"/>' +
      '</radialGradient>' +
      '<linearGradient id="' + uid + 'sheenG" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0" stop-color="rgba(255,255,255,0)"/>' +
        '<stop offset=".45" stop-color="rgba(255,255,255,.02)"/>' +
        '<stop offset=".52" stop-color="rgba(255,255,255,.95)"/>' +
        '<stop offset=".6" stop-color="rgba(214,198,255,.28)"/>' +
        '<stop offset="1" stop-color="rgba(255,255,255,0)"/>' +
      '</linearGradient>' +
      '</defs>'
    );
    // 外环：机械骨骼齿轮
    var teeth = 24;
    parts.push('<g id="emRing">');
    parts.push('<circle r="228" fill="none" stroke="url(#' + uid + 'pt)" stroke-width="1.6" opacity=".55"/>');
    for (var i = 0; i < teeth; i++){
      var a = i / teeth * Math.PI * 2;
      var deg = a * 180 / Math.PI;
      var long = (i % 3 === 0) ? 26 : 13;
      parts.push('<rect x="-3.4" y="-236" width="6.8" height="' + long + '" rx="1.6" fill="url(#' + uid + 'pt)" opacity="' + (i % 3 === 0 ? '.85' : '.5') + '" transform="rotate(' + deg.toFixed(2) + ')"/>');
    }
    parts.push('</g>');
    // 环带上的刻线
    parts.push('<g id="emTick" opacity=".45">');
    for (var k = 0; k < 72; k++){
      var a2 = k / 72 * Math.PI * 2;
      parts.push('<rect x="-.7" y="-214" width="1.4" height="' + (k % 6 === 0 ? 11 : 5) + '" fill="#cfc9f2" transform="rotate(' + (a2 * 180 / Math.PI).toFixed(2) + ')"/>');
    }
    parts.push('</g>');
    // 内环
    parts.push('<circle r="192" fill="none" stroke="#8d86c4" stroke-width=".9" opacity=".5"/>');
    parts.push('<circle r="176" fill="none" stroke="url(#' + uid + 'vi)" stroke-width="2.4" opacity=".9"/>');
    // 金属掠光弧（缓慢自转，制造"镜面金属"错觉）
    parts.push('<g id="emSheen"><circle r="205" fill="none" stroke="url(#' + uid + 'sheenG)" stroke-width="3.2" ' +
      'stroke-dasharray="146 1142" opacity=".85"/></g>');
    parts.push('<g id="emSheen2"><circle r="182" fill="none" stroke="url(#' + uid + 'sheenG)" stroke-width="1.6" ' +
      'stroke-dasharray="74 1070" opacity=".6"/></g>');

    // 中央：液态铂金徽记（六芒星 + 水晶心 + 蛇形荆棘）
    parts.push('<g id="emCore">');
    parts.push('<circle r="150" fill="url(#' + uid + 'cr)" opacity=".16"/>');
    // 荆棘毒蛇：两条螺旋盘绕
    var snake = 'M 0,-158 C 62,-140 96,-84 66,-34 C 40,10 -34,4 -46,-38 C -58,-82 -10,-116 34,-100 C 70,-86 66,-38 30,-22';
    parts.push('<path d="' + snake + '" fill="none" stroke="url(#' + uid + 'vi)" stroke-width="9" stroke-linecap="round" opacity=".92"/>');
    parts.push('<path d="' + snake + '" fill="none" stroke="#e6d9ff" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>');
    // 六芒星金属骨架
    parts.push('<g stroke="url(#' + uid + 'pt)" fill="none" stroke-width="7" stroke-linejoin="round" opacity=".95">');
    parts.push('<path d="M0,-138 L119,69 L-119,69 Z"/>');
    parts.push('<path d="M0,138 L-119,-69 L119,-69 Z"/>');
    parts.push('</g>');
    parts.push('<g stroke="#ffffff" fill="none" stroke-width="1.3" opacity=".5">');
    parts.push('<path d="M0,-138 L119,69 L-119,69 Z"/>');
    parts.push('<path d="M0,138 L-119,-69 L119,-69 Z"/>');
    parts.push('</g>');
    // 水晶心
    parts.push('<g id="emGem">');
    parts.push('<path d="M0,-46 L34,0 L0,50 L-34,0 Z" fill="url(#' + uid + 'vi)"/>');
    parts.push('<path d="M0,-46 L34,0 L0,50 L-34,0 Z" fill="none" stroke="#f0e8ff" stroke-width="1.5" opacity=".8"/>');
    parts.push('<path d="M0,-46 L0,50" stroke="#ffffff" stroke-width=".9" opacity=".45"/>');
    parts.push('</g>');
    parts.push('</g>');

    // 荆棘藤蔓：从环上向外刺出的机械棘刺（两层，营造 3D 厚度）
    parts.push('<g id="emVine" opacity=".9">');
    for (var v = 0; v < 10; v++){
      var av = v / 10 * 360 + 9;
      var len = (v % 2 === 0) ? 92 : 56;
      parts.push('<g transform="rotate(' + av.toFixed(1) + ')">' +
        '<path d="M0,-232 C 16,-262 26,-' + (232 + len * 0.55).toFixed(0) + ' 6,-' + (232 + len).toFixed(0) + '" ' +
        'fill="none" stroke="url(#' + uid + 'pt)" stroke-width="' + (v % 2 === 0 ? 3.4 : 2.2) + '" stroke-linecap="round"/>' +
        '<path d="M0,-232 C 16,-262 26,-' + (232 + len * 0.55).toFixed(0) + ' 6,-' + (232 + len).toFixed(0) + '" ' +
        'fill="none" stroke="rgba(240,232,255,.55)" stroke-width=".8" stroke-linecap="round"/>' +
        '<circle cx="6" cy="-' + (232 + len).toFixed(0) + '" r="' + (v % 2 === 0 ? 4.2 : 2.8) + '" fill="url(#' + uid + 'vi)"/>' +
        '</g>');
    }
    parts.push('</g>');

    // 鼓点脉冲环：随 beat 放大淡出的三道细环（预先建好，只改属性）
    parts.push('<g id="emPulse" opacity="0">' +
      '<circle r="180" fill="none" stroke="rgba(200,180,255,.85)" stroke-width="1.6"/>' +
      '<circle r="196" fill="none" stroke="rgba(160,120,255,.6)" stroke-width="1"/>' +
      '</g>');

    // 前后两层光晕
    parts.push('<circle r="236" fill="none" stroke="rgba(255,255,255,.10)" stroke-width=".8"/>');

    $emblem.innerHTML = parts.join('');
    // 金属掠光：一圈会缓慢转动的镜面高光弧
    var sh = document.getElementById('emSheen');
    if (sh) sh.setAttribute('stroke', 'url(#' + uid + 'sheenG)');
  }

  /* ---------- 歌词 ---------- */
  var curChars = [];   // [{el, t}]
  var curT0 = 0, curDur = 0, curIdxShown = -2;

  function buildLine(idx){
    var ln = S.lines[idx];
    // 前奏阶段（还没到第一句）预先把首句调暗铺出来，避免大面积空白
    if (!ln && idx < 0 && S.lines.length) ln = S.lines[0];
    if (!$cur) return;
    curChars = [];
    if (!ln){ $cur.innerHTML = ''; $cur.className = ''; return; }
    var text = String(ln.text == null ? '' : ln.text);
    // 长句缩档，保证不溢出
    var L = text.length;
    $cur.className = L > 46 ? 'xlong' : (L > 26 ? 'long' : '');
    var chars = ln.chars;
    var frag = document.createDocumentFragment();
    if (chars && chars.length){
      var n = Math.min(chars.length, 240);
      for (var i = 0; i < n; i++){
        var c = chars[i] && chars[i].c != null ? String(chars[i].c) : '';
        if (!c) continue;
        var sp = document.createElement('span');
        sp.className = 'cc';
        sp.textContent = c;
        if (/\s/.test(c)) sp.className = 'aa';
        frag.appendChild(sp);
        curChars.push({ el: sp, t: num(chars[i].t, ln.t) });
      }
    } else {
      // LRC：按句长均分（固定次数上限）
      var m = Math.min(text.length, 240);
      var t0 = num(ln.t, 0), d = Math.max(0.4, num(ln.dur, Math.min(6, text.length * 0.22)));
      for (var j = 0; j < m; j++){
        var ch = text.charAt(j);
        var sp2 = document.createElement('span');
        sp2.className = /\s/.test(ch) ? 'aa' : 'cc';
        sp2.textContent = ch;
        frag.appendChild(sp2);
        curChars.push({ el: sp2, t: t0 + d * (j / Math.max(1, m)) });
      }
    }
    $cur.innerHTML = '';
    $cur.appendChild(frag);
  }

  function updateLyric(){
    var idx = S.idx;
    if (idx !== curIdxShown){
      curIdxShown = idx;
      buildLine(idx);
      var ln0 = S.lines[idx] || (idx < 0 ? S.lines[0] : null);
      S.text = ln0 && ln0.text != null ? String(ln0.text) : '';
    }
    // 逐字点亮
    var t = S.t, i;
    for (i = 0; i < curChars.length; i++){
      var on = t >= curChars[i].t;
      var el = curChars[i].el;
      if (on){
        if (!el._on){ el._on = 1; el.classList.add('on'); }
      } else if (el._on){
        el._on = 0; el.classList.remove('on');
      }
    }
    if ($next){
      var nx = S.lines[idx + 1];
      $next.textContent = nx && nx.text ? String(nx.text) : '';
    }
  }

  function setEmpty(msg){
    if ($cur){ $cur.innerHTML = '<span class="empty">' + esc(msg) + '</span>'; }
    if ($next) $next.textContent = '';
    curChars = []; curIdxShown = -1;
  }

  function findIdx(t){
    var L = S.lines, lo = 0, hi = L.length - 1, r = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (num(L[mid].t, 0) <= t){ r = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return r;
  }

  function applyTick(t, playing){
    S.t = num(t, S.t);
    if (typeof playing === 'boolean') S.playing = playing;
    if (!S.lines.length){ S.idx = -1; return; }
    S.idx = findIdx(S.t);
  }

  /* ---------- 颗粒（程序化生成，一次绘制到底图） ---------- */
  function buildGrain(){
    var g = document.getElementById('grain');
    if (!g) return;
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 150;
      var cx = c.getContext('2d');
      if (!cx) return;
      var img = cx.createImageData(150, 150);
      var d = img.data;
      for (var i = 0; i < d.length; i += 4){
        var v = (Math.random() * 255) | 0;
        d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
      }
      cx.putImageData(img, 0, 0);
      g.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
    } catch(e){ console.error('[464] grain failed', e); }
  }

  /* ---------- 主循环 ---------- */
  var last = 0, needBg = true;
  var $ring, $tick, $gem, $core, $glowEl, $sheen, $sheen2, $plateTitle, $pulse;
  var ringAng = 0, tickAng = 0, gemPulse = 0, beatHit = 0, beatLevel = 0;
  var LIVE = { level: 0, bass: 0 };

  function frame(now){
    S.frames++;
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    if (!S.ready){
      S.ready = true;
      try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){ console.error('[464] ready post failed', e); }
    }
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;

    try {
      if (needBg){ needBg = false; resize(); }
      bgT += dt * 1000;
      // 极光低频重绘（约 12fps 足够，柔和渐变看不出跳帧）
      if ((S.frames & 7) === 0) drawBg();

      // 徽章动效：衰减 + 旋转
      beatLevel *= Math.pow(0.06, dt);
      beatHit *= Math.pow(0.02, dt);
      gemPulse += (beatLevel - gemPulse) * Math.min(1, dt * 12);
      var spin = S.rm ? 0.12 : 1;
      ringAng += dt * 7 * spin;
      tickAng -= dt * 13 * spin;
      if ($ring) $ring.setAttribute('transform', 'rotate(' + ringAng.toFixed(2) + ')');
      if ($tick) $tick.setAttribute('transform', 'rotate(' + tickAng.toFixed(2) + ')');
      if ($sheen) $sheen.setAttribute('transform', 'rotate(' + (ringAng * 2.2).toFixed(2) + ')');
      if ($sheen2) $sheen2.setAttribute('transform', 'rotate(' + (-tickAng * 1.5).toFixed(2) + ')');
      if ($gem) $gem.setAttribute('transform', 'translate(0,' + (-beatHit * 3).toFixed(2) + ') scale(' + (1 + gemPulse * 0.14).toFixed(3) + ')');
      if ($core) $core.setAttribute('opacity', (0.86 + gemPulse * 0.14).toFixed(3));
      if ($pulse){
        var pr = 180 + beatHit * 54;
        $pulse.setAttribute('transform', 'scale(' + (pr / 180).toFixed(3) + ')');
        $pulse.setAttribute('opacity', (beatHit * 0.75).toFixed(3));
      }
      if ($glowEl) $glowEl.style.opacity = (0.55 + gemPulse * 0.45 + (LIVE.level * 0.2)).toFixed(3);

      updateLyric();
    } catch(err){
      S.err = String(err && err.message || err);
      console.error('[464] frame error', err);
    }
    S.js = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
    requestAnimationFrame(frame);
  }

  /* ---------- 消息 ---------- */
  function onMsg(ev){
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init'){
        var p = d.payload || {};
        var a = p.accent;
        if (a && a.length >= 3 && isFinite(a[0])){
          S.accent = [clamp(+a[0]|0, 0, 255), clamp(+a[1]|0, 0, 255), clamp(+a[2]|0, 0, 255)];
          var root = document.documentElement.style;
          root.setProperty('--accent', 'rgb(' + S.accent.join(',') + ')');
          bgGrad = null; needBg = true;
        }
        S.dur = num(p.duration, 0);
        // 顶栏铭牌：歌名 / 艺人（脏数据都能接）
        if ($plateTitle){
          var sg = p.song || {};
          var nm = (sg.name == null ? '' : String(sg.name)).trim();
          var ar = sg.artists;
          if (Array.isArray(ar)) ar = ar.filter(function(x){ return x != null && String(x).trim(); }).join(' / ');
          ar = (ar == null ? '' : String(ar)).trim();
          var line2 = nm || ar || '';
          if (nm && ar) line2 = nm + '  ·  ' + ar;
          $plateTitle.textContent = line2.slice(0, 64);
          $plateTitle.style.display = line2 ? '' : 'none';
        }
        S.lines = (p.lines || []).filter(function(l){ return l && typeof l === 'object'; });
        S.idx = S.lines.length ? findIdx(S.t) : -1;
        curIdxShown = -2;
        if (!S.lines.length){ setEmpty('·  无 词  ·'); }
        else { updateLyric(); }
        S.playing = (p.playing === undefined) ? true : !!p.playing;
      } else if (d.type === 'tick'){
        var q = d.payload || {};
        applyTick(q.time, q.playing);
        updateLyric();
      } else if (d.type === 'beat'){
        var b = d.payload || {};
        beatLevel = Math.max(beatLevel, clamp(num(b.level, 0.5), 0, 1));
        beatHit = 1;
      } else if (d.type === 'live'){
        var lv = d.payload || {};
        LIVE.level = clamp(num(lv.level, 0), 0, 1);
        LIVE.bass = clamp(num(lv.bass, 0), 0, 1);
        if (lv.playing === false) LIVE.level = 0;
      }
    } catch(err){
      S.err = String(err && err.message || err);
      console.error('[464] message error', err);
    }
  }

  /* ---------- 启动 ---------- */
  function boot(){
    $bg = document.getElementById('bg');
    $cur = document.getElementById('cur');
    $next = document.getElementById('next');
    $emblem = document.getElementById('emblem');
    $glowEl = document.getElementById('glow');
    if ($bg && $bg.getContext) {
      ctx = $bg.getContext('2d', {alpha: false});
    }
    S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    resize();
    buildEmblem();
    $ring = document.getElementById('emRing');
    $tick = document.getElementById('emTick');
    $gem  = document.getElementById('emGem');
    $core = document.getElementById('emCore');
    $sheen  = document.getElementById('emSheen');
    $sheen2 = document.getElementById('emSheen2');
    $pulse  = document.getElementById('emPulse');
    $plateTitle = document.getElementById('ptitle');
    buildGrain();
    if (!S.lines.length) setEmpty('·  无 词  ·');
    try { window.addEventListener('resize', resize); } catch(e){ console.error(e); }
    window.addEventListener('message', onMsg);
    requestAnimationFrame(frame);
    setTimeout(function(){ if (!S.ready){ S.ready = true; try{ parent.postMessage({__c100:1, type:'ready'}, '*'); }catch(e){ console.error(e); } } }, 900);
  }

  boot();
})();
</script>
