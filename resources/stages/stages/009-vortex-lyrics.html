<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>形态演化歌词</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(180,195,255,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   009 · 形态演化歌词 —— 粒子沿**螺旋**迁徙
   和 005（粒子文字）的区别：
     · 005 是粒子沿**直线**滑到新字形，全程在字上，是"原地重构"
     · 这里粒子平时住在一个缓慢自转的**涡环**上，要成字时沿**对数螺线**盘旋进去，
       唱完再盘旋出来。所以中间过程是旋涡状的，不是直来直去。
   极坐标插值（半径 + 角度分开走，角度多转几圈）就是这个形态的全部。
   ========================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

const N = 4400;
/* 极坐标状态：r 半径 / a 角度。目标同样用极坐标，插值时角度多绕几圈 = 螺旋。 */
const pr = new Float32Array(N), pa = new Float32Array(N);
const r0 = new Float32Array(N), a0 = new Float32Array(N);   // 起点
const r1 = new Float32Array(N), a1 = new Float32Array(N);   // 终点
const spin = new Float32Array(N);                            // 每颗粒子多绕的圈数
const jit = new Float32Array(N);
let morph = 1;                                               // 0→1 迁徙进度
let cx = 0, cy = 0;                                          // 涡心

function seedRing() {
  cx = W / 2; cy = H / 2;
  const R = Math.min(W, H) * 0.42;
  for (let i = 0; i < N; i++) {
    // 初始：住在涡环上，半径和角度都随机
    const t = Math.random() * 6.2832;
    pr[i] = r0[i] = r1[i] = R * (0.55 + Math.random() * 0.75);
    pa[i] = a0[i] = a1[i] = t;
    spin[i] = 0;
    jit[i] = Math.random() * 6.2832;
  }
  morph = 1;
}
seedRing();
addEventListener('resize', () => { const m = morph; seedRing(); morph = m; });

const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });
function glyphPoints(text) {
  const F = 92;
  const maxW = Math.min(W * 0.7, 1200);
  octx.font = `800 ${F}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  let w = Math.ceil(octx.measureText(text).width) + 8;
  const fs = w > maxW ? F * (maxW / w) : F;
  octx.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  w = Math.ceil(octx.measureText(text).width) + 8;
  const h = Math.ceil(fs * 1.35);
  off.width = w; off.height = h;
  octx.clearRect(0, 0, w, h);
  octx.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(text, w / 2, h / 2);
  const d = octx.getImageData(0, 0, w, h).data;
  const pts = [];
  // 步长必须 ≤ 粒子直径，否则笔画是点阵不是实心（1-5 的教训）
  const step = 2;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      if (d[(y * w + x) * 4 + 3] > 128) pts.push(x - w / 2, y - h / 2);
    }
  }
  return { pts, w, h };
}

/* 归一化锚点 + 重映射（不用夹取 —— 1-5 的教训） */
const anchors = [];
for (let i = 0; i < 96; i++) {
  const g = i * 2.399963;
  const rr = 0.30 + 0.70 * (((i * 37) % 97) / 97);
  anchors.push({ nx: Math.cos(g) * rr, ny: Math.sin(g) * rr * 0.66 });
}
function placeAnchor(a, hw, hh, gcx, gcy) {
  const M = 60;
  const x0 = M + hw - gcx, x1 = W - M - hw - gcx;
  const y0 = M + hh - gcy, y1 = H - M - hh - gcy;
  return {
    x: x1 > x0 ? x0 + (a.nx * 0.5 + 0.5) * (x1 - x0) : W / 2 - gcx,
    y: y1 > y0 ? y0 + (a.ny * 0.5 + 0.5) * (y1 - y0) : H / 2 - gcy,
  };
}

/** 目标换成极坐标。角度取"离当前角最近的那一圈"再额外多绕 spin 圈。 */
function retarget(idx) {
  if (idx < 0 || !lines[idx]) return;
  const { pts } = glyphPoints(lines[idx].text);
  const pc = pts.length / 2;
  if (!pc) return;
  let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
  for (let k = 0; k < pts.length; k += 2) {
    if (pts[k] < bx0) bx0 = pts[k]; if (pts[k] > bx1) bx1 = pts[k];
    if (pts[k + 1] < by0) by0 = pts[k + 1]; if (pts[k + 1] > by1) by1 = pts[k + 1];
  }
  /* 位置**固定居中**，不做随机散布 ——
     这个形态的主角是"螺旋迁徙"，位置再乱动的话观众跟不上。
     居中之后每句都在同一处成形，形变本身才看得清。 */
  cx = W / 2 - (bx0 + bx1) / 2;
  cy = H / 2 - (by0 + by1) / 2;
  for (let i = 0; i < N; i++) {
    // 起点 = 此刻的真实极坐标（不是上一句的目标 —— 中途换句才不会跳）
    r0[i] = pr[i]; a0[i] = pa[i];
    // 终点：等间隔取样铺满整个字（按扫描顺序取只会用到上面一部分行，字会被压扁）
    const p = (Math.floor(i * pc / N) % pc) * 2;
    const dx = pts[p], dy = pts[p + 1];
    r1[i] = Math.sqrt(dx * dx + dy * dy);
    let ta = Math.atan2(dy, dx);
    // 取最近的一圈
    let diff = ta - a0[i];
    while (diff > Math.PI) diff -= 6.2832;
    while (diff < -Math.PI) diff += 6.2832;
    /* 再多绕几圈 —— 这就是"盘旋进去"的来源。
       ⚠ 必须是**整数圈**：写成 0.6~1.6 圈时，多转的 216°~576° 会留在最终角度上，
       每颗粒子各偏一个随机角度，合起来正好糊成一个圆环（009 一开始就是这样，
       极角分布实测是均匀的：501,556,605,576,580,557,530,495）。
       取 1/2/3 整圈，模 2π 之后仍精确落在目标角上。 */
    spin[i] = (1 + (i % 3)) * 6.2832;
    a1[i] = a0[i] + diff + spin[i] * (Math.random() < 0.5 ? 1 : -1);
  }
  morph = 0;
}

let lines = [];
let accent = [180, 195, 255];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ============ 节奏：显示与酝酿分离 / 单调不回退 / 提前量自适应 ============ */
let curIdx = -1, brewIdx = -1, lastT = -1;
const LEAD = 0.6;                          // 迁徙 0.5 秒，提前量 0.6 秒就够
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) { curIdx = -1; brewIdx = -1; morph = 1; }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) { curIdx = ci; brewIdx = -1; if (ci >= 0) retarget(ci); hint.style.opacity = lines.length ? (ci >= 0 ? '0' : '1') : '0.5'; }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.4, gap * 0.5));
    if (T >= lines[nx].t - lead) brewIdx = nx;   // 只标记，真正的迁徙在句首开始
  }
}

const hint = document.getElementById('hint');
let last = performance.now();
let t0 = 0;
const easeInOut = (q) => (q < 0.5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2);

function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();

  timing(T);
  if (morph < 1) morph = Math.min(1, morph + dt / 0.5);   // 0.5 秒成形（原来 1.1 秒，字还没看清就换句了）

  /* ---- 极坐标插值：半径走缓动，角度走"缓动 + 多绕的圈" ---- */
  const e = easeInOut(morph);
  const [ar, ag, ab] = accent;

  ctx.fillStyle = 'rgba(5,6,10,0.24)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // 迁徙中：拖尾合成一条路径一次描边（逐颗 stroke 是 4400 次调用，会掉帧）
  if (morph < 1) {
    ctx.strokeStyle = `rgba(${Math.min(255, ar + 45)},${Math.min(255, ag + 40)},${Math.min(255, ab + 30)},0.34)`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const rr = r0[i] + (r1[i] - r0[i]) * e;
      /* 自转项乘 (1-e)：迁徙中整环在转，成形后归零 ——
       不乘的话字一成形就被一直转走（曾经 009 的"字变成圆环"就是这个）。 */
    const aa = a0[i] + (a1[i] - a0[i]) * e + t0 * 0.10 * (1 - e);
      const x = cx + Math.cos(aa) * rr, y = cy + Math.sin(aa) * rr;
      // 尾迹取"更早一点的角度"，方向自然沿着螺旋
      const a2 = aa - 0.05;
      const x2 = cx + Math.cos(a2) * rr, y2 = cy + Math.sin(a2) * rr;
      ctx.moveTo(x2, y2);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  ctx.fillStyle = `rgba(${Math.min(255, ar + 80)},${Math.min(255, ag + 75)},${Math.min(255, ab + 45)},0.95)`;
  for (let i = 0; i < N; i++) {
    const rr = r0[i] + (r1[i] - r0[i]) * e;
    // 静止时整环还在缓慢自转（0.10 rad/s），所以永远不是死画面
    /* 自转项乘 (1-e)：迁徙中整环在转，成形后归零 ——
       不乘的话字一成形就被一直转走（曾经 009 的"字变成圆环"就是这个）。 */
    const aa = a0[i] + (a1[i] - a0[i]) * e + t0 * 0.10 * (1 - e);
    const jr = rr + Math.sin(t0 * 1.6 + jit[i]) * 1.2;
    const x = cx + Math.cos(aa) * jr, y = cy + Math.sin(aa) * jr;
    // 回写真实极坐标：retarget 的"起点"必须是此刻位置，否则中途换句会跳
    pr[i] = jr; pa[i] = aa;
    if (x < -12 || x > W + 12 || y < -12 || y > H + 12) continue;
    ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1;
    seedRing();
    if (p.accent) accent = p.accent;
    clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 踩拍：整环被"推"一下 —— 所有粒子沿半径向外扩，是相干动作。
       1-5 的教训：逐颗随机方向踢会让字乱窜，而且全部触发拖尾。 */
    const lv = 0.5 + (d.payload.level || 0);
    for (let i = 0; i < N; i++) r0[i] += 5 * lv;
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
window.__stage = () => {
  // 按渲染公式算一遍包围盒：横排文字的宽高比应该 ≈ 8，
  // 接近 1 就说明落点散成了圆环（009 踩过这个坑）
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const e2 = easeInOut(morph);
  for (let i = 0; i < N; i++) {
    const rr = r0[i] + (r1[i] - r0[i]) * e2;
    const aa = a0[i] + (a1[i] - a0[i]) * e2 + t0 * 0.10 * (1 - e2);
    const x = cx + Math.cos(aa) * rr, y = cy + Math.sin(aa) * rr;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const w = Math.round(x1 - x0), hh = Math.round(y1 - y0);
  return {
    lines: lines.length, curIdx, brewIdx, morph: +morph.toFixed(2),
    box: w + 'x' + hh, ratio: +(w / Math.max(1, hh)).toFixed(1),
    t: +now().toFixed(2),
  };
};
</script>
</body>
</html>
