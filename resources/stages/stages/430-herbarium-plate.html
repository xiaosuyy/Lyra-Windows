<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>压花帖 · Herbarium</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e0cf}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
    color:#2b2119;-webkit-font-smoothing:antialiased;
  }
  #paper,#art{position:fixed;inset:0;width:100%;height:100%}
  #paper{background-color:#efe7d6;background-size:cover;background-position:center}
  #paper::after{content:"";position:absolute;inset:0;background:radial-gradient(115% 95% at 50% 42%,rgba(255,252,242,.30) 0%,rgba(255,252,242,0) 46%,rgba(104,80,48,.20) 100%)}
  #art{z-index:1}
  #frame{position:fixed;inset:clamp(10px,2.2vmin,26px);border:1px solid rgba(84,64,42,.26);z-index:2;pointer-events:none}
  #lyrics{position:fixed;z-index:3;left:50%;right:7%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.8vh,20px);pointer-events:none}
  #lyrics .side{font-size:clamp(12px,1.35vw,20px);line-height:1.6;color:#7c6850;opacity:.72;min-height:1.6em}
  #lyrics .main{font-size:clamp(21px,3.05vw,50px);line-height:1.52;letter-spacing:.012em;font-weight:500;overflow-wrap:break-word;word-break:break-word;max-height:62vh;overflow:hidden;text-shadow:0 1px 0 rgba(255,252,242,.55)}
  #idle{font-size:clamp(11px,1.05vw,15px);letter-spacing:.52em;color:#8a7458;font-style:italic;opacity:0;transition:opacity .5s ease;line-height:1.6}
  #lyrics .main.long{font-size:clamp(18px,2.35vw,38px);line-height:1.46}
  #lyrics .main.xlong{font-size:clamp(15px,1.85vw,29px);line-height:1.42}
  #lyrics .main.idle{opacity:.42;font-style:italic}
  #lyrics .main .ch{color:#6f5b45;opacity:.5;transition:color .26s ease,opacity .26s ease}
  #lyrics .main .ch.on{color:#251b13;opacity:1}
  #empty{position:fixed;z-index:3;left:0;right:0;bottom:16%;text-align:center;font-style:italic;color:#7c6850;font-size:clamp(13px,1.5vw,20px);letter-spacing:.3em;opacity:.85}
  #plate{position:fixed;z-index:3;left:clamp(18px,4vw,64px);bottom:clamp(18px,4vh,52px);font-size:clamp(9px,1vw,13px);letter-spacing:.34em;color:#6b563e;opacity:.8}
  #head{position:fixed;z-index:3;left:clamp(18px,4vw,64px);top:clamp(14px,3vh,40px);font-size:clamp(8px,.92vw,12px);letter-spacing:.42em;color:#7a6449;opacity:.78}
  #head .rule{display:block;width:clamp(120px,17vw,240px);height:3px;margin-top:.55em;border-top:1px solid rgba(84,64,42,.34);border-bottom:1px solid rgba(84,64,42,.18)}
  #label{position:fixed;z-index:3;right:clamp(18px,4vw,64px);bottom:clamp(18px,4vh,52px);text-align:right;max-width:38vw}
  #label .lat{font-style:italic;font-size:clamp(11px,1.25vw,17px);color:#4c3a28;letter-spacing:.06em}
  #label .song{margin-top:.5em;font-size:clamp(9px,.95vw,12px);letter-spacing:.2em;color:#755f47;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-aspect-ratio:4/5){
    #lyrics{left:7%;right:7%;top:auto;bottom:7vh;justify-content:flex-end}
    #plate{display:none}
    #label{left:7%;right:7%;text-align:left;max-width:none;bottom:auto;top:clamp(16px,3vh,30px)}
  }
</style>
</head>
<body>
<div id="paper"></div>
<canvas id="art"></canvas>
<div id="frame"></div>
<div id="lyrics">
  <div class="side" id="prev"></div>
  <div id="idle">曲未尽 &nbsp;·&nbsp; 叶先动</div>
  <div class="main" id="cur"></div>
  <div class="side" id="next"></div>
</div>
<div id="empty" hidden>无一字 &nbsp;·&nbsp; 只留叶脉</div>
<div id="plate">HERBARIUM &nbsp;·&nbsp; PL. CCCCXXX</div>
<div id="head">FOLIA &amp; SPORAE<span class="rule"></span></div>
<div id="label"><div class="lat" id="lat">Polypodium vulgare L.</div><div class="song" id="song"></div></div>
<script>
(function(){
'use strict';

var dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
var W = 1440, H = 900;

var canvas = document.getElementById('art');
var ctx = canvas.getContext('2d');
var paperEl = document.getElementById('paper');
var prevEl = document.getElementById('prev');
var curEl = document.getElementById('cur');
var nextEl = document.getElementById('next');
var emptyEl = document.getElementById('empty');
var latEl = document.getElementById('lat');
var songEl = document.getElementById('song');

var lines = [], idx = -1, t = 0, playing = true, frames = 0, jsMs = 0, errMsg = '', curText = '';
var duration = 0, accent = [139, 62, 44], songName = '', songArtist = '';
var reduced = false;
try { reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }

/* window.__stage 必须在脚本最外层无条件赋值 */
window.__stage = function(){
  return {
    lines: lines.length, idx: idx, t: t, playing: !!playing, frames: frames,
    js: jsMs, err: errMsg, text: curText, gl: false, rm: reduced
  };
};

function num(v, d){
  var n = Number(v);
  return isFinite(n) ? n : d;
}
function safeText(v){
  return (v === null || v === undefined) ? '' : String(v);
}

/* ---------- 歌词数据 ---------- */
function normalize(raw){
  var out = [];
  if (!Array.isArray(raw)) return out;
  var n = Math.min(raw.length, 4000);
  for (var i = 0; i < n; i++){
    var o = raw[i] || {};
    var text = (o.text === null || o.text === undefined) ? '' : String(o.text);
    var chars = Array.isArray(o.chars) ? o.chars : null;
    if (!text && chars){
      var buf = [];
      for (var k = 0; k < chars.length && k < 2000; k++){
        var c = chars[k];
        if (c && c.c !== null && c.c !== undefined) buf.push(String(c.c));
      }
      text = buf.join('');
    }
    var tt = Number(o.t);
    if (!isFinite(tt)) tt = i * 4;
    var dd = Number(o.dur);
    if (!isFinite(dd) || dd < 0) dd = 0;
    out.push({ t: tt, dur: dd, text: text, chars: chars });
  }
  out.sort(function(a, b){ return a.t - b.t; });
  return out;
}

function charPack(L){
  var cps = Array.from(L.text || '');
  var n = cps.length;
  var times = new Array(n);
  var start = L.t;
  var end = L.t + (L.dur > 0 ? L.dur : Math.max(1.4, n * 0.26));
  var ok = !!(L.chars && L.chars.length === n);
  for (var i = 0; i < n; i++){
    var ct = ok ? Number(L.chars[i] && L.chars[i].t) : NaN;
    times[i] = isFinite(ct) ? Math.max(start, ct) : start + (end - start) * (n > 1 ? i / n : 0);
  }
  return { cps: cps, times: times, end: end };
}

/* ---------- 歌词渲染 ---------- */
var curSpans = [], spanState = [], pack = null, idxDirty = true, lineIn = 0;
var idleEl = document.getElementById('idle');

function buildCurrent(){
  curEl.innerHTML = '';
  curSpans = []; spanState = []; pack = null;
  if (!lines.length){
    curText = '';
    emptyEl.hidden = false;
    prevEl.textContent = '';
    nextEl.textContent = '';
    curEl.className = 'main';
    return;
  }
  emptyEl.hidden = true;
  if (idx < 0){
    curText = lines[0] ? lines[0].text : '';
    curEl.className = 'main idle';
    curEl.textContent = '';
    prevEl.textContent = '';
    nextEl.textContent = lines[0] ? (lines[0].text || '') : '';
    return;
  }
  var L = lines[idx];
  curText = L.text || '';
  pack = charPack(L);
  curEl.className = 'main' + (pack.cps.length > 40 ? ' xlong' : (pack.cps.length > 26 ? ' long' : ''));
  var frag = document.createDocumentFragment();
  for (var i = 0; i < pack.cps.length; i++){
    var s = document.createElement('span');
    s.className = 'ch';
    s.textContent = pack.cps[i] === ' ' ? '\u00a0' : pack.cps[i];
    frag.appendChild(s);
    curSpans.push(s);
    spanState.push(0);
  }
  curEl.appendChild(frag);
  prevEl.textContent = idx > 0 ? (lines[idx - 1].text || '') : '';
  nextEl.textContent = idx + 1 < lines.length ? (lines[idx + 1].text || '') : '';
  lineIn = 0;
  poseState = -1;
  curEl.style.opacity = '';
  prevEl.style.opacity = '';
  nextEl.style.opacity = '';
}

function paintChars(){
  if (!pack || !curSpans.length) return;
  for (var i = 0; i < curSpans.length; i++){
    var on = t >= pack.times[i];
    var st = on ? 1 : 0;
    if (spanState[i] !== st){
      spanState[i] = st;
      curSpans[i].className = on ? 'ch on' : 'ch';
    }
  }
}

function paintEntry(){
  if (pack) return;
  if (lineIn >= 1) return;
  lineIn = Math.min(1, lineIn + 0.06);
  var e = 1 - Math.pow(1 - lineIn, 3);
  curEl.style.opacity = String(0.35 + 0.65 * e);
  curEl.style.transform = 'translateY(' + ((1 - e) * 14).toFixed(2) + 'px)';
  prevEl.style.opacity = String(0.7 * e);
  nextEl.style.opacity = String(0.7 * e);
}

function findIdx(time){
  var lo = 0, hi = lines.length - 1, ans = -1;
  while (lo <= hi){
    var m = (lo + hi) >> 1;
    if (lines[m].t <= time + 0.02){ ans = m; lo = m + 1; } else { hi = m - 1; }
  }
  return ans;
}

function syncLyrics(){
  var ni = findIdx(t);
  if (ni !== idx){ idx = ni; buildCurrent(); }
  paintChars();
}

/* 间隔处：把当前句淡下去；还没到第一句时给一行安静的开场话 */
var poseState = -1;
function paintPose(){
  var fading = 0;
  if (lines.length && idx >= 0){
    var L = lines[idx];
    var span = Math.max(0.9, L.dur || 0);
    fading = (L.t + span + 2.2 < t) ? 1 : 0;
  }
  if (idleEl) idleEl.style.opacity = (lines.length && idx < 0) ? '0.52' : '0';
  if (fading === poseState) return;
  poseState = fading;
  if (fading){
    curEl.style.opacity = '0.32';
    prevEl.style.opacity = '0.30';
    nextEl.style.opacity = '0.30';
  } else if (pack){
    curEl.style.opacity = '1';
    prevEl.style.opacity = '';
    nextEl.style.opacity = '';
  }
}

/* ---------- 尺寸 ---------- */
function resize(){
  var w = window.innerWidth || 0, h = window.innerHeight || 0;
  if (!(w > 0)) w = 1440;
  if (!(h > 0)) h = 900;
  W = w; H = h;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildPaper();
  buildArt();
}

/* ---------- 纸 ---------- */
var paperBuilt = 0;
function buildPaper(){
  var w = Math.max(1, Math.min(900, Math.round(W / 2)));
  var h = Math.max(1, Math.min(700, Math.round(H / 2)));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  if (!g) return;
  var img = g.createImageData(w, h);
  var d = img.data;
  for (var y = 0; y < h; y++){
    for (var x = 0; x < w; x++){
      var i = (y * w + x) * 4;
      var n = (Math.random() - 0.5) * 13;
      var fiber = Math.sin(x * 0.19 + y * 0.07) * 3 + Math.sin(y * 0.33 + x * 0.05) * 2.4;
      d[i] = 239 + n + fiber;
      d[i + 1] = 231 + n + fiber * 0.9;
      d[i + 2] = 214 + n + fiber * 0.7;
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  try { paperEl.style.backgroundImage = 'url(' + c.toDataURL('image/jpeg', 0.72) + ')'; }
  catch (e) { console.error(e); }
  paperBuilt = 1;
}

/* ---------- 主视觉：标本 ---------- */
var S = 600, baseX = 300, baseY = 780;
var fronds = [], roots = [], shrooms = [], dust = [], glow = null, labelAnchors = [];
var beatLevel = 0, wind = 0.5, bass = 0, mid = 0, treble = 0, liveBpm = 0, beatPulse = 0;
var artSeed = 43077;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function leafletPath(ax, ay, bx, by, w){
  var mx = (ax + bx) / 2, my = (ay + by) / 2;
  var dx = bx - ax, dy = by - ay;
  var len = Math.sqrt(dx * dx + dy * dy) || 0.0001;
  var nx = -dy / len, ny = dx / len;
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.quadraticCurveTo(mx + nx * w, my + ny * w, bx, by);
  ctx.quadraticCurveTo(mx - nx * w * 0.72, my - ny * w * 0.72, ax, ay);
  ctx.closePath();
}

function buildFrond(cfg, rnd){
  var rot = cfg.rot * Math.PI / 180;
  var cosr = Math.cos(rot), sinr = Math.sin(rot);
  var bend = cfg.bend, N = cfg.n;
  var leaflets = [];
  for (var i = 0; i < N; i++){
    var u = (i + 0.6) / N;
    var px = bend * Math.pow(u, 1.55);
    var py = -u;
    var taper = Math.pow(Math.sin(Math.PI * Math.min(1, 0.10 + u * 0.93)), 0.55);
    var len = cfg.leaf * taper * (0.82 + rnd() * 0.28);
    var side = (i % 2) ? 1 : -1;
    var ang = -Math.PI / 2 + side * (56 + rnd() * 13) * Math.PI / 180;
    ang += (u - 0.5) * 0.42;
    var lx = Math.cos(ang) * len, ly = Math.sin(ang) * len;
    var ax = px, ay = py;
    var bx = px + lx, by = py + ly;
    var w = len * (0.20 + rnd() * 0.06);
    var sori = [];
    if (rnd() > 0.55){
      var cnt = 2 + ((rnd() * 3) | 0);
      for (var k = 0; k < cnt; k++){
        var q = 0.34 + 0.5 * (k / Math.max(1, cnt - 1));
        sori.push([ax + (bx - ax) * q, ay + (by - ay) * q + w * 0.18, 1.15 + rnd() * 0.9]);
      }
    }
    leaflets.push({
      ax: ax * cosr - ay * sinr, ay: ax * sinr + ay * cosr,
      bx: bx * cosr - by * sinr, by: bx * sinr + by * cosr,
      w: w, sori: sori, u: u
    });
  }
  var pts = [];
  for (var s = 0; s <= 18; s++){
    var uu = s / 18;
    var qx = bend * Math.pow(uu, 1.55), qy = -uu;
    pts.push([qx * cosr - qy * sinr, qx * sinr + qy * cosr]);
  }
  return { leaflets: leaflets, pts: pts, phase: cfg.phase, alpha: cfg.alpha };
}

function buildArt(){
  var rnd = mulberry32(artSeed);
  var portrait = (W / Math.max(1, H)) < 0.86;
  if (portrait){
    S = Math.max(150, Math.min(H * 0.52, W * 0.86));
    baseX = W * 0.50;
    baseY = H * 0.605;
  } else {
    S = Math.max(180, Math.min(H * 0.80, W * 0.58));
    baseX = W * 0.29;
    baseY = H * 0.855;
  }
  fronds = [];
  var specs = [
    { rot: -17, bend: 0.19, n: 33, leaf: 0.205, phase: 0.0, alpha: 1.0 },
    { rot: -39, bend: 0.05, n: 29, leaf: 0.165, phase: 1.7, alpha: 0.92 },
    { rot: 13, bend: 0.27, n: 25, leaf: 0.130, phase: 3.1, alpha: 0.86 }
  ];
  for (var i = 0; i < specs.length; i++) fronds.push(buildFrond(specs[i], rnd));

  labelAnchors = [];
  var names = ['Polypodium vulgare L.', 'Dryopteris filix-mas', 'Asplenium trichomanes'];
  for (var q = 0; q < fronds.length; q++){
    var tip = fronds[q].pts[fronds[q].pts.length - 1];
    labelAnchors.push({
      f: fronds[q], nx: tip[0], ny: tip[1], lat: names[q] || names[0]
    });
  }

  roots = [];
  for (var r = 0; r < 7; r++){
    var spread = (r - 3) * 0.26 + (rnd() - 0.5) * 0.14;
    var l = 0.075 + rnd() * 0.075;
    roots.push({
      x: (rnd() - 0.5) * 0.012, y: 0,
      lx: Math.sin(spread) * l * 0.9,
      ly: Math.abs(Math.cos(spread)) * l * 0.55,
      bend: (rnd() - 0.5) * 0.05
    });
  }

  shrooms = [
    { x: 0.135, y: -0.008, h: 0.052, w: 0.040 },
    { x: 0.175, y: 0.006, h: 0.034, w: 0.027 }
  ];

  dust = [];
  for (var d = 0; d < 26; d++){
    dust.push({ x: rnd(), y: rnd(), s: 0.6 + rnd() * 1.7, sp: 0.006 + rnd() * 0.016, ph: rnd() * 6.28 });
  }
  glow = null;
}

function drawSpecimen(now){
  if (!fronds.length) return;
  var tSec = now * 0.001;
  var sw = reduced ? 0.0016 : 0.0072;
  var windAmp = sw * (0.6 + wind * 0.8) + beatLevel * (reduced ? 0.004 : 0.018);

  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.scale(S, S);

  /* 根部 */
  ctx.strokeStyle = 'rgba(96,72,48,.55)';
  ctx.lineWidth = 1.1 / S;
  ctx.lineCap = 'round';
  var rw = Math.sin(tSec * 0.5) * windAmp * 0.4;
  for (var i = 0; i < roots.length; i++){
    var rt = roots[i];
    ctx.beginPath();
    ctx.moveTo(rt.x, rt.y);
    ctx.quadraticCurveTo(rt.x + rt.bend + rw * 0.4, rt.y + rt.ly * 0.6, rt.x + rt.lx, rt.y + rt.ly);
    ctx.stroke();
  }

  /* 叶柄与叶片 */
  for (var f = 0; f < fronds.length; f++){
    var fr = fronds[f];
    var sway = Math.sin(tSec * 0.62 + fr.phase) * windAmp + Math.sin(tSec * 1.7 + fr.phase * 2) * windAmp * 0.25;
    fr.sway = sway;
    ctx.save();
    ctx.rotate(sway);

    /* 叶轴 */
    ctx.strokeStyle = 'rgba(74,86,52,' + (0.62 * fr.alpha).toFixed(3) + ')';
    ctx.lineWidth = 2.6 / S;
    ctx.beginPath();
    ctx.moveTo(fr.pts[0][0], fr.pts[0][1]);
    for (var p = 1; p < fr.pts.length; p++) ctx.lineTo(fr.pts[p][0], fr.pts[p][1]);
    ctx.stroke();

    /* 羽片两遍：先淡彩后描边 */
    for (var pass = 0; pass < 2; pass++){
      for (var li = 0; li < fr.leaflets.length; li++){
        var L = fr.leaflets[li];
        leafletPath(L.ax, L.ay, L.bx, L.by, L.w);
        if (pass === 0){
          var dark = L.u < 0.55 ? 0.30 : 0.24;
          ctx.fillStyle = 'rgba(96,110,64,' + (dark * fr.alpha).toFixed(3) + ')';
          ctx.fill();
          ctx.fillStyle = 'rgba(132,146,92,' + (0.10 * fr.alpha).toFixed(3) + ')';
          ctx.fill();
        } else {
          ctx.strokeStyle = 'rgba(58,68,42,' + (0.34 * fr.alpha).toFixed(3) + ')';
          ctx.lineWidth = 0.85 / S;
          ctx.stroke();
          ctx.strokeStyle = 'rgba(48,58,34,' + (0.22 * fr.alpha).toFixed(3) + ')';
          ctx.lineWidth = 0.5 / S;
          ctx.beginPath();
          ctx.moveTo(L.ax, L.ay);
          ctx.lineTo(L.bx, L.by);
          ctx.stroke();
        }
      }
    }

    /* 孢子囊群 */
    for (var si = 0; si < fr.leaflets.length; si++){
      var so = fr.leaflets[si].sori;
      for (var k = 0; k < so.length; k++){
        var dot = so[k];
        ctx.beginPath();
        ctx.arc(dot[0], dot[1], dot[2] / S * 2.2, 0, 6.2832);
        ctx.fillStyle = 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',.30)';
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* 毒蕈 */
  for (var m = 0; m < shrooms.length; m++){
    var mh = shrooms[m];
    ctx.strokeStyle = 'rgba(238,232,214,.9)';
    ctx.lineWidth = mh.w * 0.22;
    ctx.beginPath();
    ctx.moveTo(mh.x, mh.y);
    ctx.lineTo(mh.x + 0.004, mh.y - mh.h);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(mh.x + 0.004, mh.y - mh.h, mh.w, mh.w * 0.55, 0, Math.PI, 0);
    ctx.fillStyle = 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',.78)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(70,44,32,.45)';
    ctx.lineWidth = 0.8 / S;
    ctx.stroke();
    ctx.fillStyle = 'rgba(246,241,226,.85)';
    for (var sp = 0; sp < 3; sp++){
      ctx.beginPath();
      ctx.arc(mh.x + 0.004 + (sp - 1) * mh.w * 0.5, mh.y - mh.h - mh.w * 0.12, mh.w * 0.10, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.restore();

  /* 铅标注 */
  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.scale(S, S);
  ctx.rotate(0);
  ctx.restore();
}

function drawLabels(){
  if (!labelAnchors.length) return;
  var fs = Math.max(8, Math.min(11.5, W * 0.0072));
  var pad = Math.max(14, W * 0.026);
  ctx.save();
  ctx.font = 'italic ' + fs + 'px "Iowan Old Style",Palatino,Georgia,serif';
  ctx.fillStyle = 'rgba(74,56,38,.72)';
  ctx.strokeStyle = 'rgba(74,56,38,.24)';
  ctx.lineWidth = 0.6;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < labelAnchors.length; i++){
    var a = labelAnchors[i];
    var sw = a.f.sway || 0;
    var cs = Math.cos(sw), sn = Math.sin(sw);
    var px = a.nx * cs - a.ny * sn, py = a.nx * sn + a.ny * cs;
    var ax = baseX + S * px, ay = baseY + S * py;
    var ty = ay;
    if (ty < H * 0.09) ty = H * 0.09;
    if (ty > H * 0.93) ty = H * 0.93;
    var tx = W - pad - ctx.measureText(a.lat).width;
    if (tx < W * 0.46) tx = Math.min(W * 0.46, W - pad - 20);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(tx - fs * 0.6, ty);
    ctx.stroke();
    ctx.fillText(a.lat, tx, ty);
  }
  ctx.restore();
}

function drawDust(now){
  if (reduced && dust.length) { /* still draw static spores */ }
  var tSec = now * 0.001;
  ctx.save();
  ctx.fillStyle = 'rgba(120,96,62,.30)';
  for (var i = 0; i < dust.length; i++){
    var d = dust[i];
    var drift = reduced ? 0 : Math.sin(tSec * d.sp * 9 + d.ph) * 0.014;
    var x = (d.x + drift) * W;
    var y = (d.y + (reduced ? 0 : (tSec * d.sp * 0.16) % 0.35)) % 1 * H;
    ctx.beginPath();
    ctx.arc(x, y, d.s, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function drawArt(){
  var now = performance.now();
  ctx.clearRect(0, 0, W, H);
  if (beatPulse > 0.01){
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(' + accent[0] + ',' + accent[1] + ',' + accent[2] + ',' + (0.05 * beatPulse).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  drawSpecimen(now);
  drawLabels();
  drawTickMarks();
  drawDust(now);
}

function drawTickMarks(){
  var portrait = (W / Math.max(1, H)) < 0.86;
  if (portrait) return;
  var x = Math.max(20, W * 0.032);
  var top = H * 0.16, bot = H * 0.86, step = 26;
  var count = Math.min(60, Math.floor((bot - top) / step));
  ctx.save();
  ctx.strokeStyle = 'rgba(84,64,42,.20)';
  ctx.lineWidth = 1;
  for (var i = 0; i <= count; i++){
    var y = top + i * step;
    var long = i % 5 === 0;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (long ? 11 : 5), y);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 主循环 ---------- */
var readySent = false;
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error(e); }
}

function loop(){
  try {
    var t0 = performance.now();
    frames++;
    beatPulse *= 0.88;
    beatLevel *= 0.93;
    if (beatPulse < 0.002) beatPulse = 0;
    paintEntry();
    paintPose();
    drawArt();
    jsMs = performance.now() - t0;
  } catch (e) {
    errMsg = String((e && e.message) || e);
    console.error(e);
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(function(){ sendReady(); });
requestAnimationFrame(loop);
setTimeout(sendReady, 1000);

/* ---------- 消息 ---------- */
window.addEventListener('message', function(ev){
  try {
    var d = ev.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === 'init'){
      lines = normalize(p.lines);
      if (Array.isArray(p.accent) && p.accent.length >= 3){
        accent = [num(p.accent[0], 139), num(p.accent[1], 62), num(p.accent[2], 44)];
      }
      if (p.song){
        songName = safeText(p.song.name);
        var ar = p.song.artists;
        songArtist = Array.isArray(ar) ? ar.filter(Boolean).join(' · ') : safeText(ar);
        songEl.textContent = (songName || '无题') + (songArtist ? '  —  ' + songArtist : '');
      }
      duration = num(p.duration, 0);
      playing = p.playing === false ? false : true;
      idx = -2;
      buildCurrent();
      buildArt();
      syncLyrics();
    } else if (d.type === 'tick'){
      t = num(p.time, t);
      if (p.playing === false || p.playing === true) playing = p.playing;
      syncLyrics();
    } else if (d.type === 'beat'){
      beatLevel = Math.max(beatLevel, Math.min(1, num(p.level, 0.5)));
      beatPulse = 1;
    } else if (d.type === 'live'){
      liveBpm = num(p.bpm, liveBpm);
      bass = Math.min(1, num(p.bass, 0));
      mid = Math.min(1, num(p.mid, 0));
      treble = Math.min(1, num(p.treble, 0));
      wind = 0.35 + bass * 0.55 + treble * 0.35;
      if (p.playing === false) playing = false;
    }
  } catch (e) {
    errMsg = String((e && e.message) || e);
    console.error(e);
  }
});

window.addEventListener('resize', function(){
  try { resize(); } catch (e) { errMsg = String((e && e.message) || e); console.error(e); }
});

resize();
buildCurrent();

})();
</script>
