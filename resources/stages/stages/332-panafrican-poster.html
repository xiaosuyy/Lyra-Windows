<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>332 · 泛非怒吼</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0a08}
  body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
       color:#f7efd8;-webkit-font-smoothing:antialiased}
  :root{
    --ink:#0b0a08; --red:#e01f12; --yel:#f6c400; --grn:#0f8a3f; --bone:#f7efd8;
    --disp:Impact,"Haettenschweiler","Arial Black","Franklin Gothic Heavy","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0}
  #poster{position:fixed;inset:0;z-index:2;pointer-events:none}

  /* ——— top flag stripe ——— */
  #band{position:absolute;top:0;left:0;right:0;height:clamp(7px,1.05vmin,14px);
        background:linear-gradient(90deg,var(--red) 0 33.33%,var(--yel) 33.33% 66.66%,var(--grn) 66.66% 100%)}

  /* ——— header ——— */
  #head{position:absolute;top:calc(clamp(7px,1.05vmin,14px) + clamp(12px,2.1vmin,26px));
        left:clamp(12px,2.6vw,40px);right:clamp(12px,2.6vw,40px);
        display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #kick{font-size:clamp(8px,1.02vw,13px);line-height:1.35;font-weight:800;letter-spacing:.2em;
        text-transform:uppercase;color:var(--yel);text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6)}
  #kick b{color:var(--bone)}
  #meta{display:flex;align-items:center;justify-content:flex-end;gap:clamp(6px,.9vw,14px);max-width:44vw}
  #mtxt{min-width:0;text-align:right}
  #cover{display:none;width:clamp(30px,4.1vmin,56px);height:clamp(30px,4.1vmin,56px);object-fit:cover;
         border:2px solid var(--bone);transform:rotate(-3deg);flex:0 0 auto;
         filter:grayscale(1) contrast(1.18) sepia(.35) saturate(1.9);box-shadow:3px 3px 0 var(--red)}
  #cover.on{display:block}
  #sname{font-family:var(--disp);font-size:clamp(13px,1.65vw,24px);letter-spacing:.02em;
         text-transform:uppercase;line-height:1.05;color:var(--bone);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #000,2px 2px 0 var(--red)}
  #sart{margin-top:.28em;font-size:clamp(8px,.95vw,12px);letter-spacing:.16em;text-transform:uppercase;
        color:rgba(247,239,216,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ——— edge lettering (cropped street-poster slices) ——— */
  .side{position:absolute;top:50%;font-family:var(--disp);text-transform:uppercase;
        font-size:clamp(26px,8.4vw,150px);line-height:.82;letter-spacing:.02em;
        writing-mode:vertical-rl;color:transparent;-webkit-text-stroke:2px rgba(246,196,0,.26);
        opacity:.85;pointer-events:none}
  #sideL{left:-.6vw;transform:translateY(-50%) rotate(180deg)}
  #sideR{right:-.6vw;transform:translateY(-50%)}

  /* ——— lyric plate ——— */
  #lyric{position:absolute;left:50%;transform:translateX(-50%);
         bottom:clamp(96px,26vh,300px);width:min(88vw,940px);text-align:center;
         opacity:0;transition:opacity .3s ease}
  #lyric.live{opacity:1}
  #plate{position:relative;display:block;width:100%;padding:clamp(11px,1.45vw,22px) clamp(16px,2.4vw,40px);
         background:var(--ink);color:var(--bone);border:3px solid var(--bone);
         transform:rotate(-.55deg);
         box-shadow:9px 9px 0 0 var(--red),-7px -7px 0 0 var(--grn),
                    0 0 0 2px rgba(11,10,8,.85),0 18px 44px rgba(0,0,0,.55)}
  #plate:before{content:"";position:absolute;inset:-10px;border:1.5px solid rgba(247,239,216,.26);
                pointer-events:none;transform:rotate(.7deg)}
  .ln{max-width:100%}
  .prev,.next{font-size:clamp(10px,1.35vw,19px);font-weight:800;letter-spacing:.04em;line-height:1.35;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.42em;
              color:rgba(247,239,216,.46)}
  .prev{padding-bottom:.12em}
  .next{padding-top:.12em}
  .cur{margin:.16em 0;font-weight:900;letter-spacing:.005em;line-height:1.2;
       font-size:clamp(19px,3.05vw,52px);word-break:break-word;overflow-wrap:anywhere;text-wrap:balance}
  .cur .ch{display:inline-block;white-space:pre;padding:0 .012em;
           color:rgba(247,239,216,.46);transition:color .1s linear}
  .cur .ch.on{color:var(--ink);
              background:linear-gradient(180deg,rgba(246,196,0,0) 12%,var(--yel) 12%,var(--yel) 88%,rgba(246,196,0,0) 88%)}
  .cur .ch.now{background:var(--red);color:var(--bone)}
  #empty{display:none;font-family:var(--disp);font-size:clamp(11px,1.5vw,20px);letter-spacing:.24em;
         text-transform:uppercase;color:var(--ink);background:var(--yel);
         padding:.7em 1.15em;border:2px solid var(--ink);
         box-shadow:7px 7px 0 var(--red),-5px -5px 0 var(--grn);
         transform:rotate(-.8deg)}
  #lyric.none #plate{display:none}
  #lyric.none #empty{display:inline-block}

  /* ——— footer ——— */
  #foot{position:absolute;left:clamp(12px,2.6vw,40px);right:clamp(12px,2.6vw,40px);bottom:clamp(10px,2.4vh,26px);
        display:flex;align-items:center;justify-content:space-between;gap:14px;
        font-size:clamp(8px,1vw,12px);letter-spacing:.2em;text-transform:uppercase}
  #cnt,#tag{background:var(--ink);color:var(--yel);padding:.42em .6em;font-weight:800;
            box-shadow:0 0 0 1px rgba(247,239,216,.25)}
  #tag{color:var(--bone);opacity:.85}
  #bar{flex:1;height:5px;background:rgba(247,239,216,.18);box-shadow:0 0 0 1px rgba(11,10,8,.6);max-width:38vw;margin-left:auto}
  #bar i{display:block;height:100%;width:0%;background:var(--yel);box-shadow:0 0 0 1px var(--ink)}

  @media (max-aspect-ratio:3/4){
    .side{display:none}
    #lyric{bottom:clamp(150px,29vh,300px);width:88vw}
    #meta{max-width:46vw}
  }
  @media (max-height:520px){
    #lyric{bottom:clamp(64px,17vh,120px)}
    .prev,.next{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .cur .ch{transition:none}
    #plate{transform:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="poster">
  <div id="band"></div>
  <header id="head">
    <div id="kick">Pan-African<br><b>Poster · 28/50</b></div>
    <div id="meta">
      <img id="cover" alt="" decoding="async">
      <div id="mtxt"><div id="sname">—</div><div id="sart"></div></div>
    </div>
  </header>
  <div class="side" id="sideL">Amandla</div>
  <div class="side" id="sideR">Ngawethu</div>
  <section id="lyric">
    <div id="empty">♪ 纯器乐 · No Lyrics</div>
    <div id="plate">
      <div class="ln prev" id="lp"></div>
      <div class="ln cur" id="lc"><span id="lrow"></span></div>
      <div class="ln next" id="lnext"></div>
    </div>
  </section>
  <footer id="foot">
    <span id="cnt">—</span>
    <span id="tag">332 · 泛非怒吼</span>
    <span id="bar"><i></i></span>
  </footer>
</div>
<script>
(function(){
'use strict';
var c=document.getElementById('c'), ctx=c.getContext('2d');
var lyricBox=document.getElementById('lyric'), plate=document.getElementById('plate'),
    rowEl=document.getElementById('lrow'), curEl=document.getElementById('lc'),
    prevEl=document.getElementById('lp'), nextEl=document.getElementById('lnext'),
    cntEl=document.getElementById('cnt'), barFill=document.querySelector('#bar i'),
    nameEl=document.getElementById('sname'), artEl=document.getElementById('sart'),
    coverEl=document.getElementById('cover');
var W=1440,H=900,DPR=1;
var S={lines:[],idx:-1,t:0,playing:true,frames:0,js:0,err:'',text:'',dur:0,
       spans:[],charT:[],lit:-1,fitSize:0};
var reduced=false;
try{ reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
var beatLv=0, live={bass:0,mid:0,treble:0,level:0};

function clampNum(v,d){ v=Number(v); return isFinite(v)?v:d; }
function geom(){
  var R=Math.min(W*0.46,H*0.36);
  var yH=H*0.44+R*0.90;
  var h2=Math.min(H*0.145,W*0.30);
  return {cx:W*0.5, cy:H*0.44, R:R, yH:yH, marchH:h2, plateY:yH-h2-28};
}
function resize(){
  var w=clampNum(window.innerWidth,0), h=clampNum(window.innerHeight,0);
  if(!(w>0)) w=1440; if(!(h>0)) h=900;
  W=w; H=h;
  var dpr=Math.min(2, clampNum(window.devicePixelRatio,1)||1);
  var maxPx=3200000;                       /* 像素预算，防止 4K+DPR2 掉帧 */
  if(W*H*dpr*dpr>maxPx) dpr=Math.max(1,Math.sqrt(maxPx/(W*H)));
  DPR=dpr;
  c.width=Math.max(1,Math.round(W*DPR)); c.height=Math.max(1,Math.round(H*DPR));
  c.style.width=W+'px'; c.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scheduleOverlay();
  var g0=geom();
  lyricBox.style.bottom=Math.max(48,Math.round(H-g0.plateY))+'px';
  if(S.spans.length) fitLine();
}
/* ---------- palette / safe colors ---------- */
var AC=[224,31,18];
var C_INK='#0b0a08', C_RED='#e01f12', C_YEL='#f6c400', C_GRN='#0f8a3f', C_BONE='#f7efd8';
function c8(v){ v=Math.round(clampNum(v,0)); return v<0?0:(v>255?255:v); }
function rgbOf(a,alpha){
  a=a&&a.length>=3?a:[224,31,18];
  var s='rgb('+c8(a[0])+','+c8(a[1])+','+c8(a[2])+')';
  if(alpha==null) return s;
  return 'rgba('+c8(a[0])+','+c8(a[1])+','+c8(a[2])+','+clampNum(alpha,1)+')';
}
function stop(g,p,col){ try{ g.addColorStop(Math.max(0,Math.min(1,p)),col); }catch(e){} }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- static print screen (halftone + grain + vignette) ---------- */
var ov=document.createElement('canvas'), ovc=ov.getContext('2d');
var grainTile=null;
function buildGrain(){
  var g=document.createElement('canvas'); g.width=g.height=128;
  var gc=g.getContext('2d'), img=gc.createImageData(128,128), rn=mulberry(7717);
  for(var i=0;i<128*128;i++){
    var v=rn()*255|0, o=i*4;
    img.data[o]=v; img.data[o+1]=v; img.data[o+2]=v; img.data[o+3]=Math.round(rn()*70);
  }
  gc.putImageData(img,0,0); grainTile=g;
}
function buildOverlay(){
  var w=Math.max(1,Math.round(W*DPR)), h=Math.max(1,Math.round(H*DPR));
  ov.width=w; ov.height=h;
  ovc.setTransform(DPR,0,0,DPR,0,0);
  ovc.clearRect(0,0,W,H);
  var step=Math.max(6,Math.round(Math.min(W,H)/105));
  var rn=mulberry(4231);
  ovc.fillStyle='rgba(11,10,8,0.5)';
  for(var y=step*0.5;y<H+step;y+=step){
    for(var x=step*0.5;x<W+step;x+=step){
      var d=Math.abs(Math.sin(x*0.0085+y*0.0052)+Math.cos(x*0.0031-y*0.0101));
      var s=(0.42+d*0.85)*step*0.24*(0.7+rn()*0.6);
      if(s<0.7) continue;
      ovc.globalAlpha=0.10+d*0.16;
      ovc.fillRect(x-s/2,y-s/2,s,s);
    }
  }
  ovc.globalAlpha=1;
  if(!grainTile) buildGrain();
  var pat=ovc.createPattern(grainTile,'repeat');
  if(pat){ ovc.globalAlpha=0.30; ovc.fillStyle=pat; ovc.fillRect(0,0,W,H); ovc.globalAlpha=1; }
  var vg=ovc.createRadialGradient(W*0.5,H*0.46,Math.min(W,H)*0.22,W*0.5,H*0.46,Math.max(W,H)*0.72);
  stop(vg,0,'rgba(0,0,0,0)'); stop(vg,0.72,'rgba(0,0,0,0.16)'); stop(vg,1,'rgba(0,0,0,0.62)');
  ovc.fillStyle=vg; ovc.fillRect(0,0,W,H);
  /* printer's crop marks */
  var mg=Math.min(W,H)*0.024, ln2=Math.min(W,H)*0.032;
  ovc.strokeStyle='rgba(247,239,216,0.32)'; ovc.lineWidth=1.5;
  var marks=[[mg,mg,1,1],[W-mg,mg,-1,1],[mg,H-mg,1,-1],[W-mg,H-mg,-1,-1]];
  for(var k=0;k<marks.length;k++){
    var mk=marks[k];
    ovc.beginPath();
    ovc.moveTo(mk[0]+mk[2]*ln2,mk[1]); ovc.lineTo(mk[0],mk[1]); ovc.lineTo(mk[0],mk[1]+mk[3]*ln2);
    ovc.stroke();
  }
}
var ovTimer=0, ovBuilt=false;
function scheduleOverlay(){
  if(!ovBuilt){ buildOverlay(); ovBuilt=true; return; }
  if(ovTimer) clearTimeout(ovTimer);
  ovTimer=setTimeout(function(){ ovTimer=0; buildOverlay(); },140);
}
/* dry-brush slashes: 粗粝笔触，压在太阳后面 */
function brush(x1,y1,x2,y2,w,col,alpha,seed){
  var rn=mulberry(seed), dx=x2-x1, dy=y2-y1;
  var L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  var SEG=9, pts=[], i, t, ww, qx, qy;
  for(i=0;i<=SEG;i++){
    t=i/SEG;
    ww=w*(0.22+0.78*Math.sin(Math.PI*t))*(0.86+rn()*0.28);
    pts.push(x1+dx*t+nx*ww, y1+dy*t+ny*ww);
  }
  for(i=SEG;i>=0;i--){
    t=i/SEG;
    ww=w*(0.22+0.78*Math.sin(Math.PI*t))*(0.86+rn()*0.28);
    pts.push(x1+dx*t-nx*ww, y1+dy*t-ny*ww);
  }
  ctx.beginPath();
  ctx.moveTo(pts[0],pts[1]);
  for(i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath();
  ctx.globalAlpha=alpha; ctx.fillStyle=col; ctx.fill();
  ctx.globalAlpha=1;
}
function drawStrokes(){
  var m=Math.min(W,H);
  brush(-W*0.04,H*0.20,W*0.46,H*0.015,m*0.036,C_RED,0.62,3311);
  brush(W*1.04,H*0.66,W*0.56,H*0.83,m*0.030,C_GRN,0.52,3322);
  brush(W*0.30,-H*0.02,W*0.10,H*0.34,m*0.020,C_YEL,0.26,3333);
}

/* ---------- poster ground: tricolor burst + sun ---------- */
var anim=0;
function drawBurst(cx,cy,dt){
  var R=Math.hypot(W,H)*1.15, N=30, spin=reduced?0:anim*0.012;
  for(var i=0;i<N;i++){
    var a0=spin+i*(Math.PI*2/N), a1=a0+(Math.PI*2/N)*0.52;
    var m=i%3;
    if(m===0){ wedge(cx,cy,a0,a1,R,C_RED,0.34+beatLv*0.10); }
    else if(m===1){ wedge(cx,cy,a0,a1,R,C_GRN,0.20); }
  }
}
function wedge(cx,cy,a0,a1,r,col,al){
  ctx.globalAlpha=al; ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
}
function drawSun(cx,cy,R){
  var g=ctx.createRadialGradient(cx-R*0.22,cy-R*0.28,R*0.05,cx,cy,R);
  stop(g,0,'#fff0a8'); stop(g,0.34,'#ffd21e'); stop(g,0.72,C_YEL); stop(g,0.9,'#f08b0e');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=Math.max(2,R*0.012); ctx.strokeStyle='rgba(11,10,8,0.55)'; ctx.stroke();
}
function drawGround(yH){
  var g=ctx.createLinearGradient(0,yH,0,H);
  stop(g,0,'rgba(11,10,8,0.97)'); stop(g,0.34,'rgba(96,12,7,0.86)'); stop(g,1,'rgba(214,28,18,0.62)');
  ctx.fillStyle=g; ctx.fillRect(0,yH-1,W,H-yH+1);
  ctx.fillStyle=C_YEL; ctx.fillRect(0,yH-2.5,W,2.5);
  ctx.fillStyle='rgba(11,10,8,0.75)'; ctx.fillRect(0,yH+3,W,1.5);
}
/* ---------- street illustration: marching column + raised fists ---------- */
function rr(g,x,y,w,h,r){
  r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function unitShape(g,x,yb,h,ph,lift){
  var bob=Math.sin(ph*Math.PI*2)*0.012*h;
  var yb2=yb-bob-lift;
  var sh=yb2-h*0.83, hd=yb2-h*0.88;
  var sw=Math.sin(ph*Math.PI*2)*0.075*h;
  // legs (lockstep, dead straight)
  g.save();
  g.translate(x,yb2);
  g.beginPath(); g.moveTo(-0.10*h,-h*0.44); g.lineTo(-0.02*h,-h*0.02);
  g.lineTo(-0.10*h,-h*0.02); g.lineTo(-0.17*h,-h*0.44); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(0.02*h,-h*0.44); g.lineTo(0.09*h+sw*0.5,-h*0.02);
  g.lineTo(0.01*h+sw*0.5,-h*0.02); g.lineTo(-0.05*h,-h*0.44); g.closePath(); g.fill();
  g.restore();
  // torso
  g.beginPath();
  g.moveTo(x-0.13*h,yb2-h*0.44); g.lineTo(x+0.13*h,yb2-h*0.44);
  g.lineTo(x+0.16*h,sh); g.lineTo(x-0.16*h,sh); g.closePath(); g.fill();
  // baton arm, angled up across the chest
  g.save();
  g.translate(x+0.10*h,sh+0.02*h); g.rotate(-0.86);
  rr(g,-0.022*h,-0.02*h,0.044*h,0.34*h,0.02*h); g.fill();
  rr(g,-0.016*h,-0.30*h,0.032*h,0.30*h,0.014*h); g.fill();
  g.restore();
  // helmet (dome + visor lip)
  rr(g,x-0.095*h,hd-0.055*h,0.19*h,0.115*h,0.055*h); g.fill();
  rr(g,x-0.115*h,hd+0.03*h,0.23*h,0.035*h,0.012*h); g.fill();
  // shield
  rr(g,x-0.235*h,yb2-h*0.62,0.105*h,h*0.30,0.02*h); g.fill();
}
function drawMarch(yBase,h,count,phase,lift){
  var sp=W/Math.max(1,count-0.001);
  var drift=reduced?0:((anim*26)%sp);
  /* lockstep: 每一列同拍（机械感），循环处无跳变 */
  var p=phase+drift/sp;
  for(var i=-1;i<=count;i++){
    var x=i*sp+sp*0.5+drift;
    if(x<-sp||x>W+sp) continue;
    ctx.fillStyle=C_YEL; ctx.globalAlpha=0.55;
    unitShape(ctx,x-3,yBase,h,p,lift);
    ctx.fillStyle='#0b0a08'; ctx.globalAlpha=1;
    unitShape(ctx,x,yBase,h,p,lift);
  }
  ctx.globalAlpha=1;
}
function fistShape(g,x,yTop,s,col){
  g.fillStyle=col;
  rr(g,x-0.21*s,yTop-0.02*s,0.42*s,H-yTop+0.04*s,0.05*s); g.fill();   // forearm
  rr(g,x-0.34*s,yTop+0.44*s,0.68*s,0.34*s,0.09*s); g.fill();           // wrist
  rr(g,x-0.44*s,yTop+0.02*s,0.88*s,0.50*s,0.11*s); g.fill();           // palm
  for(var k=0;k<4;k++){ rr(g,x-0.42*s+k*0.22*s,yTop-0.13*s,0.20*s,0.22*s,0.075*s); g.fill(); }
  rr(g,x-0.52*s,yTop+0.18*s,0.17*s,0.22*s,0.07*s); g.fill();           // thumb
}
function drawCrowd(yH){
  var n=Math.max(4,Math.round(W/210));
  var step=W/n, s=Math.max(64,Math.min(H*0.21,W*0.24,210));
  var top0=yH-Math.min(H*0.02,18);
  for(var i=-1;i<=n+1;i++){
    var x=i*step+step*0.5;
    var sway=reduced?0:Math.sin(anim*1.05+i*0.7)*s*0.028;
    var bump=(i%3===0)?-beatLv*s*0.05:0;
    var top=top0+(i%2?s*0.11:0)+sway+bump;
    /* shoulders / head between raised arms */
    ctx.fillStyle='#0b0a08';
    ctx.beginPath(); ctx.arc(x+s*0.55,top+s*0.86,s*0.185,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(247,239,216,0.30)';
    ctx.beginPath(); ctx.arc(x+s*0.55-2,top+s*0.86-2,s*0.185,Math.PI*1.08,Math.PI*1.92); ctx.fill();
    ctx.globalAlpha=0.55;
    fistShape(ctx,x-3.5,top-3.5,s*0.88,C_YEL);
    ctx.globalAlpha=1;
    fistShape(ctx,x,top,s*0.88,'#0b0a08');
  }
}
/* ---------- hand-cut explosive lettering ---------- */
function starPath(g,x,y,r,spikes,rot,rn){
  g.beginPath();
  for(var i=0;i<spikes*2;i++){
    var a=rot+i*Math.PI/spikes;
    var rad=(i%2?r*0.50:r)*(0.94+rn()*0.13);
    var px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad;
    if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
  }
  g.closePath();
}
function burstWord(x,y,r,word,rot,fillCol,txtCol){
  ctx.save();
  ctx.globalAlpha=0.9;
  starPath(ctx,x+5,y+5,r,11,rot,mulberry(9137)); ctx.fillStyle=C_INK; ctx.fill();
  ctx.globalAlpha=1;
  starPath(ctx,x,y,r,11,rot,mulberry(9137));
  ctx.fillStyle=fillCol; ctx.fill();
  ctx.lineWidth=Math.max(2.5,r*0.055); ctx.strokeStyle=C_INK; ctx.lineJoin='miter'; ctx.stroke();
  ctx.translate(x,y); ctx.rotate(rot);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var size=r*0.56;
  ctx.font='900 '+Math.round(size)+'px Impact,"Arial Black","Franklin Gothic Heavy",sans-serif';
  for(var k=0;k<8;k++){
    if(ctx.measureText(word).width<=r*1.45) break;
    size*=0.9;
    ctx.font='900 '+Math.round(size)+'px Impact,"Arial Black","Franklin Gothic Heavy",sans-serif';
  }
  ctx.fillStyle=txtCol; ctx.fillText(word,0,r*0.03);
  ctx.restore();
}
function drawType(){
  var m=Math.min(W,H);
  if(W<760) return;                 /* 竖屏/窄屏不给字母抢戏 */
  burstWord(W*0.112,H*0.300,m*0.120,'NO!',-0.12,C_RED,C_BONE);
  burstWord(W*0.888,H*0.245,m*0.098,'RISE',0.16,C_BONE,C_INK);
  burstWord(W*0.062,H*0.470,m*0.070,'UP',0.34,C_GRN,C_BONE);
}
function render(dt){
  var g0=geom();
  var R=g0.R*(1+live.bass*0.035+beatLv*0.02);
  var cx=g0.cx, cy=g0.cy, yH=g0.yH;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=C_INK; ctx.fillRect(0,0,W,H);
  drawBurst(cx,cy,dt);
  drawStrokes();
  drawSun(cx,cy,R);
  drawGround(yH);
  drawMarch(yH+1,Math.min(H*0.105,W*0.22),Math.max(6,Math.round(W/215)),0,0);
  drawMarch(yH+2,g0.marchH,Math.max(5,Math.round(W/305)),0.25,beatLv*3);
  drawCrowd(yH);
  drawType();
  if(ov.width) ctx.drawImage(ov,0,0,W,H);
}

var readySent=false;
function ready(){ if(readySent) return; readySent=true; try{ parent.postMessage({__c100:1,type:'ready'},'*'); }catch(e){} }
requestAnimationFrame(function(){ ready(); });
setTimeout(ready,120);

function onInit(p){
  p=p||{};
  lyricBox.classList.add('live');
  /* song meta (artists may be string or array, name may be empty) */
  var song=p.song||{};
  var nm=song.name==null?'':String(song.name).trim();
  var ar=song.artists;
  if(Array.isArray(ar)){ ar=ar.map(function(v){ return v==null?'':String(v).trim(); })
                            .filter(function(v){ return v; }).join(' / '); }
  else ar=(ar==null?'':String(ar)).trim();
  nameEl.textContent=nm||'Untitled';
  artEl.textContent=ar||'';
  artEl.style.opacity=ar?'':'0';

  /* cover: optional, must never block */
  var cu=(song.cover==null?'':String(song.cover)).trim();
  if(cu && cu!==coverEl.getAttribute('data-src')){
    coverEl.setAttribute('data-src',cu);
    coverEl.onload=function(){ coverEl.classList.add('on'); };
    coverEl.onerror=function(){ coverEl.classList.remove('on'); };
    coverEl.classList.remove('on');
    coverEl.src=cu;
  } else if(!cu){
    coverEl.classList.remove('on'); coverEl.removeAttribute('data-src');
    try{ coverEl.removeAttribute('src'); }catch(e){}
  }

  /* accent → only decorative bits, so lyrics keep their own contrast */
  if(Array.isArray(p.accent)&&p.accent.length>=3){
    AC=[clampNum(p.accent[0],224),clampNum(p.accent[1],31),clampNum(p.accent[2],18)];
    try{
      document.documentElement.style.setProperty('--acc',rgbOf(AC));
      barFill.style.background=rgbOf(AC);
      barFill.style.boxShadow='0 0 0 1px #0b0a08';
    }catch(e){}
  }

  var d=Number(p.duration); S.dur=isFinite(d)&&d>0?d:0;

  var raw=Array.isArray(p.lines)?p.lines:[];
  var out=[];
  for(var i=0;i<raw.length;i++){
    var L=raw[i]||{}, txt=(L.text==null?'':String(L.text));
    var t=Number(L.t); if(!isFinite(t)) t=0;
    var dur=Number(L.dur); if(!isFinite(dur)||dur<=0) dur=3.2;
    var chars=Array.isArray(L.chars)&&L.chars.length?L.chars:null;
    if(!txt && chars){                       /* 只有逐字数据时自己拼回正文 */
      var buff='';
      for(var q=0;q<chars.length;q++) buff+=(chars[q]&&chars[q].c!=null)?String(chars[q].c):'';
      txt=buff;
    }
    if(!txt && !chars) continue;              /* 空行丢弃，不留空气泡 */
    out.push({t:t,dur:dur,text:txt,chars:chars});
  }
  out.sort(function(a,b){ return a.t-b.t; });
  S.lines=out;
  S.idx=findIdx(S.t);
  buildLine();
  updateCount();
}
function currentLine(){ return S.idx>=0&&S.idx<S.lines.length?S.lines[S.idx]:null; }
function findIdx(t){
  var lo=0,hi=S.lines.length-1,best=-1;
  while(lo<=hi){ var m=(lo+hi)>>1; if(S.lines[m].t<=t+0.001){ best=m; lo=m+1; } else hi=m-1; }
  return best;
}
function updateCount(){
  if(!S.lines.length){ cntEl.textContent='—'; return; }
  var s=''+Math.max(0,S.idx+1), w=(''+S.lines.length).length;
  while(s.length<w) s='0'+s;
  cntEl.textContent=(S.idx<0?'--':s)+' / '+S.lines.length;
}
/* build the active line: per-char spans + karaoke timing + autofit */
function buildLine(){
  var L=currentLine();
  S.text=L?L.text:'';
  S.spans=[]; S.charT=[]; S.lit=-1;
  if(!S.lines.length){
    lyricBox.classList.add('none');
    rowEl.textContent=''; prevEl.textContent=''; nextEl.textContent='';
    return;
  }
  lyricBox.classList.remove('none');
  var txt=(L&&L.text)?L.text:'♪';
  var pi=S.idx-1, ni=S.idx+1;
  prevEl.textContent=(pi>=0&&S.lines[pi])?S.lines[pi].text:'';
  nextEl.textContent=(ni>=0&&ni<S.lines.length&&S.lines[ni])?S.lines[ni].text:'';

  var cs=(typeof Array.from==='function')?Array.from(txt):txt.split('');
  var n=cs.length||1;
  var chs=(L&&L.chars&&L.chars.length)?L.chars:null;
  var baseT=L?L.t:0, baseD=L?L.dur:3.2;
  var frag=document.createDocumentFragment();
  for(var i=0;i<cs.length;i++){
    var sp=document.createElement('span');
    sp.className='ch'; sp.textContent=cs[i]===' '?' ':cs[i];
    S.spans.push(sp); frag.appendChild(sp);
    var tt;
    if(chs){
      var j=n<=1?0:Math.round(i*(chs.length-1)/(n-1));
      var cc=chs[j]||{};
      tt=Number(cc.t);
      if(!isFinite(tt)) tt=baseT+(i+1)/n*baseD;
    } else {
      tt=baseT+(i+1)/n*baseD;
    }
    S.charT.push(tt);
  }
  rowEl.textContent='';
  rowEl.appendChild(frag);
  fitLine();
}
/* fixed-iteration autofit: shrink until the block fits its height budget */
function fitLine(){
  curEl.style.fontSize='';
  if(!S.spans.length) return;
  var gcs=window.getComputedStyle;
  var base=parseFloat(gcs(curEl).fontSize)||28;
  var maxH=Math.max(56,Math.min(H*0.30,320));
  var size=base, ok=false;
  for(var i=0;i<18;i++){
    curEl.style.fontSize=size+'px';
    if(curEl.scrollHeight<=maxH+1){ ok=true; break; }
    size*=0.90;
    if(size<11){ curEl.style.fontSize='11px'; break; }
  }
  if(!ok) curEl.style.fontSize=Math.max(11,size)+'px';
  S.fitSize=parseFloat(gcs(curEl).fontSize)||base;
}
var litTarget=-1;
function karaoke(){
  var n=S.spans.length;
  if(!n){ return; }
  var k=0;
  for(var i=0;i<n;i++){ if(S.charT[i]<=S.t+0.0005) k=i+1; else break; }
  if(k===S.lit) return;
  var from=S.lit<0?0:Math.min(S.lit,k);
  var to=Math.max(S.lit<0?0:S.lit,k);
  for(var j=from;j<to;j++){ if(S.spans[j]) S.spans[j].className=(j<k?'ch on':'ch'); }
  S.lit=k;
  for(var q=0;q<n;q++) S.spans[q].classList.toggle('now',q===k-1);
}

window.addEventListener('message',function(e){
  var d=e.data; if(!d||d.__c100!==1) return;
  var p=d.payload||{};
  if(d.type==='init'){ try{ onInit(p); }catch(err){ S.err=String(err&&err.message||err); } }
  else if(d.type==='tick'){
    var t=Number(p.time); if(isFinite(t)) S.t=t;
    S.playing=(p.playing!==false);
  }
  else if(d.type==='beat'){ beatLv=Math.min(1,Math.max(beatLv,clampNum(p.level,0.6))); }
  else if(d.type==='live'){
    live.bass=Math.min(1,Math.max(0,clampNum(p.bass,0)));
    live.mid=Math.min(1,Math.max(0,clampNum(p.mid,0)));
    live.treble=Math.min(1,Math.max(0,clampNum(p.treble,0)));
    live.level=Math.min(1,Math.max(0,clampNum(p.level,0)));
  }
});

var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  var js0=(window.performance&&performance.now)?performance.now():Date.now();
  var dt=last?Math.min(0.25,(ts-last)/1000):0.016; last=ts;
  if(S.playing) S.t+=dt;
  anim+=dt;
  beatLv*=Math.pow(0.0025,dt); if(beatLv<0.001) beatLv=0;
  var i=findIdx(S.t);
  if(i!==S.idx){ S.idx=i; buildLine(); updateCount(); }
  karaoke();
  if(S.dur>0){
    var pr=Math.max(0,Math.min(1,S.t/S.dur));
    barFill.style.width=(pr*100).toFixed(2)+'%';
  }
  render(dt);
  S.frames++;
  S.js=((window.performance&&performance.now)?performance.now():Date.now())-js0;
}
window.__stage=function(){
  return {lines:S.lines.length, idx:S.idx, t:S.t, playing:!!S.playing, frames:S.frames, js:S.js, err:S.err||'', text:S.text||'', gl:false, rm:!!reduced};
};
window.addEventListener('resize',resize);
resize();
buildLine(); updateCount();
requestAnimationFrame(frame);
})();
</script>
</body>
