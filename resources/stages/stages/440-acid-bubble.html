<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>泡泡幻灯机</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0509; overflow: hidden; }
  #root { position: fixed; inset: 0; }
  #oil { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #por { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; display: none;
    filter: invert(1) grayscale(1) contrast(2.4) brightness(.95) blur(.3px);
    mix-blend-mode: overlay; opacity: .34; }
  #por.on { display: block; }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .16; mix-blend-mode: overlay;
    background-repeat: repeat; background-size: 128px 128px; }
  #iris { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(52% 46% at 50% 46%, rgba(255,190,120,.07) 0%, rgba(255,80,150,.05) 46%, rgba(0,0,0,0) 72%),
                radial-gradient(closest-side, rgba(0,0,0,0) 84%, rgba(255,120,60,.10) 92%, rgba(255,60,140,.16) 100%); }
  #typ { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #typ text { font-family: "Arial Black", "Impact", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-weight: 900; paint-order: stroke; stroke-linejoin: round; stroke-linecap: round; }
  #typ .ch { transition: fill .16s linear; }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 40%, rgba(6,2,6,.55) 78%, rgba(4,1,4,.9) 100%); }
  #lyr { position: absolute; left: 0; right: 0; bottom: 0; top: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding: 0 6vw 9vh; box-sizing: border-box; pointer-events: none;
    background: linear-gradient(to top, rgba(6,2,8,.82) 0%, rgba(6,2,8,.55) 22%, rgba(6,2,8,0) 52%); }
  .ctx { font: 700 clamp(13px, 1.5vw, 20px)/1.4 "Helvetica Neue", Arial, sans-serif; letter-spacing: .14em;
    color: rgba(255, 228, 200, .45); max-width: 84vw; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx.prev { margin-bottom: 1.1vh; }
  .ctx.next { margin-top: 1.4vh; }
  #cur { text-align: center; max-width: 92vw; color: #ffeacd; letter-spacing: .02em;
    font-family: "Arial Black", "Impact", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-weight: 900; line-height: 1.16; text-wrap: balance;
    text-shadow: 0 0 18px rgba(255,90,150,.30), 0 .06em 0 rgba(40,0,26,.85); }
  #cur .ch { display: inline-block; color: rgba(255,236,214,.26); -webkit-text-stroke: .022em rgba(255,214,190,.5);
    transform: translateY(calc(var(--glow) * -0.05em)) scale(calc(1 + var(--glow) * 0.05));
    transition: color .13s linear, text-shadow .13s linear; }
  #cur .ch.on { color: #fff3e2; -webkit-text-stroke: .022em rgba(255,120,170,.75);
    text-shadow: 0 0 .22em rgba(255,120,180,.65), 0 0 .5em rgba(120,220,255,.30), 0 .05em 0 rgba(60,0,30,.9); }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font: 700 clamp(14px, 1.8vw, 22px)/1.5 "Helvetica Neue", Arial, sans-serif; letter-spacing: .3em;
    color: rgba(255, 226, 196, .5); text-align: center; padding: 0 10vw; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root">
  <canvas id="oil"></canvas>
  <img id="por" alt="">
  <svg id="typ" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div id="iris"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="lyr">
    <div class="ctx prev" id="prev"></div>
    <div id="cur"></div>
    <div class="ctx next" id="next"></div>
  </div>
  <div id="empty">这首歌没有歌词<br><span style="font-size:.62em;letter-spacing:.18em">L I Q U I D &nbsp;&nbsp; L I G H T &nbsp;&nbsp; S H O W</span></div>
</div>
<script>
var W = 1440, H = 900;
var STATE = { lines: [], t: 0, playing: true, idx: -1, text: '', accent: [255, 120, 90], dur: 0, beat: 0, level: 0, bass: 0, liveSeen: false };
var FRAMES = 0, JSMS = 0, ERR = '';
var RM = false;
try { RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { console.error('[440] rm', e); }

window.__stage = function () {
  return { lines: STATE.lines.length, idx: STATE.idx, t: STATE.t, playing: STATE.playing,
    frames: FRAMES, js: JSMS, err: ERR, text: STATE.text, gl: false, rm: RM };
};

var cvs = document.getElementById('oil');
var ctx = cvs.getContext('2d');
var elCur = document.getElementById('cur'), elPrev = document.getElementById('prev'), elNext = document.getElementById('next'), elEmpty = document.getElementById('empty');

function postReady() {
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (e) { console.error('[440] ready', e); }
}
var readySent = false;
function readyOnce() { if (readySent) return; readySent = true; postReady(); }
setTimeout(readyOnce, 700);

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function resize() {
  var d = window.devicePixelRatio || 1;
  var w = Math.floor(window.innerWidth || 0), h = Math.floor(window.innerHeight || 0);
  if (!w || !h || !isFinite(w) || !isFinite(h)) { w = 1440; h = 900; }
  W = w; H = h;
  var dpr = clamp(d, 1, 2);
  cvs.width = Math.max(1, Math.floor(w * dpr));
  cvs.height = Math.max(1, Math.floor(h * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintBackdrop();
  buildRings();
  if (STATE.idx >= 0) renderLine(true);
}
window.addEventListener('resize', resize);

var T0 = performance.now();
var SPR = [];

function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
  if (s === 0) { var g = Math.round(l * 255); return [g, g, g]; }
  var q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  function hue(x) {
    if (x < 0) x += 1; if (x > 1) x -= 1;
    if (x < 1 / 6) return p + (q - p) * 6 * x;
    if (x < 1 / 2) return q;
    if (x < 2 / 3) return p + (q - p) * (2 / 3 - x) * 6;
    return p;
  }
  return [Math.round(hue(h + 1 / 3) * 255), Math.round(hue(h) * 255), Math.round(hue(h - 1 / 3) * 255)];
}

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) {
    var d = mx - mn;
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}

function makeSprite(rgb, size) {
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  var cc = c.getContext('2d');
  var g = cc.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  var r = rgb[0], gr = rgb[1], b = rgb[2];
  g.addColorStop(0, 'rgba(' + r + ',' + gr + ',' + b + ',1)');
  g.addColorStop(.35, 'rgba(' + r + ',' + gr + ',' + b + ',.72)');
  g.addColorStop(.68, 'rgba(' + r + ',' + gr + ',' + b + ',.28)');
  g.addColorStop(1, 'rgba(' + r + ',' + gr + ',' + b + ',0)');
  cc.fillStyle = g;
  cc.fillRect(0, 0, size, size);
  return c;
}

function buildPalette() {
  var a = STATE.accent;
  var hsl = rgb2hsl(a[0], a[1], a[2]);
  var base = isFinite(hsl[0]) ? hsl[0] : 330;
  var hues = [base - 18, base + 52, base + 118, base + 186, base + 254, base + 312];
  SPR = [];
  for (var i = 0; i < hues.length; i++) SPR.push(makeSprite(hsl2rgb(hues[i], .95, i % 2 ? .46 : .38), 192));
  STATE.hues = hues;
}
buildPalette();

function paintBackdrop() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#080409';
  ctx.fillRect(0, 0, W, H);
}

function draw(now) {
  var t = (now - T0) / 1000;
  var lv = clamp(STATE.level * .55 + STATE.bass * .35 + STATE.beat * .8, 0, 1.2);
  paintBackdrop();
  ctx.globalCompositeOperation = 'lighter';
  var R = Math.max(W, H) * .62;
  var n = RM ? 5 : 9;
  for (var i = 0; i < n; i++) {
    var s = SPR[i % SPR.length];
    if (!s) continue;
    var ph = i * 1.71;
    var wob = RM ? 0 : 1;
    var x = W * (.5 + .44 * Math.sin(t * (.11 + i * .017) + ph) * wob);
    var y = H * (.5 + .46 * Math.cos(t * (.13 + i * .021) + ph * 1.4) * wob);
    var rad = R * (.30 + .19 * Math.sin(t * (.21 + i * .03) + ph * 2.1)) * (1 + lv * .18);
    var sq = .55 + .45 * Math.abs(Math.sin(t * .17 + i));
    rad = Math.max(24, rad);
    ctx.globalAlpha = .30 + .16 * Math.abs(Math.sin(t * .29 + ph));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(RM ? 0 : t * (.05 + i * .012) + ph);
    ctx.scale(1, sq);
    ctx.drawImage(s, -rad, -rad, rad * 2, rad * 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function pickIdx(t) {
  var L = STATE.lines, lo = 0, hi = L.length - 1, ans = -1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if ((L[mid].t || 0) <= t + 1e-4) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}

/* ---------- 泡泡字：圆弧 + 直排，两圈交替 ---------- */
var SVGNS = 'http://www.w3.org/2000/svg';
var ARC_RX = 1, ARC_RY = 1, ARC_TX = 0, ARC_TY = 0;
var ringA = [], ringB = [];

function polar(deg, rx, ry, cx, cy) {
  var rad = deg * Math.PI / 180;
  return [cx + Math.cos(rad) * rx, cy + Math.sin(rad) * ry];
}

function hueAt(i) {
  var h = (STATE.hues && STATE.hues.length) ? STATE.hues[i % STATE.hues.length] : (300 + i * 47);
  return ((h % 360) + 360) % 360;
}

function buildRings() {
  var typ = document.getElementById('typ');
  if (!typ) return;
  while (typ.firstChild) typ.removeChild(typ.firstChild);
  ringA = []; ringB = [];
  var portrait = H > W * 1.15;
  var rx = W * (portrait ? .42 : .44), ry = H * (portrait ? .34 : .44), cx = W * .5, cy = H * .5;
  var nm = (STATE.song || '').toUpperCase().replace(/\s+/g, ' ').trim();
  if (!nm) nm = 'LIQUID LIGHT SHOW';
  var minD = Math.min(W, H);
  var fsz = minD * (portrait ? .042 : .050);
  var per = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
  var cap = clamp(Math.floor(per / (fsz * 1.02)), 10, 30);
  var chars = nm.split('').filter(function (c) { return c !== ' '; }).slice(0, cap);
  var step = 360 / Math.max(1, chars.length);
  for (var i = 0; i < chars.length; i++) {
    var deg = -90 + i * step;
    var g = document.createElementNS(SVGNS, 'g');
    var txt = document.createElementNS(SVGNS, 'text');
    var hh = hueAt(i);
    txt.setAttribute('font-size', fsz.toFixed(1));
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('dominant-baseline', 'central');
    txt.setAttribute('font-weight', '900');
    txt.setAttribute('fill', 'hsla(' + hh.toFixed(0) + ',92%,72%,.10)');
    txt.setAttribute('stroke', 'hsla(' + hh.toFixed(0) + ',95%,68%,.60)');
    txt.setAttribute('stroke-width', (minD * .0026).toFixed(2));
    txt.textContent = chars[i];
    g.appendChild(txt);
    typ.appendChild(g);
    ringA.push({ g: g, txt: txt, deg: deg });
  }

  var inner = 'BUBBLE TYPE';
  var f2 = minD * .026;
  for (var j = 0; j < inner.length; j++) {
    var d2 = -90 + j * (360 / inner.length) + 9;
    var q = polar(d2, rx * .58, ry * .6, cx, cy);
    var t2 = document.createElementNS(SVGNS, 'text');
    t2.setAttribute('x', q[0].toFixed(1));
    t2.setAttribute('y', q[1].toFixed(1));
    t2.setAttribute('font-size', f2.toFixed(1));
    t2.setAttribute('text-anchor', 'middle');
    t2.setAttribute('dominant-baseline', 'central');
    t2.setAttribute('fill', 'hsla(' + hueAt(j + 3).toFixed(0) + ',90%,74%,.30)');
    t2.setAttribute('stroke', 'rgba(255,244,226,.22)');
    t2.setAttribute('stroke-width', (minD * .0016).toFixed(2));
    typ.appendChild(t2);
    t2.textContent = inner[j];
    ringB.push({ txt: t2, deg: d2, x: q[0], y: q[1] });
  }

  /* 边缘超大泡泡字，把画幅两侧的空隙吃掉 */
  var edge = nm.split('').filter(function (c) { return c !== ' '; });
  if (!edge.length) edge = ['P', 'S', 'Y', 'C', 'H'];
  var cols = [W * .045, W * .955, W * .035, W * .965];
  var count = portrait ? 3 : 4;
  for (var e = 0; e < count; e++) {
    var te = document.createElementNS(SVGNS, 'text');
    var ch = edge[(e * 5 + 1) % edge.length];
    var xx = cols[e % cols.length];
    var yy = H * (.16 + e * .21);
    var fs3 = minD * (portrait ? .26 : .30);
    te.setAttribute('x', xx.toFixed(1));
    te.setAttribute('y', yy.toFixed(1));
    te.setAttribute('font-size', fs3.toFixed(1));
    te.setAttribute('text-anchor', 'middle');
    te.setAttribute('dominant-baseline', 'central');
    te.setAttribute('font-weight', '900');
    te.setAttribute('fill', 'hsla(' + hueAt(e + 1).toFixed(0) + ',95%,66%,.055)');
    te.setAttribute('stroke', 'hsla(' + hueAt(e + 1).toFixed(0) + ',96%,70%,.30)');
    te.setAttribute('stroke-width', (minD * .004).toFixed(2));
    te.setAttribute('transform', 'rotate(' + (-12 + e * 7) + ' ' + xx.toFixed(1) + ' ' + yy.toFixed(1) + ')');
    te.textContent = ch;
    typ.appendChild(te);
  }

  ARC_RX = rx; ARC_RY = ry; ARC_TX = cx; ARC_TY = cy;
}

function spinRings(now) {
  if (!ringA.length) return;
  var t = (now - T0) / 1000;
  var drift = RM ? 0 : t * 5.5;
  var beat = clamp(STATE.beat, 0, 1);
  for (var i = 0; i < ringA.length; i++) {
    var o = ringA[i];
    var p = polar(o.deg + drift, ARC_RX, ARC_RY, ARC_TX, ARC_TY);
    o.g.setAttribute('transform', 'translate(' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ')');
    var sc = 1 + (RM ? 0 : .15 * Math.sin(t * .9 + i * .6)) + beat * .18;
    o.txt.setAttribute('transform', 'scale(' + sc.toFixed(3) + ')');
    if (!RM) o.txt.setAttribute('stroke-opacity', (.20 + .30 * Math.abs(Math.sin(t * .5 + i * .4))).toFixed(3));
  }
  for (var j = 0; j < ringB.length; j++) {
    var b = ringB[j];
    b.txt.setAttribute('transform', RM ? '' : 'rotate(' + (-(b.deg + drift * .55) - 90).toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + ')');
  }
}

/* ---------- 逐字歌词 ---------- */
var SPANS = [];
function buildChars(line, time) {
  elCur.textContent = '';
  SPANS = [];
  var txt = (line && typeof line.text === 'string') ? line.text : '';
  if (!txt) return;
  var chars = txt.split('');
  var timings = null;
  if (line && Array.isArray(line.chars) && line.chars.length) {
    timings = [];
    for (var i = 0; i < chars.length; i++) {
      var c = line.chars[i];
      timings.push(c && typeof c.t === 'number' && isFinite(c.t) ? c.t : null);
    }
  }
  var start = +line.t || 0, end = start + Math.max(.4, +line.dur || (chars.length * .28));
  for (var k = 0; k < chars.length; k++) {
    var s = document.createElement('span');
    s.className = 'ch';
    s.textContent = chars[k];
    s.style.setProperty('--glow', '0');
    if (timings) {
      var at = timings[k];
      s.dataset.t = String(at === null ? start + (k / chars.length) * (end - start) : at);
    } else {
      s.dataset.t = String(start + (k / chars.length) * (end - start));
    }
    s.dataset.e = String(Math.min(end, (+s.dataset.t) + Math.max(.05, (end - start) / chars.length)));
    elCur.appendChild(s);
    SPANS.push(s);
  }
}

function paintChars(t) {
  for (var i = 0; i < SPANS.length; i++) {
    var s = SPANS[i];
    var on = t >= (+s.dataset.t) - .02;
    var st = on ? '1' : '0';
    if (s.dataset.on !== st) {
      s.dataset.on = st;
      s.style.setProperty('--glow', on ? '1' : '0');
      if (on) s.classList.add('on'); else s.classList.remove('on');
    }
  }
}

function renderLine(force) {
  var L = STATE.lines, i = STATE.idx;
  var line = (i >= 0 && L[i]) ? L[i] : null;
  var txt = line ? (typeof line.text === 'string' ? line.text : '') : '';
  STATE.text = txt;
  if (!force && txt === renderLine._last && (line && line === renderLine._line)) return;
  renderLine._last = txt; renderLine._line = line;
  var len = txt.length;
  var fs = len <= 10 ? 'clamp(26px, 8.6vmin, 92px)' : len <= 18 ? 'clamp(22px, 6.6vmin, 72px)'
         : len <= 28 ? 'clamp(18px, 5.2vmin, 56px)' : len <= 44 ? 'clamp(14px, 4.0vmin, 44px)'
         : 'clamp(12px, 3.0vmin, 32px)';
  elCur.style.fontSize = fs;
  buildChars(line, STATE.t);
  elPrev.textContent = (i > 0 && L[i - 1]) ? (L[i - 1].text || '') : '';
  elNext.textContent = (i >= 0 && L[i + 1]) ? (L[i + 1].text || '') : '';
  paintChars(STATE.t);
}

function loop(now) {
  readyOnce();
  FRAMES++;
  var t0 = performance.now();
  try {
    var t = STATE.t;
    var ni = pickIdx(t);
    if (ni !== STATE.idx) { STATE.idx = ni; renderLine(true); }
    paintChars(t);
    draw(now);
    spinRings(now);
    STATE.beat *= .93; STATE.level *= .96; STATE.bass *= .95;
  } catch (e) { ERR = String(e && e.message || e); console.error('[440] frame', e); }
  JSMS = performance.now() - t0;
  requestAnimationFrame(loop);
}

/* ---------- 胶片颗粒（程序化生成，零外部资源） ---------- */
(function grainTex() {
  try {
    var n = document.createElement('canvas');
    n.width = n.height = 128;
    var nc = n.getContext('2d');
    if (!nc || typeof nc.createImageData !== 'function' || typeof n.toDataURL !== 'function') return;
    var img = nc.createImageData(128, 128);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = (Math.random() * 255) | 0;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    nc.putImageData(img, 0, 0);
    var gEl = document.getElementById('grain');
    if (gEl) gEl.style.backgroundImage = 'url(' + n.toDataURL('image/png') + ')';
  } catch (e) { console.error('[440] grain', e); }
})();

/* ---------- 高反差负片肖像 ---------- */
var por = document.getElementById('por');
var lastCover = '';
por.onerror = function () { por.classList.remove('on'); por.style.display = 'none'; console.error('[440] cover failed'); };
por.onload = function () { por.classList.add('on'); por.style.display = 'block'; };

function loadPortrait(url) {
  try {
    if (!url || typeof url !== 'string') { por.classList.remove('on'); por.style.display = 'none'; lastCover = ''; return; }
    if (url === lastCover) return;
    lastCover = url;
    por.classList.remove('on');
    por.style.display = 'none';
    por.removeAttribute('src');
    por.src = url;
  } catch (e) { console.error('[440] portrait', e); por.style.display = 'none'; }
}

window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') {
      var p = d.payload || {};
      var song = p.song || {};
      var nm = song.name;
      STATE.song = (typeof nm === 'string' && nm) ? nm : (Array.isArray(nm) ? String(nm[0] || '') : '');
      var lines = Array.isArray(p.lines) ? p.lines : [];
      var clean = [];
      for (var li = 0; li < lines.length && li < 4000; li++) {
        var L0 = lines[li];
        if (!L0 || typeof L0 !== 'object') continue;
        var tt = +L0.t; if (!isFinite(tt)) tt = 0;
        if (tt < 0) tt = 0;
        var d0 = +L0.dur;
        clean.push({ t: tt, dur: (isFinite(d0) && d0 > 0) ? d0 : 0,
          text: (typeof L0.text === 'string') ? L0.text : (L0.text == null ? '' : String(L0.text)),
          chars: Array.isArray(L0.chars) ? L0.chars : null });
      }
      clean.sort(function (a, b) { return a.t - b.t; });
      STATE.lines = clean;
      STATE.dur = +p.duration || 0;
      if (Array.isArray(p.accent) && p.accent.length >= 3) {
        STATE.accent = [clamp(+p.accent[0] || 0, 0, 255), clamp(+p.accent[1] || 0, 0, 255), clamp(+p.accent[2] || 0, 0, 255)];
        buildPalette();
      }
      STATE.playing = (p.playing === false) ? false : true;
      renderLine._last = null; renderLine._line = null;
      var has = STATE.lines.length > 0;
      elEmpty.style.display = has ? 'none' : 'flex';
      document.getElementById('lyr').style.display = has ? 'flex' : 'none';
      STATE.idx = pickIdx(STATE.t); renderLine(true);
      loadPortrait(song.cover);
      buildRings();
    } else if (d.type === 'tick') {
      var q = d.payload || {};
      if (typeof q.time === 'number' && isFinite(q.time)) STATE.t = Math.max(0, q.time);
      if (typeof q.playing === 'boolean') STATE.playing = q.playing;
    } else if (d.type === 'beat') {
      var b = d.payload || {};
      STATE.beat = clamp(+b.level || 0, 0, 1);
    } else if (d.type === 'live') {
      var v = d.payload || {};
      STATE.liveSeen = true;
      if (typeof v.level === 'number') STATE.level = clamp(v.level, 0, 1);
      if (typeof v.bass === 'number') STATE.bass = clamp(v.bass, 0, 1);
    }
  } catch (e) { ERR = String(e && e.message || e); console.error('[440] msg', e); }
});

resize();
requestAnimationFrame(loop);
</script>
