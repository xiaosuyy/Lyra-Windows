<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>545 · 恒星日珥</title>
<style>
  html,body{margin:0;height:100%;background:#040203;overflow:hidden;}
  body{
    color:#ffe8cf;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  canvas{position:fixed;left:0;top:0;display:block;}
  #gl{z-index:0;background:#040203;}
  #fx{z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.92;}
  #scrim{
    position:fixed;left:0;right:0;bottom:0;height:40vh;z-index:2;pointer-events:none;
    background:linear-gradient(to top,
      rgba(5,1,0,.58) 0%,rgba(5,1,0,.34) 26%,rgba(5,1,0,.14) 55%,rgba(5,1,0,0) 100%);
  }

  /* ---------- 歌词 ---------- */
  #lyr{
    position:fixed;z-index:3;left:3vw;right:3vw;bottom:11vh;
    padding:3.2vh 4vw 2.4vh;
    text-align:center;pointer-events:none;
    font-weight:800;
    font-size:clamp(25px,4.1vw,66px);
    line-height:1.24;
    letter-spacing:.035em;
    filter:drop-shadow(0 3px 18px rgba(0,0,0,.85));
    transition:opacity .5s ease;
  }
  #lyr::before,#lyr::after{
    content:"";position:absolute;top:50%;width:clamp(16px,3vw,54px);height:1px;
    background:linear-gradient(90deg,rgba(255,150,70,0),rgba(255,176,96,.45));
    opacity:.7;
  }
  #lyr::before{left:0;transform:rotate(-24deg);}
  #lyr::after{right:0;transform:rotate(24deg) scaleX(-1);}
  #lyr .ch{
    display:inline-block;
    color:rgba(255,232,212,.34);
    text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.85);
    transform:translateY(3px) scale(.985);
    opacity:.92;
    transition:color .16s ease,text-shadow .2s ease,transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s ease;
    will-change:transform,color;
  }
  #lyr .ch.on{
    color:#fff8ec;
    opacity:1;
    transform:translateY(-2px) scale(1.015);
    text-shadow:
      0 0 6px rgba(255,244,220,.95),
      0 0 18px rgba(255,190,105,.85),
      0 0 46px rgba(255,96,18,.55),
      0 0 90px rgba(255,52,0,.30);
  }
  #lyr .ch.blank{width:.42em;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;
       font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
       font-size:10px;letter-spacing:.22em;color:rgba(255,182,120,.56);
       text-transform:uppercase;}
  #hud .tag{position:absolute;white-space:nowrap;}
  #hud .tl{left:clamp(16px,2.4vw,38px);top:clamp(14px,2.2vh,30px);}
  #hud .tl b{color:rgba(255,226,190,.9);font-weight:600;letter-spacing:.30em;}
  #hud .tl i{font-style:normal;color:rgba(255,140,80,.5);margin-left:.9em;}
  #hud .tr{right:clamp(16px,2.4vw,38px);top:clamp(14px,2.2vh,30px);color:rgba(255,214,172,.80);
           font-variant-numeric:tabular-nums;}
  #hud .bl{left:clamp(16px,2.4vw,38px);bottom:clamp(14px,2.2vh,30px);max-width:46vw;
           overflow:hidden;text-overflow:ellipsis;}
  #hud .br{right:clamp(16px,2.4vw,38px);bottom:clamp(14px,2.2vh,30px);}
  #hud .bar{position:absolute;top:clamp(38px,6vh,64px);left:50%;transform:translateX(-50%);
            width:min(56vw,720px);height:1px;background:rgba(255,160,90,.10);overflow:hidden;}
  #hud .bar span{display:block;height:100%;width:0;
            background:linear-gradient(90deg,rgba(255,120,40,.1),rgba(255,214,160,.85));
            box-shadow:0 0 8px rgba(255,140,60,.7);}
  #hud .cross{position:absolute;width:14px;height:14px;opacity:.42;}
  #hud .cross::before,#hud .cross::after{content:"";position:absolute;background:rgba(255,180,120,.65);}
  #hud .cross::before{left:6px;top:0;width:1px;height:14px;}
  #hud .cross::after{top:6px;left:0;height:1px;width:14px;}
  #hud .c1{left:clamp(12px,1.6vw,26px);top:50%;transform:translateY(-50%);}
  #hud .c2{right:clamp(12px,1.6vw,26px);top:50%;transform:translateY(-50%);}
  #hud .tickmarks{position:absolute;left:50%;bottom:clamp(44px,7vh,72px);transform:translateX(-50%);
                  display:flex;gap:22px;opacity:.3;}
  #hud .tickmarks i{display:block;width:1px;height:5px;background:rgba(255,180,120,.7);}
  #hud .tickmarks i:nth-child(3){height:9px;}

  /* ---------- 空状态 ---------- */
  #empty{
    position:fixed;z-index:3;inset:0;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:18px;
    pointer-events:none;text-align:center;padding:0 8vw;
  }
  #empty.show{display:flex;}
  #empty .dot{
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle,#fff3dc 0%,#ffb060 40%,rgba(255,90,10,0) 72%);
    box-shadow:0 0 22px rgba(255,150,60,.85),0 0 60px rgba(255,80,0,.45);
    animation:pulse 2.6s ease-in-out infinite;
  }
  #empty .txt{
    font-size:clamp(15px,1.5vw,22px);letter-spacing:.28em;font-weight:300;
    color:rgba(255,206,166,.78);text-shadow:0 0 22px rgba(255,110,30,.35);
  }
  #empty .sub{
    font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;letter-spacing:.3em;
    color:rgba(255,150,90,.42);text-transform:uppercase;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.5);opacity:1}}

  @media (max-width:760px){
    #lyr{left:6vw;right:6vw;bottom:16vh;font-size:clamp(21px,6.2vw,40px);line-height:1.3;}
    #lyr::before,#lyr::after{display:none;}
    #hud .bar{width:64vw;}
    #hud .bl{max-width:60vw;}
    #hud .tickmarks{display:none;}
    #hud .c1,#hud .c2{display:none;}
  }
  @media (prefers-reduced-motion: reduce){
    #lyr .ch{transition-duration:.01s;}
    #empty .dot{animation:none;}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="scrim"></div>
<div id="lyr"></div>
<div id="empty">
  <div class="dot"></div>
  <div class="txt">此处没有歌词</div>
  <div class="sub">quiet corona · solar wind only</div>
</div>
<div id="hud">
  <div class="tag tl"><b>SDO / AIA 304</b><i>545</i></div>
  <div class="tag tr" id="tc">00:00:00</div>
  <div class="tag bl" id="song">—</div>
  <div class="tag br">恒星日珥 · 545</div>
  <div class="bar"><span id="prog"></span></div>
  <div class="cross c1"></div>
  <div class="cross c2"></div>
  <div class="tickmarks"><i></i><i></i><i></i><i></i><i></i></div>
</div>
<script>
"use strict";

/* =====================================================================
   545 · 恒星日珥 — 近距离直视太阳表面沸腾米粒组织与巨型日珥喷发
   自检口 / 状态 / ready / 协议
   ===================================================================== */

var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
var RM = false;
try { RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}

var SONG = { name: "", cover: "", accent: [170, 150, 255] };
var ACCENT = [170, 150, 255];
var DURATION = 0;
var GL_TAG = true;                 /* 本形态使用 WebGL */

window.__stage = function () {
  var i = S.idx;
  var ln = (i >= 0 && S.lines && S.lines[i]) ? S.lines[i] : null;
  return {
    lines: (S.lines && S.lines.length) ? S.lines.length : 0,
    idx: (typeof i === "number" && isFinite(i)) ? i : -1,
    t: (typeof S.t === "number" && isFinite(S.t)) ? S.t : 0,
    playing: !!S.playing,
    frames: S.frames,
    js: Math.round(S.js * 100) / 100,
    err: S.err || "",
    text: (ln && ln.text != null) ? String(ln.text) : "",
    gl: GL_TAG,
    rm: RM
  };
};

/* ---------- ready：第一个 rAF 无条件发一次 ---------- */
var readySent = false;
function sendReady() {
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) {}
  /* ready 已发出，之后才做 GL 编译等重活 */
  setTimeout(function () {
    try { boot(); } catch (e) { reportErr(e); }
  }, 30);
}
requestAnimationFrame(sendReady);
setTimeout(sendReady, 800);

/* ---------- 通用工具 ---------- */
var errStamp = 0;
function reportErr(e) {
  var msg = String((e && (e.message || e)) || "unknown");
  S.err = msg;
  var now = Date.now();
  if (now - errStamp > 1000) { errStamp = now; try { console.error("[545]", e); } catch (e2) {} }
}
function clamp(v, a, b) { v = Number(v); if (!isFinite(v)) return a; return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sanitizeAccent(a) {
  if (!Array.isArray(a) || a.length < 3) return [170, 150, 255];
  var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
  if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return [170, 150, 255];
  r = Math.round(clamp(r, 0, 255)); g = Math.round(clamp(g, 0, 255)); b = Math.round(clamp(b, 0, 255));
  if (r + g + b < 14) return [170, 150, 255];
  return [r, g, b];
}
function rgbCss(c, alpha) {
  var r = Math.round(clamp(c && c[0], 0, 255));
  var g = Math.round(clamp(c && c[1], 0, 255));
  var b = Math.round(clamp(c && c[2], 0, 255));
  if (alpha == null) return "rgb(" + r + "," + g + "," + b + ")";
  return "rgba(" + r + "," + g + "," + b + "," + clamp(alpha, 0, 1) + ")";
}
function tri(v) { var f = v - Math.floor(v); return 1 - Math.abs(2 * f - 1); }
function isNum(v) { return typeof v === "number" && isFinite(v); }

/* ---------- 尺寸（0 / NaN 回退 1440×900） ---------- */
var W = 1440, H = 900, DPR = 1;
function viewSize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (!isFinite(w) || w <= 0) w = 1440;
  if (!isFinite(h) || h <= 0) h = 900;
  W = w; H = h;
  DPR = Math.min(1.5, window.devicePixelRatio || 1);
  if (!isFinite(DPR) || DPR <= 0) DPR = 1;
}

/* ---------- 交互转发 ---------- */
window.addEventListener("mousemove", function () {
  try { parent.postMessage({ __c100: 1, type: "activity" }, "*"); } catch (e) {}
}, { passive: true });
window.addEventListener("pointerdown", function () {
  try { parent.postMessage({ __c100: 1, type: "activity" }, "*"); } catch (e) {}
}, { passive: true });
window.addEventListener("keydown", function (ev) {
  var k = ev.key;
  if (k === " " || k === "Spacebar" || ev.code === "Space") {
    try { parent.postMessage({ __c100: 1, type: "key", payload: { key: "Space" } }, "*"); } catch (e) {}
    ev.preventDefault();
  }
  try { parent.postMessage({ __c100: 1, type: "activity" }, "*"); } catch (e) {}
});
"use strict";

/* =====================================================================
   画布 / WebGL 初始化（重活推迟到 ready 之后）
   ===================================================================== */

var glCv = document.getElementById("gl");
var fxCv = document.getElementById("fx");
var fx = fxCv.getContext("2d", { alpha: true });
var gl2d = null;
var gl = null;
var glOK = false;
var prog = null;
var U = {};
var uTime0 = 0;

function resizeCanvases() {
  viewSize();
  try {
    glCv.width = Math.max(1, Math.round(W * DPR));
    glCv.height = Math.max(1, Math.round(H * DPR));
    glCv.style.width = W + "px";
    glCv.style.height = H + "px";
    fxCv.width = Math.max(1, Math.round(W * DPR));
    fxCv.height = Math.max(1, Math.round(H * DPR));
    fxCv.style.width = W + "px";
    fxCv.style.height = H + "px";
    fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  } catch (e) { reportErr(e); }
  measureSpans();
}
window.addEventListener("resize", function () { try { resizeCanvases(); } catch (e) { reportErr(e); } });

var VERT = [
  "attribute vec2 aPos;",
  "void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }"
].join("\n");

var FRAG = [
  "#ifdef GL_FRAGMENT_PRECISION_HIGH",
  "precision highp float;",
  "#else",
  "precision mediump float;",
  "#endif",
  "uniform vec2 uRes;",
  "uniform float uTime;",
  "uniform vec2 uShake;",
  "uniform vec3 uAccent;",
  "uniform float uBass;",
  "uniform float uMid;",
  "uniform float uTreble;",
  "uniform float uFlare;",
  "uniform vec2 uFlarePos;",
  "uniform float uDive;",
  "uniform float uRM;",

  "float hash21(vec2 p){",
  "  p = fract(p * vec2(123.34, 456.21));",
  "  p += dot(p, p + 45.32);",
  "  return fract(p.x * p.y);",
  "}",
  "float vnoise(vec2 p){",
  "  vec2 i = floor(p), f = fract(p);",
  "  vec2 u = f*f*(3.0-2.0*f);",
  "  float a = hash21(i);",
  "  float b = hash21(i + vec2(1.0, 0.0));",
  "  float c = hash21(i + vec2(0.0, 1.0));",
  "  float d = hash21(i + vec2(1.0, 1.0));",
  "  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);",
  "}",
  "float fbm(vec2 p){",
  "  float v = 0.0, a = 0.5;",
  "  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);",
  "  for(int i = 0; i < 5; i++){ v += a * vnoise(p); p = m * p; a *= 0.5; }",
  "  return v;",
  "}",
  "float fbm3(vec2 p){",
  "  float v = 0.0, a = 0.5;",
  "  mat2 m = mat2(1.7, 1.1, -1.1, 1.7);",
  "  for(int i = 0; i < 3; i++){ v += a * vnoise(p); p = m * p; a *= 0.5; }",
  "  return v;",
  "}",
  "float ridge3(vec2 p){",
  "  float v = 0.0, a = 0.5;",
  "  mat2 m = mat2(1.7, -1.1, 1.1, 1.7);",
  "  for(int i = 0; i < 3; i++){ v += a * (1.0 - abs(2.0 * vnoise(p) - 1.0)); p = m * p; a *= 0.5; }",
  "  return v;",
  "}",
  "float arch(vec2 p, float cx, float baseY, float rad, float seed, float width, float wind){",
  "  vec2 c = vec2(cx, baseY - rad * 0.35);",
  "  vec2 q = p - c;",
  "  float ang = atan(q.y, q.x);",
  "  float r = length(q);",
  "  float turb = fbm3(vec2(ang * 2.2 + seed * 7.0, uTime * 0.16 + seed)) - 0.5;",
  "  float rw = rad * (1.0 + turb * 0.24 * wind + 0.05 * sin(ang * 5.0 + seed * 3.0 + uTime * 0.7));",
  "  float dd = abs(r - rw);",
  "  float glow = exp(-dd / width);",
  "  float fil = ridge3(vec2(ang * 9.0 + seed * 13.0, r * 70.0 - uTime * 1.4 + seed * 5.0));",
  "  glow *= 0.20 + fil * 1.20;",
  "  glow *= smoothstep(-0.02, 0.06, p.y - baseY + 0.02);",
  "  return glow;",
  "}",

  "void main(){",
  "  vec2 uv = gl_FragCoord.xy / uRes;",
  "  float aspect = uRes.x / max(1.0, uRes.y);",
  "  vec2 p = (uv - 0.5) * vec2(aspect, 1.0);",
  "  p += uShake;",

  "  float limb = -0.03 + 0.12 * p.x * p.x + 0.012 * sin(p.x * 2.3 + 1.0);",
  "  float depth = limb - p.y;",
  "  vec3 acc = mix(uAccent, vec3(0.52, 0.34, 1.0), 0.30);",
  "  vec3 col = vec3(0.006, 0.004, 0.013);",

  "  vec2 spc = p * 240.0;",
  "  vec2 sid = floor(spc);",
  "  vec2 sf = fract(spc) - 0.5;",
  "  vec2 soff = vec2(hash21(sid + 3.1), hash21(sid + 7.7)) - 0.5;",
  "  float son = step(0.9935, hash21(sid + 17.0));",
  "  float sdist = length(sf - soff * 0.62);",
  "  float stars = son * smoothstep(0.085, 0.0, sdist);",
  "  col += vec3(0.90, 0.86, 1.0) * stars * 0.55 * smoothstep(-0.02, 0.05, -depth);",

  "  float above = max(0.0, -depth);",
  "  float haze = exp(-above * 3.2);",
  "  float stream = fbm3(vec2(p.x * 13.0 + uTime * 0.10, p.y * 7.0 - uTime * 0.35));",
  "  col += mix(vec3(1.0, 0.32, 0.06), acc, 0.35) * haze * (0.30 + 0.55 * stream * stream) * (0.55 + uMid * 0.75);",

  "  float promScale = 1.0 + uDive * 0.80;",
  "  float pr = 0.0;",
  "  if(p.y > limb - 0.04){",
  "    pr += arch(p, 0.02 + uDive * 0.16, limb, 0.52 * promScale, 1.0, 0.012, 1.0) * 0.75;",
  "    pr += arch(p, -0.46, limb, 0.24 * promScale, 2.7, 0.011, 1.0) * 0.92;",
  "    pr += arch(p, 0.55, limb, 0.30 * promScale, 5.1, 0.013, 1.0) * 0.80;",
  "    pr += arch(p, -0.16, limb, 0.14 * promScale, 9.4, 0.008, 1.3) * 0.85;",
  "    pr += arch(p, 0.30, limb, 0.10 * promScale, 12.6, 0.006, 1.4) * 0.70;",
  "  }",
  "  float hot = 0.55 + 0.45 * uTreble;",
  "  vec3 promCol = mix(vec3(1.10, 0.22, 0.04), acc * 1.25, 0.42 + 0.28 * sin(uTime * 0.31));",
  "  float pbody = pr + pow(max(pr, 0.0), 0.40) * 0.20;",
  "  col += promCol * pbody * (1.25 + uBass * 1.6) * hot;",

  "  if(depth > 0.0){",
  "    float zoom = 1.0 + uDive * 0.50 + uBass * 0.05;",
  "    float persp = 1.0 / (0.10 + depth * 2.2);",
  "    vec2 sp = vec2(p.x * persp, persp) * 1.45 * zoom;",
  "    sp += vec2(0.0, -uTime * (0.30 + uBass * 0.55));",
  "    float boil = fbm(sp * 1.35 + vec2(uTime * 0.09, -uTime * 0.05));",
  "    vec2 warp = vec2(fbm(sp * 0.9 + 11.3 + boil * 1.6), fbm(sp * 0.9 - 4.7 + uTime * 0.07)) - 0.5;",
  "    vec2 gp = sp * 7.0 + warp * 2.3;",
  "    float g1 = fbm(gp);",
  "    float g2 = fbm(gp * 2.1 + 3.7);",
  "    float g3 = ridge3(gp * 0.55 + 8.2);",
  "    float cell = smoothstep(0.30, 0.78, g1 * 0.62 + g2 * 0.46 + g3 * 0.12);",
  "    cell = pow(cell, 0.85 + 0.5 * uBass);",
  "    float lane = smoothstep(0.05, 0.42, abs(g1 - 0.47));",
  "    float spots = smoothstep(0.60, 0.86, fbm(sp * 0.7 + 21.0));",
  "    vec3 surf = mix(vec3(0.16, 0.018, 0.003), vec3(1.35, 0.46, 0.07), cell);",
  "    surf = mix(surf, vec3(2.20, 1.35, 0.62), pow(cell, 3.0) * 0.55);",
  "    surf *= mix(0.55, 1.0, lane);",
  "    surf *= 1.0 - spots * 0.72;",
  "    surf = mix(vec3(1.35, 0.46, 0.10), surf, 0.45 + 0.55 * smoothstep(0.0, 0.05, depth));",
  "    surf += vec3(1.85, 0.62, 0.14) * exp(-depth * 20.0) * (1.55 + uBass * 0.90);",
  "    surf += acc * exp(-depth * 60.0) * 0.55;",
  "    surf = mix(surf, vec3(0.90, 0.22, 0.05), smoothstep(0.0, 0.035, depth) * 0.18);",
  "    col = mix(col, surf, smoothstep(-0.002, 0.006, depth));",
  "  } else {",
  "    col += vec3(1.40, 0.55, 0.16) * exp(-above * 20.0) * 1.15;",
  "  }",

  "  vec2 fd = p - uFlarePos;",
  "  float fr = length(fd * vec2(1.0, 1.2));",
  "  float burst = exp(-fr * 7.0) * uFlare;",
  "  float angF = atan(fd.y, fd.x);",
  "  float rayWobble = sin(angF * 4.0 + uTime * 0.6) * 1.3;",
  "  float rays = pow(abs(sin(angF * 3.2 + rayWobble + uTime * 0.8)), 34.0);",
  "  float rayFade = smoothstep(0.55, 0.05, fr);",
  "  float rayNoise = 0.45 + 0.85 * fbm3(vec2(angF * 3.0 + 2.0, uTime * 0.45));",
  "  col += vec3(1.60, 1.25, 0.95) * burst * (0.80 + rays * 3.2 * rayFade * rayNoise);",
  "  float sheen = exp(-abs(fd.x) * 190.0) * smoothstep(0.0, 0.35, fr) * uFlare;",
  "  col += vec3(1.15, 1.05, 1.00) * sheen * 1.15;",
  "  col += vec3(0.55, 0.45, 0.95) * exp(-fr * 2.0) * uFlare * 0.35;",

  "  col = 1.0 - exp(-col * 1.35);",
  "  float vig = smoothstep(1.25, 0.28, length((uv - 0.5) * vec2(aspect * 0.8, 1.0)));",
  "  col *= mix(0.62, 1.0, vig);",
  "  float grain = hash21(uv * uRes.xy + fract(uTime) * 100.0);",
  "  col += (grain - 0.5) * 0.022 * (1.0 - uRM * 0.6);",
  "  col = pow(max(col, 0.0), vec3(0.92));",
  "  gl_FragColor = vec4(col, 1.0);",

function shaderErr(kind, sh) {

  try { log = gl.getShaderInfoLog(sh) || ""; } catch (e) {}

function initGL() {

  var vs = gl.createShader(gl.VERTEX_SHADER);

  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) { shaderErr("vs", vs); return false; }

  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) { shaderErr("fs", fs); return false; }

  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {

  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    nc.width = Math.max(1, glCv.width);
    nc.height = Math.max(1, glCv.height);
    nc.style.width = glCv.style.width || (W + "px");
    nc.style.height = glCv.style.height || (H + "px");

function boot() {

/* =====================================================================
   歌词 / 协议

var lyrEl = document.getElementById("lyr");
var emptyEl = document.getElementById("empty");
var tcEl = document.getElementById("tc");
var songEl = document.getElementById("song");
var progEl = document.getElementById("prog");

var spans = [];
var curIdx = -2;
var lineEpoch = 0;

function idxAt(t) {
  var a = S.lines;
  if (!a || !a.length) return -1;
  var lo = 0, hi = a.length - 1, best = -1;
  while (lo <= hi) {
    var m = (lo + hi) >> 1;
    var mt = isNum(a[m] && a[m].t) ? a[m].t : 0;
    if (mt <= t + 0.02) { best = m; lo = m + 1; } else { hi = m - 1; }
  }
  return best;
}

function charTimes(line) {
  var text = (line && line.text != null) ? String(line.text) : "";
  var chars = Array.from(text);
  var n = chars.length;
  var out = new Array(n);
  var cs = (line && Array.isArray(line.chars)) ? line.chars : null;
  var dur = (line && isNum(line.dur) && line.dur > 0) ? line.dur : Math.max(2.4, n * 0.16);
  var j, rec, tx, i;
  if (cs && cs.length) {
    var first = cs[0];
    var rel = !!(first && isNum(first.t) && first.t < line.t - 0.08);
    for (i = 0; i < n; i++) {
      j = (cs.length === n) ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / Math.max(1, n)));
      rec = cs[j] && isNum(cs[j].t) ? cs[j] : null;
      tx = rec ? Number(rec.t) : NaN;
      out[i] = isFinite(tx) ? (rel ? line.t + tx : tx) : (line.t + dur * 0.86 * i / Math.max(1, n));
    }
  } else {
    for (i = 0; i < n; i++) out[i] = line.t + dur * 0.86 * i / Math.max(1, n);
  }
  return out;
}

function measureSpans() {
  if (!spans || !spans.length) return;
  for (var i = 0; i < spans.length; i++) {
    var sp = spans[i];
    if (!sp || !sp.el) continue;
    try {
      var r = sp.el.getBoundingClientRect();
      sp.x = r.left + r.width * 0.5;
      sp.y = r.top + r.height * 0.45;
      sp.w = r.width;
      sp.h = r.height;
    } catch (e) {}
  }
}

function renderLine(i) {
  lineEpoch++;
  lyrEl.innerHTML = "";
  spans = [];
  var line = (i >= 0 && S.lines && S.lines[i]) ? S.lines[i] : null;
  if (!line) return;
  var text = (line.text != null) ? String(line.text) : "";
  var chars2 = Array.from(text);
  var times = charTimes(line);
  var frag = document.createDocumentFragment();
  for (var k = 0; k < chars2.length; k++) {
    var ch = chars2[k];
    var sp = document.createElement("span");
    sp.className = "ch";
    var isSpace = (ch === " " || ch === "　" || ch === "\n" || ch === "\t");
    sp.textContent = isSpace ? " " : ch;
    if (isSpace) sp.className = "ch blank";
    frag.appendChild(sp);
    spans.push({
      el: sp,
      t: (times && isFinite(times[k])) ? times[k] : line.t,
      on: false,
      x: 0, y: 0, w: 0, h: 0,
      seed: Math.random() * 100
    });
  }
  lyrEl.appendChild(frag);
  measureSpans();
}

function updateSpans() {
  var t = S.t;
  for (var k = 0; k < spans.length; k++) {
    var sp = spans[k];
    if (!sp || !sp.el) continue;
    var on = sp.t != null && t >= sp.t - 0.015;
    if (on !== sp.on) {
      sp.on = on;
      if (on) {
        sp.el.className = (sp.el.className.indexOf("blank") >= 0 ? "ch blank on" : "ch on");
        if (!RM) {
          addWeave(sp);
          spawnBurst(sp);
        }
      } else {
        sp.el.className = (sp.el.className.indexOf("blank") >= 0 ? "ch blank" : "ch");
      }
    }
  }
}

function showEmpty(show) {
  try {
    if (show) emptyEl.classList.add("show");
    else emptyEl.classList.remove("show");
    lyrEl.style.opacity = show ? "0" : "1";
  } catch (e) {}
}

function handleInit(p) {
  p = p || {};
  var song = (p.song && typeof p.song === "object") ? p.song : {};
  SONG.name = (song.name != null && String(song.name) !== "") ? String(song.name) : "";
  SONG.cover = (song.cover != null) ? String(song.cover) : "";
  ACCENT = sanitizeAccent(p.accent);
  SONG.accent = ACCENT;
  DURATION = isNum(Number(p.duration)) && Number(p.duration) > 0 ? Number(p.duration) : 0;

  var raw = Array.isArray(p.lines) ? p.lines : [];
  var out = [];
  for (var i = 0; i < raw.length; i++) {
    var l = raw[i];
    if (!l || typeof l !== "object") continue;
    var text = (l.text == null) ? "" : String(l.text);
    var cs = null;
    if (Array.isArray(l.chars) && l.chars.length) {
      cs = [];
      for (var j = 0; j < l.chars.length; j++) {
        var c = l.chars[j];
        if (!c || !isNum(Number(c.t))) continue;
        cs.push({ c: (c.c == null ? "" : String(c.c)), t: Number(c.t) });
      }
      if (!cs.length) cs = null;
    }
    out.push({
      t: isNum(Number(l.t)) ? Number(l.t) : 0,
      dur: isNum(Number(l.dur)) ? Number(l.dur) : 0,
      text: text,
      chars: cs
    });
  }
  out.sort(function (a, b) { return a.t - b.t; });

  S.lines = out;
  S.idx = -1;
  curIdx = -2;
  lyrEl.innerHTML = "";
  spans = [];

  if (typeof p.playing === "boolean") S.playing = p.playing;
  else S.playing = true;

  showEmpty(out.length === 0);
  if (songEl) songEl.textContent = SONG.name || "未知曲目";

  /* accent → CSS 变量、精灵图与 shader */
  try {
    document.documentElement.style.setProperty("--acc", rgbCss(ACCENT, 0.8));
    if (sprWarm) buildSprites();
  } catch (e) {}

  diveImpulse = Math.max(diveImpulse, 0.55);
  if (out.length === 0) {
    /* 空歌词：清空后不编词，只留告示 */
    lineEpoch++;
  }
}

function handleTick(p) {
  var t = Number(p && p.time);
  if (isFinite(t)) S.t = t;                    /* 无条件采纳，只挡 NaN / Infinity */
  if (p && typeof p.playing === "boolean") S.playing = p.playing;
}

function handleBeat(p) {
  var lvl = isNum(Number(p && p.level)) ? clamp(Number(p.level), 0, 1) : 0.4;
  var ix = isNum(Number(p && p.index)) ? Number(p.index) : 0;
  if (lvl > 0.40 || ix === 0) {
    triggerFlare(lvl, ix);
    beatPulse = Math.min(1, beatPulse + 0.25 + lvl * 0.7);
    if (!RM) shakeAmp = Math.min(0.026, shakeAmp + 0.006 + lvl * 0.010);
  }
}

var liveS = { bass: 0, mid: 0, treble: 0, level: 0 };
function handleLive(p) {
  if (!p) return;
  var b = isNum(Number(p.bass)) ? clamp(Number(p.bass), 0, 1) : 0;
  var m = isNum(Number(p.mid)) ? clamp(Number(p.mid), 0, 1) : 0;
  var tr = isNum(Number(p.treble)) ? clamp(Number(p.treble), 0, 1) : 0;
  var lv = isNum(Number(p.level)) ? clamp(Number(p.level), 0, 1) : 0;
  liveS.bass = lerp(liveS.bass, b, 0.28);
  liveS.mid = lerp(liveS.mid, m, 0.22);
  liveS.treble = lerp(liveS.treble, tr, 0.20);
  liveS.level = lerp(liveS.level, lv, 0.20);
  if (typeof p.playing === "boolean") S.playing = p.playing;
  if (b > 0.72) {
    triggerFlare(b * 0.85, 2);
    beatPulse = Math.min(1, beatPulse + b * 0.55);
  }

window.addEventListener("message", function (ev) {
  var d = ev.data;
  if (!d || d.__c100 !== 1) return;
  var p = d.payload || {};
  try {
    if (d.type === "init") handleInit(p);
    else if (d.type === "tick") handleTick(p);
    else if (d.type === "beat") handleBeat(p);
    else if (d.type === "live") handleLive(p);
    /* setting / panel：本形态不声明设置面板，忽略 */
  } catch (e) { reportErr(e); }

   2D 特效层：磁力线编织、太阳风粒子、字符灼烧余辉

var particles = [];
var weaves = [];
var shakeAmp = 0;
var diveImpulse = 0;
var flareAmt = 0;
var flarePos = { x: 0.28, y: 0.36 };
var flareDeadline = 0;
var ambientClock = 0;

function makeSprite(r, g, b) {
  var c = document.createElement("canvas");
  c.width = 32; c.height = 32;
  var g2 = c.getContext("2d");
  if (!g2) return c;
  try {
    var gr = g2.createRadialGradient(16, 16, 0, 16, 16, 16);
    try {
      gr.addColorStop(0, "rgba(255,255,255,0.95)");
      gr.addColorStop(0.18, "rgba(" + r + "," + g + "," + b + ",0.85)");
      gr.addColorStop(0.55, "rgba(" + r + "," + g + "," + b + ",0.22)");
      gr.addColorStop(1, "rgba(" + r + "," + g + "," + b + ",0)");
    } catch (e) {}
    g2.fillStyle = gr;
    g2.fillRect(0, 0, 32, 32);
  } catch (e) {}
  return c;
}

var sprWarm = null, sprAcc = null, sprWhite = null;
function buildSprites() {
  try {
    sprWarm = makeSprite(255, 168, 82);
    sprWhite = makeSprite(255, 240, 214);
    sprAcc = makeSprite(Math.round(ACCENT[0]), Math.round(ACCENT[1]), Math.round(ACCENT[2]));
  } catch (e) {}
}

function addWeave(sp) {
  if (!sp) return;
  var x = sp.x || (W * 0.5), y = sp.y || (H * 0.78);
  weaves.push({ x: x, y: y, t0: performance.now(), seed: Math.random() * 10 });
  if (weaves.length > 90) weaves.splice(0, weaves.length - 90);
}

function spawnBurst(sp) {
  if (!sp || particles.length > 460) return;
  var x = sp.x || W * 0.5, y = sp.y || H * 0.78;
  var n = 3 + (Math.random() * 3 | 0);
  for (var i = 0; i < n; i++) {
    var a = -Math.PI * 0.5 + (Math.random() - 0.5) * 2.4;
    var sp2 = 26 + Math.random() * 90;
    particles.push({
      x: x + (Math.random() - 0.5) * 10,
      y: y + (Math.random() - 0.5) * 10,
      vx: Math.cos(a) * sp2,
      vy: Math.sin(a) * sp2 - 30,
      life: 0,
      max: 0.7 + Math.random() * 1.1,
      size: 1.2 + Math.random() * 2.8,
      acc: Math.random() < 0.26,
      white: Math.random() < 0.18
    });
  }
}

function spawnAmbient(dt) {
  if (particles.length > 430) return;
  ambientClock += dt;
  var rate = RM ? 4 : 22;
  var step = 1 / rate;
  var guard = 0;
  while (ambientClock > step && guard < 4) {
    ambientClock -= step; guard++;
    var x = Math.random() * W;
    var y = H * (0.55 + Math.random() * 0.5);
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.35) * 16,
      vy: -12 - Math.random() * 46,
      life: 0,
      max: 1.4 + Math.random() * 2.2,
      size: 0.8 + Math.random() * 2.0,
      acc: Math.random() < 0.35,
      white: false
    });
  }
}

function drawFX(dt, now) {
  if (!fx) return;
  try { fx.clearRect(0, 0, W, H); } catch (e) { return; }
  var acc = ACCENT;
  var accA = "rgba(" + Math.round(acc[0]) + "," + Math.round(acc[1]) + "," + Math.round(acc[2]) + ",";

  /* ---- 磁力线编织 ---- */
  var cut = now - 850;
  for (var wi = weaves.length - 1; wi >= 0; wi--) {
    if (!weaves[wi] || weaves[wi].t0 < cut) weaves.splice(wi, 1);
  }
  try { fx.globalCompositeOperation = "lighter"; } catch (e) {}
  if (!RM) {
    for (var w = 0; w < weaves.length; w++) {
      var wv = weaves[w];
      var age = (now - wv.t0) / 850;
      if (age < 0 || age > 1) continue;
      var fade = Math.pow(1 - age, 2.1);
      var rad = 34 + 150 * age;
      for (var f = 0; f < 3; f++) {
        var a0 = wv.seed + f * 2.1 + age * 1.5;
        var sx = wv.x + Math.cos(a0) * rad;
        var sy = wv.y + Math.sin(a0) * rad * 0.52;
        var mx = (sx + wv.x) * 0.5 + Math.cos(a0 + 1.5) * rad * 0.52;
        var my = (sy + wv.y) * 0.5 + Math.sin(a0 + 1.5) * rad * 0.32;
        fx.beginPath();
        fx.moveTo(sx, sy);
        fx.quadraticCurveTo(mx, my, wv.x, wv.y);
        fx.strokeStyle = (f === 1 ? accA : "rgba(255,170,92,") + (0.10 + 0.26 * fade) + ")";
        fx.lineWidth = 0.7 + 1.4 * fade;
        fx.stroke();
      }
      fx.beginPath();
      fx.arc(wv.x, wv.y, 12 + 26 * age, 0, Math.PI * 2);
      fx.strokeStyle = "rgba(255,226,188," + (0.18 * fade) + ")";
      fx.lineWidth = 1;
      fx.stroke();
    }
  }

  /* ---- 太阳风粒子 ---- */
  spawnAmbient(dt);
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    if (!p) { particles.splice(i, 1); continue; }
    p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx += Math.sin((p.y + p.life * 60) * 0.01) * 10 * dt;
    p.vy += 9 * dt * (p.y > H * 0.62 ? 0.15 : -0.1);
    var lf = 1 - p.life / p.max;
    var alpha = lf * lf * 0.85;
    var sprite = p.white ? sprWhite : (p.acc ? sprAcc : sprWarm);
    if (!sprite || !sprite.width || !sprite.height) continue;
    var sz = p.size * (0.7 + lf * 0.9) * 5.2;
    try {
      fx.globalAlpha = alpha;
      fx.drawImage(sprite, p.x - sz * 0.5, p.y - sz * 0.5, sz, sz);
    } catch (e) {}
  }
  try { fx.globalAlpha = 1; fx.globalCompositeOperation = "source-over"; } catch (e) {}

  /* ---- 当前字形周围的磁场辉芒 ---- */
  if (!RM && spans.length) {
    var pulse = 0.5 + 0.5 * Math.sin(now * 0.004);
    for (var s = 0; s < spans.length; s++) {
      var sp = spans[s];
      if (!sp || !sp.on || !sp.el || spans.length > 26) continue;
      var fadeIn = clamp((S.t - sp.t) * 1.6, 0, 1);
      if (fadeIn <= 0) continue;
      var halo = 14 + 5 * pulse;
      try {
        fx.beginPath();
        fx.arc(sp.x, sp.y, halo, 0, Math.PI * 2);
        fx.strokeStyle = "rgba(255,190,120," + (0.05 + 0.05 * pulse) * fadeIn + ")";
        fx.lineWidth = 1;
        fx.stroke();
      } catch (e) {}
    }
  }
}

function triggerFlare(level, index) {
  var now = performance.now();
  if (now < flareDeadline) return;
  flareDeadline = now + 420;
  flareAmt = Math.max(flareAmt, clamp(0.35 + level * 0.95, 0, 1.2));
  flarePos.x = (Math.random() - 0.5) * 1.15;
  flarePos.y = -0.02 + Math.random() * 0.30;
  if (!RM) {
    shakeAmp = Math.min(0.030, shakeAmp + 0.006 + level * 0.009);
    for (var i = 0; i < 22; i++) {
      if (particles.length > 460) break;
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 170;
      particles.push({
        x: W * 0.5 + flarePos.x * W * 0.45,
        y: H * (0.5 - flarePos.y) + (Math.random() - 0.5) * 40,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: 0,
        max: 0.9 + Math.random() * 1.4,
        size: 1.5 + Math.random() * 3.6,
        acc: Math.random() < 0.4,
        white: Math.random() < 0.45

    }
  }
}

/* =====================================================================

var beatPulse = 0;
var elapsed = 0;

function drawGL(now, dt) {
  if (!gl || !glOK || !prog) return;
  var sec = elapsed;
  var driftX = Math.sin(sec * 0.31) * 0.0028 + Math.sin(sec * 0.73 + 1.7) * 0.0014;
  var driftY = Math.cos(sec * 0.27) * 0.0024 + Math.sin(sec * 1.11 + 0.4) * 0.0011;
  var jx = 0, jy = 0;
  if (!RM) {
    jx = (Math.random() - 0.5) * shakeAmp;
    jy = (Math.random() - 0.5) * shakeAmp * 0.7;
  }
  var acc = ACCENT || [170, 150, 255];

  gl.viewport(0, 0, glCv.width, glCv.height);
  gl.useProgram(prog);
  try {
    if (U.uRes) gl.uniform2f(U.uRes, glCv.width, glCv.height);
    if (U.uTime) gl.uniform1f(U.uTime, RM ? sec * 0.35 : sec);
    if (U.uShake) gl.uniform2f(U.uShake, driftX + jx, driftY + jy);
    if (U.uAccent) gl.uniform3f(U.uAccent,
      Math.round(acc[0]) / 255, Math.round(acc[1]) / 255, Math.round(acc[2]) / 255);
    if (U.uBass) gl.uniform1f(U.uBass, clamp(Math.max(liveS.bass, beatPulse * 0.55), 0, 1));
    if (U.uMid) gl.uniform1f(U.uMid, clamp(liveS.mid, 0, 1));
    if (U.uTreble) gl.uniform1f(U.uTreble, clamp(liveS.treble, 0, 1));
    if (U.uFlare) gl.uniform1f(U.uFlare, clamp(flareAmt, 0, 1.4));
    if (U.uFlarePos) gl.uniform2f(U.uFlarePos, flarePos.x, flarePos.y);
    if (U.uDive) gl.uniform1f(U.uDive, clamp(diveImpulse, 0, 1));
    if (U.uRM) gl.uniform1f(U.uRM, RM ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } catch (e) { reportErr(e); }
}

var fbGradOK = false;
function drawFallback(sec) {
  if (!fallbackCtx) return;
  var c = fallbackCtx;
  try {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = "#050203";
    c.fillRect(0, 0, glCv.width, glCv.height);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    var horizon = H * 0.56;
    var g = c.createRadialGradient(W * 0.5, H * 1.16, 0, W * 0.5, H * 1.16, H * 1.15);
    try {
      g.addColorStop(0, "rgba(255,238,206,1)");
      g.addColorStop(0.16, "rgba(255,178,84,0.98)");
      g.addColorStop(0.42, "rgba(206,70,18,0.92)");
      g.addColorStop(0.72, "rgba(92,16,4,0.85)");
      g.addColorStop(1, "rgba(8,2,2,0)");
    } catch (e) {}
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    c.save();
    c.globalCompositeOperation = "lighter";
    for (var i = 0; i < 4; i++) {
      var rx = W * (0.22 + i * 0.20);
      var rr = H * (0.20 + 0.05 * Math.sin(sec * 0.5 + i));
      c.beginPath();
      c.ellipse(rx, horizon + 4, rr * 0.9, rr, 0, Math.PI, 0);
      c.strokeStyle = "rgba(255,120,48," + (0.10 + 0.05 * Math.sin(sec * 1.3 + i)) + ")";
      c.lineWidth = 6 + i * 3;
      c.stroke();
    }
    c.restore();

    c.fillStyle = "rgba(255,226,196,0.06)";
    for (var s = 0; s < 120; s++) {
      var sx = (s * 97.31) % W;
      var sy = (s * 41.77) % (horizon * 0.9);
      c.fillRect(sx, sy, 1, 1);
    }
    c.fillStyle = "rgba(255,170,100,0.55)";
    c.fillRect(0, horizon - 1, W, 1.5);
  } catch (e) { reportErr(e); }
}

function updateHUD() {
  try {
    var t = isFinite(S.t) && S.t > 0 ? S.t : 0;
    var m = Math.floor(t / 60);
    var s = Math.floor(t % 60);
    var fr = Math.floor((t - Math.floor(t)) * 24);
    if (tcEl) tcEl.textContent =
      (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s + ":" + (fr < 10 ? "0" : "") + fr;
    if (progEl) {
      var ratio = DURATION > 0 ? clamp(t / DURATION, 0, 1) : 0;
      progEl.style.width = (ratio * 100).toFixed(2) + "%";
    }
  } catch (e) {}
}
"use strict";

/* =====================================================================
   主循环
   ===================================================================== */

var loopStarted = false;
var lastNow = 0;
var hudTick = 0;

function frame(now) {
  var js0 = performance.now();
  try {
    if (!lastNow) lastNow = now;
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.08) dt = 0.08;
    elapsed += dt;

    if (S.playing && isFinite(S.t)) S.t += dt;

    var i = idxAt(S.t);
    if (i !== curIdx) {
      curIdx = i;
      S.idx = i;
      renderLine(i);
      if (i >= 0 && !RM) {
        diveImpulse = Math.max(diveImpulse, 0.72);
        flareAmt = Math.max(flareAmt, 0.18);
        flarePos.x = (Math.random() - 0.5) * 1.0;
        flarePos.y = 0.06 + Math.random() * 0.26;
      }
    }

    updateSpans();
    updateHUD();

    /* 冲击衰减 */
    var decay = Math.exp(-dt * 4.6);
    flareAmt *= decay; if (flareAmt < 0.0012) flareAmt = 0;
    diveImpulse *= Math.exp(-dt * 1.7); if (diveImpulse < 0.001) diveImpulse = 0;
    shakeAmp *= Math.exp(-dt * 6.2); if (shakeAmp < 0.0002) shakeAmp = 0;
    beatPulse *= Math.exp(-dt * 5.0); if (beatPulse < 0.001) beatPulse = 0;

    if (glOK) drawGL(now, dt);
    else drawFallback(elapsed);
    drawFX(dt, now);

    S.frames++;
  } catch (e) {
    reportErr(e);
    /* 出错也要继续出帧 */
    S.frames++;
  }
  S.js = performance.now() - js0;
  requestAnimationFrame(frame);
}

function startLoop() {
  if (loopStarted) return;
  loopStarted = true;
  buildSprites();
  requestAnimationFrame(frame);
}

/* 若 boot 因任何原因未启动循环，再兜底一次 */
setTimeout(function () {
  if (!loopStarted) { try { startLoop(); } catch (e) { reportErr(e); } }
}, 1200);
</script>
