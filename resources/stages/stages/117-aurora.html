<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极光帷幕</title>
<style>
  html,body{margin:0;height:100%;background:#05070b;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(118% 96% at 50% 46%,transparent 34%,rgba(3,5,10,.52) 74%,rgba(1,2,5,.95))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(198,210,235,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   Lyra 通用骨架（构建期拼进每个 stage 的自包含 HTML，不是外部依赖）
   ----------------------------------------------------------------------------
   机制文件需要实现（名字固定）：
     mechResize()                   resize 之后调用一次（此时 W/H 有效）
     mechAssign(use)                换句时调用；use = {g, spans, at, cc, lineT, lineDur}
     mechUpdate(dt, T)              每帧物理（dt 已经扣掉顿帧）
     mechDraw(T, z, pjX, pjY)       每帧绘制（背景已画好，直接在 ctx 上画）
   可选钩子：
     mechInit()                     模块初始化（W/H 还是 0，别在这里用 W/H 撒点）
     mechEvent(k, first)            词团命中后调用（默认的顿帧/白闪/变焦/震动已经做了）
   可直接用：
     W H DPR ctx cv hint
     cam {x,y,ox,oy,z,tz,vz,rot,vrot,sh,shx,shy}   ox/oy 是镜头平移偏移（甩镜/环绕用）
     AE {freeze,flash}
     lines curIdx L spans charChars charGlow blockGx blockGy lineT lineDur accent
     rnd(a,b) clamp01(v) hitStop(s) flash(v) camShake(dx,dy,amp)
   ========================================================================== */

/* ============================ 0 · 画布 ============================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
let bgCv = null;
let L = null, curIdx = -1;

/* ============================ 1 · 时钟 ============================ */
let lines = [];
let accent = [186, 206, 255];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ============================ 2 · 分词 ============================ */
let DICT = null;
fetch('/segdict.bin').then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); }).catch(() => {});
const fnv = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function isWord(s, i, Ln) {
  if (!DICT) return false;
  const h = fnv(s.substr(i, Ln));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = DICT[m]; if (v === h) return true; if (v < h) lo = m + 1; else hi = m - 1; }
  return false;
}
function segWords(text) {
  const fwd = [];
  for (let i = 0; i < text.length;) {
    let hit = 0;
    for (let Ln = Math.min(4, text.length - i); Ln >= 2; Ln--) if (isWord(text, i, Ln)) { hit = Ln; break; }
    if (hit) { fwd.push(text.substr(i, hit)); i += hit; } else { fwd.push(text[i]); i++; }
  }
  const bwd = [];
  for (let j = text.length; j > 0;) {
    let hit = 0;
    for (let Ln = Math.min(4, j); Ln >= 2; Ln--) if (isWord(text, j - Ln, Ln)) { hit = Ln; break; }
    if (hit) { bwd.unshift(text.substr(j - hit, hit)); j -= hit; } else { bwd.unshift(text[j - 1]); j--; }
  }
  return fwd.length <= bwd.length ? fwd : bwd;
}
const MAXG = 3;
const PUNCT = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】"]/;
const SPACE = /\s/;
function isLatin(text) { let la = 0, cjk = 0; for (let i = 0; i < text.length; i++) { const c = text[i]; if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++; else if (c >= '\u4e00' && c <= '\u9fff') cjk++; } return la > cjk; }
function latinSpans(text) {
  const out = []; let i = 0;
  while (i < text.length) {
    if (SPACE.test(text[i])) { i++; continue; }
    let j = i; while (j < text.length && !SPACE.test(text[j])) j++;
    out.push({ i0: i, i1: j }); i = j;
  }
  return out;
}
const SUFFIX = /^[的了着过地得吗呢吧啊嘛]$/;
const PREFIX = /^[但还就才又也都把被在从向对和与而却很不没最更将已曾让给]$/;
const countChars = (s) => { let n = 0; for (let i = 0; i < s.length; i++) if (!PUNCT.test(s[i]) && !SPACE.test(s[i])) n++; return n; };
function groupByWords(text) {
  const words = segWords(text), out = [];
  let cur = '', start = 0, chars = 0, pos = 0;
  const flush = (end) => { if (cur) { out.push({ i0: start, i1: end }); cur = ''; chars = 0; } };
  for (const w of words) {
    const at = pos; pos += w.length;
    const isP = PUNCT.test(w);
    if (!cur) { cur = w; start = at; chars = isP ? 0 : w.length; continue; }
    if (isP) { cur += w; if (chars >= 2) flush(pos); continue; }
    const single = w.length === 1;
    if (single && SUFFIX.test(w)) { cur += w; chars++; if (chars >= MAXG) flush(pos); continue; }
    if (single && PREFIX.test(w) && chars >= 2) { flush(at); cur = w; start = at; chars = 1; continue; }
    if (chars + w.length <= MAXG) { cur += w; chars += w.length; } else { flush(at); cur = w; start = at; chars = w.length; }
  }
  flush(text.length);
  for (let k = 0; k < out.length; k++) {
    const g = out[k];
    if (countChars(text.slice(g.i0, g.i1)) > 1) continue;
    const prev = out[k - 1], next = out[k + 1];
    if (prev && prev.i1 === g.i0 && countChars(text.slice(prev.i0, prev.i1)) < MAXG) { prev.i1 = g.i1; out.splice(k, 1); k--; }
    else if (next && next.i0 === g.i1 && countChars(text.slice(next.i0, next.i1)) < MAXG) { next.i0 = g.i0; out.splice(k, 1); k--; }
  }
  return out;
}
function groupByRule(text) {
  const out = []; let start = 0, chars = 0;
  for (let i = 0; i < text.length; i++) {
    const s = PUNCT.test(text[i]) || SPACE.test(text[i]);
    if (!s) chars++;
    if (s && chars >= 2) { out.push({ i0: start, i1: i + 1 }); start = i + 1; chars = 0; continue; }
    if (!s && chars > MAXG) { out.push({ i0: start, i1: i }); start = i; chars = 1; }
  }
  if (start < text.length) out.push({ i0: start, i1: text.length });
  return out;
}
const spansForLine = (t) => (isLatin(t) ? latinSpans(t) : (DICT ? groupByWords(t) : groupByRule(t)));

/* ============================ 3 · 字形采样 ============================ */
const offCv = document.createElement('canvas');
const octx = offCv.getContext('2d', { willReadFrequently: true });
const FONT = (px, wt) => `${wt || 800} ${px}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
function wrapText(text, fs, maxW, wt) {
  octx.font = FONT(fs, wt);
  const latin = isLatin(text);
  const rows = []; let start = 0, w = 0;
  for (let i = 0; i < text.length; i++) {
    const cw = octx.measureText(text[i]).width;
    if (!cw) continue;
    if (w + cw > maxW && i > start) {
      let brk = i;
      if (latin) { let j = i; while (j > start && !SPACE.test(text[j])) j--; if (j > start) brk = j; }
      rows.push({ i0: start, i1: brk, w: octx.measureText(text.slice(start, brk)).width });
      start = brk; w = 0;
      while (start < text.length && SPACE.test(text[start])) start++;
      if (start >= text.length) break;
      i = start - 1; continue;
    }
    w += cw;
  }
  if (start < text.length) rows.push({ i0: start, i1: text.length, w: octx.measureText(text.slice(start)).width });
  for (const r of rows) while (r.i1 - r.i0 > 1 && SPACE.test(text[r.i0])) r.i0++;
  return rows.length ? rows : [{ i0: 0, i1: text.length, w: octx.measureText(text).width }];
}
function sampleGlyph(text, opt) {
  opt = opt || {};
  const wt = opt.weight || 800;
  let fs = opt.fs || 92;
  const maxW = opt.maxW || Math.min(W * 0.78, 1180);
  const maxH = opt.maxH || H * 0.52;
  let rows = wrapText(text, fs, maxW, wt);
  let lh = fs * 1.16;
  if (rows.length * lh > maxH) { fs *= maxH / (rows.length * lh); rows = wrapText(text, fs, maxW, wt); lh = fs * 1.16; }
  octx.font = FONT(fs, wt);
  const widest = Math.max(1, ...rows.map((r) => octx.measureText(text.slice(r.i0, r.i1)).width));
  const padW = Math.ceil(widest) + 24, padH = Math.ceil(lh * rows.length) + 12;
  offCv.width = padW; offCv.height = padH;
  octx.font = FONT(fs, wt);
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.clearRect(0, 0, padW, padH);
  const n = text.length;
  const charCx = new Float32Array(n), charCy = new Float32Array(n);
  const rowMaps = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], str = text.slice(row.i0, row.i1);
    const cy = padH / 2 + (r - (rows.length - 1) / 2) * lh;
    octx.fillText(str, padW / 2, cy);
    const x0 = (padW - row.w) / 2, map = new Int16Array(padW).fill(-1);
    let acc = 0;
    for (let i = row.i0; i < row.i1; i++) {
      const cw = octx.measureText(text[i]).width;
      charCx[i] = x0 + acc + cw / 2 - padW / 2; charCy[i] = cy - padH / 2;
      for (let x = Math.max(0, Math.floor(x0 + acc)); x < Math.min(padW, Math.ceil(x0 + acc + cw)); x++) map[x] = i;
      acc += cw;
    }
    rowMaps.push({ y0: cy - lh / 2, y1: cy + lh / 2, map });
  }
  const d = octx.getImageData(0, 0, padW, padH).data;
  const pxA = [], pyA = [], ownA = [];
  const step = opt.step || 2;
  for (let y = 0; y < padH; y += step) {
    let rm = null;
    for (let r = 0; r < rowMaps.length; r++) { const m = rowMaps[r]; if (y >= m.y0 && y < m.y1) { rm = m; break; } }
    if (!rm) continue;
    const map = rm.map, base = y * padW;
    for (let x = 0; x < padW; x += step) {
      if (d[(base + x) * 4 + 3] <= 128) continue;
      const c = map[x]; if (c < 0) continue;
      pxA.push(x - padW / 2); pyA.push(y - padH / 2); ownA.push(c);
    }
  }
  return { px: Float32Array.from(pxA), py: Float32Array.from(pyA), own: Int16Array.from(ownA),
           pc: pxA.length, n, charCx, charCy, fs, w: widest, h: lh * rows.length, rows: rows.length, padW, padH };
}

/* ============================ 4 · 句索引 / 预取 ============================ */
let brewIdx = -1, lastT = -1;
let prep = null, spans = [], charChars = null, charGlow = new Float32Array(0);
let blockGx = 0, blockGy = 0, lineT = 0, lineDur = 4;
const hintShow = (s, o) => { hint.textContent = s; hint.style.opacity = o; };

function prepLine(idx) {
  const line = lines[idx];
  if (!line || !line.text) return null;
  const text = line.text;
  const latin = isLatin(text);
  const lab = typeof mechFs === 'function' ? mechFs(text, latin) : (latin ? 92 : (text.length <= 10 ? 112 : text.length <= 16 ? 96 : 82));
  const g = sampleGlyph(text, { fs: lab, step: typeof mechStep === 'function' ? mechStep(text) : 2,
    maxW: Math.min(W * 0.78, 1180), maxH: H * 0.52 });
  if (!g.pc) return null;
  g.text = text;
  const cc = line.chars && line.chars.length === text.length ? line.chars : null;
  const dur = line.dur || 4;
  const at = new Float32Array(g.n);
  const cap = line.t + dur * 0.86;   /* YRC 溢出句长时压缩进句内，保证整句都能唱完 */
  for (let c = 0; c < g.n; c++) {
    const raw = cc && cc[c] && typeof cc[c].t === 'number' ? cc[c].t : line.t + dur * (c / Math.max(1, g.n));
    at[c] = Math.min(raw, cap);
  }
  const raw = spansForLine(text);
  const spanOf = new Int16Array(g.n).fill(-1);
  const spList = [];
  for (let k = 0; k < raw.length; k++) {
    const s = raw[k];
    if (!s || s.i1 <= s.i0) continue;
    spList.push({ i0: s.i0, i1: s.i1, t: at[Math.min(g.n - 1, s.i0)], hit: 0 });
    for (let c = s.i0; c < s.i1; c++) spanOf[c] = spList.length - 1;
  }
  if (!spList.length) return null;
  for (let k = 1; k < spList.length; k++) if (spList[k].t < spList[k - 1].t) spList[k].t = spList[k - 1].t;
  return { idx, g, spans: spList, spanOf, cc, at, text, lineT: line.t, lineDur: dur };
}

function assignLine(idx) {
  const use = (prep && prep.idx === idx) ? prep : prepLine(idx);
  if (!use) { L = null; return; }
  L = use.g; spans = use.spans; charChars = use.cc;
  charGlow = new Float32Array(L.n);
  blockGx = W / 2; blockGy = H * 0.46;
  lineT = use.lineT; lineDur = use.lineDur;
  cam.tz = 1.0; cam.ox = 0; cam.oy = 0;
  if (typeof mechAssign === 'function') mechAssign(use);
}

/* ============================ 5 · 相机 / 事件 ============================ */
const cam = { x: 0, y: 0, ox: 0, oy: 0, z: 1, tz: 1, vz: 0, sh: 0, dirx: 0, diry: 0, shx: 0, shy: 0, rot: 0, vrot: 0 };
const AE = { freeze: 0, flash: 0 };
const hitStop = (s) => { AE.freeze = Math.max(AE.freeze, s); };
const flash = (v) => { AE.flash = Math.max(AE.flash, v); };
function camShake(dx, dy, amp) {
  const l = Math.hypot(dx, dy) || 1;
  cam.dirx = dx / l; cam.diry = dy / l;
  cam.sh = Math.min(26, Math.max(cam.sh, amp));
}
function camUpdate(dt, T) {
  const ke = 1 - Math.pow(0.0016, dt);
  cam.tx = W / 2 + cam.ox;
  cam.ty = H * 0.48 + cam.oy;
  cam.x += (cam.tx - cam.x) * ke;
  cam.y += (cam.ty - cam.y) * ke;
  cam.vz += ((cam.tz - cam.z) * 185 - cam.vz * 22) * dt;
  cam.z += cam.vz * dt;
  cam.vrot += (-cam.rot * 240 - cam.vrot * 21) * dt;
  cam.rot += cam.vrot * dt;
  cam.sh *= Math.pow(0.00004, dt);
  const wob = Math.sin(T * 59.3) * 0.62 + Math.sin(T * 40.1 + 1.2) * 0.38;
  cam.shx = cam.dirx * cam.sh * wob;
  cam.shy = cam.diry * cam.sh * wob;
}

/* ============================ 6 · 背景 ============================ */
function buildBg() {
  if (!bgCv) bgCv = document.createElement('canvas');
  const bw = Math.max(2, Math.round(W / 2)), bh = Math.max(2, Math.round(H / 2));
  bgCv.width = bw; bgCv.height = bh;
  const g = bgCv.getContext('2d');
  const grd = g.createRadialGradient(bw * 0.5, bh * 0.44, 0, bw * 0.5, bh * 0.5, Math.max(bw, bh) * 0.8);
  grd.addColorStop(0, '#11161f');
  grd.addColorStop(0.55, '#0a0e16');
  grd.addColorStop(1, '#030509');
  g.fillStyle = grd; g.fillRect(0, 0, bw, bh);
}

/* ============================ 7 · 主循环 ============================ */
let last = performance.now();
let T0 = 0;

function frame(nowMs) {
  const dtReal = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; T0 += dtReal;
  if (AE.freeze > 0) AE.freeze -= dtReal;
  const dt = AE.freeze > 0 ? 0 : dtReal;

  const T = now();
  timing(T);

  if (L) {
    if (charChars) for (let c = 0; c < L.n; c++) charGlow[c] = charChars[c] ? clamp01((T - charChars[c].t) / 0.22) : 0;
    else for (let c = 0; c < L.n; c++) charGlow[c] = clamp01((T - lineT - lineDur * 0.85 * c / L.n) / 0.3);
  }

  if (L && spans.length) {
    for (let k = 0; k < spans.length; k++) {
      const s = spans[k];
      if (s.hit || T < s.t || T > s.t + 0.4) continue;
      s.hit = 1;
      const first = k === 0;
      hitStop(first ? 0.05 : 0.024);
      flash(first ? 0.36 : 0.15);
      cam.tz = first ? 1.06 : 1.03;
      camShake(1, 0.18, first ? 11 : 5.5);
      cam.vrot += (k % 2 ? 1 : -1) * (first ? 0.55 : 0.28);
      if (typeof mechEvent === 'function') mechEvent(k, first);
    }
    cam.tz += (1.0 - cam.tz) * Math.min(1, dtReal * 2.4);
  }

  camUpdate(dtReal, T0);
  const z = cam.z;
  const cosR = Math.cos(cam.rot), sinR = Math.sin(cam.rot);
  const pjX = (x, y) => { const dx = (x - cam.x) * z, dy = (y - cam.y) * z; return W / 2 + cam.shx + dx * cosR - dy * sinR; };
  const pjY = (x, y) => { const dx = (x - cam.x) * z, dy = (y - cam.y) * z; return H / 2 + cam.shy + dx * sinR + dy * cosR; };

  if (typeof mechUpdate === 'function') mechUpdate(dt, T);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#05070b';
  ctx.fillRect(0, 0, W, H);
  if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);
  if (typeof mechDraw === 'function') mechDraw(T, z, pjX, pjY);

  ctx.globalCompositeOperation = 'source-over';
  if (AE.flash > 0.012) {
    ctx.fillStyle = `rgba(232,240,250,${(AE.flash * 0.05).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    AE.flash *= Math.pow(0.000004, dtReal);
  }

  requestAnimationFrame(frame);
}

/* ============================ 8 · 节奏 ============================ */
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) { curIdx = -1; brewIdx = -1; L = null; prep = null; }
  lastT = T;
  let c = curIdx;
  while (c + 1 < lines.length && T >= lines[c + 1].t) c++;
  if (c !== curIdx) {
    curIdx = c; brewIdx = -1; prep = null;
    if (curIdx >= 0) { assignLine(curIdx); hintShow('', 0); }
    else hintShow(lines.length ? '等待第一句…' : '这首没有歌词', 0.5);
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    if (T >= lines[nx].t - Math.min(1.5, Math.max(0.55, gap * 0.5))) { brewIdx = nx; prep = prepLine(nx); }
  }
}

/* ============================ 9 · 通信协议 ============================ */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent && p.accent.length >= 3) accent = p.accent;
    curIdx = -1; brewIdx = -1; lastT = -1; L = null; prep = null; spans = [];
    clockT = 0; clockAt = performance.now();
    if (typeof mechInitLine === 'function') mechInitLine();
    hintShow(lines.length ? '等待第一句…' : '这首没有歌词', lines.length ? 1 : 0.5);
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    const lv = (d.payload && d.payload.level) || 0.6;
    camShake(1, 0.2, 1.4 + lv * 2.2);
    cam.tz = Math.max(cam.tz, 1.02 + lv * 0.02);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => ({
  curIdx, n: lines.length, pc: L ? L.pc : 0, spans: spans.length,
  z: +cam.z.toFixed(3), t: +now().toFixed(2),
});

/* ============================ 10 · 启动 ============================ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.max(2, Math.round(W * DPR));
  cv.height = Math.max(2, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg();
  cam.x = W / 2; cam.y = H * 0.48; cam.tx = cam.x; cam.ty = cam.y;
  if (typeof mechResize === 'function') mechResize();

/* ===== MECH · 极光帷幕 ===== */
/* lyra52 · 极光帷幕 · aurora
   高能粒子沿磁力线落下，铺成一层层竖立的极光帷幕；
   帷幕在三维里前后错开（7 层 z），被风吹得折叠、被 gust 整片甩动。
   字不是画上去的：字形采样点吸附到最近的那层帘上，
   一小片粒子的亮度被抬到最亮的一档、位置往字形点收 ——
   于是"字"就是帘上最亮的那一块，暗部仍是流动的青绿 / 紫光帘。 */

const A52_N = 8000;          /* 总粒子 8000（5000~9000） */
const A52_L = 7;             /* 帷幕层数 */
const A52_MS = 5;            /* 每层最多几条帘股 */

/* ---- 粒子（按层连续铺，字粒子在数组尾部） ---- */
const a52u = new Float32Array(A52_N);    /* 帘面参数 u 0..1 */
const a52v = new Float32Array(A52_N);    /* 帘面参数 v 0..1（0 顶 / 1 底） */
const a52uR = new Float32Array(A52_N);   /* 字粒子：未点亮时的帘面 u */
const a52vR = new Float32Array(A52_N);
const a52uG = new Float32Array(A52_N);   /* 字粒子：字形点对应的 u */
const a52vG = new Float32Array(A52_N);
const a52gx = new Float32Array(A52_N);   /* 字形点（设计坐标） */
const a52gy = new Float32Array(A52_N);
const a52jx = new Float32Array(A52_N);
const a52jy = new Float32Array(A52_N);
const a52sz = new Float32Array(A52_N);
const a52spd = new Float32Array(A52_N);  /* 沿磁力线下落速度 */
const a52core = new Float32Array(A52_N); /* 距帘股核心的程度 0..1 */
const a52wt = new Float32Array(A52_N);
const a52lay = new Uint8Array(A52_N);
const a52band = new Uint8Array(A52_N);
const a52att = new Int16Array(A52_N).fill(-1);
const a52ch = new Uint8Array(A52_N);

/* ---- 每帧投影后的屏幕坐标 ---- */
const a52sx = new Float32Array(A52_N);
const a52sy = new Float32Array(A52_N);
const a52sw = new Float32Array(A52_N);
const a52sh = new Float32Array(A52_N);
const a52sb = new Uint8Array(A52_N);

let a52Body = A52_N, a52Let = 0, a52Host = 3;
let a52Gust = 0, a52GustDir = 1;
let a52Sky = null, a52Glow = null, a52Tex = null;

/* ---- 每层几何 ---- */
const a52D = new Float32Array(A52_L);
const a52Ph = new Float32Array(A52_L);
const a52X0 = new Float32Array(A52_L);
const a52WW = new Float32Array(A52_L);
const a52Top = new Float32Array(A52_L);
const a52Bot = new Float32Array(A52_L);
const a52Fold = new Float32Array(A52_L);
const a52Boom = new Float32Array(A52_L);
const a52Z = new Float32Array(A52_L);
const a52NC = new Uint8Array(A52_L);              /* 帘股数 */
const a52SC = new Float32Array(A52_L * A52_MS);   /* 帘股中心 x */
const a52SW = new Float32Array(A52_L * A52_MS);   /* 帘股半宽 px */

/* 字形采样密度：长句稀疏一点，短句密一点（保证字粒子能铺满字） */
function mechStep(text) { return text.length > 18 ? 4 : 3; }

function mechResize() {
  if (!W || !H) return;

  /* 7 层帷幕：z 从 -1（近）到 +1（远） */
  for (let L = 0; L < A52_L; L++) {
    const d = -1 + (2 * L) / (A52_L - 1);
    a52D[L] = d;
    a52Ph[L] = L * 1.71 + rnd(0, 0.5);
    a52X0[L] = -W * 0.13 + rnd(-W * 0.02, W * 0.02);
    a52WW[L] = W * 1.26;
    a52Top[L] = H * (0.040 + 0.020 * L) + rnd(-H * 0.012, H * 0.012);
    let b = H * (0.70 + 0.15 * Math.sin(L * 2.15 + 0.7));
    if (b - a52Top[L] < H * 0.50) b = a52Top[L] + H * 0.50;
    if (b - a52Top[L] > H * 0.80) b = a52Top[L] + H * 0.80;
    a52Bot[L] = b;
    a52Fold[L] = W * (0.018 + 0.010 * Math.abs(Math.sin(L * 1.3 + 2))) * (1 - d * 0.18);
    a52Boom[L] = H * (0.020 + 0.018 * Math.abs(Math.sin(L * 2.7 + 1.1)));

    /* 每层 3~4 条竖向帘股，层与层错开，叠出极光的层次 */
    const n = 3 + (L % 2);
    a52NC[L] = n;
    for (let s = 0; s < n; s++) {
      const k = L * A52_MS + s;
      a52SC[k] = a52X0[L] + a52WW[L] * (0.09 + 0.82 * ((s + 0.5) / n + rnd(-0.08, 0.08)));
      a52SW[k] = W * (0.030 + Math.random() * 0.035);
    }
  }

  /* 分层撒点：近层多一点；帘股附近密、股间稀 */
  const wt = [1.16, 1.11, 1.06, 1.0, 0.95, 0.90, 0.86];
  let sum = 0;
  for (let L = 0; L < A52_L; L++) sum += wt[L];
  a52Body = A52_N; a52Let = 0;
  let idx = 0;
  for (let L = 0; L < A52_L; L++) {
    const cnt = (L === A52_L - 1) ? A52_N - idx
      : Math.round(A52_N * wt[L] / sum);
    const n = a52NC[L];
    for (let k = 0; k < cnt && idx < A52_N; k++, idx++) {
      const i = idx;
      a52lay[i] = L;
      const s = (Math.random() * n) | 0;
      const kk = L * A52_MS + s;
      const uc = (a52SC[kk] - a52X0[L]) / a52WW[L];
      const su = a52SW[kk] / a52WW[L];
      let u;
      if (Math.random() < 0.13) u = Math.random();               /* 股间薄纱 */
      else u = uc + ((Math.random() + Math.random() + Math.random() - 1.5) / 1.5) * su;
      u = clamp01(u);
      let core = 1 - Math.abs(u - uc) / Math.max(0.0001, su);
      core = core < 0 ? 0 : core * core;

      a52u[i] = a52uR[i] = u;
      let v = Math.pow(Math.random(), 0.45);
      if (Math.random() < 0.30) v = 0.86 + Math.random() * 0.14; /* 底缘亮边 */
      a52v[i] = a52vR[i] = v;
      a52core[i] = core;

      const ph = a52Ph[L];
      /* 上半透成紫，底部保持青绿 */
      a52band[i] = (v < 0.40 + 0.15 * Math.sin(u * 9.0 + ph) || core < 0.08) ? 1 : 0;
      const dep = 1 - a52D[L] * 0.22;
      a52sz[i] = (0.72 + Math.random() * 0.7) * dep * (0.75 + 0.5 * core)
        * (v > 0.86 ? 1.22 : 1);
      a52spd[i] = 0.010 + Math.random() * 0.045;
      a52jx[i] = rnd(-1.5, 1.5);
      a52jy[i] = rnd(-2, 2);
      a52att[i] = -1;
    }
  }

  a52BakeSky();
}

function mechAssign(use) {
  const g = use.g, pc = g.pc;
  if (!pc) return;
  a52Host = 3;                 /* 离文字平面最近的那层帘 */
  a52Gust = 0.9;
  a52Let = Math.min(pc, A52_N - 3200, 5000);
  a52Body = A52_N - a52Let;

  for (let k = 0; k < a52Let; k++) {
    const i = a52Body + k;
    let q = a52Let === pc ? k : ((k * pc) / a52Let + Math.random() * 0.7) | 0;
    if (q >= pc) q = pc - 1;
    const gx = blockGx + g.px[q];
    const gy = blockGy + g.py[q];

    a52att[i] = q;
    a52ch[i] = g.own[q];

    a52lay[i] = L;
    a52uR[i] = Math.random();
    a52vR[i] = Math.pow(Math.random(), 0.52);

    a52uG[i] = clamp01((gx - a52X0[L]) / a52WW[L]);
    a52vG[i] = clamp01((gy - a52Top[L]) / (a52Bot[L] - a52Top[L]));
    a52sz[i] = 1.0 + Math.random() * 0.4;
    a52jx[i] = rnd(-1.0, 1.0);
    a52jy[i] = rnd(-1.2, 1.2);

function mechEvent(k, first) {
  a52GustDir = (k % 2) ? -1 : 1;
  a52Gust = first ? 1.75 : 1.15;
  cam.ox = a52GustDir * (first ? 42 : 24);
  cam.oy = -7;
  cam.rot = -a52GustDir * (first ? 0.0075 : 0.005);   /* 轻微滚转 */
}

function mechUpdate(dt, T) {
  if (dt <= 0) return;
  a52Gust *= Math.exp(-dt * 2.2);
  /* 缓推：1.0 → 1.04 往复；不压掉骨架命中时的猛推 */
  const breath = 1.021 + 0.019 * Math.sin(T * 0.36);
  if (cam.tz < breath) cam.tz = breath;
}

/* 帷幕面在高度 vv 处被风吹出的横向位移（粒子与辉光共用） */
function a52Sway(xc, vv, L, T) {
  const ph = a52Ph[L];
  return Math.sin(vv * 3.4 + ph + T * 0.62) * a52Fold[L] * (0.35 + 0.65 * vv)
    + Math.sin(xc * 0.006 + ph * 1.7 - T * 0.85) * a52Fold[L] * 0.5
    + a52Gust * (a52GustDir * 26 + 18 * Math.sin(vv * 2.4 + ph + T * 1.6));
}

/* 预烘一张竖长条帘体贴图：底亮顶淡、两侧羽化、带一点纤维纹（青绿 / 紫） */
function a52BakeTex() {
  const cols = [[70, 245, 195], [150, 125, 255]];
  const out = [];
  for (let k = 0; k < 2; k++) {
    const c = document.createElement('canvas');
    c.width = 96; c.height = 256;
    const g = c.getContext('2d');
    const col = cols[k];
    const vg = g.createLinearGradient(0, 0, 0, 256);
    vg.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    vg.addColorStop(0.28, `rgba(${col[0]},${col[1]},${col[2]},0.06)`);
    vg.addColorStop(0.62, `rgba(${col[0]},${col[1]},${col[2]},0.22)`);
    vg.addColorStop(0.88, `rgba(${col[0]},${col[1]},${col[2]},0.54)`);
    vg.addColorStop(0.97, `rgba(${col[0]},${col[1]},${col[2]},0.26)`);
    vg.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    g.fillStyle = vg; g.fillRect(0, 0, 96, 256);
    /* 纤维：几条细竖纹，上下跟着帘体的浓淡一起淡出 */
    g.globalCompositeOperation = 'lighter';
    const fg = g.createLinearGradient(0, 0, 0, 256);
    fg.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    fg.addColorStop(0.35, `rgba(${col[0]},${col[1]},${col[2]},0.05)`);
    fg.addColorStop(0.9, `rgba(${col[0]},${col[1]},${col[2]},0.22)`);
    fg.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    g.fillStyle = fg;
    for (let f = 0; f < 15; f++) {
      const fx = 6 + f * 5.8 + Math.random() * 3;
      g.fillRect(fx, 0, 1.4, 256);
    }
    /* 横向羽化 */
    g.globalCompositeOperation = 'destination-in';
    const hg = g.createLinearGradient(0, 0, 96, 0);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(0.26, 'rgba(0,0,0,1)');
    hg.addColorStop(0.74, 'rgba(0,0,0,1)');
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0, 0, 96, 256);
    g.globalCompositeOperation = 'source-over';
    out.push(c);

}

/* ============================ 预烘 ============================ */
function a52BakeSky() {
  const bw = Math.max(2, Math.round(W)), bh = Math.max(2, Math.round(H));

  if (!a52Sky) a52Sky = document.createElement('canvas');
  a52Sky.width = bw; a52Sky.height = bh;
  const sc = a52Sky.getContext('2d');
  const g = sc.createLinearGradient(0, 0, 0, bh);
  g.addColorStop(0, '#03050d');
  g.addColorStop(0.34, '#050e1e');
  g.addColorStop(0.60, '#07182b');
  g.addColorStop(0.84, '#051120');
  g.addColorStop(1, '#02060c');
  sc.fillStyle = g; sc.fillRect(0, 0, bw, bh);
  /* 地平线附近很淡的冷光 */
  const hz = sc.createRadialGradient(bw * 0.5, bh * 1.02, 0, bw * 0.5, bh * 1.02, bh * 0.8);
  hz.addColorStop(0, 'rgba(26,96,104,0.16)');
  hz.addColorStop(0.55, 'rgba(16,56,74,0.07)');
  hz.addColorStop(1, 'rgba(0,0,0,0)');
  sc.fillStyle = hz; sc.fillRect(0, 0, bw, bh);

  /* 星点：三档亮度批一次画完 */
  const stars = [];
  for (let i = 0; i < 380; i++) {
    const sx = 26 + Math.random() * (bw - 52);
    const sy = 22 + Math.pow(Math.random(), 1.25) * (bh * 0.9 - 22);
    stars.push([sx, sy, Math.random()]);
  }
  const tiers = [
    ['rgba(180,205,255,0.14)', 0, 0.55, 0.55],
    ['rgba(210,228,255,0.26)', 0.55, 0.88, 0.8],
    ['rgba(238,248,255,0.46)', 0.88, 1.01, 1.1]
  ];
  for (let t = 0; t < tiers.length; t++) {
    const [col, lo, hi, sz] = tiers[t];
    sc.fillStyle = col;
    sc.beginPath();
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i][2];
      if (s < lo || s >= hi) continue;
      sc.rect(stars[i][0], stars[i][1], sz, sz);
    }
    sc.fill();
  }

  /* 帘体体积光：预烘的竖长条贴图，按帘股一次烘进夜空 */
  if (!a52Tex) a52Tex = a52BakeTex();
  for (let L = 0; L < A52_L; L++) {
    const n = a52NC[L];
    const tex = a52Tex[L & 1];
    for (let s = 0; s < n; s++) {
      const kk = L * A52_MS + s;
      const xc = a52SC[kk];
      const topY = a52Top[L] + H * 0.05;
      const hh = a52Bot[L] - topY;
      if (hh < 20) continue;
      const wv = a52SW[kk] * 3.0;
      /* 贴边的帘股淡下去，画面边缘保持干净 */
      let ef = Math.min(xc, W - xc) / (W * 0.20);
      ef = ef < 0 ? 0 : ef > 1 ? 1 : ef;
      ef = 0.10 + 0.90 * ef;
      sc.save();
      sc.globalCompositeOperation = 'lighter';
      sc.translate(xc, topY);
      sc.transform(1, 0, 0.045, 1, 0, 0);
      sc.globalAlpha = (0.20 - a52D[L] * 0.06) * ef;
      sc.drawImage(tex, -wv * 0.95, 0, wv * 1.9, hh);
      sc.globalAlpha = (0.26 - a52D[L] * 0.08) * ef;
      sc.drawImage(tex, -wv * 0.5, 0, wv, hh);
      sc.restore();
    }
  }

  /* 暗角：压住画面边缘（也避免亮帘贴边） */
  const vg2 = sc.createRadialGradient(bw * 0.5, bh * 0.5, bh * 0.24,
    bw * 0.5, bh * 0.5, bw * 0.68);
  vg2.addColorStop(0, 'rgba(2,4,10,0)');
  vg2.addColorStop(0.62, 'rgba(2,4,10,0.20)');
  vg2.addColorStop(1, 'rgba(2,4,10,0.72)');
  sc.fillStyle = vg2; sc.fillRect(0, 0, bw, bh);

  /* 底缘辉光贴图：青绿 / 紫 两张，预烘（半径小于半高，四边透明） */
  if (!a52Glow) {
    a52Glow = [document.createElement('canvas'), document.createElement('canvas')];
    const gc = [
      ['rgba(80,245,200,0.50)', 'rgba(40,185,165,0.18)'],
      ['rgba(150,120,255,0.44)', 'rgba(85,75,215,0.16)']
    ];
    for (let k = 0; k < 2; k++) {
      const c = a52Glow[k];
      c.width = 256; c.height = 128;
      const cc = c.getContext('2d');
      const rg = cc.createRadialGradient(128, 64, 0, 128, 64, 58);
      rg.addColorStop(0, gc[k][0]);
      rg.addColorStop(0.5, gc[k][1]);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      cc.fillStyle = rg; cc.fillRect(0, 0, 256, 128);
    }
  }
}

/* ============================ 每帧 ============================ */
function mechDraw(T, z, pjX, pjY) {
  const [ar, ag, ab] = accent;

  if (a52Sky) ctx.drawImage(a52Sky, 0, 0, W, H);

  const cosR = Math.cos(cam.rot), sinR = Math.sin(cam.rot);
  const ax = W / 2 + cam.shx, ay = H / 2 + cam.shy;
  for (let L = 0; L < A52_L; L++) a52Z[L] = z * (1 - a52D[L] * 0.05);
  const zHost = a52Z[a52Host];

  ctx.globalCompositeOperation = 'lighter';

  /* ---- 帷幕底缘的辉光：被风带着走 ---- */
  const gust = a52Gust;
  for (let L = 0; L < A52_L; L++) {
    const ph = a52Ph[L];
    let gxp = W * 0.5 + Math.sin(T * 0.40 + ph) * W * 0.30
      + gust * a52GustDir * 30;
    if (gxp < W * 0.20) gxp = W * 0.20;
    if (gxp > W * 0.80) gxp = W * 0.80;
    const by = a52Bot[L] + Math.sin(gxp * 0.0038 + ph * 2.1 + T * 0.3) * a52Boom[L];
    const gw = W * (0.24 + 0.06 * Math.sin(ph)), gh = H * 0.075;
    let al = 0.08 + 0.04 * Math.sin(T * 0.8 + ph) + 0.15 * gust;
    al = Math.max(0, Math.min(0.26, al));
    ctx.globalAlpha = al;
    ctx.drawImage(a52Glow[L & 1], gxp - gw * 0.5, by - gh * 0.5, gw, gh);
  }
  ctx.globalAlpha = 1;

  /* ---- 粒子：先算一遍屏幕位置，再按亮度 3 档批量填 ---- */
  /* 文字整体跟着宿主帘轻轻摆，但每个字形点仍被精确吸住 */
  const tsw = a52Sway(W * 0.5, 0.7, a52Host, T) * 0.12;
  for (let i = 0; i < A52_N; i++) {
    const L = a52lay[i];
    let u = a52u[i], v = a52v[i], band = a52band[i], sz = a52sz[i];
    let a = 0, gx = 0, gy = 0;

    if (i >= a52Body) {
      const gl = charGlow[a52ch[i]] || 0;
      a = gl * a52wt[i];
      if (a > 1) a = 1;
      a = a * a * (3 - 2 * a);
      if (a > 0.0005) {
        gx = a52gx[i]; gy = a52gy[i];
        u = a52uR[i] + (a52uG[i] - a52uR[i]) * a;
        v = a52vR[i] + (a52vG[i] - a52vR[i]) * a;
      }
    }

    let vv = v + T * a52spd[i] * (1 - a);
    vv -= Math.floor(vv);

    const xBase = a52X0[L] + u * a52WW[L];
    const x = xBase + a52Sway(xBase, vv, L, T) + a52jx[i];
    const bot = a52Bot[L] + Math.sin(x * 0.0038 + a52Ph[L] * 2.1 + T * 0.3) * a52Boom[L]
      + gust * a52GustDir * 12 * vv;
    let y = a52Top[L] + vv * (bot - a52Top[L]) + a52jy[i];

    let xf = x, yf = y;
    if (a > 0.0005) {
      xf = x + (gx + tsw - x) * a;
      yf = y + (gy - y) * a;
      if (a > 0.55) band = 2;
      else if (a > 0.20) band = 1;
    }

    const zl = a52Z[L] + (zHost - a52Z[L]) * a;
    const dx = (xf - cam.x) * zl, dy = (yf - cam.y) * zl;
    const px = ax + dx * cosR - dy * sinR;
    const py = ay + dx * sinR + dy * cosR;
    if (px < 15 || px > W - 15 || py < 15 || py > H - 15) continue;

    let w, h;
    if (band === 2) { w = 1.35 + 0.35 * sz; h = 2.0 + 0.6 * sz; }
    else {
      const hb = L === a52Host ? 1.12 : 1;     /* 承载文字的那层帘最亮 */
      w = sz * 1.02 * hb; h = sz * (1.7 + 3.1 * vv) * hb;
    }
    a52sx[i] = px; a52sy[i] = py; a52sw[i] = w; a52sh[i] = h; a52sb[i] = band;
  }

  ctx.fillStyle = 'rgba(30,226,168,0.40)';
  ctx.beginPath();
  for (let i = 0; i < A52_N; i++) {
    if (a52sb[i] !== 0) continue;
    const w = a52sw[i], h = a52sh[i];
    ctx.rect(a52sx[i] - w * 0.5, a52sy[i] - h * 0.5, w, h);
  }
  ctx.fill();

  ctx.fillStyle = `rgba(${Math.min(255, ar)},${Math.max(0, ag - 78)},${Math.min(255, ab)},0.33)`;
  ctx.beginPath();
  for (let i = 0; i < A52_N; i++) {
    if (a52sb[i] !== 1) continue;
    const w = a52sw[i], h = a52sh[i];
    ctx.rect(a52sx[i] - w * 0.5, a52sy[i] - h * 0.5, w, h);
  }
  ctx.fill();

  /* 字的外晕：只有最亮那档参与，范围很小，避免糊成白条 */
  if (a52Let > 0) {
    ctx.fillStyle = 'rgba(190,255,236,0.05)';
    ctx.beginPath();
    for (let i = a52Body; i < A52_N; i++) {
      if (a52sb[i] !== 2) continue;
      const w = a52sw[i], h = a52sh[i];
      ctx.rect(a52sx[i] - w * 0.6, a52sy[i] - h * 0.6, w * 1.2, h * 1.2);
    }
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(238,255,250,0.95)';
  ctx.beginPath();
  for (let i = 0; i < A52_N; i++) {
    if (a52sb[i] !== 2) continue;
    const w = a52sw[i], h = a52sh[i];
    ctx.rect(a52sx[i] - w * 0.5, a52sy[i] - h * 0.5, w, h);
  }
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
}

/* ===== v2 实体字覆盖层（自足版 rev2）：时间驱动 + 字区压暗，专治"旧机制自己那份字"错位重影 =====
   10-27 那批薄实现的机制留在下面当装饰；这一层在字区先铺一张柔边暗片（把底下的旧字压掉），
   再画实体字（三档 + 暗影 + 光晕），保证整句可读且不出现双描。                        */
const V2N = 7000;
const v2x = new Float32Array(V2N), v2y = new Float32Array(V2N);
const v2tx = new Float32Array(V2N), v2ty = new Float32Array(V2N);
const v2onw = new Int16Array(V2N), v2lum = new Float32Array(V2N);
const v2sx = new Float32Array(V2N), v2sy = new Float32Array(V2N), v2ss = new Float32Array(V2N);
const v2dz = new Float32Array(V2N);
let v2n = 0, v2lastL = null;
let v2core = 'rgb(244,248,255)', v2mid = 'rgb(178,205,242)', v2dim = 'rgb(64,84,116)';
let v2plate = null, v2pw = 0, v2ph = 0;

function v2prep() {
  const pc = L.pc;
  v2n = Math.min(V2N, Math.max(2000, pc >> 2));
  let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
  for (let i = 0; i < v2n; i++) {
    const pi = (i * pc / v2n) | 0;
    v2tx[i] = L.px[pi]; v2ty[i] = L.py[pi];
    v2onw[i] = L.own[pi];
    v2dz[i] = (Math.random() - 0.5) * 22;
    v2x[i] = v2tx[i]; v2y[i] = v2ty[i];
    if (v2tx[i] < mnx) mnx = v2tx[i]; if (v2tx[i] > mxx) mxx = v2tx[i];
    if (v2ty[i] < mny) mny = v2ty[i]; if (v2ty[i] > mxy) mxy = v2ty[i];
  }
  const a = accent || [186, 206, 255];
  v2core = 'rgb(' + (Math.min(255, 205 + a[0] * 0.20) | 0) + ',' + (Math.min(255, 212 + a[1] * 0.17) | 0) + ',' + (Math.min(255, 226 + a[2] * 0.11) | 0) + ')';
  v2mid = 'rgb(' + ((120 + a[0] * 0.55) | 0) + ',' + ((150 + a[1] * 0.42) | 0) + ',' + (Math.min(255, 170 + a[2] * 0.32) | 0) + ')';
  v2dim = 'rgb(' + ((30 + a[0] * 0.28) | 0) + ',' + ((40 + a[1] * 0.26) | 0) + ',' + ((55 + a[2] * 0.26) | 0) + ')';
  /* 字区压暗片（柔边），把底下旧机制那份字压掉 */
  v2pw = Math.max(320, Math.ceil((mxx - mnx) + 360));
  v2ph = Math.max(200, Math.ceil((mxy - mny) + 280));
  v2plate = document.createElement('canvas');
  v2plate.width = v2pw; v2plate.height = v2ph;
  const g = v2plate.getContext('2d');
  const gr = g.createRadialGradient(v2pw / 2, v2ph / 2, Math.min(v2pw, v2ph) * 0.10,
    v2pw / 2, v2ph / 2, Math.max(v2pw, v2ph) * 0.72);
  gr.addColorStop(0, 'rgba(4,6,11,0.40)');
  gr.addColorStop(0.55, 'rgba(4,6,11,0.26)');
  gr.addColorStop(0.82, 'rgba(4,6,11,0.07)');
  gr.addColorStop(1, 'rgba(4,6,11,0)');
  g.fillStyle = gr; g.fillRect(0, 0, v2pw, v2ph);
}

const v2prevDraw = mechDraw;
mechDraw = function (T, z, pjX, pjY) {
  v2prevDraw(T, z, pjX, pjY);
  if (!L || !L.pc) return;
  if (v2lastL !== L) { v2lastL = L; v2prep(); }
  if (!v2n) return;
  const enter = clamp01((T - lineT) / 1.1);
  /* 1) 字区压暗（压掉旧机制自己的那份字） */
  if (v2plate && enter > 0.15) {
    const cxs = pjX(blockGx, blockGy), cys = pjY(blockGx, blockGy);
    const wp = v2pw * z, hp = v2ph * z;
    ctx.globalAlpha = Math.min(1, (enter - 0.15) * 1.6);
    ctx.drawImage(v2plate, cxs - wp / 2, cys - hp / 2, wp, hp);
    ctx.globalAlpha = 1;
  }
  const yaw = Math.sin(T * 0.20) * 0.15, pit = 0.06 * Math.sin(T * 0.17);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit);
  for (let i = 0; i < v2n; i++) {
    const X0 = v2x[i], Y0 = v2y[i], Z0 = v2dz[i];
    const X1 = X0 * cy + Z0 * sy, Z1 = -X0 * sy + Z0 * cy;
    const Y1 = Y0 * cp - Z1 * sp, Z2 = Y0 * sp + Z1 * cp;
    const s = 900 / (900 + Z2);
    v2sx[i] = pjX(blockGx + X1 * s, blockGy + Y1 * s);
    v2sy[i] = pjY(blockGx + X1 * s, blockGy + Y1 * s);
    v2ss[i] = s;
    const gl = charGlow[v2onw[i]] || 0;
    v2lum[i] = clamp01(0.66 + 0.18 * Math.sin(T * 1.05 - X1 / 260) + 0.26 * gl);
  }
  ctx.globalAlpha = 0.34 * enter; ctx.fillStyle = '#000';
  ctx.beginPath();
  for (let i = 0; i < v2n; i++) { const r = 3.0 * v2ss[i]; ctx.rect(v2sx[i] + 3, v2sy[i] + 4, r * 2, r * 2); }
  ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.06 * enter; ctx.fillStyle = v2core;
  ctx.beginPath();
  for (let i = 0; i < v2n; i++) { if (v2lum[i] < 0.66 || (i % 2)) continue; const r = 5.0 * v2ss[i]; ctx.rect(v2sx[i] - r, v2sy[i] - r, r * 2, r * 2); }
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  const v2bands = [[0.56, 1.0, 1.0], [0.26, 0.80, 0.90], [-1, 0.58, 0.76]];
  const v2cols = [v2core, v2mid, v2dim];
  for (let b = 0; b < 3; b++) {
    const lo = v2bands[b][0], hi = b === 0 ? 1.01 : v2bands[b - 1][0];
    ctx.globalAlpha = v2bands[b][1] * enter;
    ctx.fillStyle = v2cols[b];
    ctx.beginPath();
    let any = 0;
    for (let i = 0; i < v2n; i++) {
      const l = v2lum[i];
      if (l < lo || l >= hi) continue;
      const rr = 3.0 * v2bands[b][2] * v2ss[i];
      ctx.rect(v2sx[i] - rr, v2sy[i] - rr, rr * 2, rr * 2);
      any++;
    }
    if (any) ctx.fill();
  }
  ctx.globalAlpha = 1;
};




/* 启动必须在机制片段之后：机制里的 const/let 在此之前还处于暂时性死区 */
resize();
requestAnimationFrame(frame);
</script>
