<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>对折旅馆</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#F3E8D2;
    font-family:"Futura","Avenir Next","Century Gothic","Helvetica Neue","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;color:#3B342C}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="cv" aria-label="对折旅馆 歌词舞台"></canvas>
<noscript>需要启用 JavaScript</noscript>
<script>
(function(){
  'use strict';

  /* ---------------- 状态 ---------------- */
  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', text: '', rm: false, gl: false, total: 0,
    cells: [], rows: [], lsize: 24, lend: 0, prog: 0,
    pulse: 0, bass: 0, mid: 0, tre: 0, bpm: 0, loaded: 0,
    grainCanvas: null, grainPat: null, empty: true, songName: ''
  };
  var view = { w: 1440, h: 900, dpr: 1, s: 1,
               F: { x: 0, y: 0, w: 1440, h: 900, u: 900 } };
  var el = {};
  var G = null;
  var LOADED = 0;
  var FONT = '"Futura","Avenir Next","Century Gothic","Helvetica Neue","Microsoft YaHei","PingFang SC",sans-serif';
  var PAL = {
    cream:'#F7EEDB', cream2:'#EFE2C8', ink:'#2E2823', ink2:'#4A4038',
    mint:'#A9D6C3', mintD:'#8FC3AF', pink:'#E7A0AC', pinkD:'#D2869A',
    mustard:'#E2AF4B', mustardD:'#C8922F', brass:'#C9A227', mute:'#8C7E6E'
  };

  /* ---------------- 布局 ---------------- */

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    if(!isFinite(w) || w <= 0) w = 1440;
    if(!isFinite(h) || h <= 0) h = 900;
    view.w = w; view.h = h;
    view.dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    var pad = Math.min(w, h) * 0.035;
    var aw = Math.max(120, w - pad * 2), ah = Math.max(120, h - pad * 2);
    var asp = aw / ah;
    if(!isFinite(asp) || asp <= 0) asp = 1.6;
    asp = Math.max(0.52, Math.min(1.72, asp));
    var fw = aw, fh = fw / asp;
    if(fh > ah){ fh = ah; fw = fh * asp; }
    view.F = { x: (w - fw) / 2, y: (h - fh) / 2, w: fw, h: fh, u: Math.min(fw, fh) };
    if(el.cv){
      el.cv.width = Math.round(w * view.dpr);
      el.cv.height = Math.round(h * view.dpr);
    }
    layoutLyric();
  }

  /* ---------------- 歌词数据 ---------------- */
  function normLines(lines){
    var out = [];
    if(!lines || !lines.length) return out;
    var n = Math.min(lines.length, 400);
    for(var i = 0; i < n; i++){
      var L = lines[i] || {};
      var text = (typeof L.text === 'string') ? L.text : '';
      if(!text) text = '';
      var t = num(L.t, 0), dur = num(L.dur, 0);
      var chars = null;
      if(L.chars && L.chars.length){
        var cn = Math.min(L.chars.length, 300), arr = [];
        for(var j = 0; j < cn; j++){
          var c = L.chars[j] || {};
          arr.push({ c: typeof c.c === 'string' ? c.c : '', t: num(c.t, t) });
        }
        chars = arr;
      }
      out.push({ t: t, dur: dur, text: text, chars: chars });
    }
    return out;
  }
  function num(v, d){ v = +v; return isFinite(v) ? v : d; }

  function currentIdx(t){
    var L = S.lines, lo = -1;
    for(var i = 0; i < L.length; i++){ if(L[i].t <= t + 0.02) lo = i; }
    return lo;
  }

  /* ---------------- 收消息 ---------------- */
  function onInit(p){
    p = p || {};
    S.lines = normLines(p.lines);
    S.total = num(p.duration, 0);
    S.t = 0; S.idx = -1; S.text = ''; S.empty = !S.lines.length;
    S.rows = []; S.cells = []; S.lsize = 24; S.lend = 0;
    /* init 无 playing 字段时按"正在播放"处理 */
    S.playing = (typeof p.playing === 'boolean') ? p.playing : true;
    S.songName = '';
    try{
      var so = p.song || {};
      var ar = so.artists;
      if(ar && ar.length) S.songName = String(ar).slice(0, 40);
    }catch(e){ console.error('[442] song', e); }
    var accent = p.accent;
    if(accent && accent.length >= 3) applyAccent(accent);
    S.loaded = 1;
    prepLine();
  }
  function applyAccent(a){
    try{
      var r = clamp8(a[0]), g = clamp8(a[1]), b = clamp8(a[2]);
      /* 只把 accent 混进副色，保持马卡龙主调不被脏色打乱 */
      if(r + g + b < 120) return;
      PAL.pinkD = mixHex(PAL.pinkD, [r, g, b], 0.30);
      PAL.pink = mixHex(PAL.pink, [r, g, b], 0.16);
    }catch(e){ console.error('[442] accent', e); }
  }
  function mixHex(hex, rgb, k){
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * (1 - k) + rgb[0] * k);
    var g = Math.round(((n >> 8) & 255) * (1 - k) + rgb[1] * k);
    var b = Math.round((n & 255) * (1 - k) + rgb[2] * k);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function clamp8(v){ v = Math.round(num(v, 0)); return v < 0 ? 0 : v > 255 ? 255 : v; }

  function onTick(p){
    p = p || {};
    S.t = num(p.time, S.t);
    S.playing = !!p.playing;
    var i = currentIdx(S.t);
    if(i !== S.idx){ S.idx = i; prepLine(); }
    S.text = i >= 0 ? S.lines[i].text : '';
  }

  window.addEventListener('message', function(ev){
    try{
      var m = ev.data;
      if(!m || m.__c100 !== 1) return;
      if(m.type === 'init') onInit(m.payload);
      else if(m.type === 'tick') onTick(m.payload);
      else if(m.type === 'beat') onBeat(m.payload || {});
      else if(m.type === 'live') onLive(m.payload || {});
    }catch(e){ console.error('[442] msg', e); }
  }, false);

  function onBeat(p){
    var lv = num(p.level, 0.5);
    S.pulse = Math.max(S.pulse || 0, Math.max(0, Math.min(1, lv)));
    S.beatAt = S.frames;
    S.beats = (S.beats || 0) + 1;
  }
  function onLive(p){
    S.bpm = num(p.bpm, S.bpm || 0);
    S.bass = num(p.bass, S.bass || 0);
    S.mid = num(p.mid, S.mid || 0);
    S.tre = num(p.treble, S.tre || 0);
    if(typeof p.playing === 'boolean') S.livePlaying = p.playing;
  }

  /* ---------------- 文字排版 ---------------- */
  function prepLine(){
    S.cells = []; S.rows = []; S.prog = 0;
    var L = (S.idx >= 0) ? S.lines[S.idx] : null;
    if(!L) return;
    var text = L.text || '';
    var n = text.length;
    if(!n) return;
    var t0 = L.t, dur = L.dur > 0 ? L.dur : Math.max(1.4, n * 0.19);
    var ch = L.chars;
    var exact = !!(ch && ch.length === n);
    var cc = (ch && ch.length) ? Math.min(ch.length, 300) : 0;
    for(var i = 0; i < n; i++){
      var ct;
      if(exact) ct = ch[i] && isFinite(ch[i].t) ? ch[i].t : t0 + dur * i / n;
      else if(cc && i < cc && ch[i] && isFinite(ch[i].t)) ct = ch[i].t;
      else ct = t0 + dur * i / n;
      S.cells.push({ c: text.charAt(i), t: ct });
    }
    S.lend = t0 + dur;
    layoutLyric();
  }

  function layoutLyric(){
    if(!G || !S.cells.length){ S.rows = []; S.lsize = 24; return; }
    var F = view.F;
    var B = band();
    var maxRows = F.w < F.h * 0.78 ? 3 : 2;
    var maxW = Math.min(F.w * 0.84, 900);
    var s = Math.max(13, Math.min(B.h * (maxRows > 2 ? 0.30 : 0.42), F.w * 0.062));
    var rows = measureRows(S.cells, s, maxW), k;
    for(k = 0; k < 36; k++){
      if(rows.length <= maxRows && rows.length * s * 1.28 <= B.h * 0.80) break;
      s *= 0.93;
      if(s < 10){
        /* 极长句：夹到 2 行，允许横向压缩 */
        s = 10; rows = measureRows(S.cells, s, maxW); break;
      }
      rows = measureRows(S.cells, s, maxW);
    }
    /* 单行时尽量撑满面板可用宽度 */
    if(rows.length === 1){
      for(k = 0; k < 20; k++){
        var nx = s * 1.05;
        if(nx > F.h * 0.115) break;
        var r2 = measureRows(S.cells, nx, maxW);
        if(r2.length !== 1 || r2[0].w > maxW) break;
        s = nx; rows = r2;
      }
    }
    S.lsize = s;
    S.rows = rows;
  }

  function measureRows(cells, size, maxW){
    G.font = '700 ' + size.toFixed(1) + 'px ' + FONT;
    var rows = [], cur = [], curW = 0;
    for(var i = 0; i < cells.length; i++){
      var cell = cells[i];
      var w = G.measureText(cell.c).width;
      if(!isFinite(w) || w < 0) w = size * 0.6;
      if(curW + w > maxW && cur.length){ rows.push({ cells: cur, w: curW }); cur = []; curW = 0; }
      cur.push({ c: cell.c, t: cell.t, w: w, x: curW });
      curW += w;
    }
    if(cur.length) rows.push({ cells: cur, w: curW });
    return rows;
  }

  function lineProgress(){
    var L = (S.idx >= 0) ? S.lines[S.idx] : null;
    if(!L) return 0;
    var t0 = L.t, t1 = S.lend || (t0 + 2);
    if(t1 <= t0) return 1;
    var p = (S.t - t0) / (t1 - t0);
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }


  /* ---------------- 绘制工具 ---------------- */
  function rr(x, y, w, h, r){
    var m = Math.min(w, h) * 0.5;
    r = Math.max(0, Math.min(r, m));
    G.beginPath();
    G.moveTo(x + r, y);
    G.lineTo(x + w - r, y); G.quadraticCurveTo(x + w, y, x + w, y + r);
    G.lineTo(x + w, y + h - r); G.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    G.lineTo(x + r, y + h); G.quadraticCurveTo(x, y + h, x, y + h - r);
    G.lineTo(x, y + r); G.quadraticCurveTo(x, y, x + r, y);
    G.closePath();
  }
  function fillRR(x, y, w, h, r, col){
    G.fillStyle = col; rr(x, y, w, h, r); G.fill();
  }
  function shade(hex, d){
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r * d)));
    g = Math.max(0, Math.min(255, Math.round(g * d)));
    b = Math.max(0, Math.min(255, Math.round(b * d)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function rgba(r, g, b, a){ return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }

  /* ---------------- 场景 ---------------- */
  var FX = { pulse: 0, flash: 0, sway: 0, bloom: 0 };

  function drawScene(now){
    var F = view.F, u = F.u;
    var cx = F.x + F.w / 2;
    var beat = S.rm ? 0 : FX.pulse;
    var bass = S.rm ? 0 : Math.min(1, Math.max(0, S.bass || 0));

    G.save();
    G.translate(cx, F.y + F.h / 2);
    G.scale(1 + beat * 0.010, 1 + beat * 0.010);
    G.translate(-cx, -(F.y + F.h / 2));

    var wallY = F.y + F.h * 0.715;

    /* 墙：奶油白 + 极淡竖向条纹（马卡龙层次，不抢字） */
    G.fillStyle = PAL.cream;
    G.fillRect(F.x, F.y, F.w, wallY - F.y);
    G.fillStyle = 'rgba(169,214,195,0.22)';
    var i, sn = 22, sw = F.w / sn;
    for(i = 0; i < sn; i += 2) G.fillRect(F.x + i * sw, F.y, sw, wallY - F.y);

    /* 顶部檐口线（薄荷 + 芥末双线） */
    G.fillStyle = PAL.mint;
    G.fillRect(F.x, F.y + F.h * 0.062, F.w, F.u * 0.011);
    G.fillStyle = PAL.mustard;
    G.fillRect(F.x, F.y + F.h * 0.062 + F.u * 0.011, F.w, F.u * 0.0042);

    /* 左右对称的两扇窗 */
    var winW = F.w * 0.135, winH = F.h * 0.150;
    var winY = F.y + F.h * 0.185;
    var winOff = F.w * 0.205;
    drawWindow(cx - winOff - winW / 2, winY, winW, winH, u);
    drawWindow(cx + winOff - winW / 2, winY, winW, winH, u);

    /* 地板 + 踢脚线 */
    G.fillStyle = '#E8D8B7';
    G.fillRect(F.x, wallY, F.w, F.y + F.h - wallY);
    G.fillStyle = PAL.mintD;
    G.fillRect(F.x, wallY - u * 0.009, F.w, u * 0.009);
    drawFloor(F, wallY, cx, u);

    /* 中央招牌牌匾 */
    drawPlaque(cx, F.y + F.h * 0.098, F, u);

    /* 主角（在柜台之后） */
    drawFigure(cx, F, u, now, beat);

    /* 柜台（前景，遮住下半身） */
    drawCounter(cx, F, u, beat, bass);

    /* 顶部署名 */
    drawTitle(cx, F.y, F, u);

    G.restore();
  }

  function drawFloor(F, wallY, cx, u){
    var depth = F.y + F.h - wallY;
    if(depth <= 1) return;
    G.save();
    G.beginPath(); G.rect(F.x, wallY, F.w, depth); G.clip();
    var cols = 10, rows = 4, i, j;
    for(j = 0; j < rows; j++){
      var t0 = j / rows, t1 = (j + 1) / rows;
      var y0 = wallY + depth * t0, y1 = wallY + depth * t1;
      for(i = 0; i < cols; i++){
        var a0 = F.x + F.w * (i / cols), a1 = F.x + F.w * ((i + 1) / cols);
        var k0 = 0.72 + 0.42 * t0, k1 = 0.72 + 0.42 * t1;
        var sa0 = cx + (a0 - cx) * k0, sa1 = cx + (a1 - cx) * k0;
        var sb0 = cx + (a0 - cx) * k1, sb1 = cx + (a1 - cx) * k1;
        G.fillStyle = ((i + j) % 2 === 0) ? '#E0CEA9' : '#F3E7CE';
        G.beginPath();
        G.moveTo(sa0, y0); G.lineTo(sa1, y0); G.lineTo(sb1, y1); G.lineTo(sb0, y1);
        G.closePath(); G.fill();
      }
    }
    G.restore();
    /* 中央粉地毯：强化对称轴 */
    G.fillStyle = 'rgba(214,140,158,0.30)';
    G.beginPath();
    G.moveTo(cx - F.w * 0.185, wallY + depth * 0.05);
    G.lineTo(cx + F.w * 0.185, wallY + depth * 0.05);
    G.lineTo(cx + F.w * 0.30, F.y + F.h);
    G.lineTo(cx - F.w * 0.30, F.y + F.h);
    G.closePath(); G.fill();
  }

  function drawWindow(x, y, w, h, u){
    var awH = h * 0.22;
    /* 遮阳篷：粉白竖条 */
    var n = 8, i;
    for(i = 0; i < n; i++){
      G.fillStyle = (i % 2 === 0) ? PAL.pink : PAL.cream;
      var ax0 = x - u * 0.018 + (w + u * 0.036) * (i / n);
      var ax1 = x - u * 0.018 + (w + u * 0.036) * ((i + 1) / n);
      G.beginPath();
      G.moveTo(ax0, y - awH); G.lineTo(ax1, y - awH);
      G.lineTo(ax1, y); G.lineTo(ax0, y);
      G.closePath(); G.fill();
    }
    G.fillStyle = shade(PAL.pink, 0.86);
    G.fillRect(x - u * 0.018, y - awH, w + u * 0.036, u * 0.006);
    /* 窗框 */
    fillRR(x - u * 0.012, y - u * 0.012, w + u * 0.024, h + u * 0.024, u * 0.010, PAL.cream2);
    var gd = G.createLinearGradient(0, y, 0, y + h);
    gd.addColorStop(0, '#C7E6D9');
    gd.addColorStop(1, '#8FC3AF');
    G.fillStyle = gd; G.fillRect(x, y, w, h);
    /* 窗棂：两侧对称 */
    G.fillStyle = PAL.cream2;
    G.fillRect(x + w / 2 - u * 0.005, y, u * 0.010, h);
    G.fillRect(x, y + h * 0.44, w, u * 0.010);
    /* 玻璃高光：45° 斜条 */
    G.fillStyle = 'rgba(255,255,255,0.30)';
    G.beginPath();
    G.moveTo(x + w * 0.14, y + h); G.lineTo(x + w * 0.40, y); G.lineTo(x + w * 0.52, y); G.lineTo(x + w * 0.26, y + h);
    G.closePath(); G.fill();
    /* 窗台 */
    G.fillStyle = PAL.cream2;
    G.fillRect(x - u * 0.020, y + h, w + u * 0.040, u * 0.012);
  }

  function drawPlaque(cx, y, F, u){
    var pw = F.w * 0.255, ph = F.h * 0.072;
    var px = cx - pw / 2;
    fillRR(px, y, pw, ph, u * 0.006, PAL.mintD);
    fillRR(px + u * 0.006, y + u * 0.006, pw - u * 0.012, ph - u * 0.012, u * 0.004, PAL.mint);
    G.textAlign = 'center'; G.textBaseline = 'middle';
    G.fillStyle = PAL.ink;
    G.font = '700 ' + (ph * 0.34).toFixed(1) + 'px ' + FONT;
    G.fillText('V A C A N C Y', cx, y + ph * 0.40);
    G.fillStyle = PAL.ink2;
    G.font = '400 ' + (ph * 0.19).toFixed(1) + 'px ' + FONT;
    G.fillText('R O O M S   \u00b7   N O .  4 4 2', cx, y + ph * 0.71);
  }

  function drawCounter(cx, F, u, beat, bass){
    var w = F.w * 0.50, h = F.h * 0.105;
    var x = cx - w / 2, y = F.y + F.h * 0.578;
    /* 柜体：芥末黄 */
    G.fillStyle = PAL.mustard;
    G.fillRect(x, y, w, h);
    /* 竖向压条 */
    G.fillStyle = shade(PAL.mustard, 0.93);
    var i, n = 8;
    for(i = 1; i < n; i++){
      if(i % 2) continue;
      G.fillRect(x + w * (i / n) - u * 0.003, y, u * 0.006, h);
    }
    /* 台面：奶油白厚板 */
    G.fillStyle = PAL.cream;
    G.fillRect(x - u * 0.020, y - u * 0.024, w + u * 0.040, u * 0.024);
    G.fillStyle = shade(PAL.cream, 0.88);
    G.fillRect(x - u * 0.020, y - u * 0.004, w + u * 0.040, u * 0.005);
    /* 中央黄铜铃：绝对对称点 */
    var by = y - u * 0.024;
    G.fillStyle = PAL.brass;
    G.beginPath(); G.arc(cx, by - u * 0.006, u * 0.016, Math.PI, 0); G.fill();
    G.fillStyle = shade(PAL.brass, 0.72);
    G.fillRect(cx - u * 0.004, by - u * 0.020, u * 0.008, u * 0.008);
    G.fillStyle = shade(PAL.brass, 0.90);
    G.fillRect(cx - u * 0.020, by - u * 0.006, u * 0.040, u * 0.004);
    /* 两侧台灯，随 bass 微微亮 */
    drawLamp(cx - w * 0.36, by, u, 0.5 + bass * 0.5);
    drawLamp(cx + w * 0.36, by, u, 0.5 + bass * 0.5);
    /* 柜面中央小牌 */
    G.fillStyle = PAL.ink;
    G.font = '700 ' + (u * 0.016).toFixed(1) + 'px ' + FONT;
    G.textAlign = 'center'; G.textBaseline = 'middle';
    G.fillText('\u2014 \u2014 \u2014', cx, y + h * 0.55);
  }

  function drawLamp(x, baseY, u, glow){
    G.strokeStyle = PAL.ink2;
    G.lineWidth = Math.max(1, u * 0.005);
    G.beginPath(); G.moveTo(x, baseY); G.lineTo(x, baseY - u * 0.105); G.stroke();
    G.fillStyle = shade(PAL.brass, 0.9);
    G.beginPath(); G.ellipse(x, baseY, u * 0.020, u * 0.006, 0, 0, Math.PI * 2); G.fill();
    var g = G.createRadialGradient(x, baseY - u * 0.112, 0, x, baseY - u * 0.112, u * 0.115);
    g.addColorStop(0, 'rgba(255,238,183,' + (0.30 + 0.28 * glow).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,238,183,0)');
    G.fillStyle = g;
    G.beginPath(); G.arc(x, baseY - u * 0.112, u * 0.115, 0, Math.PI * 2); G.fill();
    G.fillStyle = PAL.cream;
    G.beginPath();
    G.moveTo(x - u * 0.036, baseY - u * 0.105);
    G.lineTo(x + u * 0.036, baseY - u * 0.105);
    G.lineTo(x + u * 0.022, baseY - u * 0.150);
    G.lineTo(x - u * 0.022, baseY - u * 0.150);
    G.closePath(); G.fill();
    G.fillStyle = PAL.mustard;
    G.beginPath(); G.ellipse(x, baseY - u * 0.150, u * 0.022, u * 0.006, 0, 0, Math.PI * 2); G.fill();
    G.fillStyle = PAL.pink;
    G.beginPath(); G.ellipse(x, baseY - u * 0.107, u * 0.034, u * 0.004, 0, 0, Math.PI * 2); G.fill();
  }

  function drawFigure(cx, F, u, now, beat){
    var bob = S.rm ? 0 : Math.sin(now * 0.0012) * u * 0.003;
    var headY = F.y + F.h * 0.335 + bob;
    var headR = Math.max(8, u * 0.058);
    var bodyW = u * 0.185;
    var bodyTop = headY + headR * 1.20;
    var bodyBot = F.y + F.h * 0.635;

    /* 肩线（梯形躯干，芥末黄制服） */
    G.fillStyle = PAL.mustard;
    G.beginPath();
    G.moveTo(cx - bodyW * 0.46, bodyTop + headR * 0.30);
    G.lineTo(cx + bodyW * 0.46, bodyTop + headR * 0.30);
    G.lineTo(cx + bodyW * 0.62, bodyBot);
    G.lineTo(cx - bodyW * 0.62, bodyBot);
    G.closePath(); G.fill();
    /* 领口：两片对称翻领 */
    G.fillStyle = shade(PAL.mustard, 1.14);
    G.beginPath();
    G.moveTo(cx - bodyW * 0.20, bodyTop + headR * 0.26);
    G.lineTo(cx, bodyTop + headR * 0.92);
    G.lineTo(cx - bodyW * 0.40, bodyTop + headR * 0.92);
    G.closePath(); G.fill();
    G.beginPath();
    G.moveTo(cx + bodyW * 0.20, bodyTop + headR * 0.26);
    G.lineTo(cx, bodyTop + headR * 0.92);
    G.lineTo(cx + bodyW * 0.40, bodyTop + headR * 0.92);
    G.closePath(); G.fill();
    /* 中缝 + 纽扣（对称） */
    G.fillStyle = shade(PAL.mustard, 0.82);
    G.fillRect(cx - Math.max(0.5, u * 0.0012), bodyTop + headR * 0.9, Math.max(1, u * 0.0024), bodyBot - bodyTop);
    G.fillStyle = shade(PAL.brass, 0.85);
    var i;
    for(i = 0; i < 3; i++){
      G.beginPath(); G.arc(cx, bodyTop + headR * 1.25 + i * headR * 0.62, Math.max(1, u * 0.005), 0, Math.PI * 2); G.fill();
    }
    /* 胸牌 */
    fillRR(cx + bodyW * 0.13, bodyTop + headR * 1.15, bodyW * 0.20, headR * 0.34, u * 0.002, PAL.cream);

    /* 脖子 */
    G.fillStyle = '#E9C9AE';
    G.fillRect(cx - headR * 0.30, headY + headR * 0.65, headR * 0.60, headR * 0.62);
    /* 头 */
    G.fillStyle = '#F5DCC6';
    G.beginPath(); G.ellipse(cx, headY, headR * 0.86, headR, 0, 0, Math.PI * 2); G.fill();
    /* 头发：中分贴片（左右完全对称） */
    G.fillStyle = '#3B3129';
    G.beginPath();
    G.ellipse(cx, headY - headR * 0.34, headR * 0.90, headR * 0.72, 0, Math.PI, Math.PI * 2);
    G.fill();
    G.fillRect(cx - headR * 0.90, headY - headR * 0.40, headR * 0.26, headR * 0.58);
    G.fillRect(cx + headR * 0.64, headY - headR * 0.40, headR * 0.26, headR * 0.58);
    G.beginPath();
    G.moveTo(cx, headY - headR * 0.98);
    G.lineTo(cx - headR * 0.04, headY - headR * 0.52);
    G.lineTo(cx + headR * 0.04, headY - headR * 0.52);
    G.closePath(); G.fill();
    /* 眼睛：两粒黑点，平视镜头 */
    G.fillStyle = PAL.ink;
    G.beginPath(); G.ellipse(cx - headR * 0.33, headY + headR * 0.06, headR * 0.085, headR * 0.115, 0, 0, Math.PI * 2); G.fill();
    G.beginPath(); G.ellipse(cx + headR * 0.33, headY + headR * 0.06, headR * 0.085, headR * 0.115, 0, 0, Math.PI * 2); G.fill();
    /* 嘴：一条完全水平的线 —— 表情归零 */
    G.strokeStyle = PAL.ink2;
    G.lineWidth = Math.max(1, headR * 0.075);
    G.beginPath();
    G.moveTo(cx - headR * 0.20, headY + headR * 0.46);
    G.lineTo(cx + headR * 0.20, headY + headR * 0.46);
    G.stroke();
    /* 腮红：两团对称粉 */
    G.fillStyle = 'rgba(231,160,172,0.42)';
    G.beginPath(); G.arc(cx - headR * 0.56, headY + headR * 0.30, headR * 0.16, 0, Math.PI * 2); G.fill();
    G.beginPath(); G.arc(cx + headR * 0.56, headY + headR * 0.30, headR * 0.16, 0, Math.PI * 2); G.fill();
    /* 门童帽 */
    G.fillStyle = PAL.pink;
    fillRR(cx - headR * 0.82, headY - headR * 1.62, headR * 1.64, headR * 0.56, headR * 0.14, PAL.pink);
    G.fillStyle = shade(PAL.pink, 0.86);
    G.fillRect(cx - headR * 0.98, headY - headR * 1.16, headR * 1.96, headR * 0.15);
    G.fillStyle = PAL.brass;
    G.beginPath(); G.arc(cx, headY - headR * 1.34, headR * 0.11, 0, Math.PI * 2); G.fill();
  }

  function pad2(n){ n = Math.floor(Math.abs(num(n, 0))) % 100; return (n < 10 ? '0' : '') + n; }

  function drawTitle(cx, top, F, u){
    var fs = Math.max(9, Math.min(u * 0.030, F.w * 0.021));
    G.textAlign = 'center'; G.textBaseline = 'top';
    G.font = '700 ' + fs.toFixed(1) + 'px ' + FONT;
    G.fillStyle = PAL.ink2;
    var t = '\u2014  S Y M M E T R Y   H O T E L  \u2014';
    G.fillText(t, cx, top + F.h * 0.024);
    if(S.songName){
      G.font = '400 ' + (fs * 0.66).toFixed(1) + 'px ' + FONT;
      G.fillStyle = PAL.mute;
      G.fillText(String(S.songName).slice(0, 28), cx, top + F.h * 0.024 + fs * 1.7);
    }
  }

  /* ---------------- 歌词层 ---------------- */
  function band(){
    var F = view.F;
    var top = F.y + F.h * 0.723, bot = F.y + F.h * 0.962;
    return { top: top, bot: bot, h: Math.max(40, bot - top) };
  }

  function drawLyric(now){
    var F = view.F, u = F.u;
    var rows = S.rows, n = rows.length, i, j;
    var B = band();
    var lh = S.lsize * 1.28;
    var totalH = n * lh;
    var px = F.x + F.w / 2;

    /* 固定高度的"房卡"面板：文字永远落在同一块板上 */
    var maxW = 0, k;
    for(k = 0; k < n; k++) maxW = Math.max(maxW, rows[k].w);
    var padX = u * 0.036, padY = u * 0.020;
    var pw = Math.max(Math.min(F.w * 0.34, u * 0.34), maxW + padX * 2);
    pw = Math.min(pw, F.w * 0.94);
    var ph = Math.max(B.h * 0.62, Math.min(B.h, totalH + padY * 2));
    var bx = px - pw / 2;
    var by = B.top + (B.h - ph) / 2;

    /* 硬边奶油面板 + 墨色细框（亮底也不糊字） */
    fillRR(bx + u * 0.004, by + u * 0.006, pw, ph, u * 0.008, 'rgba(46,40,35,0.18)');
    fillRR(bx, by, pw, ph, u * 0.008, PAL.cream);
    G.strokeStyle = 'rgba(46,40,35,0.55)';
    G.lineWidth = Math.max(1, u * 0.0022);
    rr(bx, by, pw, ph, u * 0.008); G.stroke();
    /* 四角小铆钉，对称 */
    G.fillStyle = PAL.brass;
    var rx = pw * 0.022, ry = ph * 0.10, rzin = Math.max(1, u * 0.0035);
    G.beginPath(); G.arc(bx + rx, by + ry, rzin, 0, Math.PI * 2); G.fill();
    G.beginPath(); G.arc(bx + pw - rx, by + ry, rzin, 0, Math.PI * 2); G.fill();
    G.beginPath(); G.arc(bx + rx, by + ph - ry, rzin, 0, Math.PI * 2); G.fill();
    G.beginPath(); G.arc(bx + pw - rx, by + ph - ry, rzin, 0, Math.PI * 2); G.fill();
    /* 面板顶部一条薄荷细线 */
    G.fillStyle = PAL.mintD;
    G.fillRect(bx + pw * 0.07, by - Math.max(1, u * 0.0035), pw * 0.86, Math.max(1, u * 0.0035));

    if(!n){
      G.textAlign = 'center'; G.textBaseline = 'middle';
      G.font = '700 ' + Math.max(11, Math.min(u * 0.040, pw * 0.075)).toFixed(1) + 'px ' + FONT;
      G.fillStyle = PAL.ink2;
      G.fillText(S.loaded ? '\u672c\u66f2\u65e0\u6b4c\u8bcd \u00b7 \u8bf7\u5b89\u5fc3\u542c\u6b4c' : '\u7b49\u5f85\u6b4c\u66f2\u2026', px, by + ph / 2);
      return;
    }

    /* 文本基线：整块垂直居中 */
    var startBase = by + (ph - totalH) / 2 + S.lsize * 0.80;
    var played = PAL.ink, unplayed = 'rgba(66,54,43,0.40)';
    G.textAlign = 'left'; G.textBaseline = 'alphabetic';
    for(i = 0; i < n; i++){
      var row = rows[i], cells = row.cells, m = cells.length;
      var x0 = px - row.w / 2;
      var y0 = startBase + i * lh;
      G.font = '700 ' + S.lsize.toFixed(1) + 'px ' + FONT;
      for(j = 0; j < m; j++){
        var cell = cells[j];
        var cx2 = x0 + cell.x;
        if(S.t >= cell.t - 0.001){
          G.fillStyle = played;
          G.fillText(cell.c, cx2, y0);
          var dt = S.t - cell.t;
          /* 刚唱出的字：一条粉色底线，随即消失 */
          if(dt < 0.34 && !S.rm){
            var a = 1 - dt / 0.34;
            G.fillStyle = 'rgba(205,124,145,' + (0.9 * a).toFixed(3) + ')';
            G.fillRect(cx2, y0 + S.lsize * 0.115, cell.w, Math.max(1, S.lsize * 0.05));
          }
        } else {
          G.fillStyle = unplayed;
          G.fillText(cell.c, cx2, y0);
        }
      }
    }
  }

  /* ---------------- 后期：纸纹 / 颗粒 ---------------- */
  function drawGrain(){
    if(!S.grainCanvas || !G) return;
    if(!S.grainPat){
      S.grainPat = G.createPattern(S.grainCanvas, 'repeat');
      if(!S.grainPat) return;
    }
    G.save();
    G.globalAlpha = 0.055;
    G.globalCompositeOperation = 'multiply';
    G.fillStyle = S.grainPat;
    G.fillRect(view.F.x, view.F.y, view.F.w, view.F.h);
    G.restore();
  }

  function addNode(){}
  function detach(){}

  /* ---------------- 启动 ---------------- */
  function boot(){
    el.cv = document.getElementById('cv');
    S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    try{
      makeGrain();
    }catch(e){ console.error('[442] grain', e); S.grainCanvas = null; }

    resize();
    G = el.cv ? el.cv.getContext('2d') : null;
    if(!G){ console.error('[442] no 2d context'); S.err = 'no 2d ctx'; }
    layoutLyric();

    window.addEventListener('resize', function(){ try{ resize(); }catch(e){ console.error('[442] resize', e); } });
    window.addEventListener('orientationchange', function(){ try{ resize(); }catch(e){ console.error('[442] resize', e); } });

    /* 首帧即报 ready，另加定时兜底，只发一次 */
    requestAnimationFrame(frame);
    setTimeout(function(){ if(!LOADED){ LOADED = 1; ready(); } }, 1000);
  }

  function ready(){
    try{ parent.postMessage({__c100: 1, type: 'ready'}, '*'); }catch(e){ console.error('[442] ready', e); }
  }

  function frame(ts){
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    if(!LOADED){ LOADED = 1; ready(); }
    try{ draw(t0); }catch(e){ console.error('[442] frame', e); }
    S.frames++;
    var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
    S.js = Math.min(99, t1 - t0);
    requestAnimationFrame(frame);
  }

  /* 纸纹：程序化生成一次，小尺寸平铺 */
  function makeGrain(){
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    if(!g) return null;
    var img = g.createImageData(64, 64), d = img.data, i;
    for(i = 0; i < d.length; i += 4){
      var v = 150 + ((Math.random() * 105) | 0);
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    S.grainCanvas = c;
    S.grainPat = null;
    return c;
  }

  function draw(now){
    if(!G) return;
    var dpr = view.dpr;
    FX.pulse = S.pulse; S.pulse *= 0.88;
    G.setTransform(dpr, 0, 0, dpr, 0, 0);
    G.clearRect(0, 0, view.w, view.h);
    /* 页面外底：深一号的奶油，让画框浮起来 */
    G.fillStyle = '#D6C4A2';
    G.fillRect(0, 0, view.w, view.h);
    var F = view.F;
    G.save();
    G.shadowColor = 'rgba(70,56,40,0.32)';
    G.shadowBlur = F.u * 0.040;
    G.shadowOffsetY = F.u * 0.010;
    G.fillStyle = PAL.cream;
    G.fillRect(F.x, F.y, F.w, F.h);
    G.restore();

    G.save();
    G.beginPath(); G.rect(F.x, F.y, F.w, F.h); G.clip();
    drawScene(now);
    drawLyric(now);
    drawGrain();
    G.restore();

    /* 画框描边 */
    G.strokeStyle = PAL.ink;
    G.lineWidth = Math.max(1, F.u * 0.004);
    G.strokeRect(F.x, F.y, F.w, F.h);
  }

  /* ---------------- 自检口 ---------------- */
  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
      frames: S.frames, js: S.js, err: S.err, text: S.text, gl: S.gl, rm: S.rm
    };
  };

  boot();
})();
</script>
