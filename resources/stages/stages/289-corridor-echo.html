<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>走廊里的回声</title>
<style>
  html,body{margin:0;height:100%;background:#0d0708;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none;
        font:500 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.18em;
        color:rgba(255,255,255,.22);transition:opacity .8s;white-space:nowrap}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ────────────────────────────────────────────────────────────────────────────
   协议层（照抄，别改）：init / tick / beat / live → ready / activity / key
   ──────────────────────────────────────────────────────────────────────────── */
const cv = document.getElementById('c');
const hint = document.getElementById('hint');
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

let W = 1, H = 1, PR = 1;
let lines = [], idx = -1, lastT = -1e9;
let clockT = 0, clockAt = 0, playing = false, vT = 0;
let beatPulse = 0, bass = 0, treb = 0, frames = 0, jsMs = 0, errMsg = '';
let readySent = false, dirty = true, raf = 0;

let RM = false, mq = null;
try {
  mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) {
    RM = !!mq.matches;
    const on = (e) => { RM = !!e.matches; };
    if (mq.addEventListener) mq.addEventListener('change', on); else if (mq.addListener) mq.addListener(on);
  }
} catch (_) {}

function resize() {
  W = Math.max(2, window.innerWidth); H = Math.max(2, window.innerHeight);
  PR = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * PR); cv.height = Math.round(H * PR);
  dirty = true;
}
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });

/* ────────────────────────────────────────────────────────────────────────────
   ↓↓↓ 你的实现 ↓↓↓  从这里往下随便写，上面一行都别改
   ──────────────────────────────────────────────────────────────────────────── */

/* 这一件的前提：
   字不是被写下来的。字是刚被说出去的一句话，正从走廊尽头一趟趟回来——
   越回来越大、越远、越淡。画面上亮着的是它折返的三次，不是它本身。
   挡在镜头前面的铁栏杆是提醒：你在走廊里，不在字里。
*/

const gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
  powerPreference: 'high-performance', preserveDrawingBuffer: false });

const COLS = 900, ROWS = 112, N = COLS * ROWS;
const CELL = 140, CHH = 168;
const DEG = Math.PI / 180;

function m4persp(o, fovy, asp, n, f) {
  const t = 1 / Math.tan(fovy * 0.5);
  o[0] = t / asp; o[1] = 0; o[2] = 0; o[3] = 0;
  o[4] = 0; o[5] = t; o[6] = 0; o[7] = 0;
  o[8] = 0; o[9] = 0; o[10] = (f + n) / (n - f); o[11] = -1;
  o[12] = 0; o[13] = 0; o[14] = 2 * f * n / (n - f); o[15] = 0;
  return o;
}
function m4look(o, e, c, u) {
  let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
  let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
  let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx;
  l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0;
  o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
  o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
  o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
  o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
  o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]);
  o[15] = 1;
  return o;
}
function m4mul(o, a, b) {
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return o;
}
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a || 1e-6), 0, 1); return t * t * (3 - 2 * t); };

/* ── 底：一面被夕照透过的墙 + 前景铁栏杆（两遍全屏，很便宜） ─────────────── */
const SVS = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 c = vec2(gl_VertexID == 1 || gl_VertexID == 3 ? 1.0 : -1.0,
                gl_VertexID < 2 ? -1.0 : 1.0);
  vUv = c * 0.5 + 0.5;
  gl_Position = vec4(c, 0.0, 1.0);
}`;

const SFS = `#version 300 es
precision highp float;
uniform float uMode, uAspect, uShift, uTime;
in vec2 vUv;
out vec4 o;
float hash(vec2 p){ return fract(sin(dot(p, vec2(41.13, 289.7))) * 43758.5453); }
void main(){
  if (uMode < 0.5) {
    /* 墙：下暗上暖，右上角一片被夕阳照到的地方 */
    vec3 low  = vec3(0.055, 0.028, 0.032);
    vec3 high = vec3(0.235, 0.105, 0.088);
    vec3 c = mix(low, high, pow(clamp(vUv.y, 0.0, 1.0), 1.25));
    float gx = vUv.x - 0.66, gy = vUv.y - 0.92;
    float glow = exp(-(gx * gx * 2.6 + gy * gy * 3.4) * 3.2);
    c += vec3(0.42, 0.20, 0.11) * glow * 0.85;
    /* 墙面的粗糙：很轻的斑 */
    float n = hash(floor(vUv * vec2(760.0, 470.0)));
    c *= 0.94 + 0.12 * n;
    /* 走廊尽头的一道亮缝 */
    float slit = exp(-pow((vUv.y - 0.60) * 26.0, 2.0)) * exp(-pow((vUv.x - 0.70) * 3.1, 2.0));
    c += vec3(0.50, 0.30, 0.18) * slit * 0.55;
    o = vec4(c, 1.0);
  } else {
    /* 前景：离镜头很近的铁栏杆，带一点失焦 */
    float deck = step(vUv.y, 0.735);
    float x = vUv.x * 2.0 + uShift;
    float bx = fract(x) - 0.5;
    float bar = 1.0 - smoothstep(0.016, 0.040, abs(bx));
    float rail = 1.0 - smoothstep(0.010, 0.024, abs(vUv.y - 0.735));
    float rail2 = 1.0 - smoothstep(0.008, 0.020, abs(vUv.y - 0.520));
    float a = clamp(max(bar * deck, rail), 0.0, 1.0) + rail2 * deck * 0.7;
    a = clamp(a, 0.0, 1.0) * 0.86;
    o = vec4(vec3(0.012, 0.008, 0.010), a);
  }
}`;

/* ── 字：十万条横着的亮痕，一遍比一遍大、远、淡 ───────────────────────── */
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aG;   /* u, v, 第几趟, 尺寸抖动 */
layout(location=1) in vec4 aR;
uniform mat4 uVP;
uniform vec3 uRight, uUp;
uniform float uT, uNCh, uFade, uPulse;
uniform float uCharT[24];
out vec2 vQ;
out vec2 vTuv;
out float vA;
out float vG;
void main(){
  float cw = 9.6 / uNCh;
  float th = cw * 1.2;
  int g = int(aG.z + 0.5);
  float sc = 1.0 + float(g) * 1.95;
  float zp = -0.30 - float(g) * 4.3;
  float dly = float(g) * 0.66;
  float gain = g == 0 ? 1.0 : (g == 1 ? 0.44 : 0.24);

  int ci = int(clamp(floor(aG.x * uNCh), 0.0, uNCh - 1.0));
  float t0 = uCharT[ci] + dly;
  float rv = smoothstep(t0, t0 + 0.50 + dly * 0.9, uT);
  float e = 1.0 - rv;

  /* 回声沿着走廊往右上退，所以每一趟都往上挪一点 */
  vec3 base = vec3((aG.x - 0.5) * 9.6 * sc,
                   (aG.y - 0.5) * th * sc + float(g) * 0.35,
                   zp);
  base.z += e * 1.4;

  vec2 corner = vec2(gl_VertexID == 1 || gl_VertexID == 3 ? 1.0 : -1.0,
                     gl_VertexID < 2 ? -1.0 : 1.0);
  /* 横着的亮痕：宽、薄、彼此留缝 */
  vec2 cs = vec2(9.6 / 900.0 * (4.6 + 1.8 * aR.x),
                 th / 112.0 * (1.55 + 0.55 * aR.y)) * (1.0 + float(g) * 0.55) * aG.w;
  vec3 wp = base + uRight * (corner.x * cs.x * 0.5) + uUp * (corner.y * cs.y * 0.5);

  gl_Position = uVP * vec4(wp, 1.0);
  vQ = corner;
  vTuv = vec2(aG.x, 1.0 - aG.y);
  vA = uFade * rv * gain * (1.0 + uPulse * 0.30);
  vG = float(g);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uTex;
in vec2 vQ;
in vec2 vTuv;
in float vA;
in float vG;
out vec4 o;
void main(){
  float m = texture(uTex, vTuv).r;
  float g = smoothstep(0.20, 0.90, m);
  /* 上下两边软掉，留出「条」的缝 */
  float band = 1.0 - smoothstep(0.45, 1.0, abs(vQ.y));
  vec3 col = mix(vec3(1.00, 0.80, 0.62), vec3(1.0, 0.95, 0.86), g);
  col = mix(col, vec3(0.98, 0.66, 0.52), vG * 0.55);
  o = vec4(col * (g * band * 0.62) * vA, 1.0);
}`;

/* ── 装配 ─────────────────────────────────────────────────────────────── */
let prog = null, sprog = null, vao = null, svao = null, vbo = null, tex = null;
const U = {}, SU = {};
const tcv = document.createElement('canvas');
const tctx = tcv.getContext('2d');
let lineArr = null, lineT = [], texLine = -1;

function compile() {
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      errMsg = 'shader: ' + (gl.getShaderInfoLog(s) || '').slice(0, 160);
      return null;
    }
    return s;
  };
  const build = (vs, fs, names, dst) => {
    const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    const p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { errMsg = 'link: ' + (gl.getProgramInfoLog(p) || '').slice(0, 160); return null; }
    names.forEach((k) => { dst[k] = gl.getUniformLocation(p, k); });
    return p;
  };
  prog = build(VS, FS, ['uVP', 'uRight', 'uUp', 'uT', 'uNCh', 'uFade', 'uPulse', 'uTex'], U);
  U.uCharT = prog ? gl.getUniformLocation(prog, 'uCharT[0]') : null;
  sprog = build(SVS, SFS, ['uMode', 'uAspect', 'uShift', 'uTime'], SU);
  if (!prog || !sprog) return;

  svao = gl.createVertexArray();

  const data = new Float32Array(N * 8);
  let s = 4409;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  let o = 0;
  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const r = rnd();
      const grp = r < 0.52 ? 0 : (r < 0.80 ? 1 : 2);
      data[o] = (i + 0.5 + (rnd() - 0.5) * 0.9) / COLS;
      data[o + 1] = (j + 0.5 + (rnd() - 0.5) * 0.55) / ROWS;
      data[o + 2] = grp;
      data[o + 3] = 0.8 + rnd() * 0.4;
      data[o + 4] = rnd(); data[o + 5] = rnd(); data[o + 6] = rnd(); data[o + 7] = rnd();
      o += 8;
    }
  }
  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16);
  gl.vertexAttribDivisor(0, 1);
  gl.vertexAttribDivisor(1, 1);
  gl.bindVertexArray(null);

  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0.05, 0.025, 0.03, 1);
}

function prepLines() {
  lineT = [];
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i], next = lines[i + 1];
    const cps = Array.from(String(L.text || ''));
    const n = Math.min(24, Math.max(1, cps.length));
    const dur = (typeof L.dur === 'number' && L.dur > 0.4) ? L.dur : (next ? next.t - L.t : 3.6);
    const per = Math.max(0.075, dur * 0.52 / n);
    const vis = L.t;
    const ct = new Float32Array(24);
    for (let k = 0; k < 24; k++) ct[k] = 1e6;
    for (let k = 0; k < n; k++) {
      let t = vis + k * per;
      if (L.chars && L.chars[k] && typeof L.chars[k].t === 'number') t = L.chars[k].t;
      ct[k] = t;
    }
    const end = next ? next.t : L.t + Math.max(3.2, dur);
    lineT.push({ t0: L.t, vis: vis, t1: end, n, ct });
  }
}

function buildLineTex(i) {
  const LT = lineT[i];
  if (!LT || !gl) return;
  const cps = Array.from(String(lines[i].text || ''));
  const n = Math.max(1, Math.min(24, cps.length));
  const w = n * CELL;
  if (tcv.width !== w || tcv.height !== CHH) { tcv.width = w; tcv.height = CHH; }
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.fillStyle = '#000';
  tctx.fillRect(0, 0, w, CHH);
  tctx.fillStyle = '#fff';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  tctx.font = '700 128px "Microsoft YaHei","PingFang SC","Heiti SC","Noto Sans SC",system-ui,sans-serif';
  for (let k = 0; k < n; k++) tctx.fillText(cps[k], k * CELL + CELL * 0.5, CHH * 0.5 + 5);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tcv);
}

/* 三个站位：站在走廊这头 / 往前一步 / 走到两趟回声之间 */
const SHOTS = [
  { e: [0.25, 0.95, 13.4], t: [0.70, 0.15, -2.4], f: 40 },
  { e: [0.95, 1.45, 8.8], t: [1.00, 0.30, -1.8], f: 40 },
  { e: [1.60, 2.30, 3.4], t: [1.65, 0.30, -3.2], f: 46 }
];
const TH0 = 4.0, TH1 = 8.2, BL = 1.05;

let vpM = new Float32Array(16), pM = new Float32Array(16), vM = new Float32Array(16);
let eye = [0, 0, 10], tgt = [0, 0, 0];

function cameraFor(v) {
  let s = 0, k = 1;
  if (v >= TH1) { s = 2; k = sstep(0, 1, (v - TH1) / BL); }
  else if (v >= TH0) { s = 1; k = sstep(0, 1, (v - TH0) / BL); }
  const A = SHOTS[Math.max(0, s - 1)], B = SHOTS[s];
  const kk = s === 0 ? 1 : k;
  for (let a = 0; a < 3; a++) {
    eye[a] = A.e[a] + (B.e[a] - A.e[a]) * kk;
    tgt[a] = A.t[a] + (B.t[a] - A.t[a]) * kk;
  }
  eye[0] += Math.sin(v * 0.26) * 0.075;
  eye[1] += Math.sin(v * 0.20 + 0.8) * 0.05;
  return (A.f + (B.f - A.f) * kk) * DEG;
}

function draw() {
  if (!gl || !prog || !sprog) return;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT);

  /* 1. 底：一面被夕照透过的墙 */
  gl.disable(gl.BLEND);
  gl.useProgram(sprog);
  gl.bindVertexArray(svao);
  gl.uniform1f(SU.uMode, 0);
  gl.uniform1f(SU.uAspect, W / H);
  gl.uniform1f(SU.uShift, 0);
  gl.uniform1f(SU.uTime, vT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (lineArr !== lines) { prepLines(); lineArr = lines; texLine = -1; }
  if (idx < 0 || !lineT[idx]) { gl.bindVertexArray(null); return; }
  if (texLine !== idx) { buildLineTex(idx); texLine = idx; }

  const T = now();
  const LT = lineT[idx];
  const fade = sstep(0, 0.26, T - LT.vis) * (1 - sstep(LT.t1 - 0.30, LT.t1, T));

  const fov = cameraFor(vT);
  m4persp(pM, fov, W / H, 0.05, 120);
  m4look(vM, eye, tgt, [0, 1, 0]);
  m4mul(vpM, pM, vM);

  let fwd = [tgt[0] - eye[0], tgt[1] - eye[1], tgt[2] - eye[2]];
  let l = Math.hypot(fwd[0], fwd[1], fwd[2]) || 1;
  fwd = [fwd[0] / l, fwd[1] / l, fwd[2] / l];
  let rgt = [-fwd[2], 0, fwd[0]];
  l = Math.hypot(rgt[0], rgt[1], rgt[2]) || 1;
  rgt = [rgt[0] / l, rgt[1] / l, rgt[2] / l];
  const upv = [rgt[1] * fwd[2] - rgt[2] * fwd[1], rgt[2] * fwd[0] - rgt[0] * fwd[2], rgt[0] * fwd[1] - rgt[1] * fwd[0]];

  /* 2. 字：三趟回声 */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(prog);
  gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(U.uVP, false, vpM);
  gl.uniform3f(U.uRight, rgt[0], rgt[1], rgt[2]);
  gl.uniform3f(U.uUp, upv[0], upv[1], upv[2]);
  gl.uniform1f(U.uT, T);
  gl.uniform1f(U.uNCh, LT.n);
  gl.uniform1f(U.uFade, fade);
  gl.uniform1f(U.uPulse, beatPulse);
  gl.uniform1fv(U.uCharT, LT.ct);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U.uTex, 0);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);

  /* 3. 前景的铁栏杆：把字挡住一点，画面才有前后 */
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(sprog);
  gl.bindVertexArray(svao);
  gl.uniform1f(SU.uMode, 1);
  gl.uniform1f(SU.uShift, eye[0] * 0.55 + 0.18);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindVertexArray(null);
}

try {
  if (gl) compile(); else errMsg = 'no webgl2';
} catch (e) { errMsg = 'setup: ' + (e && e.message ? e.message : e); }

let last = performance.now();
function frame(ms) {
  const js0 = performance.now();
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
  last = ms; frames++;
  const T = now();
  vT = RM ? T * 0.24 : T;
  if (playing) { beatPulse *= Math.exp(-dt * 3.6); bass *= Math.exp(-dt * 0.08); treb *= Math.exp(-dt * 0.10); }

  let ci = -1;
  for (let i = lines.length - 1; i >= 0; i--) { if (T >= lines[i].t) { ci = i; break; } }
  if (ci !== idx) { idx = ci; dirty = true; }

  try { if (playing || dirty) { draw(); dirty = false; } }
  catch (e) { errMsg = 'draw: ' + (e && e.message ? e.message : e); }

  if (!readySent) { readySent = true; try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {} }
  jsMs = performance.now() - js0;
  raf = requestAnimationFrame(frame);
}

/* ────────────────────────────────────────────────────────────────────────────
   协议（照抄，别改）
   ──────────────────────────────────────────────────────────────────────────── */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', (e) => {
  ping();
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}

}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    idx = -1; lastT = -1e9; vT = 0; beatPulse = 0; bass = 0; treb = 0;
    clockT = 0; clockAt = performance.now(); playing = true;
    hint.style.opacity = lines.length ? '0.9' : '0.4';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    dirty = true;
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    playing = !!d.payload.playing; dirty = true;
  } else if (d.type === 'beat') {
    beatPulse = Math.min(1, beatPulse + 0.32 + (d.payload.level || 0) * 0.5); dirty = true;
  } else if (d.type === 'live') {
    const l = d.payload || {};
    if (typeof l.bass === 'number') bass = Math.max(bass, Math.min(1, l.bass));
    if (typeof l.treble === 'number') treb = Math.max(treb, Math.min(1, l.treble));
    if (typeof l.level === 'number') beatPulse = Math.max(beatPulse, Math.min(0.9, l.level * 0.8));

window.__stage = () => ({
  lines: lines.length, idx: idx, t: +now().toFixed(2), playing: playing, frames: frames,
  js: +jsMs.toFixed(2), err: errMsg, text: (idx >= 0 && lines[idx]) ? lines[idx].text : '',
  gl: !!gl, rm: RM, vT: +vT.toFixed(2)
});

resize();
raf = requestAnimationFrame(frame);
</script>
