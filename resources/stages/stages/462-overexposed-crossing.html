<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>放课后过曝</title>
<style>
  :root{
    --ink:#191410; --ink-soft:#3b332b; --paper:#fbf6ec;
    --accink:#b03a2e; --acc:#d9453a;
    --hand:"Kaiti SC","KaiTi","STKaiti","Kaiti TC","Hiragino Sans GB","Songti SC",serif;
    --sans:"Hiragino Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--paper); }
  #stage{
    position:fixed; inset:0; overflow:hidden; background:var(--paper); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased; isolation:isolate;
  }
  .paperwash{
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 88% at 80% 10%, #ffffff 0%, rgba(255,255,255,0) 60%),
      radial-gradient(130% 100% at 6% 98%, #efe5d2 0%, rgba(239,229,210,0) 72%),
      #fbf6ec;
  }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #scene{ z-index:1; }
  #fx{ z-index:2; }
  #grain{
    position:absolute; left:-12%; top:-12%; width:124%; height:124%; z-index:3;
    pointer-events:none; opacity:.34;
    background-repeat:repeat; background-size:180px 180px;
    animation:grainDrift 1200ms steps(1) infinite;
  }
  @keyframes grainDrift{
    0%{ transform:translate3d(0,0,0) }
    25%{ transform:translate3d(-3%,2%,0) }
    50%{ transform:translate3d(2%,-3%,0) }
    75%{ transform:translate3d(-2%,-2%,0) }
    100%{ transform:translate3d(0,0,0) }
  }
  .vig{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(118% 96% at 50% 44%, rgba(120,96,66,0) 58%, rgba(120,96,66,.13) 100%);
  }
  .ui{ position:absolute; z-index:5; pointer-events:none; }

  /* 歌词底下的纸浆压印：同色纸面洗一遍，压掉背后的杂物，不是发光 */
  .lyricwash{
    position:absolute; left:0; right:0; bottom:0; height:46%; z-index:5;
    pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(251,246,236,0) 0%,
      rgba(251,246,236,.42) 34%,
      rgba(251,246,236,.80) 68%,
      rgba(251,246,236,.90) 100%);
  }

  /* 顶部铅笔批注 */
  .topnote{ left:6vw; top:4.2vh; display:flex; align-items:flex-start; gap:1.1em; }
  .topnote .t1{
    font-family:var(--hand); font-size:clamp(12px,1.06vw,17px); letter-spacing:.2em;
    color:var(--ink-soft); opacity:.8; line-height:1.5; max-width:46vw;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .topnote .t2{
    font-size:clamp(8px,.66vw,10px); letter-spacing:.34em; color:var(--ink-soft);
    opacity:.4; margin-top:.5em; text-transform:uppercase;
  }
  .stamp{
    font-family:var(--hand); font-size:clamp(11px,.95vw,15px); letter-spacing:.16em;
    color:var(--accink); border:1.5px solid var(--accink); border-radius:2px;
    padding:.18em .42em; transform:rotate(-6.5deg); opacity:.82; white-space:nowrap;
  }

  /* 右下：胶片信息 */
  .filmnote{
    right:5.5vw; bottom:3.6vh; text-align:right;
    font-family:var(--hand); font-size:clamp(10px,.86vw,13px); letter-spacing:.2em;
    color:var(--ink-soft); opacity:.62; line-height:1.7;
  }
  .filmnote b{ font-weight:600; color:var(--accink); opacity:.92; }
  .filmnote .micro{ font-size:.82em; opacity:.5; margin-top:.28em; letter-spacing:.26em; }

  /* 歌词 */
  .lyricwrap{
    left:6vw; right:7vw; bottom:max(7.2vh,26px); z-index:6;
    display:flex; flex-direction:column; align-items:flex-start; gap:.5em;
  }
  .lyric{
    font-family:var(--hand);
    font-size:var(--lysize,44px);
    font-weight:600;
    line-height:1.32;
    letter-spacing:.01em;
    max-width:min(100%, 21em);
    overflow-wrap:anywhere;
    word-break:normal;
  }
  .ch{
    display:inline-block;
    transform:translate3d(var(--jx,0),var(--jy,0),0) rotate(var(--jr,0deg));
    transition:color .2s linear, opacity .2s linear;
    color:var(--ink);
  }
  .ch.uns{ color:var(--ink); opacity:.5; }
  .ch.sung{ color:var(--ink); opacity:1; }
  .ch.now{ color:var(--accink); opacity:1; }
  .sp{ display:inline-block; width:.4em; }

  .empty, .intro{ display:none; }
  .lyricwrap.isempty .lyric, .lyricwrap.isintro .lyric{ display:none; }
  .lyricwrap.isempty .empty{ display:block; }
  .lyricwrap.isintro .intro{ display:block; }
  .e1{
    font-family:var(--hand); font-size:clamp(15px,1.6vw,23px); color:var(--ink-soft);
    letter-spacing:.16em; opacity:.78;
  }
  .e2{
    font-family:var(--hand); font-size:clamp(11px,.98vw,15px); color:var(--ink-soft);
    letter-spacing:.2em; opacity:.5; margin-top:.55em;
  }
  @media (prefers-reduced-motion: reduce){
    #grain{ animation:none; }
    .ch{ transition:none; }
  }
  /* 竖屏 / 手机：字往大走、边距收紧、批注缩小 */
  @media (max-aspect-ratio: 1/1){
    .topnote{ left:6vw; top:3.4vh; gap:.7em; }
    .topnote .t1{ font-size:clamp(11px,3.4vw,16px); letter-spacing:.14em; max-width:56vw; }
    .topnote .t2{ font-size:8px; letter-spacing:.22em; }
    .stamp{ font-size:11px; letter-spacing:.1em; }
    .lyricwrap{ left:7vw; right:8vw; bottom:max(12vh,64px); }
    .lyric{ max-width:100%; line-height:1.42; letter-spacing:.005em; }
    .filmnote{ right:7vw; bottom:4.2vh; font-size:clamp(9px,2.8vw,12px); }
    .vig{ background:radial-gradient(140% 100% at 50% 40%, rgba(0,0,0,0) 50%, rgba(88,65,40,.2) 100%); }
  }
  /* 超宽 / 横屏矮窗口 */
  @media (max-aspect-ratio: 21/9) and (min-aspect-ratio: 1/1){
    .lyricwrap{ bottom:max(9vh,30px); }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="paperwash"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>
  <div class="vig" aria-hidden="true"></div>
  <div class="lyricwash" aria-hidden="true"></div>

  <div class="ui topnote">
    <div>
      <div class="t1" id="note1">下北泽 · 放課後 16:40</div>
      <div class="t2">SHIMOKITAZAWA / AFTER SCHOOL</div>
    </div>
    <div class="stamp" id="stamp">EXP.400 過曝</div>
  </div>

  <div class="ui filmnote">
    <div id="film1"><b>ROLL 06</b> ・ 36 EXP</div>
    <div id="film2">CANON AF35M ・ 東京</div>
    <div class="micro" id="micro">過曝 / 現像待ち</div>
  </div>

  <div class="ui lyricwrap isintro" id="lyricwrap">
    <div class="lyric" id="lyric"></div>
    <div class="empty" id="empty">
      <div class="e1">这一格，没有歌词</div>
      <div class="e2">只剩过曝的白 和 铁道的风</div>
    </div>
    <div class="intro" id="intro">
      <div class="e1" id="intro1">下北泽 · 放課後</div>
      <div class="e2" id="intro2">正在显影</div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var stageEl = document.getElementById('stage');
  var lyricWrap = document.getElementById('lyricwrap');
  var lyricEl = document.getElementById('lyric');
  var emptyEl = document.getElementById('empty');
  var introEl = document.getElementById('intro');
  var intro1 = document.getElementById('intro1');
  var intro2 = document.getElementById('intro2');
  var note1 = document.getElementById('note1');
  var stampEl = document.getElementById('stamp');
  var film1 = document.getElementById('film1');
  var film2 = document.getElementById('film2');
  var microEl = document.getElementById('micro');
  var grainEl = document.getElementById('grain');
  var canvas  = document.getElementById('scene');
  var fxCanvas = document.getElementById('fx');
  var ctx     = canvas.getContext('2d', { alpha: false });
  var fxc     = fxCanvas.getContext('2d');

  /* ---- 状态（所有对象先建立，后面才有函数往里写） ---- */
  var view = { w: 0, h: 0, dpr: 1 };
  var lines = [];
  var idx = -1;
  var curText = '';
  var t = 0;
  var playing = true;
  var frames = 0;
  var lastJs = 0;
  var accent = [217, 69, 58];
  var duration = 0;
  var songId = '';
  var songName = '';
  var beatEnv = 0;
  var bass = 0;
  var reduced = false;
  var readySent = false;
  var focusX = 0.56, focusY = 0.34;   /* 太阳位置（归一） */
  var pal = { r: 251, g: 246, b: 236 };

  try {
    reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { console.error('[462] matchMedia failed', e); }

  /* ---- 自检口：最外层无条件赋值 ---- */
  window.__stage = function () {
    try {
      return {
        lines: lines.length, idx: idx, t: t, playing: !!playing,
        frames: frames, js: lastJs, err: '', text: curText, gl: false, rm: reduced
      };
    } catch (e) {
      console.error('[462] __stage failed', e);
      return { lines: 0, idx: -1, t: 0, playing: false, frames: frames, js: 0, err: '', text: '', gl: false, rm: false };
    }
  };

  function num(v, d) {
    var n = typeof v === 'number' ? v : parseFloat(v);
    return isFinite(n) ? n : d;
  }

  /* ---- 歌词数据：脏数据一律兜底 ---- */
  function buildLines(raw) {
    var out = [], n = Math.min(Array.isArray(raw) ? raw.length : 0, 600), i, r, text, tt, dd, j;
    for (i = 0; i < n; i++) {
      r = raw[i] || {};
      text = r.text == null ? '' : String(r.text);
      if (text.length > 240) text = text.slice(0, 240);
      tt = num(r.t, 0); if (tt < 0) tt = 0;
      dd = num(r.dur, 0); if (!(dd > 0)) dd = Math.max(1.6, Math.min(9, text.length * 0.21));
      /* YRC 逐字时间：保留下来，长度不符时后面按句长均分 */
      var chs = null, src = r.chars;
      if (Array.isArray(src) && src.length) {
        chs = [];
        var m = Math.min(src.length, 240);
        for (j = 0; j < m; j++) {
          var o = src[j] || {};
          var ct = num(o.t, NaN);
          chs.push(isFinite(ct) ? ct : null);
        }
      }
      out.push({ t: tt, dur: dd, text: text, chars: chs });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function findIdx(time) {
    var lo = 0, hi = lines.length - 1, ans = -1, mid;
    while (lo <= hi) {
      mid = (lo + hi) >> 1;
      if (lines[mid].t <= time + 0.02) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  /* ---- 歌词：逐字渲染 + 手写抖动 ---- */
  var charEls = [];
  var charTimes = [];
  var charEnds = [];
  var revealed = -1;
  var lineFade = 1;
  var lyricBuiltFor = -2;

  function rnd(seed) {
    var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function renderLine(L) {
    lyricEl.textContent = '';
    charEls = []; charTimes = []; charEnds = [];
    revealed = -1;
    if (!L || !L.text) { fitFont(); return; }

    var cps = Array.from(L.text);
    var n = Math.min(cps.length, 220);
    var ch = Array.isArray(L.chars) ? L.chars : null;
    /* YRC 长度和正文对不上就别用，走均分，避免错位 */
    var useYrc = !!(ch && ch.length === cps.length);
    var i, c, el, tt, prevT = L.t;
    var frag = document.createDocumentFragment();

    for (i = 0; i < n; i++) {
      c = cps[i];
      if (c === ' ' || c === '\u3000' || c === '\t') {
        var sp = document.createElement('span');
        sp.className = 'sp';
        frag.appendChild(sp);
        continue;
      }
      el = document.createElement('span');
      el.className = 'ch uns';
      el.textContent = c;
      /* 手写抖：每个字有固定的轻微歪斜，不随帧变化 */
      el.style.setProperty('--jx', (rnd(i + 1) * 2 - 1).toFixed(2) + 'px');
      el.style.setProperty('--jy', ((rnd(i + 9) * 2 - 1) * 1.4).toFixed(2) + 'px');
      el.style.setProperty('--jr', ((rnd(i + 23) * 2 - 1) * 1.6).toFixed(2) + 'deg');
      frag.appendChild(el);

      /* 逐字时间：YRC 优先，缺失或长度不符时按句长均分；坏值沿用上一个 */
      if (useYrc && ch[i] != null && isFinite(ch[i])) {
        tt = ch[i];
      } else {
        tt = L.t + L.dur * (i / Math.max(1, n));
      }
      if (!(tt >= prevT)) tt = prevT;
      prevT = tt;
      charEls.push(el);
      charTimes.push(tt);
    }
    lyricEl.appendChild(frag);

    /* 结束时间 */
    for (i = 0; i < charTimes.length; i++) {
      charEnds.push(i + 1 < charTimes.length ? charTimes[i + 1] : Math.max(L.t + L.dur, charTimes[i] + 0.2));
    }
    fitFont();
  }

  /* 超长句收缩字号，保证不溢出 */
  function fitFont() {
    var w = view.w, h = view.h;
    if (!(w > 0)) w = 1440;
    if (!(h > 0)) h = 900;
    var portrait = h > w * 1.05;
    var base = portrait
      ? Math.max(21, Math.min(w * 0.086, h * 0.052, 54))
      : Math.max(19, Math.min(w * 0.060, h * 0.086, 62));
    lyricEl.style.setProperty('--lysize', base.toFixed(1) + 'px');
    var avail = (lyricWrap.clientWidth || w * 0.86) - 2;
    var guard = 0;
    while (guard < 9 && lyricEl.scrollWidth > avail && base > 15) {
      base *= 0.9;
      lyricEl.style.setProperty('--lysize', base.toFixed(1) + 'px');
      guard++;
    }
  }

  function updateLyric(time) {
    var n = charEls.length;
    if (!n) return;
    var i, r = 0;
    for (i = 0; i < n; i++) {
      if (charTimes[i] <= time + 0.02) r = i + 1; else break;
    }
    if (r === revealed) return;
    /* 回退（seek）时整体重置 */
    if (r < revealed) {
      for (i = 0; i < n; i++) charEls[i].className = 'ch uns';
      revealed = -1;
    }
    var from = revealed < 0 ? 0 : revealed;
    for (i = from; i < n; i++) {
      var cls = 'ch ';
      if (i < r - 1) cls += 'sung';
      else if (i === r - 1) cls += 'now';
      else cls += 'uns';
      if (charEls[i].className !== cls) charEls[i].className = cls;
    }
    revealed = r;
    /* 整句唱完的那一瞬给一次轻微的过曝起跳，像按下快门 */
    if (r >= n && n > 2) pulse = 1;
  }

  function setLine(i) {
    if (i === idx && lyricBuiltFor === i) return;
    idx = i;
    lyricBuiltFor = i;
    var L = (i >= 0 && lines[i]) ? lines[i] : null;
    curText = L ? L.text : '';
    if (L && L.text) {
      lyricWrap.classList.remove('isempty');
      lyricWrap.classList.remove('isintro');
      renderLine(L);
    } else {
      lyricEl.textContent = '';
      charEls = []; charTimes = []; charEnds = []; revealed = -1;
      if (lines.length === 0) {
        lyricWrap.classList.remove('isintro');
        lyricWrap.classList.add('isempty');
      } else {
        /* 有歌词但还没唱到第一句：一个安静的开场提示，不是伪造歌词 */
        lyricWrap.classList.remove('isempty');
        lyricWrap.classList.add('isintro');
        intro1.textContent = songName ? songName.slice(0, 18) : '下北泽 · 放課後';
        intro2.textContent = lines.length ? '正在显影' : '等待歌词';
      }
    }
  }

  function applyMeta(s) {
    var nm = s && s.name ? String(s.name) : '';
    songName = nm;
    var ar = s && s.artists;
    if (Array.isArray(ar)) ar = ar.filter(function (x) { return x != null && String(x).trim(); }).join(' / ');
    ar = ar == null ? '' : String(ar);
    note1.textContent = nm ? nm.slice(0, 26) : '下北泽 · 放課後 16:40';
    film2.textContent = (ar ? ar.slice(0, 26) : '東京 · 世田谷') + ' ・ 35mm';
    var hsh = 0, i;
    for (i = 0; i < nm.length && i < 24; i++) hsh = (hsh * 31 + nm.charCodeAt(i)) % 97;
    film1.innerHTML = '<b>ROLL ' + String(10 + hsh % 89) + '</b> ・ 36 EXP';
    if (microEl) microEl.textContent = duration > 0 ? ('全 ' + Math.floor(duration / 60) + ':' + ('0' + Math.floor(duration % 60)).slice(-2) + ' / 過曝') : '過曝 / 現像待ち';
    stampEl.textContent = 'EXP.400 過曝';
  }

  function onInit(p) {
    var s = (p && p.song) || {};
    var sid = s.id == null ? '' : String(s.id);
    if (sid !== songId) { songId = sid; t = 0; }
    lines = buildLines(p && p.lines);
    duration = num(p && p.duration, 0) || num(s.duration, 0) || 0;
    if (Array.isArray(p && p.accent) && p.accent.length >= 3) {
      var a = [num(p.accent[0], 217), num(p.accent[1], 69), num(p.accent[2], 58)], k;
      for (k = 0; k < 3; k++) a[k] = Math.max(0, Math.min(255, Math.round(a[k])));
      accent = a;
      /* 放在浅底上仍要读得清：压暗饱和色，明度封顶 */
      var sr = accent[0], sg = accent[1], sb = accent[2];
      var lum = (sr * 0.299 + sg * 0.587 + sb * 0.114) / 255;
      if (lum > 0.5) {
        var m = 0.5 / Math.max(0.01, lum);
        sr *= m; sg *= m; sb *= m;
      }
      var ar = Math.round(sr), ag = Math.round(sg), ab = Math.round(sb);
      document.documentElement.style.setProperty('--accink', 'rgb(' + ar + ',' + ag + ',' + ab + ')');
      pal.r = Math.min(255, Math.round(sr * 0.25 + 188));
      pal.g = Math.min(255, Math.round(sg * 0.25 + 188));
      pal.b = Math.min(255, Math.round(sb * 0.25 + 188));
    }
    applyMeta(s);
    playing = (p && typeof p.playing === 'boolean') ? p.playing : true;
    lyricBuiltFor = -2; idx = -2;
    setLine(findIdx(t));
  }

  /* ---- 消息 ---- */
  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload || {});
      else if (d.type === 'tick') {
        var p = d.payload || {};
        t = Math.max(0, num(p.time, t));
        if (typeof p.playing === 'boolean') playing = p.playing;
      } else if (d.type === 'beat') {
        var b = d.payload || {};
        beatEnv = Math.max(beatEnv, Math.max(0, Math.min(1.4, num(b.level, 0.5))));
      } else if (d.type === 'live') {
        var l = d.payload || {};
        bass = Math.max(0, Math.min(1, num(l.bass, 0)));
        if (typeof l.playing === 'boolean') playing = l.playing;
      }
    } catch (e) { console.error('[462] message ' + (d && d.type), e); }
  });

  /* ---- 画布尺寸 ---- */
  function resize() {
    var w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!(w > 0)) w = window.innerWidth;
    if (!(h > 0)) h = window.innerHeight;
    if (!(w > 0)) w = 1440;
    if (!(h > 0)) h = 900;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    if (!(dpr > 0)) dpr = 1;
    view.w = w; view.h = h; view.dpr = dpr;
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    fxCanvas.width = Math.max(1, Math.round(w * dpr));
    fxCanvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (fxc) fxc.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildFar(w, h);
    buildNear(w, h);
    fitFont();
  }

  /* ---------- 远景板：一次画好，之后只做位移（性能） ---------- */
  var far = document.createElement('canvas');
  var farC = null;
  var farW = 0, farH = 0;
  var near = document.createElement('canvas');
  var nearC = null;
  var nearW = 0, nearH = 0;

  function cssRGB(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a == null ? 1 : a) + ')';
  }

  /* 颗粒：程序化生成一张 180×180 的噪点贴图，CSS 平铺 + 位移，不用每帧算 */
  var grainBuilt = false;
  function makeGrainTile() {
    if (grainBuilt) return;
    try {
      var s = 180;
      var tile = document.createElement('canvas');
      tile.width = s; tile.height = s;
      var g = tile.getContext('2d');
      var img = g.createImageData(s, s);
      var d = img.data, i, n = s * s;
      for (i = 0; i < n; i++) {
        var v = 128 + (Math.random() - 0.5) * 190;
        var a = 20 + Math.random() * 34;
        d[i * 4] = v; d[i * 4 + 1] = v; d[i * 4 + 2] = v;
        d[i * 4 + 3] = a;
      }
      g.putImageData(img, 0, 0);
      /* 再叠几道细划痕，像冲印店的旧片 */
      g.globalAlpha = 0.5;
      g.strokeStyle = 'rgba(255,255,255,.55)';
      g.lineWidth = 1;
      for (i = 0; i < 5; i++) {
        var y = Math.random() * s;
        g.beginPath(); g.moveTo(0, y); g.lineTo(s, y + (Math.random() * 6 - 3)); g.stroke();
      }
      grainEl.style.backgroundImage = 'url(' + tile.toDataURL('image/png') + ')';
      grainBuilt = true;
    } catch (e) { console.error('[462] grain', e); }
  }

  /* 远景：天空、过曝太阳、云、地平线、电线杆、电缆 */
  function buildFar(w, h) {
    var cw = Math.max(2, Math.round(w * 0.62));
    var chh = Math.max(2, Math.round(h * 0.62));
    far.width = cw; far.height = chh;
    farC = far.getContext('2d');
    var g = farC;
    g.clearRect(0, 0, cw, chh);

    var sx = cw * 0.82, sy = chh * 0.16, sr = Math.min(cw, chh) * 0.30;
    var hz = chh * 0.70;

    /* 天空 */
    var sky = g.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, '#f4ecdd');
    sky.addColorStop(0.55, '#fbf6ea');
    sky.addColorStop(1, '#ffffff');
    g.fillStyle = sky;
    g.fillRect(0, 0, cw, hz + 2);

    /* 过曝太阳：中间纯白块（不加 blur，靠色阶造过曝） */
    var halo = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 2.5);
    halo.addColorStop(0, 'rgba(255,255,255,1)');
    halo.addColorStop(0.26, 'rgba(255,252,244,.96)');
    halo.addColorStop(0.52, 'rgba(255,247,232,.5)');
    halo.addColorStop(1, 'rgba(255,247,232,0)');
    g.fillStyle = halo;
    g.fillRect(sx - sr * 2.5, sy - sr * 2.5, sr * 5, sr * 5);
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(sx, sy, sr * 0.72, 0, 6.2832); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.beginPath(); g.arc(sx, sy, sr * 1.32, 0, 6.2832); g.fill();

    /* 云：几团低对比的横向椭圆 */
    var i, k;
    for (i = 0; i < 7; i++) {
      k = i / 7;
      var cx = cw * (0.08 + k * 0.62), cy = chh * (0.20 + (i % 3) * 0.10);
      var rw = cw * (0.16 + (i % 4) * 0.05), rh = chh * 0.045;
      var cg = g.createRadialGradient(cx, cy, 0, cx, cy, rw);
      cg.addColorStop(0, 'rgba(255,255,255,.9)');
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      g.save(); g.translate(cx, cy); g.scale(1, rh / rw);
      g.fillStyle = cg; g.beginPath(); g.arc(0, 0, rw, 0, 6.2832); g.fill(); g.restore();
    }

    /* 地平线：海（浅灰蓝，低饱和） */
    var sea = g.createLinearGradient(0, hz, 0, chh);
    sea.addColorStop(0, 'rgba(214,218,214,.85)');
    sea.addColorStop(0.5, 'rgba(226,229,224,.55)');
    sea.addColorStop(1, 'rgba(246,246,240,.2)');
    g.fillStyle = sea;
    g.fillRect(0, hz, cw, chh - hz);

    /* 海面反光条 */
    for (i = 0; i < 26; i++) {
      var yy = hz + (chh - hz) * (i / 26) * 0.9 + Math.random() * 3;
      var lg = 1 - i / 26;
      g.fillStyle = 'rgba(255,255,255,' + (0.1 + lg * 0.42) + ')';
      g.fillRect(sx - sr * (0.5 + Math.random() * 1.0) * lg, yy, sr * (0.6 + Math.random() * 1.2) * (0.4 + lg), Math.max(0.8, chh * 0.004));
    }

    /* 远处堤坝横线 */
    g.strokeStyle = 'rgba(74,64,52,.20)';
    g.lineWidth = Math.max(1, chh * 0.0035);
    g.beginPath(); g.moveTo(0, hz); g.lineTo(cw, hz); g.stroke();

    /* 电线杆（右）+ 电缆 */
    var poleX = cw * 0.63, poleTop = chh * 0.05, poleBot = hz + chh * 0.02;
    g.strokeStyle = 'rgba(46,40,33,.55)';
    g.lineWidth = Math.max(1.4, cw * 0.0032);
    g.beginPath(); g.moveTo(poleX, poleTop); g.lineTo(poleX, poleBot); g.stroke();
    g.lineWidth = Math.max(1, cw * 0.0022);
    for (i = 0; i < 3; i++) {
      var ay = poleTop + chh * (0.035 + i * 0.032);
      g.beginPath(); g.moveTo(poleX - cw * 0.045, ay); g.lineTo(poleX + cw * 0.045, ay); g.stroke();
    }
    /* 电缆：三条弧，垂度固定，不用物理 */
    g.strokeStyle = 'rgba(52,45,37,.42)';
    g.lineWidth = Math.max(1, cw * 0.0018);
    for (i = 0; i < 3; i++) {
      var y0 = poleTop + chh * (0.035 + i * 0.032);
      g.beginPath();
      g.moveTo(poleX - cw * 0.045, y0);
      g.quadraticCurveTo(cw * 0.45, y0 + chh * 0.075, -cw * 0.02, y0 + chh * 0.02);
      g.stroke();
      g.beginPath();
      g.moveTo(poleX + cw * 0.045, y0);
      g.quadraticCurveTo(cw * 0.88, y0 + chh * 0.07, cw * 1.02, y0 + chh * 0.012);
      g.stroke();
    }
    farW = cw; farH = chh;
  }

  /* 中景：铁道口栏杆 + 信号灯 + 波子汽水瓶剪影（单独板，可稍快位移） */
  function buildNear(w, h) {
    var cw = Math.max(2, Math.round(w * 0.72));
    var chh = Math.max(2, Math.round(h * 0.42));
    near.width = cw; near.height = chh;
    nearC = near.getContext('2d');
    var g = nearC;
    g.clearRect(0, 0, cw, chh);
    var baseY = chh * 0.96;
    var ink = 'rgba(30,26,21,.82)';

    /* 地面 */
    var gd = g.createLinearGradient(0, chh * 0.55, 0, chh);
    gd.addColorStop(0, 'rgba(233,224,208,0)');
    gd.addColorStop(1, 'rgba(206,193,172,.62)');
    g.fillStyle = gd;
    g.fillRect(0, chh * 0.5, cw, chh * 0.5);

    /* 铁轨：两条透视线 */
    g.strokeStyle = 'rgba(64,56,46,.5)';
    g.lineWidth = Math.max(1.5, cw * 0.0035);
    g.beginPath(); g.moveTo(-cw * 0.02, baseY); g.lineTo(cw * 0.72, chh * 0.66); g.stroke();
    g.beginPath(); g.moveTo(cw * 1.02, baseY); g.lineTo(cw * 0.72, chh * 0.66); g.stroke();
    /* 枕木 */
    var i, f;
    for (i = 0; i < 9; i++) {
      f = i / 9;
      var yy = baseY - (baseY - chh * 0.68) * f;
      var ww = cw * (0.06 + 0.5 * f);
      g.strokeStyle = 'rgba(74,64,52,' + (0.30 - f * 0.18) + ')';
      g.lineWidth = Math.max(1, cw * 0.0026 * (1 - f * 0.7));
      g.beginPath(); g.moveTo(cw * 0.5 - ww, yy); g.lineTo(cw * 0.5 + ww, yy); g.stroke();
    }

    /* 铁道口栏杆：斜杆从右下升起 */
    var bx = cw * 0.10, by = chh * 0.86;
    g.save();
    g.translate(bx, by);
    g.rotate(-0.34);
    var armLen = cw * 0.62, armH = Math.max(5, chh * 0.028);
    /* 黑白警示段 */
    var seg = armLen / 10, s;
    for (s = 0; s < 10; s++) {
      g.fillStyle = (s % 2 === 0) ? 'rgba(28,24,20,.86)' : 'rgba(250,246,238,.92)';
      g.fillRect(s * seg, -armH * 0.5, seg, armH);
    }
    g.strokeStyle = 'rgba(28,24,20,.6)';
    g.lineWidth = Math.max(1, chh * 0.003);
    g.strokeRect(0, -armH * 0.5, armLen, armH);
    /* 配重块 */
    g.fillStyle = 'rgba(28,24,20,.8)';
    g.fillRect(-armLen * 0.06, -armH * 1.5, armLen * 0.10, armH * 3.2);
    g.restore();

    /* 信号灯柱 */
    var px = cw * 0.055;
    g.strokeStyle = 'rgba(28,24,20,.75)';
    g.lineWidth = Math.max(2, cw * 0.005);
    g.beginPath(); g.moveTo(px, chh * 0.30); g.lineTo(px, chh * 0.94); g.stroke();
    /* 交叉标志（无字，两片板） */
    g.save();
    g.translate(px, chh * 0.30);
    g.rotate(0.5);
    g.fillStyle = 'rgba(28,24,20,.55)';
    g.fillRect(-chh * 0.13, -chh * 0.014, chh * 0.26, chh * 0.028);
    g.rotate(-1.0);
    g.fillRect(-chh * 0.13, -chh * 0.014, chh * 0.26, chh * 0.028);
    g.restore();

    /* 波子汽水瓶（左下，剪影 + 高光） */
    var gx = cw * 0.30, gy = chh * 0.94, gw = cw * 0.030, gh = chh * 0.13;
    g.fillStyle = 'rgba(38,58,52,.42)';
    g.beginPath();
    g.moveTo(gx - gw, gy);
    g.lineTo(gx - gw * 0.92, gy - gh * 0.62);
    g.quadraticCurveTo(gx - gw * 0.55, gy - gh * 0.80, gx - gw * 0.30, gy - gh * 0.84);
    g.lineTo(gx - gw * 0.26, gy - gh);
    g.lineTo(gx + gw * 0.26, gy - gh);
    g.lineTo(gx + gw * 0.30, gy - gh * 0.84);
    g.quadraticCurveTo(gx + gw * 0.55, gy - gh * 0.80, gx + gw * 0.92, gy - gh * 0.62);
    g.lineTo(gx + gw, gy);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.85)';
    g.lineWidth = Math.max(1.2, gw * 0.16);
    g.beginPath(); g.moveTo(gx - gw * 0.5, gy - gh * 0.08); g.lineTo(gx - gw * 0.45, gy - gh * 0.66); g.stroke();
    /* 吸管 / 弹珠 */
    g.strokeStyle = 'rgba(38,58,52,.5)';
    g.lineWidth = Math.max(1, gw * 0.1);
    g.beginPath(); g.moveTo(gx + gw * 0.1, gy - gh * 0.86); g.lineTo(gx + gw * 0.5, gy - gh * 1.06); g.stroke();

    nearW = cw; nearH = chh;
  }

  function ensureBoards() {
    var w = view.w, h = view.h;
    if (!farC || Math.abs(farW - w * 0.62) > 2 || Math.abs(farH - h * 0.62) > 2) buildFar(w, h);
    if (!nearC || Math.abs(nearW - w * 0.72) > 2 || Math.abs(nearH - h * 0.42) > 2) buildNear(w, h);
  }

  /* ---------- 每帧 ---------- */
  var pulse = 0;

  function draw(time) {
    var w = view.w, h = view.h;
    var still = reduced;
    if (still) time = 0;

    /* 过曝太阳的慢速漂移 + 拍点脉冲 */
    var drift = Math.sin(time * 0.14) * w * 0.012;
    var dx = beatEnv * w * 0.006;
    var skyShift = -time * (0.9 + bass * 2.4) - drift * 2;

    ctx.fillStyle = '#fbf6ec';
    ctx.fillRect(0, 0, w, h);

    /* 远景：缓慢横移，铺满 */
    if (farC) {
      var sc = Math.max(w * 1.06 / farW, h * 1.02 / farH);
      var fw = farW * sc, fh = farH * sc;
      var fx = ((skyShift % fw) + fw) % fw;
      ctx.drawImage(far, -fw + fx, -fh * 0.06, fw, fh);
      ctx.drawImage(far, fx, -fh * 0.06, fw, fh);
      if (fx + fw < w) ctx.drawImage(far, fx + fw, -fh * 0.06, fw, fh);
    }

    /* 近景：更快位移，做出视差 */
    if (nearC) {
      var ns = Math.max(w * 0.98 / nearW, h * 0.40 / nearH);
      var nw = nearW * ns, nh = nearH * ns;
      var nShift = -time * (2.2 + bass * 6) * (playing ? 1 : 0.25);
      var nx = ((nShift % nw) + nw) % nw;
      var nyBase = h - nh + h * 0.02;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(near, nx, nyBase + dx, nw, nh);
      ctx.drawImage(near, nx - nw, nyBase + dx, nw, nh);
      ctx.globalAlpha = 1;
    }

    /* 拍点：一次横向过曝闪白（预乘 alpha，不重算像素） */
    var flash = still ? 0 : Math.min(0.26, beatEnv * 0.20 + pulse * 0.16);
    if (flash > 0.012) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,255,255,' + flash.toFixed(3) + ')';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }

    /* 快门：整句唱完时上下压一道极浅的暗边，模拟遮光帘 */
    if (!still && pulse > 0.02) {
      var sh = h * 0.055 * pulse;
      var sg = ctx.createLinearGradient(0, 0, 0, sh);
      sg.addColorStop(0, 'rgba(60,50,38,' + (0.16 * pulse).toFixed(3) + ')');
      sg.addColorStop(1, 'rgba(60,50,38,0)');
      ctx.fillStyle = sg; ctx.fillRect(0, 0, w, sh);
      var sg2 = ctx.createLinearGradient(0, h, 0, h - sh);
      sg2.addColorStop(0, 'rgba(60,50,38,' + (0.16 * pulse).toFixed(3) + ')');
      sg2.addColorStop(1, 'rgba(60,50,38,0)');
      ctx.fillStyle = sg2; ctx.fillRect(0, h - sh, w, sh);
    }

    /* 关灯时整片压暗一点点，仍然保持亮底可读 */
    if (!playing) {
      ctx.fillStyle = 'rgba(120,112,98,.10)';
      ctx.fillRect(0, 0, w, h);
    }
  }

  function tickWork() {
    var i = findIdx(t);
    if (i !== idx || lyricBuiltFor !== idx) setLine(i);
    pulse *= 0.90;
    beatEnv *= 0.92;
    updateLyric(t);
    draw(t);
  }

  function sendReady() {
    if (readySent) return;
    readySent = true;
    try {
      if (window.parent && window.parent.postMessage) {
        window.parent.postMessage({ __c100: 1, type: 'ready' }, '*');
      }
    } catch (e) { console.error('[462] ready failed', e); }
  }

  function loop() {
    var js0 = performance.now();
    frames++;
    try { tickWork(); } catch (e) { console.error('[462] frame', e); }
    lastJs = Math.round((performance.now() - js0) * 100) / 100;
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);

  requestAnimationFrame(function first() {
    frames++;
    sendReady();
    try { tickWork(); } catch (e) { console.error('[462] first frame', e); }
    requestAnimationFrame(loop);
    /* 颗粒贴图是重活，挪到 ready 之后 */
    setTimeout(function () {
      try { makeGrainTile(); } catch (e) { console.error('[462] grain deferred', e); }
    }, 120);
  });
  setTimeout(sendReady, 700);
})();
</script>
</body>
