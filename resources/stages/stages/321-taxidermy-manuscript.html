<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>标本手稿 · TAXIDERMY MANUSCRIPT</title>
<style>
  :root{
    --ink:#1d1108; --sepia:#c09155; --rust:#8e3a20; --gold:#cba350;
    --paper:#0b0705; --fg:#e7d3b2; --dim:rgba(231,211,178,.42);
    --accent:rgb(190,140,80); --accentA:rgba(214,160,96,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#070403}
  body{font-family:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","STZhongsong",
       "SimSun","MS Song","Times New Roman",serif;
       color:var(--fg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:
    radial-gradient(118% 96% at 64% 26%, #362112 0%, #1e1309 33%, #0e0805 68%, #060403 100%)}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ovl{position:absolute;pointer-events:none}
  #tGrain{inset:-10%;background:url("assets/321-grain.png") repeat;background-size:188px 188px;
          opacity:.32;mix-blend-mode:overlay}
  #tFox{inset:-6%;background:url("assets/321-foxing.png") center/cover no-repeat;
        opacity:.88;mix-blend-mode:multiply}
  #tHalf{inset:0;background:url("assets/321-halftone.png") repeat;background-size:4px 4px;
         opacity:.15;mix-blend-mode:multiply}
  #tGrain2{inset:-10%;z-index:4;background:url("assets/321-grain.png") repeat;
           background-size:188px 188px;opacity:.24;mix-blend-mode:overlay}
  #tVig{inset:0;z-index:4;background:radial-gradient(125% 110% at 50% 44%,rgba(0,0,0,0) 32%,
        rgba(4,2,1,.5) 70%,rgba(2,1,1,.9) 100%)}
  #grid{position:absolute;inset:-4%;pointer-events:none;transform:rotate(-1.1deg);opacity:.85;
    background-image:
      repeating-linear-gradient(0deg,rgba(206,164,110,.14) 0 1px,transparent 1px 84px),
      repeating-linear-gradient(90deg,rgba(206,164,110,.14) 0 1px,transparent 1px 84px),
      repeating-linear-gradient(0deg,rgba(206,164,110,.055) 0 1px,transparent 1px 21px),
      repeating-linear-gradient(90deg,rgba(206,164,110,.055) 0 1px,transparent 1px 21px);
    -webkit-mask-image:radial-gradient(120% 100% at 50% 46%,#000 18%,rgba(0,0,0,.4) 62%,transparent 96%);
    mask-image:radial-gradient(120% 100% at 50% 46%,#000 18%,rgba(0,0,0,.4) 62%,transparent 96%)}

  /* ---- annotations / archive marks ---- */
  .lbl{position:absolute;z-index:5;font:600 clamp(9px,.72vw,12px)/1.55 ui-monospace,"IBM Plex Mono",monospace;
       letter-spacing:.3em;text-transform:uppercase;color:rgba(231,211,178,.44);white-space:nowrap}
  .lbl b{color:rgba(214,160,96,.85);font-weight:600}
  #lTop{left:5vw;top:5.2vh}
  #lTop i{display:block;font-style:normal;font-size:9px;letter-spacing:.42em;color:rgba(231,211,178,.26)}
  #lCoord{right:5vw;top:5.4vh;text-align:right}
  #lVert{right:1.4vw;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
         font-size:9px;letter-spacing:.5em;color:rgba(231,211,178,.3)}
  #lSpec{left:5vw;bottom:calc(5.4vh + 34px);font-size:9px;letter-spacing:.24em;color:rgba(231,211,178,.28)}

  /* ---- ruler strip ---- */
  #ruler{position:absolute;z-index:5;left:5vw;right:5vw;bottom:5.4vh;height:30px;pointer-events:none;
         border-bottom:1px solid rgba(212,170,116,.26)}
  #ruler:before{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;
    background-image:repeating-linear-gradient(90deg,rgba(212,170,116,.55) 0 1px,transparent 1px 11px)}
  #rTick{position:absolute;left:0;right:0;bottom:11px;height:12px;
         font:500 8px/12px ui-monospace,monospace;color:rgba(212,170,116,.4);letter-spacing:.1em}
  #rTick span{position:absolute;bottom:0;transform:translateX(-50%)}

  /* ---- clock / digital scale ---- */
  #clock{position:absolute;z-index:6;right:5vw;bottom:calc(5.4vh + 42px);
         font:500 clamp(9px,.72vw,12px)/1 ui-monospace,monospace;letter-spacing:.22em;
         color:var(--accentA);font-variant-numeric:tabular-nums}
  #clock em{font-style:normal;color:rgba(231,211,178,.22)}

  /* ---- plate ---- */
  #plate{position:absolute;z-index:3;pointer-events:none;right:2.5vw;top:50%;
         height:min(88vh,102vw);width:min(78.2vh,90.7vw);aspect-ratio:800/900;
         transform:translateY(-50%) rotate(-1.3deg)}
  #plate:before{content:"";position:absolute;left:4%;right:4%;top:6%;bottom:4%;z-index:0;
    background:radial-gradient(56% 58% at 50% 44%,rgba(0,0,0,.62),rgba(0,0,0,.28) 52%,transparent 76%)}
  #plate svg{position:relative;width:100%;height:100%;display:block;overflow:visible}

  /* ---- scrim + lyrics ---- */
  #scrim{position:absolute;z-index:4;left:-10vw;bottom:-10vh;width:82vw;height:66vh;pointer-events:none;
    background:radial-gradient(58% 58% at 42% 62%,rgba(9,5,3,.9) 0%,rgba(9,5,3,.62) 48%,transparent 78%)}
  #lyr{position:absolute;z-index:6;left:5.4vw;bottom:14.5vh;width:min(52vw,880px)}
  #bigNo{position:absolute;z-index:4;left:-3vw;bottom:4vh;pointer-events:none;
         font:700 clamp(180px,30vw,430px)/.74 "Times New Roman",Times,serif;
         color:rgba(214,170,110,.07);letter-spacing:-.07em;transform:rotate(-4deg);
         -webkit-text-stroke:1px rgba(214,170,110,.05)}

  .line{font-size:clamp(19px,3.2vw,56px);line-height:1.3;letter-spacing:.01em;min-height:1.3em;
        text-shadow:0 1px 2px rgba(0,0,0,.5),0 0 24px rgba(0,0,0,.55)}
  .ghost{opacity:.28;font-size:.62em}
  #empty{display:none;font:italic 300 clamp(15px,2vw,26px)/1.6 "Songti SC",serif;color:rgba(231,211,178,.55)}

  /* ---------- plate motion ---------- */
  .pulse{transform-box:fill-box;transform-origin:center;will-change:transform}
  #flash{inset:0;opacity:0;pointer-events:none;z-index:7;
    background:radial-gradient(58% 48% at 63% 40%,rgba(228,180,112,.26),transparent 72%);
    mix-blend-mode:screen}

  /* ---------- dust ---------- */
  #dust{inset:0;z-index:5;pointer-events:none}
  #dust i{position:absolute;display:block;width:2px;height:2px;border-radius:50%;
    background:rgba(242,216,172,.55);box-shadow:0 0 7px rgba(240,200,140,.45);
    animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translate3d(0,6vh,0);opacity:0}
    14%{opacity:.85}
    86%{opacity:.4}
    100%{transform:translate3d(var(--dx,14px),-108vh,0);opacity:0}
  }
  @keyframes griddrift{
    0%{transform:rotate(-1.1deg) translate3d(0,0,0)}
    50%{transform:rotate(-1.1deg) translate3d(-6px,-8px,0)}
    100%{transform:rotate(-1.1deg) translate3d(0,0,0)}
  }
  #grid{animation:griddrift 74s ease-in-out infinite}

  /* ---------- lyric glyphs ---------- */
  #lyr .no{display:block;font:500 9px/1 ui-monospace,monospace;letter-spacing:.42em;
    color:rgba(212,170,116,.6);margin-bottom:.9em;min-height:1em}
  #cur .ch{display:inline-block;opacity:0;filter:blur(2.6px);
    transform:translateY(.18em) rotate(var(--rot,0deg)) scale(.95);
    transition:opacity .3s ease-out,filter .34s ease-out,
               transform .6s cubic-bezier(.16,.72,.24,1)}
  #cur .ch.on{opacity:1;filter:blur(0);
    transform:translateY(var(--dy,0em)) rotate(var(--rot,0deg)) scale(1)}
  #cur .ch.sp{width:.3em}
  #cur .ch.mono{font-family:ui-monospace,"IBM Plex Mono",monospace;font-size:.78em;letter-spacing:.05em}
  #cur .ch.it{font-style:italic;font-size:1.07em}
  #cur .ch.drop{font-size:1.28em}
  #prev{margin-bottom:.35em;letter-spacing:.16em;word-spacing:.2em;color:rgba(231,211,178,.38)}

  @media (prefers-reduced-motion: reduce){
    #grid,#dust i{animation:none}
    #cur .ch{transition-duration:.01s}
  }

  /* ---------- narrow / portrait ---------- */
  @media (max-width:760px),(max-aspect-ratio:4/5){
    #plate{height:min(70vh,140vw);width:min(62.2vh,124.4vw);right:-16vw;top:40%;opacity:.30}
    #lyr{left:7vw;right:7vw;width:auto;bottom:17vh}
    #scrim{left:-24vw;width:128vw;height:70vh}
    #lVert,#lTop i{display:none}
    #lCoord{right:7vw;font-size:9px}
    #lSpec{display:none}
    #ruler{left:7vw;right:7vw}
    #clock{right:7vw;font-size:10px}
    #bigNo{left:-6vw;bottom:8vh;font-size:clamp(150px,46vw,320px);opacity:.8}
  }
</style>
</head>

  <div id="plate">
<svg viewBox="0 0 800 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">

    <path id="hHalf" d="M400 296 C440 300 468 328 478 368 C487 404 502 434 508 460 C512 484 505 506 494 524 C482 543 472 560 468 582 C464 606 458 628 454 655 C450 682 442 707 431 726 C423 740 412 750 400 754 Z"/>

  <!-- engraving fragment : scroll, top left -->

    <path d="M6 0 C96 14 150 52 138 104 C130 138 92 150 46 142" stroke-width="1.4" stroke-opacity=".45"/>

    <div class="line ghost" id="prev"></div>
    <div class="line" id="cur"></div>
    <div id="empty">空白标本 · no lyric recovered</div>
  </div>
  <div id="flash" class="ovl"></div>
</div>
<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var S = {
    lines: [], idx: -1, t: 0, playing: true, dur: 0,
    accent: [190,140,80], frames: 0, js: 0, rm: false, gl: false,
    sent: false, ready: false, text: "", err: "",
    pulse: 0, tickAt: 0, beats: 0, energy: 0, hs: 1, fo: 0
  };
  try {
    var rmq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    if (rmq) { S.rm = !!rmq.matches; if (rmq.addEventListener) rmq.addEventListener('change', function(e){ S.rm = !!e.matches; }); }
  } catch(e){}
  var els = {
    cur: $('#cur'), prev: $('#prev'), empty: $('#empty'), lno: $('#lno'),
    lyrEl: $('#lyr'), clock: $('#clock'), rTick: $('#rTick'),
    plate: $('#plate'), haloG: $('#haloG'), flash: $('#flash'), dust: $('#dust')
  };

  function px(v, def){ v = Number(v); return (isFinite(v) && v > 0) ? Math.round(v) : def; }
  function rnd(seed){ var s = seed % 2147483647; if (s <= 0) s += 2147483646;
    return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

  function postReady(){
    if (S.sent) return;
    S.sent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
  }
  window.addEventListener('error', function(e){
    try { S.err = String((e && e.message) || 'error'); } catch(_){ S.err = 'error'; }
  });

  /* ---------- atmosphere canvas ---------- */
  var bg = $('#bg'), bctx = bg && bg.getContext ? bg.getContext('2d') : null;
  function paintBG(){
    if (!bctx) return;
    var W = Math.min(3000, px(window.innerWidth, 1440));
    var H = Math.min(1800, px(window.innerHeight, 900));
    var DPR = Math.min(2, px(window.devicePixelRatio, 1));
    bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
    bg.style.width = W + 'px'; bg.style.height = H + 'px';
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bctx.clearRect(0, 0, W, H);

    // warm darkroom bloom
    var g = bctx.createRadialGradient(W * 0.66, H * 0.3, 0, W * 0.66, H * 0.3, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(212,158,92,.20)');
    g.addColorStop(0.42, 'rgba(150,96,52,.09)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);

    // fixer drips
    var r = rnd(9137), i;
    for (i = 0; i < 46; i++){
      var x = r() * W, w = 1 + r() * 9, a = 0.012 + r() * 0.028;
      var gr = bctx.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, 'rgba(0,0,0,0)');
      gr.addColorStop(0.4 + r() * 0.2, 'rgba(0,0,0,' + a.toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      bctx.fillStyle = gr; bctx.fillRect(x, 0, w, H);
    }
    // dust / scan specks
    for (i = 0; i < 260; i++){
      var dx = r() * W, dy = r() * H, dr = 0.4 + r() * 1.5;
      bctx.fillStyle = 'rgba(238,214,176,' + (0.05 + r() * 0.22).toFixed(3) + ')';
      bctx.beginPath(); bctx.arc(dx, dy, dr, 0, 6.2832); bctx.fill();
    }
  }

  /* ---------- ruler labels ---------- */
  function totalDur(){
    if (S.dur > 0) return S.dur;
    var n = S.lines.length;
    if (n){
      var L = S.lines[n - 1], e = L.t + (L.dur > 0 ? L.dur : 3.2);
      if (isFinite(e) && e > 0) return e;
    }
    return 180;
  }
  function paintRuler(){
    if (!els.rTick) return;
    var total = totalDur(), html = '', n = 13, i;
    for (i = 0; i < n; i++){
      var v = Math.round(i * total / (n - 1));
      html += '<span style="left:' + (i * 100 / (n - 1)).toFixed(2) + '%">' + v + '</span>';
    }
    els.rTick.innerHTML = html;
  }

  function fmt(t){
    t = Number(t); if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = t - m * 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
  }
  function paintClock(){
    if (!els.clock) return;
    els.clock.innerHTML = fmt(S.t) + ' <em>/</em> ' + (S.dur > 0 ? fmt(S.dur) : '--:--');
  }

  /* ---------- plate decorations (built once, capped) ---------- */
  function buildDecor(){
    var rays = document.getElementById('rays');
    if (rays && !rays.childNodes.length){
      var out = [], n = 56, i;
      for (i = 0; i < n; i++){
        var a = (i / n) * Math.PI * 2 - Math.PI / 2;
        var r1 = (i % 2) ? 264 : 276;
        if (i % 8 === 0) r1 = 292;
        out.push('<line x1="' + (400 + Math.cos(a) * 250).toFixed(1) + '" y1="' +
                 (388 + Math.sin(a) * 250).toFixed(1) + '" x2="' +
                 (400 + Math.cos(a) * r1).toFixed(1) + '" y2="' +
                 (388 + Math.sin(a) * r1).toFixed(1) + '" stroke-opacity="' +
                 ((i % 2) ? 0.28 : 0.55) + '"/>');
      }
      rays.innerHTML = out.join('');
    }
    var hd = document.getElementById('haloDots');
    if (hd && !hd.childNodes.length){
      var o2 = [], j;
      for (j = 0; j < 48; j++){
        var b = (j / 48) * Math.PI * 2;
        o2.push('<circle cx="' + (400 + Math.cos(b) * 254).toFixed(1) + '" cy="' +
                (388 + Math.sin(b) * 254).toFixed(1) + '" r="' + ((j % 3 === 0) ? 1.6 : 0.9) +
                '" fill-opacity="' + ((j % 3 === 0) ? 0.62 : 0.3) + '"/>');
      }
      hd.innerHTML = o2.join('');
    }
    var at = document.getElementById('axisTicks');
    if (at && !at.childNodes.length){
      var o3 = [], k;
      for (k = 0; k < 18; k++){
        var y = 110 + k * 40;
        o3.push('<line x1="96" y1="' + y + '" x2="' + ((k % 4 === 0) ? 82 : 89) + '" y2="' + y + '"/>');
      }
      at.innerHTML = o3.join('');
    }
  }

  function buildDust(){
    var d = els.dust;
    if (!d || d.childNodes.length) return;
    var r = rnd(4242), frag = document.createDocumentFragment(), i;
    for (i = 0; i < 22; i++){
      var s = document.createElement('i');
      var sz = 1 + r() * 2;
      s.style.left = (r() * 100).toFixed(2) + '%';
      s.style.top = (58 + r() * 46).toFixed(2) + '%';
      s.style.width = sz.toFixed(1) + 'px';
      s.style.height = sz.toFixed(1) + 'px';
      s.style.opacity = (0.22 + r() * 0.5).toFixed(2);
      s.style.animationDuration = (17 + r() * 21).toFixed(1) + 's';
      s.style.animationDelay = (-r() * 34).toFixed(1) + 's';
      s.style.setProperty('--dx', ((r() - 0.5) * 90).toFixed(0) + 'px');
      frag.appendChild(s);
    }
    d.appendChild(frag);
  }

  /* ---------- deterministic glyph hash ---------- */
  function hash(i){ var x = Math.sin((i + 1) * 12.9898) * 43758.5453; return x - Math.floor(x); }

  function roman(n){
    n = Math.floor(Number(n) || 0);
    if (n <= 0) return '—';
    n = Math.min(n, 99);
    var m = [[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']], s = '', i = 0;
    for (; i < m.length; i++){ while (n >= m[i][0]){ s += m[i][1]; n -= m[i][0]; } }
    return s || '—';
  }

  var curSpans = [], curChars = [], rc = 0;

  function charTimes(L){
    var out = [], n = L.text.length, i;
    var cs = L.chars, d = L.dur > 0 ? L.dur : 3.2;
    if (cs && cs.length){
      for (i = 0; i < n; i++){
        var c = cs[i], tt = NaN;
        if (c && typeof c === 'object') tt = Number(c.t);
        if (!isFinite(tt)){
          var k = Math.min(i, cs.length - 1);
          var ct = cs[k] ? Number(cs[k].t) : NaN;
          tt = isFinite(ct) ? ct : (L.t + (i / n) * d);
        }
        out.push(tt);
      }
    } else {
      var span = Math.min(Math.max(d * 0.82, 0.9), Math.max(0.9, n * 0.17));
      for (i = 0; i < n; i++) out.push(L.t + 0.10 + span * (n <= 1 ? 0 : i / (n - 1)));
    }
    return out;
  }

  function syncChars(t){
    var n = curSpans.length;
    if (!n) return;
    var k = 0;
    while (k < n && curChars[k] <= t + 0.02) k++;
    if (k === rc) return;
    var i;
    if (k > rc){ for (i = rc; i < k; i++) curSpans[i].classList.add('on'); }
    else { for (i = k; i < rc; i++) curSpans[i].classList.remove('on'); }
    rc = k;
  }

  function buildLine(L){
    curSpans = []; curChars = []; rc = 0;
    if (!els.cur) return;
    els.cur.innerHTML = '';
    if (!L || !L.text) return;
    var text = L.text, i;
    if (text.length > 320) text = text.slice(0, 320);
    curChars = charTimes(L);
    var frag = document.createDocumentFragment();
    for (i = 0; i < text.length; i++){
      var c = text.charAt(i);
      var sp = document.createElement('span');
      var cls = 'ch';
      if (c === ' ' || c === '\u3000'){ cls += ' sp'; }
      else {
        var r1 = hash(i), r2 = hash(i + 97), r3 = hash(i + 311);
        if (r3 > 0.87 && /[A-Za-z0-9]/.test(c)) cls += ' mono';
        else if (r3 < 0.09) cls += ' it';
        if (i === 0 && r1 > 0.42) cls += ' drop';
        sp.style.setProperty('--rot', ((r1 - 0.5) * 3.4).toFixed(2) + 'deg');
        sp.style.setProperty('--dy', ((r2 - 0.5) * 0.07).toFixed(3) + 'em');
      }
      sp.className = cls;
      sp.textContent = (c === ' ' ? '\u00a0' : c);
      frag.appendChild(sp);
      curSpans.push(sp);
    }
    els.cur.appendChild(frag);
    fit();
    syncChars(S.t);
  }

  function fit(){
    var el = els.cur;
    if (!el) return;
    el.style.fontSize = '';
    var base = 24;
    if (window.getComputedStyle){
      var f = parseFloat(getComputedStyle(el).fontSize);
      if (isFinite(f) && f > 4) base = f;
    }
    var vh = px(window.innerHeight, 900);
    var maxH = Math.max(96, Math.min(vh * 0.42, 430));
    var size = base, k = 0;
    while (k < 14 && el.scrollHeight > maxH && size > base * 0.4){
      size *= 0.9; el.style.fontSize = size.toFixed(1) + 'px'; k++;
    }
    var box = els.lyrEl;
    if (box && el.scrollWidth > box.clientWidth + 2){
      var fs = parseFloat(el.style.fontSize) || base, k2 = 0;
      while (k2 < 8 && el.scrollWidth > box.clientWidth + 2 && fs > base * 0.4){
        fs *= 0.93; el.style.fontSize = fs.toFixed(1) + 'px'; k2++;
      }
    }
  }

  function setIdx(i){
    if (i === S.idx) return;
    S.idx = i;
    var L = S.lines[i];
    S.text = (L && typeof L.text === 'string') ? L.text : '';
    var P = S.lines[i - 1];
    els.prev.textContent = (P && typeof P.text === 'string') ? P.text : '';
    els.lno.textContent = roman(i + 1) + ' · ' + (i < 0 ? '00' : ('0' + (i + 1)).slice(-2));
    if (S.lines.length === 0){
      els.empty.style.display = 'block';
      curSpans = []; curChars = []; rc = 0;
      els.cur.innerHTML = '';
    } else {
      els.empty.style.display = 'none';
      buildLine(L);
    }
  }

  function applyInit(p){
    p = p || {};
    var ls = Array.isArray(p.lines) ? p.lines : [];
    S.lines = [];
    for (var i = 0; i < ls.length && i < 4000; i++){
      var L = ls[i]; if (!L) continue;
      var tx = (typeof L.text === 'string') ? L.text : '';
      var t = Number(L.t); if (!isFinite(t)) t = 0;
      var d = Number(L.dur); if (!isFinite(d) || d < 0) d = 0;
      S.lines.push({ t:t, dur:d, text:tx, chars: Array.isArray(L.chars) ? L.chars : null });
    }
    S.dur = isFinite(Number(p.duration)) ? Math.max(0, Number(p.duration)) : 0;
    if (Array.isArray(p.accent) && p.accent.length >= 3){
      var a = p.accent.map(function(v){ return Math.max(0, Math.min(255, Math.round(Number(v)||0))); });
      S.accent = a.slice(0,3);
      var rootS = document.documentElement.style;
      rootS.setProperty('--accent', 'rgb('+a[0]+','+a[1]+','+a[2]+')');
      rootS.setProperty('--accentA', 'rgba('+a[0]+','+a[1]+','+a[2]+',.66)');
    }
    S.playing = (p.playing === undefined) ? true : !!p.playing;
    S.idx = -2; setIdx(-1);
    setIdx(idxAt(S.t));
    paintRuler(); paintClock();
  }

  function idxAt(t){
    var n = S.lines.length, lo = 0, hi = n - 1, r = -1;
    while (lo <= hi){
      var m = (lo + hi) >> 1;
      if (S.lines[m].t <= t + 0.001){ r = m; lo = m + 1; } else { hi = m - 1; }
    }
    return r;
  }

  window.addEventListener('message', function(e){
    var m = e.data;
    if (!m || m.__c100 !== 1) return;
    if (m.type === 'init'){ applyInit(m.payload); }
    else if (m.type === 'tick'){
      var p = m.payload || {};
      var t = Number(p.time); S.t = isFinite(t) ? t : S.t;
      if (p.playing !== undefined) S.playing = !!p.playing;
      S.tickAt = performance.now();
      setIdx(idxAt(S.t));
      paintClock();
    }
    else if (m.type === 'beat'){
      var b = m.payload || {};
      var lv = Number(b.level);
      if (!isFinite(lv)) lv = 0.6;
      lv = Math.max(0, Math.min(1, lv));
      S.pulse = Math.max(S.pulse, 0.32 + lv * 0.68);
      S.beats++;
    }
    else if (m.type === 'live'){
      var li = m.payload || {};
      var el = Number(li.level);
      if (isFinite(el)) S.energy = Math.max(0, Math.min(1, el));
      S.tickAt = S.tickAt || performance.now();
    }
  });

  var lastT = performance.now();
  function frame(now){
    var t0 = performance.now();
    if (!(now >= lastT)) now = lastT;
    lastT = now;
    S.frames++;
    if (S.frames === 1) postReady();

    // local clock: extrapolate between 15Hz ticks so glyphs don't stutter
    var tl = S.t;
    if (S.playing && S.tickAt){
      tl = S.t + Math.min(0.16, Math.max(0, (t0 - S.tickAt) / 1000));
    }
    syncChars(tl);

    S.pulse *= S.rm ? 0.83 : 0.9;
    if (S.pulse < 0.005) S.pulse = 0;
    var sc = 1 + S.pulse * (S.rm ? 0.008 : 0.042);
    if (els.haloG && Math.abs(sc - S.hs) > 0.0006){
      S.hs = sc;
      els.haloG.style.transform = 'scale(' + sc.toFixed(4) + ')';
    }
    if (els.flash){
      var fo = S.pulse * (S.rm ? 0.05 : 0.4) + S.energy * 0.07;
      if (Math.abs(fo - S.fo) > 0.004){ S.fo = fo; els.flash.style.opacity = fo.toFixed(3); }
    }

    S.js = S.js * 0.88 + Math.max(0, performance.now() - t0) * 0.12;
    requestAnimationFrame(frame);
  }

  var rzT = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rzT);
    rzT = setTimeout(function(){ paintBG(); fit(); }, 180);
  });

  paintBG(); buildDecor(); buildDust(); paintRuler(); paintClock();
  requestAnimationFrame(frame);
  setTimeout(postReady, 60);
  setTimeout(postReady, 400);

  window.__stage = function(){
    return { lines: S.lines.length, idx: S.idx, t: S.t, playing: S.playing,
             frames: S.frames, js: Math.round(S.js*100)/100, err: S.err,
             text: S.text || "", gl: S.gl, rm: S.rm };
  };
})();
</script>
</body>
</html>
