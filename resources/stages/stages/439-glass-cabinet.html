<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蓝闪蝶匣 · Cabinet of Curiosities</title>
<style>
  *{box-sizing:border-box}
  :root{--accent:58,143,224;--accent-soft:93}
  html,body{margin:0;height:100%;overflow:hidden;background:#120e0a}
  body{
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;color:#efe2c6;
  }
  #stage{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(150% 110% at 50% -20%,#3a2716 0%,rgba(58,39,22,0) 60%),
      radial-gradient(120% 90% at 50% 110%,#20140c 0%,rgba(32,20,12,0) 62%),
      #0d0805}
  /* 木质柜体边框 */
  #case{position:absolute;inset:0;pointer-events:none;z-index:6}
  #case::before{content:"";position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(70,44,22,.95),rgba(38,23,12,0) 7%,rgba(38,23,12,0) 93%,rgba(70,44,22,.95)),
      linear-gradient(180deg,rgba(78,50,26,.98),rgba(30,18,9,0) 9%,rgba(30,18,9,0) 88%,rgba(84,54,28,.98)),
      repeating-linear-gradient(92deg,rgba(0,0,0,.16) 0 2px,rgba(120,80,40,.05) 2px 6px);
    box-shadow:inset 0 0 12vh rgba(0,0,0,.85)}
  #glass{position:absolute;inset:0;z-index:7;pointer-events:none;
    background:
      linear-gradient(114deg,rgba(255,240,210,.09) 0%,rgba(255,240,210,0) 26%,rgba(255,240,210,0) 72%,rgba(255,240,210,.05) 100%),
      radial-gradient(80% 55% at 22% 8%,rgba(214,236,255,.10),rgba(214,236,255,0) 60%)}
  /* 蝶翼金属光：跟随频谱呼吸 */
  #glow{position:absolute;inset:-10%;z-index:5;pointer-events:none;opacity:.55;
    background:
      radial-gradient(38% 32% at 50% 42%,rgba(var(--accent),.34),rgba(var(--accent),0) 70%),
      radial-gradient(30% 26% at 22% 68%,rgba(120,70,210,.22),rgba(120,70,210,0) 72%),
      radial-gradient(30% 26% at 78% 30%,rgba(40,208,216,.20),rgba(40,208,216,0) 72%);
    mix-blend-mode:screen;will-change:opacity,transform}
  #cabinet{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #cells{position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;
    gap:.75vh;width:100%;height:100%;padding:clamp(4px,1.1vh,16px)}
  .cell{position:relative;overflow:hidden;border-radius:2px;
    background:
      radial-gradient(120% 100% at 40% 10%,#2a1c12 0%,#1a110a 55%,#100a06 100%);
    box-shadow:inset 0 0 1.6vh rgba(0,0,0,.9),inset 0 1px 0 rgba(255,224,170,.07),
               0 1px 0 rgba(0,0,0,.6)}
  .cell::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(122deg,rgba(255,242,214,.11) 0 16%,rgba(255,242,214,0) 40%)}
  .cell svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* 标本钉与展柜标签 */
  .pin{position:absolute;left:50%;top:6%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,#f6e3b4,#8a6a34 60%,#3d2a12);z-index:3;
    box-shadow:0 1px 3px rgba(0,0,0,.9)}
  .lbl{position:absolute;left:6%;bottom:5%;font-size:clamp(5.5px,.58vw,9.5px);letter-spacing:.12em;
    color:#4a361c;background:linear-gradient(170deg,#e8d8b2,#cdb98e);padding:.28em .5em .2em;
    border:1px solid rgba(80,54,26,.45);border-radius:1px;
    box-shadow:0 1px 3px rgba(0,0,0,.75);transform:rotate(-1.4deg);white-space:nowrap;max-width:88%;
    overflow:hidden;text-overflow:ellipsis;z-index:3;font-style:italic}
  #lyricBox{position:absolute;left:0;right:0;bottom:0;z-index:8;
    padding:0 clamp(14px,6vw,110px) clamp(26px,9vh,86px);pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:.7em}
  #plaque{position:relative;padding:.5em 1.1em .45em;text-align:center;
    background:
      linear-gradient(178deg,rgba(238,222,186,.94),rgba(206,185,140,.92)),
      repeating-linear-gradient(92deg,rgba(90,64,30,.07) 0 2px,transparent 2px 5px);
    border:1px solid rgba(92,64,30,.55);
    box-shadow:0 1px 0 rgba(255,246,222,.55) inset,0 -1px 0 rgba(84,58,26,.45) inset,
      0 1.2vh 3vh rgba(0,0,0,.72),0 .3vh .6vh rgba(0,0,0,.55)}
  /* 黄铜铭牌四角螺钉 */  #plaque::before,#plaque::after{content:"";position:absolute;top:50%;width:5px;height:5px;
    margin-top:-2.5px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#fff0c4,#9c7a3c 58%,#4a3214);
    box-shadow:0 1px 2px rgba(0,0,0,.7)}
  #plaque::before{left:6px}
  #plaque::after{right:6px}
  #lyric{font-size:clamp(17px,2.55vw,40px);line-height:1.42;letter-spacing:.05em;margin:0;
    color:#2b1c0c;font-weight:600;word-break:break-word;
    text-shadow:0 1px 0 rgba(255,247,225,.85)}
  #lyric.long{font-size:clamp(14px,1.95vw,30px)}
  #lyric.xlong{font-size:clamp(12px,1.5vw,23px);letter-spacing:.02em}
  #lyric .ch{color:#7d6647;transition:color .18s linear}
  #lyric .ch.on{color:#1f1103}
  #lyric .roman{display:block;font-size:.46em;letter-spacing:.3em;color:#6c5330;margin-top:.45em;
    text-transform:uppercase;font-weight:400;font-style:italic}
  #meta{display:block;margin-top:.55em;font-size:clamp(8px,.72vw,12px);letter-spacing:.26em;
    color:#6a5230;text-transform:uppercase;font-style:italic;opacity:.9}
  #tag{position:absolute;left:3.2vw;top:2.6vh;z-index:9;font-size:clamp(9px,.78vw,13px);
    letter-spacing:.42em;text-transform:uppercase;color:#c8ab7c;opacity:.82;
    text-shadow:0 1px 6px rgba(0,0,0,.9)}
  #empty{position:absolute;left:0;right:0;top:22vh;display:none;flex-direction:column;gap:.9em;
    align-items:center;justify-content:flex-start;z-index:8;pointer-events:none;
    color:#a48c62;font-size:clamp(10px,1vw,15px);letter-spacing:.4em;text-transform:uppercase;
    opacity:.72;text-align:center;line-height:2}
  #empty small{font-size:.78em;letter-spacing:.24em;opacity:.8;font-style:italic}
</style>
</head>
<body>
<div id="stage">
  <div id="cabinet"><div id="cells"></div></div>
  <div id="glow"></div>
  <div id="case"></div>
  <div id="glass"></div>
  <div id="tag">Wunderkammer · Nº 439</div>
  <div id="empty">NO LYRICS · 此曲无词<small>the drawer holds only specimens</small></div>
  <div id="lyricBox">
    <div id="plaque">
      <p id="lyric"><span class="roman">· 奇珍柜 ·</span></p>
      <span id="meta"></span>
    </div>
  </div>
</div>
<script>
var ST = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
  err: '', text: '', gl: false, rm: false, lite: 0
};
window.__stage = function () {
  return {
    lines: ST.lines.length, idx: ST.idx, t: ST.t, playing: !!ST.playing,
    frames: ST.frames, js: ST.js, err: ST.err, text: ST.text,
    gl: !!ST.gl, rm: !!ST.rm
  };
};
(function () {
  'use strict';
  var W = window, D = document;
  var elCells = D.getElementById('cells');
  var elLyric = D.getElementById('lyric');
  var elMeta = D.getElementById('meta');
  var elEmpty = D.getElementById('empty');
  var elGlow = D.getElementById('glow');
  var elCase = D.getElementById('case');
  var sentReady = false;
  var pulseAmp = 0, pulseT = 0;
  var raf = W.requestAnimationFrame ? W.requestAnimationFrame.bind(W) : function (f) { return setTimeout(function () { f(Date.now()); }, 16); };

  try {
    ST.rm = !!(W.matchMedia && W.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { ST.rm = false; }

  W.onerror = function (msg, src, line) {
    console.error('[439] window error:', msg, src + ':' + line);
    return false;
  };

  function post(msg) {
    try { parent.postMessage(msg, '*'); } catch (e) { console.error('[439] postMessage failed', e); }
  }

  function ready() {
    if (sentReady) return;
    sentReady = true;
    post({ __c100: 1, type: 'ready' });
  }

  /* ---------- 程序化博物学插画（无外部素材，离线可用） ---------- */
  var UID = 0;
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function svgWrap(inner, vb) {
    return '<svg viewBox="' + vb + '" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + inner + '</svg>';
  }

  /* 闪蝶：蓝闪 + 翅脉 + 触角，金属蓝由线性渐变模拟结构色 */
  function mothSVG(seed) {
    UID++;
    var id = 'm' + UID, id2 = 'g' + UID;
    var s = (seed % 7) * 0.05;
    var svg = '<defs>' +
      '<linearGradient id="' + id + '" x1="18%" y1="0%" x2="82%" y2="100%">' +
        '<stop offset="0%" stop-color="#8fe4ff"/><stop offset="26%" stop-color="#2b8fe0"/>' +
        '<stop offset="58%" stop-color="#1a4bb0"/><stop offset="82%" stop-color="#5f2ec0"/>' +
        '<stop offset="100%" stop-color="#2ad0d8"/></linearGradient>' +
      '<radialGradient id="' + id2 + '" cx="42%" cy="34%" r="66%">' +
        '<stop offset="0%" stop-color="#d8f6ff" stop-opacity=".55"/>' +
        '<stop offset="70%" stop-color="#0b2a6b" stop-opacity="0"/></radialGradient>' +
      '</defs>' +
      '<g transform="translate(50,52)"><g class="wg" transform="rotate(' + (s * 22).toFixed(2) + ')">' +
        /* 上翅 */
        '<path d="M0,0 C-8,-30 -34,-46 -52,-34 C-68,-23 -56,2 -30,10 C-16,15 -5,12 0,0Z" fill="url(#' + id + ')" stroke="#071b3c" stroke-width="1.2"/>' +
        '<path d="M0,0 C8,-30 34,-46 52,-34 C68,-23 56,2 30,10 C16,15 5,12 0,0Z" fill="url(#' + id + ')" stroke="#071b3c" stroke-width="1.2"/>' +
        /* 下翅 */
        '<path d="M0,2 C-12,22 -40,30 -46,16 C-52,2 -26,0 -6,4Z" fill="url(#' + id + ')" stroke="#071b3c" stroke-width="1.1" opacity=".92"/>' +
        '<path d="M0,2 C12,22 40,30 46,16 C52,2 26,0 6,4Z" fill="url(#' + id + ')" stroke="#071b3c" stroke-width="1.1" opacity=".92"/>' +
        '<ellipse cx="0" cy="0" rx="52" ry="40" fill="url(#' + id2 + ')"/>' +
        /* 翅脉 */
        '<g stroke="#bfe9ff" stroke-width=".55" opacity=".5" fill="none">' +
          '<path d="M0,-1 C-12,-16 -30,-30 -46,-33"/><path d="M0,-1 C-12,-16 12,-16"/><path d="M0,-1 C-16,-12 -38,-18 -52,-16"/>' +
          '<path d="M0,-1 C12,-16 30,-30 46,-33"/><path d="M0,-1 C16,-12 38,-18 52,-16"/>' +
          '<path d="M0,3 C-10,16 -30,26 -44,22"/><path d="M0,3 C10,16 30,26 44,22"/>' +
        '</g>' +
        /* 身体与触角 */
        '<ellipse cx="0" cy="4" rx="2.6" ry="17" fill="#120a20"/>' +
        '<circle cx="0" cy="-14" r="3" fill="#1a0f2c"/>' +
        '<path d="M-1,-16 C-6,-27 -14,-32 -21,-34 M1,-16 C6,-27 14,-32 21,-34" stroke="#1c1230" stroke-width="1.1" fill="none" stroke-linecap="round"/>' +
        '<circle cx="-21" cy="-34" r="1.5" fill="#c9b172"/><circle cx="21" cy="-34" r="1.5" fill="#c9b172"/>' +
      '</g></g>';
    return svgWrap(svg, '0 0 100 100');
  }

  /* 怀表齿轮 */
  function gearSVG(teeth, r, col) {
    var d = '', i, a0, a1, step = 360 / teeth, pts = [];
    for (i = 0; i < teeth; i++) {
      a0 = i * step; a1 = a0 + step * 0.5;
      pts.push([a0, r * 0.78], [a0 + step * 0.16, r], [a1 - step * 0.16, r], [a1, r * 0.78]);
    }
    for (i = 0; i < pts.length; i++) {
      var rad = pts[i][0] * Math.PI / 180, rr = pts[i][1];
      d += (i ? 'L' : 'M') + (Math.cos(rad) * rr).toFixed(2) + ',' + (Math.sin(rad) * rr).toFixed(2);
    }
    d += 'Z';
    return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6"/>' +
      '<circle cx="0" cy="0" r="' + (r * 0.52).toFixed(2) + '" fill="none" stroke="' + col + '" stroke-width="1.2" opacity=".85"/>' +
      '<circle cx="0" cy="0" r="' + (r * 0.16).toFixed(2) + '" fill="' + col + '" opacity=".9"/>';
  }

  function gearsSVG() {
    UID++;
    var body = '<g transform="translate(44,44) rotate(12)">' + gearSVG(14, 32, '#c9a45c') + '</g>' +
      '<g transform="translate(72,66) rotate(-18)">' + gearSVG(10, 21, '#9c7f45') + '</g>' +
      '<g transform="translate(24,74) rotate(30)">' + gearSVG(8, 15, '#7d6435') + '</g>';
    return svgWrap(body, '0 0 100 100');
  }

  /* 古董钥匙 */
  function keySVG() {
    var body = '<g transform="translate(50,50) rotate(-28)">' +
      '<circle cx="-26" cy="0" r="13" fill="none" stroke="#c9a45c" stroke-width="3.2"/>' +
      '<circle cx="-26" cy="0" r="5.5" fill="none" stroke="#8b6f3b" stroke-width="2"/>' +
      '<rect x="-14" y="-3" width="46" height="6" rx="2" fill="#b79553"/>' +
      '<rect x="14" y="3" width="6" height="12" rx="1.5" fill="#b79553"/>' +
      '<rect x="24" y="3" width="6" height="8" rx="1.5" fill="#b79553"/>' +
      '<rect x="-14" y="-6" width="46" height="2" fill="#e6cf95" opacity=".55"/>' +
      '</g>';
    return svgWrap(body, '0 0 100 100');
  }

  /* 干枯玫瑰 */
  function roseSVG() {
    var i, petal = '', a;
    for (i = 0; i < 9; i++) {
      a = (i * 40) * Math.PI / 180;
      petal += '<ellipse cx="' + (Math.cos(a) * 13).toFixed(2) + '" cy="' + (Math.sin(a) * 11 - 8).toFixed(2) +
        '" rx="15" ry="10" transform="rotate(' + (i * 40) + ' ' + (Math.cos(a) * 13).toFixed(2) + ' ' + (Math.sin(a) * 11 - 8).toFixed(2) +
        ')" fill="' + (i % 2 ? '#6d1a24' : '#8d2530') + '" opacity=".95"/>';
    }
    var body = '<g transform="translate(50,52)">' +
      '<path d="M0,18 C-2,34 -8,48 -3,66" stroke="#4a3a1e" stroke-width="2.2" fill="none"/>' +
      '<path d="M-3,64 C-13,56 -20,58 -22,50 C-14,48 -8,52 -3,58Z" fill="#4d3c20" opacity=".9"/>' +
      petal +
      '<circle cx="0" cy="-8" r="11" fill="#4a0f17"/>' +
      '<circle cx="0" cy="-8" r="6" fill="#2e080e"/>' +
      '</g>';
    return svgWrap(body, '0 0 100 100');
  }

  /* 珊瑚枝 */
  function coralSVG() {
    var body = '<g transform="translate(50,72)" stroke="#c2543f" fill="none" stroke-linecap="round">' +
      '<path d="M0,0 C-3,-16 -10,-24 -16,-34 M0,0 C2,-18 8,-26 15,-36 M0,0 C0,-12 0,-22 1,-40" stroke-width="3.4"/>' +
      '<path d="M-10,-18 C-14,-24 -20,-25 -24,-30 M8,-22 C12,-28 18,-29 22,-33 M1,-22 C-2,-30 -6,-34 -8,-42" stroke-width="2.2"/>' +
      '<path d="M-16,-34 C-19,-40 -25,-42 -27,-48 M15,-36 C19,-41 24,-42 27,-47 M1,-40 C0,-46 -2,-50 -2,-56" stroke-width="1.6"/>' +
      '<circle cx="-27" cy="-48" r="1.8" fill="#d9745c" stroke="none"/><circle cx="27" cy="-47" r="1.8" fill="#d9745c" stroke="none"/>' +
      '<circle cx="-2" cy="-56" r="1.8" fill="#d9745c" stroke="none"/>' +
      '</g>';
    return svgWrap(body, '0 0 100 100');
  }

  /* 羽毛笔花体标签 */
  function labelSVG(text) {
    var clean = String(text || '').replace(/[<>&"']/g, '').slice(0, 14) || 'Specimen';
    var body = '<rect x="8" y="34" width="84" height="32" rx="1.5" fill="#e7d6ac" opacity=".95" transform="rotate(-2 50 50)"/>' +
      '<rect x="8" y="34" width="84" height="32" rx="1.5" fill="none" stroke="#8a6d3c" stroke-width=".8" transform="rotate(-2 50 50)"/>' +
      '<g transform="rotate(-2 50 50)">' +
      '<path d="M14,44 C30,42 50,45 86,43" stroke="#a98f66" stroke-width=".45" fill="none" opacity=".7"/>' +
      '<path d="M14,56 C34,58 52,55 86,57" stroke="#a98f66" stroke-width=".45" fill="none" opacity=".7"/>' +
      '</g>' +
      '<text x="50" y="56" text-anchor="middle" transform="rotate(-2 50 50)" ' +
      'font-family="Georgia,serif" font-style="italic" font-size="13" fill="#4a351b">' + clean + '</text>';
    return svgWrap(body, '0 0 100 100');
  }

  /* 分格内容轮转：蝴蝶为主角，其余为陪衬 */
  var KINDS = ['moth', 'gears', 'key', 'rose', 'coral', 'label'];
  var NAMES = ['Morpho · 闪蝶', 'Cal. 1841 · 齿轮', 'Brass Key · 铜钥', 'Rosa · 干玫瑰', 'Coral · 珊瑚', 'Fol. 12 · 标签'];

  function buildCells() {
    var cols = 6, rows = 4, i, c, kind, html;
    var vw = W.innerWidth || 1440;
    if (vw < 640) { cols = 3; rows = 5; }
    else if (vw < 1024) { cols = 4; rows = 4; }
    var total = Math.min(cols * rows, 30);
    elCells.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
    var frag = D.createDocumentFragment();
    for (i = 0; i < total; i++) {
      c = D.createElement('div');
      c.className = 'cell';
      kind = KINDS[i % KINDS.length];
      /* 每排保证闪蝶作为视觉锚点 */
      if (i % cols === 0 || i % cols === Math.floor(cols / 2)) kind = 'moth';
      if (kind === 'moth') html = mothSVG(i);
      else if (kind === 'gears') html = gearsSVG();
      else if (kind === 'key') html = keySVG();
      else if (kind === 'rose') html = roseSVG();
      else if (kind === 'coral') html = coralSVG();
      else html = labelSVG(NAMES[i % NAMES.length].split('·')[0]);
      c.innerHTML = html + '<span class="pin"></span><span class="lbl">' + NAMES[i % NAMES.length] + '</span>';
      frag.appendChild(c);
    }
    elCells.innerHTML = '';
    elCells.appendChild(frag);
    CELLS = elCells.children;
    curCols = cols;
  }
  var CELLS = [], curCols = 6;

  function pulse(k) {
    pulseAmp = Math.min(1, pulseAmp + 0.45 * k);
    pulseT = 0;
  }

  /* ---------- 歌词层：逐字（YRC）或按句长均分（LRC）---------- */
  var chEls = [], curKey = '', curChars = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildChars(line) {
    var txt = (line && typeof line.text === 'string') ? line.text : '';
    if (!txt) { elLyric.innerHTML = '<span class="roman">—</span>'; chEls = []; return; }
    var chars = Array.isArray(line.chars) ? line.chars : null;
    var out = [], i, ch, t;
    if (chars && chars.length) {
      /* YRC：按字时间点亮；若字数与正文不符，只取能对上的部分，其余跟随句尾 */
      for (i = 0; i < txt.length; i++) {
        ch = txt.charAt(i);
        t = (i < chars.length && chars[i] && isFinite(chars[i].t)) ? Number(chars[i].t) : null;
        out.push('<span class="ch" data-t="' + (t === null ? '' : t.toFixed(2)) + '">' + esc(ch) + '</span>');
      }
    } else {
      var st = Number(line.t) || 0, du = Number(line.dur) || 0;
      if (!(du > 0)) du = Math.max(1.6, txt.length * 0.22);
      for (i = 0; i < txt.length; i++) {
        ch = txt.charAt(i);
        t = st + du * (i / Math.max(1, txt.length));
        out.push('<span class="ch" data-t="' + t.toFixed(2) + '">' + esc(ch) + '</span>');
      }
    }
    elLyric.innerHTML = out.join('');
    chEls = elLyric.getElementsByClassName('ch');
    var last = chEls.length ? Number(chEls[chEls.length - 1].getAttribute('data-t')) : 0;
    curChars = { dur: isFinite(last) ? last : 0 };
  }

  function paintChars(t) {
    var i, v, on;
    for (i = 0; i < chEls.length; i++) {
      v = chEls[i].getAttribute('data-t');
      on = v !== '' && Number(v) <= t;
      if (on !== (chEls[i].className === 'ch on')) {
        chEls[i].className = on ? 'ch on' : 'ch';
      }
    }
  }

  /* 首句预览：init 后 tick 未到时也能看到完整的、已点亮的当前句 */
  function showFirst() {
    if (!ST.lines.length) return;
    showLine(0);
    for (var i = 0; i < chEls.length; i++) chEls[i].className = 'ch on';
    ST.idx = -1; /* 尚未进入任何一句，符合契约 */
    ST.text = (typeof ST.lines[0].text === 'string') ? ST.lines[0].text : '';
  }

  function showLine(i) {
    if (i < 0 || !ST.lines[i]) {
      elLyric.innerHTML = '<span class="roman">· 前奏 ·</span>';
      elLyric.className = '';
      chEls = []; ST.text = ''; return;
    }
    var line = ST.lines[i];
    var key = i + '|' + (line.text || '');
    if (key !== curKey) {
      curKey = key;
      buildChars(line);
      /* 长句自动缩级，保证不溢出 */
      var n = (line.text || '').length;
      elLyric.className = n > 46 ? 'xlong' : (n > 24 ? 'long' : '');
    }
    ST.text = (typeof line.text === 'string') ? line.text : '';
    paintChars(ST.t);
  }

  function setText(txt) {
    txt = (typeof txt === 'string' && txt.length) ? txt : '';
    if (!(ST.idx >= 0)) {
      elLyric.textContent = txt;
      chEls = [];
    }
    ST.text = txt;
  }

  function pickIndex(t) {
    var ls = ST.lines, i;
    if (!ls.length) return -1;
    for (i = ls.length - 1; i >= 0; i--) {
      if (t >= (ls[i].t || 0)) return i;
    }
    return -1;
  }

  function onInit(p) {
    p = p || {};
    var arr = Array.isArray(p.lines) ? p.lines : [];
    ST.lines = arr.filter(function (l) { return l && typeof l === 'object'; }).slice(0, 900);
    ST.playing = (p.playing === undefined) ? true : !!p.playing;
    ST.idx = -1; ST.t = 0; curKey = ''; chEls = []; elLyric.className = '';
    var song = p.song || {};
    var nm = (typeof song.name === 'string') ? song.name : '';
    var ar = song.artists;
    if (Array.isArray(ar)) ar = ar.filter(function (x) { return typeof x === 'string' && x; }).join(' · ');
    if (typeof ar !== 'string') ar = '';
    elMeta.textContent = (nm || ar) ? (nm + (ar ? ' — ' + ar : '')) : '';
    elMeta.style.display = (nm || ar) ? '' : 'none';
    var accent = (p.accent && p.accent.length >= 3) ? p.accent : [58, 143, 224];
    setAccent(Number(accent[0]) || 58, Number(accent[1]) || 143, Number(accent[2]) || 224);

    if (!ST.lines.length) {
      elEmpty.style.display = 'flex';
      elLyric.innerHTML = '<span class="roman">· 无词 ·</span>';
      chEls = []; ST.idx = -1; ST.text = '';
    } else {
      elEmpty.style.display = 'none';
      showFirst();
      ST.idx = -1;
    }
    buildCells();
    pulse(0.7);
  }

  function setAccent(r, g, b) {
    var root = D.documentElement.style;
    root.setProperty('--accent', r + ',' + g + ',' + b);
    root.setProperty('--accent-soft', (r * 0.55 + 60) | 0);
  }

  function onTick(t) {
    var tt = Number(t);
    if (!isFinite(tt)) tt = 0;
    ST.t = tt;
    var i = pickIndex(tt);
    if (i !== ST.idx) {
      ST.idx = i;
      showLine(i);
      pulse(1);
    } else if (i >= 0) {
      paintChars(tt);
    }
  }

  W.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick') {
        var pl = d.payload || {};
        onTick(pl.time);
        if (pl.playing !== undefined) ST.playing = !!pl.playing;
      }
      else if (d.type === 'beat') {
        var bl = (d.payload && isFinite(d.payload.level)) ? Number(d.payload.level) : 0.5;
        pulse(Math.max(0.2, Math.min(1, bl)));
      }
      else if (d.type === 'live') {
        var lv = d.payload || {};
        if (lv.playing !== undefined) ST.playing = !!lv.playing;
        live.bpm = isFinite(lv.bpm) ? Number(lv.bpm) : live.bpm;
        live.level = isFinite(lv.level) ? Number(lv.level) : live.level;
        live.bass = isFinite(lv.bass) ? Number(lv.bass) : live.bass;
        live.mid = isFinite(lv.mid) ? Number(lv.mid) : live.mid;
        live.treble = isFinite(lv.treble) ? Number(lv.treble) : live.treble;
        live.at = now();
      }
    } catch (e) { console.error('[439] message handler', d && d.type, e); }
  }, false);
  var live = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, at: -1e9 };

  function now() { return (W.performance && W.performance.now) ? W.performance.now() : Date.now(); }

  buildCells();

  /* ---------- 自适应：尺寸只在 resize 时算，绝不每帧读布局 ---------- */
  var view = { w: 1440, h: 900, dpr: 1 };
  var lastCols = 0;

  function resize() {
    var w = W.innerWidth, h = W.innerHeight;
    if (!isFinite(w) || w <= 0) w = 1440;
    if (!isFinite(h) || h <= 0) h = 900;
    view.w = w; view.h = h;
    view.dpr = Math.min(2, W.devicePixelRatio || 1);
    var cols = w < 640 ? 3 : (w < 1024 ? 4 : 6);
    if (cols !== lastCols) { lastCols = cols; buildCells(); }
    ST.lite = Math.min(1, Math.max(0.4, w / 1600));
  }

  W.addEventListener('resize', function () {
    try { resize(); } catch (e) { console.error('[439] resize', e); }
  }, false);

  /* 蝴蝶振翅：只在少数格子上做位移，避免每帧全量写入 */
  var wingPhase = 0;

  function frame() {
    var t0 = now();
    try {
      if (!sentReady) ready();
      ST.frames++;
      var dt = 16;
      wingPhase += dt * 0.001;
      if (ST.rm) { pulseAmp *= 0.9; }
      else {
        pulseAmp *= (ST.playing ? 0.9 : 0.96);
        if (pulseAmp < 0.001) pulseAmp = 0;
      }
      /* 频谱呼吸 → 金属光 */
      var lvl = ST.playing ? Math.min(1, live.level * 0.6 + live.bass * 0.4) : 0.12;
      var glowA = 0.32 + lvl * 0.5 + pulseAmp * 0.35;
      if (!ST.rm) {
        elGlow.style.opacity = glowA.toFixed(3);
        var sc = 1 + lvl * 0.05 + pulseAmp * 0.03;
        elGlow.style.transform = 'scale(' + sc.toFixed(3) + ')';
      }
      /* 每 5 帧给两三只闪蝶一个轻微俯仰，像被玻璃后的气流吹动 */
      if (ST.frames % 5 === 0 && CELLS.length) {
        var n = CELLS.length, k;
        for (k = 0; k < 3; k++) {
          var idx = (Math.floor(wingPhase * 9) + k * 7) % n;
          var cell = CELLS[idx];
          if (!cell) continue;
          var wg = cell.querySelector('.wg');
          if (!wg) continue;
          var wob = Math.sin(wingPhase * 2.4 + idx) * (ST.rm ? 0.5 : 2.2);
          var sc = (1 + pulseAmp * 0.014).toFixed(3);
          wg.setAttribute('transform', 'rotate(' + wob.toFixed(2) + ') scale(' + sc + ')');
        }
      }
      if (ST.idx >= 0) paintChars(ST.t);
    } catch (e) {
      console.error('[439] frame', e);
      ST.err = String((e && e.message) || e);
    }
    ST.js = Math.round((now() - t0) * 100) / 100;
    raf(frame);
  }
  resize();
  raf(frame);
  setTimeout(ready, 700);
})();
</script>
</body>
</html>
