<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>潜生纪</title>
<style>
  :root{
    --accent: #b08a5a;
    --ink: #f6ece0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#07050a;}
  body{
    font-family: "Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"STSong",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #cv{position:fixed;left:0;top:0;display:block;}
  .vign{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 42%, rgba(6,4,9,.62) 100%),
      linear-gradient(180deg, rgba(8,6,12,.42) 0%, rgba(8,6,12,0) 22%, rgba(8,6,12,0) 70%, rgba(8,6,12,.55) 100%);
  }
  #lyr{
    position:fixed;left:0;right:0;bottom:0;
    padding:0 6vw 9.5vh;
    display:flex;flex-direction:column;justify-content:flex-end;
    height:100%;
    pointer-events:none;
    z-index:3;
  }
  #cur{
    font-size:clamp(22px,4.1vw,58px);
    line-height:1.42;
    letter-spacing:.02em;
    max-width:min(1180px,90vw);
    text-shadow:0 0 34px rgba(6,4,10,.85), 0 2px 10px rgba(6,4,10,.75);
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  #cur .ln{display:block;}
  #cur .ch{display:inline-block;white-space:pre;transition:color .18s linear,opacity .18s linear;}
  #cur .ch.off{opacity:.52;}
  #cur .ch.on{opacity:1;}
  #cur[data-len="long"]{font-size:clamp(19px,3.1vw,42px);line-height:1.4;}
  #cur[data-len="xl"]{font-size:clamp(16px,2.35vw,32px);line-height:1.38;}
  #nxt{
    margin-top:.62em;
    font-size:clamp(13px,1.55vw,21px);
    line-height:1.5;
    opacity:.42;
    max-width:min(980px,84vw);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-shadow:0 0 18px rgba(6,4,10,.8);
  }
  #empty{
    font-size:clamp(15px,1.9vw,24px);
    letter-spacing:.34em;
    opacity:.5;
    display:none;
  }
  #rule{height:1px;width:100%;max-width:min(1180px,90vw);margin:0 0 .95em;overflow:hidden;}
  #rule i{
    display:block;height:1px;width:0%;
    background:linear-gradient(90deg,rgba(255,240,220,.72),rgba(255,240,220,0));
    box-shadow:0 0 12px rgba(255,232,205,.45);
    transition:width .10s linear;
  }
  #tag{
    position:fixed;left:6vw;top:5.4vh;z-index:3;pointer-events:none;
    font-size:clamp(10px,1.02vw,13px);
    letter-spacing:.42em;
    opacity:.44;
    text-transform:uppercase;
    font-family: ui-monospace,Menlo,Consolas,monospace;
  }
  #tag b{font-weight:400;opacity:.9;}
  @media (max-aspect-ratio:3/4){
    #lyr{padding:0 7vw 12vh;}
    #cur{font-size:clamp(20px,6.4vw,40px);line-height:1.5;}
    #nxt{font-size:clamp(12px,3.3vw,17px);}
    #tag{top:4vh;letter-spacing:.3em;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vign"></div>
<div id="tag"><b>503</b> &nbsp;/&nbsp; latent morph</div>
<div id="lyr">
  <div id="empty">—— 无 词 之 处 ——</div>
  <div id="rule"><i></i></div>
  <div id="cur"></div>
  <div id="nxt"></div>
</div>
<script>
(function(){
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', {alpha:false});
  var elCur = document.getElementById('cur');
  var elNxt = document.getElementById('nxt');
  var elEmpty = document.getElementById('empty');
  var elRule = document.querySelector('#rule i');
  var lastProg = -1;

  var W = 1440, H = 900, DPR = 1;
  var lines = [], idx = -1, t = 0, playing = true;
  var frames = 0, jsMs = 0, errMsg = '', reduced = false;
  var accent = [176,138,90];
  var readySent = false;
  var lineEls = [], curLineObj = null;

  try{
    reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }catch(e){ console.error('[503] rm probe', e); }

  function clamp(n,a,b){ n = +n; if(!isFinite(n)) n = a; return n<a?a:(n>b?b:n); }

  function resize(){
    var w = window.innerWidth || 1440, h = window.innerHeight || 900;
    if(!isFinite(w) || w < 2) w = 1440;
    if(!isFinite(h) || h < 2) h = 900;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    cv.width = Math.max(2, Math.round(w * DPR));
    cv.height = Math.max(2, Math.round(h * DPR));
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
  }

  // ---------- 歌词 ----------
  function clearLyrics(){
    curLineObj = null;
    lineEls = [];
    elCur.textContent = '';
    elNxt.textContent = '';
  }

  function setIdx(i){
    if(i === idx) return;
    idx = i;
    var L = lines[i];
    elCur.textContent = '';
    lineEls = [];
    if(!L){ curLineObj = null; }
    else{
      curLineObj = L;
      var s = (typeof L.text === 'string') ? L.text : '';
      var n = Math.min(s.length, 260);
      var f = document.createDocumentFragment();
      for(var k=0;k<n;k++){
        var sp = document.createElement('span');
        sp.className = 'ch off';
        sp.textContent = s.charAt(k) === ' ' ? '\u00a0' : s.charAt(k);
        f.appendChild(sp);
        lineEls.push(sp);
      }
      elCur.appendChild(f);
      // 只有字数组与正文对得上时才用 YRC，否则退回按句均分
      if(L.chars && L.chars.length && L.chars.length !== n) curLineObj = {t:L.t, dur:L.dur, text:L.text, chars:null};
    }
    var nx = lines[i+1];
    elNxt.textContent = nx && typeof nx.text === 'string' ? nx.text : '';
    var tlen = L && typeof L.text === 'string' ? L.text.length : 0;
    elCur.setAttribute('data-len', tlen > 46 ? 'xl' : (tlen > 26 ? 'long' : ''));
    elEmpty.style.display = lines.length ? 'none' : 'block';
    if(elRule && (!lines.length || i < 0)){ lastProg = 0; elRule.style.width = '0%'; }
  }

  function updateLyric(tt){
    var n = lines.length;
    if(!n) return;
    var i = -1, lo = 0, hi = n-1;
    while(lo <= hi){
      var mid = (lo+hi)>>1;
      if(lines[mid].t <= tt){ i = mid; lo = mid+1; } else hi = mid-1;
    }
    setIdx(i);
    if(!curLineObj) return;
    var cs = curLineObj.chars;
    var nc = lineEls.length;
    if(!nc) return;
    var colLit = pal.bone, colOff = null;
    var litStyle = 'rgb(' + Math.round(pal.bone[0]) + ',' + Math.round(pal.bone[1]) + ',' + Math.round(pal.bone[2]) + ')';
    var k, on, e, ci = -1;

    if(cs && cs.length){
      // YRC：逐字
      for(k=0;k<nc;k++){
        on = !!(cs[k] && typeof cs[k].t === 'number' && cs[k].t <= tt + 0.02);
        e = lineEls[k];
        if(!e) continue;
        var cl = on ? 'ch on' : 'ch off';
        if(e.className !== cl) e.className = cl;
        if(on) ci = k;
      }
    } else {
      // LRC：按比例点亮（不伪造时间，只用句子开始 + 已知 dur，缺 dur 就按字数估）
      var start = curLineObj.t, end;
      var nxtL = lines[idx+1];
      if(curLineObj.dur > 0.25) end = start + curLineObj.dur;
      else if(nxtL) end = nxtL.t;
      else end = start + Math.max(2.4, nc * 0.22);
      if(end - start < 0.3) end = start + 0.3;
      var prog = clamp((tt - start) / (end - start), 0, 1);
      var upto = Math.floor(prog * nc + 0.0001);
      for(k=0;k<nc;k++){
        on = k < upto;
        e = lineEls[k];
        if(!e) continue;
        var cl2 = on ? 'ch on' : 'ch off';
        if(e.className !== cl2) e.className = cl2;
        if(on) ci = k;
      }
    }

    // 只给当前字与相邻两个字上色，避免每帧洗 200 个节点的 style
    var lo = Math.max(0, ci-1), hi = Math.min(nc-1, ci+1);
    for(k=0;k<nc;k++){
      var need = (k>=lo && k<=hi && ci>=0) ? litStyle : '';
      var el = lineEls[k];
      if(el && need && el.style.color !== need) el.style.color = need;
    }
    for(k=0;k<nc;k++){
      if(k>=lo && k<=hi && ci>=0) continue;
      var e3 = lineEls[k];
      if(e3 && e3.style.color) e3.style.color = '';
    }

    // 进度细线：把"这句已经唱到哪"用一条光带标出来
    if(elRule){
      var pc = nc > 0 ? (Math.max(0, ci) + 1) / nc : 0;
      pc = Math.round(pc * 100);
      if(pc !== lastProg){ lastProg = pc; elRule.style.width = pc + '%'; }
    }
  }

  // ---------- 调色 & 素材 ----------
  var TAU = Math.PI * 2;
  var BASE = [176,138,90];
  var pal = { bone:[236,222,201], warm:[220,182,140], deep:[42,28,44], dark:[20,14,26], glow:[255,232,205] };

  function mixc(a,b,k){
    return [ Math.round(a[0]+(b[0]-a[0])*k), Math.round(a[1]+(b[1]-a[1])*k), Math.round(a[2]+(b[2]-a[2])*k) ];
  }
  function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

  function buildPalette(){
    var b = (accent && accent.length>=3) ? accent : BASE;
    pal.bone = mixc([244,233,216], b, 0.30);
    pal.warm = mixc(b, [255,243,226], 0.34);
    pal.deep = mixc(b, [38,24,40], 0.62);
    pal.dark = mixc(b, [14,9,18], 0.80);
    pal.glow = mixc(b, [255,236,210], 0.46);
    buildSprites();
    buildBack();
    buildGrain();
  }

  function sprite(size, inner, outer){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    g.addColorStop(0, inner);
    g.addColorStop(0.45, outer);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(0,0,size,size);
    return c;
  }

  var sprSoft=null, sprHard=null, sprGrain=null, grainPat=null, scanPat=null, sprShape=null;

  function buildSprites(){
    sprSoft = sprite(128, rgba(pal.glow,.55), rgba(pal.warm,.16));
    sprHard = sprite(128, rgba(pal.bone,.95), rgba(pal.warm,.30));
    // 眼球：柔和椭圆感的高亮
    var e = document.createElement('canvas'); e.width = 96; e.height = 64;
    var ex = e.getContext('2d');
    var eg = ex.createRadialGradient(48,32,0,48,32,44);
    eg.addColorStop(0,'rgba(255,248,236,.80)');
    eg.addColorStop(.34,'rgba(250,228,200,.34)');
    eg.addColorStop(1,'rgba(0,0,0,0)');
    ex.save(); ex.translate(48,32); ex.scale(1,0.62); ex.translate(-48,-32);
    ex.fillStyle = eg; ex.fillRect(0,0,96,64); ex.restore();
    sprEye = e;
  }
  var sprEye = null;

  function buildGrain(){
    var n = 128;
    var c = document.createElement('canvas'); c.width = c.height = n;
    var cx = c.getContext('2d');
    var img = cx.createImageData(n,n);
    var d = img.data;
    var seed = 1337;
    for(var i=0;i<n*n;i++){
      seed = (seed*1103515245 + 12345) & 0x7fffffff;
      var v = seed / 0x7fffffff;
      var k = (v*255)|0;
      d[i*4] = k; d[i*4+1] = k; d[i*4+2] = k;
      d[i*4+3] = (v > 0.52) ? 30 : 12;
    }
    cx.putImageData(img,0,0);
    sprGrain = c;
    try{
      grainPat = ctx.createPattern(c,'repeat');
      var sc = document.createElement('canvas'); sc.width = 1; sc.height = 4;
      var sx = sc.getContext('2d');
      sx.fillStyle = 'rgba(6,4,10,.30)'; sx.fillRect(0,0,1,1);
      sx.fillStyle = 'rgba(6,4,10,.10)'; sx.fillRect(0,2,1,1);
      scanPat = ctx.createPattern(sc,'repeat');
    }catch(e){ console.error('[503] pattern', e); }
  }

  // ---------- 背景缓存 ----------
  var backCv = document.createElement('canvas');
  var backCtx = null;

  function buildBack(){
    try{
      var bw = Math.max(2, cv.width), bh = Math.max(2, cv.height);
      backCv.width = bw; backCv.height = bh;
      var x = backCv.getContext('2d');
      backCtx = x;
      x.setTransform(DPR,0,0,DPR,0,0);
      x.clearRect(0,0,W,H);
      var g = x.createLinearGradient(0,0,W*0.25,H);
      g.addColorStop(0, rgba(mixc(pal.dark,[40,26,52],.55), 1));
      g.addColorStop(0.42, rgba(pal.dark,1));
      g.addColorStop(1, '#06040a');
      x.fillStyle = g; x.fillRect(0,0,W,H);

      // 远景块：暖冷交错的云状色块（像油画底层）
      x.globalCompositeOperation = 'lighter';
      var spots = [
        [0.24,0.22,0.72,pal.deep,0.55],
        [0.78,0.32,0.62,pal.warm,0.17],
        [0.52,0.14,0.55,pal.glow,0.14],
        [0.12,0.74,0.70,mixc(pal.deep,[10,6,16],.4),0.5],
        [0.86,0.80,0.55,pal.warm,0.12]
      ];
      for(var i=0;i<spots.length;i++){
        var s = spots[i];
        var w = W*s[2], h = w*0.9;
        x.globalAlpha = s[4];
        x.drawImage(sprSoft, W*s[0]-w/2, H*s[1]-h/2, w, h);
      }
      x.globalAlpha = 1;
      x.globalCompositeOperation = 'source-over';

      // 细碎裂痕纹理
      if(scanPat){ x.fillStyle = scanPat; x.globalAlpha = .5; x.fillRect(0,0,W,H); x.globalAlpha = 1; }
    }catch(e){ console.error('[503] backdrop', e); }
  }

  // ---------- 节点场 ----------
  var nodes = [], NN = 0, LINK = 140;

  function buildNodes(){
    var want = Math.round(clamp((W*H)/16000, 46, 104));
    NN = want;
    nodes = [];
    var seed = 90210;
    function rnd(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }
    for(var i=0;i<NN;i++){
      nodes.push({
        x: rnd()*W, y: rnd()*H,
        vx: (rnd()-.5)*0.10, vy: (rnd()-.5)*0.10,
        r: 0.7 + rnd()*1.5,
        p: rnd()*TAU, s: 0.4 + rnd()*1.1,
        kind: (rnd() > .72) ? 1 : 0
      });
    }
  }

  // ---------- 形变体 ----------
  var shape = { ph:[0,1.7,3.1,4.9], seg: 84, rot: 0, morph: 0 };
  var branch = [];

  function buildBranch(){
    branch = [];
    var segs = 34;
    var seed = 4242;
    function rnd(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }
    var px = 0, py = 0, ang = -Math.PI*0.5, len = 0.30;
    for(var i=0;i<segs;i++){
      var nx = px + Math.cos(ang)*len, ny = py + Math.sin(ang)*len;
      branch.push([px,py,nx,ny, 1 - i/segs]);
      px = nx; py = ny;
      ang += (rnd()-0.48)*0.62;
      len *= 0.955;
      if(i % 6 === 5){ px += (rnd()-.5)*0.05; py += (rnd()-.5)*0.05; }
    }
  }

  function shapeRadius(th, tt){
    return 1
      + 0.150*Math.sin(3*th + shape.ph[0] + tt*0.31)
      + 0.102*Math.sin(5*th - shape.ph[1] + tt*0.22)
      + 0.066*Math.sin(8*th + shape.ph[2] - tt*0.17)
      + 0.040*Math.sin(13*th - shape.ph[3] + tt*0.29)
      + 0.022*Math.sin(21*th + tt*0.13);
  }

  var beatGlow = 0, beatEnv = 0, liveLvl = 0, bassLvl = 0, trebLvl = 0, bpmVal = 0;
  var glitchAt = 0, glitchDur = 0, glitchX = 0;

  function drawForm(tt, cx, cy, rad, alphaMul){
    var seg = shape.seg;
    var m = 1 + beatEnv*0.055;
    var rx = rad*1.06*m, ry = rad*1.22*m;
    var i, th, rr, x, y;

    // 外圈光晕
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (0.10 + beatGlow*0.16) * alphaMul;
    var gw = rad*4.4;
    ctx.drawImage(sprSoft, cx-gw/2, cy-gw/2, gw, gw);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // 轮廓
    ctx.beginPath();
    for(i=0;i<=seg;i++){
      th = i/seg*TAU;
      rr = shapeRadius(th, tt);
      x = cx + Math.cos(th)*rx*rr;
      y = cy + Math.sin(th)*ry*rr;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();

    var g = ctx.createLinearGradient(cx-rx, cy-ry, cx+rx*0.55, cy+ry);
    g.addColorStop(0, rgba(mixc(pal.bone,[255,255,255],.24), 0.94*alphaMul));
    g.addColorStop(0.26, rgba(pal.bone, 0.90*alphaMul));
    g.addColorStop(0.55, rgba(pal.warm, 0.86*alphaMul));
    g.addColorStop(0.80, rgba(pal.deep, 0.90*alphaMul));
    g.addColorStop(1, rgba(pal.dark, 0.96*alphaMul));
    ctx.fillStyle = g;
    ctx.fill();

    // 内部切片：制造 GAN 混合的带状错位
    ctx.save();
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    var bands = 9;
    for(i=0;i<bands;i++){
      var fy = cy - ry + (i/bands)*ry*2;
      var wob = Math.sin(tt*0.5 + i*1.7)*rx*0.10;
      var hgt = (ry*2/bands)*0.72;
      var bg = ctx.createLinearGradient(cx-rx, fy, cx+rx, fy+hgt);
      var a = 0.030 + 0.028*Math.abs(Math.sin(tt*0.37 + i*1.1));
      bg.addColorStop(0, rgba(pal.glow, a));
      bg.addColorStop(0.5, rgba(mixc(pal.bone,[255,250,240],.3), a*0.7));
      bg.addColorStop(1, rgba(pal.warm, a*0.4));
      ctx.fillStyle = bg;
      ctx.fillRect(cx-rx+wob, fy, rx*2, hgt);
    }
    // 珊瑚/骨骼的放射脉
    ctx.globalAlpha = 0.20 + beatGlow*0.18;
    ctx.strokeStyle = rgba(pal.bone, .55);
    ctx.lineWidth = 1.1;
    for(i=0;i<7;i++){
      var a0 = (i/7)*TAU + tt*0.07;
      ctx.beginPath();
      ctx.moveTo(cx, cy + ry*0.10);
      var rEnd = 0.94;
      ctx.quadraticCurveTo(
        cx + Math.cos(a0)*rx*0.45, cy + Math.sin(a0)*ry*0.42,
        cx + Math.cos(a0 + Math.sin(tt*0.6+i)*0.14)*rx*rEnd,
        cy + Math.sin(a0 + Math.sin(tt*0.6+i)*0.14)*ry*rEnd*0.98
      );
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 分层等高线（像油画笔触的沉积层）
    ctx.globalCompositeOperation = 'source-over';
    for(i=1;i<=3;i++){
      var k = 1 - i*0.17;
      var off = Math.sin(tt*(0.20+i*0.06) + i*2.1)*0.045;
      ctx.beginPath();
      for(var j=0;j<=seg;j++){
        th = j/seg*TAU;
        rr = shapeRadius(th, tt)*k + off*Math.sin(th*4 + tt*0.4);
        x = cx + Math.cos(th)*rx*rr;
        y = cy + Math.sin(th)*ry*rr;
        if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = (i===1) ? rgba(mixc(pal.bone,[255,252,244],.3), .30) : rgba(pal.dark, .22);
      ctx.lineWidth = (i===1) ? 1.4 : 1;
      ctx.stroke();
    }

    // 人脸暗示：两眼 + 一道面具缝（极低透明度，似是而非）
    var eyeY = cy - ry*0.20;
    var eyeAl = (0.16 + 0.05*Math.sin(tt*0.6)) * alphaMul;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = eyeAl;
    var ew = rx*0.42, eh = ry*0.20;
    if(sprEye){
      ctx.drawImage(sprEye, cx - rx*0.50 - ew/2, eyeY - eh/2, ew, eh);
      ctx.drawImage(sprEye, cx + rx*0.50 - ew/2, eyeY - eh*0.86/2 + ry*0.02, ew*0.94, eh*0.86);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    ctx.beginPath();
    ctx.moveTo(cx + rx*0.02, cy - ry*0.52);
    ctx.bezierCurveTo(cx - rx*0.10, cy - ry*0.10, cx + rx*0.12, cy + ry*0.26, cx + rx*0.01, cy + ry*0.56);
    ctx.strokeStyle = rgba(pal.dark, 0.34*alphaMul);
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // 骨骼枝：从形变体右下生长出去
    ctx.save();
    ctx.translate(cx + rx*0.34, cy + ry*0.52);
    ctx.rotate(Math.sin(tt*0.12)*0.22 - 0.55);
    ctx.scale(rx*1.05, ry*1.05);
    ctx.lineCap = 'round';
    for(i=0;i<branch.length;i++){
      var sg = branch[i];
      ctx.beginPath();
      ctx.moveTo(sg[0], sg[1]);
      ctx.lineTo(sg[2], sg[3]);
      ctx.strokeStyle = rgba(pal.bone, 0.05 + sg[4]*0.16);
      ctx.lineWidth = 0.004 + sg[4]*0.010;
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- 潜空间栅格 ----------
  function drawLattice(tt, cx, cy, rad){
    var seg = 48, rings = 9, spokes = 18, i, j, th, x, y;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(pal.warm, .30);
    ctx.lineWidth = 0.75;
    for(i=1;i<=rings;i++){
      var k = i/rings;
      var rr = rad * (0.55 + k*1.55);
      ctx.globalAlpha = 0.045 + 0.035*(1-k) + bassLvl*0.02;
      ctx.beginPath();
      for(j=0;j<=seg;j++){
        th = j/seg*TAU;
        var w = shapeRadius(th, tt*0.55 + i*0.3);
        x = cx + Math.cos(th)*rr*w*1.12;
        y = cy + Math.sin(th)*rr*w*1.28;
        if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.05 + trebLvl*0.03;
    for(i=0;i<spokes;i++){
      th = i/spokes*TAU + tt*0.05;
      var w2 = shapeRadius(th, tt*0.55);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(th)*rad*0.5*w2, cy + Math.sin(th)*rad*0.56*w2);
      ctx.lineTo(cx + Math.cos(th)*rad*2.1*w2*1.12, cy + Math.sin(th)*rad*2.1*w2*1.28);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 卫星体：主形变体旁边正在成形/瓦解的小块 ----------
  var sats = [];
  function buildSats(){
    sats = [];
    var seed = 777;
    function rnd(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }
    var n = 4;
    for(var i=0;i<n;i++){
      sats.push({
        a: rnd()*TAU,
        sp: (0.045 + rnd()*0.065) * (rnd() > .5 ? 1 : -1),
        rx: 1.35 + rnd()*0.75,
        ry: 0.55 + rnd()*0.45,
        sc: 0.10 + rnd()*0.12,
        ph: rnd()*TAU,
        tilt: (rnd()-0.5)*0.35
      });
    }
  }

  function drawSat(s, tt, cx, cy, rad){
    var a = s.a + tt*s.sp;
    var px = cx + Math.cos(a)*rad*s.rx;
    var py = cy + Math.sin(a)*rad*s.ry;
    var r = rad*s.sc*(0.86 + 0.16*Math.sin(tt*0.9 + s.ph)) * (1 + beatEnv*0.10);
    if(r < 0.5) return;
    var seg = 34, i, th, x, y;
    ctx.beginPath();
    for(i=0;i<=seg;i++){
      th = i/seg*TAU;
      var rr = 1 + 0.26*Math.sin(3*th + tt*0.7 + s.ph) + 0.16*Math.sin(5*th - tt*0.5) + 0.09*Math.sin(9*th + s.ph*2);
      x = px + Math.cos(th)*r*rr*1.12;
      y = py + Math.sin(th)*r*rr*0.94;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    var g = ctx.createLinearGradient(px-r, py-r, px+r, py+r);
    g.addColorStop(0, rgba(pal.bone, .72));
    g.addColorStop(0.55, rgba(pal.warm, .58));
    g.addColorStop(1, rgba(pal.deep, .74));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30;
    var gw = r*5;
    ctx.drawImage(sprSoft, px-gw/2, py-gw/2, gw, gw);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = rgba(pal.bone, .18);
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }

  // ---------- 节点场绘制 ----------
  var nodeT = 0;
  function drawNodes(dt, tt){
    var spawn = Math.min(nodes.length, NN);
    var step = dt * 0.06;
    ctx.globalCompositeOperation = 'lighter';
    for(var i=0;i<spawn;i++){
      var n = nodes[i];
      if(!n) continue;
      n.p += 0.014*n.s*step;
      n.x += n.vx*step + Math.sin(tt*0.32 + n.p)*0.20;
      n.y += n.vy*step + Math.cos(tt*0.27 + n.p*1.3)*0.20;
      if(n.x < -30) n.x = W+30; else if(n.x > W+30) n.x = -30;
      if(n.y < -30) n.y = H+30; else if(n.y > H+30) n.y = -30;
    }
    // 连线：只查右侧若干项，把 O(n²) 压成可控
    ctx.lineWidth = 0.7;
    for(var a=0;a<spawn;a++){
      var na = nodes[a];
      if(!na) continue;
      for(var b=a+1;b<spawn && b<a+5;b++){
        var nb = nodes[b];
        if(!nb) continue;
        var dx = nb.x-na.x, dy = nb.y-na.y;
        var d2 = dx*dx + dy*dy;
        if(d2 > LINK*LINK || d2 < 1) continue;
        var al = (1 - Math.sqrt(d2)/LINK);
        ctx.strokeStyle = rgba(pal.warm, 0.028 + al*0.085);
        ctx.beginPath();
        ctx.moveTo(na.x, na.y);
        ctx.lineTo(nb.x, nb.y);
        ctx.stroke();
      }
    }
    for(var k=0;k<spawn;k++){
      var q = nodes[k];
      if(!q) continue;
      var pulse = 0.5 + 0.5*Math.sin(tt*0.9*q.s + q.p);
      var s = (q.kind ? 22 : 12) * (0.7 + pulse*0.7) * (1 + beatGlow*0.5);
      ctx.globalAlpha = (q.kind ? 0.42 : 0.26) * (0.5 + pulse*0.7);
      ctx.drawImage(q.kind ? sprHard : sprSoft, q.x-s/2, q.y-s/2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 主绘制 ----------
  function draw(dt, tt){
    var w = cv.width, h = cv.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // 背景（缓存）
    if(backCtx){
      try{ ctx.drawImage(backCv, 0, 0); }
      catch(e){ ctx.fillStyle = rgba(pal.dark,1); ctx.fillRect(0,0,w,h); }
    } else {
      ctx.fillStyle = rgba(pal.dark,1); ctx.fillRect(0,0,w,h);
    }

    ctx.setTransform(DPR,0,0,DPR,0,0);

    drawNodes(dt, tt);

    // 形变体：横向跟随频谱轻微漂移
    var cx = W*0.5 + Math.sin(tt*0.19)*W*0.035 + (liveLvl-0.4)*W*0.012;
    var cy = H*0.415 + Math.cos(tt*0.16)*H*0.022;    var rad = Math.min(W,H) * (0.255 + bassLvl*0.030 + beatEnv*0.012);
    rad = Math.max(rad, Math.min(W,H)*0.16);

    drawForm(tt, cx, cy, rad, reduced ? 0.92 : 1);
    drawLattice(tt, cx, cy, rad);
    for(var si=0;si<sats.length;si++){ if(sats[si]) drawSat(sats[si], tt, cx, cy, rad); }

    // 边缘残影：把形变体轮廓外扩一圈，做"生成未收敛"的重影
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.06 + 0.05*Math.sin(tt*1.7) + trebLvl*0.05;
    var ringR = rad*1.30;
    ctx.beginPath();
    for(var i=0;i<=40;i++){
      var th = i/40*TAU;
      var rr = shapeRadius(th, tt*0.8)*ringR;
      var x = cx + Math.cos(th)*rr*1.08, y = cy + Math.sin(th)*rr*1.24;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = rgba(pal.glow, .75);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // 偶发的潜空间错位（每 ~4s 一次，短促）
    if(glitchDur > 0){
      glitchDur -= dt;
      var gx = glitchX, gy = Math.max(0, cy - rad*1.15), gh = rad*2.3;
      if(gh > 1 && w > 4){
        try{
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.22;
          ctx.drawImage(cv, 0, gy*DPR, w, gh*DPR, gx, gy, w, gh);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }catch(e){ console.error('[503] glitch', e); }
      }
      if(glitchDur <= 0) glitchDur = 0;
    } else if(!reduced && Math.random() < 0.0035){
      glitchAt = tt; glitchDur = 90 + Math.random()*90; glitchX = (Math.random()-0.5)*W*0.06;
    }

    // 冷色/暖色底光，压住画面下三分之一（保证歌词可读）
    ctx.globalCompositeOperation = 'source-over';
    var vg = ctx.createLinearGradient(0, H*0.55, 0, H);
    vg.addColorStop(0, 'rgba(7,5,11,0)');
    vg.addColorStop(1, 'rgba(7,5,11,0.72)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, H*0.55, W, H*0.45);

    // 胶片颗粒
    if(grainPat){
      ctx.globalAlpha = reduced ? 0.05 : 0.09;
      ctx.fillStyle = grainPat;
      var ox = (frames*7) % 128, oy = (frames*11) % 128;
      ctx.save();
      ctx.translate(-ox, -oy);
      ctx.fillRect(0, 0, W+128, H+128);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  var last = 0, vis = 0;
  function loop(now){
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    try{
      if(!last) last = now;
      var dt = Math.min(64, Math.max(0, now - last));
      last = now;
      frames++;
      vis += (dt/1000) * (playing ? 1 : 0.42) * (reduced ? 0.35 : 1);
      beatEnv *= Math.exp(-dt/150);
      if(beatEnv < 0.0015) beatEnv = 0;
      beatGlow = beatEnv;
      draw(dt, vis);
    }catch(e){ errMsg = String(e && e.message || e); console.error('[503] frame', e); }
    var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
    jsMs = t1 - t0;
    requestAnimationFrame(loop);
  }

  function sendReady(){
    if(readySent) return;
    readySent = true;
    try { parent.postMessage({__c100:1,type:'ready'},'*'); } catch(e){ console.error('[503] ready', e); }
  }

  window.__stage = function(){
    var L = lines[idx];
    return {
      lines: lines.length,
      idx: idx,
      t: t,
      playing: playing,
      frames: frames,
      js: jsMs,
      err: errMsg,
      text: L && typeof L.text === 'string' ? L.text : '',
      gl: false,
      rm: reduced
    };
  };

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || d.__c100 !== 1) return;
    try{
      if(d.type === 'init'){
        var p = d.payload || {};
        var ls = Array.isArray(p.lines) ? p.lines : [];
        lines = [];
        for(var i=0;i<ls.length && i<4000;i++){
          var o = ls[i]; if(!o) continue;
          var tt = +o.t; if(!isFinite(tt)) tt = 0;
          lines.push({t:tt, dur:+o.dur||0, text:(typeof o.text === 'string')?o.text:'', chars:(o.chars && o.chars.length)?o.chars:null});
        }
        lines.sort(function(a,b){ return a.t-b.t; });
        if(Array.isArray(p.accent) && p.accent.length >= 3){
          accent = [clamp(p.accent[0],0,255), clamp(p.accent[1],0,255), clamp(p.accent[2],0,255)];
        }
        idx = -2; setIdx(-1);
        playing = (p.playing === false) ? false : true;
        buildPalette();
        buildNodes();
        buildBranch();
        buildSats();
        if(p.duration > 0) shape.rot = 0;
      } else if(d.type === 'tick'){
        var q = d.payload || {};
        var tm = +q.time; if(isFinite(tm)) t = tm;
        if(typeof q.playing === 'boolean') playing = q.playing;
        updateLyric(t);
      } else if(d.type === 'beat'){
        var bp = d.payload || {};
        var lv = +bp.level;
        beatEnv = Math.min(1.4, Math.max(beatEnv, isFinite(lv) ? lv : 0.5));
      } else if(d.type === 'live'){
        var lp = d.payload || {};
        var v;
        v = +lp.level;  if(isFinite(v)) liveLvl = clamp(v,0,1);
        v = +lp.bass;   if(isFinite(v)) bassLvl = clamp(v,0,1);
        v = +lp.treble; if(isFinite(v)) trebLvl = clamp(v,0,1);
        v = +lp.bpm;    if(isFinite(v) && v > 0) bpmVal = v;
        if(typeof lp.playing === 'boolean') playing = lp.playing;
      }
    }catch(e){ errMsg = String(e && e.message || e); console.error('[503] msg', d && d.type, e); }
  });

  try{ resize(); if(!backCtx) buildPalette(); buildSats(); }catch(e){ console.error('[503] palette boot', e); }

  resize();
  window.addEventListener('resize', function(){
    try{ resize(); buildPalette(); buildNodes(); buildSats(); }catch(e){ console.error('[503] resize', e); }
  });

  requestAnimationFrame(function(now){
    sendReady();
    loop(now);
  });
  setTimeout(sendReady, 380);
  // 兜底：首帧前 resize 若拿到 0 尺寸，这里再校正一次
  setTimeout(function(){
    try{ if(W < 4 || H < 4){ resize(); buildPalette(); buildNodes(); } }catch(e){ console.error('[503] relayout', e); }
  }, 260);

  window.addEventListener('error', function(e){
    errMsg = String(e && e.message || 'error');
    console.error('[503] window error', e && e.message);
  });
})();
</script>
</body>
</html>
