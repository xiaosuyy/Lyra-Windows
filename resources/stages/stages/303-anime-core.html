<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>303 — ANIME CORE / PHANTOM</title>
<style>
  html,body{margin:0;height:100%;background:#060509;overflow:hidden}
  body{-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;background:#e9e3d7;color:#14110f;
    font-family:"PingFang SC","Hiragino Sans GB","Songti SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    overflow:hidden;user-select:none;--accent:#e040a0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .scan{position:absolute;inset:0;pointer-events:none;z-index:6;
    background:repeating-linear-gradient(to bottom,rgba(18,14,10,.05) 0 1px,rgba(0,0,0,0) 1px 3px);
    mix-blend-mode:multiply;opacity:.75}
  .vig{position:absolute;inset:0;pointer-events:none;z-index:7;
    background:radial-gradient(120% 100% at 50% 45%,rgba(0,0,0,0) 52%,rgba(30,22,14,.16) 100%),
               linear-gradient(to bottom,rgba(255,255,255,.16),rgba(255,255,255,0) 28%)}
  .lyr{position:absolute;z-index:5;pointer-events:none;left:0;top:0;
    display:flex;flex-direction:column;justify-content:center;
    color:#14110f;will-change:transform}
  .lyr .prev,.lyr .nxt{font-size:.42em;line-height:1.38;opacity:.38;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    transition:opacity .3s linear}
  .lyr .cur{font-size:1em;font-weight:600;line-height:1.28;letter-spacing:.015em;margin:.18em 0 .2em;
    word-break:break-word;overflow-wrap:anywhere}
  .lyr .cur .ch{opacity:.2;filter:blur(.45px);display:inline;
    transition:opacity .14s linear,filter .14s linear,background-size .18s linear;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
    background-image:linear-gradient(transparent 84%,var(--hl,hsla(320,80%,60%,.42)) 84%,var(--hl,hsla(320,80%,60%,.42)) 96%,transparent 96%);
    background-repeat:no-repeat;background-size:0% 100%}
  .lyr .cur .ch.on{opacity:1;filter:none;background-size:100% 100%}
  .empty{position:absolute;z-index:5;pointer-events:none;display:none;
    color:#14110f;text-align:left;border-top:1px solid rgba(20,17,15,.3);padding-top:.2em}
  .empty .big{font-size:clamp(18px,3.4vw,50px);font-weight:700;letter-spacing:.01em;line-height:1.22;
    overflow-wrap:anywhere;margin-top:.34em}
  .empty .big:before{content:'';display:inline-block;width:.3em;height:.3em;background:var(--accent,#e040a0);
    margin-right:.44em;vertical-align:.02em}
  .empty .sub{margin-top:.9em;font:500 clamp(8px,1.05vw,12px)/1.5 ui-monospace,Consolas,"Courier New",monospace;
    letter-spacing:.26em;opacity:.5;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="lyric stage">
  <canvas id="cv"></canvas>
  <div class="lyr" id="lyr">
    <div class="prev" id="lprev"></div>
    <div class="cur" id="lcur"></div>
    <div class="nxt" id="lnxt"></div>
  </div>
  <div class="empty" id="empty">
    <div class="big" id="etitle"></div>
    <div class="sub" id="esub">instrumental &nbsp;/&nbsp; no lyrics</div>
  </div>
  <div class="vig"></div>
  <div class="scan"></div>
</div>
<script>
(function(){
'use strict';
var root = document.getElementById('stage');
var S = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
  gl: false, rm: false, accent: [224,64,160], duration: 0, song: null,
  beat: 0, beatLevel: 0, live: { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0 }
};
var readySent = false, gotTick = false, raf = 0, lastTs = 0;
var coverUrl = null, coverState = 'none', lastVisualSig = '';
var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
S.rm = !!(mq && mq.matches);
if (mq && mq.addEventListener) mq.addEventListener('change', function(e){ S.rm = e.matches; });
else if (mq && mq.addListener) mq.addListener(function(e){ S.rm = e.matches; });

function post(msg){ try { parent.postMessage(msg, '*'); } catch (e) {} }
function ready(){ if (readySent) return; readySent = true; post({ __c100: 1, type: 'ready' }); }

/* ================= canvas / paper ================= */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { alpha: false });
var V = { w: 0, h: 0, dpr: 1, portrait: false };
var G = { pad: 0, seam: 0, bandTop: 0, bandH: 0, bandL: 0, bandR: 0, darkL: 0, darkR: 0 };
var PAPER = '#e9e3d7', INK = '#14110f', COLD = '#1a2438';
var grainPat = null, dotPat = null, grainTile = null;

function accentCss(a){
  var c = S.accent;
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a == null ? 1 : a) + ')';
}
/* accent pushed toward white when it is too dark to read on the dark plate */
function accentForDark(a){
  var c = S.accent;
  var l = (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114);
  var t = Math.max(0, Math.min(0.82, (124 - l) / 124));
  var r = Math.round(c[0] + (247 - c[0]) * t),
      g2 = Math.round(c[1] + (241 - c[1]) * t),
      b = Math.round(c[2] + (235 - c[2]) * t);
  return 'rgba(' + r + ',' + g2 + ',' + b + ',' + (a == null ? 1 : a) + ')';
}
function accentMix(a, base){ /* accent over base colour */
  var c = S.accent, b = base || [20,17,14];
  return 'rgb(' + Math.round(b[0]+(c[0]-b[0])*a) + ',' + Math.round(b[1]+(c[1]-b[1])*a) + ',' + Math.round(b[2]+(c[2]-b[2])*a) + ')';
}

function makeGrain(){
  var n = 160, c = document.createElement('canvas');
  c.width = c.height = n;
  var g = c.getContext('2d'), img = g.createImageData(n, n), d = img.data;
  for (var i = 0; i < n * n; i++){
    var v = Math.random(), a = 0;
    if (v > 0.62) a = (v - 0.62) * 210;
    d[i*4] = 24; d[i*4+1] = 19; d[i*4+2] = 14; d[i*4+3] = a | 0;
  }
  g.putImageData(img, 0, 0);
  grainTile = c;
  grainPat = ctx.createPattern(c, 'repeat');
}
function dotPattern(g, size, rad, alpha){
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var x = c.getContext('2d');
  x.fillStyle = 'rgba(22,17,13,' + alpha + ')';
  x.beginPath(); x.arc(size / 2, size / 2, rad, 0, 6.2832); x.fill();
  return g.createPattern(c, 'repeat');
}

/* accent that stays legible when printed on the pale paper */
function accentForPaper(a){
  var c = S.accent;
  var l = (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114);
  var t = Math.max(0, Math.min(0.72, (l - 176) / 96));
  var r = Math.round(c[0] * (1 - t) + 34 * t),
      g2 = Math.round(c[1] * (1 - t) + 26 * t),
      b = Math.round(c[2] * (1 - t) + 22 * t);
  return 'rgba(' + r + ',' + g2 + ',' + b + ',' + (a == null ? 1 : a) + ')';
}

function layout(){
  var w = V.w, h = V.h;
  V.portrait = h > w * 1.02;
  G.pad = Math.max(12, Math.min(w, h) * 0.045);
  G.seam = w * (V.portrait ? 0.5 : 0.515);
  G.bandH = V.portrait ? h * 0.40 : h * 0.335;
  G.bandTop = h - G.bandH;
  G.bandL = G.pad * 0.55;
  G.bandR = w - G.pad * 0.55;
  G.darkL = G.pad * 0.9;
  G.darkR = w - G.pad * 0.9;
  G.capY = h - G.pad * 1.15;
  G.ruleY = h - G.pad * 2.4;
  var iw = Math.max(74, G.pad * 4.2), ih = iw * 1.26;
  G.inset = { x: G.seam - iw - G.pad * 0.6, y: G.pad * 3.9, w: iw, h: ih, rot: -0.045 };
  root.style.setProperty('--accent', accentForPaper(1));
  root.style.setProperty('--hl', accentForPaper(0.42));
}
function resize(){
  var r = root.getBoundingClientRect();
  V.w = Math.max(240, Math.round(r.width || window.innerWidth || 320));
  V.h = Math.max(320, Math.round(r.height || window.innerHeight || 480));
  V.dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(V.w * V.dpr);
  cv.height = Math.round(V.h * V.dpr);
  if (!grainTile) makeGrain();
  layout();
  buildAll();
  layoutLyrics();
}
window.addEventListener('resize', resize, { passive: true });
if (window.ResizeObserver) new ResizeObserver(resize).observe(root);

var paperCv = null;
function buildPaper(){
  var w = V.w, h = V.h;
  paperCv = document.createElement('canvas');
  paperCv.width = w;
  paperCv.height = h;
  var g = paperCv.getContext('2d');
  g.fillStyle = PAPER;
  g.fillRect(0, 0, w, h);
  /* paper tone gradient */
  var gr = g.createLinearGradient(0, 0, w * 0.6, h);
  gr.addColorStop(0, 'rgba(255,252,244,.55)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0)');
  gr.addColorStop(1, 'rgba(96,78,52,.10)');
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);
  /* halftone ghost field */
  g.save();
  g.globalAlpha = 0.5;
  g.fillStyle = dotPattern(g, 9, 1.15, 0.10);
  g.fillRect(0, 0, w, h);
  g.restore();
  /* fibre + grain */
  if (!grainTile) makeGrain();
  g.save();
  g.globalAlpha = 0.55;
  g.fillStyle = g.createPattern(grainTile, 'repeat');
  g.fillRect(0, 0, w, h);
  g.restore();
  /* scanner glass sheen */
  var sg = g.createLinearGradient(0, 0, w, h * 0.7);
  sg.addColorStop(0, 'rgba(255,255,255,.14)');
  sg.addColorStop(0.35, 'rgba(255,255,255,0)');
  sg.addColorStop(1, 'rgba(255,255,255,.05)');
  g.fillStyle = sg;
  g.fillRect(0, 0, w, h);
}
function drawPaper(){
  ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (!paperCv) buildPaper();
  ctx.drawImage(paperCv, 0, 0, V.w, V.h);
}

/* ================= torn paper geometry ================= */
var tearPath = null, bandPath = null, tearPts = [], bandPts = [];
function buildTear(){
  tearPts = [];
  var step = Math.max(11, V.h / 70), y, amp = Math.max(4, Math.min(13, V.w * 0.006));
  for (y = -20; y <= V.h + 20; y += step){
    tearPts.push({ y: y, x: G.seam + Math.sin(y * 0.037) * amp * 0.5 + (Math.random() - 0.5) * amp });
  }
  tearPath = new Path2D();
  tearPath.moveTo(tearPts[0].x, tearPts[0].y);
  for (var i = 1; i < tearPts.length; i++) tearPath.lineTo(tearPts[i].x, tearPts[i].y);
  tearPath.lineTo(V.w + 30, V.h + 20);
  tearPath.lineTo(V.w + 30, -20);
  tearPath.closePath();
}
function buildBandEdge(){
  bandPts = [];
  var step = Math.max(9, V.w / 130), x, amp = Math.max(3, Math.min(9, V.w * 0.0045));
  for (x = -12; x <= V.w + 12; x += step){
    bandPts.push({ x: x, y: G.bandTop + Math.sin(x * 0.05) * amp * 0.4 + (Math.random() - 0.5) * amp });
  }
  bandPath = new Path2D();
  bandPath.moveTo(bandPts[0].x, bandPts[0].y);
  for (var i = 1; i < bandPts.length; i++) bandPath.lineTo(bandPts[i].x, bandPts[i].y);
  bandPath.lineTo(V.w + 12, V.h + 12);
  bandPath.lineTo(-12, V.h + 12);
  bandPath.closePath();
}

/* ================= plates ================= */
var coverImg = null, plateL = null, plateR = null, staticCv = null, platesReady = false;

function coverSrc(iw, ih, bw, bh, zoom){
  var s = Math.max(bw / iw, bh / ih) * (zoom || 1);
  var tw = bw / s, th = bh / s;
  return { sx: (iw - tw) / 2, sy: (ih - th) / 2, sw: tw, sh: th };
}
function fitCover(g, img, x, y, w, h, zoom, ox, oy){
  var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  var s = Math.max(w / iw, h / ih) * (zoom || 1);
  var dw = iw * s, dh = ih * s;
  g.drawImage(img, x + (w - dw) / 2 + (ox || 0), y + (h - dh) / 2 + (oy || 0), dw, dh);
}
/* no artwork: a printer's missing-plate proof — accent halftone, overprint bands, voided X */
function paintNoCover(g, w, h, dark){
  g.fillStyle = dark ? '#0b0c12' : PAPER;
  g.fillRect(0, 0, w, h);
  var cx = w * 0.5, cy = h * 0.43, R = Math.max(w, h) * 0.62, step = 9;
  g.fillStyle = dark ? accentForDark(0.9) : accentCss(0.92);
  for (var y = step * 0.5; y < h; y += step){
    for (var x = step * 0.5; x < w; x += step){
      var dx = (x - cx) / R, dy = (y - cy) / R;
      var d = Math.sqrt(dx * dx + dy * dy);
      var rr = (1 - Math.min(1, d)) * step * 0.5;
      rr *= 0.55 + 0.45 * Math.sin(x * 0.021 + y * 0.016);
      if (rr < 0.42) continue;
      g.beginPath(); g.arc(x, y, rr, 0, 6.2832); g.fill();
    }
  }
  g.globalAlpha = dark ? 0.20 : 0.14;
  g.fillStyle = dark ? '#f0eade' : '#14110f';
  for (var b = 0; b < 5; b++) g.fillRect(0, h * (0.12 + b * 0.19), w, h * 0.011);
  g.globalAlpha = 1;
  g.strokeStyle = dark ? 'rgba(240,234,222,.5)' : 'rgba(20,17,15,.4)';
  g.lineWidth = Math.max(2, w * 0.011);
  g.beginPath();
  g.moveTo(w * 0.08, h * 0.12); g.lineTo(w * 0.92, h * 0.88);
  g.moveTo(w * 0.92, h * 0.12); g.lineTo(w * 0.08, h * 0.88);
  g.stroke();
  for (var i = 0; i < 150; i++){
    g.fillStyle = dark ? 'rgba(240,234,222,' + (0.03 + Math.random() * 0.09) + ')'
                       : 'rgba(20,17,15,' + (0.03 + Math.random() * 0.09) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 2);
  }
}
function finishPlate(g, w, h, hot){
  g.globalAlpha = 1;
  g.fillStyle = dotPattern(g, hot ? 6 : 8, hot ? 1.35 : 1.7, hot ? 0.16 : 0.14);
  g.fillRect(0, 0, w, h);
  var vg = g.createLinearGradient(0, 0, 0, h);
  vg.addColorStop(0, 'rgba(0,0,0,.18)');
  vg.addColorStop(0.35, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.24)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
}
function paintPlate(c, hot){
  var g = c.getContext('2d'), w = c.width, h = c.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  var ac = S.accent;
  if (!coverImg){
    paintNoCover(g, w, h, hot);
    finishPlate(g, w, h, hot);
    return;
  }
  if (hot){
    /* black -> accent duotone: highlights take the accent */
    var mx = Math.max(ac[0], ac[1], ac[2]) || 1;
    var k = Math.min(0.62, 150 / mx);
    g.fillStyle = 'rgb(' + Math.round(ac[0] * k) + ',' + Math.round(ac[1] * k) + ',' + Math.round(ac[2] * k) + ')';
    g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'multiply';
    g.save(); g.translate(w, 0); g.scale(-1, 1);
    g.filter = 'grayscale(1) contrast(1.55) brightness(1.02)';
    fitCover(g, coverImg, 0, 0, w, h, 1.22, -30, 10);
    g.filter = 'none'; g.restore();
    /* lift the brightest passages back toward white */
    g.globalCompositeOperation = 'screen';
    g.globalAlpha = 0.22;
    g.save(); g.translate(w, 0); g.scale(-1, 1);
    g.filter = 'grayscale(1) contrast(1.2) brightness(.8)';
    fitCover(g, coverImg, 0, 0, w, h, 1.22, -30, 10);
    g.filter = 'none'; g.restore();
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  } else {
    /* cold ink on paper: cream highlights, blue-black shadows */
    g.fillStyle = PAPER;
    g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'multiply';
    g.filter = 'grayscale(1) contrast(1.45) brightness(1.04)';
    fitCover(g, coverImg, 0, 0, w, h, 1.06, 0, 0);
    g.filter = 'none';
    g.globalCompositeOperation = 'screen';
    g.fillStyle = 'rgba(26,37,58,.40)';
    g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'source-over';
  }
  finishPlate(g, w, h, hot);
}
function buildPlates(){
  if (!plateL){ plateL = document.createElement('canvas'); plateL.width = 1000; plateL.height = 1150; }
  if (!plateR){ plateR = document.createElement('canvas'); plateR.width = 1000; plateR.height = 1300; }
  paintPlate(plateL, false);
  paintPlate(plateR, true);
  platesReady = true;
}
function loadCover(url){
  if (!url){ coverImg = null; coverState = 'none'; buildPlates(); return; }
  coverState = 'loading';
  var im = new Image();
  im.decoding = 'async';
  im.onload = function(){
    if (coverUrl !== url) return;
    coverImg = im; coverState = 'ok'; buildPlates();
  };
  im.onerror = function(){
    if (coverUrl !== url) return;
    coverImg = null; coverState = 'fail'; buildPlates();
  };
  im.src = url;
}

/* ================= static print overlay ================= */
function spacedText(g, str, x, y, gap){
  var cx = x;
  for (var i = 0; i < str.length; i++){ g.fillText(str[i], cx, y); cx += g.measureText(str[i]).width + gap; }
  return cx;
}
function ellipsize(g, str, max){
  if (g.measureText(str).width <= max) return str;
  var s = str;
  while (s.length > 1 && g.measureText(s + '…').width > max) s = s.slice(0, -1);
  return s + '…';
}
function regMark(g, x, y, r, col){
  g.save(); g.strokeStyle = col; g.lineWidth = 1; g.globalAlpha = 0.7;
  g.beginPath(); g.moveTo(x - r, y); g.lineTo(x + r, y); g.moveTo(x, y - r); g.lineTo(x, y + r); g.stroke();
  g.beginPath(); g.arc(x, y, r * 0.52, 0, 6.2832); g.stroke();
  g.restore();
}
function drawSpider(g, cx, cy, r, col, alpha){
  g.save(); g.translate(cx, cy);
  g.lineCap = 'round'; g.lineJoin = 'round';
  var legs = [
    [[0.15,-0.3],[0.6,-0.62],[0.96,-0.92]],
    [[0.18,-0.06],[0.8,-0.16],[1.06,-0.34]],
    [[0.18,0.14],[0.78,0.22],[1.0,0.44]],
    [[0.14,0.34],[0.52,0.62],[0.68,0.96]]
  ];
  function strokeBody(){
    g.beginPath(); g.ellipse(0, r * 0.04, r * 0.2, r * 0.3, 0, 0, 6.2832); g.stroke();
    g.beginPath(); g.arc(0, -r * 0.38, r * 0.13, 0, 6.2832); g.stroke();
    for (var s = -1; s <= 1; s += 2){
      for (var i = 0; i < legs.length; i++){
        var L = legs[i];
        g.beginPath();
        g.moveTo(L[0][0] * s * r, L[0][1] * r);
        g.lineTo(L[1][0] * s * r, L[1][1] * r);
        g.lineTo(L[2][0] * s * r, L[2][1] * r);
        g.stroke();
      }
    }
  }
  /* dark halo so the ink reads over bright plate areas */
  g.globalAlpha = alpha * 0.45;
  g.strokeStyle = '#0a0810';
  g.lineWidth = Math.max(2.4, r * 0.058);
  strokeBody();
  g.globalAlpha = alpha;
  g.strokeStyle = col;
  g.lineWidth = Math.max(1.15, r * 0.032);
  strokeBody();
  g.font = '600 ' + Math.max(7, r * 0.14) + 'px ui-monospace,Consolas,monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.globalAlpha = alpha * 0.95;
  g.fillStyle = col;
  g.fillText('13', 0, r * 0.06);
  g.restore();
}
function buildStatic(){
  staticCv = document.createElement('canvas');
  staticCv.width = Math.round(V.w * V.dpr);
  staticCv.height = Math.round(V.h * V.dpr);
  var g = staticCv.getContext('2d');
  g.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  g.clearRect(0, 0, V.w, V.h);
  var w = V.w, h = V.h, pad = G.pad, small = w < 560;

  /* registration marks */
  var rm = Math.max(3.5, pad * 0.16);
  regMark(g, pad * 0.45, pad * 0.45, rm, '#14110f');
  regMark(g, pad * 0.45, G.bandTop - pad * 0.45, rm, '#14110f');
  regMark(g, w - pad * 0.45, pad * 0.45, rm, '#e9e3d7');

  /* header */
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = 'rgba(20,17,15,.62)';
  g.font = '500 ' + Math.max(8, Math.min(11, w * 0.0072)) + 'px ui-monospace,Consolas,"Courier New",monospace';
  spacedText(g, 'A / 303', pad, pad * 1.5, 2.4);
  var title = (S.song && S.song.name) ? String(S.song.name) : 'UNTITLED';
  /* 播放器有时把 artists 当字符串发（"A / B"），有时当数组发 —— 两种都要接住 */
  var artists = (S.song && S.song.artists)
    ? (Array.isArray(S.song.artists) ? S.song.artists : [S.song.artists]).join(' / ')

  var ts = Math.max(14, Math.min(30, w * 0.019));

  var maxTw = G.seam - pad * (V.portrait ? 1.2 : 2.6);
  g.fillText(ellipsize(g, title, maxTw), pad, pad * 1.5 + ts + pad * 0.28);
  if (artists){
    g.fillStyle = 'rgba(20,17,15,.6)';
    g.font = '500 ' + Math.max(8, Math.min(12, w * 0.0082)) + 'px ui-monospace,Consolas,"Courier New",monospace';
    g.fillText(ellipsize(g, artists.toUpperCase(), maxTw), pad, pad * 1.5 + ts * 1.62 + pad * 0.5);
  }

  /* giant outlined 13 on the dark panel */
  var numS = Math.min(w, h) * 0.36;
  if (!small){
    g.save();
    g.textAlign = 'right'; g.textBaseline = 'alphabetic';
    g.font = '800 ' + numS + 'px system-ui,"PingFang SC",sans-serif';
    g.lineWidth = Math.max(2.4, numS * 0.026);
    g.strokeStyle = 'rgba(9,7,12,.40)';
    g.strokeText('13', w - pad * 0.7, G.bandTop * 0.86);
    g.lineWidth = Math.max(1, w * 0.0009);
    g.strokeStyle = 'rgba(240,234,220,' + (V.portrait ? 0.42 : 0.55) + ')';
    g.strokeText('13', w - pad * 0.7, G.bandTop * 0.86);
    g.restore();
  }

  /* vertical troupe glyphs along the tear */
  if (!small){
    var vs = Math.max(13, Math.min(30, Math.min(w, h) * 0.032));
    g.save();
    g.font = '600 ' + vs + 'px "Songti SC","Hiragino Sans GB","Microsoft YaHei",serif';
    g.fillStyle = 'rgba(240,234,220,.5)';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var vx = G.seam + pad * 0.78, vy = pad * 1.55;
    var chars = '幻影旅团';
    for (var c = 0; c < chars.length; c++) g.fillText(chars[c], vx, vy + c * vs * 1.34);
    g.restore();
  }

  /* spider sigil */
  var sr = Math.max(32, Math.min(Math.min(w, h) * 0.135, 148));
  var scx = Math.min(G.seam + pad * 4.4, w - pad * 1.2 - sr);
  var scy = G.bandTop * 0.52;
  drawSpider(g, scx, scy, sr, accentForDark(1), 0.86);
  g.save();
  g.font = '600 ' + Math.max(7.5, sr * 0.075) + 'px ui-monospace,Consolas,monospace';
  g.fillStyle = accentForDark(0.62); g.textAlign = 'center';
  g.fillText('PHANTOM', scx, scy + sr * 1.36);
  g.restore();

  /* micro caption above the lyric band */
  g.fillStyle = 'rgba(20,17,15,.55)';
  g.font = '500 ' + Math.max(7.5, Math.min(10, w * 0.0068)) + 'px ui-monospace,Consolas,"Courier New",monospace';
  spacedText(g, 'ANIME-CORE / CLOUD RAP', pad * 0.85, G.bandTop - pad * 0.6, 1.6);
  var sideA = 'SIDE A · 45 RPM';
  var sideW = g.measureText(sideA).width + 1.6 * (sideA.length - 1);
  g.fillStyle = 'rgba(233,227,215,.55)';
  g.textAlign = 'left';
  spacedText(g, sideA, w - pad * 0.85 - sideW, G.bandTop - pad * 0.6, 1.6);

  /* scanner-bed creases */
  g.save();
  g.globalAlpha = 0.13;
  g.strokeStyle = '#3a2f22'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(-40, h * 0.17); g.lineTo(w * 0.6, -20); g.stroke();
  g.globalAlpha = 0.22;
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-40, h * 0.17 + 1.6); g.lineTo(w * 0.6, -20 + 1.6); g.stroke();
  g.restore();
  /* dust and toner specks */
  for (var d = 0; d < 80; d++){
    g.fillStyle = 'rgba(38,28,16,' + (0.05 + Math.random() * 0.13) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 1.8, 1 + Math.random() * 1.4);
  }

  /* barcode in the top-right of the dark plate */  var bcW = Math.min(w * 0.22, pad * 5.4), bcH = Math.max(12, Math.min(pad * 0.78, 34));
  var bx = w - pad * 1.0 - bcW, by = pad * 1.62;
  var seed = 137, x = bx;
  g.fillStyle = 'rgba(233,227,215,.72)';
  while (x < bx + bcW - 1){
    seed = (seed * 9301 + 49297) % 233280;
    var rnd = seed / 233280;
    var bw = rnd > 0.7 ? Math.max(2, pad * 0.06) : (rnd > 0.34 ? Math.max(1.2, pad * 0.036) : Math.max(0.8, pad * 0.02));
    g.fillRect(x, by, bw, bcH);
    x += bw + (rnd > 0.55 ? pad * 0.07 : pad * 0.04);
  }
  g.font = '500 ' + Math.max(6, pad * 0.2) + 'px ui-monospace,Consolas,monospace';
  g.fillStyle = 'rgba(233,227,215,.5)';
  g.textAlign = 'right';
  g.fillText('303 013 A', bx + bcW, by + bcH + pad * 0.3);
  g.textAlign = 'left';

  /* tape strips */
  var I = G.inset;
  if (I){
    var tw = Math.max(52, pad * 2.9), th = Math.max(14, pad * 0.72);
    g.save();
    g.translate(I.x + I.w * 0.06, I.y - th * 0.4);
    g.rotate(-0.24);
    g.fillStyle = 'rgba(240,234,216,.62)';
    g.fillRect(0, 0, tw, th);
    g.fillStyle = 'rgba(255,255,255,.18)';
    g.fillRect(0, 0, tw, th * 0.26);
    g.strokeStyle = 'rgba(122,106,76,.26)'; g.lineWidth = 1;
    g.strokeRect(0.5, 0.5, tw - 1, th - 1);
    g.restore();
    /* small accent registration patch on the dark side */
    g.save();
    g.globalAlpha = 0.5;
    g.fillStyle = accentForDark(0.9);
    g.fillRect(w - pad * 1.55, G.bandTop - pad * 2.15, pad * 0.62, pad * 0.62);
    g.restore();
  }
}

var bandCv = null, bandTopPx = 0;
function layoutLyrics(){
  var pad = G.pad, w = V.w, h = V.h;
  var lyr = document.getElementById('lyr'), empty = document.getElementById('empty');
  var top = G.bandTop + pad * 0.5;
  var bot = G.ruleY - pad * 0.3;
  if (bot - top < pad * 2) bot = h - pad * 2.4;
  lyr.style.left = (pad * 0.85) + 'px';
  lyr.style.width = (w - pad * 1.7) + 'px';
  lyr.style.top = top + 'px';
  lyr.style.height = Math.max(40, bot - top) + 'px';
  var et = pad * 0.95;
  empty.style.left = (pad * 0.85) + 'px';
  empty.style.width = (w - pad * 1.7) + 'px';
  empty.style.top = (G.bandTop + G.bandH * 0.3) + 'px';
  if (window.__rebuildLine) window.__rebuildLine();
}
function timeStr(t){
  if (!isFinite(t) || t < 0) t = 0;
  var m = Math.floor(t / 60), s = Math.floor(t % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function buildBand(){
  var pad = G.pad, w = V.w, h = V.h;
  bandTopPx = G.bandTop - Math.max(9, pad * 0.55);
  bandCv = document.createElement('canvas');
  bandCv.width = Math.round(w * V.dpr);
  bandCv.height = Math.round((h - bandTopPx) * V.dpr);
  var g = bandCv.getContext('2d');
  g.setTransform(V.dpr, 0, 0, V.dpr, 0, -bandTopPx * V.dpr);
  g.clearRect(0, 0, w, h);
  g.save();
  g.clip(bandPath);
  g.fillStyle = '#f0eadf';
  g.fillRect(0, 0, w, h);
  var lg = g.createLinearGradient(0, G.bandTop, 0, h);
  lg.addColorStop(0, 'rgba(255,253,247,.85)');
  lg.addColorStop(0.65, 'rgba(238,232,220,.25)');
  lg.addColorStop(1, 'rgba(209,199,181,.55)');
  g.fillStyle = lg;
  g.fillRect(0, 0, w, h);
  if (grainTile){
    var bg = g.createPattern(grainTile, 'repeat');
    g.globalAlpha = 0.6;
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    g.globalAlpha = 1;
  }
  /* shadow cast by the torn lip */
  var sh = g.createLinearGradient(0, G.bandTop, 0, G.bandTop + pad * 1.5);
  sh.addColorStop(0, 'rgba(28,20,10,.34)');
  sh.addColorStop(0.55, 'rgba(28,20,10,.08)');
  sh.addColorStop(1, 'rgba(28,20,10,0)');
  g.fillStyle = sh;
  g.fillRect(0, G.bandTop, w, pad * 1.5);
  /* caption rule */
  g.strokeStyle = 'rgba(20,17,15,.26)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(pad * 0.85, G.ruleY);
  g.lineTo(w - pad * 0.85, G.ruleY);
  g.stroke();
  g.restore();
}
function drawBand(ts, dt, p){
  if (!bandCv) return;
  ctx.drawImage(bandCv, 0, bandTopPx - p * 2.2, V.w, V.h - bandTopPx);
  /* caption row */
  var pad = G.pad, w = V.w, h = V.h;
  var cy = G.capY;
  ctx.save();
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(20,17,15,.62)';
  ctx.font = '500 ' + Math.max(8, Math.min(10.5, pad * 0.26)) + 'px ui-monospace,Consolas,"Courier New",monospace';
  var cap = timeStr(S.t) + ' / ' + timeStr(S.duration);
  ctx.fillText(cap, pad * 0.85, cy);
  var cx = pad * 0.85 + ctx.measureText(cap).width + pad * 0.6;
  if (w > 520){
    ctx.fillStyle = 'rgba(20,17,15,.42)';
    ctx.fillText('320 KBPS  ·  STEREO  ·  NCS-303', cx, cy);
  }
  /* live meter */
  var bx = Math.min(w * 0.62, pad * 0.85 + w * 0.34);
  var n = 14, bh = Math.max(4, pad * 0.3), gap = 2.2;
  if (w > 620){
    var lvlAll = Math.max(S.live.level, S.live.bass * 0.7);
    for (var i = 0; i < n; i++){
      var wob = 0.62 + 0.38 * Math.sin(ts * 0.006 + i * 0.85);
      var v = Math.max(0, Math.min(1, (S.live.bass * (1 - i / n) + S.live.mid * 0.55 + S.live.treble * (i / n)) * wob + lvlAll * 0.12));
      ctx.fillStyle = i < n * 0.55 ? accentForPaper(0.78) : 'rgba(20,17,15,.5)';
      ctx.fillRect(bx + i * (gap + 2.4), cy - bh - v * bh * 0.25, 2.4, bh + v * bh * 1.5);
    }
  }
  /* line counter */
  if (S.lines.length && w > 420){
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(20,17,15,.45)';
    var cIdx = S.idx < 0 ? '00' : ('0' + (S.idx + 1)).slice(-2);
    ctx.fillText(cIdx + ' / ' + S.lines.length, w - pad * 0.85, cy);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function buildAll(){
  buildPaper();
  buildTear();
  buildBandEdge();
  buildStatic();
  buildBand();
}

function draw(ts, dt){
  if (!V.w) return;
  drawPaper();
  drawScene(ts, dt || 16.7);
}

/* ================= scene ================= */
function drawScene(ts, dt){
  var w = V.w, h = V.h, pad = G.pad;
  var bass = S.live.bass || 0, lvl = S.live.level || 0;
  S.pulse = (S.pulse || 0) * Math.pow(0.0012, dt / 1000);
  var p = S.pulse || 0;

  /* dark bleed panel */
  ctx.save();
  ctx.fillStyle = '#0a0c12';
  ctx.fill(tearPath);
  if (plateR && platesReady){
    ctx.save(); ctx.clip(tearPath);
    var pr = coverSrc(plateR.width, plateR.height, (w - G.seam) + 30, h, 1 + bass * 0.02 + p * 0.012);
    ctx.drawImage(plateR, pr.sx, pr.sy, pr.sw, pr.sh,
      G.seam - 16, -16 + p * -2, (w - G.seam) + 32, h + 32);
    ctx.restore();
  }
  ctx.restore();

  /* left cold plate */
  var lx0 = -pad * 0.8, ly0 = pad * 3.55, lx1 = G.seam - pad * 0.28, ly1 = G.bandTop - pad * 0.95;
  var pw = lx1 - lx0, ph = ly1 - ly0;
  ctx.save();
  ctx.translate((lx0 + lx1) / 2, (ly0 + ly1) / 2);
  ctx.rotate(-0.005 - p * 0.006);
  ctx.fillStyle = 'rgba(26,17,8,.17)';
  ctx.fillRect(-pw / 2 + 5, -ph / 2 + 7, pw, ph);
  if (plateL && platesReady){
    var pl = coverSrc(plateL.width, plateL.height, pw, ph, 1.02 + bass * 0.015);
    ctx.drawImage(plateL, pl.sx, pl.sy, pl.sw, pl.sh, -pw / 2, -ph / 2, pw, ph);
  } else {
    ctx.fillStyle = 'rgba(24,34,54,.92)';
    ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
  }
  /* paper edge on the photo */
  ctx.strokeStyle = 'rgba(20,17,15,.30)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-pw / 2 + 0.5, -ph / 2 + 0.5, pw - 1, ph - 1);
  ctx.restore();

  /* pasted inset print */
  var I = G.inset;
  if (I){
    ctx.save();
    ctx.translate(I.x + I.w / 2, I.y + I.h / 2);
    ctx.rotate(I.rot + (S.rm ? 0 : p * 0.005));
    var bw = Math.max(4, pad * 0.24);
    ctx.fillStyle = 'rgba(22,15,8,.22)';
    ctx.fillRect(-I.w / 2 - bw + 3, -I.h / 2 - bw + 4, I.w + bw * 2, I.h + bw * 2);
    ctx.fillStyle = '#f5f0e5';
    ctx.fillRect(-I.w / 2 - bw, -I.h / 2 - bw, I.w + bw * 2, I.h + bw * 2);
    if (plateR && platesReady){
      var is = coverSrc(plateR.width, plateR.height, I.w, I.h, 1.42);
      ctx.drawImage(plateR, is.sx, is.sy, is.sw, is.sh, -I.w / 2, -I.h / 2, I.w, I.h);
    } else {
      ctx.fillStyle = accentCss(0.35);
      ctx.fillRect(-I.w / 2, -I.h / 2, I.w, I.h);
    }
    ctx.strokeStyle = 'rgba(20,15,8,.32)';
    ctx.lineWidth = 1;
    ctx.strokeRect(-I.w / 2 - bw + 0.5, -I.h / 2 - bw + 0.5, I.w + bw * 2 - 1, I.h + bw * 2 - 1);
    ctx.restore();
  }

  /* missing artwork: sticker on the left page */
  if (coverState === 'none' || coverState === 'fail') drawNoCoverSticker(pad);

  /* static print layer (with beat-driven scan glitch) */
  if (staticCv){
    if (!S.rm && p > 0.18){
      var gy = (Math.sin(ts * 0.017) * 0.5 + 0.5) * (G.bandTop - 80);
      var gh = Math.min(30, G.bandTop * 0.055);
      var gx = p * 7 * (Math.sin(ts * 0.011) > 0 ? 1 : -1);
      ctx.drawImage(staticCv, 0, 0, w, h);
      ctx.drawImage(staticCv, 0, gy * V.dpr, staticCv.width, gh * V.dpr, gx, gy, w, gh);
      ctx.drawImage(staticCv, 0, (gy + 74) * V.dpr, staticCv.width, gh * 0.55 * V.dpr, -gx * 0.6, gy + 74, w, gh * 0.55);
    } else {
      ctx.drawImage(staticCv, 0, 0, w, h);
    }
  }

  drawBand(ts, dt, p);

  /* misregistered second plate of the big numeral, on strong beats */
  if (p > 0.24 && w >= 560){
    ctx.save();
    ctx.globalAlpha = Math.min(0.55, (p - 0.24) * 0.9);
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.font = '800 ' + (Math.min(w, h) * 0.36) + 'px system-ui,"PingFang SC",sans-serif';
    ctx.strokeStyle = accentForDark(1);
    ctx.lineWidth = Math.max(1.3, w * 0.0011);
    ctx.strokeText('13', w - pad * 0.7 + 8, G.bandTop * 0.86 + 6);
    ctx.restore();
  }

  /* beat sweep along the band lip */
  if (p > 0.02){
    ctx.save();
    ctx.globalAlpha = 0.35 + p * 0.5;
    ctx.fillStyle = accentCss(1);
    ctx.fillRect(0, G.bandTop - 3, w, 1.6);
    ctx.restore();
  }

  /* exposed torn paper edge */
  ctx.save();
  ctx.strokeStyle = 'rgba(233,227,215,.55)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(tearPts[0].x - 1, tearPts[0].y);
  for (var i = 1; i < tearPts.length; i++){
    if (tearPts[i].y > G.bandTop + 2) break;
    ctx.lineTo(tearPts[i].x - 1, tearPts[i].y);
  }
  ctx.stroke();
  ctx.restore();

  /* misregistered accent line down the tear */
  ctx.save();
  ctx.globalAlpha = 0.55 + p * 0.35;
  ctx.strokeStyle = accentForDark(1);
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (var j = 0; j < tearPts.length; j++){
    if (tearPts[j].y > G.bandTop + 2) break;
    var wob = (S.rm || !S.playing) ? 0 : Math.sin(ts * 0.0018 + tearPts[j].y * 0.05) * (2 + lvl * 5);
    if (j === 0) ctx.moveTo(tearPts[j].x + 3 + wob, tearPts[j].y);
    else ctx.lineTo(tearPts[j].x + 3 + wob, tearPts[j].y);
  }
  ctx.stroke();
  ctx.restore();

  /* spectrum ticks running down the tear */
  ctx.save();
  ctx.fillStyle = accentForDark(1);
  for (var q = 0; q < tearPts.length; q += 2){
    var yq = tearPts[q].y;
    if (yq < -4 || yq > G.bandTop - 2) continue;
    var lv = (S.live.bass * Math.max(0, Math.sin(q * 0.32 + ts * 0.0022)) +
              S.live.treble * Math.max(0, Math.cos(q * 0.47 - ts * 0.003))) * 24;
    if (lv < 0.6) continue;
    ctx.globalAlpha = 0.18 + Math.min(0.3, lv * 0.012);
    ctx.fillRect(tearPts[q].x + 4, yq - 0.6, 1.5 + lv, 1.2);
  }
  ctx.restore();

  /* copier scan bar */
  if (!S.rm && S.playing){
    var sy = ((ts * 0.055) % (h + 220)) - 110;
    var sg = ctx.createLinearGradient(0, sy - 60, 0, sy + 60);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,' + (0.05 + lvl * 0.06) + ')');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = sg; ctx.fillRect(0, sy - 60, w, 120);
    ctx.restore();
  }

  /* beat ink flash */
  if (p > 0.03){
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = accentCss(0.055 * p);
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
}

/* ================= lyrics ================= */
var lyrEl = document.getElementById('lyr'),
    prevEl = document.getElementById('lprev'),
    curEl = document.getElementById('lcur'),
    nxtEl = document.getElementById('lnxt'),
    emptyEl = document.getElementById('empty'),
    etitleEl = document.getElementById('etitle');
var spanEls = [], linePts = [], litCount = 0, curText = '';
var FONT = '"PingFang SC","Hiragino Sans GB","Songti SC","Microsoft YaHei",system-ui,sans-serif';
var meas = document.createElement('canvas').getContext('2d');

function charPlan(line, nextT){
  var txt = String(line.text == null ? '' : line.text);
  var out = [], k, n = txt.length;
  var cs = line.chars;
  if (cs && cs.length && typeof cs[0] === 'object' && typeof cs[0].t === 'number'){
    for (k = 0; k < cs.length; k++){
      out.push({ c: cs[k].c == null ? '' : String(cs[k].c), t: cs[k].t });
    }
  } else {
    var span = (nextT && nextT > line.t) ? nextT - line.t : 0;
    var dur = (typeof line.dur === 'number' && line.dur > 0.2) ? line.dur
            : Math.max(1.2, Math.min(4.6, span || 4.2));
    for (k = 0; k < n; k++) out.push({ c: txt.charAt(k), t: line.t + dur * (k / Math.max(1, n)) });
  }
  if (!out.length && n){
    for (k = 0; k < n; k++) out.push({ c: txt.charAt(k), t: line.t });
  }
  return out;
}
function fitFont(text){
  var availW = Math.max(60, lyrEl.clientWidth || 200);
  var availH = Math.max(40, lyrEl.clientHeight || 120);
  var size = Math.max(15, Math.min(availH * 0.5, availW * 0.135, 74));
  var min = 13;
  for (; size > min; size -= 1){
    meas.font = '600 ' + size + 'px ' + FONT;
    var wpx = meas.measureText(text).width * 1.05;
    var lines = Math.max(1, Math.ceil(wpx / (availW * 0.94)));
    if (lines * size * 1.3 + size * 1.12 <= availH) break;
  }
  return Math.max(min, size);
}
function renderLine(){
  var noLyrics = !S.lines.length;
  emptyEl.style.display = noLyrics ? 'block' : 'none';
  lyrEl.style.display = noLyrics ? 'none' : 'flex';
  if (noLyrics){
    prevEl.textContent = ''; nxtEl.textContent = '';
    curEl.innerHTML = '';
    spanEls = []; linePts = []; litCount = 0; curText = '';
    etitleEl.textContent = (S.song && S.song.name) ? String(S.song.name) : '—';
    return;
  }
  var i = S.idx, line = S.lines[i];
  prevEl.textContent = (i > 0 && S.lines[i-1]) ? String(S.lines[i-1].text || '') : '';
  nxtEl.textContent = (i + 1 < S.lines.length && S.lines[i+1]) ? String(S.lines[i+1].text || '') : '';
  curEl.innerHTML = '';
  spanEls = []; linePts = []; litCount = 0; curText = '';
  if (!line){ curEl.textContent = ''; return; }
  var plan = charPlan(line, S.lines[i+1] ? S.lines[i+1].t : 0), frag = document.createDocumentFragment();
  for (var k = 0; k < plan.length; k++){
    var sp = document.createElement('span');
    sp.className = 'ch';
    sp.textContent = plan[k].c === ' ' ? '\u00A0' : (plan[k].c || '');
    frag.appendChild(sp);
    spanEls.push(sp);
    curText += plan[k].c;
  }
  curEl.appendChild(frag);
  linePts = plan;
  lyrEl.style.fontSize = fitFont(curText || 'A') + 'px';
  applyProgress();
}
function applyProgress(){
  if (!linePts.length) return;
  var t = S.t, n = 0, i;
  while (n < linePts.length && linePts[n].t <= t) n++;
  if (n === litCount) return;
  if (n < litCount){
    for (i = n; i < litCount; i++) if (spanEls[i]) spanEls[i].classList.remove('on');
  } else {
    for (i = litCount; i < n; i++) if (spanEls[i]) spanEls[i].classList.add('on');
  }
  litCount = n;
}

window.__onLine = function(){ renderLine(); };
window.__rebuildLine = function(){ renderLine(); };
window.__tickUI = function(){
  applyProgress();
  var p = S.pulse || 0;
  var jolt = S.rm ? 0 : Math.min(2.4, p * 2.6);
  lyrEl.style.transform = jolt > 0.05 ? 'translateY(' + (-jolt).toFixed(2) + 'px)' : 'none';
  emptyEl.style.transform = lyrEl.style.transform;
};
window.__onInit = function(p){
  p = p || {};
  var song = S.song || {};
  var cover = (typeof song.cover === 'string') ? song.cover : '';
  var sig = (song.id || '') + '|' + (song.name || '') + '|' +
            ((song.artists || []).join('/')) + '|' + S.accent.join(',') + '|' + cover;
  if (sig !== lastVisualSig){
    lastVisualSig = sig;
    layout();
    buildAll();
    buildPlates();
    layoutLyrics();
  }
  if (cover !== coverUrl){
    coverUrl = cover;
    loadCover(cover);
  }
  renderLine();
};
window.__onBeat = function(level){
  S.pulse = Math.min(1, 0.45 + (level || 0.5) * 0.85);
};

resize();

/* ---------- clock / line lookup ---------- */
function findIdx(t){
  var L = S.lines, i = -1;
  for (var k = 0; k < L.length; k++) { if (L[k].t <= t + 0.001) i = k; else break; }
  return i;
}
function syncIdx(){
  var i = findIdx(S.t);
  if (i === S.idx) return;
  S.idx = i;
  if (window.__onLine) window.__onLine(i);
}

/* ---------- message protocol ---------- */
function onInit(p){
  p = p || {};
  S.song = p.song || null;
  if (p.accent && p.accent.length === 3) S.accent = p.accent.slice(0, 3);
  S.lines = Array.isArray(p.lines) ? p.lines : [];
  S.duration = (typeof p.duration === 'number') ? p.duration : 0;
  if (typeof p.playing === 'boolean') S.playing = p.playing;
  /* 时间轴：只有还没收到过 tick 时才从 0 起步；播放器已经在走就绝不清零 */
  if (!gotTick) S.t = (typeof p.time === 'number' && isFinite(p.time)) ? p.time : 0;
  try {
    syncIdx();
    if (window.__onInit) window.__onInit(p);
  } catch (err) { S.err = String(err && err.message || err); }
}
function onTick(p){
  if (!p) return;
  gotTick = true;
  if (typeof p.time === 'number' && isFinite(p.time)) S.t = p.time;
  if (typeof p.playing === 'boolean') S.playing = p.playing;
  syncIdx();
}
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || typeof d !== 'object' || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') {
      var b = d.payload || {};
      S.beat = b.index ? b.index : (S.beat + 1);
      S.beatLevel = typeof b.level === 'number' ? b.level : 0.6;
      if (window.__onBeat) window.__onBeat(S.beatLevel, S.beat);
    } else if (d.type === 'live') {
      var v = d.payload || {};
      S.live = {
        bpm: v.bpm || 0, level: v.level || 0, bass: v.bass || 0,
        mid: v.mid || 0, treble: v.treble || 0
      };
      if (typeof v.playing === 'boolean') S.playing = v.playing;
      if (window.__onLive) window.__onLive(S.live);
    }
  } catch (err) { S.err = String(err && err.message || err); }
}, false);

/* ---------- frame loop ---------- */
function frame(ts){
  raf = requestAnimationFrame(frame);
  var t0 = performance.now();
  var dt = lastTs ? Math.min(64, ts - lastTs) : 16.7;
  lastTs = ts;
  try { syncIdx(); draw(ts, dt); if (window.__tickUI) window.__tickUI(); S.err = ''; }
  catch (err) { S.err = String(err && err.message || err); }
  S.frames++;
  S.js = performance.now() - t0;
}
raf = requestAnimationFrame(frame);

/* ---------- self-check ---------- */
window.__stage = function(){
  var ln = S.lines[S.idx];
  var tx = '';
  if (ln){
    if (ln.text != null) tx = String(ln.text);
    else if (ln.chars && ln.chars.length) {
      for (var i = 0; i < ln.chars.length; i++) tx += (ln.chars[i].c == null ? '' : String(ln.chars[i].c));
    }
  }
  return {
    lines: S.lines.length, idx: S.idx, t: S.t, playing: !!S.playing,
    frames: S.frames, js: S.js, err: S.err,
    text: tx,
    gl: S.gl, rm: S.rm
  };
};
setTimeout(ready, 150);
})();
</script>
