<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>骷髅不眠</title>
<style>
  :root{
    --cream:#f8e9c9;
    --ink:#150910;
    --magenta:#d8286c;
    --orange:#f07a25;
    --violet:#3d0f52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2a0a33}
  body{
    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
    color:var(--cream);
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none}
  #top{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:2vw;padding:clamp(10px,2.2vh,26px) clamp(14px,3vw,44px)}
  .plate{
    border:1px solid rgba(248,233,201,.55);
    background:rgba(21,9,16,.62);
    padding:.5em .8em;
  }
  #song{font-size:clamp(11px,1.15vw,15px);letter-spacing:.22em;text-transform:uppercase;color:#f7d9a6;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #mark{font-size:clamp(9px,.85vw,12px);letter-spacing:.34em;color:rgba(248,233,201,.72);white-space:nowrap}
  #mid{flex:1 1 auto;min-height:0}
  #bot{flex:0 0 auto;padding:0 clamp(8px,2.2vw,38px) calc(clamp(10px,2.4vh,28px) + env(safe-area-inset-bottom,0px))}
  #plaque{
    position:relative;margin:0 auto;max-width:min(1180px,94vw);
    background:
      repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 2px,rgba(0,0,0,0) 2px 4px),
      linear-gradient(180deg,rgba(16,6,13,.94),rgba(28,9,21,.965));
    border:1px solid rgba(248,233,201,.5);
    border-radius:2px;
    box-shadow:
      0 0 0 3px rgba(12,4,10,.72),
      0 0 0 4px rgba(248,233,201,.26),
      0 18px 44px rgba(10,2,10,.55);
    padding:clamp(13px,2.4vh,28px) clamp(16px,3vw,48px) clamp(15px,2.6vh,30px);
    text-align:center;overflow:hidden;opacity:0;transition:opacity .3s linear;
  }
  /* 牌匾顶部剪纸边饰 */
  #plaque::before{
    content:"";position:absolute;left:0;right:0;top:0;height:7px;
    background:
      radial-gradient(circle at 7px -1px, transparent 6px, rgba(247,178,60,.85) 6px 7.6px, transparent 8px) 0 0/14px 8px repeat-x;
    opacity:.75;pointer-events:none;
  }
  /* 牌匾四角万寿菊 */
  #plaque::after{
    content:"";position:absolute;inset:-2px;pointer-events:none;
    background:
      radial-gradient(circle at 0 0, rgba(240,122,37,.9) 0 5px, rgba(216,40,108,.75) 5px 8px, transparent 9px),
      radial-gradient(circle at 100% 0, rgba(240,122,37,.9) 0 5px, rgba(216,40,108,.75) 5px 8px, transparent 9px),
      radial-gradient(circle at 0 100%, rgba(240,122,37,.9) 0 5px, rgba(216,40,108,.75) 5px 8px, transparent 9px),
      radial-gradient(circle at 100% 100%, rgba(240,122,37,.9) 0 5px, rgba(216,40,108,.75) 5px 8px, transparent 9px);
  }
  #plaque.on{opacity:1}
  .ln{white-space:nowrap;overflow:hidden;text-overflow:clip}
  #prev,#next{
    font-size:clamp(10px,1.02vw,14px);line-height:1.5;letter-spacing:.09em;
    min-height:1.5em;opacity:.72;
  }
  #prev{color:#d9b283}
  #next{color:#cfe0d2}
  #cur{
    font-size:clamp(20px,3.3vw,44px);line-height:1.45;letter-spacing:.05em;
    color:#fdf3dd;font-weight:600;
    text-shadow:0 2px 0 rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.85),0 0 22px rgba(255,196,84,.16);
    margin:.18em 0;
  }
  #cur.wrap{
    white-space:normal;word-break:break-word;line-height:1.34;
    max-height:4.1em;overflow:hidden;
  }
  #cur .ch{color:rgba(248,233,201,.42);transition:color .14s linear}
  #cur .ch.lit{color:#fff6e2;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(255,186,72,.35)}
  #empty{display:none;color:rgba(248,233,201,.72);font-size:clamp(13px,1.45vw,18px);letter-spacing:.18em;padding:.55em 0}  body.noLyrics #empty{display:block}
  body.noLyrics #cur,body.noLyrics #prev,body.noLyrics #next{display:none}
  @media (max-width:520px){
    #prev,#next{font-size:11px}
    #cur{font-size:clamp(17px,5.6vw,26px)}
    #plaque{max-width:96vw;padding:14px 16px 16px}
  }
  @media (orientation:portrait){
    #top{gap:1.5vw;padding:2.4vh 4vw}
    #song{max-width:62vw;font-size:12px;letter-spacing:.16em}
  }
  @media (prefers-reduced-motion: reduce){#plaque{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="ui">
  <div id="top">
    <div id="song" class="plate">CALAVERA</div>
    <div id="mark" class="plate">DÍA DE MUERTOS · 481</div>
  </div>
  <div id="mid"></div>
  <div id="bot">
    <div id="plaque">
      <div id="prev" class="ln"></div>
      <div id="cur" class="ln"></div>
      <div id="next" class="ln"></div>
      <div id="empty">这首歌没有词 · 只留鼓与烛</div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';

  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d', {alpha:false});
  var el = {
    song: document.getElementById('song'),
    prev: document.getElementById('prev'),
    cur: document.getElementById('cur'),
    next: document.getElementById('next'),
    plaque: document.getElementById('plaque')
  };

  var W = 1440, H = 900, DPR = 1;
  var S = {
    lines: [], idx: -1, t: 0, playing: true, dur: 0,
    song: {name:'', artists:''}, accent: [216,40,108]
  };
  var frames = 0, lastJs = 0, errStr = '';
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ reduced = false; }

  // 自检口：无条件定义，直接由当前状态算
  window.__stage = function(){
    var n = S.lines.length, i = S.idx;
    var txt = '';
    if (i >= 0 && i < n){
      txt = S.lines[i] && typeof S.lines[i].text === 'string' ? S.lines[i].text : '';
    }
    return {
      lines: n,
      idx: i,
      t: S.t,
      playing: S.playing,
      frames: frames,
      js: lastJs,
      err: errStr,
      text: txt,
      gl: false,
      rm: reduced
    };
  };

  // ---------- 尺寸 ----------
  var view = { w: 1440, h: 900, dpr: 1, portrait: false, cx: 720, cy: 400, R: 210, pH: 0, topH: 60, availBot: 700 };
  function layout(){
    var w = view.w, h = view.h;
    view.portrait = h > w * 1.08;
    var base = Math.min(w, h);
    var pH = view.pH > 10 ? view.pH : Math.min(h * 0.30, 240);
    var topH = Math.max(h * 0.085, 54);
    var availBot = h - pH - Math.max(h * 0.035, 18);
    if (availBot < topH + base * 0.28) availBot = topH + base * 0.28;
    var availH = Math.max(base * 0.32, availBot - topH);

    view.R = Math.min(base * (view.portrait ? 0.345 : 0.240), availH / 2.45);
    view.cx = w * 0.5;
    view.cy = topH + availH * 0.505 + view.R * 0.06;
    view.topH = topH;
    view.availBot = availBot;
  }
  function measurePlaque(){
    var r = el.plaque.getBoundingClientRect();
    var hh = r && r.height ? r.height : 0;
    if (!isFinite(hh) || hh < 0) hh = 0;
    if (Math.abs(hh - view.pH) > 6){
      view.pH = hh;
      return true;
    }
    if (!view.pH) view.pH = hh;
    return false;
  }
  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    if (!(w > 1) || !isFinite(w)) w = 1440;
    if (!(h > 1) || !isFinite(h)) h = 900;
    view.w = w; view.h = h;
    DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    view.dpr = DPR;
    canvas.width = Math.max(1, Math.round(w * DPR));
    canvas.height = Math.max(1, Math.round(h * DPR));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    layout();
  }

  // ---------- 歌词 ----------
  function splitChars(text){
    var out = [], i, cp;
    if (typeof text !== 'string') return out;
    var max = Math.min(text.length, 220);
    for (i = 0; i < max; i++) out.push({ c: text.charAt(i), t: null });
    return out;
  }
  function normLines(raw){
    var out = [], i, L, n = Math.min(Array.isArray(raw) ? raw.length : 0, 400);
    for (i = 0; i < n; i++){
      L = raw[i] || {};
      var t = Number(L.t); if (!isFinite(t) || t < 0) t = 0;
      var dur = Number(L.dur); if (!isFinite(dur) || dur <= 0) dur = 0;
      var text = (typeof L.text === 'string') ? L.text : (L.text == null ? '' : String(L.text));
      var chars = null;
      if (Array.isArray(L.chars) && L.chars.length){
        chars = [];
        var m = Math.min(L.chars.length, text.length + 4);
        for (var k = 0; k < m; k++){
          var c = L.chars[k] || {};
          chars.push({ c: typeof c.c === 'string' ? c.c : '', t: Number(c.t) });
        }
      }
      out.push({ t: t, dur: dur, text: text, chars: chars });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    return out;
  }
  function findIdx(t){
    var L = S.lines, n = L.length;
    if (!n) return -1;
    if (t < L[0].t) return -1;
    var lo = 0, hi = n - 1, ans = -1, guard = 0;
    while (lo <= hi && guard++ < 64){
      var mid = (lo + hi) >> 1;
      if (L[mid].t <= t){ ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  var curIdx = -2;
  function buildLineDom(line){
    var box = el.cur;
    while (box.firstChild) box.removeChild(box.firstChild);
    if (!line || !line.text){ return []; }
    var spans = [];
    var text = line.text;
    var max = Math.min(text.length, 160);
    for (var i = 0; i < max; i++){
      var ch = text.charAt(i);
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch;
      box.appendChild(s);
      spans.push(s);
    }
    return spans;
  }
  var spans = [], litCount = -1;

  function applyLyric(){
    var lines = S.lines;
    if (!lines.length){
      document.body.classList.add('noLyrics');
      el.plaque.classList.add('on');
      el.prev.textContent = '';
      el.next.textContent = '';
      if (spans.length){ spans = []; while (el.cur.firstChild) el.cur.removeChild(el.cur.firstChild); }
      litCount = -1;
      return;
    }
    document.body.classList.remove('noLyrics');
    var i = S.idx;
    if (i === curIdx) return;
    curIdx = i;
    var line = (i >= 0 && i < lines.length) ? lines[i] : (lines.length ? lines[0] : null);
    if (i < 0 && lines.length){
      el.prev.textContent = '';
      el.next.textContent = lines.length > 1 ? (lines[1].text || '') : '';
    } else {
      el.prev.textContent = i > 0 ? (lines[i - 1].text || '') : '';
      el.next.textContent = (i + 1 < lines.length) ? (lines[i + 1].text || '') : '';
    }
    spans = buildLineDom(line);
    litCount = -1;
    fitLine();
    if (measurePlaque()){
      layout(); paintEyeGlow(); seedConf(); lastBob = 0;
      if (warmDone){ repaint(); }
      else { plate = null; rays = null; skull = null; guitar = null; candle = null; warmQueued = false; queueWarm(); }
    }
  }
  function fitLine(){
    var box = el.cur;
    box.style.fontSize = '';
    box.classList.remove('wrap');
    var w = box.clientWidth || 0;
    if (!w) return;
    var cs = window.getComputedStyle(box);
    var fs = parseFloat(cs.fontSize) || 30;
    var guard = 0;
    // 先尝试单行：按实测比例一次算到位
    if (box.scrollWidth > w){
      var want = Math.floor(fs * (w / Math.max(1, box.scrollWidth)) * 0.97);
      if (want >= 18){
        fs = want;
        box.style.fontSize = fs + 'px';
      } else {
        // 字太小就换行，而不是继续缩
        box.classList.add('wrap');
        fs = Math.max(16, Math.floor(fs * 0.78));
        box.style.fontSize = fs + 'px';
      }
    }
    while (guard++ < 6 && box.scrollWidth > w + 1 && fs > 12){
      fs = Math.max(12, Math.floor(fs * 0.93));
      box.style.fontSize = fs + 'px';
    }
    // 换行后仍溢出高度则继续缩
    guard = 0;
    while (guard++ < 5 && box.classList.contains('wrap') && box.scrollHeight > box.clientHeight + 1 && fs > 12){
      fs = Math.max(12, Math.floor(fs * 0.92));
      box.style.fontSize = fs + 'px';
    }
  }
  function updateLit(){
    var line = (S.idx >= 0 && S.idx < S.lines.length) ? S.lines[S.idx] : null;
    if (!line || !spans.length) return;
    var n = 0, i;
    if (line.chars && line.chars.length){
      for (i = 0; i < line.chars.length; i++){
        var ct = line.chars[i].t;
        if (isFinite(ct) && ct <= S.t) n++;
      }
    } else {
      var dur = line.dur > 0 ? line.dur : 3.4;
      var p = (S.t - line.t) / dur;
      if (!isFinite(p)) p = 0;
      if (p < 0) p = 0; if (p > 1) p = 1;
      n = Math.round(p * spans.length);
    }
    if (n < 0) n = 0;
    if (n > spans.length) n = spans.length;
    if (n === litCount) return;
    litCount = n;
    for (i = 0; i < spans.length; i++){
      var on = i < n;
      if (spans[i].classList.contains('lit') !== on) spans[i].classList.toggle('lit', on);
    }
  }

  // ---------- 视觉 ----------
  var C = {
    cream:'#f8e9c9', bone:'#f3ddb4', paper:'#f6e6c4', ink:'#1a0a13',
    magenta:'#d8286c', hot:'#ee3f86', orange:'#f07a25', gold:'#f7b23c',
    violet:'#3d0f52', plum:'#2a0a33', teal:'#1c7f6d', wine:'#7b0f3e'
  };
  var plate = null, rays = null, skull = null;
  var skullBox = {x:0, y:0, w:1, h:1};
  var raysSize = 1;
  var live = {bpm:0, level:0, bass:0, mid:0, treble:0, playing:true};
  var beatLvl = 0, beatT = 0;

  function mk(w, h){
    var c = document.createElement('canvas');
    var s = Math.max(1, Math.min(2, view.dpr || 1));
    c.width = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    var cx = c.getContext('2d');
    cx.setTransform(s, 0, 0, s, 0, 0);
    return c;
  }
  // 不做 DPR 缩放的原始画布（像素级贴图用）
  function mkRaw(w, h){
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  // 圆角矩形兜底（旧内核没有 roundRect）
  function rr(b, x, y, w, h, r){
    var rad = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    if (typeof b.roundRect === 'function'){ b.roundRect(x, y, w, h, rad); return; }
    b.moveTo(x + rad, y);
    b.lineTo(x + w - rad, y);
    b.quadraticCurveTo(x + w, y, x + w, y + rad);
    b.lineTo(x + w, y + h - rad);
    b.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    b.lineTo(x + rad, y + h);
    b.quadraticCurveTo(x, y + h, x, y + h - rad);
    b.lineTo(x, y + rad);
    b.quadraticCurveTo(x, y, x + rad, y);
  }

  // 纸纹
  function grainTile(){
    var c = mkRaw(160, 160), b = c.getContext('2d');
    var img = b.createImageData(160, 160), d = img.data, i;
    for (i = 0; i < d.length; i += 4){
      var v = 110 + ((Math.random() * 90) | 0);
      d[i] = v; d[i+1] = v * 0.92; d[i+2] = v * 0.78; d[i+3] = 255;
    }
    b.putImageData(img, 0, 0);
    return c;
  }

  function leafPath(b, x, y, s, rot){
    b.save(); b.translate(x, y); b.rotate(rot);
    b.beginPath();
    b.moveTo(0, -s);
    b.bezierCurveTo(s * 0.62, -s * 0.5, s * 0.62, s * 0.5, 0, s);
    b.bezierCurveTo(-s * 0.62, s * 0.5, -s * 0.62, -s * 0.5, 0, -s);
    b.closePath();
    b.restore();
  }

  // ---- 版画底：渐变 + 同心线 + 剪纸幡 + 万寿菊 + 仙人掌 ----
  // 把封面主色混进民俗底色：accent 决定中段色相，明暗仍忠于亡灵节
  function mix(a, b, t){
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return [Math.max(0, Math.min(255, r)), Math.max(0, Math.min(255, g)), Math.max(0, Math.min(255, bl))];
  }
  function rgb(c){ return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }
  function accentPal(){
    var a = S.accent || [216, 40, 108];
    var lum = (a[0] * 0.299 + a[1] * 0.587 + a[2] * 0.114) / 255;
    var deep = mix(a, [24, 6, 30], 0.72);
    var mid = mix(a, [184, 29, 95], 0.45);
    var warm = mix([240, 122, 37], a, 0.35);
    if (lum > 0.72){ mid = mix(mid, [150, 20, 80], 0.35); }
    return { deep: deep, mid: mid, warm: warm };
  }

  function paintPlate(){
    var w = view.w, h = view.h, R = view.R;
    var np = mk(w, h);
    var b = np.getContext('2d');
    var pal = accentPal();

    var g = b.createLinearGradient(0, 0, w * 0.55, h);
    g.addColorStop(0, rgb(pal.deep));
    g.addColorStop(0.30, rgb(mix(pal.deep, pal.mid, 0.55)));
    g.addColorStop(0.60, rgb(pal.mid));
    g.addColorStop(0.84, rgb(mix(pal.mid, pal.warm, 0.72)));
    g.addColorStop(1, rgb(pal.warm));
    b.fillStyle = g;
    b.fillRect(0, 0, w, h);

    // 两块大色斑，模拟套色错位
    b.globalCompositeOperation = 'lighter';
    var rg = b.createRadialGradient(w * 0.18, h * 0.16, 0, w * 0.18, h * 0.16, Math.max(w, h) * 0.55);
    rg.addColorStop(0, 'rgba(238,63,134,.42)'); rg.addColorStop(1, 'rgba(238,63,134,0)');
    b.fillStyle = rg; b.fillRect(0, 0, w, h);
    var rg2 = b.createRadialGradient(w * 0.88, h * 0.92, 0, w * 0.88, h * 0.92, Math.max(w, h) * 0.6);
    rg2.addColorStop(0, 'rgba(255,190,60,.40)'); rg2.addColorStop(1, 'rgba(255,190,60,0)');
    b.fillStyle = rg2; b.fillRect(0, 0, w, h);
    b.globalCompositeOperation = 'source-over';

    // 纸纹
    var gp = b.createPattern(grainTile(), 'repeat');
    b.save(); b.globalAlpha = 0.16; b.globalCompositeOperation = 'overlay';
    b.fillStyle = gp; b.fillRect(0, 0, w, h); b.restore();

    // 同心刻线
    b.save();
    b.lineWidth = Math.max(1, R * 0.006);
    var cx = view.cx, cy = view.cy;
    var rings = [1.35, 1.55, 1.75, 1.98, 2.22];
    for (var ri = 0; ri < rings.length; ri++){
      b.strokeStyle = ri % 2 ? 'rgba(248,233,201,.16)' : 'rgba(26,10,19,.20)';
      b.setLineDash(ri % 2 ? [R * 0.02, R * 0.045] : [R * 0.05, R * 0.03]);
      b.beginPath(); b.arc(cx, cy, R * rings[ri], 0, Math.PI * 2); b.stroke();
    }
    b.setLineDash([]);
    b.restore();

    // 万寿菊花环（骷髅外缘的三角花瓣）
    b.save(); b.translate(cx, cy);
    var petals = 26;
    for (var p = 0; p < petals; p++){
      var a = (p / petals) * Math.PI * 2 - Math.PI / 2;
      var rr = R * 1.16;
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      b.save(); b.translate(px, py); b.rotate(a + Math.PI / 2);
      b.beginPath();
      b.moveTo(0, -R * 0.10);
      b.quadraticCurveTo(R * 0.075, R * 0.02, 0, R * 0.105);
      b.quadraticCurveTo(-R * 0.075, R * 0.02, 0, -R * 0.10);
      b.closePath();
      b.fillStyle = p % 3 === 0 ? C.magenta : (p % 3 === 1 ? C.orange : C.gold);
      b.globalAlpha = 0.92; b.fill();
      b.globalAlpha = 1; b.lineWidth = Math.max(1, R * 0.007); b.strokeStyle = 'rgba(26,10,19,.55)'; b.stroke();
      b.restore();
    }
    b.restore();

    // 剪纸幡（papel picado）
    papel(b, w * 0.10, h * 0.045, Math.min(R * 0.52, w * 0.1), 'rgba(248,233,201,.86)');
    papel(b, w * 0.27, h * 0.028, Math.min(R * 0.44, w * 0.09), 'rgba(238,63,134,.9)');
    papel(b, w * 0.90, h * 0.045, Math.min(R * 0.52, w * 0.1), 'rgba(248,233,201,.86)');
    papel(b, w * 0.73, h * 0.028, Math.min(R * 0.44, w * 0.09), 'rgba(247,178,60,.92)');

    // 圣心（两侧，窄屏收拢）
    var hx = Math.min(w * 0.055 + R * 0.30, w * 0.5 - R * 1.05);
    heart(b, hx, view.cy - R * 0.12, R * 0.30, 0.92);
    heart(b, w - hx, view.cy - R * 0.12, R * 0.26, 0.82);

    // 仙人掌
    cactus(b, Math.min(w * 0.055 + R * 0.12, w * 0.5 - R * 1.20), h * 0.80, R * 0.52);
    cactus(b, w - Math.min(w * 0.045 + R * 0.10, w * 0.5 - R * 1.20), h * 0.86, R * 0.38);

    // 静态碎纸
    var conf = [C.orange, C.magenta, C.cream, C.gold, C.teal];
    var seed = 7;
    function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var k = 0; k < 64; k++){
      var x = rnd() * w, y = rnd() * h;
      var dx = (x - cx) / (R * 1.3), dy = (y - cy) / (R * 1.35);
      if (dx * dx + dy * dy < 1) continue;
      var s = R * (0.012 + rnd() * 0.028);
      b.save(); b.translate(x, y); b.rotate(rnd() * Math.PI);
      b.fillStyle = conf[(rnd() * conf.length) | 0];
      b.globalAlpha = 0.5 + rnd() * 0.4;
      b.fillRect(-s, -s * 0.55, s * 2, s * 1.1);
      b.restore();
    }

    // 边线与暗角
    b.save();
    b.globalAlpha = 0.9;
    var vg = b.createRadialGradient(cx, cy, Math.min(w, h) * 0.34, cx, cy, Math.max(w, h) * 0.86);
    vg.addColorStop(0, 'rgba(20,4,20,0)'); vg.addColorStop(1, 'rgba(20,4,20,.52)');
    b.fillStyle = vg; b.fillRect(0, 0, w, h);
    b.strokeStyle = 'rgba(248,233,201,.20)';
    b.lineWidth = Math.max(1, Math.min(w, h) * 0.0016);
    b.strokeRect(w * 0.018, h * 0.018, w * 0.964, h * 0.964);
    b.restore();

    plate = np;
  }

  function papel(b, x, y, s, col){
    var w = s * 0.9, h = s * 1.25;
    var tmp = mkRaw(w + 4, h + 4), t = tmp.getContext('2d');
    t.translate(2, 2);
    t.fillStyle = col;
    t.beginPath();
    t.moveTo(0, 0); t.lineTo(w, 0);
    t.lineTo(w, h * 0.78);
    t.quadraticCurveTo(w * 0.5, h * 1.12, 0, h * 0.78);
    t.closePath(); t.fill();
    // 镂空
    t.globalCompositeOperation = 'destination-out';
    var cols = 3, rows = 3, i, j;
    for (i = 0; i < cols; i++){
      for (j = 0; j < rows; j++){
        var px = w * (0.5 / cols + i / cols), py = h * (0.16 + j * 0.22);
        t.beginPath(); t.arc(px, py, Math.min(w, h) * 0.055, 0, Math.PI * 2); t.fill();
        if (j < 2){
          t.beginPath();
          t.moveTo(px - w * 0.06, py + h * 0.09);
          t.lineTo(px + w * 0.06, py + h * 0.09);
          t.lineTo(px, py + h * 0.155);
          t.closePath(); t.fill();
        }
      }
    }
    t.globalCompositeOperation = 'source-over';
    b.save();
    b.globalAlpha = 0.95;
    b.drawImage(tmp, x - w / 2, y - 4);
    b.strokeStyle = 'rgba(26,10,19,.35)'; b.lineWidth = 1.4;
    b.strokeRect(x - w / 2, y - 4, w, h * 0.9);
    b.restore();
  }

  function heart(b, x, y, s, alpha){
    b.save(); b.translate(x, y); b.globalAlpha = alpha;
    // 火焰
    for (var f = 0; f < 3; f++){
      var fx = (f - 1) * s * 0.42, fh = s * (0.72 - Math.abs(f - 1) * 0.16);
      b.beginPath();
      b.moveTo(fx, -s * 0.62);
      b.bezierCurveTo(fx + s * 0.30, -s * 0.72 - fh * 0.5, fx + s * 0.16, -s * 1.05 - fh * 0.5, fx, -s * 0.86 - fh * 0.4);
      b.bezierCurveTo(fx - s * 0.16, -s * 1.05 - fh * 0.5, fx - s * 0.30, -s * 0.72 - fh * 0.5, fx, -s * 0.62);
      b.closePath();
      b.fillStyle = f === 1 ? 'rgba(255,205,92,.95)' : 'rgba(240,122,37,.85)';
      b.fill();
    }
    // 心
    b.beginPath();
    b.moveTo(0, s * 0.70);
    b.bezierCurveTo(-s * 0.34, s * 0.40, -s * 0.86, s * 0.02, -s * 0.52, -s * 0.34);
    b.bezierCurveTo(-s * 0.26, -s * 0.60, 0, -s * 0.36, 0, -s * 0.18);
    b.bezierCurveTo(0, -s * 0.36, s * 0.26, -s * 0.60, s * 0.52, -s * 0.34);
    b.bezierCurveTo(s * 0.86, s * 0.02, s * 0.34, s * 0.40, 0, s * 0.70);
    b.closePath();
    b.fillStyle = C.wine; b.fill();
    b.lineWidth = Math.max(1.2, s * 0.075); b.strokeStyle = 'rgba(248,233,201,.85)'; b.stroke();
    // 心内纹
    b.strokeStyle = 'rgba(248,233,201,.55)'; b.lineWidth = Math.max(1, s * 0.045);
    for (var i = 0; i < 3; i++){
      b.beginPath();
      b.moveTo(-s * 0.22, -s * 0.02 + i * s * 0.16);
      b.quadraticCurveTo(0, s * 0.10 + i * s * 0.16, s * 0.22, -s * 0.02 + i * s * 0.16);
      b.stroke();
    }
    b.restore();
  }

  function cactus(b, x, y, s){
    b.save(); b.translate(x, y); b.globalAlpha = 0.95;
    b.fillStyle = '#123c34';
    b.strokeStyle = 'rgba(248,233,201,.6)';
    b.lineWidth = Math.max(1.2, s * 0.035);
    b.beginPath();
    b.moveTo(-s * 0.22, 0);
    b.lineTo(-s * 0.22, -s * 1.0);
    b.quadraticCurveTo(-s * 0.22, -s * 1.2, 0, -s * 1.2);
    b.quadraticCurveTo(s * 0.22, -s * 1.2, s * 0.22, -s * 1.0);
    b.lineTo(s * 0.22, 0);
    b.closePath(); b.fill(); b.stroke();
    // 手臂
    b.beginPath();
    b.moveTo(-s * 0.22, -s * 0.62);
    b.lineTo(-s * 0.52, -s * 0.62);
    b.quadraticCurveTo(-s * 0.62, -s * 0.70, -s * 0.62, -s * 0.86);
    b.stroke();
    b.beginPath();
    b.moveTo(s * 0.22, -s * 0.78);
    b.lineTo(s * 0.50, -s * 0.78);
    b.quadraticCurveTo(s * 0.60, -s * 0.86, s * 0.60, -s * 1.02);
    b.stroke();
    // 刺
    b.strokeStyle = 'rgba(248,233,201,.35)';
    b.lineWidth = Math.max(1, s * 0.02);
    for (var i = 0; i < 7; i++){
      var yy = -s * (0.12 + i * 0.135);
      b.beginPath(); b.moveTo(-s * 0.22, yy); b.lineTo(-s * 0.34, yy - s * 0.05); b.stroke();
      b.beginPath(); b.moveTo(s * 0.22, yy + s * 0.05); b.lineTo(s * 0.34, yy); b.stroke();
    }
    b.restore();
  }

  // ---- 旋转放射线 ----
  function paintRays(){
    var R = view.R;
    var ns = Math.ceil(R * 4.6);
    var nc = mk(ns, ns);
    var b = nc.getContext('2d');
    var c = ns / 2, n = 30;
    b.translate(c, c);
    for (var i = 0; i < n; i++){
      if (i % 2) continue;
      var a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      b.beginPath();
      b.moveTo(0, 0);
      b.lineTo(Math.cos(a0) * c, Math.sin(a0) * c);
      b.lineTo(Math.cos(a1) * c, Math.sin(a1) * c);
      b.closePath();
      b.fillStyle = 'rgba(248,233,201,.075)';
      b.fill();
    }
    rays = nc;
    raysSize = ns;
  }

  // ---- 骷髅木刻 ----
  function headPath(b, r){
    b.beginPath();
    b.moveTo(0, -r * 0.62);
    b.bezierCurveTo(-r * 0.86, -r * 0.62, -r * 0.96, -r * 0.02, -r * 0.80, r * 0.30);
    b.bezierCurveTo(-r * 0.70, r * 0.56, -r * 0.50, r * 0.58, -r * 0.42, r * 0.74);
    b.bezierCurveTo(-r * 0.26, r * 0.94, r * 0.26, r * 0.94, r * 0.42, r * 0.74);
    b.bezierCurveTo(r * 0.50, r * 0.58, r * 0.70, r * 0.56, r * 0.80, r * 0.30);
    b.bezierCurveTo(r * 0.96, -r * 0.02, r * 0.86, -r * 0.62, 0, -r * 0.62);
    b.closePath();
  }

  function paintSkull(){
    var r = view.R;
    var bw = r * 3.1, bh = r * 3.5;
    skull = mk(bw, bh);
    var b = skull.getContext('2d');
    b.translate(bw / 2, bh / 2 + r * 0.28);
    var lw = Math.max(1.6, r * 0.032);

    // 头骨
    headPath(b, r);
    b.fillStyle = C.bone; b.fill();
    b.lineWidth = lw; b.strokeStyle = C.ink; b.stroke();

    // 内部排线（刻版感）
    b.save();
    headPath(b, r); b.clip();
    b.strokeStyle = 'rgba(26,10,19,.16)';
    b.lineWidth = Math.max(1, r * 0.012);
    for (var y = -r * 0.60; y < r * 0.92; y += r * 0.055){
      b.beginPath();
      b.moveTo(-r, y);
      for (var x = -r; x <= r; x += r * 0.1){
        b.lineTo(x, y + Math.sin((x / r) * 5.2 + y * 0.05) * r * 0.012);
      }
      b.stroke();
    }
    // 点刻
    b.fillStyle = 'rgba(26,10,19,.20)';
    for (var i = 0; i < 130; i++){
      var ax = (Math.random() * 2 - 1) * r * 0.82;
      var ay = (Math.random() * 2 - 1) * r * 0.78;
      if (ax * ax / (r * r) + ay * ay / (r * r * 1.1) > 0.72) continue;
      b.fillRect(ax, ay, r * 0.012, r * 0.012);
    }
    b.restore();

    // 眼窝
    var eyes = [[-r * 0.38, -r * 0.10, -0.12], [r * 0.38, -r * 0.10, 0.12]];
    for (var e = 0; e < 2; e++){
      var ex = eyes[e][0], ey = eyes[e][1];
      b.save(); b.translate(ex, ey); b.rotate(eyes[e][2]);
      b.beginPath(); b.ellipse(0, 0, r * 0.255, r * 0.30, 0, 0, Math.PI * 2);
      b.fillStyle = C.ink; b.fill();
      b.lineWidth = Math.max(1, r * 0.014); b.strokeStyle = 'rgba(26,10,19,.9)'; b.stroke();
      // 眼里万寿菊
      b.globalCompositeOperation = 'source-over';
      for (var k = 3; k >= 1; k--){
        b.beginPath();
        b.ellipse(0, r * 0.015, r * 0.062 * k, r * 0.072 * k, 0, 0, Math.PI * 2);
        b.strokeStyle = k === 1 ? 'rgba(247,178,60,.95)' : (k === 2 ? 'rgba(240,122,37,.8)' : 'rgba(216,40,108,.7)');
        b.lineWidth = Math.max(1.2, r * 0.018);
        b.stroke();
      }
      b.beginPath(); b.arc(0, r * 0.015, r * 0.028, 0, Math.PI * 2);
      b.fillStyle = 'rgba(247,178,60,.9)'; b.fill();
      // 眉骨刻线
      b.beginPath();
      b.moveTo(-r * 0.30, -r * 0.34);
      b.quadraticCurveTo(0, -r * 0.46, r * 0.30, -r * 0.34);
      b.strokeStyle = 'rgba(26,10,19,.55)';
      b.lineWidth = Math.max(1.2, r * 0.018);
      b.stroke();
      b.restore();
    }

    // 鼻腔
    b.beginPath();
    b.moveTo(0, r * 0.10);
    b.bezierCurveTo(-r * 0.10, r * 0.22, -r * 0.13, r * 0.30, 0, r * 0.34);
    b.bezierCurveTo(r * 0.13, r * 0.30, r * 0.10, r * 0.22, 0, r * 0.10);
    b.closePath();
    b.fillStyle = C.ink; b.fill();

    // 牙
    var tw = r * 0.66, ty = r * 0.52, th = r * 0.28;
    b.beginPath();
    b.moveTo(-tw / 2, ty); b.lineTo(tw / 2, ty);
    b.quadraticCurveTo(tw * 0.56, ty + th * 0.7, tw * 0.30, ty + th);
    b.lineTo(-tw * 0.30, ty + th);
    b.quadraticCurveTo(-tw * 0.56, ty + th * 0.7, -tw / 2, ty);
    b.closePath();
    b.fillStyle = C.ink; b.fill();
    b.strokeStyle = 'rgba(243,221,180,.9)';
    b.lineWidth = Math.max(1, r * 0.016);
    for (var s = 1; s < 7; s++){
      var sx = -tw / 2 + (tw * s) / 7;
      b.beginPath(); b.moveTo(sx, ty + th * 0.12); b.lineTo(sx, ty + th * 0.86); b.stroke();
    }
    b.beginPath(); b.moveTo(-tw * 0.42, ty + th * 0.5); b.lineTo(tw * 0.42, ty + th * 0.5); b.stroke();

    // 面颊排线
    b.strokeStyle = 'rgba(26,10,19,.45)';
    b.lineWidth = Math.max(1, r * 0.014);
    for (var ck = 0; ck < 3; ck++){
      var oy = r * (0.30 + ck * 0.075);
      b.beginPath(); b.moveTo(-r * 0.66, oy); b.lineTo(-r * 0.50, oy - r * 0.05); b.stroke();
      b.beginPath(); b.moveTo(r * 0.66, oy); b.lineTo(r * 0.50, oy - r * 0.05); b.stroke();
    }

    // 额心小花
    b.save(); b.translate(0, -r * 0.36);
    for (var pn = 0; pn < 8; pn++){
      b.save(); b.rotate((pn / 8) * Math.PI * 2);
      leafPath(b, 0, -r * 0.072, r * 0.048, 0);
      b.fillStyle = pn % 2 ? 'rgba(240,122,37,.92)' : 'rgba(216,40,108,.92)';
      b.fill();
      b.lineWidth = Math.max(1, r * 0.008); b.strokeStyle = 'rgba(26,10,19,.5)'; b.stroke();
      b.restore();
    }
    b.beginPath(); b.arc(0, 0, r * 0.04, 0, Math.PI * 2);
    b.fillStyle = 'rgba(247,178,60,1)'; b.fill();
    b.restore();

    // 宽边帽
    b.save();
    var brimY = -r * 0.60;
    b.beginPath();
    b.ellipse(0, brimY, r * 1.40, r * 0.235, 0, 0, Math.PI * 2);
    b.fillStyle = '#2b0b3a'; b.fill();
    b.lineWidth = lw; b.strokeStyle = C.ink; b.stroke();
    b.beginPath();
    b.ellipse(0, brimY - r * 0.02, r * 1.40, r * 0.235, 0, Math.PI * 1.03, Math.PI * 1.97);
    b.strokeStyle = 'rgba(248,233,201,.55)'; b.lineWidth = Math.max(1, r * 0.016); b.stroke();
    // 帽冠
    b.beginPath();
    b.moveTo(-r * 0.60, brimY + r * 0.02);
    b.bezierCurveTo(-r * 0.62, brimY - r * 0.75, r * 0.62, brimY - r * 0.75, r * 0.60, brimY + r * 0.02);
    b.closePath();
    b.fillStyle = '#331046'; b.fill();
    b.lineWidth = lw; b.strokeStyle = C.ink; b.stroke();
    // 帽带
    b.beginPath();
    b.moveTo(-r * 0.605, brimY - r * 0.10);
    b.quadraticCurveTo(0, brimY - r * 0.03, r * 0.605, brimY - r * 0.10);
    b.lineTo(r * 0.60, brimY - r * 0.02);
    b.quadraticCurveTo(0, brimY + r * 0.05, -r * 0.605, brimY - r * 0.02);
    b.closePath();
    b.fillStyle = C.gold; b.fill();
    b.strokeStyle = 'rgba(26,10,19,.7)'; b.lineWidth = Math.max(1, r * 0.012); b.stroke();
    // 帽冠纹
    b.strokeStyle = 'rgba(248,233,201,.35)';
    b.lineWidth = Math.max(1, r * 0.012);
    for (var hh = 1; hh <= 3; hh++){
      b.beginPath();
      b.moveTo(-r * 0.46 + hh * r * 0.02, brimY - r * 0.16);
      b.quadraticCurveTo(0, brimY - r * 0.30 - hh * r * 0.10, r * 0.46 - hh * r * 0.02, brimY - r * 0.16);
      b.stroke();
    }
    // 帽檐上的小花
    for (var fm = 0; fm < 2; fm++){
      var fx2 = (fm ? 1 : -1) * r * 0.72;
      b.save(); b.translate(fx2, brimY - r * 0.10);
      for (var q = 0; q < 6; q++){
        b.save(); b.rotate((q / 6) * Math.PI * 2);
        leafPath(b, 0, -r * 0.045, r * 0.032, 0);
        b.fillStyle = fm ? 'rgba(238,63,134,.95)' : 'rgba(247,178,60,.95)';
        b.fill(); b.restore();
      }
      b.beginPath(); b.arc(0, 0, r * 0.02, 0, Math.PI * 2);
      b.fillStyle = C.ink; b.fill();
      b.restore();
    }
    b.restore();

    skullBox.x = view.cx - bw / 2;
    skullBox.y = view.cy - bh / 2 - r * 0.08;
    skullBox.w = bw; skullBox.h = bh;
  }

  function repaint(){
    paintPlate();
    paintRays();
    paintGuitar();
    paintSkull();
    paintCandle();
  }

  // ---- 木吉他 ----
  var guitar = null, guitarBox = {w:1, h:1};
  function paintGuitar(){
    var R = view.R;
    var gw = R * 2.7, gh = R * 4.2;
    guitar = mk(gw, gh);
    var b = guitar.getContext('2d');
    b.translate(gw / 2, gh * 0.70);
    var lw = Math.max(1.6, R * 0.030);

    // 琴箱
    b.beginPath();
    b.moveTo(0, -R * 0.92);
    b.bezierCurveTo(R * 0.62, -R * 0.92, R * 0.80, -R * 0.44, R * 0.56, -R * 0.10);
    b.bezierCurveTo(R * 0.98, R * 0.16, R * 0.98, R * 0.86, R * 0.50, R * 1.02);
    b.bezierCurveTo(R * 0.16, R * 1.14, -R * 0.16, R * 1.14, -R * 0.50, R * 1.02);
    b.bezierCurveTo(-R * 0.98, R * 0.86, -R * 0.98, R * 0.16, -R * 0.56, -R * 0.10);
    b.bezierCurveTo(-R * 0.80, -R * 0.44, -R * 0.62, -R * 0.92, 0, -R * 0.92);
    b.closePath();
    var wg = b.createLinearGradient(-R * 0.9, 0, R * 0.9, 0);
    wg.addColorStop(0, '#5a2a12'); wg.addColorStop(0.45, '#c4712c'); wg.addColorStop(1, '#7c3a16');
    b.fillStyle = wg; b.fill();
    b.lineWidth = lw; b.strokeStyle = C.ink; b.stroke();

    // 音孔 + 花环
    b.beginPath(); b.arc(0, -R * 0.30, R * 0.30, 0, Math.PI * 2);
    b.fillStyle = C.ink; b.fill();
    b.lineWidth = Math.max(1.4, R * 0.022); b.strokeStyle = 'rgba(248,233,201,.85)'; b.stroke();
    for (var ring = 0; ring < 3; ring++){
      b.beginPath(); b.arc(0, -R * 0.30, R * (0.36 + ring * 0.055), 0, Math.PI * 2);
      b.strokeStyle = ring % 2 ? 'rgba(247,178,60,.75)' : 'rgba(216,40,108,.75)';
      b.lineWidth = Math.max(1, R * 0.016); b.stroke();
    }
    // 琴桥
    b.fillStyle = '#2b1208';
    b.fillRect(-R * 0.26, R * 0.50, R * 0.52, R * 0.10);
    b.strokeStyle = 'rgba(248,233,201,.5)'; b.lineWidth = Math.max(1, R * 0.010); b.strokeRect(-R * 0.26, R * 0.50, R * 0.52, R * 0.10);

    // 琴颈
    b.beginPath();
    b.moveTo(-R * 0.16, -R * 0.92);
    b.lineTo(-R * 0.13, -R * 2.34);
    b.lineTo(R * 0.13, -R * 2.34);
    b.lineTo(R * 0.16, -R * 0.92);
    b.closePath();
    b.fillStyle = '#3d1c0c'; b.fill();
    b.lineWidth = Math.max(1.2, R * 0.024); b.strokeStyle = C.ink; b.stroke();

    // 品位
    b.strokeStyle = 'rgba(248,233,201,.45)'; b.lineWidth = Math.max(1, R * 0.008);
    for (var f = 1; f <= 7; f++){
      var fy = -R * (0.92 + f * 0.195);
      b.beginPath(); b.moveTo(-R * 0.15, fy); b.lineTo(R * 0.15, fy); b.stroke();
    }
    // 琴头
    b.beginPath();
    rr(b, -R * 0.20, -R * 2.62, R * 0.40, R * 0.34, R * 0.07);
    b.fillStyle = '#4a2410'; b.fill();
    b.lineWidth = Math.max(1.2, R * 0.024); b.strokeStyle = C.ink; b.stroke();
    b.fillStyle = C.gold;
    for (var pv = 0; pv < 3; pv++){
      b.beginPath(); b.arc(-R * 0.10, -R * (2.52 - pv * 0.10), R * 0.026, 0, Math.PI * 2); b.fill();
      b.beginPath(); b.arc(R * 0.10, -R * (2.52 - pv * 0.10), R * 0.026, 0, Math.PI * 2); b.fill();
    }
    // 弦
    b.strokeStyle = 'rgba(252,240,214,.82)'; b.lineWidth = Math.max(1, R * 0.008);
    for (var s = 0; s < 5; s++){
      var sx = -R * 0.11 + (s / 4) * R * 0.22;
      b.beginPath(); b.moveTo(sx, -R * 2.40); b.lineTo(sx, R * 0.55); b.stroke();
    }

    // 琴身上的万寿菊贴花
    for (var fl = 0; fl < 2; fl++){
      var fx = (fl ? 1 : -1) * R * 0.48, fy2 = fl ? R * 0.42 : -R * 0.70;
      b.save(); b.translate(fx, fy2);
      for (var q = 0; q < 7; q++){
        b.save(); b.rotate((q / 7) * Math.PI * 2);
        leafPath(b, 0, -R * 0.085, R * 0.058, 0);
        b.fillStyle = fl ? 'rgba(240,122,37,.95)' : 'rgba(216,40,108,.95)';
        b.fill(); b.restore();
      }
      b.beginPath(); b.arc(0, 0, R * 0.045, 0, Math.PI * 2);
      b.fillStyle = C.gold; b.fill();
      b.restore();
    }

    guitarBox.ox = gw / 2;
    guitarBox.oy = gh * 0.70;
    guitarBox.w = gw; guitarBox.h = gh;
  }

  // ---- 蜡烛 ----
  var candle = null, candleBox = {w:1, h:1};
  function paintCandle(){
    var R = view.R;
    var cw = R * 0.62, chh = R * 1.9;
    candle = mk(cw, chh);
    var b = candle.getContext('2d');
    b.translate(cw / 2, chh - 2);
    // 蜡烛体
    b.beginPath();
    rr(b, -cw * 0.30, -R * 0.98, cw * 0.60, R * 0.98, cw * 0.12);
    b.fillStyle = '#f2e0bd'; b.fill();
    b.lineWidth = Math.max(1.2, R * 0.022); b.strokeStyle = C.ink; b.stroke();
    // 蜡流
    b.beginPath();
    b.moveTo(-cw * 0.30, -R * 0.98);
    b.quadraticCurveTo(-cw * 0.10, -R * 0.86, -cw * 0.02, -R * 0.70);
    b.quadraticCurveTo(cw * 0.06, -R * 0.90, cw * 0.30, -R * 0.96);
    b.strokeStyle = 'rgba(26,10,19,.35)'; b.lineWidth = Math.max(1, R * 0.014); b.stroke();
    // 骷髅画在蜡上
    b.beginPath(); b.arc(0, -R * 0.52, R * 0.09, 0, Math.PI * 2);
    b.fillStyle = C.ink; b.fill();
    b.fillStyle = C.gold;
    b.beginPath(); b.arc(-R * 0.032, -R * 0.545, R * 0.017, 0, Math.PI * 2); b.fill();
    b.beginPath(); b.arc(R * 0.032, -R * 0.545, R * 0.017, 0, Math.PI * 2); b.fill();
    // 芯
    b.strokeStyle = C.ink; b.lineWidth = Math.max(1, R * 0.014);
    b.beginPath(); b.moveTo(0, -R * 0.98); b.lineTo(0, -R * 1.06); b.stroke();
    // 焰
    var fg = b.createRadialGradient(0, -R * 1.16, 0, 0, -R * 1.16, R * 0.20);
    fg.addColorStop(0, 'rgba(255,246,206,1)');
    fg.addColorStop(0.45, 'rgba(247,178,60,.95)');
    fg.addColorStop(1, 'rgba(240,122,37,0)');
    b.beginPath();
    b.moveTo(0, -R * 1.30);
    b.bezierCurveTo(R * 0.12, -R * 1.18, R * 0.10, -R * 1.02, 0, -R * 1.02);
    b.bezierCurveTo(-R * 0.10, -R * 1.02, -R * 0.12, -R * 1.18, 0, -R * 1.30);
    b.closePath();
    b.fillStyle = fg; b.fill();
    candleBox.w = cw; candleBox.h = chh;
  }

  function drawCandles(now, bob){
    if (!candle) return;
    var R = view.R;
    var tsec = now * 0.001;
    var fl = reduced ? 0 : Math.sin(tsec * 8.1) * R * 0.006 + Math.sin(tsec * 13.3) * R * 0.004;
    var pos = [
      [view.cx - R * 1.98, view.cy + R * 0.90],
      [view.cx + R * 1.98, view.cy + R * 0.96]
    ];
    for (var i = 0; i < 2; i++){
      var x = pos[i][0], y = pos[i][1] + bob * 0.4 + fl * (i ? 1 : -1);
      var s = (i ? 1 : 0.92) * R / 1.0;
      var dw = candleBox.w * (s / R), dh = candleBox.h * (s / R);
      ctx.drawImage(candle, x - dw / 2, y - dh, dw * 1.0, dh);
    }
  }

  var eyeGlow = null, lastBob = 0;
  function paintEyeGlow(){
    var s = 256;
    eyeGlow = mk(s, s);
    var b = eyeGlow.getContext('2d');
    var g = b.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,240,190,1)');
    g.addColorStop(0.22, 'rgba(255,196,84,.92)');
    g.addColorStop(0.52, 'rgba(240,122,37,.42)');
    g.addColorStop(1, 'rgba(216,40,108,0)');
    b.fillStyle = g;
    b.fillRect(0, 0, s, s);
  }

  function paintEyes(now){
    if (!eyeGlow || !skull) return;
    var r = view.R;
    var tsec = now * 0.001;
    var bass = live.bass || 0;
    var flick = 0.72 + Math.sin(tsec * 7.3) * 0.06 + Math.sin(tsec * 3.1) * 0.05;
    var a = Math.min(1, 0.55 + bass * 0.35 + beatLvl * 0.25) * flick;
    var sz = r * 1.05 * (1 + bass * 0.10);
    var ey = view.cy + r * 0.10 + lastBob;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.55;
    ctx.drawImage(eyeGlow, view.cx - r * 0.38 - sz / 2, ey - sz / 2, sz, sz);
    ctx.drawImage(eyeGlow, view.cx + r * 0.38 - sz / 2, ey - sz / 2, sz, sz);
    ctx.restore();
  }

  // ---- 动态碎纸 ----
  var conf = [];
  function seedConf(){
    conf = [];
    var n = Math.min(40, Math.round(Math.max(view.w, view.h) / 32));
    for (var i = 0; i < n; i++){
      conf.push({
        x: Math.random(), y: Math.random(),
        s: 0.008 + Math.random() * 0.018,
        v: 0.016 + Math.random() * 0.040,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 2.2,
        col: [C.orange, C.magenta, C.cream, C.gold][(Math.random() * 4) | 0],
        ph: Math.random() * 6.28
      });
    }
  }

  // ---- 预热：ready 之后拆帧渲染离屏层，避免卡首帧 ----
  var warmQueued = false, warmDone = false, warmRunning = false, warmPending = false;
  var warmSteps = [];
  function warmList(){
    return [
      function(){ paintPlate(); },
      function(){ paintRays(); },
      function(){ paintGuitar(); },
      function(){ paintSkull(); },
      function(){ paintCandle(); paintEyeGlow(); }
    ];
  }
  function queueWarm(){
    if (warmRunning){ warmPending = true; return; }
    if (warmDone) { warmDone = false; }
    warmRunning = true;
    warmSteps = warmList();
    runWarm();
  }
  function runWarm(){
    if (!warmSteps.length){
      warmRunning = false;
      if (warmPending){ warmPending = false; warmDone = false; queueWarm(); return; }
      warmDone = true;
      return;
    }
    var fn = warmSteps.shift();
    requestAnimationFrame(function(){
      try { fn(); }
      catch (e){ errStr = String(e && e.message || e); console.error('[481] warm step', e); }
      runWarm();
    });
  }

  function draw(now, dt){
    var w = view.w, h = view.h, R = view.R;
    var bass = live.bass || 0;
    var tsec = now * 0.001;

    if (!plate){
      // 首帧：先用纯渐变铺底，绝不阻塞 ready
      var g = ctx.createLinearGradient(0, 0, w * 0.5, h);
      g.addColorStop(0, '#2b0a34');
      g.addColorStop(0.55, '#b81d5f');
      g.addColorStop(1, '#f4a52c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      if (!warmQueued){ warmQueued = true; queueWarm(); }
      return;
    }

    ctx.drawImage(plate, 0, 0, w, h);

    // 放射线随低频转
    if (rays){
      var rot = reduced ? 0.2 : tsec * 0.045 + bass * 0.06;
      ctx.save();
      ctx.translate(view.cx, view.cy);
      ctx.rotate(rot);
      ctx.globalAlpha = 0.55 + bass * 0.4;
      ctx.drawImage(rays, -raysSize / 2, -raysSize / 2, raysSize, raysSize);
      ctx.restore();
    }

    // 呼吸环
    var pulse = 1 + bass * 0.045 + beatLvl * 0.035;
    ctx.save();
    ctx.translate(view.cx, view.cy);
    ctx.strokeStyle = 'rgba(248,233,201,' + (0.16 + bass * 0.22) + ')';
    ctx.lineWidth = Math.max(1, R * 0.012);
    ctx.beginPath(); ctx.arc(0, 0, R * 1.04 * pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([R * 0.03, R * 0.05]);
    ctx.strokeStyle = 'rgba(247,178,60,' + (0.20 + bass * 0.25) + ')';
    ctx.beginPath(); ctx.arc(0, 0, R * 1.09 * pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // 骷髅（轻微起伏）
    if (skull){
      var bob = reduced ? 0 : Math.sin(tsec * 1.5) * R * 0.012 + beatLvl * R * 0.022;
      lastBob = bob;
      // 吉他：骷髅怀里的木吉他（先画吉他、后画头骨 → 琴身从左下露出）
      if (guitar){
        var sway = reduced ? 0 : Math.sin(tsec * 1.7) * 0.012;
        var k = 0.40;
        var dw = guitarBox.w * k, dh = guitarBox.h * k;
        var px = view.cx - R * 0.86, py = view.cy + R * 1.10 + bob * 0.7;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(-0.58 + sway + beatLvl * 0.014);
        ctx.drawImage(guitar, -guitarBox.ox * k, -guitarBox.oy * k, dw, dh);
        ctx.restore();
      }
      ctx.drawImage(skull, skullBox.x, skullBox.y + bob, skullBox.w, skullBox.h);

      // 两支蜡烛（骷髅身旁）
      drawCandles(now, bob);
    }

    // 碎纸飘落
    if (conf.length){
      var spd = reduced ? 0.35 : 1;
      for (var i = 0; i < conf.length; i++){
        var p = conf[i];
        p.y += p.v * dt * 0.001 * spd;
        p.x += Math.sin(tsec * 0.8 + p.ph) * 0.00035 * spd;
        if (p.y > 1.04){ p.y = -0.04; p.x = Math.random(); }
        p.rot += p.vr * dt * 0.001 * spd;
        var px = p.x * w, py = p.y * h, s = p.s * Math.min(w, h);
        ctx.save(); ctx.translate(px, py); ctx.rotate(p.rot);
        ctx.globalAlpha = 0.62;
        ctx.fillStyle = p.col;
        ctx.fillRect(-s, -s * 0.5, s * 2, s);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- 主循环 ----------
  var lastT = 0, lastBeatDecay = 0, lastLift = '';
  function frame(ts){
    frames++;
    var t0 = performance.now();
    var dt = lastT ? Math.min(64, Math.max(0, ts - lastT)) : 16;
    lastT = ts;
    // 鼓点衰减（约 0.45s 回到 0）
    if (beatLvl > 0){
      beatLvl -= dt * 0.0022;
      if (beatLvl < 0) beatLvl = 0;
    }
    try {
      draw(ts || 0, dt);
      applyLyric();
      updateLit();
      paintEyes(ts || 0);
      if (!reduced){
        var lift = (beatLvl * 5).toFixed(2);
        if (lift !== lastLift){ lastLift = lift; el.plaque.style.transform = 'translateY(-' + lift + 'px)'; }
      } else if (lastLift !== '0'){ lastLift = '0'; el.plaque.style.transform = ''; }
    } catch (e){
      errStr = String(e && e.message || e);
      console.error('[481] frame error', e);
    }
    var el2 = performance.now() - t0;
    lastJs = Math.round(el2 * 100) / 100;
    requestAnimationFrame(frame);
  }

  // ---------- ready ----------
  var readySent = false;
  function sendReady(){
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch (e){ console.error('[481] ready failed', e); }
  }

  // ---------- 消息 ----------
  function onInit(p){
    p = p || {};
    S.lines = normLines(p.lines);
    S.dur = Number(p.duration) || 0;
    S.song = p.song || {name:'', artists:''};
    var ac = p.accent;
    if (Array.isArray(ac) && ac.length >= 3){
      var a = [Number(ac[0]), Number(ac[1]), Number(ac[2])];
      if (isFinite(a[0]) && isFinite(a[1]) && isFinite(a[2])) S.accent = a;
    }
    var nm = (typeof S.song.name === 'string' ? S.song.name : '') || '';
    var ar = S.song.artists;
    if (Array.isArray(ar)) ar = ar.join(' · ');
    if (typeof ar !== 'string') ar = '';
    el.song.textContent = nm ? (nm + (ar ? '  ·  ' + ar : '')) : (ar || 'CALAVERA');
    S.t = 0; S.playing = true; S.idx = findIdx(0);
    curIdx = -2;
    applyLyric();
    // 视觉层：accent 变了就要重铺底；其余离屏层尺寸未变可复用
    paintPlate();
    if (warmDone){ paintRays(); paintGuitar(); paintSkull(); paintCandle(); paintEyeGlow(); }
    else { queueWarm(); }
    el.plaque.classList.add('on');
  }

  function onMsg(e){
    var d = e && e.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') onInit(d.payload);
      else if (d.type === 'tick'){
        var p = d.payload || {};
        var t = Number(p.time);
        if (isFinite(t)) S.t = t;
        if (typeof p.playing === 'boolean') S.playing = p.playing;
        S.idx = findIdx(S.t);
        applyLyric();
      } else if (d.type === 'beat'){
        var bp = d.payload || {};
        var lv = Number(bp.level);
        beatLvl = isFinite(lv) ? Math.max(0, Math.min(1, lv)) : 0.6;
        beatT = performance.now();
      } else if (d.type === 'live'){
        var lp = d.payload || {};
        var f = function(v, dv){ var n = Number(v); return isFinite(n) ? Math.max(0, Math.min(1, n)) : dv; };
        live.bpm = Number(lp.bpm) || live.bpm;
        live.level = f(lp.level, 0);
        live.bass = f(lp.bass, 0);
        live.mid = f(lp.mid, 0);
        live.treble = f(lp.treble, 0);
        if (typeof lp.playing === 'boolean') live.playing = lp.playing;
      }
    } catch (err){
      errStr = String(err && err.message || err);
      console.error('[481] message error', err);
    }
  }

  // ---------- 启动 ----------
  window.addEventListener('message', onMsg, false);
  var rzT = 0;
  function onResize(){
    clearTimeout(rzT);
    rzT = setTimeout(function(){
      try {
        resize();
        seedConf();
        curIdx = -2; lastBob = 0;
        applyLyric();
        queueWarm();
      } catch(e){ console.error('[481] resize', e); }
    }, 140);
  }
  window.addEventListener('resize', onResize, false);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize, false);

  resize();
  seedConf();
  paintEyeGlow();
  requestAnimationFrame(function(ts){ sendReady(); frame(ts); });
  setTimeout(sendReady, 700);
})();
</script>
</body>
</html>
