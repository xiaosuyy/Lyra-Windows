<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>涩谷剪报</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0e7d6}
  #s{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="s"></canvas>
<script>
(function(){
'use strict';

/* ---------- state (declared before anything can touch it) ---------- */
var S = {
  lines: [], n: 0, idx: -1, t: 0, playing: true,
  frames: 0, js: 0, err: '', rm: false, text: '',
  accent: [214, 58, 45], accentHex: '#d63a2d', dur: 0,
  song: { name: '', artists: '' }, cover: '',
  beat: 0, level: 0, bass: 0, mid: 0, treble: 0, bpm: 0, pre: true
};
var clk = { on: false, t: 0, at: 0 };
var kick = { lvl: 0, at: 0 };

window.__stage = function(){
  return {
    lines: S.n, idx: S.idx, t: S.t, playing: S.playing,
    frames: S.frames, js: S.js, err: S.err,
    text: S.text, gl: false, rm: S.rm
  };
};

var cv = document.getElementById('s');
var ctx = cv.getContext('2d', { alpha: false });
var W = 1440, H = 900, DPR = 1;
var FONT = '"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif';
var MONO = '"SFMono-Regular",Consolas,"Courier New",monospace';

var layout = { idx: -2, w: 0, lines: [], size: 0, card: null };
var bg = null;            /* prerendered collage */
var readySent = false;
var firstFrame = true;

/* ---------- ready ---------- */
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
  catch (e) { console.error('[460] ready postMessage failed', e); }
}

/* ---------- geometry ---------- */
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  if (!(w > 0) || !isFinite(w)) w = 1440;
  if (!(h > 0) || !isFinite(h)) h = 900;
  W = Math.round(w); H = Math.round(h);
  DPR = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout.idx = -2; layout.w = 0;
  buildBg();
}

/* ---------- palette ---------- */
function lum(r, g, b){
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
}
function applyAccent(rgb){
  var r = 214, g = 58, b = 45;
  if (rgb && isFinite(rgb[0]) && isFinite(rgb[1]) && isFinite(rgb[2])) {
    r = Math.max(0, Math.min(255, rgb[0] | 0));
    g = Math.max(0, Math.min(255, rgb[1] | 0));
    b = Math.max(0, Math.min(255, rgb[2] | 0));
  }
  /* keep the accent readable on cream paper */
  var L = lum(r, g, b);
  if (L > 0.42) {
    var k = 0.42 / Math.max(0.05, L);
    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
  }
  S.accent = [r, g, b];
  S.accentHex = 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------- lyrics model ---------- */
function normalizeLines(raw){
  var out = [], i, o, txt, t;
  if (!raw || typeof raw.length !== 'number') return out;
  var lim = Math.min(raw.length, 3000);
  for (i = 0; i < lim; i++) {
    o = raw[i];
    if (!o || typeof o !== 'object') continue;
    t = Number(o.t);
    if (!isFinite(t) || t < 0) t = 0;
    txt = (typeof o.text === 'string') ? o.text : '';
    if (!txt) txt = '';
    var d = Number(o.dur);
    if (!isFinite(d) || d <= 0) d = 3.2;
    d = Math.max(0.2, Math.min(60, d));
    out.push({ t: t, dur: d, text: txt, chars: o.chars || null });
  }
  out.sort(function(a, b){ return a.t - b.t; });
  return out;
}

function onInit(p){
  p = p || {};
  var song = p.song || {};
  var arts = song.artists;
  if (arts && typeof arts.length === 'number') arts = Array.prototype.join.call(arts, ' / ');
  else arts = (typeof arts === 'string') ? arts : '';
  S.song = { name: (typeof song.name === 'string' ? song.name : ''), artists: arts || '' };
  S.cover = (typeof song.cover === 'string') ? song.cover : '';
  var dur = Number(p.duration);
  S.dur = (isFinite(dur) && dur > 0) ? dur : 0;
  applyAccent(p.accent);
  S.lines = normalizeLines(p.lines);
  S.n = S.lines.length;
  S.idx = -1;
  S.text = '';
  layout.idx = -2;
  S.playing = (typeof p.playing === 'boolean') ? p.playing : true;
  /* 重新取色也要重绘底子 */
  buildBg();
}

function onTick(p){
  if (!p) return;
  var t = Number(p.time);
  if (isFinite(t) && t >= 0) S.t = t;
  if (typeof p.playing === 'boolean') S.playing = p.playing;
  if (!S.playing) { clk.on = false; }
  else { clk.on = true; clk.t = S.t; clk.at = performance.now(); }
  updateIdx();
}

function onBeat(p){
  if (!p) return;
  var lv = Number(p.level);
  if (!isFinite(lv)) lv = 0.6;
  S.beat = Math.max(0, Math.min(1, lv));
  kick.lvl = S.beat;
  kick.at = performance.now();
}

function onLive(p){
  if (!p) return;
  var f = function(v){ var x = Number(v); return isFinite(x) ? Math.max(0, Math.min(1, x)) : 0; };
  S.level = f(p.level);
  S.bass = f(p.bass);
  S.mid = f(p.mid);
  S.treble = f(p.treble);
  var b = Number(p.bpm);
  if (isFinite(b) && b > 0) S.bpm = Math.min(260, b);
  if (typeof p.playing === 'boolean') S.playing = p.playing;
}

function updateIdx(){
  var i = -1, k, n = S.n, t = S.t;
  for (k = 0; k < n; k++) {
    if (S.lines[k].t <= t + 0.008) i = k; else break;
  }
  if (i !== S.idx) { S.idx = i; layout.idx = -2; }
  S.pre = i < 0;
  S.text = (i >= 0 && S.lines[i]) ? S.lines[i].text : '';
}

/* ---------- static collage (prerender) ---------- */
var INK = '#171610';
var BLUE = '#20397e';
var GOLD = '#dfa32a';
var PINK = '#e2a0a6';

function rnd(seed){
  var s = (seed | 0) >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function tw(g, txt, sp){
  var i, total = 0;
  if (!txt) return 0;
  txt = String(txt).slice(0, 64);
  for (i = 0; i < txt.length; i++) total += g.measureText(txt.charAt(i)).width + sp;
  return Math.max(0, total - sp);
}

function tracked(g, txt, x, y, sp){
  var i, ch, w, widths = [], total = 0, cx;
  if (!txt) return 0;
  txt = String(txt).slice(0, 64);
  for (i = 0; i < txt.length; i++) {
    w = g.measureText(txt.charAt(i)).width;
    widths.push(w); total += w + sp;
  }
  total -= sp;
  cx = x;
  if (g.textAlign === 'center') cx = x - total / 2;
  else if (g.textAlign === 'right' || g.textAlign === 'end') cx = x - total;
  for (i = 0; i < txt.length; i++) {
    g.fillText(txt.charAt(i), cx, y);
    cx += widths[i] + sp;
  }
  return total;
}

function rings(g, cx, cy, r, colA, colB, n){
  var i, rr;
  for (i = 0; i < n; i++) {
    rr = r * (1 - i / n);
    g.fillStyle = (i % 2 === 0) ? colA : colB;
    g.beginPath(); g.arc(cx, cy, rr, 0, 6.2832); g.fill();
  }
}

function halftone(g, x0, y0, w, h, step, maxR, color, rf){
  var nx = Math.min(46, Math.max(2, Math.floor(w / step)));
  var ny = Math.min(46, Math.max(2, Math.floor(h / step)));
  var x, y, fx, fy, d, r;
  g.fillStyle = color;
  for (y = 0; y < ny; y++) {
    for (x = 0; x < nx; x++) {
      fx = x / (nx - 1); fy = y / (ny - 1);
      d = Math.sqrt(fx * fx + fy * fy);
      r = maxR * Math.max(0, 1 - d) * (0.55 + rf() * 0.9);
      if (r > 0.3) {
        g.beginPath(); g.arc(x0 + x * step, y0 + y * step, r, 0, 6.2832); g.fill();
      }
    }
  }
}

function barcode(g, x, y, w, h, color, rf){
  var i, bw, gap, cx = x;
  g.fillStyle = color;
  for (i = 0; i < 42; i++) {
    bw = 1 + Math.floor(rf() * 4);
    if (cx + bw > x + w) break;
    g.fillRect(cx, y, bw, h * (rf() < 0.12 ? 0.86 : 1));
    gap = 1 + Math.floor(rf() * 4);
    cx += bw + gap;
  }
}

function carShape(g, x, y, w, h, color){
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(x + w * 0.02, y + h * 0.76);
  g.bezierCurveTo(x + w * 0.01, y + h * 0.56, x + w * 0.14, y + h * 0.50, x + w * 0.30, y + h * 0.47);
  g.lineTo(x + w * 0.42, y + h * 0.28);
  g.bezierCurveTo(x + w * 0.55, y + h * 0.20, x + w * 0.72, y + h * 0.23, x + w * 0.80, y + h * 0.33);
  g.lineTo(x + w * 0.95, y + h * 0.47);
  g.bezierCurveTo(x + w * 0.99, y + h * 0.56, x + w * 0.97, y + h * 0.70, x + w * 0.90, y + h * 0.74);
  g.lineTo(x + w * 0.60, y + h * 0.76);
  g.closePath();
  g.fill();
  /* wheels knocked out in paper */
  var wy = y + h * 0.78, wr = h * 0.15;
  g.fillStyle = '#f3ead9';
  g.beginPath(); g.arc(x + w * 0.24, wy, wr, 0, 6.2832); g.fill();
  g.beginPath(); g.arc(x + w * 0.76, wy, wr, 0, 6.2832); g.fill();
  g.fillStyle = color;
  g.beginPath(); g.arc(x + w * 0.24, wy, wr * 0.42, 0, 6.2832); g.fill();
  g.beginPath(); g.arc(x + w * 0.76, wy, wr * 0.42, 0, 6.2832); g.fill();
  /* window */
  g.fillStyle = '#f3ead9';
  g.beginPath();
  g.moveTo(x + w * 0.45, y + h * 0.31);
  g.lineTo(x + w * 0.76, y + h * 0.34);
  g.lineTo(x + w * 0.68, y + h * 0.45);
  g.lineTo(x + w * 0.46, y + h * 0.44);
  g.closePath(); g.fill();
}

function helmetShape(g, cx, cy, r, color, paper){
  g.fillStyle = color;
  g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.fill();
  g.fillStyle = paper;
  g.save();
  g.beginPath();
  g.ellipse(cx + r * 0.10, cy - r * 0.06, r * 0.60, r * 0.44, -0.18, 0, 6.2832);
  g.fill();
  g.restore();
  g.strokeStyle = paper;
  g.lineWidth = Math.max(1, r * 0.09);
  g.beginPath(); g.arc(cx, cy, r * 0.86, 3.4, 5.6); g.stroke();
}

function paintCollage(g){
  var rf = rnd(460460);
  var u = Math.min(W, H) / 900;
  u = Math.max(0.55, Math.min(1.5, u));
  var ux = Math.max(0.6, W / 1440), uy = Math.max(0.6, H / 900);
  var narrow = W < 620;
  var i, x, y;

  /* paper */
  g.fillStyle = '#f3ead9';
  g.fillRect(0, 0, W, H);
  var warm = g.createRadialGradient(W * 0.32, H * 0.16, 0, W * 0.32, H * 0.16, Math.max(W, H) * 0.95);
  warm.addColorStop(0, 'rgba(255,253,244,0.85)');
  warm.addColorStop(1, 'rgba(220,202,174,0.55)');
  g.fillStyle = warm;
  g.fillRect(0, 0, W, H);

  /* left accent spine */
  g.fillStyle = S.accentHex;
  g.fillRect(0, 0, Math.max(20, W * 0.030), H);
  g.fillStyle = 'rgba(255,250,238,0.92)';
  g.save();
  g.translate(Math.max(20, W * 0.030) * 0.5, H * 0.5);
  g.rotate(-Math.PI / 2);
  g.font = '600 ' + (10 * u).toFixed(1) + 'px ' + MONO;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  tracked(g, 'SHIBUYA-KEI ・ FRENCH POP ・ 460', 0, 0, 3.4 * u);
  g.restore();

  var padL = Math.max(20, W * 0.030);

  /* top-left zine masthead */
  x = padL + 26 * ux; y = 46 * uy;
  g.fillStyle = INK;
  g.fillRect(x, y, 108 * ux, 26 * uy);
  g.fillStyle = '#f3ead9';
  g.font = '700 ' + (12 * u).toFixed(1) + 'px ' + MONO;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('N°460', x + 54 * ux, y + 13.5 * uy);

  g.fillStyle = INK;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.font = '700 ' + (25 * u).toFixed(1) + 'px ' + FONT;
  tracked(g, 'CULTURE BUYER', x, y + 58 * uy, 1.2 * u);
  g.font = '400 ' + (10 * u).toFixed(1) + 'px ' + MONO;
  g.fillStyle = 'rgba(23,22,16,0.62)';
  tracked(g, 'TOKYO 1996 / PARIS 1964 — CUT & PASTE', x, y + 78 * uy, 2.2 * u);

  /* blue rule */
  g.fillStyle = BLUE;
  g.fillRect(x, y + 92 * uy, Math.min(W * 0.34, 320 * ux), 5 * uy);

  /* mod target, top right */
  var tr = Math.min(W, H) * 0.078;
  tr = Math.max(30, Math.min(tr, 92));
  var tcx = W - tr - 34 * ux, tcy = tr + 42 * uy;
  rings(g, tcx, tcy, tr, BLUE, '#f3ead9', 5);
  g.fillStyle = S.accentHex;
  g.beginPath(); g.arc(tcx, tcy, tr * 0.14, 0, 6.2832); g.fill();

  if (!narrow) {
    /* top band: a scissored 60s coupé clipping, pasted slightly off-axis */
    var cw = Math.min(W * 0.24, 300 * ux), ch = Math.min(cw * 0.40, 128 * uy);
    g.save();
    g.translate(W * 0.505, H * 0.125);
    g.rotate(-0.028);
    g.fillStyle = 'rgba(23,22,16,0.14)';
    g.fillRect(-cw / 2 + 6 * u, -ch / 2 + 6 * u, cw, ch);
    g.fillStyle = GOLD;
    g.fillRect(-cw / 2, -ch / 2, cw, ch);
    carShape(g, -cw * 0.43, -ch * 0.40, cw * 0.86, ch * 0.70, INK);
    g.fillStyle = 'rgba(23,22,16,0.80)';
    g.fillRect(-cw / 2, ch / 2 - 22 * u, cw, 22 * u);
    g.fillStyle = '#f3ead9';
    g.font = '600 ' + (8.5 * u).toFixed(1) + 'px ' + MONO;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    tracked(g, 'CÔTE D’AZUR — ÉTÉ 1967', 0, ch / 2 - 11 * u, 1.7 * u);
    g.restore();

    /* small helmet badge between the car and the target */
    var hr = Math.min(Math.min(W, H) * 0.050, 54 * u);
    hr = Math.max(22, hr);
    g.save();
    g.translate(W * 0.760, H * 0.118);
    g.rotate(0.10);
    g.fillStyle = BLUE;
    g.beginPath(); g.arc(0, 0, hr * 1.24, 0, 6.2832); g.fill();
    helmetShape(g, 0, 0, hr * 0.84, '#f3ead9', BLUE);
    g.restore();
  }

  /* pink halftone dot, left of the top band */
  if (!narrow) {
    var hy = H * 0.215, hx = padL + 62 * u;
    g.save();
    g.beginPath(); g.arc(hx, hy, 50 * u, 0, 6.2832); g.clip();
    g.fillStyle = PINK; g.fillRect(hx - 60 * u, hy - 60 * u, 120 * u, 120 * u);
    g.restore();
    halftone(g, hx - 36 * u, hy - 36 * u, 72 * u, 72 * u, 11 * u, 3.4 * u, 'rgba(23,22,16,0.55)', rf);
  }

  /* barcode, bottom centre-left (kept clear of the song tag and spectrum) */
  if (!narrow) {
    var by = H - 68 * uy;
    barcode(g, W * 0.405, by, Math.min(140 * ux, W * 0.11), 32 * uy, INK, rf);
    g.fillStyle = 'rgba(23,22,16,0.60)';
    g.font = '500 ' + (8 * u).toFixed(1) + 'px ' + MONO;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    tracked(g, '4 916 206 460', W * 0.405, by + 41 * uy, 2.0 * u);
  }

  /* filmstrip along the bottom */
  var fh = 20 * uy, fy2 = H - fh;
  g.fillStyle = 'rgba(23,22,16,0.10)';
  g.fillRect(0, fy2, W, fh);
  g.fillStyle = 'rgba(243,234,217,0.85)';
  for (i = 0; i < 200; i++) {
    x = i * 24 * ux + 6 * ux;
    if (x > W) break;
    g.fillRect(x, fy2 + 5 * uy, 9 * ux, 9 * uy);
  }
  g.fillStyle = S.accentHex;
  g.fillRect(0, fy2 - 3 * uy, W, 2 * uy);

  /* paper grain */
  var gx, gy, gr;
  for (i = 0; i < 1100; i++) {
    gx = rf() * W; gy = rf() * H; gr = rf();
    if (gr < 0.55) {
      g.fillStyle = 'rgba(23,22,16,' + (0.03 + rf() * 0.05).toFixed(3) + ')';
      g.fillRect(gx, gy, 1.2, 1.2);
    } else if (gr < 0.8) {
      g.fillStyle = 'rgba(255,255,250,' + (0.10 + rf() * 0.16).toFixed(3) + ')';
      g.fillRect(gx, gy, 1.4, 1.4);
    }
  }

  /* print crop marks + frame */
  g.strokeStyle = 'rgba(23,22,16,0.45)';
  g.lineWidth = 1;
  var m = 14 * u;
  g.strokeRect(m, m, W - m * 2, H - m * 2);
  g.strokeStyle = 'rgba(23,22,16,0.7)';
  g.lineWidth = 1.4;
  var cm = 20 * u, cl = 12 * u;
  var cxs = [m, W - m], cys = [m, H - m];
  for (i = 0; i < 4; i++) {
    var px = cxs[i < 2 ? 0 : 1], py = cys[i % 2 === 0 ? 0 : 1];
    g.beginPath();
    g.moveTo(px - cl, py); g.lineTo(px - cl * 0.2, py);
    g.moveTo(px + cl * 0.2, py); g.lineTo(px + cl, py);
    g.moveTo(px, py - cl); g.lineTo(px, py - cl * 0.2);
    g.moveTo(px, py + cl * 0.2); g.lineTo(px, py + cl);
    g.stroke();
  }
}

function buildBg(){
  try {
    var c = document.createElement('canvas');
    if (!(W > 0) || !(H > 0)) return;
    c.width = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    var g = c.getContext('2d');
    if (!g) { bg = null; return; }
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintCollage(g);
    bg = c;
  } catch (e) {
    console.error('[460] collage build failed', e);
    bg = null;
  }
}

/* ---------- lyric model helpers ---------- */
var CJK = /[\u3000-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff01-\uff60]/;

function lineChars(L){
  if (L._ch) return L._ch;
  var src = L.chars, out = [], i, o, c, t;
  if (src && typeof src.length === 'number' && src.length > 0) {
    var lim = Math.min(src.length, 600);
    for (i = 0; i < lim; i++) {
      o = src[i];
      if (!o) continue;
      c = (typeof o.c === 'string') ? o.c : (typeof o.c === 'number' ? '' + o.c : '');
      if (!c) continue;
      t = Number(o.t);
      if (!isFinite(t)) t = L.t;
      out.push({ c: c, t: t });
    }
  }
  if (!out.length) {
    var txt = L.text || '';
    var n = Math.min(txt.length, 600);
    for (i = 0; i < n; i++) out.push({ c: txt.charAt(i), t: L.t + L.dur * (i / Math.max(1, n)) });
  }
  L._ch = out;
  return out;
}

function fontFor(size, cjk, weight){
  return (weight || (cjk ? 700 : 800)) + ' ' + size.toFixed(1) + 'px ' + (cjk ? FONT : FONT);
}

function buildRows(chars, size, maxW){
  var rows = [], cur = [], curW = 0, i, ch, w, font, cjk;
  for (i = 0; i < chars.length; i++) {
    ch = chars[i];
    cjk = CJK.test(ch.c);
    font = fontFor(size, cjk);
    ctx.font = font;
    w = ctx.measureText(ch.c).width;
    if (curW + w > maxW && cur.length) { rows.push(cur); cur = []; curW = 0; }
    cur.push({ c: ch.c, w: w, f: font, t: ch.t });
    curW += w;
    if (rows.length > 13) break;
  }
  if (cur.length) rows.push(cur);
  return rows;
}

function curLine(){
  if (S.idx >= 0 && S.lines[S.idx]) return S.lines[S.idx];
  if (S.n > 0) return S.lines[0];
  return null;
}

function computeLayout(){
  var L = curLine();
  layout.idx = S.idx;
  layout.pre = S.idx < 0;
  layout.rows = [];
  layout.size = 0;
  if (!L) return;
  var narrow = W < 620;
  var pad = Math.max(22, W * (narrow ? 0.075 : 0.055));
  var maxW = narrow ? (W - pad * 1.5) : Math.min(W - pad * 2, 980);
  var y0 = H * (narrow ? 0.34 : 0.38);
  var y1 = H * (narrow ? 0.84 : 0.745);
  var bandH = Math.max(60, y1 - y0);
  var base = narrow
    ? Math.max(19, Math.min(W * 0.072, 44))
    : Math.max(24, Math.min(Math.min(H * 0.092, W * 0.058), 84));
  var tries = [1, 0.87, 0.76, 0.66, 0.57, 0.49, 0.42];
  var rows = [], size = base, i, rowH, totalH;
  for (i = 0; i < tries.length; i++) {
    size = base * tries[i];
    rows = buildRows(lineChars(L), size, maxW);
    rowH = size * 1.32;
    totalH = rows.length * rowH;
    if (totalH <= bandH) break;
  }
  rowH = size * 1.32;
  totalH = rows.length * rowH;
  if (totalH > bandH) { rowH = bandH / Math.max(1, rows.length); totalH = bandH; }
  layout.rows = rows;
  layout.size = size;
  layout.rowH = rowH;
  layout.top = y0 + (bandH - totalH) / 2;
  layout.pad = pad;
  layout.maxW = maxW;
}

/* ---------- draw ---------- */
function drawStickers(){
  var narrow = W < 620;
  if (narrow) return;
  var u = Math.max(0.6, Math.min(1.4, Math.min(W, H) / 900));
  var beat = S.rm ? 0 : (S.beat || 0);
  var bass = S.rm ? 0 : (S.bass || 0);
  var tm = S.t;
  var a1 = S.rm ? -0.12 : (Math.sin(tm * 0.9) * 0.05 + beat * 0.05);
  var x1 = W * 0.145, y1 = H * 0.30 - bass * 10 * u;
  ctx.save();
  ctx.translate(x1, y1);
  ctx.rotate(-0.12 + a1);
  ctx.fillStyle = 'rgba(23,22,16,0.16)';
  ctx.fillRect(-44 * u + 5 * u, -22 * u + 5 * u, 88 * u, 44 * u);
  ctx.fillStyle = '#f3ead9';
  ctx.fillRect(-44 * u, -22 * u, 88 * u, 44 * u);
  ctx.fillStyle = S.accentHex;
  ctx.fillRect(-44 * u, -22 * u, 5 * u, 44 * u);
  ctx.fillStyle = INK;
  ctx.font = '700 ' + (11 * u).toFixed(1) + 'px ' + MONO;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SIDE A', 2 * u, 0);
  ctx.restore();

  var a2 = S.rm ? 0.09 : (-0.05 + Math.sin(tm * 0.7 + 1.6) * 0.05 - (S.level || 0) * 0.06);
  var x2 = W * 0.855, y2 = H * 0.335 + bass * 8 * u;
  ctx.save();
  ctx.translate(x2, y2);
  ctx.rotate(0.09 + a2);
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.arc(0, 0, 26 * u, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#f3ead9';
  ctx.beginPath(); ctx.arc(0, 0, 26 * u * 0.62, 0, 6.2832); ctx.fill();
  ctx.fillStyle = S.accentHex;
  ctx.beginPath(); ctx.arc(0, 0, 26 * u * 0.26, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawStrip(){
  var arm = layout;
  var top = Math.max(H * 0.30, arm.top - arm.rowH * 0.32);
  var bot = Math.min(H - 96, arm.top + arm.rows.length * arm.rowH + arm.rowH * 0.32);
  if (bot <= top) return;
  var x = arm.pad * 0.55, w = W - arm.pad * 1.1;
  ctx.save();
  ctx.translate(W / 2, (top + bot) / 2);
  ctx.rotate(-0.003);
  ctx.fillStyle = 'rgba(246,239,224,0.945)';
  ctx.fillRect(-w / 2, -(bot - top) / 2, w, bot - top);
  ctx.fillStyle = 'rgba(23,22,16,0.20)';
  ctx.fillRect(-w / 2, -(bot - top) / 2, w, 1);
  ctx.fillRect(-w / 2, (bot - top) / 2 - 1, w, 1);
  ctx.fillStyle = S.accentHex;
  ctx.fillRect(-w / 2, -(bot - top) / 2 - 4, Math.min(w * 0.24, 150), 4);
  ctx.fillStyle = BLUE;
  ctx.fillRect(-w / 2 + Math.min(w * 0.24, 150), -(bot - top) / 2 - 4, Math.min(w * 0.14, 88), 4);
  ctx.restore();
}

function drawBars(){
  if (W < 620) return;
  var u = Math.max(0.62, Math.min(1.3, Math.min(W, H) / 900));
  var n = 16, bw = 3.4 * u, gap = 3.0 * u;
  var x0 = W - (n * (bw + gap)) - 30 * u;
  var base = H - 46 * u, maxH = 30 * u;
  var lv = S.rm ? 0.34 : (S.level || 0);
  var bs = S.rm ? 0.5 : (S.bass || 0);
  var tr = S.rm ? 0.4 : (S.treble || 0);
  var k = S.kick || 0;
  var i, h, f;
  ctx.fillStyle = 'rgba(23,22,16,0.14)';
  ctx.fillRect(x0 - 6 * u, base + 6 * u, n * (bw + gap) + 6 * u, 1.4 * u);
  for (i = 0; i < n; i++) {
    f = Math.sin(S.t * (2.1 + i * 0.27) + i * 1.7) * 0.5 + 0.5;
    h = maxH * (0.10 + (lv * 0.55 + bs * 0.35 * f + tr * 0.30 * (1 - f)) * (0.55 + 0.55 * f) + k * 0.22);
    h = Math.max(1.5 * u, Math.min(maxH, h));
    ctx.fillStyle = (i % 4 === 0) ? S.accentHex : (i % 4 === 2 ? BLUE : 'rgba(23,22,16,0.78)');
    ctx.fillRect(x0 + i * (bw + gap), base - h, bw, h);
  }
  ctx.fillStyle = 'rgba(23,22,16,0.55)';
  ctx.font = '500 ' + (8 * u).toFixed(1) + 'px ' + MONO;
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('33⅓', x0 + n * (bw + gap), base + 17 * u);
}

function drawChrome(){
  var u = Math.max(0.62, Math.min(1.35, Math.min(W, H) / 900));
  var pad = Math.max(22, W * (W < 620 ? 0.075 : 0.055));
  var strip = layout.rows && layout.rows.length ? layout : null;

  /* catalogue counter, left of the strip */
  if (strip && W >= 620) {
    var num = (S.idx + 1 < 10 ? '0' : '') + Math.max(0, S.idx + 1);
    var tot = (S.n < 10 ? '0' : '') + S.n;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(23,22,16,0.55)';
    ctx.font = '600 ' + (10 * u).toFixed(1) + 'px ' + MONO;
    ctx.fillText(num, layout.pad * 0.60, layout.top + layout.rowH * 0.4, 60);
    ctx.fillStyle = 'rgba(23,22,16,0.28)';
    ctx.font = '500 ' + (8 * u).toFixed(1) + 'px ' + MONO;
    ctx.fillText('/' + tot, layout.pad * 0.60, layout.top + layout.rowH * 0.4 + 12 * u, 60);
  }

  /* timeline rule just above the filmstrip */
  if (S.dur > 0) {
    var fy = H - 22 * u - 6 * u;
    var x0 = pad * 0.6, x1 = W - pad * 0.6;
    var p = Math.max(0, Math.min(1, S.t / S.dur));
    ctx.fillStyle = 'rgba(23,22,16,0.13)';
    ctx.fillRect(x0, fy, x1 - x0, 2);
    ctx.fillStyle = S.accentHex;
    ctx.fillRect(x0, fy, (x1 - x0) * p, 2);
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.arc(x0 + (x1 - x0) * p, fy + 1, 2.6 * u, 0, 6.2832);
    ctx.fill();
  }
}

function drawLyrics(){
  var L = curLine();
  if (!L) return;
  if (layout.idx !== S.idx || !layout.rows) computeLayout();
  if (!layout.rows || !layout.rows.length) return;
  drawStrip();
  var now = S.pre ? -9999 : S.t, accent = S.accentHex;
  var rowH = layout.rowH;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  var r, i, row, cw, x, y, ch, sung, fresh;
  for (r = 0; r < layout.rows.length; r++) {
    row = layout.rows[r];
    cw = 0;
    for (i = 0; i < row.length; i++) cw += row[i].w;
    x = (W - cw) / 2;
    y = layout.top + r * rowH + rowH / 2;
    for (i = 0; i < row.length; i++) {
      ch = row[i];
      ctx.font = ch.f;
      if (ch.t <= now) {
        fresh = (now - ch.t) < 0.34;
        ctx.fillStyle = fresh ? accent : INK;
      } else {
        ctx.fillStyle = 'rgba(23,22,16,0.40)';
      }
      ctx.fillText(ch.c, x, y);
      x += ch.w;
    }
  }
}

function drawSongTag(){
  var nm = (S.song.name || '').replace(/\s+/g, ' ').trim();
  var ar = (S.song.artists || '').replace(/\s+/g, ' ').trim();
  if (!nm && !ar) return;
  var u = Math.max(0.62, Math.min(1.35, Math.min(W, H) / 900));
  var narrow = W < 620;
  var pad = Math.max(22, W * (narrow ? 0.075 : 0.055));
  var x = pad, y = H - 128 * u;
  var maxW = narrow ? W - pad * 2 : Math.min(W * 0.42, 420);
  if (nm.length > 44) nm = nm.slice(0, 43) + '…';
  if (ar.length > 40) ar = ar.slice(0, 39) + '…';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = S.accentHex;
  ctx.fillRect(x, y - 21 * u, 30 * u, 3 * u);
  ctx.fillStyle = INK;
  ctx.font = '700 ' + (15 * u).toFixed(1) + 'px ' + FONT;
  if (nm) ctx.fillText(nm, x, y, maxW);
  if (ar) {
    ctx.fillStyle = 'rgba(23,22,16,0.66)';
    ctx.font = '500 ' + (10.5 * u).toFixed(1) + 'px ' + MONO;
    ctx.fillText(ar.toUpperCase(), x, y + 17 * u, maxW);
  }
}

function drawFoot(){
  if (W < 620) return;
  var u = Math.max(0.62, Math.min(1.35, Math.min(W, H) / 900));
  var pad = Math.max(22, W * 0.055);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(23,22,16,0.55)';
  ctx.font = '500 ' + (9.5 * u).toFixed(1) + 'px ' + MONO;
  var bpm = S.bpm ? ('BPM ' + Math.round(S.bpm)) : 'BPM —';
  tracked(ctx, bpm + '   ● SIDE A / 33⅓', W - pad, H - 84 * u, 1.8 * u);
}

function drawEmpty(){
  var narrow = W < 620;
  var size = narrow ? Math.min(W * 0.13, 54) : Math.min(Math.min(H * 0.13, W * 0.09), 96);
  var cx = W / 2, cy = H * 0.50;
  var cw = Math.min(W * 0.86, 660), chh = size * 2.5;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.012);
  ctx.fillStyle = 'rgba(23,22,16,0.15)';
  ctx.fillRect(-cw / 2 + 7, -chh / 2 + 7, cw, chh);
  ctx.fillStyle = 'rgba(247,241,228,0.94)';
  ctx.fillRect(-cw / 2, -chh / 2, cw, chh);
  ctx.fillStyle = S.accentHex;
  ctx.fillRect(-cw / 2, -chh / 2, cw, 4);
  ctx.fillStyle = BLUE;
  ctx.fillRect(-cw / 2 + cw * 0.42, -chh / 2, cw * 0.16, 4);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = INK;
  ctx.font = '700 ' + size.toFixed(1) + 'px ' + FONT;
  tracked(ctx, '纯器乐', 0, 0, size * 0.10);

  ctx.fillStyle = 'rgba(23,22,16,0.66)';
  ctx.font = '600 ' + Math.max(9, size * 0.16).toFixed(1) + 'px ' + MONO;
  tracked(ctx, 'INSTRUMENTAL — NO LYRICS', 0, -size * 0.95, Math.max(1.6, size * 0.028));
  ctx.restore();

  /* empty state still names the record */
  var nm = (S.song.name || '').trim();
  if (nm) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(23,22,16,0.55)';
    ctx.font = '500 ' + Math.max(11, size * 0.20).toFixed(1) + 'px ' + FONT;
    ctx.fillText(nm.slice(0, 40), cx, cy + chh / 2 + size * 0.55, Math.min(W * 0.8, 520));
  }
}

function draw(){
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  else {
    ctx.fillStyle = '#f3ead9';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = S.accentHex;
    ctx.fillRect(0, 0, W * 0.03, H);
  }
  drawStickers();
  drawBars();
  drawSongTag();
  drawFoot();
  drawChrome();
  if (S.n === 0) { drawEmpty(); return; }
  drawLyrics();
}

/* ---------- loop ---------- */
var last = 0;
function frame(){
  var t0 = performance.now();
  if (firstFrame) { firstFrame = false; sendReady(); }
  S.frames++;

  /* between 15Hz ticks, keep the karaoke clock smooth (no tick is ever faked) */
  if (clk.on && S.playing) {
    var el = (t0 - clk.at) / 1000;
    if (el > 0.002 && el < 0.45) {
      var tt = clk.t + el;
      if (tt > S.t && tt < S.t + 0.6) { S.t = tt; updateIdx(); }
    }
  }

  var dt = last ? Math.min(80, t0 - last) : 16;
  last = t0;
  var d = Math.pow(0.86, dt / 16);
  S.kick = (kick.lvl || 0) * Math.max(0, 1 - (t0 - kick.at) / 320);
  S.beat *= d;

  try { draw(); }
  catch (e) { console.error('[460] draw failed', e); }
  S.js = Math.round((performance.now() - t0) * 100) / 100;
  requestAnimationFrame(frame);
}

/* ---------- messages ---------- */
window.addEventListener('message', function(ev){
  var d = ev && ev.data;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') onInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') onBeat(d.payload);
    else if (d.type === 'live') onLive(d.payload);
  } catch (e) { console.error('[460] message failed: ' + d.type, e); }
});

/* ---------- boot ---------- */
try {
  S.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  resize();
  window.addEventListener('resize', function(){ try { resize(); } catch (e) { console.error(e); } }, { passive: true });
} catch (e) { console.error('[460] boot failed', e); }

requestAnimationFrame(frame);
setTimeout(sendReady, 700);
})();
</script>
</body>
</html>
