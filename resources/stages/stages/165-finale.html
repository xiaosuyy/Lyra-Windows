<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>终章·星环</title>
<style>
  html,body{margin:0;height:100%;background:#05070b;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(118% 96% at 50% 46%,transparent 34%,rgba(3,5,10,.52) 74%,rgba(1,2,5,.95))}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(198,210,235,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   Lyra 通用骨架（构建期拼进每个 stage 的自包含 HTML，不是外部依赖）
   ----------------------------------------------------------------------------
   机制文件需要实现（名字固定）：
     mechResize()                   resize 之后调用一次（此时 W/H 有效）
     mechAssign(use)                换句时调用；use = {g, spans, at, cc, lineT, lineDur}
     mechUpdate(dt, T)              每帧物理（dt 已经扣掉顿帧）
     mechDraw(T, z, pjX, pjY)       每帧绘制（背景已画好，直接在 ctx 上画）
   可选钩子：
     mechInit()                     模块初始化（W/H 还是 0，别在这里用 W/H 撒点）
     mechEvent(k, first)            词团命中后调用（默认的顿帧/白闪/变焦/震动已经做了）
   可直接用：
     W H DPR ctx cv hint
     cam {x,y,ox,oy,z,tz,vz,rot,vrot,sh,shx,shy}   ox/oy 是镜头平移偏移（甩镜/环绕用）
     AE {freeze,flash}
     lines curIdx L spans charChars charGlow blockGx blockGy lineT lineDur accent
     rnd(a,b) clamp01(v) hitStop(s) flash(v) camShake(dx,dy,amp)
   ========================================================================== */

/* ============================ 0 · 画布 ============================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
let bgCv = null;
let L = null, curIdx = -1;

/* ============================ 1 · 时钟 ============================ */
let lines = [];
let accent = [186, 206, 255];
let clockT = 0, clockAt = 0, playing = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ============================ 2 · 分词 ============================ */
let DICT = null;
fetch('/segdict.bin').then((r) => (r.ok ? r.arrayBuffer() : null))
  .then((b) => { if (b) DICT = new Uint32Array(b); }).catch(() => {});
const fnv = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function isWord(s, i, Ln) {
  if (!DICT) return false;
  const h = fnv(s.substr(i, Ln));
  let lo = 0, hi = DICT.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = DICT[m]; if (v === h) return true; if (v < h) lo = m + 1; else hi = m - 1; }
  return false;
}
function segWords(text) {
  const fwd = [];
  for (let i = 0; i < text.length;) {
    let hit = 0;
    for (let Ln = Math.min(4, text.length - i); Ln >= 2; Ln--) if (isWord(text, i, Ln)) { hit = Ln; break; }
    if (hit) { fwd.push(text.substr(i, hit)); i += hit; } else { fwd.push(text[i]); i++; }
  }
  const bwd = [];
  for (let j = text.length; j > 0;) {
    let hit = 0;
    for (let Ln = Math.min(4, j); Ln >= 2; Ln--) if (isWord(text, j - Ln, Ln)) { hit = Ln; break; }
    if (hit) { bwd.unshift(text.substr(j - hit, hit)); j -= hit; } else { bwd.unshift(text[j - 1]); j--; }
  }
  return fwd.length <= bwd.length ? fwd : bwd;
}
const MAXG = 3;
const PUNCT = /[，。！？、；：,.!?;:…—~·「」『』（）()《》【】"]/;
const SPACE = /\s/;
function isLatin(text) { let la = 0, cjk = 0; for (let i = 0; i < text.length; i++) { const c = text[i]; if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) la++; else if (c >= '\u4e00' && c <= '\u9fff') cjk++; } return la > cjk; }
function latinSpans(text) {
  const out = []; let i = 0;
  while (i < text.length) {
    if (SPACE.test(text[i])) { i++; continue; }
    let j = i; while (j < text.length && !SPACE.test(text[j])) j++;
    out.push({ i0: i, i1: j }); i = j;
  }
  return out;
}
const SUFFIX = /^[的了着过地得吗呢吧啊嘛]$/;
const PREFIX = /^[但还就才又也都把被在从向对和与而却很不没最更将已曾让给]$/;
const countChars = (s) => { let n = 0; for (let i = 0; i < s.length; i++) if (!PUNCT.test(s[i]) && !SPACE.test(s[i])) n++; return n; };
function groupByWords(text) {
  const words = segWords(text), out = [];
  let cur = '', start = 0, chars = 0, pos = 0;
  const flush = (end) => { if (cur) { out.push({ i0: start, i1: end }); cur = ''; chars = 0; } };
  for (const w of words) {
    const at = pos; pos += w.length;
    const isP = PUNCT.test(w);
    if (!cur) { cur = w; start = at; chars = isP ? 0 : w.length; continue; }
    if (isP) { cur += w; if (chars >= 2) flush(pos); continue; }
    const single = w.length === 1;
    if (single && SUFFIX.test(w)) { cur += w; chars++; if (chars >= MAXG) flush(pos); continue; }
    if (single && PREFIX.test(w) && chars >= 2) { flush(at); cur = w; start = at; chars = 1; continue; }
    if (chars + w.length <= MAXG) { cur += w; chars += w.length; } else { flush(at); cur = w; start = at; chars = w.length; }
  }
  flush(text.length);
  for (let k = 0; k < out.length; k++) {
    const g = out[k];
    if (countChars(text.slice(g.i0, g.i1)) > 1) continue;
    const prev = out[k - 1], next = out[k + 1];
    if (prev && prev.i1 === g.i0 && countChars(text.slice(prev.i0, prev.i1)) < MAXG) { prev.i1 = g.i1; out.splice(k, 1); k--; }
    else if (next && next.i0 === g.i1 && countChars(text.slice(next.i0, next.i1)) < MAXG) { next.i0 = g.i0; out.splice(k, 1); k--; }
  }
  return out;
}
function groupByRule(text) {
  const out = []; let start = 0, chars = 0;
  for (let i = 0; i < text.length; i++) {
    const s = PUNCT.test(text[i]) || SPACE.test(text[i]);
    if (!s) chars++;
    if (s && chars >= 2) { out.push({ i0: start, i1: i + 1 }); start = i + 1; chars = 0; continue; }
    if (!s && chars > MAXG) { out.push({ i0: start, i1: i }); start = i; chars = 1; }
  }
  if (start < text.length) out.push({ i0: start, i1: text.length });
  return out;
}
const spansForLine = (t) => (isLatin(t) ? latinSpans(t) : (DICT ? groupByWords(t) : groupByRule(t)));

/* ============================ 3 · 字形采样 ============================ */
const offCv = document.createElement('canvas');
const octx = offCv.getContext('2d', { willReadFrequently: true });
const FONT = (px, wt) => `${wt || 800} ${px}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
function wrapText(text, fs, maxW, wt) {
  octx.font = FONT(fs, wt);
  const latin = isLatin(text);
  const rows = []; let start = 0, w = 0;
  for (let i = 0; i < text.length; i++) {
    const cw = octx.measureText(text[i]).width;
    if (!cw) continue;
    if (w + cw > maxW && i > start) {
      let brk = i;
      if (latin) { let j = i; while (j > start && !SPACE.test(text[j])) j--; if (j > start) brk = j; }
      rows.push({ i0: start, i1: brk, w: octx.measureText(text.slice(start, brk)).width });
      start = brk; w = 0;
      while (start < text.length && SPACE.test(text[start])) start++;
      if (start >= text.length) break;
      i = start - 1; continue;
    }
    w += cw;
  }
  if (start < text.length) rows.push({ i0: start, i1: text.length, w: octx.measureText(text.slice(start)).width });
  for (const r of rows) while (r.i1 - r.i0 > 1 && SPACE.test(text[r.i0])) r.i0++;
  return rows.length ? rows : [{ i0: 0, i1: text.length, w: octx.measureText(text).width }];
}
function sampleGlyph(text, opt) {
  opt = opt || {};
  const wt = opt.weight || 800;
  let fs = opt.fs || 92;
  const maxW = opt.maxW || Math.min(W * 0.78, 1180);
  const maxH = opt.maxH || H * 0.52;
  let rows = wrapText(text, fs, maxW, wt);
  let lh = fs * 1.16;
  if (rows.length * lh > maxH) { fs *= maxH / (rows.length * lh); rows = wrapText(text, fs, maxW, wt); lh = fs * 1.16; }
  octx.font = FONT(fs, wt);
  const widest = Math.max(1, ...rows.map((r) => octx.measureText(text.slice(r.i0, r.i1)).width));
  const padW = Math.ceil(widest) + 24, padH = Math.ceil(lh * rows.length) + 12;
  offCv.width = padW; offCv.height = padH;
  octx.font = FONT(fs, wt);
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.clearRect(0, 0, padW, padH);
  const n = text.length;
  const charCx = new Float32Array(n), charCy = new Float32Array(n);
  const rowMaps = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], str = text.slice(row.i0, row.i1);
    const cy = padH / 2 + (r - (rows.length - 1) / 2) * lh;
    octx.fillText(str, padW / 2, cy);
    const x0 = (padW - row.w) / 2, map = new Int16Array(padW).fill(-1);
    let acc = 0;
    for (let i = row.i0; i < row.i1; i++) {
      const cw = octx.measureText(text[i]).width;
      charCx[i] = x0 + acc + cw / 2 - padW / 2; charCy[i] = cy - padH / 2;
      for (let x = Math.max(0, Math.floor(x0 + acc)); x < Math.min(padW, Math.ceil(x0 + acc + cw)); x++) map[x] = i;
      acc += cw;
    }
    rowMaps.push({ y0: cy - lh / 2, y1: cy + lh / 2, map });
  }
  const d = octx.getImageData(0, 0, padW, padH).data;
  const pxA = [], pyA = [], ownA = [];
  const step = opt.step || 2;
  for (let y = 0; y < padH; y += step) {
    let rm = null;
    for (let r = 0; r < rowMaps.length; r++) { const m = rowMaps[r]; if (y >= m.y0 && y < m.y1) { rm = m; break; } }
    if (!rm) continue;
    const map = rm.map, base = y * padW;
    for (let x = 0; x < padW; x += step) {
      if (d[(base + x) * 4 + 3] <= 128) continue;
      const c = map[x]; if (c < 0) continue;
      pxA.push(x - padW / 2); pyA.push(y - padH / 2); ownA.push(c);
    }
  }
  return { px: Float32Array.from(pxA), py: Float32Array.from(pyA), own: Int16Array.from(ownA),
           pc: pxA.length, n, charCx, charCy, fs, w: widest, h: lh * rows.length, rows: rows.length, padW, padH };
}

/* ============================ 4 · 句索引 / 预取 ============================ */
let brewIdx = -1, lastT = -1;
let prep = null, spans = [], charChars = null, charGlow = new Float32Array(0);
let blockGx = 0, blockGy = 0, lineT = 0, lineDur = 4;
const hintShow = (s, o) => { hint.textContent = s; hint.style.opacity = o; };

function prepLine(idx) {
  const line = lines[idx];
  if (!line || !line.text) return null;
  const text = line.text;
  const latin = isLatin(text);
  const lab = typeof mechFs === 'function' ? mechFs(text, latin) : (latin ? 92 : (text.length <= 10 ? 112 : text.length <= 16 ? 96 : 82));
  const g = sampleGlyph(text, { fs: lab, step: typeof mechStep === 'function' ? mechStep(text) : 2,
    maxW: Math.min(W * 0.78, 1180), maxH: H * 0.52 });
  if (!g.pc) return null;
  g.text = text;
  const cc = line.chars && line.chars.length === text.length ? line.chars : null;
  const dur = line.dur || 4;
  const at = new Float32Array(g.n);
  const cap = line.t + dur * 0.86;   /* YRC 溢出句长时压缩进句内，保证整句都能唱完 */
  for (let c = 0; c < g.n; c++) {
    const raw = cc && cc[c] && typeof cc[c].t === 'number' ? cc[c].t : line.t + dur * (c / Math.max(1, g.n));
    at[c] = Math.min(raw, cap);
  }
  const raw = spansForLine(text);
  const spanOf = new Int16Array(g.n).fill(-1);
  const spList = [];
  for (let k = 0; k < raw.length; k++) {
    const s = raw[k];
    if (!s || s.i1 <= s.i0) continue;
    spList.push({ i0: s.i0, i1: s.i1, t: at[Math.min(g.n - 1, s.i0)], hit: 0 });
    for (let c = s.i0; c < s.i1; c++) spanOf[c] = spList.length - 1;
  }
  if (!spList.length) return null;
  for (let k = 1; k < spList.length; k++) if (spList[k].t < spList[k - 1].t) spList[k].t = spList[k - 1].t;
  return { idx, g, spans: spList, spanOf, cc, at, text, lineT: line.t, lineDur: dur };
}

function assignLine(idx) {
  const use = (prep && prep.idx === idx) ? prep : prepLine(idx);
  if (!use) { L = null; return; }
  L = use.g; spans = use.spans; charChars = use.cc;
  charGlow = new Float32Array(L.n);
  blockGx = W / 2; blockGy = H * 0.46;
  lineT = use.lineT; lineDur = use.lineDur;
  cam.tz = 1.0; cam.ox = 0; cam.oy = 0;
  if (typeof mechAssign === 'function') mechAssign(use);
}

/* ============================ 5 · 相机 / 事件 ============================ */
const cam = { x: 0, y: 0, ox: 0, oy: 0, z: 1, tz: 1, vz: 0, sh: 0, dirx: 0, diry: 0, shx: 0, shy: 0, rot: 0, vrot: 0 };
const AE = { freeze: 0, flash: 0 };
const hitStop = (s) => { AE.freeze = Math.max(AE.freeze, s); };
const flash = (v) => { AE.flash = Math.max(AE.flash, v); };
function camShake(dx, dy, amp) {
  const l = Math.hypot(dx, dy) || 1;
  cam.dirx = dx / l; cam.diry = dy / l;
  cam.sh = Math.min(26, Math.max(cam.sh, amp));
}
function camUpdate(dt, T) {
  const ke = 1 - Math.pow(0.0016, dt);
  cam.tx = W / 2 + cam.ox;
  cam.ty = H * 0.48 + cam.oy;
  cam.x += (cam.tx - cam.x) * ke;
  cam.y += (cam.ty - cam.y) * ke;
  cam.vz += ((cam.tz - cam.z) * 185 - cam.vz * 22) * dt;
  cam.z += cam.vz * dt;
  cam.vrot += (-cam.rot * 240 - cam.vrot * 21) * dt;
  cam.rot += cam.vrot * dt;
  cam.sh *= Math.pow(0.00004, dt);
  const wob = Math.sin(T * 59.3) * 0.62 + Math.sin(T * 40.1 + 1.2) * 0.38;
  cam.shx = cam.dirx * cam.sh * wob;
  cam.shy = cam.diry * cam.sh * wob;
}

/* ============================ 6 · 背景 ============================ */
function buildBg() {
  if (!bgCv) bgCv = document.createElement('canvas');
  const bw = Math.max(2, Math.round(W / 2)), bh = Math.max(2, Math.round(H / 2));
  bgCv.width = bw; bgCv.height = bh;
  const g = bgCv.getContext('2d');
  const grd = g.createRadialGradient(bw * 0.5, bh * 0.44, 0, bw * 0.5, bh * 0.5, Math.max(bw, bh) * 0.8);
  grd.addColorStop(0, '#11161f');
  grd.addColorStop(0.55, '#0a0e16');
  grd.addColorStop(1, '#030509');
  g.fillStyle = grd; g.fillRect(0, 0, bw, bh);
}

/* ============================ 7 · 主循环 ============================ */
let last = performance.now();
let T0 = 0;

function frame(nowMs) {
  const dtReal = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; T0 += dtReal;
  if (AE.freeze > 0) AE.freeze -= dtReal;
  const dt = AE.freeze > 0 ? 0 : dtReal;

  const T = now();
  timing(T);

  if (L) {
    if (charChars) for (let c = 0; c < L.n; c++) charGlow[c] = charChars[c] ? clamp01((T - charChars[c].t) / 0.22) : 0;
    else for (let c = 0; c < L.n; c++) charGlow[c] = clamp01((T - lineT - lineDur * 0.85 * c / L.n) / 0.3);
  }

  if (L && spans.length) {
    for (let k = 0; k < spans.length; k++) {
      const s = spans[k];
      if (s.hit || T < s.t || T > s.t + 0.4) continue;
      s.hit = 1;
      const first = k === 0;
      hitStop(first ? 0.05 : 0.024);
      flash(first ? 0.36 : 0.15);
      cam.tz = first ? 1.06 : 1.03;
      camShake(1, 0.18, first ? 11 : 5.5);
      cam.vrot += (k % 2 ? 1 : -1) * (first ? 0.55 : 0.28);
      if (typeof mechEvent === 'function') mechEvent(k, first);
    }
    cam.tz += (1.0 - cam.tz) * Math.min(1, dtReal * 2.4);
  }

  camUpdate(dtReal, T0);
  const z = cam.z;
  const cosR = Math.cos(cam.rot), sinR = Math.sin(cam.rot);
  const pjX = (x, y) => { const dx = (x - cam.x) * z, dy = (y - cam.y) * z; return W / 2 + cam.shx + dx * cosR - dy * sinR; };
  const pjY = (x, y) => { const dx = (x - cam.x) * z, dy = (y - cam.y) * z; return H / 2 + cam.shy + dx * sinR + dy * cosR; };

  if (typeof mechUpdate === 'function') mechUpdate(dt, T);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#05070b';
  ctx.fillRect(0, 0, W, H);
  if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);
  if (typeof mechDraw === 'function') mechDraw(T, z, pjX, pjY);

  ctx.globalCompositeOperation = 'source-over';
  if (AE.flash > 0.012) {
    ctx.fillStyle = `rgba(232,240,250,${(AE.flash * 0.05).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    AE.flash *= Math.pow(0.000004, dtReal);
  }

  requestAnimationFrame(frame);
}

/* ============================ 8 · 节奏 ============================ */
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) { curIdx = -1; brewIdx = -1; L = null; prep = null; }
  lastT = T;
  let c = curIdx;
  while (c + 1 < lines.length && T >= lines[c + 1].t) c++;
  if (c !== curIdx) {
    curIdx = c; brewIdx = -1; prep = null;
    if (curIdx >= 0) { assignLine(curIdx); hintShow('', 0); }
    else hintShow(lines.length ? '等待第一句…' : '这首没有歌词', 0.5);
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    if (T >= lines[nx].t - Math.min(1.5, Math.max(0.55, gap * 0.5))) { brewIdx = nx; prep = prepLine(nx); }
  }
}

/* ============================ 9 · 通信协议 ============================ */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    if (p.accent && p.accent.length >= 3) accent = p.accent;
    curIdx = -1; brewIdx = -1; lastT = -1; L = null; prep = null; spans = [];
    clockT = 0; clockAt = performance.now();
    if (typeof mechInitLine === 'function') mechInitLine();
    hintShow(lines.length ? '等待第一句…' : '这首没有歌词', lines.length ? 1 : 0.5);
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    const lv = (d.payload && d.payload.level) || 0.6;
    camShake(1, 0.2, 1.4 + lv * 2.2);
    cam.tz = Math.max(cam.tz, 1.02 + lv * 0.02);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => ({
  curIdx, n: lines.length, pc: L ? L.pc : 0, spans: spans.length,
  z: +cam.z.toFixed(3), t: +now().toFixed(2),
});

/* ============================ 10 · 启动 ============================ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.max(2, Math.round(W * DPR));
  cv.height = Math.max(2, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg();
  cam.x = W / 2; cam.y = H * 0.48; cam.tx = cam.x; cam.ty = cam.y;
  if (typeof mechResize === 'function') mechResize();
  if (L && curIdx >= 0) {
    const p2 = prepLine(curIdx);
    if (p2) { prep = p2; assignLine(curIdx); }
  }
}
addEventListener('resize', resize);




/* ===== MECH · 终章·星环 ===== */
/* lyra100 · 终章 · 星环 · finale
   一颗暖金的恒星被一整圈冷银蓝星环包住。
   · 环：7000 颗极坐标粒子（4 道环带，r≈258~542，厚度 12），y*0.32 压成 3D 斜环，
     每帧沿环绕行；靠近字位的粒子被"推开"——缺口内缘堆积的亮点就是笔画轮廓。
   · 字：字形采样点投到环的极坐标上（x→极角、y→半径；按 1/|N| 做各向异性补偿，
     所以屏幕上每个字都是同一高度，不受环的压扁影响）。极角由弧长积分求出，
     屏幕横向量永远等长。缺口边缘再撒一圈细白粒子 = 能读出字的那层。
     基座把长句折成多行时，第 1 行上环、第 2 行下环（像钱币铭文），各自补偿。
   · 恒星：两块预烘贴图（日冕晕 + 光球）各 blit 一次；表面几条亮弧当米粒组织。
   · 爆发：每句首词命中，720 颗日冕粒子从恒星抛出，扫过缺口时边缘整片点亮。
   · AE：顿帧 + difference 负片闪白（冻结期间一直负着）+ 冲击推镜 + 滚转；
     镜头椭圆环绕 + 缓推。
   每帧 fillStyle 8 次，全部同色 batch rect；不逐颗 drawImage / arc / 渐变 / 阴影。
*/

const TILT100 = 0.32;             /* 环面 3D 倾斜：屏幕 y = v*0.32 */
const N100 = 7000;                /* 环粒子 */
const NRIM100 = 3000;             /* 缺口边缘细亮粒子 */
const NS100 = 820;                /* 背景星尘 */
const NCOR100 = 720;              /* 日冕爆发粒子 */
const RIN100 = 258, ROUT100 = 542, RCTR100 = 400;
const FC100 = 3;                  /* 缺口场格子（世界单位） */

/* ---------------- 环粒子 ---------------- */
const pr100 = new Float32Array(N100), pa100 = new Float32Array(N100);
const ph100 = new Float32Array(N100), pv100 = new Float32Array(N100);
const ps100 = new Float32Array(N100), pb100 = new Uint8Array(N100);
const sx100 = new Float32Array(N100), sy100 = new Float32Array(N100);
let ring100 = 0, SC100 = 1;

/* ---------------- 背景星尘（W/H 预撒，mechResize 里初始化） ---------------- */
const stx100 = new Float32Array(NS100), sty100 = new Float32Array(NS100);
const smg100 = new Float32Array(NS100), sdr100 = new Float32Array(NS100);

/* ---------------- 字 = 缺口边缘 ---------------- */
const rimU100 = new Float32Array(NRIM100), rimV100 = new Float32Array(NRIM100);
const rimR100 = new Float32Array(NRIM100);
let nrim100 = 0;

/* 缺口密度场（blur 过的墨水掩码）：粒子在里面就沿 -∇F 被推出去 */
let fld100 = null, fldW100 = 2, fldH100 = 2, fldX010 = 0, fldY010 = 0, fldOn100 = 0;
let pgf100 = 0, pgu100 = 0, pgv100 = 0;

/* 环上一圈的排字表：每段文字一份 θ(x) 弧长积分表 */
let groups100 = null, K100 = 1, RC100 = 400;

/* ---------------- 恒星贴图 / 日冕 ---------------- */
let glow100 = null, ball100 = null;
const corA100 = new Float32Array(NCOR100), corJ100 = new Float32Array(NCOR100);
const corH100 = new Float32Array(NCOR100), corS100 = new Float32Array(NCOR100);
let corReady100 = 0;

/* ---------------- AE / 相机 ---------------- */
let bAge100 = -1, bR100 = 0;
let punch100 = 0, roll100 = 0, neg100 = 0;
let lastUse100 = null;

function bake100() {
  const n = 256;
  const mk = (stops) => {
    const c = document.createElement('canvas');
    c.width = c.height = n;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    for (let i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
    g.fillStyle = gr;
    g.fillRect(0, 0, n, n);
    return c;
  };
  glow100 = mk([[0, 'rgba(255,232,182,0.50)'], [0.20, 'rgba(255,200,124,0.24)'],
  [0.52, 'rgba(255,152,72,0.085)'], [1, 'rgba(255,120,40,0)']]);
  ball100 = mk([[0, '#fffdf4'], [0.30, '#ffefbc'], [0.50, '#ffd07c'],
  [0.60, '#ff9f48'], [0.66, 'rgba(255,124,42,0.45)'], [1, 'rgba(255,90,30,0)']]);
}

function initRing100() {
  const CL = [302, 366, 430, 494], WG = [0.30, 0.28, 0.25, 0.17];
  for (let i = 0; i < N100; i++) {
    let u = Math.random(), ci = 3, acc = 0;
    for (let k = 0; k < 4; k++) { acc += WG[k]; if (u <= acc) { ci = k; break; } }
    let r = CL[ci] + (Math.random() + Math.random() + Math.random() - 1.5) * 11;
    if (Math.random() < 0.07) r = RIN100 + Math.random() * (ROUT100 - RIN100);  /* 环缝里的浮尘 */
    pr100[i] = r * SC100;
    pa100[i] = Math.random() * Math.PI * 2;
    ph100[i] = (Math.random() + Math.random() + Math.random() - 1.5) * 6;      /* 厚度 12 */
    pv100[i] = 0.052 + 0.030 * (1 - (r - RIN100) / (ROUT100 - RIN100)) + Math.random() * 0.010;
    ps100[i] = (1.3 + Math.random() * 1.3) * SC100;
    pb100[i] = Math.random() < 0.46 ? 1 : 0;
  }
  ring100 = 1;
}

function initCor100() {
  for (let i = 0; i < NCOR100; i++) {
    corA100[i] = Math.random() * Math.PI * 2;
    corJ100[i] = (Math.random() + Math.random() - 1) * 15;
    corH100[i] = (Math.random() + Math.random() - 1) * 8;
    corS100[i] = 1.5 + Math.random() * 2.0;
  }
  corReady100 = 1;
}

function mechResize() {
  if (!W || !H) return;
  const ns = Math.max(0.62, Math.min(1.55, Math.min(W / 1440, H / 810)));
  if (ring100) {
    const k = ns / SC100;
    for (let i = 0; i < N100; i++) { pr100[i] *= k; ph100[i] *= k; ps100[i] *= k; }
  }
  SC100 = ns;
  for (let i = 0; i < NS100; i++) {
    stx100[i] = Math.random() * W;
    sty100[i] = Math.random() * H;
    smg100[i] = Math.pow(Math.random(), 2.6);
    sdr100[i] = 0.5 + Math.random() * 4.6;
  }
  if (!glow100) bake100();
  if (!ring100) initRing100();
  if (!corReady100) initCor100();
  neg100 = 0; punch100 = 0; roll100 = 0; bAge100 = -1; bR100 = 0;
  if (lastUse100) layout100(lastUse100);
}

/* ==========================================================================
   锥形排字：字形点 → 环的极坐标
   x 方向走弧长积分（屏幕每列等宽），y 方向按 1/|N_screen| 补偿（屏幕每行等高）。
   基座的排版可能把长句折成 2 行 → 上环一段、下环一段（下环整段翻转 180° 保持正立）。
   ========================================================================== */
function layout100(use) {
  nrim100 = 0; fldOn100 = 0; groups100 = null;
  const g = use && use.g;
  if (!g || !g.pc) return;
  const pc = g.pc, gx = g.px, gy = g.py;
  if (!ring100) initRing100();

  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let p = 0; p < pc; p++) {
    const x = gx[p], y = gy[p];
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (!(x1 - x0 > 1e-3) || !(y1 - y0 > 1e-3)) return;
  const lh = y1 - y0;
  const RC = RCTR100 * SC100;
  RC100 = RC;

  /* --- 按 y 方向的空档把字形块拆成基座排出来的几行 --- */
  const CH = 3;
  const NB = Math.max(8, Math.ceil(lh / CH) + 2);
  const hist = new Uint16Array(NB);
  for (let p = 0; p < pc; p++) {
    let b = ((gy[p] - y0) / CH) | 0;
    if (b < 0) b = 0; else if (b >= NB) b = NB - 1;
    hist[b]++;
  }
  const minGap = 2;   /* 基座的行距很紧（≈6~15 单位），空 2 格就算换行 */
  const bands = [];
  let bs = -1;
  for (let b = 0; b <= NB; b++) {
    const on = b < NB && hist[b] > 0;
    if (on) { if (bs < 0) bs = b; continue; }
    if (bs < 0) continue;
    let e = b;
    while (e < NB && hist[e] === 0) e++;
    if (e - b >= minGap || e >= NB) { bands.push([y0 + bs * CH, y0 + b * CH]); bs = -1; }
    b = e - 1;
  }
  if (!bands.length) bands.push([y0, y1]);
  /* 太薄的带（零星的点 / 标点的上沿）并回上一条，别把一行字劈开 */
  const solid = [];
  for (let i = 0; i < bands.length; i++) {
    const bd = bands[i];
    let n = 0;
    for (let p = 0; p < pc; p++) if (gy[p] >= bd[0] - 0.6 && gy[p] <= bd[1] + 0.6) n++;
    if (solid.length && (n < pc * 0.09 || bd[1] - bd[0] < lh * 0.07)) solid[solid.length - 1][1] = bd[1];
    else solid.push([bd[0], bd[1]]);
  }
  bands.length = 0;
  for (let i = 0; i < solid.length; i++) bands.push(solid[i]);

  /* 每行的横向范围 */
  const meta = [];
  for (let i = 0; i < bands.length; i++) {
    const ya = bands[i][0], yb = bands[i][1];
    let xa = 1e9, xb = -1e9, n = 0;
    for (let p = 0; p < pc; p++) {
      const y = gy[p];
      if (y < ya - 0.6 || y > yb + 0.6) continue;
      const x = gx[p];
      if (x < xa) xa = x; if (x > xb) xb = x; n++;
    }
    if (n > 3 && xb > xa) meta.push({ ya: ya, yb: yb, yc: (ya + yb) * 0.5, xa: xa, xb: xb });
  }
  if (!meta.length) return;

  /* 1~2 行就一行一段；更多行时合并成上下两段 */
  let grp;
  if (meta.length <= 2) {
    grp = meta.map((r) => ({ y0: r.ya, y1: r.yb, yc: r.yc, xa: r.xa, xb: r.xb }));
  } else {
    const h = Math.ceil(meta.length / 2);
    const pack = (arr) => {
      let xa = 1e9, xb = -1e9, ya = 1e9, yb = -1e9;
      for (let i = 0; i < arr.length; i++) {
        const r = arr[i];
        if (r.xa < xa) xa = r.xa; if (r.xb > xb) xb = r.xb;
        if (r.ya < ya) ya = r.ya; if (r.yb > yb) yb = r.yb;
      }
      return { y0: ya, y1: yb, yc: (ya + yb) * 0.5, xa: xa, xb: xb };
    };
    grp = [pack(meta.slice(0, h)), pack(meta.slice(h))];
  }
  grp[0].sdir = 1; grp[0].upS = 1; grp[0].target = -Math.PI / 2;
  if (grp[1]) { grp[1].sdir = -1; grp[1].upS = -1; grp[1].target = Math.PI / 2; }

  /* 字号：屏幕上每行字高 ≈ S */
  const swOf = (gp, S2) => ((gp.xb - gp.xa) * S2 / Math.max(1, gp.y1 - gp.y0)) / (RC * 0.84);
  let S = 62 * SC100, mx = 0;
  for (let i = 0; i < grp.length; i++) { const s = swOf(grp[i], S); if (s > mx) mx = s; }
  if (mx > 1.95) S *= 1.95 / mx;
  if (S < 30 * SC100) S = 30 * SC100;

  /* 每段一张 θ(x) 弧长积分表（两遍：先量总转角，再居中） */
  for (let i = 0; i < grp.length; i++) {
    const gp = grp[i];
    const K = S / Math.max(1, gp.y1 - gp.y0);
    const NX = 96, dx = (gp.xb - gp.xa) / NX;
    const th = new Float32Array(NX + 1);
    let th0 = gp.target;
    for (let pass = 0; pass < 3; pass++) {
      let a = th0;
      th[0] = a;
      for (let j = 0; j < NX; j++) {
        const tm = Math.hypot(Math.sin(a), Math.cos(a) * TILT100);
        a += gp.sdir * (dx * K) / (RC * (tm > 0.30 ? tm : 0.30));
        th[j + 1] = a;
      }
      if (pass < 2) th0 = gp.target - (a - th[0]) * 0.5;
    }
    gp.K = K; gp.th = th; gp.dx = dx;
  }
  groups100 = grp;

  const thOf = (gp, x) => {
    let f = (x - gp.xa) / gp.dx;
    if (f < 0) f = 0; else if (f > 96) f = 96;
    const i = f | 0, t = f - i;
    return gp.th[i] + (gp.th[i + 1] - gp.th[i]) * t;
  };
  const gpOfY = (y) => {
    if (!grp[1]) return grp[0];
    const mid = (grp[0].y1 + grp[1].y0) * 0.5;
    return y <= mid ? grp[0] : grp[1];
  };
  const toPlane = (x, y, out) => {
    const gp = gpOfY(y);
    const th = thOf(gp, x);
    const c = Math.cos(th), s = Math.sin(th);
    let nm = Math.hypot(c, s * TILT100);
    if (nm < 0.18) nm = 0.18;
    const r = RC - ((y - gp.yc) * gp.K * gp.upS) / nm;
    out[0] = r * c; out[1] = r * s;
  };

  /* --- 字形占据格（细，用来抽缺口边缘） --- */
  const CEL = 2;
  const gw = Math.max(3, Math.ceil((x1 - x0) / CEL) + 1);
  const gh = Math.max(3, Math.ceil((y1 - y0) / CEL) + 1);
  const occ = new Uint8Array(gw * gh);
  for (let p = 0; p < pc; p++) {
    const ix = ((gx[p] - x0) / CEL) | 0, iy = ((gy[p] - y0) / CEL) | 0;
    if (ix >= 0 && iy >= 0 && ix < gw && iy < gh) occ[iy * gw + ix] = 1;
  }
  /* 基座的字形采样本来就是 2 单位的稠密点阵（笔画内部全填满），
     再膨胀会把笔画之间的细缝糊掉 —— 所以直接拿点阵当墨水掩码。 */

  /* --- 一遍扫：边界点（字） + 墨水点（缺口场） --- */
  const cap = Math.max(4096, Math.min(60000, gw * gh));
  const bU = new Float32Array(cap), bV = new Float32Array(cap);
  let nb = 0;
  const fu = new Float32Array(cap), fv = new Float32Array(cap);
  let nf = 0;
  const out2 = [0, 0];
  for (let y = 1; y < gh - 1; y++) {
    const row = y * gw;
    for (let x = 1; x < gw - 1; x++) {
      const k = row + x;
      if (!occ[k]) continue;
      toPlane(x0 + (x + 0.5) * CEL, y0 + (y + 0.5) * CEL, out2);
      if (!occ[k - 1] || !occ[k + 1] || !occ[k - gw] || !occ[k + gw]) {
        if (nb < cap) { bU[nb] = out2[0]; bV[nb] = out2[1]; nb++; }
      }
      if (nf < cap) { fu[nf] = out2[0]; fv[nf] = out2[1]; nf++; }
    }
  }

  /* 边界抽稀到 NRIM100，清一色白点（就是笔画轮廓） */
  if (nb > 0) {
    const st = Math.max(1, Math.ceil(nb / NRIM100));
    for (let i = 0; i < nb && nrim100 < NRIM100; i += st) {
      rimU100[nrim100] = bU[i]; rimV100[nrim100] = bV[i];
      rimR100[nrim100] = Math.hypot(bU[i], bV[i]);
      nrim100++;
    }
  }

  /* --- 缺口密度场 --- */
  if (nf > 2) {
    let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
    for (let i = 0; i < nf; i++) {
      if (fu[i] < mnx) mnx = fu[i]; if (fu[i] > mxx) mxx = fu[i];
      if (fv[i] < mny) mny = fv[i]; if (fv[i] > mxy) mxy = fv[i];
    }
    mnx -= 26; mny -= 26; mxx += 26; mxy += 26;
    fldW100 = Math.max(3, Math.ceil((mxx - mnx) / FC100) + 1);
    fldH100 = Math.max(3, Math.ceil((mxy - mny) / FC100) + 1);
    const F = new Float32Array(fldW100 * fldH100);
    for (let i = 0; i < nf; i++) {
      const ix = ((fu[i] - mnx) / FC100) | 0, iy = ((fv[i] - mny) / FC100) | 0;
      for (let b = 0; b < 3; b++) {
        const yy = iy + b - 1;
        if (yy < 0 || yy >= fldH100) continue;
        const rr = yy * fldW100;
        for (let a = 0; a < 3; a++) {
          const xx = ix + a - 1;
          if (xx >= 0 && xx < fldW100) F[rr + xx] += 1;
        }
      }
    }
    /* 1-2-1 两轮：缺口边缘变成一团平滑的"排斥坡" */
    const T2 = new Float32Array(F.length);
    for (let pass = 0; pass < 2; pass++) {
      for (let y = 0; y < fldH100; y++) {
        const rr = y * fldW100;
        for (let x = 0; x < fldW100; x++) {
          const k = rr + x;
          T2[k] = ((x > 0 ? F[k - 1] : F[k]) + F[k] * 2 + (x < fldW100 - 1 ? F[k + 1] : F[k])) * 0.25;
        }
      }
      for (let y = 0; y < fldH100; y++) {
        const rr = y * fldW100;
        for (let x = 0; x < fldW100; x++) {
          const k = rr + x;
          F[k] = ((y > 0 ? T2[k - fldW100] : T2[k]) + T2[k] * 2 +
            (y < fldH100 - 1 ? T2[k + fldW100] : T2[k])) * 0.25;
        }
      }
    }
    let fmax = 1e-6;
    for (let k = 0; k < F.length; k++) if (F[k] > fmax) fmax = F[k];
    const iv = 1 / fmax;
    for (let k = 0; k < F.length; k++) F[k] *= iv;
    fld100 = F; fldX010 = mnx; fldY010 = mny; fldOn100 = 1;
  }

  /* --- 换句时把环上粒子一次推干净（字立刻成形） --- */
  for (let it = 0; it < 7; it++) pushAll100(4.5);
}

/* 单点场采样（双线性 + 中心差分梯度） */
function fldGrad100(x, y) {
  pgf100 = 0;
  if (!fldOn100) return;
  const fx = (x - fldX010) / FC100, fy = (y - fldY010) / FC100;
  if (fx < 1 || fy < 1 || fx > fldW100 - 2.001 || fy > fldH100 - 2.001) return;
  const i = fx | 0, j = fy | 0, tx = fx - i, ty = fy - j, k = j * fldW100 + i;
  const F = fld100, W1 = fldW100;
  const a0 = F[k] + (F[k + 1] - F[k]) * tx;
  const b0 = F[k + W1] + (F[k + W1 + 1] - F[k + W1]) * tx;
  pgf100 = a0 + (b0 - a0) * ty;
  if (pgf100 < 0.02) { pgf100 = 0; return; }
  pgu100 = (F[k + 1] - F[k]) * (1 - ty) + (F[k + W1 + 1] - F[k + W1]) * ty;
  pgv100 = (F[k + W1] - F[k]) * (1 - tx) + (F[k + W1 + 1] - F[k + 1]) * tx;
}

/* 沿 -∇F 把粒子推出缺口；k = 最大步长 */
function pushAll100(k) {
  if (!fldOn100) return;
  const lo = RIN100 * SC100, hi = ROUT100 * SC100;
  for (let i = 0; i < N100; i++) {
    const th = pa100[i], r = pr100[i];
    const u = Math.cos(th) * r, v = Math.sin(th) * r;
    fldGrad100(u, v);
    if (pgf100 <= 0.02) continue;
    const gg = Math.sqrt(pgu100 * pgu100 + pgv100 * pgv100);
    let nr = r;
    if (gg > 1e-5) {
      const st = Math.min(k, pgf100 * k * 1.7);
      nr = r - (u * pgu100 + v * pgv100) / (gg * (r > 1 ? r : 1)) * st;
    } else {
      nr = r + (Math.random() - 0.5) * k * 1.6;
    }
    if (nr < lo) nr = lo; else if (nr > hi) nr = hi;
    pr100[i] = nr;
  }
}

function mechAssign(use) {
  lastUse100 = use;
  layout100(use);
}

function mechEvent(k, first) {
  punch100 = first ? 0.075 : 0.032;
  roll100 = (k % 2 ? 1 : -1) * (first ? 0.052 : 0.024);
  if (first) {
    hitStop(0.058);
    flash(0.44);
    camShake(0.35, 1, 14);
    neg100 = 1;              /* 负片闪白：冻结这几帧一直负着 */
    bAge100 = 0; bR100 = 68 * SC100;
  }
}

function mechUpdate(dt, T) {
  const d = dt > 0 ? dt : 0;
  punch100 *= Math.exp(-d * 3.4);
  roll100 *= Math.exp(-d * 4.7);
  if (neg100 > 0) neg100 -= d * 6.2;

  /* 环绕运镜：椭圆漂移 + 缓推 + 命中滚一下 */
  cam.ox = Math.sin(T * 0.19) * 26 + Math.sin(T * 0.43) * 5;
  cam.oy = Math.cos(T * 0.15) * 15;
  cam.tz = 1.02 + 0.032 * Math.sin(T * 0.115) + punch100;
  cam.rot = Math.sin(T * 0.11) * 0.014 + roll100;

  /* 日冕物质外扩 */
  if (bAge100 >= 0) {
    bAge100 += d;
    const u = Math.min(1, bAge100 / 0.9);
    bR100 = (68 + 520 * (1 - Math.pow(1 - u, 3))) * SC100;
    if (bAge100 > 1.35) { bAge100 = -1; bR100 = 0; }
  }

  /* 粒子绕行 + 被缺口推开 */
  const lo = RIN100 * SC100, hi = ROUT100 * SC100;
  const on = fldOn100 && d > 0;
  for (let i = 0; i < N100; i++) {
    let th = pa100[i] + pv100[i] * d;
    if (th > 6.2831853) th -= 6.2831853; else if (th < 0) th += 6.2831853;
    let r = pr100[i];
    if (on) {
      const u = Math.cos(th) * r, v = Math.sin(th) * r;
      fldGrad100(u, v);
      if (pgf100 > 0.03) {
        const gg = Math.sqrt(pgu100 * pgu100 + pgv100 * pgv100);
        if (gg > 1e-5) {
          const st = Math.min(7 * SC100, pgf100 * 62 * d);
          r -= (u * pgu100 + v * pgv100) / (gg * (r > 1 ? r : 1)) * st;
          if (r < lo) r = lo; else if (r > hi) r = hi;
        }
      }
    }
    pa100[i] = th; pr100[i] = r;
  }
}

function mechDraw(T, z, pjX, pjY) {
  const SX = W / 2, SY = H * 0.48;
  const cyaw = Math.cos(Math.sin(T * 0.17) * 0.10);
  const hotOn = bAge100 >= 0;

  /* ---- 0 · 远处星尘 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(118,148,206,0.44)';
  ctx.beginPath();
  const px0 = cam.ox * 0.10, py0 = cam.oy * 0.08;
  for (let i = 0; i < NS100; i++) {
    const u = (stx100[i] + T * sdr100[i]) % W;
    const v = sty100[i] + Math.sin(T * 0.13 + i * 1.7) * 1.8;
    const s = 0.8 + smg100[i] * 1.5;
    ctx.rect(u + px0, v + py0, s, s);
  }
  ctx.fill();

  /* ---- 1 · 环：先投影一遍，暗/亮两档同色 batch ---- */
  for (let i = 0; i < N100; i++) {
    const th = pa100[i], rr = pr100[i];
    const wx = SX + Math.cos(th) * rr * cyaw;
    const wy = SY + Math.sin(th) * rr * TILT100 + ph100[i] * cyaw;
    sx100[i] = pjX(wx, wy);
    sy100[i] = pjY(wx, wy);
  }
  ctx.globalCompositeOperation = 'lighter';

  ctx.fillStyle = 'rgba(74,116,186,0.55)';
  ctx.beginPath();
  for (let i = 0; i < N100; i++) {
    if (pb100[i] === 1) continue;
    if (hotOn && Math.abs(pr100[i] - bR100) < 30 * SC100) continue;
    const s = ps100[i] * z;
    ctx.rect(sx100[i] - s * 0.5, sy100[i] - s * 0.5, s, s * 0.92);
  }
  ctx.fill();

  ctx.fillStyle = 'rgba(200,228,255,0.80)';
  ctx.beginPath();
  for (let i = 0; i < N100; i++) {
    if (pb100[i] === 0 && !(hotOn && Math.abs(pr100[i] - bR100) < 30 * SC100)) continue;
    const s = ps100[i] * z;
    ctx.rect(sx100[i] - s * 0.5, sy100[i] - s * 0.5, s, s * 0.92);
  }
  ctx.fill();

  /* ---- 2 · 恒星：预烘晕 + 光球，各 blit 一次 ---- */
  const scx = pjX(SX, SY), scy = pjY(SX, SY);
  const SR = 92 * SC100 * z;
  ctx.globalAlpha = 0.9;
  ctx.drawImage(glow100, scx - SR * 1.6, scy - SR * 1.6, SR * 3.2, SR * 3.2);
  ctx.globalAlpha = 1;
  const BR = SR * 2.15;
  ctx.drawImage(ball100, scx - BR * 0.5, scy - BR * 0.5, BR, BR);

  /* ---- 3 · 米粒组织：几条亮弧（同色 batch） ---- */
  const Rb = BR * 0.255;
  ctx.fillStyle = 'rgba(255,242,208,0.42)';
  ctx.beginPath();
  const spin = T * 0.5 + cam.rot;
  for (let k = 0; k < 7; k++) {
    const lat = 0.22 + k * 0.23;
    const ex = Rb * Math.cos(lat), ey = Rb * Math.sin(lat) * 0.94;
    const ph = spin * (k % 2 ? 1.25 : 1) + k * 2.1;
    for (let j = 0; j < 13; j++) {
      const tt = ph + (j / 13 - 0.5) * 1.6;
      const ct = Math.cos(tt), stt = Math.sin(tt);
      const xx = scx + ct * ex - stt * ey * 0.42;
      const yy = scy + stt * ey;
      const s = 2.2 * z;
      ctx.rect(xx - s * 0.5, yy - s * 0.5, s, s * 0.8);
    }
  }
  ctx.fill();

  /* ---- 4 · 日冕爆发：一圈粒子从恒星往外扫 ---- */
  if (hotOn) {
    const fade = 1 - Math.max(0, (bAge100 - 0.55) / 0.8);
    ctx.fillStyle = 'rgba(255,212,146,' + (0.60 + 0.38 * fade).toFixed(3) + ')';
    ctx.beginPath();
    for (let i = 0; i < NCOR100; i++) {
      const th = corA100[i] + T * 0.22;
      const rr = bR100 + corJ100[i] * SC100;
      const wx = SX + Math.cos(th) * rr * cyaw;
      const wy = SY + Math.sin(th) * rr * TILT100 + corH100[i] * SC100;
      const X = pjX(wx, wy), Y = pjY(wx, wy);
      const s = corS100[i] * SC100 * z * (0.75 + 0.8 * fade);
      ctx.rect(X - s * 0.5, Y - s * 0.5, s, s * 0.9);
    }
    ctx.fill();
  }

  /* ---- 5 · 缺口边缘：能读出字的那层细亮粒子 ---- */
  if (nrim100) {
    ctx.fillStyle = 'rgba(232,246,255,0.86)';
    ctx.beginPath();
    for (let i = 0; i < nrim100; i++) {
      const wx = SX + rimU100[i] * cyaw;
      const wy = SY + rimV100[i] * TILT100;
      const X = pjX(wx, wy), Y = pjY(wx, wy);
      const s = 1.8 * z;
      ctx.rect(X - s * 0.5, Y - s * 0.5, s, s);
    }
    ctx.fill();

    /* 日冕扫过缺口时，边缘整片点亮 */
    if (hotOn) {
      let any = 0;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath();
      for (let i = 0; i < nrim100; i++) {
        const dd = rimR100[i] - bR100;
        if (dd > 34 * SC100 || dd < -34 * SC100) continue;
        const f = 1 - Math.abs(dd) / (34 * SC100);
        const s = (1.9 + 2.4 * f) * z;
        const wx = SX + rimU100[i] * cyaw;
        const wy = SY + rimV100[i] * TILT100;
        const X = pjX(wx, wy), Y = pjY(wx, wy);
        ctx.rect(X - s * 0.5, Y - s * 0.5, s, s);
        any++;
      }
      if (any) ctx.fill();
    }
  }

  /* ---- 6 · 冲击帧 / 负片闪白 ---- */
  if (neg100 > 0.22) {
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.92, neg100).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ===== v2 实体字覆盖层（自足版 rev2）：时间驱动 + 字区压暗，专治"旧机制自己那份字"错位重影 =====
   10-27 那批薄实现的机制留在下面当装饰；这一层在字区先铺一张柔边暗片（把底下的旧字压掉），
   再画实体字（三档 + 暗影 + 光晕），保证整句可读且不出现双描。                        */
const V2N = 7000;
const v2x = new Float32Array(V2N), v2y = new Float32Array(V2N);
const v2tx = new Float32Array(V2N), v2ty = new Float32Array(V2N);
const v2onw = new Int16Array(V2N), v2lum = new Float32Array(V2N);
const v2sx = new Float32Array(V2N), v2sy = new Float32Array(V2N), v2ss = new Float32Array(V2N);
const v2dz = new Float32Array(V2N);
let v2n = 0, v2lastL = null;
let v2core = 'rgb(244,248,255)', v2mid = 'rgb(178,205,242)', v2dim = 'rgb(64,84,116)';
let v2plate = null, v2pw = 0, v2ph = 0;

function v2prep() {
  const pc = L.pc;
  v2n = Math.min(V2N, Math.max(2000, pc >> 2));
  let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
  for (let i = 0; i < v2n; i++) {
    const pi = (i * pc / v2n) | 0;
    v2tx[i] = L.px[pi]; v2ty[i] = L.py[pi];
    v2onw[i] = L.own[pi];
    v2dz[i] = (Math.random() - 0.5) * 22;
    v2x[i] = v2tx[i]; v2y[i] = v2ty[i];
    if (v2tx[i] < mnx) mnx = v2tx[i]; if (v2tx[i] > mxx) mxx = v2tx[i];
    if (v2ty[i] < mny) mny = v2ty[i]; if (v2ty[i] > mxy) mxy = v2ty[i];
  }
  const a = accent || [186, 206, 255];
  v2core = 'rgb(' + (Math.min(255, 205 + a[0] * 0.20) | 0) + ',' + (Math.min(255, 212 + a[1] * 0.17) | 0) + ',' + (Math.min(255, 226 + a[2] * 0.11) | 0) + ')';
  v2mid = 'rgb(' + ((120 + a[0] * 0.55) | 0) + ',' + ((150 + a[1] * 0.42) | 0) + ',' + (Math.min(255, 170 + a[2] * 0.32) | 0) + ')';
  v2dim = 'rgb(' + ((30 + a[0] * 0.28) | 0) + ',' + ((40 + a[1] * 0.26) | 0) + ',' + ((55 + a[2] * 0.26) | 0) + ')';
  /* 字区压暗片（柔边），把底下旧机制那份字压掉 */
  v2pw = Math.max(320, Math.ceil((mxx - mnx) + 360));
  v2ph = Math.max(200, Math.ceil((mxy - mny) + 280));
  v2plate = document.createElement('canvas');
  v2plate.width = v2pw; v2plate.height = v2ph;
  const g = v2plate.getContext('2d');
  const gr = g.createRadialGradient(v2pw / 2, v2ph / 2, Math.min(v2pw, v2ph) * 0.10,
    v2pw / 2, v2ph / 2, Math.max(v2pw, v2ph) * 0.72);
  gr.addColorStop(0, 'rgba(4,6,11,0.40)');
  gr.addColorStop(0.55, 'rgba(4,6,11,0.26)');
  gr.addColorStop(0.82, 'rgba(4,6,11,0.07)');
  gr.addColorStop(1, 'rgba(4,6,11,0)');
  g.fillStyle = gr; g.fillRect(0, 0, v2pw, v2ph);
}

const v2prevDraw = mechDraw;
mechDraw = function (T, z, pjX, pjY) {
  v2prevDraw(T, z, pjX, pjY);
  if (!L || !L.pc) return;
  if (v2lastL !== L) { v2lastL = L; v2prep(); }
  if (!v2n) return;
  const enter = clamp01((T - lineT) / 1.1);
  /* 1) 字区压暗（压掉旧机制自己的那份字） */
  if (v2plate && enter > 0.15) {
    const cxs = pjX(blockGx, blockGy), cys = pjY(blockGx, blockGy);
    const wp = v2pw * z, hp = v2ph * z;
    ctx.globalAlpha = Math.min(1, (enter - 0.15) * 1.6);
    ctx.drawImage(v2plate, cxs - wp / 2, cys - hp / 2, wp, hp);
    ctx.globalAlpha = 1;
  }
  const yaw = Math.sin(T * 0.20) * 0.15, pit = 0.06 * Math.sin(T * 0.17);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit);
  for (let i = 0; i < v2n; i++) {
    const X0 = v2x[i], Y0 = v2y[i], Z0 = v2dz[i];
    const X1 = X0 * cy + Z0 * sy, Z1 = -X0 * sy + Z0 * cy;
    const Y1 = Y0 * cp - Z1 * sp, Z2 = Y0 * sp + Z1 * cp;
    const s = 900 / (900 + Z2);
    v2sx[i] = pjX(blockGx + X1 * s, blockGy + Y1 * s);
    v2sy[i] = pjY(blockGx + X1 * s, blockGy + Y1 * s);
    v2ss[i] = s;
    const gl = charGlow[v2onw[i]] || 0;
    v2lum[i] = clamp01(0.66 + 0.18 * Math.sin(T * 1.05 - X1 / 260) + 0.26 * gl);
  }
  ctx.globalAlpha = 0.34 * enter; ctx.fillStyle = '#000';
  ctx.beginPath();
  for (let i = 0; i < v2n; i++) { const r = 3.0 * v2ss[i]; ctx.rect(v2sx[i] + 3, v2sy[i] + 4, r * 2, r * 2); }
  ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.06 * enter; ctx.fillStyle = v2core;
  ctx.beginPath();
  for (let i = 0; i < v2n; i++) { if (v2lum[i] < 0.66 || (i % 2)) continue; const r = 5.0 * v2ss[i]; ctx.rect(v2sx[i] - r, v2sy[i] - r, r * 2, r * 2); }
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  const v2bands = [[0.56, 1.0, 1.0], [0.26, 0.80, 0.90], [-1, 0.58, 0.76]];
  const v2cols = [v2core, v2mid, v2dim];
  for (let b = 0; b < 3; b++) {
    const lo = v2bands[b][0], hi = b === 0 ? 1.01 : v2bands[b - 1][0];
    ctx.globalAlpha = v2bands[b][1] * enter;
    ctx.fillStyle = v2cols[b];
    ctx.beginPath();
    let any = 0;
    for (let i = 0; i < v2n; i++) {
      const l = v2lum[i];
      if (l < lo || l >= hi) continue;
      const rr = 3.0 * v2bands[b][2] * v2ss[i];
      ctx.rect(v2sx[i] - rr, v2sy[i] - rr, rr * 2, rr * 2);
      any++;
    }
    if (any) ctx.fill();
  }
  ctx.globalAlpha = 1;
};




/* 启动必须在机制片段之后：机制里的 const/let 在此之前还处于暂时性死区 */
resize();
requestAnimationFrame(frame);
</script>
