<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>311 · 甲壳微距</title>
<style>
  :root{
    --bg:#fcfcfa; --ink:#111214; --mut:#8d8c86; --dim:#c2bfb8;
    --acc:#b9763f; --line:rgba(17,18,20,.13); --line2:rgba(17,18,20,.2);
    --pad:clamp(13px,2.7vmin,32px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,"Inter","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .chrome{position:fixed;inset:0;pointer-events:none;z-index:3}

  /* ── 档案框：发丝线 + 四角定位刻 */
  .edge{position:absolute;inset:var(--pad);border:1px solid var(--line)}
  .edge i{position:absolute;width:9px;height:9px;border:0 solid var(--line2)}
  .edge i:nth-child(1){left:-1px;top:-1px;border-left-width:1px;border-top-width:1px}
  .edge i:nth-child(2){right:-1px;top:-1px;border-right-width:1px;border-top-width:1px}
  .edge i:nth-child(3){left:-1px;bottom:-1px;border-left-width:1px;border-bottom-width:1px}
  .edge i:nth-child(4){right:-1px;bottom:-1px;border-right-width:1px;border-bottom-width:1px}
  .edge u{position:absolute;background:var(--line2)}
  .edge u:nth-child(5){left:50%;top:-4px;width:1px;height:9px}
  .edge u:nth-child(6){left:50%;bottom:-4px;width:1px;height:9px}

  /* ── 四角档案标注 ── */
  .anno{position:absolute;font-size:clamp(8px,.92vmin,10.5px);letter-spacing:.2em;
    text-transform:uppercase;color:var(--mut);line-height:1.85;white-space:nowrap;font-weight:500}
  .anno b{display:block;color:var(--ink);font-weight:600;letter-spacing:.26em}
  .anno b em{font-style:normal;color:var(--acc)}
  .anno s{display:block;text-decoration:none;color:var(--dim);letter-spacing:.16em}
  .a-tl{left:calc(var(--pad) + 12px);top:calc(var(--pad) + 12px)}
  .a-tr{right:calc(var(--pad) + 12px);top:calc(var(--pad) + 12px);text-align:right}
  .a-bl{left:calc(var(--pad) + 12px);bottom:calc(var(--pad) + 34px);display:flex;align-items:flex-end;gap:14px}
  .a-br{right:calc(var(--pad) + 12px);bottom:calc(var(--pad) + 34px);text-align:right;display:flex;
    flex-direction:column;align-items:flex-end;gap:6px}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.14em}

  /* 比例尺 */
  .scale{display:flex;align-items:center;gap:0}
  .scale span{display:flex;flex-direction:column;align-items:center;gap:3px}
  .scale b{display:block;width:52px;height:5px;border:1px solid var(--line2);border-top:0;position:relative}
  .scale b::before,.scale b::after{content:"";position:absolute;top:0;width:1px;height:100%;background:var(--line2)}
  .scale b::before{left:50%}
  .scale em{font-style:normal;font-size:.86em;letter-spacing:.2em}

  /* 封面凭证 */
  .chip{width:34px;height:34px;border:1px solid var(--line2);background:#eee;object-fit:cover;
    display:block;filter:grayscale(1) contrast(1.25)}
  .chip.off{display:none}

  /* ── 歌词 ── */
  .label{position:absolute;left:50%;transform:translateX(-50%);
    bottom:clamp(88px,12vh,140px);width:min(90vw,1000px);text-align:center}
  .lyric{font-size:clamp(21px,2.25vw,38px);line-height:1.34;letter-spacing:.015em;font-weight:400;
    color:var(--ink);word-break:break-word;text-wrap:balance;min-height:1.34em}
  .lyric.sm{font-size:clamp(17px,1.62vw,27px);line-height:1.42}
  .lyric.xs{font-size:clamp(14px,1.24vw,20px);line-height:1.5;letter-spacing:.01em}
  .ch{color:var(--dim);transition:color .22s cubic-bezier(.2,.7,.2,1)}
  .ch.on{color:var(--ink)}
  .ch.now{color:var(--ink)}
  .lyric.in{animation:lineIn .46s cubic-bezier(.16,.8,.24,1) both}
  @keyframes lineIn{
    from{opacity:0;transform:translateY(7px)}
    to{opacity:1;transform:none}
  }
  .empty .lyric{color:var(--dim);font-size:clamp(15px,1.3vw,19px);letter-spacing:.34em;text-transform:uppercase}

  /* 句下细线与计数 */
  .under{margin-top:clamp(10px,1.7vh,20px);display:flex;align-items:center;justify-content:center;gap:12px}
  .under .bar{display:block;width:min(46vw,340px);height:1px;background:var(--line);position:relative}
  .under .bar b{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--ink);transition:width .16s linear}
  .under .bar b::after{content:"";position:absolute;right:-3px;top:-2px;width:5px;height:5px;border-radius:50%;
    background:var(--acc);opacity:0;transition:opacity .2s}
  .under .bar b.live::after{opacity:1}
  .under .cnt{font-size:clamp(8px,.9vmin,10px);letter-spacing:.22em;color:var(--mut);font-variant-numeric:tabular-nums}

  /* ── 底部时间标尺 ── */
  .ruler{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--pad) + 15px);height:9px;
    border-top:1px solid var(--line)}
  .ruler .tick{position:absolute;top:0;width:1px;height:3px;background:var(--line2)}
  .ruler .tick.mj{height:6px;background:var(--line2)}
  .ruler .mark{position:absolute;top:-5px;width:1px;height:13px;background:var(--acc);left:0;
    transition:left .14s linear}
  .ruler .mcap{position:absolute;top:5px;font-size:clamp(7px,.8vmin,9px);letter-spacing:.2em;
    color:var(--mut);white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
  .ruler .mcap.l{left:1px}
  .ruler .mcap.r{right:1px}

  @media (max-aspect-ratio: 3/4){
    .lyric{font-size:clamp(19px,4.6vw,30px)}
    .lyric.sm{font-size:clamp(15px,3.7vw,23px)}
    .lyric.xs{font-size:clamp(13px,3vw,18px)}
    .a-bl{gap:9px}
    .a-tl s,.a-tr s{display:none}
    .label{bottom:clamp(100px,13vh,150px)}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="chrome">
  <div class="edge"><i></i><i></i><i></i><i></i><u></u><u></u></div>

  <div class="anno a-tl">
    <b>甲壳微距 <em>· 07/50</em></b>
    <s>MACRO-BIOMORPHIC MINIMALISM</s>
    <div id="aSpec" class="num">SPECIMEN 311-C · COLEOPTERA</div>
  </div>

  <div class="anno a-tr">
    <b id="aMag">×1180</b>
    <div class="scale"><span><b></b><em>0.5 mm</em></span></div>
    <s id="aPlate">PLATE 311 / DRY MOUNT</s>
    <s>1/250s · f/8 · ISO 100</s>
  </div>

  <div class="anno a-bl">
    <img class="chip off" id="chip" alt=""/>
    <div>
      <b id="aSong">—</b>
      <div id="aArtist">&nbsp;</div>
    </div>
  </div>

  <div class="anno a-br">
    <div class="num" id="aClock">00:00.00</div>
    <div class="num" id="aIdx">LINE — / —</div>
  </div>

  <div class="label" id="label">
    <div class="lyric" id="lyric"></div>
    <div class="under">
      <span class="bar"><b id="bar"></b></span>
      <span class="cnt" id="cnt">—</span>
    </div>
  </div>

  <div class="ruler" id="ruler">
    <i class="mark" id="mark"></i>
    <span class="mcap l" id="t0">00:00</span>
    <span class="mcap r" id="t1">--:--</span>
  </div>
</div>
<script>
(function(){
  'use strict';
  var S = {
    lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0,
    dur: 0, accent: [185,118,63], song: {name:'', artists:'', cover:''},
    reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: 0, h: 0, dpr: 1, started: false, beat: 0, beatLevel: 0,
    px: 0, py: 0, tx: 0, ty: 0, code: '311-A00',
    live: {bpm: 0, level: 0, bass: 0, mid: 0, treble: 0}, beatAt: -1e9
  };

  var $ = function(id){ return document.getElementById(id); };
  var cvs = $('c'), ctx = cvs.getContext('2d');
  var elSong = $('aSong'), elArtist = $('aArtist'), elLyric = $('lyric'), elLabel = $('label');
  var elClock = $('aClock'), elIdx = $('aIdx'), elBar = $('bar'), elCnt = $('cnt');
  var elRuler = $('ruler'), elMark = $('mark'), elT0 = $('t0'), elT1 = $('t1'), elChip = $('chip');
  var elSpec = $('aSpec'), elPlate = $('aPlate'), elMag = $('aMag');

  var clamp = function(v, a, b){ return v < a ? a : (v > b ? b : v); };
  var pad2 = function(n){ n = Math.max(0, Math.floor(n)); return (n < 10 ? '0' : '') + n; };
  function fmt(sec){
    sec = Math.max(0, sec || 0);
    return pad2(sec / 60) + ':' + pad2(sec % 60);
  }

  function fit(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = innerWidth, h = innerHeight;
    cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S.w = w; S.h = h; S.dpr = dpr;
  }

  function artistsText(a){
    if (Array.isArray(a)) return a.filter(Boolean).join(' / ');
    return a ? String(a) : '';
  }

  /* ── 歌词归一化：YRC 逐字 / LRC 均分 / 脏数据兜底 ── */
  function tokenize(line){
    var cps = Array.from(line.text), n = cps.length;
    var ch = line.chars, times = new Array(n), i;
    if (ch && ch.length === n){
      for (i = 0; i < n; i++){
        var v = ch[i] ? +ch[i].t : NaN;
        times[i] = isFinite(v) ? v : line.t + line.dur * (i / Math.max(1, n));
      }
    } else {
      for (i = 0; i < n; i++) times[i] = line.t + line.dur * (i / Math.max(1, n));
    }
    for (i = 1; i < n; i++) if (times[i] < times[i-1]) times[i] = times[i-1];
    return { cps: cps, times: times, n: n };
  }

  function normalizeLines(raw, duration){
    var out = [], i;
    for (i = 0; i < raw.length; i++){
      var L = raw[i] || {};
      var t = +L.t;
      var dur = +L.dur;
      out.push({
        t: isFinite(t) ? t : 0,
        dur: isFinite(dur) && dur > 0 ? dur : 0,
        text: L.text == null ? '' : String(L.text),
        chars: Array.isArray(L.chars) && L.chars.length ? L.chars : null
      });
    }
    out.sort(function(a, b){ return a.t - b.t; });
    for (i = 0; i < out.length; i++){
      var cur = out[i];
      var nxt = out[i+1] ? out[i+1].t : (duration > cur.t ? duration : cur.t + 5);
      if (!cur.dur) cur.dur = clamp(nxt - cur.t, 0.6, 14);
      cur.tokens = tokenize(cur);
    }
    return out;
  }

  function pickIdx(t){
    var L = S.lines, lo = 0, hi = L.length - 1, i = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (L[mid].t <= t + 1e-4) { i = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return i;
  }

  /* ── 歌词 DOM（换句才重建，绝不逐帧重建） ── */
  var spans = null, times = null, nt = 0, shown = 0;

  function paint(upTo){
    if (!spans) return;
    var k, from = shown;
    if (upTo < from){ for (k = 0; k < spans.length; k++) spans[k].className = 'ch'; from = 0; }
    for (k = from; k < upTo && k < spans.length; k++) spans[k].className = 'ch on';
    shown = upTo;
  }

  function setLine(i){
    var L = i >= 0 ? S.lines[i] : null;
    if (!L){
      spans = null; times = null; nt = 0; shown = 0;
      elLabel.classList.add('empty');
      elBar.style.width = '0%'; elBar.classList.remove('live');
      elCnt.textContent = '—';
      elLyric.textContent = S.lines.length ? '· · ·' : '无歌词记录 · NO LYRIC DATA';
      return;
    }
    var tk = L.tokens, n = tk.n;
    elLabel.classList.remove('empty');
    var frag = document.createDocumentFragment();
    spans = new Array(n);
    for (var k = 0; k < n; k++){
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = tk.cps[k];
      frag.appendChild(sp);
      spans[k] = sp;
    }
    elLyric.textContent = '';
    elLyric.appendChild(frag);
    elLyric.classList.toggle('sm', n > 22 && n <= 42);
    elLyric.classList.toggle('xs', n > 42);
    elLyric.classList.remove('in');
    void elLyric.offsetWidth;
    elLyric.classList.add('in');
    times = tk.times; nt = n; shown = 0;
    elCnt.textContent = pad2(i + 1) + ' / ' + pad2(S.lines.length);
  }

  function updateReveal(){
    if (!spans || !times) return;
    var k = 0, t = S.t + 0.001;
    while (k < nt && times[k] <= t) k++;
    if (k !== shown) paint(k);
  }

  /* ── 档案标头 / 比例尺 / 时间标尺 ── */
  function buildRuler(){
    var old = elRuler.querySelectorAll('.tick');
    for (var i = 0; i < old.length; i++) elRuler.removeChild(old[i]);
    var d = S.dur;
    elT1.textContent = d > 0 ? fmt(d) : '--:--';
    if (!(d > 0)) return;
    var step = d > 420 ? 60 : (d > 150 ? 30 : 15);
    for (var s = step; s < d - 0.5; s += step){
      var tk = document.createElement('i');
      tk.className = 'tick' + (s % (step * 2) === 0 ? ' mj' : '');
      tk.style.left = (s / d * 100).toFixed(3) + '%';
      elRuler.appendChild(tk);
    }
  }

  function setChip(url){
    if (!url){ elChip.className = 'chip off'; elChip.removeAttribute('src'); return; }
    elChip.className = 'chip';
    elChip.onerror = function(){ elChip.className = 'chip off'; };
    elChip.src = url;
  }

  function applyInit(p){
    p = p || {};
    S.song = p.song || {};
    S.dur = Math.max(0, +p.duration || 0);
    var raw = Array.isArray(p.lines) ? p.lines : [];
    if (Array.isArray(p.accent) && p.accent.length >= 3 &&
        isFinite(+p.accent[0]) && isFinite(+p.accent[1]) && isFinite(+p.accent[2])){
      var na = [clamp(+p.accent[0] | 0, 0, 255), clamp(+p.accent[1] | 0, 0, 255), clamp(+p.accent[2] | 0, 0, 255)];
      var pa = S.accent;
      if (na[0] !== pa[0] || na[1] !== pa[1] || na[2] !== pa[2] || !plate){
        S.accent = na;
        applyAccent();
        bake();
      }
    } else if (!plate){
      bake();
    }
    S.lines = normalizeLines(raw, S.dur);
    var name = S.song.name ? String(S.song.name) : '无题';
    var art = artistsText(S.song.artists);
    elSong.textContent = name;
    elArtist.textContent = art || '未知艺术家';
    setChip(S.song.cover || '');
    elPlate.textContent = 'PLATE 311 / ' + (S.dur > 0 ? fmt(S.dur) : 'DRY MOUNT');
    S.code = specimenCode(S.song.id || name);
    elSpec.textContent = 'SPECIMEN ' + S.code + ' · COLEOPTERA';
    buildRuler();

    var i = pickIdx(S.t);
    S.idx = i;
    setLine(i);
    updateReveal();
    hudUpdate();
  }

  function specimenCode(seed){
    var s = String(seed || '311'), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffff;
    return '311-' + 'ABCDEFGH'[h & 7] + (10 + (h >> 3) % 89);
  }

  var lastHud = -1, lastMark = -1;
  function hudUpdate(){
    var sec = Math.max(0, S.t), wh = Math.floor(sec / 60), ss = Math.floor(sec % 60);
    elClock.textContent = pad2(wh) + ':' + pad2(ss) + '.' + pad2((sec - Math.floor(sec)) * 100);
    elIdx.textContent = 'LINE ' + (S.idx < 0 ? '—' : pad2(S.idx + 1)) + ' / ' + pad2(S.lines.length);
    var p = S.dur > 0 ? clamp(S.t / S.dur, 0, 1) : 0;
    if (Math.abs(p - lastMark) > 0.0006){ elMark.style.left = (p * 100).toFixed(3) + '%'; lastMark = p; }
    var L = S.idx >= 0 ? S.lines[S.idx] : null;
    if (L){
      var q = clamp((S.t - L.t) / (L.dur || 1), 0, 1);
      elBar.style.width = (q * 100).toFixed(2) + '%';
      elBar.classList.toggle('live', S.playing && q > 0.001 && q < 0.999);
    }
  }

  /* ═══════════════════════════════════════════════════════
     主视觉：程序化复眼／甲壳微距标本（一次性烘焙，运行时只 drawImage）
     ═══════════════════════════════════════════════════════ */
  var PLATE = 1400, PLATE_R = 598;
  var plate = null, fgPlate = null;
  var AC = { a: [185,118,63], b: [90,120,150], c: [40,40,44], dark: [12,11,10] };

  function rgb2hsl(r, g, b){
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
    if (d > 1e-6){
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hsl2rgb(h, s, l){
    h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
    var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60){ r = c; g = x; } else if (h < 120){ r = x; g = c; }
    else if (h < 180){ g = c; b = x; } else if (h < 240){ g = x; b = c; }
    else if (h < 300){ r = x; b = c; } else { r = c; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }

  function applyAccent(){
    var h = rgb2hsl(S.accent[0], S.accent[1], S.accent[2]);
    var hue = h[0], sat = clamp(h[1], 0.2, 0.78), lum = clamp(h[2], 0.25, 0.72);
    AC.a = S.accent;
    AC.b = hsl2rgb(hue + 38, sat * 0.85, clamp(lum * 1.05, 0.3, 0.8));
    AC.c = hsl2rgb(hue + 172, sat * 0.8, clamp(lum * 0.95, 0.28, 0.72));
    AC.dark = hsl2rgb(hue, sat * 0.3, 0.055);
    document.documentElement.style.setProperty('--acc', 'rgb(' + AC.a[0] + ',' + AC.a[1] + ',' + AC.a[2] + ')');
  }

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* 不规则外缘：真实甲壳没有完美圆 */
  function rimPath(g, C, R, k){
    var n = 288, i, a, rr, x, y;
    g.beginPath();
    for (i = 0; i <= n; i++){
      a = i / n * 6.2832;
      rr = R * (1 + (0.017 * Math.sin(3 * a + 1.1) +
                     0.011 * Math.sin(7 * a + 2.4) +
                     0.007 * Math.sin(11 * a + 0.6)) * k);
      x = C + Math.cos(a) * rr; y = C + Math.sin(a) * rr;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.closePath();
  }

  function bakePlate(){
    var c = document.createElement('canvas');
    c.width = PLATE; c.height = PLATE;
    var g = c.getContext('2d');
    var C = PLATE / 2, R = PLATE_R;
    var rnd = mulberry32(31107);

    /* 壳体底色 + 复眼小眼面 */
    g.save();
    rimPath(g, C, R, 1); g.clip();
    g.fillStyle = 'rgb(' + AC.dark[0] + ',' + AC.dark[1] + ',' + AC.dark[2] + ')';
    g.fillRect(C - R, C - R, R * 2, R * 2);

    var Lx = -0.46, Ly = -0.58, Lz = 0.67;
    var cell = R * 0.0455;
    var K = Math.max(8, Math.round(R / (cell * 0.9)));
    var i, j, k;

    for (k = 0; k < K; k++){
      var rc = (k + 0.5) / K;
      if (rc > 0.995) continue;
      var ringR = rc * R;
      var cnt = Math.max(1, Math.round(6.2832 * ringR / cell));
      var step = 6.2832 / cnt;
      var z = Math.sqrt(Math.max(0.0001, 1 - rc * rc));
      var fr = Math.pow(1 - z, 2.1);
      var rad0 = cell * 0.5 * Math.pow(z, 0.5);

      for (j = 0; j < cnt; j++){
        var a = j * step + k * 0.41;
        var x = Math.cos(a) * ringR, y = Math.sin(a) * ringR;
        var nx = x / R, ny = y / R, nz = z;
        var d = nx * Lx + ny * Ly + nz * Lz;
        if (d < 0) d = 0;
        var sp = Math.pow(d, 34);
        var irid = 0.5 + 0.5 * Math.sin(a * 0.8 + 2.6 * z + 1.2);
        var tA = AC.a, tB = z > 0.72 ? AC.b : AC.c;
        var tr = tA[0] + (tB[0] - tA[0]) * irid;
        var tg = tA[1] + (tB[1] - tA[1]) * irid;
        var tb = tA[2] + (tB[2] - tA[2]) * irid;

        var base = 14 + 66 * Math.pow(d, 1.15);
        var warm = 0.09 + 0.62 * fr;
        var r0 = base * (1 - warm) + tr * warm;
        var g0 = base * (1 - warm) + tg * warm;
        var b0 = base * (1 - warm) + tb * warm;
        var sw = sp * 246;
        var rr = Math.min(255, r0 + sw) | 0;
        var gg = Math.min(255, g0 + sw) | 0;
        var bb = Math.min(255, b0 + sw) | 0;

        var rad = rad0 * 0.93;
        var rot = a + 0.5236 + k * 0.21;
        g.beginPath();
        for (i = 0; i < 6; i++){
          var ang = rot + i * 1.0472;
          var hx = C + x + Math.cos(ang) * rad, hy = C + y + Math.sin(ang) * rad;
          if (i) g.lineTo(hx, hy); else g.moveTo(hx, hy);
        }
        g.closePath();
        g.fillStyle = 'rgb(' + rr + ',' + gg + ',' + bb + ')';
        g.fill();
        if (sp > 0.06){
          g.strokeStyle = 'rgba(255,255,255,' + (0.62 * sp).toFixed(3) + ')';
          g.lineWidth = 1.15;
          g.stroke();
        } else if (fr > 0.42){
          g.strokeStyle = 'rgba(255,255,255,' + (0.1 * fr).toFixed(3) + ')';
          g.lineWidth = 0.9;
          g.stroke();
        }
      }
    }

    /* 球面明暗（点光在左上） */
    g.globalCompositeOperation = 'multiply';
    var rg = g.createRadialGradient(C - R * 0.34, C - R * 0.42, R * 0.04, C, C, R * 1.05);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.34, 'rgba(214,208,200,1)');
    rg.addColorStop(0.76, 'rgba(122,118,113,1)');
    rg.addColorStop(1, 'rgba(52,50,48,1)');
    g.fillStyle = rg;
    g.fillRect(C - R, C - R, R * 2, R * 2);
    g.globalCompositeOperation = 'source-over';

    /* 边缘菲涅尔：左上亮、右下暗 */
    var eg = g.createLinearGradient(C - R * 0.7, C - R * 0.7, C + R * 0.7, C + R * 0.7);
    eg.addColorStop(0, 'rgba(255,252,246,0.8)');
    eg.addColorStop(0.34, 'rgba(255,244,232,0.34)');
    eg.addColorStop(0.6, 'rgba(255,240,225,0.08)');
    eg.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'lighter';
    rimPath(g, C, R - 2.5, 1);
    g.lineWidth = 9; g.strokeStyle = eg; g.stroke();
    rimPath(g, C, R - 13, 1);
    g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.1)'; g.stroke();
    g.globalCompositeOperation = 'source-over';

    /* 眼面高光爆点 */
    var sg = g.createRadialGradient(C - R * 0.3, C - R * 0.36, 0, C - R * 0.3, C - R * 0.36, R * 0.5);
    sg.addColorStop(0, 'rgba(255,255,255,0.5)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.1)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = sg;
    g.fillRect(C - R, C - R, R * 2, R * 2);
    g.globalCompositeOperation = 'source-over';
    g.restore();

    /* 刚毛（setae）：贴边一圈，越疏越长 */
    for (i = 0; i < 420; i++){
      var ha = rnd() * 6.2832;
      var h0 = R * (0.955 + 0.045 * rnd());
      var len = R * (0.015 + 0.115 * Math.pow(rnd(), 2.4));
      var bend = (rnd() - 0.5) * 0.9;
      var x1 = C + Math.cos(ha) * h0, y1 = C + Math.sin(ha) * h0;
      var x2 = C + Math.cos(ha + bend * 0.1) * (h0 + len);
      var y2 = C + Math.sin(ha + bend * 0.1) * (h0 + len);
      var cx1 = C + Math.cos(ha + bend * 0.22) * (h0 + len * 0.55);
      var cy1 = C + Math.sin(ha + bend * 0.22) * (h0 + len * 0.55);
      g.beginPath();
      g.moveTo(x1, y1);
      g.quadraticCurveTo(cx1, cy1, x2, y2);
      g.strokeStyle = 'rgba(16,15,14,' + (0.1 + 0.3 * rnd()).toFixed(3) + ')';
      g.lineWidth = 0.7 + rnd() * 1.5;
      g.stroke();
    }

    /* 胶片颗粒（只在已有像素上） */
    var noise = document.createElement('canvas');
    noise.width = noise.height = 190;
    var ng = noise.getContext('2d');
    var img = ng.createImageData(190, 190);
    for (i = 0; i < img.data.length; i += 4){
      var v = 128 + (rnd() - 0.5) * 150;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ng.putImageData(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = 0.11;
    var pat = g.createPattern(noise, 'repeat');
    g.fillStyle = pat;
    g.fillRect(0, 0, PLATE, PLATE);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    return c;
  }

  /* 前景离焦层：贴近镜头的一圈失焦刚毛（景深） */
  function bakeFg(){
    var c = document.createElement('canvas');
    c.width = PLATE; c.height = PLATE;
    var g = c.getContext('2d');
    var C = PLATE / 2, R = PLATE_R, rnd = mulberry32(9911);
    try { g.filter = 'blur(9px)'; } catch(e){}
    for (var i = 0; i < 26; i++){
      var a = 0.35 + rnd() * 1.5;                 // 右下弧段
      var r0 = R * (0.9 + rnd() * 0.16);
      var len = R * (0.08 + 0.3 * rnd());
      var x1 = C + Math.cos(a) * r0, y1 = C + Math.sin(a) * r0;
      var x2 = C + Math.cos(a + 0.06) * (r0 + len), y2 = C + Math.sin(a + 0.06) * (r0 + len);
      g.beginPath();
      g.moveTo(x1, y1);
      g.quadraticCurveTo((x1 + x2) / 2 + 12, (y1 + y2) / 2 + 8, x2, y2);
      g.strokeStyle = 'rgba(14,13,12,' + (0.05 + 0.13 * rnd()).toFixed(3) + ')';
      g.lineWidth = 3 + rnd() * 10;
      g.stroke();
    }
    try { g.filter = 'none'; } catch(e){}
    return c;
  }

  function bake(){
    try {
      plate = bakePlate();
      fgPlate = bakeFg();
    } catch(e){ plate = null; fgPlate = null; }
  }

  function geo(){
    var W = S.w, H = S.h, port = H > W * 1.08;
    var size = port ? Math.min(W * 0.94, H * 0.46) : Math.min(W * 0.5, H * 0.68);
    return { cx: W / 2, cy: H * (port ? 0.30 : 0.375), size: size, r: size / 2 };
  }

  var drawW0 = 0;
  function drawFrame(now){
    var W = S.w, H = S.h;
    ctx.clearRect(0, 0, W, H);
    if (!plate || !W) return;

    var gr = geo(), t = now * 0.001;
    var amp = S.reduced ? 0.3 : 1;
    var since = now - S.beatAt;
    var env = since < 3000 ? Math.exp(-since / 235) * (0.32 + 0.68 * S.beatLevel) : 0;
    if (!isFinite(env) || env < 0) env = 0;
    var bass = S.live.bass, tre = S.live.treble;

    S.px += ((S.tx || 0) - S.px) * 0.05;
    S.py += ((S.ty || 0) - S.py) * 0.05;

    var scale = 1 + amp * (Math.sin(t * 0.61) * 0.004 + env * 0.015 + bass * 0.007);
    var rot = amp * (Math.sin(t * 0.19) * 0.012 + env * 0.0035);
    var ox = S.px * 9 * amp + Math.sin(t * 0.33) * 2 * amp;
    var oy = S.py * 8 * amp + Math.cos(t * 0.29) * 2 * amp;
    drawW0 = gr.size * (PLATE / (2 * PLATE_R)) * scale;

    /* 测绘轴线：极细一条横贯全屏，从标本两侧穿出 */
    var padx = Math.min(W, H) * 0.027;
    ctx.save();
    ctx.strokeStyle = 'rgba(17,18,20,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padx, Math.round(gr.cy) + 0.5);
    ctx.lineTo(W - padx, Math.round(gr.cy) + 0.5);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(gr.cx + ox, gr.cy + oy);
    ctx.rotate(rot);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(plate, -drawW0 / 2, -drawW0 / 2, drawW0, drawW0);

    /* 鼓点闪光：只在标本上提亮 */
    if (env > 0.01){
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, drawW0 * 0.5, 0, 6.2832);
      ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      var flash = ctx.createRadialGradient(
        -drawW0 * 0.2, -drawW0 * 0.21, 0,
        -drawW0 * 0.2, -drawW0 * 0.21, drawW0 * 0.42);
      flash.addColorStop(0, 'rgba(255,255,255,' + (0.34 * env).toFixed(3) + ')');
      flash.addColorStop(0.55, 'rgba(255,250,240,' + (0.1 * env).toFixed(3) + ')');
      flash.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = flash;
      ctx.fillRect(-drawW0 / 2, -drawW0 / 2, drawW0, drawW0);
      ctx.restore();
    }
    ctx.restore();

    /* 前景失焦层：反向视差，制造景深 */
    if (fgPlate){
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.translate(gr.cx - ox * 1.6, gr.cy - oy * 1.6);
      var fw = drawW0 * 1.07;
      ctx.drawImage(fgPlate, -fw / 2, -fw / 2, fw, fw);
      ctx.restore();
    }

    /* 测绘环 + 鼓点外扩环 */
    var cx = gr.cx, cy = gr.cy;
    ctx.save();
    ctx.strokeStyle = 'rgba(17,18,20,0.11)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, gr.r * 1.075, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba(17,18,20,0.16)';
    for (var q = 0; q < 4; q++){
      var qa = q * 1.5708 + 0.7854;
      var r1 = gr.r * 1.075 - 7, r2 = gr.r * 1.075 + 7;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(qa) * r1, cy + Math.sin(qa) * r1);
      ctx.lineTo(cx + Math.cos(qa) * r2, cy + Math.sin(qa) * r2);
      ctx.stroke();
    }
    if (env > 0.02){
      ctx.strokeStyle = 'rgba(' + AC.a[0] + ',' + AC.a[1] + ',' + AC.a[2] + ',' + (0.5 * env).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(cx, cy, gr.r * (1.075 + env * 0.055), 0, 6.2832);
      ctx.stroke();
    }
    ctx.restore();
  }


  var rawT = 0, tickAt = 0, haveTick = false;
  function onTick(p){
    p = p || {};
    if (typeof p.time === 'number' && isFinite(p.time)) { rawT = p.time; tickAt = performance.now(); haveTick = true; }
    if (typeof p.playing === 'boolean') S.playing = p.playing;
  }

  function onBeat(p){
    p = p || {};
    var lv = clamp(+p.level || 0, 0, 1);
    S.beatLevel = lv; S.beatAt = performance.now(); S.beat++;
  }

  function onLive(p){
    p = p || {};
    var L = S.live;
    L.bpm = +p.bpm || 0;
    L.level = clamp(+p.level || 0, 0, 1);
    L.bass = clamp(+p.bass || 0, 0, 1);
    L.mid = clamp(+p.mid || 0, 0, 1);
    L.treble = clamp(+p.treble || 0, 0, 1);
    if (typeof p.playing === 'boolean') S.playing = p.playing;
  }

  var hudAt = 0;
  function frame(now){
    var t0 = performance.now();
    requestAnimationFrame(frame);

    if (!S.started){
      S.started = true;
      try { parent.postMessage({__c100:1, type:'ready'}, '*'); } catch(e){}
    }

    if (haveTick && S.playing){
      var sm = rawT + (now - tickAt) / 1000;
      S.t = (sm - rawT > 0.42) ? rawT : sm;
    } else if (haveTick){
      S.t = rawT;
    }

    var ni = pickIdx(S.t);
    if (ni !== S.idx){ S.idx = ni; setLine(ni); }
    updateReveal();
    if (now - hudAt > 110){ hudAt = now; hudUpdate(); }

    drawFrame(now);

    S.frames++;
    S.js = performance.now() - t0;
  }

  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.__c100 !== 1) return;
    if (d.type === 'init') applyInit(d.payload);
    else if (d.type === 'tick') onTick(d.payload);
    else if (d.type === 'beat') onBeat(d.payload);
    else if (d.type === 'live') onLive(d.payload);
  });

  window.addEventListener('resize', fit);

  window.addEventListener('pointermove', function(e){
    S.tx = (e.clientX / Math.max(1, innerWidth) - 0.5) * 2;
    S.ty = (e.clientY / Math.max(1, innerHeight) - 0.5) * 2;
  }, { passive: true });

  try {
    var mq = matchMedia('(prefers-reduced-motion: reduce)');
    var onMq = function(){ S.reduced = mq.matches; };
    if (mq.addEventListener) mq.addEventListener('change', onMq);
    else if (mq.addListener) mq.addListener(onMq);
  } catch(e){}

  window.__stage = function(){
    return {
      lines: S.lines.length, idx: S.idx, t: S.t,
      playing: !!S.playing, frames: S.frames, js: S.js,
      err: '',
      text: (S.idx >= 0 && S.lines[S.idx] ? (S.lines[S.idx].text || '') : ''),
      gl: false, rm: !!S.reduced
    };
  };

  applyAccent();
  fit();
  bake();
  hudUpdate();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
