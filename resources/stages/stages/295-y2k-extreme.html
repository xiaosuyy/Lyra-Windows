<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>04 · Y2K EXTREME LYRIC STAGE</title>
<style>
  :root{
    --acc: rgb(255,92,36);
    --acc-40: rgba(255,92,36,.4);
    --acc-70: rgba(255,92,36,.7);
    --ink: #061422;
    --ice: #dff2ff;
    --disp: "Arial Black","Helvetica Neue",Impact,"Franklin Gothic Heavy",sans-serif;
    --cjk: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Heiti SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#062a4a;overflow:hidden}
  body{
    font-family:var(--cjk);
    color:#fff;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
    cursor:crosshair;
    touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#0b4f92}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}

  .grain{
    position:absolute;inset:-10%;z-index:1;pointer-events:none;opacity:.16;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");
    animation:grainShift 1.1s steps(3) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate3d(0,0,0)} 33%{transform:translate3d(-2%,1%,0)} 66%{transform:translate3d(1%,-2%,0)} 100%{transform:translate3d(0,0,0)}
  }

  .vig{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(130% 90% at 46% 12%, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 42%, rgba(2,20,42,.42) 100%),
      linear-gradient(to bottom, rgba(3,26,52,.28) 0%, rgba(3,26,52,0) 18%);
  }

  /* ————— collage ————— */
  .collage{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    transform-style:preserve-3d;will-change:transform;
  }
  .mega{
    position:absolute;left:50%;top:6.4vh;transform:translateX(-50%) rotate(-4.5deg) translateZ(10px);
    font-family:var(--disp);font-size:clamp(42px,8.6vw,152px);line-height:.86;letter-spacing:-.035em;
    white-space:nowrap;max-width:96vw;overflow:hidden;
    background:linear-gradient(177deg,#ffffff 4%,#e6f4ff 26%,#9cb3c7 44%,#ffffff 52%,#cfe3f2 70%,#fdfeff 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:2px rgba(6,20,34,.8);
    filter:drop-shadow(0 5px 0 rgba(4,18,34,.34)) drop-shadow(0 22px 46px rgba(0,44,88,.42));
    opacity:.98;
  }
  .mast{
    position:absolute;left:clamp(16px,3.4vw,48px);top:clamp(14px,3vh,34px);z-index:2;
    display:flex;align-items:flex-end;gap:10px;transform:rotate(-2deg) translateZ(38px);
  }
  .mast b{
    font-family:var(--disp);font-size:clamp(20px,2.5vw,34px);letter-spacing:.13em;line-height:1;
    background:linear-gradient(180deg,#fff 10%,#d7ebfa 48%,#8aa3b8 62%,#fff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:1px rgba(4,18,32,.75);
  }
  .mast i{
    font-style:normal;font-family:var(--disp);font-size:9px;letter-spacing:.34em;color:#eaf7ff;
    opacity:.9;padding-bottom:3px;text-shadow:0 1px 0 rgba(4,18,32,.6);
  }

  /* giant sole */
  .soleWrap{
    position:absolute;right:-2vw;bottom:-12vh;width:min(58vh,590px,39vw);z-index:3;
    transform:translateZ(34px);filter:drop-shadow(0 34px 44px rgba(2,24,48,.42));
  }
  .soleWrap svg{display:block;width:100%;height:auto;transform-origin:50% 70%;will-change:transform}

  /* rider */
  .rider{
    position:absolute;left:clamp(10px,4.2vw,70px);top:27vh;width:clamp(140px,17vw,244px);
    z-index:4;transform:translateZ(64px) rotate(-5deg);
    filter:drop-shadow(0 22px 26px rgba(3,26,52,.42));
  }
  .rider svg{display:block;width:100%;height:auto}

  /* star sticker */
  .star{
    position:absolute;right:26vw;top:13vh;width:clamp(76px,8.6vw,132px);z-index:5;
    transform:translateZ(92px) rotate(-12deg);
    filter:drop-shadow(0 12px 16px rgba(2,24,48,.4));
  }
  .star svg{display:block;width:100%;height:auto;animation:spin 26s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* tiny flying people */
  .flyers{
    position:absolute;right:32vw;top:37vh;width:clamp(120px,14vw,210px);z-index:5;
    transform:translateZ(80px);opacity:.96;
    filter:drop-shadow(0 8px 10px rgba(2,24,48,.35));
    animation:drift 9s ease-in-out infinite alternate;
  }
  .flyers svg{display:block;width:100%;height:auto}
  @keyframes drift{from{transform:translateZ(80px) translateY(-6px) rotate(-1.5deg)}to{transform:translateZ(80px) translateY(8px) rotate(1.5deg)}}

  /* cover polaroid */
  .cover{
    position:absolute;right:4.4vw;top:8.2vh;width:clamp(84px,9.4vw,136px);z-index:6;
    background:#f7fcff;padding:7px 7px 22px;transform:translateZ(110px) rotate(6.5deg);
    box-shadow:0 16px 26px rgba(2,22,44,.42),0 3px 0 rgba(255,255,255,.6) inset;
  }
  .cover img{display:none;width:100%;aspect-ratio:1/1;object-fit:cover;filter:saturate(1.15) contrast(1.06)}
  .cover.has-img img{display:block}
  .cover.has-img .fallback{display:none}
  .cover .fallback{
    width:100%;aspect-ratio:1/1;display:grid;place-items:center;gap:0;
    background:
      radial-gradient(circle at 70% 22%, rgba(255,255,255,.85), transparent 42%),
      repeating-linear-gradient(135deg, rgba(4,22,40,.9) 0 8px, rgba(10,52,90,.9) 8px 16px);
    color:#fff;text-align:center;position:relative;overflow:hidden;
  }
  .cover .fallback b{
    font-family:var(--disp);font-size:clamp(28px,3.4vw,46px);line-height:.9;letter-spacing:-.04em;
    color:#f4fbff;text-shadow:0 3px 0 rgba(2,18,36,.6);
  }
  .cover .fallback span{
    position:absolute;bottom:5px;left:0;right:0;font-family:var(--disp);font-size:7px;letter-spacing:.26em;
    opacity:.9;
  }
  .cover i{
    position:absolute;left:0;right:0;bottom:5px;font-style:normal;font-family:var(--disp);
    font-size:8px;letter-spacing:.2em;color:#0b2338;text-align:center;
  }

  /* tape label */
  .tape{
    position:absolute;left:5vw;top:10.5vh;z-index:6;transform:translateZ(96px) rotate(-3.4deg);
    background:var(--acc);color:#08131f;font-family:var(--disp);font-size:11px;letter-spacing:.16em;
    padding:7px 18px 6px;box-shadow:0 10px 18px rgba(2,22,44,.35);
    display:flex;align-items:center;gap:8px;max-width:44vw;overflow:hidden;white-space:nowrap;
  }
  .tape em{font-style:normal;background:#08131f;color:var(--acc);padding:2px 6px;letter-spacing:.14em;font-size:9px}
  .tape span{overflow:hidden;text-overflow:ellipsis}

  /* bottom scrim */
  .scrim{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(to top, rgba(3,17,33,.94) 0%, rgba(3,17,33,.74) 18%, rgba(3,17,33,.28) 38%, rgba(3,17,33,0) 56%);
  }

  /* ————— HUD ————— */
  .hud{position:absolute;inset:0;z-index:8;pointer-events:none}
  .chips{
    position:absolute;right:clamp(14px,3vw,38px);top:clamp(14px,3vh,32px);
    display:flex;gap:6px;align-items:center;
  }
  .chip{
    font-family:var(--disp);font-size:9px;letter-spacing:.16em;padding:5px 9px 4px;
    border:1px solid rgba(232,248,255,.75);color:#f2fbff;background:rgba(4,24,44,.26);
    backdrop-filter:blur(4px);
  }
  .chip.hot{background:var(--acc);border-color:var(--acc);color:#08131f}
  .spine{
    position:absolute;left:clamp(8px,1.2vw,18px);top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;font-family:var(--disp);font-size:9px;letter-spacing:.52em;
    color:rgba(235,249,255,.72);text-transform:uppercase;opacity:.75;
  }
  .spine b{color:var(--acc);font-weight:400}

  /* ————— lyrics ————— */
  .lyr{
    position:absolute;left:clamp(18px,5vw,92px);bottom:clamp(74px,12vh,138px);
    width:min(56vw,880px);z-index:9;transform:rotate(-1.6deg);transform-origin:left bottom;
  }
  .kicker{
    display:flex;align-items:center;gap:10px;margin-bottom:clamp(10px,1.6vh,18px);
    font-family:var(--disp);font-size:clamp(9px,1vw,12px);letter-spacing:.24em;color:#eaf8ff;
    text-transform:uppercase;opacity:.92;text-shadow:0 2px 6px rgba(2,16,32,.8);
  }
  .kicker .dot{width:7px;height:7px;background:var(--acc);box-shadow:0 0 12px var(--acc-70);flex:none}
  .kicker .sep{opacity:.45}
  .kicker .track{color:var(--acc);max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .lines{display:flex;flex-direction:column;justify-content:flex-end}
  .ln{
    font-family:var(--cjk);font-weight:900;font-style:italic;
    letter-spacing:.01em;line-height:1.12;
    text-shadow:0 4px 0 rgba(2,16,32,.34), 0 12px 26px rgba(2,16,32,.55);
  }
  .ln.prev,.ln.next{
    font-size:clamp(15px,1.85vw,25px);opacity:.48;color:#cfe9fb;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    height:1.55em;display:flex;align-items:center;
  }
  .ln.next{opacity:.32}
  .ln.cur{
    font-size:clamp(30px,4.5vw,64px);color:#fff;margin:clamp(4px,.7vh,8px) 0;
    min-height:2.3em;display:flex;align-items:flex-end;flex-wrap:wrap;
    -webkit-text-stroke:1.6px rgba(4,19,34,.92);
    text-shadow:
      2px 2px 0 #041322, -2px 2px 0 #041322, 2px -2px 0 #041322, -2px -2px 0 #041322,
      0 3px 0 #041322, 0 -3px 0 #041322, 3px 0 0 #041322, -3px 0 0 #041322,
      0 10px 0 rgba(3,18,36,.35), 0 18px 34px rgba(2,14,30,.6);
    max-width:100%;
  }
  .ln.cur.enter .ch{animation:chIn .42s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes chIn{from{transform:translateY(.34em) rotate(3deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
  .ch{display:inline-block;white-space:pre;transform-origin:50% 100%;transition:color .16s linear, transform .18s cubic-bezier(.2,1.4,.4,1), text-shadow .2s}
  .cur .ch{color:rgba(255,255,255,.5)}
  .cur .ch.on{color:#ffffff}
  .cur .ch.on.act{color:var(--acc);transform:translateY(-.1em) scale(1.09);text-shadow:0 0 26px var(--acc-70),0 0 6px rgba(255,255,255,.9)}

  .artist{
    margin-top:clamp(10px,1.8vh,20px);display:flex;align-items:center;gap:12px;
    font-family:var(--disp);font-size:clamp(9px,1.05vw,13px);letter-spacing:.26em;color:#dff2ff;opacity:.9;
    text-transform:uppercase;
  }
  .artist .bar{width:clamp(26px,5vw,70px);height:2px;flex:none;background:var(--acc);box-shadow:0 0 12px var(--acc-70)}

  /* bottom bar */
  .bottom{
    position:absolute;left:clamp(18px,5vw,92px);right:clamp(18px,5vw,92px);bottom:clamp(16px,2.6vh,30px);
    z-index:9;display:flex;align-items:center;gap:14px;
    font-family:var(--disp);font-size:10px;letter-spacing:.18em;color:#cbe6f8;
  }
  .bar{position:relative;flex:1;height:2px;background:rgba(214,240,255,.24);overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:0%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
  .bar u{position:absolute;inset:0 auto 0 0;width:100%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(5,22,40,.55) 46px 47px)}
  .tc{font-variant-numeric:tabular-nums;color:#f4fbff;text-shadow:0 2px 6px rgba(2,14,28,.85)}
  .bottom .hint{opacity:.52;font-size:9px;letter-spacing:.2em}
  .barcode{
    width:52px;height:20px;flex:none;
    background:repeating-linear-gradient(90deg,#eaf7ff 0 2px,transparent 2px 4px,#eaf7ff 4px 5px,transparent 5px 9px,#eaf7ff 9px 12px,transparent 12px 14px);
    opacity:.75;
  }

  body.paused .grain,body.paused .star svg,body.paused .flyers{animation-play-state:paused}
  body.paused{cursor:default}

  @media (max-width:880px){
    .lyr{width:88vw;left:6vw;bottom:11vh}
    .ln.cur{font-size:clamp(25px,7.2vw,44px);-webkit-text-stroke-width:1.2px}
    .soleWrap{width:78vw;right:-24vw;bottom:-8vh;opacity:.92}
    .rider{width:34vw;top:19vh;left:2vw;opacity:.95}
    .star{right:8vw;top:24vh;width:64px}
    .flyers{display:none}
    .cover{width:70px;right:5vw;top:9vh}
    .tape{display:none}
    .spine{display:none}
    .mega{top:12vh;font-size:clamp(34px,11vw,70px)}
    .kicker .artist{display:none}
    .bottom .hint{display:none}
  }
  @media (max-height:620px){
    .lyr{bottom:12vh}
    .rider{top:20vh;width:clamp(110px,13vw,170px)}
    .tape{top:48vh}
    .mega{top:5vh}
  }

  @media (max-width:560px){
    .chips{display:none}
    .cover{display:none}
    .barcode{display:none}
    .bottom{gap:8px;font-size:9px;letter-spacing:.12em}
    .artist{font-size:7px;letter-spacing:.18em;gap:8px}
    .soleWrap{width:70vw;right:-22vw;bottom:-6vh}
    .ln.cur{font-size:clamp(26px,8.4vw,40px)}
    .lyr{width:90vw;left:5vw}
  }
  @media (prefers-reduced-motion: reduce){
    .grain,.star svg,.flyers,.ln.cur.enter .ch{animation:none!important}
    .ch{transition:color .12s linear}
    .collage{transform:none!important}
    .flyers{transform:none}
  }
  /* 可读性：蓝天上未唱的字要「暗但看得见」，唱到的转白、正在唱的字吃 accent。
     注意别改 .ln.cur 的 display —— 它是 .lines 这个 flex 列里的一行，
     改成 inline-block 会让当前句和上/下句叠在一起（之前就是这么坏的）。 */
  .ln.cur .ch{ color:rgba(238,249,255,.58); text-shadow:0 2px 0 rgba(3,18,36,.55); }
  .ln.cur .ch.on{ color:#fff; text-shadow:0 3px 0 #041322, 0 10px 22px rgba(2,14,30,.6); }
  .ln.cur .ch.on.act{ color:var(--acc); text-shadow:0 0 26px var(--acc-70), 0 2px 0 rgba(3,18,36,.9); }
</style>
</head>
<body class="playing">
<div id="stage">
  <canvas id="fx"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vig" aria-hidden="true"></div>

  <div class="collage" id="collage" aria-hidden="true">
    <div class="mega" id="mega">LIFT OFF</div>

    <div class="mast"><b>AERO</b><i>EXTREME<br/>LYRIC ISSUE</i></div>

    <div class="soleWrap" id="soleWrap">
      <svg viewBox="0 0 440 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fbfeff"/>
            <stop offset=".34" stop-color="#dcecf8"/>
            <stop offset=".52" stop-color="#93adc2"/>
            <stop offset=".66" stop-color="#eef9ff"/>
            <stop offset="1" stop-color="#89a2b8"/>
          </linearGradient>
          <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffcdb2"/>
            <stop offset=".32" stop-color="var(--acc)"/>
            <stop offset="1" stop-color="#a82900"/>
          </linearGradient>
          <pattern id="tread" width="36" height="36" patternUnits="userSpaceOnUse">
            <rect x="3" y="3" width="30" height="30" rx="6" fill="none" stroke="#0c2135" stroke-width="3.5" opacity=".3"/>
            <circle cx="18" cy="18" r="4" fill="#0c2135" opacity=".22"/>
          </pattern>
          <path id="soleSil" d="M220 24 C266 24 300 54 302 100 C304 140 292 168 292 206 C292 250 306 286 320 328 C336 380 352 432 358 486 C362 528 358 566 344 598 C328 634 292 652 246 654 C226 655 210 655 194 654 C148 652 112 634 96 598 C82 566 78 528 82 486 C88 432 104 380 120 328 C134 286 148 250 148 206 C148 168 136 140 138 100 C140 54 174 24 220 24 Z"/>
          <clipPath id="soleClip"><use href="#soleSil"/></clipPath>
        </defs>

        <use href="#soleSil" fill="none" stroke="#f7fcff" stroke-width="24" stroke-linejoin="round"/>
        <use href="#soleSil" fill="none" stroke="#07182a" stroke-width="10" stroke-linejoin="round"/>
        <use href="#soleSil" fill="url(#rubber)"/>

        <g clip-path="url(#soleClip)">
          <rect x="0" y="0" width="440" height="700" fill="url(#tread)"/>

          <rect x="0" y="318" width="440" height="30" fill="url(#accGrad)" opacity=".96"/>
          <rect x="0" y="312" width="440" height="4" fill="#ffffff" opacity=".6"/>
          <rect x="0" y="350" width="440" height="4" fill="#ffffff" opacity=".45"/>

          <g fill="none" stroke="#0c2135" opacity=".26">
            <path d="M92 462 Q220 492 348 462" stroke-width="7" stroke-linecap="round"/>
            <path d="M90 492 Q220 524 350 492" stroke-width="7" stroke-linecap="round"/>
            <path d="M92 522 Q220 554 348 522" stroke-width="7" stroke-linecap="round"/>
          </g>

          <ellipse cx="220" cy="152" rx="64" ry="56" fill="#ffffff" opacity=".5"/>
          <ellipse cx="220" cy="152" rx="64" ry="56" fill="none" stroke="#07182a" stroke-width="5" opacity=".7"/>
          <ellipse cx="220" cy="152" rx="42" ry="36" fill="none" stroke="#07182a" stroke-width="3" opacity=".35"/>
          <text x="220" y="162" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30"
                fill="#07182a" opacity=".8" letter-spacing="1">AIR</text>

          <path d="M104 606 Q220 652 336 606" fill="none" stroke="#0c2135" stroke-width="10" opacity=".32" stroke-linecap="round"/>

          <text x="220" y="436" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34"
                font-style="italic" fill="#f7fcff" stroke="#07182a" stroke-width="5" paint-order="stroke" letter-spacing="1">AIR 2000</text>
          <text x="220" y="464" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="10"
                fill="#f7fcff" stroke="#07182a" stroke-width="3" paint-order="stroke" opacity=".9" letter-spacing="6">SKY HIGH</text>
        </g>
      </svg>
    </div>

    <div class="rider">
      <svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
        <g fill="#08131f" stroke="#f4fbff" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" style="paint-order:stroke">
          <!-- board -->
          <path d="M92 296 L286 250" fill="none" stroke-width="20" style="paint-order:stroke"/>
          <circle cx="126" cy="312" r="11" fill="#08131f"/>
          <circle cx="258" cy="266" r="11" fill="#08131f"/>
          <!-- legs -->
          <path d="M170 196 C148 218 134 240 138 266" fill="none" stroke-width="24"/>
          <path d="M190 196 C214 212 236 226 254 244" fill="none" stroke-width="24"/>
          <!-- shoes -->
          <path d="M118 270 L162 276" fill="none" stroke-width="26"/>
          <path d="M242 244 L282 254" fill="none" stroke-width="26"/>
          <!-- torso -->
          <path d="M152 110 C146 142 154 170 168 198 L200 194 C192 164 192 134 200 112 Z"/>
          <!-- front arm -->
          <path d="M158 122 C128 136 106 156 94 178" fill="none" stroke-width="22"/>
          <circle cx="92" cy="180" r="14"/>
          <!-- back arm -->
          <path d="M196 124 C228 126 250 110 262 90" fill="none" stroke-width="20"/>
          <!-- head -->
          <circle cx="170" cy="84" r="31"/>
          <!-- spiky hair -->
          <path d="M139 76 L114 36 L143 54 L138 12 L160 48 L164 4 L180 46 L198 12 L196 50 L224 24 L208 62 L236 52 L210 82 Z"/>
        </g>
        <!-- shades -->
        <path d="M148 80 L198 92 L196 102 L150 91 Z" fill="#eaf8ff" stroke="#08131f" stroke-width="4"/>
        <path d="M152 82 L176 88" stroke="#08131f" stroke-width="3" opacity=".55"/>
        <!-- accent stripe -->
        <path d="M162 136 C166 158 172 176 180 190" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round"/>
        <path d="M204 112 C212 110 220 108 226 104" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="star">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".3" stop-color="#e2f0fb"/>
            <stop offset=".47" stop-color="#7f97ac"/>
            <stop offset=".56" stop-color="#ffffff"/>
            <stop offset=".78" stop-color="#b9cee0"/>
            <stop offset="1" stop-color="#f3fbff"/>
          </linearGradient>
        </defs>

<script>
(function(){
  "use strict";

  var TAU = Math.PI * 2;
  var clamp = function(v,a,b){ return v < a ? a : (v > b ? b : v); };

  var S = {
    mode: "demo",
    song: { id: "demo-04", name: "LIFT OFF", artists: ["AERO UNIT"], cover: "", accent: [255,92,36] },
    lines: [],
    rawLines: [],
    duration: 0,
    t: 2.2,
    playing: true,
    idx: -1,
    frames: 0,
    err: "",
    live: { bpm: 128, level: 0, bass: 0, mid: 0, treble: 0, playing: true },
    beatEnv: 0,
    beatCount: 0,
    beatLevel: 0,
    acc: [255,92,36],
    reduced: false,
    dirty: true,
    dirtyCollage: true,
    px: 0, py: 0, cx: 0, cy: 0,
    lastK: -1,
    viewIdx: -2
  };

  try{
    S.reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }catch(e){ S.reduced = false; }

  /* ---------- error capture ---------- */
  window.addEventListener("error", function(e){
    S.err = String((e && e.message) || "error");
  });
  window.addEventListener("unhandledrejection", function(e){
    S.err = String((e && e.reason) || "rejection");
  });

  /* ---------- DOM ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var cv, ctx, W = 0, H = 0, DPR = 1, skyGrad = null, haloGrad = null;
  var lnPrev, lnCur, lnNext, linesBox, megaEl, soleEl, collageEl, coverEl, coverImg, kickerEl;
  var barFill, tcNow, tcEnd, bpmChip, trackName, artistName, tapeName, lineCount;

  /* ---------- demo content ---------- */
  var DEMO = [
    ["踩碎云端 我起跳", 3.2],
    ["鞋底写着 2000 度", 3.4],
    ["把整片天空 塞背包", 3.6],
    ["别眨眼 我在倒带", 3.2],
    ["巨人一步 跨过城市", 3.8],
    ["像素碎成 彩虹雨", 3.4],
    ["世界太轻 我太吵", 3.2],
    ["落地之前 再飞一次", 4.0]
  ];

  function buildChars(text, t0, dur){
    var chars = Array.from(text);
    var weights = chars.map(function(c){ return /[\s，。、！？,.!?·—…]/.test(c) ? 0.34 : 1; });
    var total = weights.reduce(function(a,b){ return a + b; }, 0) || 1;
    var out = [], acc = 0;
    for(var i = 0; i < chars.length; i++){
      var at = t0 + dur * 0.08 + (dur * 0.8) * (acc / total);
      out.push({ c: chars[i], t: Math.round(at * 1000) / 1000 });
      acc += weights[i];
    }
    return out;
  }

  function demoLines(){
    var t = 0.5;
    var lines = DEMO.map(function(row){
      var text = row[0], dur = row[1];
      var line = { t: t, dur: dur, text: text, chars: buildChars(text, t, dur), _demo: true };
      t += dur;
      return line;
    });
    S.duration = t + 0.6;
    return lines;
  }

  /* ---------- accent ---------- */
  function applyAccent(rgb){
    rgb = rgb || [255,92,36];
    var r = clamp(Math.round(rgb[0] || 0),0,255),
        g = clamp(Math.round(rgb[1] || 0),0,255),
        b = clamp(Math.round(rgb[2] || 0),0,255);
    if(!(r+g+b)){ r = 255; g = 92; b = 36; }
    S.acc = [r,g,b];
    var root = document.documentElement.style;
    root.setProperty("--acc", "rgb(" + r + "," + g + "," + b + ")");
    root.setProperty("--acc-70", "rgba(" + r + "," + g + "," + b + ",.7)");
    root.setProperty("--acc-40", "rgba(" + r + "," + g + "," + b + ",.4)");
    root.setProperty("--acc-soft", "rgba(" + r + "," + g + "," + b + ",.16)");
    S.dirty = true;
  }

  /* ---------- init / context ---------- */
  function setSong(song){
    if(!song) return;
    S.song = {
      id: song.id != null ? song.id : S.song.id,
      name: song.name || S.song.name,
      artists: Array.isArray(song.artists) ? song.artists : (song.artists ? [song.artists] : S.song.artists),
      cover: song.cover || "",
      accent: song.accent || S.song.accent
    };
    applyAccent(S.song.accent);
    if(megaEl){ megaEl.textContent = String(S.song.name || "LIFT OFF").slice(0, 22); }
    if(trackName){ trackName.textContent = S.song.name || "UNTITLED"; }
    if(artistName){ artistName.textContent = (S.song.artists && S.song.artists.length ? S.song.artists.join(" × ") : "UNKNOWN").slice(0, 44); }
    if(tapeName){ tapeName.textContent = S.song.name || "UNTITLED"; }
    if(coverImg && S.song.cover){
      coverImg.onload = function(){ coverEl.classList.add("has-img"); };
      coverImg.onerror = function(){ coverEl.classList.remove("has-img"); };
      coverImg.src = S.song.cover;
    }
  }

  /* strict=true：宿主明确给了一个 lines 数组（哪怕只有 0 行）就照做，
     不许再退回演示歌词——否则没歌词的歌会显示上一首/编出来的词。 */
  function setLines(lines, strict){
    if(!Array.isArray(lines)) return;
    if(!lines.length){
      if(!strict) return;
      S.lines = [];
      S.rawLines = [];
      S.lastK = -1;
      S.viewIdx = -2;
      if(lineCount) lineCount.textContent = "01—00";
      toggleLyrics(false);
      S.dirty = true;
      return;
    }
    var norm = lines.map(function(l, i){
      var t = Number(l && l.t) || 0;
      var dur = Number(l && l.dur) || 3;
      var text = (l && l.text != null) ? String(l.text) : "";
      var chars = Array.isArray(l && l.chars) && l.chars.length ? l.chars.map(function(c){
        return { c: c && c.c != null ? String(c.c) : "", t: Number(c && c.t) || 0 };
      }) : null;
      return { t: t, dur: dur, text: text, chars: chars, src: i };
    }).sort(function(a,b){ return a.t - b.t; });

    if(norm.length && norm[0].dur <= 0){ norm[0].dur = 3; }
    S.lines = norm;
    S.rawLines = lines;
    S.lastK = -1;
    S.viewIdx = -2;
    if(lineCount) lineCount.textContent = "01—" + String(norm.length).padStart(2, "0");
    toggleLyrics(true);
    S.dirty = true;
  }

  /* 没有歌词就把这整块收起来，别留一个空的“大字句”占着画面 */
  function toggleLyrics(on){
    if(linesBox) linesBox.style.display = on ? "" : "none";
    if(kickerEl) kickerEl.style.display = on ? "" : "none";
  }

  function init(payload){
    payload = payload || {};
    S.mode = "host";
    if(payload.song) setSong(payload.song);
    /* 歌词只认宿主给的：给了空数组就是真的没词 */
    if(Array.isArray(payload.lines)) setLines(payload.lines, true);
    S.duration = Number(payload.duration) || S.duration || 30;
    S.t = 0;
    S.lastK = -1;
    S.viewIdx = -2;
    S.dirty = true;
    S.dirtyCollage = true;
    sendReady();
  }

  /* 只报一次 ready：有的宿主收到 ready 会再发一次 init，
     那我们每次 init 都回 ready 就会无限对撞（一秒几千次 init），
     时间被反复清零、tick 也被重置掉 —— 歌词就永远停在第一句。 */
  function sendReady(){
    if(S.sentReady) return;
    S.sentReady = true;
    try{ parent.postMessage({ __c100: 1, type: "ready" }, "*"); }catch(e){}
  }

  /* ---------- line lookup ---------- */
  function idxFor(t){
    var n = S.lines.length;
    if(!n) return -1;
    if(t < S.lines[0].t) return 0;
    var lo = 0, hi = n - 1, ans = 0;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(S.lines[mid].t <= t){ ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function activeCount(line){
    if(!line) return 0;
    if(line.chars && line.chars.length){
      var first = line.chars[0].t;
      var relative = first < line.t - 0.08;
      var k = 0;
      for(var i = 0; i < line.chars.length; i++){
        var tt = relative ? line.t + line.chars[i].t : line.chars[i].t;
        if(tt <= S.t + 0.001) k++;
        else break;
      }
      return k;
    }
    var p = clamp((S.t - line.t) / Math.max(0.001, line.dur), 0, 1);
    return Math.floor(p * line.text.length);
  }

  function spansFor(line){
    var frag = document.createDocumentFragment();
    var text = line ? line.text : "";
    if(!text) return frag;
    var chars = Array.from(text);
    var n = chars.length;
    for(var i = 0; i < n; i++){
      var sp = document.createElement("span");
      sp.className = "ch";
      var c = chars[i];
      sp.textContent = c === " " ? "\u00A0" : c;
      frag.appendChild(sp);
    }
    return frag;
  }

  function fillLine(el, line){
    el.textContent = "";
    if(line) el.appendChild(spansFor(line));
  }

  /* 长句（英文署名、说唱歌词那种）按宽度缩字号，别在词中间断行 */
  function fitCurLine(){
    if(!lnCur || !linesBox) return;
    lnCur.style.fontSize = "";
    var base = parseFloat(getComputedStyle(lnCur).fontSize) || 48;
    var avail = linesBox.clientWidth - 6;
    var chs = lnCur.children, total = 0;
    for(var k = 0; k < chs.length; k++) total += chs[k].offsetWidth;
    if(!total || !avail || total <= avail) return;
    var s = Math.max(base * 0.6, Math.floor(base * avail / total));
    lnCur.style.fontSize = s + "px";
  }

  function renderLines(force){
    var i = S.idx;
    if(i === S.viewIdx && !force){ return; }
    S.viewIdx = i;
    fillLine(lnPrev, S.lines[i-1]);
    fillLine(lnCur, S.lines[i]);
    fillLine(lnNext, S.lines[i+1]);
    fitCurLine();
    S.lastK = -1;
    if(!S.reduced){
      lnCur.classList.remove("enter");
      void lnCur.offsetWidth;
      lnCur.classList.add("enter");
    }
    updateChars(true);
  }

  function updateChars(force){
    var line = S.lines[S.idx];
    if(!line) return;
    var k = activeCount(line);
    if(k === S.lastK && !force) return;
    S.lastK = k;
    var spans = lnCur.children;
    var n = spans.length;
    for(var i = 0; i < n; i++){
      var on = i < k;
      spans[i].classList.toggle("on", on);
      spans[i].classList.toggle("act", on && i === k - 1);
    }
  }

  /* ---------- canvas ---------- */
  var clouds = [];
  var halftone = null;

  function buildClouds(){
    clouds.length = 0;
    var n = 11;
    for(var i = 0; i < n; i++){
      clouds.push({
        x: (i / n) * 1.34 - 0.12 + (i % 3) * 0.03,
        y: 0.10 + ((i * 0.137) % 0.62),
        s: 0.48 + ((i * 0.37) % 0.85),
        v: 0.0032 + ((i * 0.0011) % 0.004),
        a: 0.5 + ((i * 0.17) % 0.4),
        seed: i * 7.3
      });
    }
    clouds.sort(function(a,b){ return a.y - b.y; });
  }

  function buildHalftone(){
    var tile = document.createElement("canvas");
    tile.width = 28; tile.height = 28;
    var c = tile.getContext("2d");
    c.fillStyle = "rgba(255,255,255,.85)";
    c.beginPath();
    c.arc(14, 14, 2.1, 0, TAU);
    c.fill();
    c.fillStyle = "rgba(4,24,44,.35)";
    c.beginPath();
    c.arc(0, 0, 1.6, 0, TAU);
    c.fill();
    halftone = ctx.createPattern(tile, "repeat");
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, "#0a55a8");
    skyGrad.addColorStop(0.34, "#1a86dd");
    skyGrad.addColorStop(0.62, "#63bdf0");
    skyGrad.addColorStop(0.84, "#b7e7ff");
    skyGrad.addColorStop(1, "#e8f8ff");

    haloGrad = ctx.createLinearGradient(0, 0, 0, H);
    haloGrad.addColorStop(0, "rgba(255,255,255,.9)");
    haloGrad.addColorStop(0.5, "rgba(255,255,255,.25)");
    haloGrad.addColorStop(1, "rgba(255,255,255,0)");

    buildHalftone();
    S.dirty = true;
  }

  function drawCloud(x, y, s, a){
    var puffs = [
      [0, 0, 1], [0.62, 0.08, 0.78], [-0.6, 0.06, 0.72], [1.05, 0.2, 0.52],
      [-1.02, 0.18, 0.48], [0.3, -0.42, 0.6], [-0.26, -0.34, 0.54], [1.5, 0.3, 0.3]
    ];
    var i, p, r, cx, cy;
    // shadow pass
    for(i = 0; i < puffs.length; i++){
      p = puffs[i]; r = p[2] * 52 * s;
      cx = x + p[0] * r * 1.32 + 3;
      cy = y + p[1] * r * 1.5 + 9;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.fillStyle = "rgba(96,164,214," + (a * 0.16) + ")";
      ctx.fill();
    }
    // white pass
    for(i = 0; i < puffs.length; i++){
      p = puffs[i]; r = p[2] * 52 * s;
      cx = x + p[0] * r * 1.32;
      cy = y + p[1] * r * 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.fillStyle = "rgba(255,255,255," + a + ")";
      ctx.fill();
    }
    // warm rim
    ctx.beginPath();
    ctx.arc(x - 30 * s, y - 22 * s, 34 * s, 0, TAU);
    ctx.fillStyle = "rgba(255,252,238," + (a * 0.5) + ")";
    ctx.fill();
  }

  function draw(t){
    if(!ctx) return;
    var w = W, h = H;
    var acc = S.acc;
    var energy = clamp(S.live.level * 0.9 + S.beatEnv * 0.55 + S.live.bass * 0.35, 0, 1.5);
    var speed = (S.live.bpm || 128) / 128;

    // sky
    ctx.fillStyle = skyGrad || "#1a86dd";
    ctx.fillRect(0, 0, w, h);

    var sx = w * 0.74, sy = h * 0.19;

    // sun rays
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.translate(sx, sy);
    ctx.rotate(S.reduced ? 0.35 : t * 0.035 * speed + S.beatEnv * 0.02);
    var R = Math.max(w, h) * 1.45;
    for(var i = 0; i < 30; i++){
      var a0 = (i / 30) * TAU;
      var a1 = a0 + TAU / 60;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0, a1);
      ctx.closePath();
      ctx.fillStyle = i % 2
        ? "rgba(255,255,255," + (0.036 + energy * 0.014) + ")"
        : "rgba(190,235,255," + (0.02 + energy * 0.01) + ")";
      ctx.fill();
    }
    // sun disc
    var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.min(w, h) * 0.62);
    g.addColorStop(0, "rgba(255,255,255,.98)");
    g.addColorStop(0.07, "rgba(255,253,232,.92)");
    g.addColorStop(0.22, "rgba(255,238,190,.32)");
    g.addColorStop(0.55, "rgba(220,245,255,.10)");
    g.addColorStop(1, "rgba(200,238,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.min(w, h) * 0.62, 0, TAU);
    ctx.fill();

    // lens flare streak
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-0.62);
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.fillRect(-w * 0.9, -2, w * 1.8, 4);
    ctx.fillStyle = "rgba(255,255,255,.09)";
    ctx.fillRect(-w * 0.9, -14, w * 1.8, 2);
    ctx.restore();
    ctx.restore();

    // clouds
    for(var ci = 0; ci < clouds.length; ci++){
      var c = clouds[ci];
      var drift = S.reduced ? 0 : t * c.v;
      var cxN = ((c.x + drift) % 1.34 + 1.34) % 1.34 - 0.1;
      var cx = cxN * w + S.cx * 16;
      var cy = c.y * h + S.cy * 10;
      drawCloud(cx, cy, c.s * (w > 900 ? 1.25 : 0.8), c.a * (0.55 + c.y * 0.65));
    }

    // wide-angle fisheye grid
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.07)";
    ctx.lineWidth = 1;
    var gy, gx;
    for(var hi = 0; hi <= 9; hi++){
      gy = h * 0.2 + (hi / 9) * h * 0.86;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.quadraticCurveTo(w * 0.5, gy - h * 0.11 * (0.35 + hi / 9), w, gy);
      ctx.stroke();
    }
    for(var vi = 1; vi < 12; vi++){
      gx = (vi / 12) * w;
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.quadraticCurveTo(gx + (gx - w * 0.5) * 0.3, h * 0.55, gx, h);
      ctx.stroke();
    }
    ctx.restore();

    // speed lines on beat
    if(S.beatEnv > 0.03 && !S.reduced){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.translate(w * 0.5, h * 0.46);
      ctx.strokeStyle = "rgba(255,255,255," + (0.15 * S.beatEnv) + ")";
      for(var li = 0; li < 18; li++){
        var ang = (li / 18) * TAU + S.beatCount * 0.55;
        var r0 = Math.min(w, h) * (0.2 + (li % 4) * 0.03);
        var r1 = Math.min(w, h) * (0.58 + (li % 3) * 0.11);
        ctx.lineWidth = 2 + (li % 2) * 3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
        ctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
        ctx.stroke();
      }
      ctx.restore();
    }

    // accent bloom bottom-right (tie canvas to accent)
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var ag = ctx.createRadialGradient(w * 0.86, h * 0.78, 0, w * 0.86, h * 0.78, Math.min(w, h) * 0.55);
    ag.addColorStop(0, "rgba(" + acc[0] + "," + acc[1] + "," + acc[2] + "," + (0.16 + energy * 0.08) + ")");
    ag.addColorStop(1, "rgba(" + acc[0] + "," + acc[1] + "," + acc[2] + ",0)");
    ctx.fillStyle = ag;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    // halftone print texture
    if(halftone){
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.globalCompositeOperation = "overlay";
      ctx.fillStyle = halftone;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }

    // flash
    if(S.beatEnv > 0.03){
      ctx.fillStyle = "rgba(255,255,255," + (S.beatEnv * 0.07) + ")";
      ctx.fillRect(0, 0, w, h);
    }
  }

  /* ---------- collage motion ---------- */
  var shoeRot = -12;
  function moveCollage(){
    if(!collageEl) return;
    if(S.reduced){
      collageEl.style.transform = "none";
      if(soleEl) soleEl.style.transform = "rotate(" + shoeRot + "deg)";
      return;
    }
    S.cx += (S.px - S.cx) * 0.06;
    S.cy += (S.py - S.cy) * 0.06;
    var ry = S.cx * 2.6;
    var rx = -S.cy * 1.6;
    collageEl.style.transform = "perspective(1500px) rotateX(" + rx.toFixed(3) + "deg) rotateY(" + ry.toFixed(3) + "deg)";

    if(soleEl){
      var stomp = S.beatEnv * 1.6 + S.live.bass * 0.7;
      var y = -stomp * 14;
      var sc = 1 + Math.min(0.03, stomp * 0.022);
      soleEl.style.transform = "translate3d(0," + y.toFixed(2) + "px,0) rotate(" + (shoeRot + S.cx * 2).toFixed(2) + "deg) scale(" + sc.toFixed(4) + ")";
    }
  }

  /* ---------- main loop ---------- */
  var lastNow = performance.now();
  var hostT = 0, hostAt = 0;

  function frame(now){
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    var fr0 = performance.now();
    S.frames++;              /* 心跳：rAF 每转一圈就 +1（暂停时也会涨，只是不重画） */

    if(S.playing){
      if(S.mode === "host" && S.hasTick){
        S.t = hostT + (now - hostAt) / 1000;
      }else{
        S.t += dt;
      }
      if(S.mode === "demo" && S.duration > 0 && S.t >= S.duration){
        S.t = 0;
      }
      if(S.lines.length && S.t > S.duration) S.t = S.duration;

      S.beatEnv *= Math.pow(0.86, dt * 60);
      if(S.beatEnv < 0.001) S.beatEnv = 0;

      S.idx = idxFor(S.t);
      renderLines(false);
      updateChars(false);
      moveCollage();
      draw(now / 1000);
      updateHud();
      S.frames++;
    }else if(S.dirty){
      S.idx = idxFor(S.t);
      renderLines(false);
      updateChars(false);
      draw(now / 1000);
      updateHud();
      S.dirty = false;
    }

    S.jsMs = performance.now() - fr0;
    requestAnimationFrame(frame);
  }

  var lastHud = -1;
  function updateHud(){
    if(!barFill) return;
    var sec = Math.max(0.001, S.duration || 1);
    barFill.style.width = clamp(S.t / sec, 0, 1) * 100 + "%";
    var nowSec = Math.floor(S.t);
    if(nowSec !== lastHud){
      lastHud = nowSec;
      tcNow.textContent = fmt(nowSec);
      tcEnd.textContent = fmt(Math.floor(S.duration));
      if(S.beatEnv > 0.5){ /* noop */ }
    }
  }
  function fmt(s){
    s = Math.max(0, Math.round(s));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  /* ---------- message bridge ---------- */
  function onMessage(ev){
    var data = ev && ev.data;
    if(!data || data.__c100 !== 1) return;
    var type = data.type;
    var p = data.payload || {};
    try{
      if(type === "init"){
        init(p);
      }else if(type === "tick"){
        hostT = Number(p.time) || 0;
        hostAt = performance.now();
        S.t = hostT;
        var playing = p.playing !== false;
        if(playing !== S.playing){
          S.playing = playing;
          document.body.classList.toggle("paused", !playing);
        }
        S.dirty = true;
        if(S.mode !== "host"){ S.mode = "host"; }
        S.hasTick = true;
        S.idx = idxFor(S.t);
        renderLines(false);
        updateChars(false);
        updateHud();
      }else if(type === "beat"){
        S.beatLevel = clamp(Number(p.level) || 0, 0, 1);
        S.beatEnv = Math.max(S.beatEnv, 0.45 + S.beatLevel * 0.9);
        S.beatCount++;
      }else if(type === "live"){
        S.live.bpm = Number(p.bpm) || S.live.bpm;
        S.live.level = clamp(Number(p.level) || 0, 0, 1);
        S.live.bass = clamp(Number(p.bass) || 0, 0, 1);
        S.live.mid = clamp(Number(p.mid) || 0, 0, 1);
        S.live.treble = clamp(Number(p.treble) || 0, 0, 1);
        if(typeof p.playing === "boolean"){
          S.playing = (p.playing === undefined ? true : !!p.playing);   /* init 里通常没有 playing，缺省按播放处理 */
          document.body.classList.toggle("paused", !p.playing);
        }
        if(bpmChip) bpmChip.textContent = Math.round(S.live.bpm) + " BPM";
        S.dirty = true;
      }
    }catch(err){
      S.err = String(err && err.message || err);
    }
  }

  /* ---------- boot ---------- */
  function boot(){
    cv = $("fx");
    ctx = cv.getContext("2d", { alpha: false });
    lnPrev = $("lnPrev"); lnCur = $("lnCur"); lnNext = $("lnNext");
    linesBox = $("linesBox");
    kickerEl = document.querySelector(".lyr .kicker");
    megaEl = $("mega"); soleEl = $("soleWrap").querySelector("svg");
    collageEl = $("collage"); coverEl = $("cover"); coverImg = $("coverImg");
    barFill = $("barFill"); tcNow = $("tcNow"); tcEnd = $("tcEnd");
    bpmChip = $("bpmChip"); trackName = $("trackName"); artistName = $("artistName");
    tapeName = $("tapeName"); lineCount = $("lineCount");

    applyAccent(S.song.accent);
    buildClouds();
    resize();

    S.lines = demoLines();
    S.duration = S.lines.reduce(function(a,l){ return Math.max(a, l.t + l.dur); }, 0) + 0.4;
    S.t = 2.2;
    S.idx = idxFor(S.t);
    renderLines(true);
    updateHud();
    draw(1);

    window.addEventListener("resize", function(){ resize(); S.dirty = true; });
    if(window.ResizeObserver){
      new ResizeObserver(function(){ resize(); S.dirty = true; }).observe(document.getElementById("stage"));
    }
    window.addEventListener("message", onMessage);

    window.addEventListener("pointermove", function(e){
      if(S.reduced) return;
      S.px = clamp((e.clientX / Math.max(1, innerWidth) - 0.5) * 2, -1, 1);
      S.py = clamp((e.clientY / Math.max(1, innerHeight) - 0.5) * 2, -1, 1);
    }, { passive: true });

    function togglePlay(){
      if(S.mode !== "demo") return;
      S.playing = !S.playing;
      document.body.classList.toggle("paused", !S.playing);
      if(S.mode === "demo") hostT = S.t;
    }
    window.addEventListener("click", togglePlay);
    window.addEventListener("keydown", function(e){
      if(e.code === "Space" || e.key === " "){ e.preventDefault(); togglePlay(); }
    });

    // demo auto-advance uses regular rAF clock via frame()
    requestAnimationFrame(frame);

    sendReady();
  }

  window.__stage = function(){
    return {
      lines: S.lines.length,
      idx: S.idx,
      t: S.t,
      playing: S.playing,
      frames: S.frames,
      js: Math.round(S.jsMs * 100) / 100,   /* 每帧 JS 耗时(ms)，验收脚本按这个口径判 */
      err: S.err,
      text: (S.lines[S.idx] && S.lines[S.idx].text) || "",
      gl: "canvas2d",
      rm: S.reduced
    };
  };

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  }else{
    boot();
  }
})();
</script>
</body>
</html>
