<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>青金回旋</title>
<style>
  html,body{margin:0;padding:0;background:#070c1e;overflow:hidden;height:100%;}
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#0a1433;}
  canvas{display:block;position:absolute;left:0;top:0;}

  /* ---------- 曼陀罗 ---------- */
  #mandala{
    position:absolute;left:50%;top:46%;
    width:min(88vh,88vw);height:min(88vh,88vw);
    margin-left:calc(min(88vh,88vw) * -0.5);
    margin-top:calc(min(88vh,88vw) * -0.46);
    will-change:transform;
    transform-origin:50% 50%;
    pointer-events:none;
  }
  #mandala .sv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  #mandala #rotorA{animation:spin 132s linear infinite;}
  #mandala #rotorB{animation:spinBack 88s linear infinite;}
  #mandala #rotorC{animation:spin 41s linear infinite;}
  #mandala #pulseRing{
    transform-origin:50% 50%;
    animation:ringPulse 18s ease-in-out infinite;
  }
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes spinBack{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.035);opacity:1}}

  /* ---------- 歌词 ---------- */
  #lyricBox{
    position:absolute;left:0;right:0;bottom:0;top:0;
    z-index:5;
    display:flex;align-items:flex-end;justify-content:center;
    padding:0 5vw clamp(8px,2.4vh,40px);
    pointer-events:none;box-sizing:border-box;
  }
  #lyricIn{
    position:relative;z-index:1;width:min(1140px,92vw);text-align:center;
    padding:clamp(14px,2.2vh,26px) clamp(18px,3vw,44px) clamp(10px,1.8vh,22px);
  }
  .line{
    font-size:clamp(19px,2.5vw,37px);
    line-height:1.34;
    font-weight:600;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Source Han Serif SC","Noto Serif CJK SC","Songti SC",STSong,"Sylfaen",Georgia,serif;
    letter-spacing:.03em;
    transition:opacity .55s ease, filter .55s ease, transform .55s ease;
    word-break:break-word;
    transform-origin:center center;
  }
  #prev,#next{
    font-size:clamp(13px,1.36vw,20px);
    color:#7e97b6;
    filter:blur(.45px);
    transform:scale(.9);
    min-height:.2em;
    margin:clamp(4px,.8vh,10px) 0;
  }
  #prev{opacity:.64}
  #next{opacity:.44}
  #cur{
    color:#eef3fa;
    font-size:clamp(20px,2.72vw,40px);
    text-shadow:0 2px 26px rgba(4,10,26,.92), 0 1px 3px rgba(4,10,26,.95);
    min-height:1.2em;
  }
  #cur .ch{color:#6f89ab;transition:color .34s ease, text-shadow .34s ease;display:inline-block;white-space:pre;}
  #cur .ch.on{color:#f5ead0;text-shadow:0 0 20px rgba(255,196,96,.42),0 2px 24px rgba(4,10,26,.9);}
  #cur .ch.cur{color:#ffd98a;text-shadow:0 0 34px rgba(255,182,64,.75),0 0 8px rgba(255,214,140,.5),0 2px 20px rgba(4,10,26,.9);}

  /* 金箔细线：只做装饰边，不压在字下面 */
  .flourish{
    position:absolute;left:50%;transform:translateX(-50%);
    pointer-events:none;
  }
  #flourishT{top:-6px;width:min(46vw,420px);height:1px;opacity:.7;
    background:linear-gradient(90deg,rgba(226,178,86,0) 0%,rgba(226,178,86,.85) 26%,rgba(255,238,196,.95) 50%,rgba(226,178,86,.85) 74%,rgba(226,178,86,0) 100%);}
  #flourishT::after{
    content:"";position:absolute;left:50%;top:-4.5px;width:9px;height:9px;margin-left:-4.5px;
    background:#e9c477;transform:rotate(45deg);box-shadow:0 0 12px rgba(233,196,119,.7);
  }

  /* ---------- 空状态 / 元信息 ---------- */
  #empty{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:1.4vh;pointer-events:none;text-align:center;padding:8vw;
    z-index:6;
  }
  #empty.on{display:flex;}
  #empty::before{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(760px,84vw);height:min(300px,40vh);pointer-events:none;
    background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(3,6,16,.88) 0%, rgba(3,6,16,.62) 46%, rgba(3,6,16,0) 78%);
  }
  #empty .e1,#empty .e2{position:relative;}
  #empty .e1{font-size:clamp(20px,2.7vw,40px);color:#f0e5c9;font-weight:600;letter-spacing:.16em;
    text-shadow:0 2px 22px rgba(4,10,26,.95),0 0 40px rgba(233,196,119,.22);}
  #empty .e2{font-size:clamp(12px,1.3vw,18px);color:#9db2cc;letter-spacing:.24em;
    text-shadow:0 2px 16px rgba(4,10,26,.95);}
  #meta{
    position:absolute;left:0;right:0;top:clamp(16px,3.2vh,42px);text-align:center;
    z-index:6;
    pointer-events:none;opacity:.9;
  }
  #meta .m1{font-size:clamp(11px,1.12vw,15px);letter-spacing:.42em;color:#c9b48a;text-indent:.42em;}
  #meta .m2{font-size:clamp(8px,.86vw,11px);letter-spacing:.34em;color:#6f89a8;margin-top:.7em;text-indent:.34em;}

  /* ---------- 顶层特效层 ---------- */
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;opacity:.9;}
  #veil{
    position:absolute;inset:0;pointer-events:none;
    z-index:3;
    background:radial-gradient(ellipse 122% 96% at 50% 46%, rgba(4,8,22,0) 34%, rgba(3,6,18,.52) 74%, rgba(2,4,14,.92) 100%);
  }
  /* 歌词区的墨色承接带：压在曼陀罗之上、字之后的偏置暗调（不是柔光，是深墨） */
  #lyricBox::before{
    content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:min(1080px,96vw);height:min(430px,60vh);pointer-events:none;
    background:radial-gradient(ellipse 78% 92% at 50% 88%, rgba(3,7,18,.90) 0%, rgba(3,7,18,.66) 42%, rgba(3,7,18,0) 76%);
  }
  #grain{
    position:absolute;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    z-index:4;
    background-repeat:repeat;
  }
  /* 迷幻光谱带：60/70 年代彩虹棱镜的窄带 */
  #spectrum{
    position:absolute;left:-12%;right:-12%;height:clamp(64px,12vh,150px);
    top:clamp(52px,11.5vh,138px);
    pointer-events:none;opacity:.30;mix-blend-mode:screen;
    filter:blur(15px) saturate(118%);
    transform:rotate(-3.6deg) scaleY(1);
    background:linear-gradient(90deg,
      rgba(204,58,42,.55) 0%,
      rgba(232,138,52,.62) 16%,
      rgba(238,204,86,.60) 31%,
      rgba(74,186,140,.52) 47%,
      rgba(52,168,200,.55) 63%,
      rgba(96,86,196,.52) 79%,
      rgba(162,58,150,.48) 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 78%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 78%,transparent 100%);
    animation:spectre 23s ease-in-out infinite;
  }
  @keyframes spectre{0%,100%{opacity:.20}50%{opacity:.40}}
  /* 不支持 mask-image 的引擎：整体压暗，避免出现生硬的矩形彩条 */
  @supports not (mask-image:linear-gradient(#000,#000)){#spectrum{opacity:.13 !important;}}

  /* 波斯手抄本描金边框（jadval）：外粗金 + 内细金 + 最外层青金 */
  #jadval{
    position:absolute;pointer-events:none;z-index:7;
    top:calc(clamp(9px,1.5vmin,20px) * 1.0);
    left:calc(clamp(9px,1.5vmin,20px) * 1.0);
    right:calc(clamp(9px,1.5vmin,20px) * 1.0);
    bottom:calc(clamp(9px,1.5vmin,20px) * 1.0);
    border:1px solid rgba(226,178,86,.30);
    box-shadow:inset 0 0 0 3px rgba(6,12,30,.55),
               inset 0 0 0 4px rgba(226,178,86,.42),
               inset 0 0 0 7px rgba(6,12,30,.0),
               inset 0 0 0 8px rgba(226,178,86,.13);
  }
  /* 四角金箔纹样 */
  #jadval i{
    position:absolute;width:clamp(16px,2.8vmin,34px);height:clamp(16px,2.8vmin,34px);
    border:1px solid rgba(240,208,146,.55);
    transform:rotate(45deg);
  }
  #jadval i:nth-child(1){left:clamp(3px,.6vmin,7px);top:clamp(3px,.6vmin,7px);border-right:0;border-bottom:0;}
  #jadval i:nth-child(2){right:clamp(3px,.6vmin,7px);top:clamp(3px,.6vmin,7px);border-left:0;border-bottom:0;}
  #jadval i:nth-child(3){left:clamp(3px,.6vmin,7px);bottom:clamp(3px,.6vmin,7px);border-right:0;border-top:0;}
  #jadval i:nth-child(4){right:clamp(3px,.6vmin,7px);bottom:clamp(3px,.6vmin,7px);border-left:0;border-top:0;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="mandala">
    <svg class="sv" id="rotorA" viewBox="0 0 1200 1200"></svg>
    <svg class="sv" id="rotorB" viewBox="0 0 1200 1200"></svg>
    <svg class="sv" id="rotorC" viewBox="0 0 1200 1200"></svg>
    <svg class="sv" id="pulseRing" viewBox="0 0 1200 1200"></svg>
  </div>
  <canvas id="fx"></canvas>
  <div id="veil"></div>
  <div id="spectrum"></div>
  <div id="grain"></div>
  <div id="meta"><div class="m1"></div><div class="m2"></div></div>
  <div id="lyricBox">
    <div id="lyricIn">
      <div class="flourish" id="flourishT"></div>
      <div id="prev" class="line"></div>
      <div id="cur" class="line"></div>
      <div id="next" class="line"></div>
    </div>
  </div>
  <div id="empty">
    <div class="e1">静 默 之 环</div>
    <div class="e2">此曲无词 · 且听风与鼓</div>
  </div>
  <div id="jadval"><i></i><i></i><i></i><i></i></div>
</div>
<script>
(function(){
'use strict';

/* ============================================================
   479 青金回旋 · Anatolian Psych × Persian Miniature Mandala
   单文件 · 零外部请求 · 165Hz 友好
   ============================================================ */

var S = {
  lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '',
  time0: 0, stamp0: 0, hasTick: false, dur: 0, reduced: false,
  acc: [232, 192, 106], song: { name: '', artists: '' }, inited: false,
  energy: 0, level: 0, bass: 0, mid: 0, treble: 0, bpm: 0, beatFlash: 0
};

/* ---- 自检口：全文件唯一定义，直接读当前状态 ---- */
window.__stage = function(){
  var L = S.lines, i = S.idx, txt = '';
  if (i >= 0 && i < L.length && L[i]) txt = L[i].text || '';
  return {
    lines: L.length, idx: i, t: S.t, playing: !!S.playing, frames: S.frames,
    js: S.js, err: S.err, text: txt, gl: false, rm: !!S.reduced
  };
};

function num(v, d){ v = +v; return isFinite(v) ? v : d; }
function cl(v, a, b){ return v < a ? a : (v > b ? b : v); }
function fmt1(v){ return Math.round(v * 10) / 10; }

/* ============ ready：首帧无条件发出，且只发一次 ============ */
var readySent = false;
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({__c100: 1, type: 'ready'}, '*'); }
  catch (e) { console.error('[479] ready post failed', e); }
}
setTimeout(sendReady, 900);

/* ============ 画布 / 尺寸 ============ */
var bg = document.getElementById('bg');
var fx = document.getElementById('fx');
var bctx = bg.getContext('2d', {alpha: false});
var fctx = fx.getContext('2d');
var back = document.createElement('canvas');
var bctx2 = back.getContext('2d');

var view = { w: 1440, h: 900, dpr: 1, cx: 720, cy: 450, s: 1 };
var offW = 0, offH = 0, offDirty = true;

function resize(){
  var w = Math.round(window.innerWidth || 1440);
  var h = Math.round(window.innerHeight || 900);
  if (!isFinite(w) || w < 2) w = 1440;
  if (!isFinite(h) || h < 2) h = 900;
  var dpr = cl(window.devicePixelRatio || 1, 1, 2);
  view.w = w; view.h = h; view.dpr = dpr;
  view.cx = w / 2; view.cy = h / 2;
  view.s = cl(Math.min(w, h) / 900, 0.42, 2.6);

  bg.width = Math.round(w * dpr); bg.height = Math.round(h * dpr);
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var fdp = cl(dpr, 1, 1.5);
  fx.width = Math.round(w * fdp); fx.height = Math.round(h * fdp);
  fctx.setTransform(fdp, 0, 0, fdp, 0, 0);
  fx.style.width = w + 'px'; fx.style.height = h + 'px';

  offW = w; offH = h; offDirty = true;
}

/* ============ 数学纹样（全部固定次数循环） ============ */
function pt(cx, cy, r, a){ return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }

function starPts(cx, cy, R, r, n, rot){
  var out = [], i, k = Math.min(n * 2, 240), a;
  var NN = Math.max(3, n);
  for (i = 0; i < k; i++) {
    a = rot + i * Math.PI / NN;
    out.push(pt(cx, cy, (i % 2 === 0) ? R : r, a));
  }
  return out;
}

function polyPath(pts){
  var d = '', i, n = Math.min(pts.length, 400);
  for (i = 0; i < n; i++) d += (i === 0 ? 'M' : 'L') + fmt1(pts[i][0]) + ' ' + fmt1(pts[i][1]);
  return d + 'Z';
}

/* 几何阿拉伯藤蔓：花瓣环 */
function petalRing(cx, cy, R, petals, rot, bulge){
  var d = '', PA = Math.min(Math.round(petals), 144), i, a, a2, hw, p1, p2, cp, chord;
  if (PA < 3) return '';
  hw = Math.PI / PA;
  for (i = 0; i < PA; i++) {
    a = rot + i * 2 * Math.PI / PA;
    a2 = a + 2 * Math.PI / PA;
    p1 = pt(cx, cy, R, a - hw);
    p2 = pt(cx, cy, R, a2 - hw);
    chord = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    cp = pt(cx, cy, R + chord * (bulge || 1.05) * 0.42, a + Math.PI / PA);
    d += 'M' + fmt1(p1[0]) + ' ' + fmt1(p1[1]) +
         'Q' + fmt1(cp[0]) + ' ' + fmt1(cp[1]) + ' ' + fmt1(p2[0]) + ' ' + fmt1(p2[1]);
  }
  return d;
}

/* 折线星环 */
function zigRing(cx, cy, R1, R2, n, rot){
  var d = '', N = Math.min(Math.round(n), 200), i, p1, p2, a;
  if (N < 3) return '';
  for (i = 0; i < N; i++) {
    a = rot + i * 2 * Math.PI / N;
    p1 = pt(cx, cy, R1, a);
    p2 = pt(cx, cy, R2, a);
    d += (i === 0 ? 'M' : 'L') + fmt1(p1[0]) + ' ' + fmt1(p1[1]) + 'L' + fmt1(p2[0]) + ' ' + fmt1(p2[1]);
  }
  return d + 'Z';
}

/* 细密画金线叶片 */
function leafPath(cx, cy, R, n, rot, len, wid){
  var d = '', N = Math.min(Math.round(n), 128), i, a, p, tip, m, sx, sy;
  if (N < 3) return '';
  for (i = 0; i < N; i++) {
    a = rot + i * 2 * Math.PI / N;
    p = pt(cx, cy, R, a);
    tip = pt(cx, cy, R + len, a);
    m = pt(cx, cy, R + len * 0.5, a);
    sx = Math.cos(a + Math.PI / 2) * wid;
    sy = Math.sin(a + Math.PI / 2) * wid;
    d += 'M' + fmt1(p[0]) + ' ' + fmt1(p[1]) +
         'Q' + fmt1(m[0] + sx) + ' ' + fmt1(m[1] + sy) + ' ' + fmt1(tip[0]) + ' ' + fmt1(tip[1]) +
         'Q' + fmt1(m[0] - sx) + ' ' + fmt1(m[1] - sy) + ' ' + fmt1(p[0]) + ' ' + fmt1(p[1]) + 'Z';
  }
  return d;
}

/* ============ 三圈曼陀罗：建一次，之后纯 CSS 旋转 ============ */
function buildMandala(){
  var C = 600, i, a, p, out = [];

  out.push('<defs><linearGradient id="gLeafA" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="rgba(31,155,154,0.34)"/>' +
    '<stop offset="1" stop-color="rgba(13,36,80,0.02)"/>' +
    '</linearGradient></defs>');
  out.push('<circle cx="600" cy="600" r="562" fill="none" stroke="rgba(226,178,86,0.16)" stroke-width="1.2"/>');
  out.push('<path d="' + leafPath(C, C, 468, 24, 0, 92, 15) + '" fill="url(#gLeafA)" stroke="rgba(246,227,176,0.28)" stroke-width="1"/>');
  out.push('<path d="' + polyPath(starPts(C, C, 470, 386, 24, 0.065)) + '" fill="none" stroke="rgba(226,178,86,0.32)" stroke-width="1.1"/>');
  out.push('<path d="' + polyPath(starPts(C, C, 386, 328, 24, 0.196)) + '" fill="none" stroke="rgba(110,214,206,0.26)" stroke-width=".9"/>');
  for (i = 0; i < 24; i++) {
    a = i * 2 * Math.PI / 24;
    p = pt(C, C, 470, a);
    out.push('<circle cx="' + fmt1(p[0]) + '" cy="' + fmt1(p[1]) + '" r="3.2" fill="rgba(246,227,176,0.62)"/>');
  }
  out.push('<circle cx="600" cy="600" r="330" fill="none" stroke="rgba(226,178,86,0.30)" stroke-width="1.6"/>');
  document.getElementById('rotorA').innerHTML = out.join('');

  var mid = [];
  mid.push('<circle cx="600" cy="600" r="318" fill="none" stroke="rgba(226,178,86,0.20)" stroke-width="1"/>');
  mid.push('<path d="' + petalRing(C, C, 300, 16, 0, 1.16) + '" fill="rgba(31,155,154,0.14)" stroke="rgba(118,226,214,0.42)" stroke-width="1.1"/>');
  mid.push('<circle cx="600" cy="600" r="244" fill="none" stroke="rgba(226,178,86,0.26)" stroke-width="1"/>');
  mid.push('<path d="' + zigRing(C, C, 244, 282, 32, 0) + '" fill="none" stroke="rgba(226,178,86,0.30)" stroke-width=".9"/>');
  mid.push('<path d="' + leafPath(C, C, 176, 16, Math.PI / 16, 64, 11) + '" fill="rgba(226,178,86,0.07)" stroke="rgba(226,178,86,0.24)" stroke-width=".8"/>');
  document.getElementById('rotorB').innerHTML = mid.join('');

  var inn = [];
  inn.push('<path d="' + polyPath(starPts(C, C, 172, 96, 8, Math.PI / 8)) + '" fill="rgba(74,28,78,0.22)" stroke="rgba(255,214,140,0.48)" stroke-width="1.3"/>');
  inn.push('<path d="' + polyPath(starPts(C, C, 96, 62, 8, 0)) + '" fill="none" stroke="rgba(110,214,206,0.36)" stroke-width="1"/>');
  inn.push('<path d="' + petalRing(C, C, 58, 8, Math.PI / 8, 1.5) + '" fill="none" stroke="rgba(246,227,176,0.38)" stroke-width=".9"/>');
  document.getElementById('rotorC').innerHTML = inn.join('');

  document.getElementById('pulseRing').innerHTML =
    '<circle cx="600" cy="600" r="352" fill="none" stroke="rgba(255,214,140,0.22)" stroke-width="2.4"/>' +
    '<circle cx="600" cy="600" r="359" fill="none" stroke="rgba(110,214,206,0.13)" stroke-width="6"/>';

  if (S.reduced) {
    var all = document.querySelectorAll('#mandala .sv'), k;
    for (k = 0; k < all.length; k++) {
      all[k].style.animationDuration = '720s';
      all[k].style.animationName = 'none';
    }
  }
}

/* ============ 星轨 ============ */
var stars = [];
function buildStars(){
  stars.length = 0;
  var n = 118, i;
  for (i = 0; i < n; i++) {
    stars.push({
      a: (i / n) * Math.PI * 2 + (i % 7) * 0.11,
      r: 0.10 + ((i * 37) % 100) / 100 * 0.86,
      s: 0.5 + ((i * 53) % 100) / 100 * 1.6,
      w: 0.8 + ((i * 17) % 100) / 100 * 2.2,
      ph: ((i * 29) % 100) / 100 * Math.PI * 2,
      sp: 0.7 + ((i * 13) % 100) / 100 * 0.9
    });
  }
}

function drawStarTrails(tt){
  var cx = view.cx, cy = view.cy, i, s, R, a, x, y, al;
  var maxR = Math.hypot(view.w, view.h) * 0.64;
  bctx.save();
  bctx.lineCap = 'round';
  for (i = 0; i < stars.length; i++) {
    s = stars[i];
    R = maxR * s.r;
    a = s.a + (tt * 0.030) / s.sp;
    x = cx + Math.cos(a) * R;
    y = cy + Math.sin(a) * R * 0.92;
    al = (0.16 + 0.52 * s.r) * (0.58 + 0.42 * Math.sin(tt * 1.6 + s.ph));
    bctx.strokeStyle = 'rgba(190,220,255,' + (al * 0.36).toFixed(3) + ')';
    bctx.lineWidth = s.w * 0.5;
    bctx.beginPath();
    bctx.arc(cx, cy, R, a - 0.10 - s.sp * 0.05, a, false);
    bctx.stroke();
    bctx.fillStyle = 'rgba(247,232,196,' + Math.min(0.86, al).toFixed(3) + ')';
    bctx.fillRect(x - s.s * 0.5, y - s.s * 0.5, s.s, s.s);
  }
  bctx.restore();
}

/* ============ 静态底：离屏一次 ============ */
function renderBackdrop(){
  var w = Math.max(2, offW || 1440), h = Math.max(2, offH || 900);
  back.width = Math.max(2, Math.round(w * 0.55));
  back.height = Math.max(2, Math.round(h * 0.55));
  var W = back.width, H = back.height, g, i, x, y, rr, a;

  g = bctx2.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0, '#0b1e44');
  g.addColorStop(0.40, '#0b1738');
  g.addColorStop(0.76, '#070f28');
  g.addColorStop(1, '#04081a');
  bctx2.fillStyle = g;
  bctx2.fillRect(0, 0, W, H);

  g = bctx2.createRadialGradient(W * 0.20, H * 0.22, 0, W * 0.20, H * 0.22, W * 0.54);
  g.addColorStop(0, 'rgba(26,140,142,0.34)');
  g.addColorStop(0.55, 'rgba(20,86,120,0.13)');
  g.addColorStop(1, 'rgba(10,28,60,0)');
  bctx2.fillStyle = g; bctx2.fillRect(0, 0, W, H);

  g = bctx2.createRadialGradient(W * 0.84, H * 0.76, 0, W * 0.84, H * 0.76, W * 0.5);
  g.addColorStop(0, 'rgba(132,54,96,0.26)');
  g.addColorStop(0.5, 'rgba(62,32,88,0.11)');
  g.addColorStop(1, 'rgba(10,20,50,0)');
  bctx2.fillStyle = g; bctx2.fillRect(0, 0, W, H);

  for (i = 0; i < 260; i++) {
    x = Math.random() * W; y = Math.random() * H;
    rr = Math.random() * 1.4 + 0.3;
    a = Math.random() * 0.30 + 0.04;
    bctx2.fillStyle = Math.random() < 0.62
      ? 'rgba(233,196,119,' + a.toFixed(3) + ')'
      : 'rgba(160,214,214,' + (a * 0.8).toFixed(3) + ')';
    bctx2.beginPath(); bctx2.arc(x, y, rr, 0, 6.2832); bctx2.fill();
  }
  offDirty = false;
}

/* ============ 朱红/金 剪纸圆弧 ============ */
function drawArcs(tt, e){
  var cx = view.cx, cy = view.cy, i, R, a0, a1, lw;
  bctx.save();
  for (i = 0; i < 5; i++) {
    R = Math.min(view.w, view.h) * (0.30 + i * 0.088);
    a0 = tt * (0.09 + i * 0.030) + i * 1.7;
    a1 = a0 + 1.0 + Math.sin(tt * 0.55 + i) * 0.42 + e * 0.30;
    bctx.strokeStyle = (i % 2 === 0 ? 'rgba(168,62,32,' : 'rgba(226,178,86,') +
      (0.19 + 0.12 * Math.sin(i * 2.1 + tt * 0.7)).toFixed(3) + ')';
    lw = Math.max(1, view.s * (i === 1 ? 2.8 : 1.3));
    bctx.lineWidth = lw;
    bctx.beginPath();
    bctx.arc(cx, cy, R, a0, a1, false);
    bctx.stroke();
  }
  bctx.restore();
}

/* ============ 金色地平线 + 尖塔剪影（压到最底部，只作细密画“地面”） ============ */
function drawHorizon(tt, e){
  var w = view.w, h = view.h, y = h * 0.945, i, x, hh, tw, N;
  var g = bctx.createLinearGradient(0, h * 0.74, 0, h);
  g.addColorStop(0, 'rgba(4,8,20,0)');
  g.addColorStop(0.62, 'rgba(4,8,20,0.34)');
  g.addColorStop(1, 'rgba(3,6,16,0.82)');
  bctx.fillStyle = g;
  bctx.fillRect(0, h * 0.74, w, h * 0.26);

  bctx.save();
  bctx.globalCompositeOperation = 'lighter';
  bctx.strokeStyle = 'rgba(226,178,86,' + (0.10 + e * 0.12).toFixed(3) + ')';
  bctx.lineWidth = Math.max(1, view.s * 0.9);
  bctx.beginPath();
  bctx.moveTo(0, y);
  bctx.lineTo(w, y);
  bctx.stroke();
  bctx.restore();

  N = Math.min(52, Math.max(6, Math.round(w / 30)));
  for (i = 0; i < N; i++) {
    x = (i + 0.5) * w / N;
    hh = (8 + ((i * 47) % 26)) * view.s;
    tw = Math.max(3, w / N * 0.28);
    bctx.fillStyle = 'rgba(6,12,28,0.94)';
    bctx.beginPath();
    bctx.moveTo(x - tw, y + 1);
    bctx.lineTo(x, y - hh);
    bctx.lineTo(x + tw, y + 1);
    bctx.closePath();
    bctx.fill();
    bctx.fillStyle = 'rgba(246,227,176,' + (0.08 + 0.09 * Math.sin(tt * 1.25 + i)).toFixed(3) + ')';
    bctx.fillRect(x - 0.6, y - hh - 1.4, 1.2, 1.4);
  }
}

/* ============ 特效层 ============ */
var motes = [];
function buildMotes(){
  motes.length = 0;
  for (var i = 0; i < 46; i++) {
    motes.push({
      a: Math.random() * 6.2832,
      r: Math.random(),
      sp: 0.06 + Math.random() * 0.20,
      sz: 0.7 + Math.random() * 2.1,
      ph: Math.random() * 6.2832,
      warm: Math.random() < 0.7
    });
  }
}

function drawFX(tt, e){
  var w = view.w, h = view.h, cx = view.cx, cy = view.cy, i, g, rad, N, R, a0, a1;
  fctx.clearRect(0, 0, w, h);

  /* 中心暖光：金 ↔ 青金石 ↔ 封面主色 三重漂移 */
  var mix = 0.5 + 0.5 * Math.sin(tt * 0.22);
  var mix2 = 0.5 + 0.5 * Math.sin(tt * 0.13 + 2.1);
  var A = S.acc;
  rad = Math.min(w, h) * (0.40 + e * 0.07);
  g = fctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
  var r0 = Math.round((233 * (1 - mix2) + A[0] * mix2) * (1 - mix) + (31 + 46 * mix2) * mix);
  var g0 = Math.round((196 * (1 - mix2) + A[1] * mix2) * (1 - mix) + (155 - 26 * mix2) * mix);
  var b0 = Math.round((119 * (1 - mix2) + A[2] * mix2) * (1 - mix) + (154 + 22 * mix2) * mix);
  g.addColorStop(0, 'rgba(' + cl(r0, 0, 255) + ',' + cl(g0, 0, 255) + ',' + cl(b0, 0, 255) + ',' + (0.09 + e * 0.11).toFixed(3) + ')');
  g.addColorStop(0.42, 'rgba(' + Math.round(31 + 46 * mix) + ',' + Math.round(155 - 26 * mix) + ',' + Math.round(154 + 22 * mix) + ',' + (0.045 + e * 0.045).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(8,16,40,0)');
  fctx.fillStyle = g;
  fctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);

  /* 飞毯流线 */
  fctx.save();
  fctx.lineCap = 'round';
  N = 7;
  for (i = 0; i < N; i++) {
    R = Math.min(w, h) * (0.255 + i * 0.062);
    a0 = tt * (0.15 + i * 0.040) + i * 2.4;
    a1 = a0 + 0.85 + e * 0.55;
    fctx.strokeStyle = (i % 3 === 0)
      ? 'rgba(255,214,140,' + (0.12 + e * 0.16).toFixed(3) + ')'
      : 'rgba(96,214,206,' + (0.070 + e * 0.10).toFixed(3) + ')';
    fctx.lineWidth = Math.max(1, view.s * (1.0 + (i % 3 === 0 ? 1.5 : 0)));
    fctx.beginPath();
    fctx.arc(cx, cy, R, a0, a1, false);
    fctx.stroke();
  }
  fctx.restore();

  /* 金箔尘：从中心螺旋外扩（相位与角速度都不同，保证任意两个时刻分布不同） */
  var maxR = Math.hypot(w, h) * 0.55;
  for (i = 0; i < motes.length; i++) {
    var m = motes[i];
    var rr = maxR * ((m.r + tt * m.sp * 0.018) % 1);
    var aa = m.a + tt * 0.05 * m.sp * 3;
    var al = 0.12 + 0.28 * (0.5 + 0.5 * Math.sin(tt * 1.1 + m.ph));
    fctx.fillStyle = m.warm
      ? 'rgba(255,222,158,' + al.toFixed(3) + ')'
      : 'rgba(150,232,224,' + (al * 0.8).toFixed(3) + ')';
    fctx.fillRect(cx + Math.cos(aa) * rr, cy + Math.sin(aa) * rr * 0.94, m.sz, m.sz);
  }

  /* 飞毯的流苏边：一圈带缺口的金色虚线弧，缓慢反向转 */
  fctx.save();
  fctx.setLineDash([2.5, 16]);
  fctx.lineDashOffset = -tt * 14;
  fctx.strokeStyle = 'rgba(240,208,146,' + (0.16 + e * 0.20).toFixed(3) + ')';
  fctx.lineWidth = Math.max(1, view.s * 1.6);
  fctx.beginPath();
  fctx.arc(cx, cy, Math.min(w, h) * 0.335, 0, 6.2832);
  fctx.stroke();
  fctx.restore();

  /* 鼓点闪环 */
  if (S.beatFlash > 0.02) {
    var br = Math.min(w, h) * (0.29 + (1 - S.beatFlash) * 0.24);
    fctx.strokeStyle = 'rgba(255,226,164,' + (S.beatFlash * 0.32).toFixed(3) + ')';
    fctx.lineWidth = Math.max(1, view.s * 2.6);
    fctx.beginPath();
    fctx.arc(cx, cy, br, 0, 6.2832);
    fctx.stroke();
  }
}

/* ============ 歌词 ============ */
var ly = {
  prevEl: null, nextEl: null, cur: null,
  spans: [], chars: [], key: -1, curText: null, prevTxt: null, nextTxt: null
};
var CUPS = [];

/* 逐字时间：YRC 优先；长度不符或时间非法 → 按句长均分 */
function charTimes(line){
  var i, n = line.text.length, out = [], ch = line.chars;
  var t0 = line.t, dur = line.dur > 0 ? line.dur : Math.max(1.2, n * 0.32);
  if (!isFinite(dur) || dur <= 0) dur = Math.max(1.2, n * 0.32);
  if (ch && ch.length === n) {
    var ok = true;
    for (i = 0; i < n && i < 800; i++) {
      var ct = ch[i];
      if (ct && typeof ct === 'object') ct = ct.t;
      ct = num(ct, NaN);
      if (!isFinite(ct)) { ok = false; break; }
      out.push(ct);
    }
    if (ok && out.length === n) return out;
    out.length = 0;
  }
  var per = dur / Math.max(1, n);
  for (i = 0; i < n; i++) out.push(t0 + i * per);
  return out;
}

function buildCurLine(i){
  var el = ly.cur, L = S.lines, txt, k, n, d, c, frag;
  if (!el) return;
  if (i < 0 || i >= L.length) {
    if (ly.key !== -2) {
      el.innerHTML = '';
      ly.key = -2; ly.curText = '';
      ly.spans = []; ly.chars = []; CUPS.length = 0;
    }
    return;
  }
  txt = L[i].text;
  if (ly.key === i && ly.curText === txt) return;
  ly.key = i; ly.curText = txt;
  ly.chars = charTimes(L[i]);
  ly.spans = [];
  n = Math.min(txt.length, 400);
  frag = document.createDocumentFragment();
  for (k = 0; k < n; k++) {
    c = txt.charAt(k);
    if (c === '\n') { frag.appendChild(document.createElement('br')); continue; }
    d = document.createElement('span');
    d.className = 'ch';
    d.textContent = c;
    frag.appendChild(d);
    ly.spans.push(d);
  }
  el.innerHTML = '';
  el.appendChild(frag);
  CUPS.length = 0;
}

function paintChars(){
  var sp = ly.spans, ch = ly.chars, n = Math.min(sp.length, ch.length);
  if (!n) return;
  var t = S.t, k, on = 0, cidx;
  for (k = 0; k < n; k++) {
    if (t >= ch[k]) on = k + 1;
    else break;
  }
  cidx = (on >= n) ? -1 : on;
  for (k = 0; k < n; k++) {
    var want = (k < on) ? 2 : (k === cidx ? 3 : 1);
    if (CUPS[k] !== want) {
      CUPS[k] = want;
      sp[k].className = want === 2 ? 'ch on' : (want === 3 ? 'ch cur' : 'ch');
    }
  }
}

function renderLyric(force){
  var i = S.idx, L = S.lines;
  var p = (i - 1 >= 0 && i - 1 < L.length) ? L[i - 1].text : '';
  var q = (i + 1 >= 0 && i + 1 < L.length) ? L[i + 1].text : '';
  if (ly.prevEl && (force || ly.prevTxt !== p)) { ly.prevTxt = p; ly.prevEl.textContent = p || ''; }
  if (ly.nextEl && (force || ly.nextTxt !== q)) { ly.nextTxt = q; ly.nextEl.textContent = q || ''; }
  buildCurLine(i);
  CUPS.length = 0;
  paintChars();
}

function updateEmpty(){
  var box = document.getElementById('empty');
  var none = S.inited && S.lines.length === 0;
  box.className = none ? 'on' : 'off';
  document.getElementById('lyricBox').style.display = none ? 'none' : '';
}

function updateMeta(){
  var m1 = document.querySelector('#meta .m1'), m2 = document.querySelector('#meta .m2');
  var a = S.song.artists || '', b = S.song.name || '';
  m1.textContent = b ? (a ? b + ' · ' + a : b) : a;
  m2.textContent = 'SÎMÛRGH · 青 金 回 旋';
}

/* ============ 消息 ============ */
function idxOf(t){
  var L = S.lines, lo = 0, hi = L.length - 1, r = -1, m;
  while (lo <= hi) {
    m = (lo + hi) >> 1;
    if (L[m].t <= t) { r = m; lo = m + 1; } else { hi = m - 1; }
  }
  return r;
}

function onInit(p){
  var raw = Array.isArray(p.lines) ? p.lines : [];
  var out = [], i, ln, txt, chars, cc, j, ok, ar, ct, src;
  for (i = 0; i < raw.length && i < 3000; i++) {
    ln = raw[i];
    if (!ln || typeof ln !== 'object') continue;
    txt = (ln.text == null) ? '' : String(ln.text);
    if (!txt.replace(/\s+/g, '')) continue;
    chars = null;
    src = ln.chars;
    if (Array.isArray(src) && src.length) {
      cc = []; ok = true;
      for (j = 0; j < src.length && j < 900; j++) {
        ct = src[j];
        if (ct && typeof ct === 'object') ct = ct.t;
        ct = num(ct, NaN);
        if (!isFinite(ct)) { ok = false; break; }
        cc.push(ct);
      }
      if (ok && cc.length === txt.length) chars = cc;
    }
    out.push({ t: Math.max(0, num(ln.t, 0)), dur: Math.max(0, num(ln.dur, 0)), text: txt, chars: chars });
  }
  out.sort(function(a, b){ return a.t - b.t; });
  S.lines = out;
  S.dur = Math.max(0, num(p.duration, 0));
  if (p.song && typeof p.song === 'object') {
    S.song.name = p.song.name == null ? '' : String(p.song.name).slice(0, 120);
    ar = p.song.artists;
    S.song.artists = Array.isArray(ar)
      ? ar.filter(function(x){ return !!x; }).join(' / ').slice(0, 120)
      : (ar == null ? '' : String(ar).slice(0, 120));
  }
  if (Array.isArray(p.accent) && p.accent.length >= 3) {
    S.acc = [cl(num(p.accent[0], 232), 0, 255), cl(num(p.accent[1], 192), 0, 255), cl(num(p.accent[2], 106), 0, 255)];
  }
  S.playing = (p.playing === false) ? false : true;
  S.inited = true;
  S.idx = idxOf(S.t);
  ly.key = -99; ly.curText = null; ly.prevTxt = null; ly.nextTxt = null;
  renderLyric(true);
  updateEmpty();
  updateMeta();
}

function onTick(p){
  S.hasTick = true;
  S.time0 = Math.max(0, num(p.time, 0));
  S.stamp0 = performance.now();
  if (typeof p.playing === 'boolean') S.playing = p.playing;
  var i = idxOf(S.time0);
  if (i !== S.idx) {
    S.idx = i;
    if (S.inited) renderLyric(false);
  }
}

window.addEventListener('message', function(ev){
  var d = ev.data, q, lv;
  if (!d || d.__c100 !== 1) return;
  try {
    if (d.type === 'init') onInit(d.payload || {});
    else if (d.type === 'tick') onTick(d.payload || {});
    else if (d.type === 'beat') {
      q = d.payload || {};
      lv = cl(num(q.level, 0.5), 0, 1);
      if (lv > S.energy) S.energy = lv;
      S.beatFlash = 1;
    } else if (d.type === 'live') {
      q = d.payload || {};
      S.level = cl(num(q.level, 0), 0, 1);
      S.bass = cl(num(q.bass, 0), 0, 1);
      S.mid = cl(num(q.mid, 0), 0, 1);
      S.treble = cl(num(q.treble, 0), 0, 1);
      S.bpm = num(q.bpm, 0);
      if (typeof q.playing === 'boolean') S.playing = q.playing;
    }
  } catch (e) { S.err = String(e); console.error('[479] message handler', e); }
});

/* ============ 主循环 ============ */
var t0 = performance.now();
var lastTs = 0;
var mandalaEl = document.getElementById('mandala');
var pulseEl = document.getElementById('pulseRing');
var specEl = document.getElementById('spectrum');

function frame(ts){
  var j0 = performance.now();
  if (!lastTs) lastTs = ts;
  var dt = cl((ts - lastTs) / 1000, 0, 0.12);
  lastTs = ts;
  try {
    var tt = (ts - t0) / 1000;
    if (!isFinite(tt) || tt < 0) tt = 0;

    var t = S.time0;
    if (S.hasTick && S.playing) t = S.time0 + Math.min(0.5, (performance.now() - S.stamp0) / 1000);
    S.t = Math.max(0, t);
    var i = idxOf(S.t);
    if (i !== S.idx) {
      S.idx = i;
      if (S.inited) renderLyric(false);
    }

    S.energy *= Math.pow(0.35, dt);
    S.beatFlash *= Math.pow(0.02, dt);
    var e = cl(S.energy * 0.55 + S.bass * 0.48 + S.level * 0.30 + S.beatFlash * 0.40, 0, 1);

    if (offDirty || offW !== view.w || offH !== view.h) renderBackdrop();
    bctx.fillStyle = '#060a1c';
    bctx.fillRect(0, 0, view.w, view.h);
    if (back.width > 1) bctx.drawImage(back, 0, 0, view.w, view.h);
    drawStarTrails(tt);
    drawArcs(tt, e);
    drawHorizon(tt, e);

    /* 呼吸：只给旋转（合成层可直接复用位图），不做每帧缩放，避免大图重新栅格化 */
    var rot = S.reduced ? 0 : Math.sin(tt * 0.10) * 2.4;
    mandalaEl.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';
    pulseEl.style.opacity = (0.40 + e * 0.50).toFixed(3);

    /* 光谱带只改透明度（廉价），不做会触发重栅格化的 scaleY */
    specEl.style.opacity = (0.20 + e * 0.30).toFixed(3);

    drawFX(tt, e);
    paintChars();

    S.frames++;
  } catch (err) {
    S.err = String(err);
    console.error('[479] frame error', err);
  }
  S.js = performance.now() - j0;
  requestAnimationFrame(frame);
}

/* ============ 启动 ============ */
ly.prevEl = document.getElementById('prev');
ly.nextEl = document.getElementById('next');
ly.cur = document.getElementById('cur');

if (window.matchMedia) {
  try { S.reduced = !!window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { console.error('[479] matchMedia', e); }
}

try {
  buildStars();
  buildMotes();
  resize();                 /* view 已建立，安全 */
  buildMandala();
  renderBackdrop();
  try {
    var gc = document.createElement('canvas');
    gc.width = 110; gc.height = 110;
    var gx = gc.getContext('2d');
    var img = gx.createImageData(110, 110);
    for (var gi = 0; gi < img.data.length; gi += 4) {
      var v = 110 + Math.random() * 145;
      img.data[gi] = v; img.data[gi + 1] = v; img.data[gi + 2] = v; img.data[gi + 3] = 255;
    }
    gx.putImageData(img, 0, 0);
    document.getElementById('grain').style.backgroundImage = 'url(' + gc.toDataURL('image/png') + ')';
  } catch (ge) { console.error('[479] grain', ge); }
  updateMeta();
  updateEmpty();
  window.addEventListener('resize', function(){
    try { resize(); renderBackdrop(); } catch (e) { console.error('[479] resize', e); }
  });
} catch (e) {
  S.err = String(e);
  console.error('[479] boot', e);
}

requestAnimationFrame(function(){ sendReady(); });
requestAnimationFrame(frame);
})();

</script>
</body>
