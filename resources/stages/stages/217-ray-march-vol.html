<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体积光线步进</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.6 ui-monospace,Consolas,monospace;color:rgba(150,190,255,.26);
        letter-spacing:.16em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/*!
title: 体积光线步进
机制一句话：屏幕每个像素都从一台**真的在绕飞的透视相机**里发出一条视线，在"当前句墨迹的挤出体"
的**有符号距离场**里做球步进（SDF = max(二维带符号距离, |z| − 厚度)），求到第一个交点：
交在正面就按法线打光，交在侧壁就露出笔画的**厚度**，掠角处起一道菲涅尔边光；
没打中的视线用"离表面最近的距离"回一份很淡的体积光晕。—— 字是一个在暗场里缓慢转身的物件，
而不是一张贴在屏幕上的图。

实现要点：
  · 预烘一次：笔迹掩码 → 外距离场 + 笔画内距离场，合成一张**带符号距离表**（CSS 像素）。
  · 步进只在"厚度板"那一段里进行（解析算出进/出板面），所以平均 2~6 步就收敛；
    渲染在 0.19 倍分辨率（≈36k 像素）的 ImageData 上做，再上采样，帧预算 2~3ms。
  · 相机偏航 ±15°、俯仰缓慢呼吸；光随相机走，所以侧壁的明暗一直在变。
  · 暂停即冻结；RM 时相机停摆（只留极慢的呼吸），步进分辨率减半。
*/
/* ══════════════════════════════════════════════════════════════════════════
   C 组共享内核（单文件内联；形态不加载任何外部资源）
   协议 / 排版 / 预烘 / 时钟 / 四条纪律（空歌词 · 暂停冻结 · resize · 降级）
   —— 形态只实现 S.* 里的机制：bake / draw / step / onLine / onEmpty / ...
   ══════════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');

let W = 1, H = 1, DPR = 1, MN = 1, VX = 1, VY = 1;
const CFG = { vy: 0.5, maxW: 0.72, maxH: 0.34, track: 0.035 };
let ACC = [126, 178, 255];
const S = {};                    /* 形态实现挂在这里 */

/* ---- prefers-reduced-motion：运行中切换也要跟得上（验收会中途改它） ---- */
let RM = false;
try {
  const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq) {
    RM = !!mq.matches;
    const onMQ = function (e) {
      RM = !!e.matches;
      dirty = true;
      if (S.onRM) S.onRM();
    };
    if (mq.addEventListener) mq.addEventListener('change', onMQ);
    else if (mq.addListener) mq.addListener(onMQ);
  }
} catch (_) {}

/* ══════════════════════════════ 排版 ══════════════════════════════ */
const FAMILY = '"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif';
const OPUNCT = '，。、；：！？）】》」』”’,.!?;:)]}%…';
const LPUNCT = '（【《「『“‘({[';
const measCtx = document.createElement('canvas').getContext('2d');
const fontOf = (fs) => '800 ' + fs + 'px ' + FAMILY;

function measureStr(s, fs) {
  measCtx.font = fontOf(fs);
  let w = 0;
  for (let i = 0; i < s.length; i++) w += measCtx.measureText(s[i]).width + fs * CFG.track;
  return Math.max(0, w - fs * CFG.track);
}

/* 长句折行：在标点处断，不把标点摔到行首 */
function splitRows(s, L) {
  const n = s.length, cuts = [];
  for (let i = 1; i < L; i++) {
    let c = Math.round(i * n / L);
    while (c < n && OPUNCT.indexOf(s[c]) >= 0) c++;
    if (c > 0 && c < n && LPUNCT.indexOf(s[c - 1]) >= 0) c--;
    if (c <= 0 || c >= n) continue;
    if (cuts.length && c <= cuts[cuts.length - 1]) continue;
    cuts.push(c);
  }
  const rows = [];
  let prev = 0;
  for (let i = 0; i < cuts.length; i++) { rows.push(s.slice(prev, cuts[i])); prev = cuts[i]; }
  rows.push(s.slice(prev));
  return rows.filter((r) => r.length > 0);
}

/* 排版：试 1~3 行，取字号最大的那一种（长句自动折行，不缩成蚂蚁） */
function layout(raw) {
  if (!raw) return null;
  const s = String(raw).replace(/\s+/g, ' ').trim();
  if (!s) return null;
  const n = s.length;
  const maxW = Math.min(W * CFG.maxW, 1120);
  const maxH = H * CFG.maxH;
  const maxL = n <= 12 ? 1 : (n <= 24 ? 2 : 3);
  let best = null;
  for (let L = 1; L <= maxL; L++) {
    if (L > 1 && n < L + 2) continue;
    const rows = splitRows(s, L);
    let w100 = 0;
    for (let i = 0; i < rows.length; i++) w100 = Math.max(w100, measureStr(rows[i], 100));
    const fs = Math.min(maxW / (Math.max(1, w100) / 100), maxH / (1.22 * rows.length), 168);
    if (fs < 24) continue;
    if (best && fs < best.fs * 1.07) continue;
    best = { rows: rows, fs: fs };
  }
  if (!best) {
    const w100 = Math.max(1, measureStr(s, 100));
    best = { rows: [s], fs: Math.max(20, Math.min(maxW / (w100 / 100), maxH / 1.22, 168)) };
  }
  const fs = best.fs, lh = fs * 1.22;
  measCtx.font = fontOf(fs);
  const rows = [];
  let bw = 0;
  for (let r = 0; r < best.rows.length; r++) {
    const txt = best.rows[r], chars = [];
    let x = 0;
    for (let k = 0; k < txt.length; k++) {
      const c = txt[k], wch = measCtx.measureText(c).width;
      if (c !== ' ') chars.push({ c: c, x: x, w: wch });
      x += wch + fs * CFG.track;
    }
    const rw = Math.max(0, x - fs * CFG.track);
    rows.push({ chars: chars, w: rw, ly: (r + 0.5) * lh });
    if (rw > bw) bw = rw;
  }
  return { rows: rows, fs: fs, lh: lh, bw: Math.max(1, bw), bh: lh * rows.length };
}

function paintRows(g, lay, ox, oy) {
  g.font = fontOf(lay.fs);
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  for (let r = 0; r < lay.rows.length; r++) {
    const row = lay.rows[r];
    for (let k = 0; k < row.chars.length; k++) g.fillText(row.chars[k].c, ox + row.chars[k].x, oy + row.ly);
  }
}

/* ══════════════════════════════ 预烘 ══════════════════════════════
   每句只做一次：清晰版（DPR）+ 若干模糊/发光/影子层 + 半分辨率墨迹掩码
   + 距离场（chamfer）+ 朝外法向。帧里只 drawImage / 查表，绝不每帧 filter。 */
const MS = 0.5;
const offCv = document.createElement('canvas');
const offCtx = offCv.getContext('2d', { willReadFrequently: true });

function tintLayer(lay, bw, bh, pad, blurPx, color) {
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(bw));
  c.height = Math.max(2, Math.round(bh));
  const g = c.getContext('2d');
  if (blurPx > 0) g.filter = 'blur(' + (Math.round(blurPx * 10) / 10) + 'px)';
  g.fillStyle = color;
  paintRows(g, lay, pad, pad);
  return c;
}

/* 两遍 chamfer 距离变换（单位：掩码像素；除 MS 得 CSS 像素） */
function chamfer(mask, mw, mh) {
  const d = new Float32Array(mw * mh);
  const BIG = 1e5;
  for (let i = 0; i < d.length; i++) d[i] = mask[i] ? 0 : BIG;
  for (let y = 0; y < mh; y++) {
    const row = y * mw;
    for (let x = 0; x < mw; x++) {
      const i = row + x;
      let v = d[i];
      if (v === 0) continue;
      if (x > 0) { const t = d[i - 1] + 1; if (t < v) v = t; }
      if (y > 0) {
        const up = i - mw;
        let t = d[up] + 1; if (t < v) v = t;
        if (x > 0) { t = d[up - 1] + 1.4142; if (t < v) v = t; }
        if (x < mw - 1) { t = d[up + 1] + 1.4142; if (t < v) v = t; }
      }
      d[i] = v;
    }
  }
  for (let y = mh - 1; y >= 0; y--) {
    const row = y * mw;
    for (let x = mw - 1; x >= 0; x--) {
      const i = row + x;
      let v = d[i];
      if (v === 0) continue;
      if (x < mw - 1) { const t = d[i + 1] + 1; if (t < v) v = t; }
      if (y < mh - 1) {
        const dn = i + mw;
        let t = d[dn] + 1; if (t < v) v = t;
        if (x < mw - 1) { t = d[dn + 1] + 1.4142; if (t < v) v = t; }
        if (x > 0) { t = d[dn - 1] + 1.4142; if (t < v) v = t; }
      }
      d[i] = v;
    }
  }
  return d;
}

/* o: { padR, padPx, blur:[px], blurColor, glow:px, glowColor, shadow:px, shadowColor,
        mask:bool, field:bool, normals:bool, cap:float } */
function bake(text, o) {
  o = o || {};
  let lay = null;
  try { lay = layout(text); } catch (_) { lay = null; }
  if (!lay) return null;
  const pad = Math.round(lay.fs * (o.padR || 0.30)) + (o.padPx === undefined ? 16 : o.padPx);
  const bw = Math.ceil(lay.bw) + pad * 2;
  const bh = Math.ceil(lay.bh) + pad * 2;
  if (bw < 8 || bh < 8) return null;
  const out = { lay: lay, bw: bw, bh: bh, pad: pad, gx: VX - bw / 2, gy: VY - bh / 2, text: lay.rows.map((r) => r.chars.map((c) => c.c).join('')).join('') };

  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(bw * DPR));
  c.height = Math.max(2, Math.round(bh * DPR));
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#fff';
  paintRows(g, lay, pad, pad);
  out.crisp = c;

  const bl = o.blur || [], soft = [];
  for (let i = 0; i < bl.length; i++) soft.push(tintLayer(lay, bw, bh, pad, bl[i], o.blurColor || '#fff'));
  out.soft = soft;
  if (o.glow) out.glow = tintLayer(lay, bw, bh, pad, o.glow, o.glowColor || '#fff');
  if (o.shadow) out.shadow = tintLayer(lay, bw, bh, pad, o.shadow, o.shadowColor || 'rgba(0,0,0,1)');

  if (o.mask) {
    const mw = Math.max(2, Math.round(bw * MS)), mh = Math.max(2, Math.round(bh * MS));
    offCv.width = mw; offCv.height = mh;
    offCtx.setTransform(1, 0, 0, 1, 0, 0);
    offCtx.clearRect(0, 0, mw, mh);
    offCtx.setTransform(MS, 0, 0, MS, 0, 0);
    offCtx.fillStyle = '#fff';
    paintRows(offCtx, lay, pad, pad);
    const d = offCtx.getImageData(0, 0, mw, mh).data;
    const mask = new Uint8Array(mw * mh);
    for (let i = 0, p = 3; i < mask.length; i++, p += 4) if (d[p] > 110) mask[i] = 1;
    out.mask = mask; out.mw = mw; out.mh = mh; out.mox = out.gx; out.moy = out.gy;
    if (o.field) {
      const df = chamfer(mask, mw, mh);
      const cap = o.cap || 80;
      for (let i = 0; i < df.length; i++) if (df[i] > cap) df[i] = cap;
      out.df = df;
    }
    /* 笔画**内部**的距离场（到笔画外沿的距离）：脊线 = 中心线，值 = 半边宽 */
    if (o.inner) {
      const inv = new Uint8Array(mask.length);
      for (let i = 0; i < mask.length; i++) inv[i] = mask[i] ? 0 : 1;
      const dfi = chamfer(inv, mw, mh);
      const capI = o.capInner || 40;
      for (let i = 0; i < dfi.length; i++) if (dfi[i] > capI) dfi[i] = capI;
      out.dfi = dfi;
    }
    /* 朝外方向场：把掩码糊一下取负梯度（墨迹内外都有定义，粗笔画中间也不会退化） */
    if (o.dir) {
      const dc = document.createElement('canvas');
      dc.width = mw; dc.height = mh;
      const dg = dc.getContext('2d');
      const img = dg.createImageData(mw, mh);
      for (let i = 0; i < mask.length; i++) {
        if (!mask[i]) continue;
        img.data[i * 4] = 255; img.data[i * 4 + 1] = 255; img.data[i * 4 + 2] = 255; img.data[i * 4 + 3] = 255;
      }
      dg.putImageData(img, 0, 0);
      const bc = document.createElement('canvas');
      bc.width = mw; bc.height = mh;
      const bg2 = bc.getContext('2d');
      bg2.filter = 'blur(' + (o.dir | 0) + 'px)';
      bg2.drawImage(dc, 0, 0);
      const pd = bg2.getImageData(0, 0, mw, mh).data;
      const dx = new Float32Array(mw * mh), dy = new Float32Array(mw * mh);
      for (let y = 1; y < mh - 1; y++) {
        for (let x = 1; x < mw - 1; x++) {
          const i = y * mw + x;
          const ax = pd[(i + 1) * 4 + 3] - pd[(i - 1) * 4 + 3];
          const ay = pd[(i + mw) * 4 + 3] - pd[(i - mw) * 4 + 3];
          const m = Math.sqrt(ax * ax + ay * ay);
          if (m > 1e-4) { dx[i] = -ax / m; dy[i] = -ay / m; }
        }
      }
      out.dx = dx; out.dy = dy;
    }
  }
  return out;
}

/* 双线性取样判据：掩码/距离场（返回 CSS 像素；框外返回 -1） */
function sampleField(g, arr, sx, sy) {
  const fx = (sx - g.mox) * MS - 0.5, fy = (sy - g.moy) * MS - 0.5;
  if (!arr || fx < 0 || fy < 0 || fx > g.mw - 1.001 || fy > g.mh - 1.001) return -1;
  const i0 = fx | 0, j0 = fy | 0, tx = fx - i0, ty = fy - j0;
  const o = j0 * g.mw + i0, mw = g.mw;
  const a = arr[o], b = arr[o + 1], c = arr[o + mw], d = arr[o + mw + 1];
  const t0 = a + (b - a) * tx, t1 = c + (d - c) * tx;
  return t0 + (t1 - t0) * ty;
}
function inkAt(g, sx, sy) {
  if (!g || !g.mask) return 0;
  const i = ((sy - g.moy) * MS) | 0, j = ((sx - g.mox) * MS) | 0;
  if (i < 0 || j < 0 || i >= g.mh || j >= g.mw) return 0;
  return g.mask[i * g.mw + j];
}

/* ══════════════════════════════ 时钟 / 状态 ══════════════════════════════ */
let lines = [];
let curIdx = -1, brewIdx = -1, lastT = -1;
let glyph = null, prep = null, prepIdx = -1;
let reveal = 0, needRebake = false, dirty = true;
let clockT = 0, clockAt = 0, playing = false;
let vT = 0, beat = 0, bass = 0;
let frames = 0, jsMs = 0, errMsg = '';
let readySent = false;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ① 空歌词 ② seek 重建 ③ 句首切换（显示与酝酿分离）
   —— 暂停时 vT 完全不推进：动画不许靠 performance.now() 偷跑 */
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1; prep = null; prepIdx = -1; glyph = null; reveal = 0;
    if (S.onSeek) S.onSeek();
    dirty = true;
  }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci; brewIdx = -1;
    glyph = ci >= 0 ? ((prep && prepIdx === ci) ? prep : safeBake(lines[ci].text)) : null;
    reveal = 0; prep = null; prepIdx = -1;
    if (S.onLine) S.onLine(ci, glyph);
    hint.style.opacity = ci >= 0 ? '0' : '1';
    dirty = true;
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(1.7, Math.max(0.55, gap * 0.62));
    if (T >= lines[nx].t - lead) { brewIdx = nx; prep = safeBake(lines[nx].text); prepIdx = nx; }
  }
}

function safeBake(text) {
  try { return S.bake ? S.bake(text) : null; }
  catch (e) { errMsg = 'bake: ' + (e && e.message ? e.message : e); try { console.error(errMsg); } catch (_) {} return null; }
}

/* ══════════════════════════════ 尺寸 ══════════════════════════════ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(2, window.innerWidth);
  H = Math.max(2, window.innerHeight);
  MN = Math.min(W, H);
  VX = W / 2;
  VY = H * CFG.vy;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S.onResize) S.onResize();
  needRebake = true;
  dirty = true;
}

let rzTimer = 0;
addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(resize, 140);
});

function rebakeNow() {
  needRebake = false;
  prep = null; prepIdx = -1;
  if (curIdx >= 0 && lines[curIdx]) {
    glyph = safeBake(lines[curIdx].text);
    reveal = 1;
    if (S.onLine) S.onLine(curIdx, glyph);
  } else {
    glyph = null;
    if (S.onEmpty) S.onEmpty();
  }
  dirty = true;
}

/* ══════════════════════════════ 主循环 ══════════════════════════════ */
let last = performance.now(), raf = 0;

function frame(ms) {
  const js0 = performance.now();
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
  last = ms;
  frames++;
  if (playing) {
    vT += dt;
    beat *= Math.exp(-dt * 3.0);
    bass *= Math.exp(-dt * 2.0);
    if (reveal < 1) reveal = Math.min(1, reveal + dt / 0.45);
    if (S.step) { try { S.step(dt); } catch (e) { errMsg = 'step: ' + (e && e.message ? e.message : e); try { console.error(errMsg); } catch (_) {} } }
  }
  try { timing(now()); } catch (e) { errMsg = 'timing: ' + (e && e.message ? e.message : e); try { console.error(errMsg); } catch (_) {} }
  if (needRebake) rebakeNow();
  /* 暂停时不重画：像素逐字节不变（冻结纪律的最硬保证） */
  if (playing || dirty) {
    try { if (S.draw) S.draw(dt); } catch (e) { errMsg = 'draw: ' + (e && e.message ? e.message : e); try { console.error(errMsg); } catch (_) {} }
    dirty = false;
  }
  if (!readySent) {
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
  }
  jsMs = performance.now() - js0;
  raf = requestAnimationFrame(frame);
}

/* ══════════════════════════════ 协议 ══════════════════════════════ */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1;
    prep = null; prepIdx = -1; glyph = null; reveal = 0;
    vT = 0; beat = 0; bass = 0;
    clockT = 0; clockAt = performance.now();
    if (p.accent && p.accent.length >= 3) ACC = [p.accent[0] | 0, p.accent[1] | 0, p.accent[2] | 0];
    if (S.reset) S.reset();
    if (S.onAccent) S.onAccent();
    if (!lines.length) { if (S.onEmpty) S.onEmpty(); }
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.45';
    dirty = true;
  } else if (d.type === 'tick') {
    clockT = d.payload.time;
    clockAt = performance.now();
    playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    beat = Math.min(1.0, beat + 0.30 + (d.payload.level || 0) * 0.5);
  } else if (d.type === 'live') {
    const lv = d.payload || {};
    if (typeof lv.bass === 'number') bass = Math.max(bass, Math.min(1, lv.bass));
    if (typeof lv.level === 'number') beat = Math.max(beat, Math.min(0.8, lv.level * 0.8));
  }
});
addEventListener('pagehide', () => { cancelAnimationFrame(raf); });

/* ══════════════════════════════ 自查钩子 ══════════════════════════════ */
window.__stage = () => {
  const st = {
    lines: lines.length,
    idx: curIdx,
    t: +now().toFixed(2),
    playing: playing,
    frames: frames,
    js: +jsMs.toFixed(2),
    err: errMsg,
    text: (curIdx >= 0 && lines[curIdx]) ? lines[curIdx].text : '',
    glyph: !!glyph,
    rm: RM,
    vT: +vT.toFixed(2)
  };
  if (S.extra) { try { S.extra(st); } catch (_) {} }
  return st;
};

/* ══════════════════════════════ 启动 ══════════════════════════════ */
function boot() {
  hint.textContent = '等待第一句…';
  if (S.onAccent) S.onAccent();
  resize();
  if (S.reset) S.reset();
  raf = requestAnimationFrame(frame);
}

/*!
title: 体积光线步进
机制一句话：屏幕每个像素都从一台**真的在绕飞的透视相机**里发出一条视线，在"当前句墨迹的挤出体"
的**有符号距离场**里做球步进（SDF = max(二维带符号距离, |z| − 厚度)），求到第一个交点：
交在正面就按法线打光，交在侧壁就露出笔画的**厚度**，掠角处起一道菲涅尔边光；
没打中的视线用"离表面最近的距离"回一份很淡的体积光晕。—— 字是一个在暗场里缓慢转身的物件，
而不是一张贴在屏幕上的图。

实现要点：
  · 预烘一次：笔迹掩码 → 外距离场 + 笔画内距离场，合成一张**带符号距离表**（CSS 像素）。
  · 步进只在"厚度板"那一段里进行（解析算出进/出板面），所以平均 2~6 步就收敛；
    渲染在 0.19 倍分辨率（≈36k 像素）的 ImageData 上做，再上采样，帧预算 2~3ms。
  · 相机偏航 ±15°、俯仰缓慢呼吸；光随相机走，所以侧壁的明暗一直在变。
  · 暂停即冻结；RM 时相机停摆（只留极慢的呼吸），步进分辨率减半。
*/

const RMA = { BW: 0, BH: 0, rc: null, rctx: null, img: null, sd: null, cap: 60 };
let rmaBg = null, rmaVig = null;
let rmaIce = [226, 238, 255];

CFG.maxW = 0.72; CFG.maxH = 0.52;

S.onAccent = function () {
  const r = ACC[0] | 0, g = ACC[1] | 0, b = ACC[2] | 0;
  rmaIce = [Math.min(255, Math.round(r * 0.34 + 168)), Math.min(255, Math.round(g * 0.36 + 172)), Math.min(255, Math.round(b * 0.30 + 182))];
  rmaBg = ctx.createLinearGradient(0, 0, W * 0.3, H);
  rmaBg.addColorStop(0, 'rgb(4,5,10)');
  rmaBg.addColorStop(0.6, 'rgb(6,8,15)');
  rmaBg.addColorStop(1, 'rgb(9,10,16)');
  rmaVig = ctx.createRadialGradient(VX, VY, Math.min(W, H) * 0.28, VX, VY, Math.min(W, H) * 1.05);
  rmaVig.addColorStop(0, 'rgba(0,0,0,0)');
  rmaVig.addColorStop(1, 'rgba(1,2,5,0.82)');
};

S.onResize = function () {
  S.onAccent();
  const sc = RM ? 0.17 : 0.24;
  RMA.BW = Math.max(64, Math.round(W * sc));
  RMA.BH = Math.max(40, Math.round(RMA.BW * H / W));
  RMA.rc = document.createElement('canvas');
  RMA.rc.width = RMA.BW;
  RMA.rc.height = RMA.BH;
  RMA.rctx = RMA.rc.getContext('2d');
  RMA.img = RMA.rctx.createImageData(RMA.BW, RMA.BH);
};

/* ── 预烘：把 mask / 外距离 / 内距离合成一张带符号距离表（CSS 像素） ── */
S.bake = function (text) {
  const g = bake(text, { padR: 0.20, padPx: 12, mask: true, field: true, inner: true, cap: 88, capInner: 30 });
  if (!g || !g.mask || !g.df || !g.dfi) return g;
  const n = g.mw * g.mh;
  const sd = new Float32Array(n);
  for (let i = 0; i < n; i++) sd[i] = (g.mask[i] ? -g.dfi[i] : g.df[i]) / MS;
  g.sd = sd;
  RMA.sd = sd;
  return g;
};

/* 双线性取带符号距离（CSS 像素；框外返回大正数） */
function rmaSD(x, y) {
  const g = glyph;
  if (!g || !g.sd) return 80;
  const fx = (x - g.mox) * MS - 0.5, fy = (y - g.moy) * MS - 0.5;
  if (!(fx >= 0 && fy >= 0 && fx <= g.mw - 1.001 && fy <= g.mh - 1.001)) return 80;
  const i0 = fx | 0, j0 = fy | 0, tx = fx - i0, ty = fy - j0;
  const a = g.sd, o = j0 * g.mw + i0, mw = g.mw;
  const t0 = a[o] + (a[o + 1] - a[o]) * tx;
  const t1 = a[o + mw] + (a[o + mw + 1] - a[o + mw]) * tx;
  return t0 + (t1 - t0) * ty;
}

S.reset = function () { };

S.draw = function () {
  const g = glyph;
  const bw = RMA.BW, bh = RMA.BH;
  const r = rmaIce[0], gg = rmaIce[1], bb = rmaIce[2];

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = rmaBg;
  ctx.fillRect(0, 0, W, H);

  /* 远处一团极暗的背光，让暗场有"深度"而不是纯黑 */
  const halo = ctx.createRadialGradient(VX, VY, 0, VX, VY, Math.min(W, H) * 0.72);
  halo.addColorStop(0, 'rgba(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ',0.055)');
  halo.addColorStop(1, 'rgba(' + ACC[0] + ',' + ACC[1] + ',' + ACC[2] + ',0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  if (!g || !g.sd || !RMA.rc) {
    drawRMAEmpty();
    ctx.fillStyle = rmaVig;
    ctx.fillRect(0, 0, W, H);
    return;
  }

  /* ── 相机：绕字转，距离足够远所以透视温和、字不会被拉歪 ── */
  const R = Math.max(W, H) * 0.70;
  const amp = RM ? 0.22 : 1;
  const yaw = 0.30 * amp * Math.sin(vT * 0.21);
  const pitch = 0.10 + 0.055 * amp * Math.sin(vT * 0.17 + 1.1);
  const cx0 = g.gx + g.bw * 0.5, cy0 = g.gy + g.bh * 0.5;
  const camX = cx0 + R * Math.sin(yaw) * Math.cos(pitch);
  const camY = cy0 + R * Math.sin(pitch);
  const camZ = R * Math.cos(yaw) * Math.cos(pitch);
  /* 前向 / 右 / 上（世界 up = (0,-1,0)，即屏幕向上） */
  let fx2 = cx0 - camX, fy2 = cy0 - camY, fz2 = -camZ;
  const fl = Math.sqrt(fx2 * fx2 + fy2 * fy2 + fz2 * fz2) || 1;
  fx2 /= fl; fy2 /= fl; fz2 /= fl;
  let rx2 = -fz2, ry2 = 0, rz2 = fx2;            /* right = up × forward（世界 up=(0,-1,0)） */
  const rl = Math.sqrt(rx2 * rx2 + rz2 * rz2) || 1;
  rx2 /= rl; ry2 /= rl; rz2 /= rl;
  const ux = ry2 * fz2 - rz2 * fy2;              /* up' = right × forward */
  const uy = rz2 * fx2 - rx2 * fz2;
  const uz = rx2 * fy2 - ry2 * fx2;

  const focal = R;
  const T = Math.max(26, Math.min(58, Math.min(g.bw, g.bh) * 0.135));  /* 挤出厚度（CSS px） */
  const lightX = -0.46, lightY = -0.68, lightZ = 0.57;   /* 光从左上前方来 */
  const data = RMA.img.data;
  const sx = W / bw, sy = H / bh;

  /* 浮尘：真的给出三维位置，按相机基投影 —— 相机一转，前后层就错开 */
  const dust = function (frontOnly) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgb(' + r + ',' + gg + ',' + bb + ')';
    for (let i = 0; i < 96; i++) {
      const s1 = (i * 7919 % 997) / 997;
      const s2 = (i * 40503 % 991) / 991;
      const s3 = (i * 1299721 % 983) / 983;
      const mz = -320 + s3 * 520;
      if (frontOnly ? mz < 0 : mz >= 0) continue;
      const mx = cx0 + (s1 - 0.5) * W * 1.6 + Math.sin(vT * 0.13 + i) * 16;
      const my = cy0 + (s2 - 0.5) * H * 1.4 + Math.cos(vT * 0.11 + i * 1.7) * 13;
      const qx = mx - camX, qy = my - camY, qz = mz - camZ;
      const zc = qx * fx2 + qy * fy2 + qz * fz2;
      if (zc < 120) continue;
      const xs = (qx * rx2 + qy * ry2 + qz * rz2) / zc * focal + VX;
      const ys = (qx * ux + qy * uy + qz * uz) / zc * focal + VY;
      if (xs < -10 || xs > W + 10 || ys < -10 || ys > H + 10) continue;
      const near = (R - zc) / 320;
      const sz = 1.1 + Math.max(0, near) * 2.6;
      ctx.globalAlpha = 0.10 + 0.34 * Math.min(1, Math.max(0, near));
      ctx.fillRect(xs, ys, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  };
  dust(false);

  /* 背景色（写进缓冲的空像素留给主画布） */
  for (let i = 3, n = data.length; i < n; i += 4) data[i] = 0;

  let hits = 0;
  for (let py = 0; py < bh; py++) {
    const vy = ((py + 0.5) * sy - VY) / focal;
    for (let px = 0; px < bw; px++) {
      const vx = ((px + 0.5) * sx - VX) / focal;
      let dx = fx2 + rx2 * vx + ux * vy;
      let dy = fy2 + ry2 * vx + uy * vy;
      let dz = fz2 + rz2 * vx + uz * vy;
      const dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      dx /= dl; dy /= dl; dz /= dl;
      if (dz > -0.55) continue;                 /* 掠射：这一像素跳过，避免除零 */
      /* 解析求出"厚度板"那一段 t 区间，只在板里步进 */
      const tA = (camZ - T) / (-dz);
      const tB = (camZ + T) / (-dz);
      let t = tA > 0 ? tA : 0;
      const tEnd = tB;
      let hit = -1, minD = 1e9;
      for (let s = 0; s < 26; s++) {
        const x = camX + dx * t, y = camY + dy * t, z = camZ + dz * t;
        const d2 = rmaSD(x, y);
        const d3 = Math.abs(z) - T;
        const d = d2 > d3 ? d2 : d3;
        if (d < minD) minD = d;
        if (d < 0.9) { hit = t; break; }
        t += (d > 1.2 ? d * 0.92 : 1.2);
        if (t > tEnd) break;
      }
      const o = (py * bw + px) * 4;
      if (hit < 0) {
        if (minD < 26) {
          const gl = (1 - minD / 26);
          const a2 = gl * gl * 0.30;
          data[o] = r * 0.55; data[o + 1] = gg * 0.55; data[o + 2] = bb * 0.60;
          data[o + 3] = a2 * 255;
        }
        continue;
      }
      hits++;
      const hx = camX + dx * hit, hy = camY + dy * hit, hz = camZ + dz * hit;
      /* 法线：靠板面 → (0,0,±1)；靠侧壁 → 二维距离场梯度 */
      const zAbs = Math.abs(hz);
      const isSide = zAbs <= T - 1.6;
      const e = 2.4;
      const gx = rmaSD(hx + e, hy) - rmaSD(hx - e, hy);
      const gy = rmaSD(hx, hy + e) - rmaSD(hx, hy - e);
      let nx, ny, nz;
      if (!isSide) {
        const w = 0.18;
        const ax2 = -gx, ay2 = -gy;
        const al = Math.sqrt(ax2 * ax2 + ay2 * ay2) || 1;
        nx = ax2 / al * w; ny = ay2 / al * w; nz = (hz > 0 ? 1 : -1) * (1 - w);
      } else {
        const al = Math.sqrt(gx * gx + gy * gy) || 1;
        nx = -gx / al; ny = -gy / al; nz = 0;
      }
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;
      let dif = nx * lightX + ny * lightY + nz * lightZ;
      if (dif < 0) dif = 0;
      /* 视线与法线的夹角 → 菲涅尔边光 */
      const dotv = -(nx * dx + ny * dy + nz * dz);
      let fres = 1 - (dotv > 0 ? dotv : 0);
      fres = fres * fres * fres;
      /* 正面比背面亮（背面半透） */
      const back = hz < 0 ? 0.45 : 1;
      const dd = Math.abs(hit - R) / (R * 0.42);
      const fog = 1 - 0.55 * (dd > 1 ? 1 : dd);
      const base = (0.16 + 0.88 * dif) * back * (isSide ? 0.52 : 1);
      const spec = dif > 0.5 ? (dif - 0.5) * 0.9 : 0;
      const wall = isSide ? 0.34 : 0;
      let cr = r * base + ACC[0] * (fres * 0.55 + wall) + r * spec * 0.9;
      let cg = gg * base + ACC[1] * (fres * 0.55 + wall) + gg * spec * 0.9;
      let cb = bb * base + ACC[2] * (fres * 0.55 + wall) + bb * spec * 0.9;
      cr *= fog; cg *= fog; cb *= fog;
      data[o] = cr > 255 ? 255 : cr;
      data[o + 1] = cg > 255 ? 255 : cg;
      data[o + 2] = cb > 255 ? 255 : cb;
      data[o + 3] = 255;
    }
  }
  RMA.rctx.putImageData(RMA.img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.55 + 0.45 * reveal;
  ctx.drawImage(RMA.rc, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  dust(true);
  if (!hits) drawRMAEmpty();

  ctx.fillStyle = rmaVig;
  ctx.fillRect(0, 0, W, H);
};

/* 空歌词：一块在透视里缓缓转动的空板 + 一道扫光，什么都没有但空间还在 */
function drawRMAEmpty() {
  const r = rmaIce[0], gg = rmaIce[1], bb = rmaIce[2];
  const t = vT * 0.18;
  const pw = Math.min(W, H) * 0.46, ph = pw * 0.42;
  const sk = Math.sin(t) * 0.28;
  const cxp = VX, cyp = VY;
  ctx.strokeStyle = 'rgba(' + r + ',' + gg + ',' + bb + ',0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cxp - pw / 2, cyp - ph / 2 + sk * ph * 0.5);
  ctx.lineTo(cxp + pw / 2, cyp - ph / 2 - sk * ph * 0.5);
  ctx.lineTo(cxp + pw / 2, cyp + ph / 2 - sk * ph * 0.5);
  ctx.lineTo(cxp - pw / 2, cyp + ph / 2 + sk * ph * 0.5);
  ctx.closePath();
  ctx.stroke();
  for (let i = 1; i < 6; i++) {
    const f = i / 6;
    ctx.globalAlpha = 0.30;
    ctx.beginPath();
    ctx.moveTo(cxp - pw / 2 + pw * f, cyp - ph / 2 + sk * ph * (0.5 - f));
    ctx.lineTo(cxp - pw / 2 + pw * f, cyp + ph / 2 + sk * ph * (0.5 - f) - sk * ph * 0.5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const lg = ctx.createLinearGradient(cxp - pw / 2, 0, cxp + pw / 2, 0);
  lg.addColorStop(0, 'rgba(' + r + ',' + gg + ',' + bb + ',0)');
  lg.addColorStop(0.5, 'rgba(' + r + ',' + gg + ',' + bb + ',0.10)');
  lg.addColorStop(1, 'rgba(' + r + ',' + gg + ',' + bb + ',0)');
  ctx.fillStyle = lg;
  ctx.fillRect(cxp - pw / 2, cyp - ph / 2, pw, ph);
}

S.extra = function (o) {
  o.res = RMA.BW + 'x' + RMA.BH;
};

boot();
</script>
