<!-- 646 / S07B —— 后台飞塔：每一句歌词都是吊在钢杆上的布景片，镜头在吊杆与绳索之间穿行。 -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>646 · 飞塔</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#050506;overflow:hidden}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* 646 / S07B —— 后台飞塔：每一句歌词都是吊在钢杆上的布景片，镜头在吊杆与绳索之间穿行。 */
(function () {
  "use strict";

  /* ============ 0. 状态 / __stage ============ */
  var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
  var RM = false;
  try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}
  var GL_OK = false;

  window.__stage = function () {
    var i = S.idx, L = S.lines, tx = "";
    if (i >= 0 && L[i] && L[i].text != null) tx = String(L[i].text);
    return {
      lines: L.length, idx: i, t: S.t, playing: !!S.playing,
      frames: S.frames, js: Math.round(S.js * 100) / 100, err: S.err,
      text: tx, gl: GL_OK, rm: RM
    };
  };

  var lastErrAt = 0;
  function logErr(e) {
    try { S.err = String((e && e.message) || e); } catch (_) { S.err = "error"; }
    var n = (window.performance && performance.now()) || Date.now();
    if (n - lastErrAt > 1000) { lastErrAt = n; try { console.error(e); } catch (_) {} }
  }

  /* ============ 1. ready：首帧 rAF 无条件，只一次 ============ */
  var readySent = false;
  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: "ready" }, "*"); } catch (e) { logErr(e); }
  }
  var booted = false;
  function start() { if (booted) return; booted = true; setTimeout(boot, 0); }
  requestAnimationFrame(function () { sendReady(); start(); });
  setTimeout(function () { sendReady(); start(); }, 800);

  /* ============ 2. 工具 ============ */
  var FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif';
  var FOV = 46, TAN = Math.tan(FOV * Math.PI / 360);
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoothstep(a, b, x) { var t = clamp((x - a) / ((b - a) || 1e-6), 0, 1); return t * t * (3 - 2 * t); }
  function damp(c, t, k, dt) { return c + (t - c) * (1 - Math.exp(-k * dt)); }
  function mulberry(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normAccent(a) {
    if (!Array.isArray(a) || a.length < 3) return [214, 168, 104];
    var r = Number(a[0]), g = Number(a[1]), b = Number(a[2]);
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return [214, 168, 104];
    r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
    if (r + g + b < 40) return [214, 168, 104];
    return [r, g, b];
  }
  var ACC = [214, 168, 104];
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  /* ============ 3. 画布 ============ */
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d", { alpha: false });
  var W = 1440, H = 900, DPR = 1;
  var TW = 1024, TH = 352;
  var noiseCv = null, noisePat = null;
  var bgCv = null;

  function makeNoise() {
    var c = document.createElement("canvas"); c.width = 128; c.height = 128;
    var g = c.getContext("2d"), img = g.createImageData(128, 128), r = mulberry(646), i;
    for (i = 0; i < img.data.length; i += 4) {
      var v = 110 + r() * 90;
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  function makeBG() {
    var c = document.createElement("canvas"); c.width = TW; c.height = TH;
    var g = c.getContext("2d"), r = mulberry(6460);
    var grd = g.createLinearGradient(0, 0, 0, TH);
    grd.addColorStop(0, "#26251f");
    grd.addColorStop(0.55, "#1c1b17");
    grd.addColorStop(1, "#131210");
    g.fillStyle = grd; g.fillRect(0, 0, TW, TH);
    /* 布景片横向木撑 + 刷痕 */
    var i;
    for (i = 0; i < 26; i++) {
      g.globalAlpha = 0.05 + r() * 0.07;
      g.strokeStyle = r() > 0.5 ? "#efe9d8" : "#000000";
      g.lineWidth = 1 + r() * 4;
      g.beginPath();
      var y = r() * TH;
      g.moveTo(0, y);
      g.bezierCurveTo(TW * 0.3, y + (r() - 0.5) * 14, TW * 0.7, y + (r() - 0.5) * 14, TW, y + (r() - 0.5) * 8);
      g.stroke();
    }
    g.globalAlpha = 0.5;
    g.strokeStyle = "#0a0908"; g.lineWidth = 12;
    g.strokeRect(6, 6, TW - 12, TH - 12);
    g.globalAlpha = 1;
    if (noisePat) { g.globalAlpha = 0.13; g.fillStyle = noisePat; g.fillRect(0, 0, TW, TH); g.globalAlpha = 1; }
    return c;
  }

  function resize() {
    W = Math.max(320, window.innerWidth || 1440);
    H = Math.max(240, window.innerHeight || 900);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgCv = makeBG();
  }
  window.addEventListener("resize", function () { try { resize(); } catch (e) { logErr(e); } });

  /* ============ 4. 歌词数据 ============ */
  function charTimes(line) {
    var chars = Array.from(line.text || ""), n = chars.length, out = new Array(n);
    var cs = line.chars, i, j, rec, ct;
    if (cs && cs.length) {
      var rel = cs[0] && isFinite(cs[0].t) && cs[0].t < line.t - 0.08;
      for (i = 0; i < n; i++) {
        j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
        rec = cs[j]; ct = rec && rec.t;
        out[i] = isFinite(ct) ? (rel ? line.t + ct : ct) : null;
      }
      return out;
    }
    var d = line.dur > 0 ? line.dur : 3.4;
    for (i = 0; i < n; i++) out[i] = line.t + d * 0.88 * i / Math.max(1, n);
    return out;
  }

  function buildLines(raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      if (!l || typeof l !== "object") continue;
      var text = (l.text == null) ? "" : String(l.text);
      if (!text.trim()) continue;
      var t = Number(l.t); if (!isFinite(t) || t < 0) t = 0;
      var dur = Number(l.dur); if (!isFinite(dur) || dur < 0) dur = 0;
      var line = { t: t, dur: dur, text: text, chars: (Array.isArray(l.chars) && l.chars.length) ? l.chars : null };
      line.times = charTimes(line);
      line.lay = null;
      out.push(line);
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function idxAt(t) {
    var a = S.lines, lo = 0, hi = a.length - 1, best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (a[m].t <= t + 0.02) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best;
  }

  /* ============ 5. 排版（布景片纹理空间） ============ */
  var measureCv = document.createElement("canvas");
  var mc = measureCv.getContext("2d");

  function toUnits(text) {
    var arr = Array.from(text || ""), out = [], i = 0;
    while (i < arr.length) {
      var ch = arr[i];
      if (/\s/.test(ch)) { out.push({ s: " ", sp: true, ci: i }); i++; continue; }
      if (/[A-Za-z0-9'’\-–—_.]/.test(ch)) {
        var j = i, s = "";
        while (j < arr.length && /[A-Za-z0-9'’\-–—_.]/.test(arr[j])) { s += arr[j]; j++; }
        out.push({ s: s, sp: false, ci: i }); i = j; continue;
      }
      out.push({ s: ch, sp: false, ci: i }); i++;
    }
    return out;
  }

  function layout(line) {
    var units = toUnits(line.text), MAXW = 836;
    mc.font = "800 100px " + FONT;
    var i, u;
    for (i = 0; i < units.length; i++) { u = units[i]; u.w = mc.measureText(u.s).width; }
    var maxRows = (W / H < 0.9) ? 3 : 2;
    var rows = [], cur = [], cw = 0;
    for (i = 0; i < units.length; i++) {
      u = units[i];
      if (u.sp && cur.length === 0) continue;
      if (!u.sp && cur.length && cw + u.w > MAXW) { rows.push(cur); cur = []; cw = 0; }
      cur.push(u); cw += u.w;
    }
    if (cur.length) rows.push(cur);
    if (rows.length > maxRows) {
      /* 超行则缩排重来 */
      var shrink = rows.length / maxRows;
      units.forEach(function (x) { x.w /= shrink; });
      rows = []; cur = []; cw = 0;
      for (i = 0; i < units.length; i++) {
        u = units[i];
        if (u.sp && cur.length === 0) continue;
        if (!u.sp && cur.length && cw + u.w > MAXW) { rows.push(cur); cur = []; cw = 0; }
        cur.push(u); cw += u.w;
      }
      if (cur.length) rows.push(cur);
    }
    var widest = 0;
    rows.forEach(function (row) {
      var w = 0;
      row.forEach(function (x) { w += x.w; });
      if (w > widest) widest = w;
    });
    var fs = clamp(844 * 100 / Math.max(60, widest), 40, 132);
    return { rows: rows, fs: fs };
  }

  /* ============ 6. 布景片纹理 ============ */
  var POOL = [], poolReady = false;
  function ensurePool() {
    if (poolReady) return;
    poolReady = true;
    for (var i = 0; i < 4; i++) {
      var c = document.createElement("canvas"); c.width = TW; c.height = TH;
      POOL.push({ c: c, g: c.getContext("2d") });
    }
  }

  function paintFlat(slot, line, now, active) {
    ensurePool();
    var s = POOL[slot % 4], g = s.g;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, TW, TH);
    if (bgCv) g.drawImage(bgCv, 0, 0);
    if (line.lay) {
      var lay = line.lay, fs = lay.fs, lh = fs * 1.16;
      var total = lay.rows.length * lh, y0 = TH * 0.5 - total * 0.5 + lh * 0.5;
      g.textAlign = "left"; g.textBaseline = "middle";
      g.font = "800 " + fs + "px " + FONT;
      var reveal = 0;
      for (var ri = 0; ri < lay.rows.length; ri++) {
        var row = lay.rows[ri], rw = 0, ui, k;
        for (k = 0; k < row.length; k++) rw += row[k].w;
        rw = rw * fs / 100;
        var x = (TW - rw) * 0.5, y = y0 + ri * lh;
        for (k = 0; k < row.length; k++) {
          var u = row[k];
          if (u.sp) { x += u.w * fs / 100; continue; }
          var chars = Array.from(u.s), ci = u.ci;
          for (var q = 0; q < chars.length; q++) {
            var ch = chars[q], cw = g.measureText(ch).width;
            var ct = (line.times[ci] != null) ? line.times[ci] : line.t;
            var a = active ? smoothstep(ct - 0.03, ct + 0.30, now) : 0.34;
            if (a > 0.004) {
              if (a > reveal) reveal = a;
              g.globalAlpha = a * (active ? 1 : 0.8);
              g.fillStyle = "#f3e9d6";
              g.fillText(ch, x, y + (1 - a) * 9);
            }
            x += cw; ci++;
          }
        }
      }
      /* 左侧场次标线 */
      var top = y0 - lh * 0.5;
      g.globalAlpha = 0.85;
      g.fillStyle = rgba(ACC, 0.9);
      var barH = total * Math.max(0.06, reveal);
      if (RM) barH = total;
      g.fillRect(46, top, 5, barH);
      g.globalAlpha = 0.6;
      g.font = "600 22px " + FONT;
      g.fillStyle = rgba(ACC, 0.85);
      g.textAlign = "left"; g.textBaseline = "alphabetic";
      var sc = "SC." + String((line.scene || 1)).padStart(2, "0");
      g.fillText(sc, 68, TH - 34);
    }
    g.globalAlpha = 1;
  }

  /* ============ 7. 三维投影 ============ */
  var cam = {
    eye: { x: 0, y: 0.5, z: -4 }, tgt: { x: 0, y: 0.3, z: 4 },
    eyeS: { x: 0, y: 0.5, z: -4 }, tgtS: { x: 0, y: 0.3, z: 4 },
    F: { x: 0, y: 0, z: 1 }, Rt: { x: 1, y: 0, z: 0 }, U: { x: 0, y: 1, z: 0 },
    roll: 0, f: 600, snap: true
  };
  var prevNow = -1;

  function lookBasis() {
    var e = cam.eyeS, t = cam.tgtS;
    var fx = t.x - e.x, fy = t.y - e.y, fz = t.z - e.z;
    var fl = Math.sqrt(fx * fx + fy * fy + fz * fz) || 1;
    fx /= fl; fy /= fl; fz /= fl;
    var sx = fz, sy = 0, sz = -fx;          /* F × up */
    var sl = Math.sqrt(sx * sx + sz * sz);
    if (sl < 1e-5) { sx = 1; sy = 0; sz = 0; sl = 1; }
    sx /= sl; sz /= sl;
    var ux = sy * fz - sz * fy, uy = sz * fx - sx * fz, uz = sx * fy - sy * fx;
    cam.F.x = fx; cam.F.y = fy; cam.F.z = fz;
    cam.Rt.x = sx; cam.Rt.y = sy; cam.Rt.z = sz;
    cam.U.x = ux; cam.U.y = uy; cam.U.z = uz;
    cam.f = (H * 0.5) / TAN;
  }

  function proj(p) {
    var dx = p.x - cam.eyeS.x, dy = p.y - cam.eyeS.y, dz = p.z - cam.eyeS.z;
    var zr = dx * cam.F.x + dy * cam.F.y + dz * cam.F.z;
    if (zr < 0.12) return null;
    var xr = dx * cam.Rt.x + dy * cam.Rt.y + dz * cam.Rt.z;
    var yr = dx * cam.U.x + dy * cam.U.y + dz * cam.U.z;
    var cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
    var x2 = xr * cr - yr * sr, y2 = xr * sr + yr * cr;
    var k = cam.f / zr;
    return { x: W * 0.5 + x2 * k, y: H * 0.5 - y2 * k, z: zr, k: k };
  }

  /* ============ 8. 场景布局 ============ */
  function flatCenter(i) {
    var xs = [-1.7, 1.5, -0.8, 2.0];
    return {
      x: xs[i & 3] + Math.sin(i * 1.7) * 0.45,
      y: 0.15 + ((i % 3) - 1) * 0.28,
      z: 7.4 + i * 5.6
    };
  }
  function flatAngle(i) { return (i & 1 ? 1 : -1) * 0.14 + Math.sin(i * 0.9) * 0.05; }

  var FLOOR_Y = -3.1, TOP_Y = 4.9;
  function line3(a, b, color, w, alpha) {
    var p = proj(a), q = proj(b);
    if (!p || !q) return;
    if (!isFinite(p.x) || !isFinite(q.x)) return;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }

  /* 镜头配方 */
  function shotFor(i, p, e) {
    var f = flatCenter(i), t = i % 4;
    if (t === 0) {           /* space-camera-moves：推镜穿过吊杆 */
      return {
        eye: { x: f.x * 0.22 + 0.35, y: 0.55 + 0.28 * (1 - e), z: f.z - 8.6 + e * 4.6 },
        tgt: { x: f.x, y: f.y + 0.04, z: f.z }, roll: 0
      };
    }
    if (t === 1) {           /* graze-face-tour：贴着布景片横扫 */
      var s = (e - 0.5) * 5.9;
      return {
        eye: { x: f.x + s, y: f.y + 0.18, z: f.z - 4.5 },
        tgt: { x: f.x + s * 0.52, y: f.y + 0.02, z: f.z }, roll: 0.035 * (1 - e)
      };
    }
    if (t === 2) {           /* panel-grid-moves：吊杆排下的升降 */
      return {
        eye: { x: f.x - 2.7, y: FLOOR_Y + 0.5 + e * 5.3, z: f.z - 5.3 },
        tgt: { x: f.x, y: f.y - 0.55 + e * 1.15, z: f.z }, roll: 0
      };
    }
    /* spotlight-hero-card：侧后方的追光硬照 */
    return {
      eye: { x: f.x + 2.5 - e * 0.55, y: f.y + 1.05, z: f.z - 4.8 + e * 0.9 },
      tgt: { x: f.x, y: f.y + 0.04, z: f.z }, roll: -0.025
    };
  }

  function targetFor(i, now) {
    if (S.lines.length === 0 || i < 0) {
      return {
        eye: { x: 0.4, y: 0.55, z: -1.2 + now * 0.16 },
        tgt: { x: 0, y: 0.5, z: 10 }, roll: 0
      };
    }
    var ln = S.lines[Math.min(i, S.lines.length - 1)];
    var p = clamp((now - ln.t) / Math.max(1.1, ln.dur), 0, 1);
    var e = p * p * (3 - 2 * p);
    var sh = shotFor(i, p, e);
    if (RM) {
      sh.eye.x *= 0.45; sh.eye.y = 0.5 + (sh.eye.y - 0.5) * 0.35; sh.roll *= 0.3;
    }
    /* 手持微噪 + 鼓点震动 */
    var wob = RM ? 0.006 : 0.026;
    sh.eye.x += Math.sin(now * 0.7 + i) * wob;
    sh.eye.y += Math.sin(now * 0.93 + i * 2.1) * wob * 0.7;
    var sb = beatAmp(now);
    if (sb > 0.001 && !RM) {
      sh.eye.x += Math.sin(now * 71.3) * sb * 0.09;
      sh.eye.y += Math.cos(now * 63.1) * sb * 0.07;
      sh.tgt.x += Math.sin(now * 41.7) * sb * 0.05;
    }
    return sh;
  }

  function updateCam(now, dt, snap) {
    var tg = targetFor(S.idx, now);
    if (snap) {
      cam.eyeS = tg.eye; cam.tgtS = tg.tgt; cam.roll = tg.roll;
    } else if (dt > 0.0005) {
      var k = RM ? 5.5 : 3.1;
      cam.eyeS.x = damp(cam.eyeS.x, tg.eye.x, k, dt);
      cam.eyeS.y = damp(cam.eyeS.y, tg.eye.y, k, dt);
      cam.eyeS.z = damp(cam.eyeS.z, tg.eye.z, k, dt);
      cam.tgtS.x = damp(cam.tgtS.x, tg.tgt.x, k * 1.25, dt);
      cam.tgtS.y = damp(cam.tgtS.y, tg.tgt.y, k * 1.25, dt);
      cam.tgtS.z = damp(cam.tgtS.z, tg.tgt.z, k * 1.25, dt);
      cam.roll = damp(cam.roll, tg.roll, 4, dt);
    }
    cam.eye = cam.eyeS; cam.tgt = cam.tgtS;
    lookBasis();
  }

  /* ============ 9. 灯光 / 鼓点 ============ */
  var beatT = -99, beatLevel = 0, liveLevel = 0, liveBass = 0;
  function beatAmp(now) { var d = now - beatT; return d < 0 ? 0 : Math.max(0, 1 - d / 0.42) * beatLevel; }

  /* ============ 10. 尘埃 ============ */
  var dust = [], dustMade = false;
  function makeDust() {
    if (dustMade) return;
    dustMade = true;
    var r = mulberry(64613);
    for (var i = 0; i < 150; i++) {
      dust.push({ x: (r() - 0.5) * 17, y: (r() - 0.5) * 10, z: (r() - 0.5) * 30, s: 0.3 + r() * 0.9, ph: r() * 6.28 });
    }
  }

  /* ============ 11. 主渲染 ============ */
  var frames = 0, lastFrameWall = 0, jsAvg = 16;

  function drawBackdrop(now) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#08090b");
    g.addColorStop(0.55, "#0b0c0e");
    g.addColorStop(1, "#050506");
    ctx.globalAlpha = 1;
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    /* 远处背幕 */
    var zBack = cam.eyeS.z + 34;
    var p1 = proj({ x: -22, y: FLOOR_Y, z: zBack }), p2 = proj({ x: 22, y: FLOOR_Y, z: zBack });
    var p3 = proj({ x: 22, y: 12, z: zBack }), p4 = proj({ x: -22, y: 12, z: zBack });
    if (p1 && p2 && p3 && p4) {
      ctx.globalAlpha = 0.9; ctx.fillStyle = "#0a0b0d";
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath(); ctx.fill();
    }

    /* 消失点雾气 */
    var vp = proj({ x: cam.eyeS.x + cam.F.x * 40, y: cam.eyeS.y + cam.F.y * 40, z: cam.eyeS.z + cam.F.z * 40 });
    if (vp) {
      var rg = ctx.createRadialGradient(vp.x, vp.y, 0, vp.x, vp.y, Math.max(W, H) * 0.55);
      rg.addColorStop(0, rgba(ACC, 0.10 + liveLevel * 0.05));
      rg.addColorStop(0.45, rgba(ACC, 0.035));
      rg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 1; ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawFloor() {
    var z0 = Math.floor(cam.eyeS.z) - 2, z1 = cam.eyeS.z + 36, i;
    for (i = z0; i <= z1; i += 1.6) {
      var p = proj({ x: -9.5, y: FLOOR_Y, z: i }), q = proj({ x: 9.5, y: FLOOR_Y, z: i });
      if (p && q) {
        var a = clamp(0.16 - (i - cam.eyeS.z) * 0.004, 0.015, 0.16);
        line3({ x: -9.5, y: FLOOR_Y, z: i }, { x: 9.5, y: FLOOR_Y, z: i }, "#9c9384", 1, a);
      }
    }
    for (i = -9; i <= 9; i += 1.8) {
      line3({ x: i, y: FLOOR_Y, z: cam.eyeS.z - 1 }, { x: i, y: FLOOR_Y, z: cam.eyeS.z + 34 }, "#8a8276", 1, 0.09);
    }
    /* 地脚安全条 */
    line3({ x: -9.5, y: FLOOR_Y + 0.02, z: cam.eyeS.z + 0.5 }, { x: 9.5, y: FLOOR_Y + 0.02, z: cam.eyeS.z + 0.5 }, rgba(ACC, 0.5), 2, 0.25);
  }

  function drawRig() {
    /* 吊杆 */
    var z, y = 5.0;
    for (z = Math.floor(cam.eyeS.z) - 2; z <= cam.eyeS.z + 36; z += 2.7) {
      var a = clamp(0.5 - (z - cam.eyeS.z) * 0.012, 0.05, 0.5);
      line3({ x: -8.4, y: y, z: z }, { x: 8.4, y: y, z: z }, "#57534a", 2.4, a);
      line3({ x: -8.4, y: y + 0.06, z: z }, { x: 8.4, y: y + 0.06, z: z }, "#8f887a", 0.8, a * 0.7);
      /* 吊点竖索 */
      line3({ x: -4.6, y: y, z: z }, { x: -4.6, y: y + 4.6, z: z }, "#3e3b35", 1, a * 0.5);
      line3({ x: 4.6, y: y, z: z }, { x: 4.6, y: y + 4.6, z: z }, "#3e3b35", 1, a * 0.5);
    }
    /* 侧幕绳 */
    for (z = Math.floor(cam.eyeS.z) - 1; z <= cam.eyeS.z + 30; z += 1.9) {
      var al = clamp(0.28 - (z - cam.eyeS.z) * 0.008, 0.02, 0.28);
      line3({ x: -5.8, y: 9.5, z: z }, { x: -5.8, y: FLOOR_Y, z: z }, "#6d675c", 1.2, al);
      line3({ x: 5.8, y: 9.5, z: z }, { x: 5.8, y: FLOOR_Y, z: z }, "#6d675c", 1.2, al);
    }
  }

  function quadPath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.lineTo(pts[3].x, pts[3].y);
    ctx.closePath();
  }

  function drawFlat(i, now, active, slot) {
    var f = flatCenter(i), ang = flatAngle(i);
    var rx = Math.cos(ang), rz = Math.sin(ang);
    var hw = 5.0, hh = 1.66;
    function P(su, sv) { return { x: f.x + rx * hw * su, y: f.y + hh * sv, z: f.z + rz * hw * su }; }
    var TL = proj(P(-1, 1)), TR = proj(P(1, 1)), BL = proj(P(-1, -1)), BR = proj(P(1, -1));
    if (!TL || !TR || !BL || !BR) return;
    var mx = Math.max(Math.abs(TL.x), Math.abs(TR.x), Math.abs(BL.x), Math.abs(BR.x), Math.abs(TL.y), Math.abs(TR.y), Math.abs(BL.y), Math.abs(BR.y));
    if (!isFinite(mx) || mx > 26000) return;

    var dist = Math.sqrt(Math.pow(f.x - cam.eyeS.x, 2) + Math.pow(f.y - cam.eyeS.y, 2) + Math.pow(f.z - cam.eyeS.z, 2));
    var fog = clamp(1 - (dist - 5) / 34, 0.16, 1);
    var bright = (active ? 1 : 0.24) * fog;

    /* 吊杆与吊索 */
    var bat = { x1: f.x - rx * 5.4, x2: f.x + rx * 5.4, z1: f.z - rz * 5.4, z2: f.z + rz * 5.4, y: f.y + hh + 0.16 };
    line3({ x: bat.x1, y: bat.y, z: bat.z1 }, { x: bat.x2, y: bat.y, z: bat.z2 }, "#4d4941", 3.2, 0.8 * fog);
    line3({ x: bat.x1, y: bat.y + 0.07, z: bat.z1 }, { x: bat.x2, y: bat.y + 0.07, z: bat.z2 }, "#9a9284", 1, 0.55 * fog);
    line3({ x: f.x - hw * 0.78, y: f.y + hh, z: f.z }, { x: f.x - hw * 0.78, y: f.y + hh + 0.16, z: f.z }, "#b9ae98", 1.4, 0.7 * fog);
    line3({ x: f.x + hw * 0.78, y: f.y + hh, z: f.z }, { x: f.x + hw * 0.78, y: f.y + hh + 0.16, z: f.z }, "#b9ae98", 1.4, 0.7 * fog);

    var line = S.lines[i];
    paintFlat(slot, line, now, active);

    ctx.save();
    ctx.globalAlpha = bright;
    var iw = TW, ih = TH;
    var m11 = (TR.x - TL.x) / iw, m12 = (TR.y - TL.y) / iw;
    var m21 = (BL.x - TL.x) / ih, m22 = (BL.y - TL.y) / ih;
    ctx.transform(m11, m12, m21, m22, TL.x, TL.y);
    ctx.drawImage(POOL[slot % 4].c, 0, 0);
    ctx.restore();

    /* 追光光斑 */
    if (active) {
      var cp = proj({ x: f.x, y: f.y, z: f.z });
      if (cp) {
        ctx.save();
        quadPath([TL, TR, BR, BL]);
        ctx.clip();
        var rad = Math.max(60, Math.abs(TR.x - TL.x) * 0.75);
        var rg = ctx.createRadialGradient(cp.x, cp.y, 0, cp.x, cp.y, rad);
        rg.addColorStop(0, "rgba(255,232,196," + (0.16 + beatAmp(now) * 0.06) + ")");
        rg.addColorStop(0.6, "rgba(255,226,186,0.05)");
        rg.addColorStop(1, "rgba(255,226,186,0)");
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }
  }

  function drawBeam(now) {
    if (S.lines.length === 0) return;
    if (S.idx < 0) return;
    var f = flatCenter(S.idx);
    var src = { x: f.x + 4.1, y: 6.6, z: f.z + 1.3 };
    var P = proj(src);
    if (!P) return;
    var pts = [], k, ok = true;
    for (k = 0; k <= 18; k++) {
      var a = k / 18 * Math.PI * 2;
      var q = proj({ x: f.x + Math.cos(a) * 3.0, y: f.y + Math.sin(a) * 1.55, z: f.z });
      if (!q) { ok = false; break; }
      pts.push(q);
    }
    if (!ok) return;
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.beginPath(); ctx.moveTo(P.x, P.y);
    for (k = 0; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
    ctx.closePath();
    var rg = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, Math.max(W, H) * 0.9);
    rg.addColorStop(0, "rgba(255,236,204," + (0.20 + beatAmp(now) * 0.10) + ")");
    rg.addColorStop(0.35, "rgba(255,226,188,0.055)");
    rg.addColorStop(1, "rgba(255,226,188,0)");
    ctx.fillStyle = rg;
    ctx.fill();
    ctx.restore();
  }

  function drawDust(now) {
    makeDust();
    var i, d;
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    for (i = 0; i < dust.length; i++) {
      d = dust[i];
      var p = proj({
        x: cam.eyeS.x + d.x + Math.sin(now * 0.22 + d.ph) * 0.25,
        y: cam.eyeS.y + d.y + Math.cos(now * 0.17 + d.ph) * 0.2,
        z: cam.eyeS.z + d.z
      });
      if (!p || p.z > 26) continue;
      var a = 0.05 + 0.16 * clamp(1 - p.z / 26, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#f6e6c8";
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.6, d.s * 26 / p.z), 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawForeground() {
    /* 近景吊绳：镜头确实在飞塔内部 */
    var zs = [cam.eyeS.z + 1.5, cam.eyeS.z + 3.2];
    var i;
    for (i = 0; i < zs.length; i++) {
      var z = zs[i];
      var x = (i === 0) ? -3.5 : 3.7;
      line3({ x: x, y: 8.5, z: z }, { x: x, y: FLOOR_Y, z: z }, "#7b7466", i === 0 ? 3.2 : 2.2, i === 0 ? 0.42 : 0.26);
      line3({ x: x + (i === 0 ? 8.2 : -7.8), y: 8.5, z: z }, { x: x + (i === 0 ? 8.2 : -7.8), y: FLOOR_Y, z: z }, "#5a544a", 1.4, 0.16);
    }
  }

  function drawGrain() {
    if (!noisePat) return;
    ctx.save();
    ctx.globalAlpha = 0.035;
    ctx.fillStyle = noisePat;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawVignette() {
    var rg = ctx.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.28, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    rg.addColorStop(0, "rgba(0,0,0,0)");
    rg.addColorStop(0.7, "rgba(0,0,0,0.36)");
    rg.addColorStop(1, "rgba(0,0,0,0.82)");
    ctx.globalAlpha = 1;
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }

  var frameAcc = 0;

  function render(now) {
    S.frames++;
    var dt = prevNow < 0 ? 0 : clamp(now - prevNow, 0, 0.12);
    prevNow = now;

    var idx = idxAt(now);
    if (idx !== S.idx) {
      S.idx = idx;
      /* 换句时轻推一下机位（配方里的切镜节奏） */
      cam.eyeS.y += RM ? 0 : 0.06;
    }
    S.t = now;

    updateCam(now, dt, wantSnap);
    wantSnap = false;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    drawBackdrop(now);
    drawFloor();
    drawRig();

    /* 布景片：由远及近，只画镜头前方附近的几张 */
    if (S.lines.length) {
      var list = [], j;
      for (j = Math.max(0, S.idx - 1); j <= Math.min(S.lines.length - 1, S.idx + 2); j++) {
        var fc = flatCenter(j);
        if (fc.z < cam.eyeS.z + 0.3) continue;
        list.push({ i: j, z: fc.z });
      }
      list.sort(function (a, b) { return b.z - a.z; });
      var slot = 0;
      for (j = 0; j < list.length; j++) {
        drawFlat(list[j].i, now, list[j].i === S.idx, slot++);
      }
    }

    drawBeam(now);
    drawDust(now);
    drawForeground();
    drawVignette();
    drawGrain();

    /* 没有歌词时：完全靠光与吊杆呼吸 */
    if (!S.lines.length) {
      var pulse = 0.06 + liveLevel * 0.10 + Math.max(0, Math.sin(now * 1.1)) * 0.02;
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      var rg = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.6);
      rg.addColorStop(0, rgba(ACC, pulse));
      rg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  /* ============ 12. 播放时钟 ============ */
  var clockBaseT = 0, clockBaseWall = 0, lastTickT = -1, tickOk = false, wantSnap = true;

  function resetAt(t) {
    beatT = -99; beatLevel = 0;
    wantSnap = true;
    prevNow = -1;
    S.idx = -1;
    S.t = t;
  }

  function onTick(d) {
    var tm = Number(d.time);
    if (!isFinite(tm)) return;
    var playing = !!d.playing;
    var wall = (window.performance && performance.now()) || Date.now();
    var advanced = !tickOk || tm > lastTickT + 1e-4;
    if (tickOk && Math.abs(tm - lastTickT) > 0.5) resetAt(tm);
    S.playing = playing;
    clockBaseT = tm;
    clockBaseWall = wall;
    lastTickT = tm;
    tickOk = true;
    S.running = playing && advanced;
    if (!S.running) S.t = tm;
  }

  function displayTime() {
    if (!tickOk) return 0;
    if (!S.running) return clockBaseT;
    var wall = (window.performance && performance.now()) || Date.now();
    var el = (wall - clockBaseWall) / 1000;
    if (el > 0.34) { tickOk = true; return clockBaseT + 0.34; }
    return clockBaseT + Math.max(0, el);
  }

  /* ============ 13. 消息 ============ */
  function onInit(d) {
    ACC = normAccent(d.accent);
    S.lines = buildLines(d.lines);
    S.idx = -1;
    for (var i = 0; i < S.lines.length; i++) {
      S.lines[i].scene = i + 1;
      S.lines[i].lay = layout(S.lines[i]);
    }
    lastTickT = -1; tickOk = false; S.running = false; clockBaseT = 0;
    S.t = 0; prevNow = -1; cam.snap = true; wantSnap = true; beatT = -99; beatLevel = 0;
    /* 取封面色 */
    if (d.song && typeof d.song.cover === "string" && d.song.cover) {
      try {
        var im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = function () {
          try {
            var c = document.createElement("canvas"); c.width = 24; c.height = 24;
            var g = c.getContext("2d", { willReadFrequently: true });
            g.drawImage(im, 0, 0, 24, 24);
            var px = g.getImageData(0, 0, 24, 24).data, r = 0, gg = 0, b = 0, n = 0;
            for (var k = 0; k < px.length; k += 16) { r += px[k]; gg += px[k + 1]; b += px[k + 2]; n++; }
            if (n) {
              r = Math.round(r / n); gg = Math.round(gg / n); b = Math.round(b / n);
              if (r + gg + b > 90) {
                var mx = Math.max(r, gg, b) || 1, mn = Math.min(r, gg, b);
                var sat = (mx - mn) / mx;
                if (sat < 0.35) { r = 224; gg = 196; b = 150; }
                ACC = [r, gg, b];
              }
            }
          } catch (e) {}
        };
        im.onerror = function () {};
        im.src = d.song.cover;
      } catch (e) {}
    }
  }

  window.addEventListener("message", function (e) {
    var d = e && e.data;
    if (!d || d.__c100 !== 1) return;
    try {
      if (d.type === "init") onInit(d);
      else if (d.type === "tick") onTick(d);
      else if (d.type === "beat") {
        beatT = displayTime();
        beatLevel = clamp(Number(d.level) || 0, 0, 1);
      } else if (d.type === "live") {
        liveLevel = clamp(Number(d.level) || 0, 0, 1);
        liveBass = clamp(Number(d.bass) || 0, 0, 1);
        if (typeof d.playing === "boolean" && !tickOk) S.playing = d.playing;
      }
    } catch (err) { logErr(err); }
  });

  /* ============ 14. 启动 ============ */
  function boot() {
    try {
      ensurePool();
      noiseCv = makeNoise();
      var ng = noiseCv.getContext("2d");
      noisePat = ctx.createPattern(noiseCv, "repeat");
      void ng;
      resize();
      makeDust();
      cam.eyeS = { x: 0.4, y: 0.55, z: -1.2 };
      cam.tgtS = { x: 0, y: 0.5, z: 10 };
      lookBasis();
      var raf = 0, stopped = false;
      function loop() {
        if (stopped) return;
        raf = requestAnimationFrame(loop);
        try {
          var wall = (window.performance && performance.now()) || Date.now();
          if (lastFrameWall) jsAvg = jsAvg * 0.9 + (wall - lastFrameWall) * 0.1;
          lastFrameWall = wall;
          S.js = jsAvg;
          var t = displayTime();
          render(t);
        } catch (err) { logErr(err); }
      }
      raf = requestAnimationFrame(loop);
      window.addEventListener("pagehide", function () { stopped = true; try { cancelAnimationFrame(raf); } catch (e) {} });
      document.addEventListener("visibilitychange", function () {
        /* 标签页隐藏时停 rAF，回来重启（保持页面不报错） */
        if (document.hidden) {
          stopped = true; try { cancelAnimationFrame(raf); } catch (e) {}
        } else if (stopped) {
          stopped = false; lastFrameWall = 0; raf = requestAnimationFrame(loop);
        }
      });
    } catch (e) { logErr(e); }
  }

})();
</script>
</body>
</html>
